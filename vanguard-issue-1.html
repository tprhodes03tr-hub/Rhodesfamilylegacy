<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ancestral Vanguard • Issue #1 Comic Reader | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #171236 0%, #060814 65%, #02040a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 36px;
    }
    .comic-shell {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 14px;
      padding: 10px 14px;
    }
    .brand-link {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip-btn {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
    }
    .chip-btn.gold {
      background: #d97706;
      color: #090d16;
      border-color: #fde047;
    }
    .comic-card {
      background: linear-gradient(180deg, #13182e 0%, #070b17 100%);
      border: 2px solid rgba(251, 191, 36, 0.7);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6), 0 0 32px rgba(245, 158, 11, 0.16);
      display: flex;
      flex-direction: column;
      gap: 14px;
      touch-action: pan-y;
    }
    .comic-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .comic-kicker {
      font-size: 11px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .page-counter {
      font-size: 12px;
      font-weight: 800;
      color: #fde047;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(251, 191, 36, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .panel-stage {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(251, 191, 36, 0.5);
      background: #020617;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .caption-box {
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-title {
      font-size: 19px;
      font-weight: 900;
      color: #fef08a;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .panel-dialogue {
      font-size: 15px;
      line-height: 1.65;
      color: #f8fafc;
    }
    .lore-tag {
      font-size: 12px;
      line-height: 1.5;
      color: #fde68a;
      background: rgba(120, 53, 15, 0.32);
      border-left: 3px solid #f59e0b;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .page-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-prev {
      background: #1e293b;
      border: 1px solid #fbbf24;
      color: #fde047;
    }
    .btn-speak {
      background: #0d9488;
    }
    .btn-next {
      background: #d97706;
      color: #090d16;
    }
    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="comic-shell">
    <div class="top-bar">
      <a href="index.html" class="brand-link">← Rhodes Family Legacy</a>
      <div class="top-controls">
        <button type="button" class="chip-btn" id="langToggleBtn" onclick="toggleLanguage()">🌐 EN / ES</button>
        <a href="https://payhip.com/Rhodesfamilylegacy" target="_blank" rel="noopener noreferrer" class="chip-btn gold">Full Issue on Payhip ↗</a>
      </div>
    </div>

    <div class="comic-card" id="comicCard">
      <div class="comic-header">
        <span class="comic-kicker">⚡ The Ancestral Vanguard • Issue #1 By Tommy Phillip Rhodes</span>
        <span class="page-counter" id="pageCounter">Page 1 of 4</span>
      </div>

      <div class="panel-stage">
        <canvas id="panelCanvas" width="720" height="320"></canvas>
      </div>

      <div class="caption-box">
        <h1 class="panel-title" id="panelTitle"></h1>
        <p class="panel-dialogue" id="panelDialogue"></p>
        <div class="lore-tag" id="loreTag"></div>
      </div>

      <div class="nav-row">
        <button type="button" class="page-btn btn-prev" id="prevBtn" onclick="prevPage()">◀ Prev Page</button>
        <button type="button" class="page-btn btn-speak" onclick="readCurrentPage()">🔊 Read Aloud</button>
        <button type="button" class="page-btn btn-next" id="nextBtn" onclick="nextPage()">Next Page ▶</button>
      </div>
    </div>

    <p class="footer-note">
      One Bloodline. One Family. One Universe. Flip pages with the buttons or swipe left/right.
    </p>
  </div>

  <script>
    const COMIC_PAGES = [
      {
        enTitle: "PAGE 1 • THE MARROW SIGNAL AWAKENS",
        esTitle: "PÁGINA 1 • DESPIERTA LA SEÑAL DE LA MÉDULA",
        enDialogue: "\"Across generations and worlds, the bloodline remembers,\" Marcus Prime says as golden energy pulses from the Marrow core into the night sky.",
        esDialogue: "\"A través de generaciones y mundos, el linaje recuerda\", dice Marcus Prime mientras una energía dorada pulsa desde el núcleo hacia el cielo nocturno.",
        enLore: "Vanguard Lore: One Bloodline. One Family. One Universe.",
        esLore: "Mitología Vanguard: Un Linaje. Una Familia. Un Universo.",
        theme: "gold"
      },
      {
        enTitle: "PAGE 2 • CALL OF THE VANGUARD PRIMES",
        esTitle: "PÁGINA 2 • EL LLAMADO DE LOS PRIMES VANGUARD",
        enDialogue: "Guided by ancestral memory and shared resolve, the Vanguard step forward together to protect the timeline and stand guard over what was built.",
        esDialogue: "Guiados por la memoria ancestral y una determinación compartida, los Vanguard avanzan juntos para proteger la línea del tiempo y defender lo construido.",
        enLore: "Teamwork & Legacy: Strength multiplies when the bloodline stands united.",
        esLore: "Unión y Legado: La fuerza se multiplica cuando el linaje permanece unido.",
        theme: "cyan"
      },
      {
        enTitle: "PAGE 3 • SHADOWS IN THE VOID",
        esTitle: "PÁGINA 3 • SOMBRAS EN EL VACÍO",
        enDialogue: "Dark void energy tries to twist the signal, but the Vanguard hold the line—turning ancient roots and courage into an unstoppable surge.",
        esDialogue: "La energía oscura del vacío intenta alterar la señal, pero los Vanguard mantienen la línea convirtiendo raíces antiguas y valor en un impulso imparable.",
        enLore: "Conflict & Resolve: Every challenge tests how deeply the legacy runs.",
        esLore: "Prueba y Firmeza: Cada reto pone a prueba qué tan profundo llega el legado.",
        theme: "violet"
      },
      {
        enTitle: "PAGE 4 • THE UNBROKEN VANGUARD",
        esTitle: "PÁGINA 4 • EL VANGUARD QUEBRANTABLE JAMÁS",
        enDialogue: "With the beacon blazing bright, the Vanguard lock in their formation—ready for Issue #2 and every battle ahead across the universe.",
        esDialogue: "Con el faro brillando con fuerza, los Vanguard toman su formación listos para el Número 2 y cada batalla por venir en el universo.",
        enLore: "Rhodes Family Legacy: Get Issue #1 and Issue #2 on Payhip.",
        esLore: "Legado Familiar Rhodes: Consigue el Número 1 y el Número 2 en Payhip.",
        theme: "solar"
      }
    ];

    let currentPage = 0;
    let lang = "en";
    const canvas = document.getElementById("panelCanvas");
    const ctx = canvas.getContext("2d");

    function awardComicProgress() {
      try {
        const raw = localStorage.getItem("rfl_legacy_save_v1");
        const state = raw ? JSON.parse(raw) : {};
        state.points = (typeof state.points === "number" ? state.points : 342604) + 20;
        state.hubPoints = (typeof state.hubPoints === "number" ? state.hubPoints : 61548) + 20;
        localStorage.setItem("rfl_legacy_save_v1", JSON.stringify(state));

        const wRaw = localStorage.getItem("rhodes_legacy_wallet");
        if (wRaw) {
          const w = JSON.parse(wRaw);
          w.legacyScore = (typeof w.legacyScore === "number" ? w.legacyScore : 342604) + 20;
          w.hubPoints = (typeof w.hubPoints === "number" ? w.hubPoints : 61548) + 20;
          w.updatedAt = Date.now();
          localStorage.setItem("rhodes_legacy_wallet", JSON.stringify(w));
        }
      } catch (e) {}
    }

    function drawVanguardHero(x, y, auraColor, label) {
      ctx.save();
      ctx.translate(x, y);

      const glow = ctx.createRadialGradient(0, -5, 4, 0, -5, 46);
      glow.addColorStop(0, auraColor);
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, -5, 46, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(-14, -6, 28, 34, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#8d5b4c";
      ctx.beginPath();
      ctx.arc(0, -18, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fbbf24";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, 0, -36);
      ctx.restore();
    }

    function drawComicPanel(theme) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);

      if (theme === "gold") {
        grad.addColorStop(0, "#1e1b4b");
        grad.addColorStop(1, "#78350f");
      } else if (theme === "cyan") {
        grad.addColorStop(0, "#082f49");
        grad.addColorStop(1, "#1e1b4b");
      } else if (theme === "violet") {
        grad.addColorStop(0, "#2e1065");
        grad.addColorStop(1, "#090d16");
      } else {
        grad.addColorStop(0, "#451a03");
        grad.addColorStop(1, "#0f172a");
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(251, 191, 36, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(360, 155, 88, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "#050814";
      ctx.fillRect(0, 245, canvas.width, 75);
      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 245);
      ctx.lineTo(canvas.width, 245);
      ctx.stroke();

      drawVanguardHero(210, 215, "rgba(251, 191, 36, 0.45)", "MARCUS PRIME");
      drawVanguardHero(360, 205, "rgba(56, 189, 248, 0.45)", "VANGUARD CORE");
      drawVanguardHero(510, 215, "rgba(168, 85, 247, 0.45)", "CHRONO GUARD");
    }

    function renderPage() {
      const p = COMIC_PAGES[currentPage];
      document.getElementById("pageCounter").textContent = `Page ${currentPage + 1} of ${COMIC_PAGES.length}`;
      document.getElementById("panelTitle").textContent = lang === "en" ? p.enTitle : p.esTitle;
      document.getElementById("panelDialogue").textContent = lang === "en" ? p.enDialogue : p.esDialogue;
      document.getElementById("loreTag").textContent = lang === "en" ? p.enLore : p.esLore;
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage === COMIC_PAGES.length - 1;
      drawComicPanel(p.theme);
    }

    function nextPage() {
      if (currentPage < COMIC_PAGES.length - 1) {
        currentPage += 1;
        awardComicProgress();
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage -= 1;
        renderPage();
      }
    }

    function toggleLanguage() {
      lang = lang === "en" ? "es" : "en";
      renderPage();
    }

    function readCurrentPage() {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const p = COMIC_PAGES[currentPage];
        const text = lang === "en" ? `${p.enTitle}. ${p.enDialogue}` : `${p.esTitle}. ${p.esDialogue}`;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang === "en" ? "en-US" : "es-ES";
        utter.rate = 0.96;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    let touchStartX = 0;
    const cardEl = document.getElementById("comicCard");
    cardEl.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });
    cardEl.addEventListener("touchend", (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      if (diffX < -45) nextPage();
      else if (diffX > 45) prevPage();
    }, { passive: true });

    renderPage();
  </script>
  <script src="legacy-wallet.js" defer></script>
</body>
</html>
