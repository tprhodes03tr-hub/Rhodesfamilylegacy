<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Luetta and Her Sisters in the Golden Clock • Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #12102e 0%, #050714 65%, #02040a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 36px;
    }
    .book-shell {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 14px;
      padding: 10px 14px;
    }
    .brand-link {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip-btn {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid rgba(129, 140, 248, 0.5);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
    }
    .chip-btn.gold {
      background: #d97706;
      color: #090d16;
      border-color: #fde047;
    }
    .book-card {
      background: linear-gradient(180deg, #161536 0%, #090c1c 100%);
      border: 2px solid rgba(251, 191, 36, 0.65);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 30px rgba(129, 140, 248, 0.16);
      display: flex;
      flex-direction: column;
      gap: 14px;
      touch-action: pan-y;
    }
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .book-kicker {
      font-size: 11px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .page-counter {
      font-size: 12px;
      font-weight: 800;
      color: #a5b4fc;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(129, 140, 248, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .art-stage {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(251, 191, 36, 0.45);
      background: #020617;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .story-page-box {
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scene-title {
      font-size: 19px;
      font-weight: 900;
      color: #fef08a;
    }
    .story-prose {
      font-size: 15px;
      line-height: 1.65;
      color: #f1f5f9;
    }
    .heritage-note {
      font-size: 12px;
      line-height: 1.5;
      color: #c7d2fe;
      background: rgba(49, 46, 129, 0.32);
      border-left: 3px solid #818cf8;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .page-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-prev {
      background: #1e293b;
      border: 1px solid #818cf8;
      color: #c7d2fe;
    }
    .btn-speak {
      background: #0d9488;
    }
    .btn-next {
      background: #d97706;
      color: #090d16;
    }
    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="book-shell">
    <div class="top-bar">
      <a href="index.html" class="brand-link">← Rhodes Family Legacy</a>
      <div class="top-controls">
        <button type="button" class="chip-btn" id="langToggleBtn" onclick="toggleLanguage()">🌐 EN / ES</button>
        <a href="https://payhip.com/Rhodesfamilylegacy" target="_blank" rel="noopener noreferrer" class="chip-btn gold">Buy on Payhip ↗</a>
      </div>
    </div>

    <div class="book-card" id="bookCard">
      <div class="book-header">
        <span class="book-kicker">🕰️ Illustrated Children's Book • By Tommy Phillip Rhodes</span>
        <span class="page-counter" id="pageCounter">Page 1 of 5</span>
      </div>

      <div class="art-stage">
        <canvas id="sceneCanvas" width="720" height="320"></canvas>
      </div>

      <div class="story-page-box">
        <h1 class="scene-title" id="sceneTitle"></h1>
        <p class="story-prose" id="sceneProse"></p>
        <div class="heritage-note" id="heritageNote"></div>
      </div>

      <div class="nav-row">
        <button type="button" class="page-btn btn-prev" id="prevBtn" onclick="prevPage()">◀ Prev Page</button>
        <button type="button" class="page-btn btn-speak" onclick="readCurrentPage()">🔊 Read Aloud</button>
        <button type="button" class="page-btn btn-next" id="nextBtn" onclick="nextPage()">Next Page ▶</button>
      </div>
    </div>

    <p class="footer-note">
      Tip: Tap <strong>Next Page ▶</strong> or <strong>◀ Prev Page</strong>, or swipe left/right on the book card to flip pages.
    </p>
  </div>

  <script>
    const PAGES = [
      {
        enTitle: "1. Three Sisters & The Golden Clock",
        esTitle: "1. Tres Hermanas y el Reloj Dorado",
        enProse: "Little Luetta, Inez, and Tweet Marie gather in the morning yard where a warm golden clock chimes softly. Each sister brings a sharp eye and a kind heart as they set out together.",
        esProse: "La pequeña Luetta, Inez y Tweet Marie se reúnen en el patio de la mañana donde suena suavemente un reloj dorado. Cada hermana aporta una mirada atenta y un corazón bondadoso al salir juntas.",
        enNote: "Sisterhood & Heritage: Inspired by family memory and time-slip stories for young readers.",
        esNote: "Hermandad y Legado: Inspirado en la memoria familiar y en historias de viajes en el tiempo para jóvenes lectores.",
        scene: "morning"
      },
      {
        enTitle: "2. Searching the Bushes for Clock Gears",
        esTitle: "2. Buscando Engranajes Entre los Arbustos",
        enProse: "Where golden leaves rustle along the garden path, the sisters search carefully through the bushes—finding shiny clock pieces tucked away like hidden treasures.",
        esProse: "Donde susurran las hojas doradas a lo largo del sendero, las hermanas buscan con cuidado entre los arbustos y encuentran piezas brillantes del reloj escondidas como tesoros.",
        enNote: "Curiosity & Teamwork: Patient searching helps the sisters piece the story together.",
        esNote: "Curiosidad y Equipo: Buscar con paciencia ayuda a las hermanas a unir la historia.",
        scene: "garden"
      },
      {
        enTitle: "3. Beneath the Golden Tree of Time",
        esTitle: "3. Bajo el Árbol Dorado del Tiempo",
        enProse: "With their clock pieces gathered, Luetta, Inez, and Tweet Marie stand beneath the glowing Golden Tree as soft light shimmers across the branches.",
        esProse: "Con las piezas del reloj reunidas, Luetta, Inez y Tweet Marie se detienen bajo el Árbol Dorado brillante mientras una luz suave resplandece entre las ramas.",
        enNote: "Ancestral Anchor: The Golden Tree connects past memories with the present day.",
        esNote: "Ancla Ancestral: El Árbol Dorado conecta los recuerdos del pasado con el día de hoy.",
        scene: "tree"
      },
      {
        enTitle: "4. Stepping Across the Years",
        esTitle: "4. Cruzando a Través de los Años",
        enProse: "When the chimes ring clear, the sisters step into a new era—seeing how earlier generations worked, cared for family, and kept their promises.",
        esProse: "Cuando suenan las campanadas con claridad, las hermanas entran en una nueva época y ven cómo las generaciones anteriores trabajaron, cuidaron a su familia y cumplieron sus promesas.",
        enNote: "Generational Memory: Looking back helps young readers appreciate what came before.",
        esNote: "Memoria Generacional: Mirar atrás ayuda a los jóvenes lectores a valorar lo que vino antes.",
        scene: "warp"
      },
      {
        enTitle: "5. Bringing the Golden Light Home",
        esTitle: "5. Llevando la Luz Dorada a Casa",
        enProse: "Back home under evening stars, Luetta and her sisters carry every lesson forward—knowing family love shines across every season and every year.",
        esProse: "De vuelta en casa bajo las estrellas de la noche, Luetta y sus hermanas llevan adelante cada enseñanza, sabiendo que el amor familiar brilla en cada estación y cada año.",
        enNote: "Rhodes Family Legacy: Stories passed down keep every generation connected.",
        esNote: "Legado Familiar Rhodes: Las historias transmitidas mantienen unida a cada generación.",
        scene: "stars"
      }
    ];

    let currentPage = 0;
    let lang = "en";
    const canvas = document.getElementById("sceneCanvas");
    const ctx = canvas.getContext("2d");

    function awardBookProgress() {
      try {
        const raw = localStorage.getItem("rfl_legacy_save_v1");
        const state = raw ? JSON.parse(raw) : {};
        state.points = (typeof state.points === "number" ? state.points : 342604) + 15;
        state.hubPoints = (typeof state.hubPoints === "number" ? state.hubPoints : 61548) + 15;
        localStorage.setItem("rfl_legacy_save_v1", JSON.stringify(state));

        const wRaw = localStorage.getItem("rhodes_legacy_wallet");
        if (wRaw) {
          const w = JSON.parse(wRaw);
          w.legacyScore = (typeof w.legacyScore === "number" ? w.legacyScore : 342604) + 15;
          w.hubPoints = (typeof w.hubPoints === "number" ? w.hubPoints : 61548) + 15;
          w.updatedAt = Date.now();
          localStorage.setItem("rhodes_legacy_wallet", JSON.stringify(w));
        }
      } catch (e) {}
    }

    function drawSister(x, y, dressColor, name) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath();
      ctx.ellipse(0, 38, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-5, 18); ctx.lineTo(-6, 36);
      ctx.moveTo(5, 18); ctx.lineTo(6, 36);
      ctx.stroke();

      ctx.fillStyle = dressColor;
      ctx.beginPath();
      ctx.moveTo(-9, -4); ctx.lineTo(9, -4); ctx.lineTo(14, 20); ctx.lineTo(-14, 20);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#8d5b4c";
      ctx.beginPath();
      ctx.arc(0, -15, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(0, -19, 10, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = "#fde68a";
      ctx.fillRect(-10, -21, 20, 3);

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(-3.5, -15, 1.5, 0, Math.PI * 2);
      ctx.arc(3.5, -15, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fef08a";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name, 0, -34);
      ctx.restore();
    }

    function drawGoldenClockEmblem(x, y, radius) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 5;
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#fef08a";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0, -radius * 0.58);
      ctx.moveTo(0, 0); ctx.lineTo(radius * 0.42, 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawIllustration(sceneType) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const sky = ctx.createLinearGradient(0, 0, 0, 225);

      if (sceneType === "morning") {
        sky.addColorStop(0, "#1e1b4b");
        sky.addColorStop(1, "#93c5fd");
      } else if (sceneType === "garden") {
        sky.addColorStop(0, "#0f766e");
        sky.addColorStop(1, "#fde68a");
      } else if (sceneType === "tree") {
        sky.addColorStop(0, "#312e81");
        sky.addColorStop(1, "#fef08a");
      } else if (sceneType === "warp") {
        sky.addColorStop(0, "#4c1d95");
        sky.addColorStop(1, "#38bdf8");
      } else {
        sky.addColorStop(0, "#050814");
        sky.addColorStop(1, "#1e1b4b");
      }

      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, 225);

      if (sceneType === "stars" || sceneType === "warp") {
        ctx.fillStyle = "#fef08a";
        for (let i = 0; i < 24; i++) {
          ctx.beginPath();
          ctx.arc(40 + ((i * 59) % 640), 24 + ((i * 37) % 130), 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawGoldenClockEmblem(595, 72, 34);

      const ground = ctx.createLinearGradient(0, 215, 0, 320);
      ground.addColorStop(0, sceneType === "stars" ? "#1e1b4b" : "#15803d");
      ground.addColorStop(1, "#052e16");
      ctx.fillStyle = ground;
      ctx.fillRect(0, 215, canvas.width, 105);

      if (sceneType === "tree" || sceneType === "warp") {
        ctx.fillStyle = "#78350f";
        ctx.fillRect(112, 140, 16, 80);
        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        ctx.arc(120, 120, 44, 0, Math.PI * 2);
        ctx.fill();
      }

      if (sceneType === "garden") {
        [135, 520].forEach(bx => {
          ctx.fillStyle = "#047857";
          ctx.beginPath();
          ctx.arc(bx, 206, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.arc(bx, 206, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      drawSister(250, 225, "#0284c7", "Luetta");
      drawSister(335, 225, "#d97706", "Inez");
      drawSister(420, 225, "#db2777", "Tweet Marie");
    }

    function renderPage() {
      const p = PAGES[currentPage];
      document.getElementById("pageCounter").textContent = `Page ${currentPage + 1} of ${PAGES.length}`;
      document.getElementById("sceneTitle").textContent = lang === "en" ? p.enTitle : p.esTitle;
      document.getElementById("sceneProse").textContent = lang === "en" ? p.enProse : p.esProse;
      document.getElementById("heritageNote").textContent = lang === "en" ? p.enNote : p.esNote;
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage === PAGES.length - 1;
      drawIllustration(p.scene);
    }

    function nextPage() {
      if (currentPage < PAGES.length - 1) {
        currentPage += 1;
        awardBookProgress();
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage -= 1;
        renderPage();
      }
    }

    function toggleLanguage() {
      lang = lang === "en" ? "es" : "en";
      renderPage();
    }

    function readCurrentPage() {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const p = PAGES[currentPage];
        const text = lang === "en" ? `${p.enTitle}. ${p.enProse}` : `${p.esTitle}. ${p.esProse}`;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang === "en" ? "en-US" : "es-ES";
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    let touchStartX = 0;
    const cardEl = document.getElementById("bookCard");
    cardEl.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });
    cardEl.addEventListener("touchend", (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      if (diffX < -45) nextPage();
      else if (diffX > 45) prevPage();
    }, { passive: true });

    renderPage();
  </script>
  <script src="legacy-wallet.js" defer></script>
</body>
</html>
