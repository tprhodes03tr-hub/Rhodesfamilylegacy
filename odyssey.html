<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Legacy • Space Odyssey: Orion Sector</title>
    <style>
        :root {
            --bg-dark: #020408;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --hud-blue: #00f3ff;
            --alert-red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #0a1128 0%, #020408 100%);
        }

        /* Top HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-box {
            background: rgba(5, 10, 20, 0.8);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .hud-box span {
            color: var(--gold);
            font-weight: bold;
        }

        /* Control Instructions Footer */
        .hud-footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 10, 20, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #a0a0a0;
            pointer-events: none;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 20, 0.95);
            border: 2px solid var(--alert-red);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
            display: none;
        }

        #game-over h2 {
            color: var(--alert-red);
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        #game-over p {
            color: #fff;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--gold-light);
            box-shadow: 0 0 15px var(--gold);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud-overlay">
            <div class="hud-box">SHIELD: <span id="shield-val">100</span>% | HULL: <span id="hull-val">100</span>%</div>
            <div class="hud-box">SECTOR SCORE: <span id="score-val">0</span></div>
            <div class="hud-box"><button class="btn" style="padding:4px 10px; font-size:0.75rem;" onclick="location.href='globe-nexus.html'">Return to Globe</button></div>
        </div>

        <canvas id="spaceCanvas"></canvas>

        <div class="hud-footer">
            CONTROLS: Use Mouse / Touch to Pilot Flagship • Click or Tap to Fire Quantum Phasers
        </div>

        <div id="game-over">
            <h2>HULL BREACH DETECTED</h2>
            <p>Your flagship was overwhelmed by Syndicate forces.</p>
            <button class="btn" onclick="restartGame()">Re-Engage Warp</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let score = 0;
        let shield = 100;
        let hull = 100;
        let isGameOver = false;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 60,
            height: 80,
            speed: 5,
            targetX: canvas.width / 2,
            targetY: canvas.height - 120
        };

        let stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 3 + 0.5
            });
        }

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let explosions = [];

        // Input Handling (Mouse & Touch)
        window.addEventListener('mousemove', (e) => {
            player.targetX = e.clientX;
            player.targetY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            player.targetX = e.touches[0].clientX;
            player.targetY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('click', () => {
            if (isGameOver) return;
            // Fire twin quantum phasers from saucer section
            bullets.push({ x: player.x - 15, y: player.y - 30, speedY: -12, radius: 4 });
            bullets.push({ x: player.x + 15, y: player.y - 30, speedY: -12, radius: 4 });
        });

        function spawnEnemy() {
            if (isGameOver) return;
            enemies.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: -60,
                width: 55,
                height: 50,
                speedY: Math.random() * 1.5 + 1.2,
                health: 3
            });
        }
        setInterval(spawnEnemy, 1200);

        function update() {
            if (isGameOver) return;

            // Smooth interpolation toward target position
            player.x += (player.targetX - player.x) * 0.1;
            player.y += (player.targetY - player.y) * 0.1;

            // Clamp inside screen bounds
            player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
            player.y = Math.max(60, Math.min(canvas.height - 60, player.y));

            // Update Starfield Warp
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            // Update Bullets
            bullets.forEach((b, index) => {
                b.y += b.speedY;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Update Enemies
            enemies.forEach((en, eIndex) => {
                en.y += en.speedY;

                // Enemy firing behavior
                if (Math.random() < 0.02) {
                    enemyBullets.push({ x: en.x, y: en.y + 20, speedY: 5 });
                }

                // Check collision with player bullets
                bullets.forEach((b, bIndex) => {
                    const dist = Math.hypot(b.x - en.x, b.y - en.y);
                    if (dist < 30) {
                        en.health--;
                        bullets.splice(bIndex, 1);
                        if (en.health <= 0) {
                            enemies.splice(eIndex, 1);
                            score += 150;
                            document.getElementById('score-val').textContent = score;
                            createExplosion(en.x, en.y);
                        }
                    }
                });

                // Check collision with player flagship
                const playerDist = Math.hypot(player.x - en.x, player.y - en.y);
                if (playerDist < 45) {
                    enemies.splice(eIndex, 1);
                    shield -= 25;
                    if (shield < 0) {
                        hull += shield;
                        shield = 0;
                    }
                    updateHUD();
                    createExplosion(player.x, player.y);
                    if (hull <= 0) triggerGameOver();
                }

                if (en.y > canvas.height + 50) enemies.splice(eIndex, 1);
            });

            // Update Enemy Bullets
            enemyBullets.forEach((eb, ebIndex) => {
                eb.y += eb.speedY;
                const pDist = Math.hypot(eb.x - player.x, eb.y - player.y);
                if (pDist < 25) {
                    enemyBullets.splice(ebIndex, 1);
                    shield -= 15;
                    if (shield < 0) {
                        hull += shield;
                        shield = 0;
                    }
                    updateHUD();
                    if (hull <= 0) triggerGameOver();
                }
                if (eb.y > canvas.height) enemyBullets.splice(ebIndex, 1);
            });
        }

        function createExplosion(x, y) {
            explosions.push({ x: x, y: y, radius: 10, alpha: 1 });
        }

        function updateHUD() {
            document.getElementById('shield-val').textContent = Math.max(0, shield);
            document.getElementById('hull-val').textContent = Math.max(0, hull);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            shield = 100;
            hull = 100;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            document.getElementById('score-val').textContent = score;
            document.getElementById('game-over').style.display = 'none';
            updateHUD();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.7 + 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;

            // --- DRAW DETAILED STARFLEET FLAGSHIP (USS Enterprise / Voyager Style) ---
            ctx.save();
            ctx.translate(player.x, player.y);

            // Engine Warp Nacelle Glow Trails
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.fillRect(-22, 25, 6, 25);
            ctx.fillRect(16, 25, 6, 25);

            // Secondary Hull (Engineering Section)
            ctx.fillStyle = '#c0cbdc';
            ctx.beginPath();
            ctx.ellipse(0, 10, 10, 22, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pylon Connectors
            ctx.strokeStyle = '#8a9ab0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-8, 5); ctx.lineTo(-20, 20);
            ctx.moveTo(8, 5); ctx.lineTo(20, 20);
            ctx.stroke();

            // Warp Nacelles
            ctx.fillStyle = '#e6edf5';
            ctx.fillRect(-26, -5, 8, 45);
            ctx.fillRect(18, -5, 8, 45);

            // Primary Saucer Section (Circular Command Hull)
            ctx.fillStyle = '#d4e0f0';
            ctx.beginPath();
            ctx.ellipse(0, -15, 28, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // Deflector Dish & Bridge Accent
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(0, -18, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Draw Bullets (Quantum Phasers)
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f3ff';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Enemies (Klingon / Alboris Syndicate Warbirds)
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff3333';
            enemies.forEach(en => {
                ctx.save();
                ctx.translate(en.x, en.y);
                ctx.fillStyle = '#801111';
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 2;

                // Bird-of-Prey Winged Hull
                ctx.beginPath();
                ctx.moveTo(0, 25);
                ctx.lineTo(-30, -15);
                ctx.lineTo(-10, -5);
                ctx.lineTo(0, -25);
                ctx.lineTo(10, -5);
                ctx.lineTo(30, -15);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            });

            // Draw Enemy Fire
            ctx.fillStyle = '#ff3333';
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.rect(eb.x - 2, eb.y, 4, 12);
                ctx.fill();
            });

            // Draw Explosions
            explosions.forEach((ex, index) => {
                ctx.fillStyle = `rgba(255, 165, 0, ${ex.alpha})`;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                ctx.fill();
                ex.radius += 1.5;
                ex.alpha -= 0.05;
                if (ex.alpha <= 0) explosions.splice(index, 1);
            });

            ctx.shadowBlur = 0; // Reset shadow
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
