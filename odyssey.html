<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy • Vanguard Space Odyssey</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
    }
    .game-container {
      width: 100%;
      max-width: 480px;
      background: #0b0c10;
      border: 2px solid #d4af37;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.25);
      text-align: center;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.7rem;
      color: #38bdf8;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #020617;
      border: 2px solid #d4af37;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }
    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .game-btn {
      background-color: #1f2833;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      text-transform: uppercase;
      text-align: center;
    }
    .game-btn:hover, .game-btn:active {
      background-color: #d4af37;
      color: #0b0c10;
    }
    .game-btn.torpedo {
      background-color: #1e3a8a;
      border-color: #60a5fa;
      color: #f8fafc;
    }
    .game-btn.warp {
      background-color: #362a05;
      border-color: #d4af37;
      color: #fef08a;
    }
    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .back-link:hover { color: #d4af37; }
  </style>
</head>
<body>

  <div class="game-container">
    <div style="font-size: 10px; font-weight: bold; color: #d4af37; letter-spacing: 2px; margin-bottom: 4px;" id="mission-status">
      VANGUARD FLEET • ORBITAL DEPARTURE
    </div>

    <div class="stats-bar" style="border-color: #d4af37; color: #d4af37;">
      <span>🛡️ Shield: <strong id="stat-shield" style="color: #60a5fa;">100%</strong></span>
      <span>⚡ Hull: <strong id="stat-hull" style="color: #10b981;">100%</strong></span>
      <span>✨ Score: <strong id="stat-score" style="color: #f59e0b;">0</strong></span>
    </div>

    <canvas id="odysseyCanvas" width="400" height="500"></canvas>

    <div class="control-grid">
      <button class="game-btn torpedo" onclick="fireQuadTorpedoes()">🚀 Quad Torpedoes (<span id="torpedo-count">3</span>)</button>
      <button class="game-btn warp" onclick="engageWarpDrive()">🌌 Vanguard Warp</button>
    </div>
    
    <div class="control-grid" style="grid-template-columns: 1fr;">
      <button class="game-btn" onclick="returnToGlobe()">← Return to Command Deck</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'laser') {
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'torpedo') {
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'collect') {
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(1160, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'hit') {
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'warp') {
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 1.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
          osc.start(now); osc.stop(now + 1.2);
        }
      } catch(e){}
    }

    const canvas = document.getElementById('odysseyCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 200, y: 420, width: 44, height: 44 };
    let shield = 100;
    let hull = 100;
    let score = 0;
    let torpedoes = 3;
    let isWarping = false;
    
    let launchSequenceTimer = 300; 
    let earthSize = 220;
    let earthY = -50;

    let enemies = [];
    let projectiles = [];
    let orbs = [];
    let stars = [];
    let shieldPulse = 0;

    for (let i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 2 + 1 });
    }

    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.touches[0].clientX - rect.left;
    }, { passive: true });

    canvas.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });

    setInterval(() => {
      if (!isWarping && launchSequenceTimer <= 0) {
        projectiles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, isTorpedo: false });
        playSound('laser');
      }
    }, 350);

    function fireQuadTorpedoes() {
      if (torpedoes <= 0 || isWarping || launchSequenceTimer > 0) return;
      torpedoes--;
      document.getElementById('torpedo-count').innerText = torpedoes;
      playSound('torpedo');
      
      let offsets = [-30, -10, 10, 30];
      offsets.forEach(off => {
        projectiles.push({ x: player.x + off, y: player.y - 15, vx: off * 0.05, vy: -10, isTorpedo: true });
      });
    }

    function engageWarpDrive() {
      if (isWarping) return;
      isWarping = true;
      playSound('warp');
      setTimeout(() => {
        isWarping = false;
        score += 500;
        updateHUD();
      }, 1500);
    }

    function updateHUD() {
      document.getElementById('stat-shield').innerText = Math.max(0, Math.floor(shield)) + '%';
      document.getElementById('stat-hull').innerText = Math.max(0, Math.floor(hull)) + '%';
      document.getElementById('stat-score').innerText = score;
      document.getElementById('torpedo-count').innerText = torpedoes;
    }

    function returnToGlobe() {
      window.location.href = 'index.html';
    }

    function loop() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let speedMult = isWarping ? 15 : (launchSequenceTimer > 0 ? 4 : 1);

      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        s.y += s.speed * speedMult;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillRect(s.x, s.y, s.size, s.size * (isWarping || launchSequenceTimer > 0 ? 3 : 1));
      });

      if (launchSequenceTimer > 0) {
        launchSequenceTimer--;
        earthSize -= 0.35;
        earthY += 0.2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(canvas.width / 2, earthY, earthSize, 0, Math.PI * 2);
        ctx.fillStyle = '#1e3a8a';
        ctx.fill();
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#d4af37';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('LEAVING EARTH ORBIT • VANGUARD DEEP SPACE', canvas.width / 2, 60);
        ctx.textAlign = 'left';

        if (launchSequenceTimer <= 0) {
          document.getElementById('mission-status').innerText = 'VANGUARD FLEET • ALBOR SYNDICATE INCURSION';
        }
      } else if (!isWarping) {
        if (Math.random() < 0.035 && enemies.length < 5) {
          enemies.push({ x: Math.random() * (canvas.width - 60) + 30, y: -30, size: 32, hp: 2 });
        }

        projectiles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          ctx.fillStyle = p.isTorpedo ? '#f59e0b' : '#d4af37';
          ctx.fillRect(p.x - 3, p.y - 8, p.isTorpedo ? 6 : 4, p.isTorpedo ? 16 : 12);

          enemies.forEach((e, eIdx) => {
            let dist = Math.hypot(p.x - e.x, p.y - e.y);
            if (dist < e.size) {
              e.hp -= p.isTorpedo ? 3 : 1;
              projectiles.splice(idx, 1);
              if (e.hp <= 0) {
                if (Math.random() < 0.65) {
                  orbs.push({ x: e.x, y: e.y, vy: 2.0 });
                }
                enemies.splice(eIdx, 1);
                score += 100;
                updateHUD();
              }
            }
          });

          if (p.y < 0) projectiles.splice(idx, 1);
        });

        orbs.forEach((o, idx) => {
          o.y += o.vy;
          ctx.fillStyle = '#f59e0b';
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(o.x, o.y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          let dist = Math.hypot(player.x - o.x, player.y - o.y);
          if (dist < 35) {
            playSound('collect');
            torpedoes++;
            updateHUD();
            orbs.splice(idx, 1);
          }
          if (o.y > canvas.height) orbs.splice(idx, 1);
        });

        // DRAW ALBOR SYNDICATE WARSHIPS (Angular, Brutalist, Red Pulse)
        enemies.forEach((e, idx) => {
          e.y += 2.2;
          ctx.save();
          ctx.translate(e.x, e.y);
          
          ctx.fillStyle = '#dc2626';
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(0, e.size);
          ctx.lineTo(-e.size*0.8, -e.size*0.6);
          ctx.lineTo(0, -e.size*0.3);
          ctx.lineTo(e.size*0.8, -e.size*0.6);
          ctx.closePath();
          ctx.fill();
          
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-6, -8, 12, 16);
          ctx.shadowBlur = 0;
          ctx.restore();

          let dist = Math.hypot(player.x - e.x, player.y - e.y);
          if (dist < 35) {
            playSound('hit');
            enemies.splice(idx, 1);
            if (shield > 0) {
              shield -= 25;
              shieldPulse = 15;
            } else {
              hull -= 20;
            }
            updateHUD();
          }

          if (e.y > canvas.height + 40) enemies.splice(idx, 1);
        });
      }

      // DRAW VANGUARD DEFENSE CRUISER (Sleek Golden-Helix / Ancestral Hull)
      ctx.save();
      ctx.translate(player.x, player.y);
      
      if (shield > 0 && shieldPulse > 0) {
        shieldPulse--;
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Main Golden-Helix Hull
      ctx.fillStyle = '#d4af37';
      ctx.shadowColor = '#d4af37';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.lineTo(-18, 14);
      ctx.lineTo(-6, 22);
      ctx.lineTo(0, 16);
      ctx.lineTo(6, 22);
      ctx.lineTo(18, 14);
      ctx.closePath();
      ctx.fill();

      // Core Command Cockpit (Cyan Glow)
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.ellipse(0, -4, 5, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Vanguard Twin Ion Engines (Amber Thrusters)
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(-12, 22, 6, 12 + Math.random() * 6);
      ctx.fillRect(6, 22, 6, 12 + Math.random() * 6);
      ctx.shadowBlur = 0;

      ctx.restore();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
