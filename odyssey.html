<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Ancestral Vanguard: Bloodline Odyssey</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 900px;
      height: 100vh;
      max-height: 560px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* UI Overlays */
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      z-index: 10;
    }
    .bar-container {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .bar {
      height: 10px;
      width: 120px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      background: #ef4444;
      transition: width 0.15s ease;
    }
    .energy-fill {
      background: #38bdf8;
    }
    /* On-Screen Mobile Controls */
    #touch-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
    }
    .d-pad, .action-buttons {
      display: flex;
      gap: 10px;
    }
    .touch-btn {
      width: 58px;
      height: 58px;
      background: rgba(30, 41, 59, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .touch-btn:active {
      background: rgba(245, 158, 11, 0.8);
      border-color: #f59e0b;
    }
    .btn-act {
      background: rgba(220, 38, 38, 0.75);
    }
    .btn-special {
      background: rgba(14, 165, 233, 0.75);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="bar-container">
        <div>WARRIOR HP</div>
        <div class="bar"><div id="hp-bar" class="bar-fill"></div></div>
      </div>
      <div id="stage-title" style="color: #f59e0b; font-size: 16px; align-self: center;">THE ANCESTRAL OVERWORLD</div>
      <div class="bar-container">
        <div>DNA ENERGY</div>
        <div class="bar"><div id="energy-bar" class="bar-fill energy-fill"></div></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="560"></canvas>

    <div id="touch-controls">
      <div class="d-pad">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
      </div>
      <div class="action-buttons">
        <div class="touch-btn btn-act" id="btn-attack">⚔️</div>
        <div class="touch-btn btn-special" id="btn-burst">⚡</div>
        <div class="touch-btn" id="btn-jump">⤴</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpBar = document.getElementById('hp-bar');
    const energyBar = document.getElementById('energy-bar');
    const stageTitle = document.getElementById('stage-title');

    // GAME STATES: 'OVERWORLD', 'PLATFORMER', 'ARENA'
    let state = 'OVERWORLD';

    const keys = {
      left: false, right: false, up: false, down: false,
      jump: false, attack: false, burst: false
    };

    // Particles system
    let particles = [];
    function spawnParticles(x, y, color, count = 8) {
      for(let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 2,
          color: color,
          life: 25
        });
      }
    }

    // Hero Object
    const player = {
      x: 100, y: 280,
      vx: 0, vy: 0,
      width: 28, height: 44,
      speed: 4.5,
      hp: 100, maxHp: 100,
      energy: 100, maxEnergy: 100,
      isGrounded: false,
      attacking: false,
      attackTimer: 0,
      attackBox: { x: 0, y: 0, width: 40, height: 40 }
    };

    // Enemies Array
    let enemies = [];

    // Overworld Landmarks
    const landmarks = [
      { name: "Balkans Sanctuary", x: 140, y: 260, r: 28, mode: 'PLATFORMER', visited: false, color: '#f59e0b' },
      { name: "Mediterranean Gate", x: 380, y: 180, r: 28, mode: 'ARENA', visited: false, color: '#06b6d4' },
      { name: "West Coast Fortress", x: 580, y: 340, r: 28, mode: 'PLATFORMER', visited: false, color: '#10b981' },
      { name: "Delta Domain", x: 760, y: 220, r: 32, mode: 'ARENA', visited: false, color: '#8b5cf6' }
    ];

    // Initialize Game Phase
    function enterMode(newMode, titleText) {
      state = newMode;
      stageTitle.innerText = titleText;
      player.vx = 0; player.vy = 0;
      enemies = [];
      particles = [];

      if (state === 'PLATFORMER') {
        player.x = 50; player.y = 380;
      } else if (state === 'ARENA') {
        player.x = 450; player.y = 380;
        // Spawn Wave of Arena Guardians
        for (let i = 0; i < 4; i++) {
          enemies.push({
            x: 150 + i * 180, y: 380, width: 26, height: 42,
            vx: 1.5, hp: 40, color: '#ef4444'
          });
        }
      } else if (state === 'OVERWORLD') {
        player.x = 100; player.y = 280;
      }
    }

    // Input Listeners
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
      if (e.code === 'Space') keys.jump = true;
      if (e.code === 'KeyJ') triggerAttack();
      if (e.code === 'KeyK') triggerBurst();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
      if (e.code === 'Space') keys.jump = false;
    });

    // Touch Button Wiring
    function bindTouch(id, keyName, isAction = false, callback = null) {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (isAction && callback) callback();
        else keys[keyName] = true;
      });
      btn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        if (!isAction) keys[keyName] = false;
      });
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-up', 'up');
    bindTouch('btn-down', 'down');
    bindTouch('btn-jump', 'jump');
    bindTouch('btn-attack', null, true, triggerAttack);
    bindTouch('btn-burst', null, true, triggerBurst);

    function triggerAttack() {
      if (player.attackTimer <= 0) {
        player.attacking = true;
        player.attackTimer = 14;
        spawnParticles(player.x + 20, player.y, '#f59e0b', 5);
      }
    }

    function triggerBurst() {
      if (player.energy >= 30) {
        player.energy -= 30;
        spawnParticles(player.x, player.y, '#38bdf8', 25);
        // Damage all enemies in blast radius
        enemies.forEach(e => {
          let dist = Math.hypot(e.x - player.x, e.y - player.y);
          if (dist < 180) e.hp -= 35;
        });
      }
    }

    // MAIN UPDATE LOOP
    function update() {
      // Regenerate Energy slowly
      if (player.energy < player.maxEnergy) player.energy += 0.15;
      energyBar.style.width = `${(player.energy / player.maxEnergy) * 100}%`;
      hpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;

      if (player.attackTimer > 0) {
        player.attackTimer--;
        if (player.attackTimer === 0) player.attacking = false;
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // STATE 1: OVERWORLD MAP
      if (state === 'OVERWORLD') {
        if (keys.left) player.x -= player.speed;
        if (keys.right) player.x += player.speed;
        if (keys.up) player.y -= player.speed;
        if (keys.down) player.y += player.speed;

        // Check Landmark Proximity
        landmarks.forEach(lm => {
          let d = Math.hypot(player.x - lm.x, player.y - lm.y);
          if (d < lm.r) {
            enterMode(lm.mode, `${lm.name.toUpperCase()} - ${lm.mode}`);
          }
        });
      }

      // STATE 2: PLATFORMER EXPLORATION
      else if (state === 'PLATFORMER') {
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx = 0;

        if (keys.jump && player.isGrounded) {
          player.vy = -12;
          player.isGrounded = false;
        }

        player.vy += 0.6; // Gravity
        player.x += player.vx;
        player.y += player.vy;

        // Floor collision
        if (player.y > 420) {
          player.y = 420;
          player.vy = 0;
          player.isGrounded = true;
        }

        // Return to map when reaching the right edge
        if (player.x > 860) {
          enterMode('OVERWORLD', 'THE ANCESTRAL OVERWORLD');
        }
      }

      // STATE 3: COMBAT ARENA
      else if (state === 'ARENA') {
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx = 0;

        if (keys.jump && player.isGrounded) {
          player.vy = -11;
          player.isGrounded = false;
        }

        player.vy += 0.6;
        player.x += player.vx;
        player.y += player.vy;

        if (player.y > 420) {
          player.y = 420;
          player.vy = 0;
          player.isGrounded = true;
        }

        // Arena boundary
        if (player.x < 30) player.x = 30;
        if (player.x > 840) player.x = 840;

        // Enemy AI & Hitboxes
        enemies.forEach((enemy, idx) => {
          if (enemy.x < player.x) enemy.x += enemy.vx;
          else enemy.x -= enemy.vx;

          // Player Attacking Enemy
          if (player.attacking && Math.abs(player.x - enemy.x) < 45 && Math.abs(player.y - enemy.y) < 30) {
            enemy.hp -= 2;
            spawnParticles(enemy.x, enemy.y, '#f59e0b', 2);
          }

          if (enemy.hp <= 0) {
            spawnParticles(enemy.x, enemy.y, '#ef4444', 12);
            enemies.splice(idx, 1);
          }
        });

        // Arena Cleared
        if (enemies.length === 0) {
          setTimeout(() => {
            enterMode('OVERWORLD', 'VICTORY - RETURNING TO SAGA MAP');
          }, 1200);
        }
      }
    }

    // MAIN RENDER LOOP
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. DRAW OVERWORLD
      if (state === 'OVERWORLD') {
        // Map Background
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Continental Trail Line
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        landmarks.forEach((lm, i) => {
          if (i === 0) ctx.moveTo(lm.x, lm.y);
          else ctx.lineTo(lm.x, lm.y);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Landmarks
        landmarks.forEach(lm => {
          ctx.save();
          ctx.shadowColor = lm.color;
          ctx.shadowBlur = 15;
          ctx.fillStyle = lm.color;
          ctx.beginPath();
          ctx.arc(lm.x, lm.y, lm.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = '#ffffff';
          ctx.font = '12px Segoe UI';
          ctx.textAlign = 'center';
          ctx.fillText(lm.name, lm.x, lm.y + lm.r + 16);
        });

        // Player Icon (Glowing Orb)
        ctx.save();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 2. DRAW PLATFORMER & ARENA
      else {
        // Parallax Background Sky
        ctx.fillStyle = state === 'ARENA' ? '#180808' : '#041d2d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ground Floor
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 464, canvas.width, 96);
        ctx.fillStyle = state === 'ARENA' ? '#991b1b' : '#0284c7';
        ctx.fillRect(0, 464, canvas.width, 4);

        // Draw Player Warrior
        ctx.save();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(player.x - player.width / 2, player.y - player.height, player.width, player.height);
        
        // Attack Aura / Weapon Swing
        if (player.attacking) {
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(player.x + 18, player.y - player.height / 2, 32, -Math.PI / 2, Math.PI / 2);
          ctx.stroke();
        }
        ctx.restore();

        // Draw Enemies
        enemies.forEach(e => {
          ctx.save();
          ctx.shadowColor = e.color;
          ctx.shadowBlur = 10;
          ctx.fillStyle = e.color;
          ctx.fillRect(e.x - e.width / 2, e.y - e.height, e.width, e.height);
          ctx.restore();
        });
      }

      // Draw Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Launch
    gameLoop();
  </script>
</body>
</html>
