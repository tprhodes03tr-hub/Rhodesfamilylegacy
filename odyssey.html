<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy • Vanguard Space Odyssey</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
    }
    .game-container {
      width: 100%;
      max-width: 480px;
      background: #0b0c10;
      border: 2px solid #d4af37;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.25);
      text-align: center;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.65rem;
      color: #38bdf8;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #020617;
      border: 2px solid #d4af37;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }
    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .game-btn {
      background-color: #1f2833;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      text-transform: uppercase;
      text-align: center;
    }
    .game-btn:hover, .game-btn:active {
      background-color: #d4af37;
      color: #0b0c10;
    }
    .game-btn.torpedo {
      background-color: #1e3a8a;
      border-color: #60a5fa;
      color: #f8fafc;
    }
    .game-btn.warp {
      background-color: #362a05;
      border-color: #d4af37;
      color: #fef08a;
    }
    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .back-link:hover { color: #d4af37; }
  </style>
</head>
<body>

  <div class="game-container">
    <div style="font-size: 10px; font-weight: bold; color: #d4af37; letter-spacing: 2px; margin-bottom: 4px;" id="mission-status">
      VANGUARD FLEET • ORBITAL DEPARTURE
    </div>

    <div class="stats-bar" style="border-color: #d4af37; color: #d4af37;">
      <span>🛡️ Shield: <strong id="stat-shield" style="color: #60a5fa;">100%</strong></span>
      <span>⚡ Hull: <strong id="stat-hull" style="color: #10b981;">100%</strong></span>
      <span>✨ Orbs: <strong id="stat-orbs" style="color: #38bdf8;">0</strong></span>
      <span>🚀 Tier: <strong id="stat-tier" style="color: #f59e0b;">MK I</strong></span>
    </div>

    <div id="distress-banner" style="background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; font-size: 10px; padding: 4px; border-radius: 4px; margin-bottom: 8px; display: none;">
      ⚠️ EMERGENCY BEACON: <span id="distress-timer">45</span>s TO SECURE SECTOR!
    </div>

    <canvas id="odysseyCanvas" width="400" height="500"></canvas>

    <div class="control-grid">
      <button class="game-btn torpedo" onclick="fireQuadTorpedoes()">🚀 Quad Torpedoes (<span id="torpedo-count">3</span>)</button>
      <button class="game-btn warp" onclick="engageWarpDrive()">🌌 Vanguard Warp</button>
    </div>
    
    <div class="control-grid" style="grid-template-columns: 1fr;">
      <button class="game-btn" onclick="returnToGlobe()">← Return to Command Deck</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'laser') {
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'torpedo') {
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'collect') {
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(1160, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'warp') {
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 1.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
          osc.start(now); osc.stop(now + 1.2);
        }
      } catch(e){}
    }

    const canvas = document.getElementById('odysseyCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 200, y: 420, width: 44, height: 44 };
    let shield = 100;
    let hull = 100;
    let orbsCollected = 0;
    let shipTier = 1; // MK I to MK III
    let torpedoes = 3;
    let isWarping = false;
    let sectorName = "Earth Orbit (Sector 1)";
    
    let launchSequenceTimer = 300; 
    let earthSize = 220;
    let earthY = -50;

    let enemies = [];
    let projectiles = [];
    let orbs = [];
    let stars = [];
    let shieldPulse = 0;

    let distressActive = false;
    let distressTimeLeft = 45;
    let distressInterval = null;

    for (let i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 2 + 1 });
    }

    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.touches[0].clientX - rect.left;
    }, { passive: true });

    canvas.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });

    setInterval(() => {
      if (!isWarping && launchSequenceTimer <= 0) {
        let fireRate = shipTier === 3 ? 250 : 350;
        projectiles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -9, isTorpedo: false });
        playSound('laser');
      }
    }, 300);

    function fireQuadTorpedoes() {
      if (torpedoes <= 0 || isWarping || launchSequenceTimer > 0) return;
      torpedoes--;
      updateHUD();
      playSound('torpedo');
      
      let offsets = shipTier >= 2 ? [-35, -15, 15, 35] : [-20, 20];
      offsets.forEach(off => {
        projectiles.push({ x: player.x + off, y: player.y - 15, vx: off * 0.04, vy: -11, isTorpedo: true });
      });
    }

    function engageWarpDrive() {
      if (isWarping) return;
      isWarping = true;
      playSound('warp');

      // Shift to new cosmic background sector
      let sectors = [
        "Deep Nebula (Sector 2)",
        "Crimson Star Cluster (Sector 3)",
        "Albor Outpost Rim (Sector 4)",
        "Quantum Void Core (Sector 5)"
      ];
      sectorName = sectors[Math.floor(Math.random() * sectors.length)];
      document.getElementById('mission-status').innerText = `VANGUARD FLEET • ${sectorName}`;

      // Trigger random distress call event
      if (!distressActive && Math.random() < 0.7) {
        triggerDistressCall();
      }

      setTimeout(() => {
        isWarping = false;
        updateHUD();
      }, 1500);
    }

    function triggerDistressCall() {
      distressActive = true;
      distressTimeLeft = 45;
      document.getElementById('distress-banner').style.display = 'block';
      
      clearInterval(distressInterval);
      distressInterval = setInterval(() => {
        distressTimeLeft--;
        document.getElementById('distress-timer').innerText = distressTimeLeft;
        if (distressTimeLeft <= 0) {
          clearInterval(distressInterval);
          distressActive = false;
          document.getElementById('distress-banner').style.display = 'none';
        }
      }, 1000);
    }

    function updateHUD() {
      document.getElementById('stat-shield').innerText = Math.max(0, Math.floor(shield)) + '%';
      document.getElementById('stat-hull').innerText = Math.max(0, Math.floor(hull)) + '%';
      document.getElementById('stat-orbs').innerText = orbsCollected;
      document.getElementById('stat-tier').innerText = `MK ${shipTier}`;
      document.getElementById('torpedo-count').innerText = torpedoes;
    }

    function returnToGlobe() {
      window.location.href = 'index.html';
    }

    function loop() {
      // Dynamic background tint based on sector warp state
      ctx.fillStyle = isWarping ? '#0f172a' : '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let speedMult = isWarping ? 18 : (launchSequenceTimer > 0 ? 4 : 1);

      ctx.fillStyle = sectorName.includes('Crimson') ? '#fca5a5' : (sectorName.includes('Nebula') ? '#93c5fd' : '#ffffff');
      stars.forEach(s => {
        s.y += s.speed * speedMult;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillRect(s.x, s.y, s.size, s.size * (isWarping || launchSequenceTimer > 0 ? 4 : 1));
      });

      if (launchSequenceTimer > 0) {
        launchSequenceTimer--;
        earthSize -= 0.35;
        earthY += 0.2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(canvas.width / 2, earthY, earthSize, 0, Math.PI * 2);
        ctx.fillStyle = '#1e3a8a';
        ctx.fill();
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#d4af37';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('LEAVING EARTH ORBIT • VANGUARD DEEP SPACE', canvas.width / 2, 60);
        ctx.textAlign = 'left';

        if (launchSequenceTimer <= 0) {
          document.getElementById('mission-status').innerText = `VANGUARD FLEET • ${sectorName}`;
        }
      } else if (!isWarping) {
        if (Math.random() < 0.035 && enemies.length < 5) {
          enemies.push({ x: Math.random() * (canvas.width - 60) + 30, y: -30, size: 32, hp: shipTier > 1 ? 3 : 2 });
        }

        projectiles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          ctx.fillStyle = p.isTorpedo ? '#f59e0b' : '#38bdf8';
          ctx.fillRect(p.x - 3, p.y - 8, p.isTorpedo ? 6 : 4, p.isTorpedo ? 16 : 12);

          enemies.forEach((e, eIdx) => {
            let dist = Math.hypot(p.x - e.x, p.y - e.y);
            if (dist < e.size) {
              e.hp -= p.isTorpedo ? 3 : 1;
              projectiles.splice(idx, 1);
              if (e.hp <= 0) {
                if (Math.random() < 0.75) {
                  orbs.push({ x: e.x, y: e.y, vy: 2.2 });
                }
                enemies.splice(eIdx, 1);
                updateHUD();
              }
            }
          });

          if (p.y < 0) projectiles.splice(idx, 1);
        });

        orbs.forEach((o, idx) => {
          o.y += o.vy;
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.arc(o.x, o.y, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          let dist = Math.hypot(player.x - o.x, player.y - o.y);
          if (dist < 35) {
            playSound('collect');
            orbsCollected++;
            
            // SHIP TRANSFORMATION PROGRESSION
            if (orbsCollected >= 10 && shipTier < 3) {
              shipTier = 3;
              torpedoes += 5;
            } else if (orbsCollected >= 5 && shipTier < 2) {
              shipTier = 2;
              torpedoes += 3;
            }

            if (distressActive && orbsCollected >= 5) {
              distressActive = false;
              clearInterval(distressInterval);
              document.getElementById('distress-banner').style.display = 'none';
              score += 300;
            }

            updateHUD();
            orbs.splice(idx, 1);
          }
          if (o.y > canvas.height) orbs.splice(idx, 1);
        });

        // ENEMY WARSHIPS
        enemies.forEach((e, idx) => {
          e.y += 2.4;
          ctx.save();
          ctx.translate(e.x, e.y);
          
          ctx.fillStyle = '#dc2626';
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(0, e.size);
          ctx.lineTo(-e.size*0.8, -e.size*0.6);
          ctx.lineTo(0, -e.size*0.3);
          ctx.lineTo(e.size*0.8, -e.size*0.6);
          ctx.closePath();
          ctx.fill();
          
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-6, -8, 12, 16);
          ctx.shadowBlur = 0;
          ctx.restore();

          let dist = Math.hypot(player.x - e.x, player.y - e.y);
          if (dist < 35) {
            enemies.splice(idx, 1);
            if (shield > 0) {
              shield -= 20;
              shieldPulse = 15;
            } else {
              hull -= 15;
            }
            updateHUD();
          }

          if (e.y > canvas.height + 40) enemies.splice(idx, 1);
        });
      }

      // TRANSFORMING VANGUARD SHIP HULL BASED ON TIER
      ctx.save();
      ctx.translate(player.x, player.y);
      
      if (shield > 0 && shieldPulse > 0) {
        shieldPulse--;
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (shipTier === 1) {
        // MK I: Standard Gold Interceptor
        ctx.fillStyle = '#d4af37';
        ctx.beginPath();
        ctx.moveTo(0, -26);
        ctx.lineTo(-18, 14);
        ctx.lineTo(-6, 22);
        ctx.lineTo(0, 16);
        ctx.lineTo(6, 22);
        ctx.lineTo(18, 14);
        ctx.closePath();
        ctx.fill();
      } else if (shipTier === 2) {
        // MK II: Sleek Dual-Helix Cruiser
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(-24, 18);
        ctx.lineTo(-10, 26);
        ctx.lineTo(0, 18);
        ctx.lineTo(10, 26);
        ctx.lineTo(24, 18);
        ctx.closePath();
        ctx.fill();
      } else {
        // MK III: Apex Quantum Vanguard Dreadnought
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(0, -38);
        ctx.lineTo(-30, 22);
        ctx.lineTo(-12, 30);
        ctx.lineTo(0, 22);
        ctx.lineTo(12, 30);
        ctx.lineTo(30, 22);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Cockpit Glow
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.ellipse(0, -4, 5, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Thrusters
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(-12, shipTier === 3 ? 30 : 22, 6, 14 + Math.random() * 8);
      ctx.fillRect(6, shipTier === 3 ? 30 : 22, 6, 14 + Math.random() * 8);

      ctx.restore();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
