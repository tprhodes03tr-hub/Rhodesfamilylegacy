<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Horizon: Odyssey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020712;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            padding: 0 10px;
        }
        .hud-card {
            background: rgba(4, 20, 44, 0.75);
            border: 1.5px solid #00e5ff;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            min-width: 95px;
        }
        .hud-label {
            font-size: 10px;
            font-weight: 800;
            color: #80d8ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .hud-val {
            font-size: 14px;
            font-weight: 700;
            margin-top: 3px;
        }
        /* Touch Controls Overlay */
        #controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
        }
        .touch-zone {
            pointer-events: auto;
        }
        /* Virtual Joystick */
        #joystick-base {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 229, 255, 0.5);
            background: rgba(0, 50, 100, 0.2);
            position: relative;
            touch-action: none;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #00e5ff 0%, #007799 100%);
            box-shadow: 0 0 12px #00e5ff;
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
        }
        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            touch-action: manipulation;
            box-shadow: 0 0 10px currentColor;
        }
        #btn-boost {
            border-color: #00e5ff;
            background: rgba(0, 120, 160, 0.4);
            color: #00e5ff;
        }
        #btn-fire {
            border-color: #ff3d00;
            background: rgba(180, 40, 20, 0.4);
            color: #ff3d00;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Sector</div>
            <div class="hud-val" id="hud-sector">1 - ORION EDGE</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">Shields</div>
            <div class="hud-val" id="hud-shields">100%</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">Raiders Down</div>
            <div class="hud-val" id="hud-kills">0 / 6</div>
        </div>
    </div>

    <div id="controls">
        <div id="joystick-base" class="touch-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="btn-group touch-zone">
            <div id="btn-boost" class="action-btn">Boost</div>
            <div id="btn-fire" class="action-btn">Fire</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let sector = 1;
        let kills = 0;
        const killsNeeded = 6;
        let particles = [];
        let lasers = [];
        let enemyLasers = [];
        let enemies = [];
        let stars = [];

        // Init Stars
        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        // Player (USS Voyager)
        const player = {
            x: window.innerWidth * 0.3,
            y: window.innerHeight * 0.6,
            angle: 0,
            speed: 0,
            maxSpeed: 4.5,
            boost: false,
            shields: 100,
            radius: 20
        };

        // Spawn Enemies (Warbirds)
        function spawnEnemy() {
            enemies.push({
                x: Math.random() > 0.5 ? window.innerWidth + 40 : -40,
                y: Math.random() * window.innerHeight,
                angle: 0,
                speed: 1.8 + Math.random() * 0.8,
                health: 40,
                lastShot: Date.now() + Math.random() * 2000,
                radius: 22
            });
        }
        for (let i = 0; i < 3; i++) spawnEnemy();

        // Input Handling
        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let joyActive = false;
        let joyVector = { x: 0, y: 0 };
        const joyRadius = 45;

        joystickBase.addEventListener('touchstart', (e) => {
            joyActive = true;
            handleJoystick(e.touches[0]);
        });
        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            for (let t of e.touches) {
                const rect = joystickBase.getBoundingClientRect();
                if (t.clientX < window.innerWidth / 2) {
                    handleJoystick(t);
                    break;
                }
            }
        });
        window.addEventListener('touchend', (e) => {
            if (e.touches.length === 0 || !Array.from(e.touches).some(t => t.clientX < window.innerWidth / 2)) {
                joyActive = false;
                joyVector = { x: 0, y: 0 };
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }
        });

        function handleJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);

            if (dist > joyRadius) {
                dx = (dx / dist) * joyRadius;
                dy = (dy / dist) * joyRadius;
            }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVector = { x: dx / joyRadius, y: dy / joyRadius };
        }

        // Fire & Boost Buttons
        const btnFire = document.getElementById('btn-fire');
        const btnBoost = document.getElementById('btn-boost');

        function firePlayerTorpedo() {
            const speed = 9;
            lasers.push({
                x: player.x + Math.cos(player.angle) * 22,
                y: player.y + Math.sin(player.angle) * 22,
                vx: Math.cos(player.angle) * speed,
                vy: Math.sin(player.angle) * speed,
                life: 70
            });
        }

        btnFire.addEventListener('touchstart', (e) => {
            e.preventDefault();
            firePlayerTorpedo();
        });
        btnBoost.addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.boost = true;
        });
        btnBoost.addEventListener('touchend', (e) => {
            e.preventDefault();
            player.boost = false;
        });

        // Keyboard support
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') firePlayerTorpedo();
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Rendering Routines
        function drawPlayerShip(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);

            // Warp Nacelle Glow
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00e5ff';
            ctx.fillStyle = '#00e5ff';
            ctx.fillRect(-22, -18, 20, 4);
            ctx.fillRect(-22, 14, 20, 4);
            ctx.shadowBlur = 0;

            // Pylons
            ctx.fillStyle = '#8a9ba8';
            ctx.beginPath();
            ctx.moveTo(-8, -6);
            ctx.lineTo(-18, -16);
            ctx.lineTo(-12, -16);
            ctx.lineTo(-4, -6);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-8, 6);
            ctx.lineTo(-18, 16);
            ctx.lineTo(-12, 16);
            ctx.lineTo(-4, 6);
            ctx.closePath();
            ctx.fill();

            // Secondary Hull
            ctx.fillStyle = '#b0bec5';
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(-18, -5);
            ctx.lineTo(-20, 0);
            ctx.lineTo(-18, 5);
            ctx.lineTo(0, 6);
            ctx.closePath();
            ctx.fill();

            // Navigational Deflector
            ctx.fillStyle = '#ffab00';
            ctx.beginPath();
            ctx.ellipse(2, 0, 3, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Primary Saucer Hull
            ctx.fillStyle = '#cfd8dc';
            ctx.strokeStyle = '#78909c';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(26, 0);
            ctx.bezierCurveTo(22, -14, 2, -15, -4, -10);
            ctx.lineTo(-4, 10);
            ctx.bezierCurveTo(2, 15, 22, 14, 26, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Bridge
            ctx.fillStyle = '#455a64';
            ctx.beginPath();
            ctx.ellipse(8, 0, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawWarbird(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);
            ctx.rotate(enemy.angle);

            // Warp Glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00e676';
            ctx.fillStyle = '#00e676';
            ctx.fillRect(-15, -22, 14, 4);
            ctx.fillRect(-15, 18, 14, 4);
            ctx.shadowBlur = 0;

            // Hollow Wings
            ctx.strokeStyle = '#2e7d32';
            ctx.fillStyle = '#1b5e20';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(8, -8);
            ctx.bezierCurveTo(2, -24, -16, -24, -20, -18);
            ctx.lineTo(-12, -18);
            ctx.bezierCurveTo(-8, -14, 0, -10, 4, -4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(8, 8);
            ctx.bezierCurveTo(2, 24, -16, 24, -20, 18);
            ctx.lineTo(-12, 18);
            ctx.bezierCurveTo(-8, 14, 0, 10, 4, 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Head / Beak
            ctx.fillStyle = '#388e3c';
            ctx.beginPath();
            ctx.moveTo(25, 0);
            ctx.lineTo(10, -9);
            ctx.lineTo(-6, -6);
            ctx.lineTo(-6, 6);
            ctx.lineTo(10, 9);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Disruptor Emitter
            ctx.fillStyle = '#76ff03';
            ctx.beginPath();
            ctx.arc(20, 0, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function addExplosion(x, y, color) {
            for (let i = 0; i < 18; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 25 + Math.random() * 15,
                    color: color
                });
            }
        }

        // Main Game Loop
        function update() {
            // Player Movement
            let moveX = joyVector.x;
            let moveY = joyVector.y;

            if (keys['arrowleft'] || keys['a']) moveX = -1;
            if (keys['arrowright'] || keys['d']) moveX = 1;
            if (keys['arrowup'] || keys['w']) moveY = -1;
            if (keys['arrowdown'] || keys['s']) moveY = 1;

            if (moveX !== 0 || moveY !== 0) {
                player.angle = Math.atan2(moveY, moveX);
                const currentMax = player.boost ? player.maxSpeed * 1.7 : player.maxSpeed;
                player.x += moveX * currentMax;
                player.y += moveY * currentMax;
            }

            // Screen Wrap / Bounds
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

            // Torpedoes
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.x += l.vx;
                l.y += l.vy;
                l.life--;
                if (l.life <= 0) lasers.splice(i, 1);
            }

            // Enemy Disruptors
            for (let i = enemyLasers.length - 1; i >= 0; i--) {
                const el = enemyLasers[i];
                el.x += el.vx;
                el.y += el.vy;
                el.life--;

                // Collision with player
                if (Math.hypot(el.x - player.x, el.y - player.y) < player.radius) {
                    player.shields = Math.max(0, player.shields - 10);
                    addExplosion(player.x, player.y, '#00e5ff');
                    enemyLasers.splice(i, 1);
                    document.getElementById('hud-shields').innerText = `${player.shields}%`;
                    continue;
                }
                if (el.life <= 0) enemyLasers.splice(i, 1);
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                e.angle = Math.atan2(dy, dx);

                e.x += Math.cos(e.angle) * e.speed;
                e.y += Math.sin(e.angle) * e.speed;

                // Enemy shooting
                if (Date.now() - e.lastShot > 2200) {
                    enemyLasers.push({
                        x: e.x + Math.cos(e.angle) * 20,
                        y: e.y + Math.sin(e.angle) * 20,
                        vx: Math.cos(e.angle) * 5,
                        vy: Math.sin(e.angle) * 5,
                        life: 60
                    });
                    e.lastShot = Date.now();
                }

                // Check hits from player torpedoes
                for (let j = lasers.length - 1; j >= 0; j--) {
                    const l = lasers[j];
                    if (Math.hypot(l.x - e.x, l.y - e.y) < e.radius) {
                        e.health -= 20;
                        lasers.splice(j, 1);
                        addExplosion(e.x, e.y, '#ff5722');

                        if (e.health <= 0) {
                            addExplosion(e.x, e.y, '#00e676');
                            enemies.splice(i, 1);
                            kills++;
                            document.getElementById('hud-kills').innerText = `${kills} / ${killsNeeded}`;
                            
                            if (kills >= killsNeeded) {
                                sector++;
                                kills = 0;
                                document.getElementById('hud-sector').innerText = `${sector} - DEEP SECTOR`;
                                document.getElementById('hud-kills').innerText = `0 / ${killsNeeded}`;
                            }
                            spawnEnemy();
                            break;
                        }
                    }
                }
            }

            // Ensure enemy count
            while (enemies.length < 3) spawnEnemy();

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function render() {
            ctx.fillStyle = '#020712';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            for (let s of stars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }

            // Torpedoes
            for (let l of lasers) {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff3d00';
                ctx.fillStyle = '#ff3d00';
                ctx.beginPath();
                ctx.arc(l.x, l.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Disruptors
            for (let el of enemyLasers) {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00e676';
                ctx.fillStyle = '#76ff03';
                ctx.beginPath();
                ctx.arc(el.x, el.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Ships
            for (let enemy of enemies) drawWarbird(enemy);
            drawPlayerShip(player);

            // Explosions
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 2.5, 2.5);
            }

            update();
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
