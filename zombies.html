<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Zombie Survival 3D - Mystery Box Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body { background: #050508; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* HUD */
    #hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; pointer-events: none;
      color: #fff; font-weight: bold; font-size: 14px;
    }
    .badge {
      background: rgba(10, 15, 25, 0.85); border: 2px solid #2a3b5c;
      padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }
    #round-display { color: #ff3333; font-size: 20px; text-align: right; }
    #weapon-display { color: #ffcc00; }
    #perk-display { color: #00ffff; }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      transform: translate(-50%, -50%); pointer-events: none;
      border: 2px solid rgba(0, 255, 200, 0.8); border-radius: 50%;
    }

    /* Controls Grid */
    #controls {
      position: absolute; bottom: 15px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 20px; pointer-events: none;
    }
    .zone {
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative; pointer-events: auto; touch-action: none;
    }
    .knob {
      width: 45px; height: 45px; border-radius: 50%;
      background: #00ffcc; position: absolute; top: 32px; left: 32px;
      pointer-events: none;
    }

    /* Action Buttons */
    .btn-col { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .action-btn {
      width: 58px; height: 58px; border-radius: 50%; border: none;
      color: white; font-weight: bold; font-size: 11px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
    }
    #fire-btn { background: #d92027; width: 68px; height: 68px; font-size: 13px; }
    #box-btn { background: #e67e22; }
    #gum-btn { background: #9b59b6; }
    #grenade-btn { background: #27ae60; }
    #mine-btn { background: #2980b9; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div>
      <div class="badge">HP: <span id="hp">100</span> | Points: <span id="points">1000</span></div>
      <div class="badge" id="weapon-display">Weapon: Starter Pistol</div>
      <div class="badge" id="perk-display">Perk: None</div>
      <div class="badge">Nades: <span id="nade-count">2</span> | Mines: <span id="mine-count">1</span></div>
    </div>
    <div>
      <div class="badge" id="round-display">ROUND 1</div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="controls">
    <div class="zone" id="moveZone"><div class="knob" id="moveKnob"></div></div>
    
    <div class="btn-col">
      <button class="action-btn" id="box-btn">BOX<br><small>950p</small></button>
      <button class="action-btn" id="gum-btn">GUM<br><small>500p</small></button>
    </div>

    <div class="btn-col">
      <button class="action-btn" id="grenade-btn">NADE</button>
      <button class="action-btn" id="mine-btn">MINE</button>
      <button class="action-btn" id="fire-btn">FIRE</button>
    </div>

    <div class="zone" id="lookZone"><div class="knob" id="lookKnob"></div></div>
  </div>

  <script>
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x08090d, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(scene.fog.color);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x334455, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffb077, 0.7);
    dirLight.position.set(20, 30, 10);
    scene.add(dirLight);

    // Floor
    const floorGeo = new THREE.PlaneGeometry(90, 90);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x16181f, roughness: 0.85 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Arena Boundaries
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x241711, roughness: 0.9 });
    const createWall = (w, h, d, x, y, z) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
    };
    createWall(90, 12, 2, 0, 6, -45);
    createWall(90, 12, 2, 0, 6, 45);
    createWall(2, 12, 90, -45, 6, 0);
    createWall(2, 12, 90, 45, 6, 0);

    // --- WEAPONS DATA ---
    const WEAPONS = {
      PISTOL: { name: "Starter Pistol", dmg: 35, spread: 0, color: 0x333333, delay: 200 },
      RIFLE: { name: "Assault Rifle", dmg: 55, spread: 0.02, color: 0x2c3e50, delay: 100 },
      SHOTGUN: { name: "Trench Shotgun", dmg: 30, spread: 0.08, pellets: 6, color: 0x5c3a21, delay: 600 },
      RAYGUN: { name: "Ray Gun Mk II", dmg: 250, spread: 0, color: 0x00ffcc, delay: 350, explosive: true }
    };

    // Player State
    const player = {
      pos: new THREE.Vector3(0, 1.6, 0),
      rotY: 0, rotX: 0,
      health: 100, points: 1000,
      weapon: WEAPONS.PISTOL,
      perk: "None",
      grenades: 2,
      mines: 1,
      speed: 0.15,
      canShoot: true
    };
    camera.position.copy(player.pos);

    // Gun Model
    const gunMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.16, 0.5),
      new THREE.MeshStandardMaterial({ color: player.weapon.color, metalness: 0.8 })
    );
    gunMesh.position.set(0.2, -0.22, -0.45);
    camera.add(gunMesh);
    scene.add(camera);

    // --- INTERACTIVE MACHINES ---
    // Gobblegum Machine (Purple)
    const gumMachine = new THREE.Mesh(
      new THREE.CylinderGeometry(0.8, 0.8, 3, 16),
      new THREE.MeshStandardMaterial({ color: 0x9b59b6, emissive: 0x2c1038 })
    );
    gumMachine.position.set(-6, 1.5, -15);
    scene.add(gumMachine);

    // Mystery Box (Golden Chest)
    const boxMesh = new THREE.Mesh(
      new THREE.BoxGeometry(3, 1.2, 1.5),
      new THREE.MeshStandardMaterial({ color: 0xd4ac0d, emissive: 0x5b4804, metalness: 0.6 })
    );
    boxMesh.position.set(6, 0.6, -15);
    scene.add(boxMesh);

    // Arrays
    const zombies = [];
    const projectiles = [];
    const landmines = [];
    let round = 1;
    let zombiesToSpawn = 6;

    function spawnZombie() {
      const zMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x2e4a28 })
      );
      const angle = Math.random() * Math.PI * 2;
      zMesh.position.set(Math.cos(angle) * 38, 1, Math.sin(angle) * 38);
      scene.add(zMesh);
      zombies.push({ mesh: zMesh, hp: 80 + round * 25, speed: 0.03 + round * 0.004 });
    }

    // --- CONTROLS BINDING ---
    let moveVec = { x: 0, y: 0 };
    let lookVec = { x: 0, y: 0 };

    function bindStick(zoneId, knobId, callback) {
      const zone = document.getElementById(zoneId);
      const knob = document.getElementById(knobId);
      let touchId = null;

      zone.addEventListener("touchstart", (e) => { touchId = e.changedTouches[0].identifier; });
      window.addEventListener("touchmove", (e) => {
        for (let t of e.changedTouches) {
          if (t.identifier === touchId) {
            const rect = zone.getBoundingClientRect();
            const dx = t.clientX - (rect.left + 55);
            const dy = t.clientY - (rect.top + 55);
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const angle = Math.atan2(dy, dx);
            const kx = Math.cos(angle) * dist;
            const ky = Math.sin(angle) * dist;
            knob.style.transform = `translate(${kx}px, ${ky}px)`;
            callback(kx / 35, ky / 35);
          }
        }
      });
      const reset = (e) => {
        for (let t of e.changedTouches) {
          if (t.identifier === touchId) {
            touchId = null;
            knob.style.transform = `translate(0px, 0px)`;
            callback(0, 0);
          }
        }
      };
      window.addEventListener("touchend", reset);
      window.addEventListener("touchcancel", reset);
    }

    bindStick("moveZone", "moveKnob", (x, y) => { moveVec.x = x; moveVec.y = y; });
    bindStick("lookZone", "lookKnob", (x, y) => { lookVec.x = x; lookVec.y = y; });

    // --- SHOOTING & COMBAT ---
    document.getElementById("fire-btn").addEventListener("touchstart", triggerShoot);
    window.addEventListener("keydown", (e) => { if (e.code === "Space") triggerShoot(); });

    function triggerShoot() {
      if (!player.canShoot) return;
      player.canShoot = false;
      setTimeout(() => { player.canShoot = true; }, player.weapon.delay);

      gunMesh.position.z = -0.35;
      setTimeout(() => gunMesh.position.z = -0.45, 70);

      const pellets = player.weapon.pellets || 1;
      for (let p = 0; p < pellets; p++) {
        const raycaster = new THREE.Raycaster();
        const spreadX = (Math.random() - 0.5) * player.weapon.spread;
        const spreadY = (Math.random() - 0.5) * player.weapon.spread;
        raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);

        const targets = zombies.map(z => z.mesh);
        const hits = raycaster.intersectObjects(targets);

        if (hits.length > 0) {
          const hitMesh = hits[0].object;
          const zObj = zombies.find(z => z.mesh === hitMesh);
          if (zObj) {
            let dmg = player.perk === "Insta-Kill" ? 9999 : player.weapon.dmg;
            zObj.hp -= dmg;
            player.points += 10;

            if (player.weapon.explosive) {
              // Splash damage to nearby zombies
              zombies.forEach(other => {
                if (other.mesh.position.distanceTo(zObj.mesh.position) < 4) {
                  other.hp -= 150;
                }
              });
            }

            if (zObj.hp <= 0) {
              scene.remove(zObj.mesh);
              zombies.splice(zombies.indexOf(zObj), 1);
              player.points += 80;
            }
          }
        }
      }
      updateUI();
    }

    // --- MYSTERY BOX ACTION ---
    document.getElementById("box-btn").addEventListener("touchstart", rollMysteryBox);
    function rollMysteryBox() {
      if (player.points >= 950) {
        player.points -= 950;
        const pool = [WEAPONS.RIFLE, WEAPONS.SHOTGUN, WEAPONS.RAYGUN];
        player.weapon = pool[Math.floor(Math.random() * pool.length)];
        gunMesh.material.color.setHex(player.weapon.color);
        updateUI();
      }
    }

    // --- GOBBLEGUM ACTION ---
    document.getElementById("gum-btn").addEventListener("touchstart", () => {
      if (player.points >= 500) {
        player.points -= 500;
        const perks = ["Revive/Full HP", "Speed Boost", "Insta-Kill"];
        const chosen = perks[Math.floor(Math.random() * perks.length)];
        player.perk = chosen;
        if (chosen === "Revive/Full HP") player.health = 100;
        if (chosen === "Speed Boost") player.speed = 0.24;
        updateUI();
      }
    });

    // --- GRENADES & MINES ---
    document.getElementById("grenade-btn").addEventListener("touchstart", throwGrenade);
    function throwGrenade() {
      if (player.grenades <= 0) return;
      player.grenades--;
      updateUI();

      const nade = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x1e824c })
      );
      nade.position.copy(player.pos);
      const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      scene.add(nade);

      let timer = 0;
      const interval = setInterval(() => {
        nade.position.addScaledVector(dir, 0.4);
        timer += 50;
        if (timer > 1200) {
          clearInterval(interval);
          // Detonate
          zombies.forEach((z, idx) => {
            if (z.mesh.position.distanceTo(nade.position) < 8) {
              z.hp -= 300;
              if (z.hp <= 0) {
                scene.remove(z.mesh);
                zombies.splice(idx, 1);
                player.points += 100;
              }
            }
          });
          scene.remove(nade);
          updateUI();
        }
      }, 50);
    }

    document.getElementById("mine-btn").addEventListener("touchstart", placeLandmine);
    function placeLandmine() {
      if (player.mines <= 0) return;
      player.mines--;
      updateUI();

      const mine = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12),
        new THREE.MeshStandardMaterial({ color: 0x2980b9 })
      );
      mine.position.set(player.pos.x, 0.05, player.pos.z);
      scene.add(mine);
      landmines.push(mine);
    }

    function updateUI() {
      document.getElementById("hp").innerText = Math.round(player.health);
      document.getElementById("points").innerText = player.points;
      document.getElementById("round-display").innerText = "ROUND " + round;
      document.getElementById("weapon-display").innerText = "Weapon: " + player.weapon.name;
      document.getElementById("perk-display").innerText = "Perk: " + player.perk;
      document.getElementById("nade-count").innerText = player.grenades;
      document.getElementById("mine-count").innerText = player.mines;
    }

    // --- MAIN GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotation & Movement
      player.rotY -= lookVec.x * 0.05;
      player.rotX -= lookVec.y * 0.03;
      player.rotX = Math.max(-1.4, Math.min(1.4, player.rotX));
      camera.rotation.set(player.rotX, player.rotY, 0, 'YXZ');

      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      player.pos.addScaledVector(forward, -moveVec.y * player.speed);
      player.pos.addScaledVector(side, moveVec.x * player.speed);
      camera.position.copy(player.pos);

      // Landmine Check
      landmines.forEach((mine, mIdx) => {
        zombies.forEach((z, zIdx) => {
          if (z.mesh.position.distanceTo(mine.position) < 2) {
            scene.remove(mine);
            landmines.splice(mIdx, 1);
            z.hp -= 400;
            if (z.hp <= 0) {
              scene.remove(z.mesh);
              zombies.splice(zIdx, 1);
              player.points += 100;
            }
            updateUI();
          }
        });
      });

      // Zombie AI
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.mesh.lookAt(player.pos.x, 1, player.pos.z);
        z.mesh.translateZ(z.speed);

        if (z.mesh.position.distanceTo(player.pos) < 1.4) {
          player.health = Math.max(0, player.health - 0.6);
          updateUI();
          if (player.health <= 0) {
            alert("Game Over! Survived until Round " + round);
            location.reload();
          }
        }
      }

      // Round Progression
      if (zombies.length === 0 && zombiesToSpawn === 0) {
        round++;
        zombiesToSpawn = 6 + round * 3;
        player.grenades = Math.min(4, player.grenades + 2);
        player.mines = Math.min(2, player.mines + 1);
        updateUI();
      }

      if (zombiesToSpawn > 0 && Math.random() < 0.02) {
        spawnZombie();
        zombiesToSpawn--;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
