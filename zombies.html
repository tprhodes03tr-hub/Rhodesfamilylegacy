<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kino Undead 3D - HD Enhanced</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body { background: #05050a; overflow: hidden; font-family: 'Impact', sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Damage Overlay */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      box-shadow: inset 0 0 0 rgba(255,0,0,0);
      transition: box-shadow 0.1s ease-out;
    }

    /* HUD */
    #hud {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; pointer-events: none;
      color: #fff; text-shadow: 2px 2px 4px #000;
    }
    .hud-card {
      background: rgba(15, 18, 26, 0.88); border: 2px solid #5a1919;
      border-radius: 6px; padding: 8px 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    #score-val { color: #f1c40f; font-size: 24px; }
    #round-val { color: #e74c3c; font-size: 34px; letter-spacing: 2px; }
    #perk-val { color: #1abc9c; font-size: 13px; font-family: sans-serif; font-weight: bold; }
    #ammo-val { color: #ecf0f1; font-size: 18px; text-align: right; }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(0, 255, 200, 0.85);
    }
    #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

    /* Controls */
    #controls {
      position: absolute; bottom: 15px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 15px; pointer-events: none;
    }
    .zone {
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(0,0,0,0.7));
      border: 2px solid rgba(255, 255, 255, 0.3); position: relative;
      pointer-events: auto; touch-action: none;
    }
    .knob {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle, #e74c3c, #962d22);
      position: absolute; top: 33px; left: 33px; pointer-events: none;
    }

    .btn-panel { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .action-btn {
      width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
      color: #fff; font-family: 'Impact', sans-serif; font-size: 11px;
      box-shadow: 0 4px 10px #000; cursor: pointer; text-shadow: 1px 1px 2px #000;
    }
    #btn-fire { width: 68px; height: 68px; font-size: 14px; background: radial-gradient(circle, #e74c3c, #781e1e); }
    #btn-box { background: radial-gradient(circle, #f39c12, #935116); }
    #btn-gum { background: radial-gradient(circle, #9b59b6, #5b2c6f); }
    #btn-nade { background: radial-gradient(circle, #27ae60, #145a32); }
    #btn-mine { background: radial-gradient(circle, #2980b9, #154360); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="overlay"></div>

  <div id="hud">
    <div class="hud-card">
      <div>PTS: <span id="score-val">500</span></div>
      <div>HP: <span id="hp-val">100</span></div>
      <div id="perk-val">GUM: None</div>
    </div>
    <div class="hud-card" style="text-align:right;">
      <div id="round-val">I</div>
      <div id="ammo-val">M1911 Pistol</div>
      <div style="font-size:12px; color:#bbb; font-family:sans-serif;">Nades: <span id="nade-val">2</span> | Mines: <span id="mine-val">1</span></div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="controls">
    <div class="zone" id="moveZone"><div class="knob" id="moveKnob"></div></div>
    
    <div class="btn-panel">
      <button class="action-btn" id="btn-box">BOX<br><small>950p</small></button>
      <button class="action-btn" id="btn-gum">GUM<br><small>500p</small></button>
    </div>

    <div class="btn-panel">
      <button class="action-btn" id="btn-nade">NADE</button>
      <button class="action-btn" id="btn-mine">MINE</button>
      <button class="action-btn" id="btn-fire">FIRE</button>
    </div>

    <div class="zone" id="lookZone"><div class="knob" id="lookKnob"></div></div>
  </div>

  <script>
    // --- AUDIO SYSTEM ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioCtx();

    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if (type === 'gun') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.4, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.09);
        osc.start(); osc.stop(actx.currentTime + 0.09);
      } else if (type === 'boom') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(90, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, actx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.6, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.4);
        osc.start(); osc.stop(actx.currentTime + 0.4);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, actx.currentTime);
        gain.gain.setValueAtTime(0.3, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.05);
        osc.start(); osc.stop(actx.currentTime + 0.05);
      } else if (type === 'power') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, actx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.35, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.25);
        osc.start(); osc.stop(actx.currentTime + 0.25);
      }
    }

    // --- PROCEDURAL TEXTURES ---
    function makeTileTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3a3d45'; ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#1b1d22'; ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, 256, 256); ctx.strokeRect(256, 0, 256, 256);
      ctx.strokeRect(0, 256, 256, 256); ctx.strokeRect(256, 256, 256, 256);
      // Floor grunge & blood stains
      ctx.fillStyle = 'rgba(120, 20, 20, 0.45)';
      ctx.beginPath(); ctx.arc(180, 160, 45, 0, Math.PI * 2); ctx.fill();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(12, 12);
      return tex;
    }

    function makeWallTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#4a3b32'; ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#231a15'; ctx.lineWidth = 6;
      for (let y = 0; y < 512; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
        const offset = (y / 64) % 2 === 0 ? 0 : 64;
        for (let x = offset; x < 512; x += 128) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 64); ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(10, 3);
      return tex;
    }

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x10141d, 0.02); // Clearer, less dense fog

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(scene.fog.color);
    document.body.appendChild(renderer.domElement);

    // BRIGHTER LIGHTING SETUP
    const ambientLight = new THREE.AmbientLight(0x778899, 1.4); // Bright clear ambient
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(20, 35, 15);
    scene.add(dirLight);

    // Muzzle Flash PointLight attached to camera
    const muzzleFlash = new THREE.PointLight(0xffaa22, 0, 10);
    muzzleFlash.position.set(0.2, -0.2, -0.8);
    camera.add(muzzleFlash);

    // Arena Floor & Walls
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ map: makeTileTexture(), roughness: 0.5 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ map: makeWallTexture(), roughness: 0.7 });
    const createWall = (w, h, d, x, y, z) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
    };
    createWall(90, 14, 2, 0, 7, -45);
    createWall(90, 14, 2, 0, 7, 45);
    createWall(2, 14, 90, -45, 7, 0);
    createWall(2, 14, 90, 45, 7, 0);

    // Torches
    const addTorch = (x, z, col) => {
      const p = new THREE.PointLight(col, 2.8, 22);
      p.position.set(x, 4, z);
      scene.add(p);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3), new THREE.MeshStandardMaterial({ color: 0x222222 }));
      post.position.set(x, 2.5, z);
      scene.add(post);
    };
    addTorch(-18, -18, 0xff8833);
    addTorch(18, -18, 0xff8833);
    addTorch(-18, 18, 0xff8833);
    addTorch(18, 18, 0xff8833);

    // --- WEAPONS & PLAYER STATE ---
    const WEAPONS = {
      M1911: { name: "M1911 Pistol", dmg: 35, spread: 0.01, delay: 180, color: 0x333333, modelUrl: "" },
      MP40:  { name: "MP40 SMG", dmg: 50, spread: 0.03, delay: 95, color: 0x1c2833, modelUrl: "" },
      TRENCH:{ name: "Trench Shotgun", dmg: 30, spread: 0.07, pellets: 7, delay: 650, color: 0x4a2311, modelUrl: "" },
      RAYGUN:{ name: "Ray Gun Mk II", dmg: 300, spread: 0, delay: 350, color: 0x00ffcc, explosive: true, modelUrl: "" }
    };

    const player = {
      pos: new THREE.Vector3(0, 1.6, 0),
      rotY: 0, rotX: 0,
      health: 100, points: 500,
      weapon: WEAPONS.M1911, perk: "None",
      grenades: 2, mines: 1, speed: 0.15, canShoot: true
    };
    camera.position.copy(player.pos);

    // --- 3D GUN & GLTF LOADER SETUP ---
    const gltfLoader = new THREE.GLTFLoader();
    const gunContainer = new THREE.Group();
    camera.add(gunContainer);
    scene.add(camera);

    // Detailed Composite Gun Mesh (Fallback + Base)
    let activeGunMesh = null;
    function buildProceduralGun(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.4), new THREE.MeshStandardMaterial({ color, metalness: 0.8 }));
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 }));
      barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.04, -0.2);
      const sight = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.03, 0.02), new THREE.MeshBasicMaterial({ color: 0x00ffcc }));
      sight.position.set(0, 0.08, -0.3);
      g.add(body); g.add(barrel); g.add(sight);
      g.position.set(0.24, -0.22, -0.45);
      return g;
    }

    function equipWeapon(weaponObj) {
      player.weapon = weaponObj;
      while (gunContainer.children.length > 0) gunContainer.remove(gunContainer.children[0]);

      if (weaponObj.modelUrl) {
        gltfLoader.load(weaponObj.modelUrl, (gltf) => {
          activeGunMesh = gltf.scene;
          activeGunMesh.scale.set(0.2, 0.2, 0.2);
          activeGunMesh.position.set(0.24, -0.22, -0.45);
          gunContainer.add(activeGunMesh);
        }, undefined, () => {
          activeGunMesh = buildProceduralGun(weaponObj.color);
          gunContainer.add(activeGunMesh);
        });
      } else {
        activeGunMesh = buildProceduralGun(weaponObj.color);
        gunContainer.add(activeGunMesh);
      }
    }
    equipWeapon(player.weapon);

    // --- INTERACTABLES ---
    // Mystery Box
    const boxGroup = new THREE.Group();
    const boxMesh = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 1.6), new THREE.MeshStandardMaterial({ color: 0x8b6508, roughness: 0.3 }));
    const boxGlow = new THREE.PointLight(0xf1c40f, 3.5, 10);
    boxGlow.position.set(0, 1.2, 0);
    boxGroup.add(boxMesh); boxGroup.add(boxGlow);
    boxGroup.position.set(8, 0.6, -18);
    scene.add(boxGroup);

    // Gobblegum Machine
    const gumGroup = new THREE.Group();
    const gumCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.9, 3.2, 16), new THREE.MeshStandardMaterial({ color: 0x8e44ad, metalness: 0.6 }));
    const gumGlobe = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 }));
    gumGlobe.position.y = 1.8;
    const gumGlow = new THREE.PointLight(0x9b59b6, 3.5, 10);
    gumGroup.add(gumCyl); gumGroup.add(gumGlobe); gumGroup.add(gumGlow);
    gumGroup.position.set(-8, 1.6, -18);
    scene.add(gumGroup);

    // --- HUMANOID ZOMBIE BUILDER ---
    const zombies = [];
    const particles = [];
    const landmines = [];
    let round = 1;
    let zombiesToSpawn = 6;

    function createZombieModel() {
      const zGroup = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x4e6b47, roughness: 0.7 });
      const clothesMat = new THREE.MeshStandardMaterial({ color: 0x242d38 });

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.95, 0.4), clothesMat);
      torso.position.y = 1.1;
      zGroup.add(torso);

      // Head + Glowing Eyes
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42), skinMat);
      head.position.set(0, 1.8, 0);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat); eyeL.position.set(-0.1, 0.05, 0.22);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat); eyeR.position.set(0.1, 0.05, 0.22);
      head.add(eyeL); head.add(eyeR);
      zGroup.add(head);

      // Arms (Reach forward)
      const armGeo = new THREE.BoxGeometry(0.2, 0.2, 0.75);
      const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-0.5, 1.25, 0.35);
      const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(0.5, 1.25, 0.35);
      zGroup.add(armL); zGroup.add(armR);

      // Legs
      const legGeo = new THREE.BoxGeometry(0.25, 0.75, 0.3);
      const legL = new THREE.Mesh(legGeo, clothesMat); legL.position.set(-0.2, 0.38, 0);
      const legR = new THREE.Mesh(legGeo, clothesMat); legR.position.set(0.2, 0.38, 0);
      zGroup.add(legL); zGroup.add(legR);

      return { group: zGroup, armL, armR, legL, legR };
    }

    function spawnZombie() {
      const zData = createZombieModel();
      const angle = Math.random() * Math.PI * 2;
      zData.group.position.set(Math.cos(angle) * 38, 0, Math.sin(angle) * 38);
      scene.add(zData.group);
      zombies.push({
        ...zData,
        hp: 75 + round * 30,
        speed: 0.025 + Math.min(0.04, round * 0.003),
        stride: Math.random() * 10
      });
    }

    // --- BLOOD & FX PARTICLES ---
    function spawnBlood(pos, color = 0x990000) {
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshBasicMaterial({ color }));
        p.position.copy(pos);
        p.vel = new THREE.Vector3((Math.random() - 0.5) * 0.25, Math.random() * 0.25, (Math.random() - 0.5) * 0.25);
        scene.add(p);
        particles.push(p);
      }
    }

    // --- CONTROLS BINDING ---
    let moveVec = { x: 0, y: 0 };
    let lookVec = { x: 0, y: 0 };

    function bindStick(zoneId, knobId, cb) {
      const zone = document.getElementById(zoneId);
      const knob = document.getElementById(knobId);
      let tId = null;

      zone.addEventListener("touchstart", (e) => { tId = e.changedTouches[0].identifier; });
      window.addEventListener("touchmove", (e) => {
        for (let t of e.changedTouches) {
          if (t.identifier === tId) {
            const r = zone.getBoundingClientRect();
            const dx = t.clientX - (r.left + 55);
            const dy = t.clientY - (r.top + 55);
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const a = Math.atan2(dy, dx);
            const kx = Math.cos(a) * dist, ky = Math.sin(a) * dist;
            knob.style.transform = `translate(${kx}px, ${ky}px)`;
            cb(kx / 35, ky / 35);
          }
        }
      });
      const reset = (e) => {
        for (let t of e.changedTouches) {
          if (t.identifier === tId) {
            tId = null;
            knob.style.transform = `translate(0px,0px)`;
            cb(0, 0);
          }
        }
      };
      window.addEventListener("touchend", reset);
      window.addEventListener("touchcancel", reset);
    }
    bindStick("moveZone", "moveKnob", (x, y) => { moveVec.x = x; moveVec.y = y; });
    bindStick("lookZone", "lookKnob", (x, y) => { lookVec.x = x; lookVec.y = y; });

    // --- ACTIONS ---
    document.getElementById("btn-fire").addEventListener("touchstart", shootWeapon);
    function shootWeapon() {
      if (!player.canShoot) return;
      player.canShoot = false;
      setTimeout(() => { player.canShoot = true; }, player.weapon.delay);
      playSound('gun');

      // Muzzle Flash & Recoil
      muzzleFlash.intensity = 5;
      setTimeout(() => { muzzleFlash.intensity = 0; }, 45);
      gunContainer.position.z = 0.08;
      setTimeout(() => { gunContainer.position.z = 0; }, 70);

      const count = player.weapon.pellets || 1;
      for (let i = 0; i < count; i++) {
        const ray = new THREE.Raycaster();
        const sx = (Math.random() - 0.5) * player.weapon.spread;
        const sy = (Math.random() - 0.5) * player.weapon.spread;
        ray.setFromCamera(new THREE.Vector2(sx, sy), camera);

        const hitables = [];
        zombies.forEach(z => z.group.traverse(child => { if (child.isMesh) { child.parentZ = z; hitables.push(child); } }));
        const hits = ray.intersectObjects(hitables);

        if (hits.length > 0) {
          const zObj = hits[0].object.parentZ;
          spawnBlood(hits[0].point, player.weapon.explosive ? 0x00ffcc : 0xaa0000);
          playSound('hit');

          let dmg = player.perk === "Insta-Kill" ? 9999 : player.weapon.dmg;
          zObj.hp -= dmg;
          player.points += 10;

          if (player.weapon.explosive) {
            zombies.forEach(other => {
              if (other.group.position.distanceTo(zObj.group.position) < 5) other.hp -= 200;
            });
          }

          if (zObj.hp <= 0) {
            scene.remove(zObj.group);
            zombies.splice(zombies.indexOf(zObj), 1);
            player.points += 90;
          }
        }
      }
      updateUI();
    }

    // Mystery Box Roll
    document.getElementById("btn-box").addEventListener("touchstart", () => {
      if (player.points >= 950) {
        player.points -= 950;
        playSound('power');
        const pool = [WEAPONS.MP40, WEAPONS.TRENCH, WEAPONS.RAYGUN];
        equipWeapon(pool[Math.floor(Math.random() * pool.length)]);
        updateUI();
      }
    });

    // Gobblegum Machine Roll
    document.getElementById("btn-gum").addEventListener("touchstart", () => {
      if (player.points >= 500) {
        player.points -= 500;
        playSound('power');
        const perks = ["Revive/Full HP", "Speed Demon", "Insta-Kill"];
        player.perk = perks[Math.floor(Math.random() * perks.length)];
        if (player.perk === "Revive/Full HP") player.health = 100;
        if (player.perk === "Speed Demon") player.speed = 0.23;
        updateUI();
      }
    });

    // Grenade Action
    document.getElementById("btn-nade").addEventListener("touchstart", () => {
      if (player.grenades <= 0) return;
      player.grenades--;
      updateUI();

      const nade = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x27ae60 }));
      nade.position.copy(player.pos);
      const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      scene.add(nade);

      let ticks = 0;
      const t = setInterval(() => {
        nade.position.addScaledVector(dir, 0.45);
        ticks++;
        if (ticks > 20) {
          clearInterval(t);
          playSound('boom');
          for (let i = 0; i < 20; i++) spawnBlood(nade.position, 0xffaa00);
          zombies.forEach((z, idx) => {
            if (z.group.position.distanceTo(nade.position) < 8) {
              z.hp -= 400;
              if (z.hp <= 0) {
                scene.remove(z.group);
                zombies.splice(idx, 1);
                player.points += 100;
              }
            }
          });
          scene.remove(nade);
          updateUI();
        }
      }, 50);
    });

    // Landmine Action
    document.getElementById("btn-mine").addEventListener("touchstart", () => {
      if (player.mines <= 0) return;
      player.mines--;
      updateUI();

      const mine = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.12, 16), new THREE.MeshStandardMaterial({ color: 0x2980b9 }));
      mine.position.set(player.pos.x, 0.06, player.pos.z);
      scene.add(mine);
      landmines.push(mine);
    });

    function updateUI() {
      document.getElementById("score-val").innerText = player.points;
      document.getElementById("hp-val").innerText = Math.round(player.health);
      document.getElementById("ammo-val").innerText = player.weapon.name;
      document.getElementById("perk-val").innerText = "GUM: " + player.perk;
      document.getElementById("nade-val").innerText = player.grenades;
      document.getElementById("mine-val").innerText = player.mines;
      const romans = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X+"];
      document.getElementById("round-val").innerText = romans[Math.min(round - 1, 9)];
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Camera Look
      player.rotY -= lookVec.x * 0.055;
      player.rotX -= lookVec.y * 0.035;
      player.rotX = Math.max(-1.4, Math.min(1.4, player.rotX));
      camera.rotation.set(player.rotX, player.rotY, 0, 'YXZ');

      // Player Movement
      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      player.pos.addScaledVector(fwd, -moveVec.y * player.speed);
      player.pos.addScaledVector(side, moveVec.x * player.speed);
      camera.position.copy(player.pos);

      // Particle Updates
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.vel);
        p.vel.y -= 0.01;
        p.scale.multiplyScalar(0.95);
        if (p.scale.x < 0.01) { scene.remove(p); particles.splice(i, 1); }
      }

      // Landmine Proximity
      landmines.forEach((m, mi) => {
        zombies.forEach((z, zi) => {
          if (z.group.position.distanceTo(m.position) < 2) {
            playSound('boom');
            scene.remove(m); landmines.splice(mi, 1);
            z.hp -= 500;
            if (z.hp <= 0) { scene.remove(z.group); zombies.splice(zi, 1); player.points += 100; }
            updateUI();
          }
        });
      });

      // Zombie AI & Limb Animation
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.group.lookAt(player.pos.x, 0, player.pos.z);
        z.group.translateZ(z.speed);

        // Walking Animation
        z.stride += 0.15;
        z.legL.rotation.x = Math.sin(z.stride) * 0.6;
        z.legR.rotation.x = -Math.sin(z.stride) * 0.6;
        z.armL.rotation.x = -Math.PI / 2 + Math.sin(z.stride) * 0.2;
        z.armR.rotation.x = -Math.PI / 2 - Math.sin(z.stride) * 0.2;

        // Damage & Screen Vignette
        if (z.group.position.distanceTo(player.pos) < 1.4) {
          player.health = Math.max(0, player.health - 0.6);
          document.getElementById("overlay").style.boxShadow = "inset 0 0 50px rgba(255,0,0,0.8)";
          setTimeout(() => { document.getElementById("overlay").style.boxShadow = "inset 0 0 0 rgba(255,0,0,0)"; }, 120);
          updateUI();
          if (player.health <= 0) {
            alert("SURVIVED UNTIL ROUND " + round);
            location.reload();
          }
        }
      }

      // Wave Spawner
      if (zombies.length === 0 && zombiesToSpawn === 0) {
        round++;
        zombiesToSpawn = 6 + round * 4;
        player.grenades = Math.min(4, player.grenades + 2);
        player.mines = Math.min(2, player.mines + 1);
        updateUI();
      }

      if (zombiesToSpawn > 0 && Math.random() < 0.025) {
        spawnZombie();
        zombiesToSpawn--;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
