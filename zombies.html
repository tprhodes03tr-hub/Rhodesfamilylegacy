<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Zombie Outbreak 3D - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050508;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      font-weight: 700;
      font-size: 1.1rem;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    .hud-stat {
      background: rgba(10, 15, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 8px;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: #00ffcc;
    }
    #crosshair::before {
      top: 5px;
      left: 0;
      width: 12px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 5px;
      width: 2px;
      height: 12px;
    }
    /* Mobile Touch Controls */
    .touch-zone {
      position: absolute;
      bottom: 20px;
      width: 130px;
      height: 130px;
      z-index: 20;
    }
    #stick-move {
      left: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
    }
    #stick-look {
      right: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
    }
    .knob {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 50px;
      height: 50px;
      background: rgba(0, 255, 204, 0.4);
      border: 2px solid #00ffcc;
      border-radius: 50%;
      pointer-events: none;
    }
    #fire-btn {
      position: absolute;
      bottom: 170px;
      right: 35px;
      width: 70px;
      height: 70px;
      background: rgba(255, 50, 50, 0.5);
      border: 2px solid #ff3232;
      border-radius: 50%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
      color: #fff;
    }
    #fire-btn:active {
      background: rgba(255, 50, 50, 0.9);
      transform: scale(0.95);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="hud">
    <div class="hud-stat" id="hud-health">Health: 100</div>
    <div class="hud-stat" id="hud-score">Score: 0</div>
  </div>

  <div id="crosshair"></div>

  <!-- Virtual Controls -->
  <div id="stick-move" class="touch-zone">
    <div id="knob-move" class="knob"></div>
  </div>
  <div id="fire-btn">FIRE</div>
  <div id="stick-look" class="touch-zone">
    <div id="knob-look" class="knob"></div>
  </div>

  <script>
    let scene, camera, renderer;
    let score = 0, health = 100;
    let isGameOver = false;
    let zombies = [];
    let bullets = [];
    const moveVector = { x: 0, z: 0 };
    const lookVector = { yaw: 0, pitch: 0 };

    function init() {
      const container = document.getElementById('game-container');
      
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050508, 0.04);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0);
      camera.rotation.order = 'YXZ';

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Arena Floor
      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshLambertMaterial({ color: 0x1a1a24 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Arena Grid lines
      const grid = new THREE.GridHelper(100, 40, 0x00ffcc, 0x222233);
      grid.position.y = 0.01;
      scene.add(grid);

      setupTouch();
      setupKeyboard();
      spawnZombieWave();
    }

    function spawnZombie() {
      if (isGameOver) return;
      const geo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
      const mat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
      const zombie = new THREE.Mesh(geo, mat);

      const angle = Math.random() * Math.PI * 2;
      const dist = 15 + Math.random() * 20;
      zombie.position.set(
        camera.position.x + Math.sin(angle) * dist,
        0.9,
        camera.position.z + Math.cos(angle) * dist
      );

      scene.add(zombie);
      zombies.push(zombie);
    }

    function spawnZombieWave() {
      for (let i = 0; i < 6; i++) {
        spawnZombie();
      }
    }

    function shoot() {
      if (isGameOver) return;
      const geo = new THREE.SphereGeometry(0.1, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
      const bullet = new THREE.Mesh(geo, mat);

      bullet.position.copy(camera.position);

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      bullet.velocity = dir.multiplyScalar(0.8);

      scene.add(bullet);
      bullets.push(bullet);
    }

    function setupTouch() {
      const moveZone = document.getElementById('stick-move');
      const moveKnob = document.getElementById('knob-move');
      let moveTouchId = null;
      let moveCenter = { x: 0, y: 0 };

      moveZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        moveTouchId = touch.identifier;
        const rect = moveZone.getBoundingClientRect();
        moveCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      }, { passive: false });

      moveZone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === moveTouchId) {
            const dx = touch.clientX - moveCenter.x;
            const dy = touch.clientY - moveCenter.y;
            const dist = Math.min(45, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);

            moveKnob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            moveVector.x = (Math.cos(angle) * dist) / 45;
            moveVector.z = (Math.sin(angle) * dist) / 45;
          }
        }
      }, { passive: false });

      const resetMove = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === moveTouchId) {
            moveTouchId = null;
            moveKnob.style.transform = 'translate(0px, 0px)';
            moveVector.x = 0;
            moveVector.z = 0;
          }
        }
      };
      moveZone.addEventListener('touchend', resetMove);
      moveZone.addEventListener('touchcancel', resetMove);

      // Look Zone
      const lookZone = document.getElementById('stick-look');
      const lookKnob = document.getElementById('knob-look');
      let lookTouchId = null;
      let lookCenter = { x: 0, y: 0 };

      lookZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        lookTouchId = touch.identifier;
        const rect = lookZone.getBoundingClientRect();
        lookCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      }, { passive: false });

      lookZone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === lookTouchId) {
            const dx = touch.clientX - lookCenter.x;
            const dy = touch.clientY - lookCenter.y;
            const dist = Math.min(45, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);

            lookKnob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            lookVector.yaw = -(Math.cos(angle) * dist) / 45;
            lookVector.pitch = -(Math.sin(angle) * dist) / 45;
          }
        }
      }, { passive: false });

      const resetLook = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === lookTouchId) {
            lookTouchId = null;
            lookKnob.style.transform = 'translate(0px, 0px)';
            lookVector.yaw = 0;
            lookVector.pitch = 0;
          }
        }
      };
      lookZone.addEventListener('touchend', resetLook);
      lookZone.addEventListener('touchcancel', resetLook);

      // Fire Button
      document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        shoot();
      });
    }

    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveVector.z = -1;
        if (e.code === 'KeyS') moveVector.z = 1;
        if (e.code === 'KeyA') moveVector.x = -1;
        if (e.code === 'KeyD') moveVector.x = 1;
        if (e.code === 'Space') shoot();
      });
      window.addEventListener('keyup', (e) => {
        if (['KeyW', 'KeyS'].includes(e.code)) moveVector.z = 0;
        if (['KeyA', 'KeyD'].includes(e.code)) moveVector.x = 0;
      });
    }

    function updateHUD() {
      document.getElementById('hud-health').innerText = `Health: ${Math.max(0, Math.floor(health))}`;
      document.getElementById('hud-score').innerText = `Score: ${score}`;
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      if (isGameOver) return;

      const delta = clock.getDelta();

      // Camera rotation
      camera.rotation.y += lookVector.yaw * 2.5 * delta;
      camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camera.rotation.x + lookVector.pitch * 2.0 * delta));

      // Player Movement
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
      const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
      const move = forward.multiplyScalar(-moveVector.z).add(right.multiplyScalar(moveVector.x)).normalize();

      if (move.length() > 0) {
        camera.position.addScaledVector(move, 6.0 * delta);
        camera.position.x = Math.max(-48, Math.min(48, camera.position.x));
        camera.position.z = Math.max(-48, Math.min(48, camera.position.z));
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.velocity);

        if (b.position.distanceTo(camera.position) > 60) {
          scene.remove(b);
          bullets.splice(i, 1);
          continue;
        }

        // Bullet hit zombie
        for (let j = zombies.length - 1; j >= 0; j--) {
          const z = zombies[j];
          if (b.position.distanceTo(z.position) < 1.0) {
            scene.remove(z);
            scene.remove(b);
            zombies.splice(j, 1);
            bullets.splice(i, 1);
            score += 10;
            updateHUD();
            setTimeout(spawnZombie, 1500);
            break;
          }
        }
      }

      // Update Zombies
      zombies.forEach((z) => {
        const zDir = new THREE.Vector3().subVectors(camera.position, z.position);
        zDir.y = 0;
        const zDist = zDir.length();
        zDir.normalize();

        if (zDist > 1.2) {
          z.position.addScaledVector(zDir, 2.5 * delta);
        } else {
          health -= 15 * delta;
          updateHUD();
          if (health <= 0) {
            isGameOver = true;
            alert('Game Over! Refresh the page to play again.');
          }
        }
        z.lookAt(camera.position.x, 0.9, camera.position.z);
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
    updateHUD();
    animate();
  </script>
</body>
</html>
