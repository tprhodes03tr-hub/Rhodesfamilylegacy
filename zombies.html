
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>High-Rise Zombie Outbreak</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
    
    /* HUD Overlay */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid #ff0055;
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }
    .hud-title { font-size: 11px; font-weight: 800; color: #8a99ad; text-transform: uppercase; }
    .hud-val { font-size: 18px; font-weight: 900; color: #ffe600; }
    .hud-hp { color: #00ff88; }
    .hud-gun { color: #00f0ff; text-align: right; }

    /* Touch Controls */
    #controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }
    .stick-zone {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20,30,50,0.8) 30%, rgba(5,10,20,0.9) 80%);
      border: 2px solid rgba(0,240,255,0.4);
      position: relative;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stick-knob {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff0055, #990033 70%);
      box-shadow: 0 0 12px #ff0055;
      position: absolute;
      pointer-events: none;
    }
    .btn-cluster {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    .btn-row { display: flex; gap: 8px; }
    .action-circle {
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
    }
    .btn-fire { width: 72px; height: 72px; background: radial-gradient(circle at 35% 35%, #ff2a5f, #a8002b 70%); font-size: 13px; box-shadow: 0 0 14px rgba(255,0,85,0.5); }
    .btn-sub { width: 52px; height: 52px; font-size: 9px; }
    .btn-box { background: radial-gradient(circle, #e09f3e, #8a5a12); }
    .btn-gum { background: radial-gradient(circle, #9d4edd, #5a189a); }
    .btn-elev { background: radial-gradient(circle, #00b4d8, #0077b6); }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border: 2px solid #00f0ff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Points / Health</div>
      <div><span class="hud-val" id="ptsDisplay">500</span> PTS</div>
      <div class="hud-hp" id="hpDisplay">HP: 100</div>
      <div style="font-size:10px; color:#9d4edd;" id="gumDisplay">GUM: None</div>
    </div>
    <div class="hud-card" style="text-align: right;">
      <div class="hud-title" id="floorDisplay">FLOOR: 1 (LOBBY)</div>
      <div class="hud-val hud-gun" id="gunDisplay">M1911 Pistol</div>
      <div style="font-size:10px; color:#8a99ad;" id="ammoDisplay">AMMO: ∞</div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="controls">
    <!-- Move Thumbstick -->
    <div class="stick-zone" id="moveStick">
      <div class="stick-knob" id="moveKnob"></div>
    </div>

    <!-- Actions -->
    <div class="btn-cluster">
      <div class="btn-row">
        <button class="action-circle btn-sub btn-box" id="btnBox">BOX<br>950p</button>
        <button class="action-circle btn-sub btn-elev" id="btnElev">ELEV<br>USE</button>
        <button class="action-circle btn-sub btn-gum" id="btnGum">GUM<br>500p</button>
      </div>
      <button class="action-circle btn-fire" id="btnFire">FIRE</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 3D THREE.JS HIGH-RISE ZOMBIES ENGINE
    // ==========================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050811, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambLight = new THREE.AmbientLight(0x223344, 0.8);
    scene.add(ambLight);

    const redBeacon = new THREE.PointLight(0xff0055, 1.5, 30);
    redBeacon.position.set(0, 15, 0);
    scene.add(redBeacon);

    // Player State
    let player = {
      x: 0, y: 1.7, z: 0,
      rotY: 0,
      hp: 100, maxHp: 100,
      points: 500,
      currentFloor: 1,
      targetFloorY: 1.7,
      gun: 'M1911 Pistol',
      hasJug: false,
      gum: 'None'
    };

    // ==========================================
    // HIGH-RISE BUILDING ARCHITECTURE (Roofs & Floors)
    // ==========================================
    const FLOOR_HEIGHT = 8;
    const FLOORS = [
      { id: 1, name: "1 (LOBBY)", y: 0 },
      { id: 2, name: "2 (OFFICES)", y: FLOOR_HEIGHT },
      { id: 3, name: "ROOFTOP", y: FLOOR_HEIGHT * 2 }
    ];

    // Texture Generator for Concrete & Metal
    function makeGridTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = "#1b2230"; ctx.fillRect(0,0,128,128);
      ctx.strokeStyle = "#28354d"; ctx.lineWidth = 4; ctx.strokeRect(0,0,128,128);
      return new THREE.CanvasTexture(c);
    }
    const floorMat = new THREE.MeshStandardMaterial({ map: makeGridTexture(), roughness: 0.8 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x151b26, roughness: 0.9 });
    const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0c1017, roughness: 0.9 });

    FLOORS.forEach((fl, idx) => {
      // Floor Mesh
      const fGeo = new THREE.PlaneGeometry(40, 40);
      const fMesh = new THREE.Mesh(fGeo, floorMat);
      fMesh.rotation.x = -Math.PI / 2;
      fMesh.position.y = fl.y;
      scene.add(fMesh);

      // Roof / Ceiling (Except top open roof)
      if (idx < FLOORS.length - 1) {
        const cMesh = new THREE.Mesh(fGeo, ceilMat);
        cMesh.rotation.x = Math.PI / 2;
        cMesh.position.y = fl.y + FLOOR_HEIGHT;
        scene.add(cMesh);
      }

      // Exterior Walls
      const wGeo = new THREE.BoxGeometry(40, FLOOR_HEIGHT, 1);
      const w1 = new THREE.Mesh(wGeo, wallMat); w1.position.set(0, fl.y + FLOOR_HEIGHT/2, -20); scene.add(w1);
      const w2 = new THREE.Mesh(wGeo, wallMat); w2.position.set(0, fl.y + FLOOR_HEIGHT/2, 20); scene.add(w2);
      const w3 = new THREE.Mesh(wGeo, wallMat); w3.rotation.y = Math.PI/2; w3.position.set(-20, fl.y + FLOOR_HEIGHT/2, 0); scene.add(w3);
      const w4 = new THREE.Mesh(wGeo, wallMat); w4.rotation.y = Math.PI/2; w4.position.set(20, fl.y + FLOOR_HEIGHT/2, 0); scene.add(w4);
    });

    // ==========================================
    // INTERACTIVE PROPS (Elevator, Box, Perks)
    // ==========================================
    // Elevator Shaft
    const elevGeo = new THREE.BoxGeometry(6, FLOOR_HEIGHT * 3, 6);
    const elevMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, wireframe: true });
    const elevatorShaft = new THREE.Mesh(elevGeo, elevMat);
    elevatorShaft.position.set(14, FLOOR_HEIGHT, 14);
    scene.add(elevatorShaft);

    // Mystery Box (Glow Gold)
    const boxGeo = new THREE.BoxGeometry(3, 1.2, 1.5);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0xc98a2c, emissive: 0x4a3205 });
    const mysteryBox = new THREE.Mesh(boxGeo, boxMat);
    mysteryBox.position.set(-10, 0.6, -12);
    scene.add(mysteryBox);

    // Perk Machine (Juggernog Red)
    const jugGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
    const jugMat = new THREE.MeshStandardMaterial({ color: 0xd90429, emissive: 0x4a000d });
    const jugMachine = new THREE.Mesh(jugGeo, jugMat);
    jugMachine.position.set(-14, 1.5, 0);
    scene.add(jugMachine);

    // ==========================================
    // 3D FIRST-PERSON HANDS & WEAPONS
    // ==========================================
    const gunGroup = new THREE.Group();

    // Player Hands (Right Arm & Forearm)
    const handMat = new THREE.MeshStandardMaterial({ color: 0x9c6644 });
    const armGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.5);
    const rightArm = new THREE.Mesh(armGeo, handMat);
    rightArm.rotation.x = Math.PI / 3;
    rightArm.rotation.z = -0.2;
    rightArm.position.set(0.24, -0.25, -0.35);
    gunGroup.add(rightArm);

    // M1911 Gun Body
    const pistolBodyGeo = new THREE.BoxGeometry(0.06, 0.12, 0.3);
    const pistolMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
    const gunBody = new THREE.Mesh(pistolBodyGeo, pistolMat);
    gunBody.position.set(0.2, -0.15, -0.45);
    gunGroup.add(gunBody);

    // Ray Gun Green Core (Hidden until unlocked)
    const rayRingsGeo = new THREE.TorusGeometry(0.08, 0.02, 8, 16);
    const rayMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88 });
    const rayRing = new THREE.Mesh(rayRingsGeo, rayMat);
    rayRing.position.set(0.2, -0.15, -0.55);
    rayRing.visible = false;
    gunGroup.add(rayRing);

    camera.add(gunGroup);
    scene.add(camera);

    // ==========================================
    // ZOMBIES WITH RED GLOWING EYES
    // ==========================================
    let zombies = [];
    function createZombie(floorY) {
      const zGroup = new THREE.Group();

      // Body / Torso
      const tGeo = new THREE.BoxGeometry(0.7, 1.1, 0.4);
      const tMat = new THREE.MeshStandardMaterial({ color: 0x3d5a45 }); // Rotting olive
      const torso = new THREE.Mesh(tGeo, tMat);
      torso.position.y = 1.1;
      zGroup.add(torso);

      // Head
      const hGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
      const hMat = new THREE.MeshStandardMaterial({ color: 0x588157 });
      const head = new THREE.Mesh(hGeo, hMat);
      head.position.y = 1.9;
      zGroup.add(head);

      // Glowing Blood-Red Eyes
      const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.12, 1.95, 0.24);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.12, 1.95, 0.24);
      zGroup.add(leftEye);
      zGroup.add(rightEye);

      // Reaching Zombie Arms
      const aGeo = new THREE.BoxGeometry(0.15, 0.15, 0.7);
      const aMat = new THREE.MeshStandardMaterial({ color: 0x588157 });
      const leftArm = new THREE.Mesh(aGeo, aMat);
      leftArm.position.set(-0.45, 1.4, 0.35);
      const rightArm = new THREE.Mesh(aGeo, aMat);
      rightArm.position.set(0.45, 1.4, 0.35);
      zGroup.add(leftArm);
      zGroup.add(rightArm);

      // Random Spawning on active floor
      const angle = Math.random() * Math.PI * 2;
      const dist = 12 + Math.random() * 6;
      zGroup.position.set(Math.cos(angle) * dist, floorY, Math.sin(angle) * dist);
      zGroup.userData = { hp: 3, speed: 0.045 + Math.random() * 0.02, floorY: floorY };

      scene.add(zGroup);
      zombies.push(zGroup);
    }

    // Spawn 5 Zombies
    for (let i = 0; i < 5; i++) createZombie(0);

    // Lasers / Projectiles
    let bullets = [];
    function shootWeapon() {
      const isRay = player.gun.includes("Ray Gun");
      const bGeo = isRay ? new THREE.SphereGeometry(0.18, 8, 8) : new THREE.SphereGeometry(0.06, 6, 6);
      const bMat = new THREE.MeshBasicMaterial({ color: isRay ? 0x00ff88 : 0xffe600 });
      const bMesh = new THREE.Mesh(bGeo, bMat);

      bMesh.position.copy(camera.position);
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      bMesh.userData = { dir: dir, life: 60, isRay: isRay };

      scene.add(bMesh);
      bullets.push(bMesh);

      // Gun Kick Animation
      gunGroup.position.z += 0.08;
      setTimeout(() => gunGroup.position.z -= 0.08, 60);
    }

    // ==========================================
    // CONTROLS & THUMBSTICK
    // ==========================================
    let moveDir = { x: 0, z: 0 };
    const moveStick = document.getElementById('moveStick');
    const moveKnob = document.getElementById('moveKnob');
    let stickActive = false;

    moveStick.addEventListener('pointerdown', (e) => { stickActive = true; updateMove(e); });
    window.addEventListener('pointermove', (e) => { if (stickActive) updateMove(e); });
    window.addEventListener('pointerup', () => {
      stickActive = false;
      moveDir = { x: 0, z: 0 };
      moveKnob.style.transform = `translate(0px, 0px)`;
    });

    function updateMove(e) {
      const rect = moveStick.getBoundingClientRect();
      let dx = e.clientX - (rect.left + rect.width / 2);
      let dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      if (dist > 35) { dx = (dx/dist)*35; dy = (dy/dist)*35; }
      moveKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveDir.x = dx / 35;
      moveDir.z = dy / 35;
    }

    // Touch Screen Swipe for Looking / Turning
    let touchLookStartX = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches[0].clientX > window.innerWidth / 2) {
        touchLookStartX = e.touches[0].clientX;
      }
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0].clientX > window.innerWidth / 2) {
        const deltaX = e.touches[0].clientX - touchLookStartX;
        player.rotY -= deltaX * 0.005;
        touchLookStartX = e.touches[0].clientX;
      }
    });

    // Buttons
    document.getElementById('btnFire').addEventListener('pointerdown', (e) => { e.preventDefault(); shootWeapon(); });

    // Elevator Interaction
    document.getElementById('btnElev').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (Math.hypot(player.x - 14, player.z - 14) < 6) {
        player.currentFloor = player.currentFloor % 3 + 1;
        const fl = FLOORS.find(f => f.id === player.currentFloor);
        player.targetFloorY = fl.y + 1.7;
        document.getElementById('floorDisplay').innerText = `FLOOR: ${fl.name}`;
      }
    });

    // Mystery Box Interaction (Get Ray Gun)
    document.getElementById('btnBox').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (player.points >= 950 && Math.hypot(player.x + 10, player.z + 12) < 6) {
        player.points -= 950;
        player.gun = "Ray Gun Mark II";
        rayRing.visible = true;
        document.getElementById('gunDisplay').innerText = player.gun;
        document.getElementById('ptsDisplay').innerText = player.points;
      }
    });

    // Gobblegum Interaction
    document.getElementById('btnGum').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (player.points >= 500) {
        player.points -= 500;
        player.gum = "Perkaholic (2x Speed)";
        document.getElementById('gumDisplay').innerText = `GUM: ${player.gum}`;
        document.getElementById('ptsDisplay').innerText = player.points;
      }
    });

    // ==========================================
    // MAIN LOOP
    // ==========================================
    function animate() {
      // Smooth Elevator Transit
      player.y += (player.targetFloorY - player.y) * 0.08;

      // Player Movement Relative to Facing Direction
      const speed = player.gum.includes("2x") ? 0.16 : 0.09;
      const forward = new THREE.Vector3(-Math.sin(player.rotY), 0, -Math.cos(player.rotY));
      const side = new THREE.Vector3(Math.cos(player.rotY), 0, -Math.sin(player.rotY));

      player.x += (forward.x * -moveDir.z + side.x * moveDir.x) * speed;
      player.z += (forward.z * -moveDir.z + side.z * moveDir.x) * speed;

      // Keep within highrise bounds
      player.x = Math.max(-18, Math.min(18, player.x));
      player.z = Math.max(-18, Math.min(18, player.z));

      camera.position.set(player.x, player.y, player.z);
      camera.rotation.y = player.rotY;

      // Update Bullets
      bullets.forEach((b, bIdx) => {
        b.position.addScaledVector(b.userData.dir, 0.8);
        b.userData.life--;

        // Zombie Hit Detection
        zombies.forEach((z, zIdx) => {
          if (b.position.distanceTo(z.position.clone().add(new THREE.Vector3(0, 1.2, 0))) < 1.2) {
            z.userData.hp -= b.userData.isRay ? 3 : 1;
            b.userData.life = 0;
            if (z.userData.hp <= 0) {
              scene.remove(z);
              zombies.splice(zIdx, 1);
              player.points += 100;
              document.getElementById('ptsDisplay').innerText = player.points;
              // Respawn on player floor
              createZombie(FLOORS.find(f => f.id === player.currentFloor).y);
            }
          }
        });

        if (b.userData.life <= 0) {
          scene.remove(b);
          bullets.splice(bIdx, 1);
        }
      });

      // Update Zombies tracking player on same floor
      zombies.forEach(z => {
        const activeFloorY = FLOORS.find(f => f.id === player.currentFloor).y;
        if (Math.abs(z.userData.floorY - activeFloorY) < 2) {
          z.lookAt(player.x, z.position.y, player.z);
          const toPlayer = new THREE.Vector3(player.x - z.position.x, 0, player.z - z.position.z).normalize();
          z.position.addScaledVector(toPlayer, z.userData.speed);

          // Attack player
          if (z.position.distanceTo(new THREE.Vector3(player.x, z.position.y, player.z)) < 1.4) {
            player.hp -= 0.5;
            document.getElementById('hpDisplay').innerText = `HP: ${Math.max(0, Math.floor(player.hp))}`;
            if (player.hp <= 0) {
              player.hp = 100;
              player.x = 0; player.z = 0;
            }
          }
        }
      });

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
