<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sisters of the Golden Clock: Time-Slip Adventure | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #1e130c radial-gradient(circle at center, #3d2618 0%, #110904 100%);
      color: #fef3c7;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 800px;
      background: #fdf6e2;
      border: 8px solid #8b5a2b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(139, 90, 43, 0.2);
      text-align: center;
      color: #29180b;
    }
    .game-header {
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      color: #b45309;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      color: #78350f;
      font-size: 1.6rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #fef9c3;
      border: 2px solid #ca8a04;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: #713f12;
      font-weight: bold;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }
    .story-box {
      background: #fffbeb;
      border: 2px dashed #d97706;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #451a03;
      margin-bottom: 16px;
      min-height: 85px;
      text-align: left;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }
    .canvas-box {
      width: 100%;
      height: 310px;
      background: #e0f2fe;
      border: 4px solid #b45309;
      border-radius: 12px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.25), 0 5px 15px rgba(0,0,0,0.2);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .control-btn {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border: 2px solid #78350f;
      color: #ffffff;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.3);
      transition: all 0.15s ease;
    }
    .control-btn:active {
      transform: translateY(2px);
      background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
      box-shadow: 0 2px 5px rgba(180, 83, 9, 0.3);
    }
    .action-btn {
      background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
      border-color: #78350f;
    }
    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: #92400e;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #b45309;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header" id="chapter-title">Chapter 1: The 1880 Pine Bluff Settlement</div>
    <h1>The Sisters of the Golden Clock</h1>

    <div class="stats-bar">
      <span>⚙️ Clock Gears: <strong id="stat-gears" style="color: #b45309;">0</strong> / 3</span>
      <span>⏳ Temporal Era: <strong id="stat-era" style="color: #0284c7;">1880</strong></span>
      <span>✨ Chapter: <strong id="stat-chap" style="color: #d97706;">1</strong> / 3</span>
    </div>

    <div class="story-box" id="story-dialogue">
      "The Three Sisters must gather 3 Clock Gears. Once collected, tap 'GATHER / ASSEMBLE' to repair the clock and jump to the next era!"
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="700" height="310" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="controls-grid">
      <button class="control-btn" onmousedown="startMove(-1)" onmouseup="stopMove()" ontouchstart="startMove(-1)" ontouchend="stopMove()">◀ WALK LEFT</button>
      <button class="control-btn action-btn" onclick="performAction()">⚙️ GATHER / ASSEMBLE</button>
      <button class="control-btn" onmousedown="startMove(1)" onmouseup="stopMove()" ontouchstart="startMove(1)" ontouchend="stopMove()">WALK RIGHT ▶</button>
    </div>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let voiceEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientClockChimes();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startAmbientClockChimes() {
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 250;
        let gain = audioCtx.createGain(); gain.gain.value = 0.02;
        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'gear') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(987.77, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'warp') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.7);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.85);
          osc.start(now); osc.stop(now + 0.85);
        }
      } catch(e) {}
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.0;
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    let gameState = { chapter: 1, gears: 0, assembled: false, era: 1880, sistersX: 150, sistersDir: 0 };

    let items = [
      { x: 230, y: 175, type: 'gear', collected: false },
      { x: 410, y: 175, type: 'gear', collected: false },
      { x: 550, y: 175, type: 'gear', collected: false }
    ];

    function startMove(dir) { initAudio(); gameState.sistersDir = dir; }
    function stopMove() { gameState.sistersDir = 0; }

    function performAction() {
      initAudio();
      let collectedCount = items.filter(i => i.collected).length;

      if (collectedCount < 3) {
        items.forEach(item => {
          if (!item.collected && Math.abs(gameState.sistersX - item.x) < 55) {
            item.collected = true; gameState.gears++;
            playSound('gear');
            speak("Clock gear " + gameState.gears + " collected!");
            if (gameState.gears === 3) {
              document.getElementById('story-dialogue').innerText = "All 3 gears gathered! Tap 'GATHER / ASSEMBLE' again to assemble the golden clock and trigger the Time-Warp!";
              speak("All gears gathered. Tap assemble to time warp.");
            }
          }
        });
      } else if (!gameState.assembled) {
        gameState.assembled = true;
        playSound('warp');

        if (gameState.chapter === 1) {
          gameState.chapter = 2;
          gameState.era = 1926;
          gameState.gears = 0;
          gameState.assembled = false;
          items.forEach(i => i.collected = false);
          document.getElementById('chapter-title').innerText = "Chapter 2: The 1926 Yazoo Levee";
          document.getElementById('story-dialogue').innerText = "⚡ TIME-WARP SUCCESS! The sisters have warped to the 1926 Yazoo Levee. Gather 3 new temporal gears!";
          speak("Time warp complete. Welcome to 1926.");
        } else if (gameState.chapter === 2) {
          gameState.chapter = 3;
          gameState.era = 1952;
          gameState.gears = 0;
          gameState.assembled = false;
          items.forEach(i => i.collected = false);
          document.getElementById('chapter-title').innerText = "Chapter 3: The 1952 Michigan Archives";
          document.getElementById('story-dialogue').innerText = "⚡ FINAL TIME-WARP! The sisters have warped to the Michigan archives. Assemble the final clock!";
          speak("Final time warp. Welcome to 1952.");
        } else {
          gameState.chapter = 4;
          document.getElementById('chapter-title').innerText = "Victory: The Golden Timeline Restored!";
          document.getElementById('story-dialogue').innerText = "🌟 TIMELINE FULLY RESTORED! The Three Sisters (Luetta, Inez, and Tweet Marie) have harmonized history across the ages. 'What is packed in the bone never fades from the marrow!'";
          speak("Victory! The golden clock and all three sisters have fully restored the legacy.");
        }
      }
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('stat-gears').innerText = gameState.gears;
      document.getElementById('stat-era').innerText = gameState.era;
      document.getElementById('stat-chap').innerText = Math.min(gameState.chapter, 3);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let sparkleOffset = 0;

    let particles = [];
    for(let i=0; i<18; i++) {
      particles.push({ x: Math.random() * 700, y: Math.random() * 150, size: 2 + Math.random() * 2.5, speed: 0.3 + Math.random() * 0.4 });
    }

    function drawStorybookThreeSisters(x, y, dir) {
      ctx.save();
      ctx.translate(x, y);
      let bounce = dir !== 0 ? Math.sin(Date.now() * 0.02) * 4 : 0;
      ctx.translate(0, bounce);

      // Sister 1 (Left - Rose / Inez style)
      ctx.save();
      ctx.translate(-28, 6);
      let dress2 = ctx.createLinearGradient(-10, 0, 10, 42);
      dress2.addColorStop(0, '#f472b6'); dress2.addColorStop(1, '#db2777');
      ctx.fillStyle = dress2; ctx.fillRect(-8, 0, 16, 42);
      ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.arc(0, -14, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, -20, 11, Math.PI, 0, false); ctx.fill();
      ctx.restore();

      // Sister 2 (Center - Little Luetta)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath(); ctx.ellipse(0, 48, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
      let dress1 = ctx.createLinearGradient(-12, 0, 12, 48);
      dress1.addColorStop(0, '#34d399'); dress1.addColorStop(1, '#059669');
      ctx.fillStyle = dress1; ctx.fillRect(-10, 0, 20, 48);
      // Collar
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-5, 2); ctx.lineTo(5, 2); ctx.lineTo(0, 8); ctx.closePath(); ctx.fill();
      // Head
      ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.arc(0, -14, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e293b'; ctx.fillRect(-5, -17, 3, 3); ctx.fillRect(2, -17, 3, 3);
      ctx.beginPath(); ctx.arc(0, -20, 13, Math.PI, 0, false); ctx.fill();
      // Golden Clock Pendant
      ctx.fillStyle = '#f59e0b'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 18, 8, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;

      // Sister 3 (Right - Tweet Marie style)
      ctx.save();
      ctx.translate(28, 6);
      let dress3 = ctx.createLinearGradient(-10, 0, 10, 42);
      dress3.addColorStop(0, '#fde047'); dress3.addColorStop(1, '#ca8a04');
      ctx.fillStyle = dress3; ctx.fillRect(-8, 0, 16, 42);
      ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(0, -14, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, -20, 11, Math.PI, 0, false); ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    function gameLoop() {
      sparkleOffset += 0.04;

      if (gameState.sistersDir !== 0) {
        gameState.sistersX += gameState.sistersDir * 4;
        if (gameState.sistersX < 60) gameState.sistersX = 60;
        if (gameState.sistersX > 640) gameState.sistersX = 640;
      }

      // Storybook Sky
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 180);
      if (gameState.chapter === 2) {
        skyGrad.addColorStop(0, '#0284c7');
        skyGrad.addColorStop(1, '#bae6fd');
      } else if (gameState.chapter === 3) {
        skyGrad.addColorStop(0, '#c2410c');
        skyGrad.addColorStop(1, '#fed7aa');
      } else if (gameState.chapter >= 4) {
        skyGrad.addColorStop(0, '#f59e0b');
        skyGrad.addColorStop(1, '#fef08a');
      } else {
        skyGrad.addColorStop(0, '#1e1b4b');
        skyGrad.addColorStop(0.5, '#3b82f6');
        skyGrad.addColorStop(1, '#93c5fd');
      }
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Floating Temporal Sparkles
      ctx.fillStyle = '#fef08a';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = 175;
        ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Golden Clock Tree Landmark in Background
      ctx.save();
      ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#d97706';
      ctx.beginPath(); ctx.arc(350, 80, 60, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#78350f'; ctx.fillRect(342, 115, 16, 60); // Trunk
      ctx.restore();

      // Levee / Ground Platform
      let floorGrad = ctx.createLinearGradient(0, 175, 0, 310);
      floorGrad.addColorStop(0, gameState.chapter >= 4 ? '#4ade80' : '#64748b');
      floorGrad.addColorStop(1, gameState.chapter >= 4 ? '#15803d' : '#1e293b');
      ctx.fillStyle = floorGrad;
      ctx.beginPath(); ctx.moveTo(0, 175); ctx.lineTo(canvas.width, 175); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

      // Render Golden Gears
      items.forEach(item => {
        if (!item.collected) {
          ctx.save();
          ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 15;
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath(); ctx.arc(item.x, item.y + 10, 14, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1e293b';
          ctx.beginPath(); ctx.arc(item.x, item.y + 10, 6, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      });

      // Draw Three Sisters with African American watercolor storybook style
      drawStorybookThreeSisters(gameState.sistersX, 122, gameState.sistersDir);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
