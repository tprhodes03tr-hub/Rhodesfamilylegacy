<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sisters of the Golden Clock: Time-Slip Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #060913;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 750px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 3px solid #f59e0b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.4), inset 0 0 25px rgba(245, 158, 11, 0.15);
      text-align: center;
    }
    .game-header {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      color: #f59e0b;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }
    h1 {
      color: #fef08a;
      font-size: 1.4rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #f59e0b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #f59e0b;
      font-weight: bold;
      box-shadow: inset 0 0 15px rgba(245, 158, 11, 0.2);
    }
    .story-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px dashed #f59e0b;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
      min-height: 80px;
      text-align: left;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
    }
    .canvas-box {
      width: 100%;
      height: 270px;
      background: #020617;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.35), inset 0 0 30px rgba(0,0,0,0.8);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .control-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #f59e0b;
      color: #f59e0b;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
      transition: all 0.2s ease;
    }
    .control-btn:active {
      background-color: #f59e0b;
      color: #0f172a;
      box-shadow: 0 0 20px #f59e0b;
    }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #f59e0b;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header" id="chapter-title">Chapter 1: The 1880 Pine Bluff Settlement</div>
    <h1>The Sisters of the Golden Clock</h1>

    <div class="stats-bar">
      <span>⚙️ Clock Gears: <strong id="stat-gears" style="color: #f59e0b;">0</strong> / 3</span>
      <span>⏳ Temporal Era: <strong id="stat-era" style="color: #38bdf8;">1880</strong></span>
      <span>✨ Chapter: <strong id="stat-chap" style="color: #fef08a;">1</strong> / 3</span>
    </div>

    <div class="story-box" id="story-dialogue">
      "The Three Sisters must gather 3 Clock Gears. Once collected, tap 'ASSEMBLE & TIME-WARP' to repair the clock and jump to the next era!"
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="600" height="270" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="controls-grid">
      <button class="control-btn" onmousedown="startMove(-1)" onmouseup="stopMove()" ontouchstart="startMove(-1)" ontouchend="stopMove()">◀ WALK LEFT</button>
      <button class="control-btn" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%); border-color: #fef08a; color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);" onclick="performAction()">⚙️ GATHER / ASSEMBLE</button>
      <button class="control-btn" onmousedown="startMove(1)" onmouseup="stopMove()" ontouchstart="startMove(1)" ontouchend="stopMove()">WALK RIGHT ▶</button>
    </div>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let voiceEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientClockChimes();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startAmbientClockChimes() {
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 180;
        let gain = audioCtx.createGain(); gain.gain.value = 0.025;
        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'gear') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(987.77, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'warp') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.6);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
          osc.start(now); osc.stop(now + 0.8);
        }
      } catch(e) {}
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    let gameState = { chapter: 1, gears: 0, assembled: false, era: 1880, fannieX: 120, fannieDir: 0 };

    let items = [
      { x: 180, y: 140, type: 'gear', collected: false },
      { x: 340, y: 140, type: 'gear', collected: false },
      { x: 450, y: 140, type: 'gear', collected: false }
    ];

    function startMove(dir) { initAudio(); gameState.fannieDir = dir; }
    function stopMove() { gameState.fannieDir = 0; }

    function performAction() {
      initAudio();
      let collectedCount = items.filter(i => i.collected).length;

      if (collectedCount < 3) {
        items.forEach(item => {
          if (!item.collected && Math.abs(gameState.fannieX - item.x) < 45) {
            item.collected = true; gameState.gears++;
            playSound('gear');
            speak("Clock gear " + gameState.gears + " collected!");
            if (gameState.gears === 3) {
              document.getElementById('story-dialogue').innerText = "All 3 gears gathered! Tap 'GATHER / ASSEMBLE' again to assemble the clock and trigger the Time-Warp!";
              speak("All gears gathered. Tap assemble to time warp.");
            }
          }
        });
      } else if (!gameState.assembled) {
        gameState.assembled = true;
        playSound('warp');

        if (gameState.chapter === 1) {
          gameState.chapter = 2;
          gameState.era = 1926;
          gameState.gears = 0;
          gameState.assembled = false;
          items.forEach(i => i.collected = false);
          document.getElementById('chapter-title').innerText = "Chapter 2: The 1926 Yazoo Levee";
          document.getElementById('story-dialogue').innerText = "⚡ TIME-WARP SUCCESS! The sisters have warped to the 1926 Yazoo Levee. Gather 3 new temporal gears!";
          speak("Time warp complete. Welcome to 1926.");
        } else if (gameState.chapter === 2) {
          gameState.chapter = 3;
          gameState.era = 1952;
          gameState.gears = 0;
          gameState.assembled = false;
          items.forEach(i => i.collected = false);
          document.getElementById('chapter-title').innerText = "Chapter 3: The 1952 Michigan Archives";
          document.getElementById('story-dialogue').innerText = "⚡ FINAL TIME-WARP! The sisters have warped to the Michigan archives. Assemble the final clock!";
          speak("Final time warp. Welcome to 1952.");
        } else {
          gameState.chapter = 4;
          document.getElementById('chapter-title').innerText = "Victory: The Golden Timeline Restored!";
          document.getElementById('story-dialogue').innerText = "🌟 TIMELINE FULLY RESTORED! The Three Sisters have harmonized history across the ages. 'What is packed in the bone never fades from the marrow!'";
          speak("Victory! The golden clock and all three sisters have fully restored the legacy.");
        }
      }
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('stat-gears').innerText = gameState.gears;
      document.getElementById('stat-era').innerText = gameState.era;
      document.getElementById('stat-chap').innerText = Math.min(gameState.chapter, 3);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const goldenTreeImg = new Image();
    goldenTreeImg.src = 'packed-marrow-tree.png';

    let particles = [];
    for(let i=0; i<15; i++) {
      particles.push({ x: Math.random() * 600, y: Math.random() * 130, size: 2 + Math.random() * 2, speed: 0.4 + Math.random() * 0.5 });
    }

    function drawThreeSisters(x, y, dir) {
      ctx.save();
      ctx.translate(x, y);
      let bounce = dir !== 0 ? Math.sin(Date.now() * 0.015) * 3.5 : 0;
      ctx.translate(0, bounce);

      // Floor Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath(); ctx.ellipse(0, 44, 26, 6, 0, 0, Math.PI * 2); ctx.fill();

      // --- SISTER 1: ROSE (Left - Purple dress, white collar, hair ribbons) ---
      ctx.save();
      ctx.translate(-26, 2);
      // Purple Dress
      let dress1 = ctx.createLinearGradient(-9, 0, 9, 38);
      dress1.addColorStop(0, '#8b5cf6'); dress1.addColorStop(1, '#6d28d9');
      ctx.fillStyle = dress1; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(10, 38); ctx.lineTo(-10, 38); ctx.closePath(); ctx.fill();
      // White collar & sleeves
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, 2, 10, 5);
      // Skin tone & Head
      ctx.fillStyle = '#854d0e'; ctx.beginPath(); ctx.arc(0, -9, 8.5, 0, Math.PI * 2); ctx.fill();
      // Dark curly hair & side ribbons
      ctx.fillStyle = '#1e1b4b'; ctx.beginPath(); ctx.arc(0, -13, 9.5, Math.PI, 0, false); ctx.fill();
      ctx.fillStyle = '#f472b6'; ctx.fillRect(-12, -14, 4, 4); // Ribbon left
      ctx.restore();

      // --- SISTER 2: LUETTA (Center - Blue vintage dress with white lace collar, holding golden clock) ---
      ctx.save();
      ctx.translate(0, 0);
      // Elegant Blue dress
      let dress2 = ctx.createLinearGradient(-11, 0, 11, 42);
      dress2.addColorStop(0, '#3b82f6'); dress2.addColorStop(1, '#1d4ed8');
      ctx.fillStyle = dress2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(13, 42); ctx.lineTo(-13, 42); ctx.closePath(); ctx.fill();
      // White lace collar
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(8, 7); ctx.lineTo(-8, 7); ctx.closePath(); ctx.fill();
      // Skin tone & Head
      ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(0, -11, 9.5, 0, Math.PI * 2); ctx.fill();
      // Eyes & Hair
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-4.5, -14, 2.5, 2.5); ctx.fillRect(2, -14, 2.5, 2.5);
      ctx.fillStyle = '#1e1b4b'; ctx.beginPath(); ctx.arc(0, -15, 10.5, Math.PI, 0, false); ctx.fill();
      // Golden Clock held in hands
      ctx.save();
      ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(0, 18, 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(0, 18, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 15); ctx.lineTo(0, 18); ctx.lineTo(2, 20); ctx.stroke();
      ctx.restore();
      ctx.restore();

      // --- SISTER 3: FANNIE MAY (Right - Yellow dress with brown shoulder satchel) ---
      ctx.save();
      ctx.translate(26, 4);
      // Yellow Dress
      let dress3 = ctx.createLinearGradient(-9, 0, 9, 38);
      dress3.addColorStop(0, '#eab308'); dress3.addColorStop(1, '#ca8a04');
      ctx.fillStyle = dress3; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(10, 38); ctx.lineTo(-10, 38); ctx.closePath(); ctx.fill();
      // White collar
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, 2, 8, 4);
      // Brown Satchel Strap & Bag
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(7, 20); ctx.stroke();
      ctx.fillStyle = '#92400e'; ctx.fillRect(4, 18, 8, 7);
      // Skin tone & Head
      ctx.fillStyle = '#854d0e'; ctx.beginPath(); ctx.arc(0, -9, 8.5, 0, Math.PI * 2); ctx.fill();
      // Hair & Bow
      ctx.fillStyle = '#1e1b4b'; ctx.beginPath(); ctx.arc(0, -13, 9.5, Math.PI, 0, false); ctx.fill();
      ctx.fillStyle = '#eab308'; ctx.fillRect(8, -14, 4, 4); // Ribbon right
      ctx.restore();

      ctx.restore();
    }

    function gameLoop() {
      if (gameState.fannieDir !== 0) {
        gameState.fannieX += gameState.fannieDir * 3.5;
        if (gameState.fannieX < 50) gameState.fannieX = 50;
        if (gameState.fannieX > 530) gameState.fannieX = 530;
      }

      let skyGrad = ctx.createLinearGradient(0, 0, 0, 160);
      if (gameState.chapter === 2) {
        skyGrad.addColorStop(0, '#0369a1');
        skyGrad.addColorStop(1, '#38bdf8');
      } else if (gameState.chapter === 3) {
        skyGrad.addColorStop(0, '#7c2d12');
        skyGrad.addColorStop(1, '#ea580c');
      } else if (gameState.chapter >= 4) {
        skyGrad.addColorStop(0, '#f59e0b');
        skyGrad.addColorStop(1, '#fef08a');
      } else {
        skyGrad.addColorStop(0, '#1e1b4b');
        skyGrad.addColorStop(0.5, '#312e81');
        skyGrad.addColorStop(1, '#4338ca');
      }
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fef08a';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = 150;
        ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Golden Tree Landmark
      ctx.save();
      ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 40;
      if (goldenTreeImg.complete) {
        ctx.drawImage(goldenTreeImg, 245, 18, 135, 145);
      }
      ctx.restore();

      // Floor Platform
      let floorGrad = ctx.createLinearGradient(0, 150, 0, 270);
      floorGrad.addColorStop(0, gameState.chapter >= 4 ? '#22c55e' : '#334155');
      floorGrad.addColorStop(1, gameState.chapter >= 4 ? '#15803d' : '#0f172a');
      ctx.fillStyle = floorGrad;
      ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(canvas.width, 150); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

      // Render Golden Gears
      items.forEach(item => {
        if (!item.collected) {
          ctx.save();
          ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 15;
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath(); ctx.arc(item.x, item.y + 8, 12, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath(); ctx.arc(item.x, item.y + 8, 5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      });

      drawThreeSisters(gameState.fannieX, 118, gameState.fannieDir);

      requestAnimationFrame(gameLoop);
    }

    goldenTreeImg.onload = () => { gameLoop(); };
    gameLoop();
  </script>
</body>
</html>
