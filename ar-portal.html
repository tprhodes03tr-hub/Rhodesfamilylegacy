<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancestral Vanguard • AR Portal Gateway</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- MindAR Library -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #04060b;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(4, 6, 11, 0.9);
      border: 1px solid #66fcf1;
      padding: 12px 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(102, 252, 241, 0.35);
      pointer-events: none;
      max-width: 90%;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 900;
      color: #66fcf1;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hud-subtitle {
      font-size: 11px;
      color: #f59e0b;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .ar-mode-selector {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .mode-btn {
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    .mode-btn.active {
      background: #66fcf1;
      color: #04060b;
    }
    .back-btn {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
    }
    .back-btn:hover {
      background: rgba(102, 252, 241, 0.1);
    }
  </style>
</head>
<body>

  <div class="hud-overlay">
    <div id="portal-title" class="hud-title">Ancestral Vanguard Portal</div>
    <div id="portal-subtitle" class="hud-subtitle">"Welcome to Rhodes Family Legacy. Which path would you like to choose?" — Mother Luetta</div>
  </div>

  <!-- Mode Selector for Single-Phone Users -->
  <div class="ar-mode-selector">
    <button id="btnImageMode" onclick="setARMode('image')" class="mode-btn active">Scan Image Target</button>
    <button id="btnWorldMode" onclick="setARMode('world')" class="mode-btn">Place on Table (1-Phone Mode)</button>
  </div>

  <!-- Return Link to Master Hub -->
  <a href="index.html" class="back-btn">← Return to Master Hub</a>

  <!-- A-Frame Scene Container -->
  <div id="sceneContainer" style="width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;">
    <a-scene id="arScene" embedded mindar-image="imageTargetSrc: targets.mind; autoStart: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="mother-luta-img" src="mother-luta.png" crossorigin="anonymous">
        <!-- Asset item for the GLB model -->
        <a-asset-item id="goldenTreeModel" src="golden-tree.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Entity for MindAR Image Index 0 (Used in Image Mode) -->
      <a-entity id="trackedTarget" mindar-image-target="targetIndex: 0">
        <!-- Actual 3D GLB Golden Tree Model & Framing Rings -->
        <a-entity id="gatewayModel" position="0 0 0" scale="0.4 0.4 0.4">
          <!-- Your 3D Family Crest Tree -->
          <a-gltf-model src="#goldenTreeModel" position="0 0 0" scale="1 1 1"></a-gltf-model>

          <!-- Outer Golden Tree Ring Gateway -->
          <a-torus radius="1.8" radius-tubular="0.04" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 0.8; roughness: 0.2" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-torus>

          <!-- Outer Teal Resonance Ring -->
          <a-torus radius="2.0" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 0.6" animation="property: rotation; to: 360 0 360; loop: true; dur: 15000"></a-torus>
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
      <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="1.2"></a-light>
    </a-scene>
  </div>

  <script>
    // 1. Dynamic Parameter Reader for Book & Card Modes
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');

    const titleEl = document.getElementById('portal-title');
    const subtitleEl = document.getElementById('portal-subtitle');

    if (mode === 'children') {
      if (titleEl) titleEl.innerText = "Storybook Meadow • Little Luetta & Friends";
      if (subtitleEl) subtitleEl.innerText = `"Hi! Want to explore the golden clock time-slip with me?"`;
    } else if (mode === 'marrow') {
      if (titleEl) titleEl.innerText = "Packed in the Marrow • Archival Record";
      if (subtitleEl) subtitleEl.innerText = `"Welcome to Rhodes Family Legacy. Allow me to introduce our lineage records." — Mother Luetta`;
    } else if (mode === 'card-codex') {
      if (titleEl) titleEl.innerText = "Card Codex • Vanguard Battle Index";
      if (subtitleEl) subtitleEl.innerText = `"Flipping card target... Character operational status active." — Marcus Prime`;
    }

    // 2. AR Mode Switching (Image Target Scan vs. Single-Phone Tabletop View)
    function setARMode(arType) {
      const btnImage = document.getElementById('btnImageMode');
      const btnWorld = document.getElementById('btnWorldMode');
      const sceneContainer = document.getElementById('sceneContainer');

      if (arType === 'world') {
        btnWorld.classList.add('active');
        btnImage.classList.remove('active');

        // Rebuild scene container as a clean 3D interactive viewer with your golden-tree.glb model loaded
        sceneContainer.innerHTML = `
          <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="width: 100vw; height: 100vh; background: #030712;">
            <a-assets>
              <a-asset-item id="goldenTreeModelWorld" src="golden-tree.glb"></a-asset-item>
            </a-assets>
            <a-camera position="0 1.6 3" look-controls="enabled: true"></a-camera>
            
            <a-entity position="0 1.0 0" scale="0.45 0.45 0.45">
              <!-- Actual 3D GLB Golden Tree Model -->
              <a-gltf-model src="#goldenTreeModelWorld" position="0 0 0" scale="1 1 1"></a-gltf-model>

              <!-- Golden Tree Ring Gateway -->
              <a-torus radius="1.8" radius-tubular="0.04" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 0.8; roughness: 0.2" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-torus>
              <!-- Teal Resonance Ring -->
              <a-torus radius="2.0" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 0.6" animation="property: rotation; to: 360 0 360; loop: true; dur: 15000"></a-torus>
            </a-entity>

            <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
            <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="1.4"></a-light>
          </a-scene>
        `;

        if (subtitleEl) subtitleEl.innerText = "[3D TABLETOP MODE] Rotate & explore your family golden tree freely!";
      } else {
        window.location.reload(); // Reset back to image target scanning
      }
    }
  </script>

</body>
</html>
