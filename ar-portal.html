<a-scene embedded mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: yes; uiScanning: yes;" renderer="colorManagement: true, physicallyCorrectLights; alpha: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
    <a-assets>
        <!-- Preload your illustrated video -->
        <video id="book-video" src="./ancestral-lineage-origin.mp4" preload="auto" response-type="arraybuffer" loop crossorigin webkit-playsinline playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- First Book Cover Target (*Little Fannie May*) -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-0">
        <!-- Video plane that sits on top of the book cover -->
        <a-video src="#book-video" position="0 0 0" width="1" height="1.4" rotation="0 0 0"></a-video>
    </a-entity>

    <!-- Second Book Cover Target (*The Sisters of the Golden Clock*) -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-1">
        <!-- Placeholder or secondary video asset -->
        <a-plane position="0 0 0" height="1" width="1" material="color: #1e293b; transparent: true; opacity: 0.8"></a-plane>
    </a-entity>
</a-scene>

<script>
    // Automatically play the video when the target is found, pause when lost
    const target0 = document.querySelector('#target-0');
    const videoEl = document.querySelector('#book-video');

    target0.addEventListener('targetFound', () => {
        videoEl.play();
    });

    target0.addEventListener('targetLost', () => {
        videoEl.pause();
    });
</script>
