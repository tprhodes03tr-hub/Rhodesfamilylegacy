<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhodes Family Legacy - AR Living Portal</title>
    <!-- Include A-Frame and MindAR Image Tracking Libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
        }
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .legacy-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
            width: 100%;
        }
        .legacy-btn:active {
            background-color: #2ea043;
        }
        .instruction-text {
            background: rgba(13, 17, 23, 0.85);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- UI Overlay for Instructions and Controls -->
    <div id="ui-overlay">
        <div class="instruction-text">
            Point your camera at the <strong>Golden Tree</strong> book cover or digital illustration to bring it to life!
        </div>
        <button class="legacy-btn" onclick="startARExperience()">Launch Living AR Tree</button>
    </div>

    <!-- AR Scene Container -->
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Preload your 3D Golden Tree model (.gltf or .glb) -->
            <a-asset-item id="goldenTreeModel" src="./assets/golden-tree.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target Entity mapping to your target image index -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- 3D Model displayed upon recognizing the target image -->
            <a-gltf-model src="#goldenTreeModel" 
                          position="0 -0.25 0" 
                          scale="0.5 0.5 0.5" 
                          rotation="0 0 0"
                          animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear;">
            </a-gltf-model>
            
            <!-- Warm golden ambient glow matching your book theme -->
            <a-light type="point" color="#ffd700" intensity="1.5" position="0 1 1"></a-light>

            <!-- Mother Luetta's AR Speech Prompt -->
            <a-text value="Welcome to Rhodes Family Legacy.\nWhich path would you like to choose?" 
                    position="0 1.2 0" 
                    align="center" 
                    color="#ffd700" 
                    width="2.5">
            </a-text>
        </a-entity>

    </a-scene>

    <script>
        function startARExperience() {
            // Hides the UI overlay and starts the MindAR scene engine
            document.getElementById('ui-overlay').style.display = 'none';
            const sceneEl = document.querySelector('a-scene');
            sceneEl.systems["mindar-image-system"].start();
        }
    </script>

</body>
</html>
