<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancestral Vanguard • Holographic AR Gateway</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- MindAR Library -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    /* Live Camera Background Feed for Tabletop AR Mode */
    #arCameraFeed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* Holographic Scanline Overlay on Screen */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 998;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      opacity: 0.4;
    }

    /* Sleek Collapsible Intel Toggle Button */
    .intel-toggle-btn {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
      pointer-events: auto;
    }
    .intel-toggle-btn:hover {
      background: rgba(102, 252, 241, 0.15);
    }

    /* Collapsible HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(3, 7, 18, 0.95);
      border: 1px solid #f59e0b;
      padding: 14px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
      pointer-events: auto;
      max-width: 92%;
      width: 480px;
      display: none; /* Hidden by default */
    }
    .hud-title {
      font-size: 13px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }
    .hud-subtitle {
      font-size: 11px;
      color: #66fcf1;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(102, 252, 241, 0.5);
    }

    /* Holographic Q&A Input Bar with Live Mic Button */
    .qa-container {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    .qa-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 8px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      border-radius: 6px;
      outline: none;
    }
    .qa-input::placeholder {
      color: rgba(56, 189, 248, 0.4);
    }
    .qa-mic-btn {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px 10px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .qa-btn {
      background: #f59e0b;
      border: 1px solid #f59e0b;
      color: #030712;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .qa-btn:hover {
      background: #d97706;
    }

    .ar-mode-selector {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .mode-btn {
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    .mode-btn.active {
      background: #66fcf1;
      color: #04060b;
    }
    .back-btn {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
    }
    .back-btn:hover {
      background: rgba(102, 252, 241, 0.1);
    }
  </style>

  <!-- Custom Holographic Material Shaders -->
  <script>
    AFRAME.registerComponent('hologram-glow', {
      init: function () {
        this.el.addEventListener('loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.traverse(node => {
              if (node.material) {
                node.material.transparent = true;
                node.material.opacity = 0.92;
                node.material.roughness = 0.1;
                node.material.metalness = 0.9;
              }
            });
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Live Camera Feed Element for Tabletop AR Passthrough -->
  <video id="arCameraFeed" autoplay playsinline muted></video>

  <!-- Collapsible Intel Toggle Button -->
  <button id="intelToggleBtn" class="intel-toggle-btn" onclick="toggleHUD()">[+] Open Codex Chat & Intel</button>

  <!-- HUD Overlay Box -->
  <div id="hudOverlay" class="hud-overlay">
    <div id="portal-title" class="hud-title">Mother Luetta • Living Codex AR</div>
    <div id="portal-subtitle" class="hud-subtitle">"Welcome to Rhodes Family Legacy. Which path would you like to choose?"</div>
    
    <div class="qa-container">
      <input type="text" id="visitorQuery" class="qa-input" placeholder="Ask Mother Luetta in AR..." onkeypress="handleQAPress(event)">
      <button id="arMicBtn" class="qa-mic-btn" onclick="toggleARSpeechRecognition()" title="Voice Dictation">🎤</button>
      <button class="qa-btn" onclick="submitVisitorQuestion()">Ask</button>
    </div>
  </div>

  <!-- Mode Selector -->
  <div class="ar-mode-selector">
    <button id="btnImageMode" onclick="setARMode('image')" class="mode-btn active">Scan Target</button>
    <button id="btnWorldMode" onclick="setARMode('world')" class="mode-btn">Tabletop Counter</button>
  </div>

  <!-- Return Link -->
  <a href="index.html" class="back-btn">← Return to Master Hub</a>

  <!-- A-Frame Scene Container -->
  <div id="sceneContainer" style="width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2;">
    <a-scene id="arScene" embedded mindar-image="imageTargetSrc: targets.mind; autoStart: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="familyTreeImg" src="packed-marrow-tree.png" crossorigin="anonymous">
        <img id="motherLuettaImg" src="mother-luta.png" crossorigin="anonymous">
        <img id="marcusImg" src="marcus.png" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: [raycastable]"></a-camera>

      <!-- MindAR Image Target Mode (Default for Book Covers) -->
      <a-entity id="trackedTarget" mindar-image-target="targetIndex: 0">
        <a-entity id="gatewayModel" position="0 0 0" scale="0.45 0.45 0.45">
          <a-image id="centerEmblem" src="#familyTreeImg" width="2.6" height="2.6" position="0 0.2 0" material="transparent: true; alphaTest: 0.1; emissive: #f59e0b; emissiveIntensity: 0.4;" animation="property: scale; to: 1.03 1.03 1.03; dir: alternate; dur: 3000; loop: true"></a-image>
          <a-image id="companionSprite" class="clickable" src="#motherLuettaImg" width="1.3" height="1.7" position="1.4 -0.1 0.15" material="transparent: true; alphaTest: 0.1; color: #bfe9ff;" raycastable onclick="triggerCompanionDialogue()" animation="property: position; to: 1.4 0.05 0.15; dir: alternate; dur: 2200; loop: true"></a-image>
          <a-torus radius="1.85" radius-tubular="0.045" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 1.0; roughness: 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000"></a-torus>
          <a-torus radius="2.1" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 0.8; transparent: true; opacity: 0.9" animation="property: rotation; to: 360 0 360; loop: true; dur: 13000"></a-torus>
          <a-ring radius-inner="1.6" radius-outer="1.75" color="#66fcf1" rotation="-90 0 0" position="0 -1.2 0" material="emissive: #66fcf1; emissiveIntensity: 0.6; transparent: true; opacity: 0.5"></a-ring>
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#bfe9ff" intensity="1.2"></a-light>
      <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="1.8"></a-light>
    </a-scene>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');

    const titleEl = document.getElementById('portal-title');
    const subtitleEl = document.getElementById('portal-subtitle');

    window.addEventListener('DOMContentLoaded', () => {
      const spriteEl = document.getElementById('companionSprite');

      if (mode === 'vanguard' || mode === 'card-codex') {
        if (titleEl) titleEl.innerText = "Ancestral Vanguard • AR Ops";
        if (subtitleEl) subtitleEl.innerText = `"Marcus Prime online. Sector 313 defense grid active."`;
        if (spriteEl) spriteEl.setAttribute('src', '#marcusImg');
      } else if (mode === 'children') {
        if (titleEl) titleEl.innerText = "Storybook Meadow • AR Quest";
        if (subtitleEl) subtitleEl.innerText = `"Hi! Want to explore the golden clock time-slip with me?"`;
      } else if (mode === 'marrow') {
        if (titleEl) titleEl.innerText = "Packed in the Marrow • AR Archival Gateway";
        if (subtitleEl) subtitleEl.innerText = `"Welcome to Rhodes Family Legacy. Allow me to introduce our lineage records." — Mother Luetta`;
      }
    });

    function toggleHUD() {
      const hud = document.getElementById('hudOverlay');
      const btn = document.getElementById('intelToggleBtn');
      if (hud.style.display === 'block') {
        hud.style.display = 'none';
        btn.innerText = '[+] Open Codex Chat & Intel';
      } else {
        hud.style.display = 'block';
        btn.innerText = '[-] Close Codex Chat';
      }
    }

    const dialogueLines = {
      vanguard: [
        `"Marcus Prime online. Sector 313 defense grid active."`,
        `"The Vanguard fleet stands ready to defend the timeline."`,
        `"Stay sharp, Commander. The motor city ops are secure."`
      ],
      children: [
        `"Hi! Want to explore the golden clock time-slip with me?"`,
        `"Every great adventure starts with a curious heart and a touch of courage."`,
        `"Let's see what wonders are waiting in the meadow today!"`
      ],
      marrow: [
        `"Welcome to Rhodes Family Legacy. Allow me to introduce our lineage records."`,
        `"Every name, veteran, and matriarch is rooted in deep strength."`,
        `"Keep the archival records close; our history is our power."`
      ],
      default: [
        `"Welcome to the Vanguard Universe. Which path would you like to choose?"`,
        `"The golden tree bridges our past, present, and future."`,
        `"Tap again whenever you wish to hear more of our legacy."`
      ]
    };

    let currentLineIndex = 0;

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/["—]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 1.0;
        utterance.pitch = (mode === 'vanguard') ? 0.8 : 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerCompanionDialogue() {
      const activeMode = mode || 'default';
      const lines = dialogueLines[activeMode] || dialogueLines.default;

      currentLineIndex = (currentLineIndex + 1) % lines.length;
      const selectedLine = lines[currentLineIndex];
      
      if (subtitleEl) subtitleEl.innerText = selectedLine;
      speakText(selectedLine);
      toggleARSpeechRecognition();
    }

    function processARAIQuery(query) {
      const qLower = query.toLowerCase();
      let answer = "";

      if (qLower.includes("time") || qLower.includes("clock")) {
        const now = new Date();
        answer = `Current planetary telemetry time is ${now.toLocaleTimeString()}.`;
      } else if (qLower.includes("weather") || qLower.includes("temperature")) {
        answer = "Atmospheric sensors report calm sector conditions in AR space.";
      } else if (qLower.includes("book") || qLower.includes("marrow") || qLower.includes("read")) {
        answer = "Packed in the Marrow explores our family history. Acquire full volumes on our Payhip storefront!";
      } else if (qLower.includes("game") || qLower.includes("arcade")) {
        answer = "Launch Isaac's Sandbox, Detroit 313 Grid racer, or Wacon Sub from our master hub.";
      } else {
        answer = `Welcome to Rhodes Family Legacy. I am Mother Luetta, your AR guide. How may I assist your journey?`;
      }

      if (subtitleEl) subtitleEl.innerText = answer;
      speakText(answer);
    }

    function submitVisitorQuestion() {
      const inputEl = document.getElementById('visitorQuery');
      if (!inputEl) return;
      const question = inputEl.value.trim();
      if (!question) return;

      processARAIQuery(question);
      inputEl.value = "";
    }

    function handleQAPress(event) {
      if (event.key === 'Enter') {
        submitVisitorQuestion();
      }
    }

    let arRecognition = null;
    let arIsListening = false;

    function toggleARSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) return;

      if (!arRecognition) {
        arRecognition = new SpeechRecognition();
        arRecognition.lang = 'en-US';
        arRecognition.interimResults = false;
        arRecognition.maxAlternatives = 1;

        arRecognition.onstart = () => {
          arIsListening = true;
          const micBtn = document.getElementById('arMicBtn');
          if (micBtn) {
            micBtn.style.background = '#ef4444';
            micBtn.innerText = '🔴';
          }
        };

        arRecognition.onresult = (event) => {
          const speechToText = event.results[0][0].transcript;
          const inputEl = document.getElementById('visitorQuery');
          if (inputEl) inputEl.value = speechToText;
          processARAIQuery(speechToText);
        };

        arRecognition.onerror = () => { stopARListeningState(); };
        arRecognition.onend = () => { stopARListeningState(); };
      }

      if (arIsListening) {
        arRecognition.stop();
      } else {
        arRecognition.start();
      }
    }

    function stopARListeningState() {
      arIsListening = false;
      const micBtn = document.getElementById('arMicBtn');
      if (micBtn) {
        micBtn.style.background = '#1e293b';
        micBtn.innerText = '🎤';
      }
    }

    // Switch between Target Scanning and Clean Tabletop Hologram Mode
    async function setARMode(arType) {
      const btnImage = document.getElementById('btnImageMode');
      const btnWorld = document.getElementById('btnWorldMode');
      const sceneContainer = document.getElementById('sceneContainer');
      const videoFeed = document.getElementById('arCameraFeed');
      const activeSpriteSrc = (mode === 'vanguard' || mode === 'card-codex') ? 'marcus.png' : 'mother-luta.png';

      if (arType === 'world') {
        btnWorld.classList.add('active');
        btnImage.classList.remove('active');

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          videoFeed.srcObject = stream;
          videoFeed.style.display = 'block';
        } catch (err) {
          console.log("Camera passthrough initialized.");
        }

        // Clean standalone tabletop scene without scanner lines
        sceneContainer.innerHTML = `
          <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="width: 100vw; height: 100vh; background: transparent;">
            <a-assets>
              <img id="familyTreeImgWorld" src="packed-marrow-tree.png" crossorigin="anonymous">
              <img id="motherLuettaImgWorld" src="${activeSpriteSrc}" crossorigin="anonymous">
            </a-assets>
            <a-camera position="0 1.0 1.8" look-controls="enabled: true" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: [raycastable]"></a-camera>
            
            <a-entity position="0 -0.4 -0.6" rotation="0 0 0" scale="0.42 0.42 0.42">
              <a-image src="#familyTreeImgWorld" width="2.6" height="2.6" position="0 0.2 0" material="transparent: true; alphaTest: 0.1; emissive: #f59e0b; emissiveIntensity: 0.5;" animation="property: scale; to: 1.03 1.03 1.03; dir: alternate; dur: 3000; loop: true"></a-image>

              <a-image id="companionSpriteWorld" class="clickable" src="#motherLuettaImgWorld" width="1.3" height="1.7" position="1.4 -0.1 0.15" material="transparent: true; alphaTest: 0.1; color: #bfe9ff;" raycastable onclick="triggerCompanionDialogue()" animation="property: position; to: 1.4 0.05 0.15; dir: alternate; dur: 2200; loop: true"></a-image>

              <a-torus radius="1.85" radius-tubular="0.045" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 1.2; roughness: 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000"></a-torus>
              <a-torus radius="2.1" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 1.0; transparent: true; opacity: 0.95" animation="property: rotation; to: 360 0 360; loop: true; dur: 13000"></a-torus>
            </a-entity>

            <a-light type="ambient" color="#bfe9ff" intensity="1.4"></a-light>
            <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="2.2"></a-light>
          </a-scene>
        `;

        if (subtitleEl) subtitleEl.innerText = "[TABLETOP AR ACTIVE] Tap Mother Luetta to talk!";
      } else {
        if (videoFeed.srcObject) {
          videoFeed.srcObject.getTracks().forEach(track => track.stop());
        }
        window.location.reload();
      }
    }
  </script>

</body>
</html>
