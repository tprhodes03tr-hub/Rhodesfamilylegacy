<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancestral Vanguard • Holographic AR Gateway</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- MindAR Library -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    /* Live Camera Background Feed for Tabletop AR Mode */
    #arCameraFeed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* Holographic Scanline Overlay on Screen */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 998;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      opacity: 0.4;
    }

    /* Sleek Collapsible Intel Toggle Button */
    .intel-toggle-btn {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
      pointer-events: auto;
    }
    .intel-toggle-btn:hover {
      background: rgba(102, 252, 241, 0.15);
    }

    /* Collapsible HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(3, 7, 18, 0.92);
      border: 1px solid #66fcf1;
      padding: 14px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(102, 252, 241, 0.35);
      pointer-events: auto;
      max-width: 92%;
      width: 480px;
      display: none; /* Hidden by default for full-screen showcase */
    }
    .hud-title {
      font-size: 13px;
      font-weight: 900;
      color: #66fcf1;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(102, 252, 241, 0.6);
    }
    .hud-subtitle {
      font-size: 11px;
      color: #f59e0b;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    }

    /* Holographic Q&A Input Bar */
    .qa-container {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    .qa-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #66fcf1;
      color: #66fcf1;
      padding: 6px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      border-radius: 6px;
      outline: none;
    }
    .qa-input::placeholder {
      color: rgba(102, 252, 241, 0.4);
    }
    .qa-btn {
      background: #8b0000;
      border: 1px solid #f59e0b;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .qa-btn:hover {
      background: #a51c1c;
    }

    .ar-mode-selector {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .mode-btn {
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    .mode-btn.active {
      background: #66fcf1;
      color: #04060b;
    }
    .back-btn {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
    }
    .back-btn:hover {
      background: rgba(102, 252, 241, 0.1);
    }
  </style>

  <!-- Custom Holographic & Glowing Material Shaders for A-Frame -->
  <script>
    AFRAME.registerComponent('hologram-glow', {
      init: function () {
        this.el.addEventListener('loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.traverse(node => {
              if (node.material) {
                node.material.transparent = true;
                node.material.opacity = 0.92;
                node.material.roughness = 0.1;
                node.material.metalness = 0.9;
              }
            });
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Live Camera Feed Element for Room Passthrough -->
  <video id="arCameraFeed" autoplay playsinline muted></video>

  <!-- Collapsible Intel Toggle Button -->
  <button id="intelToggleBtn" class="intel-toggle-btn" onclick="toggleHUD()">[+] Open Intel</button>

  <!-- HUD Overlay Box (Collapsible) -->
  <div id="hudOverlay" class="hud-overlay">
    <div id="portal-title" class="hud-title">Ancestral Vanguard Portal</div>
    <div id="portal-subtitle" class="hud-subtitle">"Welcome to Rhodes Family Legacy. Which path would you like to choose?" — Mother Luetta</div>
    
    <!-- Q&A Hologram Interaction Bar -->
    <div class="qa-container">
      <input type="text" id="visitorQuery" class="qa-input" placeholder="Ask the portal a question..." onkeypress="handleQAPress(event)">
      <button class="qa-btn" onclick="submitVisitorQuestion()">Ask AI</button>
    </div>
  </div>

  <!-- Mode Selector -->
  <div class="ar-mode-selector">
    <button id="btnImageMode" onclick="setARMode('image')" class="mode-btn active">Scan Target</button>
    <button id="btnWorldMode" onclick="setARMode('world')" class="mode-btn">Tabletop 3D</button>
  </div>

  <!-- Return Link -->
  <a href="index.html" class="back-btn">← Return to Master Hub</a>

  <!-- A-Frame Scene Container -->
  <div id="sceneContainer" style="width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2;">
    <a-scene id="arScene" embedded mindar-image="imageTargetSrc: targets.mind; autoStart: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="familyTreeImg" src="packed-marrow-tree.png" crossorigin="anonymous">
        <img id="motherLuettaImg" src="mother-luta.png" crossorigin="anonymous">
        <img id="marcusImg" src="marcus.png" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: [raycastable]"></a-camera>

      <!-- Target Entity for MindAR Image Index 0 (No Viewfinder Brackets) -->
      <a-entity id="trackedTarget" mindar-image-target="targetIndex: 0">
        
        <!-- Upgraded Holographic Gateway Entity -->
        <a-entity id="gatewayModel" position="0 0 0" scale="0.45 0.45 0.45">
          
          <!-- Dynamic Center Emblem (Swapped based on Mode) -->
          <a-image id="centerEmblem" src="#familyTreeImg" width="2.6" height="2.6" position="0 0.2 0" material="transparent: true; alphaTest: 0.1; emissive: #f59e0b; emissiveIntensity: 0.4;" animation="property: scale; to: 1.03 1.03 1.03; dir: alternate; dur: 3000; loop: true"></a-image>

          <!-- Dynamic Holographic Character Companion (Tappable for Audio Feedback) -->
          <a-image id="companionSprite" class="clickable" src="#motherLuettaImg" width="1.3" height="1.7" position="1.4 -0.1 0.15" material="transparent: true; alphaTest: 0.1; color: #bfe9ff;" raycastable onclick="triggerCompanionDialogue()" animation="property: position; to: 1.4 0.05 0.15; dir: alternate; dur: 2200; loop: true"></a-image>

          <!-- Outer Golden Tree Ring Gateway -->
          <a-torus radius="1.85" radius-tubular="0.045" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 1.0; roughness: 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000"></a-torus>

          <!-- Outer Teal Resonance Ring -->
          <a-torus radius="2.1" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 0.8; transparent: true; opacity: 0.9" animation="property: rotation; to: 360 0 360; loop: true; dur: 13000"></a-torus>

          <!-- Holographic Base Floor Glow Ring -->
          <a-ring radius-inner="1.6" radius-outer="1.75" color="#66fcf1" rotation="-90 0 0" position="0 -1.2 0" material="emissive: #66fcf1; emissiveIntensity: 0.6; transparent: true; opacity: 0.5"></a-ring>
        </a-entity>

      </a-entity>

      <a-light type="ambient" color="#bfe9ff" intensity="1.2"></a-light>
      <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="1.8"></a-light>
    </a-scene>
  </div>

  <script>
    // 1. Dynamic Parameter Reader for Book & Vanguard Modes
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');

    const titleEl = document.getElementById('portal-title');
    const subtitleEl = document.getElementById('portal-subtitle');

    // Apply Mode Configuration on Load
    window.addEventListener('DOMContentLoaded', () => {
      const spriteEl = document.getElementById('companionSprite');

      if (mode === 'vanguard' || mode === 'card-codex') {
        if (titleEl) titleEl.innerText = "Ancestral Vanguard • Motor City Ops";
        if (subtitleEl) subtitleEl.innerText = `"Marcus Prime online. Sector 313 defense grid active." — Marcus Prime`;
        if (spriteEl) spriteEl.setAttribute('src', '#marcusImg');
      } else if (mode === 'children') {
        if (titleEl) titleEl.innerText = "Storybook Meadow • Little Luetta & Friends";
        if (subtitleEl) subtitleEl.innerText = `"Hi! Want to explore the golden clock time-slip with me?"`;
      } else if (mode === 'marrow') {
        if (titleEl) titleEl.innerText = "Packed in the Marrow • Archival Record";
        if (subtitleEl) subtitleEl.innerText = `"Welcome to Rhodes Family Legacy. Allow me to introduce our lineage records." — Mother Luetta`;
      }
    });

    // Toggle HUD Open / Close for Full-Screen View
    function toggleHUD() {
      const hud = document.getElementById('hudOverlay');
      const btn = document.getElementById('intelToggleBtn');
      if (hud.style.display === 'block') {
        hud.style.display = 'none';
        btn.innerText = '[+] Open Intel';
      } else {
        hud.style.display = 'block';
        btn.innerText = '[-] Close Intel';
      }
    }

    // 2. Interactive Intelligent Q&A & Lore Dialogue Engine
    const dialogueLines = {
      vanguard: [
        `"Marcus Prime online. Sector 313 defense grid active."`,
        `"The Vanguard fleet stands ready to defend the timeline."`,
        `"Stay sharp, Commander. The motor city ops are secure."`
      ],
      children: [
        `"Hi! Want to explore the golden clock time-slip with me?"`,
        `"Every great adventure starts with a curious heart and a touch of courage."`,
        `"Let's see what wonders are waiting in the meadow today!"`
      ],
      marrow: [
        `"Welcome to Rhodes Family Legacy. Allow me to introduce our lineage records."`,
        `"Every name, veteran, and matriarch is rooted in deep strength."`,
        `"Keep the archival records close; our history is our power."`
      ],
      default: [
        `"Welcome to the Vanguard Universe. Which path would you like to choose?"`,
        `"The golden tree bridges our past, present, and future."`,
        `"Tap again whenever you wish to hear more of our legacy."`
      ]
    };

    let currentLineIndex = 0;

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/["—]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 1.0;
        utterance.pitch = (mode === 'vanguard') ? 0.8 : 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerCompanionDialogue() {
      const activeMode = mode || 'default';
      const lines = dialogueLines[activeMode] || dialogueLines.default;

      currentLineIndex = (currentLineIndex + 1) % lines.length;
      const selectedLine = lines[currentLineIndex];
      
      if (subtitleEl) subtitleEl.innerText = selectedLine;
      speakText(selectedLine);
    }

    function submitVisitorQuestion() {
      const inputEl = document.getElementById('visitorQuery');
      if (!inputEl) return;
      const question = inputEl.value.trim().toLowerCase();
      if (!question) return;

      let answer = "";

      if (mode === 'vanguard') {
        if (question.includes("grid") || question.includes("Detroit") || question.includes("race")) {
          answer = `"Detroit Grid 313 is fully operational. The RenCen rooftop is secure against drone incursions!"`;
        } else if (question.includes("vanguard") || question.includes("fleet") || question.includes("fight")) {
          answer = `"The Vanguard fleet is standing by for deployment across the multiverse."`;
        } else {
          answer = `"Affirmative, Commander. Keep your focus on the mission parameters."`;
        }
      } else {
        if (question.includes("book") || question.includes("marrow") || question.includes("read")) {
          answer = `"Packed in the Marrow explores our multi-volume family history and Detroit roots. Find all volumes on Payhip!"`;
        } else if (question.includes("game") || question.includes("arcade") || question.includes("brawler")) {
          answer = `"Our arcade portals feature the Ancestral Vanguard Brawler and Detroit Grid Racer. Jump into the command deck to play!"`;
        } else {
          answer = `"That is a profound question, traveler. The golden tree holds many secrets across our transmedia universe."`;
        }
      }

      if (subtitleEl) subtitleEl.innerText = answer;
      speakText(answer);
      inputEl.value = "";
    }

    function handleQAPress(event) {
      if (event.key === 'Enter') {
        submitVisitorQuestion();
      }
    }

    // 3. AR Mode Switching with Full-Screen Room Passthrough
    async function setARMode(arType) {
      const btnImage = document.getElementById('btnImageMode');
      const btnWorld = document.getElementById('btnWorldMode');
      const sceneContainer = document.getElementById('sceneContainer');
      const videoFeed = document.getElementById('arCameraFeed');
      const activeSpriteSrc = (mode === 'vanguard' || mode === 'card-codex') ? '#marcusImgWorld' : '#motherLuettaImgWorld';

      if (arType === 'world') {
        btnWorld.classList.add('active');
        btnImage.classList.remove('active');

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          videoFeed.srcObject = stream;
          videoFeed.style.display = 'block';
        } catch (err) {
          console.log("Camera passthrough simulated.");
        }

        sceneContainer.innerHTML = `
          <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="width: 100vw; height: 100vh; background: transparent;">
            <a-assets>
              <img id="familyTreeImgWorld" src="packed-marrow-tree.png" crossorigin="anonymous">
              <img id="motherLuettaImgWorld" src="mother-luta.png" crossorigin="anonymous">
              <img id="marcusImgWorld" src="marcus.png" crossorigin="anonymous">
            </a-assets>
            <a-camera position="0 1.6 3" look-controls="enabled: true" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: [raycastable]"></a-camera>
            
            <a-entity position="0 1.0 0" scale="0.5 0.5 0.5">
              <!-- Center Emblem -->
              <a-image src="#familyTreeImgWorld" width="2.6" height="2.6" position="0 0.2 0" material="transparent: true; alphaTest: 0.1; emissive: #f59e0b; emissiveIntensity: 0.5;" animation="property: scale; to: 1.03 1.03 1.03; dir: alternate; dur: 3000; loop: true"></a-image>

              <!-- Character Sprite (Tappable for Voice Feedback) -->
              <a-image id="companionSpriteWorld" class="clickable" src="${activeSpriteSrc}" width="1.3" height="1.7" position="1.4 -0.1 0.15" material="transparent: true; alphaTest: 0.1; color: #bfe9ff;" raycastable onclick="triggerCompanionDialogue()" animation="property: position; to: 1.4 0.05 0.15; dir: alternate; dur: 2200; loop: true"></a-image>

              <!-- Golden Ring -->
              <a-torus radius="1.85" radius-tubular="0.045" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 1.2; roughness: 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000"></a-torus>
              <!-- Teal Resonance Ring -->
              <a-torus radius="2.1" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 1.0; transparent: true; opacity: 0.95" animation="property: rotation; to: 360 0 360; loop: true; dur: 13000"></a-torus>
            </a-entity>

            <a-light type="ambient" color="#bfe9ff" intensity="1.3"></a-light>
            <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="2.0"></a-light>
          </a-scene>
        `;

        if (subtitleEl) subtitleEl.innerText = "[FULLSCREEN PASSTHROUGH] Tap Marcus or open intel!";
      } else {
        if (videoFeed.srcObject) {
          videoFeed.srcObject.getTracks().forEach(track => track.stop());
        }
        window.location.reload();
      }
    }
  </script>

</body>
</html>
