<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancestral Vanguard • AR Portal Gateway</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- MindAR Library -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #04060b;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(4, 6, 11, 0.85);
      border: 1px solid #66fcf1;
      padding: 10px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
      pointer-events: none;
    }
    .hud-title {
      font-size: 12px;
      font-weight: 900;
      color: #66fcf1;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hud-subtitle {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .back-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: #0f172a;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
    }
    .back-btn:hover {
      background: rgba(102, 252, 241, 0.1);
    }
  </style>
</head>
<body>

  <div class="hud-overlay">
    <div class="hud-title">Golden Tree Portal Gateway</div>
    <div class="hud-subtitle">Mother Luetta Legacy Field • Active</div>
  </div>

  <a href="index.html" class="back-btn">← Return to Master Hub</a>

  <!-- A-Frame Scene with MindAR -->
  <a-scene embedded mindar-image="imageTargetSrc: #;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <!-- Fallback texture assets can go here -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Auto-Spawned Golden Tree Portal Entity (Visible immediately as fallback) -->
    <a-entity position="0 0 -2.5">
      <!-- Portal Ring / Gateway Frame -->
      <a-torus radius="1.2" radius-tubular="0.04" color="#f59e0b" rotation="0 0 0" material="emissive: #f59e0b; emissiveIntensity: 0.8; roughness: 0.2">
        <a-animation attribute="rotation" dur="10000" fill="forwards" to="0 360 0" repeat="indefinite"></a-animation>
      </a-torus>

      <!-- Outer Teal Resonance Ring -->
      <a-torus radius="1.4" radius-tubular="0.02" color="#66fcf1" rotation="45 45 0" material="emissive: #66fcf1; emissiveIntensity: 0.6">
        <a-animation attribute="rotation" dur="15000" fill="forwards" to="360 0 360" repeat="indefinite"></a-animation>
      </a-torus>

      <!-- Golden Tree Core / Mother Luta Energy Matrix -->
      <a-cylinder position="0 -0.5 0" radius="0.15" height="1.2" color="#b45309" material="emissive: #d97706; emissiveIntensity: 0.5"></a-cylinder>
      <a-sphere position="0 0.3 0" radius="0.7" color="#f59e0b" material="emissive: #fbbf24; emissiveIntensity: 0.7; opacity: 0.85; transparent: true"></a-sphere>

      <!-- Floating Heritage Energy Particles -->
      <a-ring radius-inner="0.8" radius-outer="0.85" color="#66fcf1" rotation="90 0 0" position="0 -0.8 0" material="emissive: #66fcf1; emissiveIntensity: 0.9"></a-ring>
    </a-entity>

    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" position="1 2 1" color="#f59e0b" intensity="1"></a-light>
  </a-scene>

</body>
</html>
