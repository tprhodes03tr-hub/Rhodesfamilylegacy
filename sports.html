<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5-in-1 Sports Suite - Rhodes Legacy</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: #141724;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Game Selector Menu */
    .sports-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1rem;
      max-width: 600px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid #282f45;
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    /* Stadium Arena Screen */
    .arena-container {
      background: #000;
      border: 3px solid #282f45;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    canvas {
      display: block;
      background: #111420;
    }

    /* Controls & HUD */
    .dashboard {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .scoreboard {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
    }

    .guide {
      font-size: 0.9rem;
      color: #9ca3af;
      min-height: 24px;
    }

    /* Action Trigger */
    .action-btn {
      background: linear-gradient(135deg, #d97706, var(--accent-gold));
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      touch-action: manipulation;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .btn-back {
      margin-top: 1rem;
      background: transparent;
      border: 1px solid #333a52;
      color: #8890a6;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .btn-back:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>5-IN-1 SPORTS SUITE</h1>
    <p style="font-size: 0.85rem; color: #8890a6; margin-top: 2px;">Championship Arcade Challenge</p>
  </header>

  <div class="sports-tabs">
    <button class="tab-btn active" onclick="switchSport('sprint')">100m Sprint</button>
    <button class="tab-btn" onclick="switchSport('hoops')">Free Throw</button>
    <button class="tab-btn" onclick="switchSport('derby')">Home Run Derby</button>
    <button class="tab-btn" onclick="switchSport('soccer')">Penalty Kick</button>
    <button class="tab-btn" onclick="switchSport('boxing')">Speed Boxing</button>
  </div>

  <div class="arena-container">
    <canvas id="sportsCanvas" width="480" height="360"></canvas>
  </div>

  <div class="dashboard">
    <div class="scoreboard" id="scoreBanner">TIME: 0.00s | DIST: 0m</div>
    <div class="guide" id="guideText">Tap ACTION or mash SPACE / Arrow Keys repeatedly to sprint!</div>
    
    <button class="action-btn" id="mainActionBtn">ACTION / TAP</button>

    <a href="index.html" class="btn-back">&larr; Back to Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('sportsCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBanner = document.getElementById('scoreBanner');
    const guideText = document.getElementById('guideText');
    const actionBtn = document.getElementById('mainActionBtn');

    let currentSport = 'sprint';
    let animId;

    // Universal Action Trigger
    function handleAction() {
      if (currentSport === 'sprint') sprintStep();
      else if (currentSport === 'hoops') shootHoop();
      else if (currentSport === 'derby') swingBat();
      else if (currentSport === 'soccer') kickBall();
      else if (currentSport === 'boxing') punchBag();
    }

    actionBtn.addEventListener('click', handleAction);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD') {
        handleAction();
      }
    });

    // ==========================================
    // 1. 100M SPRINT
    // ==========================================
    let sprDistance = 0, sprStartTime = null, sprFinished = false, sprTime = 0, sprP1Leg = 0;
    function initSprint() {
      sprDistance = 0; sprStartTime = null; sprFinished = false; sprTime = 0; sprP1Leg = 0;
      guideText.innerText = "Tap rapidly to sprint to 100m!";
      scoreBanner.innerText = "TIME: 0.00s | DIST: 0m";
      actionBtn.innerText = "SPRINT (TAP)";
    }

    function sprintStep() {
      if (sprFinished) { initSprint(); return; }
      if (!sprStartTime) sprStartTime = performance.now();
      sprDistance += 2.5;
      sprP1Leg = (sprP1Leg + 1) % 2;
      if (sprDistance >= 100) {
        sprDistance = 100;
        sprFinished = true;
      }
    }

    function updateSprint() {
      if (sprStartTime && !sprFinished) {
        sprTime = ((performance.now() - sprStartTime) / 1000).toFixed(2);
      }
      scoreBanner.innerText = `TIME: ${sprTime}s | DIST: ${Math.floor(sprDistance)}/100m`;
      if (sprFinished) scoreBanner.innerText = `FINISHED! Final Time: ${sprTime}s`;
    }

    function drawSprint() {
      // Track
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(0, 80, canvas.width, 200);
      ctx.strokeStyle = '#fff';
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(0, 180); ctx.lineTo(canvas.width, 180);
      ctx.stroke();
      ctx.setLineDash([]);

      // Finish Line
      if (sprDistance > 70) {
        let finishX = canvas.width - (100 - sprDistance) * 12;
        ctx.fillStyle = '#fff';
        ctx.fillRect(finishX, 80, 8, 200);
      }

      // Runner
      let rX = Math.min(canvas.width - 50, 40 + sprDistance * 3.5);
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(rX, 140, 16, 26);
      ctx.fillStyle = '#f59e0b'; // head
      ctx.beginPath(); ctx.arc(rX + 8, 130, 8, 0, Math.PI * 2); ctx.fill();
    }

    // ==========================================
    // 2. BASKETBALL FREE THROW
    // ==========================================
    let meterVal = 0, meterDir = 2.5, hoopShots = 0, hoopScore = 0, ballAnim = null;
    function initHoops() {
      meterVal = 0; meterDir = 2.5; hoopShots = 5; hoopScore = 0; ballAnim = null;
      guideText.innerText = "Time your shot when the meter hits the GREEN zone!";
      scoreBanner.innerText = `POINTS: 0 | SHOTS LEFT: 5`;
      actionBtn.innerText = "SHOOT";
    }

    function shootHoop() {
      if (ballAnim || hoopShots <= 0) { if (hoopShots <= 0) initHoops(); return; }
      hoopShots--;
      let success = (meterVal >= 42 && meterVal <= 58);
      ballAnim = { x: 70, y: 260, targetX: 380, targetY: 130, t: 0, success };
    }

    function updateHoops() {
      meterVal += meterDir;
      if (meterVal > 100 || meterVal < 0) meterDir *= -1;

      if (ballAnim) {
        ballAnim.t += 0.035;
        ballAnim.x = 70 + (ballAnim.targetX - 70) * ballAnim.t;
        ballAnim.y = 260 - Math.sin(ballAnim.t * Math.PI) * 180 + (ballAnim.targetY - 260) * ballAnim.t;
        if (ballAnim.t >= 1) {
          if (ballAnim.success) hoopScore += 2;
          ballAnim = null;
        }
      }
      scoreBanner.innerText = `POINTS: ${hoopScore} | SHOTS LEFT: ${hoopShots}`;
    }

    function drawHoops() {
      // Court Floor & Backboard
      ctx.fillStyle = '#c2410c';
      ctx.fillRect(0, 280, canvas.width, 80);

      ctx.fillStyle = '#fff';
      ctx.fillRect(390, 80, 6, 90);
      ctx.fillStyle = '#ef4444'; // Rim
      ctx.fillRect(360, 130, 30, 4);

      // Timing Meter Bar
      ctx.fillStyle = '#222';
      ctx.fillRect(140, 30, 200, 16);
      ctx.fillStyle = '#10b981'; // Green sweetspot
      ctx.fillRect(224, 30, 32, 16);
      ctx.fillStyle = '#f59e0b'; // Indicator
      ctx.fillRect(140 + (meterVal * 1.95), 26, 6, 24);

      // Ball
      let bx = ballAnim ? ballAnim.x : 70;
      let by = ballAnim ? ballAnim.y : 260;
      ctx.fillStyle = '#ea580c';
      ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill();
    }

    // ==========================================
    // 3. HOME RUN DERBY
    // ==========================================
    let pitchBall = null, homeRuns = 0, derbyOuts = 0, swingState = false;
    function initDerby() {
      homeRuns = 0; derbyOuts = 0; pitchBall = null; swingState = false;
      guideText.innerText = "Time your swing just as the pitch crosses the plate!";
      scoreBanner.innerText = `HOME RUNS: 0 | OUTS: 0/3`;
      actionBtn.innerText = "SWING BAT";
      spawnPitch();
    }

    function spawnPitch() {
      pitchBall = { x: 380, y: 180, vx: -3.8 };
    }

    function swingBat() {
      if (derbyOuts >= 3) { initDerby(); return; }
      swingState = true;
      setTimeout(() => { swingState = false; }, 200);

      if (pitchBall && pitchBall.x > 80 && pitchBall.x < 140) {
        homeRuns++;
        pitchBall = null;
        guideText.innerText = "IT'S OUTTA HERE! HOME RUN!";
        setTimeout(spawnPitch, 1500);
      }
    }

    function updateDerby() {
      if (pitchBall) {
        pitchBall.x += pitchBall.vx;
        if (pitchBall.x < 40) {
          derbyOuts++;
          pitchBall = null;
          guideText.innerText = "STRIKE OUT!";
          if (derbyOuts < 3) setTimeout(spawnPitch, 1200);
        }
      }
      scoreBanner.innerText = `HOME RUNS: ${homeRuns} | OUTS: ${derbyOuts}/3`;
    }

    function drawDerby() {
      // Grass & Plate
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#d97706';
      ctx.beginPath(); ctx.arc(100, 200, 35, 0, Math.PI*2); ctx.fill();

      // Batter / Bat
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(80, 160, 14, 30);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      if (swingState) { ctx.moveTo(90, 175); ctx.lineTo(130, 170); }
      else { ctx.moveTo(90, 175); ctx.lineTo(65, 150); }
      ctx.stroke();

      // Pitch
      if (pitchBall) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(pitchBall.x, pitchBall.y, 6, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ==========================================
    // 4. PENALTY SOCCER SHOOTOUT
    // ==========================================
    let goalKicks = 5, soccerScore = 0, gkX = 220, gkDir = 3, sBall = null;
    function initSoccer() {
      goalKicks = 5; soccerScore = 0; gkX = 220; gkDir = 3; sBall = null;
      guideText.innerText = "Kick past the moving goalkeeper into the net!";
      scoreBanner.innerText = `GOALS: 0 | KICKS: 5`;
      actionBtn.innerText = "KICK";
    }

    function kickBall() {
      if (sBall || goalKicks <= 0) { if (goalKicks <= 0) initSoccer(); return; }
      goalKicks--;
      let targetX = 140 + Math.random() * 200;
      sBall = { x: 240, y: 310, targetX, t: 0 };
    }

    function updateSoccer() {
      gkX += gkDir;
      if (gkX > 320 || gkX < 140) gkDir *= -1;

      if (sBall) {
        sBall.t += 0.05;
        sBall.x += (sBall.targetX - sBall.x) * 0.1;
        sBall.y -= 10;
        if (sBall.t >= 1) {
          if (Math.abs(sBall.targetX - (gkX + 20)) > 30) soccerScore++;
          sBall = null;
        }
      }
      scoreBanner.innerText = `GOALS: ${soccerScore} | KICKS LEFT: ${goalKicks}`;
    }

    function drawSoccer() {
      // Net
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(110, 50, 260, 110);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(110, 50, 260, 110);

      // Goalkeeper
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(gkX, 100, 40, 55);

      // Ball
      let bx = sBall ? sBall.x : 240;
      let by = sBall ? sBall.y : 310;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI * 2); ctx.fill();
    }

    // ==========================================
    // 5. SPEED BOXING BAG
    // ==========================================
    let punchCount = 0, boxingTimer = 10, boxingActive = false, bagTilt = 0;
    function initBoxing() {
      punchCount = 0; boxingTimer = 10; boxingActive = false; bagTilt = 0;
      guideText.innerText = "Hit ACTION as fast as possible in 10 seconds!";
      scoreBanner.innerText = `PUNCHES: 0 | TIME: 10s`;
      actionBtn.innerText = "PUNCH";
    }

    function punchBag() {
      if (!boxingActive && boxingTimer === 10) {
        boxingActive = true;
        let tInt = setInterval(() => {
          boxingTimer--;
          if (boxingTimer <= 0) {
            boxingActive = false;
            clearInterval(tInt);
            guideText.innerText = `Workout Done! Speed: ${(punchCount/10).toFixed(1)} punches/sec`;
          }
        }, 1000);
      }

      if (boxingActive) {
        punchCount++;
        bagTilt = 18;
      }
    }

    function updateBoxing() {
      if (bagTilt > 0) bagTilt -= 1.2;
      scoreBanner.innerText = `PUNCHES: ${punchCount} | TIME: ${boxingTimer}s`;
    }

    function drawBoxing() {
      // Gym background & beam
      ctx.fillStyle = '#1e1b2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#475569';
      ctx.fillRect(200, 20, 80, 12);

      // Heavy Bag
      ctx.save();
      ctx.translate(240, 32);
      ctx.rotate((bagTilt * Math.PI) / 180);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40); ctx.stroke();
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(-22, 40, 44, 120);
      ctx.restore();
    }

    // --- MAIN ENGINE LOOP ---
    function masterLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentSport === 'sprint') { updateSprint(); drawSprint(); }
      else if (currentSport === 'hoops') { updateHoops(); drawHoops(); }
      else if (currentSport === 'derby') { updateDerby(); drawDerby(); }
      else if (currentSport === 'soccer') { updateSoccer(); drawSoccer(); }
      else if (currentSport === 'boxing') { updateBoxing(); drawBoxing(); }

      animId = requestAnimationFrame(masterLoop);
    }

    function switchSport(sportKey) {
      currentSport = sportKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (sportKey === 'sprint') initSprint();
      else if (sportKey === 'hoops') initHoops();
      else if (sportKey === 'derby') initDerby();
      else if (sportKey === 'soccer') initSoccer();
      else if (sportKey === 'boxing') initBoxing();
    }

    initSprint();
    masterLoop();
  </script>
</body>
</html>
