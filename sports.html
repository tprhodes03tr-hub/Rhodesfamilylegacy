<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sports Mega Suite - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0a0e17;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    /* Top Bar Selector */
    #menu-nav {
      width: 100%;
      max-width: 500px;
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 8px;
      background: #111827;
      border-bottom: 2px solid #1f293d;
      white-space: nowrap;
    }
    .nav-btn {
      background: #1f293d;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #00ffcc;
      color: #0a0e17;
    }
    /* Arena Container */
    #arena {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 56vh;
      background: #050508;
      border: 2px solid #334155;
      margin-top: 6px;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 0 0 6px #000;
      pointer-events: none;
    }
    /* Bottom Controls */
    #controls {
      width: 100%;
      max-width: 480px;
      height: 32vh;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      background: #0f172a;
      border-top: 2px solid #1e293b;
    }
    .ctrl-pad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
    }
    .btn-ctrl {
      background: #1e293b;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      color: #00ffcc;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-ctrl:active {
      background: #00ffcc;
      color: #0f172a;
    }
    .act-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #ff0055;
      background: rgba(255, 0, 85, 0.25);
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
    }
    .act-btn:active {
      background: #ff0055;
      transform: scale(0.92);
    }
    .gear-btn {
      background: #ffaa00;
      border: 1px solid #ffcc00;
      color: #0a0e17;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div id="menu-nav">
    <button class="nav-btn active" onclick="switchGame('baseball')">Baseball</button>
    <button class="nav-btn" onclick="switchGame('football')">Football</button>
    <button class="nav-btn" onclick="switchGame('golf')">18-Hole Golf</button>
    <button class="nav-btn" onclick="switchGame('pool')">8-Ball Pool</button>
    <button class="nav-btn" onclick="switchGame('pingpong')">Ping Pong</button>
    <button class="nav-btn" onclick="switchGame('archery')">Archery</button>
  </div>

  <div id="arena">
    <div id="hud">
      <span id="stat-left">SCORE: 0</span>
      <span id="stat-mid">INNING: 1</span>
      <span id="stat-right">OUTS: 0</span>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="controls">
    <div class="ctrl-pad" id="dpad-box">
      <div></div><button class="btn-ctrl" id="pad-up">▲</button><div></div>
      <button class="btn-ctrl" id="pad-left">◀</button><button class="btn-ctrl" id="pad-down">▼</button><button class="btn-ctrl" id="pad-right">▶</button>
    </div>
    <button id="gear-select" class="gear-btn" onclick="cycleGear()" style="display:none;">Bow: Recurve</button>
    <button id="main-action" class="act-btn">HIT</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 360;
    canvas.height = 420;

    let activeGame = 'baseball';
    const keys = { up: false, down: false, left: false, right: false, act: false };

    // --- SPORT STATE DATA ---
    const sports = {
      baseball: {
        runs: 0, outs: 0, strikes: 0, inning: 1,
        batter: { x: 180, y: 360 },
        pitcher: { x: 180, y: 180 },
        ball: { x: 180, y: 180, vx: 0, vy: 0, live: false, pitched: false },
        runners: [false, false, false], // 1st, 2nd, 3rd
        swingState: 0
      },
      football: {
        score: 0, downs: 1, toGain: 10, ydl: 20,
        carrier: { x: 180, y: 350, vx: 0, vy: 0 },
        defenders: [
          { x: 120, y: 150, speed: 1.8 },
          { x: 180, y: 130, speed: 2.1 },
          { x: 240, y: 150, speed: 1.8 }
        ],
        touchdowns: 0
      },
      golf: {
        hole: 1, par: 4, strokes: 0, totalScore: 0,
        ball: { x: 180, y: 360, vx: 0, vy: 0 },
        holePos: { x: 180, y: 80, r: 8 },
        aimAngle: -Math.PI / 2,
        power: 0, charging: false
      },
      pool: {
        score: 0,
        cue: { x: 180, y: 300, vx: 0, vy: 0, r: 8 },
        aimAngle: -Math.PI / 2,
        charging: false, power: 0,
        balls: [
          { x: 180, y: 140, vx: 0, vy: 0, color: '#ffcc00', active: true, r: 7 },
          { x: 172, y: 125, vx: 0, vy: 0, color: '#0088ff', active: true, r: 7 },
          { x: 188, y: 125, vx: 0, vy: 0, color: '#ff3344', active: true, r: 7 },
          { x: 180, y: 110, vx: 0, vy: 0, color: '#222', active: true, r: 7 }
        ]
      },
      pingpong: {
        playerScore: 0, aiScore: 0,
        paddleX: 140, aiPaddleX: 140,
        ball: { x: 180, y: 200, vx: 2.2, vy: 3.5 }
      },
      archery: {
        score: 0, arrows: 10, bowType: 0,
        bows: [
          { name: "Recurve", speed: 6, drop: 0.1 },
          { name: "Compound", speed: 9, drop: 0.04 },
          { name: "Longbow", speed: 7.5, drop: 0.07 }
        ],
        crosshair: { x: 180, y: 210 },
        arrowState: { flying: false, x: 180, y: 400, vx: 0, vy: 0 },
        targetX: 180, targetSpeed: 1.5
      }
    };

    function switchGame(gameKey) {
      activeGame = gameKey;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const gearBtn = document.getElementById('gear-select');
      const actBtn = document.getElementById('main-action');

      gearBtn.style.display = (gameKey === 'archery') ? 'block' : 'none';

      if (gameKey === 'baseball') actBtn.innerText = 'HIT';
      else if (gameKey === 'football') actBtn.innerText = 'SNAP';
      else if (gameKey === 'golf' || gameKey === 'pool') actBtn.innerText = 'STRIKE';
      else if (gameKey === 'pingpong') actBtn.innerText = 'SERVE';
      else if (gameKey === 'archery') actBtn.innerText = 'SHOOT';
    }

    function cycleGear() {
      const a = sports.archery;
      a.bowType = (a.bowType + 1) % a.bows.length;
      document.getElementById('gear-select').innerText = `Bow: ${a.bows[a.bowType].name}`;
    }

    // --- CONTROLS SETUP ---
    function bindTouch(id, keyName) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    }
    bindTouch('pad-up', 'up');
    bindTouch('pad-down', 'down');
    bindTouch('pad-left', 'left');
    bindTouch('pad-right', 'right');

    const actBtn = document.getElementById('main-action');
    actBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleActionPress(); });
    actBtn.addEventListener('touchend', (e) => { e.preventDefault(); handleActionRelease(); });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
      if (e.code === 'Space') handleActionPress();
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
      if (e.code === 'Space') handleActionRelease();
    });

    function handleActionPress() {
      if (activeGame === 'baseball') {
        const b = sports.baseball;
        if (!b.ball.pitched) {
          b.ball.pitched = true;
          b.ball.live = true;
          b.ball.x = 180; b.ball.y = 180;
          b.ball.vx = (Math.random() - 0.5) * 2;
          b.ball.vy = 4.5;
        } else if (b.ball.live && b.ball.y > 300) {
          // Hit the ball
          b.ball.vy = -(6 + Math.random() * 4);
          b.ball.vx = (Math.random() - 0.5) * 8;
          b.runs++;
          advanceBases();
        }
      } else if (activeGame === 'football') {
        // Boost / Dive
        sports.football.carrier.y -= 15;
      } else if (activeGame === 'golf') {
        sports.golf.charging = true;
      } else if (activeGame === 'pool') {
        sports.pool.charging = true;
      } else if (activeGame === 'pingpong') {
        sports.pingpong.ball.y = 200;
        sports.pingpong.ball.vy = 3.5;
      } else if (activeGame === 'archery') {
        const a = sports.archery;
        if (!a.arrowState.flying && a.arrows > 0) {
          a.arrowState.flying = true;
          a.arrowState.x = 180;
          a.arrowState.y = 380;
          const bow = a.bows[a.bowType];
          a.arrowState.vx = (a.crosshair.x - 180) / 18;
          a.arrowState.vy = -bow.speed;
          a.arrows--;
        }
      }
    }

    function handleActionRelease() {
      if (activeGame === 'golf' && sports.golf.charging) {
        const g = sports.golf;
        g.charging = false;
        g.ball.vx = Math.cos(g.aimAngle) * g.power * 0.4;
        g.ball.vy = Math.sin(g.aimAngle) * g.power * 0.4;
        g.strokes++;
        g.power = 0;
      } else if (activeGame === 'pool' && sports.pool.charging) {
        const p = sports.pool;
        p.charging = false;
        p.cue.vx = Math.cos(p.aimAngle) * p.power * 0.45;
        p.cue.vy = Math.sin(p.aimAngle) * p.power * 0.45;
        p.power = 0;
      }
    }

    function advanceBases() {
      const b = sports.baseball;
      if (b.runners[2]) { b.runs++; b.runners[2] = false; }
      if (b.runners[1]) { b.runners[2] = true; b.runners[1] = false; }
      if (b.runners[0]) { b.runners[1] = true; b.runners[0] = false; }
      b.runners[0] = true;
    }

    // --- GAME LOOPS ---
    function update() {
      // 1. Baseball
      if (activeGame === 'baseball') {
        const b = sports.baseball;
        if (b.ball.live) {
          b.ball.x += b.ball.vx;
          b.ball.y += b.ball.vy;
          if (b.ball.y > 410) {
            b.strikes++;
            b.ball.live = false;
            b.ball.pitched = false;
            if (b.strikes >= 3) {
              b.outs++;
              b.strikes = 0;
            }
          }
          if (b.ball.y < -10) {
            b.ball.live = false;
            b.ball.pitched = false;
          }
        }
        document.getElementById('stat-left').innerText = `RUNS: ${b.runs}`;
        document.getElementById('stat-mid').innerText = `INNING: ${b.inning}`;
        document.getElementById('stat-right').innerText = `OUTS: ${b.outs} | STRIKES: ${b.strikes}`;
      }

      // 2. Football
      else if (activeGame === 'football') {
        const f = sports.football;
        if (keys.left) f.carrier.x -= 3.5;
        if (keys.right) f.carrier.x += 3.5;
        if (keys.up) f.carrier.y -= 3.2;
        if (keys.down) f.carrier.y += 2.0;

        f.carrier.x = Math.max(30, Math.min(330, f.carrier.x));

        // Defenders AI
        f.defenders.forEach(d => {
          if (d.x < f.carrier.x) d.x += d.speed;
          if (d.x > f.carrier.x) d.x -= d.speed;
          if (d.y < f.carrier.y) d.y += d.speed * 0.9;

          // Tackle
          if (Math.hypot(d.x - f.carrier.x, d.y - f.carrier.y) < 18) {
            f.downs++;
            f.carrier.x = 180; f.carrier.y = 350;
            d.y = 130;
            if (f.downs > 4) {
              f.downs = 1;
              alert('Turnover on downs!');
            }
          }
        });

        // Touchdown
        if (f.carrier.y <= 40) {
          f.score += 7;
          f.touchdowns++;
          f.carrier.x = 180; f.carrier.y = 350;
          f.downs = 1;
          alert('TOUCHDOWN RHODES!');
        }

        document.getElementById('stat-left').innerText = `SCORE: ${f.score}`;
        document.getElementById('stat-mid').innerText = `DOWN: ${f.downs} & 10`;
        document.getElementById('stat-right').innerText = `TDs: ${f.touchdowns}`;
      }

      // 3. 18-Hole Golf
      else if (activeGame === 'golf') {
        const g = sports.golf;
        if (keys.left) g.aimAngle -= 0.04;
        if (keys.right) g.aimAngle += 0.04;

        if (g.charging && g.power < 25) g.power += 0.6;

        g.ball.x += g.ball.vx;
        g.ball.y += g.ball.vy;
        g.ball.vx *= 0.96;
        g.ball.vy *= 0.96;

        if (Math.hypot(g.ball.x - g.holePos.x, g.ball.y - g.holePos.y) < g.holePos.r && Math.hypot(g.ball.vx, g.ball.vy) < 1.5) {
          g.totalScore += g.strokes;
          g.hole = (g.hole % 18) + 1;
          g.strokes = 0;
          g.ball.x = 180; g.ball.y = 360;
          g.ball.vx = 0; g.ball.vy = 0;
          g.holePos.x = 80 + Math.random() * 200;
          g.holePos.y = 60 + Math.random() * 80;
        }

        document.getElementById('stat-left').innerText = `HOLE: ${g.hole}/18`;
        document.getElementById('stat-mid').innerText = `PAR: 4 | STROKES: ${g.strokes}`;
        document.getElementById('stat-right').innerText = `TOTAL: ${g.totalScore}`;
      }

      // 4. Pool
      else if (activeGame === 'pool') {
        const p = sports.pool;
        if (keys.left) p.aimAngle -= 0.04;
        if (keys.right) p.aimAngle += 0.04;
        if (p.charging && p.power < 28) p.power += 0.7;

        p.cue.x += p.cue.vx; p.cue.y += p.cue.vy;
        p.cue.vx *= 0.97; p.cue.vy *= 0.97;

        p.balls.forEach(b => {
          if (!b.active) return;
          b.x += b.vx; b.y += b.vy;
          b.vx *= 0.97; b.vy *= 0.97;

          // Cue collision
          if (Math.hypot(p.cue.x - b.x, p.cue.y - b.y) < (p.cue.r + b.r)) {
            b.vx = p.cue.vx * 0.85;
            b.vy = p.cue.vy * 0.85;
            p.cue.vx *= 0.4; p.cue.vy *= 0.4;
          }

          // Pocketing
          if (b.x < 30 || b.x > 330 || b.y < 30 || b.y > 390) {
            b.active = false;
            p.score += 100;
          }
        });

        document.getElementById('stat-left').innerText = `SCORE: ${p.score}`;
        document.getElementById('stat-mid').innerText = `POWER: ${Math.floor(p.power)}`;
        document.getElementById('stat-right').innerText = `8-BALL POOL`;
      }

      // 5. Ping Pong
      else if (activeGame === 'pingpong') {
        const pp = sports.pingpong;
        if (keys.left) pp.paddleX -= 4.5;
        if (keys.right) pp.paddleX += 4.5;
        pp.paddleX = Math.max(10, Math.min(270, pp.paddleX));

        // AI Paddle
        if (pp.aiPaddleX + 40 < pp.ball.x) pp.aiPaddleX += 2.8;
        if (pp.aiPaddleX + 40 > pp.ball.x) pp.aiPaddleX -= 2.8;

        pp.ball.x += pp.ball.vx;
        pp.ball.y += pp.ball.vy;

        if (pp.ball.x < 10 || pp.ball.x > 350) pp.ball.vx *= -1;

        // Player Hit
        if (pp.ball.y >= 370 && pp.ball.y <= 385 && pp.ball.x >= pp.paddleX && pp.ball.x <= pp.paddleX + 80) {
          pp.ball.vy = -Math.abs(pp.ball.vy);
          pp.ball.vx = (pp.ball.x - (pp.paddleX + 40)) * 0.12;
        }

        // AI Hit
        if (pp.ball.y <= 45 && pp.ball.y >= 30 && pp.ball.x >= pp.aiPaddleX && pp.ball.x <= pp.aiPaddleX + 80) {
          pp.ball.vy = Math.abs(pp.ball.vy);
        }

        // Scoring
        if (pp.ball.y > 410) { pp.aiScore++; pp.ball.y = 200; pp.ball.vy = 3.5; }
        if (pp.ball.y < 10) { pp.playerScore++; pp.ball.y = 200; pp.ball.vy = -3.5; }

        document.getElementById('stat-left').innerText = `PLAYER: ${pp.playerScore}`;
        document.getElementById('stat-mid').innerText = `RALLY`;
        document.getElementById('stat-right').innerText = `AI: ${pp.aiScore}`;
      }

      // 6. Archery
      else if (activeGame === 'archery') {
        const a = sports.archery;
        if (keys.left) a.crosshair.x -= 3;
        if (keys.right) a.crosshair.x += 3;
        if (keys.up) a.crosshair.y -= 3;
        if (keys.down) a.crosshair.y += 3;

        a.targetX += a.targetSpeed;
        if (a.targetX < 60 || a.targetX > 300) a.targetSpeed *= -1;

        if (a.arrowState.flying) {
          a.arrowState.x += a.arrowState.vx;
          a.arrowState.y += a.arrowState.vy;

          if (a.arrowState.y <= 90) {
            a.arrowState.flying = false;
            const dist = Math.abs(a.arrowState.x - a.targetX);
            if (dist < 30) {
              const points = Math.max(10, 100 - Math.floor(dist * 3));
              a.score += points;
            }
          }
        }

        document.getElementById('stat-left').innerText = `SCORE: ${a.score}`;
        document.getElementById('stat-mid').innerText = `ARROWS: ${a.arrows}`;
        document.getElementById('stat-right').innerText = a.bows[a.bowType].name;
      }
    }

    // --- RENDER FUNCTIONS ---
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeGame === 'baseball') {
        ctx.fillStyle = '#2d6a4f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#b08968';
        ctx.beginPath();
        ctx.moveTo(180, 80); ctx.lineTo(310, 210); ctx.lineTo(180, 340); ctx.lineTo(50, 210); ctx.fill();

        // Bases
        ctx.fillStyle = '#fff';
        ctx.fillRect(305, 205, 12, 12); // 1st
        ctx.fillRect(175, 75, 12, 12);  // 2nd
        ctx.fillRect(45, 205, 12, 12);  // 3rd
        ctx.fillRect(174, 335, 14, 14); // Home

        // Pitcher & Batter
        ctx.fillStyle = '#00e5ff'; ctx.fillRect(172, 172, 16, 16);
        ctx.fillStyle = '#ffaa00'; ctx.fillRect(172, 350, 16, 20);

        if (sports.baseball.ball.live) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(sports.baseball.ball.x, sports.baseball.ball.y, 5, 0, Math.PI * 2); ctx.fill();
        }
      }

      else if (activeGame === 'football') {
        ctx.fillStyle = '#1e7b34'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Field Lines
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
        for (let y = 60; y < 400; y += 40) {
          ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(340, y); ctx.stroke();
        }
        // End Zone
        ctx.fillStyle = '#8b0000'; ctx.fillRect(0, 0, canvas.width, 50);

        // Carrier
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(sports.football.carrier.x, sports.football.carrier.y, 10, 0, Math.PI * 2); ctx.fill();

        // Defenders
        ctx.fillStyle = '#ff3344';
        sports.football.defenders.forEach(d => {
          ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI * 2); ctx.fill();
        });
      }

      else if (activeGame === 'golf') {
        const g = sports.golf;
        ctx.fillStyle = '#2d6a4f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Hole Green
        ctx.fillStyle = '#40916c';
        ctx.beginPath(); ctx.arc(g.holePos.x, g.holePos.y, 35, 0, Math.PI * 2); ctx.fill();
        // Cup & Pin
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(g.holePos.x, g.holePos.y, g.holePos.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(g.holePos.x, g.holePos.y); ctx.lineTo(g.holePos.x, g.holePos.y - 20); ctx.stroke();

        // Aim Line
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.moveTo(g.ball.x, g.ball.y);
        ctx.lineTo(g.ball.x + Math.cos(g.aimAngle) * 45, g.ball.y + Math.sin(g.aimAngle) * 45); ctx.stroke();

        // Ball
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(g.ball.x, g.ball.y, 5, 0, Math.PI * 2); ctx.fill();
      }

      else if (activeGame === 'pool') {
        const p = sports.pool;
        ctx.fillStyle = '#0b6623'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#5c4033'; ctx.lineWidth = 14; ctx.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);

        // Aim Line
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath(); ctx.moveTo(p.cue.x, p.cue.y);
        ctx.lineTo(p.cue.x + Math.cos(p.aimAngle) * 50, p.cue.y + Math.sin(p.aimAngle) * 50); ctx.stroke();

        // Cue ball
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.cue.x, p.cue.y, p.cue.r, 0, Math.PI * 2); ctx.fill();

        // Object balls
        p.balls.forEach(b => {
          if (!b.active) return;
          ctx.fillStyle = b.color;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        });
      }

      else if (activeGame === 'pingpong') {
        const pp = sports.pingpong;
        ctx.fillStyle = '#0f4c81'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
        ctx.beginPath(); ctx.moveTo(10, canvas.height / 2); ctx.lineTo(canvas.width - 10, canvas.height / 2); ctx.stroke();

        // Paddles
        ctx.fillStyle = '#ff4757'; ctx.fillRect(pp.aiPaddleX, 30, 80, 10);
        ctx.fillStyle = '#2ed573'; ctx.fillRect(pp.paddleX, 380, 80, 10);

        // Ball
        ctx.fillStyle = '#ffa502';
        ctx.beginPath(); ctx.arc(pp.ball.x, pp.ball.y, 6, 0, Math.PI * 2); ctx.fill();
      }

      else if (activeGame === 'archery') {
        const a = sports.archery;
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Target Rings
        const rings = [35, 26, 18, 10];
        const colors = ['#ffffff', '#000000', '#00e5ff', '#ff3344'];
        rings.forEach((r, idx) => {
          ctx.fillStyle = colors[idx];
          ctx.beginPath(); ctx.arc(a.targetX, 85, r, 0, Math.PI * 2); ctx.fill();
        });

        // Reticle
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(a.crosshair.x, a.crosshair.y, 14, 0, Math.PI * 2); ctx.stroke();

        // Arrow
        if (a.arrowState.flying) {
          ctx.fillStyle = '#ffd700';
          ctx.fillRect(a.arrowState.x - 2, a.arrowState.y, 4, 16);
        }
      }

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    render();
  </script>
</body>
</html>
