<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancestral Vanguard • P2P AR Card Clash</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    body { margin: 0; background: #060913; color: #e2e8f0; font-family: monospace; }
    .hud { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(9,13,22,0.9); border: 1px solid #66fcf1; padding: 12px 20px; border-radius: 8px; text-align: center; }
    .btn { background: #112233; color: #66fcf1; border: 1px solid #66fcf1; padding: 10px 16px; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; margin-top: 6px; }
    .btn:hover { background: #45a29e; color: #04060b; }
  </style>
</head>
<body>
  <div class="hud">
    <div style="font-size: 11px; letter-spacing: 2px; color: #45a29e;">P2P AR DUEL ARENA</div>
    <h3 style="color: #66fcf1; font-size: 1rem; margin: 4px 0;">Marcus Prime vs. Chrono-Lock</h3>
    <p id="p2p-status" style="font-size: 0.75rem; color: #38bdf8; margin-bottom: 8px;">Status: Local AR Spatial Link Ready</p>
    <button class="btn" onclick="executeARClash()">✨ Trigger Holographic Clash</button>
  </div>

  <a-scene embedded background="color: #020617" style="width: 100vw; height: 100vh;">
    <!-- Shared Tabletop Lighting & Arena Grid -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" position="-1 2 1" intensity="1.2" color="#66fcf1"></a-light>

    <!-- Player 1 Avatar (Marcus Prime: Blue Bio-Electric Energy) -->
    <a-entity id="avatar-p1" position="-0.7 0 -3" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000">
      <a-box position="0 0.5 0" width="0.6" height="1.2" depth="0.3" color="#38bdf8" roughness="0.2"></a-box>
      <a-sphere position="0 1.2 0" radius="0.2" color="#66fcf1"></a-sphere>
    </a-entity>

    <!-- Player 2 Avatar (Chrono-Lock: Temporal Brass & Purple Static) -->
    <a-entity id="avatar-p2" position="0.7 0 -3" animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000">
      <a-cylinder position="0 0.5 0" radius="0.3" height="1.2" color="#b45309" roughness="0.3"></a-cylinder>
      <a-torus position="0 0.8 0" radius="0.4" radius-tubular="0.03" color="#c084fc" rotation="90 0 0"></a-torus>
    </a-entity>

    <!-- Holographic Energy Clash Ring -->
    <a-ring id="clash-ring" position="0 0.1 -3" radius-inner="0.1" radius-imaginary="0.2" radius-outer="0.2" color="#ff5555" rotation="90 0 0" visible="false" animation="property: scale; to: 5 5 5; dur: 1000; loop: true"></a-ring>

    <a-entity camera position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    function executeARClash() {
      const ring = document.getElementById('clash-ring');
      const status = document.getElementById('p2p-status');
      ring.setAttribute('visible', 'true');
      status.innerText = "Status: RESONANCE CLASH ACTIVE! Particle Exchange Locked.";
      
      if ('speechSynthesis' in window) {
        let utter = new SpeechSynthesisUtterance("Resonance clash active. Energy exchange locked.");
        window.speechSynthesis.speak(utter);
      }

      setTimeout(() => {
        ring.setAttribute('visible', 'false');
        status.innerText = "Status: Turn resolved. Awaiting next command.";
      }, 3000);
    }
  </script>
</body>
</html>
