<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ancestral Vanguard • Digital Complication & Screensaver</title>
  <style>
    body {
      background-color: #04060b;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .watch-container {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #0d1322 0%, #04060b 100%);
      border: 4px solid #66fcf1;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(102, 252, 241, 0.4);
      text-align: center;
      padding: 20px;
      position: relative;
    }
    .brand {
      font-size: 9px;
      letter-spacing: 2px;
      color: #45a29e;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .time {
      font-size: 2.2rem;
      font-weight: bold;
      color: #66fcf1;
      margin: 6px 0;
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.6);
    }
    .operative {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .stats {
      font-size: 0.7rem;
      color: #94a3b8;
      background: #111827;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #1f2937;
    }
    .hint {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="watch-container">
    <div class="brand">Vanguard Nexus</div>
    <div class="operative" id="active-op">⚡ OPERATIVE: MARCUS PRIME</div>
    <div class="time" id="clock">12:00:00</div>
    <div class="stats">SYNC: 100% | MARROW XP: 750</div>
  </div>

  <div class="hint">Press F11 for Fullscreen Cinematic Screensaver Mode</div>

  <script>
    // Live Clock Engine
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Rotate Operatives dynamically for screensaver effect
    const ops = [
      "⚡ OPERATIVE: MARCUS PRIME (DETROIT)",
      "🌊 OPERATIVE: GUACAN (DOMINICAN R.)",
      "✨ OPERATIVE: XOCHITL (OBSIDIAN SUN)"
    ];
    let opIndex = 0;
    setInterval(() => {
      opIndex = (opIndex + 1) % ops.length;
      document.getElementById('active-op').innerText = ops[opIndex];
    }, 6000);
  </script>
</body>
</html>
