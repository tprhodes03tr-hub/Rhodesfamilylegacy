<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marrow Globe Nexus & Detroit '313 Grid | Rhodes Family Legacy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #070913; color: #f1f5f9; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
    .hub-container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 12px; }
    .top-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 10px; border-radius: 12px; border: 1px solid #1e293b; }
    .nav-tab { background: #1e293b; color: #94a3b8; border: 2px solid #334155; padding: 10px; font-weight: 800; font-size: 0.8rem; border-radius: 8px; text-align: center; cursor: pointer; text-transform: uppercase; }
    .nav-tab.active { background: #3b82f6; color: #fff; border-color: #60a5fa; box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
    
    /* View Modules */
    .view-module { display: none; flex-direction: column; gap: 12px; }
    .view-module.active { display: flex; }

    /* Globe Viewport */
    .globe-frame { background: #0b0f19; border: 2px solid #3b82f6; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; position: relative; height: 380px; overflow: hidden; box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }
    #globe-canvas { width: 100%; height: 280px; touch-action: none; cursor: grab; }
    .globe-hud { display: flex; justify-content: space-between; width: 100%; font-size: 0.75rem; color: #60a5fa; font-weight: 700; padding: 0 8px; }

    /* Dossier Modal Popup */
    #dossier-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(15, 23, 42, 0.95); border: 2px solid #f59e0b; border-radius: 12px; padding: 16px; width: 90%; max-width: 320px; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 50; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); text-align: center; }
    #dossier-card.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    /* Detroit 313 Grid Game Frame */
    .game-frame { background: #0f172a; border: 2px solid #f59e0b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 25px rgba(245, 158, 11, 0.2); }
    .game-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; background: #020617; padding: 8px 12px; border-radius: 8px; border: 1px solid #1e293b; color: #f59e0b; font-weight: 700; }
    .canvas-box { position: relative; width: 100%; aspect-ratio: 4/3; background: #020617; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    canvas#gameCanvas { width: 100%; height: 100%; display: block; }
    
    /* Controls */
    .control-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .ctrl-btn { background: #1e293b; color: #fff; border: 2px solid #475569; padding: 12px; font-weight: 800; font-size: 0.75rem; border-radius: 8px; cursor: pointer; text-align: center; }
    .ctrl-btn:active { background: #3b82f6; border-color: #60a5fa; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ability-btn { background: #78350f; color: #fbbf24; border: 2px solid #d97706; padding: 10px; font-weight: 800; font-size: 0.7rem; border-radius: 8px; cursor: pointer; text-align: center; }
    .turbo-btn { background: #1e3a8a; color: #60a5fa; border: 2px solid #3b82f6; }
    
    .back-link { text-align: center; margin-top: 4px; }
    .back-link a { color: #64748b; text-decoration: none; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="hub-container">
    <nav class="top-nav">
      <button class="nav-tab active" id="tab-globe" onclick="switchView('globe')">3D AR Globe Matrix</button>
      <button class="nav-tab" id="tab-grid" onclick="switchView('grid')">Detroit '313 Grid Racer</button>
    </nav>

    <!-- 3D AR GLOBE VIEW -->
    <div class="view-module active" id="view-globe">
      <div class="globe-frame">
        <div class="globe-hud">
          <span>STATUS: MARROW MATRIX ONLINE</span>
          <span>TOUCH & ROTATE GLOBE</span>
        </div>
        <canvas id="globe-canvas"></canvas>
        <div style="font-size: 0.7rem; color: #94a3b8; text-align: center; margin-top: 4px;">Tap glowing sector pins to open operative dossier cards.</div>
        
        <!-- Dossier Popup Card -->
        <div id="dossier-card">
          <div style="font-size: 0.65rem; color: #f59e0b; font-weight: 800; margin-bottom: 2px;">⚡ VANGUARD DOSSIER</div>
          <h3 id="dossier-title" style="font-size: 0.95rem; color: #fff; margin-bottom: 6px;">Marcus Prime</h3>
          <p id="dossier-desc" style="font-size: 0.75rem; color: #94a3b8; line-height: 1.3; margin-bottom: 10px;"></p>
          <button onclick="closeDossier()" style="background: #3b82f6; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.7rem; cursor: pointer;">CLOSE DOSSIER</button>
        </div>
      </div>
    </div>

    <!-- DETROIT 313 GRID RACER VIEW -->
    <div class="view-module" id="view-grid">
      <div class="game-frame">
        <div class="game-header">
          <span>MARCUS PRIME // QUANTUM CRUISER</span>
          <span id="score-board">HULL: 100% | DIST: 0m</span>
        </div>
        <div class="canvas-box">
          <canvas id="gameCanvas" width="400" height="300"></canvas>
        </div>
        <div class="control-grid">
          <button class="ctrl-btn" ontouchstart="movePlayer(-1)" onmousedown="movePlayer(-1)">◄ STEER LEFT</button>
          <button class="ctrl-btn" style="background: #334155;" onclick="togglePause()">PAUSE</button>
          <button class="ctrl-btn" ontouchstart="movePlayer(1)" onmousedown="movePlayer(1)">STEER RIGHT ►</button>
        </div>
        <div class="action-grid">
          <button class="ability-btn turbo-btn" ontouchstart="activateTurbo()" onmousedown="activateTurbo()">⚡ TURBO BOOST</button>
          <button class="ability-btn" ontouchstart="fireShockwave()" onmousedown="fireShockwave()">⚡ URBAN SHOCKWAVE</button>
        </div>
      </div>
    </div>

    <div class="back-link">
      <a href="index.html">← RETURN TO MAIN PORTAL</a>
    </div>
  </div>

  <script>
    // --- VIEW SWITCHING ---
    function switchView(view) {
      document.getElementById('tab-globe').className = view === 'globe' ? 'nav-tab active' : 'nav-tab';
      document.getElementById('tab-grid').className = view === 'grid' ? 'nav-tab active' : 'nav-tab';
      document.getElementById('view-globe').className = view === 'globe' ? 'view-module active' : 'view-module';
      document.getElementById('view-grid').className = view === 'grid' ? 'view-module active' : 'view-module';
      if(view === 'grid' && !gameRunning) initGame();
    }

    // --- 3D AR GLOBE LOGIC ---
    const globeCanvas = document.getElementById('globe-canvas');
    const globeCtx = globeCanvas.getContext('2d');
    let globeAngleX = 0.3, globeAngleY = 0;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;

    const sectors = [
      { name: "Marcus Prime // Detroit Grid", lat: 42.33, lon: -83.04, desc: "Industrial Grid Core & Detroit Marrow Foundation. High kinetic output and armored grid defense." },
      { name: "Guacan // Caribbean Nexus", lat: 18.48, lon: -69.93, desc: "Storm-Tide Sentinel. Wields the Larimar Consecration Stone and Guamo War Shell activation." },
      { name: "Kaele // Forest-Heart Sentinel", lat: -15.5, lon: -68.0, desc: "Commanding flora, geological mass, and stabilizing genealogical lines across the Andes." }
    ];

    function resizeGlobe() {
      globeCanvas.width = globeCanvas.offsetWidth;
      globeCanvas.height = globeCanvas.offsetHeight;
    }
    window.addEventListener('resize', resizeGlobe);
    resizeGlobe();

    globeCanvas.addEventListener('pointerdown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
    window.addEventListener('pointermove', e => {
      if(!isDragging) return;
      globeAngleY += (e.clientX - lastMouseX) * 0.01;
      globeAngleX += (e.clientY - lastMouseY) * 0.01;
      lastMouseX = e.clientX; lastMouseY = e.clientY;
    });
    window.addEventListener('pointerup', () => isDragging = false);

    globeCanvas.addEventListener('click', e => {
      const rect = globeCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      // Check pin collision
      sectors.forEach(sec => {
        const rad = globeCanvas.width * 0.3;
        const phi = (90 - sec.lat) * (Math.PI / 180);
        const theta = (sec.lon + 180) * (Math.PI / 180) + globeAngleY;
        const px = globeCanvas.width/2 + rad * Math.sin(phi) * Math.cos(theta);
        const py = globeCanvas.height/2 + rad * Math.cos(phi);
        if(Math.hypot(x - px, y - py) < 20) {
          showDossier(sec.name, sec.desc);
        }
      });
    });

    function showDossier(title, desc) {
      document.getElementById('dossier-title').textContent = title;
      document.getElementById('dossier-desc').textContent = desc;
      document.getElementById('dossier-card').classList.add('active');
    }
    function closeDossier() {
      document.getElementById('dossier-card').classList.remove('active');
    }

    function renderGlobe() {
      globeCtx.clearRect(0, 0, globeCanvas.width, globeCanvas.height);
      const cx = globeCanvas.width / 2;
      const cy = globeCanvas.height / 2;
      const r = globeCanvas.width * 0.3;

      // Draw Globe Base
      globeCtx.beginPath();
      globeCtx.arc(cx, cy, r, 0, Math.PI * 2);
      globeCtx.fillStyle = '#0f172a';
      globeCtx.fill();
      globeCtx.strokeStyle = '#3b82f6';
      globeCtx.lineWidth = 2;
      globeCtx.stroke();

      // Draw Latitude/Longitude Grid Lines
      globeCtx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
      globeCtx.lineWidth = 1;
      for(let i = -2; i <= 2; i++) {
        globeCtx.beginPath();
        globeCtx.arc(cx, cy, r * (0.3 + i * 0.2), 0, Math.PI * 2);
        globeCtx.stroke();
      }

      // Draw Sector Pins
      sectors.forEach(sec => {
        const phi = (90 - sec.lat) * (Math.PI / 180);
        const theta = (sec.lon + 180) * (Math.PI / 180) + globeAngleY;
        const px = cx + r * Math.sin(phi) * Math.cos(theta);
        const py = cy + r * Math.cos(phi);
        
        globeCtx.beginPath();
        globeCtx.arc(px, py, 6, 0, Math.PI * 2);
        globeCtx.fillStyle = '#f59e0b';
        globeCtx.fill();
        globeCtx.strokeStyle = '#fff';
        globeCtx.stroke();
      });

      requestAnimationFrame(renderGlobe);
    }
    renderGlobe();


    // --- DETROIT 313 GRID RACER GAME LOGIC ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameRunning = false;
    let score = 0, hull = 100, distance = 0;
    let playerLane = 1; // 3 lanes: 0, 1, 2
    let obstacles = [];
    let gameSpeed = 3;
    let turboTimer = 0;

    const lanes = [80, 200, 320];

    function initGame() {
      gameRunning = true;
      score = 0; hull = 100; distance = 0;
      obstacles = [];
      gameSpeed = 3;
      requestAnimationFrame(updateGame);
    }

    function movePlayer(dir) {
      playerLane = Math.max(0, Math.min(2, playerLane + dir));
    }

    function activateTurbo() {
      if(turboTimer <= 0) {
        turboTimer = 120; // 2 seconds at 60fps
        gameSpeed = 7;
      }
    }

    function fireShockwave() {
      obstacles = obstacles.filter(obs => obs.y < canvas.height / 2); // Clears incoming obstacles
    }

    function togglePause() {
      gameRunning = !gameRunning;
      if(gameRunning) requestAnimationFrame(updateGame);
    }

    function updateGame() {
      if(!gameRunning) return;

      // Logic update
      if(turboTimer > 0) {
        turboTimer--;
        if(turboTimer === 0) gameSpeed = 3;
      }
      distance += Math.floor(gameSpeed);

      // Spawn obstacles (red syndicate cars with solid collision)
      if(Math.random() < 0.03) {
        const lane = Math.floor(Math.random() * 3);
        obstacles.push({ lane: lane, y: -40, width: 36, height: 50 });
      }

      // Move obstacles
      for(let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += gameSpeed;

        // COLLISION DETECTION (Marcus's car vs Red Syndicate Obstacle)
        const playerX = lanes[playerLane];
        const playerY = canvas.height - 80;
        const obsX = lanes[obstacles[i].lane];
        const obsY = obstacles[i].y;

        if(Math.abs(playerX - obsX) < 25 && Math.abs(playerY - obsY) < 45) {
          hull -= 25; // Solid impact damage
          obstacles.splice(i, 1);
          if(hull <= 0) {
            alert("CRITICAL SYSTEM FAILURE: Quantum Cruiser Hull Breached!");
            hull = 100; distance = 0; obstacles = [];
          }
          continue;
        }

        // Remove offscreen
        if(obstacles[i].y > canvas.height + 50) {
          obstacles.splice(i, 1);
          score += 10;
        }
      }

      // Render
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Road Lanes
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(140, 0); ctx.lineTo(140, canvas.height);
      ctx.moveTo(260, 0); ctx.lineTo(260, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Obstacles (Red Syndicate Cars with collision boundary)
      obstacles.forEach(obs => {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(lanes[obs.lane] - obs.width/2, obs.y, obs.width, obs.height);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(lanes[obs.lane] - obs.width/2 + 4, obs.y + 8, obs.width - 8, 12);
      });

      // Draw Marcus Prime Quantum Cruiser
      const pX = lanes[playerLane];
      const pY = canvas.height - 80;
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(pX - 18, pY, 36, 50); // Hull
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(pX - 12, pY + 10, 24, 20); // Cockpit
      if(turboTimer > 0) {
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(pX - 10, pY + 50, 20, 15); // Turbo Flame
      }

      // Update HUD
      document.getElementById('score-board').textContent = `HULL: ${hull}% | DIST: ${distance}m`;

      requestAnimationFrame(updateGame);
    }
  </script>
</body>
</html>
