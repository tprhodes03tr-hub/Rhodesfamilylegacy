<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rhodes Family Legacy • Ancestral Vanguard Hub & Gaming Portal</title>
  
  <!-- AR / 3D Libraries -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
    }

    /* 4-WAY STREAMLINED COMMAND BAR */
    .hub-switch-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .switch-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #1e293b;
      padding: 10px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      flex: 1 1 calc(25% - 6px);
      min-height: 44px;
    }
    .switch-btn.active {
      background: #1e293b;
      color: #66fcf1;
      border-color: #66fcf1;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
    }
    .switch-btn.sub-btn.active {
      background: #082f49;
      color: #38bdf8;
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .switch-btn.runner-btn.active {
      background: #1e3a8a;
      color: #60a5fa;
      border-color: #60a5fa;
      box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
    }

    .sandbox-container {
      width: 100%;
      max-width: 820px;
      background: #0b0c10;
      border: 2px solid #66fcf1;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(102, 252, 241, 0.25);
      text-align: center;
      position: relative;
    }
    .sandbox-container.sub-container {
      border-color: #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
    }
    .sandbox-container.runner-container {
      border-color: #60a5fa;
      box-shadow: 0 0 35px rgba(96, 165, 250, 0.25);
    }

    .sandbox-header {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #45a29e;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      color: #66fcf1;
      font-size: 1.2rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: bold;
    }
    p {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #c5c6c7;
      margin-bottom: 12px;
    }
    .game-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 0.75rem;
    }
    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

      padding: 12px 16px;

      border-radius: 6px;
