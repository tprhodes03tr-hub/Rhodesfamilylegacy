<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy • Detroit '313 Grid Intercept</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
    }

    /* QUANTUM SWITCH BAR */
    .hub-switch-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .switch-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #1e293b;
      padding: 8px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      flex: 1;
      min-width: 110px;
      min-height: 40px;
    }
    .switch-btn.active {
      background: #1e3a8a;
      color: #60a5fa;
      border-color: #60a5fa;
      box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
    }
    .switch-btn.globe-btn.active {
      background: #362a05;
      color: #d4af37;
      border-color: #d4af37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .sandbox-container {
      width: 100%;
      max-width: 820px;
      background: #0b0c10;
      border: 2px solid #60a5fa;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(96, 165, 250, 0.25);
      text-align: center;
      position: relative;
    }
    .sandbox-header {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #60a5fa;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      color: #60a5fa;
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border: 1px solid #1e3a8a;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.7rem;
      color: #60a5fa;
      font-weight: bold;
    }
    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .game-btn {
      background-color: #1f2833;
      color: #66fcf1;
      border: 1px solid #45a29e;
      padding: 10px 14px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      width: 100%;
      text-transform: uppercase;
      text-align: left;
      min-height: 42px;
      transition: all 0.2s ease;
    }
    .game-btn:hover, .game-btn:active {
      background-color: #45a29e;
      color: #0b0c10;
      border-color: #66fcf1;
    }
    .back-link {
      display: inline-block;
      margin-top: 12px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #66fcf1;
      text-decoration: underline;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body onload="initRunnerEngine()">

  <!-- QUANTUM SWITCH BAR -->
  <div class="hub-switch-bar">
    <button class="switch-btn active" id="btn-switch-runner" data-target="runner">🏎️ Detroit '313 Grid</button>
    <button class="switch-btn globe-btn" id="btn-switch-globe3d" data-target="globe3d">🌐 Marrow Globe Nexus</button>
  </div>

  <!-- DETROIT '313 TRANSIT GRID (MARCUS PRIME) -->
  <div class="sandbox-container runner-container" id="portal-runner">
    <div class="sandbox-header">Detroit '313 Grid • Marcus Prime Command</div>
    <h1>Woodward Avenue Intercept</h1>

    <div class="stats-bar">
      <span>🚗 Tier: <strong id="car-tier" style="color: #f59e0b;">Tier 1 (Street Stock)</strong></span>
      <span>❤️ Hull: <strong id="car-hull" style="color: #10b981;">100%</strong></span>
      <span>📍 Distance: <strong id="transit-distance">1,500</strong>m</span>
      <span>⚡ Beams: <strong id="beam-count" style="color: #38bdf8;">10</strong></span>
    </div>

    <div style="width: 100%; aspect-ratio: 4 / 3; background: #020617; border: 2px solid #60a5fa; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 10px;">
      <canvas id="runnerCanvas" width="600" height="450" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="choice-grid" style="grid-template-columns: repeat(3, 1fr); display: grid; gap: 6px; margin-bottom: 6px;">
      <button class="game-btn" onclick="moveRunner('left')" style="border-color: #60a5fa; color: #60a5fa; text-align: center;">◀ Steer Left</button>
      <button class="game-btn" onclick="togglePauseGame()" style="background: #1e3a8a; border-color: #60a5fa; color: #f8fafc; text-align: center;" id="pause-btn">⏸️ Pause</button>
      <button class="game-btn" onclick="moveRunner('right')" style="border-color: #60a5fa; color: #60a5fa; text-align: center;">Steer Right ▶</button>
    </div>
    <div class="choice-grid" style="grid-template-columns: 1fr 1fr; display: grid; gap: 6px;">
      <button class="game-btn" onclick="fireElectricBeam()" style="background: #1e293b; border-color: #38bdf8; color: #38bdf8; text-align: center;">⚡ Electric Shock Beam</button>
      <button class="game-btn" onclick="triggerUrbanShockwave()" style="background: #1e3a8a; border-color: #d4af37; color: #d4af37; text-align: center;">✨ Urban Shockwave</button>
    </div>

    <div style="margin-top: 12px;">
      <a href="#" class="back-link" onclick="switchPortal('globe3d')">← Return to Marrow Globe Nexus</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'beam') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'transform') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'orb') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'crash') {
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function switchPortal(target) {
      if (target === 'globe3d') {
        window.location.href = 'index.html'; // Or switch back to globe view
      }
    }

    // DETROIT '313 GRID RUNNER ENGINE WITH TIER TRANSFORMATION & SUPERPOWERS
    function initRunnerEngine() {
      const canvas = document.getElementById('runnerCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      let playerX = 300, targetX = 300, carHull = 100, transitDistance = 1500;
      let electricBeamsCount = 10, runnerItems = [], obstacles = [], electricProjectiles = [];
      let tier = 1, orbsCollected = 0, isPaused = false, roadScrollOffset = 0;
      let shockwaveActive = false, shockwaveRadius = 0;

      window.moveRunner = (dir) => {
        if (isPaused) return;
        playSound('beam');
        if (dir === 'left') targetX = Math.max(120, targetX - 120);
        if (dir === 'right') targetX = Math.min(canvas.width - 120, targetX + 120);
      };

      window.togglePauseGame = () => {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerText = isPaused ? "▶️ Resume" : "⏸️ Pause";
      };

      window.fireElectricBeam = () => {
        if (isPaused || electricBeamsCount <= 0) return;
        electricBeamsCount--;
        document.getElementById('beam-count').innerText = electricBeamsCount;
        playSound('beam');
        electricProjectiles.push({ x: playerX, y: 320, vy: -12 });
      };

      window.triggerUrbanShockwave = () => {
        if (isPaused) return;
        playSound('transform');
        shockwaveActive = true;
        shockwaveRadius = 10;
        obstacles = []; // Clear obstacles on screen with shockwave
      };

      function loop() {
        if (canvas.offsetParent !== null) {
          if (!isPaused) {
            playerX += (targetX - playerX) * 0.25;
            transitDistance = Math.max(0, transitDistance - 4);
            document.getElementById('transit-distance').innerText = Math.floor(transitDistance);
            roadScrollOffset = (roadScrollOffset + 12) % 40;

            // Spawn Orbs / Upgrade Powerups
            if (Math.random() < 0.04 && runnerItems.length < 4) {
              runnerItems.push({ x: [140, 300, 460][Math.floor(Math.random()*3)], y: -30, speed: 4 });
            }
            // Spawn Obstacles
            if (Math.random() < 0.035 && obstacles.length < 3) {
              obstacles.push({ x: [140, 300, 460][Math.floor(Math.random()*3)], y: -30, speed: 4.5, hp: 1 });
            }

            // Move & Check Orbs
            runnerItems.forEach((r, idx) => {
              r.y += r.speed;
              if (Math.abs(playerX - r.x) < 45 && Math.abs(350 - r.y) < 45) {
                playSound('orb');
                orbsCollected++;
                electricBeamsCount += 2;
                runnerItems.splice(idx, 1);

                // Vehicle Tier Transformation Progression
                if (orbsCollected >= 3 && tier === 1) {
                  tier = 2;
                  playSound('transform');
                  document.getElementById('car-tier').innerText = "Tier 2 (Vanguard Enforcer)";
                  document.getElementById('car-tier').style.color = "#38bdf8";
                } else if (orbsCollected >= 7 && tier === 2) {
                  tier = 3;
                  playSound('transform');
                  document.getElementById('car-tier').innerText = "Tier 3 (Apex Quantum Cruiser)";
                  document.getElementById('car-tier').style.color = "#d4af37";
                }
              }
              if (r.y > canvas.height) runnerItems.splice(idx, 1);
            });

            // Move & Check Electric Projectiles against Obstacles
            electricProjectiles.forEach((proj, pIdx) => {
              proj.y += proj.vy;
              obstacles.forEach((obs, oIdx) => {
                if (Math.abs(proj.x - obs.x) < 30 && Math.abs(proj.y - obs.y) < 30) {
                  playSound('crash');
                  obstacles.splice(oIdx, 1);
                  electricProjectiles.splice(pIdx, 1);
                }
              });
              if (proj.y < 0) electricProjectiles.splice(pIdx, 1);
            });

            // Move & Check Obstacles
            obstacles.forEach((obs, idx) => {
              obs.y += obs.speed;
              if (Math.abs(playerX - obs.x) < 45 && Math.abs(350 - obs.y) < 45) {
                playSound('crash');
                carHull -= 25;
                document.getElementById('car-hull').innerText = carHull + '%';
                obstacles.splice(idx, 1);
                if (carHull <= 0) {
                  alert("Mission Interrupted: Vehicle Hull Breached!");
                  transitDistance = 1500;
                  carHull = 100;
                  document.getElementById('car-hull').innerText = "100%";
                }
              }
              if (obs.y > canvas.height) obstacles.splice(idx, 1);
            });
          }

          // Render Highway Grid
          ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = 'rgba(96, 165, 250, 0.4)'; ctx.lineWidth = 3;
          ctx.setLineDash([20, 20]); ctx.lineDashOffset = -roadScrollOffset;
          ctx.beginPath(); ctx.moveTo(220, 0); ctx.lineTo(220, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(380, 0); ctx.lineTo(380, canvas.height); ctx.stroke();
          ctx.setLineDash([]);

          // Render Orbs
          runnerItems.forEach(r => {
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(r.x, r.y, 14, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(r.x, r.y, 5, 0, Math.PI*2); ctx.fill();
          });

          // Render Electric Projectiles
          electricProjectiles.forEach(proj => {
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
            ctx.fillRect(proj.x - 4, proj.y, 8, 20);
            ctx.shadowBlur = 0;
          });

          // Render Obstacles
          obstacles.forEach(obs => {
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
            ctx.fillRect(obs.x - 20, obs.y - 20, 40, 40);
            ctx.shadowBlur = 0;
          });

          // Render Shockwave Effect
          if (shockwaveActive) {
            ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(playerX, 350, shockwaveRadius, 0, Math.PI * 2); ctx.stroke();
            shockwaveRadius += 15;
            if (shockwaveRadius > 400) shockwaveActive = false;
          }

          // Render Marcus Prime's Custom Car based on Tier Transformation
          ctx.save();
          if (tier === 1) {
            // Tier 1: Street Stock Interceptor
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(playerX - 20, 350 - 40, 40, 80);
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(playerX - 16, 350 - 20, 32, 40);
          } else if (tier === 2) {
            // Tier 2: Vanguard Enforcer (Armored Blue & Silver Trim)
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(playerX - 22, 350 - 44, 44, 88);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(playerX - 6, 350 - 30, 12, 60);
          } else {
            // Tier 3: Apex Quantum Cruiser (Gold & Deep Obsidian Armor)
            ctx.fillStyle = '#d4af37';
            ctx.shadowColor = '#d4af37'; ctx.shadowBlur = 15;
            ctx.fillRect(playerX - 24, 350 - 48, 48, 96);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(playerX - 18, 350 - 30, 36, 50);
            ctx.shadowBlur = 0;
          }
          ctx.restore();
        }
        requestAnimationFrame(loop);
      }
      loop();
    }
  </script>
</body>
</html>
