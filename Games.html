<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rhodes Family Legacy • Ancestral Vanguard Planetary Command Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Courier New', Courier, monospace; }
    body { background: #030712; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8px; }
    .hub-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 8px; }
    
    /* Top Command Navigation Bar */
    .top-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: #0f172a; padding: 8px; border-radius: 8px; border: 1px solid #3b82f6; }
    .nav-tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 2px; font-weight: bold; font-size: 0.65rem; border-radius: 4px; text-align: center; cursor: pointer; text-transform: uppercase; }
    .nav-tab.active { background: #3b82f6; color: #fff; border-color: #60a5fa; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }

    /* View Modules */
    .view-module { display: none; flex-direction: column; gap: 8px; }
    .view-module.active { display: flex; }

    /* Module Frame Containers */
    .module-frame { background: #0f172a; border: 2px solid #3b82f6; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); position: relative; }
    .module-frame.gold-border { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.2); }
    .frame-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; background: #020617; padding: 6px 10px; border-radius: 4px; border: 1px solid #1e293b; color: #f59e0b; font-weight: bold; }
    
    .canvas-box { position: relative; width: 100%; height: 260px; background: #020617; border-radius: 4px; overflow: hidden; border: 1px solid #334155; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    /* Dossier Modal Popup */
    #dossier-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(15, 23, 42, 0.98); border: 2px solid #f59e0b; border-radius: 8px; padding: 12px; width: 85%; max-width: 280px; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 50; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); text-align: center; }
    #dossier-card.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    /* Controls & Buttons */
    .control-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; }
    .ctrl-btn { background: #1e293b; color: #fff; border: 1px solid #475569; padding: 10px 4px; font-weight: bold; font-size: 0.7rem; border-radius: 4px; cursor: pointer; text-align: center; }
    .ctrl-btn:active { background: #3b82f6; border-color: #60a5fa; }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .action-btn { background: #1e293b; border: 1px solid #3b82f6; color: #60a5fa; padding: 9px 4px; font-weight: bold; font-size: 0.65rem; border-radius: 4px; cursor: pointer; text-align: center; }
    .action-btn.gold { background: #78350f; border-color: #d97706; color: #fbbf24; }
    .action-btn.red { background: #450a0a; border-color: #ef4444; color: #ef4444; }

    .back-link { text-align: center; margin-top: 2px; font-size: 0.65rem; }
    .back-link a { color: #64748b; text-decoration: none; font-weight: bold; }
    .back-link a:hover { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="hub-container">
    <!-- Cohesive Planetary Navigation -->
    <nav class="top-nav">
      <button class="nav-tab active" id="tab-globe" onclick="switchView('globe')">3D AR Globe</button>
      <button class="nav-tab" id="tab-grid" onclick="switchView('grid')">Detroit '313 Grid</button>
      <button class="nav-tab" id="tab-sub" onclick="switchView('sub')">Wakan Sub Ops</button>
    </nav>

    <!-- 1. 3D AR GLOBE MATRIX VIEW -->
    <div class="view-module active" id="view-globe">
      <div class="module-frame">
        <div class="frame-header">
          <span>MARROW GLOBE MATRIX</span>
          <span style="color: #3b82f6;">TOUCH & ROTATE</span>
        </div>
        <div class="canvas-box" style="height: 260px;">
          <canvas id="globe-canvas"></canvas>
        </div>
        <div style="font-size: 0.6rem; color: #94a3b8; text-align: center;">Tap glowing sector pins to open operative dossier cards.</div>
        
        <!-- Dossier Modal Popup -->
        <div id="dossier-card">
          <div style="font-size: 0.55rem; color: #f59e0b; font-weight: bold; margin-bottom: 2px;">⚡ VANGUARD DOSSIER</div>
          <h3 id="dossier-title" style="font-size: 0.8rem; color: #fff; margin-bottom: 4px;">Marcus Prime</h3>
          <p id="dossier-desc" style="font-size: 0.65rem; color: #94a3b8; line-height: 1.2; margin-bottom: 8px;"></p>
          <button onclick="closeDossier()" style="background: #3b82f6; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.6rem; cursor: pointer;">CLOSE</button>
        </div>
      </div>
    </div>

    <!-- 2. DETROIT '313 GRID RACER VIEW -->
    <div class="view-module" id="view-grid">
      <div class="module-frame gold-border">
        <div class="frame-header">
          <span>MARCUS PRIME // WOODWARD AVE INTERCEPT</span>
          <span id="score-board">HULL: 100% | DIST: 0m</span>
        </div>
        <div class="canvas-box">
          <canvas id="gridCanvas"></canvas>
        </div>
        <div class="control-grid">
          <button class="ctrl-btn" style="background: #0e7490; border-color: #22d3ee; color: #fff;" ontouchstart="moveGrid(-1)" onmousedown="moveGrid(-1)">◄ STEER LEFT</button>
          <button class="ctrl-btn" style="background: #1e3a8a; border-color: #3b82f6; color: #fff;" onclick="toggleGridPause()">PAUSE</button>
          <button class="ctrl-btn" ontouchstart="moveGrid(1)" onmousedown="moveGrid(1)">STEER RIGHT ►</button>
        </div>
        <div class="action-grid">
          <button class="action-btn gold" ontouchstart="activateTurbo()" onmousedown="activateTurbo()">⚡ TURBO BOOST</button>
          <button class="action-btn" ontouchstart="fireElectricBeam()" onmousedown="fireElectricBeam()">⚡ ELECTRIC SHOCK BEAM</button>
        </div>
        <div class="action-grid" style="grid-template-columns: 1fr;">
          <button class="action-btn gold" ontouchstart="fireShockwave()" onmousedown="fireShockwave()">⚡ URBAN SHOCKWAVE</button>
        </div>
      </div>
    </div>

    <!-- 3. WAKAN TRENCH SUBMARINE OPS VIEW -->
    <div class="view-module" id="view-sub">
      <div class="module-frame">
        <div class="frame-header">
          <span style="color: #00f3ff;">WAKAN TRENCH // TEMPLE REEF DEFENSE</span>
          <span id="sub-hud" style="color: #00f3ff;">HULL: 100% | AMMO: 20</span>
        </div>
        <div class="canvas-box" style="border-color: #00f3ff;">
          <canvas id="subCanvas"></canvas>
        </div>
        <div class="control-grid">
          <button class="ctrl-btn" style="border-color: #00f3ff; color: #00f3ff;" ontouchstart="moveSub(-1)" onmousedown="moveSub(-1)">◀ PORT</button>
          <button class="ctrl-btn" style="border-color: #fbbf24; color: #fbbf24;" onclick="toggleSubPause()">PAUSE</button>
          <button class="ctrl-btn" style="border-color: #00f3ff; color: #00f3ff;" ontouchstart="moveSub(1)" onmousedown="moveSub(1)">STARBOARD ▶</button>
        </div>
        <div class="action-grid" style="grid-template-columns: repeat(3, 1fr);">
          <button class="action-btn red" onclick="fireSubWeapon('torpedo')">🚀 TORPEDO</button>
          <button class="action-btn gold" onclick="fireSubWeapon('laser')">⚡ LASER</button>
          <button class="action-btn" style="border-color: #00f3ff; color: #00f3ff;" onclick="triggerShield()">🛡️ SHIELD</button>
        </div>
      </div>
    </div>

    <div class="back-link">
      <a href="index.html">← RETURN TO MAIN LEGACY PORTAL</a>
    </div>
  </div>

  <script>
    // --- VIEW SWITCHING ---
    function switchView(view) {
      ['globe', 'grid', 'sub'].forEach(v => {
        document.getElementById('tab-' + v).className = v === view ? 'nav-tab active' : 'nav-tab';
        document.getElementById('view-' + v).className = v === view ? 'view-module active' : 'view-module';
      });

      if(view === 'globe') resizeGlobe();
      if(view === 'grid') { resizeGridCanvas(); if(!gridRunning) initGridGame(); }
      if(view === 'sub') { resizeSubCanvas(); if(!subRunning) initSubGame(); }
    }

    // --- 3D AR GLOBE LOGIC ---
    const globeCanvas = document.getElementById('globe-canvas');
    const globeCtx = globeCanvas.getContext('2d');
    let globeAngleY = 0, isDragging = false, lastMouseX = 0;

    const sectors = [
      { name: "Marcus Prime // Detroit Grid", lat: 42.33, lon: -83.04, desc: "Industrial Grid Core & Detroit Marrow Foundation. High kinetic output and armored grid defense." },
      { name: "Wakan // Caribbean Trench Ops", lat: 18.48, lon: -69.93, desc: "Storm-Tide Sentinel & Deep Submarine Command defending the Temple Reef Sanctuary." },
      { name: "Kaele // Forest-Heart Sentinel", lat: -15.5, lon: -68.0, desc: "Commanding flora, geological mass, and stabilizing genealogical lines across the Andes." }
    ];

    function resizeGlobe() {
      globeCanvas.width = globeCanvas.clientWidth || 380;
      globeCanvas.height = globeCanvas.clientHeight || 260;
    }
    window.addEventListener('resize', resizeGlobe);
    resizeGlobe();

    globeCanvas.addEventListener('pointerdown', e => { isDragging = true; lastMouseX = e.clientX; });
    window.addEventListener('pointermove', e => {
      if(!isDragging) return;
      globeAngleY += (e.clientX - lastMouseX) * 0.01;
      lastMouseX = e.clientX;
    });
    window.addEventListener('pointerup', () => isDragging = false);

    globeCanvas.addEventListener('click', e => {
      const rect = globeCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      sectors.forEach(sec => {
        const rad = globeCanvas.width * 0.28;
        const phi = (90 - sec.lat) * (Math.PI / 180);
        const theta = (sec.lon + 180) * (Math.PI / 180) + globeAngleY;
        const px = globeCanvas.width/2 + rad * Math.sin(phi) * Math.cos(theta);
        const py = globeCanvas.height/2 + rad * Math.cos(phi);
        if(Math.hypot(x - px, y - py) < 25) showDossier(sec.name, sec.desc);
      });
    });

    function showDossier(title, desc) {
      document.getElementById('dossier-title').textContent = title;
      document.getElementById('dossier-desc').textContent = desc;
      document.getElementById('dossier-card').classList.add('active');
    }
    function closeDossier() { document.getElementById('dossier-card').classList.remove('active'); }

    function renderGlobe() {
      if(document.getElementById('view-globe').classList.contains('active')) {
        globeCtx.clearRect(0, 0, globeCanvas.width, globeCanvas.height);
        const cx = globeCanvas.width / 2, cy = globeCanvas.height / 2, r = globeCanvas.width * 0.28;

        globeCtx.beginPath(); globeCtx.arc(cx, cy, r, 0, Math.PI * 2);
        globeCtx.fillStyle = '#0f172a'; globeCtx.fill();
        globeCtx.strokeStyle = '#3b82f6'; globeCtx.lineWidth = 2; globeCtx.stroke();

        globeCtx.strokeStyle = 'rgba(59, 130, 246, 0.2)'; globeCtx.lineWidth = 1;
        for(let i = -2; i <= 2; i++) {
          globeCtx.beginPath(); globeCtx.arc(cx, cy, r * (0.3 + i * 0.2), 0, Math.PI * 2); globeCtx.stroke();
        }

        sectors.forEach(sec => {
          const phi = (90 - sec.lat) * (Math.PI / 180);
          const theta = (sec.lon + 180) * (Math.PI / 180) + globeAngleY;
          const px = cx + r * Math.sin(phi) * Math.cos(theta);
          const py = cy + r * Math.cos(phi);
          globeCtx.beginPath(); globeCtx.arc(px, py, 6, 0, Math.PI * 2);
          globeCtx.fillStyle = '#f59e0b'; globeCtx.fill(); globeCtx.strokeStyle = '#fff'; globeCtx.stroke();
        });
      }
      requestAnimationFrame(renderGlobe);
    }
    renderGlobe();


    // --- DETROIT 313 GRID RACER LOGIC ---
    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');
    let gridRunning = false, gridPaused = false;
    let gridHull = 100, gridDist = 0, playerLane = 1, gridObstacles = [], gridBeams = [], gridSpeed = 3, turbo = 0;

    function resizeGridCanvas() {
      gridCanvas.width = gridCanvas.clientWidth || 380;
      gridCanvas.height = gridCanvas.clientHeight || 260;
    }

    function initGridGame() {
      resizeGridCanvas();
      gridRunning = true;
      gridHull = 100; gridDist = 0; gridObstacles = []; gridBeams = []; gridSpeed = 3;
      requestAnimationFrame(updateGridGame);
    }

    function moveGrid(dir) { if(gridRunning && !gridPaused) playerLane = Math.max(0, Math.min(2, playerLane + dir)); }
    function toggleGridPause() { gridPaused = !gridPaused; }
    function activateTurbo() { if(turbo <= 0) { turbo = 100; gridSpeed = 7; } }
    function fireShockwave() { gridObstacles = gridObstacles.filter(o => o.y < gridCanvas.height / 2); }
    function fireElectricBeam() {
      const laneWidth = gridCanvas.width / 3;
      const lanes = [laneWidth * 0.5, laneWidth * 1.5, laneWidth * 2.5];
      gridBeams.push({ x: lanes[playerLane], y: gridCanvas.height - 70, vy: -14 });
    }

    function updateGridGame() {
      if(!gridRunning || !document.getElementById('view-grid').classList.contains('active')) {
        if(gridRunning) requestAnimationFrame(updateGridGame);
        return;
      }
      if(!gridPaused) {
        if(turbo > 0) { turbo--; if(turbo === 0) gridSpeed = 3; }
        gridDist += Math.floor(gridSpeed);

        if(Math.random() < 0.03) {
          gridObstacles.push({ lane: Math.floor(Math.random() * 3), y: -40, w: 34, h: 45 });
        }

        const laneWidth = gridCanvas.width / 3;
        const lanes = [laneWidth * 0.5, laneWidth * 1.5, laneWidth * 2.5];

        for(let i = gridBeams.length - 1; i >= 0; i--) {
          let b = gridBeams[i]; b.y += b.vy;
          for(let j = gridObstacles.length - 1; j >= 0; j--) {
            let obs = gridObstacles[j];
            if(Math.abs(b.x - lanes[obs.lane]) < 25 && Math.abs(b.y - obs.y) < 30) {
              gridObstacles.splice(j, 1);
              gridBeams.splice(i, 1);
              break;
            }
          }
          if(b && b.y < 0) gridBeams.splice(i, 1);
        }

        for(let i = gridObstacles.length - 1; i >= 0; i--) {
          let obs = gridObstacles[i]; obs.y += gridSpeed;
          if(Math.abs(lanes[playerLane] - lanes[obs.lane]) < 22 && Math.abs(gridCanvas.height - 70 - obs.y) < 40) {
            gridHull -= 25; 
            gridObstacles.splice(i, 1);
            if(gridHull <= 0) { alert("Critical System Failure: Quantum Cruiser Hull Breached!"); gridHull = 100; gridDist = 0; }
          }
          if(obs.y > gridCanvas.height) gridObstacles.splice(i, 1);
        }
      }

      gridCtx.fillStyle = '#020617'; gridCtx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);
      
      const laneWidth = gridCanvas.width / 3;
      const lanes = [laneWidth * 0.5, laneWidth * 1.5, laneWidth * 2.5];

      gridCtx.strokeStyle = '#334155'; gridCtx.lineWidth = 2; gridCtx.setLineDash([15, 15]);
      gridCtx.beginPath();
      gridCtx.moveTo(laneWidth, 0); gridCtx.lineTo(laneWidth, gridCanvas.height);
      gridCtx.moveTo(laneWidth * 2, 0); gridCtx.lineTo(laneWidth * 2, gridCanvas.height);
      gridCtx.stroke(); gridCtx.setLineDash([]);

      gridObstacles.forEach(obs => {
        gridCtx.fillStyle = '#ef4444';
        gridCtx.fillRect(lanes[obs.lane] - obs.w/2, obs.y, obs.w, obs.h);
        gridCtx.fillStyle = '#b91c1c';
        gridCtx.fillRect(lanes[obs.lane] - obs.w/2 + 4, obs.y + 6, obs.w - 8, 10);
      });

      gridBeams.forEach(b => {
        gridCtx.fillStyle = '#38bdf8';
        gridCtx.shadowColor = '#38bdf8'; gridCtx.shadowBlur = 10;
        gridCtx.fillRect(b.x - 2, b.y, 4, 16);
        gridCtx.shadowBlur = 0;
      });

      const pX = lanes[playerLane], pY = gridCanvas.height - 70;
      gridCtx.fillStyle = '#38bdf8'; gridCtx.fillRect(pX - 18, pY, 36, 45);
      gridCtx.fillStyle = '#f59e0b'; gridCtx.fillRect(pX - 12, pY + 8, 24, 18);
      if(turbo > 0) {
        gridCtx.fillStyle = '#ec4899';
        gridCtx.fillRect(pX - 10, pY + 45, 20, 15);
      }

      document.getElementById('score-board').textContent = `HULL: ${gridHull}% | DIST: ${gridDist}m`;
      requestAnimationFrame(updateGridGame);
    }


    // --- WAKAN SUBMARINE GAME LOGIC ---
    const subCanvas = document.getElementById('subCanvas');
    const subCtx = subCanvas.getContext('2d');
    let subRunning = false, subPaused = false;
    let subHull = 100, subAmmo = 20, subDepth = 4500, subX = 215;
    let subObstacles = [], subProjectiles = [], jellyfish = [], floorOffset = 0;
    let shieldActive = false, shieldTimer = 0;

    for(let i=0; i<8; i++) {
      jellyfish.push({ x: Math.random()*450, y: Math.random()*300, r: 6 + Math.random()*4, vy: 0.5 });
    }

    function resizeSubCanvas() {
      subCanvas.width = subCanvas.clientWidth || 380;
      subCanvas.height = subCanvas.clientHeight || 260;
    }

    function initSubGame() {
      resizeSubCanvas();
      subRunning = true;
      subHull = 100; subAmmo = 20; subDepth = 4500;
      subObstacles = []; subProjectiles = [];
      requestAnimationFrame(updateSubGame);
    }

    function moveSub(dir) { if(subRunning && !subPaused) subX = Math.max(30, Math.min(subCanvas.width - 40, subX + dir * 18)); }
    function toggleSubPause() { subPaused = !subPaused; }
    function fireSubWeapon(type) {
      if(!subRunning || subPaused) return;
      if(type === 'torpedo' && subAmmo > 0) { subAmmo--; subProjectiles.push({x: subX+18, y: 170, vy: -10, type: 'torpedo'}); }
      if(type === 'laser') { subProjectiles.push({x: subX+18, y: 170, vy: -16, type: 'laser'}); }
      document.getElementById('sub-hud').textContent = `HULL: ${subHull}% | AMMO: ${subAmmo}`;
    }
    function triggerShield() { if(!shieldActive) { shieldActive = true; shieldTimer = 80; } }

    function updateSubGame() {
      if(!subRunning || !document.getElementById('view-sub').classList.contains('active')) {
        if(subRunning) requestAnimationFrame(updateSubGame);
        return;
      }
      if(!subPaused) {
        subDepth -= 1.5; floorOffset += 1.2;
        if(shieldActive) { shieldTimer--; if(shieldTimer <= 0) shieldActive = false; }
        
        jellyfish.forEach(j => { j.y -= j.vy; if(j.y < 0) j.y = subCanvas.height; });

        if(Math.random() < 0.03) {
          subObstacles.push({ x: Math.random()*(subCanvas.width-50), y: -40, w: 38, h: 32, speed: 2 });
        }

        for(let i = subObstacles.length - 1; i >= 0; i--) {
          let obs = subObstacles[i]; obs.y += obs.speed;
          if(Math.abs(subX - obs.x) < 30 && Math.abs(180 - obs.y) < 30) {
            if(!shieldActive) subHull -= 20;
            subObstacles.splice(i, 1);
            if(subHull <= 0) { alert("Submarine Hull Breached!"); subHull = 100; }
          }
          if(obs.y > subCanvas.height) subObstacles.splice(i, 1);
        }

        for(let i = subProjectiles.length - 1; i >= 0; i--) {
          let p = subProjectiles[i]; p.y += p.vy;
          if(p.y < 0) subProjectiles.splice(i, 1);
        }
      }

      subCtx.fillStyle = '#00040a'; subCtx.fillRect(0, 0, subCanvas.width, subCanvas.height);
      
      subCtx.fillStyle = '#041224';
      subCtx.beginPath(); subCtx.moveTo(0, subCanvas.height);
      for(let x=0; x<=subCanvas.width; x+=20) {
        subCtx.lineTo(x, subCanvas.height - (Math.sin((x + floorOffset)*0.03)*10 + 20));
      }
      subCtx.lineTo(subCanvas.width, subCanvas.height); subCtx.fill();

      subCtx.fillStyle = 'rgba(0, 243, 255, 0.4)';
      jellyfish.forEach(j => { subCtx.beginPath(); subCtx.arc(j.x, j.y, j.r, 0, Math.PI*2); subCtx.fill(); });

      // Submarine Sprite
      subCtx.fillStyle = '#00f3ff';
      subCtx.fillRect(subX, 170, 36, 48);
      subCtx.fillStyle = '#fbbf24';
      subCtx.fillRect(subX+10, 155, 16, 18);
      if(shieldActive) {
        subCtx.strokeStyle = '#00f3ff'; subCtx.lineWidth = 2;
        subCtx.beginPath(); subCtx.arc(subX+18, 190, 32, 0, Math.PI*2); subCtx.stroke();
      }

      subObstacles.forEach(obs => {
        subCtx.fillStyle = '#ef4444'; subCtx.fillRect(obs.x, obs.y, obs.w, obs.h);
      });
      subProjectiles.forEach(p => {
        subCtx.fillStyle = p.type === 'laser' ? '#fbbf24' : '#00f3ff';
        subCtx.fillRect(p.x, p.y, 4, 12);
      });

      document.getElementById('sub-hud').textContent = `HULL: ${subHull}% | DEPTH: ${Math.max(0, Math.floor(subDepth))}m`;
      requestAnimationFrame(updateSubGame);
    }

    // Auto-init grid game on load so it sizes correctly
    window.addEventListener('DOMContentLoaded', () => {
      resizeGridCanvas();
      resizeSubCanvas();
      initGridGame();
    });
  </script>
</body>
</html>
