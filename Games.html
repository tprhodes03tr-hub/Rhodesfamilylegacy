<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ancestral Vanguard • Cyber-Grid Grand Prix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050b14;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .sandbox-container {
      width: 100%;
      max-width: 460px;
      background: #0b0c10;
      border: 2px solid #66fcf1;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(102, 252, 241, 0.35);
      text-align: center;
      position: relative;
    }
    .sandbox-header {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #45a29e;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      color: #66fcf1;
      font-size: 1.25rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: #38bdf8;
      font-weight: bold;
    }
    .epoch-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .epoch-btn {
      background: #111827;
      color: #94a3b8;
      border: 1px solid #1f2937;
      padding: 8px;
      font-size: 0.72rem;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      flex: 1;
      text-transform: uppercase;
    }
    .epoch-btn.active {
      background: #45a29e;
      color: #0b0c10;
      border-color: #66fcf1;
    }
    /* Expanded canvas view for crystal-clear vehicle tracking */
    canvas {
      background: radial-gradient(circle, #0f172a 0%, #020617 100%);
      border: 2px solid #66fcf1;
      border-radius: 8px;
      display: block;
      margin: 0 auto 12px auto;
      width: 100%;
      max-width: 420px;
      height: 380px;
      box-shadow: inset 0 0 25px rgba(0,255,255,0.25);
    }
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .game-btn {
      background-color: #1f2833;
      color: #66fcf1;
      border: 1px solid #45a29e;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      width: 100%;
      text-transform: uppercase;
      text-align: center;
    }
    .game-btn:hover {
      background-color: #45a29e;
      color: #0b0c10;
    }
    .game-btn.secondary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border-color: #f59e0b;
      font-weight: 900;
    }
    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #66fcf1;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="sandbox-container" id="racerContainer">
    <div class="sandbox-header">Vanguard Grid • Detroit Speedway</div>
    <h1>Cyber-Grid Grand Prix</h1>

    <div class="stats-bar">
      <span>🏎️ <span id="racer-car-name" style="color: #66fcf1;">Marcus Interceptor</span></span>
      <span>⚡ <span id="racer-speed">130 MPH</span></span>
      <span>✨ ME: <strong id="racer-me" style="color: #f59e0b;">0</strong></span>
    </div>

    <!-- VEHICLE SELECTOR -->
    <div class="epoch-selector">
      <button class="epoch-btn active" id="btn-car-hero" onclick="selectRacerCar('hero')">🛡️ Marcus Interceptor</button>
      <button class="epoch-btn" id="btn-car-villain" onclick="selectRacerCar('villain')">⚡ Ashen Dragster</button>
    </div>

    <!-- Expanded 420x380 Canvas -->
    <canvas id="racerCanvas" width="420" height="380"></canvas>

    <div class="choice-grid">
      <button class="game-btn" onclick="steerRacer(-30)">◄ STEER LEFT</button>
      <button class="game-btn" onclick="steerRacer(30)">STEER RIGHT ►</button>
    </div>
    <div style="margin-top: 8px;">
      <button class="game-btn secondary" onclick="triggerTurboBoost()">🔥 IGNITE TURBO BOOST! (<span id="boost-status">READY</span>)</button>
    </div>

    <p id="racer-status" style="font-size: 0.78rem; color: #38bdf8; margin-top: 10px;">Collect Marrow Orbs & Avoid Syndicate Barricades!</p>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let racerCanvas, racerCtx;
    let racerAnimId = null;
    let carType = 'hero';
    let racerState = {
      x: 210,
      y: 280,
      speed: 130,
      baseSpeed: 130,
      maxSpeed: 260,
      distance: 0,
      marrowEarned: 0,
      turboActive: false,
      turboTimer: 0,
      obstacles: [],
      orbs: []
    };

    function selectRacerCar(type) {
      carType = type;
      document.getElementById('btn-car-hero').classList.toggle('active', type === 'hero');
      document.getElementById('btn-car-villain').classList.toggle('active', type === 'villain');
      
      if (type === 'hero') {
        document.getElementById('racer-car-name').innerText = "Marcus Interceptor";
        racerState.baseSpeed = 130;
      } else {
        document.getElementById('racer-car-name').innerText = "Ashen Dragster";
        racerState.baseSpeed = 150;
      }
    }

    function initRacerEngine() {
      racerCanvas = document.getElementById('racerCanvas');
      if (!racerCanvas) return;
      racerCtx = racerCanvas.getContext('2d');
      
      racerState.distance = 0;
      racerState.marrowEarned = 0;
      racerState.obstacles = [];
      racerState.orbs = [];
      
      if (!racerAnimId) {
        racerLoop();
      }
    }

    function steerRacer(dx) {
      racerState.x = Math.max(65, Math.min(355, racerState.x + dx));
    }

    function triggerTurboBoost() {
      if (racerState.turboActive) return;
      racerState.turboActive = true;
      racerState.turboTimer = 110;
      document.getElementById('boost-status').innerText = "ACTIVE!";
    }

    function racerLoop() {
      if (!racerCanvas || racerCtx.canvas.offsetParent === null) {
        racerAnimId = requestAnimationFrame(racerLoop);
        return;
      }

      let currentSpeed = racerState.baseSpeed;
      if (racerState.turboActive) {
        currentSpeed = racerState.maxSpeed;
        racerState.turboTimer--;
        if (racerState.turboTimer <= 0) {
          racerState.turboActive = false;
          document.getElementById('boost-status').innerText = "READY";
        }
      }

      racerState.distance += Math.round(currentSpeed / 20);
      document.getElementById('racer-speed').innerText = currentSpeed + " MPH";
      document.getElementById('racer-me').innerText = racerState.marrowEarned + " ME";

      // Spawn Barricades
      if (Math.random() < 0.04 && racerState.obstacles.length < 3) {
        const laneX = [95, 170, 245, 320];
        racerState.obstacles.push({
          x: laneX[Math.floor(Math.random() * laneX.length)],
          y: -50,
          width: 52,
          height: 26
        });
      }

      // Spawn Marrow Orbs
      if (Math.random() < 0.05 && racerState.orbs.length < 3) {
        const laneX = [115, 205, 285, 345];
        racerState.orbs.push({
          x: laneX[Math.floor(Math.random() * laneX.length)],
          y: -40,
          radius: 12
        });
      }

      // Render Canvas
      racerCtx.clearRect(0, 0, racerCanvas.width, racerCanvas.height);

      // Draw Detroit Grid Speed Lines
      racerCtx.strokeStyle = "rgba(102, 252, 241, 0.18)";
      racerCtx.lineWidth = 1.5;
      for (let i = 0; i < racerCanvas.width; i += 45) {
        racerCtx.beginPath();
        racerCtx.moveTo(i, 0);
        racerCtx.lineTo(i, racerCanvas.height);
        racerCtx.stroke();
      }

      // Draw Track Border
      racerCtx.strokeStyle = carType === 'hero' ? "#38bdf8" : "#ef4444";
      racerCtx.lineWidth = 3.5;
      racerCtx.strokeRect(40, 15, 340, 350);

      // Update & Draw Orbs
      racerState.orbs.forEach((orb, index) => {
        orb.y += (currentSpeed / 22);
        racerCtx.fillStyle = "#f59e0b";
        racerCtx.beginPath();
        racerCtx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        racerCtx.fill();
        racerCtx.strokeStyle = "#fff";
        racerCtx.lineWidth = 2;
        racerCtx.stroke();

        if (Math.abs(orb.x - racerState.x) < 30 && Math.abs(orb.y - racerState.y) < 30) {
          racerState.marrowEarned += 25;
          racerState.orbs.splice(index, 1);
        }

        if (orb.y > 400) racerState.orbs.splice(index, 1);
      });

      // Update & Draw Obstacles
      racerCtx.fillStyle = "#ef4444";
      racerState.obstacles.forEach((obs, index) => {
        obs.y += (currentSpeed / 22);
        racerCtx.fillRect(obs.x - 26, obs.y, obs.width, obs.height);
        racerCtx.strokeStyle = "#facc15";
        racerCtx.lineWidth = 2;
        racerCtx.strokeRect(obs.x - 26, obs.y, obs.width, obs.height);

        if (Math.abs(obs.x - racerState.x) < 32 && Math.abs(obs.y - racerState.y) < 28) {
          racerState.distance = Math.max(0, racerState.distance - 150);
          racerState.marrowEarned = Math.max(0, racerState.marrowEarned - 10);
          racerState.obstacles.splice(index, 1);
        }

        if (obs.y > 410) racerState.obstacles.splice(index, 1);
      });

      // Draw Player Interceptor (Larger & Detailed)
      racerCtx.save();
      racerCtx.translate(racerState.x, racerState.y);
      if (carType === 'hero') {
        racerCtx.fillStyle = "#0a2540";
        racerCtx.fillRect(-22, -18, 44, 36);
        racerCtx.strokeStyle = "#38bdf8";
        racerCtx.lineWidth = 2.5;
        racerCtx.strokeRect(-22, -18, 44, 36);
        racerCtx.fillStyle = "#38bdf8";
        racerCtx.fillRect(-14, -12, 28, 14);
      } else {
        racerCtx.fillStyle = "#2b0a0a";
        racerCtx.fillRect(-24, -20, 48, 40);
        racerCtx.strokeStyle = "#ef4444";
        racerCtx.lineWidth = 2.5;
        racerCtx.strokeRect(-24, -20, 48, 40);
        racerCtx.fillStyle = "#f59e0b";
        racerCtx.fillRect(-16, -12, 32, 12);
      }

      // Turbo Flame Effect
      if (racerState.turboActive) {
        racerCtx.fillStyle = "#f59e0b";
        racerCtx.fillRect(-12, 18, 24, 22 + Math.random() * 12);
      }
      racerCtx.restore();

      document.getElementById('racer-status').innerText = `Distance: ${racerState.distance}m | Marrow Earned: ${racerState.marrowEarned} ME`;
      racerAnimId = requestAnimationFrame(racerLoop);
    }

    window.onload = () => {
      initRacerEngine();
    };
  </script>
</body>
</html>
