<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rhodes Family Legacy - Heritage Learning Arcade</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    padding: 0;
    background: #060b18;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: #0d1b2a;
    border: 3px solid #ffb703;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
  }
  /* Age Bar */
  #age-nav {
    display: flex;
    background: #000814;
    border-bottom: 2px solid #ffb703;
  }
  .age-tab {
    flex: 1;
    padding: 10px 4px;
    font-size: 0.85rem;
    font-weight: bold;
    border: none;
    background: transparent;
    color: #8da9c4;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .age-tab.active {
    background: #ffb703;
    color: #000814;
  }
  /* Header Info */
  #status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(13, 27, 42, 0.95);
    border-bottom: 1px solid rgba(255, 183, 3, 0.3);
  }
  #target-prompt {
    font-size: 1.4rem;
    font-weight: 800;
    color: #ffd166;
  }
  #score-display {
    font-size: 1rem;
    font-weight: 700;
    color: #06d6a0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 420px;
    background: linear-gradient(180deg, #1d3557 0%, #457b9d 60%, #1b4332 60%, #081c15 100%);
  }
  /* Bottom Controls */
  #touch-deck {
    display: flex;
    background: #000814;
    padding: 12px;
    gap: 12px;
  }
  .steer-btn {
    flex: 1;
    padding: 16px 0;
    font-size: 1.25rem;
    font-weight: 900;
    border: none;
    border-radius: 10px;
    background: #ffb703;
    color: #000814;
    box-shadow: 0 4px #c79100;
    cursor: pointer;
  }
  .steer-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px #c79100;
  }
  /* Banner Overlay */
  #celebration-overlay {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    font-weight: 900;
    color: #fff;
    background: rgba(255, 0, 84, 0.9);
    padding: 8px 18px;
    border-radius: 12px;
    border: 2px solid #fff;
    display: none;
    pointer-events: none;
    text-shadow: 1px 1px 3px #000;
  }
  /* Back to Hub footer */
  #hub-link {
    text-align: center;
    padding: 8px;
    background: #000814;
    border-top: 1px solid #1f2a44;
  }
  #hub-link a {
    color: #ffb703;
    font-size: 0.85rem;
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- Age Selector Tabs -->
  <div id="age-nav">
    <button class="age-tab" id="tab-toddler" onclick="setMode('toddler')">Ages 2-4<br>Colors & Pop</button>
    <button class="age-tab active" id="tab-explorer" onclick="setMode('explorer')">Ages 5-7<br>Add & Sub</button>
    <button class="age-tab" id="tab-master" onclick="setMode('master')">Ages 8-10<br>Vanguard Math</button>
  </div>

  <div id="status-bar">
    <div id="target-prompt">Ready!</div>
    <div id="score-display">Stars: 0 ⭐</div>
  </div>

  <canvas id="gameCanvas" width="480" height="420"></canvas>
  <div id="celebration-overlay">AWESOME! ⭐</div>

  <div id="touch-deck">
    <button class="steer-btn" id="leftBtn">◀ BUMP LEFT</button>
    <button class="steer-btn" id="rightBtn">BUMP RIGHT ▶</button>
  </div>

  <div id="hub-link">
    <a href="index.html">← Return to Rhodes Family Legacy Store & Library</a>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const promptEl = document.getElementById("target-prompt");
const scoreEl = document.getElementById("score-display");
const banner = document.getElementById("celebration-overlay");

let currentMode = "explorer"; // 'toddler', 'explorer', 'master'
let score = 0;
let car = { x: 200, y: 330, width: 80, height: 48, speed: 6, dx: 0 };
let balloons = [];
let targetVal = 0;

const COLORS = [
  { name: "RED", hex: "#e63946" },
  { name: "GOLD", hex: "#ffb703" },
  { name: "BLUE", hex: "#48cae4" },
  { name: "GREEN", hex: "#52b788" },
  { name: "PURPLE", hex: "#9d4edd" }
];

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.age-tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${mode}`).classList.add('active');
  
  // Adapt car speed to age
  if (mode === "toddler") car.speed = 5;
  if (mode === "explorer") car.speed = 7;
  if (mode === "master") car.speed = 9;

  spawnChallenge();
}

function spawnChallenge() {
  balloons = [];
  
  if (currentMode === "toddler") {
    // Pick target color
    const picked = COLORS[Math.floor(Math.random() * COLORS.length)];
    targetVal = picked.name;
    promptEl.textContent = `HIT: ${picked.name}!`;
    
    // 3 Balloons with names/colors
    const shuffled = [...COLORS].sort(() => Math.random() - 0.5).slice(0, 3);
    if (!shuffled.some(c => c.name === targetVal)) shuffled[0] = picked;
    shuffled.sort(() => Math.random() - 0.5);

    shuffled.forEach((c, i) => {
      balloons.push({
        x: 70 + i * 170,
        y: 20,
        radius: 40,
        val: c.name,
        color: c.hex,
        speed: 1.0
      });
    });

  } else if (currentMode === "explorer") {
    // Single-digit addition or subtraction
    const isAdd = Math.random() > 0.3;
    let n1, n2;
    if (isAdd) {
      n1 = Math.floor(Math.random() * 5) + 1;
      n2 = Math.floor(Math.random() * 5) + 1;
      targetVal = n1 + n2;
      promptEl.textContent = `${n1} + ${n2} = ?`;
    } else {
      n1 = Math.floor(Math.random() * 6) + 4;
      n2 = Math.floor(Math.random() * 3) + 1;
      targetVal = n1 - n2;
      promptEl.textContent = `${n1} - ${n2} = ?`;
    }

    const opts = [targetVal, targetVal + 1, Math.max(1, targetVal - 1)].sort(() => Math.random() - 0.5);
    const colorMix = ["#e63946", "#ffb703", "#48cae4"];

    opts.forEach((val, i) => {
      balloons.push({
        x: 70 + i * 170,
        y: 20,
        radius: 36,
        val: val,
        color: colorMix[i],
        speed: 1.4
      });
    });

  } else if (currentMode === "master") {
    // Multiplication tables (3x3 to 9x9)
    const n1 = Math.floor(Math.random() * 7) + 3;
    const n2 = Math.floor(Math.random() * 7) + 3;
    targetVal = n1 * n2;
    promptEl.textContent = `${n1} × ${n2} = ?`;

    const opts = [targetVal, targetVal + n1, targetVal - n2].sort(() => Math.random() - 0.5);
    const colorMix = ["#ff0054", "#7209b7", "#06d6a0"];

    opts.forEach((val, i) => {
      balloons.push({
        x: 70 + i * 170,
        y: 20,
        radius: 34,
        val: val,
        color: colorMix[i],
        speed: 2.2 // fast fall rate
      });
    });
  }
}

function drawPlayer() {
  // Bumper chassis
  ctx.fillStyle = currentMode === "master" ? "#118ab2" : "#e63946";
  ctx.beginPath();
  ctx.roundRect(car.x, car.y, car.width, car.height, 12);
  ctx.fill();
  ctx.strokeStyle = "#ffb703";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Wheels
  ctx.fillStyle = "#000814";
  ctx.fillRect(car.x + 6, car.y + 38, 18, 12);
  ctx.fillRect(car.x + car.width - 24, car.y + 38, 18, 12);

  // Emblem
  ctx.fillStyle = "#ffb703";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("★", car.x + car.width / 2, car.y + 30);
}

function drawBalloons() {
  balloons.forEach(b => {
    // Tether
    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.radius);
    ctx.lineTo(b.x, b.y + b.radius + 18);
    ctx.stroke();

    // Orb
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Label
    ctx.fillStyle = "#ffffff";
    ctx.font = currentMode === "toddler" ? "bold 16px sans-serif" : "bold 24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.val, b.x, b.y);
  });
}

function update() {
  car.x += car.dx;
  if (car.x < 10) car.x = 10;
  if (car.x + car.width > canvas.width - 10) car.x = canvas.width - car.width - 10;

  balloons.forEach(b => {
    b.y += b.speed;

    // Hit test
    const distX = Math.abs(b.x - (car.x + car.width / 2));
    const distY = Math.abs(b.y - (car.y + car.height / 2));

    if (distX < (car.width / 2 + b.radius) && distY < (car.height / 2 + b.radius)) {
      if (b.val === targetVal) {
        score += (currentMode === "master" ? 3 : 1);
        scoreEl.textContent = `Stars: ${score} ⭐`;
        banner.style.display = "block";
        banner.textContent = currentMode === "master" ? "PERFECT! +3 ⭐" : "GREAT JOB! ⭐";
        setTimeout(() => banner.style.display = "none", 700);
      }
      spawnChallenge();
    }

    if (b.y > canvas.height + 40) {
      spawnChallenge();
    }
  });
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPlayer();
  drawBalloons();
  update();
  requestAnimationFrame(gameLoop);
}

// Mobile Touch Deck
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); car.dx = -car.speed; });
leftBtn.addEventListener("touchend", () => car.dx = 0);
rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); car.dx = car.speed; });
rightBtn.addEventListener("touchend", () => car.dx = 0);

leftBtn.addEventListener("mousedown", () => car.dx = -car.speed);
leftBtn.addEventListener("mouseup", () => car.dx = 0);
rightBtn.addEventListener("mousedown", () => car.dx = car.speed);
rightBtn.addEventListener("mouseup", () => car.dx = 0);

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") car.dx = -car.speed;
  if (e.key === "ArrowRight") car.dx = car.speed;
});
window.addEventListener("keyup", () => car.dx = 0);

spawnChallenge();
gameLoop();
</script>
</body>
</html>
