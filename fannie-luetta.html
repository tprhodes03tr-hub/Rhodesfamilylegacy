<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Little Luetta's Bumper Balloon Math</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    padding: 0;
    background: #0b132b;
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, #48cae4 0%, #a0c4ff 60%, #52b788 60%, #2d6a4f 100%);
    border: 4px solid #ffb703;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  #ui-header {
    background: rgba(0, 8, 20, 0.7);
    padding: 10px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-size: 1.2rem;
    font-weight: bold;
    border-bottom: 3px solid #ffb703;
  }
  #equation-display {
    color: #ffd166;
    font-size: 1.6rem;
    text-shadow: 2px 2px #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 400px;
  }
  #touch-controls {
    display: flex;
    width: 100%;
    background: #00121e;
    padding: 10px;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 16px 0;
    font-size: 1.3rem;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #ffb703;
    color: #000814;
    box-shadow: 0 5px #d48b00;
  }
  .btn:active {
    box-shadow: 0 2px #d48b00;
    transform: translateY(3px);
  }
  #star-banner {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.2rem;
    color: #ff0054;
    text-shadow: 3px 3px 0 #fff;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="ui-header">
    <div id="equation-display">2 + 1 = ?</div>
    <div id="score">Stars: 0 ⭐</div>
  </div>
  
  <canvas id="gameCanvas" width="480" height="400"></canvas>
  <div id="star-banner">AMAZING! ⭐</div>

  <div id="touch-controls">
    <button class="btn" id="leftBtn">◀ BUMP LEFT</button>
    <button class="btn" id="rightBtn">BUMP RIGHT ▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const eqDisplay = document.getElementById("equation-display");
const scoreDisplay = document.getElementById("score");
const banner = document.getElementById("star-banner");

let score = 0;
let car = { x: 200, y: 310, width: 80, height: 50, speed: 6, dx: 0, color: "#ff0054" };
let balloons = [];
let targetAnswer = 3;

function spawnProblem() {
  const num1 = Math.floor(Math.random() * 4) + 1;
  const num2 = Math.floor(Math.random() * 4) + 1;
  targetAnswer = num1 + num2;
  eqDisplay.textContent = `${num1} + ${num2} = ?`;

  balloons = [];
  const options = [targetAnswer, targetAnswer + 1, Math.max(1, targetAnswer - 1)].sort(() => Math.random() - 0.5);
  const colors = ["#ff595e", "#ffca3a", "#8ac926"];

  for (let i = 0; i < 3; i++) {
    balloons.push({
      x: 60 + i * 160,
      y: 30,
      radius: 36,
      number: options[i],
      color: colors[i],
      speed: 1.0 + Math.random() * 0.5
    });
  }
}

function drawCar() {
  // Car Body
  ctx.fillStyle = car.color;
  ctx.beginPath();
  ctx.roundRect(car.x, car.y, car.width, car.height, 12);
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Wheels
  ctx.fillStyle = "#111";
  ctx.fillRect(car.x + 8, car.y + 40, 16, 12);
  ctx.fillRect(car.x + car.width - 24, car.y + 40, 16, 12);

  // Character Emblem (Gold Star)
  ctx.fillStyle = "#ffb703";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("★", car.x + car.width / 2, car.y + 32);
}

function drawBalloons() {
  balloons.forEach(b => {
    // Balloon String
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.radius);
    ctx.lineTo(b.x, b.y + b.radius + 20);
    ctx.stroke();

    // Balloon Circle
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Balloon Number
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.number, b.x, b.y);
  });
}

function update() {
  car.x += car.dx;
  if (car.x < 10) car.x = 10;
  if (car.x + car.width > canvas.width - 10) car.x = canvas.width - car.width - 10;

  balloons.forEach(b => {
    b.y += b.speed;

    // Collision Detection with Bumper Car
    const distX = Math.abs(b.x - (car.x + car.width / 2));
    const distY = Math.abs(b.y - (car.y + car.height / 2));

    if (distX < (car.width / 2 + b.radius) && distY < (car.height / 2 + b.radius)) {
      if (b.number === targetAnswer) {
        score += 1;
        scoreDisplay.textContent = `Stars: ${score} ⭐`;
        banner.style.display = "block";
        setTimeout(() => banner.style.display = "none", 900);
      }
      spawnProblem();
    }

    if (b.y > canvas.height + 40) {
      spawnProblem();
    }
  });
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCar();
  drawBalloons();
  update();
  requestAnimationFrame(loop);
}

// Touch & Key Controls
document.getElementById("leftBtn").addEventListener("touchstart", () => car.dx = -car.speed);
document.getElementById("leftBtn").addEventListener("touchend", () => car.dx = 0);
document.getElementById("rightBtn").addEventListener("touchstart", () => car.dx = car.speed);
document.getElementById("rightBtn").addEventListener("touchend", () => car.dx = 0);

document.getElementById("leftBtn").addEventListener("mousedown", () => car.dx = -car.speed);
document.getElementById("leftBtn").addEventListener("mouseup", () => car.dx = 0);
document.getElementById("rightBtn").addEventListener("mousedown", () => car.dx = car.speed);
document.getElementById("rightBtn").addEventListener("mouseup", () => car.dx = 0);

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") car.dx = -car.speed;
  if (e.key === "ArrowRight") car.dx = car.speed;
});
window.addEventListener("keyup", () => car.dx = 0);

spawnProblem();
loop();
</script>
</body>
</html>
