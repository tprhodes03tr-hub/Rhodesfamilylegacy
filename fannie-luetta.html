<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rhodes Family Legacy - Heritage Learning Arcade</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    padding: 0;
    background: #060b18;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
  }
  #arcade-wrapper {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: #0d1b2a;
    border: 3px solid #ffb703;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
  }
  /* Age Bar */
  #age-nav {
    display: flex;
    background: #000814;
    border-bottom: 2px solid #ffb703;
  }
  .age-tab {
    flex: 1;
    padding: 8px 2px;
    font-size: 0.8rem;
    font-weight: bold;
    border: none;
    background: transparent;
    color: #8da9c4;
    cursor: pointer;
    text-align: center;
  }
  .age-tab.active {
    background: #ffb703;
    color: #000814;
  }
  /* Game Picker Tabs */
  #game-nav {
    display: flex;
    background: #101f33;
    border-bottom: 1px solid rgba(255, 183, 3, 0.4);
  }
  .game-tab {
    flex: 1;
    padding: 8px 2px;
    font-size: 0.72rem;
    font-weight: 700;
    border: none;
    background: transparent;
    color: #ffd166;
    cursor: pointer;
    text-align: center;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
  }
  .game-tab.active {
    background: #ff595e;
    color: #fff;
  }
  /* Status Header */
  #status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(13, 27, 42, 0.95);
  }
  #target-prompt {
    font-size: 1.15rem;
    font-weight: 800;
    color: #ffd166;
  }
  #score-display {
    font-size: 0.95rem;
    font-weight: 700;
    color: #06d6a0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 360px;
    background: #1d3557;
  }
  /* Vocab Popup Card */
  #vocab-card {
    display: none;
    background: #00121e;
    border: 2px dashed #ffb703;
    border-radius: 12px;
    margin: 8px;
    padding: 10px;
    text-align: center;
  }
  #vocab-word {
    font-size: 1.1rem;
    font-weight: bold;
    color: #ffd166;
  }
  #vocab-def {
    font-size: 0.85rem;
    color: #e0e1dd;
    margin-top: 4px;
  }
  /* Controls Area */
  #touch-deck {
    display: flex;
    background: #000814;
    padding: 10px;
    gap: 8px;
  }
  .deck-btn {
    flex: 1;
    padding: 14px 0;
    font-size: 1.05rem;
    font-weight: 900;
    border: none;
    border-radius: 10px;
    background: #ffb703;
    color: #000814;
    box-shadow: 0 4px #c79100;
    cursor: pointer;
  }
  .deck-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px #c79100;
  }
  #hub-link {
    text-align: center;
    padding: 8px;
    background: #000814;
    border-top: 1px solid #1f2a44;
  }
  #hub-link a {
    color: #ffb703;
    font-size: 0.85rem;
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>
<body>

<div id="arcade-wrapper">
  <!-- Age Bar -->
  <div id="age-nav">
    <button class="age-tab" id="tab-toddler" onclick="setAge('toddler')">Ages 2-4<br>Colors & Taps</button>
    <button class="age-tab active" id="tab-explorer" onclick="setAge('explorer')">Ages 5-7<br>Early Learning</button>
    <button class="age-tab" id="tab-master" onclick="setAge('master')">Ages 8-10<br>Vanguard Math</button>
  </div>

  <!-- Game Bar -->
  <div id="game-nav">
    <button class="game-tab active" id="btn-quest" onclick="switchGame('quest')">🏃‍♀️ Story Quest</button>
    <button class="game-tab" id="btn-bumper" onclick="switchGame('bumper')">🚗 Bumper Math</button>
    <button class="game-tab" id="btn-abc" onclick="switchGame('abc')">🔤 Alphabet</button>
    <button class="game-tab" id="btn-clock" onclick="switchGame('clock')">⏰ Clock Time</button>
  </div>

  <div id="status-bar">
    <div id="target-prompt">Collect 3 Keys!</div>
    <div id="score-display">Stars: 0 ⭐</div>
  </div>

  <canvas id="gameCanvas" width="480" height="360"></canvas>

  <div id="vocab-card">
    <div id="vocab-word">✨ NEW WORD: KINDNESS ✨</div>
    <div id="vocab-def">"Showing warmth, gentleness, and helping those around you." (Found in your storybook!)</div>
  </div>

  <div id="touch-deck">
    <button class="deck-btn" id="leftBtn">◀ WALK</button>
    <button class="deck-btn" id="midBtn" style="background:#06d6a0; box-shadow:0 4px #049f76;">▲ HOP</button>
    <button class="deck-btn" id="rightBtn">WALK ▶</button>
  </div>

  <div id="hub-link">
    <a href="index.html">← Return to Rhodes Family Legacy Store & Library</a>
  </div>
</div>

<script>
// --- AUDIO SYNTHESIZER (ZERO OUTSIDE FILES NEEDED) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  if (type === 'coin') {
    // High-pitched crystal coin chime
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, now); // B5
    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'pop') {
    // Low balloon bounce pop
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'cheer') {
    // Ascending arpeggio
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.15, now + idx * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
      o.start(now + idx * 0.08);
      o.stop(now + idx * 0.08 + 0.2);
    });
  }
}

// --- GAME LOGIC ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const promptEl = document.getElementById("target-prompt");
const scoreEl = document.getElementById("score-display");
const vocabCard = document.getElementById("vocab-card");
const vocabWord = document.getElementById("vocab-word");
const vocabDef = document.getElementById("vocab-def");

const leftBtn = document.getElementById("leftBtn");
const midBtn = document.getElementById("midBtn");
const rightBtn = document.getElementById("rightBtn");

let currentAge = "explorer";
let currentGame = "quest";
let score = 0;

// Character & physics
let hero = { x: 80, y: 240, width: 34, height: 60, vy: 0, isJumping: false, dx: 0, speed: 4 };
let keysCollected = 0;
let keysList = [];
let dropItems = [];
let targetVal = null;
let clockHour = 3;

const VOCAB_LIST = [
  { word: "KINDNESS", def: "Showing warmth, gentleness, and helping those around you." },
  { word: "COURAGE", def: "Standing tall and doing what is right even when you are scared." },
  { word: "HERITAGE", def: "The traditions, strength, and stories passed down from your ancestors." },
  { word: "SOVEREIGN", def: "Having complete freedom, dignity, and pride in who you are." }
];

function setAge(age) {
  currentAge = age;
  document.querySelectorAll('.age-tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${age}`).classList.add('active');
  hero.speed = (age === 'toddler') ? 3 : (age === 'explorer') ? 5 : 7;
  initRound();
}

function switchGame(gameKey) {
  currentGame = gameKey;
  document.querySelectorAll('.game-tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${gameKey}`).classList.add('active');
  vocabCard.style.display = "none";

  if (gameKey === "quest") {
    leftBtn.textContent = "◀ WALK";
    midBtn.textContent = "▲ HOP";
    rightBtn.textContent = "WALK ▶";
    midBtn.style.display = "block";
  } else if (gameKey === "clock") {
    leftBtn.textContent = "◀ HOUR";
    midBtn.textContent = "SET TIME";
    rightBtn.textContent = "HOUR ▶";
    midBtn.style.display = "block";
  } else {
    leftBtn.textContent = "◀ BUMP LEFT";
    midBtn.style.display = "none";
    rightBtn.textContent = "BUMP RIGHT ▶";
  }

  initRound();
}

function initRound() {
  dropItems = [];
  keysList = [];
  hero.x = 80;
  hero.y = 240;

  if (currentGame === "quest") {
    keysCollected = 0;
    promptEl.textContent = `Collect 3 Keys! (${keysCollected}/3)`;
    for (let i = 0; i < 3; i++) {
      keysList.push({ x: 160 + i * 110, y: 220 - (i % 2) * 45, radius: 14, collected: false });
    }
  } else if (currentGame === "bumper") {
    setupBumperMath();
  } else if (currentGame === "abc") {
    setupAlphabetCatch();
  } else if (currentGame === "clock") {
    setupClockTime();
  }
}

/* 1. STORY QUEST MEADOW */
function drawStoryQuest() {
  // Rolling Hills & Sky
  ctx.fillStyle = "#87ceeb";
  ctx.fillRect(0, 0, canvas.width, 220);

  // Sun
  ctx.fillStyle = "#ffdd53";
  ctx.beginPath();
  ctx.arc(420, 50, 36, 0, Math.PI * 2);
  ctx.fill();

  // Golden Tree
  ctx.fillStyle = "#795548";
  ctx.fillRect(320, 140, 32, 130);
  ctx.fillStyle = "#e09f3e";
  ctx.beginPath();
  ctx.arc(336, 130, 60, 0, Math.PI * 2);
  ctx.fill();

  // Meadow Ground
  ctx.fillStyle = "#52b788";
  ctx.fillRect(0, 270, canvas.width, 90);

  // Golden Keys / Coins
  keysList.forEach(k => {
    if (!k.collected) {
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(k.x, k.y, k.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#000814";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🗝️", k.x, k.y + 4);
    }
  });

  // Fannie May / Luetta Sprite
  ctx.fillStyle = "#70483c"; // Hair puffs
  ctx.beginPath();
  ctx.arc(hero.x + 8, hero.y + 8, 8, 0, Math.PI * 2);
  ctx.arc(hero.x + 26, hero.y + 8, 8, 0, Math.PI * 2);
  ctx.fill();

  // Face
  ctx.fillStyle = "#8d5b4c";
  ctx.beginPath();
  ctx.arc(hero.x + 17, hero.y + 16, 12, 0, Math.PI * 2);
  ctx.fill();

  // Dress (Navy Blue & White Collar)
  ctx.fillStyle = "#1d3557";
  ctx.fillRect(hero.x + 6, hero.y + 26, 22, 24);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(hero.x + 12, hero.y + 26, 10, 4);

  // Shoes
  ctx.fillStyle = "#000";
  ctx.fillRect(hero.x + 8, hero.y + 50, 7, 6);
  ctx.fillRect(hero.x + 19, hero.y + 50, 7, 6);
}

/* 2. BUMPER MATH */
function setupBumperMath() {
  dropItems = [];
  if (currentAge === "toddler") {
    targetVal = "BLUE";
    promptEl.textContent = `BUMP: BLUE BALLOON!`;
    const pool = [
      { t: "BLUE", c: "#48cae4" },
      { t: "RED", c: "#e63946" },
      { t: "GOLD", c: "#ffb703" }
    ].sort(() => Math.random() - 0.5);

    pool.forEach((p, i) => {
      dropItems.push({ x: 70 + i * 170, y: 20, radius: 36, text: p.t, color: p.c, speed: 1.0 });
    });
  } else if (currentAge === "explorer") {
    const a = Math.floor(Math.random() * 5) + 1;
    const b = Math.floor(Math.random() * 5) + 1;
    targetVal = a + b;
    promptEl.textContent = `${a} + ${b} = ?`;
    const opts = [targetVal, targetVal + 1, Math.max(1, targetVal - 1)].sort(() => Math.random() - 0.5);
    const clrs = ["#e63946", "#ffb703", "#48cae4"];
    opts.forEach((v, i) => {
      dropItems.push({ x: 70 + i * 170, y: 20, radius: 36, text: v, color: clrs[i], speed: 1.4 });
    });
  } else {
    const a = Math.floor(Math.random() * 6) + 4;
    const b = Math.floor(Math.random() * 6) + 3;
    targetVal = a * b;
    promptEl.textContent = `${a} × ${b} = ?`;
    const opts = [targetVal, targetVal + a, targetVal - b].sort(() => Math.random() - 0.5);
    const clrs = ["#ff0054", "#7209b7", "#06d6a0"];
    opts.forEach((v, i) => {
      dropItems.push({ x: 70 + i * 170, y: 20, radius: 34, text: v, color: clrs[i], speed: 2.2 });
    });
  }
}

/* 3. ALPHABET CATCH */
function setupAlphabetCatch() {
  dropItems = [];
  const words = currentAge === "master" ? 
    [{ p: "Spell 'HERITAGE': Find", l: "H" }, { p: "Spell 'TRUTH': Find", l: "T" }] :
    [{ p: "Starts 'SUN'?", l: "S" }, { p: "Starts 'OAK'?", l: "O" }, { p: "Starts 'KIN'?", l: "K" }];

  const picked = words[Math.floor(Math.random() * words.length)];
  targetVal = picked.l;
  promptEl.textContent = `${picked.p} '${picked.l}'!`;

  const opts = [targetVal, "B", "M"].sort(() => Math.random() - 0.5);
  opts.forEach((ltr, i) => {
    dropItems.push({ x: 70 + i * 170, y: 20, radius: 36, text: ltr, color: "#ffb703", speed: 1.4 });
  });
}

/* 4. CLOCK TIME */
function setupClockTime() {
  dropItems = [];
  clockHour = Math.floor(Math.random() * 12) + 1;
  const targetHour = Math.floor(Math.random() * 12) + 1;
  targetVal = targetHour;
  promptEl.textContent = `Set Golden Clock to ${targetHour}:00`;
}

function update() {
  if (currentGame === "quest") {
    hero.x += hero.dx;
    if (hero.x < 10) hero.x = 10;
    if (hero.x > canvas.width - hero.width - 10) hero.x = canvas.width - hero.width - 10;

    // Hop Gravity
    if (hero.isJumping) {
      hero.y += hero.vy;
      hero.vy += 0.9;
      if (hero.y >= 210) {
        hero.y = 210;
        hero.isJumping = false;
        hero.vy = 0;
      }
    }

    // Key Collection
    keysList.forEach(k => {
      if (!k.collected) {
        const dx = Math.abs((hero.x + hero.width/2) - k.x);
        const dy = Math.abs((hero.y + hero.height/2) - k.y);
        if (dx < 25 && dy < 35) {
          k.collected = true;
          keysCollected++;
          score++;
          scoreEl.textContent = `Stars: ${score} ⭐`;
          playSound('coin');
          promptEl.textContent = `Collect 3 Keys! (${keysCollected}/3)`;

          if (keysCollected >= 3) {
            playSound('cheer');
            const v = VOCAB_LIST[Math.floor(Math.random() * VOCAB_LIST.length)];
            vocabWord.textContent = `✨ NEW WORD: ${v.word} ✨`;
            vocabDef.textContent = `"${v.def}" (Found in your storybook!)`;
            vocabCard.style.display = "block";
            setTimeout(initRound, 3000);
          }
        }
      }
    });

  } else if (currentGame === "bumper" || currentGame === "abc") {
    hero.x += hero.dx;
    if (hero.x < 10) hero.x = 10;
    if (hero.x > canvas.width - hero.width - 10) hero.x = canvas.width - hero.width - 10;

    dropItems.forEach(b => {
      b.y += b.speed;
      const distX = Math.abs(b.x - (hero.x + hero.width / 2));
      const distY = Math.abs(b.y - (hero.y + hero.height / 2));

      if (distX < 45 && distY < 40) {
        if (b.text === targetVal) {
          score += 2;
          scoreEl.textContent = `Stars: ${score} ⭐`;
          playSound('pop');
          playSound('cheer');
        }
        if (currentGame === "bumper") setupBumperMath();
        else setupAlphabetCatch();
      }

      if (b.y > canvas.height + 40) {
        if (currentGame === "bumper") setupBumperMath();
        else setupAlphabetCatch();
      }
    });
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentGame === "quest") {
    drawStoryQuest();
  } else if (currentGame === "bumper" || currentGame === "abc") {
    // Arena Sky
    ctx.fillStyle = "#1d3557";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Car Runner
    ctx.fillStyle = currentGame === "bumper" ? "#e63946" : "#48cae4";
    ctx.beginPath();
    ctx.roundRect(hero.x, 280, 70, 42, 10);
    ctx.fill();
    ctx.strokeStyle = "#ffb703";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#ffb703";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("★", hero.x + 35, 306);

    // Balloons
    dropItems.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(b.text, b.x, b.y);
    });

  } else if (currentGame === "clock") {
    // Clock Face
    ctx.fillStyle = "#000814";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    ctx.fillStyle = "#0d1b2a";
    ctx.beginPath();
    ctx.arc(cx, cy, 110, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffb703";
    ctx.lineWidth = 6;
    ctx.stroke();

    for (let i = 1; i <= 12; i++) {
      const angle = (i * Math.PI / 6) - (Math.PI / 2);
      const nx = cx + Math.cos(angle) * 85;
      const ny = cy + Math.sin(angle) * 85;
      ctx.fillStyle = "#ffd166";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(i, nx, ny);
    }

    // Hour Hand
    const handAngle = (clockHour * Math.PI / 6) - (Math.PI / 2);
    ctx.strokeStyle = "#ff0054";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(handAngle) * 65, cy + Math.sin(handAngle) * 65);
    ctx.stroke();
  }

  update();
  requestAnimationFrame(gameLoop);
}

// Touch Handling
leftBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (currentGame === "clock") clockHour = clockHour <= 1 ? 12 : clockHour - 1;
  else hero.dx = -hero.speed;
});
leftBtn.addEventListener("touchend", () => { if (currentGame !== "clock") hero.dx = 0; });

rightBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (currentGame === "clock") clockHour = clockHour >= 12 ? 1 : clockHour + 1;
  else hero.dx = hero.speed;
});
rightBtn.addEventListener("touchend", () => { if (currentGame !== "clock") hero.dx = 0; });

midBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (currentGame === "quest" && !hero.isJumping) {
    hero.isJumping = true;
    hero.vy = -14;
  } else if (currentGame === "clock") {
    if (clockHour === targetVal) {
      score += 2;
      scoreEl.textContent = `Stars: ${score} ⭐`;
      playSound('cheer');
      setupClockTime();
    } else {
      playSound('pop');
    }
  }
});

// Mouse Support
leftBtn.addEventListener("mousedown", () => {
  if (currentGame === "clock") clockHour = clockHour <= 1 ? 12 : clockHour - 1;
  else hero.dx = -hero.speed;
});
leftBtn.addEventListener("mouseup", () => { if (currentGame !== "clock") hero.dx = 0; });
rightBtn.addEventListener("mousedown", () => {
  if (currentGame === "clock") clockHour = clockHour >= 12 ? 1 : clockHour + 1;
  else hero.dx = hero.speed;
});
rightBtn.addEventListener("mouseup", () => { if (currentGame !== "clock") hero.dx = 0; });
midBtn.addEventListener("mousedown", () => {
  if (currentGame === "quest" && !hero.isJumping) {
    hero.isJumping = true;
    hero.vy = -14;
  } else if (currentGame === "clock") {
    if (clockHour === targetVal) {
      score += 2;
      scoreEl.textContent = `Stars: ${score} ⭐`;
      playSound('cheer');
      setupClockTime();
    } else {
      playSound('pop');
    }
  }
});

initRound();
gameLoop();
</script>
</body>
</html>
