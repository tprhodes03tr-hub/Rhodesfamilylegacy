<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Puzzle & Game Show Suite - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    /* Navigation Bar */
    #nav-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 8px;
      background: #111827;
      border-bottom: 2px solid #1f2937;
      white-space: nowrap;
    }
    .nav-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }
    /* Main Game Display Arena */
    #arena {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 88vh;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      margin-top: 6px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .game-view {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .game-view.active {
      display: flex;
    }
    h2 {
      font-size: 1.2rem;
      color: #facc15;
      margin-bottom: 10px;
      text-align: center;
    }
    /* Word Search */
    #ws-grid {
      display: grid;
      grid-template-columns: repeat(8, 36px);
      gap: 4px;
      margin-bottom: 12px;
    }
    .ws-cell {
      width: 36px;
      height: 36px;
      background: #1e293b;
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .ws-cell.selected {
      background: #38bdf8;
      color: #0f172a;
    }
    .ws-cell.found {
      background: #22c55e;
      color: #0f172a;
    }
    /* Trivia / Jeopardy */
    .trivia-card {
      background: #1e293b;
      border: 2px solid #6366f1;
      border-radius: 8px;
      padding: 14px;
      width: 100%;
      text-align: center;
      margin-bottom: 12px;
    }
    .opt-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .opt-btn {
      background: #334155;
      border: 1px solid #64748b;
      padding: 10px;
      color: #fff;
      border-radius: 6px;
      font-weight: 600;
      text-align: left;
    }
    .opt-btn:active {
      background: #6366f1;
    }
    /* Wheel Game */
    #wheel-canvas {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 4px solid #facc15;
      margin-bottom: 12px;
    }
    .action-btn {
      background: #facc15;
      border: none;
      color: #000;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    /* Suitcase / Deal Game */
    #cases-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
    }
    .case-box {
      background: linear-gradient(135deg, #d97706, #b45309);
      border: 2px solid #fde68a;
      border-radius: 6px;
      padding: 12px 4px;
      text-align: center;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .case-box.opened {
      background: #334155;
      border-color: #64748b;
      color: #94a3b8;
    }
    /* Bubble & Block Fall Canvas */
    .arcade-canvas {
      background: #000;
      border: 2px solid #38bdf8;
      border-radius: 6px;
    }
    .ctrl-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .block-btn {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 6px;
    }
    .block-btn:active {
      background: #38bdf8;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="nav-bar">
    <button class="nav-btn active" onclick="showPuzzle('wordsearch')">Word Search</button>
    <button class="nav-btn" onclick="showPuzzle('trivia')">Trivia Board</button>
    <button class="nav-btn" onclick="showPuzzle('wheel')">Fortune Wheel</button>
    <button class="nav-btn" onclick="showPuzzle('cases')">Suitcase Choice</button>
    <button class="nav-btn" onclick="showPuzzle('bubbles')">Bubble Burst</button>
    <button class="nav-btn" onclick="showPuzzle('blocks')">Block Fall</button>
  </div>

  <div id="arena">
    <!-- 1. WORD SEARCH -->
    <div id="view-wordsearch" class="game-view active">
      <h2>Word Search: Legacy Terms</h2>
      <p id="ws-target" style="margin-bottom:8px; color:#38bdf8; font-weight:bold;">Find: MARROW</p>
      <div id="ws-grid"></div>
      <p id="ws-status" style="font-size:0.85rem; color:#a3e635;"></p>
    </div>

    <!-- 2. TRIVIA BOARD -->
    <div id="view-trivia" class="game-view">
      <h2>Rhodes Trivia Challenge</h2>
      <div class="trivia-card">
        <h3 id="trivia-q" style="font-size:1rem; margin-bottom:10px;">Which ocean is the largest on Earth?</h3>
        <div class="opt-grid" id="trivia-opts"></div>
      </div>
      <p id="trivia-score" style="color:#facc15; font-weight:bold;">Score: $0</p>
    </div>

    <!-- 3. WHEEL GAME -->
    <div id="view-wheel" class="game-view">
      <h2>Wheel of Fortune</h2>
      <canvas id="wheel-canvas" width="260" height="260"></canvas>
      <button class="action-btn" onclick="spinWheel()">SPIN WHEEL</button>
      <p id="wheel-result" style="color:#facc15; font-weight:bold; font-size:1.1rem;"></p>
    </div>

    <!-- 4. SUITCASE DEAL -->
    <div id="view-cases" class="game-view">
      <h2>Suitcase Vault</h2>
      <p id="case-instruction" style="font-size:0.85rem; margin-bottom:8px; color:#94a3b8;">Pick your lucky suitcase!</p>
      <div id="cases-grid"></div>
      <p id="case-result" style="color:#facc15; font-weight:bold;"></p>
    </div>

    <!-- 5. BUBBLE BURST -->
    <div id="view-bubbles" class="game-view">
      <h2>Bubble Pop</h2>
      <p id="bubble-score" style="margin-bottom:6px; color:#38bdf8; font-weight:bold;">Popped: 0</p>
      <canvas id="bubbleCanvas" class="arcade-canvas" width="300" height="340"></canvas>
    </div>

    <!-- 6. BLOCK FALL (TETRIS-LIKE) -->
    <div id="view-blocks" class="game-view">
      <h2>Block Fall</h2>
      <p id="block-score" style="margin-bottom:6px; color:#facc15; font-weight:bold;">Lines: 0</p>
      <canvas id="blockCanvas" class="arcade-canvas" width="200" height="320"></canvas>
      <div class="ctrl-row">
        <button class="block-btn" onclick="moveBlock(-1)">◀</button>
        <button class="block-btn" onclick="rotateBlock()">ROTATE</button>
        <button class="block-btn" onclick="moveBlock(1)">▶</button>
        <button class="block-btn" onclick="dropBlock()">▼</button>
      </div>
    </div>
  </div>

  <script>
    function showPuzzle(id) {
      document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + id).classList.add('active');
      event.target.classList.add('active');
    }

    // --- 1. WORD SEARCH ---
    const words = ["MARROW", "LEGACY", "ISAAC", "HONOR"];
    let currentWordIdx = 0;
    const wsGridLetters = [
      ['M','A','R','R','O','W','X','Y'],
      ['B','L','E','G','A','C','Y','K'],
      ['P','I','S','A','A','C','L','M'],
      ['Q','R','H','O','N','O','R','T'],
      ['A','B','C','D','E','F','G','H'],
      ['I','J','K','L','M','N','O','P'],
      ['U','V','W','X','Y','Z','A','B'],
      ['C','D','E','F','G','H','I','J']
    ];
    let selectedLetters = "";

    function initWordSearch() {
      const grid = document.getElementById('ws-grid');
      grid.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const cell = document.createElement('div');
          cell.className = 'ws-cell';
          cell.innerText = wsGridLetters[r][c];
          cell.onclick = () => {
            cell.classList.toggle('selected');
            selectedLetters += cell.innerText;
            if (selectedLetters.includes(words[currentWordIdx])) {
              document.getElementById('ws-status').innerText = `Found ${words[currentWordIdx]}!`;
              currentWordIdx = (currentWordIdx + 1) % words.length;
              document.getElementById('ws-target').innerText = `Find: ${words[currentWordIdx]}`;
              selectedLetters = "";
            }
          };
          grid.appendChild(cell);
        }
      }
    }

    // --- 2. TRIVIA ---
    let triviaScore = 0;
    const triviaQuestions = [
      { q: "What is the capital of France?", a: ["Paris", "Rome", "Madrid", "Berlin"], c: 0, val: 200 },
      { q: "How many sides does an octagon have?", a: ["6", "7", "8", "10"], c: 2, val: 400 },
      { q: "Which planet is known as the Red Planet?", a: ["Venus", "Mars", "Jupiter", "Saturn"], c: 1, val: 600 }
    ];
    let currentQ = 0;

    function loadTrivia() {
      const q = triviaQuestions[currentQ];
      document.getElementById('trivia-q').innerText = `${q.q} ($${q.val})`;
      const optBox = document.getElementById('trivia-opts');
      optBox.innerHTML = '';
      q.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (idx === q.c) {
            triviaScore += q.val;
            alert("Correct!");
          } else {
            alert("Incorrect!");
          }
          document.getElementById('trivia-score').innerText = `Score: $${triviaScore}`;
          currentQ = (currentQ + 1) % triviaQuestions.length;
          loadTrivia();
        };
        optBox.appendChild(btn);
      });
    }

    // --- 3. WHEEL ---
    const wheelSegments = ["$100", "$500", "BANKRUPT", "$250", "$1000", "FREE SPIN", "$300", "$750"];
    let wheelAngle = 0;

    function drawWheel() {
      const canvas = document.getElementById('wheel-canvas');
      const ctx = canvas.getContext('2d');
      const numSeg = wheelSegments.length;
      const arc = (Math.PI * 2) / numSeg;

      ctx.clearRect(0, 0, 260, 260);
      wheelSegments.forEach((seg, i) => {
        const angle = wheelAngle + i * arc;
        ctx.fillStyle = i % 2 === 0 ? '#1e293b' : '#334155';
        if (seg === 'BANKRUPT') ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(130, 130);
        ctx.arc(130, 130, 125, angle, angle + arc);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.translate(130 + Math.cos(angle + arc / 2) * 80, 130 + Math.sin(angle + arc / 2) * 80);
        ctx.rotate(angle + arc / 2);
        ctx.fillText(seg, -20, 4);
        ctx.restore();
      });
    }

    function spinWheel() {
      const spins = 10 + Math.random() * 10;
      let count = 0;
      const interval = setInterval(() => {
        wheelAngle += 0.2;
        drawWheel();
        count++;
        if (count > spins * 10) {
          clearInterval(interval);
          const landedIdx = Math.floor(((wheelAngle % (Math.PI * 2)) / (Math.PI * 2)) * wheelSegments.length);
          document.getElementById('wheel-result').innerText = `Result: ${wheelSegments[landedIdx]}`;
        }
      }, 30);
    }

    // --- 4. SUITCASES ---
    const caseAmounts = [1, 50, 100, 500, 1000, 5000, 10000, 50000, 100000, 250000, 500000, 1000000];
    let myCase = null;

    function initCases() {
      const grid = document.getElementById('cases-grid');
      grid.innerHTML = '';
      const shuffled = [...caseAmounts].sort(() => Math.random() - 0.5);
      shuffled.forEach((amt, idx) => {
        const box = document.createElement('div');
        box.className = 'case-box';
        box.innerText = `#${idx + 1}`;
        box.onclick = () => {
          if (!myCase) {
            myCase = amt;
            box.style.background = '#22c55e';
            document.getElementById('case-instruction').innerText = `Your Case: #${idx + 1}. Now open others!`;
          } else if (!box.classList.contains('opened')) {
            box.classList.add('opened');
            box.innerText = `$${amt.toLocaleString()}`;
          }
        };
        grid.appendChild(box);
      });
    }

    // --- 5. BUBBLES ---
    let bubblesPopped = 0;
    const bCanvas = document.getElementById('bubbleCanvas');
    const bCtx = bCanvas.getContext('2d');
    let bubbles = [];

    function spawnBubble() {
      bubbles.push({
        x: 30 + Math.random() * 240,
        y: 340,
        r: 16 + Math.random() * 8,
        color: ['#38bdf8', '#f43f5e', '#a855f7', '#facc15'][Math.floor(Math.random() * 4)],
        vy: 1.5 + Math.random() * 1.5
      });
    }

    bCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const rect = bCanvas.getBoundingClientRect();
      const touchX = (e.touches[0].clientX - rect.left) * (bCanvas.width / rect.width);
      const touchY = (e.touches[0].clientY - rect.top) * (bCanvas.height / rect.height);

      bubbles.forEach((b, idx) => {
        if (Math.hypot(b.x - touchX, b.y - touchY) < b.r + 10) {
          bubbles.splice(idx, 1);
          bubblesPopped++;
          document.getElementById('bubble-score').innerText = `Popped: ${bubblesPopped}`;
        }
      });
    });

    function updateBubbles() {
      bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
      if (Math.random() < 0.04) spawnBubble();

      bubbles.forEach((b, idx) => {
        b.y -= b.vy;
        bCtx.fillStyle = b.color;
        bCtx.beginPath();
        bCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        bCtx.fill();
        if (b.y < -20) bubbles.splice(idx, 1);
      });
      requestAnimationFrame(updateBubbles);
    }

    // --- 6. BLOCK FALL (TETRIS) ---
    const blCanvas = document.getElementById('blockCanvas');
    const blCtx = blCanvas.getContext('2d');
    const COLS = 10, ROWS = 16, SIZE = 20;
    let grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
    let blockLines = 0;
    let currentPiece = { x: 4, y: 0, shape: [[1,1],[1,1]], color: '#38bdf8' };

    function drawGrid() {
      blCtx.fillStyle = '#000';
      blCtx.fillRect(0, 0, blCanvas.width, blCanvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            blCtx.fillStyle = grid[r][c];
            blCtx.fillRect(c * SIZE, r * SIZE, SIZE - 1, SIZE - 1);
          }
        }
      }
      // Current Piece
      blCtx.fillStyle = currentPiece.color;
      currentPiece.shape.forEach((row, r) => {
        row.forEach((cell, c) => {
          if (cell) blCtx.fillRect((currentPiece.x + c) * SIZE, (currentPiece.y + r) * SIZE, SIZE - 1, SIZE - 1);
        });
      });
    }

    function moveBlock(dir) {
      currentPiece.x += dir;
      if (currentPiece.x < 0 || currentPiece.x > COLS - currentPiece.shape[0].length) currentPiece.x -= dir;
      drawGrid();
    }
    function rotateBlock() {
      currentPiece.shape = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
      drawGrid();
    }
    function dropBlock() {
      currentPiece.y++;
      if (currentPiece.y > ROWS - currentPiece.shape.length) {
        currentPiece.y--;
        lockBlock();
      }
      drawGrid();
    }

    function lockBlock() {
      currentPiece.shape.forEach((row, r) => {
        row.forEach((cell, c) => {
          if (cell && currentPiece.y + r < ROWS) grid[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
        });
      });
      // Check full lines
      grid = grid.filter(row => row.some(cell => !cell));
      while (grid.length < ROWS) {
        grid.unshift(Array(COLS).fill(0));
        blockLines++;
      }
      document.getElementById('block-score').innerText = `Lines: ${blockLines}`;
      currentPiece = { x: 4, y: 0, shape: [[1,1,1],[0,1,0]], color: '#facc15' };
    }

    setInterval(dropBlock, 800);

    // Init All
    initWordSearch();
    loadTrivia();
    drawWheel();
    initCases();
    updateBubbles();
    drawGrid();
  </script>
</body>
</html>
