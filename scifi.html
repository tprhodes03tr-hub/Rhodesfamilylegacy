<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Space Odyssey - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #020208;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      font-weight: 700;
      font-size: 1.1rem;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
    }
    .hud-stat {
      background: rgba(10, 20, 40, 0.75);
      border: 1px solid rgba(0, 200, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
    }
    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 220, 255, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #reticle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #00e5ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    /* Mobile Controls */
    .touch-zone {
      position: absolute;
      bottom: 25px;
      width: 130px;
      height: 130px;
      z-index: 20;
    }
    #flight-stick {
      left: 20px;
      background: rgba(0, 150, 255, 0.08);
      border: 2px solid rgba(0, 200, 255, 0.3);
      border-radius: 50%;
    }
    .stick-knob {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 50px;
      height: 50px;
      background: rgba(0, 220, 255, 0.35);
      border: 2px solid #00e5ff;
      border-radius: 50%;
      pointer-events: none;
    }
    .action-btn {
      position: absolute;
      border-radius: 50%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
    }
    #photon-btn {
      bottom: 120px;
      right: 30px;
      width: 75px;
      height: 75px;
      background: rgba(255, 50, 80, 0.4);
      border: 2px solid #ff3366;
      font-size: 0.85rem;
    }
    #warp-btn {
      bottom: 30px;
      right: 40px;
      width: 65px;
      height: 65px;
      background: rgba(0, 200, 255, 0.3);
      border: 2px solid #00e5ff;
      font-size: 0.8rem;
    }
    #photon-btn:active, #warp-btn:active {
      transform: scale(0.93);
      opacity: 0.9;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="hud-stat" id="hud-shields">Shields: 100%</div>
    <div class="hud-stat" id="hud-score">Raiders Down: 0</div>
  </div>

  <div id="reticle"></div>

  <!-- Flight Controls -->
  <div id="flight-stick" class="touch-zone">
    <div id="flight-knob" class="stick-knob"></div>
  </div>
  <button id="photon-btn" class="action-btn">FIRE</button>
  <button id="warp-btn" class="action-btn">BOOST</button>

  <script>
    let scene, camera, renderer;
    let shields = 100, score = 0, isGameOver = false;
    let starfield, starGeo;
    let enemies = [];
    let lasers = [];

    const flightInput = { pitch: 0, yaw: 0 };
    let boostActive = false;
    let baseSpeed = 0.8;

    function init() {
      const container = document.getElementById('game-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 0);
      camera.rotation.order = 'YXZ';

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Space Lighting
      const ambientLight = new THREE.AmbientLight(0x334466, 1.2);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
      sunLight.position.set(100, 50, 100);
      scene.add(sunLight);

      buildStarfield();
      setupControls();
      spawnWave();
    }

    function buildStarfield() {
      starGeo = new THREE.BufferGeometry();
      const starCoords = [];
      for (let i = 0; i < 3000; i++) {
        starCoords.push(
          THREE.MathUtils.randFloatSpread(1600),
          THREE.MathUtils.randFloatSpread(1600),
          THREE.MathUtils.randFloatSpread(1600)
        );
      }
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xddffff, size: 1.2 });
      starfield = new THREE.Points(starGeo, starMat);
      scene.add(starfield);
    }

    function spawnEnemy() {
      if (isGameOver) return;
      const group = new THREE.Group();

      // Enemy hull (Cruiser/Fighter hybrid)
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x991122, roughness: 0.3 });
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.8 });

      const body = new THREE.Mesh(new THREE.ConeGeometry(0.8, 3, 5), bodyMat);
      body.rotation.x = Math.PI / 2;
      group.add(body);

      const leftWing = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 1.2), wingMat);
      group.add(leftWing);

      // Spawn in front of player arc
      const angle = Math.random() * Math.PI * 2;
      const elevation = (Math.random() - 0.5) * Math.PI * 0.5;
      const distance = 90 + Math.random() * 40;

      group.position.set(
        camera.position.x + Math.sin(angle) * Math.cos(elevation) * distance,
        camera.position.y + Math.sin(elevation) * distance,
        camera.position.z + Math.cos(angle) * Math.cos(elevation) * distance
      );

      scene.add(group);
      enemies.push(group);
    }

    function spawnWave() {
      for (let i = 0; i < 5; i++) {
        spawnEnemy();
      }
    }

    function fireLasers() {
      if (isGameOver) return;
      const laserGeo = new THREE.CylinderGeometry(0.06, 0.06, 3, 6);
      const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);

      const offsets = [-0.6, 0.6];
      offsets.forEach(offset => {
        const laser = new THREE.Mesh(laserGeo, laserMat);
        laser.position.copy(camera.position);

        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        laser.position.addScaledVector(right, offset);

        laser.quaternion.copy(camera.quaternion);
        laser.rotateX(Math.PI / 2);
        laser.velocity = dir.clone().multiplyScalar(2.8);

        scene.add(laser);
        lasers.push(laser);
      });
    }

    function setupControls() {
      const stick = document.getElementById('flight-stick');
      const knob = document.getElementById('flight-knob');
      let touchId = null, center = { x: 0, y: 0 };

      stick.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        const rect = stick.getBoundingClientRect();
        center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      }, { passive: false });

      stick.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === touchId) {
            const dx = t.clientX - center.x;
            const dy = t.clientY - center.y;
            const dist = Math.min(45, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);

            knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            flightInput.yaw = -(Math.cos(angle) * dist) / 45;
            flightInput.pitch = -(Math.sin(angle) * dist) / 45;
          }
        }
      }, { passive: false });

      const resetStick = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchId) {
            touchId = null;
            knob.style.transform = 'translate(0px, 0px)';
            flightInput.yaw = 0;
            flightInput.pitch = 0;
          }
        }
      };
      stick.addEventListener('touchend', resetStick);
      stick.addEventListener('touchcancel', resetStick);

      // Buttons
      document.getElementById('photon-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        fireLasers();
      });

      const warpBtn = document.getElementById('warp-btn');
      warpBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        boostActive = true;
      });
      warpBtn.addEventListener('touchend', () => { boostActive = false; });
      warpBtn.addEventListener('touchcancel', () => { boostActive = false; });

      // Keyboard support
      window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') flightInput.pitch = 1;
        if (e.code === 'KeyS') flightInput.pitch = -1;
        if (e.code === 'KeyA') flightInput.yaw = 1;
        if (e.code === 'KeyD') flightInput.yaw = -1;
        if (e.code === 'ShiftLeft') boostActive = true;
        if (e.code === 'Space') fireLasers();
      });
      window.addEventListener('keyup', (e) => {
        if (['KeyW', 'KeyS'].includes(e.code)) flightInput.pitch = 0;
        if (['KeyA', 'KeyD'].includes(e.code)) flightInput.yaw = 0;
        if (e.code === 'ShiftLeft') boostActive = false;
      });
    }

    function updateHUD() {
      document.getElementById('hud-shields').innerText = `Shields: ${Math.max(0, Math.floor(shields))}%`;
      document.getElementById('hud-score').innerText = `Raiders Down: ${score}`;
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      if (isGameOver) return;

      const delta = clock.getDelta();

      // Steering
      camera.rotation.y += flightInput.yaw * 1.6 * delta;
      camera.rotation.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, camera.rotation.x + flightInput.pitch * 1.4 * delta));

      // Ship Forward Motion
      const speed = (boostActive ? baseSpeed * 2.5 : baseSpeed);
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      camera.position.addScaledVector(forward, speed * 25 * delta);

      // Reposition Starfield around player
      starfield.position.copy(camera.position);

      // Update Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.position.add(l.velocity);

        if (l.position.distanceTo(camera.position) > 180) {
          scene.remove(l);
          lasers.splice(i, 1);
          continue;
        }

        // Check collision with enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (l.position.distanceTo(enemy.position) < 2.5) {
            scene.remove(enemy);
            scene.remove(l);
            enemies.splice(j, 1);
            lasers.splice(i, 1);
            score++;
            updateHUD();
            setTimeout(spawnEnemy, 1800);
            break;
          }
        }
      }

      // Update Enemy Raiders
      enemies.forEach((enemy) => {
        const toPlayer = new THREE.Vector3().subVectors(camera.position, enemy.position);
        const dist = toPlayer.length();
        toPlayer.normalize();

        enemy.position.addScaledVector(toPlayer, 8.0 * delta);
        enemy.lookAt(camera.position);

        // Enemy collision damage
        if (dist < 3.0) {
          shields -= 25 * delta;
          updateHUD();
          if (shields <= 0) {
            isGameOver = true;
            alert('Hull Breach! Mission Failed. Refresh to restart.');
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
    updateHUD();
    animate();
  </script>
</body>
</html>
