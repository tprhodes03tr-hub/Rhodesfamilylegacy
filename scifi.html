<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Deep Space Raider Assault - HD Fleet Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; touch-action: none; }
    body { background: #020208; overflow: hidden; font-family: 'Impact', -apple-system, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; pointer-events: none;
      color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,200,0.8);
    }
    .hud-card {
      background: rgba(5, 12, 24, 0.75); border: 1px solid rgba(0, 255, 200, 0.4);
      border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(4px);
    }
    .val { font-size: 20px; color: #fff; }

    #reticle {
      position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
      transform: translate(-50%, -50%); pointer-events: none;
      border: 2px dashed rgba(0, 255, 200, 0.7); border-radius: 50%;
    }
    #reticle::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      background: #ff3366; transform: translate(-50%, -50%); border-radius: 50%;
      box-shadow: 0 0 8px #ff3366;
    }

    #controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 24px; pointer-events: none;
    }
    .stick-zone {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 255, 200, 0.05); border: 2px solid rgba(0, 255, 200, 0.3);
      position: relative; pointer-events: auto;
    }
    .stick-knob {
      width: 40px; height: 40px; border-radius: 50%;
      background: radial-gradient(circle, #00ffcc, #007766);
      position: absolute; top: 30px; left: 30px; pointer-events: none;
      box-shadow: 0 0 10px rgba(0,255,200,0.5);
    }
    .btn-col { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
    .btn-tap {
      width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
      color: #fff; font-size: 13px; font-weight: bold;
      backdrop-filter: blur(6px); cursor: pointer; text-shadow: 0 0 6px #000;
    }
    #btn-fire { background: radial-gradient(circle, rgba(231,76,60,0.85), rgba(120,30,30,0.9)); width: 72px; height: 72px; }
    #btn-boost { background: radial-gradient(circle, rgba(0,180,255,0.85), rgba(0,70,140,0.9)); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div class="hud-card">SHIELDS: <span class="val" id="shield-val">100%</span></div>
    <div class="hud-card">RAIDERS DOWN: <span class="val" id="kill-val">0</span></div>
  </div>

  <div id="reticle"></div>

  <div id="controls">
    <div class="stick-zone" id="flightZone"><div class="stick-knob" id="flightKnob"></div></div>
    <div class="btn-col">
      <button class="btn-tap" id="btn-boost">BOOST</button>
      <button class="btn-tap" id="btn-fire">FIRE</button>
    </div>
  </div>

  <script>
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Deep Starfield
    const starGeo = new THREE.BufferGeometry();
    const starCount = 1800;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 700;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.85 }));
    scene.add(starField);

    // Nebula Backdrop
    const nebula = new THREE.Mesh(
      new THREE.SphereGeometry(350, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x120824, side: THREE.BackSide })
    );
    scene.add(nebula);

    // Directional & Ambient Lighting
    const ambLight = new THREE.AmbientLight(0x445566, 1.2);
    scene.add(ambLight);
    const sunLight = new THREE.DirectionalLight(0xffeedd, 1.5);
    sunLight.position.set(50, 80, 50);
    scene.add(sunLight);

    // Player Cockpit Cannons
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x223344, metalness: 0.8, roughness: 0.3 });
    const gunL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.9), gunMat);
    gunL.rotation.x = Math.PI / 2; gunL.position.set(-0.6, -0.4, -0.8);
    const gunR = gunL.clone(); gunR.position.x = 0.6;
    camera.add(gunL); camera.add(gunR);
    scene.add(camera);

    // Audio SFX Synthesizer
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);

      if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(900, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, actx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.12);
        osc.start(); osc.stop(actx.currentTime + 0.12);
      } else if (type === 'boom') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, actx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.5, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.35);
        osc.start(); osc.stop(actx.currentTime + 0.35);
      }
    }

    // --- DETAILED ENEMY STARFIGHTER BUILDER ---
    function createRaiderShip() {
      const ship = new THREE.Group();
      const hullMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.7, roughness: 0.4 });
      const wingMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.5, roughness: 0.5 });
      const glowMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });

      // Fuselage / Cockpit
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2.8, 6), hullMat);
      body.rotation.x = -Math.PI / 2;
      ship.add(body);

      // Cockpit Canopy Visor (Glowing)
      const canopy = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 0.7), new THREE.MeshBasicMaterial({ color: 0x00ffcc }));
      canopy.position.set(0, 0.25, 0.2);
      ship.add(canopy);

      // Swept Wings (Left & Right)
      const wingGeo = new THREE.BoxGeometry(1.6, 0.05, 1.2);
      const wingL = new THREE.Mesh(wingGeo, wingMat);
      wingL.position.set(-1.1, 0, -0.2);
      wingL.rotation.y = -0.3; wingL.rotation.z = -0.15;
      const wingR = new THREE.Mesh(wingGeo, wingMat);
      wingR.position.set(1.1, 0, -0.2);
      wingR.rotation.y = 0.3; wingR.rotation.z = 0.15;
      ship.add(wingL); ship.add(wingR);

      // Dual Engine Afterburners (Glowing Cones on Back)
      const thrusterGeo = new THREE.CylinderGeometry(0.12, 0.18, 0.4, 8);
      const thrusterL = new THREE.Mesh(thrusterGeo, glowMat);
      thrusterL.rotation.x = Math.PI / 2; thrusterL.position.set(-0.3, 0, -1.4);
      const thrusterR = thrusterL.clone();
      thrusterR.position.x = 0.3;
      ship.add(thrusterL); ship.add(thrusterR);

      return ship;
    }

    const raiders = [];
    const lasers = [];
    let kills = 0;
    let shields = 100;
    let speed = 0.4;

    function spawnRaider() {
      const ship = createRaiderShip();
      const dist = 140 + Math.random() * 50;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI;
      ship.position.set(dist * Math.cos(theta), dist * Math.sin(phi), dist * Math.sin(theta));
      scene.add(ship);
      raiders.push({ group: ship, rollOffset: Math.random() * 10 });
    }
    for (let i = 0; i < 7; i++) spawnRaider();

    // Flight Controls
    let stick = { x: 0, y: 0 };
    const fZone = document.getElementById("flightZone");
    const fKnob = document.getElementById("flightKnob");
    let touchId = null;

    fZone.addEventListener("touchstart", (e) => { touchId = e.changedTouches[0].identifier; });
    window.addEventListener("touchmove", (e) => {
      for (let t of e.changedTouches) {
        if (t.identifier === touchId) {
          const r = fZone.getBoundingClientRect();
          const dx = t.clientX - (r.left + 50);
          const dy = t.clientY - (r.top + 50);
          const dist = Math.min(Math.hypot(dx, dy), 35);
          const a = Math.atan2(dy, dx);
          const kx = Math.cos(a) * dist, ky = Math.sin(a) * dist;
          fKnob.style.transform = `translate(${kx}px, ${ky}px)`;
          stick.x = kx / 35; stick.y = ky / 35;
        }
      }
    });
    const resetStick = (e) => {
      for (let t of e.changedTouches) {
        if (t.identifier === touchId) {
          touchId = null;
          fKnob.style.transform = `translate(0px, 0px)`;
          stick.x = 0; stick.y = 0;
        }
      }
    };
    window.addEventListener("touchend", resetStick);
    window.addEventListener("touchcancel", resetStick);

    // Fire Laser Action
    document.getElementById("btn-fire").addEventListener("touchstart", fireLaser);
    function fireLaser() {
      playSound('laser');
      [-0.6, 0.6].forEach(offset => {
        const bolt = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.05, 2.5),
          new THREE.MeshBasicMaterial({ color: 0x00ffcc })
        );
        bolt.rotation.x = Math.PI / 2;
        bolt.quaternion.copy(camera.quaternion);
        bolt.position.copy(camera.position).add(new THREE.Vector3(offset, -0.4, -1).applyQuaternion(camera.quaternion));
        bolt.vel = new THREE.Vector3(0, 0, -3.8).applyQuaternion(camera.quaternion);
        scene.add(bolt);
        lasers.push(bolt);
      });
    }

    // Boost Action
    const boostBtn = document.getElementById("btn-boost");
    boostBtn.addEventListener("touchstart", () => { speed = 0.95; });
    boostBtn.addEventListener("touchend", () => { speed = 0.4; });

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Player Pitch & Yaw
      camera.rotation.y -= stick.x * 0.045;
      camera.rotation.x -= stick.y * 0.045;
      camera.rotation.x = Math.max(-1.3, Math.min(1.3, camera.rotation.x));
      camera.translateZ(-speed);

      // Laser Updates
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.position.add(l.vel);

        raiders.forEach((r, rIdx) => {
          if (l.position.distanceTo(r.group.position) < 3.8) {
            playSound('boom');
            scene.remove(r.group); raiders.splice(rIdx, 1);
            scene.remove(l); lasers.splice(i, 1);
            kills++;
            document.getElementById("kill-val").innerText = kills;
            spawnRaider();
          }
        });

        if (l.position.distanceTo(camera.position) > 280) {
          scene.remove(l); lasers.splice(i, 1);
        }
      }

      // Raider AI & Banking Maneuvers
      raiders.forEach(r => {
        r.group.lookAt(camera.position);
        r.rollOffset += 0.05;
        r.group.rotation.z = Math.sin(r.rollOffset) * 0.4; // Wing banking
        r.group.translateZ(0.25);

        if (r.group.position.distanceTo(camera.position) < 4.5) {
          shields = Math.max(0, shields - 15);
          document.getElementById("shield-val").innerText = shields + "%";
          r.group.position.set((Math.random() - 0.5) * 160, (Math.random() - 0.5) * 80, camera.position.z - 130);
          if (shields <= 0) {
            alert("SHIP DESTROYED - RAIDERS DOWN: " + kills);
            location.reload();
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
