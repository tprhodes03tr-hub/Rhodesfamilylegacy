<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ishmael's Sensory Playland - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0c1a30;
      color: #fff;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    /* Friendly Navigation Bar */
    #mode-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 8px;
      background: #1e293b;
      border-bottom: 3px solid #facc15;
      white-space: nowrap;
    }
    .mode-btn {
      background: #334155;
      color: #fff;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #facc15;
      color: #0f172a;
      border-color: #eab308;
    }
    /* Main Play Stage */
    #stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: calc(100vh - 70px);
      background: radial-gradient(circle, #1e3a8a 0%, #0f172a 100%);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #badge-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 1.1rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .badge {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 6px 14px;
    }
  </style>
</head>
<body>
  <div id="mode-bar">
    <button class="mode-btn active" onclick="setMode('clubhouse')">🎈 Clubhouse Sparkles</button>
    <button class="mode-btn" onclick="setMode('backyard')">🌳 Backyard Musical Steps</button>
    <button class="mode-btn" onclick="setMode('tools')">🔨 Manny's Tool Tap</button>
    <button class="mode-btn" onclick="setMode('balloons')">✨ Star Pop</button>
  </div>

  <div id="stage">
    <div id="badge-overlay">
      <div class="badge" id="activity-title">Touch Anywhere to Play!</div>
      <div class="badge" id="score-badge">Stars: 0</div>
    </div>
    <canvas id="sensoryCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('sensoryCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let currentMode = 'clubhouse';
    let starCount = 0;
    let items = [];
    let audioCtx = null;

    // Harmonious musical scale (C Pentatonic: Calming, musical, no dissonant notes)
    const pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSoftBell(freq) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      items = [];
    }

    function triggerSensoryTouch(x, y) {
      initAudio();
      starCount++;
      document.getElementById('score-badge').innerText = `Stars: ${starCount}`;

      // Pick tone from pentatonic scale based on screen position
      const noteIdx = Math.floor((x / canvas.width) * pentatonicNotes.length);
      playSoftBell(pentatonicNotes[Math.min(pentatonicNotes.length - 1, noteIdx)]);

      if (currentMode === 'clubhouse') {
        // Mickey Clubhouse silhouette ears & glowing stars
        for (let i = 0; i < 5; i++) {
          items.push({
            type: 'clubhouse_burst',
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            size: 14 + Math.random() * 12,
            color: ['#ef4444', '#facc15', '#3b82f6', '#ffffff'][Math.floor(Math.random() * 4)],
            alpha: 1
          });
        }
      } else if (currentMode === 'backyard') {
        // Backyard colorful stepping rings
        items.push({
          type: 'backyard_ring',
          x: x,
          y: y,
          r: 10,
          color: ['#22c55e', '#a855f7', '#f97316', '#38bdf8'][Math.floor(Math.random() * 4)],
          alpha: 1
        });
      } else if (currentMode === 'tools') {
        // Handy tool symbols (Hammer, Wrench, Screwdriver shapes)
        const toolIcons = ['🔨', '🔧', '🪛', '📐', '⭐'];
        items.push({
          type: 'tool_icon',
          icon: toolIcons[Math.floor(Math.random() * toolIcons.length)],
          x: x,
          y: y,
          vy: -2.5,
          scale: 1,
          alpha: 1
        });
      } else if (currentMode === 'balloons') {
        // Star & Balloon float
        items.push({
          type: 'star_float',
          x: x,
          y: y,
          r: 22 + Math.random() * 10,
          color: `hsl(${Math.random() * 360}, 90%, 65%)`,
          vy: -2,
          alpha: 1
        });
      }
    }

    // Touch Support (Multi-touch enabled)
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const r = canvas.getBoundingClientRect();
        triggerSensoryTouch(e.touches[i].clientX - r.left, e.touches[i].clientY - r.top);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const r = canvas.getBoundingClientRect();
        triggerSensoryTouch(e.touches[i].clientX - r.left, e.touches[i].clientY - r.top);
      }
    }, { passive: false });

    // Mouse support
    let isDown = false;
    canvas.addEventListener('mousedown', (e) => {
      isDown = true;
      const r = canvas.getBoundingClientRect();
      triggerSensoryTouch(e.clientX - r.left, e.clientY - r.top);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (isDown) {
        const r = canvas.getBoundingClientRect();
        triggerSensoryTouch(e.clientX - r.left, e.clientY - r.top);
      }
    });
    window.addEventListener('mouseup', () => { isDown = false; });

    // Render Loop
    function render() {
      // Soft trail clear
      ctx.fillStyle = 'rgba(12, 26, 48, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];

        if (it.type === 'clubhouse_burst') {
          it.x += it.vx;
          it.y += it.vy;
          it.alpha -= 0.015;

          ctx.save();
          ctx.globalAlpha = it.alpha;
          ctx.fillStyle = it.color;
          // Center circle
          ctx.beginPath();
          ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2);
          ctx.fill();
          // Left Ear
          ctx.beginPath();
          ctx.arc(it.x - it.size * 0.7, it.y - it.size * 0.7, it.size * 0.5, 0, Math.PI * 2);
          ctx.fill();
          // Right Ear
          ctx.beginPath();
          ctx.arc(it.x + it.size * 0.7, it.y - it.size * 0.7, it.size * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        else if (it.type === 'backyard_ring') {
          it.r += 3.5;
          it.alpha -= 0.02;

          ctx.save();
          ctx.globalAlpha = it.alpha;
          ctx.strokeStyle = it.color;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        else if (it.type === 'tool_icon') {
          it.y += it.vy;
          it.scale += 0.01;
          it.alpha -= 0.015;

          ctx.save();
          ctx.globalAlpha = it.alpha;
          ctx.font = `${Math.floor(28 * it.scale)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(it.icon, it.x, it.y);
          ctx.restore();
        }

        else if (it.type === 'star_float') {
          it.y += it.vy;
          it.alpha -= 0.01;

          ctx.save();
          ctx.globalAlpha = it.alpha;
          ctx.fillStyle = it.color;
          ctx.beginPath();
          ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⭐', it.x, it.y + 6);
          ctx.restore();
        }

        if (it.alpha <= 0) {
          items.splice(i, 1);
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
