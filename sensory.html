<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensory Sanctuary - Rhodes Legacy</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #10b981;
      --accent-soft: #34d399;
      --text: #e6edf3;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Ambient Overlay UI */
    .ui-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      pointer-events: none;
    }

    header {
      text-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.8rem 1.6rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--accent-soft);
    }

    /* Guided Breathing Circle */
    .breathing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .breath-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0.05) 70%);
      border: 2px solid var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
      animation: breatheAnimation 8s infinite ease-in-out;
      transition: all 0.5s ease;
    }

    .breath-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 1px;
    }

    @keyframes breatheAnimation {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
      }
      50% {
        transform: scale(1.6);
        box-shadow: 0 0 50px rgba(16, 185, 129, 0.4);
      }
    }

    /* Control Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.8rem 1.4rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn:hover, .btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <canvas id="ambientCanvas"></canvas>

  <div class="ui-layer">
    <header>
      <h1>SENSORY SANCTUARY</h1>
    </header>

    <div class="breathing-container">
      <div class="breath-circle" id="breathCircle">
        <span class="breath-text" id="breathLabel">Breathe</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="soundToggle" onclick="toggleSound()">Enable Gentle Tone</button>
      <button class="btn" onclick="cycleColor()">Change Mood</button>
      <button class="btn" onclick="toggleBreathing()">Toggle Guide</button>
      <a href="index.html" class="btn">&larr; Back to Hub</a>
    </div>
  </div>

  <script>
    // --- PARTICLE BACKGROUND ---
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const palettes = [
      { r: 16, g: 185, b: 129 },  // Soft Emerald
      { r: 6, g: 182, b: 212 },   // Calming Cyan
      { r: 139, g: 92, b: 246 },  // Serene Violet
      { r: 245, g: 158, b: 11 }   // Warm Amber
    ];
    let currentPaletteIdx = 0;

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 4 + 2;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        const col = palettes[currentPaletteIdx];
        ctx.fillStyle = `rgba(${col.r}, ${col.g}, ${col.b}, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = Array.from({ length: 65 }, () => new Particle());

    // Gentle Touch Ripple
    window.addEventListener('pointermove', (e) => {
      particles.forEach(p => {
        const dx = p.x - e.clientX;
        const dy = p.y - e.clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          p.x += (dx / dist) * 1.5;
          p.y += (dy / dist) * 1.5;
        }
      });
    });

    function render() {
      ctx.fillStyle = 'rgba(13, 17, 23, 0.2)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(render);
    }
    render();

    // --- CONTROLS & WEB AUDIO ---
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let isPlayingAudio = false;

    function toggleSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        // 432Hz calming ambient frequency tone
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
      }

      const btn = document.getElementById('soundToggle');
      if (isPlayingAudio) {
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
        btn.innerText = "Enable Gentle Tone";
        btn.classList.remove('active');
        isPlayingAudio = false;
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        gainNode.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 1);
        btn.innerText = "Tone Active";
        btn.classList.add('active');
        isPlayingAudio = true;
      }
    }

    function cycleColor() {
      currentPaletteIdx = (currentPaletteIdx + 1) % palettes.length;
      const col = palettes[currentPaletteIdx];
      document.documentElement.style.setProperty('--accent', `rgb(${col.r}, ${col.g}, ${col.b})`);
      document.documentElement.style.setProperty('--accent-soft', `rgba(${col.r}, ${col.g}, ${col.b}, 0.8)`);
    }

    let isBreathingVisible = true;
    function toggleBreathing() {
      isBreathingVisible = !isBreathingVisible;
      document.getElementById('breathCircle').style.display = isBreathingVisible ? 'flex' : 'none';
    }

    // Dynamic Breathing Label
    setInterval(() => {
      const label = document.getElementById('breathLabel');
      if (label.innerText === 'Inhale') {
        label.innerText = 'Exhale';
      } else {
        label.innerText = 'Inhale';
      }
    }, 4000);
  </script>
</body>
</html>
