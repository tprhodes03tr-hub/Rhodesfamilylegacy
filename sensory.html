<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensory Waves Room | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2838 0%, #0a1118 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Top Control Overlay */
    .controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn.active {
      background: rgba(147, 197, 253, 0.3);
      border-color: rgba(147, 197, 253, 0.6);
      color: #ffffff;
    }

    /* Calming Breathing Pacer */
    .breathing-guide {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.5s;
    }

    .breathing-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.35) 0%, rgba(96, 165, 250, 0.05) 70%);
      border: 1.5px solid rgba(191, 219, 254, 0.4);
      animation: breathe 8s ease-in-out infinite;
    }

    .breathing-text {
      color: #94a3b8;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.85); opacity: 0.4; }
      50% { transform: scale(1.6); opacity: 0.9; }
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="btn-group">
      <a href="index.html" class="btn" style="text-decoration:none;">← Home</a>
      <button id="soundToggle" class="btn">Sound: Off</button>
    </div>
    <div class="btn-group">
      <button id="calmBtn" class="btn">Calm Reset</button>
      <button id="pacerToggle" class="btn active">Breathing</button>
    </div>
  </div>

  <div class="breathing-guide" id="breathingGuide">
    <div class="breathing-circle"></div>
    <span class="breathing-text">Breathe Gently</span>
  </div>

  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const soundToggle = document.getElementById('soundToggle');
    const calmBtn = document.getElementById('calmBtn');
    const pacerToggle = document.getElementById('pacerToggle');
    const breathingGuide = document.getElementById('breathingGuide');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // --- Web Audio (Pentatonic Scale - D Major / Calming Chimes) ---
    let audioCtx = null;
    let soundEnabled = false;
    const pentatonicNotes = [293.66, 329.63, 369.99, 440.0, 493.88, 587.33, 659.25]; // D4, E4, F#4, A4, B4, D5, E5

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChime(x, y) {
      if (!soundEnabled || !audioCtx) return;

      // Select note based on vertical screen position
      const noteIndex = Math.floor((1 - y / height) * pentatonicNotes.length);
      const safeIndex = Math.max(0, Math.min(noteIndex, pentatonicNotes.length - 1));
      const freq = pentatonicNotes[safeIndex];

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Soft envelope (gentle fade in, slow ambient fade out)
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 2.0);
    }

    soundToggle.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? 'Sound: On' : 'Sound: Off';
      soundToggle.classList.toggle('active', soundEnabled);
    });

    pacerToggle.addEventListener('click', () => {
      const isVisible = breathingGuide.style.display !== 'none';
      breathingGuide.style.display = isVisible ? 'none' : 'flex';
      pacerToggle.classList.toggle('active', !isVisible);
    });

    // --- Calming Wave & Ripple Particle System ---
    const ripples = [];
    const particles = [];

    // Ambient floating gentle particles
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 3 + 1.5,
        speedX: (Math.random() - 0.5) * 0.4,
        speedY: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.4 + 0.2,
      });
    }

    function addRipple(x, y) {
      ripples.push({
        x,
        y,
        radius: 5,
        maxRadius: Math.min(width, height) * 0.35,
        alpha: 0.6,
        growth: 1.8,
        colorHue: Math.floor(Math.random() * 40 + 190), // Calming soft blues & cyans
      });
      playChime(x, y);
    }

    // Single click / tap or drag
    let isTouching = false;
    let lastSpawn = 0;

    function handlePointer(x, y) {
      const now = Date.now();
      if (now - lastSpawn > 80) { // Throttled to keep motion gentle
        addRipple(x, y);
        lastSpawn = now;
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.controls')) return;
      isTouching = true;
      initAudio();
      handlePointer(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (isTouching) {
        handlePointer(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointerup', () => { isTouching = false; });
    window.addEventListener('pointercancel', () => { isTouching = false; });

    // Calm Reset Button
    calmBtn.addEventListener('click', () => {
      ripples.length = 0;
      ctx.fillStyle = '#0a1118';
      ctx.fillRect(0, 0, width, height);
    });

    // Render Loop
    function animate() {
      // Gentle trail persistence
      ctx.fillStyle = 'rgba(10, 17, 24, 0.12)';
      ctx.fillRect(0, 0, width, height);

      // Draw ambient drifting orbs
      for (const p of particles) {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(147, 197, 253, ${p.alpha})`;
        ctx.fill();
      }

      // Draw soft expanding water ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += r.growth;
        r.alpha -= 0.007;

        if (r.alpha <= 0 || r.radius >= r.maxRadius) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${r.colorHue}, 80%, 75%, ${r.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
