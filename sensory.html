<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensory Waves Room | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2838 0%, #0a1118 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      overscroll-behavior-y: none;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: auto;
    }

    /* Top Control Overlay */
    .controls {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn.active {
      background: rgba(147, 197, 253, 0.3);
      border-color: rgba(147, 197, 253, 0.6);
      color: #ffffff;
    }

    /* Sensory Mode Toolbar */
    .sensory-toolbar {
      position: fixed;
      top: 70px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(147, 197, 253, 0.3);
      color: #93c5fd;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #60a5fa;
    }

    /* Calming Breathing Pacer */
    .breathing-guide {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.5s;
    }

    .breathing-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.35) 0%, rgba(96, 165, 250, 0.05) 70%);
      border: 2px solid rgba(191, 219, 254, 0.4);
      animation: breathe 8s ease-in-out infinite;
    }

    .breathing-text {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.85); opacity: 0.4; }
      50% { transform: scale(1.7); opacity: 0.95; }
    }

    /* Centered Welcome Banner for Sensory Space */
    .sensory-welcome {
      position: fixed;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      width: 90%;
      max-width: 600px;
    }

    .sensory-welcome h1 {
      font-size: 1.4rem;
      color: #f8fafc;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .sensory-welcome p {
      color: #93c5fd;
      font-size: 0.85rem;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="btn-group">
      <a href="index.html" class="btn">← Home</a>
      <button id="soundToggle" class="btn">Chimes: Off</button>
      <button id="soundscapeToggle" class="btn">Soundscape: Off</button>
    </div>
    <div class="btn-group">
      <button id="calmBtn" class="btn">Clear</button>
      <button id="pacerToggle" class="btn active">Breathing</button>
    </div>
  </div>

  <!-- Sensory Room Mode Selector -->
  <div class="sensory-toolbar">
    <button class="mode-btn active" data-mode="drift">✨ Deep Space Drift</button>
    <button class="mode-btn" data-mode="ripples">🌊 Liquid Light</button>
    <button class="mode-btn" data-mode="bubbles">🔵 Fidget Bubbles</button>
  </div>

  <div class="sensory-welcome">
    <h1>Sensory Sanctuary</h1>
    <p>Tap or drag anywhere for calm chimes and soothing visual feedback.</p>
  </div>

  <div class="breathing-guide" id="breathingGuide">
    <div class="breathing-circle"></div>
    <span class="breathing-text">Breathe in... Breathe out...</span>
  </div>

  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const soundToggle = document.getElementById('soundToggle');
    const soundscapeToggle = document.getElementById('soundscapeToggle');
    const calmBtn = document.getElementById('calmBtn');
    const pacerToggle = document.getElementById('pacerToggle');
    const breathingGuide = document.getElementById('breathingGuide');
    const modeBtns = document.querySelectorAll('.mode-btn');

    let sensoryMode = 'drift'; // 'drift', 'ripples', 'bubbles'

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        sensoryMode = btn.getAttribute('data-mode');
        initSensoryObjects();
      });
    });

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // --- Web Audio (Pentatonic Scale & Soundscapes) ---
    let audioCtx = null;
    let soundEnabled = false;
    const pentatonicNotes = [293.66, 329.63, 369.99, 440.0, 493.88, 587.33, 659.25];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChime(x, y) {
      if (!soundEnabled || !audioCtx) return;

      const noteIndex = Math.floor((1 - y / height) * pentatonicNotes.length);
      const safeIndex = Math.max(0, Math.min(noteIndex, pentatonicNotes.length - 1));
      const freq = pentatonicNotes[safeIndex];

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 2.0);
    }

    soundToggle.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? 'Chimes: On' : 'Chimes: Off';
      soundToggle.classList.toggle('active', soundEnabled);
    });

    // --- Calming Background Soundscape Generator (Pink Noise) ---
    let soundscapeNode = null;
    let soundscapeGain = null;
    let isSoundscapeActive = false;

    function toggleSoundscape() {
      initAudio();
      if (!audioCtx) return;

      if (isSoundscapeActive) {
        if (soundscapeNode) {
          soundscapeNode.stop();
          soundscapeNode.disconnect();
          soundscapeNode = null;
        }
        isSoundscapeActive = false;
        soundscapeToggle.textContent = 'Soundscape: Off';
        soundscapeToggle.classList.remove('active');
      } else {
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          output[i] *= 0.11;
          b6 = white * 0.115926;
        }

        soundscapeNode = audioCtx.createBufferSource();
        soundscapeNode.buffer = noiseBuffer;
        soundscapeNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(350, audioCtx.currentTime);

        soundscapeGain = audioCtx.createGain();
        soundscapeGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        soundscapeGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 1.5);

        soundscapeNode.connect(filter);
        filter.connect(soundscapeGain);
        soundscapeGain.connect(audioCtx.destination);

        soundscapeNode.start();
        isSoundscapeActive = true;
        soundscapeToggle.textContent = 'Soundscape: On';
        soundscapeToggle.classList.add('active');
      }
    }

    soundscapeToggle.addEventListener('click', toggleSoundscape);

    pacerToggle.addEventListener('click', () => {
      const isVisible = breathingGuide.style.display !== 'none';
      breathingGuide.style.display = isVisible ? 'none' : 'flex';
      pacerToggle.classList.toggle('active', !isVisible);
    });

    // --- Dynamic Multi-Mode Sensory Object Management ---
    const ripples = [];
    const particles = [];
    const fidgetBubbles = [];

    function initSensoryObjects() {
      particles.length = 0;
      ripples.length = 0;
      fidgetBubbles.length = 0;

      if (sensoryMode === 'drift') {
        for (let i = 0; i < 60; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 3 + 1.5,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            alpha: Math.random() * 0.6 + 0.2,
          });
        }
      } else if (sensoryMode === 'bubbles') {
        for (let i = 0; i < 22; i++) {
          fidgetBubbles.push({
            x: Math.random() * (width - 100) + 50,
            y: Math.random() * (height - 150) + 100,
            r: Math.random() * 30 + 25,
            scale: 1,
            popping: false,
            color: `hsla(${Math.random() * 60 + 180}, 75%, 70%, 0.4)`
          });
        }
      }
    }

    initSensoryObjects();

    function addRipple(x, y) {
      ripples.push({
        x,
        y,
        radius: 5,
        maxRadius: Math.min(width, height) * 0.4,
        alpha: 0.65,
        growth: 2.2,
        colorHue: Math.floor(Math.random() * 50 + 180),
      });
      playChime(x, y);
    }

    let isTouching = false;
    let lastSpawn = 0;

    function handlePointer(x, y) {
      const now = Date.now();
      if (sensoryMode === 'drift' || sensoryMode === 'ripples') {
        if (now - lastSpawn > 70) {
          addRipple(x, y);
          lastSpawn = now;
        }
      } else if (sensoryMode === 'bubbles') {
        fidgetBubbles.forEach(b => {
          const dist = Math.hypot(x - b.x, y - b.y);
          if (dist < b.r && !b.popping) {
            b.popping = true;
            playChime(b.x, b.y);
            setTimeout(() => {
              b.x = Math.random() * (width - 100) + 50;
              b.y = Math.random() * (height - 150) + 100;
              b.scale = 1;
              b.popping = false;
            }, 350);
          }
        });
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.controls') || e.target.closest('.sensory-toolbar')) return;
      isTouching = true;
      initAudio();
      handlePointer(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (isTouching && !e.target.closest('.controls') && !e.target.closest('.sensory-toolbar')) {
        handlePointer(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointerup', () => { isTouching = false; });
    window.addEventListener('pointercancel', () => { isTouching = false; });

    calmBtn.addEventListener('click', () => {
      initSensoryObjects();
      ctx.fillStyle = '#0a1118';
      ctx.fillRect(0, 0, width, height);
    });

    function animate() {
      ctx.fillStyle = 'rgba(10, 17, 24, 0.15)';
      ctx.fillRect(0, 0, width, height);

      if (sensoryMode === 'drift') {
        for (const p of particles) {
          p.x += p.speedX;
          p.y += p.speedY;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(147, 197, 253, ${p.alpha})`;
          ctx.fill();
        }
      } else if (sensoryMode === 'bubbles') {
        fidgetBubbles.forEach(b => {
          if (b.popping) {
            b.scale += 0.12;
            if (b.scale > 1.4) b.scale = 1.4;
          } else {
            if (b.scale > 1) b.scale -= 0.05;
          }

          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * b.scale, 0, Math.PI * 2);
          ctx.fillStyle = b.popping ? 'rgba(255, 255, 255, 0.75)' : b.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += r.growth;
        r.alpha -= 0.007;

        if (r.alpha <= 0 || r.radius >= r.maxRadius) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${r.colorHue}, 80%, 75%, ${r.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
