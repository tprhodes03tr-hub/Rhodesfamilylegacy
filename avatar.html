<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar: Aerial & Aquatic Vanguard</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #020b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(4, 18, 36, 0.8);
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid #1a8cff;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.3);
            pointer-events: none;
        }
        .bar-container {
            width: 200px;
            height: 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 7px;
            overflow: hidden;
            margin: 6px 0 12px 0;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00a6ff);
            transition: width 0.2s;
        }
        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(4, 18, 36, 0.85);
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid #00e5ff;
            font-size: 13px;
            text-align: center;
            pointer-events: none;
        }
        #reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 229, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="reticle"></div>
    <div id="hud">
        <div style="font-size: 16px; font-weight: bold; color: #00e5ff;">WARRIOR ISRAEL</div>
        <div style="font-size: 12px; margin-top: 4px;">Health</div>
        <div class="bar-container"><div id="health-bar"></div></div>
        <div style="font-size: 13px;">Stance: <span id="stance-label" style="color: #00e5ff; font-weight: bold;">Aerial Flight</span></div>
        <div style="font-size: 13px; margin-top: 4px;">Enemies Remaining: <span id="enemy-count" style="color: #ffaa00; font-weight: bold;">5</span></div>
    </div>
    <div id="controls-hint">
        <strong>W/S:</strong> Pitch | <strong>A/D:</strong> Roll/Turn | <strong>Q/E:</strong> Submerge / Surface | <strong>Space:</strong> Surface Breach Launch<br>
        <strong>Left Click:</strong> Precision Arrow Fire | <strong>Right Click:</strong> Slow-Mo Focus Aim | <strong>F:</strong> Heavy Breaching Melee
    </div>

    <script>
        // --- SCENE & RENDERER SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x051d38, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const sunLight = new THREE.DirectionalLight(0xfff4e0, 1.4);
        sunLight.position.set(100, 150, 50);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x224466, 0.8));

        // --- WATER PLANE (Y = 0) ---
        const waterGeo = new THREE.PlaneGeometry(1200, 1200, 32, 32);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x006699,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1,
            metalness: 0.1
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        // --- PLAYER AVATAR ---
        const playerGroup = new THREE.Group();
        const bodyGeo = new THREE.ConeGeometry(1.2, 4, 8);
        bodyGeo.rotateX(Math.PI / 2);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x0077cc, roughness: 0.4 });
        const playerMesh = new THREE.Mesh(bodyGeo, playerMat);
        playerGroup.add(playerMesh);

        // Wings
        const wingGeo = new THREE.BoxGeometry(7, 0.1, 1.8);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x00aaff });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        playerGroup.add(wings);

        playerGroup.position.set(0, 15, 0);
        scene.add(playerGroup);

        // --- GAME STATE ---
        let stance = "AIR_FLIGHT";
        let health = 100;
        let speed = 35;
        let timeScale = 1.0;
        const keys = {};
        const arrows = [];
        const enemies = [];

        // --- ENEMY SPAWN ---
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xd9383a });
        for (let i = 0; i < 5; i++) {
            const e = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 5), enemyMat);
            e.position.set((Math.random() - 0.5) * 200, Math.random() > 0.5 ? 12 : -10, -80 - Math.random() * 150);
            scene.add(e);
            enemies.push(e);
        }

        // --- INPUT LISTENERS ---
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) fireArrow(); // Left Click
            if (e.button === 2) timeScale = 0.35; // Right Click (Slow-Mo Focus)
        });
        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) timeScale = 1.0;
        });
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') executeMeleeStrike();
        });

        // --- COMBAT ACTIONS ---
        function fireArrow() {
            const arrowGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.5);
            arrowGeo.rotateX(Math.PI / 2);
            const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const arrow = new THREE.Mesh(arrowGeo, arrowMat);
            arrow.position.copy(playerGroup.position);
            arrow.quaternion.copy(playerGroup.quaternion);

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            arrows.push({ mesh: arrow, dir: forward, life: 2.5 });
            scene.add(arrow);
        }

        function executeMeleeStrike() {
            // Downward spinning breach melee strike
            const strikeRadius = 16;
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (playerGroup.position.distanceTo(enemies[i].position) < strikeRadius) {
                    scene.remove(enemies[i]);
                    enemies.splice(i, 1);
                }
            }
            document.getElementById('enemy-count').innerText = enemies.length;
        }

        // --- MAIN GAME LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta() * timeScale;

            // Pitch & Yaw
            if (keys['w']) playerGroup.rotateX(-1.5 * delta);
            if (keys['s']) playerGroup.rotateX(1.5 * delta);
            if (keys['a']) playerGroup.rotateY(1.8 * delta);
            if (keys['d']) playerGroup.rotateY(-1.8 * delta);

            // Submerge / Surface
            if (keys['q']) playerGroup.position.y -= 18 * delta;
            if (keys['e']) playerGroup.position.y += 18 * delta;

            // Forward Flight Movement
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            playerGroup.position.addScaledVector(forward, speed * delta);

            // Stance Logic & Water Surface Breach
            if (playerGroup.position.y < 0 && stance !== "AQUATIC_DIVE") {
                stance = "AQUATIC_DIVE";
                speed = 22;
                document.getElementById('stance-label').innerText = "Aquatic Submerged";
                document.getElementById('stance-label').style.color = "#00ffa2";
            } else if (playerGroup.position.y >= 0 && stance === "AQUATIC_DIVE") {
                if (keys[' ']) { // Breach Launch
                    playerGroup.position.y += 15;
                    speed = 48; // Burst of breach speed
                }
                stance = "AIR_FLIGHT";
                speed = 35;
                document.getElementById('stance-label').innerText = "Aerial Flight";
                document.getElementById('stance-label').style.color = "#00e5ff";
            }

            // Camera follow behind player
            const camOffset = new THREE.Vector3(0, 4, 12).applyQuaternion(playerGroup.quaternion);
            camera.position.lerp(playerGroup.position.clone().add(camOffset), 0.1);
            camera.lookAt(playerGroup.position);

            // Update Arrows
            for (let i = arrows.length - 1; i >= 0; i--) {
                const a = arrows[i];
                a.mesh.position.addScaledVector(a.dir, 140 * delta);
                a.life -= delta;

                // Hit Detection
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (a.mesh.position.distanceTo(enemies[j].position) < 4.0) {
                        scene.remove(enemies[j]);
                        enemies.splice(j, 1);
                        a.life = 0;
                        document.getElementById('enemy-count').innerText = enemies.length;
                        break;
                    }
                }

                if (a.life <= 0) {
                    scene.remove(a.mesh);
                    arrows.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
