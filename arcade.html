<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Retro Arcade - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d0e15;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #cabinet {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 60vh;
      background: #000;
      border: 3px solid #ff0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
      pointer-events: none;
    }
    /* Controller Area */
    #controller {
      width: 100%;
      max-width: 480px;
      height: 35vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 25px;
      background: #141622;
      border-top: 2px solid #222538;
    }
    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .d-btn {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #2a2d42;
      border: 2px solid #444966;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #aaa;
    }
    .d-btn:active {
      background: #00ffcc;
      color: #000;
    }
    #btn-left { top: 40px; left: 0; }
    #btn-right { top: 40px; right: 0; }

    .action-group {
      display: flex;
      gap: 15px;
    }
    .retro-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #ff0055;
      background: rgba(255, 0, 85, 0.3);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }
    .retro-btn:active {
      background: #ff0055;
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="cabinet">
    <div id="hud">
      <span id="score-display">SCORE: 0000</span>
      <span id="lives-display">LIVES: 3</span>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Virtual Gamepad -->
  <div id="controller">
    <div class="dpad">
      <div id="btn-left" class="d-btn">◀</div>
      <div id="btn-right" class="d-btn">▶</div>
    </div>
    <div class="action-group">
      <button id="btn-fire" class="retro-btn">FIRE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 320;
    canvas.height = 400;

    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Player Ship
    const player = {
      x: canvas.width / 2 - 12,
      y: canvas.height - 35,
      w: 24,
      h: 16,
      speed: 4,
      dx: 0
    };

    let bullets = [];
    let invaders = [];
    let invaderDir = 1;
    let invaderSpeed = 0.6;

    function initInvaders() {
      invaders = [];
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 6; col++) {
          invaders.push({
            x: 35 + col * 42,
            y: 35 + row * 28,
            w: 20,
            h: 14,
            alive: true
          });
        }
      }
    }

    function fireBullet() {
      if (gameOver) return;
      if (bullets.length < 3) {
        bullets.push({
          x: player.x + player.w / 2 - 2,
          y: player.y - 6,
          w: 4,
          h: 8,
          speed: 6
        });
      }
    }

    // Controls Handling
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnFire = document.getElementById('btn-fire');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = -player.speed; });
    btnLeft.addEventListener('touchend', () => { if (player.dx < 0) player.dx = 0; });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = player.speed; });
    btnRight.addEventListener('touchend', () => { if (player.dx > 0) player.dx = 0; });

    btnFire.addEventListener('touchstart', (e) => {
      e.preventDefault();
      fireBullet();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.dx = -player.speed;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') player.dx = player.speed;
      if (e.code === 'Space') fireBullet();
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) player.dx = 0;
    });

    function update() {
      if (gameOver) return;

      player.x += player.dx;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      // Move Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) {
          bullets.splice(i, 1);
        }
      }

      // Move Invaders
      let edgeReached = false;
      invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += invaderDir * invaderSpeed;
        if (inv.x + inv.w > canvas.width - 15 || inv.x < 15) {
          edgeReached = true;
        }
      });

      if (edgeReached) {
        invaderDir *= -1;
        invaders.forEach(inv => {
          if (inv.alive) inv.y += 10;
          if (inv.alive && inv.y + inv.h >= player.y) {
            gameOver = true;
            alert('Invasion Complete! Refresh to insert coin.');
          }
        });
      }

      // Collision Detection
      bullets.forEach((b, bIdx) => {
        invaders.forEach(inv => {
          if (inv.alive && b.x < inv.x + inv.w && b.x + b.w > inv.x && b.y < inv.y + inv.h && b.y + b.h > inv.y) {
            inv.alive = false;
            bullets.splice(bIdx, 1);
            score += 50;
            document.getElementById('score-display').innerText = `SCORE: ${String(score).padStart(4, '0')}`;
          }
        });
      });

      // Respawn wave if cleared
      if (invaders.every(inv => !inv.alive)) {
        invaderSpeed += 0.3;
        initInvaders();
      }
    }

    function render() {
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Player
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(player.x + 8, player.y - 4, 8, 4);

      // Draw Bullets
      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Draw Invaders
      ctx.fillStyle = '#ff0055';
      invaders.forEach(inv => {
        if (inv.alive) {
          ctx.fillRect(inv.x, inv.y, inv.w, inv.h);
          ctx.fillStyle = '#fff';
          ctx.fillRect(inv.x + 4, inv.y + 3, 3, 3);
          ctx.fillRect(inv.x + 13, inv.y + 3, 3, 3);
          ctx.fillStyle = '#ff0055';
        }
      });

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    initInvaders();
    render();
  </script>
</body>
</html>
