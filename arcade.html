<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Galaxy Assault: Dual Fighter Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; touch-action: none; }
    body { background: #080811; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; overflow: hidden; }

    #game-container {
      position: relative; width: 100%; max-width: 440px; height: 72vh;
      border: 3px solid #ff0055; border-radius: 12px; margin-top: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); overflow: hidden; background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* Controls */
    #controls {
      width: 100%; max-width: 440px; height: 24vh;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px;
    }
    .d-pad { display: flex; gap: 14px; }
    .ctrl-btn {
      width: 68px; height: 68px; border-radius: 12px; border: 2px solid #334466;
      background: #111a2e; color: #00ffcc; font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .ctrl-btn:active { background: #00ffcc; color: #000; }
    #fire-btn {
      width: 84px; height: 84px; border-radius: 50%; border: 3px solid #ff0055;
      background: radial-gradient(circle, #ff0055, #880022); color: #fff;
      font-size: 16px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,85,0.5);
    }
    #fire-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="controls">
    <div class="d-pad">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <button id="fire-btn">FIRE</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Virtual Resolution
    const V_WIDTH = 360;
    const V_HEIGHT = 540;
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;

    // --- SOUND SYNTHESIZER ---
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);

      if (type === 'laser') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, actx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.08);
        osc.start(); osc.stop(actx.currentTime + 0.08);
      } else if (type === 'boom') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, actx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.25);
        osc.start(); osc.stop(actx.currentTime + 0.25);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, actx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, actx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.2);
        osc.start(); osc.stop(actx.currentTime + 0.2);
      }
    }

    // --- GAME STATE ---
    let score = 0;
    let lives = 3;
    let stage = 1;
    let isGameOver = false;

    // Stars Background
    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * V_WIDTH,
        y: Math.random() * V_HEIGHT,
        speed: 0.5 + Math.random() * 2,
        size: Math.random() > 0.8 ? 2 : 1,
        color: ['#fff', '#00ffff', '#ff77aa', '#ffea00'][Math.floor(Math.random() * 4)]
      });
    }

    // Player Fighter
    const player = {
      x: V_WIDTH / 2,
      y: V_HEIGHT - 50,
      width: 24,
      height: 24,
      speed: 4.5,
      isDual: false, // Double Ship Upgrade
      moveLeft: false,
      moveRight: false
    };

    const bullets = [];
    const enemies = [];
    const particles = [];
    const powerups = [];

    // --- DRAW SPRITES ---
    function drawShip(x, y) {
      // Classic Galaga Arrowhead Fighter
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 3, y - 10, 6, 20); // Fuselage
      ctx.fillStyle = '#d92027';
      ctx.fillRect(x - 12, y + 2, 24, 6); // Main Wings
      ctx.fillStyle = '#00ffff';
      ctx.fillRect(x - 14, y - 2, 4, 10); // Left Cannon
      ctx.fillRect(x + 10, y - 2, 4, 10); // Right Cannon
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(x - 2, y + 8, 4, 4); // Thruster
    }

    function drawAlien(e) {
      ctx.save();
      ctx.translate(e.x, e.y);

      if (e.type === 'boss') {
        // Green/Yellow Galaga Commander Boss
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(-12, -8, 24, 16);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(-6, -12, 12, 6);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-8, 2, 4, 6); ctx.fillRect(4, 2, 4, 6);
      } else if (e.type === 'butterfly') {
        // Red Butterfly Raider
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-10, -6, 20, 12);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-4, -10, 8, 4);
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(-8, 4, 4, 4); ctx.fillRect(4, 4, 4, 4);
      } else {
        // Blue Bee Worker
        ctx.fillStyle = '#00a8ff';
        ctx.fillRect(-8, -6, 16, 12);
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(-4, -4, 8, 8);
      }
      ctx.restore();
    }

    // --- ENEMY SPAWNING ---
    function initFormation() {
      enemies.length = 0;
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 8; col++) {
          let type = row === 0 ? 'boss' : (row === 1 ? 'butterfly' : 'bee');
          enemies.push({
            origX: 45 + col * 38,
            origY: 60 + row * 30,
            x: 45 + col * 38,
            y: 60 + row * 30,
            type: type,
            hp: type === 'boss' ? 2 : 1,
            isDiving: false,
            diveAngle: 0,
            diveSpeed: 2.5 + stage * 0.4
          });
        }
      }
    }
    initFormation();

    // --- CONTROLS BINDING ---
    const btnL = document.getElementById('btn-left');
    const btnR = document.getElementById('btn-right');
    const btnFire = document.getElementById('fire-btn');

    const setLeft = (v) => { player.moveLeft = v; };
    const setRight = (v) => { player.moveRight = v; };

    btnL.addEventListener('touchstart', (e) => { e.preventDefault(); setLeft(true); });
    btnL.addEventListener('touchend', (e) => { e.preventDefault(); setLeft(false); });
    btnR.addEventListener('touchstart', (e) => { e.preventDefault(); setRight(true); });
    btnR.addEventListener('touchend', (e) => { e.preventDefault(); setRight(false); });

    btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') setLeft(true);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') setRight(true);
      if (e.code === 'Space') shoot();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') setLeft(false);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') setRight(false);
    });

    // --- SHOOTING & DUAL CANNON ---
    function shoot() {
      if (isGameOver) return;
      playSound('laser');

      if (player.isDual) {
        // Double Dual-Lasers (4 parallel laser streams)
        bullets.push({ x: player.x - 16, y: player.y - 12 });
        bullets.push({ x: player.x - 6, y: player.y - 12 });
        bullets.push({ x: player.x + 6, y: player.y - 12 });
        bullets.push({ x: player.x + 16, y: player.y - 12 });
      } else {
        // Standard Single Ship Twin Lasers
        bullets.push({ x: player.x - 8, y: player.y - 10 });
        bullets.push({ x: player.x + 8, y: player.y - 10 });
      }
    }

    function createExplosion(x, y, col = '#ff5500') {
      playSound('boom');
      for (let i = 0; i < 14; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 20, color: col
        });
      }
    }

    // --- MAIN GAME LOOP ---
    let tick = 0;
    function update() {
      tick++;

      // Stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > V_HEIGHT) { s.y = 0; s.x = Math.random() * V_WIDTH; }
      });

      // Player Movement
      const bounds = player.isDual ? 32 : 18;
      if (player.moveLeft && player.x > bounds) player.x -= player.speed;
      if (player.moveRight && player.x < V_WIDTH - bounds) player.x += player.speed;

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 9;
        if (bullets[i].y < 0) { bullets.splice(i, 1); continue; }

        // Bullet Hit Enemy
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(bullets[i].x - e.x, bullets[i].y - e.y) < 18) {
            bullets.splice(i, 1);
            e.hp--;
            if (e.hp <= 0) {
              createExplosion(e.x, e.y, e.type === 'boss' ? '#2ecc71' : '#e74c3c');
              score += e.type === 'boss' ? 200 : (e.type === 'butterfly' ? 100 : 50);

              // Chance to drop Dual-Ship Capsule
              if (!player.isDual && (e.type === 'boss' || Math.random() < 0.12)) {
                powerups.push({ x: e.x, y: e.y });
              }

              enemies.splice(j, 1);
            }
            break;
          }
        }
      }

      // Update Powerups (Double Fighter Upgrade)
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += 2;
        if (Math.hypot(player.x - p.x, player.y - p.y) < 26) {
          player.isDual = true;
          playSound('powerup');
          powerups.splice(i, 1);
        } else if (p.y > V_HEIGHT) {
          powerups.splice(i, 1);
        }
      }

      // Formation Hover & Dive-Bomb AI
      const hoverOffset = Math.sin(tick * 0.04) * 14;
      enemies.forEach(e => {
        if (!e.isDiving) {
          e.x = e.origX + hoverOffset;
          // Random Dive-Bomb Loop
          if (Math.random() < 0.003 + stage * 0.001) {
            e.isDiving = true;
            e.diveAngle = Math.atan2(player.y - e.y, player.x - e.x);
          }
        } else {
          // Swooping Dive
          e.x += Math.cos(e.diveAngle) * e.diveSpeed;
          e.y += Math.sin(e.diveAngle) * e.diveSpeed;

          // Collide with Player
          if (Math.hypot(player.x - e.x, player.y - e.y) < (player.isDual ? 28 : 20)) {
            createExplosion(player.x, player.y, '#00ffff');
            if (player.isDual) {
              player.isDual = false; // Lose 1 ship first
            } else {
              lives--;
              if (lives <= 0) isGameOver = true;
            }
            e.y = 0; e.isDiving = false;
          }

          // Loop back to top
          if (e.y > V_HEIGHT + 20) {
            e.y = 0; e.isDiving = false;
          }
        }
      });

      // Next Stage
      if (enemies.length === 0) {
        stage++;
        initFormation();
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      // Draw Stars
      stars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Draw HUD
      ctx.font = 'bold 16px Courier New';
      ctx.fillStyle = '#ff0055';
      ctx.fillText(`1UP: ${score.toString().padStart(5, '0')}`, 16, 24);
      ctx.fillStyle = '#00ffcc';
      ctx.fillText(`LIVES: ${lives}`, V_WIDTH - 95, 24);
      ctx.fillStyle = '#ffea00';
      ctx.fillText(`STAGE ${stage}`, V_WIDTH / 2 - 32, 24);

      // Draw Powerup Capsule (Double Ship Item)
      powerups.forEach(p => {
        ctx.fillStyle = '#ffea00';
        ctx.fillRect(p.x - 6, p.y - 6, 12, 12);
        ctx.fillStyle = '#000';
        ctx.fillText('2X', p.x - 6, p.y + 4);
      });

      // Draw Enemies
      enemies.forEach(drawAlien);

      // Draw Bullets (Cyan Neon)
      ctx.fillStyle = '#00ffff';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 1.5, b.y, 3, 10);
      });

      // Draw Player Ship (Single or Dual Side-by-Side)
      if (!isGameOver) {
        if (player.isDual) {
          drawShip(player.x - 14, player.y); // Left Ship
          drawShip(player.x + 14, player.y); // Right Ship
        } else {
          drawShip(player.x, player.y);
        }
      }

      // Draw Explosion Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      // Game Over Screen
      if (isGameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        ctx.font = 'bold 28px Courier New';
        ctx.fillStyle = '#ff0055';
        ctx.fillText('GAME OVER', V_WIDTH / 2 - 80, V_HEIGHT / 2);
        ctx.font = '14px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText('TAP FIRE TO RESTART', V_WIDTH / 2 - 85, V_HEIGHT / 2 + 35);
      }
    }

    function loop() {
      if (!isGameOver) update();
      render();
      requestAnimationFrame(loop);
    }
    loop();

    // Restart on game over tap
    btnFire.addEventListener('click', () => {
      if (isGameOver) {
        score = 0; lives = 3; stage = 1;
        player.isDual = false; isGameOver = false;
        initFormation();
      }
    });
  </script>
</body>
</html>
