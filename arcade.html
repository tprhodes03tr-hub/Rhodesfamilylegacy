<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Classics Arcade - Rhodes Legacy</title>
  <style>
    :root {
      --bg: #090a10;
      --card-bg: #131622;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }

    /* Game Selector Menu */
    .game-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid #252a3d;
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    .tab-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    /* Arcade Cabinet Screen */
    .arcade-cabinet {
      background: #000;
      border: 4px solid #22273a;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(6, 182, 212, 0.2);
      position: relative;
    }

    canvas {
      display: block;
      background: #020205;
    }

    /* Controls & HUD */
    .control-panel {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .score-banner {
      font-size: 1.2rem;
      color: var(--accent-gold);
    }

    .instructions {
      font-size: 0.85rem;
      color: #8890a6;
    }

    /* Mobile D-Pad & Action Buttons */
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
      margin-top: 0.5rem;
    }

    .touch-btn {
      background: #1c2133;
      border: 1px solid #3b4261;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: var(--accent-cyan);
      color: #000;
    }

    .btn-back {
      margin-top: 1.5rem;
      background: transparent;
      border: 1px solid #333a52;
      color: #8890a6;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>8-BIT RETRO ARCADE</h1>
    <p style="font-size: 0.85rem; color: #8890a6; margin-top: 4px;">Rhodes Legacy Mini-Arcade Suite</p>
  </header>

  <div class="game-tabs">
    <button class="tab-btn active" onclick="switchGame('invaders')">Space Invaders</button>
    <button class="tab-btn" onclick="switchGame('bricks')">Brick Breaker</button>
    <button class="tab-btn" onclick="switchGame('snake')">Snake</button>
    <button class="tab-btn" onclick="switchGame('pong')">Pong Duel</button>
  </div>

  <div class="arcade-cabinet">
    <canvas id="arcadeCanvas" width="480" height="400"></canvas>
  </div>

  <div class="control-panel">
    <div class="score-banner" id="scoreDisplay">SCORE: 0000</div>
    <div class="instructions" id="instructionsDisplay">Controls: LEFT / RIGHT Arrow keys or A/D to move, SPACE to shoot.</div>

    <!-- On-Screen Controls for Mobile Play -->
    <div class="touch-controls" id="touchControls">
      <button class="touch-btn" style="grid-column: 1; grid-row: 1;" id="btnLeft">&larr;</button>
      <button class="touch-btn" style="grid-column: 2; grid-row: 1;" id="btnUp">&uarr;</button>
      <button class="touch-btn" style="grid-column: 3; grid-row: 1;" id="btnRight">&rarr;</button>
      <button class="touch-btn" style="grid-column: 2; grid-row: 2;" id="btnDown">&darr;</button>
      <button class="touch-btn" style="grid-column: 3; grid-row: 2; background:#ef4444;" id="btnAction">A</button>
    </div>

    <a href="index.html" class="btn-back">&larr; Back to Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('arcadeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const instructionsDisplay = document.getElementById('instructionsDisplay');

    let currentGame = 'invaders';
    let score = 0;
    let keys = {};
    let gameLoopId;

    // Key listeners
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch listeners
    function bindTouch(id, code) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
      el.addEventListener('mousedown', () => { keys[code] = true; });
      el.addEventListener('mouseup', () => { keys[code] = false; });
    }
    bindTouch('btnLeft', 'ArrowLeft');
    bindTouch('btnRight', 'ArrowRight');
    bindTouch('btnUp', 'ArrowUp');
    bindTouch('btnDown', 'ArrowDown');
    bindTouch('btnAction', 'Space');

    // --- GAME 1: SPACE INVADERS ---
    let pX = 220, pLasers = [], invaders = [], invaderDir = 1;
    function initInvaders() {
      pX = 220; pLasers = []; invaders = []; invaderDir = 1; score = 0;
      instructionsDisplay.innerText = "Arrow Keys / A & D: Move | SPACE or A-Btn: Shoot";
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 8; c++) {
          invaders.push({ x: 40 + c * 48, y: 30 + r * 28, alive: true });
        }
      }
    }

    function updateInvaders() {
      if (keys['ArrowLeft'] || keys['KeyA']) pX = Math.max(0, pX - 5);
      if (keys['ArrowRight'] || keys['KeyD']) pX = Math.min(canvas.width - 30, pX + 5);
      if (keys['Space'] && pLasers.length < 3) {
        if (!pLasers.some(l => l.y > 340)) pLasers.push({ x: pX + 13, y: 365 });
      }

      pLasers.forEach((l, i) => {
        l.y -= 7;
        if (l.y < 0) pLasers.splice(i, 1);
      });

      let hitWall = false;
      invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += invaderDir * 1.2;
        if (inv.x > canvas.width - 25 || inv.x < 10) hitWall = true;

        pLasers.forEach((l, li) => {
          if (l.x > inv.x && l.x < inv.x + 22 && l.y > inv.y && l.y < inv.y + 18) {
            inv.alive = false;
            pLasers.splice(li, 1);
            score += 100;
          }
        });
      });

      if (hitWall) {
        invaderDir *= -1;
        invaders.forEach(inv => inv.y += 10);
      }
    }

    function drawInvaders() {
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(pX, 370, 30, 12);
      ctx.fillRect(pX + 12, 362, 6, 8);

      ctx.fillStyle = '#ef4444';
      pLasers.forEach(l => ctx.fillRect(l.x, l.y, 4, 10));

      ctx.fillStyle = '#10b981';
      invaders.forEach(inv => {
        if (inv.alive) ctx.fillRect(inv.x, inv.y, 22, 16);
      });
    }

    // --- GAME 2: BRICK BREAKER ---
    let bPaddleX = 200, ball = { x: 240, y: 300, dx: 3, dy: -3, r: 6 }, bricks = [];
    function initBricks() {
      bPaddleX = 200; ball = { x: 240, y: 300, dx: 3, dy: -3, r: 6 }; bricks = []; score = 0;
      instructionsDisplay.innerText = "Arrow Keys / A & D: Move Paddle";
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 8; c++) {
          bricks.push({ x: 15 + c * 56, y: 30 + r * 20, alive: true });
        }
      }
    }

    function updateBricks() {
      if (keys['ArrowLeft'] || keys['KeyA']) bPaddleX = Math.max(0, bPaddleX - 6);
      if (keys['ArrowRight'] || keys['KeyD']) bPaddleX = Math.min(canvas.width - 70, bPaddleX + 6);

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x < 6 || ball.x > canvas.width - 6) ball.dx *= -1;
      if (ball.y < 6) ball.dy *= -1;
      if (ball.y > canvas.height) initBricks();

      if (ball.y > 365 && ball.y < 375 && ball.x > bPaddleX && ball.x < bPaddleX + 70) {
        ball.dy = -Math.abs(ball.dy);
      }

      bricks.forEach(b => {
        if (b.alive && ball.x > b.x && ball.x < b.x + 50 && ball.y > b.y && ball.y < b.y + 16) {
          b.alive = false;
          ball.dy *= -1;
          score += 50;
        }
      });
    }

    function drawBricks() {
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(bPaddleX, 370, 70, 10);

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#8b5cf6';
      bricks.forEach(b => {
        if (b.alive) ctx.fillRect(b.x, b.y, 50, 14);
      });
    }

    // --- GAME 3: SNAKE ---
    let snake = [], sDir = { x: 1, y: 0 }, apple = { x: 10, y: 10 }, sTick = 0;
    function initSnake() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      sDir = { x: 1, y: 0 }; score = 0; sTick = 0;
      instructionsDisplay.innerText = "Arrow Keys / D-Pad: Turn Snake";
    }

    function updateSnake() {
      if ((keys['ArrowLeft'] || keys['KeyA']) && sDir.x === 0) sDir = { x: -1, y: 0 };
      if ((keys['ArrowRight'] || keys['KeyD']) && sDir.x === 0) sDir = { x: 1, y: 0 };
      if ((keys['ArrowUp'] || keys['KeyW']) && sDir.y === 0) sDir = { x: 0, y: -1 };
      if ((keys['ArrowDown'] || keys['KeyS']) && sDir.y === 0) sDir = { x: 0, y: 1 };

      sTick++;
      if (sTick % 6 !== 0) return;

      const head = { x: snake[0].x + sDir.x, y: snake[0].y + sDir.y };
      if (head.x < 0 || head.x >= 24 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
        initSnake();
        return;
      }

      snake.unshift(head);
      if (head.x === apple.x && head.y === apple.y) {
        score += 100;
        apple = { x: Math.floor(Math.random() * 24), y: Math.floor(Math.random() * 20) };
      } else {
        snake.pop();
      }
    }

    function drawSnake() {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(apple.x * 20, apple.y * 20, 18, 18);

      ctx.fillStyle = '#10b981';
      snake.forEach(s => ctx.fillRect(s.x * 20, s.y * 20, 18, 18));
    }

    // --- GAME 4: PONG DUEL ---
    let p1Y = 160, p2Y = 160, pongBall = { x: 240, y: 200, dx: 4, dy: 3 };
    function initPong() {
      p1Y = 160; p2Y = 160; pongBall = { x: 240, y: 200, dx: 4, dy: 3 }; score = 0;
      instructionsDisplay.innerText = "Up / Down Keys or W / S: Move Paddle";
    }

    function updatePong() {
      if (keys['ArrowUp'] || keys['KeyW']) p1Y = Math.max(0, p1Y - 6);
      if (keys['ArrowDown'] || keys['KeyS']) p1Y = Math.min(canvas.height - 70, p1Y + 6);

      // AI Paddle
      if (p2Y + 35 < pongBall.y) p2Y += 3.2;
      else if (p2Y + 35 > pongBall.y) p2Y -= 3.2;

      pongBall.x += pongBall.dx;
      pongBall.y += pongBall.dy;

      if (pongBall.y < 6 || pongBall.y > canvas.height - 6) pongBall.dy *= -1;

      if (pongBall.x < 30 && pongBall.y > p1Y && pongBall.y < p1Y + 70) {
        pongBall.dx = Math.abs(pongBall.dx) + 0.2;
        score += 10;
      }
      if (pongBall.x > canvas.width - 30 && pongBall.y > p2Y && pongBall.y < p2Y + 70) {
        pongBall.dx = -Math.abs(pongBall.dx) - 0.2;
      }

      if (pongBall.x < 0 || pongBall.x > canvas.width) {
        pongBall = { x: 240, y: 200, dx: 4, dy: 3 };
      }
    }

    function drawPong() {
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(15, p1Y, 12, 70);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(canvas.width - 27, p2Y, 12, 70);

      ctx.fillStyle = '#fff';
      ctx.fillRect(pongBall.x - 5, pongBall.y - 5, 10, 10);

      ctx.strokeStyle = '#222736';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // --- MAIN LOOP ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentGame === 'invaders') { updateInvaders(); drawInvaders(); }
      else if (currentGame === 'bricks') { updateBricks(); drawBricks(); }
      else if (currentGame === 'snake') { updateSnake(); drawSnake(); }
      else if (currentGame === 'pong') { updatePong(); drawPong(); }

      scoreDisplay.innerText = `SCORE: ${String(score).padStart(4, '0')}`;
      gameLoopId = requestAnimationFrame(loop);
    }

    function switchGame(gameKey) {
      currentGame = gameKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (gameKey === 'invaders') initInvaders();
      if (gameKey === 'bricks') initBricks();
      if (gameKey === 'snake') initSnake();
      if (gameKey === 'pong') initPong();
    }

    initInvaders();
    loop();
  </script>
</body>
</html>
