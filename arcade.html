<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lion Guard: Pride Lands Defense</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #1a0f07;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }
  #game-container {
    position: relative;
    width: 900px;
    background: #2a1810;
    border: 4px solid #d4a017;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: linear-gradient(to bottom, #f39c12 0%, #e67e22 40%, #c0392b 65%, #78350f 100%);
    cursor: crosshair;
  }
  #ui-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #190c05;
    padding: 10px 15px;
    border-top: 3px solid #d4a017;
  }
  .guard-btn {
    background: #3e2723;
    border: 2px solid #ffb300;
    color: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 140px;
    transition: 0.15s;
    position: relative;
    overflow: hidden;
  }
  .guard-btn:hover:not(:disabled) {
    background: #d84315;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(255, 179, 0, 0.4);
  }
  .guard-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: #757575;
  }
  .btn-title { font-size: 13px; color: #ffd54f; }
  .btn-sub { font-size: 10px; color: #e0e0e0; margin-top: 2px; }
  .cooldown-overlay {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 0%;
    background: rgba(0, 0, 0, 0.7);
    transition: height 0.1s linear;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 500px;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay h1 { font-size: 38px; color: #ffb300; text-shadow: 2px 2px 6px #000; margin-bottom: 10px; }
  #overlay p { font-size: 16px; color: #ffe082; margin-bottom: 20px; text-align: center; max-width: 600px; }
  .start-btn {
    background: #e65100;
    color: #fff;
    border: 3px solid #ffe082;
    padding: 12px 32px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 152, 0, 0.5);
  }
  .start-btn:hover { background: #f57c00; transform: scale(1.05); }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="900" height="500"></canvas>
  
  <div id="ui-bar">
    <button class="guard-btn" id="btn-kion" onclick="useKion()">
      <span class="btn-title">🦁 KION [SPACE]</span>
      <span class="btn-sub">Roar of the Elders</span>
      <div class="cooldown-overlay" id="cd-kion"></div>
    </button>
    <button class="guard-btn" id="btn-bunga" onclick="useBunga()">
      <span class="btn-title">🦡 BUNGA [B]</span>
      <span class="btn-sub">Zuka Zama Leap</span>
      <div class="cooldown-overlay" id="cd-bunga"></div>
    </button>
    <button class="guard-btn" id="btn-fuli" onclick="useFuli()">
      <span class="btn-title">🐆 FULI [F]</span>
      <span class="btn-sub">Huwezi Dash</span>
      <div class="cooldown-overlay" id="cd-fuli"></div>
    </button>
    <button class="guard-btn" id="btn-beshte" onclick="useBeshte()">
      <span class="btn-title">🦛 BESHTE [E]</span>
      <span class="btn-sub">Twende Kiboko Stun</span>
      <div class="cooldown-overlay" id="cd-beshte"></div>
    </button>
    <button class="guard-btn" id="btn-ono" onclick="useOno()">
      <span class="btn-title">🦅 ONO [O]</span>
      <span class="btn-sub">Keen Sight Strike</span>
      <div class="cooldown-overlay" id="cd-ono"></div>
    </button>
  </div>

  <div id="overlay">
    <h1 id="overlay-title">THE LION GUARD</h1>
    <p id="overlay-msg">Defend Pride Rock from invading hyenas and jackals! Use Kion's Roar and call upon your guard members before they reach the sacred lands.</p>
    <button class="start-btn" id="start-btn" onclick="startGame()">DEFEND PRIDE LANDS</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let prideHealth = 100;
let wave = 1;
let enemies = [];
let particles = [];
let waveSpawnTimer = 0;
let enemiesToSpawn = 10;
let enemiesSpawned = 0;

// Abilities & Cooldowns (in ms)
const cooldowns = {
  kion: { current: 0, max: 2000 },
  bunga: { current: 0, max: 4000 },
  fuli: { current: 0, max: 5000 },
  beshte: { current: 0, max: 6000 },
  ono: { current: 0, max: 4500 }
};

let activeEffects = {
  kionRoar: null,
  fuliDash: null,
  beshteQuake: null,
  onoReticles: []
};

// Simple Web Audio Synthesizer
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function playSound(type) {
  if (!audioCtx) audioCtx = new AudioCtx();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'roar') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.8);
    osc.start(now);
    osc.stop(now + 0.8);
  } else if (type === 'hit') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.linearRampToValueAtTime(60, now + 0.2);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'dash') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  }
}

// Enemy Class
class Enemy {
  constructor(type) {
    this.type = type; // 'hyena', 'jackal', 'vulture'
    this.x = canvas.width + 40;
    this.y = type === 'vulture' ? 120 + Math.random() * 100 : 340 + Math.random() * 110;
    this.speed = type === 'jackal' ? 2.6 : type === 'hyena' ? 1.8 : 2.2;
    this.maxHp = type === 'hyena' ? 3 : type === 'jackal' ? 2 : 1;
    this.hp = this.maxHp;
    this.stunned = 0;
    this.size = type === 'hyena' ? 24 : type === 'jackal' ? 18 : 16;
  }

  update() {
    if (this.stunned > 0) {
      this.stunned--;
      return;
    }
    this.x -= this.speed;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.type === 'hyena') {
      ctx.fillStyle = '#6d4c41';
      ctx.fillRect(-18, -12, 36, 24);
      ctx.fillStyle = '#3e2723';
      ctx.beginPath();
      ctx.arc(10, -10, 8, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'jackal') {
      ctx.fillStyle = '#d87d4a';
      ctx.fillRect(-14, -10, 28, 20);
    } else if (this.type === 'vulture') {
      ctx.fillStyle = '#424242';
      ctx.beginPath();
      ctx.moveTo(-15, 0);
      ctx.lineTo(0, -12);
      ctx.lineTo(15, 0);
      ctx.fill();
    }

    // Health bar
    if (this.hp < this.maxHp) {
      ctx.fillStyle = '#b71c1c';
      ctx.fillRect(-15, -20, 30, 4);
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(-15, -20, (this.hp / this.maxHp) * 30, 4);
    }

    ctx.restore();
  }
}

// Particle System
function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      radius: Math.random() * 4 + 2,
      color: color,
      life: 30
    });
  }
}

// Ability Triggers
function useKion() {
  if (cooldowns.kion.current > 0 || gameState !== 'PLAYING') return;
  cooldowns.kion.current = cooldowns.kion.max;
  playSound('roar');
  activeEffects.kionRoar = { radius: 10, maxRadius: 750, alpha: 1.0 };
  
  enemies.forEach(e => {
    e.hp -= 2;
    e.x += 180;
    spawnParticles(e.x, e.y, '#ffd54f', 10);
  });
}

function useBunga() {
  if (cooldowns.bunga.current > 0 || gameState !== 'PLAYING') return;
  cooldowns.bunga.current = cooldowns.bunga.max;
  playSound('hit');
  
  enemies.slice(0, 4).forEach(e => {
    e.hp -= 3;
    e.x += 100;
    spawnParticles(e.x, e.y, '#42a5f5', 12);
  });
}

function useFuli() {
  if (cooldowns.fuli.current > 0 || gameState !== 'PLAYING') return;
  cooldowns.fuli.current = cooldowns.fuli.max;
  playSound('dash');
  activeEffects.fuliDash = { progress: 0 };
  
  enemies.forEach(e => {
    e.hp -= 1.5;
    e.x += 120;
    spawnParticles(e.x, e.y, '#ffa000', 8);
  });
}

function useBeshte() {
  if (cooldowns.beshte.current > 0 || gameState !== 'PLAYING') return;
  cooldowns.beshte.current = cooldowns.beshte.max;
  playSound('hit');
  activeEffects.beshteQuake = { life: 25 };
  
  enemies.forEach(e => {
    e.stunned = 120;
    e.hp -= 1;
    spawnParticles(e.x, e.y, '#8d6e63', 6);
  });
}

function useOno() {
  if (cooldowns.ono.current > 0 || gameState !== 'PLAYING') return;
  cooldowns.ono.current = cooldowns.ono.max;
  
  enemies.forEach(e => {
    if (e.type === 'vulture' || Math.random() > 0.4) {
      e.hp -= 2;
      spawnParticles(e.x, e.y, '#ffffff', 8);
    }
  });
}

// Input Listener
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') useKion();
  if (e.code === 'KeyB') useBunga();
  if (e.code === 'KeyF') useFuli();
  if (e.code === 'KeyE') useBeshte();
  if (e.code === 'KeyO') useOno();
});

function startGame() {
  score = 0;
  prideHealth = 100;
  wave = 1;
  enemies = [];
  particles = [];
  enemiesToSpawn = 10;
  enemiesSpawned = 0;
  gameState = 'PLAYING';
  document.getElementById('overlay').style.display = 'none';
}

function gameOver() {
  gameState = 'GAMEOVER';
  document.getElementById('overlay-title').innerText = 'PRIDE ROCK HAS FALLEN';
  document.getElementById('overlay-msg').innerText = `You defended Pride Rock through Wave ${wave} with a final score of ${score}!`;
  document.getElementById('start-btn').innerText = 'TRY AGAIN';
  document.getElementById('overlay').style.display = 'flex';
}

// Main Game Loop
let lastTime = performance.now();

function update(dt) {
  if (gameState !== 'PLAYING') return;

  // Update Cooldowns
  for (let key in cooldowns) {
    if (cooldowns[key].current > 0) {
      cooldowns[key].current = Math.max(0, cooldowns[key].current - dt);
      const ratio = (cooldowns[key].current / cooldowns[key].max) * 100;
      document.getElementById(`cd-${key}`).style.height = `${ratio}%`;
    }
  }

  // Wave Spawner
  waveSpawnTimer += dt;
  if (waveSpawnTimer > 1200 && enemiesSpawned < enemiesToSpawn) {
    waveSpawnTimer = 0;
    const types = ['hyena', 'jackal', 'vulture'];
    const selected = types[Math.floor(Math.random() * types.length)];
    enemies.push(new Enemy(selected));
    enemiesSpawned++;
  }

  // Next Wave Check
  if (enemiesSpawned >= enemiesToSpawn && enemies.length === 0) {
    wave++;
    enemiesSpawned = 0;
    enemiesToSpawn = 8 + wave * 4;
  }

  // Update Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.update();

    if (e.x < 130) {
      prideHealth -= 10;
      spawnParticles(e.x, e.y, '#e53935', 12);
      enemies.splice(i, 1);
      if (prideHealth <= 0) {
        prideHealth = 0;
        gameOver();
      }
      continue;
    }

    if (e.hp <= 0) {
      score += 50;
      spawnParticles(e.x, e.y, '#ffd54f', 10);
      enemies.splice(i, 1);
    }
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Sun & Sky
  ctx.fillStyle = '#f39c12';
  ctx.beginPath();
  ctx.arc(750, 100, 50, 0, Math.PI * 2);
  ctx.fill();

  // Pride Rock Silhouettes
  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.moveTo(0, 500);
  ctx.lineTo(0, 260);
  ctx.lineTo(130, 310);
  ctx.lineTo(160, 500);
  ctx.fill();

  // Ground
  ctx.fillStyle = '#6d4c41';
  ctx.fillRect(0, 440, canvas.width, 60);

  // Draw Enemies
  enemies.forEach(e => e.draw());

  // Ability Renderers: Kion Roar Shockwave
  if (activeEffects.kionRoar) {
    const r = activeEffects.kionRoar;
    ctx.save();
    ctx.strokeStyle = `rgba(255, 215, 0, ${r.alpha})`;
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(120, 330, r.radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
    ctx.restore();

    r.radius += 24;
    r.alpha -= 0.035;
    if (r.alpha <= 0) activeEffects.kionRoar = null;
  }

  // Ability Renderers: Fuli Dash Streak
  if (activeEffects.fuliDash) {
    const f = activeEffects.fuliDash;
    ctx.fillStyle = 'rgba(255, 179, 0, 0.4)';
    ctx.fillRect(100, 370, f.progress, 15);
    f.progress += 45;
    if (f.progress > canvas.width) activeEffects.fuliDash = null;
  }

  // Draw Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // HUD Text
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`Wave: ${wave}`, 20, 30);
  ctx.fillText(`Score: ${score}`, 20, 55);

  // Health Bar HUD
  ctx.fillText(`Pride Rock Health:`, 680, 30);
  ctx.fillStyle = '#b71c1c';
  ctx.fillRect(680, 40, 200, 16);
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(680, 40, (prideHealth / 100) * 200, 16);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(680, 40, 200, 16);
}

function loop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
