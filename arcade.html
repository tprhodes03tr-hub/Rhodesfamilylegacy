<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Legacy Retro Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    nav#hub {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #0f172a;
      width: 100%;
      justify-content: center;
      border-bottom: 2px solid #00e5ff;
      flex-wrap: wrap;
    }
    .hub-btn {
      background: #1e293b;
      color: #00e5ff;
      border: 1px solid #00e5ff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .hub-btn.active {
      background: #00e5ff;
      color: #090d16;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      width: 95%;
      max-width: 360px;
      margin: 8px 0;
      font-weight: 800;
      color: #38bdf8;
      font-size: 0.9rem;
    }
    canvas {
      background: #000;
      border: 2px solid #1e293b;
      border-radius: 8px;
      width: 360px;
      height: 380px;
    }
    /* Mobile Touch D-Pad & Controls */
    #mobileControls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 360px;
      margin-top: 10px;
      padding: 0 10px;
    }
    .dpad {
      display: grid;
      grid-template-columns: 45px 45px 45px;
      grid-template-rows: 45px 45px 45px;
      gap: 4px;
    }
    .ctrl-btn {
      background: #1e293b;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ctrl-btn:active { background: #38bdf8; color: #090d16; }
    .action-btn {
      width: 70px;
      height: 70px;
      border-radius: 35px;
      background: #ef4444;
      border: 3px solid #fca5a5;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
    }
    .action-btn:active { background: #b91c1c; }
  </style>
</head>
<body>

  <nav id="hub">
    <button class="hub-btn active" onclick="switchGame('pacman')">Ms. Pac-Man</button>
    <button class="hub-btn" onclick="switchGame('cubic')">Cubic</button>
    <button class="hub-btn" onclick="switchGame('frogger')">Frogger</button>
    <button class="hub-btn" onclick="switchGame('kong')">Donkey Kong</button>
  </nav>

  <div id="hud">
    <span id="titleDisplay">MS. PAC-MAN</span>
    <span id="scoreDisplay">SCORE: 0</span>
    <span id="livesDisplay">LIVES: 3</span>
  </div>

  <canvas id="gameCanvas" width="360" height="380"></canvas>

  <div id="mobileControls">
    <div class="dpad">
      <div></div>
      <button class="ctrl-btn" ontouchstart="pressKey('ArrowUp')" onclick="pressKey('ArrowUp')">▲</button>
      <div></div>
      <button class="ctrl-btn" ontouchstart="pressKey('ArrowLeft')" onclick="pressKey('ArrowLeft')">◀</button>
      <div></div>
      <button class="ctrl-btn" ontouchstart="pressKey('ArrowRight')" onclick="pressKey('ArrowRight')">▶</button>
      <div></div>
      <button class="ctrl-btn" ontouchstart="pressKey('ArrowDown')" onclick="pressKey('ArrowDown')">▼</button>
      <div></div>
    </div>
    <button class="action-btn" ontouchstart="pressKey(' ')" onclick="pressKey(' ')">JUMP</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let currentGame = 'pacman';
    let score = 0;
    let lives = 3;

    function pressKey(k) {
      if (currentGame === 'pacman') handlePacInput(k);
      else if (currentGame === 'cubic') handleCubicInput(k);
      else if (currentGame === 'frogger') handleFrogInput(k);
      else if (currentGame === 'kong') handleKongInput(k);
    }

    function switchGame(key) {
      currentGame = key;
      score = 0;
      lives = 3;
      document.querySelectorAll('.hub-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (key === 'pacman') initPac();
      if (key === 'cubic') initCubic();
      if (key === 'frogger') initFrog();
      if (key === 'kong') initKong();
    }

    // --- 1. MS. PAC-MAN WITH WALLS & WRAP ---
    let pac = { x: 180, y: 280, dirX: 0, dirY: 0, mouth: 0.2, mouthSpd: 0.03 };
    const pacWalls = [
      { x: 30, y: 30, w: 300, h: 10 },
      { x: 30, y: 340, w: 300, h: 10 },
      { x: 30, y: 30, w: 10, h: 120 },
      { x: 30, y: 220, w: 10, h: 120 },
      { x: 320, y: 30, w: 10, h: 120 },
      { x: 320, y: 220, w: 10, h: 120 },
      { x: 80, y: 80, w: 70, h: 40 },
      { x: 210, y: 80, w: 70, h: 40 },
      { x: 140, y: 160, w: 80, h: 50 },
      { x: 80, y: 250, w: 70, h: 40 },
      { x: 210, y: 250, w: 70, h: 40 }
    ];
    let pellets = [];

    function initPac() {
      document.getElementById('titleDisplay').innerText = "MS. PAC-MAN";
      pac = { x: 180, y: 280, dirX: 0, dirY: 0, mouth: 0.2, mouthSpd: 0.03 };
      pellets = [];
      for (let x = 55; x <= 305; x += 25) {
        for (let y = 55; y <= 325; y += 25) {
          let blocked = pacWalls.some(w => x >= w.x - 5 && x <= w.x + w.w + 5 && y >= w.y - 5 && y <= w.y + w.h + 5);
          if (!blocked) pellets.push({ x, y, active: true });
        }
      }
    }

    function handlePacInput(k) {
      if (k === 'ArrowLeft') { pac.dirX = -2.5; pac.dirY = 0; }
      if (k === 'ArrowRight') { pac.dirX = 2.5; pac.dirY = 0; }
      if (k === 'ArrowUp') { pac.dirX = 0; pac.dirY = -2.5; }
      if (k === 'ArrowDown') { pac.dirX = 0; pac.dirY = 2.5; }
    }

    function updatePac() {
      let nextX = pac.x + pac.dirX;
      let nextY = pac.y + pac.dirY;

      // Wrap tunnel detection
      if (nextX < 0) nextX = 360;
      if (nextX > 360) nextX = 0;

      // Wall collisions
      let hit = pacWalls.some(w => nextX + 9 > w.x && nextX - 9 < w.x + w.w && nextY + 9 > w.y && nextY - 9 < w.y + w.h);
      if (!hit) {
        pac.x = nextX;
        pac.y = nextY;
      }

      // Eat pellets
      pellets.forEach(p => {
        if (p.active && Math.hypot(p.x - pac.x, p.y - pac.y) < 10) {
          p.active = false;
          score += 10;
        }
      });

      pac.mouth += pac.mouthSpd;
      if (pac.mouth > 0.45 || pac.mouth < 0.05) pac.mouthSpd = -pac.mouthSpd;
    }

    function drawPac() {
      // Maze Walls
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      pacWalls.forEach(w => ctx.strokeRect(w.x, w.y, w.w, w.h));

      // Pellets
      ctx.fillStyle = '#fbcfe8';
      pellets.forEach(p => {
        if (p.active) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Ms. Pac-Man
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      let angle = 0;
      if (pac.dirX < 0) angle = Math.PI;
      else if (pac.dirY < 0) angle = -Math.PI / 2;
      else if (pac.dirY > 0) angle = Math.PI / 2;

      ctx.arc(pac.x, pac.y, 11, angle + pac.mouth * Math.PI, angle + (2 - pac.mouth) * Math.PI);
      ctx.lineTo(pac.x, pac.y);
      ctx.fill();

      // Red Bow
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(pac.x, pac.y - 10, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 2. CUBIC (Q*BERT) ---
    let qbert = { r: 0, c: 0 };
    let cPyramid = [];

    function initCubic() {
      document.getElementById('titleDisplay').innerText = "CUBIC";
      cPyramid = [];
      for (let r = 0; r < 7; r++) {
        let row = [];
        for (let c = 0; c <= r; c++) row.push({ visited: false });
        cPyramid.push(row);
      }
      qbert = { r: 0, c: 0 };
    }

    function handleCubicInput(k) {
      if (k === 'ArrowUp' && qbert.r > 0 && qbert.c > 0) { qbert.r--; qbert.c--; }
      else if (k === 'ArrowRight' && qbert.r > 0 && qbert.c < qbert.r) { qbert.r--; }
      else if (k === 'ArrowLeft' && qbert.r < 6) { qbert.r++; }
      else if (k === 'ArrowDown' && qbert.r < 6) { qbert.r++; qbert.c++; }

      if (!cPyramid[qbert.r][qbert.c].visited) {
        cPyramid[qbert.r][qbert.c].visited = true;
        score += 25;
      }
    }

    function drawCubic() {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c <= r; c++) {
          let x = 180 + (c - r / 2) * 36;
          let y = 60 + r * 38;
          ctx.fillStyle = cPyramid[r][c].visited ? '#f59e0b' : '#2563eb';
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + 18, y + 10);
          ctx.lineTo(x, y + 20);
          ctx.lineTo(x - 18, y + 10);
          ctx.closePath();
          ctx.fill();
        }
      }
      let qx = 180 + (qbert.c - qbert.r / 2) * 36;
      let qy = 60 + qbert.r * 38;
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.arc(qx, qy + 6, 9, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 3. FROGGER ---
    let frog = { x: 170, y: 340 };
    let fPads = [30, 100, 170, 240, 310].map(x => ({ x, filled: false }));
    let fCars = [
      { x: 0, y: 280, w: 35, s: 2, c: '#ef4444' },
      { x: 180, y: 240, w: 45, s: -2.5, c: '#eab308' },
      { x: 50, y: 150, w: 60, s: 1.8, c: '#854d0e' },
      { x: 200, y: 110, w: 70, s: -2, c: '#854d0e' }
    ];

    function initFrog() {
      document.getElementById('titleDisplay').innerText = "FROGGER";
      frog = { x: 170, y: 340 };
      fPads.forEach(p => p.filled = false);
    }

    function handleFrogInput(k) {
      if (k === 'ArrowUp') frog.y -= 38;
      if (k === 'ArrowDown' && frog.y < 340) frog.y += 38;
      if (k === 'ArrowLeft' && frog.x > 20) frog.x -= 30;
      if (k === 'ArrowRight' && frog.x < 320) frog.x += 30;

      if (frog.y < 80) {
        fPads.forEach(p => {
          if (Math.abs(frog.x - p.x) < 20 && !p.filled) {
            p.filled = true;
            score += 100;
          }
        });
        frog = { x: 170, y: 340 };
      }
    }

    function updateFrog() {
      fCars.forEach(c => {
        c.x += c.s;
        if (c.s > 0 && c.x > 360) c.x = -c.w;
        if (c.s < 0 && c.x < -c.w) c.x = 360;

        if (frog.y >= 230 && frog.y <= 300) {
          if (frog.x + 12 > c.x && frog.x < c.x + c.w && Math.abs(frog.y - c.y) < 18) {
            lives--;
            frog = { x: 170, y: 340 };
          }
        }
      });
    }

    function drawFrog() {
      ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 90, 360, 100);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 220, 360, 100);

      fPads.forEach(p => {
        ctx.fillStyle = p.filled ? '#22c55e' : '#047857';
        ctx.beginPath();
        ctx.arc(p.x, 65, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      fCars.forEach(c => {
        ctx.fillStyle = c.c;
        ctx.fillRect(c.x, c.y - 10, c.w, 20);
      });

      ctx.fillStyle = '#4ade80';
      ctx.fillRect(frog.x - 8, frog.y - 8, 16, 16);
    }

    // --- 4. DONKEY KONG ---
    let dk = { x: 40, y: 330, vy: 0, grounded: true };
    let barrels = [];
    let bTimer = 0;

    function initKong() {
      document.getElementById('titleDisplay').innerText = "DONKEY KONG";
      dk = { x: 40, y: 330, vy: 0, grounded: true };
      barrels = [];
    }

    function handleKongInput(k) {
      if (k === 'ArrowLeft') dk.x -= 12;
      if (k === 'ArrowRight') dk.x += 12;
      if (k === ' ' && dk.grounded) { dk.vy = -7; dk.grounded = false; }
      if (k === 'ArrowUp' && (dk.x > 290 && dk.x < 330) && dk.y > 240) dk.y -= 15;
      if (k === 'ArrowUp' && (dk.x > 30 && dk.x < 70) && dk.y > 150 && dk.y <= 250) dk.y -= 15;
    }

    function updateKong() {
      dk.vy += 0.35;
      dk.y += dk.vy;

      [330, 240, 150].forEach(tier => {
        if (dk.y >= tier && dk.y <= tier + 8 && dk.vy >= 0) {
          dk.y = tier;
          dk.vy = 0;
          dk.grounded = true;
        }
      });

      bTimer++;
      if (bTimer > 100) {
        bTimer = 0;
        barrels.push({ x: 90, y: 140, vx: 2, tier: 150 });
      }

      barrels.forEach(b => {
        b.x += b.vx;
        if (b.x > 320 && b.tier === 150) { b.tier = 240; b.y = 230; b.vx = -2; }
        if (b.x < 40 && b.tier === 240) { b.tier = 330; b.y = 320; b.vx = 2; }

        if (Math.hypot(b.x - dk.x, b.y - dk.y) < 14) {
          lives--;
          dk = { x: 40, y: 330, vy: 0, grounded: true };
        }
      });
    }

    function drawKong() {
      // Girders & Ladders
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(20, 340, 320, 8);
      ctx.fillRect(20, 250, 320, 8);
      ctx.fillRect(20, 160, 320, 8);

      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(305, 250, 16, 90);
      ctx.fillRect(45, 160, 16, 90);

      // Donkey Kong & Pauline
      ctx.fillStyle = '#78350f'; ctx.fillRect(40, 110, 35, 45);
      ctx.fillStyle = '#ec4899'; ctx.fillRect(250, 125, 16, 30);

      // Barrels
      ctx.fillStyle = '#f59e0b';
      barrels.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
        ctx.fill();
      });

      // Player
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(dk.x - 7, dk.y - 12, 14, 18);
    }

    // --- MAIN ENGINE LOOP ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
      document.getElementById('livesDisplay').innerText = `LIVES: ${lives}`;

      if (currentGame === 'pacman') { updatePac(); drawPac(); }
      if (currentGame === 'cubic') { drawCubic(); }
      if (currentGame === 'frogger') { updateFrog(); drawFrog(); }
      if (currentGame === 'kong') { updateKong(); drawKong(); }

      requestAnimationFrame(loop);
    }

    initPac();
    loop();
  </script>
</body>
</html>
