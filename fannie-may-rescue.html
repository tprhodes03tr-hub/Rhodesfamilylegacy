<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Adventures of Little Fannie May: The River Bank Rescue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #060913;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 750px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.4), inset 0 0 25px rgba(56, 189, 248, 0.15);
      text-align: center;
    }
    .game-header {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    h1 {
      color: #fef08a;
      font-size: 1.4rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: bold;
      box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);
    }
    .story-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px dashed #38bdf8;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
      min-height: 80px;
      text-align: left;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }
    .canvas-box {
      width: 100%;
      height: 270px;
      background: #020617;
      border: 3px solid #f59e0b;
      border-radius: 10px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.35), inset 0 0 30px rgba(0,0,0,0.8);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .control-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
      transition: all 0.2s ease;
    }
    .control-btn:active {
      background-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 20px #38bdf8;
    }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header" id="chapter-title">Chapter 1: The Levee Marsh</div>
    <h1>The River Bank Rescue</h1>

    <div class="stats-bar">
      <span>🌿 Sweetgrass: <strong id="stat-grass" style="color: #34d399;">0</strong> / 3</span>
      <span>🪵 Wood Logs: <strong id="stat-wood" style="color: #f59e0b;">0</strong> / 3</span>
      <span>🔤 Alphabet Bridge: <strong id="stat-alpha" style="color: #fef08a;">None</strong></span>
    </div>

    <div class="story-box" id="story-dialogue">
      "The Yazoo River is rising! Walk Little Fannie May to count and collect 3 Sweetgrass Bundles along the levee bank."
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="600" height="270" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="controls-grid">
      <button class="control-btn" onmousedown="startMove(-1)" onmouseup="stopMove()" ontouchstart="startMove(-1)" ontouchend="stopMove()">◀ WALK LEFT</button>
      <button class="control-btn" style="background: linear-gradient(135deg, #059669 0%, #047857 100%); border-color: #34d399; color: #fff; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.3);" onclick="performAction()">✨ INTERACT / SORT</button>
      <button class="control-btn" onmousedown="startMove(1)" onmouseup="stopMove()" ontouchstart="startMove(1)" ontouchend="stopMove()">WALK RIGHT ▶</button>
    </div>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let voiceEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientWind();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startAmbientWind() {
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.value = 240; filter.Q.value = 3.0;
        let gain = audioCtx.createGain(); gain.gain.value = 0.03;
        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'collect') {
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(140, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch(e) {}
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    let gameState = { chapter: 1, grass: 0, wood: 0, alphaIndex: 0, fannieX: 120, fannieDir: 0, brotherX: 480 };
    const alphabetSequence = ['A', 'B', 'C', 'D'];

    let items = [
      { x: 190, y: 140, type: 'grass', label: '', collected: false },
      { x: 340, y: 140, type: 'grass', collected: false },
      { x: 420, y: 140, type: 'grass', collected: false },
      { x: 170, y: 140, type: 'wood', label: '', collected: false },
      { x: 310, y: 140, type: 'wood', label: '', collected: false },
      { x: 450, y: 140, type: 'wood', label: '', collected: false },
      // Alphabetical Bridge Timers (A, B, C, D)
      { x: 150, y: 140, type: 'alpha', label: 'A', collected: false },
      { x: 250, y: 140, type: 'alpha', label: 'B', collected: false },
      { x: 350, y: 140, type: 'alpha', label: 'C', collected: false },
      { x: 450, y: 140, type: 'alpha', label: 'D', collected: false }
    ];

    function startMove(dir) { initAudio(); gameState.fannieDir = dir; }
    function stopMove() { gameState.fannieDir = 0; }

    function performAction() {
      initAudio();
      checkCollection();
    }

    function checkCollection() {
      items.forEach(item => {
        if (!item.collected && Math.abs(gameState.fannieX - item.x) < 45) {
          if (gameState.chapter === 1 && item.type === 'grass') {
            item.collected = true; gameState.grass++;
            playSound('collect'); speak("Sweetgrass bundle " + gameState.grass);
            if (gameState.grass >= 3) {
              gameState.chapter = 2; playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 2: Timber & Brothers";
              document.getElementById('story-dialogue').innerText = "Brother says: 'I got A and B, Fannie! You grab C and D!' Count and collect 3 Wood Logs.";
              speak("Chapter 2 unlocked. Gather wood logs with your brother.");
            }
          } else if (gameState.chapter === 2 && item.type === 'wood') {
            item.collected = true; gameState.wood++;
            playSound('collect'); speak("Wood log " + gameState.wood);
            if (gameState.wood >= 3) {
              gameState.chapter = 3; playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 3: Alphabetical Bridge Building";
              document.getElementById('story-dialogue').innerText = "Chapter 3 Unlocked! Follow alphabetical order! Tap A first, then B, C, and D to build the bridge correctly!";
              speak("Chapter 3 unlocked. Place the bridge parts in alphabetical order: A, B, C, D.");
            }
          } else if (gameState.chapter === 3 && item.type === 'alpha') {
            let requiredLetter = alphabetSequence[gameState.alphaIndex];
            if (item.label === requiredLetter) {
              item.collected = true; gameState.alphaIndex++;
              playSound('collect');
              speak("Letter " + item.label + " placed correctly!");
              if (gameState.alphaIndex >= alphabetSequence.length) {
                gameState.chapter = 4; playSound('success');
                document.getElementById('chapter-title').innerText = "Victory: River Bank Secured!";
                document.getElementById('story-dialogue').innerText = "🌟 AMAZING TEAMWORK! The alphabetical bridge is built, the friendly deer and rabbit greet us, and the sun shines bright! 'What is packed in the bone never fades from the marrow!'";
                speak("Victory! The alphabetical bridge is built and the animals are happy.");
              }
            } else {
              playSound('fail');
              speak("Not in order! Remember: we must go in alphabetical order. Try starting with letter " + requiredLetter);
            }
          }
        }
      });
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('stat-grass').innerText = gameState.grass;
      document.getElementById('stat-wood').innerText = gameState.wood;
      document.getElementById('stat-alpha').innerText = gameState.alphaIndex > 0 ? alphabetSequence.slice(0, gameState.alphaIndex).join(', ') : 'None';
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let waveOffset = 0;

    const goldenTreeImg = new Image();
    goldenTreeImg.src = 'packed-marrow-tree.png';

    let stars = [];
    for(let i=0; i<18; i++) {
      stars.push({ x: Math.random() * 600, y: Math.random() * 130, size: 1.5 + Math.random() * 2.5, alpha: 0.4 + Math.random() * 0.6 });
    }

    function drawStorybookCharacter(x, y, isFannieMay, dir) {
      ctx.save();
      ctx.translate(x, y);
      let bounce = dir !== 0 ? Math.sin(Date.now() * 0.015) * 3.5 : 0;
      ctx.translate(0, bounce);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath(); ctx.ellipse(0, 44, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

      if (isFannieMay) {
        let dressGrad = ctx.createLinearGradient(-12, 0, 12, 42);
        dressGrad.addColorStop(0, '#f472b6'); dressGrad.addColorStop(1, '#db2777');
        ctx.fillStyle = dressGrad;
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(16, 42); ctx.lineTo(-16, 42); ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#ffffff'; ctx.fillRect(-6, 0, 12, 6);

        let headGrad = ctx.createRadialGradient(-3, -15, 2, 0, -12, 11);
        headGrad.addColorStop(0, '#d97706'); headGrad.addColorStop(1, '#92400e');
        ctx.fillStyle = headGrad;
        ctx.beginPath(); ctx.arc(0, -12, 11, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, -15, 3, 3); ctx.fillRect(2, -15, 3, 3);
        ctx.fillStyle = '#78350f'; ctx.fillRect(-3, -9, 6, 2);

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, -18, 12, Math.PI, 0, false);
        ctx.arc(-10, -14, 6, 0, Math.PI * 2);
        ctx.arc(10, -14, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, -14, 10, Math.PI * 0.9, Math.PI * 0.1, true); ctx.stroke();

        ctx.fillStyle = '#b45309'; ctx.fillRect(-19, 10, 4, 14); ctx.fillRect(15, 10, 4, 14);
        ctx.fillStyle = '#d97706'; ctx.fillRect(-23, 22, 11, 9);
      } else {
        let shirtGrad = ctx.createLinearGradient(-11, 0, 11, 28);
        shirtGrad.addColorStop(0, '#f59e0b'); shirtGrad.addColorStop(1, '#b45309');
        ctx.fillStyle = shirtGrad; ctx.fillRect(-11, 0, 22, 28);

        ctx.fillStyle = '#78350f'; ctx.fillRect(-11, 28, 9, 14); ctx.fillRect(2, 28, 9, 14);

        let headGrad = ctx.createRadialGradient(-3, -15, 2, 0, -12, 11);
        headGrad.addColorStop(0, '#b45309'); headGrad.addColorStop(1, '#78350f');
        ctx.fillStyle = headGrad;
        ctx.beginPath(); ctx.arc(0, -12, 11, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, -15, 3, 3); ctx.fillRect(2, -15, 3, 3);
        ctx.fillStyle = '#451a03'; ctx.fillRect(-3, -9, 6, 2);

        ctx.fillStyle = '#451a03';
        ctx.beginPath(); ctx.arc(0, -16, 9.5, Math.PI, 0, false); ctx.fill();
        ctx.fillRect(-13, -16, 26, 3.5);

        ctx.fillStyle = '#92400e'; ctx.fillRect(12, 12, 16, 4);
      }
      ctx.restore();
    }

    function gameLoop() {
      waveOffset += 0.04;

      if (gameState.fannieDir !== 0) {
        gameState.fannieX += gameState.fannieDir * 3.5;
        if (gameState.fannieX < 40) gameState.fannieX = 40;
        if (gameState.fannieX > 560) gameState.fannieX = 560;
        checkCollection();
      }

      // Sky changes to bright sunny day in Victory mode (Chapter 4)
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 160);
      if (gameState.chapter >= 4) {
        skyGrad.addColorStop(0, '#38bdf8');
        skyGrad.addColorStop(1, '#bae6fd');
      } else {
        skyGrad.addColorStop(0, '#020617');
        skyGrad.addColorStop(0.5, '#0f172a');
        skyGrad.addColorStop(1, '#312e81');
      }
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameState.chapter < 4) {
        ctx.fillStyle = '#fef08a';
        stars.forEach(s => {
          ctx.globalAlpha = s.alpha;
          ctx.shadowColor = '#fef08a'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
      } else {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath(); ctx.arc(120, 45, 20, 0, Math.PI*2); ctx.arc(140, 40, 25, 0, Math.PI*2); ctx.arc(160, 45, 18, 0, Math.PI*2); ctx.fill();
      }

      // Golden Tree Landmark
      ctx.save();
      ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 35;
      if (goldenTreeImg.complete) {
        ctx.drawImage(goldenTreeImg, 245, 18, 135, 145);
      }
      ctx.restore();

      // Friendly Woodland Animals waiting on the side (Deer & Rabbit)
      ctx.fillStyle = '#b45309'; // Deer body
      ctx.fillRect(80, 125, 18, 16); ctx.beginPath(); ctx.arc(76, 120, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#d97706'; // Rabbit
      ctx.beginPath(); ctx.arc(520, 138, 7, 0, Math.PI*2); ctx.arc(524, 128, 4, 0, Math.PI*2); ctx.fill();

      // Bank ground turns vibrant green in victory mode
      let bankGrad = ctx.createLinearGradient(0, 150, 0, 270);
      if (gameState.chapter >= 4) {
        bankGrad.addColorStop(0, '#22c55e');
        bankGrad.addColorStop(0.15, '#16a34a');
        bankGrad.addColorStop(1, '#15803d');
      } else {
        bankGrad.addColorStop(0, '#475569');
        bankGrad.addColorStop(0.15, '#334155');
        bankGrad.addColorStop(1, '#1e293b');
      }
      ctx.fillStyle = bankGrad;
      ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(canvas.width, 150); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

      ctx.fillStyle = '#10b981';
      for (let i = 0; i < canvas.width; i += 16) {
        ctx.fillRect(i, 146, 5, 8);
        ctx.fillStyle = '#059669'; ctx.fillRect(i + 2, 144, 2, 4); ctx.fillStyle = '#10b981';
      }

      items.forEach(item => {
        if (!item.collected) {
          ctx.save();
          if (item.type === 'grass' && gameState.chapter === 1) {
            ctx.shadowColor = '#34d399'; ctx.shadowBlur = 12;
            ctx.fillStyle = '#34d399'; ctx.fillRect(item.x - 7, item.y, 14, 16);
          } else if (item.type === 'wood' && gameState.chapter === 2) {
            ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12;
            ctx.fillStyle = '#d97706'; ctx.fillRect(item.x - 10, item.y + 4, 20, 10);
          } else if (item.type === 'alpha' && gameState.chapter === 3) {
            ctx.shadowColor = '#fef08a'; ctx.shadowBlur = 15;
            ctx.fillStyle = '#b45309'; ctx.fillRect(item.x - 14, item.y, 28, 16);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Courier New'; ctx.fillText(item.label, item.x - 4, item.y + 12);
          }
          ctx.restore();
        }
      });

      // Render completed alphabetical bridge pieces (A, B, C, D)
      if (gameState.alphaIndex > 0) {
        ctx.fillStyle = '#78350f';
        for(let b=0; b<gameState.alphaIndex; b++) {
          let bx = 150 + b * 80;
          ctx.fillRect(bx, 142, 65, 12);
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px Courier New'; ctx.fillText(alphabetSequence[b], bx + 26, 151);
          ctx.fillStyle = '#78350f';
        }
      }

      let waterGrad = ctx.createLinearGradient(0, 195, 0, 270);
      waterGrad.addColorStop(0, 'rgba(2, 132, 199, 0.6)');
      waterGrad.addColorStop(1, 'rgba(3, 105, 161, 0.9)');
      ctx.fillStyle = waterGrad;
      ctx.beginPath();
      ctx.moveTo(0, 195);
      for (let i = 0; i <= canvas.width; i += 15) {
        ctx.lineTo(i, 195 + Math.sin(i * 0.04 + waveOffset) * 10);
      }
      ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
      ctx.fill();

      drawStorybookCharacter(gameState.fannieX, 118, true, gameState.fannieDir);
      drawStorybookCharacter(gameState.brotherX, 112, false, 0);

      requestAnimationFrame(gameLoop);
    }

    goldenTreeImg.onload = () => { gameLoop(); };
    gameLoop();
  </script>
</body>
</html>
