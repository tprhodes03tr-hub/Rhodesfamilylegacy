<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Adventures of Little Fannie May: The River Bank Rescue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #060913;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 750px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.4), inset 0 0 25px rgba(56, 189, 248, 0.15);
      text-align: center;
    }
    .game-header {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    h1 {
      color: #fef08a;
      font-size: 1.4rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: bold;
      box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);
    }
    .story-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px dashed #38bdf8;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
      min-height: 80px;
      text-align: left;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }
    .canvas-box {
      width: 100%;
      height: 270px;
      background: #020617;
      border: 3px solid #f59e0b;
      border-radius: 10px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.35), inset 0 0 30px rgba(0,0,0,0.8);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .control-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
      transition: all 0.2s ease;
    }
    .control-btn:active {
      background-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 20px #38bdf8;
    }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header" id="chapter-title">Chapter 1: The Levee Marsh</div>
    <h1>Fannie May's River Bank Rescue</h1>

    <div class="stats-bar">
      <span>🌿 Sweetgrass: <strong id="stat-grass" style="color: #34d399;">0</strong> / 3</span>
      <span>🪵 Wood Logs: <strong id="stat-wood" style="color: #f59e0b;">0</strong> / 3</span>
      <span>👥 Brothers Joined: <strong id="stat-brothers" style="color: #fef08a;">0</strong> / 7</span>
    </div>

    <div class="story-box" id="story-dialogue">
      "The Yazoo River is rising! Little Fannie May starts out alone and finds her first brother along the levee bank. Collect 3 Sweetgrass Bundles!"
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="600" height="270" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="controls-grid">
      <button class="control-btn" onmousedown="startMove(-1)" onmouseup="stopMove()" ontouchstart="startMove(-1)" ontouchend="stopMove()">◀ WALK LEFT</button>
      <button class="control-btn" style="background: linear-gradient(135deg, #059669 0%, #047857 100%); border-color: #34d399; color: #fff; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.3);" onclick="performAction()">✨ RESCUE / BUILD</button>
      <button class="control-btn" onmousedown="startMove(1)" onmouseup="stopMove()" ontouchstart="startMove(1)" ontouchend="stopMove()">WALK RIGHT ▶</button>
    </div>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let voiceEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientWind();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startAmbientWind() {
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.value = 240; filter.Q.value = 3.0;
        let gain = audioCtx.createGain(); gain.gain.value = 0.03;
        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'collect') {
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch(e) {}
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    let gameState = { chapter: 1, grass: 0, wood: 0, brothersJoined: 1, fannieX: 120, fannieDir: 0 };

    let items = [
      { x: 190, y: 140, type: 'grass', collected: false },
      { x: 340, y: 140, type: 'grass', collected: false },
      { x: 420, y: 140, type: 'grass', collected: false },
      { x: 170, y: 140, type: 'wood', collected: false },
      { x: 310, y: 140, type: 'wood', collected: false },
      { x: 450, y: 140, type: 'wood', collected: false },
      { x: 250, y: 140, type: 'brother', collected: false },
      { x: 380, y: 140, type: 'brother', collected: false },
      { x: 480, y: 140, type: 'brother', collected: false }
    ];

    function startMove(dir) { initAudio(); gameState.fannieDir = dir; }
    function stopMove() { gameState.fannieDir = 0; }

    function performAction() {
      initAudio();
      checkCollection();
    }

    function checkCollection() {
      items.forEach(item => {
        if (!item.collected && Math.abs(gameState.fannieX - item.x) < 45) {
          if (gameState.chapter === 1 && item.type === 'grass') {
            item.collected = true; gameState.grass++;
            playSound('collect'); speak("Sweetgrass bundle " + gameState.grass);
            if (gameState.grass >= 3) {
              gameState.chapter = 2; gameState.brothersJoined = 4; playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 2: Timber & More Brothers";
              document.getElementById('story-dialogue').innerText = "Chapter 2 Unlocked! Three more brothers join the team! Collect 3 Wood Logs to reinforce the river bank.";
              speak("Chapter 2 unlocked. More brothers have joined the crew!");
            }
          } else if (gameState.chapter === 2 && item.type === 'wood') {
            item.collected = true; gameState.wood++;
            playSound('collect'); speak("Wood log " + gameState.wood);
            if (gameState.wood >= 3) {
              gameState.chapter = 3; gameState.brothersJoined = 7; playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 3: All 7 Brothers Assembled!";
              document.getElementById('story-dialogue').innerText = "Chapter 3 Unlocked! All 7 brothers are now teamed up with Fannie May! Tap 'RESCUE / BUILD' to complete the grand bridge and secure the river bank!";
              speak("Chapter 3 unlocked. All seven brothers are now assembled!");
            }
          } else if (gameState.chapter === 3 && item.type === 'brother') {
            item.collected = true;
            playSound('success');
            speak("All family members united for the rescue!");
            gameState.chapter = 4;
            document.getElementById('chapter-title').innerText = "Victory: River Bank Secured by All 8 Siblings!";
            document.getElementById('story-dialogue').innerText = "🌟 ULTIMATE FAMILY TEAMWORK! Fannie May and all 7 brothers built the bridge, helped the community, and secured the river bank! 'What is packed in the bone never fades from the marrow!'";
            speak("Victory! Fannie May and all seven brothers completed the mission.");
          }
        }
      });
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('stat-grass').innerText = gameState.grass;
      document.getElementById('stat-wood').innerText = gameState.wood;
      document.getElementById('stat-brothers').innerText = gameState.brothersJoined;
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let waveOffset = 0;

    const goldenTreeImg = new Image();
    goldenTreeImg.src = 'packed-marrow-tree.png';

    function drawFannieAndBrothersCrew(x, y, dir, count) {
      ctx.save();
      ctx.translate(x, y);
      let bounce = dir !== 0 ? Math.sin(Date.now() * 0.015) * 3.5 : 0;
      ctx.translate(0, bounce);

      // Draw active brothers trailing alongside Fannie May based on count
      for (let i = 1; i < count; i++) {
        let offsetX = (i % 2 === 0 ? 1 : -1) * (i * 14);
        ctx.fillStyle = '#b45309'; ctx.fillRect(offsetX - 4, 10, 8, 28);
        ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.arc(offsetX, 0, 7, 0, Math.PI*2); ctx.fill();
      }

      // Fannie May (Center)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath(); ctx.ellipse(0, 44, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

      let dressGrad = ctx.createLinearGradient(-12, 0, 12, 42);
      dressGrad.addColorStop(0, '#f472b6'); dressGrad.addColorStop(1, '#db2777');
      ctx.fillStyle = dressGrad;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(16, 42); ctx.lineTo(-16, 42); ctx.closePath(); ctx.fill();

      let headGrad = ctx.createRadialGradient(-3, -15, 2, 0, -12, 11);
      headGrad.addColorStop(0, '#d97706'); headGrad.addColorStop(1, '#92400e');
      ctx.fillStyle = headGrad;
      ctx.beginPath(); ctx.arc(0, -12, 11, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, -15, 3, 3); ctx.fillRect(2, -15, 3, 3);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(0, -18, 12, Math.PI, 0, false);
      ctx.arc(-10, -14, 6, 0, Math.PI * 2);
      ctx.arc(10, -14, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      waveOffset += 0.04;

      if (gameState.fannieDir !== 0) {
        gameState.fannieX += gameState.fannieDir * 3.5;
        if (gameState.fannieX < 40) gameState.fannieX = 40;
        if (gameState.fannieX > 560) gameState.fannieX = 560;
        checkCollection();
      }

      let skyGrad = ctx.createLinearGradient(0, 0, 0, 160);
      if (gameState.chapter >= 4) {
        skyGrad.addColorStop(0, '#38bdf8');
        skyGrad.addColorStop(1, '#bae6fd');
      } else {
        skyGrad.addColorStop(0, '#020617');
        skyGrad.addColorStop(0.5, '#0f172a');
        skyGrad.addColorStop(1, '#312e81');
      }
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Golden Tree Landmark
      ctx.save();
      ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 35;
      if (goldenTreeImg.complete) {
        ctx.drawImage(goldenTreeImg, 245, 18, 135, 145);
      }
      ctx.restore();

      let bankGrad = ctx.createLinearGradient(0, 150, 0, 270);
      bankGrad.addColorStop(0, gameState.chapter >= 4 ? '#22c55e' : '#475569');
      bankGrad.addColorStop(1, gameState.chapter >= 4 ? '#15803d' : '#1e293b');
      ctx.fillStyle = bankGrad;
      ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(canvas.width, 150); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

      items.forEach(item => {
        if (!item.collected) {
          ctx.save();
          if (item.type === 'grass' && gameState.chapter === 1) {
            ctx.shadowColor = '#34d399'; ctx.shadowBlur = 12;
            ctx.fillStyle = '#34d399'; ctx.fillRect(item.x - 7, item.y, 14, 16);
          } else if (item.type === 'wood' && gameState.chapter === 2) {
            ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12;
            ctx.fillStyle = '#d97706'; ctx.fillRect(item.x - 10, item.y + 4, 20, 10);
          } else if (item.type === 'brother' && gameState.chapter === 3) {
            ctx.shadowColor = '#fef08a'; ctx.shadowBlur = 15;
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(item.x, item.y + 8, 10, 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
        }
      });

      let waterGrad = ctx.createLinearGradient(0, 195, 0, 270);
      waterGrad.addColorStop(0, 'rgba(2, 132, 199, 0.6)');
      waterGrad.addColorStop(1, 'rgba(3, 105, 161, 0.9)');
      ctx.fillStyle = waterGrad;
      ctx.beginPath();
      ctx.moveTo(0, 195);
      for (let i = 0; i <= canvas.width; i += 15) {
        ctx.lineTo(i, 195 + Math.sin(i * 0.04 + waveOffset) * 10);
      }
      ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
      ctx.fill();

      drawFannieAndBrothersCrew(gameState.fannieX, 118, gameState.fannieDir, gameState.brothersJoined);

      requestAnimationFrame(gameLoop);
    }

    goldenTreeImg.onload = () => { gameLoop(); };
    gameLoop();
  </script>
</body>
</html>
