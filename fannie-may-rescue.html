<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Adventures of Little Fannie May: The River Bank Rescue | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #1e130c radial-gradient(circle at center, #3d2618 0%, #110904 100%);
      color: #fef3c7;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 800px;
      background: #fdf6e2;
      border: 8px solid #8b5a2b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(139, 90, 43, 0.2);
      text-align: center;
      color: #29180b;
    }
    .game-header {
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      color: #92400e;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      color: #78350f;
      font-size: 1.6rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #fef9c3;
      border: 2px solid #ca8a04;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: #713f12;
      font-weight: bold;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }
    .story-box {
      background: #fffbeb;
      border: 2px dashed #d97706;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #451a03;
      margin-bottom: 16px;
      min-height: 85px;
      text-align: left;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }
    .canvas-box {
      width: 100%;
      height: 310px;
      background: #e0f2fe;
      border: 4px solid #b45309;
      border-radius: 12px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.25), 0 5px 15px rgba(0,0,0,0.2);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .control-btn {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border: 2px solid #78350f;
      color: #ffffff;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.3);
      transition: all 0.15s ease;
    }
    .control-btn:active {
      transform: translateY(2px);
      background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
      box-shadow: 0 2px 5px rgba(180, 83, 9, 0.3);
    }
    .action-btn {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border-color: #065f46;
    }
    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: #92400e;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #b45309;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header" id="chapter-title">Chapter 1: The Levee Marsh</div>
    <h1>Fannie May's River Bank Rescue</h1>

    <div class="stats-bar">
      <span>🌿 Sweetgrass: <strong id="stat-grass" style="color: #059669;">0</strong> / 3</span>
      <span>🪵 Wood Logs: <strong id="stat-wood" style="color: #d97706;">0</strong> / 3</span>
      <span>👥 Brothers Joined: <strong id="stat-brothers" style="color: #ca8a04;">1</strong> / 7</span>
    </div>

    <div class="story-box" id="story-dialogue">
      "The Yazoo River is rising! Little Fannie May starts out alone and finds her first brother along the levee bank. Collect 3 Sweetgrass Bundles!"
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="700" height="310" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="controls-grid">
      <button class="control-btn" onmousedown="startMove(-1)" onmouseup="stopMove()" ontouchstart="startMove(-1)" ontouchend="stopMove()">◀ WALK LEFT</button>
      <button class="control-btn action-btn" onclick="performAction()">✨ RESCUE / BUILD</button>
      <button class="control-btn" onmousedown="startMove(1)" onmouseup="stopMove()" ontouchstart="startMove(1)" ontouchend="stopMove()">WALK RIGHT ▶</button>
    </div>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let voiceEnabled = true;

    // Load original signature double-helix golden tree sprite asset
    const goldenTreeImg = new Image();
    goldenTreeImg.src = 'packed-marrow-tree.png';

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientSound();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startAmbientSound() {
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 350;
        let gain = audioCtx.createGain(); gain.gain.value = 0.02;
        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'collect') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.15);
          osc.frequency.setValueAtTime(659.25, now + 0.3);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.55);
          osc.start(now); osc.stop(now + 0.55);
        } else if (type === 'evolution') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(261.63, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.8);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
          osc.start(now); osc.stop(now + 1.0);
        }
      } catch(e) {}
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.0;
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    let gameState = { 
      chapter: 1, 
      grass: 0, 
      wood: 0, 
      brothersJoined: 1, 
      fannieX: 140, 
      fannieDir: 0,
      evolutionStage: 1 // Stage 1: Preschool Storybook, Stage 2: Cinematic Middle School Avatar
    };

    let items = [
      { x: 230, y: 175, type: 'grass', collected: false },
      { x: 410, y: 175, type: 'grass', collected: false },
      { x: 530, y: 175, type: 'grass', collected: false },
      { x: 200, y: 175, type: 'wood', collected: false },
      { x: 370, y: 175, type: 'wood', collected: false },
      { x: 560, y: 175, type: 'wood', collected: false },
      { x: 300, y: 170, type: 'brother', collected: false },
      { x: 450, y: 170, type: 'brother', collected: false },
      { x: 600, y: 170, type: 'brother', collected: false }
    ];

    function startMove(dir) { initAudio(); gameState.fannieDir = dir; }
    function stopMove() { gameState.fannieDir = 0; }

    function performAction() {
      initAudio();
      checkCollection();
    }

    function checkCollection() {
      items.forEach(item => {
        if (!item.collected && Math.abs(gameState.fannieX - item.x) < 50) {
          if (gameState.chapter === 1 && item.type === 'grass') {
            item.collected = true; gameState.grass++;
            playSound('collect'); speak("Sweetgrass bundle collected! " + gameState.grass + " of 3.");
            if (gameState.grass >= 3) {
              gameState.chapter = 2; gameState.brothersJoined = 4; playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 2: Timber & More Brothers";
              document.getElementById('story-dialogue').innerText = "Chapter 2 Unlocked! Three more brothers join the crew along the levee! Collect 3 Wood Logs to reinforce the river bank.";
              speak("Chapter 2 unlocked. More brothers have joined the team to gather wood logs!");
            }
          } else if (gameState.chapter === 2 && item.type === 'wood') {
            item.collected = true; gameState.wood++;
            playSound('collect'); speak("Wood log collected! " + gameState.wood + " of 3.");
            if (gameState.wood >= 3) {
              gameState.chapter = 3; gameState.brothersJoined = 7; playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 3: All 7 Brothers Assembled!";
              document.getElementById('story-dialogue').innerText = "Chapter 3 Unlocked! All 7 brothers are now teamed up with Fannie May! Tap 'RESCUE / BUILD' to complete the grand bridge and secure the river bank!";
              speak("Chapter 3 unlocked. All seven brothers are now assembled for the final rescue bridge!");
            }
          } else if (gameState.chapter === 3 && item.type === 'brother') {
            item.collected = true;
            playSound('evolution');
            gameState.chapter = 4;
            gameState.evolutionStage = 2; // Trigger Cinematic Middle School Age-Up Graduation!
            document.getElementById('chapter-title').innerText = "Victory: Cinematic Middle School Era Unlocked!";
            document.getElementById('story-dialogue').innerText = "🌟 TIME-SLIP EVOLUTION! Fannie May and her brothers have graduated to their cinematic middle-school forms, unlocking the full Vanguard universe saga! 'What is packed in the bone never fades from the marrow!'";
            speak("Evolution complete! Fannie May and her brothers have graduated to cinematic movie avatars.");
          }
        }
      });
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('stat-grass').innerText = gameState.grass;
      document.getElementById('stat-wood').innerText = gameState.wood;
      document.getElementById('stat-brothers').innerText = gameState.brothersJoined;
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let waveOffset = 0;

    function drawStorybookCharacter(x, y, dir, count, stage) {
      ctx.save();
      ctx.translate(x, y);
      let bounce = dir !== 0 ? Math.sin(Date.now() * 0.02) * 4 : 0;
      ctx.translate(0, bounce);

      if (stage === 2) {
        // STAGE 2: Cinematic Middle School / Movie-Type Adolescent Avatars
        for (let i = 1; i < count; i++) {
          let offsetX = (i % 2 === 0 ? 1 : -1) * (i * 20);
          ctx.fillStyle = '#1e3a8a'; ctx.fillRect(offsetX - 7, 5, 14, 52);
          ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.arc(offsetX, -6, 11, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111827'; ctx.fillRect(offsetX - 9, -18, 18, 6);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath(); ctx.ellipse(0, 62, 20, 7, 0, 0, Math.PI * 2); ctx.fill();

        let coatGrad = ctx.createLinearGradient(-16, 0, 16, 60);
        coatGrad.addColorStop(0, '#3b82f6'); coatGrad.addColorStop(1, '#1d4ed8');
        ctx.fillStyle = coatGrad;
        ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.lineTo(20, 60); ctx.lineTo(-20, 60); ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#fbbf24'; ctx.fillRect(-14, 25, 28, 5);

        let headGrad = ctx.createRadialGradient(-3, -20, 2, 0, -18, 15);
        headGrad.addColorStop(0, '#d97706'); headGrad.addColorStop(1, '#78350f');
        ctx.fillStyle = headGrad;
        ctx.beginPath(); ctx.arc(0, -18, 15, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffffff'; ctx.fillRect(-7, -23, 4, 4); ctx.fillRect(3, -23, 4, 4);
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(0, -26, 16, Math.PI, 0, false);
        ctx.arc(-14, -20, 8, 0, Math.PI * 2);
        ctx.arc(14, -20, 8, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // STAGE 1: Preschool Storybook Watercolor Style
        for (let i = 1; i < count; i++) {
          let offsetX = (i % 2 === 0 ? 1 : -1) * (i * 16);
          ctx.fillStyle = '#b45309'; ctx.fillRect(offsetX - 6, 12, 12, 36);
          ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(offsetX, 0, 10, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#451a03'; ctx.fillRect(offsetX - 8, -12, 16, 5);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.beginPath(); ctx.ellipse(0, 50, 16, 6, 0, 0, Math.PI * 2); ctx.fill();

        let dressGrad = ctx.createLinearGradient(-14, 0, 14, 48);
        dressGrad.addColorStop(0, '#f472b6'); dressGrad.addColorStop(1, '#db2777');
        ctx.fillStyle = dressGrad;
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.lineTo(18, 48); ctx.lineTo(-18, 48); ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(6, 2); ctx.lineTo(0, 10); ctx.closePath(); ctx.fill();

        let headGrad = ctx.createRadialGradient(-3, -16, 2, 0, -14, 13);
        headGrad.addColorStop(0, '#d97706'); headGrad.addColorStop(1, '#92400e');
        ctx.fillStyle = headGrad;
        ctx.beginPath(); ctx.arc(0, -14, 13, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#1e293b'; ctx.fillRect(-6, -18, 3, 3); ctx.fillRect(3, -18, 3, 3);
        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.arc(0, -21, 14, Math.PI, 0, false);
        ctx.arc(-12, -15, 7, 0, Math.PI * 2);
        ctx.arc(12, -15, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function gameLoop() {
      waveOffset += 0.05;

      if (gameState.fannieDir !== 0) {
        gameState.fannieX += gameState.fannieDir * 4;
        if (gameState.fannieX < 50) gameState.fannieX = 50;
        if (gameState.fannieX > 650) gameState.fannieX = 650;
        checkCollection();
      }

      // Storybook Sky
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 180);
      if (gameState.evolutionStage === 2) {
        skyGrad.addColorStop(0, '#0284c7');
        skyGrad.addColorStop(1, '#7dd3fc');
      } else if (gameState.chapter >= 4) {
        skyGrad.addColorStop(0, '#7dd3fc');
        skyGrad.addColorStop(1, '#e0f2fe');
      } else {
        skyGrad.addColorStop(0, '#1e3a8a');
        skyGrad.addColorStop(0.5, '#3b82f6');
        skyGrad.addColorStop(1, '#93c5fd');
      }
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render Original Packed-Marrow Golden Double-Helix Tree Sprite
      ctx.save();
      ctx.shadowColor = '#fbbf24'; 
      ctx.shadowBlur = gameState.evolutionStage === 2 ? 40 : 25;
      if (goldenTreeImg.complete) {
        ctx.drawImage(goldenTreeImg, 260, 20, 180, 150);
      }
      ctx.restore();

      // River Levee Bank
      let bankGrad = ctx.createLinearGradient(0, 175, 0, 310);
      bankGrad.addColorStop(0, gameState.chapter >= 4 ? '#22c55e' : '#84cc16');
      bankGrad.addColorStop(1, gameState.chapter >= 4 ? '#166534' : '#3f6212');
      ctx.fillStyle = bankGrad;
      ctx.beginPath(); ctx.moveTo(0, 175); ctx.lineTo(canvas.width, 175); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

      // Items on Bank
      items.forEach(item => {
        if (!item.collected) {
          ctx.save();
          if (item.type === 'grass' && gameState.chapter === 1) {
            ctx.shadowColor = '#10b981'; ctx.shadowBlur = 10;
            ctx.fillStyle = '#10b981'; ctx.fillRect(item.x - 8, item.y, 16, 20);
          } else if (item.type === 'wood' && gameState.chapter === 2) {
            ctx.shadowColor = '#d97706'; ctx.shadowBlur = 10;
            ctx.fillStyle = '#92400e'; ctx.fillRect(item.x - 12, item.y + 4, 24, 12);
          } else if (item.type === 'brother' && gameState.chapter === 3) {
            ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 15;
            ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(item.x, item.y + 10, 12, 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
        }
      });

      // Flowing River
      let waterGrad = ctx.createLinearGradient(0, 225, 0, 310);
      waterGrad.addColorStop(0, 'rgba(14, 165, 233, 0.85)');
      waterGrad.addColorStop(1, 'rgba(3, 105, 161, 0.95)');
      ctx.fillStyle = waterGrad;
      ctx.beginPath();
      ctx.moveTo(0, 225);
      for (let i = 0; i <= canvas.width; i += 15) {
        ctx.lineTo(i, 225 + Math.sin(i * 0.05 + waveOffset) * 8);
      }
      ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
      ctx.fill();

      // Draw Characters with Evolution Stage parameter
      drawStorybookCharacter(gameState.fannieX, gameState.evolutionStage === 2 ? 120 : 135, gameState.fannieDir, gameState.brothersJoined, gameState.evolutionStage);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
