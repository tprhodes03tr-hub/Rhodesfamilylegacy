<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Adventures of Little Fannie May: The River Bank Rescue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 750px;
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
      text-align: center;
    }
    .game-header {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      color: #fef08a;
      font-size: 1.3rem;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: bold;
    }
    .story-box {
      background: #0f172a;
      border: 2px dashed #38bdf8;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
      min-height: 80px;
      text-align: left;
    }
    .canvas-box {
      width: 100%;
      height: 260px;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .action-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .game-btn {
      background-color: #0284c7;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      width: 100%;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .game-btn:hover, .game-btn:active {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .control-btn {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .control-btn:active {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-link:hover {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header" id="chapter-title">Chapter 1: The Levee Marsh</div>
    <h1>The River Bank Rescue</h1>

    <div class="stats-bar">
      <span>🌿 Sweetgrass: <strong id="stat-grass" style="color: #34d399;">0</strong> / 3</span>
      <span>🪵 Wood Logs: <strong id="stat-wood" style="color: #f59e0b;">0</strong> / 3</span>
      <span>✨ XP: <strong id="stat-xp">0</strong></span>
    </div>

    <div class="story-box" id="story-dialogue">
      "The Yazoo River is rising! Walk Little Fannie May using the controls below to collect 3 Sweetgrass Bundles along the levee bank."
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="600" height="260" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

    <div class="controls-grid">
      <button class="control-btn" onmousedown="startMove(-1)" onmouseup="stopMove()" ontouchstart="startMove(-1)" ontouchend="stopMove()">◀ WALK LEFT</button>
      <button class="control-btn" style="background: #047857; border-color: #34d399; color: #fff;" onclick="performAction()">✨ COLLECT / INTERACT</button>
      <button class="control-btn" onmousedown="startMove(1)" onmouseup="stopMove()" ontouchstart="startMove(1)" ontouchend="stopMove()">WALK RIGHT ▶</button>
    </div>

    <div>
      <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let voiceEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'collect') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampYToValueAtTime ? osc.frequency.exponentialRampToValueAtTime(880, now + 0.15) : osc.frequency.setValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        }
      } catch(e) {}
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    // --- GAME STATE & CHAPTERS ---
    let gameState = {
      chapter: 1,
      grass: 0,
      wood: 0,
      xp: 0,
      fannieX: 120,
      fannieDir: 0,
      brotherX: 480
    };

    // Collectible items positioned on the bank
    let items = [
      { x: 220, y: 135, type: 'grass', collected: false },
      { x: 340, y: 135, type: 'grass', collected: false },
      { x: 420, y: 135, type: 'grass', collected: false },
      { x: 180, y: 135, type: 'wood', collected: false },
      { x: 300, y: 135, type: 'wood', collected: false },
      { x: 440, y: 135, type: 'wood', collected: false }
    ];

    function startMove(dir) {
      initAudio();
      gameState.fannieDir = dir;
    }

    function stopMove() {
      gameState.fannieDir = 0;
    }

    function performAction() {
      initAudio();

      // Check proximity to items
      items.forEach(item => {
        if (!item.collected && Math.abs(gameState.fannieX - item.x) < 35) {
          if (gameState.chapter === 1 && item.type === 'grass') {
            item.collected = true;
            gameState.grass++;
            gameState.xp += 40;
            playSound('collect');
            speak("Sweetgrass bundle secured.");

            if (gameState.grass >= 3) {
              gameState.chapter = 2;
              playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 2: Timber & Brothers";
              document.getElementById('story-dialogue').innerText = "Wonderful! Now walk Fannie May over to her brother near the woodpile to collect 3 Wood Logs for the levee bridge.";
              speak("Chapter 2 unlocked. Gather wood logs with your brother.");
            }
          } else if (gameState.chapter === 2 && item.type === 'wood') {
            item.collected = true;
            gameState.wood++;
            gameState.xp += 50;
            playSound('collect');
            speak("Wood log secured.");

            if (gameState.wood >= 3) {
              gameState.chapter = 3;
              playSound('success');
              document.getElementById('chapter-title').innerText = "Chapter 3: The Levee Defense";
              document.getElementById('story-dialogue').innerText = "🌟 AMAZING TEAMWORK! All materials gathered. The levee bridge is built, and the homestead is safe!";
              speak("Chapter 3 complete. The river bank rescue is a success!");
            }
          }
        }
      });

      // Check proximity to Brother in Chapter 2
      if (gameState.chapter === 2 && Math.abs(gameState.fannieX - gameState.brotherX) < 45) {
        speak("Brother says: Good job, little sister! Grab those wood logs by the ridge!");
      }

      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('stat-grass').innerText = gameState.grass;
      document.getElementById('stat-wood').innerText = gameState.wood;
      document.getElementById('stat-xp').innerText = gameState.xp;
    }

    // --- CANVAS RENDERER ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let waveOffset = 0;
    let helixPulse = 0;

    const goldenTreeImg = new Image();
    goldenTreeImg.src = 'packed-marrow-tree.png';

    function drawDetailedCharacter(x, y, isFannieMay, dir) {
      ctx.save();
      ctx.translate(x, y);
      let bounce = dir !== 0 ? Math.sin(Date.now() * 0.015) * 3 : 0;
      ctx.translate(0, bounce);

      if (isFannieMay) {
        ctx.fillStyle = '#f472b6';
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(16, 42); ctx.lineTo(-16, 42); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-6, 0, 12, 6);
        ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(0, -12, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, -15, 3, 3); ctx.fillRect(2, -15, 3, 3);
        ctx.fillStyle = '#78350f'; ctx.fillRect(-3, -9, 6, 2);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(-13, -14, 3, 16); ctx.fillRect(10, -14, 3, 16);
      } else {
        ctx.fillStyle = '#d97706'; ctx.fillRect(-11, 0, 22, 28);
        ctx.fillStyle = '#a16207'; ctx.fillRect(-11, 28, 9, 14); ctx.fillRect(2, 28, 9, 14);
        ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.arc(0, -12, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, -15, 3, 3); ctx.fillRect(2, -15, 3, 3);
        ctx.fillStyle = '#451a03'; ctx.fillRect(-3, -9, 6, 2);
        ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(0, -16, 9, Math.PI, 0, false); ctx.fill(); ctx.fillRect(-12, -16, 24, 3);
      }
      ctx.restore();
    }

    function gameLoop() {
      waveOffset += 0.04;
      helixPulse += 0.03;

      if (gameState.fannieDir !== 0) {
        gameState.fannieX += gameState.fannieDir * 3;
        if (gameState.fannieX < 40) gameState.fannieX = 40;
        if (gameState.fannieX > 560) gameState.fannieX = 560;
      }

      // Sky
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 150);
      skyGrad.addColorStop(0, '#0f172a'); skyGrad.addColorStop(1, '#312e81');
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Golden Tree Landmark
      ctx.save();
      ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 20;
      if (goldenTreeImg.complete) {
        ctx.drawImage(goldenTreeImg, 260, 25, 110, 125);
      }
      ctx.restore();

      // Levee Bank Platform
      ctx.fillStyle = '#334155';
      ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(canvas.width, 150); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

      // Render Collectible Items on the Bank
      items.forEach(item => {
        if (!item.collected) {
          if (item.type === 'grass' && gameState.chapter === 1) {
            ctx.fillStyle = '#34d399';
            ctx.fillRect(item.x - 6, item.y, 12, 14);
          } else if (item.type === 'wood' && gameState.chapter === 2) {
            ctx.fillStyle = '#b45309';
            ctx.fillRect(item.x - 8, item.y + 4, 16, 8);
          }
        }
      });

      // River Water
      ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.beginPath();
      ctx.moveTo(0, 195);
      for (let i = 0; i <= canvas.width; i += 15) {
        ctx.lineTo(i, 195 + Math.sin(i * 0.04 + waveOffset) * 10);
      }
      ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
      ctx.fill();

      // Render Characters
      drawDetailedCharacter(gameState.fannieX, 120, true, gameState.fannieDir);
      drawDetailedCharacter(gameState.brotherX, 115, false, 0);

      requestAnimationFrame(gameLoop);
    }

    goldenTreeImg.onload = () => { gameLoop(); };
    gameLoop();
    speak("Welcome to Fannie May's River Bank Rescue. Chapter 1: Gather sweetgrass bundles.");
  </script>
</body>
</html>
