<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Adventures of Little Fannie May & Her Brothers • Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #0b162e 0%, #030712 65%, #02050d 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 36px;
    }
    .book-shell {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 14px;
      padding: 10px 14px;
    }
    .brand-link {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip-btn {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
    }
    .chip-btn.gold {
      background: #ea580c;
      color: #ffffff;
      border-color: #fdba74;
    }
    .book-card {
      background: linear-gradient(180deg, #101b33 0%, #091020 100%);
      border: 2px solid rgba(251, 191, 36, 0.65);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 30px rgba(251, 191, 36, 0.14);
      display: flex;
      flex-direction: column;
      gap: 14px;
      touch-action: pan-y;
    }
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .book-kicker {
      font-size: 11px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .page-counter {
      font-size: 12px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .art-stage {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.45);
      background: #020617;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .story-page-box {
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scene-title {
      font-size: 19px;
      font-weight: 900;
      color: #fef08a;
    }
    .story-prose {
      font-size: 15px;
      line-height: 1.65;
      color: #f1f5f9;
    }
    .heritage-note {
      font-size: 12px;
      line-height: 1.5;
      color: #6ee7b7;
      background: rgba(6, 78, 59, 0.28);
      border-left: 3px solid #34d399;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .page-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-prev {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #7dd3fc;
    }
    .btn-speak {
      background: #0d9488;
    }
    .btn-next {
      background: #d97706;
      color: #090d16;
    }
    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="book-shell">
    <div class="top-bar">
      <a href="index.html" class="brand-link">← Rhodes Family Legacy</a>
      <div class="top-controls">
        <button type="button" class="chip-btn" id="langToggleBtn" onclick="toggleLanguage()">🌐 EN / ES</button>
        <a href="https://payhip.com/Rhodesfamilylegacy" target="_blank" rel="noopener noreferrer" class="chip-btn gold">Buy on Payhip ↗</a>
      </div>
    </div>

    <div class="book-card" id="bookCard">
      <div class="book-header">
        <span class="book-kicker">📖 Illustrated Children's Book • By Tommy Phillip Rhodes</span>
        <span class="page-counter" id="pageCounter">Page 1 of 5</span>
      </div>

      <div class="art-stage">
        <canvas id="sceneCanvas" width="720" height="320"></canvas>
      </div>

      <div class="story-page-box">
        <h1 class="scene-title" id="sceneTitle"></h1>
        <p class="story-prose" id="sceneProse"></p>
        <div class="heritage-note" id="heritageNote"></div>
      </div>

      <div class="nav-row">
        <button type="button" class="page-btn btn-prev" id="prevBtn" onclick="prevPage()">◀ Prev Page</button>
        <button type="button" class="page-btn btn-speak" onclick="readCurrentPage()">🔊 Read Aloud</button>
        <button type="button" class="page-btn btn-next" id="nextBtn" onclick="nextPage()">Next Page ▶</button>
      </div>
    </div>

    <p class="footer-note">
      Tip: Tap <strong>Next Page ▶</strong> or <strong>◀ Prev Page</strong>, or swipe left/right on the book card to flip pages.
    </p>
  </div>

  <script>
    const PAGES = [
      {
        enTitle: "1. Morning on the Family Land",
        esTitle: "1. Mañana en la Tierra Familiar",
        enProse: "Early in the morning, Little Fannie May steps onto the sunny porch with her brothers beside her. Birds sing over the green fields as everyone gets ready to help one another.",
        esProse: "Temprano en la mañana, la pequeña Fannie May sale al porche soleado junto a sus hermanos. Cantan los pájaros sobre los campos verdes mientras todos se preparan para ayudarse.",
        enNote: "Family Root: Inspired by the Fannie May & Mitchell family story and growing up with brothers.",
        esNote: "Raíz Familiar: Inspirado en la historia de Fannie May y los Mitchell y en crecer junto a sus hermanos.",
        scene: "morning"
      },
      {
        enTitle: "2. Gathering Wood by the Timber Line",
        esTitle: "2. Recogiendo Madera en el Bosque",
        enProse: "Fannie May and her older brothers walk toward the edge of the woods to gather strong branches and timber for fences and repairs, taking turns and watching out for each other.",
        esProse: "Fannie May y sus hermanos mayores caminan hacia la orilla del bosque para recoger ramas fuertes y madera para las cercas, turnándose y cuidándose unos a otros.",
        enNote: "Stewardship Lesson: Working together makes heavy jobs lighter for everyone.",
        esNote: "Lección de Cuidado: Trabajar juntos hace que el trabajo pesado sea más ligero para todos.",
        scene: "timber"
      },
      {
        enTitle: "3. Crossing the Creek Bridge Together",
        esTitle: "3. Cruzando el Puente del Arroyo",
        enProse: "After a rain shower, the creek runs fast and bright. Fannie May holds her brother's hand as they step carefully across the wooden planks without rushing.",
        esProse: "Después de la lluvia, el arroyo corre rápido y brillante. Fannie May toma la mano de su hermano mientras cruzan con cuidado por las tablas sin apresurarse.",
        enNote: "Courage & Care: Patience and looking out for kin keep the whole group safe.",
        esNote: "Valentía y Cuidado: La paciencia y cuidar a los suyos mantienen a todos a salvo.",
        scene: "creek"
      },
      {
        enTitle: "4. Sunset on the Homestead",
        esTitle: "4. Atardecer en el Hogar Familiar",
        enProse: "As the sky turns warm gold and rose, the brothers bring the tools home and Fannie May helps set out supper. Tired legs mean a good day's work well done.",
        esProse: "Mientras el cielo se vuelve dorado y rosado, los hermanos traen las herramientas a casa y Fannie May ayuda a preparar la cena. Las piernas cansadas muestran un buen día de trabajo.",
        enNote: "Home & Belonging: Coming home together at sundown is a gift passed down.",
        esNote: "Hogar y Pertenencia: Volver a casa juntos al atardecer es un tesoro que se hereda.",
        scene: "sunset"
      },
      {
        enTitle: "5. Stories That Stay in the Marrow",
        esTitle: "5. Historias que Quedan en el Tuétano",
        enProse: "Under the evening stars, Fannie May and her brothers listen to family stories of where their people came from—knowing those memories will stay strong for generations to come.",
        esProse: "Bajo las estrellas de la noche, Fannie May y sus hermanos escuchan historias familiares de dónde vinieron los suyos, sabiendo que esos recuerdos seguirán vivos por generaciones.",
        enNote: "Rhodes Family Legacy: Every story shared keeps family history alive.",
        esNote: "Legado Familiar Rhodes: Cada historia compartida mantiene viva la memoria de la familia.",
        scene: "stars"
      }
    ];

    let currentPage = 0;
    let lang = "en";
    const canvas = document.getElementById("sceneCanvas");
    const ctx = canvas.getContext("2d");

    function awardBookProgress() {
      try {
        const raw = localStorage.getItem("rfl_legacy_save_v1");
        const state = raw ? JSON.parse(raw) : {};
        state.points = (typeof state.points === "number" ? state.points : 342604) + 15;
        state.hubPoints = (typeof state.hubPoints === "number" ? state.hubPoints : 61548) + 15;
        localStorage.setItem("rfl_legacy_save_v1", JSON.stringify(state));

        const wRaw = localStorage.getItem("rhodes_legacy_wallet");
        if (wRaw) {
          const w = JSON.parse(wRaw);
          w.legacyScore = (typeof w.legacyScore === "number" ? w.legacyScore : 342604) + 15;
          w.hubPoints = (typeof w.hubPoints === "number" ? w.hubPoints : 61548) + 15;
          w.updatedAt = Date.now();
          localStorage.setItem("rhodes_legacy_wallet", JSON.stringify(w));
        }
      } catch (e) {}
    }

    function drawKid(x, y, dressOrShirt, isGirl, name) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath();
      ctx.ellipse(0, 38, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-5, 18); ctx.lineTo(-6, 36);
      ctx.moveTo(5, 18); ctx.lineTo(6, 36);
      ctx.stroke();

      ctx.fillStyle = dressOrShirt;
      if (isGirl) {
        ctx.beginPath();
        ctx.moveTo(-9, -4); ctx.lineTo(9, -4); ctx.lineTo(14, 20); ctx.lineTo(-14, 20);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.roundRect(-10, -4, 20, 22, 5);
        ctx.fill();
      }

      ctx.fillStyle = "#8d5b4c";
      ctx.beginPath();
      ctx.arc(0, -15, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(0, -19, 10, Math.PI, 0);
      ctx.fill();
      if (isGirl) {
        ctx.beginPath();
        ctx.arc(-10, -18, 4.5, 0, Math.PI * 2);
        ctx.arc(10, -18, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(-3.5, -15, 1.5, 0, Math.PI * 2);
      ctx.arc(3.5, -15, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fef08a";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name, 0, -34);
      ctx.restore();
    }

    function drawIllustration(sceneType) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const sky = ctx.createLinearGradient(0, 0, 0, 225);

      if (sceneType === "morning") {
        sky.addColorStop(0, "#0284c7");
        sky.addColorStop(1, "#bae6fd");
      } else if (sceneType === "timber") {
        sky.addColorStop(0, "#0f766e");
        sky.addColorStop(1, "#99f6e4");
      } else if (sceneType === "creek") {
        sky.addColorStop(0, "#1d4ed8");
        sky.addColorStop(1, "#bfdbfe");
      } else if (sceneType === "sunset") {
        sky.addColorStop(0, "#9a3412");
        sky.addColorStop(1, "#fed7aa");
      } else {
        sky.addColorStop(0, "#090d16");
        sky.addColorStop(1, "#1e1b4b");
      }

      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, 225);

      if (sceneType === "stars") {
        ctx.fillStyle = "#fef08a";
        for (let i = 0; i < 24; i++) {
          ctx.beginPath();
          ctx.arc(40 + ((i * 59) % 640), 24 + ((i * 37) % 130), 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = sceneType === "sunset" ? "#fb923c" : "#fef08a";
        ctx.beginPath();
        ctx.arc(590, 62, 32, 0, Math.PI * 2);
        ctx.fill();
      }

      const ground = ctx.createLinearGradient(0, 215, 0, 320);
      ground.addColorStop(0, sceneType === "stars" ? "#064e3b" : "#15803d");
      ground.addColorStop(1, "#052e16");
      ctx.fillStyle = ground;
      ctx.fillRect(0, 215, canvas.width, 105);

      if (sceneType === "creek") {
        ctx.fillStyle = "#0ea5e9";
        ctx.beginPath();
        ctx.ellipse(470, 255, 130, 32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#78350f";
        ctx.fillRect(390, 232, 160, 14);
      }

      if (sceneType === "timber" || sceneType === "morning") {
        [110, 580].forEach(tx => {
          ctx.fillStyle = "#5c2c16";
          ctx.fillRect(tx - 8, 145, 16, 75);
          ctx.fillStyle = "#166534";
          ctx.beginPath();
          ctx.arc(tx, 132, 38, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      drawKid(240, 225, "#ec4899", true, "Fannie May");
      drawKid(325, 225, "#2563eb", false, "Aaron");
      drawKid(405, 225, "#059669", false, "James");
    }

    function renderPage() {
      const p = PAGES[currentPage];
      document.getElementById("pageCounter").textContent = `Page ${currentPage + 1} of ${PAGES.length}`;
      document.getElementById("sceneTitle").textContent = lang === "en" ? p.enTitle : p.esTitle;
      document.getElementById("sceneProse").textContent = lang === "en" ? p.enProse : p.esProse;
      document.getElementById("heritageNote").textContent = lang === "en" ? p.enNote : p.esNote;
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage === PAGES.length - 1;
      drawIllustration(p.scene);
    }

    function nextPage() {
      if (currentPage < PAGES.length - 1) {
        currentPage += 1;
        awardBookProgress();
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage -= 1;
        renderPage();
      }
    }

    function toggleLanguage() {
      lang = lang === "en" ? "es" : "en";
      renderPage();
    }

    function readCurrentPage() {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const p = PAGES[currentPage];
        const text = lang === "en" ? `${p.enTitle}. ${p.enProse}` : `${p.esTitle}. ${p.esProse}`;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang === "en" ? "en-US" : "es-ES";
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    let touchStartX = 0;
    const cardEl = document.getElementById("bookCard");
    cardEl.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });
    cardEl.addEventListener("touchend", (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      if (diffX < -45) nextPage();
      else if (diffX > 45) prevPage();
    }, { passive: true });

    renderPage();
  </script>
  <script src="legacy-wallet.js" defer></script>
</body>
</html>
