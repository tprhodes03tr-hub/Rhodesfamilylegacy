<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM-GHOST: SPECTRUM HEIST</title>
    <style>
        body {
            background-color: #0b0614;
            color: #d8b4fe;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }
        .cabinet {
            background: linear-gradient(135deg, #180d2b 0%, #0d0714 100%);
            border: 2px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 {
            font-size: 13px;
            letter-spacing: 2px;
            color: #e9d5ff;
            margin: 5px 0 10px 0;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }
        .hud {
            background: #1e1035;
            border: 1px solid #7e22ce;
            border-radius: 6px;
            padding: 8px;
            font-size: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        canvas {
            background: #05020a;
            border: 1px solid #9333ea;
            border-radius: 6px;
            display: block;
            margin: 0 auto 10px auto;
            box-shadow: inset 0 0 15px rgba(147, 51, 234, 0.3);
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        button {
            background: #2e1065;
            color: #f3e8ff;
            border: 1px solid #a855f7;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active {
            background: #6b21a8;
            transform: scale(0.97);
        }
        .action-btn {
            grid-column: span 2;
            background: #581c87;
            border-color: #c084fc;
        }
        .hub-link {
            font-size: 10px;
            color: #a855f7;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }
        .hub-link:hover {
            color: #e9d5ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="cabinet">
    <div style="font-size: 8px; color: #c084fc; letter-spacing: 1px;">SYNDICATE ELITE • A-TIER ARCADE</div>
    <h2>PRISM-GHOST: SPECTRUM HEIST</h2>
    
    <div class="hud">
        <span id="chapter-label">CH: 1 / 4</span>
        <span id="shield-label">SHIELD: 100%</span>
        <span id="keys-label">KEYS: 0/3</span>
    </div>

    <canvas id="gameCanvas" width="320" height="220"></canvas>

    <div class="controls">
        <button onclick="steer(-1)">◄ STEER LEFT</button>
        <button onclick="steer(1)">STEER RIGHT ►</button>
        <button class="action-btn" onclick="deployDecoy()">✨ DEPLOY QUANTUM DECOY</button>
    </div>

    <a href="index.html" class="hub-link">← RETURN TO MAIN LEGACY HUB</a>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let chapter = 1;
let shield = 100;
let keysCollected = 0;
let targetKeys = 3;

// 4 distinct vertical stealth lanes
const lanes = [60, 120, 180, 240];
let currentLaneIndex = 1;

let playerX = lanes[currentLaneIndex];
let playerY = 180;

// Load Character Sprite Asset
const prismSprite = new Image();
prismSprite.src = 'prism-ghost.png';

let obstacles = [
    { lane: 0, y: -50, speed: 2 },
    { lane: 2, y: -150, speed: 2.5 },
    { lane: 3, y: -100, speed: 2 }
];

let vaultKeys = [
    { lane: 1, y: -80, collected: false },
    { lane: 3, y: -200, collected: false },
    { lane: 0, y: -300, collected: false }
];

function steer(direction) {
    currentLaneIndex += direction;
    if (currentLaneIndex < 0) currentLaneIndex = 0;
    if (currentLaneIndex > lanes.length - 1) currentLaneIndex = lanes.length - 1;
    playerX = lanes[currentLaneIndex];
}

function deployDecoy() {
    obstacles.forEach(obs => obs.y -= 120);
}

function resetGame() {
    shield = 100;
    chapter = 1;
    keysCollected = 0;
    resetChapter();
}

function resetChapter() {
    keysCollected = 0;
    vaultKeys.forEach(k => {
        k.collected = false;
        k.lane = Math.floor(Math.random() * lanes.length);
        k.y = -Math.random() * 200 - 50;
    });
    obstacles.forEach(obs => {
        obs.lane = Math.floor(Math.random() * lanes.length);
        obs.y = -Math.random() * 200 - 50;
        obs.speed = 1.8 + (chapter * 0.5);
    });
}

function update() {
    obstacles.forEach(obs => {
        obs.y += obs.speed;
        if (obs.y > canvas.height + 20) {
            obs.y = -50;
            obs.lane = Math.floor(Math.random() * lanes.length);
        }

        if (obs.lane === currentLaneIndex && Math.abs(obs.y - playerY) < 20) {
            shield -= 25;
            obs.y = -100;
            if (shield <= 0) {
                alert("CRITICAL SYSTEM BREACH! PRISM-GHOST CAUGHT. RESTARTING...");
                resetGame();
            }
        }
    });

    vaultKeys.forEach(k => {
        if (!k.collected) {
            k.y += 2;
            if (k.y > canvas.height + 20) {
                k.y = -100;
                k.lane = Math.floor(Math.random() * lanes.length);
            }

            if (k.lane === currentLaneIndex && Math.abs(k.y - playerY) < 20) {
                k.collected = true;
                keysCollected++;
                if (keysCollected >= targetKeys) {
                    if (chapter < 4) {
                        chapter++;
                        alert(`VAULT CODE SECURED! ADVANCING TO CHAPTER ${chapter}`);
                        resetChapter();
                    } else {
                        alert("LEGENDARY HEIST COMPLETE! ALL VAULT CODES CRACKED.");
                        resetGame();
                    }
                }
            }
        }
    });
}

function draw() {
    ctx.fillStyle = '#05020a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#1e1b4b';
    ctx.lineWidth = 1;
    lanes.forEach(lx => {
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
        ctx.stroke();
    });

    ctx.strokeStyle = '#7e22ce';
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(150, 0);
    ctx.lineTo(150, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    vaultKeys.forEach(k => {
        if (!k.collected) {
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(lanes[k.lane], k.y, 6, 0, Math.PI * 2);
            ctx.shadowColor = '#facc15';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    });

    obstacles.forEach(obs => {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(lanes[obs.lane] - 16, obs.y - 4, 32, 8);
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 12;
        ctx.fillRect(lanes[obs.lane] - 16, obs.y - 4, 32, 8);
        ctx.shadowBlur = 0;
    });

    // Draw Prism-Ghost Character Sprite with Fallback
    if (prismSprite.complete && prismSprite.naturalWidth !== 0) {
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 15;
        ctx.drawImage(prismSprite, playerX - 16, playerY - 16, 32, 32);
        ctx.shadowBlur = 0;
    } else {
        ctx.fillStyle = '#c084fc';
        ctx.beginPath();
        ctx.arc(playerX, playerY, 10, 0, Math.PI * 2);
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    document.getElementById('chapter-label').innerText = `CH: ${chapter} / 4`;
    document.getElementById('shield-label').innerText = `SHIELD: ${shield}%`;
    document.getElementById('keys-label').innerText = `KEYS: ${keysCollected}/${targetKeys}`;
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
