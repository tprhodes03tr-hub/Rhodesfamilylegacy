<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism-Ghost: Spectrum Heist • Arcade Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .arcade-container {
      width: 100%;
      max-width: 480px;
      background: #090d16;
      border: 2px solid #c084fc;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 0 30px rgba(192, 132, 252, 0.3);
      text-align: center;
    }
    canvas {
      width: 100%;
      height: 340px;
      background: #020617;
      border: 1px solid #c084fc;
      border-radius: 8px;
      margin: 12px 0;
      display: block;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #38bdf8;
      background: #0d1322;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      margin-bottom: 8px;
    }
    .ctrl-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      background: #112233;
      color: #c084fc;
      border: 1px solid #c084fc;
      padding: 14px 20px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .btn:active {
      background: #c084fc;
      color: #04060b;
    }
    .back-link {
      display: block;
      margin-top: 14px;
      color: #c084fc;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="arcade-container">
    <div style="font-size: 11px; font-weight: 800; color: #c084fc; letter-spacing: 2px;">SYNDICATE ELITE • STANDALONE ARCADE</div>
    <h2 style="font-size: 1.2rem; color: #f8fafc; margin: 4px 0;">PRISM-GHOST: SPECTRUM HEIST</h2>
    
    <div class="hud-row">
      <span>Chapter: <strong id="hud-chapter" style="color: #f59e0b;">1</strong></span>
      <span>Score: <strong id="hud-score" style="color: #4ade80;">0</strong></span>
      <span>Lives: <strong id="hud-lives" style="color: #ff5555;">3</strong></span>
    </div>

    <canvas id="heistCanvas" width="440" height="340"></canvas>

    <div class="ctrl-row">
      <button class="btn" onclick="movePlayer(-1)">◀ Shift Left</button>
      <button class="btn" onclick="movePlayer(1)">Shift Right ▶</button>
    </div>
    <p id="game-status" style="font-size: 0.75rem; color: #4ade80; margin-top: 10px;">Status: Infiltrating Chapter 1 Vault. Dodge security droids!</p>
    
    <a href="index.html" class="back-link">← RETURN TO MAIN LEGACY HUB</a>
  </div>

  <script>
    const canvas = document.getElementById('heistCanvas');
    const ctx = canvas.getContext('2d');

    const prismImg = new Image();
    prismImg.src = 'prism-ghost-v2.png';

    let player = { x: 220, y: 250, width: 44, height: 64 };
    let droids = [];
    let keys = [];
    
    let score = 0;
    let lives = 3;
    let chapter = 1;
    let keysInChapter = 0;
    let gameIsOver = false;

    // Board themes per chapter
    const chapterThemes = {
      1: { name: "Chapter 1: Quantum Vault", bg: "#020617", droidSpeed: 2.5 },
      2: { name: "Chapter 2: Cyber-Mainframe", bg: "#09061a", droidSpeed: 3.5 },
      3: { name: "Chapter 3: Orbital Station", bg: "#120610", droidSpeed: 4.5 }
    };

    function spawnHazards() {
      if (gameIsOver) return;
      let currentTheme = chapterThemes[chapter];

      if (Math.random() < 0.035) {
        droids.push({
          x: Math.random() * (canvas.width - 50) + 25,
          y: -30,
          radius: 14,
          speed: Math.random() * 1.5 + currentTheme.droidSpeed
        });
      }
      if (Math.random() < 0.02 && keys.length < 2) {
        keys.push({
          x: Math.random() * (canvas.width - 50) + 25,
          y: -30,
          radius: 12,
          speed: 2.2
        });
      }
    }

    function movePlayer(dir) {
      if (gameIsOver) return;
      player.x += dir * 55;
      if (player.x < 30) player.x = 30;
      if (player.x > canvas.width - 30) player.x = canvas.width - 30;
    }

    function resetPlayerPosition() {
      player.x = 220;
      droids = [];
      keys = [];
    }

    function updateGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Dynamic Chapter Background Board
      canvas.style.background = chapterThemes[chapter].bg;

      if (!gameIsOver) {
        spawnHazards();
      }

      // Draw Grid Lines
      ctx.strokeStyle = 'rgba(192, 132, 252, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }

      // Render Prism-Ghost Sprite[span_0](start_span)[span_0](end_span)
      if (prismImg.complete && prismImg.naturalWidth !== 0) {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#c084fc';
        ctx.drawImage(prismImg, player.x - player.width / 2, player.y - player.height / 2, player.width, player.height);
        ctx.restore();
      } else {
        ctx.fillStyle = '#c084fc';
        ctx.beginPath(); ctx.arc(player.x, player.y, 22, 0, Math.PI * 2); ctx.fill();
      }

      // Update & Render Security Droids
      for (let i = droids.length - 1; i >= 0; i--) {
        let d = droids[i];
        if (!gameIsOver) d.y += d.speed;

        ctx.beginPath();
        ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff5555';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff5555';
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        // Collision Check (Lose a Life)
        let dist = Math.hypot(player.x - d.x, player.y - d.y);
        if (dist < 28 && !gameIsOver) {
          lives--;
          document.getElementById('hud-lives').innerText = lives;
          droids.splice(i, 1);

          if (lives <= 0) {
            gameIsOver = true;
            document.getElementById('game-status').innerText = "💀 GAME OVER: Restarting from Chapter 1...";
            setTimeout(() => {
              restartGame();
            }, 3000);
          } else {
            document.getElementById('game-status').innerText = "⚠️ HIT! Security droid breached shield. Life lost!";
            resetPlayerPosition();
          }
        } else if (d.y > canvas.height + 30) {
          droids.splice(i, 1);
        }
      }

      // Update & Render Vault Keys
      for (let i = keys.length - 1; i >= 0; i--) {
        let k = keys[i];
        if (!gameIsOver) k.y += k.speed;

        ctx.beginPath();
        ctx.arc(k.x, k.y, k.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#f59e0b';
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        let dist = Math.hypot(player.x - k.x, player.y - k.y);
        if (dist < 30 && !gameIsOver) {
          score += 150;
          keysInChapter++;
          document.getElementById('hud-score').innerText = score;
          keys.splice(i, 1);

          // Check Chapter Progression (3 Keys per Chapter)
          if (keysInChapter >= 3) {
            keysInChapter = 0;
            if (chapter < 3) {
              chapter++;
              document.getElementById('hud-chapter').innerText = chapter;
              document.getElementById('game-status').innerText = `🎉 ${chapterThemes[chapter-1].name} Cleared! Advancing...`;
              resetPlayerPosition();
            } else {
              gameIsOver = true;
              document.getElementById('game-status').innerText = "🏆 ULTIMATE HEIST SUCCESSFUL! Diamond & Necklace Secured!";
            }
          }
        } else if (k.y > canvas.height + 30) {
          keys.splice(i, 1);
        }
      }

      requestAnimationFrame(updateGame);
    }

    function restartGame() {
      score = 0;
      lives = 3;
      chapter = 1;
      keysInChapter = 0;
      gameIsOver = false;
      document.getElementById('hud-score').innerText = score;
      document.getElementById('hud-lives').innerText = lives;
      document.getElementById('hud-chapter').innerText = chapter;
      document.getElementById('game-status').innerText = "Status: Restarted Chapter 1. Good luck!";
      resetPlayerPosition();
    }

    prismImg.onload = () => { updateGame(); };
    setTimeout(() => { updateGame(); }, 200);
  </script>
</body>
</html>
