<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism-Ghost: Spectrum Heist • Syndicate Elite Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #04060b;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .arcade-cabinet {
      background: #090d16;
      border: 2px solid #c084fc;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 0 40px rgba(192, 132, 252, 0.35);
      text-align: center;
    }
    .cabinet-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .chapter-banner {
      font-size: 0.78rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .hud-bar {
      display: flex;
      justify-content: space-around;
      background: #0d1322;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      height: 300px;
      background: linear-gradient(to bottom, #020617 0%, #090d16 100%);
      border: 1px solid #c084fc;
      border-radius: 8px;
      display: block;
      margin-bottom: 14px;
      touch-action: none;
    }
    .control-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 260px;
      margin: 0 auto 10px;
    }
    .arcade-btn {
      background: #112233;
      color: #66fcf1;
      border: 1px solid #66fcf1;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .arcade-btn:active {
      background: #66fcf1;
      color: #04060b;
    }
    .btn-up { grid-column: 2; }
    .btn-left { grid-column: 1; }
    .btn-right { grid-column: 3; }
    .btn-down { grid-column: 2; }

    .special-btn {
      background: #581c87;
      color: #c084fc;
      border: 1px solid #c084fc;
      width: 100%;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .special-btn:active {
      background: #c084fc;
      color: #04060b;
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.78rem;
      margin-top: 10px;
      display: inline-block;
      text-transform: uppercase;
    }
    .back-link:hover {
      color: #c084fc;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="arcade-cabinet">
      <div class="cabinet-title">Prism-Ghost: Spectrum Heist</div>
      <div class="chapter-banner" id="chapterTitle">Chapter 1: Facility Perimeter & Lasers</div>
      
      <div class="hud-bar">
        <span>🏆 Score: <strong id="hud-score" style="color: #f59e0b;">0</strong></span>
        <span>🔑 Objectives: <strong id="hud-keys" style="color: #38bdf8;">0 / 3</strong></span>
        <span>❤️ Lives: <strong id="hud-lives" style="color: #ff5555;">3</strong></span>
      </div>

      <canvas id="gameCanvas" width="400" height="300"></canvas>

      <!-- Full Directional D-Pad Control Deck -->
      <div class="control-pad">
        <button class="arcade-btn btn-up" id="upBtn">▲</button>
        <button class="arcade-btn btn-left" id="leftBtn">◀</button>
        <button class="arcade-btn btn-right" id="rightBtn">▶</button>
        <button class="arcade-btn btn-down" id="downBtn">▼</button>
      </div>

      <button class="special-btn" id="decoyBtn">✨ Deploy Quantum Decoy & Vanish</button>
    </div>

    <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Load exact sprite filename from workspace
    const prismSprite = new Image();
    prismSprite.src = 'prism-ghost-v2.png';

    // Player Object (Prism-Ghost)
    let player = {
      x: canvas.width / 2 - 18,
      y: canvas.height - 60,
      width: 36,
      height: 44,
      speed: 4.8
    };

    // Objective Item (Vault Keys or Diamond Necklace)
    let objective = {
      x: canvas.width / 2,
      y: 60,
      radius: 10,
      type: 'key'
    };

    // Dynamic Hazards (Laser Beams & Proximity Mine Traps)
    let hazards = [
      { x: 30, y: 100, width: 110, speed: 2.2, dir: 1, type: 'laser' },
      { x: 200, y: 160, width: 90, speed: -2.8, dir: -1, type: 'laser' },
      { x: 150, y: 220, radius: 12, speed: 2.0, dir: 1, type: 'mine' }
    ];

    // Neon Cyber Grid Stars
    let stars = [];
    for (let i = 0; i < 45; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5,
        alpha: Math.random()
      });
    }

    let score = 0;
    let itemsCollected = 0;
    let lives = 3;
    let chapter = 1;
    let decoyActive = false;
    let gameActive = true;

    // Directional control bindings
    let moveUp = false;
    let moveDown = false;
    let moveLeft = false;
    let moveRight = false;

    const bindControl = (id, startVal, endVal) => {
      const btn = document.getElementById(id);
      btn.addEventListener('mousedown', () => window[startVal] = true);
      btn.addEventListener('mouseup', () => window[endVal] = false);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); window[startVal] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); window[endVal] = false; });
    };

    bindControl('upBtn', 'moveUp', 'moveUp');
    bindControl('downBtn', 'moveDown', 'moveDown');
    bindControl('leftBtn', 'moveLeft', 'moveLeft');
    bindControl('rightBtn', 'moveRight', 'moveRight');

    document.getElementById('decoyBtn').addEventListener('click', () => {
      decoyActive = true;
      document.getElementById('hud-shield').style.color = '#38bdf8';
      document.getElementById('hud-shield').innerText = 'STEALTH VANISH';
      setTimeout(() => {
        decoyActive = false;
        document.getElementById('hud-shield').style.color = '#4ade80';
        document.getElementById('hud-shield').innerText = 'ACTIVE';
      }, 3500);
    });

    function resetPlayer() {
      player.x = canvas.width / 2 - 18;
      player.y = canvas.height - 60;
    }

    function update() {
      if (!gameActive) return;

      // Full 360-degree directional freedom
      if (moveUp && player.y > 20) player.y -= player.speed;
      if (moveDown && player.y < canvas.height - player.height - 10) player.y += player.speed;
      if (moveLeft && player.x > 10) player.x -= player.speed;
      if (moveRight && player.x < canvas.width - player.width - 10) player.x += player.speed;

      // Hazard movement and collision
      hazards.forEach(h => {
        h.x += h.speed * h.dir;
        if (h.x <= 10 || h.x + (h.width || h.radius * 2) >= canvas.width - 10) h.dir *= -1;

        if (!decoyActive) {
          let hit = false;
          if (h.type === 'laser') {
            hit = player.x < h.x + h.width && player.x + player.width > h.x && player.y < h.y + 6 && player.y + player.height > h.y;
          } else {
            let dx = (player.x + player.width / 2) - h.x;
            let dy = (player.y + player.height / 2) - h.y;
            hit = Math.sqrt(dx * dx + dy * dy) < (player.width / 2) + h.radius;
          }

          if (hit) {
            lives--;
            document.getElementById('hud-lives').innerText = lives;
            if (lives <= 0) {
              gameActive = false;
              alert('💥 SECURITY DRONES DETECTED YOU! Mission Failed. Restarting Chapter...');
              location.reload();
            } else {
              resetPlayer();
            }
          }
        }
      });

      // Objective collection logic
      let distX = (player.x + player.width / 2) - objective.x;
      let distY = (player.y + player.height / 2) - objective.y;
      if (Math.sqrt(distX * distX + distY * distY) < (player.width / 2) + objective.radius) {
        itemsCollected++;
        score += 350;
        document.getElementById('hud-keys').innerText = `${itemsCollected} / 3`;
        document.getElementById('hud-score').innerText = score;
        
        if (itemsCollected >= 3) {
          if (chapter === 1) {
            // Chapter transition to Diamond Necklace Heist
            chapter = 2;
            itemsCollected = 0;
            document.getElementById('chapterTitle').innerText = "Chapter 2: Diamond Necklace Heist & Security Escape";
            document.getElementById('hud-keys').innerText = `0 / 3`;
            objective.type = 'diamond';
            hazards.push({ x: 80, y: 130, width: 100, speed: 4.0, dir: 1, type: 'laser' });
            alert('🔐 CHAPTER 1 SECURED! Entering Inner Vault for Diamond Necklace Extraction.');
            resetPlayer();
          } else {
            gameActive = false;
            alert(`🏆 ULTIMATE SPECTRUM HEIST SUCCESSFUL! Final Score: ${score}. Diamond Necklace Acquired!`);
            window.location.href = 'index.html';
          }
        } else {
          objective.x = Math.random() * (canvas.width - 80) + 40;
          objective.y = Math.random() * 120 + 40;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Night Cyber Grid & Starfield Background
      ctx.strokeStyle = 'rgba(192, 132, 252, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 30) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < canvas.height; j += 30) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      // Draw Objective Item (Key or Diamond Necklace)
      if (objective.type === 'key') {
        ctx.fillStyle = '#38bdf8';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        ctx.beginPath();
        ctx.arc(objective.x, objective.y, objective.radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Glowing Golden Diamond Necklace
        ctx.fillStyle = '#f59e0b';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#f59e0b';
        ctx.beginPath();
        ctx.arc(objective.x, objective.y, objective.radius + 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Hazards (Lasers & Mines)
      hazards.forEach(h => {
        if (h.type === 'laser') {
          ctx.fillStyle = '#ff5555';
          ctx.shadowColor = '#ff5555';
          ctx.fillRect(h.x, h.y, h.width, 5);
        } else {
          ctx.fillStyle = '#f59e0b';
          ctx.shadowColor = '#f59e0b';
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Render Prism-Ghost Sprite (`prism-ghost-v2.png`) with Quantum Stealth Vanish Effect
      if (prismSprite.complete && prismSprite.naturalWidth !== 0) {
        ctx.globalAlpha = decoyActive ? 0.3 : 1.0;
        ctx.shadowBlur = decoyActive ? 25 : 12;
        ctx.shadowColor = decoyActive ? '#38bdf8' : '#c084fc';
        ctx.drawImage(prismSprite, player.x, player.y, player.width, player.height);
        ctx.globalAlpha = 1.0;
      } else {
        ctx.fillStyle = decoyActive ? '#38bdf8' : '#c084fc';
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }
      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
