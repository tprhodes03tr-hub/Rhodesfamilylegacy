<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM-GHOST: SPECTRUM HEIST</title>
    <style>
        body {
            background-color: #0b0614;
            color: #d8b4fe;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }
        .cabinet {
            background: linear-gradient(135deg, #180d2b 0%, #0d0714 100%);
            border: 2px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            color: #e9d5ff;
            margin: 5px 0 10px 0;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }
        .hud {
            background: #1e1035;
            border: 1px solid #7e22ce;
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        canvas {
            background: #05020a;
            border: 1px solid #9333ea;
            border-radius: 6px;
            display: block;
            margin: 0 auto 10px auto;
            box-shadow: inset 0 0 15px rgba(147, 51, 234, 0.3);
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }
        button {
            background: #2e1065;
            color: #f3e8ff;
            border: 1px solid #a855f7;
            padding: 8px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active {
            background: #6b21a8;
            transform: scale(0.97);
        }
        .action-btn {
            grid-column: span 2;
            background: #581c87;
            border-color: #c084fc;
        }
        .hub-link {
            font-size: 10px;
            color: #a855f7;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }
        .hub-link:hover {
            color: #e9d5ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="cabinet">
    <div style="font-size: 9px; color: #c084fc; letter-spacing: 1px;">SYNDICATE ELITE • A-TIER ARCADE</div>
    <h2>PRISM-GHOST: SPECTRUM HEIST</h2>
    
    <div class="hud">
        <span id="chapter-label">CH: 1 / 4</span>
        <span id="shield-label">SHIELD: 100%</span>
        <span id="keys-label">KEYS: 0/3</span>
    </div>

    <canvas id="gameCanvas" width="340" height="200"></canvas>

    <div class="controls">
        <button onclick="movePlayer('LEFT')">◄ SHIFT LEFT</button>
        <button onclick="movePlayer('RIGHT')">SHIFT RIGHT ►</button>
        <button onclick="movePlayer('UP')">▲ STEP FORWARD</button>
        <button onclick="movePlayer('DOWN')">▼ STEP BACK</button>
        <button class="action-btn" onclick="deployDecoy()">✨ DEPLOY QUANTUM DECOY</button>
    </div>

    <a href="#" class="hub-link">← RETURN TO MAIN LEGACY HUB</a>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let chapter = 1;
let shield = 100;
let keysCollected = 0;
let targetKeys = 3;

// Player Position 
let playerX = 170;
let playerY = 160;

// Security Droids & Keys
let droids = [
    { x: 50, y: 50, speed: 2, dir: 1 },
    { x: 200, y: 90, speed: -2.5, dir: -1 },
    { x: 100, y: 130, speed: 1.8, dir: 1 }
];

let keys = [
    { x: 60, y: 50, collected: false },
    { x: 280, y: 90, collected: false },
    { x: 170, y: 130, collected: false }
];

function movePlayer(dir) {
    if (dir === 'LEFT') playerX -= 30;
    if (dir === 'RIGHT') playerX += 30;
    if (dir === 'UP') playerY -= 25;
    if (dir === 'DOWN') playerY += 25;

    // Boundaries
    if (playerX < 25) playerX = 25;
    if (playerX > 315) playerX = 315;
    if (playerY < 25) playerY = 25;
    if (playerY > 185) playerY = 185;
}

function deployDecoy() {
    droids.forEach(droid => {
        droid.x += (Math.random() - 0.5) * 60;
    });
}

function resetGame() {
    shield = 100;
    chapter = 1;
    keysCollected = 0;
    resetChapter();
}

function resetChapter() {
    keysCollected = 0;
    keys.forEach(k => {
        k.collected = false;
        k.x = Math.floor(Math.random() * 250) + 45;
        k.y = Math.floor(Math.random() * 120) + 40;
    });
    droids.forEach(d => {
        d.speed = (1.5 + (chapter * 0.6)) * (Math.random() > 0.5 ? 1 : -1);
    });
    playerX = 170;
    playerY = 160;
}

function update() {
    droids.forEach(droid => {
        droid.x += droid.speed;
        if (droid.x < 20 || droid.x > 320) {
            droid.speed *= -1;
        }

        // Collision Check
        let dist = Math.hypot(playerX - droid.x, playerY - droid.y);
        if (dist < 16) {
            shield -= 25;
            playerX = 170;
            playerY = 160;
            if (shield <= 0) {
                alert("CRITICAL BREACH! SHIELD DEPLETED. RESTARTING HEIST...");
                resetGame();
            }
        }
    });

    // Key Collection Check
    keys.forEach(k => {
        if (!k.collected) {
            let dist = Math.hypot(playerX - k.x, playerY - k.y);
            if (dist < 16) {
                k.collected = true;
                keysCollected++;
                if (keysCollected >= targetKeys) {
                    if (chapter < 4) {
                        chapter++;
                        alert(`VAULT SECURED! INFILTRATING CHAPTER ${chapter}`);
                        resetChapter();
                    } else {
                        alert("ULTIMATE HEIST COMPLETE! ALL VAULT CODES CRACKED.");
                        resetGame();
                    }
                }
            }
        }
    });
}

function draw() {
    ctx.fillStyle = '#05020a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Perspective Grid Lines
    ctx.strokeStyle = '#1e1b4b';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < canvas.width; i += 20) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 20) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    // Draw Keys
    keys.forEach(k => {
        if (!k.collected) {
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(k.x, k.y, 5, 0, Math.PI * 2);
            ctx.shadowColor = '#facc15';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    });

    // Draw Droids
    droids.forEach(droid => {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(droid.x - 14, droid.y - 3, 28, 6);
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10;
        ctx.fillRect(droid.x - 14, droid.y - 3, 28, 6);
        ctx.shadowBlur = 0;
    });

    // Draw Player
    ctx.fillStyle = '#c084fc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, 8, 0, Math.PI * 2);
    ctx.shadowColor = '#c084fc';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // HUD Update
    document.getElementById('chapter-label').innerText = `CH: ${chapter} / 4`;
    document.getElementById('shield-label').innerText = `SHIELD: ${shield}%`;
    document.getElementById('keys-label').innerText = `KEYS: ${keysCollected}/${targetKeys}`;
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
