<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism-Ghost & Mother Luta • Upgraded Tier Combat Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #04060b;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .arcade-cabinet {
      background: #090d16;
      border: 2px solid #66fcf1;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 0 35px rgba(102, 252, 241, 0.3);
      text-align: center;
    }
    .cabinet-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #66fcf1;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .hud-bar {
      display: flex;
      justify-content: space-around;
      background: #0d1322;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      height: 320px;
      background: radial-gradient(circle, #0f172a 0%, #020617 100%);
      border: 1px solid #66fcf1;
      border-radius: 8px;
      display: block;
      margin-bottom: 14px;
    }
    .control-deck {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
    }
    .arcade-btn {
      flex: 1;
      background: #112233;
      color: #66fcf1;
      border: 1px solid #66fcf1;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .arcade-btn:active {
      background: #66fcf1;
      color: #04060b;
    }
    .special-btn {
      background: #b45309;
      color: #fbbf24;
      border: 1px solid #fbbf24;
      width: 100%;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .special-btn:active {
      background: #fbbf24;
      color: #04060b;
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.78rem;
      margin-top: 10px;
      display: inline-block;
      text-transform: uppercase;
    }
    .back-link:hover {
      color: #66fcf1;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="arcade-cabinet">
      <div class="cabinet-title">Prism-Ghost & Mother Luta Arena</div>
      
      <div class="hud-bar">
        <span>⚡ Energy: <strong id="hud-energy" style="color: #4ade80;">100%</strong></span>
        <span>✨ Score: <strong id="hud-score" style="color: #f59e0b;">0</strong></span>
      </div>

      <canvas id="gameCanvas" width="480" height="320"></canvas>

      <div class="control-deck">
        <button class="arcade-btn" id="leftBtn">◀ Move Left</button>
        <button class="arcade-btn" id="rightBtn">Move Right ▶</button>
      </div>

      <button class="special-btn" id="fireBtn">🔥 Fire Feather Dart / Summon Energy Surge</button>
    </div>

    <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Load Sprite Assets
    const lutaSprite = new Image();
    lutaSprite.src = 'mother-luta.png';

    // Player Object
    let player = {
      x: 50,
      y: canvas.height - 90,
      width: 45,
      height: 60,
      speed: 5
    };

    // Projectiles
    let projectils = [];

    // Enemy Drones / Targets
    let enemies = [
      { x: 380, y: 80, width: 35, height: 35, speed: 1.5, active: true },
      { x: 420, y: 180, width: 35, height: 35, speed: -2, active: true }
    ];

    let score = 0;
    let energy = 100;

    // Controls
    let moveLeft = false;
    let moveRight = false;

    document.getElementById('leftBtn').addEventListener('mousedown', () => moveLeft = true);
    document.getElementById('leftBtn').addEventListener('mouseup', () => moveLeft = false);
    document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
    document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });

    document.getElementById('rightBtn').addEventListener('mousedown', () => moveRight = true);
    document.getElementById('rightBtn').addEventListener('mouseup', () => moveRight = false);
    document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
    document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });

    document.getElementById('fireBtn').addEventListener('click', () => {
      projectils.push({
        x: player.x + player.width,
        y: player.y + player.height / 2,
        width: 12,
        height: 6,
        speed: 8
      });
    });

    function update() {
      // Move Player
      if (moveLeft && player.x > 10) player.x -= player.speed;
      if (moveRight && player.x < canvas.width / 2) player.x += player.speed;

      // Update Projectiles
      projectils.forEach((p, index) => {
        p.x += p.speed;
        if (p.x > canvas.width) {
          projectils.splice(index, 1);
        }

        // Check collision with enemies
        enemies.forEach(enemy => {
          if (
            enemy.active &&
            p.x < enemy.x + enemy.width &&
            p.x + p.width > enemy.x &&
            p.y < enemy.y + enemy.height &&
            p.y + p.height > enemy.y
          ) {
            enemy.active = false;
            score += 100;
            document.getElementById('hud-score').innerText = score;
            projectils.splice(index, 1);

            // Respawn enemy after delay
            setTimeout(() => {
              enemy.active = true;
              enemy.y = Math.random() * 180 + 40;
            }, 2000);
          }
        });
      });

      // Move Enemies
      enemies.forEach(enemy => {
        if (enemy.active) {
          enemy.y += enemy.speed;
          if (enemy.y <= 30 || enemy.y >= canvas.height - 70) {
            enemy.speed *= -1;
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 30) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }

      // Draw Rendered Sprite (Mother Luta / Character)
      if (lutaSprite.complete) {
        ctx.drawImage(lutaSprite, player.x, player.y, player.width, player.height);
      } else {
        // Fallback glowing box if sprite loads
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // Draw Projectiles
      ctx.fillStyle = '#66fcf1';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#66fcf1';
      projectils.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
      });

      // Draw Enemies / Drones
      enemies.forEach(enemy => {
        if (enemy.active) {
          ctx.fillStyle = '#ff5555';
          ctx.shadowColor = '#ff5555';
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        }
      });
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
