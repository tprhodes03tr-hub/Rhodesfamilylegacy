<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism-Ghost: Spectrum Heist • Syndicate Elite Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #04060b;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .arcade-cabinet {
      background: #090d16;
      border: 2px solid #c084fc;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 0 35px rgba(192, 132, 252, 0.3);
      text-align: center;
    }
    .cabinet-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .hud-bar {
      display: flex;
      justify-content: space-around;
      background: #0d1322;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      height: 280px;
      background: #020617;
      border: 1px solid #c084fc;
      border-radius: 8px;
      display: block;
      margin-bottom: 14px;
      touch-action: none;
    }
    .control-deck {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
    }
    .arcade-btn {
      flex: 1;
      background: #112233;
      color: #66fcf1;
      border: 1px solid #66fcf1;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .arcade-btn:active {
      background: #66fcf1;
      color: #04060b;
    }
    .special-btn {
      background: #581c87;
      color: #c084fc;
      border: 1px solid #c084fc;
      width: 100%;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .special-btn:active {
      background: #c084fc;
      color: #04060b;
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.78rem;
      margin-top: 10px;
      display: inline-block;
      text-transform: uppercase;
    }
    .back-link:hover {
      color: #c084fc;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="arcade-cabinet">
      <div class="cabinet-title">Prism-Ghost: Spectrum Heist</div>
      
      <div class="hud-bar">
        <span>🛡️ Shield: <strong id="hud-shield" style="color: #4ade80;">ACTIVE</strong></span>
        <span>🔑 Vault Keys: <strong id="hud-keys" style="color: #f59e0b;">0 / 3</strong></span>
      </div>

      <canvas id="gameCanvas" width="400" height="280"></canvas>

      <div class="control-deck">
        <button class="arcade-btn" id="leftBtn">◀ Shift Left</button>
        <button class="arcade-btn" id="rightBtn">Shift Right ▶</button>
      </div>

      <button class="special-btn" id="decoyBtn">✨ Deploy Quantum Decoy & Scramble Sensors</button>
    </div>

    <a href="index.html" class="back-link">← Return to Main Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Player (Purple Dot)
    let player = {
      x: canvas.width / 2 - 12,
      y: canvas.height - 40,
      radius: 12,
      speed: 5,
      color: '#c084fc'
    };

    // Target Vault Key (Cyan Node)
    let keyNode = {
      x: Math.random() * (canvas.width - 60) + 30,
      y: 40,
      radius: 9,
      collected: 0
    };

    // Moving Laser Barriers (Red Beams)
    let lasers = [
      { x: 40, y: 80, width: 110, speed: 2, dir: 1 },
      { x: 160, y: 135, width: 90, speed: -2.5, dir: -1 },
      { x: 70, y: 195, width: 130, speed: 2.8, dir: 1 }
    ];

    let keysCollected = 0;
    let decoyActive = false;
    let gameActive = true;

    // Controls state
    let moveLeft = false;
    let moveRight = false;

    // Touch and Mouse Event Listeners for Shift Buttons
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    leftBtn.addEventListener('mousedown', () => moveLeft = true);
    leftBtn.addEventListener('mouseup', () => moveLeft = false);
    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
    leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });

    rightBtn.addEventListener('mousedown', () => moveRight = true);
    rightBtn.addEventListener('mouseup', () => moveRight = false);
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
    rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });

    document.getElementById('decoyBtn').addEventListener('click', () => {
      decoyActive = true;
      document.getElementById('hud-shield').style.color = '#38bdf8';
      document.getElementById('hud-shield').innerText = 'DECOY ENGAGED';
      setTimeout(() => {
        decoyActive = false;
        document.getElementById('hud-shield').style.color = '#4ade80';
        document.getElementById('hud-shield').innerText = 'ACTIVE';
      }, 3000);
    });

    function update() {
      if (!gameActive) return;

      // Handle movement
      if (moveLeft && player.x > player.radius + 5) player.x -= player.speed;
      if (moveRight && player.x < canvas.width - player.radius - 5) player.x += player.speed;

      // Animate and check lasers
      lasers.forEach(laser => {
        laser.x += laser.speed * laser.dir;
        if (laser.x <= 10 || laser.x + laser.width >= canvas.width - 10) {
          laser.dir *= -1;
        }

        // Collision detection with player dot
        if (!decoyActive) {
          if (
            player.x + player.radius > laser.x &&
            player.x - player.radius < laser.x + laser.width &&
            player.y + player.radius > laser.y &&
            player.y - player.radius < laser.y + 6
          ) {
            // Hit laser penalty: bounce player back to start position
            player.x = canvas.width / 2;
            player.y = canvas.height - 40;
          }
        }
      });

      // Check key collection
      let distX = player.x - keyNode.x;
      let distY = player.y - keyNode.y;
      let distance = Math.sqrt(distX * distX + distY * distY);

      if (distance < player.radius + keyNode.radius) {
        keysCollected++;
        document.getElementById('hud-keys').innerText = `${keysCollected} / 3`;
        
        if (keysCollected >= 3) {
          gameActive = false;
          alert('🎉 SPECTRUM HEIST SUCCESSFUL! All 3 Vault Keys Secured!');
          window.location.href = 'index.html';
        } else {
          // Relocate key node to a new random spot
          keyNode.x = Math.random() * (canvas.width - 60) + 30;
          keyNode.y = Math.random() * 90 + 35;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Background lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 25) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < canvas.height; j += 25) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
      }

      // Draw Cyan Key Node
      ctx.fillStyle = '#66fcf1';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#66fcf1';
      ctx.beginPath();
      ctx.arc(keyNode.x, keyNode.y, keyNode.radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw Red Moving Laser Beams
      ctx.fillStyle = '#ff5555';
      ctx.shadowColor = '#ff5555';
      lasers.forEach(laser => {
        ctx.fillRect(laser.x, laser.y, laser.width, 5);
      });

      // Draw Player Purple Dot
      ctx.fillStyle = decoyActive ? '#38bdf8' : player.color;
      ctx.shadowColor = decoyActive ? '#38bdf8' : '#c084fc';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
