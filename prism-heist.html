<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism-Ghost: Spectrum Heist • Vault Infiltration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .arcade-container {
      width: 100%;
      max-width: 480px;
      background: #090d16;
      border: 2px solid #c084fc;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 0 30px rgba(192, 132, 252, 0.3);
      text-align: center;
    }
    canvas {
      width: 100%;
      height: 340px;
      background: #020617;
      border: 1px solid #c084fc;
      border-radius: 8px;
      margin: 12px 0;
    }
    .ctrl-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      background: #112233;
      color: #c084fc;
      border: 1px solid #c084fc;
      padding: 12px 20px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      text-transform: uppercase;
    }
    .btn:active {
      background: #c084fc;
      color: #04060b;
    }
  </style>
</head>
<body>

  <div class="arcade-container">
    <div style="font-size: 11px; font-weight: 800; color: #c084fc; letter-spacing: 2px;">SYNDICATE ELITE • VAULT HEIST</div>
    <h2 style="font-size: 1.2rem; color: #f8fafc; margin: 6px 0;">PRISM-GHOST: SPECTRUM HEIST</h2>
    <div style="font-size: 0.78rem; color: #38bdf8; margin-bottom: 8px;">
      Keys Secured: <span id="key-count">0</span>/3 | Shield: <span id="player-shield">100%</span>
    </div>

    <canvas id="heistCanvas" width="440" height="340"></canvas>

    <div class="ctrl-row">
      <button class="btn" ontouchstart="movePlayer(-1)" onclick="movePlayer(-1)">◀ Shift Left</button>
      <button class="btn" ontouchstart="movePlayer(1)" onclick="movePlayer(1)">Shift Right ▶</button>
    </div>
    <p id="game-status" style="font-size: 0.75rem; color: #4ade80; margin-top: 10px;">Status: Infiltrating grid. Dodge security droids to steal vault keys!</p>
  </div>

  <script>
    const canvas = document.getElementById('heistCanvas');
    const ctx = canvas.getContext('2d');

    // Load Prism-Ghost Sprite (`prism-ghost-v2.png`)[span_1](start_span)[span_1](end_span)
    const prismImg = new Image();
    prismImg.src = 'prism-ghost-v2.png';

    let player = { x: 200, y: 240, width: 45, height: 65, speed: 10 };
    let droids = [];
    let keys = [];
    let scoreKeys = 0;
    let shield = 100;
    let gameOver = false;

    function spawnHazards() {
      if (gameOver) return;
      // Falling Security Droids
      if (Math.random() < 0.035) {
        droids.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -30,
          radius: 14,
          speed: Math.random() * 2 + 2.5
        });
      }
      // Falling Vault Keys / Data Crystals
      if (Math.random() < 0.02 && keys.length < 3) {
        keys.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -30,
          radius: 12,
          speed: 2
        });
      }
    }

    function movePlayer(dir) {
      player.x += dir * 40;
      if (player.x < 25) player.x = 25;
      if (player.x > canvas.width - 25) player.x = canvas.width - 25;
    }

    function updateGame() {
      if (gameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      spawnHazards();

      // Draw Grid Lines for Quantum Stealth Feel
      ctx.strokeStyle = 'rgba(192, 132, 252, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }

      // Render Prism-Ghost Sprite (`prism-ghost-v2.png`)[span_2](start_span)[span_2](end_span)
      if (prismImg.complete) {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#c084fc';
        ctx.drawImage(prismImg, player.x - player.width / 2, player.y - player.height / 2, player.width, player.height);
        ctx.restore();
      } else {
        // Fallback placeholder if image is loading
        ctx.fillStyle = '#c084fc';
        ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, Math.PI * 2); ctx.fill();
      }

      // Render & Update Droids
      for (let i = droids.length - 1; i >= 0; i--) {
        let d = droids[i];
        d.y += d.speed;

        ctx.beginPath();
        ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff5555';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff5555';
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        // Collision check
        let dist = Math.hypot(player.x - d.x, player.y - d.y);
        if (dist < 25) {
          shield -= 25;
          document.getElementById('player-shield').innerText = shield + '%';
          droids.splice(i, 1);
          if (shield <= 0) {
            gameOver = true;
            document.getElementById('game-status').innerText = "⚠️ SYSTEM BREACHED: Security Droids Neutralized Heist!";
          }
        } else if (d.y > canvas.height + 30) {
          droids.splice(i, 1);
        }
      }

      // Render & Update Vault Keys
      for (let i = keys.length - 1; i >= 0; i--) {
        let k = keys[i];
        k.y += k.speed;

        ctx.beginPath();
        ctx.arc(k.x, k.y, k.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#f59e0b';
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        let dist = Math.hypot(player.x - k.x, player.y - k.y);
        if (dist < 28) {
          scoreKeys++;
          document.getElementById('key-count').innerText = scoreKeys;
          keys.splice(i, 1);
          if (scoreKeys >= 3) {
            gameOver = true;
            document.getElementById('game-status').innerText = "🎉 VAULT CRACKED! Gold Diamond & Necklace Secured!";
          }
        } else if (k.y > canvas.height + 30) {
          keys.splice(i, 1);
        }
      }

      requestAnimationFrame(updateGame);
    }

    prismImg.onload = () => {
      updateGame();
    };
    // Fallback start if image is already cached
    setTimeout(() => { if (!gameOver && droids.length === 0) updateGame(); }, 500);
  </script>
</body>
</html>
