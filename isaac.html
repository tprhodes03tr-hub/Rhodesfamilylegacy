<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Isaac Rhodes Adventures - Chronolock Battle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
    
    /* Responsive Game Container */
    #game-wrapper {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      border: 2px solid #00e5ff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
      overflow: hidden;
      background: #060913;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Top HUD */
    .hud-overlay {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .hud-box { display: flex; flex-direction: column; gap: 3px; }
    .bar-bg { width: 110px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
    .bar-fill { height: 100%; transition: width 0.15s ease; }
    #marcus-hp-fill { background: #00e676; width: 100%; }
    #boss-hp-fill { background: #ff1744; width: 100%; }
    .stat-text { color: #00e5ff; text-shadow: 0 0 4px rgba(0,229,255,0.8); }
    .boss-stat-text { color: #ff5252; text-align: right; text-shadow: 0 0 4px rgba(255,23,68,0.8); }

    /* Control Panel */
    .controls-grid {
      width: 100%;
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    button {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 12px 4px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    button:active { transform: translateY(2px); filter: brightness(1.2); }
    button span.sub { font-size: 8px; opacity: 0.7; margin-top: 2px; }

    .btn-luetta { background: #f59e0b; border-color: #d97706; color: #111; grid-column: span 1; }
    .btn-shield { background: #0284c7; border-color: #0369a1; }
    .btn-strike { background: #dc2626; border-color: #b91c1c; }

    .info-tray {
      width: 100%;
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div id="canvas-container">
    <canvas id="gameCanvas" width="480" height="260"></canvas>
    
    <div class="hud-overlay">
      <div class="hud-box">
        <span class="stat-text">MARCUS HP: <span id="marcus-hp-val">120</span></span>
        <div class="bar-bg"><div id="marcus-hp-fill" class="bar-fill"></div></div>
        <span class="stat-text" style="font-size:9px; color:#38bdf8;">VOLT CHARGE: <span id="volt-val">5/5</span></span>
      </div>
      <div class="hud-box" style="align-items: flex-end;">
        <span class="boss-stat-text">APEX VOLT: <span id="boss-hp-val">160</span></span>
        <div class="bar-bg"><div id="boss-hp-fill" class="bar-fill"></div></div>
        <span style="font-size:8px; color:#f87171; letter-spacing:1px;">CHRONOLOCK ACTIVE</span>
      </div>
    </div>
  </div>

  <div class="controls-grid">
    <button id="btn-left">◀<span class="sub">LEFT</span></button>
    <button id="btn-right">▶<span class="sub">RIGHT</span></button>
    <button id="btn-luetta" class="btn-luetta">AID<span class="sub">M. LUETTA</span></button>
    <button id="btn-shield" class="btn-shield">SHIELD<span class="sub">ABSORB</span></button>
  </div>
  <div style="width: 100%; margin-top: 6px;">
    <button id="btn-strike" class="btn-strike" style="width: 100%; padding: 14px 0; font-size: 13px;">⚡ VOLT STRIKE</button>
  </div>

  <div class="info-tray">
    Shield absorbs kinetic drone fire into counter-voltage. Call Mother Luetta for holy energy support.
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Load Sprites directly from root repository files
  const marcusImg = new Image();
  marcusImg.src = 'marcus.png';

  const luettaImg = new Image();
  luettaImg.src = 'mother-luetta.png';

  // Loads Apex Volt from your exact repository screenshot filename
  const apexImg = new Image();
  apexImg.src = 'Screenshot_20260918_130602_Photos.jpg';

  // Game States
  let marcus = { x: 50, y: 140, w: 46, h: 74, hp: 120, maxHp: 120, volt: 5, shield: false };
  let boss = { x: 380, y: 130, w: 55, h: 84, hp: 160, maxHp: 160 };
  let luettaAssist = { active: false, timer: 0, x: 50, y: 30 };
  let projectiles = [];
  let sparks = [];

  // Controls
  let moveLeft = false, moveRight = false;
  
  const setupHoldBtn = (id, startAction, endAction) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); startAction(); });
    window.addEventListener('pointerup', endAction);
  };

  setupHoldBtn('btn-left', () => moveLeft = true, () => moveLeft = false);
  setupHoldBtn('btn-right', () => moveRight = true, () => moveRight = false);
  setupHoldBtn('btn-shield', () => marcus.shield = true, () => marcus.shield = false);

  document.getElementById('btn-strike').addEventListener('click', () => {
    if (marcus.volt > 0) {
      marcus.volt--;
      document.getElementById('volt-val').innerText = marcus.volt + "/5";
      projectiles.push({ x: marcus.x + marcus.w, y: marcus.y + marcus.h / 2, vx: 7, isHero: true });
    }
  });

  document.getElementById('btn-luetta').addEventListener('click', () => {
    if (!luettaAssist.active) {
      luettaAssist.active = true;
      luettaAssist.timer = 90;
      luettaAssist.x = marcus.x + 20;
      marcus.hp = Math.min(marcus.maxHp, marcus.hp + 25);
      marcus.volt = 5;
      document.getElementById('marcus-hp-val').innerText = marcus.hp;
      document.getElementById('volt-val').innerText = "5/5";
      updateHpBars();
    }
  });

  // Boss attack loop
  setInterval(() => {
    if (boss.hp > 0) {
      projectiles.push({ x: boss.x - 10, y: boss.y + 35, vx: -4, isHero: false });
    }
  }, 1600);

  function updateHpBars() {
    document.getElementById('marcus-hp-fill').style.width = Math.max(0, (marcus.hp / marcus.maxHp) * 100) + '%';
    document.getElementById('boss-hp-fill').style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
  }

  function loop() {
    // 1. Move Player
    if (moveLeft && marcus.x > 10) marcus.x -= 3;
    if (moveRight && marcus.x < boss.x - 70) marcus.x += 3;

    // 2. Clear Scene
    ctx.fillStyle = '#090e1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 3. Environment: Sci-Fi Tech Floor & Grid
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 214);
      ctx.lineTo(x - 20, canvas.height);
      ctx.stroke();
    }
    // Metallic Conduit Deck Line
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 214, canvas.width, 4);
    ctx.fillStyle = '#00e5ff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 8;
    ctx.fillRect(0, 214, canvas.width, 1);
    ctx.shadowBlur = 0; // reset

    // 4. Draw Marcus
    if (marcusImg.complete && marcusImg.naturalWidth !== 0) {
      ctx.drawImage(marcusImg, marcus.x, marcus.y, marcus.w, marcus.h);
    } else {
      ctx.fillStyle = '#00bcd4';
      ctx.fillRect(marcus.x, marcus.y, marcus.w, marcus.h);
    }

    // Marcus Electric Shield Effect
    if (marcus.shield) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(marcus.x + marcus.w / 2, marcus.y + marcus.h / 2, 38, 0, Math.PI * 2);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 12;
      ctx.stroke();

      // Inner electric arc
      ctx.beginPath();
      ctx.arc(marcus.x + marcus.w / 2, marcus.y + marcus.h / 2, 34, Math.random(), Math.PI + Math.random());
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // 5. Draw Boss (Apex Volt)
    if (apexImg.complete && apexImg.naturalWidth !== 0) {
      ctx.drawImage(apexImg, boss.x, boss.y, boss.w, boss.h);
    } else {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
    }

    // 6. Draw Mother Luetta Celestial Assist
    if (luettaAssist.active) {
      luettaAssist.timer--;
      ctx.save();
      ctx.globalAlpha = Math.min(1, luettaAssist.timer / 20);
      
      // Radiant Beam
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.lineWidth = 20;
      ctx.beginPath();
      ctx.moveTo(luettaAssist.x + 20, 0);
      ctx.lineTo(marcus.x + marcus.w / 2, marcus.y + marcus.h);
      ctx.stroke();

      if (luettaImg.complete && luettaImg.naturalWidth !== 0) {
        ctx.drawImage(luettaImg, luettaAssist.x, luettaAssist.y, 45, 50);
      }
      ctx.restore();

      if (luettaAssist.timer <= 0) luettaAssist.active = false;
    }

    // 7. Projectiles Loop
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let p = projectiles[i];
      p.x += p.vx;

      if (p.isHero) {
        // Marcus Volt Strike Bolt
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(p.x, p.y - 2, 14, 5);
        ctx.shadowBlur = 0;

        // Hit Boss
        if (p.x >= boss.x) {
          boss.hp = Math.max(0, boss.hp - 12);
          document.getElementById('boss-hp-val').innerText = boss.hp;
          updateHpBars();
          projectiles.splice(i, 1);
          continue;
        }
      } else {
        // Enemy Kinetic Dart
        ctx.fillStyle = '#f87171';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Hit Player or Shield
        if (p.x <= marcus.x + marcus.w && p.x >= marcus.x) {
          if (marcus.shield) {
            marcus.volt = Math.min(5, marcus.volt + 1);
            document.getElementById('volt-val').innerText = marcus.volt + "/5";
          } else {
            marcus.hp = Math.max(0, marcus.hp - 10);
            document.getElementById('marcus-hp-val').innerText = marcus.hp;
            updateHpBars();
          }
          projectiles.splice(i, 1);
          continue;
        }
      }

      // Off-screen purge
      if (p.x < 0 || p.x > canvas.width) {
        projectiles.splice(i, 1);
      }
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
