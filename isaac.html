<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Isaac the Speedrunner • High-Speed Sonic Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #020617;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Georgia', serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Universal Nav */
    .nav-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      margin-bottom: 10px;
    }
    .nav-bar a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 4px 8px;
      background: #1e293b;
      border-radius: 4px;
    }
    .nav-bar a.active {
      color: #38bdf8;
      border: 1px solid #38bdf8;
      background: #0369a1;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* Touch Controls */
    .touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
      padding: 0 12px;
    }
    .d-pad {
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: #38bdf8;
      color: #020617;
      transform: scale(0.92);
    }
    .action-btn-group {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, #0284c7 0%, #0369a1 100%);
      border: 2px solid #38bdf8;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .action-btn.spin {
      background: radial-gradient(circle, #e11d48 0%, #9f1239 100%);
      border-color: #fb7185;
      box-shadow: 0 0 12px rgba(225, 29, 72, 0.4);
    }
    .action-btn:active {
      transform: scale(0.92);
    }
    .banner {
      width: 100%;
      max-width: 600px;
      padding: 8px;
      text-align: center;
      font-size: 0.72rem;
      color: #facc15;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Isaac The Speedrunner</h1>
    <div class="subtitle">High Velocity Sonic Zone • Emerald Rush</div>
  </header>

  <nav class="nav-bar">
    <a href="index.html">🛡️ Marrow Action</a>
    <a href="retro.html">🕹️ Retro Classics</a>
    <a href="odyssey.html">🚀 Odyssey</a>
    <a href="isaac.html" class="active">⚡ Isaac Speed</a>
    <a href="puzzle.html">🧩 Puzzle</a>
  </nav>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="320"></canvas>
  </div>

  <div class="touch-controls">
    <div class="d-pad">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-down">▼</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <div class="action-btn-group">
      <button class="action-btn spin" id="btn-spin">SPIN</button>
      <button class="action-btn" id="btn-jump">JUMP</button>
    </div>
  </div>

  <div class="banner">
    ⚡ <strong>Controls:</strong> Hold Left/Right to build momentum! Press <strong>DOWN</strong> while running to Spin-Dash roll into enemies!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WORLD_WIDTH = 3400;
    const GROUND_Y = 270;

    let cameraX = 0;
    let score = 0;
    let rings = 0;
    let timer = 0;
    let screenShake = 0;

    const input = { left: false, right: false, down: false, jump: false, spin: false };

    function bindBtn(id, key) {
      const el = document.getElementById(id);
      const setTrue = (e) => { e.preventDefault(); input[key] = true; };
      const setFalse = (e) => { e.preventDefault(); input[key] = false; };
      el.addEventListener('touchstart', setTrue);
      el.addEventListener('touchend', setFalse);
      el.addEventListener('mousedown', setTrue);
      el.addEventListener('mouseup', setFalse);
      el.addEventListener('mouseleave', setFalse);
    }
    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');
    bindBtn('btn-down', 'down');
    bindBtn('btn-jump', 'jump');
    bindBtn('btn-spin', 'spin');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
      if (e.key === 'ArrowDown' || e.key === 's') input.down = true;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') input.jump = true;
      if (e.key === 'Shift' || e.key === 'j') input.spin = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
      if (e.key === 'ArrowDown' || e.key === 's') input.down = false;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') input.jump = false;
      if (e.key === 'Shift' || e.key === 'j') input.spin = false;
    });

    // Sonic Momentum Physics State
    const isaac = {
      x: 100,
      y: GROUND_Y - 50,
      w: 26,
      h: 52,
      vx: 0,
      vy: 0,
      accel: 0.18,
      maxSpeed: 9.5,
      friction: 0.96,
      gravity: 0.38,
      isGrounded: false,
      isRolling: false,
      facing: 1,
      animTime: 0,
      invuln: 0
    };

    // Terrain, Ramps, & Springs
    const platforms = [
      { x: 0, y: GROUND_Y, w: WORLD_WIDTH, h: 50 },
      { x: 300, y: 220, w: 180, h: 14 },
      { x: 580, y: 170, w: 200, h: 14 },
      { x: 920, y: 220, w: 160, h: 14 },
      { x: 1200, y: 160, w: 240, h: 14 },
      { x: 1560, y: 210, w: 220, h: 14 },
      { x: 1900, y: 150, w: 300, h: 14 },
      { x: 2350, y: 200, w: 250, h: 14 },
      { x: 2750, y: 160, w: 350, h: 14 }
    ];

    // Springs & Boost Pads
    const springs = [
      { x: 500, y: GROUND_Y - 14, w: 28, h: 14, force: -11 },
      { x: 1140, y: GROUND_Y - 14, w: 28, h: 14, force: -12.5 },
      { x: 1820, y: GROUND_Y - 14, w: 28, h: 14, force: -13 }
    ];

    const boostPads = [
      { x: 800, y: GROUND_Y - 8, w: 36, h: 8, boost: 12 },
      { x: 2250, y: GROUND_Y - 8, w: 36, h: 8, boost: 13 }
    ];

    // Golden Sonic Rings
    let ringList = [];
    for (let x = 200; x < 3200; x += 60) {
      ringList.push({ x, y: GROUND_Y - 30 - (x % 180 === 0 ? 60 : 0), collected: false });
    }

    // Badnik Drones
    let enemies = [
      { x: 450, y: GROUND_Y - 40, w: 28, h: 28, vx: -1.2, minX: 350, maxX: 550, alive: true },
      { x: 1050, y: GROUND_Y - 40, w: 28, h: 28, vx: 1.5, minX: 950, maxX: 1180, alive: true },
      { x: 1700, y: 210 - 32, w: 28, h: 28, vx: -1.4, minX: 1580, maxX: 1750, alive: true },
      { x: 2500, y: GROUND_Y - 40, w: 28, h: 28, vx: 1.6, minX: 2400, maxX: 2650, alive: true }
    ];

    let particles = [];
    let speedLines = [];

    function spawnHitFX(x, y, color = '#facc15', count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 25,
          color,
          size: 3 + Math.random() * 2
        });
      }
    }

    let jumpPrev = false;

    function update() {
      timer++;

      // High-Speed Momentum
      if (input.right) {
        isaac.vx += isaac.accel;
        isaac.facing = 1;
      } else if (input.left) {
        isaac.vx -= isaac.accel;
        isaac.facing = -1;
      } else {
        isaac.vx *= isaac.friction;
      }

      // Max Speed Cap
      if (isaac.vx > isaac.maxSpeed) isaac.vx = isaac.maxSpeed;
      if (isaac.vx < -isaac.maxSpeed) isaac.vx = -isaac.maxSpeed;
      if (Math.abs(isaac.vx) < 0.05) isaac.vx = 0;

      // Spin-Dash / Roll Mechanic
      if ((input.down || input.spin) && Math.abs(isaac.vx) > 2) {
        isaac.isRolling = true;
        isaac.vx += isaac.facing * 0.15; // Extra roll propulsion
      } else if (!input.down && !input.spin) {
        isaac.isRolling = false;
      }

      // Jump Execution
      if (input.jump && !jumpPrev && isaac.isGrounded) {
        isaac.vy = -8.8;
        isaac.isGrounded = false;
        spawnHitFX(isaac.x + isaac.w / 2, isaac.y + isaac.h, '#38bdf8', 6);
      }
      jumpPrev = input.jump;

      // Gravity & Kinematics
      isaac.vy += isaac.gravity;
      isaac.x += isaac.vx;
      isaac.y += isaac.vy;

      // World Boundary
      if (isaac.x < 0) isaac.x = 0;
      if (isaac.x > WORLD_WIDTH - isaac.w) isaac.x = WORLD_WIDTH - isaac.w;

      // Platform Collisions
      isaac.isGrounded = false;
      platforms.forEach(plat => {
        if (
          isaac.x + isaac.w > plat.x &&
          isaac.x < plat.x + plat.w &&
          isaac.y + isaac.h >= plat.y &&
          isaac.y + isaac.h - isaac.vy <= plat.y + 14 &&
          isaac.vy >= 0
        ) {
          isaac.y = plat.y - isaac.h;
          isaac.vy = 0;
          isaac.isGrounded = true;
        }
      });

      // Springs Collision
      springs.forEach(s => {
        if (
          isaac.x + isaac.w > s.x &&
          isaac.x < s.x + s.w &&
          isaac.y + isaac.h >= s.y &&
          isaac.y + isaac.h - isaac.vy <= s.y + 12
        ) {
          isaac.vy = s.force;
          isaac.isGrounded = false;
          screenShake = 6;
          spawnHitFX(s.x + s.w / 2, s.y, '#ef4444', 12);
        }
      });

      // Boost Pads
      boostPads.forEach(b => {
        if (
          isaac.x + isaac.w > b.x &&
          isaac.x < b.x + b.w &&
          isaac.y + isaac.h >= b.y &&
          isaac.y + isaac.h <= b.y + 12
        ) {
          isaac.vx = isaac.facing * b.boost;
          screenShake = 4;
          spawnHitFX(b.x + b.w / 2, b.y, '#38bdf8', 8);
        }
      });

      // Collect Rings
      ringList.forEach(r => {
        if (!r.collected && Math.hypot((isaac.x + isaac.w / 2) - r.x, (isaac.y + isaac.h / 2) - r.y) < 22) {
          r.collected = true;
          rings++;
          score += 100;
          spawnHitFX(r.x, r.y, '#facc15', 5);
        }
      });

      // Badnik Enemy Interaction
      if (isaac.invuln > 0) isaac.invuln--;

      enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.vx;
        if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;

        if (
          isaac.x + isaac.w > e.x &&
          isaac.x < e.x + e.w &&
          isaac.y + isaac.h > e.y &&
          isaac.y < e.y + e.h
        ) {
          // If Isaac is rolling or landing on top, destroy enemy
          if (isaac.isRolling || (!isaac.isGrounded && isaac.vy > 0)) {
            e.alive = false;
            isaac.vy = -6; // Bounce
            score += 200;
            screenShake = 6;
            spawnHitFX(e.x + e.w / 2, e.y + e.h / 2, '#ef4444', 14);
          } else if (isaac.invuln === 0) {
            // Take hit & drop rings
            if (rings > 0) {
              rings = Math.max(0, rings - 10);
              isaac.invuln = 60;
              isaac.vy = -5;
              isaac.vx = -isaac.facing * 4;
              screenShake = 8;
              spawnHitFX(isaac.x, isaac.y, '#facc15', 18);
            }
          }
        }
      });

      // Camera Follow Tracking Isaac at Full Speed
      const targetCamX = isaac.x + isaac.w / 2 - canvas.width / 2;
      cameraX += (targetCamX - cameraX) * 0.12;
      cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));

      if (screenShake > 0) screenShake *= 0.85;
      isaac.animTime += Math.abs(isaac.vx) * 0.08 + 0.05;

      // Speed Wind Lines
      if (Math.abs(isaac.vx) > 7) {
        speedLines.push({
          x: isaac.x + (isaac.facing === 1 ? -10 : isaac.w + 10),
          y: isaac.y + Math.random() * isaac.h,
          vx: -isaac.vx * 0.8,
          life: 12
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      if (screenShake > 0.2) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // 1. Sonic Emerald Hill Style Gradient Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(0.5, '#38bdf8');
      skyGrad.addColorStop(1, '#67e8f9');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Ocean / Mountains
      ctx.fillStyle = '#0369a1';
      for (let i = 0; i < 12; i++) {
        const mx = i * 160 - (cameraX * 0.1 % 160);
        ctx.beginPath();
        ctx.moveTo(mx, GROUND_Y);
        ctx.lineTo(mx + 80, 110);
        ctx.lineTo(mx + 160, GROUND_Y);
        ctx.fill();
      }

      // Checkered Green Hill Pattern (Sonic Grid)
      ctx.save();
      ctx.translate(-cameraX, 0);

      platforms.forEach(plat => {
        // Platform Base
        ctx.fillStyle = '#15803d'; // Green Grass Top
        ctx.fillRect(plat.x, plat.y, plat.w, 8);

        // Brown Checker Soil
        ctx.fillStyle = '#78350f';
        ctx.fillRect(plat.x, plat.y + 8, plat.w, plat.h - 8);

        // Sonic Checkered Grid details
        ctx.fillStyle = '#92400e';
        for (let x = plat.x; x < plat.x + plat.w; x += 20) {
          for (let y = plat.y + 8; y < plat.y + plat.h; y += 20) {
            if ((x / 20 + y / 20) % 2 === 0) {
              ctx.fillRect(x, y, 10, 10);
            }
          }
        }
      });

      // Springs (Red)
      springs.forEach(s => {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#fecaca';
        ctx.fillRect(s.x + 4, s.y + 2, s.w - 8, 3);
      });

      // Boost Pads (Yellow / Cyan)
      boostPads.forEach(b => {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#0284c7';
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(b.x + 6 + i * 10, b.y + 2, 4, 4);
        }
      });

      // Spinning Golden Rings
      ringList.forEach(r => {
        if (!r.collected) {
          const squish = Math.abs(Math.sin(isaac.animTime * 2 + r.x));
          ctx.save();
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.ellipse(r.x, r.y, 7 * squish + 1, 9, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      });

      // Badnik Drones
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#475569';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(e.x + 4, e.y + 6, e.w - 8, 8); // Red Visor
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(e.x + 8, e.y + e.h, 4, 6); // Jet
      });

      // Speed Trail Lines
      speedLines.forEach((l, idx) => {
        l.x += l.vx;
        l.life--;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x - l.vx * 2, l.y);
        ctx.stroke();
        if (l.life <= 0) speedLines.splice(idx, 1);
      });

      // Draw Custom Isaac Sonic-Style Character
      drawIsaacCharacter();

      // FX Particles
      particles.forEach((pt, idx) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        if (pt.life <= 0) particles.splice(idx, 1);
      });

      ctx.restore(); // End World
      ctx.restore(); // End Shake

      drawHUD();
    }

    // Custom Isaac Character Renderer (Long Curly Hair, Glasses, Green Shirt, Blue Shorts)
    function drawIsaacCharacter() {
      const x = isaac.x;
      const y = isaac.y;
      const w = isaac.w;
      const h = isaac.h;

      ctx.save();

      // Flash on Invulnerability
      if (isaac.invuln > 0 && Math.floor(timer / 4) % 2 === 0) {
        ctx.restore();
        return;
      }

      if (isaac.isRolling) {
        // Sonic Spin-Ball State (Cyan / Green Energy Sphere)
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2 + 8, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2 + 8, 14, isaac.animTime * 6, isaac.animTime * 6 + Math.PI);
        ctx.stroke();
        ctx.restore();
        return;
      }

      const isRunning = Math.abs(isaac.vx) > 0.5;
      const stride = isRunning ? Math.sin(isaac.animTime * 8) * 8 : 0;
      const bob = isRunning ? Math.abs(Math.sin(isaac.animTime * 8)) * 3 : 0;

      // 1. Long Voluminous Curly Hair (Back Layer)
      ctx.fillStyle = '#1e1b18';
      ctx.fillRect(x + (isaac.facing === 1 ? -4 : 6), y + 4 - bob, 14, 28);

      // 2. Athletic Blue Shorts & Legs
      ctx.fillStyle = '#1d4ed8'; // Royal Blue Shorts
      ctx.fillRect(x + 4, y + 28 - bob, w - 8, 12);
      ctx.fillStyle = '#fff'; // White side stripe
      ctx.fillRect(isaac.facing === 1 ? x + w - 6 : x + 4, y + 28 - bob, 2, 12);

      // Legs / Running Stride
      ctx.fillStyle = '#8d5b4c'; // Warm Skin Tone
      ctx.fillRect(x + 5, y + 40 - bob, 6, 10 + stride);
      ctx.fillRect(x + w - 11, y + 40 - bob, 6, 10 - stride);

      // Red & White Sonic Speed Sneakers
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x + 3, y + 48 - bob + stride, 10, 6);
      ctx.fillRect(x + w - 13, y + 48 - bob - stride, 10, 6);
      ctx.fillStyle = '#fff'; // White buckle stripe
      ctx.fillRect(x + 6, y + 48 - bob + stride, 3, 6);
      ctx.fillRect(x + w - 10, y + 48 - bob - stride, 3, 6);

      // 3. Green T-Shirt (Minecraft / Craft Style)
      ctx.fillStyle = '#22c55e'; // Green Graphic Tee
      ctx.fillRect(x + 3, y + 16 - bob, w - 6, 14);

      // Chest Graphic Accent
      ctx.fillStyle = '#15803d';
      ctx.fillRect(x + (isaac.facing === 1 ? 12 : 6), y + 19 - bob, 6, 6);

      // Arms
      ctx.fillStyle = '#8d5b4c';
      const armX = isaac.facing === 1 ? x + w - 4 : x - 2;
      ctx.fillRect(armX, y + 18 - bob, 5, 12);

      // 4. Head, Face & Glasses
      ctx.fillStyle = '#8d5b4c'; // Face
      ctx.fillRect(x + 5, y + 2 - bob, 16, 14);

      // Hair Crown / Curls Front
      ctx.fillStyle = '#1e1b18';
      ctx.fillRect(x + 4, y - bob, 18, 5);

      // Glasses (Frames & Lenses)
      ctx.strokeStyle = '#ef4444'; // Red/Burgundy Frames
      ctx.lineWidth = 1.5;
      const eyeX = isaac.facing === 1 ? x + 12 : x + 6;
      ctx.strokeRect(eyeX, y + 6 - bob, 8, 5);
      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(eyeX + 1, y + 7 - bob, 6, 3);

      ctx.restore();
    }

    function drawHUD() {
      // Sonic Top-Left Status Box
      ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.fillRect(10, 10, 190, 48);
      ctx.strokeRect(10, 10, 190, 48);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(`RINGS  ${rings}`, 18, 26);

      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`SCORE  ${score}`, 18, 38);

      const sec = Math.floor(timer / 60);
      ctx.fillStyle = '#fff';
      ctx.fillText(`TIME   00:${sec < 10 ? '0' + sec : sec}`, 18, 50);

      // Speedometer
      const speedPct = Math.min(1, Math.abs(isaac.vx) / isaac.maxSpeed);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(canvas.width - 120, 10, 110, 14);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(canvas.width - 120, 10, 110 * speedPct, 14);
      ctx.strokeStyle = '#38bdf8';
      ctx.strokeRect(canvas.width - 120, 10, 110, 14);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
