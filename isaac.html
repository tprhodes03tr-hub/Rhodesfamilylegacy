<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard | Syndicate Incursion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08090f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 18, 30, 0.95);
      border-bottom: 2px solid #8b5cf6;
    }
    header h1 {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
    }
    #wave-status {
      font-size: 0.85rem;
      font-weight: bold;
      color: #38bdf8;
    }
    #roster-bar {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      padding: 8px 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 0 0 8px 8px;
    }
    .roster-card {
      background: #1f2937;
      border: 2px solid #4b5563;
      border-radius: 6px;
      padding: 6px 2px;
      text-align: center;
      font-size: 0.7rem;
      cursor: pointer;
      color: #cbd5e1;
      font-weight: bold;
      transition: 0.2s ease;
    }
    .roster-card.active {
      border-color: #38bdf8;
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      transform: translateY(-2px);
    }
    #game-container {
      position: relative;
      margin-top: 6px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #4c1d95;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      padding: 10px 14px;
      gap: 15px;
      margin-top: 6px;
    }
    .control-cluster {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .action-cluster {
      justify-content: flex-end;
    }
    .btn {
      background: rgba(30, 27, 75, 0.85);
      border: 2px solid #a855f7;
      color: #e9d5ff;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }
    .btn:active {
      background: #7e22ce;
      transform: scale(0.92);
    }
    .btn-action {
      border-radius: 12px;
      width: 86px;
      height: 52px;
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-strike { border-color: #38bdf8; color: #bae6fd; }
    .btn-super { border-color: #f59e0b; color: #fef3c7; }
  </style>
</head>
<body>

  <header>
    <h1>Ancestral Vanguard</h1>
    <div id="wave-status">WAVE 1: SYNDICATE DROIDS</div>
  </header>

  <div id="roster-bar">
    <div class="roster-card active" onclick="switchHero('marcus')">MARCUS</div>
    <div class="roster-card" onclick="switchHero('chronolock')">CHRONO</div>
    <div class="roster-card" onclick="switchHero('motherluta')">M. LUTA</div>
    <div class="roster-card" onclick="switchHero('xochitl')">XOCHITL</div>
    <div class="roster-card" onclick="switchHero('apexvolt')">APEX VOLT</div>
    <div class="roster-card" onclick="switchHero('amina')">AMINA</div>
  </div>

  <div id="game-container">
    <canvas id="stage" width="800" height="450"></canvas>
  </div>

  <div id="touch-controls">
    <div class="control-cluster">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
      <button class="btn" id="btn-jump">▲</button>
    </div>
    <div class="control-cluster action-cluster">
      <button class="btn btn-action btn-strike" id="btn-atk">STRIKE</button>
      <button class="btn btn-action btn-super" id="btn-power">SUPER</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const waveBadge = document.getElementById('wave-status');

    // Stage Background: Detroit GM Renaissance Center Skyline
    const bgImg = new Image();
    bgImg.src = '1789535309047.png';
    let bgReady = false;
    bgImg.onload = () => { bgReady = true; };

    // Boss Sprite: Syndicate Squad
    const bossImg = new Image();
    bossImg.src = 'syndicate.png';
    let bossReady = false;
    bossImg.onload = () => { bossReady = true; };

    const ROSTER = {
      marcus: {
        name: 'MARCUS (ANCHOR)',
        files: ['marcus.png', 'marcus_clean.png'],
        speed: 4.8,
        gravity: 0.85,
        jumpForce: -14,
        scaleW: 120,
        scaleH: 150,
        color: '#a855f7',
        drawVector: (c, w, h) => {
          c.fillStyle = '#7c3aed';
          c.fillRect(-w*0.3, -h*0.4, w*0.6, h*0.7);
          c.fillStyle = '#38bdf8';
          c.fillRect(-w*0.2, -h*0.35, w*0.4, h*0.25);
          c.fillStyle = '#1e1b4b';
          c.fillRect(-w*0.25, h*0.2, w*0.22, h*0.3);
          c.fillRect(w*0.03, h*0.2, w*0.22, h*0.3);
          c.fillStyle = '#c084fc';
          c.beginPath();
          c.arc(0, -h*0.42, w*0.18, 0, Math.PI*2);
          c.fill();
        },
        executeSuper: (h) => {
          screenShake = 18;
          marcusShield = 180; // 3 seconds active barrier
          hero.hp = Math.min(100, hero.hp + 28); // Forcefield Pulse Healing

          // Electro-burst chain lightning
          for (let i = 0; i < 35; i++) {
            particles.push({
              x: h.x + h.w / 2,
              y: h.y + h.h / 2,
              vx: (Math.random() - 0.5) * 16,
              vy: (Math.random() - 0.5) * 16,
              size: Math.random() * 5 + 3,
              color: '#38bdf8',
              life: 30
            });
          }
          shockwaves.push({ x: h.x + h.w / 2, y: h.y + h.h / 2, radius: 10, maxRadius: 220, color: '#a855f7' });
          aoeDamage(35);
        }
      },
      chronolock: {
        name: 'CHRONOLOCK (TEMPORAL)',
        files: ['chrono.png', '1789398446187.png'],
        speed: 3.8,
        gravity: 0.75,
        jumpForce: -13,
        scaleW: 130,
        scaleH: 155,
        color: '#10b981',
        drawVector: (c, w, h) => {
          c.fillStyle = '#d97706';
          c.fillRect(-w*0.3, -h*0.38, w*0.6, h*0.65);
          c.fillStyle = '#10b981';
          c.beginPath();
          c.arc(0, -h*0.1, w*0.18, 0, Math.PI*2);
          c.fill();
          c.strokeStyle = '#fef08a';
          c.lineWidth = 4;
          c.stroke();
        },
        executeSuper: (h) => {
          screenShake = 8;
          shockwaves.push({ x: h.x + h.w / 2, y: h.y + h.h / 2, radius: 20, maxRadius: 260, color: '#10b981' });
          droids.forEach(d => { d.vx *= 0.1; });
          aoeDamage(20);
        }
      },
      motherluta: {
        name: 'MOTHER LUTA (MYSTIC)',
        files: ['mother-luta.png'],
        speed: 5.2,
        gravity: 0.45,
        jumpForce: -12,
        scaleW: 110,
        scaleH: 145,
        color: '#fbbf24',
        drawVector: (c, w, h) => {
          c.fillStyle = '#b45309';
          c.beginPath();
          c.moveTo(0, -h*0.45);
          c.lineTo(w*0.35, h*0.45);
          c.lineTo(-w*0.35, h*0.45);
          c.closePath();
          c.fill();
        },
        executeSuper: (h) => {
          // Ascension wipe: fly upward, restore health, wipe enemies
          lutaAscending = true;
          lutaTimer = 100;
          h.vy = -16;
          hero.hp = 100; // Full Team Restoration
          screenShake = 22;

          for (let i = 0; i < 60; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 4,
              vy: Math.random() * 8 + 4,
              size: Math.random() * 6 + 2,
              color: '#fef08a',
              life: 45
            });
          }
          wipeAllEnemies();
        }
      },
      xochitl: {
        name: 'XOCHITL (FLAME CLAW)',
        files: ['xochitl.png'],
        speed: 6.0,
        gravity: 0.8,
        jumpForce: -15,
        scaleW: 115,
        scaleH: 148,
        color: '#ea580c',
        drawVector: (c, w, h) => {},
        executeSuper: (h) => {
          // Airborne feather wings + feather dagger storm
          h.vy = -16;
          h.isGrounded = false;
          xochitlWings = 60;
          screenShake = 12;

          for (let i = -3; i <= 3; i++) {
            projectiles.push({
              x: h.x + h.w / 2,
              y: h.y + 40,
              vx: (h.facing * 10) + i * 2,
              vy: Math.abs(i) * 2 + 5,
              type: 'dagger',
              color: '#f97316',
              life: 40
            });
          }
          aoeDamage(30);
        }
      },
      apexvolt: {
        name: 'APEX VOLT (ELECTRIC)',
        files: ['apex.png', 'apex-volt.png'],
        speed: 5.0,
        gravity: 0.82,
        jumpForce: -14,
        scaleW: 125,
        scaleH: 152,
        color: '#06b6d4',
        drawVector: (c, w, h) => {
          c.fillStyle = '#0e7490';
          c.fillRect(-w*0.3, -h*0.4, w*0.6, h*0.75);
          c.fillStyle = '#67e8f9';
          c.fillRect(-w*0.15, -h*0.3, w*0.3, h*0.2);
        },
        executeSuper: (h) => {
          screenShake = 14;
          aoeDamage(28);
        }
      },
      amina: {
        name: 'AMINA (SPEAR VANGUARD)',
        files: ['amina.png'],
        speed: 5.5,
        gravity: 0.82,
        jumpForce: -14.5,
        scaleW: 115,
        scaleH: 150,
        color: '#e11d48',
        drawVector: (c, w, h) => {
          c.fillStyle = '#9f1239';
          c.fillRect(-w*0.25, -h*0.4, w*0.5, h*0.75);
          c.strokeStyle = '#f43f5e';
          c.lineWidth = 4;
          c.beginPath();
          c.moveTo(w*0.2, -h*0.45);
          c.lineTo(w*0.2, h*0.45);
          c.stroke();
        },
        executeSuper: (h) => {
          screenShake = 12;
          h.vx = h.facing * 20;
          aoeDamage(32);
        }
      }
    };

    // Robust Image Loading Pipeline
    const sprites = {};
    Object.keys(ROSTER).forEach(key => {
      sprites[key] = { img: new Image(), ready: false };
      loadRosterSprite(key, 0);
    });

    function loadRosterSprite(key, index) {
      const list = ROSTER[key].files;
      if (index >= list.length) return;
      const img = new Image();
      img.src = list[index];
      img.onload = () => {
        sprites[key].img = img;
        sprites[key].ready = true;
      };
      img.onerror = () => {
        loadRosterSprite(key, index + 1);
      };
    }

    let activeKey = 'marcus';
    let screenShake = 0;
    let marcusShield = 0;
    let lutaAscending = false;
    let lutaTimer = 0;
    let xochitlWings = 0;

    const particles = [];
    const shockwaves = [];
    const projectiles = [];
    const enemyLasers = [];

    const hero = {
      x: 120,
      y: 250,
      w: 120,
      h: 150,
      vx: 0,
      vy: 0,
      facing: 1,
      isGrounded: true,
      cooldown: 0,
      auraTick: 0,
      groundY: 250,
      hp: 100
    };

    // Enemy Pipeline: Droids $\rightarrow$ Syndicate Boss
    let gameState = 'DROIDS'; // 'DROIDS' or 'BOSS' or 'VICTORY'
    let droids = [];
    let droidsRemaining = 6;

    function spawnDroid(x, y) {
      return {
        x: x,
        y: y,
        w: 42,
        h: 42,
        vx: -1.8,
        vy: 0,
        hp: 20,
        maxHp: 20,
        shootTimer: Math.floor(Math.random() * 60) + 40
      };
    }

    // Initial Droid Squadron
    droids.push(spawnDroid(640, 200));
    droids.push(spawnDroid(720, 140));
    droids.push(spawnDroid(780, 260));

    const boss = {
      x: 580,
      y: 250,
      w: 130,
      h: 155,
      hp: 150,
      maxHp: 150,
      groundY: 250,
      atkTimer: 80,
      active: false
    };

    window.switchHero = function(key) {
      if (!ROSTER[key]) return;
      activeKey = key;
      const cfg = ROSTER[key];
      hero.w = cfg.scaleW;
      hero.h = cfg.scaleH;
      document.querySelectorAll('.roster-card').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
    };

    function wipeAllEnemies() {
      droids.forEach(d => {
        d.hp = 0;
        for (let i = 0; i < 15; i++) {
          particles.push({
            x: d.x + d.w / 2,
            y: d.y + d.h / 2,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            size: 4,
            color: '#fef08a',
            life: 25
          });
        }
      });
      droids = [];
      droidsRemaining = 0;
      if (gameState === 'BOSS') {
        boss.hp = Math.max(0, boss.hp - 45);
      }
    }

    function aoeDamage(amount) {
      if (gameState === 'DROIDS') {
        droids.forEach(d => {
          if (Math.abs((hero.x + hero.w / 2) - (d.x + d.w / 2)) < 220) {
            d.hp -= amount;
          }
        });
      } else if (gameState === 'BOSS' && boss.active) {
        if (Math.abs((hero.x + hero.w / 2) - (boss.x + boss.w / 2)) < 240) {
          boss.hp = Math.max(0, boss.hp - amount);
          screenShake = 10;
        }
      }
    }

    function singleStrike() {
      let hit = false;
      if (gameState === 'DROIDS') {
        droids.forEach(d => {
          if (Math.abs((hero.x + hero.w / 2) - (d.x + d.w / 2)) < 130 && Math.abs(hero.y - d.y) < 100) {
            d.hp -= 12;
            hit = true;
          }
        });
      } else if (gameState === 'BOSS' && boss.active) {
        if (Math.abs((hero.x + hero.w / 2) - (boss.x + boss.w / 2)) < 140) {
          boss.hp = Math.max(0, boss.hp - 14);
          hit = true;
        }
      }
      if (hit) screenShake = 6;
    }

    const keys = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'ArrowUp') doJump();
      if (e.key === 'j' || e.key === 'z') doStrike();
      if (e.key === 'k' || e.key === 'x') doSuper();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });

    function bind(id, down, up) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); down(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (up) up(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); down(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if (up) up(); });
    }
    bind('btn-left', () => keys.left = true, () => keys.left = false);
    bind('btn-right', () => keys.right = true, () => keys.right = false);
    bind('btn-jump', () => doJump());
    bind('btn-atk', () => doStrike());
    bind('btn-power', () => doSuper());

    function doJump() {
      if (hero.isGrounded) {
        hero.vy = ROSTER[activeKey].jumpForce;
        hero.isGrounded = false;
      }
    }

    function doStrike() {
      if (hero.cooldown === 0) {
        hero.cooldown = 16;
        singleStrike();
      }
    }

    function doSuper() {
      if (hero.cooldown === 0) {
        hero.cooldown = 45;
        ROSTER[activeKey].executeSuper(hero);
      }
    }

    function update() {
      if (screenShake > 0) screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;
      if (hero.cooldown > 0) hero.cooldown--;
      if (marcusShield > 0) marcusShield--;
      if (xochitlWings > 0) xochitlWings--;
      if (lutaTimer > 0) {
        lutaTimer--;
        if (lutaTimer === 0) lutaAscending = false;
      }

      const cfg = ROSTER[activeKey];
      if (keys.left) { hero.vx = -cfg.speed; hero.facing = -1; }
      else if (keys.right) { hero.vx = cfg.speed; hero.facing = 1; }
      else { hero.vx *= 0.8; }

      hero.x += hero.vx;
      hero.y += hero.vy;

      if (!hero.isGrounded) {
        hero.vy += cfg.gravity;
        if (hero.y >= hero.groundY) {
          hero.y = hero.groundY;
          hero.vy = 0;
          hero.isGrounded = true;
        }
      }

      if (hero.x < 20) hero.x = 20;
      if (hero.x + hero.w > canvas.width - 20) hero.x = canvas.width - hero.w - 20;

      // Projectiles (Xochitl Feather Daggers)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        // Dagger collisions
        droids.forEach(d => {
          if (p.x > d.x && p.x < d.x + d.w && p.y > d.y && p.y < d.y + d.h) {
            d.hp -= 15;
            p.life = 0;
          }
        });
        if (gameState === 'BOSS' && boss.active) {
          if (p.x > boss.x && p.x < boss.x + boss.w && p.y > boss.y && p.y < boss.y + boss.h) {
            boss.hp -= 18;
            p.life = 0;
          }
        }
        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // Enemy Lasers vs Forcefield / Hero
      for (let i = enemyLasers.length - 1; i >= 0; i--) {
        const l = enemyLasers[i];
        l.x += l.vx;
        // Collision with Marcus Forcefield
        if (marcusShield > 0 && Math.abs(l.x - (hero.x + hero.w / 2)) < 60) {
          particles.push({ x: l.x, y: l.y, vx: -l.vx * 0.4, vy: (Math.random() - 0.5) * 4, size: 4, color: '#38bdf8', life: 15 });
          enemyLasers.splice(i, 1);
          continue;
        }
        // Collision with Player
        if (l.x > hero.x && l.x < hero.x + hero.w && l.y > hero.y && l.y < hero.y + hero.h) {
          hero.hp = Math.max(0, hero.hp - 6);
          screenShake = 6;
          enemyLasers.splice(i, 1);
          continue;
        }
        if (l.x < 0) enemyLasers.splice(i, 1);
      }

      // Droid Lifecycle & Spawning
      if (gameState === 'DROIDS') {
        for (let i = droids.length - 1; i >= 0; i--) {
          const d = droids[i];
          d.x += d.vx;
          if (d.x < 360 || d.x > 740) d.vx *= -1;

          d.shootTimer--;
          if (d.shootTimer <= 0) {
            d.shootTimer = Math.floor(Math.random() * 70) + 50;
            enemyLasers.push({ x: d.x, y: d.y + d.h / 2, vx: -6 });
          }

          if (d.hp <= 0) {
            droidsRemaining--;
            droids.splice(i, 1);
            if (droidsRemaining > 0 && droids.length < 3) {
              droids.push(spawnDroid(740, 160 + Math.random() * 100));
            }
          }
        }

        if (droids.length === 0 && droidsRemaining <= 0) {
          gameState = 'BOSS';
          boss.active = true;
          waveBadge.textContent = 'WARNING: SYNDICATE BOSS INCOMING';
          waveBadge.style.color = '#ef4444';
          screenShake = 20;
        }
      }

      // Boss Logic
      if (gameState === 'BOSS' && boss.active) {
        boss.atkTimer--;
        if (boss.atkTimer <= 0) {
          boss.atkTimer = 80;
          enemyLasers.push({ x: boss.x, y: boss.y + 60, vx: -7.5 });
          enemyLasers.push({ x: boss.x, y: boss.y + 110, vx: -7.5 });
        }
        if (boss.hp <= 0) {
          gameState = 'VICTORY';
          boss.active = false;
          waveBadge.textContent = 'SECTOR CLEARED: VANGUARD TRIUMPHANT';
          waveBadge.style.color = '#10b981';
        }
      }

      // Particles & Shockwaves
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.radius += 7;
        if (s.radius > s.maxRadius) shockwaves.splice(i, 1);
      }

      hero.auraTick += 0.08;
    }

    function render() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Detroit Skyline Background Rendering
      if (bgReady) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(8, 9, 15, 0.60)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      const floorY = hero.groundY + hero.h - 5;
      ctx.fillStyle = 'rgba(30, 27, 75, 0.8)';
      ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
      ctx.strokeStyle = ROSTER[activeKey].color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(canvas.width, floorY);
      ctx.stroke();

      // Health HUD
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(30, 20, 260, 18);
      ctx.fillRect(canvas.width - 290, 20, 260, 18);

      ctx.fillStyle = ROSTER[activeKey].color;
      ctx.fillRect(30, 20, (hero.hp / 100) * 260, 18);

      ctx.fillStyle = '#ef4444';
      if (gameState === 'DROIDS') {
        ctx.fillRect(canvas.width - 290, 20, (droidsRemaining / 6) * 260, 18);
      } else if (gameState === 'BOSS') {
        ctx.fillRect(canvas.width - 290, 20, (boss.hp / boss.maxHp) * 260, 18);
      }

      // Lasers
      ctx.fillStyle = '#f43f5e';
      enemyLasers.forEach(l => {
        ctx.fillRect(l.x, l.y, 14, 4);
      });

      // Projectiles (Xochitl Solar Daggers)
      projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.lineTo(14, 0);
        ctx.lineTo(0, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Shockwaves & Particles
      shockwaves.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4;
        ctx.stroke();
      });
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // Marcus Forcefield Rendering
      if (marcusShield > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(hero.x + hero.w / 2, hero.y + hero.h / 2, 70, 0, Math.PI * 2);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.fill();
        ctx.restore();
      }

      // Xochitl Wings Rendering
      if (xochitlWings > 0) {
        ctx.save();
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(hero.x + hero.w / 2, hero.y + 40);
        ctx.lineTo(hero.x - 30, hero.y);
        ctx.lineTo(hero.x + hero.w / 2, hero.y + 50);
        ctx.moveTo(hero.x + hero.w / 2, hero.y + 40);
        ctx.lineTo(hero.x + hero.w + 30, hero.y);
        ctx.lineTo(hero.x + hero.w / 2, hero.y + 50);
        ctx.stroke();
        ctx.restore();
      }

      // Active Vanguard Hero
      ctx.save();
      ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
      ctx.scale(hero.facing, 1);
      const breathe = Math.sin(hero.auraTick) * 2;

      const spr = sprites[activeKey];
      if (spr && spr.ready) {
        ctx.drawImage(spr.img, -hero.w / 2, -hero.h / 2 - breathe, hero.w, hero.h + breathe);
      } else {
        ctx.fillStyle = ROSTER[activeKey].color;
        ctx.shadowColor = ROSTER[activeKey].color;
        ctx.shadowBlur = 15;
        ROSTER[activeKey].drawVector(ctx, hero.w, hero.h);
      }
      ctx.restore();

      // Render Droids
      droids.forEach(d => {
        ctx.fillStyle = '#475569';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(d.x + 8, d.y + 14, 10, 6);
        ctx.strokeStyle = '#94a3b8';
        ctx.strokeRect(d.x, d.y, d.w, d.h);
      });

      // Render Syndicate Boss
      if (gameState === 'BOSS' && boss.active) {
        ctx.save();
        ctx.translate(boss.x + boss.w / 2, boss.y + boss.h / 2);
        if (bossReady) {
          ctx.drawImage(bossImg, -boss.w / 2, -boss.h / 2, boss.w, boss.h);
        } else {
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(-boss.w / 2, -boss.h / 2, boss.w, boss.h);
        }
        ctx.restore();
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
