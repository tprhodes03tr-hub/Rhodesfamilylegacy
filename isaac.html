<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Ancestral Vanguard | Ground Anchor Combat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090a10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 20, 32, 0.95);
      border-bottom: 2px solid #8b5cf6;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
    }
    header h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
    }
    .hud-stats {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    #game-container {
      position: relative;
      margin-top: 10px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #3b0764;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Touch Controls */
    #touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      padding: 15px;
      gap: 20px;
      margin-top: 10px;
    }
    .control-cluster {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .action-cluster {
      justify-content: flex-end;
    }
    .btn {
      background: rgba(30, 27, 75, 0.8);
      border: 2px solid #a855f7;
      color: #e9d5ff;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);
      cursor: pointer;
    }
    .btn:active, .btn.pressed {
      background: #7e22ce;
      transform: scale(0.92);
    }
    .btn-action {
      border-radius: 12px;
      width: 75px;
      height: 55px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-slam { border-color: #38bdf8; color: #bae6fd; }
    .btn-shield { border-color: #ec4899; color: #fbcfe8; }
    .status-bar {
      display: flex;
      gap: 15px;
      margin-top: 5px;
      font-size: 0.85rem;
      color: #a78bfa;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ancestral Vanguard</h1>
    <div class="hud-stats">HERO: <strong>MARCUS (ANCHOR)</strong></div>
  </header>

  <div id="game-container">
    <canvas id="stage" width="800" height="450"></canvas>
  </div>

  <div class="status-bar">
    <span>[A/D] Move</span>
    <span>[W] Leap</span>
    <span>[J] Kinetic Slam</span>
    <span>[K] Anchor Barrier</span>
  </div>

  <div id="touch-controls">
    <div class="control-cluster">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
      <button class="btn" id="btn-jump">▲</button>
    </div>
    <div class="control-cluster action-cluster">
      <button class="btn btn-action btn-slam" id="btn-atk">SLAM</button>
      <button class="btn btn-action btn-shield" id="btn-guard">GUARD</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // Sprite Asset Preload
    const marcusImg = new Image();
    marcusImg.src = 'marcus-hero.png';
    let assetLoaded = false;
    marcusImg.onload = () => { assetLoaded = true; };

    // Environmental & Combat State
    let screenShake = 0;
    const particles = [];
    const shockwaves = [];

    // Marcus Ground Anchor State Machine
    const marcus = {
      x: 150,
      y: 260,
      w: 120,
      h: 150,
      vx: 0,
      vy: 0,
      speed: 4.8,
      facing: 1, // 1 = right, -1 = left
      isGrounded: true,
      state: 'idle', // idle, moving, attacking, guarding
      attackCooldown: 0,
      auraTick: 0,
      kineticEnergy: 100,
      groundY: 260
    };

    // Controller Input Listeners
    const keys = { left: false, right: false, up: false, atk: false, guard: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
      if (e.key === 'j' || e.key === 'z') executeAttack();
      if (e.key === 'k' || e.key === 'x') keys.guard = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
      if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
      if (e.key === 'k' || e.key === 'x') keys.guard = false;
    });

    // Touch Buttons Binding
    function bindTouch(id, key) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); if (key === 'atk') executeAttack(); else keys[key] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (key !== 'atk') keys[key] = false; });
    }
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'up');
    bindTouch('btn-atk', 'atk');
    bindTouch('btn-guard', 'guard');

    function executeAttack() {
      if (marcus.attackCooldown === 0 && !keys.guard) {
        marcus.state = 'attacking';
        marcus.attackCooldown = 28;
        screenShake = 10;
        
        // Spawn Ground Crack Shockwaves
        shockwaves.push({
          x: marcus.x + (marcus.facing === 1 ? marcus.w : 0),
          y: marcus.groundY + marcus.h - 10,
          radius: 10,
          maxRadius: 110,
          alpha: 1,
          dir: marcus.facing
        });

        // Kinetic Debris Particles
        for (let i = 0; i < 18; i++) {
          particles.push({
            x: marcus.x + (marcus.facing === 1 ? marcus.w : 0),
            y: marcus.groundY + marcus.h - 15,
            vx: (Math.random() - 0.2 * marcus.facing) * 7 * marcus.facing,
            vy: -(Math.random() * 8 + 3),
            size: Math.random() * 5 + 3,
            color: Math.random() > 0.5 ? '#a855f7' : '#38bdf8',
            life: 25
          });
        }
      }
    }

    function update() {
      // Screen Shake Decay
      if (screenShake > 0) screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;

      // Guarding State Lock
      if (keys.guard && marcus.isGrounded) {
        marcus.state = 'guarding';
        marcus.vx = 0;
      } else if (marcus.attackCooldown > 0) {
        marcus.attackCooldown--;
        if (marcus.attackCooldown === 0) marcus.state = 'idle';
      } else {
        // Lateral Motion
        if (keys.left) {
          marcus.vx = -marcus.speed;
          marcus.facing = -1;
          marcus.state = 'moving';
        } else if (keys.right) {
          marcus.vx = marcus.speed;
          marcus.facing = 1;
          marcus.state = 'moving';
        } else {
          marcus.vx = 0;
          marcus.state = 'idle';
        }

        // Jump Mechanics
        if (keys.up && marcus.isGrounded) {
          marcus.vy = -14;
          marcus.isGrounded = false;
        }
      }

      // Heavy Ground Anchor Gravity
      marcus.x += marcus.vx;
      marcus.y += marcus.vy;

      if (!marcus.isGrounded) {
        marcus.vy += 0.85; // Heavy fall curve
        if (marcus.y >= marcus.groundY) {
          marcus.y = marcus.groundY;
          marcus.vy = 0;
          marcus.isGrounded = true;
          screenShake = 4; // Impact landing thump
        }
      }

      // Arena Bounds Containment
      if (marcus.x < 20) marcus.x = 20;
      if (marcus.x + marcus.w > canvas.width - 20) marcus.x = canvas.width - marcus.w - 20;

      // Particle Updates
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Shockwave Updates
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 5;
        sw.alpha -= 0.04;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      marcus.auraTick += 0.08;
    }

    function render() {
      ctx.save();

      // Screen Shake Displacement
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
      }

      // Arena Background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Ley-Line Grid
      ctx.strokeStyle = 'rgba(147, 51, 234, 0.15)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Platform / Ground Layer
      const floorY = marcus.groundY + marcus.h - 5;
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(canvas.width, floorY);
      ctx.stroke();

      // Shockwave Rings
      shockwaves.forEach(sw => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI, true);
        ctx.strokeStyle = `rgba(56, 189, 248, ${sw.alpha})`;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
      });

      // Impact Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // Character Rendering (Marcus Ground Anchor)
      ctx.save();
      ctx.translate(marcus.x + marcus.w / 2, marcus.y + marcus.h / 2);
      ctx.scale(marcus.facing, 1);

      // Kinetic Idle Breathing Scale
      const breathe = (marcus.state === 'idle') ? Math.sin(marcus.auraTick) * 2 : 0;

      // Kinetic Energy Aura Glow
      const glowAlpha = 0.25 + Math.sin(marcus.auraTick * 2) * 0.15;
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = marcus.state === 'guarding' ? 25 : 12;

      if (assetLoaded) {
        // Draw Clean Marcus Sprite
        ctx.drawImage(
          marcusImg,
          -marcus.w / 2,
          -marcus.h / 2 - breathe,
          marcus.w,
          marcus.h + breathe
        );
      } else {
        // Loading Fallback Frame
        ctx.fillStyle = '#6b21a8';
        ctx.fillRect(-marcus.w / 2, -marcus.h / 2, marcus.w, marcus.h);
      }

      // Anchor Barrier (Guard Bubble)
      if (marcus.state === 'guarding') {
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.8)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.ellipse(0, 0, marcus.w * 0.65, marcus.h * 0.55, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      // Kinetic Attack Flash
      if (marcus.state === 'attacking') {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
