<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isaac Rhodes Adventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030814;
      --panel-dark: #091322;
      --border-blue: #142847;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --parchment: #fcf9f2;
      --wood: #5a3d28;
      --border-cozy: #e8dcc8;
      --sage: #6b8f71;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP HUD */
    #hud {
      width: 100%;
      max-width: 500px;
      padding: 8px 12px;
      background: var(--panel-dark);
      border-bottom: 2px solid var(--border-blue);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .hud-title { color: #4ade80; }
    .hud-zone { color: var(--accent-gold); }
    .hud-stats { color: #e2e8f0; }
    .bar-container {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 90%;
      background: linear-gradient(90deg, #10b981, #34d399);
    }
    .sub-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--accent-cyan);
      font-weight: 700;
    }
    .sub-bar-container {
      flex: 1;
      height: 4px;
      background: #0f172a;
      border-radius: 2px;
      overflow: hidden;
    }
    .sub-bar-fill {
      height: 100%;
      width: 75%;
      background: #0284c7;
    }

    /* MULTI-MODE NAVIGATION BAR */
    #mode-nav {
      width: 100%;
      max-width: 500px;
      background: #060e1d;
      display: flex;
      border-bottom: 1px solid var(--border-blue);
      padding: 4px 6px;
      gap: 5px;
    }
    .mode-tab {
      flex: 1;
      background: #0d1e38;
      border: 1px solid #1e3a66;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      text-align: center;
    }
    .mode-tab.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
    }
    .mode-tab.cozy-tab.active {
      background: #b4833e;
      border-color: #fde68a;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    /* VIEWPORT CONTAINER */
    #viewport-container {
      width: 100%;
      max-width: 500px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* --- MODE 1: ISAAC OBBY PLATFORMER --- */
    #view-obby {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #game-canvas {
      width: 100%;
      height: 48vh;
      background: linear-gradient(180deg, #0b1528 0%, #172c4e 65%, #3b82f6 100%);
      display: block;
    }
    #obby-controls {
      width: 100%;
      flex: 1;
      background: #060d1a;
      border-top: 1px solid #1e293b;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    button.arcade-btn {
      background: #0f1f38;
      border: 1px solid #234273;
      border-radius: 6px;
      color: #cbd5e1;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
    }
    button.arcade-btn:active {
      filter: brightness(1.3);
      transform: scale(0.97);
    }
    button.arcade-btn span {
      font-size: 8.5px;
      font-weight: 400;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn-green { background: #064e3b; border-color: #059669; color: #a7f3d0; }
    .btn-blue { background: #1e3a8a; border-color: #2563eb; color: #bfdbfe; }
    .btn-orange { background: #7c2d12; border-color: #ea580c; color: #fed7aa; }
    .btn-red { background: #7f1d1d; border-color: #dc2626; color: #fecaca; }

    /* --- COZY HUBS (COLORING & WORD SEARCH) --- */
    .cozy-view {
      display: none;
      width: 100%;
      height: 100%;
      background: var(--parchment);
      color: var(--wood);
      padding: 10px;
      overflow-y: auto;
    }
    .cozy-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1.5px solid var(--border-cozy);
      padding: 12px;
      box-shadow: 0 4px 12px rgba(90, 61, 40, 0.05);
      margin-bottom: 12px;
    }
    .cozy-header {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: var(--wood);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cozy-select {
      background: #fdfaf4;
      border: 1px solid var(--border-cozy);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--wood);
      outline: none;
    }

    /* Coloring Studio Elements */
    #paint-canvas {
      width: 100%;
      height: auto;
      max-height: 250px;
      background: #fff;
      border-radius: 8px;
      border: 2px solid var(--border-cozy);
      display: block;
      margin: 0 auto 10px;
      touch-action: none;
      cursor: crosshair;
    }
    .palette-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      cursor: pointer;
    }
    .swatch.active {
      transform: scale(1.2);
      border-color: var(--wood);
    }
    .cozy-btn-bar {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }
    .btn-cozy {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-cozy);
      background: #fcf9f2;
      color: var(--wood);
      cursor: pointer;
    }
    .btn-cozy.active {
      background: var(--wood);
      color: #fff;
    }
    .btn-save {
      background: var(--sage);
      color: #fff;
      border: none;
    }

    /* Word Search Elements */
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      background: #fbf7ee;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border-cozy);
      margin-bottom: 10px;
      touch-action: none;
    }
    .ws-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--wood);
      background: #ffffff;
      border-radius: 4px;
      cursor: pointer;
    }
    .ws-cell.selecting { background: #fed7aa; color: #7c2d12; }
    .ws-cell.found { background: #bbf7d0; color: #14532d; font-weight: 800; }
    .word-tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .word-tag {
      background: #fff;
      border: 1px solid var(--border-cozy);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--wood);
    }
    .word-tag.found {
      background: var(--sage);
      color: #fff;
      text-decoration: line-through;
      border-color: var(--sage);
    }
  </style>
</head>
<body>

  <!-- TOP HUD -->
  <div id="hud">
    <div class="hud-row">
      <span class="hud-title" id="hud-hero">ISAAC RHODES (VOXEL HERO)</span>
      <span class="hud-zone" id="hud-stage">OBBY STAGE 1</span>
      <span class="hud-stats" id="hud-score">STARS: 0 | PTS: 0</span>
    </div>
    <div class="bar-container">
      <div class="bar-fill" id="hp-bar"></div>
    </div>
    <div class="sub-bar-row">
      <span>MECH CHARGE</span>
      <div class="sub-bar-container">
        <div class="sub-bar-fill" id="charge-bar"></div>
      </div>
    </div>
  </div>

  <!-- MULTI-GAME MODE NAVIGATION BAR -->
  <div id="mode-nav">
    <button class="mode-tab active" id="tab-obby" onclick="switchGameMode('obby')">🏃 OBBY ADVENTURE</button>
    <button class="mode-tab cozy-tab" id="tab-coloring" onclick="switchGameMode('coloring')">🎨 STORY COLORING</button>
    <button class="mode-tab cozy-tab" id="tab-words" onclick="switchGameMode('words')">📖 WORD SEARCH</button>
  </div>

  <!-- VIEWPORT CONTAINER -->
  <div id="viewport-container">

    <!-- 1. OBBY ADVENTURE VIEW -->
    <div id="view-obby">
      <canvas id="game-canvas"></canvas>
      <div id="obby-controls">
        <button class="arcade-btn" onclick="moveIsaac(-1)">◀ RUN LEFT</button>
        <button class="arcade-btn btn-green" onclick="castGrapple()">
          <strong>GRAPPLE HOOK</strong><span>Swing / Pull</span>
        </button>
        <button class="arcade-btn" onclick="moveIsaac(1)">RUN RIGHT ▶</button>

        <button class="arcade-btn btn-blue" onclick="jumpIsaac()">
          <strong>JUMP / DOUBLE</strong><span>Spring Bounce</span>
        </button>
        <button class="arcade-btn btn-orange" onclick="brawlHammer()">
          <strong>BRAWL HAMMER</strong><span>Pixel Smash</span>
        </button>
        <button class="arcade-btn btn-red" onclick="triggerMechSuit()">
          <strong>MECH SUIT</strong><span>Titan Smash</span>
        </button>
      </div>
    </div>

    <!-- 2. STORYBOOK COLORING VIEW -->
    <div class="cozy-view" id="view-coloring">
      <div class="cozy-card">
        <div class="cozy-header">
          <span>Story Art Studio</span>
          <select class="cozy-select" id="sheet-picker" onchange="loadIllustration(this.value)">
            <option value="mill">Little Luetta at the Mill</option>
            <option value="shield">Heroic Sun Shield & Relics</option>
            <option value="garden">Enchanted Clocktower Garden</option>
            <option value="nook">Cozy Storybook Reading Nook</option>
          </select>
        </div>

        <canvas id="paint-canvas" width="480" height="340"></canvas>

        <div class="palette-row">
          <div class="swatch active" style="background: #e76f51;" onclick="setColor('#e76f51', this)"></div>
          <div class="swatch" style="background: #f4a261;" onclick="setColor('#f4a261', this)"></div>
          <div class="swatch" style="background: #e9c46a;" onclick="setColor('#e9c46a', this)"></div>
          <div class="swatch" style="background: #a7c957;" onclick="setColor('#a7c957', this)"></div>
          <div class="swatch" style="background: #2a9d8f;" onclick="setColor('#2a9d8f', this)"></div>
          <div class="swatch" style="background: #457b9d;" onclick="setColor('#457b9d', this)"></div>
          <div class="swatch" style="background: #d4a373;" onclick="setColor('#d4a373', this)"></div>
          <div class="swatch" style="background: #5c3826;" onclick="setColor('#5c3826', this)"></div>
        </div>

        <div class="cozy-btn-bar">
          <button class="btn-cozy active" id="btn-bucket" onclick="setTool('bucket')">🪣 Bucket Fill</button>
          <button class="btn-cozy" id="btn-brush" onclick="setTool('brush')">🖌️ Brush</button>
          <button class="btn-cozy" onclick="undoStroke()">↩ Undo</button>
          <button class="btn-cozy btn-save" onclick="downloadMasterpiece()">📥 Save</button>
        </div>
      </div>
    </div>

    <!-- 3. LITERARY WORD SEARCH VIEW -->
    <div class="cozy-view" id="view-words">
      <div class="cozy-card">
        <div class="cozy-header">
          <span id="ws-theme-title">Family & Legacy Treasures</span>
          <select class="cozy-select" id="theme-select" onchange="loadWordSearchTheme(this.value)">
            <option value="legacy">Legacy & Family</option>
            <option value="detroit">Detroit & Timeline</option>
            <option value="adventure">Storybook Wonders</option>
          </select>
        </div>

        <div class="ws-grid" id="ws-grid"></div>

        <div style="font-size: 11px; font-weight: 700; color: #7d6e68; margin-bottom: 6px; text-transform: uppercase;">
          Words To Find:
        </div>
        <div class="word-tag-container" id="word-tags"></div>
      </div>
    </div>

  </div>

  <script>
    // --- SYNTHESIZED WEB AUDIO API ---
    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.3) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessChime() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => playTone(f, 'sine', 0.4), i * 110);
      });
    }

    // --- GAME MODE SWITCHER ---
    let currentMode = 'obby';
    function switchGameMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('view-obby').style.display = (mode === 'obby') ? 'flex' : 'none';
      document.getElementById('view-coloring').style.display = (mode === 'coloring') ? 'block' : 'none';
      document.getElementById('view-words').style.display = (mode === 'words') ? 'block' : 'none';

      if (mode === 'obby') {
        document.getElementById('tab-obby').classList.add('active');
        document.getElementById('hud-hero').innerText = 'ISAAC RHODES (VOXEL HERO)';
        document.getElementById('hud-stage').innerText = 'OBBY STAGE 1';
        resizeObby();
      } else if (mode === 'coloring') {
        document.getElementById('tab-coloring').classList.add('active');
        document.getElementById('hud-hero').innerText = 'COZY CORNER';
        document.getElementById('hud-stage').innerText = 'STORY COLORING';
        playTone(587.33);
      } else if (mode === 'words') {
        document.getElementById('tab-words').classList.add('active');
        document.getElementById('hud-hero').innerText = 'COZY CORNER';
        document.getElementById('hud-stage').innerText = 'WORD SEARCH';
        playTone(659.25);
      }
    }

    // ==========================================
    // 1. ISAAC OBBY PLATFORMER ENGINE
    // ==========================================
    const obbyCanvas = document.getElementById('game-canvas');
    const obbyCtx = obbyCanvas.getContext('2d');

    function resizeObby() {
      obbyCanvas.width = obbyCanvas.clientWidth;
      obbyCanvas.height = obbyCanvas.clientHeight;
    }
    window.addEventListener('resize', resizeObby);
    resizeObby();

    const isaac = {
      x: 50,
      y: 180,
      vy: 0,
      width: 18,
      height: 38,
      isGrounded: false,
      isMech: false,
      mechTimer: 0,
      facing: 1
    };

    let score = 0;
    let stars = 0;
    let platforms = [];
    let coins = [];
    let drones = [];

    function initObbyWorld() {
      platforms = [
        { x: 0, y: 220, w: 220, h: 90, color: '#334155' },
        { x: 250, y: 200, w: 75, h: 18, color: '#0284c7' },
        { x: 350, y: 170, w: 80, h: 18, color: '#0284c7' },
        { x: 460, y: 190, w: 120, h: 90, color: '#334155' }
      ];

      coins = [
        { x: 280, y: 155, collected: false },
        { x: 385, y: 125, collected: false }
      ];

      drones = [
        { x: 275, y: 175, color: '#eab308' }
      ];
    }
    initObbyWorld();

    function moveIsaac(dir) {
      isaac.facing = dir;
      isaac.x = Math.max(10, Math.min(obbyCanvas.width - 25, isaac.x + dir * 16));
    }

    function jumpIsaac() {
      if (isaac.isGrounded) {
        isaac.vy = -11.5;
        isaac.isGrounded = false;
        playTone(440, 'square', 0.15);
      }
    }

    function castGrapple() {
      playTone(700, 'triangle', 0.2);
      isaac.vy = -9;
      isaac.x += isaac.facing * 24;
    }

    function brawlHammer() {
      playTone(220, 'sawtooth', 0.25);
      // Smash nearby drones
      drones.forEach(d => {
        if (Math.abs(d.x - isaac.x) < 45) {
          d.x = -999;
          score += 250;
          document.getElementById('hud-score').innerText = `STARS: ${stars} | PTS: ${score}`;
        }
      });
    }

    function triggerMechSuit() {
      isaac.isMech = true;
      isaac.mechTimer = 180;
      playSuccessChime();
    }

    function drawIsaacVoxel(ctx, x, y, isMech, facing) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(facing, 1);

      if (!isMech) {
        // Pixel Isaac
        // Head
        ctx.fillStyle = '#5c3826';
        ctx.fillRect(-6, -34, 12, 12);
        // Hair & Cap
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-7, -37, 14, 5);
        // Green Hoodie
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(-7, -22, 14, 14);
        // Blue Jeans
        ctx.fillStyle = '#2563eb';
        ctx.fillRect(-6, -8, 5, 8);
        ctx.fillRect(1, -8, 5, 8);
        // Cyan Power Brace
        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(6, -18, 4, 4);
      } else {
        // Titan Mech Suit
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-12, -45, 24, 25);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(-6, -35, 12, 6); // Visor
        // Greaves
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(-11, -20, 9, 20);
        ctx.fillRect(2, -20, 9, 20);
      }

      ctx.restore();
    }

    function updateObbyLoop() {
      if (currentMode === 'obby') {
        const w = obbyCanvas.width;
        const h = obbyCanvas.height;

        // Gravity & Platform Collision
        isaac.y += isaac.vy;
        isaac.vy += 0.85;

        isaac.isGrounded = false;
        platforms.forEach(p => {
          if (
            isaac.x + isaac.width > p.x &&
            isaac.x - isaac.width < p.x + p.w &&
            isaac.y >= p.y &&
            isaac.y - isaac.vy <= p.y + 12
          ) {
            isaac.y = p.y;
            isaac.vy = 0;
            isaac.isGrounded = true;
          }
        });

        if (isaac.y > h) {
          // Respawn
          isaac.x = 50;
          isaac.y = 180;
          isaac.vy = 0;
        }

        // Mech Timer
        if (isaac.isMech) {
          isaac.mechTimer--;
          if (isaac.mechTimer <= 0) isaac.isMech = false;
        }

        // Render World
        obbyCtx.clearRect(0, 0, w, h);

        // Clouds & Stars Background
        obbyCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        obbyCtx.fillRect(40, 40, 50, 20);
        obbyCtx.fillRect(260, 60, 60, 22);

        // Platforms
        platforms.forEach(p => {
          obbyCtx.fillStyle = p.color;
          obbyCtx.fillRect(p.x, p.y, p.w, p.h);
          obbyCtx.strokeStyle = '#38bdf8';
          obbyCtx.lineWidth = 1.5;
          obbyCtx.strokeRect(p.x, p.y, p.w, p.h);
        });

        // Coins (Golden Rings)
        coins.forEach(c => {
          if (!c.collected) {
            obbyCtx.strokeStyle = '#facc15';
            obbyCtx.lineWidth = 2.5;
            obbyCtx.beginPath();
            obbyCtx.arc(c.x, c.y, 7, 0, Math.PI * 2);
            obbyCtx.stroke();

            // Collect Coin Check
            if (Math.abs(isaac.x - c.x) < 18 && Math.abs(isaac.y - 15 - c.y) < 22) {
              c.collected = true;
              stars++;
              score += 100;
              playTone(880, 'sine', 0.2);
              document.getElementById('hud-score').innerText = `STARS: ${stars} | PTS: ${score}`;
            }
          }
        });

        // Drones / Encampment
        drones.forEach(d => {
          obbyCtx.fillStyle = d.color;
          obbyCtx.fillRect(d.x - 6, d.y - 14, 12, 14);
          obbyCtx.fillStyle = '#ef4444';
          obbyCtx.fillRect(d.x - 8, d.y - 18, 16, 3);
        });

        // Isaac Sprite
        drawIsaacVoxel(obbyCtx, isaac.x, isaac.y, isaac.isMech, isaac.facing);
      }

      requestAnimationFrame(updateObbyLoop);
    }
    requestAnimationFrame(updateObbyLoop);

    // ==========================================
    // 2. STORYBOOK COLORING STUDIO ENGINE
    // ==========================================
    const paintCanvas = document.getElementById('paint-canvas');
    const paintCtx = paintCanvas.getContext('2d', { willReadFrequently: true });
    let currentTool = 'bucket';
    let currentColor = '#e76f51';
    let isPainting = false;
    let undoHistory = [];

    function savePaintState() {
      if (undoHistory.length > 6) undoHistory.shift();
      undoHistory.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
    }

    function undoStroke() {
      if (undoHistory.length > 0) {
        paintCtx.putImageData(undoHistory.pop(), 0, 0);
        playTone(320);
      }
    }

    function setTool(tool) {
      currentTool = tool;
      document.getElementById('btn-bucket').classList.toggle('active', tool === 'bucket');
      document.getElementById('btn-brush').classList.toggle('active', tool === 'brush');
    }

    function setColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.palette-row .swatch').forEach(s => s.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function drawLineArt(type) {
      paintCtx.fillStyle = '#ffffff';
      paintCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);
      paintCtx.strokeStyle = '#2d2420';
      paintCtx.lineWidth = 3;
      paintCtx.lineCap = 'round';

      if (type === 'mill') {
        // Little Luetta at the Mill
        paintCtx.beginPath();
        paintCtx.moveTo(0, 280);
        paintCtx.bezierCurveTo(120, 260, 280, 290, 480, 270);
        paintCtx.stroke();
        // Mill Base
        paintCtx.beginPath();
        paintCtx.moveTo(110, 270);
        paintCtx.lineTo(130, 140);
        paintCtx.lineTo(190, 140);
        paintCtx.lineTo(210, 270);
        paintCtx.stroke();
        // Roof
        paintCtx.beginPath();
        paintCtx.moveTo(125, 140);
        paintCtx.lineTo(160, 80);
        paintCtx.lineTo(195, 140);
        paintCtx.closePath();
        paintCtx.stroke();
        // Blades
        paintCtx.beginPath();
        paintCtx.arc(160, 140, 7, 0, Math.PI * 2);
        paintCtx.stroke();
        paintCtx.moveTo(160, 140); paintCtx.lineTo(160, 50);
        paintCtx.moveTo(160, 140); paintCtx.lineTo(160, 230);
        paintCtx.moveTo(160, 140); paintCtx.lineTo(70, 140);
        paintCtx.moveTo(160, 140); paintCtx.lineTo(250, 140);
        paintCtx.stroke();
        // Sun
        paintCtx.beginPath();
        paintCtx.arc(380, 70, 28, 0, Math.PI * 2);
        paintCtx.stroke();
      } else if (type === 'shield') {
        // Sun Shield
        paintCtx.beginPath();
        paintCtx.arc(240, 170, 95, 0, Math.PI * 2);
        paintCtx.stroke();
        paintCtx.beginPath();
        paintCtx.arc(240, 170, 68, 0, Math.PI * 2);
        paintCtx.stroke();
        paintCtx.beginPath();
        paintCtx.arc(240, 170, 32, 0, Math.PI * 2);
        paintCtx.stroke();
      } else if (type === 'garden') {
        // Clocktower Garden
        paintCtx.strokeRect(170, 90, 140, 190);
        paintCtx.beginPath();
        paintCtx.arc(240, 150, 36, 0, Math.PI * 2);
        paintCtx.stroke();
        // Spire
        paintCtx.beginPath();
        paintCtx.moveTo(160, 90); paintCtx.lineTo(240, 25); paintCtx.lineTo(320, 90);
        paintCtx.closePath();
        paintCtx.stroke();
      } else {
        // Reading Nook
        paintCtx.roundRect(140, 150, 200, 140, [20, 20, 10, 10]);
        paintCtx.stroke();
        // Lamp
        paintCtx.beginPath();
        paintCtx.moveTo(370, 300); paintCtx.lineTo(370, 80); paintCtx.lineTo(320, 100);
        paintCtx.stroke();
      }

      undoHistory = [];
      savePaintState();
    }

    function loadIllustration(sheet) {
      drawLineArt(sheet);
    }

    // Flood Fill
    function floodFillPaint(startX, startY, colorHex) {
      savePaintState();
      const img = paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height);
      const d = img.data;

      const r = parseInt(colorHex.slice(1, 3), 16);
      const g = parseInt(colorHex.slice(3, 5), 16);
      const b = parseInt(colorHex.slice(5, 7), 16);

      const sIdx = (startY * paintCanvas.width + startX) * 4;
      const tR = d[sIdx], tG = d[sIdx + 1], tB = d[sIdx + 2];

      if (Math.abs(tR - r) < 8 && Math.abs(tG - g) < 8 && Math.abs(tB - b) < 8) return;
      if (tR < 50 && tG < 50 && tB < 50) return; // Ignore dark borders

      const w = paintCanvas.width, h = paintCanvas.height;
      const visited = new Uint8Array(w * h);
      const q = [[startX, startY]];

      while (q.length > 0) {
        const [x, y] = q.pop();
        const pos = y * w + x;
        if (visited[pos]) continue;
        visited[pos] = 1;

        const idx = pos * 4;
        d[idx] = r; d[idx + 1] = g; d[idx + 2] = b; d[idx + 3] = 255;

        const nbs = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
        for (let [nx, ny] of nbs) {
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            const nPos = ny * w + nx;
            const nIdx = nPos * 4;
            if (!visited[nPos] && Math.abs(d[nIdx] - tR) < 30) {
              q.push([nx, ny]);
            }
          }
        }
      }
      paintCtx.putImageData(img, 0, 0);
      playTone(550);
    }

    function getPaintCoords(e) {
      const rect = paintCanvas.getBoundingClientRect();
      const sx = paintCanvas.width / rect.width;
      const sy = paintCanvas.height / rect.height;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((cx - rect.left) * sx),
        y: Math.floor((cy - rect.top) * sy)
      };
    }

    paintCanvas.addEventListener('pointerdown', (e) => {
      const { x, y } = getPaintCoords(e);
      if (currentTool === 'bucket') {
        floodFillPaint(x, y, currentColor);
      } else {
        savePaintState();
        isPainting = true;
        paintCtx.beginPath();
        paintCtx.moveTo(x, y);
        paintCtx.strokeStyle = currentColor;
        paintCtx.lineWidth = 10;
        paintCtx.stroke();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPainting || currentTool !== 'brush') return;
      const { x, y } = getPaintCoords(e);
      paintCtx.lineTo(x, y);
      paintCtx.stroke();
    });

    window.addEventListener('pointerup', () => {
      if (isPainting) isPainting = false;
    });

    function downloadMasterpiece() {
      const a = document.createElement('a');
      a.download = 'Storybook_Coloring.png';
      a.href = paintCanvas.toDataURL();
      a.click();
      playSuccessChime();
    }

    // ==========================================
    // 3. LITERARY WORD SEARCH ENGINE
    // ==========================================
    const wsThemes = {
      legacy: { title: 'Family & Legacy Treasures', words: ['FAMILY', 'LEGACY', 'STORY', 'HARBOR', 'HONOR'] },
      detroit: { title: 'Detroit & Timeline', words: ['RENCEN', 'PORTAL', 'DETROIT', 'RIVER', 'TOWER'] },
      adventure: { title: 'Storybook Wonders', words: ['HEROIC', 'BRAVE', 'SHIELD', 'VOYAGE', 'DREAM'] }
    };

    const WS_SIZE = 10;
    let wsMatrix = [];
    let wsPlaced = [];
    let wsFound = new Set();
    let wsSelecting = false;
    let wsSelectedCells = [];

    function generateWordGrid(wordList) {
      wsMatrix = Array(WS_SIZE).fill(null).map(() => Array(WS_SIZE).fill(''));
      wsPlaced = [];
      const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const dirs = [[0, 1], [1, 0], [1, 1]];

      for (let word of wordList) {
        let placed = false;
        let tries = 0;
        while (!placed && tries < 120) {
          tries++;
          const dir = dirs[Math.floor(Math.random() * dirs.length)];
          const r = Math.floor(Math.random() * WS_SIZE);
          const c = Math.floor(Math.random() * WS_SIZE);
          if (r + dir[0] * (word.length - 1) < WS_SIZE && c + dir[1] * (word.length - 1) < WS_SIZE) {
            let fit = true;
            for (let i = 0; i < word.length; i++) {
              let cell = wsMatrix[r + dir[0] * i][c + dir[1] * i];
              if (cell !== '' && cell !== word[i]) { fit = false; break; }
            }
            if (fit) {
              let coords = [];
              for (let i = 0; i < word.length; i++) {
                wsMatrix[r + dir[0] * i][c + dir[1] * i] = word[i];
                coords.push(`${r + dir[0] * i}-${c + dir[1] * i}`);
              }
              wsPlaced.push({ word, coords });
              placed = true;
            }
          }
        }
      }

      for (let r = 0; r < WS_SIZE; r++) {
        for (let c = 0; c < WS_SIZE; c++) {
          if (wsMatrix[r][c] === '') wsMatrix[r][c] = alpha[Math.floor(Math.random() * alpha.length)];
        }
      }
    }

    function renderWordSearch(key) {
      const theme = wsThemes[key];
      document.getElementById('ws-theme-title').innerText = theme.title;
      generateWordGrid(theme.words);

      const grid = document.getElementById('ws-grid');
      grid.innerHTML = '';
      wsFound.clear();

      for (let r = 0; r < WS_SIZE; r++) {
        for (let c = 0; c < WS_SIZE; c++) {
          const div = document.createElement('div');
          div.className = 'ws-cell';
          div.dataset.pos = `${r}-${c}`;
          div.innerText = wsMatrix[r][c];
          grid.appendChild(div);
        }
      }

      const tags = document.getElementById('word-tags');
      tags.innerHTML = '';
      wsPlaced.forEach(p => {
        const tag = document.createElement('div');
        tag.className = 'word-tag';
        tag.id = `tag-${p.word}`;
        tag.innerText = p.word;
        tags.appendChild(tag);
      });
    }

    function loadWordSearchTheme(key) {
      renderWordSearch(key);
    }

    const wsGridEl = document.getElementById('ws-grid');
    wsGridEl.addEventListener('pointerdown', (e) => {
      if (e.target.classList.contains('ws-cell')) {
        wsSelecting = true;
        wsSelectedCells = [e.target];
        e.target.classList.add('selecting');
        playTone(480);
      }
    });

    wsGridEl.addEventListener('pointermove', (e) => {
      if (!wsSelecting) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (target && target.classList.contains('ws-cell') && !wsSelectedCells.includes(target)) {
        wsSelectedCells.push(target);
        target.classList.add('selecting');
        playTone(480 + wsSelectedCells.length * 30);
      }
    });

    window.addEventListener('pointerup', () => {
      if (!wsSelecting) return;
      wsSelecting = false;
      const coords = wsSelectedCells.map(c => c.dataset.pos);
      const str = wsSelectedCells.map(c => c.innerText).join('');
      const rev = str.split('').reverse().join('');

      let match = wsPlaced.find(p => (p.word === str || p.word === rev) && p.coords.every(cp => coords.includes(cp)));
      if (match && !wsFound.has(match.word)) {
        wsFound.add(match.word);
        wsSelectedCells.forEach(c => { c.classList.remove('selecting'); c.classList.add('found'); });
        document.getElementById(`tag-${match.word}`).classList.add('found');
        playSuccessChime();
      } else {
        wsSelectedCells.forEach(c => c.classList.remove('selecting'));
      }
      wsSelectedCells = [];
    });

    // Initial setup
    drawLineArt('mill');
    renderWordSearch('legacy');
  </script>
</body>
</html>
