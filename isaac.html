<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Isaac Rhodes Adventures: Ren-Cen Rooftop Clash</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #050b14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      max-width: 900px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #canvas-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    /* HUD Overlay */
    .hud {
      position: absolute;
      top: 10px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .hud-bar-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 32%;
    }
    .bar-label {
      color: #38bdf8;
      text-transform: uppercase;
      font-size: 11px;
    }
    .bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #0284c7;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    .hp-fill { background: linear-gradient(90deg, #38bdf8, #0284c7); }
    .charge-fill { background: linear-gradient(90deg, #eab308, #f97316); }
    .boss-fill { background: linear-gradient(90deg, #ef4444, #b91c1c); }
    .boss-label { color: #f87171; text-align: right; }

    /* Control Deck */
    #controls {
      background: #0f172a;
      border-top: 2px solid #0284c7;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 6px;
      padding: 8px 10px;
      width: 100%;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active {
      background: #0284c7;
      color: #fff;
    }
    .btn span.sub {
      font-size: 8px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn.aid-btn {
      grid-column: span 4;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 10px;
    }
    .btn.aid-btn:active {
      background: #38bdf8;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="hud-bar-container">
        <span class="bar-label" id="heroNameLabel">XOCHITL</span>
        <div class="bar-bg"><div class="bar-fill hp-fill" id="playerHpBar"></div></div>
        <div class="bar-bg" style="height: 6px;"><div class="bar-fill charge-fill" id="playerChargeBar" style="width: 0%;"></div></div>
      </div>
      <div class="hud-bar-container" style="align-items: flex-end;">
        <span class="bar-label boss-label">BOSS: CHRONO-LOCK</span>
        <div class="bar-bg"><div class="bar-fill boss-fill" id="bossHpBar"></div></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="btnLeft">◀ LEFT</button>
    <button class="btn" id="btnRight">RIGHT ▶</button>
    <button class="btn" id="btnJump">▲ JUMP / HOVER</button>
    <button class="btn" id="btnTag">TAG SWAP<span class="sub" id="tagSub">MARCUS PRIME</span></button>

    <button class="btn" id="btnStrike">STRIKE<span class="sub" id="strikeSub">MAGMA PUNCH</span></button>
    <button class="btn" id="btnBurst">BURST<span class="sub" id="burstSub">LAVA / FEATHERS</span></button>
    <button class="btn" id="btnGuard">GUARD<span class="sub">DEFLECTOR</span></button>
    <button class="btn" id="btnRestart">RESTART</button>

    <button class="btn aid-btn" id="btnAid">
      ★ MOTHER LUETTA AID ★
      <span class="sub" style="color: #e0f2fe;">CELESTIAL PURGE & RESTORATION (+35 HP)</span>
    </button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // State
  let activeHero = 'XOCHITL'; // 'XOCHITL' or 'MARCUS'
  let player = {
    x: 120,
    y: 350,
    vx: 0,
    vy: 0,
    w: 40,
    h: 60,
    isGrounded: false,
    hp: 100,
    maxHp: 100,
    chargeEnergy: 0, // Marcus kinetic absorption
    maxCharge: 100,
    guarding: false,
    hovering: false
  };

  let boss = {
    x: 650,
    y: 280,
    w: 90,
    h: 140,
    hp: 200,
    maxHp: 200,
    active: true,
    timer: 0
  };

  let drones = [
    { x: 300, y: 120, vx: 2 },
    { x: 500, y: 90, vx: -2 },
    { x: 700, y: 140, vx: 1.5 }
  ];

  let playerProjectiles = [];
  let enemyProjectiles = [];
  let lightningArcs = [];
  let screenFlash = 0;

  let luettaAid = {
    active: false,
    x: 0,
    y: -80,
    alpha: 0
  };

  // Input Handlers
  const keys = {};
  function setupInput(btnId, startAction, endAction) {
    const el = document.getElementById(btnId);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); startAction(); });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); if (endAction) endAction(); });
  }

  setupInput('btnLeft', () => keys['left'] = true, () => keys['left'] = false);
  setupInput('btnRight', () => keys['right'] = true, () => keys['right'] = false);
  setupInput('btnJump', () => {
    if (player.isGrounded) {
      player.vy = -12;
      player.isGrounded = false;
    } else {
      player.hovering = true;
      player.vy = -1.5;
    }
  }, () => player.hovering = false);

  setupInput('btnGuard', () => player.guarding = true, () => player.guarding = false);
  setupInput('btnTag', () => {
    activeHero = activeHero === 'XOCHITL' ? 'MARCUS' : 'XOCHITL';
    document.getElementById('heroNameLabel').textContent = activeHero;
    document.getElementById('tagSub').textContent = activeHero === 'XOCHITL' ? 'MARCUS PRIME' : 'XOCHITL';
    document.getElementById('strikeSub').textContent = activeHero === 'XOCHITL' ? 'MAGMA PUNCH' : 'ELECTRIC BEAM';
    document.getElementById('burstSub').textContent = activeHero === 'XOCHITL' ? 'LAVA / FEATHERS' : 'VOLT OVERLOAD';
  });

  setupInput('btnStrike', () => {
    if (activeHero === 'XOCHITL') {
      // Magma Burst
      playerProjectiles.push({
        type: 'feather',
        x: player.x + 25,
        y: player.y - 15,
        vx: 11,
        vy: 0,
        color: '#f97316'
      });
    } else {
      // Marcus Electric Line Attack
      fireMarcusElectricBeam();
    }
  });

  setupInput('btnBurst', () => {
    if (activeHero === 'XOCHITL') {
      // Razor Feathers Cone
      for (let i = -2; i <= 2; i++) {
        playerProjectiles.push({
          type: 'razor_feather',
          x: player.x + 25,
          y: player.y - 15,
          vx: 10,
          vy: i * 2.2,
          color: ['#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6'][i + 2]
        });
      }
    } else {
      // Marcus Electric Discharge
      fireMarcusElectricBeam(true);
    }
  });

  setupInput('btnAid', () => {
    triggerMotherLuettaAid();
  });

  setupInput('btnRestart', () => {
    player.hp = 100;
    player.chargeEnergy = 0;
    boss.hp = 200;
    boss.active = true;
    drones = [
      { x: 300, y: 120, vx: 2 },
      { x: 500, y: 90, vx: -2 },
      { x: 700, y: 140, vx: 1.5 }
    ];
    enemyProjectiles = [];
    playerProjectiles = [];
  });

  // Marcus Laser / Electric Mechanics
  function fireMarcusElectricBeam(isOverload = false) {
    let powerBonus = 1 + (player.chargeEnergy / player.maxCharge) * 2;
    let targetX = boss.active ? boss.x : canvas.width;
    let targetY = boss.active ? boss.y - 10 : player.y;

    lightningArcs.push({
      x1: player.x + 20,
      y1: player.y - 10,
      x2: targetX,
      y2: targetY,
      duration: 16,
      power: powerBonus,
      overload: isOverload
    });

    if (boss.active && Math.abs(boss.y - player.y) < 160) {
      boss.hp -= (isOverload ? 20 : 10) * powerBonus;
    }

    // Reset Marcus counter charge after firing
    player.chargeEnergy = 0;
  }

  // Mother Luetta Board Wipe
  function triggerMotherLuettaAid() {
    luettaAid.active = true;
    luettaAid.x = canvas.width / 2;
    luettaAid.y = 80;
    luettaAid.alpha = 1.0;

    // Heal Player
    player.hp = Math.min(player.maxHp, player.hp + 35);

    // Board Wipe
    drones = [];
    enemyProjectiles = [];

    // Boss heavy damage
    if (boss.active) {
      boss.hp = Math.max(0, boss.hp - 35);
    }

    screenFlash = 25;
  }

  // Update Game Physics
  function update() {
    // Movement
    if (keys['left']) player.vx = -4;
    else if (keys['right']) player.vx = 4;
    else player.vx *= 0.8;

    player.x += player.vx;
    player.x = Math.max(30, Math.min(canvas.width - 60, player.x));

    if (!player.isGrounded) {
      player.vy += player.hovering ? 0.15 : 0.6; // Gravity
      player.y += player.vy;
    }

    const groundLevel = canvas.height - 40;
    if (player.y >= groundLevel) {
      player.y = groundLevel;
      player.vy = 0;
      player.isGrounded = true;
    }

    // Boss Floating Logic
    boss.x = canvas.width * 0.75 + Math.sin(Date.now() * 0.002) * 40;
    boss.y = groundLevel - 70 + Math.cos(Date.now() * 0.003) * 15;

    // Boss Drones
    drones.forEach(d => {
      d.x += d.vx;
      if (d.x < 100 || d.x > canvas.width - 100) d.vx *= -1;
      if (Math.random() < 0.015) {
        enemyProjectiles.push({ x: d.x, y: d.y + 15, vy: 4, vx: (Math.random() - 0.5) * 2 });
      }
    });

    // Enemy Projectiles
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      let p = enemyProjectiles[i];
      p.x += p.vx;
      p.y += p.vy;

      // Hit Player
      if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - (player.y - 25)) < 35) {
        enemyProjectiles.splice(i, 1);
        if (player.guarding) {
          player.chargeEnergy = Math.min(player.maxCharge, player.chargeEnergy + 25);
        } else {
          player.hp = Math.max(0, player.hp - 8);
          if (activeHero === 'MARCUS') {
            player.chargeEnergy = Math.min(player.maxCharge, player.chargeEnergy + 15);
          }
        }
        continue;
      }
      if (p.y > canvas.height) enemyProjectiles.splice(i, 1);
    }

    // Player Projectiles
    for (let i = playerProjectiles.length - 1; i >= 0; i--) {
      let p = playerProjectiles[i];
      p.x += p.vx;
      p.y += p.vy;

      // Hit Boss
      if (boss.active && Math.abs(p.x - boss.x) < 50 && Math.abs(p.y - boss.y) < 70) {
        boss.hp = Math.max(0, boss.hp - 8);
        playerProjectiles.splice(i, 1);
        continue;
      }
      if (p.x > canvas.width) playerProjectiles.splice(i, 1);
    }

    // HUD Updates
    document.getElementById('playerHpBar').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('playerChargeBar').style.width = (player.chargeEnergy / player.maxCharge * 100) + '%';
    document.getElementById('bossHpBar').style.width = (boss.hp / boss.maxHp * 100) + '%';
  }

  // --- RENDERING ROUTINES ---

  // 1. Chrono-Lock: Steampunk Clockwork Colossus[span_9](start_span)[span_9](end_span)
  function drawChronoLock(ctx, b) {
    ctx.save();
    ctx.translate(b.x, b.y);

    let t = Date.now() * 0.003;

    // Shoulder Brass Gears
    [-42, 42].forEach(dir => {
      ctx.save();
      ctx.translate(dir, -40);
      ctx.rotate(t * (dir > 0 ? 1 : -1));
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        let a = (i * Math.PI) / 4;
        ctx.fillStyle = '#d97706';
        ctx.fillRect(Math.cos(a) * 16 - 3, Math.sin(a) * 16 - 3, 6, 6);
      }
      ctx.restore();
    });

    // Massive Plated Torso
    ctx.fillStyle = '#78350f';
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-35, -35);
    ctx.lineTo(35, -35);
    ctx.lineTo(26, 40);
    ctx.lineTo(-26, 40);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Center Clock Face / Gauge
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#fef3c7';
    ctx.fill();
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Clock Hands
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(t * 1.5) * 13, Math.sin(t * 1.5) * 13);
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(t * 0.3) * 9, Math.sin(t * 0.3) * 9);
    ctx.stroke();

    // Steampunk Urn Neck / Collar
    ctx.fillStyle = '#b45309';
    ctx.fillRect(-18, -55, 36, 16);

    // Head Unit
    ctx.fillStyle = '#92400e';
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -68, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Three Glowing Green Tri-Optic Sensors[span_10](start_span)[span_10](end_span)
    ctx.fillStyle = '#10b981';
    ctx.shadowColor = '#34d399';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(-5, -69, 3.5, 0, Math.PI * 2);
    ctx.arc(5, -69, 3.5, 0, Math.PI * 2);
    ctx.arc(0, -75, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Heavy Brass Arms
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-35, -30);
    ctx.lineTo(-58, 0);
    ctx.lineTo(-48, 38);
    ctx.moveTo(35, -30);
    ctx.lineTo(58, 0);
    ctx.lineTo(48, 38);
    ctx.stroke();

    ctx.restore();
  }

  // 2. Mother Luetta: Glowing Elder Golden Matriarch[span_11](start_span)[span_11](end_span)
  function drawMotherLuetta(ctx, aid) {
    ctx.save();
    ctx.translate(aid.x, aid.y);
    ctx.globalAlpha = aid.alpha;

    // Sacred Radiance Aura
    let aura = ctx.createRadialGradient(0, 0, 10, 0, 0, 100);
    aura.addColorStop(0, 'rgba(253, 224, 71, 0.9)');
    aura.addColorStop(0.5, 'rgba(245, 158, 11, 0.4)');
    aura.addColorStop(1, 'rgba(245, 158, 11, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, 100, 0, Math.PI * 2);
    ctx.fill();

    // Golden Arc Rays Flowing Out
    ctx.strokeStyle = 'rgba(254, 240, 138, 0.7)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      let ang = (i * Math.PI) / 4 + Date.now() * 0.002;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 35, Math.sin(ang) * 35);
      ctx.quadraticCurveTo(Math.cos(ang + 0.3) * 65, Math.sin(ang + 0.3) * 65, Math.cos(ang) * 85, Math.sin(ang) * 85);
      ctx.stroke();
    }

    // Floating Hooded Cloak & Matriarch Robes
    ctx.fillStyle = '#b45309';
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -32);
    ctx.quadraticCurveTo(-26, -20, -32, 28);
    ctx.lineTo(32, 28);
    ctx.quadraticCurveTo(26, -20, 0, -32);
    ctx.fill();
    ctx.stroke();

    // Wise Face & Hood Shadow
    ctx.fillStyle = '#5f2f11';
    ctx.beginPath();
    ctx.arc(0, -18, 9, 0, Math.PI * 2);
    ctx.fill();

    // Floating Sacred Tome with Light Beams
    ctx.fillStyle = '#78350f';
    ctx.fillRect(-18, 5, 36, 12);
    ctx.fillStyle = '#fef08a';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.fillRect(-16, 6, 14, 10);
    ctx.fillRect(2, 6, 14, 10);
    ctx.shadowBlur = 0;

    // Outstretched Golden Hands
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(-22, 2, 4, 0, Math.PI * 2);
    ctx.arc(22, 2, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // 3. Xochitl: Aztec Headdress & Layered Razor Feather Wings[span_12](start_span)[span_12](end_span)
  function drawXochitl(ctx, p) {
    ctx.save();
    ctx.translate(p.x, p.y - 30);

    // Razor Feather Wings (Out during Jump, Hover, or Guard)[span_13](start_span)[span_13](end_span)[span_14](start_span)[span_14](end_span)[span_15](start_span)[span_15](end_span)
    if (!p.isGrounded || p.guarding) {
      const tiers = ['#ef4444', '#f97316', '#eab308', '#10b981', '#06b6d4'];
      [-1, 1].forEach(dir => {
        tiers.forEach((col, idx) => {
          ctx.save();
          let spread = (idx * 0.18 + 0.2) * dir;
          let flap = Math.sin(Date.now() * 0.01) * 0.12;
          ctx.rotate(spread + flap);

          // Sharp Razor-Blade Feather Blade
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(dir * 25, -28 - idx * 4);
          ctx.lineTo(dir * (50 + idx * 5), -14 - idx * 2); // Razor sharp tip
          ctx.lineTo(dir * 20, 5);
          ctx.closePath();

          ctx.fillStyle = col;
          ctx.shadowColor = col;
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        });
      });
    }

    // Armor Body & Skirt
    ctx.fillStyle = '#9a3412';
    ctx.fillRect(-10, 0, 20, 26);
    ctx.fillStyle = '#ea580c';
    ctx.fillRect(-12, 16, 24, 14);

    // Feathered Solar Crest Headdress[span_16](start_span)[span_16](end_span)
    const headdressColors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6'];
    for (let i = -3; i <= 3; i++) {
      ctx.fillStyle = headdressColors[Math.abs(i) % headdressColors.length];
      ctx.beginPath();
      ctx.moveTo(i * 3.5, -24);
      ctx.lineTo(i * 5, -42 - (3 - Math.abs(i)) * 3);
      ctx.lineTo(i * 3.5 + 2, -24);
      ctx.fill();
    }

    // Warrior Head
    ctx.fillStyle = '#7c2d12';
    ctx.beginPath();
    ctx.arc(0, -16, 9, 0, Math.PI * 2);
    ctx.fill();

    // Golden Bracers
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-14, 4, 4, 10);
    ctx.fillRect(10, 4, 4, 10);

    ctx.restore();
  }

  // 4. Marcus Prime: Cyber Knight with Kinetic Absorption Armor[span_17](start_span)[span_17](end_span)
  function drawMarcusPrime(ctx, p) {
    ctx.save();
    ctx.translate(p.x, p.y - 30);

    // Armor Silhouette
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;

    // Kinetic glow when holding charge
    if (p.chargeEnergy > 0) {
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = (p.chargeEnergy / p.maxCharge) * 18;
    }

    // Armored Torso
    ctx.beginPath();
    ctx.moveTo(-14, -14);
    ctx.lineTo(14, -14);
    ctx.lineTo(10, 24);
    ctx.lineTo(-10, 24);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cyan Tech Core
    ctx.fillStyle = p.chargeEnergy > 50 ? '#facc15' : '#00e5ff';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    // Armored Shoulders & Gauntlets
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-22, -14, 8, 12);
    ctx.fillRect(14, -14, 8, 12);

    // Helmet & Visor
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(0, -22, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Electric Blue Visor
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(-6, -24, 12, 4);

    // Electric Sparks If Charged
    if (p.chargeEnergy > 20) {
      ctx.strokeStyle = '#67e8f9';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        let sx = (Math.random() - 0.5) * 36;
        let sy = (Math.random() - 0.5) * 45;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + (Math.random() - 0.5) * 12, sy + (Math.random() - 0.5) * 12);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  // Draw Lightning Beams
  function drawLightning(ctx) {
    for (let i = lightningArcs.length - 1; i >= 0; i--) {
      let arc = lightningArcs[i];
      let steps = 10;
      let dx = (arc.x2 - arc.x1) / steps;
      let dy = (arc.y2 - arc.y1) / steps;

      ctx.save();
      ctx.strokeStyle = arc.overload ? '#facc15' : '#38bdf8';
      ctx.lineWidth = 3 * arc.power;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 14;

      ctx.beginPath();
      ctx.moveTo(arc.x1, arc.y1);
      for (let s = 1; s < steps; s++) {
        let jx = (Math.random() - 0.5) * 22 * arc.power;
        let jy = (Math.random() - 0.5) * 22 * arc.power;
        ctx.lineTo(arc.x1 + dx * s + jx, arc.y1 + dy * s + jy);
      }
      ctx.lineTo(arc.x2, arc.y2);
      ctx.stroke();
      ctx.restore();

      arc.duration--;
      if (arc.duration <= 0) lightningArcs.splice(i, 1);
    }
  }

  // City Skyline
  function drawSkyline() {
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Detroit Rooftops / Towers
    ctx.fillStyle = '#111827';
    ctx.fillRect(80, canvas.height - 240, 90, 240);
    ctx.fillRect(200, canvas.height - 310, 110, 310);
    ctx.fillRect(450, canvas.height - 380, 140, 380); // Ren-Cen Center Tower
    ctx.fillRect(680, canvas.height - 260, 100, 260);

    // Windows
    ctx.fillStyle = '#38bdf8';
    for (let y = canvas.height - 350; y < canvas.height - 60; y += 24) {
      ctx.fillRect(480, y, 6, 12);
      ctx.fillRect(520, y, 6, 12);
      ctx.fillRect(550, y, 6, 12);
    }

    // Platform Rooftop
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, canvas.height - 40, canvas.width, 40);
  }

  // Main Loop
  function loop() {
    update();

    drawSkyline();

    // Drones
    drones.forEach(d => {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(d.x, d.y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(d.x - 6, d.y - 2, 12, 4);
    });

    // Enemy Projectiles
    ctx.fillStyle = '#f87171';
    enemyProjectiles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Player Projectiles
    playerProjectiles.forEach(p => {
      ctx.save();
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(p.x + 12, p.y);
      ctx.lineTo(p.x - 8, p.y - 6);
      ctx.lineTo(p.x - 8, p.y + 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Characters
    if (boss.active) drawChronoLock(ctx, boss);
    if (activeHero === 'XOCHITL') drawXochitl(ctx, player);
    else drawMarcusPrime(ctx, player);

    // Mother Luetta Assist Active
    if (luettaAid.active) {
      drawMotherLuetta(ctx, luettaAid);
      luettaAid.alpha -= 0.015;
      if (luettaAid.alpha <= 0) luettaAid.active = false;
    }

    // Lightning
    drawLightning(ctx);

    // Screen Flash (Purge)
    if (screenFlash > 0) {
      ctx.fillStyle = `rgba(254, 240, 138, ${screenFlash / 35})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      screenFlash--;
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
