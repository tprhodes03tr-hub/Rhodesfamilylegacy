<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Fannie May's Book Express | Rhodes Family Legacy</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #131c2e;
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #dc2626;
            --border-glow: rgba(245, 158, 11, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
        }

        .portal-header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 480px;
        }

        .portal-header h1 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .tree-emblem {
            width: 45px;
            height: 45px;
            margin: 0 auto 4px;
            background: radial-gradient(circle, rgba(245,158,11,0.2) 0%, rgba(11,15,25,0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--gold-light);
            box-shadow: 0 0 15px var(--border-glow);
            margin-bottom: 10px;
            width: 100%;
            max-width: 480px;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 340px;
            background: linear-gradient(to bottom, #38bdf8 0%, #bae6fd 40%, #1e293b 40%, #0f172a 100%);
            border: 3px solid var(--gold);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            margin-bottom: 12px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
        }

        .control-btn {
            background: linear-gradient(to bottom, #334155, #1e293b);
            border: 2px solid var(--gold);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn:active {
            transform: scale(0.96);
            background: var(--gold);
            color: var(--bg-dark);
        }

        .reward-btn {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            border: 2px solid #fff;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }

        .return-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 5px;
            transition: color 0.2s;
        }

        .return-link:hover {
            color: var(--gold);
        }

        /* Age Selector Modal */
        #ageModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        #ageModal h2 {
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        #ageModal p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .modal-btns {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--gold);
            background: var(--panel-bg);
            color: var(--text-main);
            transition: 0.2s;
        }

        .modal-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }
    </style>
</head>
<body>

    <div class="portal-header">
        <h1>Rhodes Family Legacy</h1>
        <div class="tree-emblem">🌳</div>
    </div>

    <div class="score-board">
        <span id="scoreDisplay">SCORE: 0</span>
        <span id="zoneDisplay">ZONE: DETROIT</span>
        <span id="targetDisplay">500 PTS = BOOK REWARD</span>
    </div>

    <div class="game-container">
        <!-- Age / Difficulty Selector Overlay -->
        <div id="ageModal">
            <h2>Welcome to Little Fannie May's Express!</h2>
            <p>Select your driving experience level for customized speed and trivia depth:</p>
            <div class="modal-btns">
                <button class="modal-btn" onclick="startGame('junior')">Junior Explorer (Kids)</button>
                <button class="modal-btn" onclick="startGame('adult')">Legacy Adult Driver</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="480" height="340"></canvas>
    </div>

    <div class="controls-panel">
        <button class="control-btn" onclick="moveTruck(-1)">◀ DRIVE LEFT</button>
        <button class="control-btn" onclick="moveTruck(1)">DRIVE RIGHT ▶</button>
    </div>

    <a href="#" class="reward-btn" id="rewardBtn" onclick="claimReward()">⭐ COLLECT 500 PTS = UNLOCK BOOK CHAPTER! ⭐</a>
    
    <a href="index.html" class="return-link">← RETURN TO CINEMA HUB</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gameActive = false;
        let difficulty = 'junior'; // 'junior' or 'adult'
        let truckLane = 1; // 0: Left, 1: Center, 2: Right
        const lanes = [90, 240, 390];
        let truckX = lanes[1];
        const truckY = 250;

        let obstacles = [];
        let particles = [];
        let speedMultiplier = 1;

        function startGame(mode) {
            difficulty = mode;
            speedMultiplier = (mode === 'adult') ? 1.4 : 1.0;
            document.getElementById('ageModal').style.display = 'none';
            gameActive = true;
            resetGame();
            loop();
        }

        function resetGame() {
            score = 0;
            obstacles = [];
            truckLane = 1;
            truckX = lanes[truckLane];
        }

        function moveTruck(dir) {
            if (!gameActive) return;
            truckLane += dir;
            if (truckLane < 0) truckLane = 0;
            if (truckLane > 2) truckLane = 2;
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() > 0.4 ? 'parcel' : 'barrier';
            obstacles.push({
                lane: lane,
                y: -50,
                type: type,
                size: 36
            });
        }

        let spawnTimer = 0;

        function update() {
            if (!gameActive) return;

            // Smooth truck lane transition
            let targetX = lanes[truckLane];
            truckX += (targetX - truckX) * 0.2;

            spawnTimer++;
            if (spawnTimer > (100 / speedMultiplier)) {
                spawnObstacle();
                spawnTimer = 0;
            }

            // Update obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += 3.5 * speedMultiplier;

                // Collision check with truck
                if (obstacles[i].y > truckY - 30 && obstacles[i].y < truckY + 40 && obstacles[i].lane === truckLane) {
                    if (obstacles[i].type === 'parcel') {
                        score += (difficulty === 'adult' ? 25 : 50);
                        triggerParticles(truckX, truckY);
                    } else {
                        score = Math.max(0, score - 20); // Penalty for obstacles
                    }
                    obstacles.splice(i, 1);
                    continue;
                }

                // Remove offscreen
                if (obstacles[i] && obstacles[i].y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                }
            }

            // Update score & reward display
            document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
            if (score >= 500) {
                document.getElementById('rewardBtn').style.background = 'linear-gradient(135deg, #059669, #10b981)';
                document.getElementById('rewardBtn').innerText = '🎉 UNLOCK UNIFIED BOOK CHAPTER NOW! 🎉';
            }
        }

        function triggerParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 20
                });
            }
        }

        function draw() {
            // Sky & Horizon
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(140, 120);
            ctx.lineTo(340, 120);
            ctx.lineTo(440, canvas.height);
            ctx.lineTo(40, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Lane Dividers
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(200, 120);
            ctx.lineTo(180, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(280, 120);
            ctx.lineTo(300, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Obstacles / Parcels
            obstacles.forEach(obs => {
                let ox = lanes[obs.lane];
                let oy = obs.y;
                if (obs.type === 'parcel') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(ox - 18, oy - 18, 36, 36);
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText('📦', ox - 10, oy + 6);
                } else {
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(ox - 18, oy - 18, 36, 36);
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText('⚠️', ox - 10, oy + 6);
                }
            });

            // Draw Truck (Fannie May's Book Express)
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(truckX - 24, truckY - 20, 48, 50); // Cab & Body
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(truckX - 18, truckY - 12, 36, 25); // Cargo box
            ctx.fillStyle = '#0b0f19';
            ctx.font = '9px sans-serif';
            ctx.fillText('EXPRESS', truckX - 22, truckY + 2);

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(p.x, p.y, 4, 4);
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        function claimReward() {
            if (score >= 500) {
                alert('Congratulations! You unlocked the VIP Chapter Preview from Packed in the Marrow & Little Luetta!');
                window.location.href = 'https://payhip.com/rhodesfamilylegacy';
            } else {
                alert('Reach 500 points to unlock your book reward chapter!');
            }
        }
    </script>
</body>
</html>
