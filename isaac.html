<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Universe & Sports Lounge - Rhodes Family Legacy</title>
    <style>
        :root {
            --gold: #f39c12;
            --dark-bg: #07090f;
            --panel-bg: #121824;
            --neon-blue: #00d2ff;
            --neon-red: #ff3366;
            --pistons-blue: #1d428a;
            --pistons-red: #c8102e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 8px;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.15rem;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .sport-tabs {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
            width: 100%;
            max-width: 480px;
        }

        .sport-tab {
            flex: 1;
            padding: 8px;
            border: 1px solid #4a5568;
            background: var(--panel-bg);
            color: #a0aec0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .sport-tab.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .game-container {
            background: var(--panel-bg);
            border: 2px solid #2d3748;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .game-view {
            width: 100%;
            height: 310px;
            background: #07090f;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            display: none;
        }

        .game-view.active {
            display: block;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--gold);
        }

        .instruction-text {
            margin: 6px 0;
            font-size: 0.7rem;
            color: #a0aec0;
            text-align: center;
            min-height: 20px;
        }

        .controls-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            background: var(--gold);
            color: #000;
        }

        .action-btn:hover {
            background: #e67e22;
        }

        .btn-secondary {
            background: #2d3748;
            color: #fff;
            border: 1px solid #4a5568;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vanguard Universe & Sports Lounge</h1>
    </header>

    <div class="sport-tabs">
        <button class="sport-tab active" onclick="switchSport('basketball')">🏀 Basketball</button>
        <button class="sport-tab" onclick="switchSport('pool')">🎱 Pool Table</button>
        <button class="sport-tab" onclick="switchSport('bowling')">🎳 Bowling</button>
    </div>

    <div class="game-container">
        <!-- Basketball View -->
        <div id="view-basketball" class="game-view active">
            <canvas id="bbCanvas" width="440" height="310"></canvas>
        </div>

        <!-- Pool View -->
        <div id="view-pool" class="game-view">
            <canvas id="poolCanvas" width="440" height="310"></canvas>
        </div>

        <!-- Bowling View -->
        <div id="view-bowling" class="game-view">
            <canvas id="bowlCanvas" width="440" height="310"></canvas>
        </div>

        <div class="score-bar">
            <span id="score-label">SCORE: 0</span>
            <span id="timer-label">TIME: 40s</span>
        </div>

        <div class="instruction-text" id="instruction-label">
            Adjust aim, hold power meter, make shots before time runs out!
        </div>

        <div class="controls-row">
            <button class="action-btn btn-secondary" onclick="adjustAim(-1)">◄ Aim</button>
            <button class="action-btn" id="main-action-btn" onclick="triggerAction()">Shoot / Release</button>
            <button class="action-btn btn-secondary" onclick="adjustAim(1)">Aim ►</button>
        </div>
    </div>

    <script>
        let currentSport = 'basketball';

        function switchSport(sport) {
            currentSport = sport;
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));

            if (sport === 'basketball') {
                document.getElementById('view-basketball').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Marcus Prime showdown: 40s timer, moving backboard & fire streaks!";
            } else if (sport === 'pool') {
                document.getElementById('view-pool').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Syndicate 8-Ball: full rack, color-coded balls & +10 pocket bonuses!";
            } else if (sport === 'bowling') {
                document.getElementById('view-bowling').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Monument Valley Alley: aim at specific pins, sweeper gate pin recovery!";
            }
        }

        // --- Upgraded Basketball Game Logic ---
        const bbCanvas = document.getElementById('bbCanvas');
        const bbCtx = bbCanvas.getContext('2d');
        let bbX = 65, bbY = 230, aimAngle = -0.5, isShooting = false;
        let bbScore = 0, timeLeft = 40, streakCount = 0, timerActive = false;
        let boardX = 350, boardDir = 0.8;
        let powerVal = 0, charging = false;

        function startBasketballTimer() {
            if (timerActive) return;
            timerActive = true;
            let interval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-label').innerText = "TIME: " + timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerActive = false;
                    alert("Time's Up! Final Score: " + bbScore);
                    resetBasketball();
                    timeLeft = 40;
                }
            }, 1000);
        }

        function drawBasketball() {
            bbCtx.fillStyle = '#07090f';
            bbCtx.fillRect(0, 0, 440, 310);

            // Pistons Blue & Red Floorboards
            bbCtx.fillStyle = '#1d428a';
            bbCtx.fillRect(0, 240, 440, 70);
            bbCtx.fillStyle = '#c8102e';
            bbCtx.fillRect(0, 235, 440, 5);

            // Family Tree & Double Helix Backdrop
            bbCtx.fillStyle = 'rgba(243, 156, 18, 0.2)';
            bbCtx.font = 'bold 11px sans-serif';
            bbCtx.fillText('RHODES FAMILY LEGACY', 145, 30);

            bbCtx.strokeStyle = '#f39c12';
            bbCtx.lineWidth = 2;
            bbCtx.beginPath();
            // Double Helix Center
            for (let y = 45; y < 200; y += 12) {
                let offset = Math.sin(y * 0.1) * 15;
                bbCtx.moveTo(210 + offset, y); bbCtx.lineTo(230 - offset, y + 6);
            }
            // Golden Tree Branches
            bbCtx.moveTo(220, 50); bbCtx.quadraticCurveTo(180, 35, 150, 20);
            bbCtx.moveTo(220, 50); bbCtx.quadraticCurveTo(260, 35, 290, 20);
            bbCtx.stroke();

            // Moving Backboard & Hoop
            boardX += boardDir;
            if (boardX > 370 || boardX > 330) boardDir *= -1;

            bbCtx.strokeStyle = '#00d2ff';
            bbCtx.lineWidth = 3;
            bbCtx.strokeRect(boardX, 80 + (boardX%3), 12, 75);
            
            // Rim / Net Heating up on streak
            bbCtx.strokeStyle = streakCount >= 3 ? '#ff3366' : '#f39c12';
            bbCtx.lineWidth = streakCount >= 3 ? 4 : 3;
            bbCtx.beginPath();
            bbCtx.arc(boardX - 12, 110 + (boardX%3), 18, 0, Math.PI);
            bbCtx.stroke();

            // Marcus Prime Sprite (Hero)
            bbCtx.fillStyle = '#1d428a';
            bbCtx.fillRect(45, 190, 24, 45);
            bbCtx.fillStyle = '#f39c12';
            bbCtx.beginPath(); bbCtx.arc(57, 180, 9, 0, Math.PI*2); bbCtx.fill();

            // Basketball (Glows Red on Streak)
            bbCtx.fillStyle = streakCount >= 3 ? '#ff3366' : '#f39c12';
            if (streakCount >= 3) {
                bbCtx.shadowColor = '#ff3366';
                bbCtx.shadowBlur = 12;
            }
            bbCtx.beginPath();
            bbCtx.arc(bbX, bbY, 12, 0, Math.PI * 2);
            bbCtx.fill();
            bbCtx.shadowBlur = 0;
            bbCtx.strokeStyle = '#000';
            bbCtx.stroke();

            // Aim Line
            bbCtx.strokeStyle = '#00d2ff';
            bbCtx.lineWidth = 2;
            bbCtx.setLineDash([4, 4]);
            bbCtx.beginPath();
            bbCtx.moveTo(bbX, bbY);
            bbCtx.lineTo(bbX + Math.cos(aimAngle) * 90, bbY + Math.sin(aimAngle) * 90);
            bbCtx.stroke();
            bbCtx.setLineDash([]);

            // Pressure Power Meter on screen
            bbCtx.fillStyle = '#1e293b';
            bbCtx.fillRect(20, 275, 130, 16);
            bbCtx.fillStyle = '#f39c12';
            powerVal = (powerVal + 1) % 100;
            bbCtx.fillRect(22, 277, (powerVal / 100) * 126, 12);
            bbCtx.fillStyle = '#fff';
            bbCtx.font = 'bold 9px sans-serif';
            bbCtx.fillText('SHOT PRESSURE METER', 30, 287);
        }

        function triggerAction() {
            if (currentSport === 'basketball') {
                startBasketballTimer();
                if (!isShooting) {
                    isShooting = true;
                    let t = setInterval(() => {
                        bbX += 14;
                        bbY -= 7;
                        if (bbX >= boardX - 10) {
                            clearInterval(t);
                            bbScore += 2;
                            streakCount++;
                            document.getElementById('score-label').innerText = "SCORE: " + bbScore;
                            setTimeout(resetBasketball, 300);
                        }
                    }, 25);
                }
            } else if (currentSport === 'pool') {
                cueY -= 35;
                setTimeout(() => { 
                    cueY = 230; 
                    poolScore += 10;
                    document.getElementById('score-label').innerText = "SCORE: " + poolScore;
                    pocketedBalls++;
                }, 250);
            } else if (currentSport === 'bowling') {
                let bt = setInterval(() => {
                    bowlY -= 15;
                    if (bowlY <= 70) {
                        clearInterval(bt);
                        setTimeout(() => { 
                            bowlX = 220; bowlY = 260; 
                            pins = pins.filter(p => Math.abs(p.x - bowlX) > 20); // Sweeper picks up standing/unhit pins
                        }, 400);
                    }
                }, 25);
            }
        }

        function adjustAim(dir) {
            if (currentSport === 'basketball') aimAngle += dir * 0.1;
            else if (currentSport === 'pool') cueX += dir * 12;
            else if (currentSport === 'bowling') bowlX += dir * 15;
        }

        function resetBasketball() {
            bbX = 65; bbY = 230; aimAngle = -0.5; isShooting = false;
        }

        // --- Upgraded Pool Table (Full Rack, Colors & +10 Points) ---
        const poolCanvas = document.getElementById('poolCanvas');
        const poolCtx = poolCanvas.getContext('2d');
        let cueX = 220, cueY = 230, poolScore = 0, pocketedBalls = 0;
        let fullRack = [
            {x:220, y:90, color:'#f39c12'}, {x:205, y:105, color:'#2980b9'}, {x:235, y:105, color:'#c0392b'},
            {x:190, y:120, color:'#8e44ad'}, {x:220, y:120, color:'#d35400'}, {x:250, y:120, color:'#27ae60'},
            {x:175, y:135, color:'#f1c40f'}, {x:205, y:135, color:'#e74c3c'}, {x:235, y:135, color:'#3498db'}, {x:265, y:135, color:'#9b59b6'}
        ];

        function drawPool() {
            poolCtx.fillStyle = '#07090f';
            poolCtx.fillRect(0, 0, 440, 310);

            // Green Felt & Wooden Borders
            poolCtx.fillStyle = '#104e28';
            poolCtx.fillRect(25, 20, 390, 270);
            poolCtx.strokeStyle = '#5c3a21';
            poolCtx.lineWidth = 10;
            poolCtx.strokeRect(25, 20, 390, 270);

            // Render Full Rack with Colors
            fullRack.forEach((b, idx) => {
                poolCtx.fillStyle = b.color;
                poolCtx.beginPath(); poolCtx.arc(b.x, b.y, 8, 0, Math.PI*2); poolCtx.fill();
                poolCtx.strokeStyle = '#fff'; poolCtx.stroke();
            });

            // Cue Ball & Stick
            poolCtx.fillStyle = '#ffffff';
            poolCtx.beginPath(); poolCtx.arc(cueX, cueY, 9, 0, Math.PI*2); poolCtx.fill();
            poolCtx.strokeStyle = '#d4a373'; poolCtx.lineWidth = 5;
            poolCtx.beginPath(); poolCtx.moveTo(cueX, cueY + 15); poolCtx.lineTo(cueX, cueY + 110); poolCtx.stroke();
        }

        // --- Upgraded Bowling (Pins, Sweeper & Precise Aim) ---
        const bowlCanvas = document.getElementById('bowlCanvas');
        const bowlCtx = bowlCanvas.getContext('2d');
        let bowlX = 220, bowlY = 260;
        let pins = [
            {x: 220, y: 55}, {x: 205, y: 70}, {x: 235, y: 70},
            {x: 190, y: 85}, {x: 220, y: 85}, {x: 250, y: 85}
        ];

        function drawBowling() {
            bowlCtx.fillStyle = '#07090f';
            bowlCtx.fillRect(0, 0, 440, 310);

            // Alley
            bowlCtx.fillStyle = '#d2691e';
            bowlCtx.beginPath();
            bowlCtx.moveTo(100, 310); bowlCtx.lineTo(340, 310);
            bowlCtx.lineTo(260, 40); bowlCtx.lineTo(180, 40);
            bowlCtx.fill();

            // Pins
            pins.forEach(p => {
                bowlCtx.fillStyle = '#fff';
                bowlCtx.beginPath(); bowlCtx.arc(p.x, p.y, 7, 0, Math.PI*2); bowlCtx.fill();
                bowlCtx.strokeStyle = '#ff3366'; bowlCtx.stroke();
            });

            // Bowling Ball with Aim Line
            bowlCtx.strokeStyle = '#00d2ff';
            bowlCtx.lineWidth = 2;
            bowlCtx.setLineDash([3,3]);
            bowlCtx.beginPath(); bowlCtx.moveTo(bowlX, bowlY); bowlCtx.lineTo(bowlX, 60); bowlCtx.stroke();
            bowlCtx.setLineDash([]);

            bowlCtx.fillStyle = '#00d2ff';
            bowlCtx.beginPath(); bowlCtx.arc(bowlX, bowlY, 11, 0, Math.PI*2); bowlCtx.fill();
            bowlCtx.strokeStyle = '#fff'; bowlCtx.stroke();
        }

        function redrawAll() {
            if (currentSport === 'basketball') drawBasketball();
            else if (currentSport === 'pool') drawPool();
            else if (currentSport === 'bowling') drawBowling();
        }

        setInterval(redrawAll, 30);
    </script>
</body>
</html>
