<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RenCen Rooftop Clash - Isaac Rhodes Adventures</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050813;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
    }
    .header-bar {
      width: 100%;
      max-width: 900px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #091224;
      border-bottom: 2px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .header-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
    }
    .hud {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(10, 18, 32, 0.95);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }
    .hud-box {
      flex: 1;
      background: rgba(17, 28, 48, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .hud-name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .bar-container {
      width: 100%;
      height: 10px;
      background: #111a2e;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hp-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    #player-hp {
      background: linear-gradient(90deg, #00f0ff, #00ff88);
      box-shadow: 0 0 8px #00f0ff;
    }
    #boss-hp {
      background: linear-gradient(90deg, #ff3366, #ff8800);
      box-shadow: 0 0 8px #ff3366;
    }
    .hud-mid {
      flex: 1.2;
      text-align: center;
      font-size: 11px;
      line-height: 1.3;
      color: #ffcc00;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #game-canvas {
      display: block;
      width: 100%;
      max-width: 900px;
      height: 380px;
      background: #0a0b1a;
      border-bottom: 2px solid #00f0ff;
    }
    .controls {
      width: 100%;
      max-width: 900px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ctrl-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .d-pad {
      display: flex;
      gap: 8px;
    }
    button.game-btn {
      background: #13243f;
      color: #e2f1ff;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 12px 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.05s, background 0.1s;
    }
    button.game-btn:active {
      transform: scale(0.96);
      background: #1e3a66;
    }
    button.game-btn span.subtext {
      font-size: 9px;
      color: #88c5ff;
      font-weight: normal;
    }
    .btn-action {
      background: #0f3d64;
    }
    .btn-burst {
      background: #6e1c28;
      border-color: #ff4d6d;
    }
    .btn-swap {
      background: #b85c00;
      border-color: #ff9d00;
    }
    .btn-heal {
      background: #124e3f;
      border-color: #00ffaa;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">RENCEN ROOFTOP CLASH</div>
  </div>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-name" id="player-label" style="color: #00f0ff;">XOCHITL</div>
      <div class="bar-container">
        <div id="player-hp" class="hp-fill"></div>
      </div>
    </div>
    <div class="hud-mid">
      CH. 1: DETROIT REN-CEN<br>ROOFTOP SHOWDOWN
    </div>
    <div class="hud-box">
      <div class="hud-name" style="color: #ff3366; text-align: right;">CHRONO-LOCK</div>
      <div class="bar-container">
        <div id="boss-hp" class="hp-fill"></div>
      </div>
    </div>
  </div>

  <canvas id="game-canvas" width="900" height="380"></canvas>

  <div class="controls">
    <div class="ctrl-col">
      <button class="game-btn" id="btn-jump">▲ JUMP / HOVER</button>
      <div class="d-pad">
        <button class="game-btn" style="flex:1;" id="btn-left">◀ LEFT</button>
        <button class="game-btn" style="flex:1;" id="btn-right">RIGHT ▶</button>
      </div>
    </div>

    <div class="ctrl-col">
      <div style="display:flex; gap:8px;">
        <button class="game-btn btn-action" style="flex:1;" id="btn-strike">
          STRIKE
          <span class="subtext" id="lbl-strike">MAGMA PUNCH</span>
        </button>
        <button class="game-btn btn-burst" style="flex:1;" id="btn-burst">
          BURST
          <span class="subtext" id="lbl-burst">LAVA / FEATHERS</span>
        </button>
      </div>
      <button class="game-btn btn-swap" id="btn-swap">
        TAG SWAP
        <span class="subtext" id="lbl-swap">MARCUS PRIME</span>
      </button>
    </div>

    <button class="game-btn btn-heal" id="btn-heal">
      ★ MOTHER LUETTA AID ★
      <span class="subtext">ANCESTRAL RESTORATION (+35 HP)</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const FLOOR_Y = 320;

    // Characters state
    let activeHero = 'XOCHITL'; // 'XOCHITL' or 'MARCUS'

    const player = {
      x: 120,
      y: FLOOR_Y - 90,
      w: 50,
      h: 90,
      vx: 0,
      vy: 0,
      isGrounded: true,
      hovering: false,
      maxHp: 100,
      hp: 100,
      hitFlash: 0
    };

    const boss = {
      x: 650,
      y: FLOOR_Y - 120,
      w: 80,
      h: 120,
      maxHp: 200,
      hp: 200,
      hitFlash: 0,
      shootTimer: 0,
      gearAngle: 0
    };

    let projectiles = [];
    let electricBeams = [];
    let particles = [];

    // Controls
    const keys = { left: false, right: false };

    // --- DRAWING FUNCTIONS ---

    function drawCityBackground() {
      // Twilight Gradient
      let sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
      sky.addColorStop(0, '#060a17');
      sky.addColorStop(0.6, '#18122b');
      sky.addColorStop(1, '#3b1828');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Ren-Cen Towers Silhouettes
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(80, 100, 60, 220);
      ctx.fillRect(180, 60, 90, 260);
      ctx.fillRect(380, 40, 130, 280); // Main Ren-Cen center cylinder
      ctx.fillRect(560, 80, 80, 240);
      ctx.fillRect(720, 110, 70, 210);

      // Lit windows
      ctx.fillStyle = '#00f0ff';
      for (let y = 60; y < FLOOR_Y; y += 22) {
        ctx.fillRect(430, y, 6, 10);
        ctx.fillRect(455, y, 6, 10);
      }
      ctx.fillStyle = '#ffaa33';
      for (let y = 120; y < FLOOR_Y; y += 28) {
        ctx.fillRect(205, y, 5, 8);
        ctx.fillRect(590, y, 5, 8);
      }

      // Rooftop edge line & vents
      ctx.fillStyle = '#1c2738';
      ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, FLOOR_Y);
      ctx.lineTo(canvas.width, FLOOR_Y);
      ctx.stroke();

      // Rooftop vents
      ctx.fillStyle = '#223048';
      ctx.fillRect(320, FLOOR_Y - 30, 30, 30);
      ctx.fillRect(510, FLOOR_Y - 35, 35, 35);
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(328, FLOOR_Y - 20, 14, 4);
      ctx.fillRect(518, FLOOR_Y - 24, 18, 4);
    }

    function drawXochitl(p) {
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);

      if (p.hitFlash > 0) {
        ctx.filter = 'brightness(2.5)';
      }

      const isAirborne = !p.isGrounded;

      // 1. Radiant Solar Feather Wings (Expanded when airborne/hovering)
      if (isAirborne || p.hovering) {
        ctx.save();
        for (let side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.quadraticCurveTo(side * 50, -60, side * 75, -20);
          ctx.quadraticCurveTo(side * 40, -5, 0, 10);
          let wingGrad = ctx.createLinearGradient(0, -50, side * 75, 0);
          wingGrad.addColorStop(0, '#ffe600');
          wingGrad.addColorStop(0.5, '#ff5500');
          wingGrad.addColorStop(1, '#aa0022');
          ctx.fillStyle = wingGrad;
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 15;
          ctx.fill();

          // Feather spines
          ctx.strokeStyle = '#fffb96';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(side * 70, -20);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 2. Aztec Feather Headdress
      const colors = ['#00d4ff', '#ffcc00', '#ff2a00', '#00ff88', '#ff7700'];
      for (let i = -2; i <= 2; i++) {
        ctx.save();
        ctx.rotate((i * 14 * Math.PI) / 180);
        ctx.fillStyle = colors[i + 2];
        ctx.beginPath();
        ctx.moveTo(-5, -35);
        ctx.lineTo(0, -62);
        ctx.lineTo(5, -35);
        ctx.fill();
        ctx.restore();
      }

      // 3. Head & Gold Headband
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.arc(0, -30, 12, 0, Math.PI * 2);
      ctx.fill();

      // Gold Diadem
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-12, -35, 24, 6);
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(-3, -34, 6, 4);

      // 4. Armor & Torso
      ctx.fillStyle = '#a04218';
      ctx.fillRect(-10, -18, 20, 26);
      // Chest Medallion
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(0, -10, 6, 0, Math.PI * 2);
      ctx.fill();
      // War Skirt
      ctx.fillStyle = '#682411';
      ctx.beginPath();
      ctx.moveTo(-12, 8);
      ctx.lineTo(12, 8);
      ctx.lineTo(8, 24);
      ctx.lineTo(-8, 24);
      ctx.closePath();
      ctx.fill();

      // 5. Legs & Greaves
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(-9, 24, 7, 20);
      ctx.fillRect(2, 24, 7, 20);
      ctx.fillStyle = '#d96e14';
      ctx.fillRect(-10, 32, 9, 12);
      ctx.fillRect(1, 32, 9, 12);

      // 6. Massive Magma / Lava Gauntlets
      for (let side of [-1, 1]) {
        let gx = side * 18;
        let gy = 2;
        // Forearm Gauntlet Base
        ctx.fillStyle = '#261b17';
        ctx.fillRect(gx - 7, gy - 8, 14, 22);

        // Molten Lava Glow Texture
        ctx.fillStyle = '#ff4d00';
        ctx.shadowColor = '#ff7700';
        ctx.shadowBlur = 10;
        ctx.fillRect(gx - 5, gy - 4, 10, 14);

        ctx.fillStyle = '#ffee44';
        ctx.fillRect(gx - 2, gy - 1, 4, 8);

        // Claws
        ctx.fillStyle = '#111';
        for (let c = -1; c <= 1; c++) {
          ctx.beginPath();
          ctx.moveTo(gx + c * 4, gy + 14);
          ctx.lineTo(gx + c * 4 + side * 2, gy + 22);
          ctx.lineTo(gx + c * 4 + 2, gy + 14);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function drawMarcusPrime(p) {
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);

      if (p.hitFlash > 0) {
        ctx.filter = 'brightness(2.5)';
      }

      // Electric Aura Jitter
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 48 + Math.random() * 6, 0, Math.PI * 2);
      ctx.stroke();

      // Head & Hair
      ctx.fillStyle = '#54331a';
      ctx.beginPath();
      ctx.arc(0, -30, 13, 0, Math.PI * 2);
      ctx.fill();

      // Black Tactical Hoodie & Vest
      ctx.fillStyle = '#1e2430';
      ctx.fillRect(-13, -17, 26, 30);
      ctx.fillStyle = '#0f141d';
      ctx.fillRect(-9, -17, 18, 28);

      // Cyan Bloodline Insignia
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(-5, -6);
      ctx.lineTo(0, -14);
      ctx.lineTo(5, -6);
      ctx.lineTo(0, -9);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // Legs & Cargo Pants
      ctx.fillStyle = '#151b24';
      ctx.fillRect(-11, 13, 10, 31);
      ctx.fillRect(1, 13, 10, 31);

      // Electric High-Tech Gauntlets
      for (let side of [-1, 1]) {
        let armX = side * 18;
        ctx.fillStyle = '#232f42';
        ctx.fillRect(armX - 5, -5, 10, 24);

        // Voltage conductors
        ctx.fillStyle = '#00e5ff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(armX - 3, 5, 6, 12);
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }

    function drawChronoLock(b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);

      if (b.hitFlash > 0) {
        ctx.filter = 'brightness(2.5)';
      }

      b.gearAngle += 0.03;

      // 1. Heavy Cog Shoulders
      for (let side of [-1, 1]) {
        let sx = side * 44;
        let sy = -20;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(side * b.gearAngle);

        ctx.fillStyle = '#8b5a2b';
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        // Cog Teeth
        ctx.fillStyle = '#b3773b';
        for (let i = 0; i < 8; i++) {
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-3, -22, 6, 6);
        }
        ctx.restore();
      }

      // 2. Powerful Mechanical Arms
      for (let side of [-1, 1]) {
        let ax = side * 44;
        let ay = -10;

        // Bicep strut
        ctx.fillStyle = '#5c4028';
        ctx.fillRect(ax - 6, ay, 12, 28);

        // Elbow joint
        ctx.fillStyle = '#c4974f';
        ctx.beginPath();
        ctx.arc(ax, ay + 30, 8, 0, Math.PI * 2);
        ctx.fill();

        // Forearm & Heavy Piston Fist
        ctx.fillStyle = '#4a3320';
        ctx.fillRect(ax - 8, ay + 34, 16, 32);

        // Brass Knuckle Block
        ctx.fillStyle = '#caa35e';
        ctx.fillRect(ax - 10, ay + 64, 20, 14);
      }

      // 3. Torso & Core Clockwork Chassis
      ctx.fillStyle = '#694a28';
      ctx.fillRect(-32, -26, 64, 68);

      // Brass Filigree Rim
      ctx.strokeStyle = '#caa35e';
      ctx.lineWidth = 4;
      ctx.strokeRect(-30, -24, 60, 64);

      // Chest Clock Dial / Time Meter
      ctx.fillStyle = '#1c2214';
      ctx.beginPath();
      ctx.arc(0, 8, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a4843b';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Clock Hand
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.lineTo(8 * Math.cos(b.gearAngle * 2), 8 + 8 * Math.sin(b.gearAngle * 2));
      ctx.stroke();

      // 4. Urn / Vase Head
      ctx.fillStyle = '#8b6133';
      ctx.beginPath();
      ctx.moveTo(-18, -26);
      ctx.lineTo(18, -26);
      ctx.lineTo(24, -58);
      ctx.lineTo(-24, -58);
      ctx.closePath();
      ctx.fill();

      // Urn Rim
      ctx.fillStyle = '#caa35e';
      ctx.fillRect(-28, -62, 56, 8);

      // Urn Side Handles
      ctx.strokeStyle = '#caa35e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(-22, -42, 8, Math.PI * 0.5, Math.PI * 1.5);
      ctx.arc(22, -42, 8, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.stroke();

      // 5. 3 Green Glowing Ocular Lenses (Triangular formation)
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 12;

      // Top Eye
      ctx.beginPath();
      ctx.arc(0, -48, 5, 0, Math.PI * 2);
      ctx.fill();
      // Bottom Left & Right Eyes
      ctx.beginPath();
      ctx.arc(-8, -38, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(8, -38, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 6. Hydraulic Legs
      ctx.fillStyle = '#3a2717';
      ctx.fillRect(-24, 42, 16, 32);
      ctx.fillRect(8, 42, 16, 32);
      // Feet
      ctx.fillStyle = '#caa35e';
      ctx.fillRect(-28, 70, 22, 10);
      ctx.fillRect(6, 70, 22, 10);

      ctx.restore();
    }

    // --- GAME ACTIONS ---

    function jumpOrHover() {
      if (player.isGrounded) {
        player.vy = -13;
        player.isGrounded = false;
      } else {
        // Airborne Wing-Dart Salvo
        player.vy = -3; // slight hover boost
        player.hovering = true;
        if (activeHero === 'XOCHITL') {
          fireXochitlWingDarts();
        }
      }
    }

    function fireXochitlWingDarts() {
      // 3 Feather Flame Daggers angled toward boss
      const originY = player.y + 15;
      const originX = player.x + player.w;

      [-0.25, 0, 0.25].forEach((angle) => {
        projectiles.push({
          type: 'FEATHER_DAGGER',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * 11,
          vy: Math.sin(angle) * 11 + 2,
          w: 22,
          h: 8,
          damage: 12,
          isPlayer: true
        });
      });
    }

    function performStrike() {
      const spawnY = player.y + player.h * 0.45; // Chest/hand level
      const spawnX = player.x + player.w;

      if (activeHero === 'XOCHITL') {
        if (!player.isGrounded) {
          fireXochitlWingDarts();
        } else {
          // Horizontal Magma Fist Blast
          projectiles.push({
            type: 'MAGMA_BALL',
            x: spawnX,
            y: spawnY,
            vx: 9,
            vy: 0,
            w: 24,
            h: 14,
            damage: 15,
            isPlayer: true
          });
        }
      } else {
        // Marcus Prime Instant Lightning Beam
        electricBeams.push({
          x1: spawnX,
          y1: spawnY,
          x2: boss.x + boss.w * 0.3,
          y2: boss.y + boss.h * 0.5,
          life: 12
        });

        // Instant damage to Boss
        boss.hp = Math.max(0, boss.hp - 18);
        boss.hitFlash = 6;
        spawnSparks(boss.x + 20, boss.y + 40, '#00f0ff');
        updateUI();
      }
    }

    function performBurst() {
      const spawnY = player.y + player.h * 0.4;
      const spawnX = player.x + player.w;

      if (activeHero === 'XOCHITL') {
        // High-density Volcanic Salvo
        for (let i = -1; i <= 1; i++) {
          projectiles.push({
            type: 'MAGMA_BALL',
            x: spawnX,
            y: spawnY + i * 14,
            vx: 11,
            vy: i * 2,
            w: 28,
            h: 18,
            damage: 22,
            isPlayer: true
          });
        }
      } else {
        // EMP Voltage Wave
        electricBeams.push({
          x1: spawnX,
          y1: spawnY - 20,
          x2: boss.x + 40,
          y2: boss.y + 20,
          life: 18
        });
        electricBeams.push({
          x1: spawnX,
          y1: spawnY + 20,
          x2: boss.x + 40,
          y2: boss.y + 70,
          life: 18
        });
        boss.hp = Math.max(0, boss.hp - 30);
        boss.hitFlash = 8;
        spawnSparks(boss.x + 30, boss.y + 50, '#00f0ff');
        updateUI();
      }
    }

    function tagSwap() {
      if (activeHero === 'XOCHITL') {
        activeHero = 'MARCUS';
        document.getElementById('player-label').innerText = 'MARCUS PRIME';
        document.getElementById('lbl-strike').innerText = 'ELECTRIC BEAM';
        document.getElementById('lbl-burst').innerText = 'VOLT OVERLOAD';
        document.getElementById('lbl-swap').innerText = 'XOCHITL';
      } else {
        activeHero = 'XOCHITL';
        document.getElementById('player-label').innerText = 'XOCHITL';
        document.getElementById('lbl-strike').innerText = 'MAGMA PUNCH';
        document.getElementById('lbl-burst').innerText = 'LAVA / FEATHERS';
        document.getElementById('lbl-swap').innerText = 'MARCUS PRIME';
      }
    }

    function motherLuettaHeal() {
      player.hp = Math.min(player.maxHp, player.hp + 35);
      spawnSparks(player.x + 25, player.y + 40, '#00ffaa');
      updateUI();
    }

    function bossAttack() {
      // Chrono-Lock gears fire bronze chrono-drives
      const spawnY = boss.y + boss.h * 0.45;
      projectiles.push({
        type: 'CHRONO_GEAR',
        x: boss.x - 20,
        y: spawnY,
        vx: -6,
        vy: 0,
        w: 22,
        h: 22,
        damage: 14,
        isPlayer: false
      });
    }

    function spawnSparks(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 16,
          color: color
        });
      }
    }

    function updateUI() {
      document.getElementById('player-hp').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
      document.getElementById('boss-hp').style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
    }

    // --- GAME LOOP ---

    function update() {
      // Player Movement
      if (keys.left) player.vx = -4.5;
      else if (keys.right) player.vx = 4.5;
      else player.vx = 0;

      player.x += player.vx;
      player.x = Math.max(20, Math.min(canvas.width - 200, player.x));

      // Gravity & Jumping
      player.vy += 0.6;
      player.y += player.vy;

      if (player.y >= FLOOR_Y - player.h) {
        player.y = FLOOR_Y - player.h;
        player.vy = 0;
        player.isGrounded = true;
        player.hovering = false;
      }

      // Hit Flashes
      if (player.hitFlash > 0) player.hitFlash--;
      if (boss.hitFlash > 0) boss.hitFlash--;

      // Boss AI Routine
      boss.shootTimer++;
      if (boss.shootTimer > 85) {
        bossAttack();
        boss.shootTimer = 0;
      }

      // Update Projectiles & AABB Collision
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        // Player shots hitting Boss
        if (p.isPlayer) {
          if (
            p.x < boss.x + boss.w &&
            p.x + p.w > boss.x &&
            p.y < boss.y + boss.h &&
            p.y + p.h > boss.y
          ) {
            boss.hp = Math.max(0, boss.hp - p.damage);
            boss.hitFlash = 5;
            spawnSparks(p.x, p.y, '#ff7700');
            projectiles.splice(i, 1);
            updateUI();
            continue;
          }
        } 
        // Boss shots hitting Player
        else {
          if (
            p.x < player.x + player.w &&
            p.x + p.w > player.x &&
            p.y < player.y + player.h &&
            p.y + p.h > player.y
          ) {
            player.hp = Math.max(0, player.hp - p.damage);
            player.hitFlash = 5;
            spawnSparks(p.x, p.y, '#ff3366');
            projectiles.splice(i, 1);
            updateUI();
            continue;
          }
        }

        // Screen boundary cull
        if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > FLOOR_Y + 20) {
          projectiles.splice(i, 1);
        }
      }

      // Update Electric Beams
      for (let i = electricBeams.length - 1; i >= 0; i--) {
        electricBeams[i].life--;
        if (electricBeams[i].life <= 0) {
          electricBeams.splice(i, 1);
        }
      }

      // Update Sparks
      for (let i = particles.length - 1; i >= 0; i--) {
        let part = particles[i];
        part.x += part.vx;
        part.y += part.vy;
        part.life--;
        if (part.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCityBackground();

      // Draw Characters
      if (activeHero === 'XOCHITL') {
        drawXochitl(player);
      } else {
        drawMarcusPrime(player);
      }

      drawChronoLock(boss);

      // Render Electric Beams
      electricBeams.forEach(b => {
        ctx.save();
        ctx.strokeStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);

        let segments = 8;
        let dx = (b.x2 - b.x1) / segments;
        for (let s = 1; s < segments; s++) {
          let rx = b.x1 + dx * s;
          let ry = b.y1 + ((b.y2 - b.y1) / segments) * s + (Math.random() * 20 - 10);
          ctx.lineTo(rx, ry);
        }
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();

        // White inner core
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      });

      // Render Projectiles
      projectiles.forEach(p => {
        ctx.save();
        if (p.type === 'FEATHER_DAGGER') {
          // Sharp glowing feather dagger
          ctx.fillStyle = '#ffe600';
          ctx.shadowColor = '#ff5500';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(p.x + p.w, p.y + p.h / 2);
          ctx.lineTo(p.x, p.y);
          ctx.lineTo(p.x + 4, p.y + p.h / 2);
          ctx.lineTo(p.x, p.y + p.h);
          ctx.closePath();
          ctx.fill();
        } else if (p.type === 'MAGMA_BALL') {
          // Fiery molten sphere
          ctx.fillStyle = '#ff4400';
          ctx.shadowColor = '#ffbb00';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.ellipse(p.x + p.w/2, p.y + p.h/2, p.w/2, p.h/2, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'CHRONO_GEAR') {
          // Spinning bronze clockwork blade
          ctx.translate(p.x + p.w/2, p.y + p.h/2);
          ctx.rotate(Date.now() * 0.01);
          ctx.fillStyle = '#b3773b';
          ctx.beginPath();
          ctx.arc(0, 0, p.w/2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#00ff88';
          ctx.fillRect(-3, -3, 6, 6);
        }
        ctx.restore();
      });

      // Render Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      });
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    // --- EVENT LISTENERS ---
    const attachTouch = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if (onUp) onUp(); });
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (onUp) onUp(); });
    };

    attachTouch('btn-left', () => keys.left = true, () => keys.left = false);
    attachTouch('btn-right', () => keys.right = true, () => keys.right = false);
    attachTouch('btn-jump', jumpOrHover);
    attachTouch('btn-strike', performStrike);
    attachTouch('btn-burst', performBurst);
    attachTouch('btn-swap', tagSwap);
    attachTouch('btn-heal', motherLuettaHeal);

    // Keyboard controls for Chromebook
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jumpOrHover();
      if (e.key === 'j') performStrike();
      if (e.key === 'k') performBurst();
      if (e.key === 's') tagSwap();
      if (e.key === 'h') motherLuettaHeal();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    // Start Game
    loop();
  </script>
</body>
</html>
