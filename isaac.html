<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Isaac Rhodes Adventures: Obby Brawler</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background: #060b19;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  #game-wrapper {
    width: 100%;
    max-width: 480px;
    background: #090f24;
    display: flex;
    flex-direction: column;
    border: 1px solid #1e293b;
    position: relative;
  }
  #hud {
    background: rgba(8, 15, 36, 0.95);
    padding: 8px 12px;
    border-bottom: 2px solid #22c55e;
    font-size: 11px;
    font-weight: 800;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .tag-hero { color: #4ade80; text-transform: uppercase; }
  .tag-zone { color: #f59e0b; }
  .tag-score { font-family: monospace; color: #f8fafc; }
  .bar-bg {
    width: 100%;
    height: 8px;
    background: #1e293b;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #334155;
  }
  #hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #86efac);
    transition: width 0.12s ease;
  }
  #mech-gauge-wrap {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    color: #38bdf8;
  }
  #mech-fill {
    height: 4px;
    flex-grow: 1;
    background: #0284c7;
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }
  #canvas-container {
    position: relative;
    width: 100%;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
  }
  #controls {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #050a18;
  }
  .btn-row {
    display: grid;
    gap: 6px;
  }
  .grid-nav { grid-template-columns: 1fr 1.3fr 1fr; }
  .grid-action { grid-template-columns: repeat(3, 1fr); }

  button {
    background: #0f172a;
    color: #94a3b8;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    min-height: 48px;
    outline: none;
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  button:active {
    transform: scale(0.96);
    filter: brightness(1.3);
  }
  .btn-title {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .btn-sub {
    font-size: 8.5px;
    opacity: 0.75;
    margin-top: 2px;
  }
  #btn-hook {
    background: #064e3b;
    border-color: #22c55e;
    color: #86efac;
  }
  #btn-brawl {
    background: #7c2d12;
    border-color: #ea580c;
    color: #fdba74;
  }
  #btn-jump {
    background: #1e3a8a;
    border-color: #3b82f6;
    color: #93c5fd;
  }
  #btn-mech {
    background: #4c0519;
    border-color: #f43f5e;
    color: #fecdd3;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <div class="hud-row">
      <span class="tag-hero">ISAAC RHODES (VOXEL HERO)</span>
      <span class="tag-zone" id="zone-txt">OBBY STAGE 1</span>
      <span class="tag-score" id="score-txt">STARS: 0 | PTS: 0</span>
    </div>
    <div class="bar-bg">
      <div id="hp-fill"></div>
    </div>
    <div id="mech-gauge-wrap">
      <span>MECH CHARGE</span>
      <div class="bar-bg" style="height: 5px;">
        <div id="mech-fill"></div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div id="controls">
    <div class="btn-row grid-nav">
      <button id="btn-left">
        <span class="btn-title">◀ RUN LEFT</span>
      </button>
      <button id="btn-hook">
        <span class="btn-title">GRAPPLE HOOK</span>
        <span class="btn-sub">Swing / Pull</span>
      </button>
      <button id="btn-right">
        <span class="btn-title">RUN RIGHT ▶</span>
      </button>
    </div>

    <div class="btn-row grid-action">
      <button id="btn-jump">
        <span class="btn-title">JUMP / DOUBLE</span>
        <span class="btn-sub">Spring Bounce</span>
      </button>
      <button id="btn-brawl">
        <span class="btn-title">BRAWL HAMMER</span>
        <span class="btn-sub">Pixel Smash</span>
      </button>
      <button id="btn-mech">
        <span class="btn-title">MECH SUIT</span>
        <span class="btn-sub">Titan Smash</span>
      </button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   ISAAC RHODES ADVENTURES: OBBY BRAWLER ENGINE
   ========================================================== */

class SynthSfx {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(freq, type, dur, vol = 0.15) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch (e) {}
  }
  jump() { this.init(); this.play(260, 'sine', 0.18, 0.2); }
  hook() { this.init(); this.play(680, 'triangle', 0.2, 0.2); }
  smash() { this.init(); this.play(90, 'sawtooth', 0.3, 0.3); }
  coin() {
    this.init();
    this.play(587, 'sine', 0.1, 0.2);
    setTimeout(() => this.play(880, 'sine', 0.18, 0.2), 80);
  }
  mech() { this.init(); this.play(110, 'square', 0.45, 0.3); }
}
const sfx = new SynthSfx();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let stars = 0;
let stageIndex = 1;
let cameraX = 0;

let hero = {
  x: 100,
  y: 280,
  vx: 0,
  vy: 0,
  width: 32,
  height: 60,
  facing: 1,
  hp: 100,
  maxHp: 100,
  isGrounded: false,
  jumpCount: 0,
  action: 'idle',
  actionTimer: 0,
  isMech: false,
  mechTimer: 0,
  mechEnergy: 100
};

let grapple = {
  active: false,
  anchorX: 0,
  anchorY: 0,
  length: 0,
  targetEnemy: null
};

// Obby Platforms & Floating Obstacles
let platforms = [
  { x: 0, y: 380, w: 420, h: 70, type: 'grass' },
  { x: 480, y: 340, w: 120, h: 25, type: 'neon' },
  { x: 660, y: 280, w: 110, h: 25, type: 'neon' },
  { x: 840, y: 240, w: 140, h: 25, type: 'bouncy' },
  { x: 1040, y: 320, w: 90, h: 25, type: 'hazard' },
  { x: 1200, y: 280, w: 180, h: 30, type: 'neon' },
  { x: 1440, y: 220, w: 130, h: 25, type: 'neon' },
  { x: 1640, y: 360, w: 400, h: 90, type: 'grass' } // Goal platform
];

// Grapple Anchor Rings in Sky
let anchorPoints = [
  { x: 540, y: 160 },
  { x: 720, y: 130 },
  { x: 920, y: 110 },
  { x: 1300, y: 130 },
  { x: 1510, y: 120 }
];

// Collectibles & Hazards
let starCubes = [
  { x: 530, y: 300, collected: false },
  { x: 710, y: 240, collected: false },
  { x: 900, y: 180, collected: false },
  { x: 1270, y: 240, collected: false },
  { x: 1490, y: 170, collected: false }
];

// Rogue Blocky Brawler Enemies
let enemies = [
  { x: 520, y: 340, w: 32, h: 56, hp: 45, maxHp: 45, facing: -1, type: 'android' },
  { x: 1260, y: 280, w: 34, h: 58, hp: 50, maxHp: 50, facing: -1, type: 'golem' },
  { x: 1780, y: 360, w: 48, h: 72, hp: 120, maxHp: 120, facing: -1, type: 'boss' }
];

// --- Drawing Functions ---

// Vibrant Roblox/Obby Cloudscape Backdrop
function drawBackdrop() {
  let sky = ctx.createLinearGradient(0, 0, 0, 450);
  sky.addColorStop(0, '#0c1a3a');
  sky.addColorStop(0.6, '#1d3568');
  sky.addColorStop(1, '#38bdf8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 800, 450);

  // Floating Voxel Clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  for (let i = 0; i < 6; i++) {
    let cx = ((i * 240) - cameraX * 0.2) % 1000;
    if (cx < -100) cx += 1000;
    ctx.fillRect(cx, 60 + (i % 3 * 30), 90, 24);
    ctx.fillRect(cx + 18, 44 + (i % 3 * 30), 54, 16);
  }
}

// Isaac Rhodes Character Sprite (Emerald Tee, Glasses, Curls, Denim)
function drawIsaacAvatar(x, y, facing, action, isMech) {
  ctx.save();
  ctx.translate(x, y);
  if (facing === -1) ctx.scale(-1, 1);

  if (isMech) {
    // --- MECH TITAN SUIT ---
    ctx.fillStyle = '#15803d'; // Heavy emerald plating
    ctx.fillRect(-22, -84, 44, 46);
    ctx.fillStyle = '#38bdf8'; // Glowing chest reactor
    ctx.fillRect(-8, -70, 16, 16);
    ctx.fillStyle = '#0f172a'; // Carbon limbs
    ctx.fillRect(-18, -38, 14, 38);
    ctx.fillRect(4, -38, 14, 38);
    // Rocket Fists
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(16, -76, 20, 18);
    // Head Visor
    ctx.fillStyle = '#166534';
    ctx.fillRect(-14, -102, 28, 20);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-10, -96, 20, 6);
    ctx.restore();
    return;
  }

  // --- ISAAC (VOXEL STYLIZED PROFILE) ---
  // Dark Blue Denim Jeans
  ctx.fillStyle = '#1e3a8a';
  ctx.fillRect(-7, -26, 6, 26);
  ctx.fillRect(1, -26, 6, 26);

  // Bright Green Running Sneakers
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(-9, -6, 9, 6);
  ctx.fillRect(1, -6, 9, 6);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-7, -4, 4, 2);
  ctx.fillRect(3, -4, 4, 2);

  // Vibrant Emerald Green Tee (from his photo)
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(-9, -52, 18, 28);
  // Graphic Print on Chest
  ctx.fillStyle = '#86efac';
  ctx.fillRect(-5, -46, 10, 12);
  ctx.fillStyle = '#052e16';
  ctx.fillRect(-3, -43, 6, 4);

  // Arms & Grapple Launcher Gauntlet
  ctx.fillStyle = '#9a644d'; // Skin tone
  ctx.fillRect(-12, -50, 4, 20);
  ctx.fillRect(8, -50, 4, 18);
  // Grapple Bracer on Right Wrist
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(7, -38, 6, 9);
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(9, -32, 5, 3);

  // Head & Skin
  ctx.fillStyle = '#9a644d';
  ctx.fillRect(-8, -68, 16, 16);

  // Curled Dark Hair (Volume & Texture)
  ctx.fillStyle = '#18181b';
  ctx.fillRect(-9, -74, 18, 8);
  ctx.fillRect(-11, -71, 4, 10);
  ctx.fillRect(7, -71, 4, 8);
  ctx.fillRect(-6, -76, 12, 4);

  // Bold Black Glasses & Lenses
  ctx.fillStyle = '#09090b';
  ctx.fillRect(-2, -64, 12, 7); // frame
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(1, -62, 7, 3); // lens reflection

  // Pixel Hammer Pose during Smash Action
  if (action === 'brawl') {
    ctx.save();
    ctx.fillStyle = '#b45309'; // handle
    ctx.fillRect(12, -62, 6, 36);
    ctx.fillStyle = '#f59e0b'; // golden voxel head
    ctx.fillRect(4, -80, 22, 20);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(8, -76, 14, 12);
    ctx.restore();
  }

  ctx.restore();
}

// Android & Golem Enemies
function drawEnemies() {
  for (let en of enemies) {
    if (en.hp <= 0) continue;
    let ex = en.x - cameraX;
    ctx.save();
    ctx.translate(ex, en.y);
    if (en.facing === -1) ctx.scale(-1, 1);

    if (en.type === 'boss') {
      // Zone Guardian Mech
      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(-20, -70, 40, 44);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-10, -60, 20, 16);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(-16, -26, 12, 26);
      ctx.fillRect(4, -26, 12, 26);
      ctx.fillStyle = '#f87171';
      ctx.fillRect(-12, -84, 24, 16);
    } else {
      // Android Drone
      ctx.fillStyle = '#334155';
      ctx.fillRect(-8, -48, 16, 26);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-4, -42, 8, 8);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-6, -22, 5, 22);
      ctx.fillRect(1, -22, 5, 22);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(-7, -56, 14, 10);
    }
    ctx.restore();

    // HP Bar above Enemy
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(ex - 16, en.y - en.h - 10, 32, 4);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(ex - 16, en.y - en.h - 10, (en.hp / en.maxHp) * 32, 4);
  }
}

// Obby Platforms & World Elements
function drawWorld() {
  // Platforms
  for (let p of platforms) {
    let px = p.x - cameraX;
    if (p.type === 'neon') {
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(px, p.y, p.w, p.h);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(px, p.y, p.w, p.h);
    } else if (p.type === 'bouncy') {
      ctx.fillStyle = '#d97706';
      ctx.fillRect(px, p.y, p.w, p.h);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(px + 4, p.y + 2, p.w - 8, 4); // Spring surface
    } else if (p.type === 'hazard') {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(px, p.y, p.w, p.h);
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(px + 6, p.y + 4, p.w - 12, 6);
    } else {
      // Grass / Stone
      ctx.fillStyle = '#15803d';
      ctx.fillRect(px, p.y, p.w, 14);
      ctx.fillStyle = '#475569';
      ctx.fillRect(px, p.y + 14, p.w, p.h - 14);
    }
  }

  // Anchor Rings
  for (let a of anchorPoints) {
    let ax = a.x - cameraX;
    ctx.beginPath();
    ctx.arc(ax, a.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = 'rgba(250, 204, 21, 0.3)';
    ctx.fill();
  }

  // Star Cubes
  for (let s of starCubes) {
    if (s.collected) continue;
    let sx = s.x - cameraX;
    ctx.save();
    ctx.translate(sx, s.y);
    ctx.rotate(Date.now() * 0.003);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-8, -8, 16, 16);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-8, -8, 16, 16);
    ctx.restore();
  }

  // Grapple Line
  if (grapple.active) {
    let hx = hero.x - cameraX;
    let hy = hero.y - 34;
    let ax = grapple.anchorX - cameraX;
    let ay = grapple.anchorY;

    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(ax, ay);
    ctx.stroke();

    // Hook Tongs
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(ax - 4, ay - 4, 8, 8);
  }
}

// --- Physics & Game Loop ---
function update() {
  // Movement & Gravity
  hero.x += hero.vx;
  hero.y += hero.vy;

  if (!grapple.active) {
    hero.vy += 0.85; // Gravity
  } else {
    // Grapple Swing Physics towards Anchor
    let dx = grapple.anchorX - hero.x;
    let dy = grapple.anchorY - (hero.y - 30);
    let dist = Math.sqrt(dx * dx + dy * dy);

    hero.vx += (dx / dist) * 1.5;
    hero.vy += (dy / dist) * 1.5;
    hero.vx *= 0.95;
    hero.vy *= 0.95;

    // Release grapple if close or moving past
    if (dist < 30 || hero.y < grapple.anchorY) {
      grapple.active = false;
      hero.vy = -10; // Boost release
      hero.vx = hero.facing * 7;
    }
  }

  // Platform Collisions
  hero.isGrounded = false;
  for (let p of platforms) {
    if (
      hero.x + 12 > p.x &&
      hero.x - 12 < p.x + p.w &&
      hero.y >= p.y &&
      hero.y - hero.vy <= p.y + 16
    ) {
      hero.y = p.y;
      hero.vy = 0;
      hero.isGrounded = true;
      hero.jumpCount = 0;

      // Hazard check
      if (p.type === 'hazard') {
        hero.hp -= 0.5;
        sfx.smash();
      } else if (p.type === 'bouncy') {
        hero.vy = -18; // Super Spring Pad!
        sfx.jump();
      }
    }
  }

  // Bottomless Pit Check
  if (hero.y > 480) {
    hero.hp -= 25;
    hero.x = 100;
    hero.y = 260;
    hero.vx = 0;
    hero.vy = 0;
    grapple.active = false;
    sfx.smash();
  }

  // Camera Follow
  cameraX += (hero.x - 200 - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;

  // Star Collection
  for (let s of starCubes) {
    if (!s.collected && Math.abs(hero.x - s.x) < 26 && Math.abs(hero.y - 30 - s.y) < 26) {
      s.collected = true;
      stars++;
      score += 200;
      hero.mechEnergy = Math.min(100, hero.mechEnergy + 25);
      sfx.coin();
      updateHud();
    }
  }

  // Enemy Interactions
  for (let en of enemies) {
    if (en.hp <= 0) continue;
    // Walk towards Isaac if near
    if (Math.abs(en.x - hero.x) < 220) {
      en.facing = en.x < hero.x ? 1 : -1;
      en.x += en.facing * 1.2;
    }
    // Hurt hero on touch
    if (Math.abs(en.x - hero.x) < 28 && Math.abs(en.y - hero.y) < 30) {
      if (!hero.isMech) {
        hero.hp -= 0.4;
      } else {
        en.hp -= 2; // Mech deals passive contact damage
      }
      updateHud();
    }
  }

  // Action Reset Timers
  if (hero.actionTimer > 0) {
    hero.actionTimer--;
    if (hero.actionTimer === 0) hero.action = 'idle';
  }

  // Mech Timer
  if (hero.isMech) {
    hero.mechTimer--;
    if (hero.mechTimer <= 0) {
      hero.isMech = false;
    }
  }

  updateHud();
}

function updateHud() {
  document.getElementById('score-txt').innerText = `STARS: ${stars} | PTS: ${score}`;
  document.getElementById('hp-fill').style.width = `${Math.max(0, hero.hp)}%`;
  document.getElementById('mech-fill').style.width = `${hero.mechEnergy}%`;
  document.getElementById('zone-txt').innerText = `OBBY STAGE ${stageIndex}`;
}

function render() {
  ctx.clearRect(0, 0, 800, 450);
  drawBackdrop();
  drawWorld();
  drawEnemies();
  drawIsaacAvatar(hero.x - cameraX, hero.y, hero.facing, hero.action, hero.isMech);
  update();
  requestAnimationFrame(render);
}

// --- Controller Handlers ---
function bindControl(id, onDown, onUp = null) {
  const btn = document.getElementById(id);
  if (!btn) return;
  const start = (e) => { e.preventDefault(); sfx.init(); onDown(); };
  const end = (e) => { e.preventDefault(); if (onUp) onUp(); };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
}

// Left / Right Run
bindControl('btn-left', () => { hero.vx = -4.5; hero.facing = -1; }, () => { hero.vx = 0; });
bindControl('btn-right', () => { hero.vx = 4.5; hero.facing = 1; }, () => { hero.vx = 0; });

// Jump / Double Jump
bindControl('btn-jump', () => {
  if (hero.isGrounded) {
    hero.vy = -13.5;
    hero.jumpCount = 1;
    sfx.jump();
  } else if (hero.jumpCount === 1) {
    hero.vy = -12;
    hero.jumpCount = 2;
    sfx.jump();
  }
});

// Grapple Hook Action (Find nearest Anchor Ring)
bindControl('btn-hook', () => {
  sfx.hook();
  let nearest = null;
  let minDist = 340;

  for (let a of anchorPoints) {
    let dx = a.x - hero.x;
    let dy = a.y - hero.y;
    let d = Math.sqrt(dx * dx + dy * dy);
    // Prefer anchors ahead of facing direction
    if (d < minDist && ((hero.facing === 1 && a.x > hero.x - 30) || (hero.facing === -1 && a.x < hero.x + 30))) {
      minDist = d;
      nearest = a;
    }
  }

  if (nearest) {
    grapple.active = true;
    grapple.anchorX = nearest.x;
    grapple.anchorY = nearest.y;
  }
});

// Brawl Hammer Smash Action
bindControl('btn-brawl', () => {
  hero.action = 'brawl';
  hero.actionTimer = 22;
  sfx.smash();

  // Strike check against enemies
  for (let en of enemies) {
    if (Math.abs(en.x - hero.x) < 65 && Math.abs(en.y - hero.y) < 40) {
      let dmg = hero.isMech ? 70 : 35;
      en.hp -= dmg;
      en.x += hero.facing * 35; // Knockback
      score += 100;
      if (en.hp <= 0) score += 300;
      updateHud();
    }
  }
});

// Mech Suit Activation
bindControl('btn-mech', () => {
  if (hero.mechEnergy >= 100) {
    hero.isMech = true;
    hero.mechTimer = 450; // 7.5 seconds
    hero.mechEnergy = 0;
    sfx.mech();
  }
});

// Start loop
updateHud();
requestAnimationFrame(render);
</script>
</body>
</html>
