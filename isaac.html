<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Isaac Rhodes Adventures - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b111e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #stage-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 60vh;
      background: #101929;
      border: 3px solid #ffaa00;
      box-shadow: 0 0 16px rgba(255, 170, 0, 0.35);
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
    /* Controller Area */
    #controller {
      width: 100%;
      max-width: 500px;
      height: 35vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 25px;
      background: #0d1524;
      border-top: 2px solid #1a2740;
    }
    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .d-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: #1b283d;
      border: 2px solid #ffaa00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #ffaa00;
      font-size: 1.2rem;
    }
    .d-btn:active {
      background: #ffaa00;
      color: #0b111e;
    }
    #btn-left { top: 38px; left: 0; }
    #btn-right { top: 38px; right: 0; }

    .action-group {
      display: flex;
      gap: 15px;
    }
    .action-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #00e5ff;
      background: rgba(0, 229, 255, 0.25);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }
    .action-btn:active {
      background: #00e5ff;
      color: #0b111e;
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <div id="hud">
      <span id="score-display">GEMS: 0</span>
      <span id="health-display">HEALTH: 100</span>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Virtual Gamepad -->
  <div id="controller">
    <div class="dpad">
      <div id="btn-left" class="d-btn">◀</div>
      <div id="btn-right" class="d-btn">▶</div>
    </div>
    <div class="action-group">
      <button id="btn-jump" class="action-btn">JUMP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 360;
    canvas.height = 480;

    let score = 0;
    let health = 100;
    let gameOver = false;

    // Player Object
    const player = {
      x: 50,
      y: 360,
      w: 22,
      h: 32,
      vx: 0,
      vy: 0,
      speed: 3.6,
      jumpPower: -9.5,
      isGrounded: false
    };

    const gravity = 0.42;

    // Platforms
    const platforms = [
      { x: 0, y: 440, w: 360, h: 40 },
      { x: 40, y: 350, w: 90, h: 14 },
      { x: 170, y: 280, w: 90, h: 14 },
      { x: 60, y: 210, w: 90, h: 14 },
      { x: 200, y: 140, w: 100, h: 14 },
      { x: 80, y: 80, w: 80, h: 14 }
    ];

    // Collectible Gems
    let gems = [
      { x: 75, y: 320, collected: false },
      { x: 205, y: 250, collected: false },
      { x: 95, y: 180, collected: false },
      { x: 240, y: 110, collected: false },
      { x: 115, y: 50, collected: false }
    ];

    // Enemies (Biome Crawlers)
    let enemies = [
      { x: 170, y: 266, w: 18, h: 14, minX: 170, maxX: 242, vx: 1.2 },
      { x: 60, y: 196, w: 18, h: 14, minX: 60, maxX: 132, vx: -1.2 }
    ];

    function jump() {
      if (gameOver) return;
      if (player.isGrounded) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }
    }

    // Touch controls
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); player.vx = -player.speed; });
    btnLeft.addEventListener('touchend', () => { if (player.vx < 0) player.vx = 0; });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); player.vx = player.speed; });
    btnRight.addEventListener('touchend', () => { if (player.vx > 0) player.vx = 0; });

    btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -player.speed;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = player.speed;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code) && player.vx < 0) player.vx = 0;
      if (['ArrowRight', 'KeyD'].includes(e.code) && player.vx > 0) player.vx = 0;
    });

    function update() {
      if (gameOver) return;

      // Apply Gravity & Movement
      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      // Arena horizontal bounds
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      // Platform collisions
      player.isGrounded = false;
      platforms.forEach(p => {
        if (
          player.x + player.w > p.x &&
          player.x < p.x + p.w &&
          player.y + player.h >= p.y &&
          player.y + player.h <= p.y + p.h + player.vy &&
          player.vy >= 0
        ) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.isGrounded = true;
        }
      });

      // Gem collection
      gems.forEach(g => {
        if (!g.collected && Math.hypot((player.x + player.w / 2) - g.x, (player.y + player.h / 2) - g.y) < 20) {
          g.collected = true;
          score += 100;
          document.getElementById('score-display').innerText = `GEMS: ${score}`;
        }
      });

      // Enemy Patrol & Damage Collision
      enemies.forEach(e => {
        e.x += e.vx;
        if (e.x <= e.minX || e.x >= e.maxX) {
          e.vx *= -1;
        }

        if (
          player.x < e.x + e.w &&
          player.x + player.w > e.x &&
          player.y < e.y + e.h &&
          player.y + player.h > e.y
        ) {
          health -= 0.6;
          document.getElementById('health-display').innerText = `HEALTH: ${Math.max(0, Math.floor(health))}`;
          if (health <= 0) {
            gameOver = true;
            alert('Adventure Over! Refresh the page to try again.');
          }
        }
      });

      // Win Condition: All gems gathered and reach top platform
      if (gems.every(g => g.collected) && player.y <= 80) {
        gameOver = true;
        alert('Level Cleared! Isaac conquered the trial!');
      }
    }

    function render() {
      // Background gradient
      ctx.fillStyle = '#101929';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Platforms
      ctx.fillStyle = '#223652';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(p.x, p.y, p.w, 3);
        ctx.fillStyle = '#223652';
      });

      // Gems
      gems.forEach(g => {
        if (!g.collected) {
          ctx.fillStyle = '#00ffcc';
          ctx.beginPath();
          ctx.arc(g.x, g.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Enemies
      ctx.fillStyle = '#ff3366';
      enemies.forEach(e => {
        ctx.fillRect(e.x, e.y, e.w, e.h);
      });

      // Isaac (Player)
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x + 4, player.y + 6, 4, 4);
      ctx.fillRect(player.x + 14, player.y + 6, 4, 4);

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    render();
  </script>
</body>
</html>
