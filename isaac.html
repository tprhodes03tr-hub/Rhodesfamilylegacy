<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard: Detroit Rooftops Brawler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #050811;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .hud-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #0b1220;
      border-bottom: 2px solid #1e293b;
      font-size: 13px;
      font-weight: 700;
    }
    .hud-blue { color: #38bdf8; }
    .hud-gold { color: #facc15; }
    .hud-orange { color: #fb923c; }

    .bars-container {
      width: 100%;
      max-width: 480px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #0b1220;
    }
    .meter-label {
      font-size: 11px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .meter-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }
    .meter-fill-hp {
      width: 88%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.2s;
    }
    .meter-fill-burst {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.2s;
    }

    #gameCanvas {
      width: 100%;
      max-width: 480px;
      height: 250px;
      background: #020617;
      display: block;
      border: 1px solid #1e293b;
    }

    .sub-banner {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 6px;
      font-size: 12px;
      letter-spacing: 1.5px;
      font-weight: 800;
      color: #fbbf24;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    /* Roster Grid (6 Heroes) */
    .roster-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 10px;
      background: #070c18;
    }
    .roster-btn {
      background: #131c31;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      color: #94a3b8;
      cursor: pointer;
    }
    .roster-btn.active {
      border-color: #0284c7;
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
    }
    .roster-name { font-size: 11px; font-weight: 700; display: block; }
    .roster-sub { font-size: 9px; opacity: 0.8; }

    /* Movement & Tactical Controls */
    .controls-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px 10px;
      background: #070c18;
    }
    .btn-action {
      background: #1e293b;
      border: none;
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 800;
      padding: 12px 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .btn-action:active { filter: brightness(1.3); transform: translateY(1px); }
    .btn-action span { font-size: 8px; font-weight: 500; color: #94a3b8; }
    .btn-dash { background: #059669; }

    /* Attack & Ult Grid */
    .specials-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding: 6px 10px 14px 10px;
      background: #070c18;
    }
    .btn-special {
      border: none;
      border-radius: 6px;
      padding: 12px 4px;
      font-size: 11px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      text-align: center;
    }
    .btn-special span { display: block; font-size: 8px; font-weight: 600; opacity: 0.8; }
    .btn-djembe { background: #0891b2; }
    .btn-shock { background: #7c3aed; }
    .btn-luetta { background: #d97706; }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <div class="hud-bar">
    <span class="hud-blue" id="scoreDisplay">SCORE: 83200</span>
    <span class="hud-gold" id="luettaStatus">LUETTA: ANCHORED ✨</span>
    <span class="hud-orange">STAGE 1 [2/3]</span>
  </div>

  <!-- Status Meters -->
  <div class="bars-container">
    <div class="meter-label">
      <span style="color:#10b981;">HP: <span id="hpText">88</span> / 100</span>
      <span style="color:#ef4444;">CHRONO-LOCK: <span id="enemyHpText">160</span> / 160</span>
    </div>
    <div class="meter-track">
      <div class="meter-fill-hp" id="hpBar"></div>
    </div>

    <div class="meter-label" style="margin-top:2px;">
      <span style="color:#38bdf8;">BURST ENERGY: 100%</span>
    </div>
    <div class="meter-track">
      <div class="meter-fill-burst" id="burstBar"></div>
    </div>
  </div>

  <!-- Brawler Canvas -->
  <canvas id="gameCanvas" width="480" height="250"></canvas>

  <div class="sub-banner">✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦</div>

  <!-- 6-Hero Roster Selection -->
  <div class="roster-grid">
    <div class="roster-btn">
      <span class="roster-name">Shadow Kensei</span>
      <span class="roster-sub">Katana Combos</span>
    </div>
    <div class="roster-btn">
      <span class="roster-name">Aura Weaver</span>
      <span class="roster-sub">Hydro & Net</span>
    </div>
    <div class="roster-btn active" id="btnMarcusLead">
      <span class="roster-name">Marcus Prime</span>
      <span class="roster-sub">Volt Conduit</span>
    </div>
    <div class="roster-btn">
      <span class="roster-name">Delta Vanguard</span>
      <span class="roster-sub">Shield Cleave</span>
    </div>
    <div class="roster-btn">
      <span class="roster-name">Pioneer Volley</span>
      <span class="roster-sub">Solar Recurve</span>
    </div>
    <div class="roster-btn">
      <span class="roster-name">Prism Void</span>
      <span class="roster-sub">Void Shift</span>
    </div>
  </div>

  <!-- Movement Controls -->
  <div class="controls-grid">
    <button class="btn-action" id="btnLeft">◄ LEFT<span>[A]</span></button>
    <button class="btn-action" id="btnRight">RIGHT ►<span>[D]</span></button>
    <button class="btn-action" id="btnJump">▲ JUMP<span>[W]</span></button>
    <button class="btn-action btn-dash" id="btnDash">EVADE<span>DASH</span></button>
  </div>

  <!-- Specials & Mother Luetta Super -->
  <div class="specials-grid">
    <button class="btn-special btn-djembe" id="btnStrike">ACOUSTIC BEAT<span>SPECIAL</span></button>
    <button class="btn-special btn-shock" id="btnShock">SHOCK CASCADE<span>COMBO</span></button>
    <button class="btn-special btn-luetta" id="btnLuetta">LUETTA AID<span>SAVE DAY</span></button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Dynamic High-DPI Canvas Resizing
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Sprite Asset Sources (Uses local repo assets with graceful procedural fallback)
    const marcusImg = new Image();
    marcusImg.src = "marcus.png"; 

    const chronoImg = new Image();
    chronoImg.src = "Screenshot_20260918_175152_Photos.jpg";

    const luettaImg = new Image();
    luettaImg.src = "mother-luetta.png";

    // Game Entities
    const player = {
      x: 70,
      y: 160,
      w: 46,
      h: 68,
      vx: 0,
      vy: 0,
      hp: 88,
      maxHp: 100,
      isGrounded: true,
      shieldActive: false,
      lightningTimer: 0
    };

    const boss = {
      x: 360,
      y: 140,
      w: 64,
      h: 88,
      hp: 160,
      maxHp: 160,
      hoverOffset: 0
    };

    let luettaDescent = {
      active: false,
      y: -60,
      alpha: 0,
      radius: 0
    };

    let sparks = [];
    let droids = [
      { x: 320, y: 180, hp: 20 },
      { x: 410, y: 185, hp: 20 }
    ];

    // Background RenCen Pillars (Exact skyline geometry from your original layout)
    function drawSkyline() {
      ctx.fillStyle = "#030712";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const skylineWidths = [38, 44, 52, 42, 38];
      const spacing = canvas.width / skylineWidths.length;

      ctx.fillStyle = "#0c1527";
      for (let i = 0; i < skylineWidths.length; i++) {
        const x = i * spacing + 12;
        const h = 130 + (i % 3) * 25;
        const y = canvas.height - 40 - h;
        ctx.fillRect(x, y, skylineWidths[i], h);

        // Windows
        ctx.fillStyle = "#1e293b";
        for (let wy = y + 10; wy < y + h - 10; wy += 14) {
          ctx.fillRect(x + 6, wy, 8, 4);
          ctx.fillRect(x + skylineWidths[i] - 14, wy, 8, 4);
        }
        ctx.fillStyle = "#0c1527";
      }

      // Dual High-Voltage Ground Lanes
      ctx.strokeStyle = "#eab308";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 42);
      ctx.lineTo(canvas.width, canvas.height - 42);
      ctx.stroke();

      ctx.strokeStyle = "#0284c7";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 35);
      ctx.lineTo(canvas.width, canvas.height - 35);
      ctx.stroke();
    }

    // Spark Burst Generator
    function emitSparks(x, y, color = "#facc15") {
      for (let i = 0; i < 9; i++) {
        sparks.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 18,
          color: color
        });
      }
    }

    // Core Game Render Loop
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSkyline();

      // Mother Luetta Descending Divine Halo & Screen Cleansing
      if (luettaDescent.active) {
        ctx.save();
        ctx.beginPath();
        const grad = ctx.createRadialGradient(
          canvas.width / 2, luettaDescent.y + 30, 10,
          canvas.width / 2, luettaDescent.y + 30, luettaDescent.radius
        );
        grad.addColorStop(0, "rgba(250, 204, 21, 0.45)");
        grad.addColorStop(0.5, "rgba(234, 179, 8, 0.2)");
        grad.addColorStop(1, "rgba(2, 6, 23, 0)");
        ctx.fillStyle = grad;
        ctx.arc(canvas.width / 2, luettaDescent.y + 30, luettaDescent.radius, 0, Math.PI * 2);
        ctx.fill();

        // Radiating Golden Concentric Leyline Ovals
        for (let r = 20; r < luettaDescent.radius; r += 26) {
          ctx.beginPath();
          ctx.ellipse(canvas.width / 2, luettaDescent.y + 30, r * 1.4, r * 0.7, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(253, 224, 71, ${Math.max(0, 0.6 - r / 300)})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Draw Luetta (Image or Glowing Sigil fallback)
        if (luettaImg.complete && luettaImg.naturalWidth !== 0) {
          ctx.drawImage(luettaImg, canvas.width / 2 - 28, luettaDescent.y, 56, 70);
        } else {
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(canvas.width / 2, luettaDescent.y + 20, 16, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Animate Descent
        if (luettaDescent.y < 45) luettaDescent.y += 2.5;
        if (luettaDescent.radius < 260) luettaDescent.radius += 7;
      }

      // Draw Marcus Prime (Player)
      ctx.save();
      if (player.shieldActive) {
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 42, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
        ctx.fill();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      if (marcusImg.complete && marcusImg.naturalWidth !== 0) {
        // Clean unmasked rendering without bounding box
        ctx.drawImage(marcusImg, player.x, player.y, player.w, player.h);
      } else {
        // High-Tier Stylized Fallback
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(player.x + 8, player.y + 12, player.w - 16, 22);
      }

      // Lightning Shock Strike Arc
      if (player.lightningTimer > 0) {
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#38bdf8";
        ctx.beginPath();
        ctx.moveTo(player.x + player.w, player.y + 24);
        ctx.lineTo(player.x + player.w + 30, player.y + 14);
        ctx.lineTo(player.x + player.w + 60, player.y + 36);
        ctx.lineTo(boss.x + 10, boss.y + 30);
        ctx.stroke();
        ctx.shadowBlur = 0;
        player.lightningTimer--;
      }
      ctx.restore();

      // Draw Chrono-Lock (Syndicate Boss)
      boss.hoverOffset = Math.sin(Date.now() / 240) * 4;
      ctx.save();
      if (chronoImg.complete && chronoImg.naturalWidth !== 0) {
        ctx.drawImage(chronoImg, boss.x, boss.y + boss.hoverOffset, boss.w, boss.h);
      } else {
        // Brass Steampunk Boss Fallback
        ctx.fillStyle = "#b45309";
        ctx.fillRect(boss.x, boss.y + boss.hoverOffset, boss.w, boss.h);
        ctx.fillStyle = "#22c55e";
        ctx.beginPath();
        ctx.arc(boss.x + 22, boss.y + 20 + boss.hoverOffset, 4, 0, Math.PI * 2);
        ctx.arc(boss.x + 42, boss.y + 20 + boss.hoverOffset, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Draw Support Droids
      droids.forEach((droid) => {
        ctx.fillStyle = "#475569";
        ctx.fillRect(droid.x, droid.y, 14, 28);
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(droid.x + 2, droid.y + 4, 10, 3);
      });

      // Render Particle System
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, 3, 3);
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        if (s.life <= 0) sparks.splice(i, 1);
      }

      // Physics / Gravity
      if (!player.isGrounded) {
        player.y += player.vy;
        player.vy += 0.55;
        if (player.y >= 160) {
          player.y = 160;
          player.vy = 0;
          player.isGrounded = true;
        }
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // Controls & Combat Action Handlers
    document.getElementById("btnLeft").addEventListener("click", () => {
      player.x = Math.max(10, player.x - 20);
    });

    document.getElementById("btnRight").addEventListener("click", () => {
      player.x = Math.min(canvas.width - player.w - 80, player.x + 20);
    });

    document.getElementById("btnJump").addEventListener("click", () => {
      if (player.isGrounded) {
        player.vy = -10.5;
        player.isGrounded = false;
      }
    });

    document.getElementById("btnDash").addEventListener("click", () => {
      player.shieldActive = true;
      emitSparks(player.x + player.w / 2, player.y + player.h / 2, "#38bdf8");
      setTimeout(() => { player.shieldActive = false; }, 800);
    });

    document.getElementById("btnStrike").addEventListener("click", () => {
      emitSparks(player.x + player.w + 10, player.y + 28, "#0284c7");
      if (boss.hp > 0) {
        boss.hp = Math.max(0, boss.hp - 12);
        document.getElementById("enemyHpText").innerText = boss.hp;
        emitSparks(boss.x + 20, boss.y + 30, "#ef4444");
      }
    });

    document.getElementById("btnShock").addEventListener("click", () => {
      player.lightningTimer = 8;
      if (boss.hp > 0) {
        boss.hp = Math.max(0, boss.hp - 24);
        document.getElementById("enemyHpText").innerText = boss.hp;
        emitSparks(boss.x + 30, boss.y + 40, "#38bdf8");
      }
    });

    document.getElementById("btnLuetta").addEventListener("click", () => {
      luettaDescent.active = true;
      luettaDescent.y = -40;
      luettaDescent.radius = 20;
      document.getElementById("luettaStatus").innerText = "LUETTA: CLEANSING THE VOID ✨";

      setTimeout(() => {
        // Wipe screen droids & restore health
        droids = [];
        player.hp = player.maxHp;
        document.getElementById("hpText").innerText = player.hp;
        document.getElementById("hpBar").style.width = "100%";
        boss.hp = Math.max(0, boss.hp - 40);
        document.getElementById("enemyHpText").innerText = boss.hp;
        emitSparks(canvas.width / 2, 100, "#facc15");
      }, 1100);
    });
  </script>
</body>
</html>
