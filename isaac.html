<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detroit City Rescue Hub | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .hud {
      width: 100%;
      background: #111827;
      border: 2px solid #f59e0b;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: #38bdf8;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      height: 380px;
      background: #1e293b;
      border: 3px solid #3b82f6;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }
    .ctrl-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 0 #1d4ed8;
      transition: transform 0.1s;
    }
    .ctrl-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .btn-action {
      background: #10b981;
      box-shadow: 0 4px 0 #047857;
      grid-column: span 3;
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .back-link:hover {
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 0</span>
      <span id="mission-display">MISSION: PUT OUT FIRES!</span>
      <span id="timer-display">TIME: 45s</span>
    </div>

    <canvas id="gameCanvas" width="600" height="360"></canvas>

    <div class="controls">
      <button class="ctrl-btn" ontouchstart="moveTruck(-18)" onclick="moveTruck(-18)">⬅️ LEFT</button>
      <button class="ctrl-btn btn-action" ontouchstart="triggerAction()" onclick="triggerAction()">💦 WATER BLAST / RESCUE 🚨</button>
      <button class="ctrl-btn" ontouchstart="moveTruck(18)" onclick="moveTruck(18)">RIGHT ➡️</button>
    </div>

    <a href="index.html" class="back-link">← RETURN TO MAIN PORTAL</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 45;
    let gameActive = true;
    let missionType = "fire"; // 'fire' or 'rescue'

    // Fire Engine Truck Object
    let truck = {
      x: 260,
      y: 275,
      width: 80,
      height: 45,
      speed: 20
    };

    // Emergency Target (Building Fire or Citizen)
    let target = {
      x: Math.random() * 400 + 100,
      y: 40,
      width: 70,
      height: 75,
      active: true,
      health: 100
    };

    function moveTruck(dir) {
      if (!gameActive) return;
      truck.x += dir;
      // Keep truck on the road between sidewalks (sidewalks are 70px wide each)
      if (truck.x < 75) truck.x = 75;
      if (truck.x > canvas.width - truck.width - 75) truck.x = canvas.width - truck.width - 75;
    }

    function triggerAction() {
      if (!gameActive) return;
      
      if (Math.abs(truck.x - target.x) < 70 && target.active) {
        if (missionType === "fire") {
          target.health -= 34;
          if (target.health <= 0) {
            target.active = false;
            score += 100;
            spawnNewTarget();
          }
        } else {
          target.active = false;
          score += 150;
          spawnNewTarget();
        }
      }
    }

    function spawnNewTarget() {
      target.x = Math.random() * 380 + 90;
      target.active = true;
      target.health = 100;
      missionType = Math.random() > 0.5 ? "fire" : "rescue";
      document.getElementById('mission-display').textContent = missionType === "fire" ? "MISSION: PUT OUT FIRE! 🔥" : "MISSION: RESCUE CITIZEN! 🦸🏾‍♂️";
    }

    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--;
      document.getElementById('timer-display').textContent = `TIME: ${timeLeft}s`;
      if (timeLeft <= 0) {
        gameActive = false;
        clearInterval(timerInterval);
      }
    }, 1000);

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. BACKGROUND SKY & HORIZON
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. SIDEWALKS (Left & Right)
      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 0, 70, canvas.height);
      ctx.fillRect(canvas.width - 70, 0, 70, canvas.height);

      // Sidewalk concrete lines
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.height; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(70, i);
        ctx.moveTo(canvas.width - 70, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // 3. CITY ROADWAY
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(70, 0, canvas.width - 140, canvas.height);

      // Dashed road centerlines
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.setLineDash([15, 15]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]); // Reset line dash

      // 4. TARGET BUILDING / CITIZEN RENDERING
      if (target.active) {
        if (missionType === "fire") {
          // Brick Building Facade
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(target.x, target.y, target.width, target.height);
          
          // Building Windows
          ctx.fillStyle = '#fde047';
          ctx.fillRect(target.x + 10, target.y + 15, 15, 20);
          ctx.fillRect(target.x + 45, target.y + 15, 15, 20);

          // Blazing Fire Effect
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 10, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 12, 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(`🔥 ${target.health}%`, target.x + 10, target.y - 25);
        } else {
          // Citizen Rescue Marker on Sidewalk/Street
          ctx.fillStyle = '#059669';
          ctx.fillRect(target.x + 15, target.y + 20, 40, 40);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText("🆘 HELP", target.x + 10, target.y + 10);
        }
      }

      // 5. DETAILED FIRE ENGINE TRUCK
      // Chassis & Main Body
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(truck.x, truck.y + 12, truck.width, truck.height - 12);
      
      // Truck Cab (Front)
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(truck.x + 50, truck.y, 26, 25);
      
      // Windshield
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(truck.x + 58, truck.y + 4, 15, 12);

      // Ladder Rack on Top
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      ctx.strokeRect(truck.x + 8, truck.y + 6, 38, 8);

      // Wheels
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(truck.x + 18, truck.y + truck.height, 9, 0, Math.PI * 2);
      ctx.arc(truck.x + 62, truck.y + truck.height, 9, 0, Math.PI * 2);
      ctx.fill();

      // Hubcaps
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.arc(truck.x + 18, truck.y + truck.height, 3, 0, Math.PI * 2);
      ctx.arc(truck.x + 62, truck.y + truck.height, 3, 0, Math.PI * 2);
      ctx.fill();

      // Emergency Strobe Light Flashing
      ctx.fillStyle = Math.floor(Date.now() / 200) % 2 === 0 ? '#38bdf8' : '#ef4444';
      ctx.fillRect(truck.x + 60, truck.y - 6, 8, 6);

      // 6. UPDATE HUD SCORE
      document.getElementById('score-display').textContent = `SCORE: ${score}`;

      if (!gameActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText("MISSION COMPLETE!", 140, 160);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Final Detroit Score: ${score}`, 180, 200);
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
