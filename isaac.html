<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detroit City Rescue Arcade | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      overflow: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .hud {
      width: 100%;
      background: #0f172a;
      border: 2px solid #22c55e;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #4ade80;
    }
    .alert-banner {
      width: 100%;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #bbf7d0;
      padding: 5px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      height: 310px;
      background: #166534;
      border: 3px solid #22c55e;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 380px;
    }
    .ctrl-btn {
      background: #15803d;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 0 #166534;
      transition: transform 0.1s;
    }
    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .btn-action {
      background: #2563eb;
      box-shadow: 0 3px 0 #1d4ed8;
      grid-column: span 3;
      padding: 12px;
      font-size: 1.05rem;
    }
    .back-link {
      color: #64748b;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 0</span>
      <span id="timer-display">TIME: 45s</span>
    </div>

    <div class="alert-banner" id="alert-text">🚨 DETROIT EMERGENCY: DRIVE UP THE STREET TO THE FIRE!</div>

    <canvas id="gameCanvas" width="600" height="290"></canvas>

    <div class="controls">
      <div></div>
      <button class="ctrl-btn" ontouchstart="moveVehicle(0, -12)" onclick="moveVehicle(0, -12)">⬆️ UP</button>
      <div></div>
      <button class="ctrl-btn" ontouchstart="moveVehicle(-12, 0)" onclick="moveVehicle(-12, 0)">⬅ LEFT</button>
      <button class="ctrl-btn" ontouchstart="moveVehicle(0, 12)" onclick="moveVehicle(0, 12)">⬇️ DOWN</button>
      <button class="ctrl-btn" ontouchstart="moveVehicle(12, 0)" onclick="moveVehicle(12, 0)">RIGHT ➡️</button>
      <button class="ctrl-btn btn-action" ontouchstart="triggerAction()" onclick="triggerAction()">💦 BLAST WATER / RESCUE 🚨</button>
    </div>

    <a href="index.html" class="back-link">← RETURN TO MAIN PORTAL</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 45;
    let gameActive = true;
    let missionType = "fire"; // 'fire' or 'rescue'
    let waterParticles = [];

    // Web Audio API Sound Generator
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'siren') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'water') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        }
      } catch (e) {
        // Audio context handles browser policy smoothly
      }
    }

    // Vehicle (Facing Forward Up the Street)
    let vehicle = {
      x: 275,
      y: 210,
      width: 40,
      height: 65
    };

    // Emergency Target (House on Grass Lot or Citizen on Sidewalk)
    let target = {
      x: 420, // Built on grass lot beside the street
      y: 35,
      width: 100,
      height: 70,
      active: true,
      health: 100
    };

    function moveVehicle(dx, dy) {
      if (!gameActive) return;
      vehicle.x += dx;
      vehicle.y += dy;

      playSound('siren');

      // Keep vehicle within road bounds (Asphalt is from x: 130 to x: 470)
      if (vehicle.x < 135) vehicle.x = 135;
      if (vehicle.x > 470 - vehicle.width) vehicle.x = 470 - vehicle.width;
      if (vehicle.y < 20) vehicle.y = 20;
      if (vehicle.y > canvas.height - vehicle.height - 10) vehicle.y = canvas.height - vehicle.height - 10;
    }

    function triggerAction() {
      if (!gameActive) return;
      playSound('water');

      // Water spray animation toward target
      for (let i = 0; i < 10; i++) {
        waterParticles.push({
          x: vehicle.x + vehicle.width / 2,
          y: vehicle.y,
          vx: (Math.random() - 0.5) * 6,
          vy: -6 - Math.random() * 4,
          life: 20
        });
      }

      let distance = Math.hypot((vehicle.x + vehicle.width/2) - (target.x + target.width/2), vehicle.y - target.y);
      
      if (distance < 130 && target.active) {
        if (missionType === "fire") {
          target.health -= 34;
          if (target.health <= 0) {
            target.active = false;
            score += 100;
            spawnNewTarget();
          }
        } else {
          target.active = false;
          score += 150;
          spawnNewTarget();
        }
      }
    }

    function spawnNewTarget() {
      // Alternate target side: Left grass lot or Right grass lot
      let side = Math.random() > 0.5 ? 'left' : 'right';
      target.x = side === 'left' ? 40 : 420;
      target.y = Math.random() * 80 + 20;
      target.active = true;
      target.health = 100;
      missionType = Math.random() > 0.5 ? "fire" : "rescue";
      
      const alertEl = document.getElementById('alert-text');
      if (missionType === "fire") {
        alertEl.textContent = "🚨 HOUSE ON FIRE ON THE GRASS LOT! Drive up and BLAST WATER!";
      } else {
        alertEl.textContent = "🆘 CITIZEN NEEDS HELP ON THE SIDEWALK! Drive up and RESCUE!";
      }
    }

    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--;
      document.getElementById('timer-display').textContent = `TIME: ${timeLeft}s`;
      if (timeLeft <= 0) {
        gameActive = false;
        clearInterval(timerInterval);
      }
    }, 1000);

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. GRASS LAWNS (Left and Right)
      ctx.fillStyle = '#166534';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. SIDEWALKS
      ctx.fillStyle = '#64748b';
      ctx.fillRect(110, 0, 25, canvas.height);
      ctx.fillRect(465, 0, 25, canvas.height);

      // 3. ASPHALT ROADWAY DOWN THE CENTER
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(135, 0, 330, canvas.height);

      // Yellow Center Road Stripes
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 16]);
      ctx.beginPath();
      ctx.moveTo(300, 0);
      ctx.lineTo(300, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. HOUSE / BUILDING ON THE GRASS LOT
      if (target.active) {
        if (missionType === "fire") {
          // Brick House on Grass
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(target.x, target.y, target.width, target.height);
          
          // House Roof
          ctx.fillStyle = '#450a0a';
          ctx.beginPath();
          ctx.moveTo(target.x - 10, target.y);
          ctx.lineTo(target.x + target.width / 2, target.y - 25);
          ctx.lineTo(target.x + target.width + 10, target.y);
          ctx.fill();

          // Windows
          ctx.fillStyle = '#fde047';
          ctx.fillRect(target.x + 15, target.y + 15, 20, 25);
          ctx.fillRect(target.x + 65, target.y + 15, 20, 25);

          // Blazing Fire
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 30, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 32, 14, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(`🔥 FIRE: ${target.health}%`, target.x, target.y - 45);
        } else {
          // Citizen In Need on Sidewalk/Lawn
          ctx.fillStyle = '#047857';
          ctx.fillRect(target.x + 20, target.y + 10, 60, 50);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText("🆘 HELP!", target.x + 22, target.y);
        }
      }

      // 5. WATER PARTICLES
      for (let i = waterParticles.length - 1; i >= 0; i--) {
        let p = waterParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) waterParticles.splice(i, 1);
      }

      // 6. VEHICLE (Facing Forward Up the Street)
      let isAmbulance = missionType === "rescue";
      ctx.fillStyle = isAmbulance ? '#ffffff' : '#dc2626';
      ctx.fillRect(vehicle.x, vehicle.y, vehicle.width, vehicle.height);

      // Cab & Windshield
      ctx.fillStyle = isAmbulance ? '#dc2626' : '#991b1b';
      ctx.fillRect(vehicle.x + 4, vehicle.y + 6, vehicle.width - 8, 20);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(vehicle.x + 8, vehicle.y + 10, vehicle.width - 16, 12);

      // Wheels
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(vehicle.x - 4, vehicle.y + 10, 4, 12);
      ctx.fillRect(vehicle.x + vehicle.width, vehicle.y + 10, 4, 12);
      ctx.fillRect(vehicle.x - 4, vehicle.y + vehicle.height - 16, 4, 12);
      ctx.fillRect(vehicle.x + vehicle.width, vehicle.y + vehicle.height - 16, 4, 12);

      // Flashing Emergency Strobe
      ctx.fillStyle = Math.floor(Date.now() / 180) % 2 === 0 ? '#38bdf8' : '#ef4444';
      ctx.fillRect(vehicle.x + vehicle.width / 2 - 5, vehicle.y - 6, 10, 6);

      // 7. HUD
      document.getElementById('score-display').textContent = `SCORE: ${score}`;

      if (!gameActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText("MISSION COMPLETE!", 140, 130);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Final Detroit Score: ${score}`, 180, 175);
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
