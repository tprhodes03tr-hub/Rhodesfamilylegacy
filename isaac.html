<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Isaac Rhodes Adventures: Battle for Detroit Skyway</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: relative;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid #1e293b;
      z-index: 10;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .bar-wrap {
      display: flex;
      flex-direction: column;
      width: 38%;
      gap: 3px;
    }
    .hp-container {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
    }
    #hero-hp {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      transition: width 0.15s ease;
    }
    #boss-hp {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f43f5e, #e11d48);
      transition: width 0.15s ease;
    }
    #canvas-container {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Controls Grid */
    #controls {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: auto auto auto;
      gap: 6px;
      padding: 8px;
      background: #090d16;
      border-top: 2px solid #1e293b;
      z-index: 10;
    }
    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.08s ease;
    }
    .btn span.sub {
      font-size: 9px;
      opacity: 0.7;
      font-weight: 500;
    }
    .btn:active {
      background: #0284c7;
      transform: scale(0.97);
    }
    #btn-luetta {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, #047857, #059669);
      border-color: #34d399;
      color: #ecfdf5;
      padding: 7px;
    }
    #btn-luetta:active {
      background: #10b981;
    }

    /* Modal for Chapter Cleared */
    #chapter-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 7, 18, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      text-align: center;
      padding: 20px;
    }
    #chapter-modal h2 {
      font-size: 24px;
      color: #38bdf8;
      margin: 0 0 10px 0;
    }
    #chapter-modal p {
      font-size: 14px;
      color: #cbd5e1;
      margin: 0 0 20px 0;
    }
    #btn-proceed {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Responsive Landscape Fix for Mobile Phones */
    @media (orientation: landscape) and (max-height: 520px) {
      #top-bar {
        padding: 3px 10px;
        font-size: 11px;
      }
      .hp-container {
        height: 6px;
      }
      #controls {
        gap: 4px;
        padding: 4px 8px;
      }
      .btn {
        padding: 4px 2px;
        font-size: 10px;
      }
      .btn span.sub {
        font-size: 8px;
      }
      #btn-luetta {
        padding: 4px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="top-bar">
      <div class="bar-wrap">
        <span id="hero-label">XOCHITL</span>
        <div class="hp-container"><div id="hero-hp"></div></div>
      </div>
      <div id="stage-label">STAGE 1: ROOFTOP</div>
      <div class="bar-wrap" style="align-items: flex-end;">
        <span>CHRONO-LOCK</span>
        <div class="hp-container"><div id="boss-hp"></div></div>
      </div>
    </div>

    <div id="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <div id="chapter-modal">
        <h2>CHAPTER 1 CLEARED!</h2>
        <p>Chrono-Lock shattered on the Ren-Cen Rooftop.</p>
        <button id="btn-proceed">PROCEED TO CHAPTER 2 ▶</button>
      </div>
    </div>

    <div id="controls">
      <button class="btn" id="btn-left">◀ LEFT</button>
      <button class="btn" id="btn-right">RIGHT ▶</button>
      <button class="btn" id="btn-jump">▲ JUMP / HOVER</button>
      <button class="btn" id="btn-tag">TAG SWAP<span class="sub" id="tag-sub">MARCUS PRIME</span></button>

      <button class="btn" id="btn-strike"><span id="lbl-strike">STRIKE</span><span class="sub" id="sub-strike">MAGMA PUNCH</span></button>
      <button class="btn" id="btn-burst"><span id="lbl-burst">BURST</span><span class="sub" id="sub-burst">FEATHER BLADES</span></button>
      <button class="btn" id="btn-guard">GUARD<span class="sub" id="sub-guard">DEFLECTOR</span></button>
      <button class="btn" id="btn-restart">RESTART</button>

      <button class="btn" id="btn-luetta">★ MOTHER LUETTA AID ★<span class="sub">CELESTIAL PURGE & FULL RESTORATION</span></button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Resize Handler
    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game States
    let currentChapter = 1;
    let timeStopped = false;
    let activeHero = 'xochitl'; // 'xochitl' or 'marcus'
    let screenShake = 0;
    let purgeAlpha = 0;

    // Player Hero Object
    const hero = {
      x: 120,
      y: 0,
      vx: 0,
      vy: 0,
      hp: 100,
      maxHp: 100,
      isGrounded: false,
      isHovering: false,
      isGuarding: false,
      absorbedEnergy: 0,
      facingRight: true
    };

    // Boss Object: Chrono-Lock
    const boss = {
      x: 480,
      y: 0,
      w: 80,
      h: 110,
      hp: 180,
      maxHp: 180,
      teleportTimer: 180,
      slamTimer: 0,
      isSlamming: false,
      isStunned: false
    };

    const projectiles = [];
    const particles = [];
    const hazards = [];

    let moveLeft = false;
    let moveRight = false;

    // UI Bindings
    const heroHpBar = document.getElementById('hero-hp');
    const bossHpBar = document.getElementById('boss-hp');
    const heroLabel = document.getElementById('hero-label');
    const stageLabel = document.getElementById('stage-label');
    const tagSub = document.getElementById('tag-sub');
    const lblStrike = document.getElementById('lbl-strike');
    const subStrike = document.getElementById('sub-strike');
    const subBurst = document.getElementById('sub-burst');
    const subGuard = document.getElementById('sub-guard');
    const modal = document.getElementById('chapter-modal');

    function updateHeroUI() {
      if (activeHero === 'xochitl') {
        heroLabel.textContent = 'XOCHITL';
        tagSub.textContent = 'MARCUS PRIME';
        lblStrike.textContent = 'STRIKE';
        subStrike.textContent = 'MAGMA PUNCH';
        subBurst.textContent = 'LAVA / FEATHERS';
        subGuard.textContent = 'SOLAR WARD';
      } else {
        heroLabel.textContent = 'MARCUS PRIME';
        tagSub.textContent = 'XOCHITL';
        lblStrike.textContent = 'STRIKE';
        subStrike.textContent = 'ELECTRIC BEAM';
        subBurst.textContent = 'VOLT OVERLOAD';
        subGuard.textContent = 'ENERGY SHIELD';
      }
    }

    // Touch & Mouse Button Handlers
    function bindBtn(id, downFn, upFn) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); downFn(); });
      if (upFn) {
        el.addEventListener('pointerup', (e) => { e.preventDefault(); upFn(); });
        el.addEventListener('pointerleave', (e) => { e.preventDefault(); upFn(); });
      }
    }

    bindBtn('btn-left', () => { moveLeft = true; hero.facingRight = false; }, () => { moveLeft = false; });
    bindBtn('btn-right', () => { moveRight = true; hero.facingRight = true; }, () => { moveRight = false; });
    bindBtn('btn-jump', () => {
      if (hero.isGrounded) {
        hero.vy = -13;
        hero.isGrounded = false;
      } else if (activeHero === 'xochitl') {
        hero.isHovering = true;
        hero.vy = -3;
      }
    }, () => { hero.isHovering = false; });

    bindBtn('btn-tag', () => {
      activeHero = (activeHero === 'xochitl') ? 'marcus' : 'xochitl';
      updateHeroUI();
    });

    bindBtn('btn-strike', () => {
      if (activeHero === 'xochitl') {
        // Magma Punch / Energy Swipe
        projectiles.push({
          x: hero.x + (hero.facingRight ? 35 : -35),
          y: hero.y - 28,
          vx: hero.facingRight ? 12 : -12,
          vy: 0,
          w: 22,
          h: 22,
          type: 'magma',
          dmg: 16
        });
      } else {
        // Electric Beam
        projectiles.push({
          x: hero.x + (hero.facingRight ? 20 : -20),
          y: hero.y - 25,
          vx: hero.facingRight ? 18 : -18,
          vy: 0,
          w: 45,
          h: 12,
          type: 'lightning',
          dmg: 18
        });
      }
    });

    bindBtn('btn-burst', () => {
      if (activeHero === 'xochitl') {
        // Feather Dagger Fan
        const angles = [-0.35, -0.15, 0.05, 0.25];
        angles.forEach(ang => {
          projectiles.push({
            x: hero.x + (hero.facingRight ? 25 : -25),
            y: hero.y - 36,
            vx: (hero.facingRight ? 13 : -13) * Math.cos(ang),
            vy: 13 * Math.sin(ang),
            w: 16,
            h: 6,
            type: 'feather',
            dmg: 14
          });
        });
      } else {
        // Volt Overload (Absorbed Energy Release)
        const boost = 1 + (hero.absorbedEnergy / 30);
        projectiles.push({
          x: hero.x,
          y: hero.y - 25,
          vx: hero.facingRight ? 14 : -14,
          vy: 0,
          w: 80 * boost,
          h: 26,
          type: 'voltWave',
          dmg: 28 * boost
        });
        hero.absorbedEnergy = 0;
      }
    });

    bindBtn('btn-guard', () => { hero.isGuarding = true; }, () => { hero.isGuarding = false; });

    bindBtn('btn-luetta', () => {
      // Mother Luetta full purge and restoration
      hero.hp = hero.maxHp;
      hazards.length = 0;
      boss.hp = Math.max(0, boss.hp - 50);
      boss.isStunned = true;
      setTimeout(() => { boss.isStunned = false; }, 2200);
      screenShake = 14;
      purgeAlpha = 1.0;
    });

    document.getElementById('btn-proceed').addEventListener('click', () => {
      modal.style.display = 'none';
      currentChapter = 2;
      stageLabel.textContent = 'STAGE 2: DETROIT SKYWAY';
      boss.hp = boss.maxHp;
      boss.x = canvas.width - 150;
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      hero.hp = hero.maxHp;
      boss.hp = boss.maxHp;
      currentChapter = 1;
      stageLabel.textContent = 'STAGE 1: ROOFTOP';
      modal.style.display = 'none';
    });

    // Background Renderer with Detroit Renaissance Center
    function drawDetroitSkyline() {
      const w = canvas.width;
      const h = canvas.height;
      const groundY = h * 0.84;

      let sky = ctx.createLinearGradient(0, 0, 0, h);
      if (currentChapter === 2) {
        // Chapter 2: Evening Sunset / Riverfront Dusk
        sky.addColorStop(0, '#1c1033');
        sky.addColorStop(0.45, '#581c87');
        sky.addColorStop(0.75, '#c2410c');
        sky.addColorStop(1, '#f59e0b');
      } else {
        // Chapter 1: Deep Detroit Night
        sky.addColorStop(0, '#040714');
        sky.addColorStop(0.55, '#0b132b');
        sky.addColorStop(1, '#1e293b');
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Distant Ren-Cen Cluster
      const renX = w * 0.72;
      ctx.fillStyle = currentChapter === 2 ? '#1a1024' : '#080d1a';

      ctx.fillRect(renX - 60, groundY - 170, 24, 170); // Outer Left
      ctx.fillRect(renX - 32, groundY - 210, 26, 210); // Inner Left
      ctx.fillRect(renX - 2, groundY - 265, 36, 265);  // Center Tower
      ctx.fillRect(renX + 6, groundY - 280, 20, 15);   // Central Spire
      ctx.fillRect(renX + 38, groundY - 210, 26, 210); // Inner Right
      ctx.fillRect(renX + 68, groundY - 170, 24, 170); // Outer Right

      // Windows
      ctx.fillStyle = currentChapter === 2 ? 'rgba(254, 240, 138, 0.4)' : 'rgba(56, 189, 248, 0.35)';
      for (let wy = groundY - 250; wy < groundY - 15; wy += 14) {
        ctx.fillRect(renX + 7, wy, 18, 4);
        if (wy > groundY - 195) {
          ctx.fillRect(renX - 28, wy, 18, 4);
          ctx.fillRect(renX + 42, wy, 18, 4);
        }
      }

      // Rooftop Platform Deck
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, groundY, w, h - groundY);
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, groundY, w, 3);
    }

    // Chrono-Lock Renderer
    function drawChronoLock(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Pauldrons (Layered Gears)
      ctx.fillStyle = '#854d0e';
      [-30, 30].forEach(gx => {
        ctx.beginPath();
        ctx.arc(gx, -70, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 3;
        ctx.stroke();
      });

      // Tapered Athletic Bronze Chassis
      ctx.fillStyle = '#a16207';
      ctx.beginPath();
      ctx.moveTo(-28, -75);
      ctx.lineTo(28, -75);
      ctx.lineTo(14, -15);
      ctx.lineTo(-14, -15);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Piston Arms & Legs
      ctx.fillStyle = '#713f12';
      ctx.fillRect(-38, -60, 10, 48);
      ctx.fillRect(28, -60, 10, 48);
      ctx.fillRect(-18, -15, 12, 38);
      ctx.fillRect(6, -15, 12, 38);

      // Core Clock Gear & Emerald Dial
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(0, -46, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#064e3b';
      ctx.beginPath();
      ctx.arc(0, -46, 12, 0, Math.PI * 2);
      ctx.fill();

      // Clock Hands
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -46);
      ctx.lineTo(0, -54);
      ctx.moveTo(0, -46);
      ctx.lineTo(7, -46);
      ctx.stroke();

      // Urn / Chalice Headpiece
      ctx.fillStyle = '#ca8a04';
      ctx.beginPath();
      ctx.moveTo(-16, -104);
      ctx.lineTo(16, -104);
      ctx.lineTo(11, -80);
      ctx.lineTo(-11, -80);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Tri-Optic Glowing Green Lenses
      ctx.fillStyle = '#22c55e';
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, -96, 3.5, 0, Math.PI * 2);
      ctx.arc(-5, -88, 3.5, 0, Math.PI * 2);
      ctx.arc(5, -88, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Marcus Prime Renderer
    function drawMarcus(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Energy Shield Dome
      if (hero.isGuarding) {
        ctx.strokeStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 16;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, -26, 42, Math.PI, 0, false);
        ctx.stroke();
      }

      // Legs / Cargo Pants
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-9, -15, 7, 24);
      ctx.fillRect(2, -15, 7, 24);

      // Tech Hoodie / Vest
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-12, -45, 24, 32);

      // Tactical Arms & Sparks
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-17, -42, 6, 22);
      ctx.fillRect(11, -42, 6, 22);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, -22);
      ctx.lineTo(-14 + (Math.random() * 8 - 4), -14);
      ctx.moveTo(14, -22);
      ctx.lineTo(14 + (Math.random() * 8 - 4), -14);
      ctx.stroke();

      // Head & Textured Hair
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(0, -52, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.arc(0, -56, 9.5, Math.PI, 0, false);
      ctx.fill();

      ctx.restore();
    }

    // Xochitl Renderer
    function drawXochitl(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Fiery Golden Wings (Anchored at upper shoulder blades)
      if (hero.isHovering || !hero.isGrounded) {
        ctx.save();
        ctx.translate(0, -42);
        ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 18;

        // Left Wing
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-30, -35, -55, -15, -45, 15);
        ctx.bezierCurveTo(-30, 8, -15, 10, 0, 0);
        ctx.fill();

        // Right Wing
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(30, -35, 55, -15, 45, 15);
        ctx.bezierCurveTo(30, 8, 15, 10, 0, 0);
        ctx.fill();
        ctx.restore();
      }

      // Torso & Skirt
      ctx.fillStyle = '#78350f';
      ctx.fillRect(-8, -42, 16, 28);
      ctx.fillStyle = '#b45309';
      ctx.fillRect(-10, -22, 20, 12);

      // Magma/Molten Stone Arms
      ctx.fillStyle = '#ea580c';
      ctx.fillRect(-14, -40, 5, 20);
      ctx.fillRect(9, -40, 5, 20);

      // Head & Headdress
      ctx.fillStyle = '#92400e';
      ctx.beginPath();
      ctx.arc(0, -48, 8, 0, Math.PI * 2);
      ctx.fill();

      // Headdress Feathers
      const featherColors = ['#0284c7', '#dc2626', '#f59e0b'];
      featherColors.forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(-6 + (i * 6), -60, 3, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    // Main Update & Render Loop
    function gameLoop() {
      const groundY = canvas.height * 0.84;

      // Time Stop Mechanics
      if (!timeStopped) {
        // Hero Movement
        if (moveLeft) hero.vx = -4;
        else if (moveRight) hero.vx = 4;
        else hero.vx = 0;

        hero.x += hero.vx;
        hero.y += hero.vy;

        // Apply Gravity / Hover
        if (hero.isHovering) {
          hero.vy = Math.min(hero.vy + 0.1, 1.2);
        } else if (!hero.isGrounded) {
          hero.vy += 0.65;
        }

        if (hero.y >= groundY) {
          hero.y = groundY;
          hero.vy = 0;
          hero.isGrounded = true;
        }

        hero.x = Math.max(30, Math.min(canvas.width - 30, hero.x));

        // Chrono-Lock Teleport & Slam Logic
        if (!boss.isStunned) {
          boss.teleportTimer--;
          if (boss.teleportTimer <= 0) {
            timeStopped = true;
            setTimeout(() => {
              // Teleport behind or in front of the hero
              const offset = Math.random() > 0.5 ? 90 : -90;
              boss.x = Math.max(60, Math.min(canvas.width - 60, hero.x + offset));
              boss.y = groundY - boss.h;
              screenShake = 12;

              // Chrono-Lock Drop Attack Wave
              hazards.push({
                x: boss.x,
                y: groundY - 12,
                vx: -6,
                vy: 0,
                r: 8
              });
              hazards.push({
                x: boss.x,
                y: groundY - 12,
                vx: 6,
                vy: 0,
                r: 8
              });

              timeStopped = false;
              boss.teleportTimer = 220;
            }, 350);
          }
        }

        // Projectiles Update
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.x += p.vx;
          p.y += p.vy;

          // Check hit on boss
          if (Math.abs(p.x - boss.x) < 40 && Math.abs(p.y - (groundY - 50)) < 55) {
            boss.hp = Math.max(0, boss.hp - p.dmg);
            projectiles.splice(i, 1);
            continue;
          }

          if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
            projectiles.splice(i, 1);
          }
        }

        // Hostile Hazards Update
        for (let i = hazards.length - 1; i >= 0; i--) {
          const h = hazards[i];
          h.x += h.vx;
          h.y += h.vy;

          // Hit player
          if (Math.abs(h.x - hero.x) < 20 && Math.abs(h.y - (hero.y - 25)) < 30) {
            if (hero.isGuarding) {
              if (activeHero === 'marcus') {
                hero.absorbedEnergy = Math.min(100, hero.absorbedEnergy + 20);
              }
            } else {
              hero.hp = Math.max(0, hero.hp - 12);
              screenShake = 6;
            }
            hazards.splice(i, 1);
            continue;
          }

          if (h.x < 0 || h.x > canvas.width) {
            hazards.splice(i, 1);
          }
        }

        // Chapter 1 Cleared Condition
        if (boss.hp <= 0 && currentChapter === 1 && modal.style.display !== 'flex') {
          modal.style.display = 'flex';
        }
      }

      // Health Bars UI Update
      heroHpBar.style.width = (hero.hp / hero.maxHp * 100) + '%';
      bossHpBar.style.width = (boss.hp / boss.maxHp * 100) + '%';

      // Rendering
      ctx.save();
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake--;
      }

      drawDetroitSkyline();

      // Render Chrono-Lock
      drawChronoLock(boss.x, groundY);

      // Render Active Hero
      if (activeHero === 'xochitl') {
        drawXochitl(hero.x, hero.y);
      } else {
        drawMarcus(hero.x, hero.y);
      }

      // Draw Projectiles
      projectiles.forEach(p => {
        ctx.save();
        if (p.type === 'feather') {
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(p.x, p.y, p.w, p.h);
        } else if (p.type === 'lightning' || p.type === 'voltWave') {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 10;
          ctx.fillRect(p.x, p.y, p.w, p.h);
        } else {
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // Draw Hazards
      hazards.forEach(h => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Celestial Purge Flash Effect
      if (purgeAlpha > 0) {
        ctx.fillStyle = `rgba(253, 224, 71, ${purgeAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        purgeAlpha -= 0.03;
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    // Initialize
    updateHeroUI();
    hero.y = canvas.height * 0.84;
    boss.x = canvas.width - 120;
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
