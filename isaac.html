<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard | Arcade Brawler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #06070c;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    header {
      width: 100%;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 18, 30, 0.95);
      border-bottom: 2px solid #8b5cf6;
    }
    header h1 {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c084fc;
    }
    #combat-status {
      font-size: 0.8rem;
      font-weight: bold;
      color: #38bdf8;
    }
    #roster-bar {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 6px 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0 0 8px 8px;
    }
    .roster-card {
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 6px;
      padding: 6px 2px;
      text-align: center;
      font-size: 0.68rem;
      cursor: pointer;
      color: #cbd5e1;
      font-weight: bold;
    }
    .roster-card.active {
      border-color: #38bdf8;
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    #game-container {
      position: relative;
      margin-top: 6px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #4c1d95;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #touch-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 8px 12px;
      margin-top: 4px;
      gap: 8px;
    }
    .control-cluster {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: rgba(30, 27, 75, 0.9);
      border: 2px solid #a855f7;
      color: #e9d5ff;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn:active {
      background: #7e22ce;
      transform: scale(0.92);
    }
    .btn-action {
      border-radius: 10px;
      width: 72px;
      height: 48px;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .btn-strike { border-color: #38bdf8; color: #bae6fd; }
    .btn-super { border-color: #f59e0b; color: #fef3c7; }
    .btn-ascend { border-color: #ec4899; color: #fbcfe8; }
  </style>
</head>
<body>

  <header>
    <h1>Ancestral Vanguard</h1>
    <div id="combat-status">WAVE 1: SYNDICATE ASSAULT</div>
  </header>

  <div id="roster-bar">
    <div class="roster-card active" onclick="switchHero('marcus')">MARCUS</div>
    <div class="roster-card" onclick="switchHero('chronolock')">CHRONO</div>
    <div class="roster-card" onclick="switchHero('motherluta')">M. LUTA</div>
    <div class="roster-card" onclick="switchHero('xochitl')">XOCHITL</div>
    <div class="roster-card" onclick="switchHero('apexvolt')">APEX VOLT</div>
    <div class="roster-card" onclick="switchHero('amina')">AMINA</div>
  </div>

  <div id="game-container">
    <canvas id="stage" width="800" height="450"></canvas>
  </div>

  <div id="touch-controls">
    <div class="control-cluster">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
      <button class="btn" id="btn-jump">▲</button>
    </div>
    <div class="control-cluster">
      <button class="btn btn-action btn-strike" id="btn-strike">STRIKE</button>
      <button class="btn btn-action btn-super" id="btn-super">SUPER</button>
      <button class="btn btn-action btn-ascend" id="btn-ascend">ASCEND</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('combat-status');

    const bossImg = new Image();
    bossImg.src = 'syndicate.png';
    let bossReady = false;
    bossImg.onload = () => { bossReady = true; };

    const ROSTER = {
      marcus: {
        name: 'MARCUS (ANCHOR)',
        files: ['marcus.png'],
        speed: 5.2,
        gravity: 0.85,
        jumpForce: -14,
        scaleW: 110,
        scaleH: 145,
        color: '#a855f7',
        drawVector: (c, w, h) => {
          c.fillStyle = '#7c3aed'; c.fillRect(-w*0.3, -h*0.4, w*0.6, h*0.7);
          c.fillStyle = '#38bdf8'; c.fillRect(-w*0.2, -h*0.35, w*0.4, h*0.25);
        },
        superPower: (h) => {
          marcusShield = 180;
          h.hp = Math.min(100, h.hp + 25);
          screenShake = 16;
          for (let i = 0; i < 30; i++) {
            particles.push({
              x: h.x + h.w / 2, y: h.y + h.h / 2,
              vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
              size: 4, color: '#38bdf8', life: 25
            });
          }
          shockwaves.push({ x: h.x + h.w / 2, y: h.y + h.h / 2, radius: 10, maxRadius: 200, color: '#38bdf8' });
          dealAoeDamage(30);
        }
      },
      chronolock: {
        name: 'CHRONOLOCK (TEMPORAL)',
        files: ['chrono.png', '1789398446187.png'],
        speed: 4.2,
        gravity: 0.75,
        jumpForce: -13,
        scaleW: 115,
        scaleH: 150,
        color: '#10b981',
        drawVector: (c, w, h) => {
          c.fillStyle = '#065f46'; c.fillRect(-w*0.3, -h*0.38, w*0.6, h*0.65);
          c.fillStyle = '#10b981'; c.beginPath(); c.arc(0, -h*0.1, w*0.18, 0, Math.PI*2); c.fill();
        },
        superPower: (h) => {
          screenShake = 10;
          shockwaves.push({ x: h.x + h.w / 2, y: h.y + h.h / 2, radius: 15, maxRadius: 240, color: '#10b981' });
          droids.forEach(d => { d.vx *= 0.2; });
          dealAoeDamage(22);
        }
      },
      motherluta: {
        name: 'MOTHER LUTA (MYSTIC)',
        files: ['mother-luta.png'],
        speed: 5.4,
        gravity: 0.45,
        jumpForce: -12,
        scaleW: 110,
        scaleH: 145,
        color: '#fbbf24',
        drawVector: (c, w, h) => {
          c.fillStyle = '#b45309'; c.beginPath();
          c.moveTo(0, -h*0.45); c.lineTo(w*0.35, h*0.45); c.lineTo(-w*0.35, h*0.45); c.fill();
        },
        superPower: (h) => {
          h.vy = -18;
          h.isGrounded = false;
          h.hp = 100;
          screenShake = 22;
          for (let i = 0; i < 40; i++) {
            particles.push({
              x: Math.random() * canvas.width, y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 6, vy: Math.random() * 8 + 4,
              size: 5, color: '#fbbf24', life: 35
            });
          }
          wipeDroidsAndDamageBoss(50);
        }
      },
      xochitl: {
        name: 'XOCHITL (FLAME CLAW)',
        files: ['xochitl.png'],
        speed: 6.2,
        gravity: 0.8,
        jumpForce: -15,
        scaleW: 115,
        scaleH: 148,
        color: '#ea580c',
        drawVector: (c, w, h) => {},
        superPower: (h) => {
          h.vy = -16;
          h.isGrounded = false;
          wingModeTimer = 60;
          screenShake = 12;
          for (let i = -3; i <= 3; i++) {
            projectiles.push({
              x: h.x + h.w / 2, y: h.y + 30,
              vx: (h.facing * 11) + i * 2, vy: Math.abs(i) * 2 + 6,
              color: '#ea580c', life: 40
            });
          }
          dealAoeDamage(32);
        }
      },
      apexvolt: {
        name: 'APEX VOLT (ELECTRIC)',
        files: ['apex.png', 'apex-volt.png'],
        speed: 5.2,
        gravity: 0.82,
        jumpForce: -14,
        scaleW: 120,
        scaleH: 150,
        color: '#06b6d4',
        drawVector: (c, w, h) => {
          c.fillStyle = '#0e7490'; c.fillRect(-w*0.3, -h*0.4, w*0.6, h*0.75);
          c.fillStyle = '#67e8f9'; c.fillRect(-w*0.15, -h*0.3, w*0.3, h*0.2);
        },
        superPower: (h) => {
          screenShake = 14;
          dealAoeDamage(28);
        }
      },
      amina: {
        name: 'AMINA (SPEAR VANGUARD)',
        files: ['amina.png'],
        speed: 5.6,
        gravity: 0.82,
        jumpForce: -14.5,
        scaleW: 115,
        scaleH: 150,
        color: '#e11d48',
        drawVector: (c, w, h) => {
          c.fillStyle = '#9f1239'; c.fillRect(-w*0.25, -h*0.4, w*0.5, h*0.75);
          c.strokeStyle = '#f43f5e'; c.lineWidth = 4;
          c.beginPath(); c.moveTo(w*0.2, -h*0.45); c.lineTo(w*0.2, h*0.45); c.stroke();
        },
        superPower: (h) => {
          screenShake = 12;
          h.vx = h.facing * 18;
          dealAoeDamage(30);
        }
      }
    };

    const sprites = {};
    Object.keys(ROSTER).forEach(key => {
      sprites[key] = { img: new Image(), ready: false };
      loadSprite(key, 0);
    });

    function loadSprite(key, index) {
      const list = ROSTER[key].files;
      if (index >= list.length) return;
      const img = new Image();
      img.src = list[index];
      img.onload = () => { sprites[key].img = img; sprites[key].ready = true; };
      img.onerror = () => { loadSprite(key, index + 1); };
    }

    let activeKey = 'marcus';
    let screenShake = 0;
    let marcusShield = 0;
    let wingModeTimer = 0;
    const ghosts = [];
    const particles = [];
    const shockwaves = [];
    const projectiles = [];
    const enemyLasers = [];

    const hero = {
      x: 120, y: 250, w: 110, h: 145,
      vx: 0, vy: 0, facing: 1,
      isGrounded: true, cooldown: 0,
      runCycle: 0, groundY: 250, hp: 100
    };

    let gameState = 'DROIDS';
    let droids = [
      { x: 620, y: 180, w: 42, h: 42, vx: -2, shootTimer: 50, hp: 20 },
      { x: 700, y: 130, w: 42, h: 42, vx: -1.6, shootTimer: 80, hp: 20 },
      { x: 760, y: 220, w: 42, h: 42, vx: -2.2, shootTimer: 110, hp: 20 }
    ];
    let droidsRemaining = 6;

    const boss = {
      x: 580, y: 245, w: 135, h: 155,
      hp: 160, maxHp: 160, groundY: 245,
      atkTimer: 80, active: false
    };

    window.switchHero = function(key) {
      if (!ROSTER[key]) return;
      activeKey = key;
      const cfg = ROSTER[key];
      hero.w = cfg.scaleW;
      hero.h = cfg.scaleH;
      document.querySelectorAll('.roster-card').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
    };

    function wipeDroidsAndDamageBoss(bossDmg) {
      droids.forEach(d => {
        d.hp = 0;
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: d.x + d.w / 2, y: d.y + d.h / 2,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            size: 4, color: '#fde047', life: 25
          });
        }
      });
      droids = [];
      droidsRemaining = 0;
      if (gameState === 'BOSS' && boss.active) {
        boss.hp = Math.max(0, boss.hp - bossDmg);
      }
    }

    function dealAoeDamage(amt) {
      if (gameState === 'DROIDS') {
        droids.forEach(d => {
          if (Math.abs((hero.x + hero.w / 2) - (d.x + d.w / 2)) < 220) d.hp -= amt;
        });
      } else if (gameState === 'BOSS' && boss.active) {
        if (Math.abs((hero.x + hero.w / 2) - (boss.x + boss.w / 2)) < 240) {
          boss.hp = Math.max(0, boss.hp - amt);
          screenShake = 10;
        }
      }
    }

    function meleeStrike() {
      let hit = false;
      if (gameState === 'DROIDS') {
        droids.forEach(d => {
          if (Math.abs((hero.x + hero.w / 2) - (d.x + d.w / 2)) < 120 && Math.abs(hero.y - d.y) < 90) {
            d.hp -= 12;
            hit = true;
          }
        });
      } else if (gameState === 'BOSS' && boss.active) {
        if (Math.abs((hero.x + hero.w / 2) - (boss.x + boss.w / 2)) < 135) {
          boss.hp = Math.max(0, boss.hp - 14);
          hit = true;
        }
      }
      if (hit) screenShake = 6;
    }

    const keys = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'ArrowUp') doJump();
      if (e.key === 'j' || e.key === 'z') doStrike();
      if (e.key === 'k' || e.key === 'x') doSuper();
      if (e.key === 'l' || e.key === 'c') doAscend();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });

    function bind(id, down, up) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); down(); }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (up) up(); }, { passive: false });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); down(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if (up) up(); });
    }
    bind('btn-left', () => keys.left = true, () => keys.left = false);
    bind('btn-right', () => keys.right = true, () => keys.right = false);
    bind('btn-jump', () => doJump());
    bind('btn-strike', () => doStrike());
    bind('btn-super', () => doSuper());
    bind('btn-ascend', () => doAscend());

    function doJump() {
      if (hero.isGrounded) {
        hero.vy = ROSTER[activeKey].jumpForce;
        hero.isGrounded = false;
      }
    }
    function doStrike() {
      if (hero.cooldown === 0) {
        hero.cooldown = 15;
        meleeStrike();
      }
    }
    function doSuper() {
      if (hero.cooldown === 0) {
        hero.cooldown = 40;
        ROSTER[activeKey].superPower(hero);
      }
    }
    function doAscend() {
      if (hero.cooldown === 0) {
        hero.cooldown = 45;
        if (activeKey === 'motherluta' || activeKey === 'xochitl') {
          ROSTER[activeKey].superPower(hero);
        } else {
          hero.vy = -16;
          hero.isGrounded = false;
          dealAoeDamage(20);
        }
      }
    }

    function update() {
      if (screenShake > 0) screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;
      if (hero.cooldown > 0) hero.cooldown--;
      if (marcusShield > 0) marcusShield--;
      if (wingModeTimer > 0) wingModeTimer--;

      const cfg = ROSTER[activeKey];
      const isMoving = keys.left || keys.right;

      if (keys.left) { hero.vx = -cfg.speed; hero.facing = -1; }
      else if (keys.right) { hero.vx = cfg.speed; hero.facing = 1; }
      else { hero.vx *= 0.8; }

      // Authentic Stride Cycle
      if (isMoving && hero.isGrounded) {
        hero.runCycle += 0.28;
        // Spawn ground dust
        if (Math.random() < 0.4) {
          particles.push({
            x: hero.x + (hero.facing === 1 ? 10 : hero.w - 10),
            y: hero.groundY + hero.h - 4,
            vx: -hero.facing * (Math.random() * 2 + 1),
            vy: -(Math.random() * 2 + 1),
            size: 3, color: '#64748b', life: 15
          });
        }
      } else {
        hero.runCycle += 0.06; // Idle Breathing
      }

      hero.x += hero.vx;
      hero.y += hero.vy;

      if (!hero.isGrounded) {
        hero.vy += cfg.gravity;
        if (hero.y >= hero.groundY) {
          hero.y = hero.groundY;
          hero.vy = 0;
          hero.isGrounded = true;
        }
      }

      if (hero.x < 15) hero.x = 15;
      if (hero.x + hero.w > canvas.width - 15) hero.x = canvas.width - hero.w - 15;

      // Afterimage Ghosting during Dashing/Super
      if (Math.abs(hero.vx) > 4.5 || !hero.isGrounded) {
        ghosts.push({
          x: hero.x, y: hero.y, w: hero.w, h: hero.h,
          facing: hero.facing, key: activeKey, alpha: 0.4
        });
      }
      for (let i = ghosts.length - 1; i >= 0; i--) {
        ghosts[i].alpha -= 0.05;
        if (ghosts[i].alpha <= 0) ghosts.splice(i, 1);
      }

      // Feather Daggers
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        droids.forEach(d => {
          if (p.x > d.x && p.x < d.x + d.w && p.y > d.y && p.y < d.y + d.h) {
            d.hp -= 15; p.life = 0;
          }
        });
        if (gameState === 'BOSS' && boss.active) {
          if (p.x > boss.x && p.x < boss.x + boss.w && p.y > boss.y && p.y < boss.y + boss.h) {
            boss.hp -= 16; p.life = 0;
          }
        }
        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // Enemy Lasers vs Forcefield / Hero
      for (let i = enemyLasers.length - 1; i >= 0; i--) {
        const l = enemyLasers[i];
        l.x += l.vx;
        if (marcusShield > 0 && Math.abs(l.x - (hero.x + hero.w / 2)) < 60) {
          particles.push({ x: l.x, y: l.y, vx: -l.vx * 0.4, vy: (Math.random() - 0.5) * 4, size: 4, color: '#38bdf8', life: 12 });
          enemyLasers.splice(i, 1);
          continue;
        }
        if (l.x > hero.x && l.x < hero.x + hero.w && l.y > hero.y && l.y < hero.y + hero.h) {
          hero.hp = Math.max(0, hero.hp - 6);
          screenShake = 6;
          enemyLasers.splice(i, 1);
          continue;
        }
        if (l.x < 0) enemyLasers.splice(i, 1);
      }

      // Wave Progression
      if (gameState === 'DROIDS') {
        for (let i = droids.length - 1; i >= 0; i--) {
          const d = droids[i];
          d.x += d.vx;
          if (d.x < 380 || d.x > 750) d.vx *= -1;

          d.shootTimer--;
          if (d.shootTimer <= 0) {
            d.shootTimer = Math.floor(Math.random() * 65) + 45;
            enemyLasers.push({ x: d.x, y: d.y + d.h / 2, vx: -6 });
          }
          if (d.hp <= 0) {
            droidsRemaining--;
            droids.splice(i, 1);
            if (droidsRemaining > 0 && droids.length < 3) {
              droids.push({ x: 740, y: 150 + Math.random() * 110, w: 42, h: 42, vx: -2, shootTimer: 60, hp: 20 });
            }
          }
        }
        if (droids.length === 0 && droidsRemaining <= 0) {
          gameState = 'BOSS';
          boss.active = true;
          statusBadge.textContent = 'WARNING: SYNDICATE BOSS DEPLOYED';
          statusBadge.style.color = '#ef4444';
          screenShake = 22;
        }
      }

      if (gameState === 'BOSS' && boss.active) {
        boss.atkTimer--;
        if (boss.atkTimer <= 0) {
          boss.atkTimer = 75;
          enemyLasers.push({ x: boss.x, y: boss.y + 55, vx: -7 });
          enemyLasers.push({ x: boss.x, y: boss.y + 105, vx: -7 });
        }
        if (boss.hp <= 0) {
          gameState = 'VICTORY';
          boss.active = false;
          statusBadge.textContent = 'SECTOR CLEARED: VANGUARD WINS';
          statusBadge.style.color = '#10b981';
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.radius += 7;
        if (s.radius > s.maxRadius) shockwaves.splice(i, 1);
      }
    }

    function render() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Clean Cyber Detroit Backdrop (Deep Skyline & Floor)
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#040714');
      grad.addColorStop(0.7, '#0f172a');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Cyber Skyline Silhouette
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(80, 160, 90, 190);
      ctx.fillRect(190, 120, 110, 230);
      ctx.fillRect(320, 180, 80, 170);
      ctx.fillRect(480, 110, 140, 240);
      ctx.fillRect(640, 150, 100, 200);

      // Arena Floor
      const floorY = hero.groundY + hero.h - 5;
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
      ctx.strokeStyle = ROSTER[activeKey].color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(canvas.width, floorY);
      ctx.stroke();

      // HUD Bars
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(25, 18, 250, 16);
      ctx.fillRect(canvas.width - 275, 18, 250, 16);

      ctx.fillStyle = ROSTER[activeKey].color;
      ctx.fillRect(25, 18, (hero.hp / 100) * 250, 16);

      ctx.fillStyle = '#ef4444';
      if (gameState === 'DROIDS') {
        ctx.fillRect(canvas.width - 275, 18, (droidsRemaining / 6) * 250, 16);
      } else if (gameState === 'BOSS') {
        ctx.fillRect(canvas.width - 275, 18, (boss.hp / boss.maxHp) * 250, 16);
      }

      // Lasers & Feather Daggers
      ctx.fillStyle = '#f43f5e';
      enemyLasers.forEach(l => { ctx.fillRect(l.x, l.y, 14, 4); });

      projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.beginPath();
        ctx.moveTo(0, -5); ctx.lineTo(14, 0); ctx.lineTo(0, 5); ctx.fill();
        ctx.restore();
      });

      // Shockwaves & Particles
      shockwaves.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4;
        ctx.stroke();
      });
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // Forcefield Aura
      if (marcusShield > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(hero.x + hero.w / 2, hero.y + hero.h / 2, 70, 0, Math.PI * 2);
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
        ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 16;
        ctx.stroke();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)'; ctx.fill();
        ctx.restore();
      }

      // Afterimage Trails
      ghosts.forEach(g => {
        ctx.save();
        ctx.globalAlpha = g.alpha;
        ctx.translate(g.x + g.w / 2, g.y + g.h / 2);
        ctx.scale(g.facing, 1);
        const spr = sprites[g.key];
        if (spr && spr.ready) {
          ctx.drawImage(spr.img, -g.w / 2, -g.h / 2, g.w, g.h);
        }
        ctx.restore();
      });

      // Animated Hero Render with Procedural Physics
      ctx.save();
      const isMoving = keys.left || keys.right;
      // Stride deformation: running squashes Y and stretches X rhythmically
      const bobY = isMoving ? Math.sin(hero.runCycle) * 4 : Math.sin(hero.runCycle) * 2;
      const tilt = isMoving ? hero.facing * 0.08 : 0; // Forward sprint lean
      const stretchX = isMoving ? 1 + Math.cos(hero.runCycle) * 0.04 : 1;
      const stretchY = isMoving ? 1 - Math.cos(hero.runCycle) * 0.04 : 1;

      ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2 + bobY);
      ctx.rotate(tilt);
      ctx.scale(hero.facing * stretchX, stretchY);

      const spr = sprites[activeKey];
      if (spr && spr.ready) {
        ctx.drawImage(spr.img, -hero.w / 2, -hero.h / 2, hero.w, hero.h);
      } else {
        ctx.fillStyle = ROSTER[activeKey].color;
        ctx.shadowColor = ROSTER[activeKey].color;
        ctx.shadowBlur = 15;
        ROSTER[activeKey].drawVector(ctx, hero.w, hero.h);
      }
      ctx.restore();

      // Droid Squad
      droids.forEach(d => {
        ctx.fillStyle = '#475569';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(d.x + 8, d.y + 14, 10, 6);
        ctx.strokeStyle = '#94a3b8';
        ctx.strokeRect(d.x, d.y, d.w, d.h);
      });

      // Boss
      if (gameState === 'BOSS' && boss.active) {
        ctx.save();
        ctx.translate(boss.x + boss.w / 2, boss.y + boss.h / 2);
        if (bossReady) {
          ctx.drawImage(bossImg, -boss.w / 2, -boss.h / 2, boss.w, boss.h);
        } else {
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(-boss.w / 2, -boss.h / 2, boss.w, boss.h);
        }
        ctx.restore();
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
