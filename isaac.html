<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Isaac the Speedrunner • Corkscrew Spiral & Tunnel Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #020617;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    header { text-align: center; margin-bottom: 8px; }
    h1 {
      font-family: 'Georgia', serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      text-transform: uppercase;
    }
    .subtitle { font-size: 0.75rem; color: #94a3b8; }

    .nav-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      margin-bottom: 10px;
    }
    .nav-bar a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 4px 8px;
      background: #1e293b;
      border-radius: 4px;
    }
    .nav-bar a.active {
      color: #38bdf8;
      border: 1px solid #38bdf8;
      background: #0369a1;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
      padding: 0 12px;
    }
    .d-pad { display: flex; gap: 8px; }
    .ctrl-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: #38bdf8;
      color: #020617;
      transform: scale(0.92);
    }
    .action-btn-group { display: flex; gap: 10px; }
    .action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, #0284c7 0%, #0369a1 100%);
      border: 2px solid #38bdf8;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .action-btn.spin {
      background: radial-gradient(circle, #e11d48 0%, #9f1239 100%);
      border-color: #fb7185;
      box-shadow: 0 0 12px rgba(225, 29, 72, 0.4);
    }
    .action-btn:active { transform: scale(0.92); }

    .banner {
      width: 100%;
      max-width: 600px;
      padding: 8px;
      text-align: center;
      font-size: 0.72rem;
      color: #facc15;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Isaac The Speedrunner</h1>
    <div class="subtitle">Spiral Loops • Speed Tunnels • Boss Vanguard Zone</div>
  </header>

  <nav class="nav-bar">
    <a href="index.html">🛡️ Marrow Action</a>
    <a href="retro.html">🕹️ Retro Classics</a>
    <a href="odyssey.html">🚀 Odyssey</a>
    <a href="isaac.html" class="active">⚡ Isaac Speed</a>
    <a href="puzzle.html">🧩 Puzzle</a>
  </nav>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="320"></canvas>
  </div>

  <div class="touch-controls">
    <div class="d-pad">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-down">▼</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <div class="action-btn-group">
      <button class="action-btn spin" id="btn-spin">SPIN</button>
      <button class="action-btn" id="btn-jump">JUMP</button>
    </div>
  </div>

  <div class="banner">
    🌀 <strong>Speed Tips:</strong> Build momentum to sprint through the 360° Spiral Loops and warp tubes!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Massive 8000px World with seamless camera
    const WORLD_WIDTH = 8000;
    const GROUND_Y = 270;

    let cameraX = 0;
    let score = 0;
    let rings = 0;
    let timer = 0;
    let screenShake = 0;

    const input = { left: false, right: false, down: false, jump: false, spin: false };

    function bindBtn(id, key) {
      const el = document.getElementById(id);
      const setTrue = (e) => { e.preventDefault(); input[key] = true; };
      const setFalse = (e) => { e.preventDefault(); input[key] = false; };
      el.addEventListener('touchstart', setTrue);
      el.addEventListener('touchend', setFalse);
      el.addEventListener('mousedown', setTrue);
      el.addEventListener('mouseup', setFalse);
      el.addEventListener('mouseleave', setFalse);
    }
    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');
    bindBtn('btn-down', 'down');
    bindBtn('btn-jump', 'jump');
    bindBtn('btn-spin', 'spin');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
      if (e.key === 'ArrowDown' || e.key === 's') input.down = true;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') input.jump = true;
      if (e.key === 'Shift' || e.key === 'j') input.spin = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
      if (e.key === 'ArrowDown' || e.key === 's') input.down = false;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') input.jump = false;
      if (e.key === 'Shift' || e.key === 'j') input.spin = false;
    });

    const isaac = {
      x: 100,
      y: GROUND_Y - 54,
      w: 26,
      h: 52,
      vx: 0,
      vy: 0,
      accel: 0.22,
      maxSpeed: 12.0,
      friction: 0.97,
      gravity: 0.40,
      isGrounded: false,
      isRolling: false,
      inLoop: false,
      loopProgress: 0,
      loopCenter: null,
      facing: 1,
      animTime: 0,
      invuln: 0
    };

    // Extended Terrain Layout
    const platforms = [
      { x: 0, y: GROUND_Y, w: 1400, h: 50 },
      { x: 300, y: 210, w: 180, h: 14 },
      { x: 600, y: 160, w: 220, h: 14 },
      { x: 950, y: 200, w: 180, h: 14 },
      
      // Post-Loop 1 Platforms
      { x: 1750, y: GROUND_Y, w: 1800, h: 50 },
      { x: 1900, y: 200, w: 240, h: 14 },
      { x: 2300, y: 150, w: 260, h: 14 },
      
      // Speed Tunnel Elevated Path
      { x: 3800, y: GROUND_Y, w: 2400, h: 50 },
      { x: 4200, y: 190, w: 300, h: 14 },
      { x: 4700, y: 140, w: 320, h: 14 },
      
      // Final Boss Area
      { x: 6400, y: GROUND_Y, w: 1600, h: 50 }
    ];

    // 360° Spiral Loops
    const loops = [
      { centerX: 1550, centerY: GROUND_Y - 60, radius: 70 },
      { centerX: 3600, centerY: GROUND_Y - 70, radius: 80 },
      { centerX: 6200, centerY: GROUND_Y - 75, radius: 85 }
    ];

    // Speed Booster Warp Tunnels
    const tunnels = [
      { x: 2700, y: GROUND_Y - 32, w: 280, h: 32, boostSpeed: 14 },
      { x: 5200, y: GROUND_Y - 32, w: 320, h: 32, boostSpeed: 15 }
    ];

    // Springs & Pads
    const springs = [
      { x: 500, y: GROUND_Y - 14, w: 28, h: 14, force: -12 },
      { x: 1250, y: GROUND_Y - 14, w: 28, h: 14, force: -13.5 },
      { x: 2200, y: GROUND_Y - 14, w: 28, h: 14, force: -12.5 },
      { x: 4600, y: GROUND_Y - 14, w: 28, h: 14, force: -14 }
    ];

    const boostPads = [
      { x: 800, y: GROUND_Y - 8, w: 36, h: 8, boost: 12 },
      { x: 2600, y: GROUND_Y - 8, w: 36, h: 8, boost: 14 },
      { x: 5050, y: GROUND_Y - 8, w: 36, h: 8, boost: 15 }
    ];

    // Rings List spread across the full 8000px stage
    let ringList = [];
    for (let x = 180; x < 7800; x += 55) {
      if ((x > 1450 && x < 1650) || (x > 3500 && x < 3700)) continue; // skip loop gaps
      ringList.push({ x, y: GROUND_Y - 30 - (x % 160 === 0 ? 55 : 0), collected: false });
    }
    // Add rings circling the loops
    loops.forEach(lp => {
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
        ringList.push({
          x: lp.centerX + Math.cos(a) * (lp.radius - 10),
          y: lp.centerY + Math.sin(a) * (lp.radius - 10),
          collected: false
        });
      }
    });

    // Enemies (Badniks & Flying Drones)
    let enemies = [
      { x: 450, y: GROUND_Y - 36, w: 28, h: 28, vx: -1.2, minX: 350, maxX: 550, alive: true },
      { x: 1100, y: GROUND_Y - 36, w: 28, h: 28, vx: 1.5, minX: 980, maxX: 1280, alive: true },
      { x: 2050, y: 200 - 32, w: 28, h: 28, vx: -1.4, minX: 1920, maxX: 2120, alive: true },
      { x: 2900, y: GROUND_Y - 36, w: 28, h: 28, vx: 1.8, minX: 2750, maxX: 3100, alive: true },
      { x: 4400, y: 190 - 32, w: 28, h: 28, vx: -1.5, minX: 4250, maxX: 4480, alive: true },
      { x: 5500, y: GROUND_Y - 36, w: 28, h: 28, vx: 2.0, minX: 5300, maxX: 5750, alive: true },
      // Final Boss Drone
      { x: 7200, y: 160, w: 48, h: 48, vx: -2.2, minX: 6800, maxX: 7500, alive: true, isBoss: true, hp: 6 }
    ];

    let particles = [];
    let speedLines = [];

    function spawnHitFX(x, y, color = '#facc15', count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 25,
          color,
          size: 3 + Math.random() * 2
        });
      }
    }

    let jumpPrev = false;

    function update() {
      timer++;

      // 1. Loop-de-Loop Spiral Logic
      if (isaac.inLoop) {
        isaac.loopProgress += 0.065;
        isaac.x = isaac.loopCenter.centerX + Math.cos(isaac.loopProgress) * isaac.loopCenter.radius;
        isaac.y = isaac.loopCenter.centerY + Math.sin(isaac.loopProgress) * isaac.loopCenter.radius - 20;

        if (isaac.loopProgress >= Math.PI * 2.5) {
          isaac.inLoop = false;
          isaac.vx = 11;
          isaac.vy = 0;
          isaac.isGrounded = true;
          screenShake = 6;
          spawnHitFX(isaac.x, isaac.y, '#38bdf8', 12);
        }
      } else {
        // Normal Running & Momentum
        if (input.right) {
          isaac.vx += isaac.accel;
          isaac.facing = 1;
        } else if (input.left) {
          isaac.vx -= isaac.accel;
          isaac.facing = -1;
        } else {
          isaac.vx *= isaac.friction;
        }

        // Cap speed
        if (isaac.vx > isaac.maxSpeed) isaac.vx = isaac.maxSpeed;
        if (isaac.vx < -isaac.maxSpeed) isaac.vx = -isaac.maxSpeed;
        if (Math.abs(isaac.vx) < 0.05) isaac.vx = 0;

        // Spin-Dash
        if ((input.down || input.spin) && Math.abs(isaac.vx) > 2) {
          isaac.isRolling = true;
          isaac.vx += isaac.facing * 0.18;
        } else if (!input.down && !input.spin) {
          isaac.isRolling = false;
        }

        // Check entry into spiral loops
        loops.forEach(lp => {
          if (
            isaac.x >= lp.centerX - lp.radius - 15 &&
            isaac.x <= lp.centerX - lp.radius + 15 &&
            isaac.vx > 6 &&
            isaac.isGrounded
          ) {
            isaac.inLoop = true;
            isaac.loopCenter = lp;
            isaac.loopProgress = Math.PI * 0.5; // Start at bottom
            isaac.isRolling = true;
          }
        });

        // Jump
        if (input.jump && !jumpPrev && isaac.isGrounded) {
          isaac.vy = -9.2;
          isaac.isGrounded = false;
          spawnHitFX(isaac.x + isaac.w / 2, isaac.y + isaac.h, '#38bdf8', 6);
        }
        jumpPrev = input.jump;

        isaac.vy += isaac.gravity;
        isaac.x += isaac.vx;
        isaac.y += isaac.vy;

        // World Bounds
        if (isaac.x < 0) isaac.x = 0;
        if (isaac.x > WORLD_WIDTH - isaac.w) isaac.x = WORLD_WIDTH - isaac.w;

        // Platform Collisions
        isaac.isGrounded = false;
        platforms.forEach(plat => {
          if (
            isaac.x + isaac.w > plat.x &&
            isaac.x < plat.x + plat.w &&
            isaac.y + isaac.h >= plat.y &&
            isaac.y + isaac.h - isaac.vy <= plat.y + 16 &&
            isaac.vy >= 0
          ) {
            isaac.y = plat.y - isaac.h;
            isaac.vy = 0;
            isaac.isGrounded = true;
          }
        });

        // Warp Tunnels
        tunnels.forEach(t => {
          if (
            isaac.x + isaac.w > t.x &&
            isaac.x < t.x + t.w &&
            isaac.y + isaac.h >= t.y
          ) {
            isaac.isRolling = true;
            isaac.vx = t.boostSpeed;
            isaac.vy = 0;
            isaac.y = t.y + 4;
            spawnHitFX(isaac.x, isaac.y + 16, '#06b6d4', 4);
          }
        });

        // Springs
        springs.forEach(s => {
          if (
            isaac.x + isaac.w > s.x &&
            isaac.x < s.x + s.w &&
            isaac.y + isaac.h >= s.y &&
            isaac.y + isaac.h - isaac.vy <= s.y + 14
          ) {
            isaac.vy = s.force;
            isaac.isGrounded = false;
            screenShake = 6;
            spawnHitFX(s.x + s.w / 2, s.y, '#ef4444', 12);
          }
        });

        // Boost Pads
        boostPads.forEach(b => {
          if (
            isaac.x + isaac.w > b.x &&
            isaac.x < b.x + b.w &&
            isaac.y + isaac.h >= b.y &&
            isaac.y + isaac.h <= b.y + 14
          ) {
            isaac.vx = isaac.facing * b.boost;
            screenShake = 4;
            spawnHitFX(b.x + b.w / 2, b.y, '#38bdf8', 8);
          }
        });
      }

      // Collect Rings
      ringList.forEach(r => {
        if (!r.collected && Math.hypot((isaac.x + isaac.w / 2) - r.x, (isaac.y + isaac.h / 2) - r.y) < 26) {
          r.collected = true;
          rings++;
          score += 100;
          spawnHitFX(r.x, r.y, '#facc15', 4);
        }
      });

      // Enemy Interactions
      if (isaac.invuln > 0) isaac.invuln--;

      enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.vx;
        if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;

        if (
          isaac.x + isaac.w > e.x &&
          isaac.x < e.x + e.w &&
          isaac.y + isaac.h > e.y &&
          isaac.y < e.y + e.h
        ) {
          if (isaac.isRolling || (!isaac.isGrounded && isaac.vy > 0)) {
            if (e.isBoss) {
              e.hp--;
              isaac.vy = -6;
              screenShake = 10;
              spawnHitFX(e.x + e.w / 2, e.y + e.h / 2, '#ef4444', 16);
              if (e.hp <= 0) { e.alive = false; score += 5000; }
            } else {
              e.alive = false;
              isaac.vy = -6.5;
              score += 250;
              screenShake = 6;
              spawnHitFX(e.x + e.w / 2, e.y + e.h / 2, '#ef4444', 14);
            }
          } else if (isaac.invuln === 0) {
            if (rings > 0) {
              rings = Math.max(0, rings - 10);
              isaac.invuln = 60;
              isaac.vy = -5;
              isaac.vx = -isaac.facing * 4;
              screenShake = 8;
              spawnHitFX(isaac.x, isaac.y, '#facc15', 18);
            }
          }
        }
      });

      // Continuous Camera Follow
      const targetCamX = isaac.x + isaac.w / 2 - canvas.width / 2;
      cameraX += (targetCamX - cameraX) * 0.14;
      cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));

      if (screenShake > 0) screenShake *= 0.85;
      isaac.animTime += Math.abs(isaac.vx) * 0.08 + 0.05;

      // Speed Trail Lines
      if (Math.abs(isaac.vx) > 7.5 || isaac.inLoop) {
        speedLines.push({
          x: isaac.x + (isaac.facing === 1 ? -10 : isaac.w + 10),
          y: isaac.y + Math.random() * isaac.h,
          vx: -isaac.vx * 0.8,
          life: 12
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      if (screenShake > 0.2) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Parallax Sonic Sky & Mountains
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(0.55, '#38bdf8');
      skyGrad.addColorStop(1, '#a5f3fc');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0369a1';
      for (let i = 0; i < 30; i++) {
        const mx = i * 160 - (cameraX * 0.1 % 160);
        ctx.beginPath();
        ctx.moveTo(mx, GROUND_Y);
        ctx.lineTo(mx + 80, 110);
        ctx.lineTo(mx + 160, GROUND_Y);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Platforms & Checkered Soil
      platforms.forEach(plat => {
        ctx.fillStyle = '#15803d'; // Green Grass Top
        ctx.fillRect(plat.x, plat.y, plat.w, 8);

        ctx.fillStyle = '#78350f';
        ctx.fillRect(plat.x, plat.y + 8, plat.w, plat.h - 8);

        ctx.fillStyle = '#92400e';
        for (let x = plat.x; x < plat.x + plat.w; x += 20) {
          for (let y = plat.y + 8; y < plat.y + plat.h; y += 20) {
            if ((Math.floor(x / 20) + Math.floor(y / 20)) % 2 === 0) {
              ctx.fillRect(x, y, 10, 10);
            }
          }
        }
      });

      // Draw 360° Corkscrew Spirals
      loops.forEach(lp => {
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(lp.centerX, lp.centerY, lp.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(lp.centerX, lp.centerY, lp.radius + 10, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Speed Tunnels (Futuristic Glow Tubes)
      tunnels.forEach(t => {
        ctx.fillStyle = 'rgba(6, 182, 212, 0.25)';
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 3;
        ctx.strokeRect(t.x, t.y, t.w, t.h);

        // Neon Chevrons
        ctx.fillStyle = '#22d3ee';
        for (let x = t.x + 10; x < t.x + t.w; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, t.y + 4);
          ctx.lineTo(x + 14, t.y + t.h / 2);
          ctx.lineTo(x, t.y + t.h - 4);
          ctx.fill();
        }
      });

      // Springs & Boost Pads
      springs.forEach(s => {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#fecaca';
        ctx.fillRect(s.x + 4, s.y + 2, s.w - 8, 3);
      });

      boostPads.forEach(b => {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#0284c7';
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(b.x + 6 + i * 10, b.y + 2, 4, 4);
        }
      });

      // Goal Plate at World End
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(WORLD_WIDTH - 200, GROUND_Y - 90, 10, 90);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(WORLD_WIDTH - 200, GROUND_Y - 90, 50, 30);
      ctx.fillStyle = '#020617';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('GOAL', WORLD_WIDTH - 192, GROUND_Y - 70);

      // Rings
      ringList.forEach(r => {
        if (!r.collected) {
          const squish = Math.abs(Math.sin(isaac.animTime * 2 + r.x));
          ctx.save();
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.ellipse(r.x, r.y, 7 * squish + 1, 9, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      });

      // Enemies & Boss
      enemies.forEach(e => {
        if (!e.alive) return;
        if (e.isBoss) {
          ctx.fillStyle = '#7c2d12';
          ctx.fillRect(e.x, e.y, e.w, e.h);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(e.x + 8, e.y + 12, e.w - 16, 10);
          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 9px sans-serif';
          ctx.fillText(`BOSS HP: ${e.hp}`, e.x, e.y - 8);
        } else {
          ctx.fillStyle = '#475569';
          ctx.fillRect(e.x, e.y, e.w, e.h);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(e.x + 4, e.y + 6, e.w - 8, 8);
        }
      });

      // Speed Wind Lines
      speedLines.forEach((l, idx) => {
        l.x += l.vx;
        l.life--;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x - l.vx * 2, l.y);
        ctx.stroke();
        if (l.life <= 0) speedLines.splice(idx, 1);
      });

      drawIsaacCharacter();

      // FX Particles
      particles.forEach((pt, idx) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        if (pt.life <= 0) particles.splice(idx, 1);
      });

      ctx.restore(); // End World
      ctx.restore(); // End Shake

      drawHUD();
    }

    function drawIsaacCharacter() {
      const x = isaac.x;
      const y = isaac.y;
      const w = isaac.w;
      const h = isaac.h;

      ctx.save();

      if (isaac.invuln > 0 && Math.floor(timer / 4) % 2 === 0) {
        ctx.restore();
        return;
      }

      if (isaac.isRolling || isaac.inLoop) {
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2 + 6, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2 + 6, 15, isaac.animTime * 8, isaac.animTime * 8 + Math.PI);
        ctx.stroke();
        ctx.restore();
        return;
      }

      const isRunning = Math.abs(isaac.vx) > 0.5;
      const stride = isRunning ? Math.sin(isaac.animTime * 8) * 8 : 0;
      const bob = isRunning ? Math.abs(Math.sin(isaac.animTime * 8)) * 3 : 0;

      // Long Hair
      ctx.fillStyle = '#1e1b18';
      ctx.fillRect(x + (isaac.facing === 1 ? -4 : 6), y + 4 - bob, 14, 28);

      // Blue Shorts
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(x + 4, y + 28 - bob, w - 8, 12);
      ctx.fillStyle = '#fff';
      ctx.fillRect(isaac.facing === 1 ? x + w - 6 : x + 4, y + 28 - bob, 2, 12);

      // Legs
      ctx.fillStyle = '#8d5b4c';
      ctx.fillRect(x + 5, y + 40 - bob, 6, 10 + stride);
      ctx.fillRect(x + w - 11, y + 40 - bob, 6, 10 - stride);

      // Sneakers
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x + 3, y + 48 - bob + stride, 10, 6);
      ctx.fillRect(x + w - 13, y + 48 - bob - stride, 10, 6);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 6, y + 48 - bob + stride, 3, 6);
      ctx.fillRect(x + w - 10, y + 48 - bob - stride, 3, 6);

      // Green Shirt
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(x + 3, y + 16 - bob, w - 6, 14);

      // Arm
      ctx.fillStyle = '#8d5b4c';
      const armX = isaac.facing === 1 ? x + w - 4 : x - 2;
      ctx.fillRect(armX, y + 18 - bob, 5, 12);

      // Face & Glasses
      ctx.fillStyle = '#8d5b4c';
      ctx.fillRect(x + 5, y + 2 - bob, 16, 14);

      ctx.fillStyle = '#1e1b18';
      ctx.fillRect(x + 4, y - bob, 18, 5);

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 1.5;
      const eyeX = isaac.facing === 1 ? x + 12 : x + 6;
      ctx.strokeRect(eyeX, y + 6 - bob, 8, 5);
      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(eyeX + 1, y + 7 - bob, 6, 3);

      ctx.restore();
    }

    function drawHUD() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.fillRect(10, 10, 190, 48);
      ctx.strokeRect(10, 10, 190, 48);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(`RINGS  ${rings}`, 18, 26);

      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`SCORE  ${score}`, 18, 38);

      const sec = Math.floor(timer / 60);
      ctx.fillStyle = '#fff';
      ctx.fillText(`TIME   00:${sec < 10 ? '0' + sec : sec}`, 18, 50);

      const speedPct = Math.min(1, Math.abs(isaac.vx) / isaac.maxSpeed);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(canvas.width - 120, 10, 110, 14);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(canvas.width - 120, 10, 110 * speedPct, 14);
      ctx.strokeStyle = '#38bdf8';
      ctx.strokeRect(canvas.width - 120, 10, 110, 14);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
