<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard: Rooftop Showdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 640px;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    
    /* Top Battle HUD */
    #hud {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      background: linear-gradient(180deg, rgba(2,6,23,0.9) 0%, rgba(2,6,23,0) 100%);
    }
    .bar-box {
      width: 45%;
    }
    .bar-label {
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .bar-outer {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #475569;
    }
    .bar-inner {
      height: 100%;
      transition: width 0.2s ease-out;
    }
    #player-hp { background: #38bdf8; width: 100%; }
    #boss-hp { background: #ef4444; width: 100%; }

    /* Canvas Screen */
    canvas {
      width: 100%;
      height: 480px;
      background: #0f172a;
    }

    /* Controls Deck */
    #controls {
      height: 160px;
      background: #111827;
      border-top: 2px solid #1f2937;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 12px;
      gap: 12px;
    }
    .d-pad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-ctrl {
      background: #1f2937;
      border: 1px solid #374151;
      color: #93c5fd;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ctrl:active {
      background: #374151;
      transform: scale(0.96);
    }
    .actions-pad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-action {
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      color: #fff;
      cursor: pointer;
    }
    .btn-strike {
      background: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .btn-strike:active { background: #1d4ed8; }
    .btn-special {
      background: #d97706;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
    }
    .btn-special:active { background: #b45309; }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    .overlay h2 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .overlay p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn-restart {
      background: #facc15;
      color: #000;
      font-weight: 900;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Battle HUD -->
    <div id="hud">
      <div class="bar-box">
        <div class="bar-label" style="color: #38bdf8;">MARCUS (HERO)</div>
        <div class="bar-outer"><div id="player-hp" class="bar-inner"></div></div>
      </div>
      <div class="bar-box" style="text-align: right;">
        <div class="bar-label" style="color: #ef4444;">CHRONO-LOCK</div>
        <div class="bar-outer"><div id="boss-hp" class="bar-inner"></div></div>
      </div>
    </div>

    <!-- Battle Canvas Screen -->
    <canvas id="stage" width="480" height="480"></canvas>

    <!-- Touch / Desktop Controls -->
    <div id="controls">
      <div class="d-pad">
        <button class="btn-ctrl" id="btnLeft">◀ LEFT</button>
        <button class="btn-ctrl" id="btnRight">RIGHT ▶</button>
      </div>
      <div class="actions-pad">
        <button class="btn-action btn-strike" id="btnStrike">STRIKE</button>
        <button class="btn-action btn-special" id="btnSpecial">PULSE</button>
      </div>
    </div>

    <!-- Victory Overlay -->
    <div id="victoryOverlay" class="overlay">
      <h2 style="color: #facc15;">✦ VICTORY DECLARED ✦</h2>
      <p>Marcus has shattered the gearworks of Chrono-Lock and preserved the ancestral timeline!</p>
      <button class="btn-restart" onclick="resetBattle()">RE-ENGAGE BATTLE</button>
    </div>

    <!-- Defeat Overlay -->
    <div id="defeatOverlay" class="overlay">
      <h2 style="color: #ef4444;">TIME COLLAPSE</h2>
      <p>Marcus was caught in the temporal loop. Regroup and strike back!</p>
      <button class="btn-restart" onclick="resetBattle()">TRY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    // Load Sprites
    const marcusImg = new Image();
    marcusImg.src = "marcus_clean.png";

    const chronoImg = new Image();
    chronoImg.src = "Chrome.jpg";

    let marcusLoaded = false;
    marcusImg.onload = () => { marcusLoaded = true; };

    let chronoLoaded = false;
    chronoImg.onload = () => { chronoLoaded = true; };

    // Combat Entities
    let player = {
      x: 60,
      y: 280,
      w: 80,
      h: 110,
      vx: 0,
      maxHp: 100,
      hp: 100,
      attacking: false,
      attackCooldown: 0
    };

    let boss = {
      x: 320,
      y: 260,
      w: 90,
      h: 120,
      baseY: 260,
      maxHp: 150,
      hp: 150,
      bobTimer: 0,
      attackCooldown: 60
    };

    let particles = [];
    let battleActive = true;

    // Controls Event Listeners
    let leftPressed = false;
    let rightPressed = false;

    const setupBtn = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
      el.addEventListener('mousedown', onDown);
      el.addEventListener('mouseup', onUp);
    };

    setupBtn('btnLeft', () => { leftPressed = true; }, () => { leftPressed = false; });
    setupBtn('btnRight', () => { rightPressed = true; }, () => { rightPressed = false; });
    setupBtn('btnStrike', () => { triggerAttack('normal'); }, () => {});
    setupBtn('btnSpecial', () => { triggerAttack('special'); }, () => {});

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
      if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
      if (e.key === ' ' || e.key === 'j') triggerAttack('normal');
      if (e.key === 'k') triggerAttack('special');
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
      if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
    });

    function triggerAttack(type) {
      if (!battleActive || player.attackCooldown > 0) return;
      player.attacking = true;
      player.attackCooldown = (type === 'normal') ? 18 : 35;

      const damage = (type === 'normal') ? 15 : 30;
      const reach = (type === 'normal') ? 110 : 150;

      // Hit Check
      if (Math.abs((player.x + player.w) - boss.x) < reach) {
        boss.hp = Math.max(0, boss.hp - damage);
        document.getElementById("boss-hp").style.width = (boss.hp / boss.maxHp * 100) + "%";
        spawnSparks(boss.x + boss.w / 2, boss.y + boss.h / 2, (type === 'normal') ? "#38bdf8" : "#facc15");

        if (boss.hp <= 0) {
          battleActive = false;
          setTimeout(() => {
            document.getElementById("victoryOverlay").style.display = "flex";
          }, 300);
        }
      }
    }

    function spawnSparks(x, y, color) {
      for (let i = 0; i < 14; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          color,
          life: 20
        });
      }
    }

    function update() {
      if (!battleActive) return;

      // Movement
      if (leftPressed && player.x > 20) player.x -= 4;
      if (rightPressed && player.x < boss.x - 50) player.x += 4;

      if (player.attackCooldown > 0) {
        player.attackCooldown--;
        if (player.attackCooldown < 10) player.attacking = false;
      }

      // Boss Idle Hover & Counter-Attack
      boss.bobTimer += 0.05;
      boss.y = boss.baseY + Math.sin(boss.bobTimer) * 10;

      if (boss.attackCooldown > 0) {
        boss.attackCooldown--;
      } else {
        boss.attackCooldown = Math.floor(Math.random() * 60) + 70;
        // Boss pulses damage if player is within range
        if (Math.abs(boss.x - (player.x + player.w)) < 120) {
          player.hp = Math.max(0, player.hp - 16);
          document.getElementById("player-hp").style.width = (player.hp / player.maxHp * 100) + "%";
          spawnSparks(player.x + player.w / 2, player.y + player.h / 2, "#ef4444");

          if (player.hp <= 0) {
            battleActive = false;
            setTimeout(() => {
              document.getElementById("defeatOverlay").style.display = "flex";
            }, 300);
          }
        }
      }

      // Particles
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(index, 1);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Rooftop Environment
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 390, canvas.width, 90);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 400, canvas.width, 80);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(0, 390, canvas.width, 3); // Neon edge line

      // Draw Marcus
      if (marcusLoaded) {
        ctx.save();
        if (player.attacking) {
          ctx.shadowColor = "#38bdf8";
          ctx.shadowBlur = 18;
        }
        ctx.drawImage(marcusImg, player.x, player.y, player.w, player.h);
        ctx.restore();
      } else {
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(player.x, player.y, player.w, player.h);
      }

      // Draw Chrono-Lock (with masked circular glow frame to soften JPEG background)
      if (chronoLoaded) {
        ctx.save();
        // Golden Gear Glow
        ctx.shadowColor = "#f59e0b";
        ctx.shadowBlur = 20;

        // Circular clipping to turn the square crop into a smooth floating portrait token
        ctx.beginPath();
        ctx.arc(boss.x + boss.w / 2, boss.y + boss.h / 2, boss.w / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        ctx.drawImage(chronoImg, boss.x, boss.y, boss.w, boss.h);
        ctx.restore();

        // Mechanical Brass Rim
        ctx.strokeStyle = "#ca8a04";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(boss.x + boss.w / 2, boss.y + boss.h / 2, boss.w / 2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
      }

      // Sparks & Hits
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(() => {
        update();
        draw();
      });
    }

    draw();

    function resetBattle() {
      player.hp = player.maxHp;
      boss.hp = boss.maxHp;
      player.x = 60;
      document.getElementById("player-hp").style.width = "100%";
      document.getElementById("boss-hp").style.width = "100%";
      document.getElementById("victoryOverlay").style.display = "none";
      document.getElementById("defeatOverlay").style.display = "none";
      battleActive = true;
    }
  </script>
</body>
</html>
