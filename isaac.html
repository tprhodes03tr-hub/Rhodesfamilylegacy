<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isaac's Run Adventures - Rhodes Family Legacy</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 540px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      margin-bottom: 12px;
    }

    .portal-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #38bdf8;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .game-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 13px;
      font-weight: 800;
      color: #f59e0b;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 290px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .btn-action {
      background: linear-gradient(180deg, #0369a1, #0c4a6e);
      border-color: #38bdf8;
      color: #bae6fd;
    }

    .btn-back {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      text-transform: uppercase;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-back:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Isaac's Run Adventures</div>
  </header>

  <div class="game-wrapper">
    <div class="hud-header">
      <span id="scoreText">Distance: 0m</span>
      <span id="speedText">Speed: 6 MPH</span>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="540" height="290"></canvas>
    </div>

    <div class="controls-grid">
      <button class="btn" onclick="playerJump()">▲ JUMP / FLY</button>
      <button class="btn btn-action" onclick="playerBoost()">⚡ SPEED BOOST</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isaac = {
      x: 80,
      y: 200,
      vy: 0,
      width: 28,
      height: 45,
      isGrounded: true
    };

    let score = 0;
    let obstacles = [];
    let gameActive = true;

    function playerJump() {
      if (isaac.isGrounded) {
        isaac.vy = -12;
        isaac.isGrounded = false;
      }
    }

    function playerBoost() {
      score += 25;
    }

    function update() {
      if (!gameActive) return;

      // Gravity
      isaac.y += isaac.vy;
      isaac.vy += 0.65;

      if (isaac.y > 200) {
        isaac.y = 200;
        isaac.vy = 0;
        isaac.isGrounded = true;
      }

      score++;
      document.getElementById('scoreText').textContent = `Distance: ${score}m`;
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 245, canvas.width, 45);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 245);
      ctx.lineTo(canvas.width, 245);
      ctx.stroke();

      // Draw Isaac (Platformer Runner)
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(isaac.x, isaac.y, isaac.width, isaac.height);
      
      // Details
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(isaac.x + 6, isaac.y + 8, 8, 8);
    }

    function loop() {
      update();
      draw();
      if (gameActive) requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
