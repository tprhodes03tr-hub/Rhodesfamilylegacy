<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isaac's Street Racer - Rhodes Family Legacy</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 540px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      margin-bottom: 12px;
    }

    .portal-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #38bdf8;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .game-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 13px;
      font-weight: 800;
      color: #f59e0b;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .btn-action {
      background: linear-gradient(180deg, #ea580c, #c2410c);
      border-color: #f97316;
      color: #fff;
    }

    .btn-steer {
      background: linear-gradient(180deg, #0369a1, #0c4a6e);
      border-color: #38bdf8;
      color: #bae6fd;
    }

    .btn-back {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      text-transform: uppercase;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-back:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Isaac's Street Racer</div>
  </header>

  <div class="game-wrapper">
    <div class="hud-header">
      <span id="scoreText">Distance: 0m</span>
      <span id="speedText">Speed: 0 MPH</span>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="540" height="320"></canvas>
    </div>

    <div class="controls-grid">
      <button class="btn btn-steer" ontouchstart="steerLeft()" onmousedown="steerLeft()">◀ STEER LEFT</button>
      <button class="btn btn-steer" ontouchstart="steerRight()" onmousedown="steerRight()">STEER RIGHT ▶</button>
      <button class="btn" ontouchstart="brakeCar()" onmousedown="brakeCar()">BRAKE</button>
      <button class="btn btn-action" ontouchstart="accelerateCar()" onmousedown="accelerateCar()">ACCELERATE ⚡</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let car = {
      x: 235,
      y: 220,
      width: 44,
      height: 80,
      speed: 4,
      maxSpeed: 12,
      color: '#ea580c'
    };

    let roadScroll = 0;
    let distance = 0;
    let keys = {};

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function steerLeft() { car.x = Math.max(90, car.x - 25); }
    function steerRight() { car.x = Math.min(410, car.x + 25); }
    function accelerateCar() { car.speed = Math.min(car.maxSpeed, car.speed + 2); }
    function brakeCar() { car.speed = Math.max(2, car.speed - 3); }

    function update() {
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) steerLeft();
      if (keys['ArrowRight'] || keys['d'] || keys['D']) steerRight();
      if (keys['ArrowUp'] || keys['w'] || keys['W']) accelerateCar();
      if (keys['ArrowDown'] || keys['s'] || keys['S']) brakeCar();

      roadScroll += car.speed;
      distance += Math.floor(car.speed / 2);

      document.getElementById('scoreText').textContent = `Distance: ${distance}m`;
      document.getElementById('speedText').textContent = `Speed: ${Math.floor(car.speed * 12)} MPH`;
    }

    function draw() {
      // Background / City Night Skyline
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // City Sidewalks / Buildings
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(40, 0, 40, canvas.height);
      ctx.fillRect(460, 0, 40, canvas.height);

      // Main Street Road Surface
      ctx.fillStyle = '#334155';
      ctx.fillRect(80, 0, 380, canvas.height);

      // Road Curb Edges
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(76, 0, 6, canvas.height);
      ctx.fillRect(458, 0, 6, canvas.height);

      // Center Dashed Dividing Lines (Scrolling)
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 5;
      ctx.setLineDash([30, 30]);
      ctx.lineDashOffset = -roadScroll;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Custom Street Car with Rims
      ctx.save();
      ctx.translate(car.x, car.y);

      // Car Body Shadow & Glow
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;

      // Main Chassis
      ctx.fillStyle = car.color;
      ctx.beginPath();
      ctx.roundRect(0, 0, car.width, car.height, 12);
      ctx.fill();

      // Windshield & Windows
      ctx.fillStyle = '#020617';
      ctx.fillRect(6, 18, car.width - 12, 22);
      ctx.fillRect(8, 48, car.width - 16, 16);

      // Headlights
      ctx.fillStyle = '#facc15';
      ctx.fillRect(2, 2, 8, 5);
      ctx.fillRect(car.width - 10, 2, 8, 5);

      // Custom Rims & Tires
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-6, 12, 6, 18);
      ctx.fillRect(car.width, 12, 6, 18);
      ctx.fillRect(-6, car.height - 24, 6, 18);
      ctx.fillRect(car.width, car.height - 24, 6, 18);

      // Glowing Rim Spokes
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-4, 16, 2, 10);
      ctx.fillRect(car.width + 2, 16, 2, 10);
      ctx.fillRect(-4, car.height - 20, 2, 10);
      ctx.fillRect(car.width + 2, car.height - 20, 2, 10);

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
