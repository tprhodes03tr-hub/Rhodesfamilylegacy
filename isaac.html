<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RenCen Rooftop Clash - Isaac Rhodes Adventures</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050813;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
    }
    .header-bar {
      width: 100%;
      max-width: 900px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #091224;
      border-bottom: 2px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .header-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
    }
    .hud {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(10, 18, 32, 0.95);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }
    .hud-box {
      flex: 1;
      background: rgba(17, 28, 48, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .hud-name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .bar-container {
      width: 100%;
      height: 10px;
      background: #111a2e;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hp-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    #player-hp {
      background: linear-gradient(90deg, #00f0ff, #00ff88);
      box-shadow: 0 0 8px #00f0ff;
    }
    #boss-hp {
      background: linear-gradient(90deg, #ff3366, #ff8800);
      box-shadow: 0 0 8px #ff3366;
    }
    .hud-mid {
      flex: 1.2;
      text-align: center;
      font-size: 11px;
      line-height: 1.3;
      color: #ffcc00;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 380px;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a0b1a;
      border-bottom: 2px solid #00f0ff;
    }
    .victory-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 19, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 10;
    }
    .victory-overlay h2 {
      font-size: 26px;
      color: #00ffaa;
      text-shadow: 0 0 15px #00ffaa;
      letter-spacing: 2px;
    }
    .victory-overlay button {
      background: #00f0ff;
      color: #000;
      font-weight: 800;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 0 12px #00f0ff;
    }
    .controls {
      width: 100%;
      max-width: 900px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ctrl-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .d-pad {
      display: flex;
      gap: 8px;
    }
    button.game-btn {
      background: #13243f;
      color: #e2f1ff;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 12px 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.05s, background 0.1s;
    }
    button.game-btn:active {
      transform: scale(0.96);
      background: #1e3a66;
    }
    button.game-btn span.subtext {
      font-size: 9px;
      color: #88c5ff;
      font-weight: normal;
    }
    .btn-action {
      background: #0f3d64;
    }
    .btn-burst {
      background: #6e1c28;
      border-color: #ff4d6d;
    }
    .btn-swap {
      background: #b85c00;
      border-color: #ff9d00;
    }
    .btn-heal {
      background: #124e3f;
      border-color: #00ffaa;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">RENCEN ROOFTOP CLASH</div>
  </div>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-name" id="player-label" style="color: #00f0ff;">XOCHITL</div>
      <div class="bar-container">
        <div id="player-hp" class="hp-fill"></div>
      </div>
    </div>
    <div class="hud-mid" id="stage-banner">
      WAVE 1: DRONE INTRUSION<br><span style="font-size:9px; color:#aaa;">CLEAR DRONES TO SUMMON BOSS</span>
    </div>
    <div class="hud-box">
      <div class="hud-name" id="boss-label" style="color: #ff3366; text-align: right;">DRONE FLEET</div>
      <div class="bar-container">
        <div id="boss-hp" class="hp-fill"></div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="game-canvas" width="900" height="380"></canvas>
    <div id="victory-screen" class="victory-overlay">
      <h2>CHAPTER 1 CLEARED!</h2>
      <p style="color:#ddd; font-size:13px;">Chrono-Lock has been shattered on the Ren-Cen Rooftop.</p>
      <button onclick="proceedToChapter2()">PROCEED TO CHAPTER 2 ▶</button>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-col">
      <button class="game-btn" id="btn-jump">▲ JUMP / HOVER</button>
      <div class="d-pad">
        <button class="game-btn" style="flex:1;" id="btn-left">◀ LEFT</button>
        <button class="game-btn" style="flex:1;" id="btn-right">RIGHT ▶</button>
      </div>
    </div>

    <div class="ctrl-col">
      <div style="display:flex; gap:8px;">
        <button class="game-btn btn-action" style="flex:1;" id="btn-strike">
          STRIKE
          <span class="subtext" id="lbl-strike">MAGMA PUNCH</span>
        </button>
        <button class="game-btn btn-burst" style="flex:1;" id="btn-burst">
          BURST
          <span class="subtext" id="lbl-burst">LAVA / FEATHERS</span>
        </button>
      </div>
      <button class="game-btn btn-swap" id="btn-swap">
        TAG SWAP
        <span class="subtext" id="lbl-swap">MARCUS PRIME</span>
      </button>
    </div>

    <button class="game-btn btn-heal" id="btn-heal">
      ★ MOTHER LUETTA AID ★
      <span class="subtext">CELESTIAL DESCENSION & ANNIHILATION</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const FLOOR_Y = 320;

    // Load character images from repository
    const imgXochitl = new Image();
    imgXochitl.src = 'Screenshot_20260918_112806_Photos.jpg';

    const imgChronoLock = new Image();
    imgChronoLock.src = 'Screenshot_20260918_175152_Photos.jpg';

    let gameState = 'DRONES';
    let activeHero = 'XOCHITL';

    const player = {
      x: 100,
      y: FLOOR_Y - 90,
      w: 60,
      h: 90,
      vx: 0,
      vy: 0,
      isGrounded: true,
      hovering: false,
      maxHp: 100,
      hp: 100,
      hitFlash: 0
    };

    let drones = [
      { x: 550, y: 130, w: 42, h: 26, hp: 30, maxHp: 30, timer: 0 },
      { x: 680, y: 90,  w: 42, h: 26, hp: 30, maxHp: 30, timer: 20 },
      { x: 790, y: 150, w: 42, h: 26, hp: 30, maxHp: 30, timer: 45 }
    ];

    const boss = {
      active: false,
      x: 680,
      y: FLOOR_Y - 120,
      w: 90,
      h: 120,
      maxHp: 200,
      hp: 200,
      hitFlash: 0,
      shootTimer: 0,
      gearAngle: 0,
      warpTimer: 0,
      isWarping: false,
      warpAlpha: 1.0
    };

    const luetta = {
      active: false,
      y: -120,
      targetY: 85,
      alpha: 0,
      timer: 0
    };

    let projectiles = [];
    let electricBeams = [];
    let particles = [];

    const keys = { left: false, right: false };

    // Background Scene
    function drawCityBackground() {
      let sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
      sky.addColorStop(0, '#060a17');
      sky.addColorStop(0.6, '#18122b');
      sky.addColorStop(1, '#3b1828');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(80, 100, 60, 220);
      ctx.fillRect(180, 60, 90, 260);
      ctx.fillRect(380, 40, 130, 280);
      ctx.fillRect(560, 80, 80, 240);
      ctx.fillRect(720, 110, 70, 210);

      ctx.fillStyle = '#00f0ff';
      for (let y = 60; y < FLOOR_Y; y += 22) {
        ctx.fillRect(430, y, 6, 10);
        ctx.fillRect(455, y, 6, 10);
      }
      ctx.fillStyle = '#ffaa33';
      for (let y = 120; y < FLOOR_Y; y += 28) {
        ctx.fillRect(205, y, 5, 8);
        ctx.fillRect(590, y, 5, 8);
      }

      ctx.fillStyle = '#1c2738';
      ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, FLOOR_Y);
      ctx.lineTo(canvas.width, FLOOR_Y);
      ctx.stroke();

      ctx.fillStyle = '#223048';
      ctx.fillRect(320, FLOOR_Y - 30, 30, 30);
      ctx.fillRect(510, FLOOR_Y - 35, 35, 35);
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(328, FLOOR_Y - 20, 14, 4);
      ctx.fillRect(518, FLOOR_Y - 24, 18, 4);
    }

    // Characters
    function drawXochitl(p) {
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      if (p.hitFlash > 0) ctx.filter = 'brightness(2.5)';

      // Radiant Solar Wings (Visible when airborne or hovering)
      if (!p.isGrounded || p.hovering) {
        for (let side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.quadraticCurveTo(side * 55, -65, side * 85, -20);
          ctx.quadraticCurveTo(side * 45, -5, 0, 10);
          let wingGrad = ctx.createLinearGradient(0, -50, side * 85, 0);
          wingGrad.addColorStop(0, '#ffe600');
          wingGrad.addColorStop(0.5, '#ff5500');
          wingGrad.addColorStop(1, '#aa0022');
          ctx.fillStyle = wingGrad;
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 15;
          ctx.fill();
        }
      }

      // Check if uploaded artwork is loaded
      if (imgXochitl.complete && imgXochitl.naturalWidth > 0) {
        ctx.drawImage(imgXochitl, -55, -60, 110, 120);
      } else {
        // High-fidelity contoured vector fallback
        const colors = ['#00d4ff', '#ffcc00', '#ff2a00', '#00ff88', '#ff7700'];
        for (let i = -2; i <= 2; i++) {
          ctx.save();
          ctx.rotate((i * 15 * Math.PI) / 180);
          ctx.fillStyle = colors[i + 2];
          ctx.beginPath();
          ctx.moveTo(-5, -35);
          ctx.lineTo(0, -64);
          ctx.lineTo(5, -35);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = '#8b5a2b';
        ctx.beginPath();
        ctx.ellipse(0, -28, 12, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-12, -34, 24, 5);

        ctx.fillStyle = '#a04218';
        ctx.beginPath();
        ctx.moveTo(-14, -14);
        ctx.lineTo(14, -14);
        ctx.lineTo(9, 16);
        ctx.lineTo(-9, 16);
        ctx.closePath();
        ctx.fill();

        for (let side of [-1, 1]) {
          let gx = side * 22;
          let gy = 8;
          ctx.fillStyle = '#ff4d00';
          ctx.shadowColor = '#ff7700';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(gx, gy, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffee44';
          ctx.beginPath();
          ctx.arc(gx, gy, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-10, 16, 7, 26);
        ctx.fillRect(3, 16, 7, 26);
      }
      ctx.restore();
    }

    function drawMarcusPrime(p) {
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      if (p.hitFlash > 0) ctx.filter = 'brightness(2.5)';

      // Electric Aura Jitter
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 48 + Math.random() * 6, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#54331a';
      ctx.beginPath();
      ctx.ellipse(0, -28, 12, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e2430';
      ctx.beginPath();
      ctx.roundRect(-15, -15, 30, 32, 6);
      ctx.fill();

      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(-5, -6);
      ctx.lineTo(0, -14);
      ctx.lineTo(5, -6);
      ctx.lineTo(0, -9);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      for (let side of [-1, 1]) {
        let armX = side * 20;
        ctx.fillStyle = '#232f42';
        ctx.beginPath();
        ctx.roundRect(armX - 6, -4, 12, 24, 4);
        ctx.fill();

        ctx.fillStyle = '#00e5ff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(armX - 3, 6, 6, 12);
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = '#151b24';
      ctx.fillRect(-11, 17, 9, 28);
      ctx.fillRect(2, 17, 9, 28);

      ctx.restore();
    }

    function drawDrone(d) {
      ctx.save();
      ctx.translate(d.x + d.w / 2, d.y + d.h / 2);

      ctx.fillStyle = '#445566';
      ctx.fillRect(-22, -12, 12, 3);
      ctx.fillRect(10, -12, 12, 3);

      ctx.fillStyle = '#223145';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff2255';
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#111';
      ctx.fillRect(-16, -18, 32, 4);
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(-16, -18, (d.hp / d.maxHp) * 32, 4);

      ctx.restore();
    }

    function drawChronoLock(b) {
      if (!b.active) return;

      ctx.save();
      ctx.globalAlpha = b.warpAlpha;
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      if (b.hitFlash > 0) ctx.filter = 'brightness(2.5)';

      if (b.isWarping) {
        ctx.strokeStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 25;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 70, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Check if uploaded artwork is loaded
      if (imgChronoLock.complete && imgChronoLock.naturalWidth > 0) {
        ctx.drawImage(imgChronoLock, -65, -70, 130, 140);
      } else {
        // Detailed contoured steampunk automaton
        b.gearAngle += 0.03;

        for (let side of [-1, 1]) {
          ctx.save();
          ctx.translate(side * 44, -20);
          ctx.rotate(side * b.gearAngle);
          ctx.fillStyle = '#b3773b';
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#8b5a2b';
          for (let i = 0; i < 8; i++) {
            ctx.rotate(Math.PI / 4);
            ctx.fillRect(-3, -22, 6, 6);
          }
          ctx.restore();
        }

        for (let side of [-1, 1]) {
          let ax = side * 44;
          ctx.fillStyle = '#5c4028';
          ctx.beginPath();
          ctx.roundRect(ax - 6, -10, 12, 28, 4);
          ctx.fill();

          ctx.fillStyle = '#caa35e';
          ctx.beginPath();
          ctx.arc(ax, 20, 8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#4a3320';
          ctx.beginPath();
          ctx.roundRect(ax - 8, 24, 16, 32, 4);
          ctx.fill();

          ctx.fillStyle = '#caa35e';
          ctx.beginPath();
          ctx.roundRect(ax - 10, 54, 20, 14, 4);
          ctx.fill();
        }

        ctx.fillStyle = '#694a28';
        ctx.beginPath();
        ctx.roundRect(-34, -25, 68, 65, 8);
        ctx.fill();
        ctx.strokeStyle = '#caa35e';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#1c2214';
        ctx.beginPath();
        ctx.arc(0, 8, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Urn Head
        ctx.fillStyle = '#8b6133';
        ctx.beginPath();
        ctx.moveTo(-18, -25);
        ctx.lineTo(18, -25);
        ctx.lineTo(24, -58);
        ctx.lineTo(-24, -58);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#caa35e';
        ctx.beginPath();
        ctx.roundRect(-28, -62, 56, 8, 3);
        ctx.fill();

        // 3 Green Eyes
        ctx.fillStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(0, -48, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-8, -38, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -38, 5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#3a2717';
        ctx.beginPath();
        ctx.roundRect(-24, 40, 16, 34, 4);
        ctx.roundRect(8, 40, 16, 34, 4);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawMotherLuetta() {
      if (!luetta.active) return;

      ctx.save();
      ctx.globalAlpha = luetta.alpha;
      ctx.translate(canvas.width / 2, luetta.y);

      let haloGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 90);
      haloGrad.addColorStop(0, 'rgba(255, 235, 120, 0.95)');
      haloGrad.addColorStop(0.5, 'rgba(255, 180, 40, 0.5)');
      haloGrad.addColorStop(1, 'rgba(255, 180, 40, 0)');
      ctx.fillStyle = haloGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 90, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#fff5a8';
      ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        let ang = (i * Math.PI) / 7 + Date.now() * 0.002;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * 45, Math.sin(ang) * 45);
        ctx.lineTo(Math.cos(ang) * 85, Math.sin(ang) * 85);
        ctx.stroke();
      }

      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath();
      ctx.arc(0, -22, 14, 0, Math.PI * 2);
      ctx.fill();

      let robeGrad = ctx.createLinearGradient(0, -10, 0, 70);
      robeGrad.addColorStop(0, '#ffd147');
      robeGrad.addColorStop(1, '#ff8f00');
      ctx.fillStyle = robeGrad;
      ctx.beginPath();
      ctx.moveTo(-14, -8);
      ctx.lineTo(14, -8);
      ctx.lineTo(30, 70);
      ctx.lineTo(-30, 70);
      ctx.closePath();
      ctx.fill();

      for (let side of [-1, 1]) {
        ctx.strokeStyle = '#ffd147';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(side * 10, 0);
        ctx.lineTo(side * 38, 18);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(side * 38, 18, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // Gameplay Mechanics
    function jumpOrHover() {
      if (player.isGrounded) {
        player.vy = -13;
        player.isGrounded = false;
      } else {
        player.vy = -3;
        player.hovering = true;
        if (activeHero === 'XOCHITL') {
          fireXochitlWingDarts();
        }
      }
    }

    function fireXochitlWingDarts() {
      const originY = player.y + 15;
      const originX = player.x + player.w;

      [-0.25, 0, 0.25].forEach((angle) => {
        projectiles.push({
          type: 'FEATHER_DAGGER',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * 11,
          vy: Math.sin(angle) * 11 + 2,
          w: 22,
          h: 8,
          damage: 15,
          isPlayer: true
        });
      });
    }

    function performStrike() {
      const spawnY = player.y + player.h * 0.45;
      const spawnX = player.x + player.w;

      if (activeHero === 'XOCHITL') {
        if (!player.isGrounded) {
          fireXochitlWingDarts();
        } else {
          projectiles.push({
            type: 'MAGMA_BALL',
            x: spawnX,
            y: spawnY,
            vx: 9,
            vy: 0,
            w: 24,
            h: 14,
            damage: 16,
            isPlayer: true
          });
        }
      } else {
        let targetX = canvas.width;
        let targetY = spawnY;

        if (boss.active) {
          targetX = boss.x + boss.w * 0.3;
          targetY = boss.y + boss.h * 0.5;
          boss.hp = Math.max(0, boss.hp - 20);
          boss.hitFlash = 6;
          spawnSparks(boss.x + 20, boss.y + 40, '#00f0ff');
          checkBossDefeat();
        } else if (drones.length > 0) {
          let d = drones[0];
          targetX = d.x + d.w / 2;
          targetY = d.y + d.h / 2;
          d.hp -= 20;
          spawnSparks(targetX, targetY, '#00f0ff');
        }

        electricBeams.push({
          x1: spawnX,
          y1: spawnY,
          x2: targetX,
          y2: targetY,
          life: 12
        });

        updateUI();
      }
    }

    function performBurst() {
      const spawnY = player.y + player.h * 0.4;
      const spawnX = player.x + player.w;

      if (activeHero === 'XOCHITL') {
        for (let i = -1; i <= 1; i++) {
          projectiles.push({
            type: 'MAGMA_BALL',
            x: spawnX,
            y: spawnY + i * 14,
            vx: 11,
            vy: i * 2,
            w: 28,
            h: 18,
            damage: 22,
            isPlayer: true
          });
        }
      } else {
        let tx = boss.active ? boss.x + 30 : 650;
        electricBeams.push({ x1: spawnX, y1: spawnY - 20, x2: tx, y2: 120, life: 18 });
        electricBeams.push({ x1: spawnX, y1: spawnY + 20, x2: tx, y2: 240, life: 18 });

        if (boss.active) {
          boss.hp = Math.max(0, boss.hp - 32);
          boss.hitFlash = 8;
          spawnSparks(boss.x + 30, boss.y + 50, '#00f0ff');
          checkBossDefeat();
        } else {
          drones.forEach(d => d.hp -= 25);
        }
        updateUI();
      }
    }

    function tagSwap() {
      if (activeHero === 'XOCHITL') {
        activeHero = 'MARCUS';
        document.getElementById('player-label').innerText = 'MARCUS PRIME';
        document.getElementById('lbl-strike').innerText = 'ELECTRIC BEAM';
        document.getElementById('lbl-burst').innerText = 'VOLT OVERLOAD';
        document.getElementById('lbl-swap').innerText = 'XOCHITL';
      } else {
        activeHero = 'XOCHITL';
        document.getElementById('player-label').innerText = 'XOCHITL';
        document.getElementById('lbl-strike').innerText = 'MAGMA PUNCH';
        document.getElementById('lbl-burst').innerText = 'LAVA / FEATHERS';
        document.getElementById('lbl-swap').innerText = 'MARCUS PRIME';
      }
    }

    function motherLuettaAid() {
      if (luetta.active) return;
      luetta.active = true;
      luetta.y = -100;
      luetta.alpha = 0;
      luetta.timer = 0;

      player.hp = player.maxHp;
      projectiles = projectiles.filter(p => p.isPlayer);

      drones.forEach(d => spawnSparks(d.x, d.y, '#ffd700'));
      drones = [];

      if (boss.active) {
        boss.hp = Math.max(0, boss.hp - 60);
        boss.hitFlash = 12;
        spawnSparks(boss.x + 40, boss.y + 60, '#ffd700');
        checkBossDefeat();
      }

      checkDronesCleared();
      updateUI();
    }

    function checkDronesCleared() {
      if (gameState === 'DRONES' && drones.length === 0) {
        gameState = 'BOSS';
        boss.active = true;
        document.getElementById('stage-banner').innerHTML = 'BOSS: CHRONO-LOCK<br><span style="font-size:9px; color:#ff4466;">TIME-WARP ENGINE ENGAGED</span>';
        document.getElementById('boss-label').innerText = 'CHRONO-LOCK';
        updateUI();
      }
    }

    function checkBossDefeat() {
      if (boss.active && boss.hp <= 0) {
        boss.active = false;
        gameState = 'CLEARED';

        for (let i = 0; i < 40; i++) {
          spawnSparks(boss.x + 40, boss.y + 60, '#00ff88');
          spawnSparks(boss.x + 40, boss.y + 60, '#caa35e');
        }

        document.getElementById('victory-screen').style.display = 'flex';
      }
    }

    function proceedToChapter2() {
      alert("Advancing to Chapter 2: The Chrono-Core Depths!");
      location.reload();
    }

    function bossAttack() {
      if (!boss.active || boss.isWarping) return;
      const spawnY = boss.y + boss.h * 0.45;
      projectiles.push({
        type: 'CHRONO_GEAR',
        x: boss.x - 20,
        y: spawnY,
        vx: -6.5,
        vy: 0,
        w: 22,
        h: 22,
        damage: 15,
        isPlayer: false
      });
    }

    function spawnSparks(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 18,
          color: color
        });
      }
    }

    function updateUI() {
      document.getElementById('player-hp').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
      if (gameState === 'DRONES') {
        let cur = drones.reduce((sum, d) => sum + d.hp, 0);
        document.getElementById('boss-hp').style.width = Math.max(0, (cur / 90) * 100) + '%';
      } else {
        document.getElementById('boss-hp').style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
      }
    }

    // Loop
    function update() {
      if (keys.left) player.vx = -4.5;
      else if (keys.right) player.vx = 4.5;
      else player.vx = 0;

      player.x += player.vx;
      player.x = Math.max(20, Math.min(canvas.width - 200, player.x));

      player.vy += 0.6;
      player.y += player.vy;

      if (player.y >= FLOOR_Y - player.h) {
        player.y = FLOOR_Y - player.h;
        player.vy = 0;
        player.isGrounded = true;
        player.hovering = false;
      }

      if (player.hitFlash > 0) player.hitFlash--;
      if (boss.hitFlash > 0) boss.hitFlash--;

      if (gameState === 'DRONES') {
        drones.forEach((d) => {
          d.y += Math.sin(Date.now() * 0.003 + d.x) * 0.7;
          d.timer++;
          if (d.timer > 90) {
            d.timer = 0;
            projectiles.push({
              type: 'DRONE_LASER',
              x: d.x,
              y: d.y + d.h / 2,
              vx: -5,
              vy: 0,
              w: 16,
              h: 5,
              damage: 8,
              isPlayer: false
            });
          }
        });
      }

      if (boss.active) {
        boss.shootTimer++;
        if (boss.shootTimer > 80) {
          bossAttack();
          boss.shootTimer = 0;
        }

        boss.warpTimer++;
        if (boss.warpTimer > 170) {
          boss.isWarping = true;
          boss.warpAlpha -= 0.06;

          if (boss.warpAlpha <= 0) {
            boss.x = 420 + Math.random() * 320;
            boss.isWarping = false;
            boss.warpAlpha = 1.0;
            boss.warpTimer = 0;
            spawnSparks(boss.x + 40, boss.y + 60, '#00ff88');
          }
        }
      }

      if (luetta.active) {
        luetta.timer++;
        if (luetta.timer < 50) {
          luetta.y += (luetta.targetY - luetta.y) * 0.08;
          luetta.alpha = Math.min(1, luetta.alpha + 0.05);
        } else if (luetta.timer > 110) {
          luetta.alpha -= 0.04;
          luetta.y -= 2;
          if (luetta.alpha <= 0) luetta.active = false;
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.isPlayer) {
          if (gameState === 'DRONES') {
            for (let j = drones.length - 1; j >= 0; j--) {
              let d = drones[j];
              if (p.x < d.x + d.w && p.x + p.w > d.x && p.y < d.y + d.h && p.y + p.h > d.y) {
                d.hp -= p.damage;
                spawnSparks(p.x, p.y, '#ff7700');
                projectiles.splice(i, 1);
                if (d.hp <= 0) drones.splice(j, 1);
                checkDronesCleared();
                updateUI();
                break;
              }
            }
          } else if (boss.active && !boss.isWarping) {
            if (p.x < boss.x + boss.w && p.x + p.w > boss.x && p.y < boss.y + boss.h && p.y + p.h > boss.y) {
              boss.hp = Math.max(0, boss.hp - p.damage);
              boss.hitFlash = 5;
              spawnSparks(p.x, p.y, '#ff7700');
              projectiles.splice(i, 1);
              checkBossDefeat();
              updateUI();
              continue;
            }
          }
        } else {
          if (p.x < player.x + player.w && p.x + p.w > player.x && p.y < player.y + player.h && p.y + p.h > player.y) {
            player.hp = Math.max(0, player.hp - p.damage);
            player.hitFlash = 5;
            spawnSparks(p.x, p.y, '#ff3366');
            projectiles.splice(i, 1);
            updateUI();
            continue;
          }
        }

        if (p.x < -40 || p.x > canvas.width + 40 || p.y < 0 || p.y > FLOOR_Y + 20) {
          projectiles.splice(i, 1);
        }
      }

      for (let i = electricBeams.length - 1; i >= 0; i--) {
        electricBeams[i].life--;
        if (electricBeams[i].life <= 0) electricBeams.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCityBackground();

      if (activeHero === 'XOCHITL') drawXochitl(player);
      else drawMarcusPrime(player);

      drones.forEach(drawDrone);
      drawChronoLock(boss);
      drawMotherLuetta();

      electricBeams.forEach(b => {
        ctx.save();
        ctx.strokeStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);

        let segments = 8;
        let dx = (b.x2 - b.x1) / segments;
        for (let s = 1; s < segments; s++) {
          let rx = b.x1 + dx * s;
          let ry = b.y1 + ((b.y2 - b.y1) / segments) * s + (Math.random() * 20 - 10);
          ctx.lineTo(rx, ry);
        }
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      });

      projectiles.forEach(p => {
        ctx.save();
        if (p.type === 'FEATHER_DAGGER') {
          ctx.fillStyle = '#ffe600';
          ctx.shadowColor = '#ff5500';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(p.x + p.w, p.y + p.h / 2);
          ctx.lineTo(p.x, p.y);
          ctx.lineTo(p.x + 4, p.y + p.h / 2);
          ctx.lineTo(p.x, p.y + p.h);
          ctx.closePath();
          ctx.fill();
        } else if (p.type === 'MAGMA_BALL') {
          ctx.fillStyle = '#ff4400';
          ctx.shadowColor = '#ffbb00';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.ellipse(p.x + p.w/2, p.y + p.h/2, p.w/2, p.h/2, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'CHRONO_GEAR') {
          ctx.translate(p.x + p.w/2, p.y + p.h/2);
          ctx.rotate(Date.now() * 0.01);
          ctx.fillStyle = '#b3773b';
          ctx.beginPath();
          ctx.arc(0, 0, p.w/2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#00ff88';
          ctx.fillRect(-3, -3, 6, 6);
        } else if (p.type === 'DRONE_LASER') {
          ctx.fillStyle = '#ff0055';
          ctx.shadowColor = '#ff0033';
          ctx.shadowBlur = 8;
          ctx.fillRect(p.x, p.y, p.w, p.h);
        }
        ctx.restore();
      });

      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      });
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    // Touch & Mouse
    const attachTouch = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if (onUp) onUp(); });
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (onUp) onUp(); });
    };

    attachTouch('btn-left', () => keys.left = true, () => keys.left = false);
    attachTouch('btn-right', () => keys.right = true, () => keys.right = false);
    attachTouch('btn-jump', jumpOrHover);
    attachTouch('btn-strike', performStrike);
    attachTouch('btn-burst', performBurst);
    attachTouch('btn-swap', tagSwap);
    attachTouch('btn-heal', motherLuettaAid);

    // Keyboard (Chromebook)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jumpOrHover();
      if (e.key === 'j') performStrike();
      if (e.key === 'k') performBurst();
      if (e.key === 's') tagSwap();
      if (e.key === 'h') motherLuettaAid();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    loop();
  </script>
</body>
</html>
