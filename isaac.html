<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ancestral Vanguard - Rooftop Clash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: -apple-system, sans-serif; color: #fff; }

  #app-root {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    background: #000;
    position: relative;
  }

  /* TOP RETRO NAV */
  #arcade-nav {
    display: flex;
    height: 36px;
    background: #090d16;
    border-bottom: 2px solid #00f2fe;
    overflow-x: auto;
    white-space: nowrap;
    z-index: 100;
  }
  .nav-tab {
    padding: 0 16px;
    height: 100%;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #94a3b8;
    background: none;
    border: none;
    border-right: 1px solid #1e293b;
    cursor: pointer;
  }
  .nav-tab.active {
    color: #00f2fe;
    background: #111827;
    border-bottom: 3px solid #38bdf8;
    text-shadow: 0 0 8px rgba(0,242,254,0.6);
  }

  /* CANVAS VIEWPORT */
  #canvas-container {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #020617;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* HUD */
  #brawler-hud {
    position: absolute;
    top: 8px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-family: monospace;
    font-size: 11px;
    z-index: 50;
  }
  .hud-box { background: rgba(15, 23, 42, 0.8); padding: 5px 8px; border-radius: 6px; border: 1px solid #334155; }
  .bar-bg { width: 115px; height: 10px; background: #1e293b; border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4); transition: width 0.15s; }
  .bar-boss { width: 100%; height: 100%; background: linear-gradient(90deg, #f43f5e, #dc2626); transition: width 0.15s; }
  .bar-volts { width: 0%; height: 100%; background: #38bdf8; box-shadow: 0 0 6px #00f2fe; }

  /* CONTROLS (PORTRAIT) */
  #controller-dock {
    width: 100%;
    height: 180px;
    background: #090d16;
    border-top: 2px solid #1e293b;
    display: flex;
    padding: 8px 12px;
    gap: 10px;
    z-index: 100;
  }
  .ctrl-left { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .ctrl-right { flex: 1.2; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .move-row { display: flex; gap: 6px; flex: 1; }

  .game-btn {
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    color: #f1f5f9;
    background: #1e293b;
    box-shadow: 0 3px 0 #0f172a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
  }
  .game-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f172a; }
  .btn-jump { height: 48px; background: #0369a1; border: 1px solid #38bdf8; }
  .btn-strike { background: #0284c7; border: 1px solid #38bdf8; }
  .btn-burst { background: #b91c1c; border: 1px solid #f87171; }
  .btn-tag { background: #d97706; border: 1px solid #fbbf24; }
  .btn-aid { background: linear-gradient(135deg, #f59e0b, #e11d48); border: 1px solid #fde047; grid-column: span 2; }

  /* LANDSCAPE VIEWPORT - FIXES OVERLAP BUG */
  @media (orientation: landscape) {
    #arcade-nav { position: absolute; top: 0; left: 0; width: 100%; height: 28px; }
    #canvas-container { width: 100%; height: 100%; margin-top: 28px; }
    #controller-dock {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 110px;
      background: transparent;
      border-top: none;
      pointer-events: none;
      padding: 0 24px 8px 24px;
      justify-content: space-between;
    }
    .ctrl-left, .ctrl-right { pointer-events: auto; }
    .ctrl-left { width: 180px; flex: none; }
    .ctrl-right { width: 210px; flex: none; }
    .game-btn { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(4px); }
  }
</style>
</head>
<body>

<div id="app-root">
  <div id="arcade-nav">
    <button class="nav-tab active">RenCen Rooftop Clash</button>
  </div>

  <div id="canvas-container">
    <canvas id="mainCanvas" width="800" height="450"></canvas>
    
    <div id="brawler-hud">
      <div class="hud-box">
        <div id="hero-title" style="color: #38bdf8; font-weight: bold;">MARCUS PRIME</div>
        <div class="bar-bg"><div id="hero-hp" class="bar-hp"></div></div>
        <div class="bar-bg" style="height: 5px; margin-top: 3px;"><div id="hero-volts" class="bar-volts"></div></div>
      </div>
      <div class="hud-box" style="text-align: center;">
        <div id="wave-title" style="color: #fbbf24; font-weight: bold;">CH. 1: DETROIT REN-CEN</div>
        <div style="color: #94a3b8;">ROOFTOP SHOWDOWN</div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div id="boss-title" style="color: #f87171; font-weight: bold;">CHRONO-LOCK</div>
        <div class="bar-bg"><div id="boss-hp" class="bar-boss"></div></div>
      </div>
    </div>
  </div>

  <div id="controller-dock">
    <div class="ctrl-left">
      <button class="game-btn btn-jump" id="btn-jump">▲ JUMP / HOVER</button>
      <div class="move-row">
        <button class="game-btn" style="flex: 1;" id="btn-left">◄ LEFT</button>
        <button class="game-btn" style="flex: 1;" id="btn-right">RIGHT ►</button>
      </div>
    </div>

    <div class="ctrl-right">
      <button class="game-btn btn-strike" id="btn-strike">STRIKE<span style="font-size: 8px;">PUNCH / SHOCK</span></button>
      <button class="game-btn btn-burst" id="btn-burst">BURST<span id="burst-txt" style="font-size: 8px;">VOLT BEAM</span></button>
      <button class="game-btn btn-tag" id="btn-tag">TAG SWAP<span id="tag-txt" style="font-size: 8px;">XOCHITL</span></button>
      <button class="game-btn btn-aid" id="btn-aid">★ MOTHER LUETTA AID ★<span style="font-size: 8px;">ORBITAL HEAL</span></button>
    </div>
  </div>
</div>

<script>
/* ---------------- AUDIO SYNTHESIS ---------------- */
const actx = new (window.AudioContext || window.webkitAudioContext)();
function sfx(f, type='square', len=0.1, vol=0.12) {
  try {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + len);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + len);
  } catch(e){}
}

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

/* ---------------- GAME STATE ---------------- */
const G = {
  hero: 'MARCUS', // 'MARCUS' or 'XOCHITL'
  x: 140, y: 280, vx: 0, vy: 0, facing: 1, hp: 120, volts: 0,
  isGrounded: true, jumps: 2, isHovering: false, hoverTimer: 0,
  cooldown: 0,
  boss: { name: 'CHRONO-LOCK', x: 620, y: 240, hp: 200, maxHp: 200, timer: 0, gearAngle: 0, teleported: false },
  droids: [
    { x: 440, y: 295, hp: 35, timer: 20 },
    { x: 530, y: 295, hp: 35, timer: 60 }
  ],
  projectiles: [],
  fx: [],
  celestial: null,
  stars: Array.from({length: 35}, () => ({x: Math.random()*800, y: Math.random()*300, s: Math.random()*2}))
};

/* ---------------- INPUTS ---------------- */
const input = {};
function attach(id, k) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (actx.state === 'suspended') actx.resume();
    input[k] = true;
    if (k === 'jump') doJump();
    if (k === 'strike') doStrike();
    if (k === 'burst') doBurst();
    if (k === 'tag') doTag();
    if (k === 'aid') doAid();
  });
  el.addEventListener('pointerup', (e) => { e.preventDefault(); input[k] = false; });
  el.addEventListener('pointerleave', (e) => { e.preventDefault(); input[k] = false; });
}

attach('btn-left', 'left'); attach('btn-right', 'right');
attach('btn-jump', 'jump'); attach('btn-strike', 'strike');
attach('btn-burst', 'burst'); attach('btn-tag', 'tag'); attach('btn-aid', 'aid');

function doJump() {
  if (G.jumps > 0) {
    G.vy = -12;
    G.jumps--;
    G.isGrounded = false;
    sfx(320, 'square', 0.1);
    if (G.hero === 'XOCHITL' && G.jumps === 0) {
      G.isHovering = true;
      G.hoverTimer = 45;
      sfx(520, 'triangle', 0.3);
    }
  }
}

function doStrike() {
  if (G.cooldown > 0) return;
  G.cooldown = 14;
  sfx(G.hero === 'MARCUS' ? 440 : 220, 'sawtooth', 0.12);
  const hx = G.facing === 1 ? G.x + 40 : G.x - 35;
  applyHit(hx, G.y, 45, 60, G.hero === 'MARCUS' ? 18 + Math.floor(G.volts/10) : 26);
  addFx(hx + 20, G.y + 25, G.hero === 'MARCUS' ? '#38bdf8' : '#f97316');
}

function doBurst() {
  if (G.cooldown > 0) return;
  G.cooldown = 26;
  if (G.hero === 'MARCUS') {
    sfx(650, 'square', 0.3);
    G.projectiles.push({ x: G.x + (G.facing*30), y: G.y + 20, vx: G.facing * 11, vy: 0, w: 32, h: 8, col: '#38bdf8', dmg: 32, type: 'volt' });
    if (G.volts >= 40) { G.volts = 0; sfx(180, 'sawtooth', 0.4); }
  } else {
    if (!G.isGrounded) {
      // Aerial Solar Feather Daggers
      sfx(720, 'sawtooth', 0.2);
      [-0.2, 0, 0.2].forEach(a => {
        G.projectiles.push({ x: G.x + 20, y: G.y + 35, vx: (G.facing * 8) + a*5, vy: 7, w: 10, h: 10, col: '#fbbf24', dmg: 22, type: 'feather' });
      });
    } else {
      // Magma Lava Wave on Ground
      sfx(140, 'triangle', 0.45);
      G.projectiles.push({ x: G.x + (G.facing*35), y: 350, vx: G.facing * 6, vy: 0, w: 60, h: 32, col: '#ea580c', dmg: 40, type: 'lava' });
    }
  }
}

function doTag() {
  G.hero = G.hero === 'MARCUS' ? 'XOCHITL' : 'MARCUS';
  sfx(540, 'sine', 0.2);
  addFx(G.x + 20, G.y + 30, '#fbbf24', 16);
  document.getElementById('hero-title').innerText = G.hero === 'MARCUS' ? 'MARCUS PRIME' : 'XOCHITL';
  document.getElementById('hero-title').style.color = G.hero === 'MARCUS' ? '#38bdf8' : '#f97316';
  document.getElementById('burst-txt').innerText = G.hero === 'MARCUS' ? 'VOLT BEAM' : 'LAVA / FEATHERS';
  document.getElementById('tag-txt').innerText = G.hero === 'MARCUS' ? 'XOCHITL' : 'MARCUS';
}

function doAid() {
  if (G.celestial) return;
  sfx(880, 'triangle', 0.8);
  G.celestial = { x: G.boss.x - 20, alpha: 1.0 };
  G.hero.hp = Math.min(120, G.hero.hp + 45);
  G.boss.hp = Math.max(0, G.boss.hp - 65);
}

function applyHit(x, y, w, h, dmg) {
  const b = G.boss;
  if (!(b.x > x+w || b.x+70 < x || b.y > y+h || b.y+110 < y)) {
    b.hp = Math.max(0, b.hp - dmg);
    addFx(b.x + 35, b.y + 40, '#f87171');
  }
  G.droids.forEach(d => {
    if (!(d.x > x+w || d.x+36 < x || d.y > y+h || d.y+60 < y)) {
      d.hp -= dmg;
      addFx(d.x + 18, d.y + 25, '#94a3b8');
    }
  });
}

function addFx(x, y, col, n=6) {
  for (let i = 0; i < n; i++) {
    G.fx.push({ x, y, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, col, life: 18 });
  }
}

/* ---------------- UPDATE ---------------- */
function update() {
  if (input['left']) { G.vx = -4.5; G.facing = -1; }
  else if (input['right']) { G.vx = 4.5; G.facing = 1; }
  else { G.vx *= 0.8; }

  if (G.isHovering) {
    G.vy = 0;
    G.hoverTimer--;
    if (G.hoverTimer <= 0) G.isHovering = false;
  } else {
    G.vy += 0.6;
  }

  G.x += G.vx;
  G.y += G.vy;

  if (G.y >= 280) {
    G.y = 280;
    G.vy = 0;
    G.isGrounded = true;
    G.jumps = 2;
    G.isHovering = false;
  }
  G.x = Math.max(20, Math.min(740, G.x));
  if (G.cooldown > 0) G.cooldown--;

  // Boss Chrono-Lock Teleport & Gear Spin
  const b = G.boss;
  b.gearAngle += 0.04;
  b.timer++;
  if (b.hp <= b.maxHp / 2 && !b.teleported) {
    b.teleported = true;
    b.x = G.x > 400 ? G.x - 130 : G.x + 120;
    addFx(b.x + 35, b.y + 45, '#10b981', 28);
    sfx(160, 'sawtooth', 0.5);
  } else if (b.timer > 90) {
    b.timer = 0;
    G.projectiles.push({ x: b.x, y: b.y + 40, vx: b.x > G.x ? -6 : 6, vy: 0, w: 16, h: 8, col: '#f43f5e', dmg: 14, enemy: true });
  }

  // Projectiles
  for (let i = G.projectiles.length - 1; i >= 0; i--) {
    const p = G.projectiles[i];
    p.x += p.vx; p.y += p.vy;

    if (p.enemy && Math.hypot(p.x - (G.x+20), p.y - (G.y+35)) < 28) {
      G.hero.hp = Math.max(0, G.hero.hp - p.dmg);
      G.volts = Math.min(100, G.volts + 25);
      addFx(G.x+20, G.y+35, '#ef4444');
      G.projectiles.splice(i, 1);
      continue;
    }

    if (!p.enemy && Math.hypot(p.x - (b.x+35), p.y - (b.y+50)) < 40) {
      b.hp = Math.max(0, b.hp - p.dmg);
      addFx(b.x+35, b.y+50, p.col);
      G.projectiles.splice(i, 1);
      continue;
    }

    if (p.x < 0 || p.x > 800 || p.y > 450) G.projectiles.splice(i, 1);
  }

  // Droids
  G.droids = G.droids.filter(d => d.hp > 0);
  G.droids.forEach(d => {
    d.timer++;
    if (d.timer > 100) {
      d.timer = 0;
      G.projectiles.push({ x: d.x, y: d.y + 20, vx: d.x > G.x ? -4 : 4, vy: 0, w: 10, h: 6, col: '#ef4444', dmg: 8, enemy: true });
    }
  });

  // FX
  G.fx.forEach(f => { f.x += f.vx; f.y += f.vy; f.life--; });
  G.fx = G.fx.filter(f => f.life > 0);

  if (G.celestial) {
    G.celestial.alpha -= 0.03;
    if (G.celestial.alpha <= 0) G.celestial = null;
  }

  // HUD
  document.getElementById('hero-hp').style.width = (G.hero.hp / 120 * 100) + '%';
  document.getElementById('boss-hp').style.width = (b.hp / b.maxHp * 100) + '%';
  document.getElementById('hero-volts').style.width = G.volts + '%';
}

/* ---------------- DETAILED CHARACTER RENDERING ---------------- */
function drawMarcus(x, y, facing) {
  ctx.save();
  ctx.translate(x + 20, y + 45);
  if (facing === -1) ctx.scale(-1, 1);

  // Black Tactical Hoodie & Body
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.roundRect(-16, -26, 32, 44, 6); ctx.fill();

  // Tactical Backpack Straps & Logo
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10, -26); ctx.lineTo(-10, 18);
  ctx.moveTo(10, -26); ctx.lineTo(10, 18);
  ctx.stroke();

  // Head, Skin Tone, & Tapered Curly Hair
  ctx.fillStyle = '#8d5b4c'; // Marcus Skin Tone
  ctx.beginPath(); ctx.arc(0, -38, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1e293b'; // Black Textured Hair
  ctx.beginPath(); ctx.arc(0, -43, 12, Math.PI, Math.PI*2); ctx.fill();

  // Dark Jeans & Boots
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-12, 18, 10, 24); ctx.fillRect(2, 18, 10, 24);

  // Forearm Fingerless Gloves & Bio-Electric Lightning Arcs
  ctx.fillStyle = '#090d16';
  ctx.fillRect(12, -4, 12, 10); ctx.fillRect(-22, -4, 10, 10);

  // Cyan Voltage Lightning Arcs
  ctx.strokeStyle = '#00f2fe';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  const t = Date.now() * 0.01;
  ctx.moveTo(14, -8); ctx.lineTo(24 + Math.sin(t)*4, 0); ctx.lineTo(18, 8);
  ctx.moveTo(-14, -8); ctx.lineTo(-24 + Math.cos(t)*4, 0); ctx.lineTo(-18, 8);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawXochitl(x, y, facing) {
  ctx.save();
  ctx.translate(x + 20, y + 45);
  if (facing === -1) ctx.scale(-1, 1);

  // Elaborate Feathered Solar Headdress (Plumes: Red, Orange, Gold, Teal)
  const feathers = ['#dc2626', '#ea580c', '#fbbf24', '#06b6d4', '#ea580c'];
  feathers.forEach((col, idx) => {
    ctx.fillStyle = col;
    const ang = -0.8 + (idx * 0.4);
    ctx.beginPath();
    ctx.ellipse(Math.sin(ang)*18, -48 - Math.cos(ang)*8, 5, 14, ang, 0, Math.PI*2);
    ctx.fill();
  });

  // Golden Headdress Crown & Earrings
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(-12, -42, 24, 6);
  ctx.beginPath(); ctx.arc(-13, -34, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -34, 4, 0, Math.PI*2); ctx.fill();

  // Face & Braided Hair
  ctx.fillStyle = '#a16207'; // Xochitl Skin Tone
  ctx.beginPath(); ctx.arc(0, -34, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1c1917'; // Braids
  ctx.fillRect(-14, -34, 4, 20); ctx.fillRect(10, -34, 4, 20);

  // Aztec Gold Breastplate & Belt
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(-10, -22, 20, 10);
  ctx.fillStyle = '#78350f'; // Armor Trim
  ctx.fillRect(-10, -10, 20, 18);

  // Fiery Hover Wings if in Air
  if (G.isHovering) {
    ctx.fillStyle = 'rgba(249, 115, 22, 0.85)';
    ctx.beginPath();
    ctx.moveTo(-8, -25); ctx.lineTo(-45, -55); ctx.lineTo(-24, -10);
    ctx.moveTo(8, -25); ctx.lineTo(45, -55); ctx.lineTo(24, -10);
    ctx.fill();
  }

  // MASSIVE OBSIDIAN & MAGMA GAUNTLETS
  [-1, 1].forEach(side => {
    const gx = side === 1 ? 16 : -28;
    // Obsidian Base
    ctx.fillStyle = '#1c1917';
    ctx.beginPath(); ctx.roundRect(gx, -12, 16, 22, 4); ctx.fill();
    // Glowing Magma Cracks
    ctx.strokeStyle = '#f97316';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ea580c';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(gx + 2, -6); ctx.lineTo(gx + 12, 0); ctx.lineTo(gx + 4, 6);
    ctx.stroke();
    ctx.shadowBlur = 0;
  });

  // Legs & Feathered Boots
  ctx.fillStyle = '#a16207';
  ctx.fillRect(-10, 12, 7, 22); ctx.fillRect(3, 12, 7, 22);
  ctx.fillStyle = '#ea580c'; // Feathered Greaves
  ctx.fillRect(-12, 26, 9, 8); ctx.fillRect(3, 26, 9, 8);

  ctx.restore();
}

function drawChronoLock(b) {
  ctx.save();
  ctx.translate(b.x + 35, b.y + 55);

  // Steampunk Urn / Hourglass Head Silhouette
  ctx.fillStyle = '#785938';
  ctx.beginPath();
  ctx.moveTo(-16, -55); ctx.lineTo(16, -55);
  ctx.lineTo(12, -45); ctx.lineTo(18, -30);
  ctx.lineTo(-18, -30); ctx.lineTo(-12, -45);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2; ctx.stroke();

  // Three Glowing Green Optic Lenses
  ctx.fillStyle = '#22c55e';
  ctx.shadowColor = '#10b981';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(0, -42, 4, 0, Math.PI*2); // Top lens
  ctx.arc(-7, -35, 4, 0, Math.PI*2); // Bottom left
  ctx.arc(7, -35, 4, 0, Math.PI*2);  // Bottom right
  ctx.fill();
  ctx.shadowBlur = 0;

  // Heavy Brass Armored Torso
  ctx.fillStyle = '#574129';
  ctx.beginPath(); ctx.roundRect(-24, -26, 48, 54, 8); ctx.fill();

  // Shoulder Interlocking Brass Cogs
  [-24, 24].forEach(cx => {
    ctx.fillStyle = '#b45309';
    ctx.beginPath(); ctx.arc(cx, -18, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#292524';
    ctx.beginPath(); ctx.arc(cx, -18, 4, 0, Math.PI*2); ctx.fill();
  });

  // Chest Rotating Clockwork Gear
  ctx.save();
  ctx.translate(0, 0);
  ctx.rotate(b.gearAngle);
  ctx.fillStyle = '#d97706';
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#292524'; ctx.lineWidth = 2;
  for(let i=0; i<4; i++) {
    ctx.rotate(Math.PI/2);
    ctx.strokeRect(-2, -14, 4, 28);
  }
  ctx.restore();

  // Brass Plated Legs
  ctx.fillStyle = '#3e2d1d';
  ctx.fillRect(-18, 28, 14, 30); ctx.fillRect(4, 28, 14, 30);

  ctx.restore();
}

/* ---------------- MAIN RENDER LOOP ---------------- */
function draw() {
  // Sunset Detroit RenCen Skyline Gradient
  const sky = ctx.createLinearGradient(0, 0, 0, 450);
  sky.addColorStop(0, '#1e1b4b');
  sky.addColorStop(0.5, '#431407');
  sky.addColorStop(1, '#0f172a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 800, 450);

  // Detroit RenCen Towers
  ctx.fillStyle = '#070b19';
  ctx.fillRect(80, 110, 80, 270);
  ctx.fillRect(200, 70, 100, 310);
  ctx.fillRect(360, 40, 140, 340); // RenCen Center
  ctx.fillRect(560, 90, 90, 290);

  // Neon Windows
  ctx.fillStyle = '#38bdf8';
  for (let wy = 80; wy < 340; wy += 32) {
    ctx.fillRect(405, wy, 14, 10);
    ctx.fillRect(445, wy, 14, 10);
  }

  // Rooftop Floor
  ctx.fillStyle = '#090d16';
  ctx.fillRect(0, 370, 800, 80);
  ctx.strokeStyle = '#00f2fe';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 370); ctx.lineTo(800, 370); ctx.stroke();

  // DRAW HERO & CHARACTERS
  if (G.hero === 'MARCUS') {
    drawMarcus(G.x, G.y, G.facing);
  } else {
    drawXochitl(G.x, G.y, G.facing);
  }

  // DRAW CHRONO-LOCK BOSS
  drawChronoLock(G.boss);

  // DRAW DROIDS
  G.droids.forEach(d => {
    ctx.fillStyle = '#334155';
    ctx.beginPath(); ctx.roundRect(d.x, d.y, 34, 50, 4); ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(d.x + 6, d.y + 10, 22, 4);
  });

  // PROJECTILES
  G.projectiles.forEach(p => {
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  });

  // PARTICLES
  G.fx.forEach(f => {
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI*2); ctx.fill();
  });

  // CELESTIAL BEAM
  if (G.celestial) {
    ctx.fillStyle = `rgba(253, 224, 71, ${G.celestial.alpha * 0.75})`;
    ctx.fillRect(G.celestial.x, 0, 100, 370);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
