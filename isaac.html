<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isaac's Detroit Street Racer - Rhodes Family Legacy</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 540px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      margin-bottom: 12px;
    }

    .portal-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #38bdf8;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .game-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 13px;
      font-weight: 800;
      color: #f59e0b;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .btn-turbo {
      background: linear-gradient(180deg, #f59e0b, #b45309);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .btn-action {
      background: linear-gradient(180deg, #0369a1, #0c4a6e);
      border-color: #38bdf8;
      color: #bae6fd;
    }

    .btn-back {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      text-transform: uppercase;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-back:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Isaac's Detroit Street Racer</div>
  </header>

  <div class="game-wrapper">
    <div class="hud-header">
      <span id="scoreText">Distance: 0m</span>
      <span id="speedText">Speed: 65 MPH</span>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="540" height="320"></canvas>
    </div>

    <div class="controls-grid">
      <button class="btn btn-action" ontouchstart="jumpCar()" onmousedown="jumpCar()">▲ JUMP TRAFFIC</button>
      <button class="btn btn-turbo" ontouchstart="activateTurbo()" onmousedown="activateTurbo()">TURBO BOOST 🔥</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let car = {
      x: 80,
      y: 230,
      vy: 0,
      width: 70,
      height: 36,
      isGrounded: true,
      turboTimer: 0,
      color: '#ea580c'
    };

    let traffic = [];
    let worldScroll = 0;
    let distance = 0;
    let speed = 6;
    let spawnTimer = 0;

    function jumpCar() {
      if (car.isGrounded) {
        car.vy = -12;
        car.isGrounded = false;
      }
    }

    function activateTurbo() {
      car.turboTimer = 120;
    }

    function spawnTrafficCar() {
      const colors = ['#38bdf8', '#10b981', '#a855f7', '#eab308'];
      traffic.push({
        x: canvas.width + 50,
        y: 232,
        width: 65,
        height: 34,
        speed: 3.5 + Math.random() * 2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function update() {
      car.y += car.vy;
      car.vy += 0.65;

      if (car.y > 230) {
        car.y = 230;
        car.vy = 0;
        car.isGrounded = true;
      }

      let currentSpeed = speed;
      if (car.turboTimer > 0) {
        currentSpeed = 14;
        car.turboTimer--;
      }

      worldScroll += currentSpeed;
      distance += Math.floor(currentSpeed);

      // Spawn traffic obstacles
      spawnTimer++;
      if (spawnTimer > 95) {
        spawnTimer = 0;
        spawnTrafficCar();
      }

      // Move traffic
      for (let i = traffic.length - 1; i >= 0; i--) {
        traffic[i].x -= (currentSpeed + traffic[i].speed);
        
        // Collision check
        if (
          car.x < traffic[i].x + traffic[i].width &&
          car.x + car.width > traffic[i].x &&
          car.y < traffic[i].y + traffic[i].height &&
          car.y + car.height > traffic[i].y
        ) {
          // Hit traffic car! Reset distance penalty or bounce
          distance = Math.max(0, distance - 50);
          traffic.splice(i, 1);
        } else if (traffic[i].x < -100) {
          traffic.splice(i, 1);
        }
      }

      document.getElementById('scoreText').textContent = `Distance: ${distance}m`;
      document.getElementById('speedText').textContent = `Speed: ${currentSpeed * 12} MPH`;
    }

    function draw() {
      // 1. Detroit Night Sky & Skyline Backdrop
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let skylineOffset = (worldScroll * 0.25) % canvas.width;
      ctx.fillStyle = '#111827';
      for (let i = -1; i < 3; i++) {
        let bx = i * 160 - skylineOffset;
        ctx.fillRect(bx, 80, 45, 170);
        ctx.fillRect(bx + 50, 40, 60, 210);
        ctx.fillRect(bx + 115, 100, 45, 150);

        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(bx + 10, 100, 5, 8);
        ctx.fillRect(bx + 65, 60, 6, 10);
        ctx.fillRect(bx + 95, 120, 6, 10);
        ctx.fillStyle = '#111827';
      }

      // 2. Roadway
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 260, canvas.width, 60);

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 260);
      ctx.lineTo(canvas.width, 260);
      ctx.stroke();

      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.setLineDash([30, 30]);
      ctx.lineDashOffset = -worldScroll;
      ctx.beginPath();
      ctx.moveTo(0, 290);
      ctx.lineTo(canvas.width, 290);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3. Draw Traffic Cars
      traffic.forEach(t => {
        ctx.save();
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.roundRect(t.x, t.y - t.height, t.width, t.height, [8, 12, 4, 4]);
        ctx.fill();

        ctx.fillStyle = '#020617';
        ctx.fillRect(t.x + 12, t.y - t.height + 4, 20, 12);

        // Traffic wheels
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(t.x + 14, t.y, 8, 0, Math.PI * 2);
        ctx.arc(t.x + t.width - 14, t.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 4. Draw Player Sports Car
      ctx.save();
      ctx.translate(car.x, car.y);

      if (car.turboTimer > 0) {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 20;
        ctx.fillRect(-22 + Math.random() * -10, 12, 22, 14);
      }

      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.fillStyle = car.color;
      ctx.beginPath();
      ctx.roundRect(0, 0, car.width, car.height, [12, 18, 6, 6]);
      ctx.fill();

      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.moveTo(14, 4);
      ctx.lineTo(26, 4);
      ctx.lineTo(44, 18);
      ctx.lineTo(14, 18);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#facc15';
      ctx.fillRect(car.width - 6, 14, 6, 8);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(2, 14, 4, 8);

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(16, car.height, 10, 0, Math.PI * 2);
      ctx.arc(car.width - 16, car.height, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = car.turboTimer > 0 ? '#ef4444' : '#38bdf8';
      ctx.beginPath();
      ctx.arc(16, car.height, 4, 0, Math.PI * 2);
      ctx.arc(car.width - 16, car.height, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
