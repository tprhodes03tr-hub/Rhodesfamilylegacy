<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard Sandbox Engine (Isaac Testing)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #07090e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .sandbox-header {
      width: 100%;
      max-width: 540px;
      text-align: center;
      margin-bottom: 8px;
    }

    .sandbox-title {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      color: #f59e0b;
      font-weight: 800;
      text-transform: uppercase;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 540px;
      margin-bottom: 8px;
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-title {
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
    }

    .wave-badge {
      font-size: 11px;
      color: #f59e0b;
      font-weight: 800;
      background: rgba(245, 158, 11, 0.15);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .bars-container {
      display: flex;
      gap: 10px;
    }

    .bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bar-label {
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }

    .bar-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hero {
      width: 100%;
      height: 100%;
      background: #10b981;
      transition: width 0.1s ease;
    }

    .bar-fill-enemy {
      width: 100%;
      height: 100%;
      background: #ef4444;
      transition: width 0.1s ease;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      height: 290px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .combat-log {
      font-family: monospace;
      font-size: 11px;
      background: #090e18;
      border: 1px solid #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      color: #38bdf8;
      min-height: 28px;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 540px;
      margin: 8px 0;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 6px;
      width: 100%;
      max-width: 540px;
    }

    .dpad-cluster, .action-cluster {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px 3px;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .btn-action {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .btn-orb {
      background: linear-gradient(180deg, #0369a1, #0c4a6e);
      border-color: #38bdf8;
      color: #bae6fd;
    }

    .btn-tag {
      grid-column: span 1;
      background: linear-gradient(180deg, #7c3aed, #5b21b6);
      border-color: #a78bfa;
      color: #fff;
    }

    .btn-ultimate {
      grid-column: span 3;
      background: linear-gradient(180deg, #f59e0b, #b45309);
      border-color: #fbbf24;
      color: #fff;
      font-size: 11px;
      min-height: 38px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
    }

    .chapter-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #d4af37;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.45);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      display: none;
      z-index: 50;
    }

    .chapter-banner h3 {
      color: #facc15;
      font-size: 1.1rem;
      margin-bottom: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .chapter-banner p {
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .chapter-banner button {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sandbox-header">
    <div class="sandbox-title">Isaac Sandbox • Combat Verification Suite</div>
  </div>

  <div class="hud-header">
    <div class="hud-top-row">
      <span id="heroNameLabel" class="hero-title">Marcus Prime (Lead) & Xochitl (AI)</span>
      <span id="waveDisplay" class="wave-badge">Wave 1: Scout Swarm</span>
    </div>
    <div class="bars-container">
      <div class="bar-group">
        <div class="bar-label">
          <span>Team Health</span>
          <span id="heroHpText">100/100</span>
        </div>
        <div class="bar-track">
          <div id="heroHpBar" class="bar-fill-hero"></div>
        </div>
      </div>
      <div class="bar-group">
        <div class="bar-label">
          <span id="enemyTypeLabel">Syndicate Swarm</span>
          <span id="enemyHpText">6 Units Remaining</span>
        </div>
        <div class="bar-track">
          <div id="enemyHpBar" class="bar-fill-enemy"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="gameCanvas" width="540" height="290"></canvas>
    <div class="chapter-banner" id="chapterBanner">
      <h3 id="bannerTitle">CHAPTER 1 COMPLETED</h3>
      <p id="bannerDesc">Sector secured! Preparing next stage...</p>
      <button id="bannerBtn" onclick="dismissChapterBanner()">ENTER NEXT STAGE</button>
    </div>
  </div>

  <div class="combat-log" id="combatLog">
    Sandbox Online: All 4 heroes unlocked for mechanics verification.
  </div>

  <div class="controls-grid">
    <div class="dpad-cluster">
      <button class="btn" onclick="playerMove(-25)">◄ LEFT</button>
      <button class="btn" onclick="playerJump()">▲ JUMP</button>
      <button class="btn" onclick="playerMove(25)">RIGHT ►</button>
    </div>

    <div class="action-cluster">
      <button id="btnStrike" class="btn btn-action" onclick="executeStrike()">⚡ Volt Beam</button>
      <button id="btnOrb" class="btn btn-orb" onclick="executePlasmaOrb()">🔵 Plasma Orb</button>
      <button id="btnBurst" class="btn btn-action" onclick="executeBurst()">🛡️ Deflect</button>
      <button id="btnTag" class="btn btn-tag" onclick="executeTagSwap()">TAG: XOCHITL</button>
      <button id="btnLuetta" class="btn btn-ultimate" onclick="executeLuettaAid()">★ SUMMON MOTHER LUETTA ★</button>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. RETRO SYNTH AUDIO ENGINE
       ========================================================================= */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'zap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.22);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'orb') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'celestial') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.7);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
        osc.start(now);
        osc.stop(now + 0.8);
      } else if (type === 'shield') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.setValueAtTime(640, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'warp') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.22);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'drum') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.45);
        gain.gain.setValueAtTime(0.75, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'anvil') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'roar') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.65);
        gain.gain.setValueAtTime(0.85, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.65);
        osc.start(now);
        osc.stop(now + 0.65);
      }
    }

    /* =========================================================================
       2. ASSET DECLARATIONS & GAME STATE
       ========================================================================= */
    let canvas, ctx;
    let animationFrameId = null;

    const ASSETS = {
      bg: new Image(),
      marcus: new Image(),
      xochitl: new Image(),
      sundiata: new Image(),
      kofi: new Image(),
      boss: new Image(),
      ironclad: new Image(),
      apex: new Image(),
      luetta: new Image(),
      solarLion: new Image()
    };

    let activeZone = "detroit"; 
    // Sandbox default: all 4 primary heroes unlocked for direct testing
    let unlockedRoster = ["marcus", "xochitl", "sundiata", "kofi"];
    let rosterIdx = 0;
    let activeLead = "marcus";

    let leadX = 90, leadY = 0, leadVy = 0, isGrounded = true;
    let leadLean = 0, leadLandSquash = 0, walkCadence = 0;

    let aiPartner = {
      x: 35,
      y: 0,
      vy: 0,
      isGrounded: true,
      attackCooldown: 0,
      desiredDistance: 65,
      wanderTimer: 0,
      lean: 0,
      landSquash: 0
    };

    let playerHp = 100, isShieldActive = false, absorbedCharge = 0;
    let bgScrollOffset = 0, groundScrollOffset = 0;

    // Kofi Osei Crucible Sledge Swing Tracker
    let kofiHammerSwing = {
      active: false,
      timer: 0,
      maxTimer: 14
    };

    // Xochitl Flight State
    let xochitlFlight = {
      active: false,
      state: 'INACTIVE',
      x: 0,
      y: 0,
      timer: 0,
      diveAngle: 0
    };

    let sundiataShockwave = { active: false, x: 0, radius: 0, maxRadius: 180 };
    let lionRoars = [];

    let currentWave = 1, mobsRemaining = 6, mobsTotal = 6;
    let enemies = [];
    let boss = {
      x: 380,
      y: 0,
      vy: 0,
      hp: 12,
      maxHp: 12,
      active: false,
      type: "chrono",
      hitFlash: 0,
      phase: 1
    };
    let screenShake = 0, gameActive = true;
    let bossActionTimer = null;

    let lightningBolts = [], daggers = [], particles = [], enemyBullets = [], plasmaOrbs = [];
    let groundShockwaves = [], celestialParticles = [];

    /* =========================================================================
       3. ENGINE INITIALIZATION & WAVE MANAGEMENT
       ========================================================================= */
    function initSandbox() {
      canvas = document.getElementById("gameCanvas");
      if (!canvas) return;
      ctx = canvas.getContext("2d");

      ASSETS.bg.src = "bg-detroit.jpg";
      ASSETS.marcus.src = "marcus.png";
      ASSETS.xochitl.src = "xochitl.png";
      ASSETS.sundiata.src = "sundiata-prime.png";
      ASSETS.kofi.src = "kofi.png";
      ASSETS.boss.src = "chrono-lock.png";
      ASSETS.solarLion.src = "solar-lion-roar.png";

      startWave(1);

      if (!animationFrameId) {
        animationFrameId = requestAnimationFrame(renderBrawler);
      }
    }

    function startWave(num) {
      currentWave = num;
      if (bossActionTimer) clearInterval(bossActionTimer);

      if (num === 1) {
        activeZone = "detroit";
        document.getElementById("waveDisplay").innerText = "Wave 1: Scout Swarm";
        mobsRemaining = 6; mobsTotal = 6;
        boss.active = false;
        spawnEnemyWave("swarm");
        logBrawler("Wave 1 Active: Vanguard street patrol engaged.");
      } else if (num === 2) {
        document.getElementById("waveDisplay").innerText = "Wave 2: Heavy Enforcers";
        mobsRemaining = 8; mobsTotal = 8;
        boss.active = false;
        spawnEnemyWave("heavy");
        logBrawler("Wave 2 Active: Syndicate Enforcers breaching.");
      } else if (num === 3) {
        document.getElementById("waveDisplay").innerText = "BOSS: Chrono-Lock";
        startBossFight("chrono");
      }
      updateHUD();
    }

    function spawnEnemyWave(profile) {
      enemies = [];
      for (let i = 0; i < mobsRemaining; i++) {
        let type = profile === "heavy" ? (i % 2 === 0 ? "enforcer" : "drone") : "drone";
        enemies.push({
          type: type,
          x: 440 + (i * 70),
          y: type === "drone" ? 135 : 205,
          hp: type === "enforcer" ? 4 : 2,
          speed: 1.1,
          active: true
        });
      }
    }

    function startBossFight(bossType) {
      boss.active = true;
      boss.type = bossType;
      boss.x = 380;
      boss.y = 0;
      boss.hp = 12;
      boss.maxHp = 12;
      boss.hitFlash = 0;
      enemies = [];
      mobsRemaining = 0;
      updateHUD();

      logBrawler("⚠️ BOSS ENGAGED: Chrono-Lock warped onto the line!");

      bossActionTimer = setInterval(() => {
        if (!boss.active || !gameActive) return;
        playSound('warp');
        screenShake = 10;
        boss.x = Math.random() > 0.5 ? Math.max(30, leadX - 70) : leadX + 85;
        enemyBullets.push({ x: boss.x + 20, y: 195, vx: -5.2, isTemporalClock: true });
        logBrawler("Chrono-Lock time-warps and launches a Temporal Dial!");
      }, 3000);
    }

    function onBossDefeated() {
      boss.active = false;
      if (bossActionTimer) clearInterval(bossActionTimer);
      playSound('hit');
      screenShake = 24;
      logBrawler("💥 Chrono-Lock shattered into a cascade of temporal clocks and dials!");

      const icons = ["⏱️", "🕰️", "⚙️", "⌛", "⌚", "🕒"];
      for (let i = 0; i < 35; i++) {
        particles.push({
          type: "clock",
          icon: icons[Math.floor(Math.random() * icons.length)],
          x: boss.x + 30,
          y: 200,
          vx: (Math.random() - 0.5) * 11,
          vy: -(Math.random() * 9 + 4),
          rot: 0,
          vRot: (Math.random() - 0.5) * 0.35,
          life: 140
        });
      }

      setTimeout(() => {
        document.getElementById("bannerTitle").innerText = "SANDBOX TEST COMPLETED";
        document.getElementById("bannerDesc").innerText = "Chrono-Lock defeated! All mechanics verified.";
        document.getElementById("chapterBanner").style.display = "block";
      }, 2000);
    }

    function dismissChapterBanner() {
      document.getElementById("chapterBanner").style.display = "none";
      startWave(1);
    }

    /* =========================================================================
       4. CONTROLS, ACTIONS & KOFI SLEDGE ANIMATION
       ========================================================================= */
    function playerMove(dx) {
      if (!gameActive) return;
      initAudio();
      leadX = Math.max(65, Math.min(330, leadX + dx));
      bgScrollOffset -= (dx * 0.15);
      leadLean = dx > 0 ? 0.08 : -0.08;
      walkCadence += 1.4;
    }

    function playerJump() {
      if (!gameActive || !isGrounded) return;
      initAudio();
      leadVy = -13;
      isGrounded = false;
    }

    function executeTagSwap() {
      if (!gameActive) return;
      initAudio();
      rosterIdx = (rosterIdx + 1) % unlockedRoster.length;
      activeLead = unlockedRoster[rosterIdx];
      playSound('shield');
      updateControlsUI();
      logBrawler(`Tag Swap! Active Lead: ${activeLead.toUpperCase()}`);
    }

    function updateControlsUI() {
      const others = unlockedRoster.filter(r => r !== activeLead);
      const partner = others.length > 0 ? others[0] : "xochitl";

      const nameMap = {
        marcus: "Marcus Prime",
        xochitl: "Xochitl",
        sundiata: "Sundiata Prime",
        kofi: "Kofi Osei"
      };

      document.getElementById("heroNameLabel").innerText = `${nameMap[activeLead]} (Lead) & ${nameMap[partner]} (AI)`;

      if (activeLead === "marcus") {
        document.getElementById("btnStrike").innerText = "⚡ Volt Beam";
        document.getElementById("btnOrb").innerText = "🔵 Plasma Orb";
        document.getElementById("btnBurst").innerText = "🛡️ Deflect";
      } else if (activeLead === "xochitl") {
        document.getElementById("btnStrike").innerText = "🔥 Magma Strike";
        document.getElementById("btnOrb").innerText = "🪶 Solar Strafe";
        document.getElementById("btnBurst").innerText = "🛡️ Wing Shield";
      } else if (activeLead === "sundiata") {
        document.getElementById("btnStrike").innerText = "🔨 Drum Tremor";
        document.getElementById("btnOrb").innerText = "🦁 Bronze Pulse";
        document.getElementById("btnBurst").innerText = "🦁 Solar Lion Roar";
      } else if (activeLead === "kofi") {
        document.getElementById("btnStrike").innerText = "⚒️ Anvil Sledge";
        document.getElementById("btnOrb").innerText = "✨ Molten Shards";
        document.getElementById("btnBurst").innerText = "🛡️ Crucible Bastion";
      }

      let nextHero = unlockedRoster[(rosterIdx + 1) % unlockedRoster.length];
      document.getElementById("btnTag").innerText = `TAG: ${nextHero.toUpperCase()}`;
    }

    function executeStrike() {
      if (!gameActive) return;
      initAudio();
      leadLean = 0.12;

      if (activeLead === "marcus") {
        playSound('zap');
        generateLightning(leadX + 45, 205 - leadY, 380, 205);
      } else if (activeLead === "sundiata") {
        playSound('drum');
        screenShake = 11;
        sundiataShockwave.active = true;
        sundiataShockwave.x = leadX + 35;
        sundiataShockwave.radius = 10;
      } else if (activeLead === "kofi") {
        // TRIGGER ANIMATED CRUCIBLE ANVIL SLEDGE
        playSound('anvil');
        screenShake = 14;
        kofiHammerSwing.active = true;
        kofiHammerSwing.timer = kofiHammerSwing.maxTimer;
        createBurstParticles(leadX + 55, 220, "#fbbf24", 18);
        logBrawler("⚒️ CRUCIBLE ANVIL SLEDGE slams downward with molten gold impact!");
      } else {
        playSound('hit');
      }

      if (boss.active && Math.abs(boss.x - leadX) < 240) {
        boss.hp -= (activeLead === "kofi" || activeLead === "sundiata") ? 2 : 1;
        boss.hitFlash = 6;
        updateHUD();
        if (boss.hp <= 0) onBossDefeated();
      } else {
        enemies.forEach(e => {
          if (e.active && Math.abs(e.x - leadX) < 200) {
            e.hp -= 2;
            if (e.hp <= 0) onEnemyDestroyed(e);
          }
        });
      }
    }

    function executePlasmaOrb() {
      if (!gameActive) return;
      initAudio();
      if (activeLead === "sundiata") {
        playSound('drum');
        plasmaOrbs.push({ x: leadX + 40, y: 200 - leadY, vx: 6.2, radius: 18, life: 90, color: "#f59e0b", isLionPulse: true });
      } else if (activeLead === "kofi") {
        playSound('anvil');
        plasmaOrbs.push({ x: leadX + 40, y: 200 - leadY, vx: 6.8, radius: 14, life: 85, color: "#fbbf24" });
      } else {
        playSound('orb');
        plasmaOrbs.push({ x: leadX + 40, y: 200 - leadY, vx: 7.5, radius: 12, life: 80, color: "#38bdf8" });
      }
    }

    function executeBurst() {
      if (!gameActive) return;
      initAudio();
      if (activeLead === "sundiata") {
        playSound('roar');
        playSound('drum');
        screenShake = 18;
        logBrawler("🦁 ROAAAAR! The Solar Lion charges forward across the arena!");
        lionRoars.push({
          x: leadX + 25,
          y: 195 - leadY,
          vx: 9.0,
          width: 175,
          height: 125,
          scale: 0.70,
          alpha: 0.85,
          life: 85,
          maxLife: 85
        });
      } else {
        isShieldActive = true;
        playSound('shield');
        logBrawler("Defensive Shield engaged!");
        setTimeout(() => isShieldActive = false, 3000);
      }
    }

    function executeLuettaAid() {
      if (!gameActive) return;
      initAudio();
      playSound('celestial');
      screenShake = 14;
      playerHp = 100;
      updateHUD();
      logBrawler("✨ Mother Luetta descends in radiant light, fully restoring squad health!");
    }

    function onEnemyDestroyed(enemy) {
      if (!enemy.active) return;
      enemy.active = false;
      mobsRemaining = Math.max(0, mobsRemaining - 1);
      playSound('hit');
      createBurstParticles(enemy.x, enemy.y, "#ef4444", 12);
      updateHUD();

      if (mobsRemaining <= 0 && !boss.active) {
        if (currentWave === 1) setTimeout(() => startWave(2), 1200);
        else if (currentWave === 2) setTimeout(() => startWave(3), 1400);
      }
    }

    function generateLightning(x1, y1, x2, y2) {
      let segments = [];
      const steps = 8;
      const dx = (x2 - x1) / steps;
      const dy = (y2 - y1) / steps;
      let curX = x1, curY = y1;

      for (let i = 0; i < steps; i++) {
        let nxtX = curX + dx;
        let nxtY = curY + dy;
        if (i < steps - 1) {
          nxtX += (Math.random() - 0.5) * 16;
          nxtY += (Math.random() - 0.5) * 16;
        }
        segments.push({ x1: curX, y1: curY, x2: nxtX, y2: nxtY });
        curX = nxtX; curY = nxtY;
      }
      lightningBolts.push({ segments: segments, weight: 3.5, life: 8 });
    }

    function createBurstParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          color: color,
          size: Math.random() * 4 + 2,
          life: 25
        });
      }
    }

    // DRAW KOFI OSEI CRUCIBLE ANVIL SLEDGE
    function drawKofiAnvilHammer(ctx, originX, originY) {
      if (!kofiHammerSwing.active) return;

      const progress = 1 - (kofiHammerSwing.timer / kofiHammerSwing.maxTimer);
      const swingAngle = -1.1 + (progress * 1.9);

      ctx.save();
      ctx.translate(originX + 38, originY + 30);
      ctx.rotate(swingAngle);

      ctx.fillStyle = "#451a03";
      ctx.fillRect(-3, -52, 6, 68);
      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 1.2;
      ctx.strokeRect(-3, -52, 6, 68);

      const ironGrad = ctx.createLinearGradient(-26, -74, 26, -48);
      ironGrad.addColorStop(0, "#0f172a");
      ironGrad.addColorStop(0.5, "#334155");
      ironGrad.addColorStop(1, "#1e293b");
      ctx.fillStyle = ironGrad;
      ctx.fillRect(-22, -74, 44, 26);
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-22, -74, 44, 26);

      ctx.fillStyle = "#fbbf24";
      ctx.shadowColor = "#f59e0b";
      ctx.shadowBlur = 16;
      ctx.fillRect(-20, -64, 40, 5);
      ctx.fillRect(16, -72, 6, 22);

      if (progress > 0.6) {
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 24;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(20, -60, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      kofiHammerSwing.timer--;
      if (kofiHammerSwing.timer <= 0) {
        kofiHammerSwing.active = false;
      }
    }

    /* =========================================================================
       5. MAIN 60 FPS RENDER LOOP
       ========================================================================= */
    function renderBrawler() {
      ctx.save();

      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.88;
        if (screenShake < 0.3) screenShake = 0;
      }

      // Backdrop & Ground Platform
      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (ASSETS.bg.complete && ASSETS.bg.naturalWidth > 0) {
        ctx.drawImage(ASSETS.bg, 0, 0, canvas.width, canvas.height);
      }

      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 255, canvas.width, 35);
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 255);
      ctx.lineTo(canvas.width, 255);
      ctx.stroke();

      // Gravity & Grounding
      if (!isGrounded) {
        leadY -= leadVy;
        leadVy += 0.8;
        if (leadY <= 0) {
          leadY = 0;
          leadVy = 0;
          isGrounded = true;
        }
      }

      leadLean *= 0.88;
      walkCadence *= 0.84;
      const leadStepBob = Math.sin(walkCadence) * 3;
      const drawLeadY = (175 - leadY) + leadStepBob;

      // Render Active Lead Hero
      let leadImg = ASSETS[activeLead];
      ctx.save();
      ctx.translate(leadX + 32, drawLeadY + 80);
      ctx.rotate(leadLean);
      if (leadImg && leadImg.complete && leadImg.naturalWidth > 0) {
        ctx.drawImage(leadImg, -32, -80, 65, 80);
      } else {
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(-25, -70, 50, 70);
      }
      ctx.restore();

      // Overlay Kofi Sledge Swing
      if (activeLead === "kofi") {
        drawKofiAnvilHammer(ctx, leadX, drawLeadY);
      }

      // Render Enemies
      enemies.forEach(e => {
        if (!e.active) return;
        if (e.x > leadX + 45) {
          e.x -= e.speed;
        } else {
          e.x += 35;
          playerHp = Math.max(0, playerHp - 5);
          updateHUD();
        }

        ctx.fillStyle = "#ef4444";
        ctx.fillRect(e.x, e.y, 24, 32);
      });

      // Render Boss
      if (boss.active) {
        ctx.save();
        if (boss.hitFlash > 0) {
          ctx.filter = "brightness(2.0)";
          boss.hitFlash--;
        }
        if (ASSETS.boss.complete && ASSETS.boss.naturalWidth > 0) {
          ctx.drawImage(ASSETS.boss, boss.x, 165, 75, 90);
        } else {
          ctx.fillStyle = "#10b981";
          ctx.fillRect(boss.x, 165, 65, 85);
        }
        ctx.restore();
      }

      // Solar Lion Roar Charge
      for (let r = lionRoars.length - 1; r >= 0; r--) {
        const lr = lionRoars[r];
        lr.x += lr.vx;
        lr.life--;

        ctx.save();
        if (ASSETS.solarLion.complete && ASSETS.solarLion.naturalWidth > 0) {
          ctx.drawImage(ASSETS.solarLion, lr.x, lr.y - 45, 140, 95);
        } else {
          ctx.fillStyle = "#fbbf24";
          ctx.beginPath();
          ctx.arc(lr.x + 50, lr.y, 40, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        if (boss.active && Math.abs(lr.x - boss.x) < 60) {
          boss.hp -= 3;
          updateHUD();
          if (boss.hp <= 0) onBossDefeated();
        }

        if (lr.x > canvas.width + 80 || lr.life <= 0) lionRoars.splice(r, 1);
      }

      // Lightning
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const bolt = lightningBolts[i];
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = bolt.weight;
        ctx.beginPath();
        bolt.segments.forEach(seg => {
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);
        });
        ctx.stroke();
        bolt.life--;
        if (bolt.life <= 0) lightningBolts.splice(i, 1);
      }

      // Particles & Clock Shatter Pieces
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.type === "clock") {
          p.vy += 0.35;
          if (p.y > 245) {
            p.y = 245;
            p.vy *= -0.55;
            p.vx *= 0.8;
          }
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.font = "18px sans-serif";
          ctx.fillText(p.icon, -9, 5);
          ctx.restore();
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      ctx.restore();
      animationFrameId = requestAnimationFrame(renderBrawler);
    }

    function updateHUD() {
      document.getElementById("heroHpBar").style.width = playerHp + "%";
      document.getElementById("heroHpText").innerText = `${playerHp}/100`;

      if (boss.active) {
        document.getElementById("enemyTypeLabel").innerText = "Chrono-Lock";
        document.getElementById("enemyHpText").innerText = `${Math.max(0, boss.hp)}/${boss.maxHp}`;
        document.getElementById("enemyHpBar").style.width = `${(Math.max(0, boss.hp) / boss.maxHp) * 100}%`;
      } else {
        document.getElementById("enemyTypeLabel").innerText = "Syndicate Swarm";
        document.getElementById("enemyHpText").innerText = `${mobsRemaining} Units Remaining`;
        document.getElementById("enemyHpBar").style.width = `${(mobsRemaining / mobsTotal) * 100}%`;
      }
    }

    function logBrawler(msg) {
      document.getElementById("combatLog").innerText = msg;
    }

    window.addEventListener("DOMContentLoaded", initSandbox);
  </script>
</body>
