<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Isaac Rhodes Adventures: Frontline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #04060d; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #game-container { position: relative; width: 100%; max-width: 480px; height: 96vh; max-height: 920px; background: #080d1a; border: 2px solid #1a2c4e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0, 229, 255, 0.15); }
    
    /* Top Mode Bar */
    #mode-bar { display: flex; background: #050811; border-bottom: 1px solid #1a2942; }
    .mode-btn { flex: 1; padding: 10px 0; background: transparent; border: none; color: #7f93b5; font-weight: bold; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .mode-btn.active { color: #00e5ff; border-bottom: 2px solid #00e5ff; background: rgba(0, 229, 255, 0.08); }

    /* Top HUD */
    #hud { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(5, 9, 20, 0.95); font-size: 11px; border-bottom: 1px solid #182845; }
    .hp-track { width: 110px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #444; position: relative; }
    .hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e74c3c, #2ecc71); transition: width 0.15s; }
    .hud-title { color: #00e5ff; font-weight: bold; font-size: 11px; }

    /* Canvas Viewport */
    #gameCanvas { width: 100%; height: 46%; background: #02040a; display: block; }
    
    /* Chapter Title */
    #chapter-banner { background: #0a1120; border-top: 1px solid #1c2b4a; border-bottom: 1px solid #1c2b4a; padding: 5px 0; text-align: center; font-size: 11px; font-weight: bold; color: #f39c12; letter-spacing: 1px; }

    /* Roster Selector */
    #roster-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px 8px; background: #070d1a; }
    .hero-tab { background: #101c36; border: 1px solid #1f3460; color: #9bb1d6; border-radius: 6px; padding: 5px 2px; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer; transition: all 0.2s; }
    .hero-tab span { display: block; font-size: 8px; color: #627b9f; font-weight: normal; }
    .hero-tab.active { background: #007791; border-color: #00e5ff; color: #fff; box-shadow: 0 0 10px rgba(0,229,255,0.3); }

    /* Tactical Dock */
    #controls-dock { flex: 1; background: #080d1a; padding: 6px 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .ctrl-btn { background: #132247; border: 1px solid #284485; color: #fff; border-radius: 6px; font-weight: bold; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; padding: 4px; }
    .ctrl-btn span { font-size: 8px; color: #8ba2cf; font-weight: normal; margin-top: 1px; }
    .ctrl-btn:active { background: #00e5ff; color: #000; }
    
    .tag-btn { background: #3d2314; border-color: #e67e22; grid-column: span 2; }
    .aid-btn { background: #6b4c06; border-color: #f1c40f; color: #ffeaa7; grid-column: span 2; font-weight: bold; box-shadow: 0 0 12px rgba(241,196,15,0.4); }
    .jump-btn { background: #1b4965; border-color: #62b6cb; color: #bee9e8; }
    .skill1-btn { background: #0b3b4f; border-color: #00e5ff; color: #cbf3f0; }
    .skill2-btn { background: #2a1b4e; border-color: #9b59b6; color: #e8d7f1; }
    .burst-btn { background: #5c111e; border-color: #e74c3c; color: #fff; grid-column: span 2; }

    /* Victory / Promotion Modal */
    #promo-modal { position: absolute; inset: 0; background: rgba(4, 7, 16, 0.96); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; z-index: 100; }
    .modal-box { background: #0e1a38; border: 2px solid #f39c12; border-radius: 12px; padding: 18px; width: 100%; max-width: 360px; box-shadow: 0 0 30px rgba(243,156,18,0.4); }
    .comic-cover { width: 110px; height: 150px; background: #1c2b50; border: 2px solid #fff; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; border-radius: 6px; }
    .promo-link { display: block; margin: 6px 0; padding: 9px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; }
    .buy-comic { background: #f39c12; color: #000; }
    .buy-deck { background: #27ae60; color: #fff; }
    .next-stage-btn { background: #2980b9; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 8px; cursor: pointer; width: 100%; font-size: 12px; }
    .replay-btn { background: #34495e; color: #fff; border: none; padding: 8px; border-radius: 6px; margin-top: 6px; cursor: pointer; width: 100%; font-size: 11px; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Mode Bar -->
  <div id="mode-bar">
    <button class="mode-btn active" onclick="window.location.href='isaac.html'">2D Action Brawler</button>
    <button class="mode-btn" onclick="window.location.href='vanguard.html'">Tabletop Card Clash</button>
  </div>

  <!-- Top HUD -->
  <div id="hud">
    <div>
      <div class="hud-title" id="hud-hero-name">MARCUS PRIME</div>
      <div class="hp-track"><div class="hp-fill" id="hero-hp-bar"></div></div>
      <span id="hero-hp-num">120/120</span>
    </div>
    <div style="text-align: center;">
      <div id="wave-counter" style="font-weight:bold; color:#00e5ff;">STAGE [1/3]</div>
      <div id="score-text" style="font-size:10px; color:#aaa;">SCORE: 0</div>
    </div>
    <div style="text-align: right;">
      <div class="hud-title" id="hud-boss-name" style="color:#e74c3c;">TARGET</div>
      <div class="hp-track"><div class="hp-fill" id="enemy-hp-bar" style="background:#e74c3c;"></div></div>
      <span id="enemy-hp-num">--/--</span>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" width="480" height="260"></canvas>

  <!-- Banner -->
  <div id="chapter-banner">✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦</div>

  <!-- Roster Selector -->
  <div id="roster-bar">
    <div class="hero-tab active" id="tab-marcus" onclick="selectLeadHero('marcus')">Marcus Prime<span>Lightning Shock</span></div>
    <div class="hero-tab" id="tab-mayleen" onclick="selectLeadHero('mayleen')">Mayleen<span>Hydro Net & Wave</span></div>
    <div class="hero-tab" id="tab-sundiata" onclick="selectLeadHero('sundiata')">Sundiata Prime<span>Solar Recurve</span></div>
  </div>

  <!-- Controls Dock -->
  <div id="controls-dock">
    <button class="ctrl-btn tag-btn" onclick="swapLeadHero()">
      <b id="tag-label">TAG / SWAP DUO LEAD</b>
      <span id="tag-sub">Partner: Mayleen (Active AI Flank)</span>
    </button>
    <button class="ctrl-btn aid-btn" onclick="triggerMotherLuettaAid()">
      <b>✦ MOTHER LUETTA AID ✦</b>
      <span>Full Heal & Screen Wipe</span>
    </button>

    <button class="ctrl-btn" onmousedown="heroMoveLeft()" onmouseup="heroStop()" ontouchstart="heroMoveLeft()" ontouchend="heroStop()">◀ LEFT<span>[A]</span></button>
    <button class="ctrl-btn" onmousedown="heroMoveRight()" onmouseup="heroStop()" ontouchstart="heroMoveRight()" ontouchend="heroStop()">RIGHT ▶<span>[D]</span></button>
    <button class="ctrl-btn jump-btn" onclick="heroNinjaJump()">▲ NINJA JUMP<span>Flip & Kick</span></button>
    <button class="ctrl-btn" onclick="brawlerEvade()">EVADE<span>Dash</span></button>

    <button class="ctrl-btn" onclick="brawlerAttack('strike1')"><b id="btn-s1-title">STRIKE 1</b><span id="btn-s1-desc">Lightning Strike</span></button>
    <button class="ctrl-btn" onclick="brawlerAttack('strike2')"><b id="btn-s2-title">STRIKE 2</b><span id="btn-s2-desc">Acoustic Impact</span></button>
    
    <button class="ctrl-btn skill1-btn" onclick="triggerUniqueSkill(1)"><b id="btn-u1-title">LIGHTNING</b><span id="btn-u1-desc">Shockwave Beam</span></button>
    <button class="ctrl-btn skill2-btn" onclick="triggerUniqueSkill(2)"><b id="btn-u2-title">ACOUSTIC</b><span id="btn-u2-desc">Seismic Quake</span></button>

    <button class="ctrl-btn burst-btn" onclick="triggerOverdrive()">★ OVERDRIVE BURST ★</button>
    <button class="ctrl-btn" style="background:#16243b; grid-column: span 2;" onclick="window.location.href='vanguard.html'">TABLETOP DECK<span>Open Cards</span></button>
  </div>

  <!-- Victory Modal -->
  <div id="promo-modal">
    <div class="modal-box">
      <h3 id="modal-title" style="color:#f39c12;">STAGE CLEARED!</h3>
      <p id="modal-desc" style="font-size:11px; margin: 6px 0; color:#ddd;">Perimeter secured.</p>
      
      <button class="next-stage-btn" id="next-stage-btn" onclick="advanceToNextStage()">Continue to Next Stage ➔</button>

      <div class="comic-cover">ISSUE #1<br>PREVIEW</div>
      <a href="https://yourbrand.com/comic-issue-1" target="_blank" class="promo-link buy-comic">Read Issue #1: Dawn at RenCen</a>
      <a href="https://yourbrand.com/card-deck" target="_blank" class="promo-link buy-deck">Pre-Order Physical Card Deck</a>
      <button class="replay-btn" onclick="restartCurrentChapter()">Replay Stage</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   SYNTHESIZED AUDIO & HAPTICS
========================================================= */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
      vibrateDevice(30);
    } else if (type === 'lightning') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.35);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
      vibrateDevice([60, 30, 80]);
    } else if (type === 'flip') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
      vibrateDevice([40, 20, 50]);
    } else if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(750, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'tsunami') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(500, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
      vibrateDevice(80);
    } else if (type === 'beam') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.linearRampToValueAtTime(880, now + 0.8);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
      vibrateDevice([60, 40, 60, 40, 100]);
    }
  } catch(e) {}
}

function vibrateDevice(p) { if ("vibrate" in navigator) navigator.vibrate(p); }

/* =========================================================
   ROSTER & DISTINCT SUPERPOWERS
========================================================= */
const HERO_ROSTER = {
  marcus: {
    name: "Marcus Prime",
    title: "Acoustic Conduit",
    hp: 120, maxHp: 120,
    skin: "#4a2c11", color: "#27ae60", accent: "#8e44ad",
    s1: { name: "Lightning Strike", dmg: 25 },
    s2: { name: "Acoustic Impact", dmg: 40 },
    u1: { title: "LIGHTNING", desc: "Shock Beam", type: "lightning" },
    u2: { title: "ACOUSTIC", desc: "Seismic Quake", type: "quake" }
  },
  mayleen: {
    name: "Mayleen",
    title: "Aura Weaver",
    hp: 120, maxHp: 120,
    skin: "#5a3818", color: "#00e5ff", accent: "#f39c12",
    s1: { name: "Silk Pierce", dmg: 22 },
    s2: { name: "Tensile Strike", dmg: 38 },
    u1: { title: "HYDRO-NET", desc: "Trap & Freeze", type: "net" },
    u2: { title: "TSUNAMI", desc: "Wave Surge", type: "wave" }
  },
  sundiata: {
    name: "Sundiata Prime",
    title: "Ancestral Vanguard",
    hp: 140, maxHp: 140,
    skin: "#402410", color: "#daa520", accent: "#1e3d2b",
    s1: { name: "Djembe Strike", dmg: 28 },
    s2: { name: "Ancestral Cleave", dmg: 45 },
    u1: { title: "SOLAR VOLLEY", desc: "Arrow Rain", type: "arrows" },
    u2: { title: "DJEMBE BLAST", desc: "Sonic Quake", type: "quake" }
  }
};

let leadHeroKey = "marcus";
let partnerHeroKey = "mayleen";

const CHAPTERS = [
  { id: 1, title: "✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦", droidsToSpawn: 6, boss: null },
  { id: 2, title: "✦ STAGE 2: RENCEN PLAZA HELIPAD ✦", droidsToSpawn: 8, boss: { name: "VECTOR VOID", hp: 180, maxHp: 180, speed: 2.0 } },
  { id: 3, title: "✦ STAGE 3: SKY-SPIRE CLIMAX ✦", droidsToSpawn: 6, boss: { name: "CHRONO-LOCK", hp: 250, maxHp: 250, speed: 1.8 } }
];

let currentChapterIdx = 0;

/* =========================================================
   CANVAS & BATTLEFIELD STATES
========================================================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let hero = { x: 80, y: 195, vx: 0, vy: 0, isGrounded: true, w: 24, h: 44, attacking: false, isNinjaJumping: false, rotation: 0, kickActive: false };
let partner = { x: 40, y: 195, vx: 0, vy: 0, isGrounded: true, w: 24, h: 44, attackTimer: 0 };
let droids = [];
let enemyLasers = [];
let activeBoss = null;
let waveKills = 0;
let score = 0;
let screenShake = 0;
let globalTick = 0;

// Upgraded High-End VFX
let waveEffect = { active: false, x: 0, height: 90, speed: 8, surgeFrame: 0 };
let lightningBeam = { active: false, x1: 0, y1: 0, x2: 0, y2: 0, timer: 0 };
let seismicShock = { active: false, x: 0, radius: 0, timer: 0 };
let motherLuetta = { active: false, y: -60, beamActive: false, wipeTimer: 0 };

/* =========================================================
   INITIALIZATION & STAGE MANAGEMENT
========================================================= */
function loadChapter(idx) {
  currentChapterIdx = idx;
  const chap = CHAPTERS[idx];
  document.getElementById("chapter-banner").innerText = chap.title;
  waveKills = 0;
  droids = [];
  enemyLasers = [];
  activeBoss = null;

  for (let i = 0; i < chap.droidsToSpawn; i++) {
    droids.push({
      x: 320 + (i * 65),
      y: 195,
      w: 22,
      h: 42,
      hp: 30 + (idx * 15),
      speed: 1.0 + (idx * 0.2),
      shootCooldown: Math.floor(Math.random() * 80) + 60,
      isTrapped: false,
      trapTimer: 0
    });
  }
  updateHUD();
}
loadChapter(0);

function selectLeadHero(key) {
  if (leadHeroKey === key) return;
  partnerHeroKey = leadHeroKey;
  leadHeroKey = key;
  updateRosterUI();
}

function swapLeadHero() {
  const temp = leadHeroKey;
  leadHeroKey = partnerHeroKey;
  partnerHeroKey = temp;
  const px = hero.x; hero.x = partner.x; partner.x = px;
  playSound('hit');
  updateRosterUI();
}

function updateRosterUI() {
  document.querySelectorAll(".hero-tab").forEach(t => t.classList.remove("active"));
  const activeTab = document.getElementById(`tab-${leadHeroKey}`);
  if (activeTab) activeTab.classList.add("active");

  const cur = HERO_ROSTER[leadHeroKey];
  const part = HERO_ROSTER[partnerHeroKey];
  document.getElementById("hud-hero-name").innerText = cur.name.toUpperCase();
  document.getElementById("tag-sub").innerText = `Partner: ${part.name} (Active AI Flank)`;
  document.getElementById("btn-s1-desc").innerText = cur.s1.name;
  document.getElementById("btn-s2-desc").innerText = cur.s2.name;

  document.getElementById("btn-u1-title").innerText = cur.u1.title;
  document.getElementById("btn-u1-desc").innerText = cur.u1.desc;
  document.getElementById("btn-u2-title").innerText = cur.u2.title;
  document.getElementById("btn-u2-desc").innerText = cur.u2.desc;
  updateHUD();
}

/* =========================================================
   CONTROLS & DISTINCT SUPERPOWERS
========================================================= */
function heroMoveLeft() { hero.vx = -3.5; }
function heroMoveRight() { hero.vx = 3.5; }
function heroStop() { hero.vx = 0; }

function heroNinjaJump() {
  if (hero.isGrounded) {
    hero.vy = -10.5;
    hero.vx = (hero.vx === 0) ? 3.5 : hero.vx * 1.3;
    hero.isGrounded = false;
    hero.isNinjaJumping = true;
    hero.rotation = 0;
    hero.kickActive = true;
    playSound('flip');
    triggerScreenShake(4);
  }
}

function brawlerEvade() {
  hero.x += (hero.vx >= 0) ? 50 : -50;
  triggerScreenShake(3);
  playSound('hit');
}

function brawlerAttack(type) {
  hero.attacking = true;
  const dmg = HERO_ROSTER[leadHeroKey][type === 'strike1' ? 's1' : 's2'].dmg;
  
  if (leadHeroKey === 'marcus') {
    // Marcus fires real lightning arcing from fists
    playSound('lightning');
    lightningBeam.active = true;
    lightningBeam.x1 = hero.x + hero.w;
    lightningBeam.y1 = hero.y + 16;
    lightningBeam.x2 = hero.x + 140;
    lightningBeam.y2 = hero.y + 16;
    lightningBeam.timer = 12;
  } else {
    playSound(type === 'strike1' ? 'hit' : 'heavy');
  }

  checkCollisions(dmg);
  setTimeout(() => hero.attacking = false, 180);
}

function triggerUniqueSkill(slot) {
  const cur = HERO_ROSTER[leadHeroKey];
  const powerType = slot === 1 ? cur.u1.type : cur.u2.type;

  if (powerType === 'lightning') {
    // Marcus Prime: Massive Lightning Beam Across Screen
    playSound('lightning');
    triggerScreenShake(10);
    lightningBeam.active = true;
    lightningBeam.x1 = hero.x + hero.w;
    lightningBeam.y1 = hero.y + 16;
    lightningBeam.x2 = canvas.width;
    lightningBeam.y2 = hero.y + 16;
    lightningBeam.timer = 25;

    droids.forEach(d => { d.hp -= 40; d.x += 20; });
    if (activeBoss) activeBoss.hp -= 35;
    checkCombatResolution();
  } 
  else if (powerType === 'quake') {
    // Ground Acoustic Shockwave
    playSound('heavy');
    triggerScreenShake(12);
    seismicShock.active = true;
    seismicShock.x = hero.x + hero.w / 2;
    seismicShock.radius = 10;
    seismicShock.timer = 20;

    droids.forEach(d => { d.hp -= 30; d.x += 25; });
    if (activeBoss) activeBoss.hp -= 25;
    checkCombatResolution();
  }
  else if (powerType === 'net') {
    // Mayleen: Hydro Net Freeze
    playSound('tsunami');
    triggerScreenShake(3);
    let target = null;
    let closestDist = 260;
    droids.forEach(d => {
      let dist = d.x - hero.x;
      if (dist > 0 && dist < closestDist) { closestDist = dist; target = d; }
    });
    if (!target && activeBoss && activeBoss.x > hero.x) target = activeBoss;
    if (target) {
      target.isTrapped = true;
      target.trapTimer = 220;
    }
  } 
  else if (powerType === 'wave') {
    // Mayleen: Tsunami Wave
    playSound('tsunami');
    triggerScreenShake(6);
    waveEffect.active = true;
    waveEffect.x = hero.x;
    waveEffect.surgeFrame = 0;
  }
  else if (powerType === 'arrows') {
    // Sundiata: Rain of Photon Recurve Arrows
    playSound('lightning');
    triggerScreenShake(6);
    droids.forEach(d => { d.hp -= 35; d.x += 15; });
    checkCombatResolution();
  }
}

// MOTHER LUETTA REAL SCREEN WIPE & 100% HEAL
function triggerMotherLuettaAid() {
  playSound('beam');
  triggerScreenShake(16);
  vibrateDevice([80, 40, 80, 40, 120]);

  motherLuetta.active = true;
  motherLuetta.y = -50;
  motherLuetta.beamActive = false;
  motherLuetta.wipeTimer = 160;
}

function triggerOverdrive() {
  playSound('heavy');
  triggerScreenShake(14);
  vibrateDevice([100, 50, 150]);
  if (activeBoss) activeBoss.hp -= 80;
  droids.forEach(d => d.hp = 0);
  checkCombatResolution();
}

function checkCollisions(dmg) {
  const reach = 55;
  droids.forEach(d => {
    if (Math.abs((hero.x + hero.w) - d.x) < reach) {
      d.hp -= dmg;
      d.x += 18;
      score += 150;
      triggerScreenShake(3);
    }
  });
  if (activeBoss && Math.abs((hero.x + hero.w) - activeBoss.x) < reach + 10) {
    activeBoss.hp -= dmg;
    activeBoss.x += 12;
    score += 300;
    triggerScreenShake(5);
  }
  checkCombatResolution();
}

function checkCombatResolution() {
  droids = droids.filter(d => {
    if (d.hp <= 0) { waveKills++; score += 500; return false; }
    return true;
  });

  const chap = CHAPTERS[currentChapterIdx];
  if (waveKills >= chap.droidsToSpawn && chap.boss && !activeBoss) {
    activeBoss = {
      name: chap.boss.name,
      x: 380,
      y: 185,
      w: 36,
      h: 52,
      hp: chap.boss.hp,
      maxHp: chap.boss.maxHp,
      speed: chap.boss.speed,
      teleportTimer: 0,
      shootCooldown: 90,
      isTrapped: false,
      trapTimer: 0
    };
    playSound('heavy');
    triggerScreenShake(8);
  }

  if (waveKills >= chap.droidsToSpawn && (!chap.boss || (activeBoss && activeBoss.hp <= 0))) {
    activeBoss = null;
    showChapterClearModal();
  }
  updateHUD();
}

function triggerScreenShake(val) { screenShake = val; }

/* =========================================================
   AUTHENTIC DETAILED CHARACTER ARTWORK (NO RECTANGLE BLOCKS)
========================================================= */
function drawDetailedHero(x, y, w, h, heroKey, isAttacking, rotationAngle, isKicking) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  if (rotationAngle) ctx.rotate(rotationAngle);
  ctx.translate(-(x + w / 2), -(y + h / 2));

  const data = HERO_ROSTER[heroKey];

  // Head & Features
  ctx.fillStyle = data.skin;
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + 6, 6.5, 7.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Defined Hair & Eyes
  ctx.fillStyle = "#111";
  ctx.fillRect(x + w/2 - 7, y, 14, 4);

  // Marcus Facial Energy Glyph
  if (heroKey === 'marcus') {
    ctx.fillStyle = "#ffcc00";
    ctx.shadowColor = "#ffcc00";
    ctx.shadowBlur = 6;
    ctx.fillRect(x + w/2 - 1, y + 4, 2, 4);
    ctx.shadowBlur = 0;
  }

  // Muscular Torso with Tech-Armor Shading
  ctx.fillStyle = data.color;
  ctx.beginPath();
  ctx.moveTo(x - 3, y + 14);
  ctx.lineTo(x + w + 3, y + 14);
  ctx.lineTo(x + w - 2, y + 28);
  ctx.lineTo(x + 2, y + 28);
  ctx.closePath();
  ctx.fill();

  // Chest Armor Plate Line / Vest Details
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Belt & Utility Sash
  ctx.fillStyle = data.accent;
  ctx.fillRect(x + 1, y + 25, w - 2, 4);

  // Character Specific Accessories
  if (heroKey === 'marcus') {
    // Acoustic Arc Reactor Core in Chest
    ctx.fillStyle = "#00e5ff";
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(x + w/2, y + 20, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (heroKey === 'mayleen') {
    // Flowing Silk Fabric Hem
    ctx.fillStyle = "rgba(0, 229, 255, 0.75)";
    ctx.beginPath();
    ctx.moveTo(x - 4, y + 27);
    ctx.lineTo(x + w + 4, y + 27);
    ctx.lineTo(x + w + 2, y + 38);
    ctx.lineTo(x - 2, y + 38);
    ctx.fill();
  } else if (heroKey === 'sundiata') {
    // Ceremonial Djembe / Gold Breastplate
    ctx.fillStyle = "#ffeaa7";
    ctx.fillRect(x + 3, y + 16, w - 6, 4);
  }

  // Articulated Legs & Combat Boots
  ctx.fillStyle = data.accent;
  if (isKicking) {
    ctx.fillRect(x + w - 2, y + 27, 20, 7);
    ctx.fillRect(x - 5, y + 29, 7, 13);
  } else {
    // Left Leg
    ctx.fillRect(x + 2, y + 29, 6, 15);
    // Right Leg
    ctx.fillRect(x + w - 8, y + 29, 6, 15);
    // Darker Boots
    ctx.fillStyle = "#111";
    ctx.fillRect(x + 1, y + 38, 7, 6);
    ctx.fillRect(x + w - 9, y + 38, 7, 6);
  }

  // Arms & Attack Pose
  ctx.fillStyle = data.skin;
  if (isAttacking) {
    ctx.fillStyle = data.color;
    ctx.fillRect(x + w - 2, y + 14, 18, 6);
    ctx.fillStyle = data.accent;
    ctx.beginPath(); ctx.arc(x + w + 16, y + 17, 6, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillRect(x - 4, y + 14, 5, 13);
    ctx.fillRect(x + w - 1, y + 14, 5, 13);
  }
  ctx.restore();
}

function drawSyndicateDroid(d) {
  ctx.save();
  // Realistic Mechanical Droid
  ctx.fillStyle = "#7f8c8d";
  ctx.fillRect(d.x + 2, d.y + 13, d.w - 4, 16);
  ctx.fillStyle = "#95a5a6";
  ctx.beginPath(); ctx.arc(d.x + d.w/2, d.y + 6, 5.5, 0, Math.PI * 2); ctx.fill();
  
  // Glowing Red Sensor Visor
  ctx.fillStyle = "#ff2222";
  ctx.shadowColor = "#ff2222";
  ctx.shadowBlur = 6;
  ctx.fillRect(d.x + 4, d.y + 5, d.w - 8, 2);
  ctx.shadowBlur = 0;

  // Mechanical Blaster Rifle
  ctx.fillStyle = "#2c3e50";
  ctx.fillRect(d.x - 8, d.y + 17, 10, 4);

  // Legs
  ctx.fillStyle = "#34495e";
  ctx.fillRect(d.x + 2, d.y + 29, 5, 13);
  ctx.fillRect(d.x + d.w - 7, d.y + 29, 5, 13);

  // Hydro Net Webbing Overlay
  if (d.isTrapped) {
    ctx.strokeStyle = "rgba(0, 229, 255, 0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(d.x + d.w/2, d.y + d.h/2, 22, 0, Math.PI * 2); ctx.stroke();
    for (let a = 0; a < Math.PI; a += Math.PI / 3) {
      ctx.beginPath(); ctx.ellipse(d.x + d.w/2, d.y + d.h/2, 22, 10, a, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawChronoLock(x, y, w, h) {
  ctx.save();
  const cx = x + w / 2;
  const isP2 = activeBoss && activeBoss.hp < (activeBoss.maxHp / 2);

  // Bronze Clockwork Armor
  ctx.fillStyle = "#8a6d3b";
  ctx.fillRect(x - 8, y + 10, w + 16, 12);
  ctx.fillStyle = "#b8860b";
  ctx.beginPath();
  ctx.moveTo(x - 4, y + 14); ctx.lineTo(x + w + 4, y + 14);
  ctx.lineTo(x + w - 2, y + 32); ctx.lineTo(x + 2, y + 32); ctx.closePath(); ctx.fill();

  // Core Glow
  const coreGlow = isP2 ? "#ff3333" : "#00ffcc";
  ctx.shadowColor = coreGlow; ctx.shadowBlur = 10;
  ctx.fillStyle = coreGlow;
  ctx.beginPath(); ctx.arc(cx, y + 23, 6, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // Head & Gear Visor
  ctx.fillStyle = "#3e321e";
  ctx.beginPath(); ctx.arc(cx, y + 4, 8.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = coreGlow;
  ctx.fillRect(cx - 5, y + 3, 10, 3);

  // Legs
  ctx.fillStyle = "#4a3c23";
  ctx.fillRect(x + 2, y + 33, 7, 18);
  ctx.fillRect(x + w - 9, y + 33, 7, 18);
  ctx.restore();
}

/* =========================================================
   GAME ENGINE UPDATE LOOP
========================================================= */
function update() {
  globalTick++;

  // Hero Movement & Ninja Flip
  hero.x += hero.vx;
  hero.y += hero.vy;

  if (hero.isNinjaJumping) {
    hero.rotation += 0.22;
    droids.forEach(d => {
      if (Math.abs((hero.x + hero.w) - d.x) < 32 && Math.abs(hero.y - d.y) < 35) {
        d.hp -= 20;
        d.x += 25;
        triggerScreenShake(4);
      }
    });
  }

  if (hero.y < 195) {
    hero.vy += 0.52;
  } else {
    hero.y = 195;
    hero.vy = 0;
    hero.isGrounded = true;
    hero.isNinjaJumping = false;
    hero.rotation = 0;
    hero.kickActive = false;
  }
  hero.x = Math.max(10, Math.min(440, hero.x));

  // Partner AI Companion Flank
  const targetX = hero.x - 35;
  partner.x += (targetX - partner.x) * 0.05;
  partner.attackTimer++;
  if (partner.attackTimer > 130) {
    partner.attackTimer = 0;
    checkCollisions(18);
  }

  // Droids Shooting & Movement
  droids.forEach(d => {
    if (d.isTrapped) {
      d.trapTimer--;
      if (d.trapTimer <= 0) d.isTrapped = false;
      return;
    }

    if (d.x > hero.x + 70) d.x -= d.speed;

    d.shootCooldown--;
    if (d.shootCooldown <= 0) {
      d.shootCooldown = Math.floor(Math.random() * 80) + 70;
      enemyLasers.push({ x: d.x - 6, y: d.y + 19, vx: -4.5 });
      playSound('laser');
    }
  });

  // Enemy Lasers Update
  enemyLasers.forEach((l, idx) => {
    l.x += l.vx;
    if (Math.abs(l.x - (hero.x + hero.w/2)) < 12 && Math.abs(l.y - (hero.y + hero.h/2)) < 20) {
      HERO_ROSTER[leadHeroKey].hp -= 10;
      triggerScreenShake(3);
      enemyLasers.splice(idx, 1);
      updateHUD();
    }
  });
  enemyLasers = enemyLasers.filter(l => l.x > -20);

  // Boss AI
  if (activeBoss) {
    if (activeBoss.isTrapped) {
      activeBoss.trapTimer--;
      if (activeBoss.trapTimer <= 0) activeBoss.isTrapped = false;
    } else {
      if (activeBoss.x > hero.x + 40) activeBoss.x -= activeBoss.speed;
      else if (activeBoss.x < hero.x - 40) activeBoss.x += activeBoss.speed;

      activeBoss.shootCooldown--;
      if (activeBoss.shootCooldown <= 0) {
        activeBoss.shootCooldown = 60;
        enemyLasers.push({ x: activeBoss.x - 8, y: activeBoss.y + 22, vx: -5.5 });
        playSound('laser');
      }
    }
  }

  // MOTHER LUETTA SCREEN WIPE & RESTORATION
  if (motherLuetta.active) {
    if (motherLuetta.y < 50) {
      motherLuetta.y += 3;
    } else {
      motherLuetta.beamActive = true;
    }

    if (motherLuetta.beamActive) {
      // 1. Refill Health to 100%
      const cur = HERO_ROSTER[leadHeroKey];
      cur.hp = cur.maxHp;
      updateHUD();

      // 2. Wipe Entire Screen of Droids
      droids.forEach(d => { d.hp = 0; });
      if (activeBoss) activeBoss.hp -= 2;

      motherLuetta.wipeTimer--;
      if (motherLuetta.wipeTimer <= 0) {
        motherLuetta.beamActive = false;
        motherLuetta.active = false;
        checkCombatResolution();
      }
    }
  }

  render();
  requestAnimationFrame(update);
}

/* =========================================================
   CANVAS RENDERING ENGINE
========================================================= */
function render() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    screenShake *= 0.88;
    if (screenShake < 0.2) screenShake = 0;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Detailed Detroit Night Skyline with Gradient Grids
  for (let i = 0; i < 6; i++) {
    const bx = 18 + i * 76;
    const by = 35 + (i % 3) * 25;
    const bGrad = ctx.createLinearGradient(bx, by, bx, 235);
    bGrad.addColorStop(0, currentChapterIdx === 0 ? "#101f3b" : (currentChapterIdx === 1 ? "#1a2538" : "#2d1624"));
    bGrad.addColorStop(1, "#070c18");
    ctx.fillStyle = bGrad;
    ctx.fillRect(bx, by, 52, 200);

    // Glowing Yellow/Cyan Windows
    ctx.fillStyle = "rgba(255, 235, 150, 0.2)";
    for (let wy = by + 12; wy < 230; wy += 14) {
      for (let wx = bx + 8; wx < bx + 44; wx += 10) {
        if ((wx + wy) % 5 === 0) ctx.fillRect(wx, wy, 5, 8);
      }
    }
  }

  // Rooftop Floor & Glowing Helipad Border
  ctx.fillStyle = "#0c152a";
  ctx.fillRect(0, 235, canvas.width, 25);
  ctx.strokeStyle = "#00e5ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 235); ctx.lineTo(canvas.width, 235); ctx.stroke();

  // Enemy Red Blaster Bolts
  ctx.fillStyle = "#ff3333";
  ctx.shadowColor = "#ff3333";
  ctx.shadowBlur = 8;
  enemyLasers.forEach(l => {
    ctx.fillRect(l.x, l.y, 10, 3);
  });
  ctx.shadowBlur = 0;

  // Marcus Prime: Shockwave Lightning Beam
  if (lightningBeam.active) {
    lightningBeam.timer--;
    ctx.save();
    ctx.strokeStyle = "#00ffff";
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 14;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(lightningBeam.x1, lightningBeam.y1);
    // Jagged Lightning Segments
    for (let lx = lightningBeam.x1; lx < lightningBeam.x2; lx += 20) {
      ctx.lineTo(lx, lightningBeam.y1 + (Math.random() - 0.5) * 16);
    }
    ctx.lineTo(lightningBeam.x2, lightningBeam.y2);
    ctx.stroke();
    ctx.restore();
    if (lightningBeam.timer <= 0) lightningBeam.active = false;
  }

  // Ground Seismic Shock
  if (seismicShock.active) {
    seismicShock.timer--;
    seismicShock.radius += 8;
    ctx.strokeStyle = "rgba(142, 68, 173, 0.85)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(seismicShock.x, 235, seismicShock.radius, seismicShock.radius * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
    if (seismicShock.timer <= 0) seismicShock.active = false;
  }

  // Mayleen: Surging Tsunami Crest
  if (waveEffect.active) {
    waveEffect.surgeFrame += 0.1;
    const wx = waveEffect.x;
    const baseH = waveEffect.height;

    const grad = ctx.createLinearGradient(wx - 40, 235, wx + 20, 235 - baseH);
    grad.addColorStop(0, "rgba(0, 119, 182, 0.8)");
    grad.addColorStop(0.7, "rgba(72, 202, 228, 0.85)");
    grad.addColorStop(1, "rgba(202, 240, 248, 0.95)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(wx - 50, 235);
    ctx.quadraticCurveTo(wx - 20, 235 - baseH * 1.2, wx + 15, 235 - baseH);
    ctx.quadraticCurveTo(wx + 30, 235 - baseH * 0.9, wx + 25, 235 - baseH * 0.4);
    ctx.quadraticCurveTo(wx + 10, 235 - 20, wx + 40, 235);
    ctx.closePath();
    ctx.fill();

    waveEffect.x += waveEffect.speed;
    droids.forEach(d => {
      if (Math.abs(d.x - wx) < 35) { d.hp -= 1.8; d.x += 6; d.y = 195 - Math.sin(waveEffect.surgeFrame) * 20; }
    });
    if (waveEffect.x > canvas.width + 60) waveEffect.active = false;
  }

  // Draw Detailed Heroes
  drawDetailedHero(hero.x, hero.y, hero.w, hero.h, leadHeroKey, hero.attacking, hero.rotation, hero.kickActive);
  drawDetailedHero(partner.x, partner.y, partner.w, partner.h, partnerHeroKey, false, 0, false);

  // Draw Droids
  droids.forEach(d => drawSyndicateDroid(d));

  // Draw Boss
  if (activeBoss) {
    drawChronoLock(activeBoss.x, activeBoss.y, activeBoss.w, activeBoss.h);
    ctx.fillStyle = "#e74c3c";
    ctx.font = "bold 10px monospace";
    ctx.fillText(activeBoss.name, activeBoss.x - 8, activeBoss.y - 12);
  }

  // MOTHER LUETTA: REAL CODEX & RADIANT GOLDEN INTERVENTION
  if (motherLuetta.active) {
    ctx.save();
    const lx = 240;
    const ly = motherLuetta.y;

    // Outer Celestial Sun Halo
    ctx.shadowColor = "#f1c40f";
    ctx.shadowBlur = 30;
    ctx.strokeStyle = "rgba(255, 215, 0, 0.85)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(lx, ly, 28, 0, Math.PI * 2);
    ctx.stroke();

    // Hooded Golden Ancestral Matriarch
    ctx.fillStyle = "#f39c12"; // Golden Robes
    ctx.beginPath();
    ctx.moveTo(lx - 12, ly + 6);
    ctx.lineTo(lx + 12, ly + 6);
    ctx.lineTo(lx + 18, ly + 36);
    ctx.lineTo(lx - 18, ly + 36);
    ctx.closePath();
    ctx.fill();

    // Head / Hood
    ctx.fillStyle = "#e67e22";
    ctx.beginPath();
    ctx.arc(lx, ly, 9, 0, Math.PI * 2);
    ctx.fill();

    // The Living Ancestral Codex (Book of Marrow Memory)
    ctx.fillStyle = "#ffeaa7";
    ctx.fillRect(lx - 10, ly + 14, 20, 8);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.strokeRect(lx - 10, ly + 14, 20, 8);

    // Radiating Golden Spirals & Battlefield Flash
    if (motherLuetta.beamActive) {
      ctx.strokeStyle = "rgba(255, 240, 170, 0.9)";
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 4; i++) {
        const radius = (globalTick * 3 + i * 25) % 180;
        ctx.beginPath();
        ctx.arc(lx, ly + 16, radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Screen-Clearing Pillar of Light
      const beamGrad = ctx.createLinearGradient(0, ly, 0, 235);
      beamGrad.addColorStop(0, "rgba(255, 234, 167, 0.85)");
      beamGrad.addColorStop(1, "rgba(255, 255, 255, 0.95)");
      ctx.fillStyle = beamGrad;
      ctx.fillRect(0, 0, canvas.width, 235);
    }
    ctx.restore();
  }

  ctx.restore();
}

/* =========================================================
   HUD & MODAL UPDATES
========================================================= */
function updateHUD() {
  const h = HERO_ROSTER[leadHeroKey];
  document.getElementById("hero-hp-bar").style.width = `${(Math.max(0, h.hp) / h.maxHp) * 100}%`;
  document.getElementById("hero-hp-num").innerText = `${Math.ceil(Math.max(0, h.hp))}/${h.maxHp}`;
  document.getElementById("score-text").innerText = `SCORE: ${score}`;
  document.getElementById("wave-counter").innerText = `STAGE [${currentChapterIdx + 1}/3]`;

  if (activeBoss) {
    document.getElementById("hud-boss-name").innerText = activeBoss.name;
    document.getElementById("enemy-hp-bar").style.width = `${(Math.max(0, activeBoss.hp) / activeBoss.maxHp) * 100}%`;
    document.getElementById("enemy-hp-num").innerText = `${Math.ceil(Math.max(0, activeBoss.hp))}/${activeBoss.maxHp}`;
  } else {
    document.getElementById("hud-boss-name").innerText = "DROID WAVE";
    const total = CHAPTERS[currentChapterIdx].droidsToSpawn;
    document.getElementById("enemy-hp-bar").style.width = `${((total - droids.length) / total) * 100}%`;
    document.getElementById("enemy-hp-num").innerText = `${total - droids.length}/${total}`;
  }
}

function showChapterClearModal() {
  const modal = document.getElementById("promo-modal");
  const title = document.getElementById("modal-title");
  const desc = document.getElementById("modal-desc");
  const nextBtn = document.getElementById("next-stage-btn");

  if (currentChapterIdx < CHAPTERS.length - 1) {
    title.innerText = `STAGE ${currentChapterIdx + 1} CLEARED!`;
    desc.innerText = `Perimeter secured. Advance deeper toward Chrono-Lock!`;
    nextBtn.innerText = `Advance to Stage ${currentChapterIdx + 2} ➔`;
    nextBtn.style.display = "block";
  } else {
    title.innerText = "CHRONO-LOCK DEFEATED!";
    desc.innerText = "The Syndicate temporal loop on the Detroit Sky-Spire has shattered! Continue Marcus & Mayleen's full story in Issue #1.";
    nextBtn.style.display = "none";
  }
  modal.style.display = "flex";
}

function advanceToNextStage() {
  document.getElementById("promo-modal").style.display = "none";
  if (currentChapterIdx < CHAPTERS.length - 1) {
    loadChapter(currentChapterIdx + 1);
  }
}

function restartCurrentChapter() {
  document.getElementById("promo-modal").style.display = "none";
  HERO_ROSTER[leadHeroKey].hp = HERO_ROSTER[leadHeroKey].maxHp;
  loadChapter(currentChapterIdx);
}

// Start Game Loop
requestAnimationFrame(update);
</script>
