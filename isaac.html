<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isaac's Detroit Street Racer - Rhodes Family Legacy</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 540px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      margin-bottom: 12px;
    }

    .portal-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #38bdf8;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .game-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 13px;
      font-weight: 800;
      color: #f59e0b;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .btn-turbo {
      background: linear-gradient(180deg, #f59e0b, #b45309);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .btn-action {
      background: linear-gradient(180deg, #0369a1, #0c4a6e);
      border-color: #38bdf8;
      color: #bae6fd;
    }

    .btn-back {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      text-transform: uppercase;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-back:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Isaac's Detroit Street Racer</div>
  </header>

  <div class="game-wrapper">
    <div class="hud-header">
      <span id="scoreText">Distance: 0m</span>
      <span id="speedText">Speed: 65 MPH</span>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="540" height="320"></canvas>
    </div>

    <div class="controls-grid">
      <button class="btn btn-action" ontouchstart="jumpCar()" onmousedown="jumpCar()">▲ JUMP TRAFFIC</button>
      <button class="btn btn-turbo" ontouchstart="activateTurbo()" onmousedown="activateTurbo()">TURBO BOOST 🔥</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Legacy Hub</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let car = {
      x: 80,
      y: 215,
      vy: 0,
      width: 78,
      height: 38,
      isGrounded: true,
      turboTimer: 0
    };

    let traffic = [];
    let worldScroll = 0;
    let distance = 0;
    let speed = 6;
    let spawnTimer = 0;

    function jumpCar() {
      if (car.isGrounded) {
        car.vy = -13;
        car.isGrounded = false;
      }
    }

    function activateTurbo() {
      car.turboTimer = 120;
    }

    function spawnTrafficCar() {
      const types = [
        { color: '#38bdf8', roof: '#0284c7', w: 72, h: 36 },
        { color: '#10b981', roof: '#047857', w: 75, h: 35 },
        { color: '#eab308', roof: '#ca8a04', w: 80, h: 38 }
      ];
      let tType = types[Math.floor(Math.random() * types.length)];
      traffic.push({
        x: canvas.width + 60,
        y: 218,
        width: tType.w,
        height: tType.h,
        speed: 3 + Math.random() * 2,
        color: tType.color,
        roofColor: tType.roof
      });
    }

    function update() {
      car.y += car.vy;
      car.vy += 0.65;

      // Ground level adjusted for wider road
      if (car.y > 215) {
        car.y = 215;
        car.vy = 0;
        car.isGrounded = true;
      }

      let currentSpeed = speed;
      if (car.turboTimer > 0) {
        currentSpeed = 15;
        car.turboTimer--;
      }

      worldScroll += currentSpeed;
      distance += Math.floor(currentSpeed);

      spawnTimer++;
      if (spawnTimer > 90) {
        spawnTimer = 0;
        spawnTrafficCar();
      }

      for (let i = traffic.length - 1; i >= 0; i--) {
        traffic[i].x -= (currentSpeed + traffic[i].speed);
        
        if (
          car.x < traffic[i].x + traffic[i].width - 8 &&
          car.x + car.width - 8 > traffic[i].x &&
          car.y < traffic[i].y + traffic[i].height &&
          car.y + car.height > traffic[i].y
        ) {
          distance = Math.max(0, distance - 60);
          traffic.splice(i, 1);
        } else if (traffic[i].x < -100) {
          traffic.splice(i, 1);
        }
      }

      document.getElementById('scoreText').textContent = `Distance: ${distance}m`;
      document.getElementById('speedText').textContent = `Speed: ${currentSpeed * 12} MPH`;
    }

    function draw() {
      // 1. Detroit Night Sky Gradient
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 200);
      skyGrad.addColorStop(0, '#030712');
      skyGrad.addColorStop(0.6, '#0f172a');
      skyGrad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Overhead Transit Rail / People Mover Structure across skyline
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 75);
      ctx.lineTo(canvas.width, 75);
      ctx.moveTo(0, 85);
      ctx.lineTo(canvas.width, 85);
      ctx.stroke();

      for (let px = -(worldScroll % 120); px < canvas.width; px += 120) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(px, 75, 12, 130);
      }

      // 3. Multi-Layer Detroit Skyline Backdrops
      let skylineOffset = (worldScroll * 0.2) % canvas.width;
      ctx.fillStyle = '#111827';
      for (let i = -1; i < 3; i++) {
        let bx = i * 180 - skylineOffset;
        ctx.fillRect(bx, 100, 50, 140);
        ctx.fillRect(bx + 55, 60, 65, 180);
        ctx.fillRect(bx + 125, 120, 50, 120);

        // Glowing Windows
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(bx + 12, 120, 4, 8);
        ctx.fillRect(bx + 24, 150, 4, 8);
        ctx.fillRect(bx + 70, 80, 5, 10);
        ctx.fillRect(bx + 85, 110, 5, 10);
        ctx.fillStyle = '#111827';
      }

      // 4. Wider Highway Roadway (Taller, Immersive Asphalt)
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 230, canvas.width, 90);

      // Asphalt Surface
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 238, canvas.width, 74);

      // Top Safety Barrier Rail & Posts
      ctx.fillStyle = '#64748b';
      ctx.fillRect(0, 232, canvas.width, 6);
      ctx.fillStyle = '#cbd5e1';
      for (let rx = -(worldScroll % 50); rx < canvas.width; rx += 50) {
        ctx.fillRect(rx, 232, 24, 6);
      }

      // Glowing Lane Markers
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 8;
      ctx.setLineDash([40, 30]);
      ctx.lineDashOffset = -worldScroll;
      ctx.beginPath();
      ctx.moveTo(0, 275);
      ctx.lineTo(canvas.width, 275);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;

      // 5. Draw Traffic Cars
      traffic.forEach(t => {
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.roundRect(t.x, t.y - t.height + 6, t.width, t.height - 6, [8, 14, 4, 4]);
        ctx.fill();

        ctx.fillStyle = t.roofColor;
        ctx.beginPath();
        ctx.roundRect(t.x + 18, t.y - t.height - 10, t.width - 34, 16, [6, 6, 0, 0]);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(t.x + 22, t.y - t.height - 7, t.width - 42, 10);

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
        ctx.fillRect(t.x, t.y - 12, 4, 8);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.arc(t.x + 16, t.y + 6, 9, 0, Math.PI * 2);
        ctx.arc(t.x + t.width - 16, t.y + 6, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.arc(t.x + 16, t.y + 6, 4, 0, Math.PI * 2);
        ctx.arc(t.x + t.width - 16, t.y + 6, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // 6. Draw Player Sports Car (Isaac's Custom Racer)
      ctx.save();
      ctx.translate(car.x, car.y);

      if (car.turboTimer > 0) {
        ctx.fillStyle = '#f97316';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.moveTo(-4, 12);
        ctx.lineTo(-32 - Math.random() * 18, 18);
        ctx.lineTo(-4, 26);
        ctx.closePath();
        ctx.fill();
      }

      ctx.shadowColor = '#000';
      ctx.shadowBlur = 12;

      let carGrad = ctx.createLinearGradient(0, 0, 0, car.height);
      carGrad.addColorStop(0, '#fb923c');
      carGrad.addColorStop(0.5, '#ea580c');
      carGrad.addColorStop(1, '#9a3412');
      ctx.fillStyle = carGrad;
      ctx.beginPath();
      ctx.roundRect(0, 6, car.width, car.height - 6, [10, 20, 6, 6]);
      ctx.fill();

      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.moveTo(18, 6);
      ctx.lineTo(32, -6);
      ctx.lineTo(58, -6);
      ctx.lineTo(64, 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 12;
      ctx.fillRect(car.width - 6, 14, 6, 8);

      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(10, car.height + 2, car.width - 20, 3);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.arc(18, car.height, 10, 0, Math.PI * 2);
      ctx.arc(car.width - 18, car.height, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = car.turboTimer > 0 ? '#ef4444' : '#38bdf8';
      ctx.beginPath();
      ctx.arc(18, car.height, 4.5, 0, Math.PI * 2);
      ctx.arc(car.width - 18, car.height, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
