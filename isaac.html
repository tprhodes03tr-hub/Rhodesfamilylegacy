<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isaac: Vanguard Gauntlet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08090d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }

    #gameContainer {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 56.25vw;
      border: 2px solid #202635;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 210, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* In-Game HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 14px;
      z-index: 10;
    }

    .hud-box {
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 220px;
    }

    .bar-container {
      width: 100%;
      height: 10px;
      background: #222;
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }

    .hp-player { background: #00d2ff; }
    .marrow-energy { background: #d4af37; }
    .hp-boss { background: #ff0055; }

    /* Touch Controls */
    #touchControls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 10;
    }

    .dpad, .action-pad {
      display: flex;
      gap: 8px;
    }

    .btn {
      width: 52px;
      height: 52px;
      background: rgba(20, 26, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: 800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .btn:active {
      background: rgba(0, 210, 255, 0.4);
      transform: scale(0.95);
    }

    .btn-super {
      background: rgba(212, 175, 55, 0.3);
      border-color: #d4af37;
      color: #d4af37;
    }

    /* Screen Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 10, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    .overlay h2 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #00d2ff, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 10px;
    }

    .char-card {
      background: #111622;
      border: 1px solid #232d42;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 140px;
    }

    .char-card.selected {
      border-color: #00d2ff;
      background: #152438;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .char-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .char-card .name { font-size: 0.85rem; font-weight: bold; }
    .char-card .power { font-size: 0.7rem; color: #8b9bb4; margin-top: 2px; }

    .btn-launch {
      padding: 12px 30px;
      background: linear-gradient(135deg, #d4af37, #9b7d1d);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- HUD Overlay -->
  <div id="hud" style="display: none;">
    <div class="hud-box">
      <div style="display:flex; justify-content:space-between;">
        <span id="playerHudName">HERO</span>
        <span id="playerHpTxt">100%</span>
      </div>
      <div class="bar-container">
        <div id="playerHpBar" class="bar-fill hp-player"></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:4px;">
        <span style="font-size:10px; color:#d4af37;">Marrow Resonance (Special)</span>
      </div>
      <div class="bar-container">
        <div id="playerEnergyBar" class="bar-fill marrow-energy" style="width: 0%;"></div>
      </div>
    </div>

    <div class="hud-box" style="text-align: right;">
      <div style="display:flex; justify-content:space-between;">
        <span id="bossHudName">SYNDICATE ADVERSARY</span>
        <span id="bossHpTxt">100%</span>
      </div>
      <div class="bar-container">
        <div id="bossHpBar" class="bar-fill hp-boss"></div>
      </div>
      <div id="bossTier" style="font-size:10px; color:#ff0055; margin-top:4px;">PHASE 1 / 4</div>
    </div>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="touchControls" style="display: none;">
    <div class="dpad">
      <button class="btn" id="btnLeft">◄</button>
      <button class="btn" id="btnRight">►</button>
      <button class="btn" id="btnJump">▲</button>
    </div>
    <div class="action-pad">
      <button class="btn" id="btnAttack">ATK</button>
      <button class="btn btn-super" id="btnSpecial">SUPER</button>
    </div>
  </div>

  <!-- Character Roster Selection -->
  <div class="overlay" id="rosterOverlay">
    <h2>Select Vanguard Operative</h2>
    <div class="select-grid" id="rosterList"></div>
    <button class="btn-launch" onclick="startGame()">Initiate Battle</button>
  </div>

  <!-- Gauntlet Victory Overlay -->
  <div class="overlay" id="victoryOverlay" style="display: none;">
    <h2>Iron Syndicate Purged</h2>
    <p style="margin-bottom: 20px; max-width: 480px; color: #a1b0cb;">
      All Iron Syndicate line anchors have collapsed under Marrow Resonance. The Ancestral Vault is unlocked.
    </p>
    <button class="btn-launch" onclick="routeToPayhip()">Claim Full Legacy Access</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const PAYHIP_URL = "https://payhip.com/rhodesfamilylegacy";

  // Web Audio Context Synthesizer (Instant SFX Engine)
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'hit') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } 
    else if (type === 'super') {
      // Thunderous sub-harmonic impact
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(25, now + 0.6);
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.6);
    } 
    else if (type === 'jump') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(380, now + 0.15);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }
    else if (type === 'shield') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  }

  // Screen Shake Mechanics
  let shakeIntensity = 0;
  let shakeDuration = 0;

  function triggerShake(intensity, duration) {
    shakeIntensity = intensity;
    shakeDuration = duration;
  }

  // Assets Mapped to GitHub Root
  const SPRITES = {
    "mother-luta": "./mother-luta.png",
    "marcus": "./marcus.png",
    "sundiata-prime": "./sundiata-prime.png",
    "amina": "./amina.png",
    "akecheta": "./akecheta.png",
    "matteo": "./matteo.png",
    "elena": "./elena.png",
    "shadow-kensei": "./shadow-kensei.png",
    "xochitl": "./xochitl.png",
    "null-byte": "./null-byte.png",
    "vipera": "./vipera.png",
    "ironclad": "./ironclad.png",
    "apex-volt": "./apex-volt.png"
  };

  const images = {};
  for (let key in SPRITES) {
    images[key] = new Image();
    images[key].src = SPRITES[key];
  }

  const HERO_DATA = {
    "mother-luta": {
      name: "Mother Luta",
      powerTitle: "Ascension Wipe & Full Heal",
      speed: 4.5,
      attackDmg: 22,
      castSuper: (p, enemies) => {
        p.hp = 100;
        screenFlash = { color: "rgba(255, 230, 100, 0.85)", timer: 35 };
        triggerShake(16, 30);
        playSound('super');
        enemies.forEach(e => e.takeDamage(80));
      }
    },
    "marcus": {
      name: "Marcus",
      powerTitle: "Kinetic Fortress Barrier",
      speed: 4,
      attackDmg: 24,
      castSuper: (p) => {
        p.shieldTimer = 300;
        screenFlash = { color: "rgba(0, 210, 255, 0.5)", timer: 15 };
        triggerShake(6, 12);
        playSound('shield');
      }
    },
    "sundiata-prime": {
      name: "Sundiata Prime",
      powerTitle: "Bronze Dundun Resonance Shock",
      speed: 5,
      attackDmg: 25,
      castSuper: (p, enemies) => {
        screenFlash = { color: "rgba(212, 175, 55, 0.6)", timer: 20 };
        triggerShake(12, 22);
        playSound('super');
        enemies.forEach(e => e.takeDamage(65));
      }
    },
    "amina": {
      name: "Amina",
      powerTitle: "Celestial Hard-Light Spear Dive",
      speed: 6,
      attackDmg: 26,
      castSuper: (p, enemies) => {
        p.x += 180;
        triggerShake(10, 18);
        playSound('super');
        enemies.forEach(e => {
          if (Math.abs(e.x - p.x) < 220) e.takeDamage(75);
        });
        screenFlash = { color: "rgba(100, 180, 255, 0.6)", timer: 15 };
      }
    },
    "matteo": {
      name: "Matteo",
      powerTitle: "Tectonic Tremor Spire",
      speed: 3.5,
      attackDmg: 30,
      castSuper: (p, enemies) => {
        triggerShake(15, 25);
        playSound('super');
        enemies.forEach(e => {
          e.takeDamage(55);
          e.stunTimer = 120;
        });
        screenFlash = { color: "rgba(130, 90, 50, 0.6)", timer: 15 };
      }
    },
    "elena": {
      name: "Elena",
      powerTitle: "Petrified Root Barricade",
      speed: 4.8,
      attackDmg: 20,
      castSuper: (p, enemies) => {
        triggerShake(7, 15);
        playSound('super');
        enemies.forEach(e => e.stunTimer = 180);
        screenFlash = { color: "rgba(50, 200, 100, 0.6)", timer: 15 };
      }
    },
    "akecheta": {
      name: "Akecheta",
      powerTitle: "Gale-Force Atmospheric Counter",
      speed: 5.5,
      attackDmg: 23,
      castSuper: (p, enemies) => {
        triggerShake(9, 18);
        playSound('super');
        enemies.forEach(e => {
          e.x += (e.x > p.x ? 250 : -250);
          e.takeDamage(45);
        });
        screenFlash = { color: "rgba(200, 230, 255, 0.6)", timer: 15 };
      }
    },
    "shadow-kensei": {
      name: "Shadow Kensei",
      powerTitle: "Dual-Blade Cleave",
      speed: 5.8,
      attackDmg: 28,
      castSuper: (p, enemies) => {
        triggerShake(13, 20);
        playSound('super');
        enemies.forEach(e => {
          if (Math.abs(e.x - p.x) < 190) e.takeDamage(90);
        });
        screenFlash = { color: "rgba(220, 220, 255, 0.8)", timer: 12 };
      }
    },
    "xochitl": {
      name: "Xochitl",
      powerTitle: "Solar Flare Flash",
      speed: 5.2,
      attackDmg: 24,
      castSuper: (p, enemies) => {
        triggerShake(10, 20);
        playSound('super');
        enemies.forEach(e => e.takeDamage(60));
        screenFlash = { color: "rgba(255, 180, 0, 0.7)", timer: 20 };
      }
    }
  };

  const BOSS_SEQUENCE = [
    { id: "null-byte", name: "Null-Byte", hp: 120, speed: 3.5, power: 12 },
    { id: "vipera", name: "Vipera", hp: 160, speed: 4.2, power: 15 },
    { id: "ironclad", name: "Ironclad", hp: 220, speed: 2.2, power: 22 },
    { id: "apex-volt", name: "Apex Volt", hp: 300, speed: 4.8, power: 28 }
  ];

  let selectedHeroKey = "sundiata-prime";
  let activeBossIndex = 0;
  let player = null;
  let currentBoss = null;
  let screenFlash = null;
  let gameRunning = false;
  let keys = { left: false, right: false, up: false, atk: false, sp: false };

  // Setup Roster Selector
  const rosterContainer = document.getElementById("rosterList");
  for (let key in HERO_DATA) {
    const card = document.createElement("div");
    card.className = `char-card ${key === selectedHeroKey ? "selected" : ""}`;
    card.onclick = () => {
      document.querySelectorAll(".char-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedHeroKey = key;
    };
    card.innerHTML = `
      <img src="${SPRITES[key]}" alt="${HERO_DATA[key].name}">
      <div class="name">${HERO_DATA[key].name}</div>
      <div class="power">${HERO_DATA[key].powerTitle}</div>
    `;
    rosterContainer.appendChild(card);
  }

  class Entity {
    constructor(x, y, w, h, spriteKey) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.h = h;
      this.spriteKey = spriteKey;
      this.vx = 0;
      this.vy = 0;
      this.isGrounded = false;
    }

    draw() {
      const img = images[this.spriteKey];
      if (img && img.complete) {
        ctx.drawImage(img, this.x, this.y, this.w, this.h);
      } else {
        ctx.fillStyle = "#555";
        ctx.fillRect(this.x, this.y, this.w, this.h);
      }
    }

    applyPhysics() {
      this.vy += 0.8;
      this.y += this.vy;
      this.x += this.vx;

      if (this.y > 380) {
        this.y = 380;
        this.vy = 0;
        this.isGrounded = true;
      }

      if (this.x < 0) this.x = 0;
      if (this.x > canvas.width - this.w) this.x = canvas.width - this.w;
    }
  }

  class Player extends Entity {
    constructor(heroKey) {
      super(120, 380, 80, 110, heroKey);
      this.hero = HERO_DATA[heroKey];
      this.hp = 100;
      this.energy = 0;
      this.shieldTimer = 0;
      this.attackCooldown = 0;
    }

    update() {
      this.vx = 0;
      if (keys.left) this.vx = -this.hero.speed;
      if (keys.right) this.vx = this.hero.speed;
      if (keys.up && this.isGrounded) {
        this.vy = -14;
        this.isGrounded = false;
        playSound('jump');
      }

      if (this.shieldTimer > 0) this.shieldTimer--;
      if (this.attackCooldown > 0) this.attackCooldown--;

      this.applyPhysics();

      if (this.energy < 100) this.energy += 0.15;
    }

    draw() {
      super.draw();
      if (this.shieldTimer > 0) {
        ctx.strokeStyle = "rgba(0, 210, 255, 0.85)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(this.x + this.w / 2, this.y + this.h / 2, 65, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    attack(target) {
      if (this.attackCooldown <= 0) {
        this.attackCooldown = 18;
        if (Math.abs((this.x + this.w / 2) - (target.x + target.w / 2)) < 110) {
          target.takeDamage(this.hero.attackDmg);
          this.energy = Math.min(100, this.energy + 10);
          triggerShake(5, 8);
          playSound('hit');
        }
      }
    }

    special(enemies) {
      if (this.energy >= 100) {
        this.energy = 0;
        this.hero.castSuper(this, enemies);
      }
    }

    takeDamage(amount) {
      if (this.shieldTimer > 0) {
        playSound('shield');
        triggerShake(3, 6);
        return;
      }
      this.hp = Math.max(0, this.hp - amount);
      triggerShake(8, 12);
      playSound('hit');
      if (this.hp <= 0) {
        alert("Lineage defense breach! Restarting encounter...");
        resetEncounter();
      }
    }
  }

  class Boss extends Entity {
    constructor(config) {
      super(740, 380, 95, 120, config.id);
      this.config = config;
      this.maxHp = config.hp;
      this.hp = config.hp;
      this.attackTimer = 0;
      this.stunTimer = 0;
    }

    update(target) {
      if (this.stunTimer > 0) {
        this.stunTimer--;
        this.vx = 0;
        this.applyPhysics();
        return;
      }

      this.vx = (target.x > this.x ? this.config.speed : -this.config.speed);

      this.attackTimer++;
      if (this.attackTimer > 60) {
        this.attackTimer = 0;
        if (Math.abs((this.x + this.w / 2) - (target.x + target.w / 2)) < 100) {
          target.takeDamage(this.config.power);
        }
      }

      this.applyPhysics();
    }

    takeDamage(amount) {
      this.hp = Math.max(0, this.hp - amount);
      if (this.hp <= 0) {
        advanceGauntlet();
      }
    }
  }

  function startGame() {
    initAudio();
    document.getElementById("rosterOverlay").style.display = "none";
    document.getElementById("hud").style.display = "flex";
    document.getElementById("touchControls").style.display = "flex";
    resetEncounter();
    gameRunning = true;
    requestAnimationFrame(gameLoop);
  }

  function resetEncounter() {
    player = new Player(selectedHeroKey);
    loadBoss(activeBossIndex);
  }

  function loadBoss(index) {
    const config = BOSS_SEQUENCE[index];
    currentBoss = new Boss(config);
    document.getElementById("bossHudName").innerText = config.name;
    document.getElementById("bossTier").innerText = `PHASE ${index + 1} / 4`;
    document.getElementById("playerHudName").innerText = player.hero.name;
  }

  function advanceGauntlet() {
    activeBossIndex++;
    triggerShake(14, 25);
    playSound('super');
    if (activeBossIndex >= BOSS_SEQUENCE.length) {
      gameRunning = false;
      document.getElementById("victoryOverlay").style.display = "flex";
    } else {
      loadBoss(activeBossIndex);
    }
  }

  function routeToPayhip() {
    window.location.href = PAYHIP_URL;
  }

  // Keyboard Event Handlers
  window.addEventListener("keydown", e => {
    initAudio();
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
    if (e.code === "Space" || e.code === "KeyJ") player.attack(currentBoss);
    if (e.code === "KeyK") player.special([currentBoss]);
  });

  window.addEventListener("keyup", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
  });

  // Touch Event Handlers
  const bindTouch = (id, onDown, onUp) => {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); onDown(); });
    el.addEventListener("touchend", (e) => { e.preventDefault(); if (onUp) onUp(); });
  };

  bindTouch("btnLeft", () => keys.left = true, () => keys.left = false);
  bindTouch("btnRight", () => keys.right = true, () => keys.right = false);
  bindTouch("btnJump", () => {
    if (player.isGrounded) { 
      player.vy = -14; 
      player.isGrounded = false; 
      playSound('jump');
    }
  });
  bindTouch("btnAttack", () => player.attack(currentBoss));
  bindTouch("btnSpecial", () => player.special([currentBoss]));

  // Main Loop with Screen Shake and Effects
  function gameLoop() {
    if (!gameRunning) return;

    ctx.save();

    // Compute Screen Shake Offset
    if (shakeDuration > 0) {
      const offsetX = (Math.random() - 0.5) * shakeIntensity;
      const offsetY = (Math.random() - 0.5) * shakeIntensity;
      ctx.translate(offsetX, offsetY);
      shakeDuration--;
    }

    // Clear Screen & Draw Scenery
    ctx.fillStyle = "#0c1017";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Floor Plate
    ctx.fillStyle = "#151b26";
    ctx.fillRect(0, 490, canvas.width, 50);
    ctx.strokeStyle = "#00d2ff";
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 490, canvas.width, 1);

    // Updates
    player.update();
    currentBoss.update(player);

    // Renders
    player.draw();
    currentBoss.draw();

    // Visual Super Effects
    if (screenFlash && screenFlash.timer > 0) {
      ctx.fillStyle = screenFlash.color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      screenFlash.timer--;
    }

    ctx.restore();

    // Update HUD
    document.getElementById("playerHpBar").style.width = `${player.hp}%`;
    document.getElementById("playerHpTxt").innerText = `${Math.ceil(player.hp)}%`;
    document.getElementById("playerEnergyBar").style.width = `${player.energy}%`;
    document.getElementById("bossHpBar").style.width = `${(currentBoss.hp / currentBoss.maxHp) * 100}%`;
    document.getElementById("bossHpTxt").innerText = `${Math.ceil((currentBoss.hp / currentBoss.maxHp) * 100)}%`;

    requestAnimationFrame(gameLoop);
  }
</script>
</body>
</html>
