<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard | Full Roster Arcade Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090a10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 20, 32, 0.95);
      border-bottom: 2px solid #8b5cf6;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
    }
    header h1 {
      font-size: 1.05rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
    }
    #active-hero-badge {
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: bold;
    }
    /* Roster Selection Bar */
    #roster-bar {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 8px 10px;
      background: #111827;
      border: 1px solid #374151;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    .roster-card {
      background: #1f2937;
      border: 2px solid #4b5563;
      border-radius: 6px;
      padding: 6px 2px;
      text-align: center;
      font-size: 0.72rem;
      cursor: pointer;
      color: #cbd5e1;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .roster-card.active {
      border-color: #38bdf8;
      background: #0369a1;
      color: #fff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      transform: translateY(-2px);
    }
    /* Game Stage */
    #game-container {
      position: relative;
      margin-top: 8px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #3b0764;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Arcade Touch Controls */
    #touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      padding: 10px 14px;
      gap: 15px;
      margin-top: 6px;
    }
    .control-cluster {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .action-cluster {
      justify-content: flex-end;
    }
    .btn {
      background: rgba(30, 27, 75, 0.85);
      border: 2px solid #a855f7;
      color: #e9d5ff;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);
      cursor: pointer;
    }
    .btn:active, .btn.pressed {
      background: #7e22ce;
      transform: scale(0.92);
    }
    .btn-action {
      border-radius: 12px;
      width: 84px;
      height: 54px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-attack { border-color: #38bdf8; color: #bae6fd; }
    .btn-ability { border-color: #f59e0b; color: #fef3c7; }
    .status-bar {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      font-size: 0.78rem;
      color: #a78bfa;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ancestral Vanguard</h1>
    <div id="active-hero-badge">MARCUS</div>
  </header>

  <!-- Interactive 6-Fighter Selection Grid -->
  <div id="roster-bar">
    <div class="roster-card active" onclick="selectFighter('marcus')">MARCUS</div>
    <div class="roster-card" onclick="selectFighter('chronolock')">CHRONO</div>
    <div class="roster-card" onclick="selectFighter('motherluta')">M. LUTA</div>
    <div class="roster-card" onclick="selectFighter('xochitl')">XOCHITL</div>
    <div class="roster-card" onclick="selectFighter('apexvolt')">APEX VOLT</div>
    <div class="roster-card" onclick="selectFighter('amina')">AMINA</div>
  </div>

  <div id="game-container">
    <canvas id="stage" width="800" height="450"></canvas>
  </div>

  <div class="status-bar">
    <span>[A/D] Move</span>
    <span>[W] Jump</span>
    <span>[J] Attack</span>
    <span>[K] Super Ability</span>
  </div>

  <div id="touch-controls">
    <div class="control-cluster">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
      <button class="btn" id="btn-jump">▲</button>
    </div>
    <div class="control-cluster action-cluster">
      <button class="btn btn-action btn-attack" id="btn-atk">STRIKE</button>
      <button class="btn btn-action btn-ability" id="btn-power">SUPER</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const heroBadge = document.getElementById('active-hero-badge');

    // Combat Roster Registry & Unique Superpowers
    const ROSTER = {
      marcus: {
        name: 'MARCUS (ANCHOR)',
        file: 'marcus-hero.png',
        speed: 4.8,
        gravity: 0.85,
        jumpForce: -14,
        scaleW: 120,
        scaleH: 150,
        color: '#a855f7',
        abilityName: 'SEISMIC SLAM',
        onSuper: (hero) => {
          screenShake = 14;
          shockwaves.push({ x: hero.x + (hero.facing === 1 ? hero.w : 0), y: hero.groundY + hero.h - 10, radius: 10, maxRadius: 130, alpha: 1, color: '#38bdf8' });
          for (let i = 0; i < 24; i++) {
            particles.push({
              x: hero.x + (hero.facing === 1 ? hero.w : 0),
              y: hero.groundY + hero.h - 10,
              vx: (Math.random() - 0.2 * hero.facing) * 9 * hero.facing,
              vy: -(Math.random() * 9 + 4),
              size: Math.random() * 6 + 3,
              color: Math.random() > 0.5 ? '#a855f7' : '#38bdf8',
              life: 28
            });
          }
        }
      },
      chronolock: {
        name: 'CHRONOLOCK (TEMPORAL)',
        file: 'chronolock-hero.png',
        speed: 3.8,
        gravity: 0.75,
        jumpForce: -13,
        scaleW: 135,
        scaleH: 155,
        color: '#10b981',
        abilityName: 'TEMPORAL STASIS',
        onSuper: (hero) => {
          screenShake = 6;
          // Temporal Dial Shockwave
          shockwaves.push({ x: hero.x + hero.w / 2, y: hero.y + hero.h / 2, radius: 20, maxRadius: 160, alpha: 1, color: '#10b981' });
          // Rotating Gear Orbs
          for (let i = 0; i < 16; i++) {
            particles.push({
              x: hero.x + hero.w / 2,
              y: hero.y + hero.h / 2,
              vx: Math.cos(i) * 6,
              vy: Math.sin(i) * 6,
              size: 7,
              color: '#34d399',
              life: 35
            });
          }
        }
      },
      motherluta: {
        name: 'MOTHER LUTA (MYSTIC)',
        file: 'mother-luta.png',
        speed: 5.2,
        gravity: 0.45, // Mystic levitation
        jumpForce: -12,
        scaleW: 110,
        scaleH: 145,
        color: '#fbbf24',
        abilityName: 'TOME RADIANCE',
        onSuper: (hero) => {
          screenShake = 8;
          for (let i = 0; i < 30; i++) {
            particles.push({
              x: hero.x + hero.w / 2 + (Math.random() - 0.5) * 40,
              y: hero.y + 40,
              vx: (Math.random() - 0.5) * 12,
              vy: -(Math.random() * 8 + 3),
              size: Math.random() * 5 + 4,
              color: Math.random() > 0.4 ? '#f59e0b' : '#fef08a',
              life: 40
            });
          }
        }
      },
      xochitl: {
        name: 'XOCHITL (FLAME CLAW)',
        file: 'xochitl.png',
        speed: 6.0,
        gravity: 0.8,
        jumpForce: -15,
        scaleW: 115,
        scaleH: 148,
        color: '#ea580c',
        abilityName: 'FEATHER RUSH',
        onSuper: (hero) => {
          screenShake = 10;
          hero.vx = hero.facing * 18; // Fiery forward dash
          for (let i = 0; i < 25; i++) {
            particles.push({
              x: hero.x + (hero.facing === 1 ? 0 : hero.w),
              y: hero.y + hero.h / 2 + (Math.random() - 0.5) * 40,
              vx: -hero.facing * (Math.random() * 8 + 2),
              vy: (Math.random() - 0.5) * 6,
              size: Math.random() * 6 + 3,
              color: Math.random() > 0.5 ? '#f97316' : '#ef4444',
              life: 30
            });
          }
        }
      },
      apexvolt: {
        name: 'APEX VOLT (ELECTRIC)',
        file: 'apex-volt.png',
        speed: 5.0,
        gravity: 0.82,
        jumpForce: -14,
        scaleW: 125,
        scaleH: 152,
        color: '#06b6d4',
        abilityName: 'VOLT OVERLOAD',
        onSuper: (hero) => {
          screenShake = 12;
          for (let i = 0; i < 35; i++) {
            particles.push({
              x: hero.x + hero.w / 2,
              y: hero.y + hero.h / 2,
              vx: (Math.random() - 0.5) * 16,
              vy: (Math.random() - 0.5) * 16,
              size: Math.random() * 5 + 2,
              color: '#38bdf8',
              life: 25
            });
          }
        }
      },
      amina: {
        name: 'AMINA (SPEAR VANGUARD)',
        file: 'amina.png',
        speed: 5.5,
        gravity: 0.82,
        jumpForce: -14.5,
        scaleW: 115,
        scaleH: 150,
        color: '#e11d48',
        abilityName: 'PIERCING LUNGE',
        onSuper: (hero) => {
          screenShake = 9;
          hero.vx = hero.facing * 14;
          shockwaves.push({ x: hero.x + (hero.facing === 1 ? hero.w + 40 : -40), y: hero.y + hero.h * 0.6, radius: 5, maxRadius: 75, alpha: 1, color: '#f43f5e' });
          for (let i = 0; i < 20; i++) {
            particles.push({
              x: hero.x + (hero.facing === 1 ? hero.w : 0),
              y: hero.y + hero.h * 0.6,
              vx: hero.facing * (Math.random() * 10 + 4),
              vy: (Math.random() - 0.5) * 4,
              size: Math.random() * 5 + 2,
              color: '#fb7185',
              life: 22
            });
          }
        }
      }
    };

    // Preload all 6 character sprites
    const loadedImages = {};
    Object.keys(ROSTER).forEach(key => {
      const img = new Image();
      img.src = ROSTER[key].file;
      loadedImages[key] = { img, ready: false };
      img.onload = () => { loadedImages[key].ready = true; };
    });

    // Active Combat State
    let activeKey = 'marcus';
    let currentConfig = ROSTER[activeKey];
    let screenShake = 0;
    const particles = [];
    const shockwaves = [];

    const hero = {
      x: 160,
      y: 260,
      w: currentConfig.scaleW,
      h: currentConfig.scaleH,
      vx: 0,
      vy: 0,
      facing: 1,
      isGrounded: true,
      state: 'idle',
      cooldown: 0,
      auraTick: 0,
      groundY: 260
    };

    // Character Switcher
    window.selectFighter = function(key) {
      if (!ROSTER[key]) return;
      activeKey = key;
      currentConfig = ROSTER[key];
      hero.w = currentConfig.scaleW;
      hero.h = currentConfig.scaleH;
      heroBadge.textContent = currentConfig.name;
      heroBadge.style.color = currentConfig.color;

      document.querySelectorAll('.roster-card').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
    };

    // Controls
    const keys = { left: false, right: false, up: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'ArrowUp') triggerJump();
      if (e.key === 'j' || e.key === 'z') triggerAttack();
      if (e.key === 'k' || e.key === 'x') triggerSuper();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });

    function bindBtn(id, downFn, upFn) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); downFn(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (upFn) upFn(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); downFn(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if (upFn) upFn(); });
    }

    bindBtn('btn-left', () => keys.left = true, () => keys.left = false);
    bindBtn('btn-right', () => keys.right = true, () => keys.right = false);
    bindBtn('btn-jump', () => triggerJump());
    bindBtn('btn-atk', () => triggerAttack());
    bindBtn('btn-power', () => triggerSuper());

    function triggerJump() {
      if (hero.isGrounded) {
        hero.vy = currentConfig.jumpForce;
        hero.isGrounded = false;
      }
    }

    function triggerAttack() {
      if (hero.cooldown === 0) {
        hero.state = 'attack';
        hero.cooldown = 20;
        screenShake = 6;
        for (let i = 0; i < 10; i++) {
          particles.push({
            x: hero.x + (hero.facing === 1 ? hero.w : 0),
            y: hero.y + hero.h * 0.5,
            vx: hero.facing * (Math.random() * 6 + 2),
            vy: (Math.random() - 0.5) * 4,
            size: 4,
            color: currentConfig.color,
            life: 18
          });
        }
      }
    }

    function triggerSuper() {
      if (hero.cooldown === 0) {
        hero.state = 'super';
        hero.cooldown = 32;
        currentConfig.onSuper(hero);
      }
    }

    function update() {
      if (screenShake > 0) screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;

      if (hero.cooldown > 0) {
        hero.cooldown--;
        if (hero.cooldown === 0) hero.state = 'idle';
      }

      // Horizontal Motion
      if (keys.left) {
        hero.vx = -currentConfig.speed;
        hero.facing = -1;
      } else if (keys.right) {
        hero.vx = currentConfig.speed;
        hero.facing = 1;
      } else {
        hero.vx *= 0.8;
      }

      hero.x += hero.vx;
      hero.y += hero.vy;

      // Gravity Curve
      if (!hero.isGrounded) {
        hero.vy += currentConfig.gravity;
        if (hero.y >= hero.groundY) {
          hero.y = hero.groundY;
          hero.vy = 0;
          hero.isGrounded = true;
        }
      }

      // Arena Bounds
      if (hero.x < 10) hero.x = 10;
      if (hero.x + hero.w > canvas.width - 10) hero.x = canvas.width - hero.w - 10;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 5;
        sw.alpha -= 0.04;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      hero.auraTick += 0.08;
    }

    function render() {
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Arena Backdrop
      ctx.fillStyle = '#0a0d17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ancestral Ley-Line Neon Grid
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.15)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Floor Stage
      const floorY = hero.groundY + hero.h - 5;
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
      ctx.strokeStyle = currentConfig.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(canvas.width, floorY);
      ctx.stroke();

      // Shockwaves
      shockwaves.forEach(sw => {
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 4;
        ctx.stroke();
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // Draw Active Fighter
      ctx.save();
      ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
      ctx.scale(hero.facing, 1);

      const breathe = Math.sin(hero.auraTick) * 2;
      ctx.shadowColor = currentConfig.color;
      ctx.shadowBlur = hero.state === 'super' ? 30 : 12;

      const activeAsset = loadedImages[activeKey];
      if (activeAsset && activeAsset.ready) {
        ctx.drawImage(
          activeAsset.img,
          -hero.w / 2,
          -hero.h / 2 - breathe,
          hero.w,
          hero.h + breathe
        );
      } else {
        // Fallback Silhouette with Fighter Colors
        ctx.fillStyle = currentConfig.color;
        ctx.fillRect(-hero.w / 2, -hero.h / 2, hero.w, hero.h);
      }

      ctx.restore();
      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
