<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Legacy - Pro Arcade Lounge</title>
    <style>
        :root {
            --gold: #f39c12;
            --dark-bg: #07090f;
            --panel-bg: #121824;
            --neon-blue: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--gold);
        }

        .hub-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
        }

        .game-card {
            background: var(--panel-bg);
            border: 2px solid #2d3748;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #fff;
        }

        .canvas-container {
            width: 100%;
            height: 380px;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            background: var(--gold);
            color: #000;
        }

        .action-btn:hover {
            background: #e67e22;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rhodes Family Legacy</h1>
        <p style="font-size: 0.85rem; color: #a0aec0;">Pro Arcade Lounge Experience</p>
    </header>

    <div class="hub-container">
        <!-- Pool Table Game -->
        <div class="game-card">
            <div class="game-title">🎱 Syndicate 8-Ball Pro</div>
            <div class="canvas-container">
                <canvas id="poolCanvas" width="340" height="360"></canvas>
            </div>
            <div class="controls-row">
                <button class="action-btn" onclick="strikePool()">Strike Ball</button>
                <button class="action-btn" style="background:#2d3748;color:#fff;" onclick="resetPool()">Rerack</button>
            </div>
        </div>

        <!-- Bowling Game -->
        <div class="game-card">
            <div class="game-title">🎳 Jackrabbit Pins Pro</div>
            <div class="canvas-container">
                <canvas id="bowlCanvas" width="340" height="360"></canvas>
            </div>
            <div class="controls-row">
                <button class="action-btn" onclick="releaseBowl()">Release</button>
                <button class="action-btn" style="background:#2d3748;color:#fff;" onclick="resetBowl()">Reset Pins</button>
            </div>
        </div>
    </div>

    <script>
        // --- Pool Table Implementation ---
        const poolCanvas = document.getElementById('poolCanvas');
        const poolCtx = poolCanvas.getContext('2d');
        
        let cueBall = { x: 170, y: 280, radius: 10 };
        let targetBalls = [
            { x: 170, y: 120, color: '#f39c12', num: 1 },
            { x: 155, y: 104, color: '#2980b9', num: 2 },
            { x: 185, y: 104, color: '#c0392b', num: 3 },
            { x: 140, y: 88, color: '#8e44ad', num: 4 },
            { x: 170, y: 88, color: '#d35400', num: 5 },
            { x: 200, y: 88, color: '#27ae60', num: 6 }
        ];
        let aimX = 170, aimY = 60;
        let isAiming = true;

        function drawPool() {
            // Wood Border
            poolCtx.fillStyle = '#4a2c11';
            poolCtx.fillRect(10, 10, 320, 340);

            // Green Felt
            poolCtx.fillStyle = '#0f5132';
            poolCtx.fillRect(25, 25, 290, 310);

            // Pockets
            poolCtx.fillStyle = '#000';
            const pockets = [[25,25], [170,20], [315,25], [25,335], [170,340], [315,335]];
            pockets.forEach(p => {
                poolCtx.beginPath();
                poolCtx.arc(p[0], p[1], 12, 0, Math.PI * 2);
                poolCtx.fill();
            });

            // Aim Line & Guide
            if (isAiming) {
                poolCtx.strokeStyle = 'rgba(0, 210, 255, 0.6)';
                poolCtx.lineWidth = 3;
                poolCtx.setLineDash([4, 4]);
                poolCtx.beginPath();
                poolCtx.moveTo(cueBall.x, cueBall.y);
                poolCtx.lineTo(aimX, aimY);
                poolCtx.stroke();
                poolCtx.setLineDash([]);

                // Cue Stick
                poolCtx.strokeStyle = '#d4a373';
                poolCtx.lineWidth = 6;
                poolCtx.beginPath();
                poolCtx.moveTo(cueBall.x, cueBall.y + 20);
                poolCtx.lineTo(cueBall.x, cueBall.y + 160);
                poolCtx.stroke();
            }

            // Target Balls (Reracked Triangle)
            targetBalls.forEach(b => {
                poolCtx.fillStyle = b.color;
                poolCtx.beginPath();
                poolCtx.arc(b.x, b.y, 9, 0, Math.PI * 2);
                poolCtx.fill();
                poolCtx.strokeStyle = '#fff';
                poolCtx.lineWidth = 1;
                poolCtx.stroke();
            });

            // Cue Ball
            poolCtx.fillStyle = '#ffffff';
            poolCtx.beginPath();
            poolCtx.arc(cueBall.x, cueBall.y, 10, 0, Math.PI * 2);
            poolCtx.fill();
            poolCtx.strokeStyle = '#ccc';
            poolCtx.stroke();
        }

        function strikePool() {
            if (!isAiming) return;
            isAiming = false;
            let timer = setInterval(() => {
                cueBall.y -= 8;
                if (cueBall.y <= 140) {
                    targetBalls[0].y -= 25;
                    targetBalls[1].x -= 15;
                    targetBalls[2].x += 15;
                    clearInterval(timer);
                }
                drawPool();
            }, 25);
        }

        function resetPool() {
            cueBall = { x: 170, y: 280, radius: 10 };
            targetBalls = [
                { x: 170, y: 120, color: '#f39c12', num: 1 },
                { x: 155, y: 104, color: '#2980b9', num: 2 },
                { x: 185, y: 104, color: '#c0392b', num: 3 },
                { x: 140, y: 88, color: '#8e44ad', num: 4 },
                { x: 170, y: 88, color: '#d35400', num: 5 },
                { x: 200, y: 88, color: '#27ae60', num: 6 }
            ];
            isAiming = true;
            drawPool();
        }

        poolCanvas.addEventListener('touchmove', (e) => {
            const rect = poolCanvas.getBoundingClientRect();
            aimX = e.touches[0].clientX - rect.left;
            aimY = e.touches[0].clientY - rect.top;
            if (isAiming) drawPool();
        });

        // --- Bowling Alley Implementation ---
        const bowlCanvas = document.getElementById('bowlCanvas');
        const bowlCtx = bowlCanvas.getContext('2d');

        let bowlBall = { x: 170, y: 310, radius: 12, rolling: false };
        let pins = [
            { x: 170, y: 70 },
            { x: 155, y: 85 }, { x: 185, y: 85 },
            { x: 140, y: 100 }, { x: 170, y: 100 }, { x: 200, y: 100 }
        ];

        function drawBowling() {
            // Retro Arcade Alley Background
            bowlCtx.fillStyle = '#1a0033';
            bowlCtx.fillRect(0, 0, 340, 360);

            // Wooden Lane Perspective
            bowlCtx.fillStyle = '#d2691e';
            bowlCtx.beginPath();
            bowlCtx.moveTo(80, 360);
            bowlCtx.lineTo(260, 360);
            bowlCtx.lineTo(200, 50);
            bowlCtx.lineTo(140, 50);
            bowlCtx.fill();

            // Lane Gutters
            bowlCtx.fillStyle = '#0b0f19';
            bowlCtx.fillRect(60, 50, 20, 310);
            bowlCtx.fillRect(260, 50, 20, 310);

            // Pins
            pins.forEach(p => {
                bowlCtx.fillStyle = '#ffffff';
                bowlCtx.beginPath();
                bowlCtx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                bowlCtx.fill();
                bowlCtx.strokeStyle = '#ff3366';
                bowlCtx.lineWidth = 1.5;
                bowlCtx.stroke();
            });

            // Bowling Ball (Shield / Star Pattern style)
            bowlCtx.fillStyle = '#00d2ff';
            bowlCtx.beginPath();
            bowlCtx.arc(bowlBall.x, bowlBall.y, bowlBall.radius, 0, Math.PI * 2);
            bowlCtx.fill();
            bowlCtx.strokeStyle = '#ffffff';
            bowlCtx.lineWidth = 2;
            bowlCtx.stroke();
        }

        function releaseBowl() {
            if (bowlBall.rolling) return;
            bowlBall.rolling = true;
            let rollInterval = setInterval(() => {
                bowlBall.y -= 12;
                if (bowlBall.y <= 120) {
                    pins.forEach(p => p.y -= 20); // Pin scattering action
                    clearInterval(rollInterval);
                }
                drawBowling();
            }, 25);
        }

        function resetBowl() {
            bowlBall = { x: 170, y: 310, radius: 12, rolling: false };
            pins = [
                { x: 170, y: 70 },
                { x: 155, y: 85 }, { x: 185, y: 85 },
                { x: 140, y: 100 }, { x: 170, y: 100 }, { x: 200, y: 100 }
            ];
            drawBowling();
        }

        // Initial Renders
        drawPool();
        drawBowling();
    </script>
</body>
</html>
