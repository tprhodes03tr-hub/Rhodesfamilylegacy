<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard | Arcade Combat Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08090f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 18, 30, 0.95);
      border-bottom: 2px solid #8b5cf6;
    }
    header h1 {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
    }
    #hero-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #38bdf8;
    }
    #roster-bar {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      padding: 8px 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 0 0 8px 8px;
    }
    .roster-card {
      background: #1f2937;
      border: 2px solid #4b5563;
      border-radius: 6px;
      padding: 6px 2px;
      text-align: center;
      font-size: 0.7rem;
      cursor: pointer;
      color: #cbd5e1;
      font-weight: bold;
      transition: 0.2s ease;
    }
    .roster-card.active {
      border-color: #38bdf8;
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      transform: translateY(-2px);
    }
    #game-container {
      position: relative;
      margin-top: 6px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #4c1d95;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      padding: 10px 14px;
      gap: 15px;
      margin-top: 6px;
    }
    .control-cluster {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .action-cluster {
      justify-content: flex-end;
    }
    .btn {
      background: rgba(30, 27, 75, 0.85);
      border: 2px solid #a855f7;
      color: #e9d5ff;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }
    .btn:active {
      background: #7e22ce;
      transform: scale(0.92);
    }
    .btn-action {
      border-radius: 12px;
      width: 82px;
      height: 52px;
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-strike { border-color: #38bdf8; color: #bae6fd; }
    .btn-super { border-color: #f59e0b; color: #fef3c7; }
  </style>
</head>
<body>

  <header>
    <h1>Ancestral Vanguard</h1>
    <div id="hero-name">MARCUS</div>
  </header>

  <div id="roster-bar">
    <div class="roster-card active" onclick="switchHero('marcus')">MARCUS</div>
    <div class="roster-card" onclick="switchHero('chronolock')">CHRONO</div>
    <div class="roster-card" onclick="switchHero('motherluta')">M. LUTA</div>
    <div class="roster-card" onclick="switchHero('xochitl')">XOCHITL</div>
    <div class="roster-card" onclick="switchHero('apexvolt')">APEX VOLT</div>
    <div class="roster-card" onclick="switchHero('amina')">AMINA</div>
  </div>

  <div id="game-container">
    <canvas id="stage" width="800" height="450"></canvas>
  </div>

  <div id="touch-controls">
    <div class="control-cluster">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
      <button class="btn" id="btn-jump">▲</button>
    </div>
    <div class="control-cluster action-cluster">
      <button class="btn btn-action btn-strike" id="btn-atk">STRIKE</button>
      <button class="btn btn-action btn-super" id="btn-power">SUPER</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const heroNameBadge = document.getElementById('hero-name');

    const ROSTER = {
      marcus: {
        name: 'MARCUS (ANCHOR)',
        files: ['marcus-real.png', 'marcus.png', 'marcus_clean.png', 'marcus-hero.png'],
        speed: 4.8,
        gravity: 0.85,
        jumpForce: -14,
        scaleW: 120,
        scaleH: 150,
        color: '#a855f7',
        drawVector: (c, w, h) => {
          c.fillStyle = '#7c3aed';
          c.fillRect(-w*0.3, -h*0.4, w*0.6, h*0.7);
          c.fillStyle = '#38bdf8';
          c.fillRect(-w*0.2, -h*0.35, w*0.4, h*0.25);
          c.fillStyle = '#1e1b4b';
          c.fillRect(-w*0.25, h*0.2, w*0.22, h*0.3);
          c.fillRect(w*0.03, h*0.2, w*0.22, h*0.3);
          c.fillStyle = '#c084fc';
          c.beginPath();
          c.arc(0, -h*0.42, w*0.18, 0, Math.PI*2);
          c.fill();
        },
        superPower: (h) => {
          screenShake = 16;
          shockwaves.push({ x: h.x + (h.facing === 1 ? h.w : 0), y: h.groundY + h.h - 10, radius: 10, maxRadius: 140, color: '#38bdf8' });
          dealDamage(25);
        }
      },
      chronolock: {
        name: 'CHRONOLOCK (TEMPORAL)',
        files: ['chrono-real.png', 'chronolock-hero.png', 'chronolock.png'],
        speed: 3.8,
        gravity: 0.75,
        jumpForce: -13,
        scaleW: 130,
        scaleH: 155,
        color: '#10b981',
        drawVector: (c, w, h) => {
          c.fillStyle = '#d97706';
          c.fillRect(-w*0.3, -h*0.38, w*0.6, h*0.65);
          c.fillStyle = '#10b981';
          c.beginPath();
          c.arc(0, -h*0.1, w*0.18, 0, Math.PI*2);
          c.fill();
          c.strokeStyle = '#fef08a';
          c.lineWidth = 4;
          c.stroke();
        },
        superPower: (h) => {
          screenShake = 6;
          shockwaves.push({ x: h.x + h.w / 2, y: h.y + h.h / 2, radius: 20, maxRadius: 160, color: '#10b981' });
          dealDamage(18);
        }
      },
      motherluta: {
        name: 'MOTHER LUTA (MYSTIC)',
        files: ['luta-real.png', 'mother-luta.png', 'mother-luetta.png'],
        speed: 5.2,
        gravity: 0.45,
        jumpForce: -12,
        scaleW: 110,
        scaleH: 145,
        color: '#fbbf24',
        drawVector: (c, w, h) => {
          c.fillStyle = '#b45309';
          c.beginPath();
          c.moveTo(0, -h*0.45);
          c.lineTo(w*0.35, h*0.45);
          c.lineTo(-w*0.35, h*0.45);
          c.closePath();
          c.fill();
          c.fillStyle = '#fef08a';
          c.fillRect(-w*0.25, -h*0.1, w*0.5, h*0.15);
        },
        superPower: (h) => {
          screenShake = 8;
          for (let i = 0; i < 25; i++) {
            particles.push({
              x: h.x + h.w / 2,
              y: h.y + 40,
              vx: (Math.random() - 0.5) * 14,
              vy: -(Math.random() * 8 + 4),
              size: 5,
              color: '#f59e0b',
              life: 30
            });
          }
          dealDamage(22);
        }
      },
      xochitl: {
        name: 'XOCHITL (FLAME CLAW)',
        files: ['xochitl.png', 'file_00000000b8e4822fa50d291ddad4c5be.png'],
        speed: 6.0,
        gravity: 0.8,
        jumpForce: -15,
        scaleW: 115,
        scaleH: 148,
        color: '#ea580c',
        drawVector: (c, w, h) => {},
        superPower: (h) => {
          screenShake = 10;
          h.vx = h.facing * 20;
          dealDamage(28);
        }
      },
      apexvolt: {
        name: 'APEX VOLT (ELECTRIC)',
        files: ['apex-volt.png', 'apex.png'],
        speed: 5.0,
        gravity: 0.82,
        jumpForce: -14,
        scaleW: 125,
        scaleH: 152,
        color: '#06b6d4',
        drawVector: (c, w, h) => {
          c.fillStyle = '#0e7490';
          c.fillRect(-w*0.3, -h*0.4, w*0.6, h*0.75);
          c.fillStyle = '#67e8f9';
          c.fillRect(-w*0.15, -h*0.3, w*0.3, h*0.2);
        },
        superPower: (h) => {
          screenShake = 12;
          dealDamage(24);
        }
      },
      amina: {
        name: 'AMINA (SPEAR VANGUARD)',
        files: ['amina.png', 'amina-hero.png'],
        speed: 5.5,
        gravity: 0.82,
        jumpForce: -14.5,
        scaleW: 115,
        scaleH: 150,
        color: '#e11d48',
        drawVector: (c, w, h) => {
          c.fillStyle = '#9f1239';
          c.fillRect(-w*0.25, -h*0.4, w*0.5, h*0.75);
          c.strokeStyle = '#f43f5e';
          c.lineWidth = 4;
          c.beginPath();
          c.moveTo(w*0.2, -h*0.45);
          c.lineTo(w*0.2, h*0.45);
          c.stroke();
        },
        superPower: (h) => {
          screenShake = 10;
          h.vx = h.facing * 16;
          dealDamage(26);
        }
      }
    };

    const sprites = {};
    Object.keys(ROSTER).forEach(key => {
      sprites[key] = { img: null, ready: false, isClean: false };
      loadCleanSprite(key, 0);
    });

    function loadCleanSprite(key, index) {
      const list = ROSTER[key].files;
      if (index >= list.length) return;

      const testImg = new Image();
      testImg.crossOrigin = "anonymous";
      testImg.src = list[index];

      testImg.onload = () => {
        // Inspect corners to filter out screenshot boxes
        try {
          const cTest = document.createElement('canvas');
          cTest.width = testImg.naturalWidth || 100;
          cTest.height = testImg.naturalHeight || 100;
          const ctxTest = cTest.getContext('2d');
          ctxTest.drawImage(testImg, 0, 0);
          const pTopLeft = ctxTest.getImageData(2, 2, 1, 1).data;
          const pTopRight = ctxTest.getImageData(cTest.width - 3, 2, 1, 1).data;

          // If top corners are solid white/gray screenshot banners, reject
          const isWhite = (pTopLeft[0] > 235 && pTopLeft[1] > 235 && pTopLeft[2] > 235 && pTopLeft[3] > 200) ||
                          (pTopRight[0] > 235 && pTopRight[1] > 235 && pTopRight[2] > 235 && pTopRight[3] > 200);

          if (!isWhite && (pTopLeft[3] === 0 || pTopRight[3] === 0 || key === 'xochitl')) {
            sprites[key].img = testImg;
            sprites[key].ready = true;
            sprites[key].isClean = true;
            return;
          }
        } catch (e) {}

        // If file contains solid screenshot background, test next candidate
        loadCleanSprite(key, index + 1);
      };

      testImg.onerror = () => {
        loadCleanSprite(key, index + 1);
      };
    }

    let activeKey = 'marcus';
    let screenShake = 0;
    const particles = [];
    const shockwaves = [];

    const hero = {
      x: 140,
      y: 250,
      w: 120,
      h: 150,
      vx: 0,
      vy: 0,
      facing: 1,
      isGrounded: true,
      cooldown: 0,
      auraTick: 0,
      groundY: 250,
      hp: 100
    };

    const opponent = {
      x: 580,
      y: 250,
      w: 120,
      h: 150,
      vx: 0,
      vy: 0,
      facing: -1,
      hp: 100,
      maxHp: 100,
      groundY: 250,
      atkTimer: 60
    };

    window.switchHero = function(key) {
      if (!ROSTER[key]) return;
      activeKey = key;
      const cfg = ROSTER[key];
      hero.w = cfg.scaleW;
      hero.h = cfg.scaleH;
      heroNameBadge.textContent = cfg.name;
      heroNameBadge.style.color = cfg.color;
      document.querySelectorAll('.roster-card').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
    };

    function dealDamage(amount) {
      const dist = Math.abs((hero.x + hero.w / 2) - (opponent.x + opponent.w / 2));
      if (dist < 180) {
        opponent.hp = Math.max(0, opponent.hp - amount);
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: opponent.x + opponent.w / 2,
            y: opponent.y + opponent.h / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            size: 4,
            color: '#ef4444',
            life: 20
          });
        }
      }
    }

    const keys = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'ArrowUp') doJump();
      if (e.key === 'j' || e.key === 'z') doStrike();
      if (e.key === 'k' || e.key === 'x') doSuper();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });

    function bind(id, down, up) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); down(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (up) up(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); down(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if (up) up(); });
    }
    bind('btn-left', () => keys.left = true, () => keys.left = false);
    bind('btn-right', () => keys.right = true, () => keys.right = false);
    bind('btn-jump', () => doJump());
    bind('btn-atk', () => doStrike());
    bind('btn-power', () => doSuper());

    function doJump() {
      if (hero.isGrounded) {
        hero.vy = ROSTER[activeKey].jumpForce;
        hero.isGrounded = false;
      }
    }

    function doStrike() {
      if (hero.cooldown === 0) {
        hero.cooldown = 18;
        screenShake = 6;
        dealDamage(10);
      }
    }

    function doSuper() {
      if (hero.cooldown === 0) {
        hero.cooldown = 34;
        ROSTER[activeKey].superPower(hero);
      }
    }

    function update() {
      if (screenShake > 0) screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;
      if (hero.cooldown > 0) hero.cooldown--;

      const cfg = ROSTER[activeKey];
      if (keys.left) { hero.vx = -cfg.speed; hero.facing = -1; }
      else if (keys.right) { hero.vx = cfg.speed; hero.facing = 1; }
      else { hero.vx *= 0.8; }

      hero.x += hero.vx;
      hero.y += hero.vy;

      if (!hero.isGrounded) {
        hero.vy += cfg.gravity;
        if (hero.y >= hero.groundY) {
          hero.y = hero.groundY;
          hero.vy = 0;
          hero.isGrounded = true;
        }
      }

      if (hero.x < 20) hero.x = 20;
      if (hero.x + hero.w > canvas.width - 20) hero.x = canvas.width - hero.w - 20;

      opponent.atkTimer--;
      if (opponent.atkTimer <= 0) {
        opponent.atkTimer = 75;
        if (Math.abs(opponent.x - hero.x) < 140) {
          hero.hp = Math.max(0, hero.hp - 8);
          screenShake = 8;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.radius += 6;
        if (s.radius > s.maxRadius) shockwaves.splice(i, 1);
      }

      hero.auraTick += 0.08;
    }

    function render() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const floorY = hero.groundY + hero.h - 5;
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
      ctx.strokeStyle = ROSTER[activeKey].color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(canvas.width, floorY);
      ctx.stroke();

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(30, 20, 260, 18);
      ctx.fillRect(canvas.width - 290, 20, 260, 18);

      ctx.fillStyle = ROSTER[activeKey].color;
      ctx.fillRect(30, 20, (hero.hp / 100) * 260, 18);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(canvas.width - 290, 20, (opponent.hp / opponent.maxHp) * 260, 18);

      shockwaves.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4;
        ctx.stroke();
      });
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // Render Active Player Character
      ctx.save();
      ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
      ctx.scale(hero.facing, 1);
      const breathe = Math.sin(hero.auraTick) * 2;

      const spr = sprites[activeKey];
      if (spr && spr.ready && spr.isClean) {
        ctx.drawImage(spr.img, -hero.w / 2, -hero.h / 2 - breathe, hero.w, hero.h + breathe);
      } else {
        // Fallback Arcade Silhouette
        ctx.fillStyle = ROSTER[activeKey].color;
        ctx.shadowColor = ROSTER[activeKey].color;
        ctx.shadowBlur = 15;
        ROSTER[activeKey].drawVector(ctx, hero.w, hero.h);
      }
      ctx.restore();

      // Render Syndicate Boss Opponent
      ctx.save();
      ctx.translate(opponent.x + opponent.w / 2, opponent.y + opponent.h / 2);
      ctx.scale(opponent.facing, 1);
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(-opponent.w / 2, -opponent.h / 2, opponent.w, opponent.h);
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 2;
      ctx.strokeRect(-opponent.w / 2, -opponent.h / 2, opponent.w, opponent.h);
      ctx.restore();

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
