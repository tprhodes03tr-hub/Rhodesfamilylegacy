<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detroit City Rescue Arcade | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      overflow: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .hud {
      width: 100%;
      background: #0f172a;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #38bdf8;
    }
    .alert-banner {
      width: 100%;
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
      border: 1px solid #f59e0b;
      color: #fef08a;
      padding: 5px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      height: 310px;
      background: #1e293b;
      border: 3px solid #3b82f6;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 380px;
    }
    .ctrl-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 0 #1d4ed8;
      transition: transform 0.1s;
    }
    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .btn-action {
      background: #059669;
      box-shadow: 0 3px 0 #047857;
      grid-column: span 3;
      padding: 12px;
      font-size: 1.05rem;
    }
    .back-link {
      color: #64748b;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 0</span>
      <span id="timer-display">TIME: 45s</span>
    </div>

    <div class="alert-banner" id="alert-text">🚨 EMERGENCY: DRIVE TO THE FIRE & BLAST WATER!</div>

    <canvas id="gameCanvas" width="600" height="290"></canvas>

    <div class="controls">
      <div></div>
      <button class="ctrl-btn" ontouchstart="moveTruck(0, -12)" onclick="moveTruck(0, -12)">⬆️ UP</button>
      <div></div>
      <button class="ctrl-btn" ontouchstart="moveTruck(-14, 0)" onclick="moveTruck(-14, 0)">⬅ LEFT</button>
      <button class="ctrl-btn" ontouchstart="moveTruck(0, 12)" onclick="moveTruck(0, 12)">⬇️ DOWN</button>
      <button class="ctrl-btn" ontouchstart="moveTruck(14, 0)" onclick="moveTruck(14, 0)">RIGHT ➡️</button>
      <button class="ctrl-btn btn-action" ontouchstart="triggerAction()" onclick="triggerAction()">💦 BLAST WATER / RESCUE 🚨</button>
    </div>

    <a href="index.html" class="back-link">← RETURN TO MAIN PORTAL</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 45;
    let gameActive = true;
    let missionType = "fire"; 
    let waterParticles = [];

    // Fire Engine Truck Object
    let truck = {
      x: 260,
      y: 210,
      width: 72,
      height: 42
    };

    // Target Building / Citizen
    let target = {
      x: 250,
      y: 25,
      width: 95,
      height: 65,
      active: true,
      health: 100
    };

    function moveTruck(dx, dy) {
      if (!gameActive) return;
      truck.x += dx;
      truck.y += dy;

      // Keep truck on the asphalt road between Detroit storefronts
      if (truck.x < 70) truck.x = 70;
      if (truck.x > canvas.width - truck.width - 70) truck.x = canvas.width - truck.width - 70;
      if (truck.y < 95) truck.y = 95; 
      if (truck.y > canvas.height - truck.height - 8) truck.y = canvas.height - truck.height - 8;
    }

    function triggerAction() {
      if (!gameActive) return;

      // Sprays water stream particles
      for (let i = 0; i < 10; i++) {
        waterParticles.push({
          x: truck.x + truck.width / 2,
          y: truck.y,
          vx: (Math.random() - 0.5) * 5,
          vy: -7 - Math.random() * 4,
          life: 18
        });
      }

      let distance = Math.hypot((truck.x + truck.width/2) - (target.x + target.width/2), truck.y - (target.y + target.height));
      
      if (distance < 120 && target.active) {
        if (missionType === "fire") {
          target.health -= 34;
          if (target.health <= 0) {
            target.active = false;
            score += 100;
            spawnNewTarget();
          }
        } else {
          target.active = false;
          score += 150;
          spawnNewTarget();
        }
      }
    }

    function spawnNewTarget() {
      target.x = Math.random() * 350 + 85;
      target.active = true;
      target.health = 100;
      missionType = Math.random() > 0.5 ? "fire" : "rescue";
      
      const alertEl = document.getElementById('alert-text');
      if (missionType === "fire") {
        alertEl.textContent = "🚨 EMERGENCY: HOUSE ON FIRE! Drive close & BLAST WATER!";
      } else {
        alertEl.textContent = "🆘 EMERGENCY: CITIZEN NEEDS RESCUE! Drive close & HELP!";
      }
    }

    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--;
      document.getElementById('timer-display').textContent = `TIME: ${timeLeft}s`;
      if (timeLeft <= 0) {
        gameActive = false;
        clearInterval(timerInterval);
      }
    }, 1000);

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. DETROIT STREET BACKGROUND & SIDEWALKS
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sidewalks
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 0, 70, canvas.height);
      ctx.fillRect(canvas.width - 70, 0, 70, canvas.height);

      // Asphalt Road
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(70, 0, canvas.width - 140, canvas.height);

      // Road Center Striping
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 14]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. TARGET BUILDING / STOREFRONT
      if (target.active) {
        if (missionType === "fire") {
          // Brick Building
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(target.x, target.y, target.width, target.height);
          
          // Lit Windows & Storefront Glass
          ctx.fillStyle = '#fde047';
          ctx.fillRect(target.x + 10, target.y + 12, 18, 24);
          ctx.fillRect(target.x + 65, target.y + 12, 18, 24);

          // Animated Fire Flames
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 6, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 8, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(`🔥 FIRE: ${target.health}%`, target.x + 8, target.y - 30);
        } else {
          // Citizen In Need on Sidewalk
          ctx.fillStyle = '#047857';
          ctx.fillRect(target.x + 15, target.y + 15, 65, 45);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText("🆘 RESCUE ME!", target.x + 5, target.y + 5);
        }
      }

      // 3. WATER SPRAY PARTICLES
      for (let i = waterParticles.length - 1; i >= 0; i--) {
        let p = waterParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) waterParticles.splice(i, 1);
      }

      // 4. DETAILED FIRE ENGINE TRUCK
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(truck.x, truck.y + 10, truck.width, truck.height - 10);
      
      // Fire Truck Cab
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(truck.x + 46, truck.y, 26, 24);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(truck.x + 52, truck.y + 5, 16, 12);

      // Ladder & Equipment Rack
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 3;
      ctx.strokeRect(truck.x + 6, truck.y + 6, 36, 8);

      // Detailed Wheels
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(truck.x + 18, truck.y + truck.height, 9, 0, Math.PI * 2);
      ctx.arc(truck.x + 56, truck.y + truck.height, 9, 0, Math.PI * 2);
      ctx.fill();

      // Flashing Siren Light
      ctx.fillStyle = Math.floor(Date.now() / 180) % 2 === 0 ? '#38bdf8' : '#ef4444';
      ctx.fillRect(truck.x + 54, truck.y - 7, 8, 7);

      // 5. UPDATE HUD
      document.getElementById('score-display').textContent = `SCORE: ${score}`;

      if (!gameActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText("MISSION COMPLETE!", 140, 130);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Final Detroit Score: ${score}`, 180, 175);
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
