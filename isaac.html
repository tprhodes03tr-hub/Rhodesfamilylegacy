<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Universe & Sports Lounge - Rhodes Family Legacy</title>
    <style>
        :root {
            --gold: #f39c12;
            --dark-bg: #07090f;
            --panel-bg: #121824;
            --neon-blue: #00d2ff;
            --neon-red: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 480px;
        }

        .tab-btn {
            padding: 8px 12px;
            border: 1px solid var(--gold);
            background: var(--panel-bg);
            color: var(--gold);
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--gold);
            color: #000;
        }

        .game-container {
            background: var(--panel-bg);
            border: 2px solid #2d3748;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .game-view {
            width: 100%;
            height: 320px;
            background: #0b0f19;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            display: none;
        }

        .game-view.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--gold);
        }

        .instruction-text {
            margin: 8px 0;
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
            min-height: 25px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            background: var(--gold);
            color: #000;
        }

        .action-btn:hover {
            background: #e67e22;
        }

        .btn-secondary {
            background: #2d3748;
            color: #fff;
            border: 1px solid #4a5568;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vanguard Universe & Sports Lounge</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchGame('basketball')">🏀 Basketball</button>
        <button class="tab-btn" onclick="switchGame('pool')">🎱 Pool Table</button>
        <button class="tab-btn" onclick="switchGame('bowling')">🎳 Bowling</button>
    </div>

    <div class="game-container">
        <!-- Basketball Game View -->
        <div id="game-basketball" class="game-view active">
            <canvas id="bbCanvas" width="440" height="320"></canvas>
        </div>

        <!-- Pool Game View -->
        <div id="game-pool" class="game-view">
            <canvas id="poolCanvas" width="440" height="320"></canvas>
        </div>

        <!-- Bowling Game View -->
        <div id="game-bowling" class="game-view">
            <canvas id="bowlCanvas" width="440" height="320"></canvas>
        </div>

        <div class="score-bar">
            <span id="score-label">SCORE: 70</span>
            <span id="bonus-label">MARROW BONUS: 350 ME</span>
        </div>

        <div class="instruction-text" id="instruction-label">
            Adjust aim, hold power meter, and release for Class-A action!
        </div>

        <div class="controls-row">
            <button class="action-btn btn-secondary" onclick="adjustAim(-1)">◄ Adjust Aim</button>
            <button class="action-btn" id="primary-action-btn" onclick="triggerAction()">Hold & Release Shot</button>
            <button class="action-btn btn-secondary" onclick="adjustAim(1)">Adjust Aim ►</button>
        </div>
    </div>

    <script>
        let currentGame = 'basketball';

        function switchGame(game) {
            currentGame = game;
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (game === 'basketball') {
                document.getElementById('game-basketball').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Adjust aim, hold power meter, and release for Marcus Prime action!";
            } else if (game === 'pool') {
                document.getElementById('game-pool').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Align cue stick, set power, and pocket Syndicate balls!";
            } else if (game === 'bowling') {
                document.getElementById('game-bowling').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Aim down the Monument Valley alley for a strike!";
            }
        }

        // --- Basketball Canvas (Integrated with Marcus Prime style & Golden Tree Emblem) ---
        const bbCanvas = document.getElementById('bbCanvas');
        const bbCtx = bbCanvas.getContext('2d');
        let bbX = 80, bbY = 240, bbAimOffset = 0, bbShotActive = false, bbScore = 70;

        function drawBasketballScene() {
            bbCtx.fillStyle = '#0b0f19';
            bbCtx.fillRect(0, 0, 440, 320);

            // Golden Tree Emblem Backdrop
            bbCtx.strokeStyle = '#f39c12';
            bbCtx.lineWidth = 2;
            bbCtx.beginPath();
            bbCtx.moveTo(220, 150); bbCtx.lineTo(220, 90);
            bbCtx.moveTo(220, 110); bbCtx.lineTo(190, 80);
            bbCtx.moveTo(220, 100); bbCtx.lineTo(250, 80);
            bbCtx.stroke();

            // Court Floor
            bbCtx.fillStyle = '#1a2b4c';
            bbCtx.fillRect(0, 260, 440, 60);
            bbCtx.strokeStyle = '#ff3366';
            bbCtx.lineWidth = 2;
            bbCtx.beginPath();
            bbCtx.moveTo(0, 260); bbCtx.lineTo(440, 260);
            bbCtx.stroke();

            // Marcus Prime Character / Ball
            bbCtx.fillStyle = '#f39c12';
            bbCtx.beginPath();
            bbCtx.arc(bbX, bbY, 14, 0, Math.PI * 2);
            bbCtx.fill();
            bbCtx.strokeStyle = '#000';
            bbCtx.stroke();

            // Aim Line
            bbCtx.strokeStyle = '#00d2ff';
            bbCtx.lineWidth = 2;
            bbCtx.setLineDash([4, 4]);
            bbCtx.beginPath();
            bbCtx.moveTo(bbX, bbY);
            bbCtx.lineTo(bbX + 90, bbY - 70 + bbAimOffset);
            bbCtx.stroke();
            bbCtx.setLineDash([]);

            // Hoop
            bbCtx.strokeStyle = '#00d2ff';
            bbCtx.strokeRect(360, 90, 50, 70);
            bbCtx.strokeStyle = '#ff3366';
            bbCtx.lineWidth = 3;
            bbCtx.beginPath();
            bbCtx.arc(385, 130, 22, 0, Math.PI);
            bbCtx.stroke();
        }

        // --- Pool Canvas ---
        const poolCanvas = document.getElementById('poolCanvas');
        const poolCtx = poolCanvas.getContext('2d');
        let cueX = 220, cueY = 250, poolAim = 0;

        function drawPoolScene() {
            poolCtx.fillStyle = '#0b0f19';
            poolCtx.fillRect(0, 0, 440, 320);

            // Green Felt
            poolCtx.fillStyle = '#104e28';
            poolCtx.fillRect(30, 20, 380, 280);
            poolCtx.strokeStyle = '#5c3a21';
            poolCtx.lineWidth = 10;
            poolCtx.strokeRect(30, 20, 380, 280);

            // Rack of balls
            poolCtx.fillStyle = '#f39c12';
            poolCtx.beginPath(); poolCtx.arc(220, 90, 8, 0, Math.PI*2); poolCtx.fill();
            poolCtx.fillStyle = '#2980b9';
            poolCtx.beginPath(); poolCtx.arc(205, 105, 8, 0, Math.PI*2); poolCtx.fill();
            poolCtx.fillStyle = '#c0392b';
            poolCtx.beginPath(); poolCtx.arc(235, 105, 8, 0, Math.PI*2); poolCtx.fill();

            // Cue Ball & Stick
            poolCtx.fillStyle = '#fff';
            poolCtx.beginPath(); poolCtx.arc(cueX, cueY, 9, 0, Math.PI*2); poolCtx.fill();

            poolCtx.strokeStyle = '#d4a373';
            poolCtx.lineWidth = 5;
            poolCtx.beginPath();
            poolCtx.moveTo(cueX, cueY + 15);
            poolCtx.lineTo(cueX + poolAim, cueY + 140);
            poolCtx.stroke();
        }

        // --- Bowling Canvas ---
        const bowlCanvas = document.getElementById('bowlCanvas');
        const bowlCtx = bowlCanvas.getContext('2d');
        let bowlX = 220, bowlY = 270;

        function drawBowlingScene() {
            bowlCtx.fillStyle = '#0b0f19';
            bowlCtx.fillRect(0, 0, 440, 320);

            // Wooden Alley
            bowlCtx.fillStyle = '#d2691e';
            bowlCtx.beginPath();
            bowlCtx.moveTo(100, 320); bowlCtx.lineTo(340, 320);
            bowlCtx.lineTo(250, 40); bowlCtx.lineTo(190, 40);
            bowlCtx.fill();

            // Pins
            bowlCtx.fillStyle = '#fff';
            bowlCtx.beginPath(); bowlCtx.arc(220, 55, 6, 0, Math.PI*2); bowlCtx.fill();
            bowlCtx.beginPath(); bowlCtx.arc(205, 70, 6, 0, Math.PI*2); bowlCtx.fill();
            bowlCtx.beginPath(); bowlCtx.arc(235, 70, 6, 0, Math.PI*2); bowlCtx.fill();

            // Ball
            bowlCtx.fillStyle = '#00d2ff';
            bowlCtx.beginPath();
            bowlCtx.arc(bowlX, bowlY, 11, 0, Math.PI*2);
            bowlCtx.fill();
            bowlCtx.strokeStyle = '#fff';
            bowlCtx.stroke();
        }

        function adjustAim(dir) {
            if (currentGame === 'basketball') {
                bbAimOffset += dir * 6;
            } else if (currentGame === 'pool') {
                poolAim += dir * 8;
            } else if (currentGame === 'bowling') {
                bowlX += dir * 10;
            }
            redrawActive();
        }

        function triggerAction() {
            if (currentGame === 'basketball' && !bbShotActive) {
                bbShotActive = true;
                let t = setInterval(() => {
                    bbX += 12;
                    bbY -= 8;
                    redrawActive();
                    if (bbX >= 370) {
                        clearInterval(t);
                        bbScore += 2;
                        document.getElementById('score-label').innerText = "SCORE: " + bbScore;
                        setTimeout(resetBasketball, 400);
                    }
                }, 30);
            } else if (currentGame === 'pool') {
                cueY -= 25;
                redrawActive();
                setTimeout(() => { cueY = 250; redrawActive(); }, 300);
            } else if (currentGame === 'bowling') {
                let bt = setInterval(() => {
                    bowlY -= 15;
                    redrawActive();
                    if (bowlY <= 70) {
                        clearInterval(bt);
                        setTimeout(resetBowling, 400);
                    }
                }, 30);
            }
        }

        function resetBasketball() {
            bbX = 80; bbY = 240; bbAimOffset = 0; bbShotActive = false;
            redrawActive();
        }

        function resetBowling() {
            bowlX = 220; bowlY = 270;
            redrawActive();
        }

        function redrawActive() {
            if (currentGame === 'basketball') drawBasketballScene();
            else if (currentGame === 'pool') drawPoolScene();
            else if (currentGame === 'bowling') drawBowlingScene();
        }

        // Initial load
        drawBasketballScene();
        drawPoolScene();
        drawBowlingScene();
    </script>
</body>
</html>
