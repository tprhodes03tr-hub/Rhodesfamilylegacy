<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detroit City Rescue Hub | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .hud {
      width: 100%;
      background: #111827;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.8rem;
      color: #38bdf8;
    }
    .alert-banner {
      width: 100%;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      animation: pulseAlert 1s infinite alternate;
    }
    @keyframes pulseAlert {
      0% { background: rgba(239, 68, 68, 0.1); }
      100% { background: rgba(239, 68, 68, 0.35); }
    }
    canvas {
      width: 100%;
      max-width: 600px;
      height: 320px;
      background: #1e293b;
      border: 3px solid #3b82f6;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 380px;
    }
    .ctrl-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 0 #1d4ed8;
      transition: transform 0.1s;
    }
    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .btn-action {
      background: #10b981;
      box-shadow: 0 3px 0 #047857;
      grid-column: span 3;
      padding: 14px;
      font-size: 1.1rem;
    }
    .back-link {
      color: #64748b;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 0</span>
      <span id="timer-display">TIME: 45s</span>
    </div>

    <div class="alert-banner" id="alert-text">🚨 EMERGENCY: DRIVE UP TO THE BURNING HOUSE!</div>

    <canvas id="gameCanvas" width="600" height="300"></canvas>

    <div class="controls">
      <div></div>
      <button class="ctrl-btn" ontouchstart="moveTruck(0, -10)" onclick="moveTruck(0, -10)">⬆️ UP</button>
      <div></div>
      <button class="ctrl-btn" ontouchstart="moveTruck(-12, 0)" onclick="moveTruck(-12, 0)">⬅️️ LEFT</button>
      <button class="ctrl-btn" ontouchstart="moveTruck(0, 10)" onclick="moveTruck(0, 10)">⬇️ DOWN</button>
      <button class="ctrl-btn" ontouchstart="moveTruck(12, 0)" onclick="moveTruck(12, 0)">RIGHT ➡️</button>
      <button class="ctrl-btn btn-action" ontouchstart="triggerAction()" onclick="triggerAction()">💦 BLAST WATER / RESCUE 🚨</button>
    </div>

    <a href="index.html" class="back-link">← RETURN TO MAIN PORTAL</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 45;
    let gameActive = true;
    let missionType = "fire"; // 'fire' or 'rescue'
    let waterParticles = [];

    // Fire Engine Truck Object (Can move anywhere on the road)
    let truck = {
      x: 260,
      y: 220,
      width: 70,
      height: 40
    };

    // Emergency Target Building / Citizen
    let target = {
      x: 250,
      y: 30,
      width: 90,
      height: 60,
      active: true,
      health: 100
    };

    function moveTruck(dx, dy) {
      if (!gameActive) return;
      truck.x += dx;
      truck.y += dy;

      // Keep truck inside the city street bounds (sidewalks are 65px wide)
      if (truck.x < 65) truck.x = 65;
      if (truck.x > canvas.width - truck.width - 65) truck.x = canvas.width - truck.width - 65;
      if (truck.y < 100) truck.y = 100; // Can't drive into buildings
      if (truck.y > canvas.height - truck.height - 10) truck.y = canvas.height - truck.height - 10;
    }

    function triggerAction() {
      if (!gameActive) return;

      // Create water spray particle effect towards target
      for (let i = 0; i < 8; i++) {
        waterParticles.push({
          x: truck.x + truck.width / 2,
          y: truck.y,
          vx: (Math.random() - 0.5) * 4,
          vy: -6 - Math.random() * 4,
          life: 15
        });
      }

      // Check if truck is close enough to the target to put out fire or rescue
      let distance = Math.hypot((truck.x + truck.width/2) - (target.x + target.width/2), truck.y - (target.y + target.height));
      
      if (distance < 110 && target.active) {
        if (missionType === "fire") {
          target.health -= 34;
          if (target.health <= 0) {
            target.active = false;
            score += 100;
            spawnNewTarget();
          }
        } else {
          target.active = false;
          score += 150;
          spawnNewTarget();
        }
      }
    }

    function spawnNewTarget() {
      target.x = Math.random() * 360 + 80;
      target.active = true;
      target.health = 100;
      missionType = Math.random() > 0.5 ? "fire" : "rescue";
      
      const alertEl = document.getElementById('alert-text');
      if (missionType === "fire") {
        alertEl.textContent = "🚨 EMERGENCY: HOUSE ON FIRE! Drive close and BLAST WATER!";
        alertEl.style.borderColor = "#ef4444";
      } else {
        alertEl.textContent = "🆘 EMERGENCY: CITIZEN NEEDS HELP! Drive close and RESCUE!";
        alertEl.style.borderColor = "#10b981";
      }
    }

    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--;
      document.getElementById('timer-display').textContent = `TIME: ${timeLeft}s`;
      if (timeLeft <= 0) {
        gameActive = false;
        clearInterval(timerInterval);
      }
    }, 1000);

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. SIDEWALKS & CITY BACKGROUND
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 0, 65, canvas.height);
      ctx.fillRect(canvas.width - 65, 0, 65, canvas.height);

      // 2. DETROIT CITY ROADWAY
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(65, 0, canvas.width - 130, canvas.height);

      // Road Centerlines
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3. TARGET BUILDING / RESCUE ZONE
      if (target.active) {
        if (missionType === "fire") {
          // Detailed Building Facade
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(target.x, target.y, target.width, target.height);
          
          // Windows
          ctx.fillStyle = '#fde047';
          ctx.fillRect(target.x + 12, target.y + 12, 18, 22);
          ctx.fillRect(target.x + 60, target.y + 12, 18, 22);

          // Blazing Fire Animation
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 8, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(target.x + target.width / 2, target.y - 10, 11, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(`🔥 FIRE: ${target.health}%`, target.x + 10, target.y - 25);
        } else {
          // Citizen In Need
          ctx.fillStyle = '#059669';
          ctx.fillRect(target.x + 20, target.y + 15, 50, 45);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText("🆘 HELP ME!", target.x + 10, target.y + 5);
        }
      }

      // 4. WATER SPRAY PARTICLES ANIMATION
      for (let i = waterParticles.length - 1; i >= 0; i--) {
        let p = waterParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) waterParticles.splice(i, 1);
      }

      // 5. DETAILED FIRE ENGINE TRUCK
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(truck.x, truck.y + 10, truck.width, truck.height - 10);
      
      // Cab
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(truck.x + 44, truck.y, 24, 22);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(truck.x + 50, truck.y + 4, 14, 10);

      // Wheels
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(truck.x + 16, truck.y + truck.height, 8, 0, Math.PI * 2);
      ctx.arc(truck.x + 54, truck.y + truck.height, 8, 0, Math.PI * 2);
      ctx.fill();

      // Flashing Siren Light
      ctx.fillStyle = Math.floor(Date.now() / 200) % 2 === 0 ? '#38bdf8' : '#ef4444';
      ctx.fillRect(truck.x + 52, truck.y - 6, 8, 6);

      // 6. UPDATE HUD
      document.getElementById('score-display').textContent = `SCORE: ${score}`;

      if (!gameActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText("MISSION COMPLETE!", 140, 140);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Final Detroit Score: ${score}`, 190, 180);
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
