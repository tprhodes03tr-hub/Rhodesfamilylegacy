<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard Universe: Side Brawler Arcade</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    header {
      width: 100%;
      max-width: 560px;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      margin-bottom: 10px;
    }

    .portal-title {
      font-size: 1.0rem;
      letter-spacing: 2px;
      color: #f59e0b;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .sys-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
    }

    .portal-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 560px;
    }

    .brawler-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-title {
      font-size: 12px;
      font-weight: 800;
      color: #38bdf8;
    }

    .wave-badge {
      font-size: 10px;
      color: #f59e0b;
      font-weight: 800;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .bars-container {
      display: flex;
      gap: 8px;
    }

    .bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bar-label {
      font-size: 9px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }

    .bar-track {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hero { width: 100%; height: 100%; background: #10b981; transition: width 0.1s ease; }
    .bar-fill-enemy { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s ease; }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 280px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .combat-log {
      font-family: monospace;
      font-size: 10px;
      background: #090e18;
      border: 1px solid #1e293b;
      padding: 5px 8px;
      border-radius: 6px;
      color: #38bdf8;
      min-height: 24px;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 6px;
      width: 100%;
    }

    .dpad-cluster, .action-cluster {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px 2px;
    }
    .btn:active { transform: scale(0.96); background: #334155; }
    .btn-action { background: linear-gradient(180deg, #1e293b, #0f172a); border-color: #38bdf8; color: #38bdf8; }
    .btn-orb { background: linear-gradient(180deg, #0369a1, #0c4a6e); border-color: #38bdf8; color: #bae6fd; }
    .btn-tag { grid-column: span 1; background: linear-gradient(180deg, #7c3aed, #5b21b6); border-color: #a78bfa; color: #fff; }
    .btn-ultimate { grid-column: span 3; background: linear-gradient(180deg, #f59e0b, #b45309); border-color: #fbbf24; color: #fff; font-size: 10px; min-height: 36px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-content {
      background: #111827; border: 2px solid var(--gold-border); border-radius: 12px;
      padding: 20px; max-width: 420px; width: 100%; text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Vanguard Universe: Side Brawler Arcade</div>
    <div class="header-controls">
      <button class="sys-btn" onclick="toggleGamePause()" id="pauseBtn">⏸️ PAUSE</button>
      <button class="sys-btn" onclick="openDailyModal()">🎯 DAILY CHALLENGE (35K)</button>
    </div>
  </header>

  <section class="portal-section">
    <div class="brawler-wrapper">
      <div class="hud-header">
        <div class="hud-top-row">
          <span id="heroNameLabel" class="hero-title">Marcus Prime (Lead) & Xochitl (AI)</span>
          <span id="waveDisplay" class="wave-badge">Wave 1: Scout Vanguard</span>
        </div>
        <div class="bars-container">
          <div class="bar-group">
            <div class="bar-label"><span>Team Health</span><span id="heroHpText">100/100</span></div>
            <div class="bar-track"><div id="heroHpBar" class="bar-fill-hero"></div></div>
          </div>
          <div class="bar-group">
            <div class="bar-label"><span id="enemyTypeLabel">Syndicate Swarm</span><span id="enemyHpText">14 Units</span></div>
            <div class="bar-track"><div id="enemyHpBar" class="bar-fill-enemy"></div></div>
          </div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="gameCanvas" width="540" height="280"></canvas>
      </div>

      <div class="combat-log" id="combatLog">Tactical Co-Op active! Partner fights autonomously.</div>

      <div class="controls-grid">
        <div class="dpad-cluster">
          <button class="btn" onclick="playerMove(-25)">◄ LEFT</button>
          <button class="btn" onclick="playerJump()">▲ JUMP</button>
          <button class="btn" onclick="playerMove(25)">RIGHT ►</button>
        </div>

        <div class="action-cluster">
          <button id="btnStrike" class="btn btn-action" onclick="executeStrike()">⚡ Volt Beam</button>
          <button id="btnOrb" class="btn btn-orb" onclick="executePlasmaOrb()">🔵 Plasma Orb</button>
          <button id="btnBurst" class="btn btn-action" onclick="executeBurst()">🛡️ Kinetic Counter</button>
          <button id="btnTag" class="btn btn-tag" onclick="executeTagSwap()">TAG: XOCHITL</button>
          <button id="btnLuetta" class="btn btn-ultimate" onclick="executeLuettaAid()">★ SUMMON MOTHER LUETTA ★</button>
        </div>
      </div>
    </div>
  </section>

  <div class="modal-overlay" id="dailyModal">
    <div class="modal-content">
      <h2>DAILY CHALLENGE: 35,000 PTS</h2>
      <p style="color: #cbd5e1; font-size: 12px; margin: 10px 0;">Reach 35,000 score to unlock Wakan and win a free e-book voucher!</p>
      <button class="btn" style="background: #f59e0b; color: #000; width: 100%; padding: 10px; font-weight: 800;" onclick="closeDailyModal()">CLOSE</button>
    </div>
  </div>

  <script>
    const SAVE_KEY = 'vanguard_brawler_v6';
    let globalData = { score: 0, highestStageUnlocked: 1, unlockedOperatives: ["marcus", "xochitl", "sundiata", "kofi", "amina", "wakan"] };

    let canvas, ctx;
    let animationFrameId = null;
    let isPaused = false;

    const ASSETS = {
      bg: new Image(), marcus: new Image(), xochitl: new Image(),
      sundiata: new Image(), kofi: new Image(), amina: new Image(), wakan: new Image(),
      boss: new Image(), ironclad: new Image(), luetta: new Image()
    };
    ASSETS.bg.src = "bg-detroit.jpg";
    ASSETS.marcus.src = "marcus.png";
    ASSETS.xochitl.src = "xochitl.png";
    ASSETS.sundiata.src = "sundiata-prime.png";
    ASSETS.kofi.src = "kofi.png";
    ASSETS.amina.src = "amina-zazzau.png";
    ASSETS.wakan.src = "wakan.png";
    ASSETS.boss.src = "chrono-lock.png";
    ASSETS.ironclad.src = "ironclad.png";
    ASSETS.luetta.src = "mother-luta.png";

    let unlockedRoster = globalData.unlockedOperatives;
    let rosterIdx = 0;
    let activeLead = "marcus";
    let leadX = 90, leadY = 0, leadVy = 0, isGrounded = true;
    let aiPartner = { x: 35 };
    let playerHp = 100, isShieldActive = false;

    let kofiHammerSwing = { active: false, timer: 0, maxTimer: 14 };
    let xochitlFlight = { active: false, state: 'INACTIVE', x: 0, y: 0, timer: 0 };
    let sundiataShockwave = { active: false, x: 0, radius: 0 };
    let tsunamis = [], daggers = [], lightningBolts = [], enemies = [], boss = { x: 380, hp: 24, maxHp: 24, active: false };
    let currentWave = 1, mobsRemaining = 14, mobsTotal = 14, gameActive = true;
    let windLines = [];
    for (let i = 0; i < 20; i++) windLines.push({ x: Math.random() * 540, y: Math.random() * 240, len: Math.random() * 30 + 15, speed: Math.random() * 4 + 5 });

    function initBrawler() {
      canvas = document.getElementById("gameCanvas");
      ctx = canvas.getContext("2d");
      canvas.width = 540; canvas.height = 280;
      startWave(1);
      if (!animationFrameId) animationFrameId = requestAnimationFrame(renderBrawler);
    }

    function toggleGamePause() { isPaused = !isPaused; document.getElementById("pauseBtn").innerText = isPaused ? "▶️ RESUME" : "⏸️ PAUSE"; }
    function openDailyModal() { document.getElementById("dailyModal").style.display = "flex"; }
    function closeDailyModal() { document.getElementById("dailyModal").style.display = "none"; }

    function startWave(num) {
      currentWave = num;
      if (num === 1) {
        mobsRemaining = 14; mobsTotal = 14; boss.active = false;
        enemies = [];
        for (let i = 0; i < 14; i++) enemies.push({ type: "drone", x: 520 + (i * 65), y: 200, hp: 2, speed: 1.15, active: true });
      }
      updateHUD();
    }

    function playerMove(dx) { if (!gameActive || isPaused) return; leadX = Math.max(60, Math.min(330, leadX + dx)); }
    function playerJump() { if (!gameActive || isPaused || !isGrounded) return; leadVy = -12; isGrounded = false; }

    function executeTagSwap() {
      if (!gameActive || isPaused) return;
      if (xochitlFlight.active) { xochitlFlight.active = false; xochitlFlight.state = 'INACTIVE'; }
      rosterIdx = (rosterIdx + 1) % unlockedRoster.length;
      activeLead = unlockedRoster[rosterIdx];
      updateControlsUI();
    }

    function updateControlsUI() {
      const partner = unlockedRoster.filter(r => r !== activeLead)[0] || "xochitl";
      const names = { marcus: "Marcus Prime", xochitl: "Xochitl", sundiata: "Sundiata Prime", kofi: "Kofi Osei", amina: "Amina Zazzau", wakan: "Wakan" };
      document.getElementById("heroNameLabel").innerText = `${names[activeLead]} (Lead) & ${names[partner]} (AI)`;
      document.getElementById("btnTag").innerText = `TAG: ${unlockedRoster[(rosterIdx + 1) % unlockedRoster.length].toUpperCase()}`;

      if (activeLead === "marcus") {
        document.getElementById("btnStrike").innerText = "⚡ Volt Beam";
        document.getElementById("btnOrb").innerText = "🔵 Plasma Orb";
        document.getElementById("btnBurst").innerText = "🛡️ Kinetic Counter";
      } else if (activeLead === "xochitl") {
        document.getElementById("btnStrike").innerText = "🔥 Magma Strike";
        document.getElementById("btnOrb").innerText = "🪶 Solar Strafe";
        document.getElementById("btnBurst").innerText = "🛡️ Wing Shield";
      } else if (activeLead === "sundiata") {
        document.getElementById("btnStrike").innerText = "🔨 Drum Tremor";
        document.getElementById("btnOrb").innerText = "🔵 Plasma Blast";
        document.getElementById("btnBurst").innerText = "🦁 Solar Lion Roar";
      } else if (activeLead === "kofi") {
        document.getElementById("btnStrike").innerText = "⚒️ Anvil Sledge";
        document.getElementById("btnOrb").innerText = "✨ Molten Shards";
        document.getElementById("btnBurst").innerText = "🛡️ Crucible Bastion";
      } else if (activeLead === "wakan") {
        document.getElementById("btnStrike").innerText = "🌊 Tidal Wave";
        document.getElementById("btnOrb").innerText = "🌀 Hurricane Tsunami";
        document.getElementById("btnBurst").innerText = "🛡️ Hydro Shield";
      }
    }

    function executeStrike() {
      if (!gameActive || isPaused) return;
      if (activeLead === "kofi") {
        kofiHammerSwing.active = true; kofiHammerSwing.timer = kofiHammerSwing.maxTimer;
      } else if (activeLead === "sundiata") {
        sundiataShockwave.active = true; sundiataShockwave.x = leadX + 30; sundiataShockwave.radius = 10;
      } else if (activeLead === "wakan") {
        tsunamis.push({ x: leadX + 30, y: 195, vx: 7.0, width: 120, height: 45, life: 65, waveShape: true });
      } else {
        lightningBolts.push({ segments: [{x1:leadX+40, y1:180, x2:leadX+120, y2:180}], weight: 3, life: 8 });
      }
    }

    function executePlasmaOrb() {
      if (!gameActive || isPaused) return;
      if (activeLead === "xochitl" && !xochitlFlight.active) {
        xochitlFlight.active = true; xochitlFlight.state = 'ASCENT';
        xochitlFlight.x = leadX; xochitlFlight.y = 165; xochitlFlight.timer = 0;
      } else if (activeLead === "wakan") {
        tsunamis.push({ x: leadX + 30, y: 185, vx: 8.5, width: 170, height: 60, life: 80, waveShape: true });
      }
    }

    function executeBurst() {
      if (!gameActive || isPaused) return;
      if (activeLead === "sundiata") {
        sundiataShockwave.active = true; sundiataShockwave.x = leadX + 30; sundiataShockwave.radius = 15;
      } else {
        isShieldActive = true; setTimeout(() => isShieldActive = false, 3000);
      }
    }

    function executeLuettaAid() {
      if (!gameActive || isPaused) return;
      playerHp = 100; updateHUD();
      enemies.forEach(e => e.active = false);
    }

    function renderBrawler() {
      if (!isPaused) {
        ctx.save();
        if (ASSETS.bg.complete && ASSETS.bg.naturalWidth > 0) {
          ctx.drawImage(ASSETS.bg, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#090d16"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Ground platform
        ctx.fillStyle = "#030712"; ctx.fillRect(0, 240, canvas.width, 40);
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(canvas.width, 240); ctx.stroke();

        if (!isGrounded) { leadY -= leadVy; leadVy += 0.8; if (leadY <= 0) { leadY = 0; leadVy = 0; isGrounded = true; } }

        const currentLeadY = (165 - leadY);

        // Render Active Lead Character (with Wakan sprite support)
        if (!xochitlFlight.active) {
          let leadImg = ASSETS[activeLead];
          ctx.save();
          ctx.translate(leadX + 28, currentLeadY + 36);
          if (leadImg && leadImg.complete && leadImg.naturalWidth > 0) {
            ctx.drawImage(leadImg, -28, -36, 56, 72);
          } else {
            ctx.fillStyle = activeLead === "wakan" ? "#0284c7" : "#f59e0b";
            ctx.fillRect(-14, -30, 28, 60);
          }
          ctx.restore();

          // Kofi Sledgehammer Rendering
          if (activeLead === "kofi") {
            ctx.save();
            ctx.fillStyle = "#d4af37";
            ctx.fillRect(leadX + 32, currentLeadY + 10, 24, 12);
            ctx.restore();
            if (kofiHammerSwing.active) {
              ctx.save();
              ctx.strokeStyle = "rgba(245, 158, 11, 0.9)";
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(leadX + 28, 240, 15 + (14 - kofiHammerSwing.timer) * 3, 0, Math.PI);
              ctx.stroke();
              ctx.restore();
              kofiHammerSwing.timer--;
              if (kofiHammerSwing.timer <= 0) kofiHammerSwing.active = false;
            }
          }

          // Sundiata / Drum Shockwave Ground Beat
          if (activeLead === "sundiata" && sundiataShockwave.active) {
            ctx.save();
            ctx.strokeStyle = "rgba(245, 158, 11, 0.9)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sundiataShockwave.x, 235, sundiataShockwave.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            sundiataShockwave.radius += 6;
            if (sundiataShockwave.radius > 90) sundiataShockwave.active = false;
          }
        }

        // Protective Shield (Locks to character whether grounded or flying)
        if (isShieldActive || xochitlFlight.active) {
          ctx.save();
          ctx.strokeStyle = "rgba(249, 115, 22, 0.85)";
          ctx.lineWidth = 3.0;
          ctx.beginPath();
          ctx.arc(leadX + 28, currentLeadY + 36, 34, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Xochitl Aerial Flight & Dagger Volley
        if (xochitlFlight.active) {
          xochitlFlight.timer++;
          if (xochitlFlight.state === 'ASCENT') {
            xochitlFlight.x += (420 - xochitlFlight.x) * 0.12; xochitlFlight.y += (40 - xochitlFlight.y) * 0.12;
            if (Math.hypot(420 - xochitlFlight.x, 40 - xochitlFlight.y) < 8) xochitlFlight.state = 'STRAFE';
          } else if (xochitlFlight.state === 'STRAFE') {
            xochitlFlight.x -= 3.5;
            if (xochitlFlight.timer % 6 === 0) daggers.push({ x: xochitlFlight.x, y: xochitlFlight.y + 25, vx: 7, vy: 4, length: 18, width: 4 });
            if (xochitlFlight.x <= 120) xochitlFlight.state = 'TOUCHDOWN';
          } else if (xochitlFlight.state === 'TOUCHDOWN') { xochitlFlight.active = false; xochitlFlight.state = 'INACTIVE'; }
          
          ctx.drawImage(ASSETS.xochitl, xochitlFlight.x, xochitlFlight.y, 56, 72);
        }

        // Render AI Partner (Supports Wakan sprite)
        let partnerRole = unlockedRoster.filter(r => r !== activeLead)[0] || "xochitl";
        let aiImg = ASSETS[partnerRole];
        ctx.save();
        ctx.translate(aiPartner.x + 25, 200);
        if (aiImg && aiImg.complete && aiImg.naturalWidth > 0) {
          ctx.drawImage(aiImg, -25, -36, 52, 70);
        } else {
          ctx.fillStyle = "#38bdf8"; ctx.fillRect(-14, -30, 28, 60);
        }
        ctx.restore();

        // Enemies
        enemies.forEach(e => {
          if (!e.active) return;
          e.x -= e.speed;
          ctx.fillStyle = "#1e293b"; ctx.strokeStyle = "#38bdf8";
          ctx.fillRect(e.x, e.y, 24, 16);
        });

        // Tsunami Crest Waves (Vector Water Waves instead of Bubbles)
        for (let i = tsunamis.length - 1; i >= 0; i--) {
          let t = tsunamis[i];
          t.x += t.vx; t.life--;
          ctx.save();
          ctx.fillStyle = "rgba(14, 165, 233, 0.75)";
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(t.x, t.y + t.height / 2);
          ctx.bezierCurveTo(t.x + t.width * 0.3, t.y - t.height, t.x + t.width * 0.7, t.y - t.height * 0.8, t.x + t.width, t.y + t.height / 2);
          ctx.lineTo(t.x, t.y + t.height / 2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          if (t.life <= 0 || t.x > canvas.width) tsunamis.splice(i, 1);
        }

        daggers.forEach(d => {
          d.x += d.vx; d.y += d.vy;
          ctx.fillStyle = "#f97316"; ctx.fillRect(d.x, d.y, d.length, d.width);
        });

        ctx.restore();
      }
      animationFrameId = requestAnimationFrame(renderBrawler);
    }

    function updateHUD() {
      document.getElementById("heroHpText").innerText = `${playerHp}/100`;
      document.getElementById("heroHpBar").style.width = `${playerHp}%`;
    }

    window.addEventListener("DOMContentLoaded", () => { initBrawler(); updateControlsUI(); });
  </script>
</body>
</html>
