<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Legacy - Upgraded Sports Lounge & Arcade</title>
    <style>
        :root {
            --gold: #f39c12;
            --dark-bg: #0b0f19;
            --panel-bg: rgba(18, 24, 38, 0.85);
            --neon-blue: #00d2ff;
            --neon-red: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 30%, #1a2b4c 0%, #0b0f19 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 2rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #a0aec0;
        }

        .hub-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }

        @media (min-width: 768px) {
            .hub-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .game-card {
            background: var(--panel-bg);
            border: 2px solid #2d3748;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Upgraded Arena Canvas Styles */
        .arena-viewport {
            width: 100%;
            height: 280px;
            background: linear-gradient(to bottom, #111b2b, #070a11);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #4a5568;
        }

        /* Basketball Arena Elements */
        .court-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 140px;
            background: linear-gradient(45deg, #8b4513, #d2691e);
            transform: perspective(300px) rotateX(60deg);
            transform-origin: bottom center;
            border-top: 2px solid #fff;
        }

        .backboard {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 60px;
            border: 3px solid #fff;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .hoop {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 15px;
            border: 3px solid var(--neon-red);
            border-radius: 50%;
        }

        .player-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            border-left: 3px solid var(--neon-blue);
        }

        .score-banner {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(243, 156, 18, 0.2);
            border: 1px solid var(--gold);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--gold);
        }

        /* Pool Arena Elements */
        .pool-table {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 75%;
            background: #104e28;
            border: 10px solid #5c3a21;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .cue-ball {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }

        .aim-line {
            position: absolute;
            top: 30%;
            left: 50%;
            width: 2px;
            height: 80px;
            background: var(--neon-blue);
            transform: translateX(-50%);
            box-shadow: 0 0 8px var(--neon-blue);
        }

        /* Interactive Controls */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: var(--gold);
            color: #000;
        }

        .btn-primary:hover {
            background: #e67e22;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.6);
        }

        .btn-secondary {
            background: #2d3748;
            color: #fff;
            border: 1px solid #4a5568;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rhodes Family Legacy</h1>
        <p class="subtitle">Upgraded High-Performance 2.5D Sports Lounge & Arcade Hub</p>
    </header>

    <div class="hub-container">
        <!-- Basketball Upgrade Preview -->
        <div class="game-card">
            <div class="game-title">🏀 Marcus Prime Basketball Showdown</div>
            <div class="arena-viewport" id="basketball-viewport">
                <div class="player-hud">Team: Detroit Diaspora | PWR: 91</div>
                <div class="score-banner">72 - 70</div>
                <div class="backboard"></div>
                <div class="hoop"></div>
                <div class="court-floor"></div>
            </div>
            <div class="controls-row">
                <button class="action-btn btn-primary" onclick="triggerFireball()">Fireball Shot</button>
                <button class="action-btn btn-secondary" onclick="resetBasketball()">Reset Court</button>
            </div>
        </div>

        <!-- Pool Upgrade Preview -->
        <div class="game-card">
            <div class="game-title">🎱 Syndicate 8-Ball Lounge</div>
            <div class="arena-viewport" id="pool-viewport">
                <div class="player-hud">Cue Precision: 95%</div>
                <div class="score-banner">Match 3 / 6</div>
                <div class="pool-table">
                    <div class="aim-line"></div>
                    <div class="cue-ball"></div>
                </div>
            </div>
            <div class="controls-row">
                <button class="action-btn btn-primary" onclick="rotateCue()">Rotate Aim</button>
                <button class="action-btn btn-secondary" onclick="resetPool()">Rerack Table</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Tommy Philip Rhodes. Rhodes Family Legacy Hub.</p>
    </footer>

    <script>
        function triggerFireball() {
            const viewport = document.getElementById('basketball-viewport');
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.inset = '0';
            flash.style.background = 'radial-gradient(circle, rgba(255,51,102,0.4) 0%, transparent 70%)';
            flash.style.zIndex = '10';
            viewport.appendChild(flash);
            setTimeout(() => flash.remove(), 400);
        }

        function resetBasketball() {
            console.log("Basketball court refreshed with stadium crowd ambience.");
        }

        function rotateCue() {
            const line = document.querySelector('.aim-line');
            const currentRotation = line.style.transform;
            line.style.transform = currentRotation.includes('rotate(45deg)') ? 'translateX(-50%) rotate(0deg)' : 'translateX(-50%) rotate(45deg)';
        }

        function resetPool() {
            console.log("Pool table reracked with dynamic 2.5D physics.");
        }
    </script>
</body>
</html>
