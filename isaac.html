<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Universe & Sports Lounge - Rhodes Family Legacy</title>
    <style>
        :root {
            --gold: #f39c12;
            --dark-bg: #07090f;
            --panel-bg: #121824;
            --neon-blue: #00d2ff;
            --neon-red: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 8px;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.15rem;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .top-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-bottom: 8px;
            width: 100%;
            max-width: 480px;
        }

        .nav-btn {
            padding: 6px 10px;
            border: 1px solid var(--gold);
            background: var(--panel-bg);
            color: var(--gold);
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .nav-btn.active {
            background: var(--gold);
            color: #000;
        }

        .sport-tabs {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
            width: 100%;
            max-width: 480px;
        }

        .sport-tab {
            flex: 1;
            padding: 8px;
            border: 1px solid #4a5568;
            background: var(--panel-bg);
            color: #a0aec0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75srem;
            cursor: pointer;
            text-align: center;
        }

        .sport-tab.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .game-container {
            background: var(--panel-bg);
            border: 2px solid #2d3748;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .game-view {
            width: 100%;
            height: 300px;
            background: #07090f;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            display: none;
        }

        .game-view.active {
            display: block;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--gold);
        }

        .instruction-text {
            margin: 6px 0;
            font-size: 0.7rem;
            color: #a0aec0;
            text-align: center;
            min-height: 20px;
        }

        .controls-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            background: var(--gold);
            color: #000;
        }

        .action-btn:hover {
            background: #e67e22;
        }

        .btn-secondary {
            background: #2d3748;
            color: #fff;
            border: 1px solid #4a5568;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vanguard Universe & Sports Lounge</h1>
    </header>

    <div class="top-nav">
        <button class="nav-btn">⏸ PAUSE</button>
        <button class="nav-btn">⚔ SIDE BRAWLER</button>
        <button class="nav-btn active">🏀 SPORTS LOUNGE</button>
        <button class="nav-btn">🎯 CHALLENGE</button>
    </div>

    <div class="sport-tabs">
        <button class="sport-tab active" onclick="switchSport('basketball')">🏀 Basketball</button>
        <button class="sport-tab" onclick="switchSport('pool')">🎱 Pool Table</button>
        <button class="sport-tab" onclick="switchSport('bowling')">🎳 Bowling</button>
    </div>

    <div class="game-container">
        <!-- Basketball View -->
        <div id="view-basketball" class="game-view active">
            <canvas id="bbCanvas" width="440" height="300"></canvas>
        </div>

        <!-- Pool View -->
        <div id="view-pool" class="game-view">
            <canvas id="poolCanvas" width="440" height="300"></canvas>
        </div>

        <!-- Bowling View -->
        <div id="view-bowling" class="game-view">
            <canvas id="bowlCanvas" width="440" height="300"></canvas>
        </div>

        <div class="score-bar">
            <span id="score-label">SCORE: 70</span>
            <span id="bonus-label">MARROW BONUS: 350 ME</span>
        </div>

        <div class="instruction-text" id="instruction-label">
            Adjust aim, hold power meter, and release for Class-A action!
        </div>

        <div class="controls-row">
            <button class="action-btn btn-secondary" onclick="adjustAim(-1)">◄ Adjust Aim</button>
            <button class="action-btn" id="main-action-btn" onclick="triggerShot()">Hold & Release Shot</button>
            <button class="action-btn btn-secondary" onclick="adjustAim(1)">Adjust Aim ►</button>
        </div>
    </div>

    <script>
        let currentSport = 'basketball';

        function switchSport(sport) {
            currentSport = sport;
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));

            if (sport === 'basketball') {
                document.getElementById('view-basketball').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Adjust aim, hold power meter, and release for Class-A action!";
            } else if (sport === 'pool') {
                document.getElementById('view-pool').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Line up cue stick and power shot for Syndicate pocketing!";
            } else if (sport === 'bowling') {
                document.getElementById('view-bowling').classList.add('active');
                event.target.classList.add('active');
                document.getElementById('instruction-label').innerText = "Aim down Monument Valley lane for a strike!";
            }
        }

        // --- Original Basketball Implementation ---
        const bbCanvas = document.getElementById('bbCanvas');
        const bbCtx = bbCanvas.getContext('2d');
        let ballX = 65, ballY = 220, aimAngle = -0.6, isShooting = false, scoreVal = 70;

        function drawBasketball() {
            bbCtx.fillStyle = '#07090f';
            bbCtx.fillRect(0, 0, 440, 300);

            // Watermark / Golden Double Helix Tree Emblem
            bbCtx.fillStyle = 'rgba(243, 156, 18, 0.15)';
            bbCtx.font = '11px sans-serif';
            bbCtx.fillText('RHODES FAMILY LEGACY', 150, 40);
            
            bbCtx.strokeStyle = '#f39c12';
            bbCtx.lineWidth = 2;
            bbCtx.beginPath();
            bbCtx.moveTo(220, 150); bbCtx.lineTo(220, 50);
            // Double helix ladder steps
            for(let i=60; i<140; i+=10) {
                bbCtx.moveTo(210, i); bbCtx.lineTo(230, i + 4);
            }
            // Tree branches
            bbCtx.moveTo(220, 60); bbCtx.quadraticCurveTo(190, 40, 170, 30);
            bbCtx.moveTo(220, 60); bbCtx.quadraticCurveTo(250, 40, 270, 30);
            bbCtx.stroke();

            // Basketball Hoop (Right Side)
            bbCtx.strokeStyle = '#00d2ff';
            bbCtx.lineWidth = 3;
            bbCtx.strokeRect(360, 90, 12, 80);
            bbCtx.strokeStyle = '#ff3366';
            bbCtx.beginPath();
            bbCtx.arc(348, 120, 20, 0, Math.PI);
            bbCtx.stroke();

            // Character / Hero (Left Side)
            bbCtx.fillStyle = '#8e44ad';
            bbCtx.fillRect(45, 185, 24, 45); // Body
            bbCtx.fillStyle = '#f39c12';
            bbCtx.beginPath(); bbCtx.arc(57, 175, 9, 0, Math.PI*2); bbCtx.fill(); // Head

            // Basketball
            bbCtx.fillStyle = '#f39c12';
            bbCtx.beginPath();
            bbCtx.arc(ballX, ballY, 12, 0, Math.PI * 2);
            bbCtx.fill();
            bbCtx.strokeStyle = '#000';
            bbCtx.lineWidth = 1.5;
            bbCtx.stroke();

            // Aim Line
            bbCtx.strokeStyle = '#00d2ff';
            bbCtx.lineWidth = 2;
            bbCtx.setLineDash([4, 4]);
            bbCtx.beginPath();
            bbCtx.moveTo(ballX, ballY);
            bbCtx.lineTo(ballX + Math.cos(aimAngle) * 90, ballY + Math.sin(aimAngle) * 90);
            bbCtx.stroke();
            bbCtx.setLineDash([]);

            // Court Floor Line
            bbCtx.strokeStyle = '#ff3366';
            bbCtx.lineWidth = 3;
            bbCtx.beginPath();
            bbCtx.moveTo(0, 232); bbCtx.lineTo(440, 232);
            bbCtx.stroke();

            // Power Meter Box UI
            bbCtx.fillStyle = '#1e293b';
            bbCtx.fillRect(20, 250, 120, 18);
            bbCtx.fillStyle = '#f39c12';
            bbCtx.fillRect(22, 252, 70, 14);
            bbCtx.fillStyle = '#fff';
            bbCtx.font = 'bold 9px sans-serif';
            bbCtx.fillText('POWER METER', 45, 263);
        }

        // --- Pool Canvas ---
        const poolCanvas = document.getElementById('poolCanvas');
        const poolCtx = poolCanvas.getContext('2d');
        let cueX = 220, cueY = 240, poolAimOffset = 0;

        function drawPool() {
            poolCtx.fillStyle = '#07090f';
            poolCtx.fillRect(0, 0, 440, 300);

            // Felt
            poolCtx.fillStyle = '#104e28';
            poolCtx.fillRect(30, 25, 380, 250);
            poolCtx.strokeStyle = '#5c3a21';
            poolCtx.lineWidth = 10;
            poolCtx.strokeRect(30, 25, 380, 250);

            // Ball Rack
            poolCtx.fillStyle = '#f39c12';
            poolCtx.beginPath(); poolCtx.arc(220, 90, 8, 0, Math.PI*2); poolCtx.fill();
            poolCtx.fillStyle = '#2980b9';
            poolCtx.beginPath(); poolCtx.arc(205, 105, 8, 0, Math.PI*2); poolCtx.fill();
            poolCtx.fillStyle = '#c0392b';
            poolCtx.beginPath(); poolCtx.arc(235, 105, 8, 0, Math.PI*2); poolCtx.fill();

            // Cue Ball & Stick
            poolCtx.fillStyle = '#fff';
            poolCtx.beginPath(); poolCtx.arc(cueX + poolAimOffset, cueY, 9, 0, Math.PI*2); poolCtx.fill();

            poolCtx.strokeStyle = '#d4a373';
            poolCtx.lineWidth = 5;
            poolCtx.beginPath();
            poolCtx.moveTo(cueX + poolAimOffset, cueY + 15);
            poolCtx.lineTo(cueX + poolAimOffset, cueY + 120);
            poolCtx.stroke();
        }

        // --- Bowling Canvas ---
        const bowlCanvas = document.getElementById('bowlCanvas');
        const bowlCtx = bowlCanvas.getContext('2d');
        let bowlX = 220, bowlY = 250;

        function drawBowling() {
            bowlCtx.fillStyle = '#07090f';
            bowlCtx.fillRect(0, 0, 440, 300);

            // Alley
            bowlCtx.fillStyle = '#d2691e';
            bowlCtx.beginPath();
            bowlCtx.moveTo(100, 300); bowlCtx.lineTo(340, 300);
            bowlCtx.lineTo(250, 40); bowlCtx.lineTo(190, 40);
            bowlCtx.fill();

            // Pins
            bowlCtx.fillStyle = '#fff';
            bowlCtx.beginPath(); bowlCtx.arc(220, 55, 6, 0, Math.PI*2); bowlCtx.fill();
            bowlCtx.beginPath(); bowlCtx.arc(205, 70, 6, 0, Math.PI*2); bowlCtx.fill();
            bowlCtx.beginPath(); bowlCtx.arc(235, 70, 6, 0, Math.PI*2); bowlCtx.fill();

            // Ball
            bowlCtx.fillStyle = '#00d2ff';
            bowlCtx.beginPath();
            bowlCtx.arc(bowlX, bowlY, 11, 0, Math.PI*2);
            bowlCtx.fill();
            bowlCtx.strokeStyle = '#fff';
            bowlCtx.stroke();
        }

        function adjustAim(dir) {
            if (currentSport === 'basketball') {
                aimAngle += dir * 0.1;
            } else if (currentSport === 'pool') {
                poolAimOffset += dir * 10;
            } else if (currentSport === 'bowling') {
                bowlX += dir * 15;
            }
            redrawActive();
        }

        function triggerShot() {
            if (currentSport === 'basketball' && !isShooting) {
                isShooting = true;
                let timer = setInterval(() => {
                    ballX += 14;
                    ballY -= 7;
                    redrawActive();
                    if (ballX >= 345) {
                        clearInterval(timer);
                        scoreVal += 2;
                        document.getElementById('score-label').innerText = "SCORE: " + scoreVal;
                        setTimeout(resetBasketball, 400);
                    }
                }, 30);
            } else if (currentSport === 'pool') {
                cueY -= 30;
                redrawActive();
                setTimeout(() => { cueY = 240; redrawActive(); }, 300);
            } else if (currentSport === 'bowling') {
                let bt = setInterval(() => {
                    bowlY -= 15;
                    redrawActive();
                    if (bowlY <= 70) {
                        clearInterval(bt);
                        setTimeout(() => { bowlX = 220; bowlY = 250; redrawActive(); }, 400);
                    }
                }, 30);
            }
        }

        function resetBasketball() {
            ballX = 65; ballY = 220; aimAngle = -0.6; isShooting = false;
            redrawActive();
        }

        function redrawActive() {
            if (currentSport === 'basketball') drawBasketball();
            else if (currentSport === 'pool') drawPool();
            else if (currentSport === 'bowling') drawBowling();
        }

        // Initial render
        drawBasketball();
        drawPool();
        drawBowling();
    </script>
</body>
</html>
