<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detroit City Rescue Hub | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .hud {
      width: 100%;
      background: #111827;
      border: 2px solid #f59e0b;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: #38bdf8;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: #1e293b;
      border: 3px solid #3b82f6;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }
    .ctrl-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 0 #1d4ed8;
      transition: transform 0.1s;
    }
    .ctrl-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .btn-action {
      background: #10b981;
      box-shadow: 0 4px 0 #047857;
      grid-column: span 3;
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .back-link:hover {
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 0</span>
      <span id="mission-display">MISSION: PUT OUT FIRES!</span>
      <span id="timer-display">TIME: 45s</span>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls">
      <button class="ctrl-btn" ontouchstart="moveTruck(-15)" onclick="moveTruck(-15)">⬅️ LEFT</button>
      <button class="ctrl-btn btn-action" ontouchstart="triggerAction()" onclick="triggerAction()">💦 WATER BLAST / RESCUE 🚨</button>
      <button class="ctrl-btn" ontouchstart="moveTruck(15)" onclick="moveTruck(15)">RIGHT ➡️</button>
    </div>

    <a href="index.html" class="back-link">← RETURN TO MAIN PORTAL</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 45;
    let gameActive = true;
    let missionType = "fire"; // 'fire' or 'rescue'

    // Truck object
    let truck = {
      x: 270,
      y: 320,
      width: 60,
      height: 50,
      speed: 20
    };

    // Target object (Burning House or Citizen in Need)
    let target = {
      x: Math.random() * 500 + 50,
      y: 60,
      width: 50,
      height: 50,
      active: true,
      health: 100
    };

    function moveTruck(dir) {
      if (!gameActive) return;
      truck.x += dir;
      if (truck.x < 10) truck.x = 10;
      if (truck.x > canvas.width - truck.width - 10) truck.x = canvas.width - truck.width - 10;
    }

    function triggerAction() {
      if (!gameActive) return;
      
      // Check proximity to target
      if (Math.abs(truck.x - target.x) < 50 && target.active) {
        if (missionType === "fire") {
          target.health -= 34;
          if (target.health <= 0) {
            target.active = false;
            score += 100;
            spawnNewTarget();
          }
        } else {
          target.active = false;
          score += 150;
          spawnNewTarget();
        }
      }
    }

    function spawnNewTarget() {
      target.x = Math.random() * 480 + 40;
      target.active = true;
      target.health = 100;
      missionType = Math.random() > 0.5 ? "fire" : "rescue";
      document.getElementById('mission-display').textContent = missionType === "fire" ? "MISSION: PUT OUT FIRE! 🔥" : "MISSION: RESCUE CITIZEN! 🦸🏾‍♂️";
    }

    // Game Timer Loop
    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--;
      document.getElementById('timer-display').textContent = `TIME: ${timeLeft}s`;
      if (timeLeft <= 0) {
        gameActive = false;
        clearInterval(timerInterval);
      }
    }, 1000);

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Detroit City Road Background
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.lineTo(canvas.width, 250);
      ctx.stroke();

      // Draw Target (House Fire or Citizen)
      if (target.active) {
        ctx.fillStyle = missionType === "fire" ? '#ef4444' : '#10b981';
        ctx.fillRect(target.x, target.y, target.width, target.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(missionType === "fire" ? `🔥 ${target.health}%` : "🆘 HELP", target.x - 5, target.y - 10);
      }

      // Draw Emergency Rescue Vehicle
      ctx.fillStyle = missionType === "fire" ? '#dc2626' : '#2563eb';
      ctx.fillRect(truck.x, truck.y, truck.width, truck.height);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(truck.x + 15, truck.y + 10, 30, 20); // windshield / lights

      // Update HUD
      document.getElementById('score-display').textContent = `SCORE: ${score}`;

      if (!gameActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f59e0b';
        ctx.font = '28px sans-serif';
        ctx.fillText("MISSION COMPLETE!", 140, 180);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Final Score: ${score}`, 210, 225);
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
