            upg: "🏠 UPGRADE HOTEL ($50)",

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'ES' : 'EN';
        document.getElementById('btn-roll').innerText = i18n[currentLang].roll;
        document.getElementById('btn-buy').innerText = i18n[currentLang].buy;
        document.getElementById('btn-upg').innerText = i18n[currentLang].upg;
        document.getElementById('txt-p2p').innerText = i18n[currentLang].p2p;
        document.getElementById('txt-reserves').innerText = i18n[currentLang].reserves;
        document.getElementById('lang-btn').innerText = i18n[currentLang].langBtn;
    }

    let isVoiceEnabled = true;

    function speakGameEvent(text) {
        if (isVoiceEnabled && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleVoiceNarration() {
        isVoiceEnabled = !isVoiceEnabled;
        const btn = document.getElementById('voiceToggleBtn');
        if (btn) btn.textContent = isVoiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
        if (!isVoiceEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function switchApp(appKey, evt) {
        document.querySelectorAll('.app-container').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if(tetrisInterval) { clearInterval(tetrisInterval); tetrisInterval = null; }

        if(appKey === 'tycoon') {
            document.getElementById('tycoon-view').classList.remove('hidden');
            drawTycoonBoard();
        } else if(appKey === 'tetris') {
            document.getElementById('tetris-view').classList.remove('hidden');
            initTetris();
        } else if(appKey === 'wordsearch') {
            document.getElementById('wordsearch-view').classList.remove('hidden');
            initWordSearch();
        }
        evt.target.classList.add('active');
    }

    function logTycoon(msg) {
        const box = document.getElementById('log-box');
        box.innerHTML += `<br>&gt; ${msg}`;
        box.scrollTop = box.scrollHeight;
        speakGameEvent(msg);
    }

    treeImg.onload = function() { drawTycoonBoard(); };

                { name: "Santa Ana River Trail", cost: 250, owner: "None", type: "prop", color: "#9b59b6", rent: 62 },
                { name: "GOLDEN STATE VAULT", cost: 290, owner: "None", type: "prop", color: "#2ecc71", rent: 72 },
                { name: "Magnolia Avenue", cost: 270, owner: "None", type: "prop", color: "#2ecc71", rent: 68 },
                { name: "Orange Crest", cost: 310, owner: "None", type: "prop", color: "#2ecc71", rent: 78 },

                { name: "Riverside Estate", cost: 360, owner: "None", type: "prop", color: "#2ecc71", rent: 98 }
            ]
        }
    };

    let currentCityKey = 'detroit';

    let tycoonGame = {
        funds: 625,
        p2Funds: 625,
        position: 0,
        p2Position: 0,
        p1Name: "Tommy",
        p1Token: "🔵",
        p2Name: "Guest P2",
        p2Token: "🟠",
        myRole: "p1",
        gameMode: "ai",
        turn: "Tommy",
        tiles: JSON.parse(JSON.stringify(cityBoards.detroit.tiles))
    };

    let tileRects = [];
    let peer = null;
    let conn = null;

    window.addEventListener('DOMContentLoaded', () => {
        applyProfileSettings();
        drawTycoonBoard();
    });

    function applyProfileSettings() {
        let nameVal = document.getElementById('player-name-input').value || "Tommy";
        let roleVal = document.getElementById('player-role-select').value;
        let tokenVal = document.getElementById('player-color-select').value;
        let modeVal = document.getElementById('game-mode-select').value;
        
        tycoonGame.myRole = roleVal;
        tycoonGame.gameMode = modeVal;

        if(roleVal === 'p1') {
            tycoonGame.p1Name = nameVal;
            tycoonGame.p1Token = tokenVal;
            if(tycoonGame.p2Token === tokenVal) tycoonGame.p2Token = "🟠";
        } else {
            tycoonGame.p2Name = nameVal;
            tycoonGame.p2Token = tokenVal;
            if(tycoonGame.p1Token === tokenVal) tycoonGame.p1Token = "🔵";
        }

        updateUIFunds();
    }

    function updateUIFunds() {
        document.getElementById('tycoon-funds').innerText = `${tycoonGame.myRole === 'p1' ? tycoonGame.funds : tycoonGame.p2Funds} ME`;
        document.getElementById('p1-bal').innerText = tycoonGame.funds;
        document.getElementById('p2-bal').innerText = tycoonGame.p2Funds;
        document.getElementById('p1-label-name').innerText = tycoonGame.p1Name;
        document.getElementById('p1-label-token').innerText = tycoonGame.p1Token;
        document.getElementById('p2-label-name').innerText = tycoonGame.p2Name;
        document.getElementById('p2-label-token').innerText = tycoonGame.p2Token;
    }

    // --- P2P HOST & JOIN WORKFLOW ---
    function hostP2PSession() {
        if(peer) peer.destroy();
        let customCode = document.getElementById('room-code-input').value || "RHODES-1";
        let hostId = "rhodes-hub-" + customCode.toLowerCase();
        
        peer = new Peer(hostId);
        peer.on('open', (id) => {
            logTycoon(`Hosting P2P Room! Your ID to share: ${id}`);
        });
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupConnectionEvents();
            logTycoon(`Player joined your board successfully!`);
            broadcastState();
        });
        peer.on('error', (err) => {
            logTycoon(`Host Error: ID may be in use. Try a new room code.`);
        });
    }

    function joinP2PSession() {
        if(peer) peer.destroy();
        let targetCode = document.getElementById('room-code-input').value || "RHODES-1";
        let hostId = "rhodes-hub-" + targetCode.toLowerCase();

        peer = new Peer();
        peer.on('open', (id) => {
            logTycoon(`Connecting to host ID: ${hostId}...`);
            conn = peer.connect(hostId);
            setupConnectionEvents();
        });
        peer.on('error', (err) => {
            logTycoon(`Connection failed. Check Host ID / Room Code.`);
        });
    }

    function setupConnectionEvents() {
        if(!conn) return;
        conn.on('data', (data) => {
            tycoonGame = data;
            updateUIFunds();
            drawTycoonBoard();
            logTycoon(`Synced state from peer.`);
        });
        conn.on('open', () => {
            logTycoon(`P2P Secure Link Established! Ready to play.`);
            broadcastState();
        });
    }

    function broadcastState() {
        if(conn && conn.open) {
            conn.send(tycoonGame);
        }
    }

    function resetTycoonGame() {
        tycoonGame.funds = 625;
        tycoonGame.p2Funds = 625;
        tycoonGame.position = 0;
        tycoonGame.p2Position = 0;
        tycoonGame.tiles = JSON.parse(JSON.stringify(cityBoards[currentCityKey].tiles));
        updateUIFunds();
        drawTycoonBoard();
        logTycoon(`Board reset!`);
        broadcastState();
    }

    function manualSync() {
        applyProfileSettings();
        if(tycoonGame.gameMode === 'p2p') {
            if(tycoonGame.myRole === 'p1') {
                hostP2PSession();
            } else {
                joinP2PSession();
            }
        } else {
            logTycoon(`AI Bot mode active.`);
            drawTycoonBoard();
        }
    }

    function changeCityBoard(cityKey) {
        currentCityKey = cityKey;
        tycoonGame.tiles = JSON.parse(JSON.stringify(cityBoards[cityKey].tiles));
        tycoonGame.position = 0;
        tycoonGame.p2Position = 0;
        logTycoon(`Switched board map to ${cityBoards[cityKey].title}!`);
        drawTycoonBoard();
        broadcastState();
    }

    function drawTycoonBoard() {
        tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
        tileRects = [];

        tCtx.strokeStyle = 'rgba(69, 162, 158, 0.15)';
        tCtx.lineWidth = 1;
        let gridSize = 30;
        for (let x = 0; x < tCanvas.width; x += gridSize) {
            tCtx.beginPath(); tCtx.moveTo(x, 0); tCtx.lineTo(x, tCanvas.height); tCtx.stroke();
        }
        for (let y = 0; y < tCanvas.height; y += gridSize) {
            tCtx.beginPath(); tCtx.moveTo(0, y); tCtx.lineTo(tCanvas.width, y); tCtx.stroke();
        }

        let coords = [
            {x: 740, y: 435}, {x: 590, y: 435}, {x: 440, y: 435}, {x: 290, y: 435}, {x: 140, y: 435},
            {x: 10, y: 435}, {x: 10, y: 345}, {x: 10, y: 255}, {x: 10, y: 165}, {x: 10, y: 75},
            {x: 140, y: 15}, {x: 290, y: 15}, {x: 440, y: 15}, {x: 590, y: 15}, {x: 740, y: 15},
            {x: 740, y: 100}, {x: 740, y: 185}, {x: 740, y: 270}, {x: 740, y: 355}, {x: 740, y: 435}
        ];

        tycoonGame.tiles.forEach((t, i) => {
            let pt = coords[i] || {x: 50, y: 50};
            let w = 150, h = 90;
            tileRects.push({x: pt.x, y: pt.y, w: w, h: h, index: i});
            
            let isP1Here = (tycoonGame.position === i);
            let isP2Here = (tycoonGame.p2Position === i);

            tCtx.fillStyle = (isP1Here || isP2Here) ? '#1f2833' : '#0b0c10';
            tCtx.strokeStyle = t.color;
            tCtx.lineWidth = (isP1Here || isP2Here) ? 2.5 : 1.5;
            
            tCtx.save();
            tCtx.shadowColor = t.color;
            tCtx.shadowBlur = 8;
            tCtx.fillRect(pt.x, pt.y, w, h);
            tCtx.strokeRect(pt.x, pt.y, w, h);
            tCtx.restore();

            if (t.hasHotel) {
                tCtx.fillStyle = '#ff7b00';
                tCtx.font = 'bold 10px Courier New';
                tCtx.fillText("🏨 [HOTEL]", pt.x + 8, pt.y + 15);
            }

            tCtx.fillStyle = '#f0f2f5';
            tCtx.font = 'bold 11px Courier New';
            tCtx.fillText(t.name.substring(0, 18), pt.x + 8, pt.y + (t.hasHotel ? 30 : 20));
            
            tCtx.fillStyle = '#66fcf1';
            tCtx.font = '10px Courier New';
            tCtx.fillText(t.cost > 0 ? `$${t.cost} (R:$${t.rent})` : t.type.toUpperCase(), pt.x + 8, pt.y + 45);
            
            tCtx.fillStyle = (t.owner === tycoonGame.p1Name) ? '#66fcf1' : (t.owner === tycoonGame.p2Name ? '#ff7b00' : '#94a3b8');
            tCtx.font = 'bold 10px Courier New';
            tCtx.fillText(`Owner: ${t.owner.substring(0, 10)}`, pt.x + 8, pt.y + 65);

            if(isP1Here || isP2Here) {
                tCtx.fillStyle = '#fff';
                tCtx.font = 'bold 13px Courier New';
                let tokenStr = "";
                if(isP1Here) tokenStr += tycoonGame.p1Token + " ";
                if(isP2Here) tokenStr += tycoonGame.p2Token;
                tCtx.fillText(tokenStr, pt.x + 8, pt.y + 83);
            }
        });

        let cx = tCanvas.width / 2;
        let cy = tCanvas.height / 2;

        tCtx.save();
        tCtx.shadowColor = '#66fcf1';
        tCtx.shadowBlur = 20;
        let imgSize = 135;
        tCtx.drawImage(treeImg, cx - (imgSize / 2), cy - (imgSize / 2) - 25, imgSize, imgSize);
        tCtx.restore();

        tCtx.font = "bold 14px Courier New";
        tCtx.fillStyle = "#66fcf1";
        tCtx.textAlign = "center";
        tCtx.shadowColor = "#66fcf1";
        tCtx.shadowBlur = 10;
        tCtx.fillText("RHODES FAMILY LEGACY", cx, cy + 52);
        
        tCtx.font = "11px Courier New";
        tCtx.fillStyle = "#ff7b00";
        tCtx.fillText(cityBoards[currentCityKey].title, cx, cy + 70);
        tCtx.textAlign = "left";
        tCtx.shadowBlur = 0;
    }

    function handleCanvasTouch(event) {
        let rect = tCanvas.getBoundingClientRect();
        let scaleX = tCanvas.width / rect.width;
        let scaleY = tCanvas.height / rect.height;
        let clickX = (event.clientX - rect.left) * scaleX;
        let clickY = (event.clientY - rect.top) * scaleY;

        for(let item of tileRects) {
            if(clickX >= item.x && clickX <= item.x + item.w && clickY >= item.y && clickY <= item.y + item.h) {
                openDeed3DForTile(tycoonGame.tiles[item.index]);
                break;
            }
        }
    }

    function openDeed3DForTile(tile) {
        document.getElementById('ar-deed-name').innerText = tile.name;
        document.getElementById('ar-deed-owner').innerText = `Owner: ${tile.owner}`;
        document.getElementById('ar-deed-value').innerText = tile.cost > 0 ? `Valuation: $${tile.cost} (Rent: $${tile.rent})` : `Special Utility / System Tile`;
        document.getElementById('ar-modal').classList.remove('hidden');
    }

    function closeArModal() { document.getElementById('ar-modal').classList.add('hidden'); }
    function closeEventModal() { document.getElementById('event-modal').classList.add('hidden'); }

    function tycoonAction(action) {
        applyProfileSettings();

        if(action === 'roll') {
            let die1 = Math.floor(Math.random() * 6) + 1;
            let die2 = Math.floor(Math.random() * 6) + 1;
            let rollSum = die1 + die2;

            document.getElementById('dice-1').innerText = die1;
            document.getElementById('dice-2').innerText = die2;
            document.getElementById('dice-card-desc').innerText = `Rolled ${die1} and ${die2} (Total: ${rollSum}) across ${cityBoards[currentCityKey].title}!`;
            document.getElementById('dice-modal').classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('dice-modal').classList.add('hidden');
                
                if(tycoonGame.myRole === 'p1') {
                    let oldPos = tycoonGame.position;
                    tycoonGame.position = (tycoonGame.position + rollSum) % tycoonGame.tiles.length;
                    if(tycoonGame.position < oldPos) tycoonGame.funds += 200;
                    
                    let tile = tycoonGame.tiles[tycoonGame.position];
                    logTycoon(`${tycoonGame.p1Name} rolled ${rollSum}. Landed on ${tile.name}.`);

                    if(tile.type === 'event') {
                        let bonus = Math.random() > 0.5 ? 100 : -50;
                        tycoonGame.funds += bonus;
                    } else if(tile.owner !== "None" && tile.owner !== tycoonGame.p1Name) {
                        tycoonGame.funds -= tile.rent;
                        tycoonGame.p2Funds += tile.rent;
                    }
                } else {
                    let oldPos = tycoonGame.p2Position;
                    tycoonGame.p2Position = (tycoonGame.p2Position + rollSum) % tycoonGame.tiles.length;
                    if(tycoonGame.p2Position < oldPos) tycoonGame.p2Funds += 200;
                    
                    let tile = tycoonGame.tiles[tycoonGame.p2Position];
                    logTycoon(`${tycoonGame.p2Name} rolled ${rollSum}. Landed on ${tile.name}.`);

                    if(tile.type === 'event') {
                        let bonus = Math.random() > 0.5 ? 100 : -50;
                        tycoonGame.p2Funds += bonus;
                    } else if(tile.owner !== "None" && tile.owner !== tycoonGame.p2Name) {
                        tycoonGame.p2Funds -= tile.rent;
                        tycoonGame.funds += tile.rent;
                    }
                }

                updateUIFunds();
                drawTycoonBoard();
                broadcastState();

                if(tycoonGame.gameMode === 'ai' && tycoonGame.myRole === 'p1') {
                    setTimeout(() => triggerAiTurn(), 1500);
                }

            }, 1200);

        } else if(action === 'buy') {
            let activePos = (tycoonGame.myRole === 'p1') ? tycoonGame.position : tycoonGame.p2Position;
            let activeName = (tycoonGame.myRole === 'p1') ? tycoonGame.p1Name : tycoonGame.p2Name;
            let tile = tycoonGame.tiles[activePos];

            if(tile.cost === 0 || tile.owner !== "None") {
                logTycoon(`Tile cannot be acquired.`);
                return;
            }
            let myFunds = (tycoonGame.myRole === 'p1') ? tycoonGame.funds : tycoonGame.p2Funds;
            if(myFunds >= tile.cost) {
                if(tycoonGame.myRole === 'p1') tycoonGame.funds -= tile.cost;
                else tycoonGame.p2Funds -= tile.cost;

                tile.owner = activeName;
                updateUIFunds();
                logTycoon(`${activeName} acquired ${tile.name} for ${tile.cost} ME!`);
                drawTycoonBoard();
                broadcastState();
            } else {
                logTycoon(`Insufficient Marrow Energy.`);
            }
        } else if(action === 'upgrade') {
            let activePos = (tycoonGame.myRole === 'p1') ? tycoonGame.position : tycoonGame.p2Position;
            let activeName = (tycoonGame.myRole === 'p1') ? tycoonGame.p1Name : tycoonGame.p2Name;
            let tile = tycoonGame.tiles[activePos];
            let myFunds = (tycoonGame.myRole === 'p1') ? tycoonGame.funds : tycoonGame.p2Funds;
            const tycoonContainer = document.getElementById('tycoon-view');

            if(tile.owner === activeName && myFunds >= 50) {
                if(tycoonGame.myRole === 'p1') tycoonGame.funds -= 50;
                else tycoonGame.p2Funds -= 50;

                tile.rent += 30;
                tile.hasHotel = true;
                updateUIFunds();
                
                tycoonContainer.classList.add('word-shaking');
                logTycoon(`Hotel built on ${tile.name}! Rent surged to ${tile.rent} ME.`);
                speakGameEvent(`Hotel constructed on ${tile.name}!`);

                setTimeout(() => { tycoonContainer.classList.remove('word-shaking'); }, 400);

                drawTycoonBoard();
                broadcastState();
            } else {
                logTycoon(`You must own the tile and have 50 ME.`);
            }
        }
    }

    function triggerAiTurn() {
        let aiRoll = Math.floor(Math.random() * 6) + Math.floor(Math.random() * 6) + 2;
        let oldPos = tycoonGame.p2Position;
        tycoonGame.p2Position = (tycoonGame.p2Position + aiRoll) % tycoonGame.tiles.length;
        if(tycoonGame.p2Position < oldPos) tycoonGame.p2Funds += 200;

        let tile = tycoonGame.tiles[tycoonGame.p2Position];
        logTycoon(`AI Bot 101 rolled ${aiRoll} and landed on ${tile.name}.`);

        if(tile.owner === "None" && tile.cost > 0 && tycoonGame.p2Funds >= tile.cost) {
            tycoonGame.p2Funds -= tile.cost;
            tile.owner = tycoonGame.p2Name;
            logTycoon(`AI Bot 101 purchased ${tile.name}!`);
        } else if(tile.owner !== "None" && tile.owner !== tycoonGame.p2Name) {
            tycoonGame.p2Funds -= tile.rent;
            tycoonGame.funds += tile.rent;
        }

        updateUIFunds();
        drawTycoonBoard();
    }
</script>
