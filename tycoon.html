<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Business Tycoon - Rhodes Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0c141f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow-y: auto;
      padding: 15px;
      touch-action: manipulation;
    }
    header {
      text-align: center;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.4rem;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }
    #dashboard {
      width: 100%;
      max-width: 440px;
      background: rgba(16, 26, 42, 0.85);
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    #money {
      color: #00ffcc;
    }
    #income {
      color: #ffd700;
    }
    #tap-btn {
      width: 100%;
      max-width: 440px;
      height: 75px;
      background: linear-gradient(135deg, #00ffcc, #0088ff);
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 900;
      color: #050b14;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
      margin-bottom: 20px;
      cursor: pointer;
    }
    #tap-btn:active {
      transform: scale(0.97);
    }
    #shop-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 30px;
    }
    .shop-card {
      background: rgba(20, 32, 52, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-info h3 {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-info p {
      font-size: 0.85rem;
      color: #aaa;
    }
    .buy-btn {
      background: #ffaa00;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #0c141f;
      cursor: pointer;
    }
    .buy-btn:active {
      transform: scale(0.95);
    }
    .buy-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Rhodes Legacy Tycoon</h1>
  </header>

  <div id="dashboard">
    <div class="stat-row">
      <span>Capital:</span>
      <span id="money">$0</span>
    </div>
    <div class="stat-row">
      <span>Passive Income:</span>
      <span id="income">$0 / sec</span>
    </div>
  </div>

  <button id="tap-btn">WORK / EARN $1</button>

  <div id="shop-container">
    <div class="shop-card">
      <div class="card-info">
        <h3>Lemonade Stand</h3>
        <p>Generates $1/sec (Owned: <span id="c0-owned">0</span>)</p>
      </div>
      <button class="buy-btn" id="buy-c0" onclick="buyBusiness(0)">Cost: $15</button>
    </div>

    <div class="shop-card">
      <div class="card-info">
        <h3>Coffee Kiosk</h3>
        <p>Generates $6/sec (Owned: <span id="c1-owned">0</span>)</p>
      </div>
      <button class="buy-btn" id="buy-c1" onclick="buyBusiness(1)">Cost: $100</button>
    </div>

    <div class="shop-card">
      <div class="card-info">
        <h3>Tech Startup</h3>
        <p>Generates $35/sec (Owned: <span id="c2-owned">0</span>)</p>
      </div>
      <button class="buy-btn" id="buy-c2" onclick="buyBusiness(2)">Cost: $750</button>
    </div>

    <div class="shop-card">
      <div class="card-info">
        <h3>Real Estate Firm</h3>
        <p>Generates $180/sec (Owned: <span id="c3-owned">0</span>)</p>
      </div>
      <button class="buy-btn" id="buy-c3" onclick="buyBusiness(3)">Cost: $4,500</button>
    </div>
  </div>

  <script>
    let money = 50;
    let clickPower = 1;

    const businesses = [
      { name: "Lemonade Stand", cost: 15, income: 1, owned: 0, costMultiplier: 1.15 },
      { name: "Coffee Kiosk", cost: 100, income: 6, owned: 0, costMultiplier: 1.17 },
      { name: "Tech Startup", cost: 750, income: 35, owned: 0, costMultiplier: 1.19 },
      { name: "Real Estate Firm", cost: 4500, income: 180, owned: 0, costMultiplier: 1.21 }
    ];

    const tapBtn = document.getElementById('tap-btn');
    const moneyDisplay = document.getElementById('money');
    const incomeDisplay = document.getElementById('income');

    tapBtn.addEventListener('click', () => {
      money += clickPower;
      updateDisplay();
    });

    function buyBusiness(index) {
      let b = businesses[index];
      if (money >= b.cost) {
        money -= b.cost;
        b.owned++;
        b.cost = Math.floor(b.cost * b.costMultiplier);
        updateDisplay();
      }
    }

    function getTotalIncome() {
      let total = 0;
      businesses.forEach(b => {
        total += b.owned * b.income;
      });
      return total;
    }

    function updateDisplay() {
      moneyDisplay.innerText = `$${Math.floor(money).toLocaleString()}`;
      incomeDisplay.innerText = `$${getTotalIncome().toLocaleString()} / sec`;

      businesses.forEach((b, index) => {
        document.getElementById(`c${index}-owned`).innerText = b.owned;
        let btn = document.getElementById(`buy-c${index}`);
        btn.innerText = `Cost: $${b.cost.toLocaleString()}`;
        if (money >= b.cost) {
          btn.removeAttribute('disabled');
        } else {
          btn.setAttribute('disabled', 'true');
        }
      });
    }

    // Passive loop per second
    setInterval(() => {
      let passive = getTotalIncome();
      if (passive > 0) {
        money += passive / 10;
        updateDisplay();
      }
    }, 100);

    updateDisplay();
  </script>
</body>
</html>
