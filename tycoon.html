<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Legacy GO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b1120;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #mobileWrapper {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 850px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #334155;
      position: relative;
    }
    /* Top HUD */
    #topHUD {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid #38bdf8;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .stat-badge.cash { color: #4ade80; }
    .stat-badge.dice { color: #f59e0b; }
    .stat-badge.level { color: #38bdf8; }

    /* Landmark Upgrades Area */
    #cityArea {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      justify-content: space-around;
      background: rgba(0,0,0,0.25);
    }
    .landmark-card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px;
      flex: 1;
      text-align: center;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .landmark-card:active { transform: scale(0.95); }
    .landmark-name { font-weight: bold; color: #e2e8f0; margin-bottom: 3px; }
    .landmark-stars { color: #eab308; font-size: 0.8rem; }
    .landmark-cost { color: #4ade80; font-weight: 700; margin-top: 2px; }

    /* Board Canvas */
    #canvasContainer {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Bottom Action Controls */
    #bottomControls {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #rollBtn {
      width: 100%;
      max-width: 280px;
      height: 60px;
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      border: none;
      border-bottom: 5px solid #b45309;
      border-radius: 30px;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.05s, border-bottom 0.05s;
    }
    #rollBtn:active {
      transform: translateY(3px);
      border-bottom: 2px solid #b45309;
    }
    #rollBtn:disabled {
      background: #475569;
      border-bottom: 4px solid #334155;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    #diceDisplay {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
    }

    /* Event Popup Banner */
    #banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #0f172a;
      border: 2px solid #38bdf8;
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
      z-index: 50;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    #banner.active { transform: translate(-50%, -50%) scale(1); }
    #bannerTitle { font-size: 1.1rem; color: #38bdf8; font-weight: 800; }
    #bannerSub { font-size: 0.85rem; color: #e2e8f0; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="mobileWrapper">
    <!-- Top HUD -->
    <div id="topHUD">
      <div class="stat-badge cash">💵 <span id="cashCount">$1,500</span></div>
      <div class="stat-badge dice">🎲 <span id="diceCount">30</span>/30</div>
      <div class="stat-badge level">⭐ Net: <span id="netWorth">0</span></div>
    </div>

    <!-- Ancestral Landmark Build & Upgrade Area -->
    <div id="cityArea">
      <div class="landmark-card" onclick="upgradeLandmark(0)">
        <div class="landmark-name">Homestead</div>
        <div class="landmark-stars" id="lmStars0">☆☆☆</div>
        <div class="landmark-cost" id="lmCost0">$200</div>
      </div>
      <div class="landmark-card" onclick="upgradeLandmark(1)">
        <div class="landmark-name">Marrow Press</div>
        <div class="landmark-stars" id="lmStars1">☆☆☆</div>
        <div class="landmark-cost" id="lmCost1">$350</div>
      </div>
      <div class="landmark-card" onclick="upgradeLandmark(2)">
        <div class="landmark-name">Legacy Hall</div>
        <div class="landmark-stars" id="lmStars2">☆☆☆</div>
        <div class="landmark-cost" id="lmCost2">$600</div>
      </div>
    </div>

    <!-- Game Board Canvas -->
    <div id="canvasContainer">
      <canvas id="boardCanvas" width="340" height="340"></canvas>
      <div id="banner">
        <div id="bannerTitle">LEGACY CHEST</div>
        <div id="bannerSub">+ $500 Heritage Grant!</div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div id="bottomControls">
      <button id="rollBtn" onclick="handleRoll()">
        <span>ROLL</span>
        <span id="lastDiceVal">🎲</span>
      </button>
      <div id="diceDisplay">+1 Dice regenerates every 30s</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');

    // Game State
    let cash = parseInt(localStorage.getItem('rl_cash')) || 1500;
    let dice = parseInt(localStorage.getItem('rl_dice')) || 30;
    let playerPos = parseInt(localStorage.getItem('rl_pos')) || 0;
    let netWorth = parseInt(localStorage.getItem('rl_net')) || 0;
    let isMoving = false;

    // Landmarks
    let landmarks = [
      { name: "Homestead", level: 0, baseCost: 200 },
      { name: "Marrow Press", level: 0, baseCost: 350 },
      { name: "Legacy Hall", level: 0, baseCost: 600 }
    ];

    // Board Structure (16 tiles in a perimeter square)
    const boardTiles = [
      { name: "GO", type: "go", val: 300, color: "#22c55e" },
      { name: "Heritage", type: "property", val: 80, color: "#78350f" },
      { name: "Chest", type: "chest", val: 200, color: "#0284c7" },
      { name: "Pioneer", type: "property", val: 120, color: "#78350f" },
      { name: "Jail Visit", type: "safe", val: 0, color: "#64748b" },
      { name: "Avenue", type: "property", val: 160, color: "#06b6d4" },
      { name: "Chance", type: "chance", val: 0, color: "#f97316" },
      { name: "Memorial", type: "property", val: 200, color: "#06b6d4" },
      { name: "Free Park", type: "safe", val: 0, color: "#dc2626" },
      { name: "Archive", type: "property", val: 240, color: "#eab308" },
      { name: "Chest", type: "chest", val: 350, color: "#0284c7" },
      { name: "Estate", type: "property", val: 280, color: "#eab308" },
      { name: "Go To Jail", type: "gotojail", val: 0, color: "#64748b" },
      { name: "Vanguard", type: "property", val: 320, color: "#3b82f6" },
      { name: "Tax", type: "tax", val: -150, color: "#ef4444" },
      { name: "Dynasty", type: "property", val: 400, color: "#3b82f6" }
    ];

    function saveState() {
      localStorage.setItem('rl_cash', cash);
      localStorage.setItem('rl_dice', dice);
      localStorage.setItem('rl_pos', playerPos);
      localStorage.setItem('rl_net', netWorth);
    }

    function updateHUD() {
      document.getElementById('cashCount').innerText = `$${cash.toLocaleString()}`;
      document.getElementById('diceCount').innerText = dice;
      document.getElementById('netWorth').innerText = netWorth;
      document.getElementById('rollBtn').disabled = dice <= 0 || isMoving;

      landmarks.forEach((lm, i) => {
        let stars = "★".repeat(lm.level) + "☆".repeat(3 - lm.level);
        document.getElementById(`lmStars${i}`).innerText = stars;
        let cost = Math.floor(lm.baseCost * Math.pow(1.6, lm.level));
        document.getElementById(`lmCost${i}`).innerText = lm.level >= 3 ? "MAX" : `$${cost}`;
      });
    }

    // Convert Tile Index to Canvas Coordinates
    function getTileCoords(index) {
      const size = 340;
      const step = (size - 60) / 4;
      const pad = 30;

      if (index <= 4) return { x: pad + index * step, y: pad };
      if (index <= 8) return { x: pad + 4 * step, y: pad + (index - 4) * step };
      if (index <= 12) return { x: pad + (12 - index) * step, y: pad + 4 * step };
      return { x: pad, y: pad + (16 - index) * step };
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Center Board Art
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(45, 45, 250, 250);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(45, 45, 250, 250);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText("RHODES LEGACY", 170, 160);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText("MOBILE EDITION", 170, 180);

      // Draw Perimeter Tiles
      for (let i = 0; i < 16; i++) {
        let pos = getTileCoords(i);
        ctx.fillStyle = boardTiles[i].color;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText(boardTiles[i].name.substring(0, 5), pos.x, pos.y + 3);
      }

      // Draw Player Token
      let pCoords = getTileCoords(playerPos);
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(pCoords.x, pCoords.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function handleRoll() {
      if (dice <= 0 || isMoving) return;
      dice--;
      isMoving = true;

      let roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById('lastDiceVal').innerText = `🎲 ${roll}`;
      updateHUD();

      let targetPos = (playerPos + roll) % 16;
      let stepsRemaining = roll;

      let hopInterval = setInterval(() => {
        playerPos = (playerPos + 1) % 16;
        if (playerPos === 0) {
          cash += 300; // Passed GO
          showBanner("PASSED GO!", "+$300 Salary");
        }
        drawBoard();
        stepsRemaining--;

        if (stepsRemaining === 0) {
          clearInterval(hopInterval);
          isMoving = false;
          resolveTileLand(boardTiles[playerPos]);
          saveState();
          updateHUD();
        }
      }, 180);
    }

    function resolveTileLand(tile) {
      if (tile.type === "property") {
        let rent = tile.val + (netWorth * 10);
        cash += rent;
        showBanner(tile.name, `Collected +$${rent}`);
      } else if (tile.type === "chest") {
        let bonus = 250;
        cash += bonus;
        showBanner("LEGACY CHEST", `Found +$${bonus}`);
      } else if (tile.type === "chance") {
        let diceBonus = 5;
        dice += diceBonus;
        showBanner("CHANCE BONUS", `+${diceBonus} Free Rolls!`);
      } else if (tile.type === "tax") {
        cash = Math.max(0, cash + tile.val);
        showBanner("ESTATE TAX", `Paid $${Math.abs(tile.val)}`);
      } else if (tile.type === "gotojail") {
        playerPos = 4;
        showBanner("VISITING JAIL", "Just visiting the archives!");
      }
    }

    function showBanner(title, sub) {
      const banner = document.getElementById('banner');
      document.getElementById('bannerTitle').innerText = title;
      document.getElementById('bannerSub').innerText = sub;
      banner.classList.add('active');
      setTimeout(() => banner.classList.remove('active'), 1800);
    }

    function upgradeLandmark(index) {
      let lm = landmarks[index];
      let cost = Math.floor(lm.baseCost * Math.pow(1.6, lm.level));
      if (lm.level < 3 && cash >= cost) {
        cash -= cost;
        lm.level++;
        netWorth++;
        showBanner(lm.name, `Upgraded to Level ${lm.level}!`);
        saveState();
        updateHUD();
      }
    }

    // Passive Dice Regeneration
    setInterval(() => {
      if (dice < 30) {
        dice++;
        updateHUD();
        saveState();
      }
    }, 30000);

    drawBoard();
    updateHUD();
  </script>
</body>
</html>
