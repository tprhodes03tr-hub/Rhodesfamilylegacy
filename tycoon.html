  <script>
    let playerMarrowEnergy = 250;
    let myCustomName = "Tommy";
    let myCustomColor = "#38bdf8";
    let playVsAI = true;

    let players = [];
    let currentTurn = 0;
    let hasRolledThisTurn = false;

    function selectColor(color, el) {
      document.querySelectorAll(".color-opt").forEach(o => o.classList.remove("selected"));
      el.classList.add("selected");
      myCustomColor = color;
    }

    function completeSetup() {
      const nameInput = document.getElementById("customPlayerName").value.trim();
      if (nameInput) myCustomName = nameInput;
      document.getElementById("setupOverlay").style.display = "none";
      initGame();
    }

    function toggleAIMode() {
      playVsAI = document.getElementById("aiToggle").checked;
      if (playVsAI && players.length < 2) {
        players.push({ id: 1, name: "Saginaw Bot", color: "#f472b6", cash: 1500, pos: 0, deeds: [] });
      } else if (!playVsAI && players.length > 1) {
        players = players.slice(0, 1);
      }
      buildHUD();
      buildBoard();
      updateHUD();
      checkTurnControl();
      log(playVsAI ? "Enabled Play vs AI Bot." : "Switched to P2P mode.");
    }

    function switchView(view) {
      document.getElementById("tycoonView").style.display = view === 'tycoon' ? "flex" : "none";
      document.getElementById("tetrisView").style.display = view === 'tetris' ? "block" : "none";
      document.getElementById("wordSearchView").style.display = view === 'wordsearch' ? "block" : "none";
      document.getElementById("tabTycoon").classList.toggle("active", view === 'tycoon');
      document.getElementById("tabTetris").classList.toggle("active", view === 'tetris');
      document.getElementById("tabWordSearch").classList.toggle("active", view === 'wordsearch');
      document.getElementById("tycoonControls").style.display = view === 'tycoon' ? "grid" : "none";
      if (view === 'tetris') startTetris();
      if (view === 'wordsearch') initWordSearch();
    }

    const TILES = [
      { id: 0, name: "START (+$200)", type: "corner", color: "th-corner", price: 0, rent: 0, row: 6, col: 6 },
      { id: 1, name: "Woodward Ave", type: "prop", color: "th-blue", price: 100, rent: 18, row: 6, col: 5, owner: null },
      { id: 2, name: "Grand River Depot", type: "prop", color: "th-blue", price: 120, rent: 22, row: 6, col: 4, owner: null },
      { id: 3, name: "Mystery Suitcase", type: "suitcase", color: "th-purple", price: 0, rent: 0, row: 6, col: 3 },
      { id: 4, name: "Eastern Market", type: "prop", color: "th-blue", price: 130, rent: 24, row: 6, col: 2, owner: null },
      { id: 5, name: "MICHIGAN TRANSIT", type: "corner", color: "th-corner", price: 0, rent: 0, row: 6, col: 1 },
      { id: 6, name: "West Grand Blvd", type: "prop", color: "th-blue", price: 140, rent: 26, row: 5, col: 1, owner: null },
      { id: 7, name: "Conant Gardens", type: "prop", color: "th-blue", price: 160, rent: 30, row: 4, col: 1, owner: null },
      { id: 8, name: "Mystery Suitcase", type: "suitcase", color: "th-purple", price: 0, rent: 0, row: 3, col: 1 },
      { id: 9, name: "I-75 Northway", type: "prop", color: "th-green", price: 180, rent: 34, row: 2, col: 1, owner: null },
      { id: 10, name: "SAGINAW REUNION", type: "corner", color: "th-corner", price: 0, rent: 0, row: 1, col: 1 },
      { id: 11, name: "Hoyt Public Library", type: "prop", color: "th-green", price: 200, rent: 38, row: 1, col: 2, owner: null },
      { id: 12, name: "Bancroft House", type: "prop", color: "th-green", price: 220, rent: 40, row: 1, col: 3, owner: null },
      { id: 13, name: "Mystery Suitcase", type: "suitcase", color: "th-purple", price: 0, rent: 0, row: 1, col: 4 },
      { id: 14, name: "Ojibway Island", type: "prop", color: "th-green", price: 240, rent: 45, row: 1, col: 5, owner: null },
      { id: 15, name: "LINEAGE VAULT", type: "corner", color: "th-corner", price: 0, rent: 0, row: 1, col: 6 },
      { id: 16, name: "Saginaw Riverwalk", type: "prop", color: "th-gold", price: 260, rent: 50, row: 2, col: 6, owner: null },
      { id: 17, name: "Atwater Street", type: "prop", color: "th-gold", price: 300, rent: 60, row: 3, col: 6, owner: null },
      { id: 18, name: "Rhodes Family Legacy", type: "prop", color: "th-gold", price: 320, rent: 65, row: 4, col: 6, owner: null },
      { id: 19, name: "The Atwater Estate", type: "prop", color: "th-gold", price: 350, rent: 75, row: 5, col: 6, owner: null }
    ];

    function initGame() {
      players = [
        { id: 0, name: myCustomName, color: myCustomColor, cash: 1500, pos: 0, deeds: [] },
        { id: 1, name: "Saginaw Bot", color: "#f472b6", cash: 1500, pos: 0, deeds: [] }
      ];
      currentTurn = 0;
      hasRolledThisTurn = false;
      updateMarrowDisplay();
      buildHUD();
      buildBoard();
      updateHUD();
      checkTurnControl();
    }

    function checkTurnControl() {
      const p = players[currentTurn];
      if (!p) return;
      const tile = TILES[p.pos];
      const isMyTurn = (currentTurn === 0);

      const btnRoll = document.getElementById("btnRoll");
      const btnBuy = document.getElementById("btnBuy");
      const btnEndTurn = document.getElementById("btnEndTurn");

      if (!btnRoll || !btnBuy || !btnEndTurn) return;

      btnRoll.disabled = !isMyTurn || hasRolledThisTurn;
      btnEndTurn.disabled = !isMyTurn || !hasRolledThisTurn;
      
      if (isMyTurn && hasRolledThisTurn && tile.type === "prop" && tile.owner === null) {
        btnBuy.disabled = (p.cash < tile.price);
      } else {
        btnBuy.disabled = true;
      }

      if (isMyTurn) {
        if (hasRolledThisTurn) {
          if (tile.type === "prop" && tile.owner === null) {
            log(`Landed on ${tile.name} ($${tile.price}). Buy deed or End Turn.`);
          } else {
            log(`Landed on ${tile.name}. Click End Turn to proceed.`);
          }
        } else {
          log(`Your turn (${p.name})! Roll Dice to begin.`);
        }
      } else {
        log(`Waiting for ${p.name}...`);
        if (playVsAI && currentTurn === 1) setTimeout(runAITurn, 800);
      }
    }

    function runAITurn() {
      if (currentTurn !== 1) return;
      const roll = Math.floor(Math.random() * 6) + Math.floor(Math.random() * 6) + 2;
      const p = players[1];
      const oldPos = p.pos;
      p.pos = (p.pos + roll) % 20;
      if (p.pos < oldPos) p.cash += 200;
      const tile = TILES[p.pos];
      if (tile.type === "prop" && tile.owner === null && p.cash >= tile.price) {
        tile.owner = 1; p.cash -= tile.price; p.deeds.push(tile.name);
      } else if (tile.type === "prop" && tile.owner !== null && tile.owner !== 1) {
        let rentDue = tile.rent;
        p.cash -= rentDue; players[tile.owner].cash += rentDue;
      }
      currentTurn = 0;
      hasRolledThisTurn = false;
      buildHUD();
      buildBoard();
      updateHUD();
      checkTurnControl();
      log(`🤖 Saginaw Bot rolled ${roll} and finished its turn.`);
    }

    function buildHUD() {
      const hud = document.getElementById("hudRoster");
      if (!hud) return;
      hud.innerHTML = "";
      players.forEach((p, idx) => {
        hud.innerHTML += `<div class="p-card ${idx === currentTurn ? 'active-turn' : ''}"><div class="p-title" style="color: ${p.color};">${p.name}</div><div class="p-val" id="pcash-${p.id}">$${p.cash}</div></div>`;
      });
    }

    function buildBoard() {
      const board = document.getElementById("boardTrack");
      if (!board) return;
      board.innerHTML = `<div class="board-center" onclick="openArDiceCamera()">
        <div class="center-logo">DETROIT & SAGINAW</div>
        <div class="dice-box">
          <div class="dice-3d" id="d1">🎲</div>
          <div class="dice-3d" id="d2">🎲</div>
        </div>
      </div>`;
      TILES.forEach((t, index) => {
        let ownerIndicator = t.owner !== null ? `<span style="color:${players[t.owner]?.color || '#f59e0b'}">●</span>` : '';
        board.innerHTML += `<div class="tile" style="grid-row: ${t.row}; grid-column: ${t.col};" onclick="openArPropertyCamera(${index})">
          <div class="tile-header ${t.color}"></div>
          <div class="tile-name">${ownerIndicator} ${t.name}</div>
          <div class="tile-price">${t.price > 0 ? '$'+t.price : ''}</div>
          <div class="token-slot" id="slot-${t.id}"></div>
        </div>`;
      });
      renderTokens();
    }

    function renderTokens() {
      for (let i = 0; i < 20; i++) {
        let slot = document.getElementById(`slot-${i}`);
        if (slot) slot.innerHTML = "";
      }
      players.forEach(p => {
        const slot = document.getElementById(`slot-${p.pos}`);
        if (slot) slot.innerHTML += `<div class="token" style="background: ${p.color};"></div>`;
      });
    }

    function openArPropertyCamera(tileIndex) {
      const tile = TILES[tileIndex];
      document.getElementById("arModalHeader").innerText = "🏛️ 3D PROPERTY AR MODEL";
      document.getElementById("arDeedTitle").innerText = tile.name;
      document.getElementById("arDeedPrice").innerText = tile.price > 0 ? `$${tile.price} Valuation (Rent: $${tile.rent})` : "Public Sanctuary";
      document.getElementById("arEmblemIcon").innerText = tile.type === "suitcase" ? "🎁" : "🏛️";
      document.getElementById("arDeedModal").style.display = "flex";
    }

    function openArDiceCamera() {
      document.getElementById("arModalHeader").innerText = "🎲 3D DICE ROLL AR VIEW";
      let d1 = Math.floor(Math.random() * 6) + 1;
      let d2 = Math.floor(Math.random() * 6) + 1;
      document.getElementById("arDeedTitle").innerText = `Simulated Roll: [${d1}] & [${d2}]`;
      document.getElementById("arDeedPrice").innerText = `Combined Total: ${d1 + d2} Steps`;
      document.getElementById("arEmblemIcon").innerText = "🎲";
      document.getElementById("arDeedModal").style.display = "flex";
    }

    function closeArDeed() { document.getElementById("arDeedModal").style.display = "none"; }

    function rollDice() {
      if (currentTurn !== 0 || hasRolledThisTurn) return;
      hasRolledThisTurn = true;
      
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      const total = d1 + d2;
      document.getElementById("d1").innerText = d1;
      document.getElementById("d2").innerText = d2;

      let p = players[0];
      const oldPos = p.pos;
      p.pos = (p.pos + total) % 20;
      if (p.pos < oldPos) {
        p.cash += 200;
        playerMarrowEnergy += 50;
        updateMarrowDisplay();
      }

      const tile = TILES[p.pos];
      if (tile.type === "prop" && tile.owner !== null && tile.owner !== 0) {
        let rentDue = tile.rent;
        p.cash -= rentDue; players[tile.owner].cash += rentDue;
        log(`Paid $${rentDue} rent to ${players[tile.owner].name} on ${tile.name}.`);
      } else if (tile.type === "suitcase") {
        let bonusCash = Math.floor(Math.random() * 3) * 50 + 50;
        p.cash += bonusCash;
        playerMarrowEnergy += 25;
        updateMarrowDisplay();
        log(`Mystery Suitcase bonus! Received $${bonusCash}.`);
      }

      buildHUD();
      buildBoard();
      updateHUD();
      checkTurnControl();
    }

    function buyProperty() {
      let p = players[0];
      let tile = TILES[p.pos];
      if (tile.type === "prop" && tile.owner === null && p.cash >= tile.price) {
        tile.owner = 0;
        p.cash -= tile.price;
        p.deeds.push(tile.name);
        playerMarrowEnergy += 25;
        updateMarrowDisplay();
        document.getElementById("btnBuy").disabled = true;
        buildHUD();
        buildBoard();
        updateHUD();
        log(`You purchased ${tile.name} for $${tile.price}! Click End Turn.`);
      }
    }

    function endTurn() {
      hasRolledThisTurn = false;
      currentTurn = 1;
      document.getElementById("btnBuy").disabled = true;
      buildHUD();
      checkTurnControl();
    }

    function updateMarrowDisplay() { document.getElementById("marrowCounter").innerText = `${playerMarrowEnergy} ME`; }
    function updateHUD() { players.forEach((p) => { document.getElementById(`pcash-${p.id}`)?.innerText = `$${p.cash}`; }); }
    function log(msg) { document.getElementById("gameLog").innerText = msg; }

    /* TETRIS ARCADE ENGINE */
    let tetrisInterval = null;
    let tetrisPaused = false;
    let tScore = 0;
    let tLines = 0;
    const tRows = 20, tCols = 10;
    let tBoard = Array.from({length: tRows}, () => Array(tCols).fill(0));
    let tPiece = null;
    let tNextPiece = null;

    const SHAPES = [
      [[1,1,1,1]], // I
      [[1,1],[1,1]], // O
      [[0,1,0],[1,1,1]], // T
      [[1,0,0],[1,1,1]], // L
      [[0,0,1],[1,1,1]], // J
      [[0,1,1],[1,1,0]], // S
      [[1,1,0],[0,1,1]]  // Z
    ];
    const T_COLORS = ['#38bdf8', '#facc15', '#a855f7', '#f97316', '#3b82f6', '#10b981', '#ef4444'];

    function randomTetromino() {
      const idx = Math.floor(Math.random() * SHAPES.length);
      return { shape: SHAPES[idx], color: T_COLORS[idx], x: 3, y: 0 };
    }

    function startTetris() {
      if (tetrisInterval) clearInterval(tetrisInterval);
      tBoard = Array.from({length: tRows}, () => Array(tCols).fill(0));
      tScore = 0; tLines = 0;
      tPiece = randomTetromino();
      tNextPiece = randomTetromino();
      updateTetrisHUD();
      tetrisInterval = setInterval(tetrisTick, 500);
    }

    function toggleTetrisPause() {
      tetrisPaused = !tetrisPaused;
      document.getElementById("tetrisPauseBtn").innerText = tetrisPaused ? "▶️ RESUME" : "⏸️ PAUSE";
    }

    function tetrisTick() {
      if (tetrisPaused) return;
      tPiece.y++;
      if (checkCollision(tPiece.shape, tPiece.x, tPiece.y)) {
        tPiece.y--;
        mergePiece();
        clearLines();
        tPiece = tNextPiece;
        tNextPiece = randomTetromino();
        if (checkCollision(tPiece.shape, tPiece.x, tPiece.y)) {
          clearInterval(tetrisInterval);
          alert("Game Over! Lineage Tetris finished.");
          startTetris();
        }
      }
      drawTetris();
    }

    function checkCollision(shape, offsetX, offsetY) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            let newX = offsetX + c;
            let newY = offsetY + r;
            if (newX < 0 || newX >= tCols || newY >= tRows) return true;
            if (newY >= 0 && tBoard[newY][newX]) return true;
          }
        }
      }
      return false;
    }

    function mergePiece() {
      for (let r = 0; r < tPiece.shape.length; r++) {
        for (let c = 0; c < tPiece.shape[r].length; c++) {
          if (tPiece.shape[r][c]) {
            let boardY = tPiece.y + r;
            if (boardY >= 0) tBoard[boardY][tPiece.x + c] = tPiece.color;
          }
        }
      }
    }

    function clearLines() {
      let linesCleared = 0;
      for (let r = tRows - 1; r >= 0; r--) {
        if (tBoard[r].every(cell => cell !== 0)) {
          tBoard.splice(r, 1);
          tBoard.unshift(Array(tCols).fill(0));
          linesCleared++;
          r++;
        }
      }
      if (linesCleared > 0) {
        tLines += linesCleared;
        tScore += linesCleared * 100 * linesCleared;
        updateTetrisHUD();
        if (tLines >= 20) {
          clearInterval(tetrisInterval);
          alert("Congratulations! You cleared 20 lines and unlocked Rhodes Family bonus Marrow Energy!");
          playerMarrowEnergy += 100;
          updateMarrowDisplay();
          startTetris();
        }
      }
    }

    function tetrisMove(dir) {
      if (tetrisPaused) return;
      tPiece.x += dir;
      if (checkCollision(tPiece.shape, tPiece.x, tPiece.y)) tPiece.x -= dir;
      drawTetris();
    }

    function tetrisRotate() {
      if (tetrisPaused) return;
      const rotated = tPiece.shape[0].map((_, index) => tPiece.shape.map(row => row[index]).reverse());
      if (!checkCollision(rotated, tPiece.x, tPiece.y)) tPiece.shape = rotated;
      drawTetris();
    }

    function tetrisDrop() {
      if (tetrisPaused) return;
      while (!checkCollision(tPiece.shape, tPiece.x, tPiece.y + 1)) {
        tPiece.y++;
      }
      tetrisTick();
    }

    function drawTetris() {
      const canvas = document.getElementById("tetrisCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const blockSize = 22;

      for (let r = 0; r < tRows; r++) {
        for (let c = 0; c < tCols; c++) {
          if (tBoard[r][c]) {
            ctx.fillStyle = tBoard[r][c];
            ctx.fillRect(c * blockSize, r * blockSize, blockSize - 1, blockSize - 1);
          }
        }
      }

      if (tPiece) {
        ctx.fillStyle = tPiece.color;
        for (let r = 0; r < tPiece.shape.length; r++) {
          for (let c = 0; c < tPiece.shape[r].length; c++) {
            if (tPiece.shape[r][c]) {
              ctx.fillRect((tPiece.x + c) * blockSize, (tPiece.y + r) * blockSize, blockSize - 1, blockSize - 1);
            }
          }
        }
      }

      const nextCanvas = document.getElementById("nextCanvas");
      if (!nextCanvas) return;
      const nCtx = nextCanvas.getContext("2d");
      nCtx.fillStyle = "#020617";
      nCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (tNextPiece) {
        nCtx.fillStyle = tNextPiece.color;
        let nSize = 14;
        for (let r = 0; r < tNextPiece.shape.length; r++) {
          for (let c = 0; c < tNextPiece.shape[r].length; c++) {
            if (tNextPiece.shape[r][c]) {
              nCtx.fillRect(10 + c * nSize, 10 + r * nSize, nSize - 1, nSize - 1);
            }
          }
        }
      }
    }

    function updateTetrisHUD() {
      document.getElementById("linesCount").innerText = tLines;
      document.getElementById("tetrisScore").innerText = tScore;
    }

    /* WORD SEARCH TRIVIA */
    const TARGET_WORDS = ["DETROIT", "SAGINAW", "RHODES"];
    let foundWords = [];

    function initWordSearch() {
      foundWords = [];
      updateWordStatus();
      const gridContainer = document.getElementById("wordGridContainer");
      if (!gridContainer) return;
      gridContainer.innerHTML = "";
      
      const letters = [
        ['D','E','T','R','O','I'],
        ['T','S','A','G','I','N'],
        ['A','R','H','O','D','E'],
        ['W','X','Y','Z','S','V'],
        ['B','C','D','E','F','G'],
        ['H','I','J','K','L','M']
      ];

      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          let cell = document.createElement("div");
          cell.className = "word-cell";
          cell.innerText = letters[r][c];
          cell.onclick = () => {
            cell.classList.toggle("selected");
            checkSelectedWords();
          };
          gridContainer.appendChild(cell);
        }
      }
    }

    function checkSelectedWords() {
      const selected = document.querySelectorAll(".word-cell.selected");
      let selectedStr = Array.from(selected).map(el => el.innerText).join("");
      TARGET_WORDS.forEach(w => {
        if (selectedStr.includes(w) && !foundWords.includes(w)) {
          foundWords.push(w);
          selected.forEach(el => { el.classList.remove("selected"); el.classList.add("found"); });
          updateWordStatus();
          if (foundWords.length === TARGET_WORDS.length) {
            playerMarrowEnergy += 75;
            updateMarrowDisplay();
            alert("Amazing! All heritage words found. +75 Marrow Energy awarded!");
          }
        }
      });
    }

    function updateWordStatus() {
      document.getElementById("wordStatus").innerText = `Words Found: ${foundWords.length} / 3`;
    }

    function triggerChronoLeap() {
      if (playerMarrowEnergy >= 100) {
        playerMarrowEnergy -= 100;
        updateMarrowDisplay();
        log("⚡ Chrono-Leap activated! Extra turn granted.");
        hasRolledThisTurn = false;
        checkTurnControl();
      } else {
        alert("Not enough Marrow Energy! Need 100 ME.");
      }
    }

    function triggerLegacyShield() {
      if (playerMarrowEnergy >= 75) {
        playerMarrowEnergy -= 75;
        updateMarrowDisplay();
        log("🛡️ Legacy Shield activated! Protected against rent fees.");
      } else {
        alert("Not enough Marrow Energy! Need 75 ME.");
      }
    }

    function hostP2PMatch() {
      const roomId = "ROOM-" + Math.floor(Math.random() * 8999 + 1000);
      document.getElementById("joinCodeInput").value = roomId;
      log(`Hosting P2P Match. Room Code: ${roomId}`);
      alert(`Room created! Share code ${roomId} with your opponent.`);
    }

    function joinP2PMatch() {
      const code = document.getElementById("joinCodeInput").value.trim();
      if (!code) { alert("Please enter a valid room code."); return; }
      log(`Connecting to P2P Room: ${code}...`);
      alert(`Connected to room ${code}! Multi-player lobby synced.`);
    }
  </script>
