<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Universe - Tactical Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Game Container */
    #game-stage {
      position: relative;
      width: 100vw;
      max-width: 1080px;
      height: 600px;
      background: radial-gradient(circle at center, #1b263b 0%, #080d1a 100%);
      border: 2px solid #2a3a5e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top HUD */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(10, 15, 25, 0.85);
      border-bottom: 1px solid rgba(0, 195, 255, 0.3);
      z-index: 10;
    }

    .hud-title {
      font-size: 14px;
      letter-spacing: 1px;
      color: #79a6d2;
      font-weight: bold;
    }

    .hud-title span {
      color: #00d2ff;
    }

    .meter-container {
      width: 250px;
    }

    .meter-label {
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      color: #8fa0b5;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #1e2638;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #334466;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00d2ff, #00ffaa);
      transition: width 0.3s ease-out;
    }

    .bar-fill.enemy {
      background: linear-gradient(90deg, #ff3366, #ff9900);
    }

    /* Combat Battlefield */
    .arena {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 40px;
    }

    /* Floor line */
    .arena::after {
      content: '';
      position: absolute;
      bottom: 20px;
      left: 5%;
      width: 90%;
      height: 2px;
      background: radial-gradient(ellipse at center, rgba(0, 210, 255, 0.5) 0%, transparent 80%);
    }

    /* Entity Stance */
    .combatant {
      position: relative;
      width: 200px;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 5;
      transition: transform 0.15s ease-in-out;
    }

    /* Idle subtle breathing */
    .idle-breath {
      animation: breath 3s ease-in-out infinite alternate;
    }

    @keyframes breath {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.02) translateY(-4px); }
    }

    /* Character Artwork Slot */
    .char-graphic {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7));
    }

    /* Fallback placeholder if no image source */
    .char-placeholder {
      width: 140px;
      height: 240px;
      border: 2px dashed #00d2ff;
      border-radius: 12px;
      background: rgba(0, 210, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 13px;
      color: #79a6d2;
      padding: 10px;
    }

    /* Combat Animations */
    .lunge-right {
      animation: lungeRight 0.35s ease-out;
    }

    .hit-react {
      animation: hitShake 0.4s ease-in-out;
      filter: brightness(2) contrast(1.5);
    }

    @keyframes lungeRight {
      0% { transform: translateX(0); }
      50% { transform: translateX(120px) scale(1.05); }
      100% { transform: translateX(0); }
    }

    @keyframes hitShake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-15px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    /* Damage popup */
    .damage-popup {
      position: absolute;
      top: 40px;
      font-size: 28px;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 0 10px #ff3300, 2px 2px 0 #000;
      animation: floatUp 0.8s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px) scale(0.6); }
      30% { opacity: 1; transform: translateY(-10px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }

    /* Action Control Panel */
    .control-deck {
      background: rgba(8, 12, 20, 0.95);
      border-top: 2px solid #1a2744;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      z-index: 10;
    }

    .action-btn {
      background: linear-gradient(180deg, #16243d 0%, #0d1627 100%);
      border: 1px solid #2a436e;
      border-radius: 6px;
      padding: 12px 8px;
      color: #e0e8f5;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .action-btn span.subtext {
      font-size: 10px;
      color: #79a6d2;
      font-weight: normal;
    }

    .action-btn.burst {
      border-color: #ff3366;
      background: linear-gradient(180deg, #441223 0%, #200810 100%);
    }

    .action-btn.burst:hover {
      border-color: #ff6699;
      box-shadow: 0 0 12px rgba(255, 51, 102, 0.4);
    }

    /* Combat Log */
    #log {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #7a8fa8;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 12px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-stage">
    <!-- Top HUD -->
    <header class="hud-header">
      <div class="meter-container">
        <div class="meter-label">
          <span>SUNDIATA / ANCESTRAL VANGUARD</span>
          <span id="player-hp-num">120/120</span>
        </div>
        <div class="bar-bg">
          <div id="player-hp-bar" class="bar-fill" style="width: 100%;"></div>
        </div>
      </div>

      <div class="hud-title">ZONE: <span>RENCEN PLAZA</span></div>

      <div class="meter-container">
        <div class="meter-label">
          <span>CHRONO-INHIBITOR</span>
          <span id="enemy-hp-num">150/150</span>
        </div>
        <div class="bar-bg">
          <div id="enemy-hp-bar" class="bar-fill enemy" style="width: 100%;"></div>
        </div>
      </div>
    </header>

    <div id="log">Battle Ready</div>

    <!-- Battlefield -->
    <main class="arena">
      <!-- Player Entity -->
      <div id="player" class="combatant idle-breath">
        <!-- Replace src with your isolated hero transparent cutout -->
        <div class="char-placeholder">
          <b>SUNDIATA</b><br>Solar Dundun Warrior
        </div>
      </div>

      <!-- Enemy Entity -->
      <div id="enemy" class="combatant idle-breath">
        <!-- Replace src with your isolated villain transparent cutout -->
        <div class="char-placeholder">
          <b>CHRONO-LOCK</b><br>Temporal Automaton
        </div>
      </div>
    </main>

    <!-- Tactical Control Deck -->
    <footer class="control-deck">
      <button class="action-btn" onclick="executeAction('strike')">
        STRIKE 1
        <span class="subtext">Aura Weaver (20 Dmg)</span>
      </button>

      <button class="action-btn" onclick="executeAction('drumbeat')">
        STRIKE 2
        <span class="subtext">Seismic Drumbeat (35 Dmg)</span>
      </button>

      <button class="action-btn" onclick="executeAction('barrier')">
        DEFENSE
        <span class="subtext">Coincoin Shield (+30 Guard)</span>
      </button>

      <button class="action-btn burst" onclick="executeAction('overdrive')">
        OVERDRIVE
        <span class="subtext">Twin Djembe Quake (60 Dmg)</span>
      </button>
    </footer>
  </div>

  <script>
    let playerMaxHp = 120;
    let playerHp = 120;
    let enemyMaxHp = 150;
    let enemyHp = 150;
    let isActing = false;

    const logEl = document.getElementById('log');
    const playerEl = document.getElementById('player');
    const enemyEl = document.getElementById('enemy');
    const enemyHpBar = document.getElementById('enemy-hp-bar');
    const enemyHpNum = document.getElementById('enemy-hp-num');
    const playerHpBar = document.getElementById('player-hp-bar');
    const playerHpNum = document.getElementById('player-hp-num');

    function executeAction(type) {
      if (isActing || enemyHp <= 0) return;
      isActing = true;

      let damage = 0;
      let actionName = "";

      switch (type) {
        case 'strike':
          damage = 20;
          actionName = "Aura Weaver strikes!";
          break;
        case 'drumbeat':
          damage = 35;
          actionName = "Seismic Drumbeat reverberates!";
          break;
        case 'barrier':
          logEl.innerText = "Ancestral Shield raised! Deflected incoming strike.";
          isActing = false;
          return;
        case 'overdrive':
          damage = 60;
          actionName = "OVERDRIVE CLASH: Twin Djembe Earthquake hits!";
          break;
      }

      // Player Attack Animation (Lunge)
      playerEl.classList.remove('idle-breath');
      playerEl.classList.add('lunge-right');
      logEl.innerText = actionName;

      setTimeout(() => {
        // Enemy Hit Reaction
        triggerHit(enemyEl, damage);
        enemyHp = Math.max(0, enemyHp - damage);
        updateUI();

        playerEl.classList.remove('lunge-right');
        playerEl.classList.add('idle-breath');

        // Check if enemy defeated
        if (enemyHp <= 0) {
          logEl.innerText = "TARGET NEUTRALIZED - VICTORY!";
          isActing = false;
          return;
        }

        // Enemy Counter-attack after 700ms
        setTimeout(enemyCounter, 700);
      }, 250);
    }

    function enemyCounter() {
      logEl.innerText = "Chrono-Lock activates Temporal Backlash!";
      enemyEl.classList.remove('idle-breath');
      enemyEl.style.transform = "translateX(-60px)";

      setTimeout(() => {
        enemyEl.style.transform = "";
        enemyEl.classList.add('idle-breath');

        let enemyDmg = 18;
        triggerHit(playerEl, enemyDmg);
        playerHp = Math.max(0, playerHp - enemyDmg);
        updateUI();

        if (playerHp <= 0) {
          logEl.innerText = "DEFENSE COMPROMISED - DEFEAT!";
        } else {
          isActing = false;
        }
      }, 200);
    }

    function triggerHit(targetEl, dmg) {
      targetEl.classList.add('hit-react');

      // Create floating damage number
      const dmgPopup = document.createElement('div');
      dmgPopup.className = 'damage-popup';
      dmgPopup.innerText = `-${dmg}`;
      targetEl.appendChild(dmgPopup);

      setTimeout(() => {
        targetEl.classList.remove('hit-react');
        dmgPopup.remove();
      }, 600);
    }

    function updateUI() {
      enemyHpNum.innerText = `${enemyHp}/${enemyMaxHp}`;
      enemyHpBar.style.width = `${(enemyHp / enemyMaxHp) * 100}%`;

      playerHpNum.innerText = `${playerHp}/${playerMaxHp}`;
      playerHpBar.style.width = `${(playerHp / playerMaxHp) * 100}%`;
    }
  </script>
</body>
</html>
