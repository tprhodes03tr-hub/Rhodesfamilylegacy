<!-- VANGUARD UNIVERSE: CINEMATIC CARD INSPECT  -->
<!-- ========================================== -->

<!-- 1. MODAL OVERLAY HTML -->
<div id="cardInspectModal" class="inspect-modal hidden" onclick="closeInspect()">
  <div class="card-frame" onclick="event.stopPropagation()">
    <div class="card-header">
      <div class="header-titles">
        <h3 id="inspectName">HERO NAME</h3>
        <span id="inspectSub">LINEAGE / CLASS</span>
      </div>
      <span id="inspectRole" class="role-tag frontline">FRONTLINE</span>
    </div>

    <!-- Cinematic Art Window -->
    <div class="card-art-container">
      <img id="inspectImg" src="" alt="Card Art" />
    </div>

    <!-- Stat Bar -->
    <div class="card-stats">
      <span class="stat hp"><b id="inspectHp">0</b> HP</span>
      <span class="stat pwr"><b id="inspectPwr">0</b> PWR</span>
      <span class="stat def"><b id="inspectDef">0</b> DEF</span>
      <span class="stat wis"><b id="inspectWis">0</b> WIS</span>
    </div>

    <!-- Ability & Lore Box -->
    <div class="card-body">
      <div class="skill-entry">
        <span id="inspectSkillCost" class="skill-cost">MARROW (3)</span>
        <strong id="inspectSkillName">Skill Name</strong>
        <p id="inspectSkillDesc">Skill effect description goes here.</p>
      </div>
      <p id="inspectLore" class="card-lore">
        <em id="inspectLoreText">"Ancestral lore quote goes here."</em>
      </p>
      <button class="close-card-btn" onclick="closeInspect()">CLOSE</button>
    </div>
  </div>
</div>

<!-- 2. EMBEDDED STYLING (CSS) -->
<style>
.inspect-modal {
  position: fixed;
  inset: 0;
  background: rgba(5, 7, 15, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
}
.inspect-modal.hidden {
  display: none !important;
}
.card-frame {
  width: 320px;
  max-width: 90vw;
  background: #0d1117;
  border: 2px solid #c59b27;
  border-radius: 14px;
  box-shadow: 0 0 30px rgba(197, 155, 39, 0.45);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-family: system-ui, -apple-system, sans-serif;
}
.card-header {
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(180deg, #1f2430 0%, #0d1117 100%);
  border-bottom: 1px solid #c59b27;
}
.card-header h3 {
  margin: 0;
  font-size: 15px;
  color: #ffd700;
  letter-spacing: 1px;
}
.card-header span {
  font-size: 10px;
  color: #a0aec0;
}
.role-tag {
  font-size: 10px;
  font-weight: bold;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid currentColor;
  text-transform: uppercase;
}
.role-tag.nexus { color: #b794f4; border-color: #b794f4; }
.role-tag.frontline { color: #f56565; border-color: #f56565; }
.role-tag.backline { color: #4299e1; border-color: #4299e1; }

.card-art-container {
  width: 100%;
  height: 230px;
  background: #000;
  overflow: hidden;
  position: relative;
}
.card-art-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-stats {
  display: flex;
  justify-content: space-around;
  background: #161b22;
  padding: 7px 0;
  border-top: 1px solid #2d3748;
  border-bottom: 1px solid #2d3748;
  font-size: 11px;
}
.stat.hp { color: #48bb78; }
.stat.pwr { color: #f56565; }
.stat.def { color: #4299e1; }
.stat.wis { color: #ecc94b; }

.card-body {
  padding: 12px 14px;
  background: #0b0e14;
  font-size: 11px;
}
.skill-entry { margin-bottom: 8px; }
.skill-cost {
  background: #c59b27;
  color: #000;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 3px;
  font-size: 9px;
  margin-right: 5px;
}
.skill-entry strong { color: #edf2f7; font-size: 12px; }
.skill-entry p { margin: 4px 0 8px 0; color: #cbd5e0; line-height: 1.3; }
.card-lore {
  font-size: 10px;
  color: #718096;
  margin: 0 0 10px 0;
  border-top: 1px solid #1a202c;
  padding-top: 6px;
  line-height: 1.3;
}
.close-card-btn {
  width: 100%;
  padding: 8px 0;
  background: #c59b27;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  color: #0d1117;
  cursor: pointer;
  letter-spacing: 1px;
}
</style>

// Open card inspect window
function openInspect(nameKey) {
  const c = vanguardFullDeck[nameKey] || vanguardFullDeck[Object.keys(vanguardFullDeck).find(k => nameKey.toLowerCase().includes(k.toLowerCase()))];
  if (!c) return;

  document.getElementById("inspectName").textContent = nameKey.toUpperCase();
  document.getElementById("inspectSub").textContent = c.sub;
  
  const roleEl = document.getElementById("inspectRole");
  roleEl.className = "role-tag " + c.role;
  roleEl.textContent = c.roleText;

  document.getElementById("inspectImg").src = c.img;
  document.getElementById("inspectHp").textContent = c.hp;
  document.getElementById("inspectPwr").textContent = c.pwr;
  document.getElementById("inspectDef").textContent = c.def;
  document.getElementById("inspectWis").textContent = c.wis;

  document.getElementById("inspectSkillCost").textContent = c.cost;
  document.getElementById("inspectSkillName").textContent = c.skill;
  document.getElementById("inspectSkillDesc").textContent = c.desc;
  document.getElementById("inspectLoreText").textContent = `"${c.lore}"`;

  document.getElementById("cardInspectModal").classList.remove("hidden");
}

// Close card inspect window
function closeInspect() {
  document.getElementById("cardInspectModal").classList.add("hidden");
}

// Auto-wire existing [Inspect] buttons or card taps on page load
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-card-name], .card, .reserve-slot").forEach(el => {
    el.addEventListener("click", () => {
      const name = el.getAttribute("data-card-name") || el.querySelector("h4, .card-name, strong")?.textContent?.trim();
      if (name) openInspect(name);
    });
  });
});
