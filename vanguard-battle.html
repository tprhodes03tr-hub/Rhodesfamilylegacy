<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancestral Vanguard | Resonance Clash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      max-width: 650px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: rgba(217, 119, 6, 0.2);
      border: 1px solid #d97706;
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
    }
    .score-box {
      text-align: center;
    }
    .score-num {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
    }
    .score-lbl {
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
    }
    .arena {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      width: 100%;
      max-width: 750px;
      margin-bottom: 20px;
    }
    .card {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .card.rival {
      border-color: #ef4444;
    }
    .card.player {
      border-color: #38bdf8;
    }
    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .card-art {
      width: 100%;
      height: 180px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #020617;
      border: 1px solid #1e293b;
    }
    .card-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stat-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-stat {
      background: #020617;
      border: 1px solid #1e293b;
      color: #f1f5f9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-stat:hover:not(:disabled) {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .btn-stat:disabled {
      cursor: default;
      opacity: 0.8;
    }
    .status-panel {
      width: 100%;
      max-width: 480px;
      text-align: center;
      background: #0f172a;
      border-left: 3px solid #d97706;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      min-height: 48px;
      margin-bottom: 16px;
    }
    .action-controls {
      display: flex;
      gap: 12px;
    }
    .btn-action {
      background: #d97706;
      color: #fff;
      border: none;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }
    .btn-sub {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="badge">Tactical Card Battler</span>
    <h1>Resonance Clash</h1>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Select your combat attribute to clash against the rival vanguard plate.</p>
  </div>

  <div class="scoreboard">
    <div class="score-box">
      <div class="score-num" id="player-score">0</div>
      <div class="score-lbl">Player Lineage</div>
    </div>
    <div class="score-box">
      <div class="score-num" style="color: #ef4444;" id="rival-score">0</div>
      <div class="score-lbl">Rival Lineage</div>
    </div>
  </div>

  <div class="arena">
    <!-- Player Hero -->
    <div class="card player">
      <div class="card-title">
        <span id="p-name">--</span>
        <span style="font-size: 10px; color: #38bdf8;">YOUR HERO</span>
      </div>
      <div class="card-art">
        <img id="p-img" src="" alt="Hero">
      </div>
      <div class="stat-btns">
        <button class="btn-stat" onclick="clash('power')">POWER <span id="p-power">0</span></button>
        <button class="btn-stat" onclick="clash('defense')">DEFENSE <span id="p-defense">0</span></button>
        <button class="btn-stat" onclick="clash('wisdom')">WISDOM <span id="p-wisdom">0</span></button>
      </div>
    </div>

    <!-- Rival Hero -->
    <div class="card rival">
      <div class="card-title">
        <span id="r-name">???</span>
        <span style="font-size: 10px; color: #ef4444;">RIVAL PLATE</span>
      </div>
      <div class="card-art">
        <img id="r-img" src="" alt="Rival">
      </div>
      <div class="stat-btns">
        <div class="btn-stat"><span style="color:#64748b;">POWER</span> <span id="r-power">?</span></div>
        <div class="btn-stat"><span style="color:#64748b;">DEFENSE</span> <span id="r-defense">?</span></div>
        <div class="btn-stat"><span style="color:#64748b;">WISDOM</span> <span id="r-wisdom">?</span></div>
      </div>
    </div>
  </div>

  <div class="status-panel" id="log-msg">
    Pick an attribute above to initiate the resonance wave.
  </div>

  <div class="action-controls">
    <button class="btn-action" onclick="nextRound()" id="next-btn" style="display: none;">Next Round ➡</button>
    <a href="vanguard.html" class="btn-action btn-sub">Dossier</a>
    <a href="index.html" class="btn-action btn-sub">Home</a>
  </div>

  <script>
    const deck = [
      { name: "Mother Luta", img: "mother-luta.jpg", power: 85, defense: 99, wisdom: 100 },
      { name: "Marcus Prime", img: "marcus.jpg", power: 95, defense: 88, wisdom: 90 },
      { name: "Sundiata Prime", img: "sundiata.jpg", power: 96, defense: 98, wisdom: 89 },
      { name: "The Vanguard", img: "vanguard-team.jpg", power: 94, defense: 94, wisdom: 95 }
    ];

    let pScore = 0;
    let rScore = 0;
    let currentP = null;
    let currentR = null;
    let roundActive = true;

    function deal() {
      roundActive = true;
      document.getElementById('next-btn').style.display = 'none';

      currentP = deck[Math.floor(Math.random() * deck.length)];
      do {
        currentR = deck[Math.floor(Math.random() * deck.length)];
      } while (currentR === currentP && deck.length > 1);

      document.getElementById('p-name').innerText = currentP.name;
      document.getElementById('p-img').src = currentP.img;
      document.getElementById('p-power').innerText = currentP.power;
      document.getElementById('p-defense').innerText = currentP.defense;
      document.getElementById('p-wisdom').innerText = currentP.wisdom;

      document.getElementById('r-name').innerText = "Rival Contender";
      document.getElementById('r-img').src = currentR.img;
      document.getElementById('r-power').innerText = "?";
      document.getElementById('r-defense').innerText = "?";
      document.getElementById('r-wisdom').innerText = "?";

      document.getElementById('log-msg').innerText = "Choose an attribute to engage the clash!";
    }

    function clash(stat) {
      if (!roundActive) return;
      roundActive = false;

      document.getElementById('r-name').innerText = currentR.name;
      document.getElementById('r-power').innerText = currentR.power;
      document.getElementById('r-defense').innerText = currentR.defense;
      document.getElementById('r-wisdom').innerText = currentR.wisdom;

      const pVal = currentP[stat];
      const rVal = currentR[stat];

      if (pVal > rVal) {
        pScore++;
        document.getElementById('player-score').innerText = pScore;
        document.getElementById('log-msg').innerHTML = `<strong style="color:#38bdf8;">Victory!</strong> Your ${stat.toUpperCase()} (${pVal}) shattered the rival frequency (${rVal}).`;
      } else if (rVal > pVal) {
        rScore++;
        document.getElementById('rival-score').innerText = rScore;
        document.getElementById('log-msg').innerHTML = `<strong style="color:#ef4444;">Defeat!</strong> Rival's ${stat.toUpperCase()} (${rVal}) absorbed your strike (${pVal}).`;
      } else {
        document.getElementById('log-msg').innerHTML = `<strong style="color:#fbbf24;">Resonance Draw!</strong> Frequencies matched at ${pVal}.`;
      }

      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextRound() {
      deal();
    }

    deal();
  </script>
</body>
</html>
