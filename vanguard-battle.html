<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancestral Vanguard: Battle Arena</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-hero: #101c2e;
      --card-villain: #251019;
      --accent-hero: #00d2ff;
      --accent-villain: #ff0055;
      --text-main: #f0f4f8;
      --text-dim: #8b9bb4;
      --gold: #d4af37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-hero), var(--gold), var(--accent-villain));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .arena-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 15px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .arena-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hero-card {
      background: linear-gradient(180deg, var(--card-hero) 0%, #08111d 100%);
      border-top: 3px solid var(--accent-hero);
    }

    .villain-card {
      background: linear-gradient(180deg, var(--card-villain) 0%, #15080e 100%);
      border-top: 3px solid var(--accent-villain);
    }

    .sprite-frame {
      width: 100%;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
      margin-bottom: 12px;
    }

    .sprite-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.7));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .hero-card .sprite-img {
      filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.4));
    }

    .villain-card .sprite-img {
      filter: drop-shadow(0 0 12px rgba(255, 0, 85, 0.4));
    }

    .char-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .char-role {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: rgba(0,0,0,0.3);
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }

    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat span:first-child { color: var(--text-dim); font-size: 0.7rem; }
    .stat span:last-child { font-weight: bold; }

    .selector-box {
      width: 100%;
      margin-top: 10px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #161b22;
      color: #fff;
      border: 1px solid #30363d;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .vs-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .vs-badge {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .btn-engage {
      background: linear-gradient(135deg, var(--gold), #b38f20);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.4);
      transition: transform 0.1s ease;
    }

    .btn-engage:active {
      transform: scale(0.96);
    }

    .battle-log {
      width: 100%;
      max-width: 1100px;
      background: #11141a;
      border: 1px solid #222730;
      border-radius: 10px;
      padding: 14px;
      font-family: monospace;
      font-size: 0.9rem;
      min-height: 120px;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ancestral Vanguard: Combat Arena</h1>
  </header>

  <div class="arena-grid">
    <!-- Hero Card -->
    <div class="card hero-card" id="heroCard">
      <div class="sprite-frame">
        <img id="heroImg" class="sprite-img" src="./sundiata-prime.png" alt="Hero Sprite">
      </div>
      <div class="char-name" id="heroName">Sundiata Prime</div>
      <div class="char-role" id="heroRole">Resonant Commander</div>
      <div class="stats-bar">
        <div class="stat"><span>PWR</span><span id="heroPwr">94</span></div>
        <div class="stat"><span>DEF</span><span id="heroDef">88</span></div>
        <div class="stat"><span>WIS</span><span id="heroWis">96</span></div>
      </div>
      <div class="selector-box">
        <select id="heroSelect" onchange="updateHero(this.value)">
          <option value="sundiata-prime">Sundiata Prime</option>
          <option value="akecheta">Akecheta</option>
          <option value="amina">Amina</option>
          <option value="elena">Elena</option>
          <option value="marcus">Marcus</option>
          <option value="matteo">Matteo</option>
          <option value="mother-luta">Mother Luta</option>
          <option value="shadow-kensei">Shadow Kensei</option>
          <option value="xochitl">Xochitl</option>
        </select>
      </div>
    </div>

    <!-- Center Versus & Actions -->
    <div class="vs-panel">
      <div class="vs-badge">VS</div>
      <button class="btn-engage" onclick="executeClash()">Engage</button>
    </div>

    <!-- Villain Card -->
    <div class="card villain-card" id="villainCard">
      <div class="sprite-frame">
        <img id="villainImg" class="sprite-img" src="./apex-volt.png" alt="Villain Sprite">
      </div>
      <div class="char-name" id="villainName">Apex Volt</div>
      <div class="char-role" id="villainRole">Kinetic Strike Leader</div>
      <div class="stats-bar">
        <div class="stat"><span>PWR</span><span id="villainPwr">96</span></div>
        <div class="stat"><span>DEF</span><span id="villainDef">90</span></div>
        <div class="stat"><span>WIS</span><span id="villainWis">82</span></div>
      </div>
      <div class="selector-box">
        <select id="villainSelect" onchange="updateVillain(this.value)">
          <option value="apex-volt">Apex Volt</option>
          <option value="chrono-lock">Chrono-Lock</option>
          <option value="dread-harmonic">Dread-Harmonic</option>
          <option value="ironclad">Ironclad</option>
          <option value="null-byte">Null-Byte</option>
          <option value="vipera">Vipera</option>
        </select>
      </div>
    </div>
  </div>

  <div class="battle-log" id="battleLog">Combat Arena initialized. All clean sprites loaded from repository root.</div>

  <script>
    const HERO_ROSTER = {
      "sundiata-prime": { name: "Sundiata Prime", role: "Resonant Commander", pwr: 94, def: 88, wis: 96, sprite: "./sundiata-prime.png" },
      "akecheta": { name: "Akecheta", role: "Spirit-Whisperer", pwr: 85, def: 84, wis: 95, sprite: "./akecheta.png" },
      "amina": { name: "Amina", role: "Aerial Strike Leader", pwr: 91, def: 86, wis: 89, sprite: "./amina.png" },
      "elena": { name: "Elena", role: "Forest Warden", pwr: 82, def: 92, wis: 90, sprite: "./elena.png" },
      "marcus": { name: "Marcus", role: "Frontline Anchor", pwr: 93, def: 95, wis: 84, sprite: "./marcus.png" },
      "matteo": { name: "Matteo", role: "Planetary Brawler", pwr: 95, def: 94, wis: 75, sprite: "./matteo.png" },
      "mother-luta": { name: "Mother Luta", role: "Custodian of Marrow", pwr: 88, def: 90, wis: 99, sprite: "./mother-luta.png" },
      "shadow-kensei": { name: "Shadow Kensei", role: "Blade Interceptor", pwr: 92, def: 83, wis: 87, sprite: "./shadow-kensei.png" },
      "xochitl": { name: "Xochitl", role: "Solar Vanguard", pwr: 89, def: 87, wis: 91, sprite: "./xochitl.png" }
    };

    const VILLAIN_ROSTER = {
      "apex-volt": { name: "Apex Volt", role: "Kinetic Strike Leader", pwr: 96, def: 90, wis: 82, sprite: "./apex-volt.png" },
      "chrono-lock": { name: "Chrono-Lock", role: "Temporal Juggernaut", pwr: 88, def: 98, wis: 91, sprite: "./chrono-lock.png" },
      "dread-harmonic": { name: "Dread-Harmonic", role: "Acoustic Striker", pwr: 95, def: 86, wis: 78, sprite: "./dread-harmonic.png" },
      "ironclad": { name: "Ironclad", role: "Rotary Ballistic Suppression", pwr: 94, def: 96, wis: 74, sprite: "./ironclad.png" },
      "null-byte": { name: "Null-Byte", role: "Cyber-Technopath", pwr: 84, def: 80, wis: 97, sprite: "./null-byte.png" },
      "vipera": { name: "Vipera", role: "Toxic Infiltrator", pwr: 89, def: 82, wis: 88, sprite: "./vipera.png" }
    };

    let activeHero = HERO_ROSTER["sundiata-prime"];
    let activeVillain = VILLAIN_ROSTER["apex-volt"];

    function updateHero(key) {
      activeHero = HERO_ROSTER[key];
      document.getElementById("heroName").innerText = activeHero.name;
      document.getElementById("heroRole").innerText = activeHero.role;
      document.getElementById("heroPwr").innerText = activeHero.pwr;
      document.getElementById("heroDef").innerText = activeHero.def;
      document.getElementById("heroWis").innerText = activeHero.wis;
      document.getElementById("heroImg").src = activeHero.sprite;
      logMessage(`[Roster] Selected Hero: ${activeHero.name}`);
    }

    function updateVillain(key) {
      activeVillain = VILLAIN_ROSTER[key];
      document.getElementById("villainName").innerText = activeVillain.name;
      document.getElementById("villainRole").innerText = activeVillain.role;
      document.getElementById("villainPwr").innerText = activeVillain.pwr;
      document.getElementById("villainDef").innerText = activeVillain.def;
      document.getElementById("villainWis").innerText = activeVillain.wis;
      document.getElementById("villainImg").src = activeVillain.sprite;
      logMessage(`[Roster] Selected Adversary: ${activeVillain.name}`);
    }

    function executeClash() {
      const heroScore = activeHero.pwr + activeHero.wis + Math.floor(Math.random() * 20);
      const villainScore = activeVillain.pwr + activeVillain.wis + Math.floor(Math.random() * 20);

      logMessage(`\n--- ENGAGEMENT: ${activeHero.name} vs. ${activeVillain.name} ---`);
      logMessage(`[Resonance Calculation] ${activeHero.name}: ${heroScore} | ${activeVillain.name}: ${villainScore}`);

      if (heroScore >= villainScore) {
        logMessage(`[Victory] ${activeHero.name} overpowers the Syndicate front! Lineage defense sustained.`);
      } else {
        logMessage(`[Alert] ${activeVillain.name} pierces the frontline! Marrow reserves taxed.`);
      }
    }

    function logMessage(msg) {
      const log = document.getElementById("battleLog");
      log.innerText += "\n" + msg;
      log.scrollTop = log.scrollHeight;
    }
  </script>
</body>
</html>
