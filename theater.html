<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rhodes Family Legacy | Cinema Theater Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #06070c;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
    }
    .theater-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 8px;
    }
    header h1 {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c084fc;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: bold;
      color: #38bdf8;
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .channel-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .chan-btn {
      padding: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .chan-btn.active-vanguard {
      border-color: #a855f7;
      background: #581c87;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.5);
    }
    .chan-btn.active-heritage {
      border-color: #f59e0b;
      background: #78350f;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
    }
    .screen-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #a855f7;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      transition: border-color 0.3s ease;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .playlist-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    #now-playing { color: #38bdf8; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 70%; }
    #track-count { color: #94a3b8; }
    .cta-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      gap: 10px;
    }
    .cta-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: bold;
    }
    .cta-actions {
      display: flex;
      gap: 8px;
    }
    .cta-btn {
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      white-space: nowrap;
    }
    .btn-action-primary {
      background: #38bdf8;
      color: #082f49;
    }
    .btn-action-secondary {
      background: #a855f7;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="theater-container">
    <header>
      <h1>Rhodes Family Legacy Cinema</h1>
      <span class="badge" id="theater-badge">THEATER MODE ACTIVE</span>
    </header>

    <div class="channel-switch">
      <button class="chan-btn active-vanguard" id="btn-vanguard" onclick="setChannel('vanguard')">
        Vanguard Saga
      </button>
      <button class="chan-btn" id="btn-heritage" onclick="setChannel('heritage')">
        Little Fannie Mae
      </button>
    </div>

    <div class="screen-frame" id="cinema-frame">
      <video id="cinema-player" controls autoplay muted poster="1789535309047.png">
        <source id="video-source" src="Origins & The Tree of Lineage.mp4" type="video/mp4">
      </video>
    </div>

    <div class="playlist-bar">
      <span id="now-playing">NOW PLAYING: Detroit Awakening Teaser</span>
      <span id="track-count">CLIP 1 OF 3</span>
    </div>

    <div class="cta-banner" id="theater-cta">
      <span class="cta-text" id="cta-label">Ready for battle? Enter the arena.</span>
      <div class="cta-actions" id="cta-buttons">
        <a class="cta-btn btn-action-primary" id="cta-main" href="isaac.html">Play Combat Engine</a>
        <a class="cta-btn btn-action-secondary" id="cta-alt" href="vanguard-battle.html">Card Arena</a>
      </div>
    </div>
  </div>

  <script>
    const CHANNELS = {
      vanguard: {
        borderColor: '#a855f7',
        badge: 'UNIVERSE: ANCESTRAL VANGUARD',
        poster: '1789535309047.png',
        label: 'Ready for battle? Enter the Vanguard arena.',
        mainText: 'Play Combat Engine',
        mainLink: 'isaac.html',
        altText: 'Card Arena',
        altLink: 'vanguard-battle.html',
        playlist: [
          { title: 'Detroit Awakening Teaser', src: 'vanguard-trailer-1.mp4' },
          { title: 'Rooftop Syndicate Clash', src: 'vanguard-trailer-2.mp4' },
          { title: 'Origins & The Tree of Lineage', src: 'Origins & The Tree of Lineage.mp4' }
        ]
      },
      heritage: {
        borderColor: '#f59e0b',
        badge: 'UNIVERSE: HERITAGE STORYBOOKS',
        poster: 'marrow-bundle.jpg',
        label: 'Explore the roots of the family lineage.',
        mainText: 'Open E-Reader',
        mainLink: 'marrow.html',
        altText: 'Family Codex',
        altLink: 'storybooks.html',
        playlist: [
          { title: 'The Adventures of Little Fannie Mae', src: 'fannie-mae-trailer.mp4' },
          { title: 'Tree of Lineage Heritage Tale', src: 'Origins & The Tree of Lineage.mp4' }
        ]
      }
    };

    let activeChannel = 'vanguard';
    let currentClipIndex = 0;

    const player = document.getElementById('cinema-player');
    const source = document.getElementById('video-source');
    const frame = document.getElementById('cinema-frame');
    const badge = document.getElementById('theater-badge');
    const label = document.getElementById('cta-label');
    const mainBtn = document.getElementById('cta-main');
    const altBtn = document.getElementById('cta-alt');
    const nowPlaying = document.getElementById('now-playing');
    const trackCount = document.getElementById('track-count');

    function loadClip(index) {
      const channelData = CHANNELS[activeChannel];
      currentClipIndex = index % channelData.playlist.length;
      const clip = channelData.playlist[currentClipIndex];

      source.src = clip.src;
      player.load();
      player.play().catch(() => {});

      nowPlaying.textContent = `NOW PLAYING: ${clip.title}`;
      trackCount.textContent = `CLIP ${currentClipIndex + 1} OF ${channelData.playlist.length}`;
    }

    // Graceful error fallback: if a trailer isn't uploaded yet, fall back to the live origin movie
    player.addEventListener('error', () => {
      if (source.src.indexOf('Origins') === -1) {
        source.src = 'Origins & The Tree of Lineage.mp4';
        player.load();
        player.play().catch(() => {});
        nowPlaying.textContent = 'NOW PLAYING: Origins & The Tree of Lineage';
      }
    });

    // Advance automatically to next clip when current video finishes
    player.addEventListener('ended', () => {
      loadClip(currentClipIndex + 1);
    });

    function setChannel(chan) {
      activeChannel = chan;
      currentClipIndex = 0;
      const data = CHANNELS[chan];

      document.getElementById('btn-vanguard').className = 'chan-btn' + (chan === 'vanguard' ? ' active-vanguard' : '');
      document.getElementById('btn-heritage').className = 'chan-btn' + (chan === 'heritage' ? ' active-heritage' : '');
      frame.style.borderColor = data.borderColor;
      badge.textContent = data.badge;
      player.poster = data.poster;

      label.textContent = data.label;
      mainBtn.textContent = data.mainText;
      mainBtn.href = data.mainLink;
      altBtn.textContent = data.altText;
      altBtn.href = data.altLink;

      loadClip(0);
    }

    loadClip(0);
  </script>
</body>
</html>
