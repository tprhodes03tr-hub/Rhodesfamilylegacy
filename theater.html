<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Hub | Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .cinema-container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px 18px;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #c084fc;
      text-transform: uppercase;
    }
    .universe-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .nav-channels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .chan-btn {
      padding: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .chan-btn.active-heritage {
      border-color: #f59e0b;
      background: #78350f;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .chan-btn.active-vanguard {
      border-color: #a855f7;
      background: #581c87;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .screen-frame {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #f59e0b;
      background: #000000;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
      transition: all 0.3s ease;
    }
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
    }
    .video-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .hud-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      font-size: 0.8rem;
    }
    .hud-title {
      font-weight: 700;
      color: #f59e0b;
    }
    .hud-status {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
    }
    .action-gate {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gate-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: center;
    }
    .gate-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .gate-btn {
      text-align: center;
      text-decoration: none;
      padding: 12px;
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      border-radius: 8px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-main {
      background: #f59e0b;
      color: #ffffff;
      border: 2px solid #d97706;
    }
    .btn-alt {
      background: #8b5cf6;
      color: #ffffff;
      border: 2px solid #7c3aed;
    }
    .home-link-wrap {
      text-align: center;
      margin-top: 8px;
    }
    .home-link {
      color: #64748b;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .home-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="cinema-container">
    <!-- TOP STATUS HEADER -->
    <header class="top-bar">
      <div class="brand-title">RHODES FAMILY LEGACY CINEMA</div>
      <div class="universe-badge" id="theater-badge">UNIVERSE: HERITAGE STORYBOOKS</div>
    </header>

    <!-- UNIVERSE SWITCH BUTTONS -->
    <nav class="nav-channels">
      <button id="btn-heritage" class="chan-btn active-heritage" onclick="setChannel('heritage')">
        LITTLE FANNIE MAE
      </button>
      <button id="btn-vanguard" class="chan-btn" onclick="setChannel('vanguard')">
        VANGUARD SAGA
      </button>
    </nav>

    <!-- CINEMATIC SCREEN FRAME -->
    <main class="screen-frame" id="cinema-frame">
      <div class="video-viewport">
        <iframe id="cinema-player"
                src="https://drive.google.com/file/d/1hoVf2QBC7ibLFLmJdqFfXK0Kj57k6S-9/preview"
                title="Rhodes Family Legacy Cinema Hub"
                allow="autoplay; encrypted-media"
                allowfullscreen>
        </iframe>
      </div>
      <div class="hud-meta">
        <span class="hud-title" id="now-playing">NOW PLAYING: The Adventures of Little Fannie May & Her Brothers</span>
        <span class="hud-status" id="track-count">CLOUD STREAM ACTIVE</span>
      </div>
    </main>

    <!-- CTAS & DESTINATIONS -->
    <section class="action-gate">
      <p class="gate-label" id="cta-label">Explore the roots of the family lineage.</p>
      <div class="gate-buttons">
        <a id="cta-main" href="marrow.html" class="gate-btn btn-main">OPEN E-READER</a>
        <a id="cta-alt" href="storybooks.html" class="gate-btn btn-alt">FAMILY CODEX</a>
      </div>
    </section>

    <!-- RETURN PORTAL -->
    <footer class="home-link-wrap">
      <a href="index.html" class="home-link">← RETURN TO MAIN PORTAL</a>
    </footer>
  </div>

  <script>
    const CHANNELS = {
      heritage: {
        borderColor: '#f59e0b',
        glow: 'rgba(245, 158, 11, 0.25)',
        badge: 'UNIVERSE: HERITAGE STORYBOOKS',
        title: 'NOW PLAYING: The Adventures of Little Fannie May & Her Brothers',
        titleColor: '#f59e0b',
        label: 'Explore the roots of the family lineage.',
        mainText: 'OPEN E-READER',
        mainLink: 'marrow.html',
        mainColor: '#f59e0b',
        mainBorder: '#d97706',
        altText: 'FAMILY CODEX',
        altLink: 'storybooks.html',
        altColor: '#8b5cf6',
        altBorder: '#7c3aed',
        src: 'https://drive.google.com/file/d/1hoVf2QBC7ibLFLmJdqFfXK0Kj57k6S-9/preview'
      },
      vanguard: {
        borderColor: '#a855f7',
        glow: 'rgba(168, 85, 247, 0.25)',
        badge: 'UNIVERSE: ANCESTRAL VANGUARD',
        title: 'NOW PLAYING: Ancestral Vanguard Origins Chronicle',
        titleColor: '#c084fc',
        label: 'Ready for battle? Enter the Vanguard arena.',
        mainText: 'PLAY COMBAT ENGINE',
        mainLink: 'isaac.html',
        mainColor: '#a855f7',
        mainBorder: '#7e22ce',
        altText: 'CARD ARENA',
        altLink: 'vanguard-battle.html',
        altColor: '#2563eb',
        altBorder: '#1d4ed8',
        src: 'https://drive.google.com/file/d/1hoVf2QBC7ibLFLmJdqFfXK0Kj57k6S-9/preview'
      }
    };

    function setChannel(chan) {
      const data = CHANNELS[chan];
      const player = document.getElementById('cinema-player');
      const frame = document.getElementById('cinema-frame');
      const badge = document.getElementById('theater-badge');
      const label = document.getElementById('cta-label');
      const mainBtn = document.getElementById('cta-main');
      const altBtn = document.getElementById('cta-alt');
      const nowPlaying = document.getElementById('now-playing');
      const btnVan = document.getElementById('btn-vanguard');
      const btnHer = document.getElementById('btn-heritage');

      player.src = data.src;
      frame.style.borderColor = data.borderColor;
      frame.style.boxShadow = `0 0 30px ${data.glow}`;
      badge.textContent = data.badge;
      nowPlaying.textContent = data.title;
      nowPlaying.style.color = data.titleColor;

      label.textContent = data.label;
      mainBtn.textContent = data.mainText;
      mainBtn.href = data.mainLink;
      mainBtn.style.background = data.mainColor;
      mainBtn.style.borderColor = data.mainBorder;

      altBtn.textContent = data.altText;
      altBtn.href = data.altLink;
      altBtn.style.background = data.altColor;
      altBtn.style.borderColor = data.altBorder;

      if (chan === 'heritage') {
        btnHer.className = 'chan-btn active-heritage';
        btnVan.className = 'chan-btn';
      } else {
        btnVan.className = 'chan-btn active-vanguard';
        btnHer.className = 'chan-btn';
      }
    }
  </script>
</body>
</html>
