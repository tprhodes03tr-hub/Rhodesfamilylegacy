<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cinema Hub | Rhodes Family Legacy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #090d16; color: #f1f5f9; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .cinema-container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 12px 18px; }
    .brand-title { font-size: 1.1rem; font-weight: 800; color: #c084fc; text-transform: uppercase; }
    .universe-badge { font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; }
    .nav-channels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chan-btn { padding: 12px; font-weight: 800; font-size: 0.85rem; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; text-transform: uppercase; }
    .chan-btn.active-heritage { border-color: #f59e0b; background: #78350f; color: #fff; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
    .chan-btn.active-vanguard { border-color: #a855f7; background: #581c87; color: #fff; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
    .screen-frame { border-radius: 12px; overflow: hidden; border: 2px solid #f59e0b; background: #000; box-shadow: 0 0 30px rgba(245, 158, 11, 0.25); position: relative; }
    .video-viewport { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-viewport video { width: 100%; height: 100%; border: none; display: block; object-fit: cover; }
    #play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 20; cursor: pointer; }
    #play-overlay.hidden { opacity: 0; pointer-events: none; }
    .play-icon-btn { background: #f59e0b; color: #000; font-weight: 800; font-size: 1.1rem; padding: 14px 28px; border-radius: 50px; border: none; cursor: pointer; }
    #card-bumper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.95); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 10; padding: 20px; text-align: center; }
    #card-bumper.active { opacity: 1; pointer-events: auto; }
    .bumper-card-box { background: #141622; border: 2px solid #f59e0b; border-radius: 12px; padding: 16px; max-width: 380px; width: 100%; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .hud-meta { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #0f172a; border-top: 1px solid #1e293b; font-size: 0.8rem; }
    .hud-title { font-weight: 700; color: #f59e0b; }
    .ctrl-btn { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .action-gate { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .gate-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .gate-btn { text-align: center; text-decoration: none; padding: 12px; font-weight: 800; font-size: 0.8rem; border-radius: 8px; text-transform: uppercase; }
    .btn-main { background: #f59e0b; color: #fff; }
    .btn-alt { background: #8b5cf6; color: #fff; }
    .home-link-wrap { text-align: center; margin-top: 8px; }
    .home-link { color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="cinema-container">
    <header class="top-bar">
      <div class="brand-title">RHODES FAMILY LEGACY CINEMA</div>
      <div class="universe-badge" id="theater-badge">UNIVERSE: HERITAGE STORYBOOKS</div>
    </header>
    <nav class="nav-channels">
      <button id="btn-heritage" class="chan-btn active-heritage" onclick="setChannel('heritage')">LITTLE FANNIE MAE</button>
      <button id="btn-vanguard" class="chan-btn" onclick="setChannel('vanguard')">VANGUARD SAGA</button>
    </nav>
    <main class="screen-frame" id="cinema-frame">
      <div class="video-viewport">
        <div id="play-overlay" onclick="startStream()">
          <button class="play-icon-btn">▶ START STREAM</button>
        </div>
        <video id="cinema-player" controls playsinline muted preload="auto">
          <source src="Origins & The Tree of Lineage.mp4" type="video/mp4">
        </video>
        <div id="card-bumper">
          <div class="bumper-card-box">
            <div style="font-size: 0.7rem; color: #f59e0b; font-weight: 800; margin-bottom: 6px;">⚡ ARCHIVAL DOSSIER</div>
            <div id="bumper-char-title" style="font-weight: 800; margin-bottom: 6px;">Operative Spotlight</div>
            <div id="bumper-stats" style="font-size: 0.75rem; color: #38bdf8;">Lineage Guard Active</div>
          </div>
        </div>
      </div>
      <div class="hud-meta">
        <span class="hud-title" id="now-playing">NOW PLAYING: Initializing...</span>
        <div class="hud-controls">
          <button class="ctrl-btn" onclick="playPrevious()">⏮ Prev</button>
          <button class="ctrl-btn" onclick="playNext()">Next ⏭</button>
        </div>
      </div>
    </main>
    <section class="action-gate">
      <p class="gate-label" id="cta-label" style="text-align: center; font-size: 0.85rem;">Explore the roots of the family lineage.</p>
      <div class="gate-buttons">
        <a id="cta-main" href="marrow.html" class="gate-btn btn-main">OPEN E-READER</a>
        <a id="cta-alt" href="storybooks.html" class="gate-btn btn-alt">FAMILY CODEX</a>
      </div>
    </section>
    <footer class="home-link-wrap">
      <a href="index.html" class="home-link">← RETURN TO MAIN PORTAL</a>
    </footer>
  </div>
  <script>
    const CHANNELS = {
      heritage: {
        badge: 'UNIVERSE: HERITAGE STORYBOOKS',
        playlist: [{ title: "Origins & The Tree of Lineage", src: "Origins & The Tree of Lineage.mp4" }]
      },
      vanguard: {
        badge: 'UNIVERSE: ANCESTRAL VANGUARD',
        playlist: [
          { title: "Mirror of Ages & Ancestral Guardians", src: "gemini_generated_video_9386837637786344859.mp4" },
          { title: "Origins & The Tree of Lineage", src: "Origins & The Tree of Lineage.mp4" }
        ]
      }
    };
    let currentChannel = 'heritage';
    let currentIndex = 0;
    const videoPlayer = document.getElementById('cinema-player');
    const nowPlaying = document.getElementById('now-playing');
    const playOverlay = document.getElementById('play-overlay');

    function startStream() {
      playOverlay.classList.add('hidden');
      videoPlayer.muted = false;
      videoPlayer.play().catch(e => console.log(e));
    }
    function setChannel(chan) {
      currentChannel = chan;
      loadChannel(chan, 0);
    }
    function loadChannel(chan, index) {
      currentIndex = index;
      const data = CHANNELS[chan];
      document.getElementById('theater-badge').textContent = data.badge;
      document.getElementById('btn-heritage').className = chan === 'heritage' ? 'chan-btn active-heritage' : 'chan-btn';
      document.getElementById('btn-vanguard').className = chan === 'vanguard' ? 'chan-btn active-vanguard' : 'chan-btn';
      loadVideo(currentIndex);
    }
    function loadVideo(index) {
      currentIndex = index;
      const item = CHANNELS[currentChannel].playlist[currentIndex];
      videoPlayer.src = item.src;
      videoPlayer.load();
      videoPlayer.play().then(() => playOverlay.classList.add('hidden')).catch(() => playOverlay.classList.remove('hidden'));
      nowPlaying.textContent = `NOW PLAYING: ${item.title}`;
    }
    videoPlayer.onended = () => playNext();
    function playNext() {
      currentIndex = (currentIndex + 1) % CHANNELS[currentChannel].playlist.length;
      loadVideo(currentIndex);
    }
    function playPrevious() {
      currentIndex = (currentIndex - 1 + CHANNELS[currentChannel].playlist.length) % CHANNELS[currentChannel].playlist.length;
      loadVideo(currentIndex);
    }
  </script>
</body>
</html>
