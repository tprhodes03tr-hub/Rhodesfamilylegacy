
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Universe - Cinematic Theater</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #07050d;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e5e0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cinematic-center-container {
      max-width: 960px;
      width: 100%;
      margin: 20px auto;
      padding: 30px 20px;
      background: radial-gradient(circle at center, #161226 0%, #0b0914 100%);
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.1);
      text-align: center;
      box-sizing: border-box;
    }

    .cinematic-header h2 {
      font-size: 2rem;
      letter-spacing: 3px;
      color: #f7df94;
      text-transform: uppercase;
      margin: 0 0 8px 0;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .cinematic-header p {
      color: #b5adc9;
      font-size: 0.95rem;
      margin: 0 0 24px 0;
    }

    .video-theater-frame {
      position: relative;
      padding: 8px;
      border-radius: 12px;
      background: linear-gradient(135deg, #d4af37 0%, #3d2d10 35%, #0d0c12 50%, #3d2d10 65%, #d4af37 100%);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .video-theater-frame video {
      width: 100%;
      display: block;
      border-radius: 8px;
      background-color: #000;
    }

    .trailer-toggle-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .trailer-btn {
      background: linear-gradient(180deg, #1f1b33 0%, #100d1e 100%);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #e5e0f5;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 240px;
      transition: all 0.3s ease;
    }

    .trailer-btn:hover {
      border-color: #f7df94;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
      transform: translateY(-2px);
    }

    .trailer-btn.active {
      background: linear-gradient(180deg, #2b2345 0%, #17132a 100%);
      border: 2px solid #d4af37;
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.45);
    }

    .btn-title {
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 0.9rem;
      color: #f7df94;
    }

    .btn-sub {
      font-size: 0.75rem;
      color: #9f96ba;
      margin-top: 4px;
    }

    .back-nav {
      margin-top: 25px;
    }

    .back-nav a {
      color: #f7df94;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
      border-bottom: 1px dashed rgba(212, 175, 55, 0.5);
      padding-bottom: 3px;
    }

    .back-nav a:hover {
      color: #ffffff;
      border-bottom-style: solid;
    }
  </style>
</head>
<body>

  <div class="cinematic-center-container">
    <div class="cinematic-header">
      <h2>CINEMATIC CENTER</h2>
      <p>Video &amp; Trailer Showcase: Experience the lore and animated combat directly in your browser.</p>
    </div>

    <div class="video-theater-frame">
      <video id="vanguardVideoPlayer" controls poster="assets/vanguard-poster.jpg">
        <source id="videoSource" src="assets/vanguard-comic-trailer.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </div>

    <div class="trailer-toggle-bar">
      <button class="trailer-btn active" onclick="switchTrailer('assets/vanguard-comic-trailer.mp4', this)">
        <span class="btn-title">TRAILER I: COMBAT DOSSIER</span>
        <span class="btn-sub">Animated Roster &amp; Tactical Arena</span>
      </button>
      <button class="trailer-btn" onclick="switchTrailer('assets/vanguard-cinematic-teaser.mp4', this)">
        <span class="btn-title">TRAILER II: THE HORIZON</span>
        <span class="btn-sub">Cinematic Multiverse Awakening</span>
      </button>
    </div>

    <div class="back-nav">
      <a href="index.html">&larr; Return to Main Showcase &amp; Bookcase</a>
    </div>
  </div>

  <script>
    function switchTrailer(videoFile, buttonElement) {
      const player = document.getElementById('vanguardVideoPlayer');
      const source = document.getElementById('videoSource');
      source.src = videoFile;
      player.load();
      player.play();

      document.querySelectorAll('.trailer-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
    }
  </script>
</body>
</html>
