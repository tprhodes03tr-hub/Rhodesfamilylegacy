  <script>
    // Live file present in your GitHub repository
    const LIVE_MASTER_VIDEO = 'Origins & The Tree of Lineage.mp4';

    const CHANNELS = {
      vanguard: {
        borderColor: '#a855f7',
        badge: 'UNIVERSE: ANCESTRAL VANGUARD',
        poster: '1789535309047.png',
        label: 'Ready for battle? Enter the Vanguard arena.',
        mainText: 'Play Combat Engine',
        mainLink: 'isaac.html',
        altText: 'Card Arena',
        altLink: 'vanguard-battle.html',
        playlist: [
          { title: 'Origins & The Tree of Lineage (Master Saga)', src: LIVE_MASTER_VIDEO }
        ]
      },
      heritage: {
        borderColor: '#f59e0b',
        badge: 'UNIVERSE: HERITAGE STORYBOOKS',
        poster: 'marrow-bundle.jpg',
        label: 'Explore the roots of the family lineage.',
        mainText: 'Open E-Reader',
        mainLink: 'marrow.html',
        altText: 'Family Codex',
        altLink: 'storybooks.html',
        playlist: [
          { title: 'Origins & The Tree of Lineage (Heritage Edition)', src: LIVE_MASTER_VIDEO }
        ]
      }
    };

    let activeChannel = 'vanguard';
    let currentClipIndex = 0;

    const player = document.getElementById('cinema-player');
    const source = document.getElementById('video-source');
    const frame = document.getElementById('cinema-frame');
    const badge = document.getElementById('theater-badge');
    const label = document.getElementById('cta-label');
    const mainBtn = document.getElementById('cta-main');
    const altBtn = document.getElementById('cta-alt');
    const nowPlaying = document.getElementById('now-playing');
    const trackCount = document.getElementById('track-count');

    function loadClip(index) {
      const channelData = CHANNELS[activeChannel];
      currentClipIndex = index % channelData.playlist.length;
      const clip = channelData.playlist[currentClipIndex];

      // Explicitly set muted & playsinline for mobile video playback permissions
      player.muted = true;
      player.setAttribute('playsinline', '');
      source.src = clip.src;
      player.src = clip.src;

      nowPlaying.textContent = `NOW PLAYING: ${clip.title}`;
      trackCount.textContent = `CLIP ${currentClipIndex + 1} OF ${channelData.playlist.length}`;

      player.load();
    }

    function setChannel(chan) {
      activeChannel = chan;
      currentClipIndex = 0;
      const data = CHANNELS[chan];

      document.getElementById('btn-vanguard').className = 'chan-btn' + (chan === 'vanguard' ? ' active-vanguard' : '');
      document.getElementById('btn-heritage').className = 'chan-btn' + (chan === 'heritage' ? ' active-heritage' : '');
      frame.style.borderColor = data.borderColor;
      badge.textContent = data.badge;
      player.poster = data.poster;

      label.textContent = data.label;
      mainBtn.textContent = data.mainText;
      mainBtn.href = data.mainLink;
      altBtn.textContent = data.altText;
      altBtn.href = data.altLink;

      loadClip(0);
    }

    // Load initial clip
    loadClip(0);
  </script>
