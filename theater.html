<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Hub | Rhodes Family Legacy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090d16; color: #f1f5f9; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .cinema-container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 16px; }
    .top-bar { display: flex; justify-content: space-between; background: #111827; border-radius: 12px; padding: 12px 18px; }
    .brand-title { font-size: 1.1rem; font-weight: 800; color: #c084fc; text-transform: uppercase; }
    .nav-channels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chan-btn { padding: 12px; font-weight: 800; font-size: 0.85rem; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; text-transform: uppercase; }
    .chan-btn.active-heritage { border-color: #f59e0b; background: #78350f; color: #fff; }
    .chan-btn.active-vanguard { border-color: #a855f7; background: #581c87; color: #fff; }
    .screen-frame { border-radius: 12px; overflow: hidden; border: 2px solid #f59e0b; background: #000; position: relative; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hud-meta { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #0f172a; font-size: 0.8rem; }
    .ctrl-btn { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .home-link { text-align: center; margin-top: 8px; color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="cinema-container">
    <header class="top-bar">
      <div class="brand-title">RHODES FAMILY LEGACY CINEMA</div>
    </header>
    <nav class="nav-channels">
      <button id="btn-heritage" class="chan-btn active-heritage" onclick="setChannel('heritage')">LITTLE FANNIE MAE</button>
      <button id="btn-vanguard" class="chan-btn" onclick="setChannel('vanguard')">VANGUARD SAGA</button>
    </nav>
    <main class="screen-frame">
      <video id="cinema-player" controls playsinline preload="auto">
        <source src="Origins & The Tree of Lineage.mp4" type="video/mp4">
      </video>
    </main>
    <div class="hud-meta">
      <span id="now-playing" style="color: #f59e0b; font-weight: 700;">NOW PLAYING: Origins & The Tree of Lineage</span>
      <div>
        <button class="ctrl-btn" onclick="playPrevious()">⏮ Prev</button>
        <button class="ctrl-btn" onclick="playNext()">Next ⏭</button>
      </div>
    </div>
    <a href="index.html" class="home-link">← RETURN TO MAIN PORTAL</a>
  </div>
  <script>
    const CHANNELS = {
      heritage: [{ title: "Origins & The Tree of Lineage", src: "Origins & The Tree of Lineage.mp4" }],
      vanguard: [
        { title: "Ancestral Lineage Origin", src: "ancestral-lineage-origin.mp4" },
        { title: "Origins & The Tree of Lineage", src: "Origins & The Tree of Lineage.mp4" }
      ]
    };
    let currentChannel = 'heritage';
    let currentIndex = 0;
    const player = document.getElementById('cinema-player');

    function setChannel(chan) {
      currentChannel = chan;
      document.getElementById('btn-heritage').className = chan === 'heritage' ? 'chan-btn active-heritage' : 'chan-btn';
      document.getElementById('btn-vanguard').className = chan === 'vanguard' ? 'chan-btn active-vanguard' : 'chan-btn';
      currentIndex = 0;
      loadVideo();
    }
    function loadVideo() {
      const item = CHANNELS[currentChannel][currentIndex];
      player.src = item.src;
      player.load();
      player.play().catch(e => console.log(e));
      document.getElementById('now-playing').textContent = `NOW PLAYING: ${item.title}`;
    }
    function playNext() {
      currentIndex = (currentIndex + 1) % CHANNELS[currentChannel].length;
      loadVideo();
    }
    function playPrevious() {
      currentIndex = (currentIndex - 1 + CHANNELS[currentChannel].length) % CHANNELS[currentChannel].length;
      loadVideo();
    }
  </script>
</body>
</html>
