<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancestral Vanguard - Multi-Era Saga</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0c0f1d;
      color: #f0e6d2;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    #hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: bold;
      color: #e5c158;
    }
    canvas {
      background: #161224;
      border: 2px solid #e5c158;
      box-shadow: 0 0 15px rgba(229, 193, 88, 0.2);
      max-width: 100%;
      image-rendering: pixelated;
    }
    #era-banner {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 6px;
      background: #1f1b2e;
      border: 1px solid #3d355a;
      margin-top: 6px;
      font-size: 13px;
      color: #c9b037;
    }
    .controls {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    button {
      background: #252033;
      border: 1px solid #c9b037;
      color: #fff;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:active {
      background: #c9b037;
      color: #000;
    }
    .btn-potion {
      background: #1b4d3e;
      border-color: #00ffcc;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <div id="hud">
    <span id="score-display">SCORE: 0</span>
    <span id="era-display">ERA: LEVANT</span>
    <span id="shield-display">SHIELD: [|||||]</span>
  </div>

  <canvas id="gameCanvas" width="480" height="320"></canvas>

  <div id="era-banner">Current Zone: Ancient Mediterranean / Phoenician Peaks</div>

  <div class="controls">
    <button onclick="movePlayer(-15)">◄ LEFT</button>
    <button onclick="movePlayer(15)">RIGHT ►</button>
    <button onclick="attackSpear()">ATK SPEAR</button>
    <button class="btn-potion" onclick="throwPotion()">THROW POTION</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Era Definitions & Outfits
    const ERAS = [
      {
        name: "LEVANT",
        title: "Levant & Phoenician Peaks",
        bg: "#181428",
        ground: "#2d2440",
        tunic: "#c49a45",
        accent: "#f4f0bb",
        skin: "#8d5524",
        potionColor: "#00ffcc",
        potionType: "Coincoin Restorative"
      },
      {
        name: "MALI",
        title: "Mali Empire - Golden Sovereignty",
        bg: "#2b1e10",
        ground: "#453216",
        tunic: "#d4af37",
        accent: "#8b0000",
        skin: "#5a3d28",
        potionColor: "#ffd700",
        potionType: "Solar Gold Brew"
      },
      {
        name: "DISMAL SWAMP",
        title: "Great Dismal Swamp - Maroon Encampment",
        bg: "#0c1a14",
        ground: "#1b3327",
        tunic: "#3b533b",
        accent: "#1e2a1e",
        skin: "#4a321e",
        potionColor: "#39ff14",
        potionType: "Bog Veil Smokescreen"
      },
      {
        name: "CANE RIVER",
        title: "Isle Brevelle / Cane River Heritage",
        bg: "#211612",
        ground: "#3d261a",
        tunic: "#a0522d",
        accent: "#ffffff",
        skin: "#704125",
        potionColor: "#ff4500",
        potionType: "Marie Therese Herbal Elixir"
      }
    ];

    let currentEraIndex = 0;
    let score = 0;
    let kills = 0;

    // Player State
    const player = {
      x: 60,
      y: 220,
      width: 24,
      height: 48,
      facing: 1,
      spearOut: false,
      spearTimer: 0,
      shield: 5
    };

    // Entities
    let enemies = [];
    let potions = [];
    let particles = [];

    // Spawn Enemy Legionary
    function spawnEnemy() {
      if (enemies.length < 3) {
        enemies.push({
          x: canvas.width + Math.random() * 80,
          y: 220,
          width: 24,
          height: 48,
          hp: 40,
          speed: 0.8 + Math.random() * 0.5
        });
      }
    }

    // Procedural Humanoid Drawer
    function drawHumanoid(x, y, facing, skinColor, outfitColor, sashColor, isEnemy = false, isAttacking = false) {
      ctx.save();
      ctx.translate(x + 12, y + 24);
      if (facing < 0) ctx.scale(-1, 1);

      // Legs / Boots
      ctx.fillStyle = isEnemy ? "#2b2b2b" : "#1a120c";
      ctx.fillRect(-8, 12, 6, 12);
      ctx.fillRect(2, 12, 6, 12);

      // Torso / Tunic / Armor
      ctx.fillStyle = outfitColor;
      ctx.fillRect(-9, -8, 18, 20);

      // Sash / Belting / Accent
      ctx.fillStyle = sashColor;
      ctx.fillRect(-10, 2, 20, 4);

      // Head
      ctx.fillStyle = skinColor;
      ctx.beginPath();
      ctx.arc(0, -14, 7, 0, Math.PI * 2);
      ctx.fill();

      // Hair / Helmet
      ctx.fillStyle = isEnemy ? "#b83227" : "#0d0d0d"; 
      ctx.fillRect(-7, -22, 14, 6);

      // Arms & Weapon
      ctx.fillStyle = skinColor;
      if (isAttacking) {
        // Thrusting Arm & Spear
        ctx.fillRect(4, -4, 14, 4);
        ctx.fillStyle = "#d4af37";
        ctx.fillRect(10, -2, 28, 2); // Spear shaft
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(38, -5);
        ctx.lineTo(46, -1);
        ctx.lineTo(38, 3);
        ctx.fill(); // Spear tip
      } else {
        // Idle Arm
        ctx.fillRect(-3, -4, 6, 14);
      }

      ctx.restore();
    }

    function movePlayer(dir) {
      player.x = Math.max(20, Math.min(canvas.width - 60, player.x + dir));
      player.facing = dir > 0 ? 1 : -1;
    }

    function attackSpear() {
      player.spearOut = true;
      player.spearTimer = 12;

      // Hitbox detection
      enemies.forEach((enemy) => {
        let inReach = player.facing > 0 
          ? (enemy.x > player.x && enemy.x < player.x + 60)
          : (enemy.x < player.x && enemy.x > player.x - 60);
        if (inReach) {
          enemy.hp -= 25;
          createSplash(enemy.x, enemy.y + 10, "#ffffff", 6);
        }
      });
    }

    function throwPotion() {
      const era = ERAS[currentEraIndex];
      potions.push({
        x: player.x + (player.facing > 0 ? 20 : -10),
        y: player.y,
        vx: player.facing * 5.5,
        vy: -5.5,
        gravity: 0.32,
        color: era.potionColor
      });
    }

    function createSplash(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.8) * 6,
          life: 20,
          color: color
        });
      }
    }

    function checkEraProgress() {
      if (kills >= 4) {
        kills = 0;
        currentEraIndex = (currentEraIndex + 1) % ERAS.length;
        const era = ERAS[currentEraIndex];
        document.getElementById("era-display").innerText = `ERA: ${era.name}`;
        document.getElementById("era-banner").innerText = `Current Zone: ${era.title} - (${era.potionType} Armed)`;
      }
    }

    function update() {
      const era = ERAS[currentEraIndex];

      // Update Spear Timer
      if (player.spearOut) {
        player.spearTimer--;
        if (player.spearTimer <= 0) player.spearOut = false;
      }

      // Potions Update
      for (let i = potions.length - 1; i >= 0; i--) {
        let p = potions[i];
        p.x += p.vx;
        p.vy += p.gravity;
        p.y += p.vy;

        // Hit Ground
        if (p.y >= 254) {
          createSplash(p.x, 254, p.color, 18);
          // Splash Damage
          enemies.forEach(e => {
            if (Math.abs(e.x - p.x) < 45) e.hp -= 35;
          });
          potions.splice(i, 1);
          continue;
        }

        // Enemy Direct Collision
        enemies.forEach(e => {
          if (Math.hypot(e.x - p.x, e.y - p.y) < 24) {
            createSplash(p.x, p.y, p.color, 18);
            e.hp -= 40;
            potions.splice(i, 1);
          }
        });
      }

      // Enemies Logic
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x -= e.speed;

        // Player Collision
        if (Math.abs(e.x - player.x) < 18) {
          player.shield--;
          document.getElementById("shield-display").innerText = `SHIELD: [${'|'.repeat(Math.max(0, player.shield))}]`;
          enemies.splice(i, 1);
          if (player.shield <= 0) {
            player.shield = 5;
            score = Math.max(0, score - 200);
          }
          continue;
        }

        // Dead Enemy
        if (e.hp <= 0) {
          score += 150;
          kills++;
          document.getElementById("score-display").innerText = `SCORE: ${score}`;
          createSplash(e.x, e.y + 10, "#d4af37", 14);
          enemies.splice(i, 1);
          checkEraProgress();
        }
      }

      // Particles Update
      for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      if (Math.random() < 0.02) spawnEnemy();
    }

    function render() {
      const era = ERAS[currentEraIndex];

      // Sky & Horizon
      ctx.fillStyle = era.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Peaks / Structures
      ctx.fillStyle = era.ground;
      ctx.beginPath();
      ctx.moveTo(0, 260);
      ctx.lineTo(80, 160);
      ctx.lineTo(160, 260);
      ctx.lineTo(260, 140);
      ctx.lineTo(380, 260);
      ctx.lineTo(480, 180);
      ctx.lineTo(480, 260);
      ctx.fill();

      // Platform Floor
      ctx.fillStyle = era.ground;
      ctx.fillRect(0, 260, canvas.width, 60);
      ctx.strokeStyle = era.tunic;
      ctx.strokeRect(0, 260, canvas.width, 2);

      // Draw Player
      drawHumanoid(
        player.x,
        player.y,
        player.facing,
        era.skin,
        era.tunic,
        era.accent,
        false,
        player.spearOut
      );

      // Draw Enemies (Legionaries)
      enemies.forEach(e => {
        drawHumanoid(e.x, e.y, -1, "#9e6f47", "#591313", "#c49a45", true, false);
      });

      // Draw Potions
      potions.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(p.x - 2, p.y - 7, 4, 2); // Bottle cap
      });

      // Draw Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      });
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
