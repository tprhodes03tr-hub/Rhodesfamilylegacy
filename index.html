<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Packed in the Marrow - The Rhodes Family Legacy Experience</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: #121a29;
      --panel-border: #20304a;
      --gold: #f5b041;
      --gold-glow: rgba(245, 176, 65, 0.4);
      --cyan: #00e5ff;
      --red: #ff3366;
      --blue: #2979ff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg-dark);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }
    header {
      text-align: center;
      padding: 24px 16px 12px;
      width: 100%;
      border-bottom: 2px solid #1c283d;
      background: linear-gradient(180deg, #101726 0%, #0a0e17 100%);
    }
    h1 {
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--gold-glow);
    }
    .subtitle {
      color: #90a4ae;
      font-size: 0.95rem;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Books Row */
    .books-section {
      width: 100%;
      max-width: 900px;
      padding: 16px;
    }
    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .book-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .book-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #263852;
      background: #182232;
    }
    .book-card h3 {
      font-size: 0.85rem;
      color: var(--gold);
      margin-top: 8px;
    }
    .book-card p {
      font-size: 0.7rem;
      color: #8da4be;
    }

    /* Game Arcade Container */
    .arcade-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .game-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      margin-bottom: 10px;
      justify-content: center;
    }
    .tab-btn {
      background: #141f33;
      border: 1px solid #293d5e;
      color: #8ab4f8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .tab-btn.active {
      background: var(--red);
      color: #fff;
      border-color: #ff6b8b;
      box-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
    }

    /* Canvas Screen */
    .screen-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 380px;
      background: #000;
      border: 2px solid var(--gold);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.8), inset 0 0 8px rgba(245, 176, 65, 0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* Roster Selector */
    .roster-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .hero-btn {
      background: #131c2e;
      border: 1px solid #253959;
      color: #d1dced;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero-btn span.title {
      color: var(--gold);
      font-size: 0.62rem;
    }
    .hero-btn.active {
      border-color: var(--gold);
      background: #1e2d4a;
      box-shadow: 0 0 8px var(--gold-glow);
    }

    /* Banner Messages */
    .banner-msg {
      width: 100%;
      background: #131d2e;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 8px;
      text-align: center;
      min-height: 28px;
    }

    /* Controls */
    .controls-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 8px;
    }
    .dpad, .action-pad {
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      width: 48px;
      height: 48px;
      background: #141e30;
      border: 2px solid #2b4166;
      border-radius: 50%;
      color: #00e5ff;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: #253959;
      border-color: var(--cyan);
      transform: scale(0.95);
    }
    .ctrl-btn.act-attack {
      background: #3d1420;
      border-color: #7a1c34;
      color: #ff6b8b;
    }
    .ctrl-btn.act-jump {
      background: #102d3d;
      border-color: #176082;
      color: #00e5ff;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Packed in the Marrow</h1>
    <div class="subtitle">The Rhodes Family Legacy Experience</div>
  </header>

  <section class="books-section">
    <div class="books-grid">
      <div class="book-card">
        <img src="volume1.jpg" alt="Volume One: From Father to Son" onerror="this.src='1787664315213~2.jpg'">
        <h3>Volume One</h3>
        <p>From Father to Son</p>
      </div>
      <div class="book-card">
        <img src="volume2.jpg" alt="Volume Two: Cousins of Courage" onerror="this.src='1787665479171.png'">
        <h3>Volume Two</h3>
        <p>Cousins of Courage</p>
      </div>
      <div class="book-card">
        <img src="volume3.jpg" alt="Volume Three: The Colbert Legacy" onerror="this.src='1787974846465.png'">
        <h3>Volume Three</h3>
        <p>The Colbert Legacy</p>
      </div>
    </div>
  </section>

  <section class="arcade-wrapper">
    <div class="game-tabs">
      <button class="tab-btn active" onclick="switchGame('marrow')">Vanguard Hero</button>
      <button class="tab-btn" onclick="switchGame('frogger')">Frogger</button>
      <button class="tab-btn" onclick="switchGame('donkey')">Donkey Kong</button>
      <button class="tab-btn" onclick="switchGame('space')">Space Raiders</button>
      <button class="tab-btn" onclick="switchGame('centipede')">Centipede</button>
    </div>

    <div class="screen-container">
      <canvas id="gameCanvas" width="400" height="360"></canvas>
    </div>

    <div class="roster-grid" id="roster-panel">
      <button class="hero-btn active" onclick="setHero(0)">
        <b>Tommy Philip</b>
        <span class="title">Commander</span>
      </button>
      <button class="hero-btn" onclick="setHero(1)">
        <b>Elroy Rhodes</b>
        <span class="title">Heavyweight</span>
      </button>
      <button class="hero-btn" onclick="setHero(2)">
        <b>Fanny May</b>
        <span class="title">Matriarch</span>
      </button>
      <button class="hero-btn" onclick="setHero(3)">
        <b>Aunt Inez & Marie</b>
        <span class="title">Dual Elements</span>
      </button>
      <button class="hero-btn" onclick="setHero(4)">
        <b>Uncle Bear</b>
        <span class="title">Armored Pillar</span>
      </button>
      <button class="hero-btn" onclick="setHero(5)">
        <b>Uncle Aaron</b>
        <span class="title">Celestial Archer</span>
      </button>
    </div>

    <div class="banner-msg" id="status-msg">
      ⚡ Tommy Philip activates Vanguard Dash & Crescent Blade!
    </div>

    <div class="controls-row">
      <div class="dpad">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-up">▲</button>
        <button class="ctrl-btn" id="btn-down">▼</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
      </div>
      <div class="action-pad">
        <button class="ctrl-btn act-attack" id="btn-atk">⚔️</button>
        <button class="ctrl-btn act-jump" id="btn-jump">JUMP</button>
      </div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    const rosterPanel = document.getElementById('roster-panel');

    let currentGame = 'marrow';
    let keys = { left: false, right: false, up: false, down: false, jump: false, attack: false };

    // --- HERO ROSTER ---
    const heroes = [
      { name: "Tommy Philip", role: "Tactical Commander", color: "#2979ff", weapon: "#00e5ff", msg: "⚡ Tommy Philip activates Vanguard Dash & Crescent Blade!" },
      { name: "Elroy Rhodes", role: "The Heavyweight", color: "#f5b041", weapon: "#ff9900", msg: "🛡️ Elroy Rhodes fortifies Ancestral Iron Defense!" },
      { name: "Fanny May", role: "Matriarch Barrier", color: "#e91e63", weapon: "#ff80ab", msg: "✨ Fanny May casts Sanctuary Beacon Healing!" },
      { name: "Aunt Inez & Marie", role: "Dual Elementals", color: "#9c27b0", weapon: "#ea80fc", msg: "🔥 Inez & Marie summon Twin Legacy Nova!" },
      { name: "Uncle Bear", role: "Armored Pillar", color: "#795548", weapon: "#d7ccc8", msg: "🐻 Uncle Bear unleashes Titan Earthshock!" },
      { name: "Uncle Aaron", role: "Celestial Archer", color: "#00b0ff", weapon: "#80d8ff", msg: "🏹 Uncle Aaron fires Light Arrow Barrage!" }
    ];
    let selectedHero = 0;

    function setHero(index) {
      selectedHero = index;
      document.querySelectorAll('.hero-btn').forEach((b, i) => b.classList.toggle('active', i === index));
      statusMsg.innerText = heroes[index].msg;
      if (currentGame === 'marrow') marrowPlayer.color = heroes[index].color;
    }

    function switchGame(gameName) {
      currentGame = gameName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(gameName.substring(0,4)));
      });
      rosterPanel.style.display = (gameName === 'marrow') ? 'grid' : 'none';
      if (gameName === 'marrow') statusMsg.innerText = heroes[selectedHero].msg;
      if (gameName === 'frogger') statusMsg.innerText = "🐸 Frogger: Cross the highway, ride logs, and catch flies!";
      if (gameName === 'donkey') statusMsg.innerText = "🦍 Donkey Kong: Climb ladders, dodge barrels & save the Lady!";
      if (gameName === 'space') statusMsg.innerText = "🚀 Space Raiders: Destroy orbital invaders!";
      if (gameName === 'centipede') statusMsg.innerText = "🐛 Centipede: Clear the mushroom fields!";
      initCurrentGame();
    }

    // --- GAME STATES & VARIABLES ---

    // 1. MARROW VANGUARD
    let marrowPlayer = { x: 50, y: 280, vx: 0, vy: 0, w: 22, h: 32, grounded: false, relics: 3, score: 2700, hp: 100 };
    let marrowPlatforms = [
      { x: 0, y: 320, w: 400, h: 40 },
      { x: 40, y: 250, w: 100, h: 12 },
      { x: 180, y: 210, w: 110, h: 12 },
      { x: 90, y: 150, w: 100, h: 12 },
      { x: 270, y: 120, w: 90, h: 12 }
    ];
    let attacks = [];

    // 2. FROGGER
    let frog = { x: 190, y: 330, size: 16, startY: 330, lives: 3, score: 0 };
    let frogLogs = [
      { x: 0, y: 50, w: 70, h: 22, speed: 1.2 }, { x: 180, y: 50, w: 70, h: 22, speed: 1.2 },
      { x: 60, y: 85, w: 90, h: 22, speed: -1.5 }, { x: 240, y: 85, w: 90, h: 22, speed: -1.5 },
      { x: 20, y: 120, w: 65, h: 22, speed: 1.0 }, { x: 200, y: 120, w: 65, h: 22, speed: 1.0 }
    ];
    let frogCars = [
      { x: 20, y: 190, w: 36, h: 20, speed: -2 }, { x: 220, y: 190, w: 36, h: 20, speed: -2 },
      { x: 80, y: 230, w: 40, h: 20, speed: 2.5 }, { x: 280, y: 230, w: 40, h: 20, speed: 2.5 },
      { x: 10, y: 270, w: 35, h: 20, speed: -1.8 }, { x: 190, y: 270, w: 35, h: 20, speed: -1.8 }
    ];
    let frogFly = { x: 190, y: 18, active: true };
    let savedFrogs = [false, false, false, false, false];

    // 3. DONKEY KONG
    let dkPlayer = { x: 50, y: 325, vx: 0, vy: 0, w: 14, h: 18, climbing: false, grounded: true, score: 0 };
    let dkGirders = [
      { x: 20, y: 340, w: 360, h: 10 },
      { x: 40, y: 275, w: 340, h: 10 },
      { x: 20, y: 210, w: 340, h: 10 },
      { x: 40, y: 145, w: 340, h: 10 },
      { x: 130, y: 80, w: 140, h: 10 } // Top goal
    ];
    let dkLadders = [
      { x: 330, y: 275, h: 65 },
      { x: 70, y: 210, h: 65 },
      { x: 330, y: 145, h: 65 },
      { x: 180, y: 80, h: 65 }
    ];
    let dkBarrels = [{ x: 140, y: 70, vx: 2, level: 0 }];

    // 4. SPACE RAIDERS
    let ship = { x: 190, y: 310, w: 24, h: 24, shields: 100, score: 0 };
    let shipLasers = [];
    let spaceRaiders = [];

    // 5. CENTIPEDE
    let centiPlayer = { x: 190, y: 320, w: 16, h: 16 };
    let centiShots = [];
    let centiMushrooms = [];
    let centipedeSegments = [];

    function initCurrentGame() {
      if (currentGame === 'marrow') {
        marrowPlayer.x = 50; marrowPlayer.y = 260; marrowPlayer.hp = 100;
      } else if (currentGame === 'frogger') {
        frog.x = 190; frog.y = 330; frog.lives = 3; savedFrogs = [false, false, false, false, false];
      } else if (currentGame === 'donkey') {
        dkPlayer.x = 40; dkPlayer.y = 320; dkBarrels = [{ x: 140, y: 70, vx: 2, level: 0 }];
      } else if (currentGame === 'space') {
        shipLasers = [];
        spaceRaiders = [
          { x: 50, y: 50, vx: 1.5 }, { x: 120, y: 50, vx: 1.5 },
          { x: 200, y: 80, vx: -1.5 }, { x: 280, y: 80, vx: -1.5 }
        ];
      } else if (currentGame === 'centipede') {
        centiMushrooms = [];
        for (let i = 0; i < 24; i++) {
          centiMushrooms.push({ x: Math.floor(Math.random() * 18) * 20 + 20, y: Math.floor(Math.random() * 10) * 20 + 40, hp: 3 });
        }
        centipedeSegments = [];
        for (let i = 0; i < 8; i++) {
          centipedeSegments.push({ x: 200 + i * 16, y: 30, vx: 2 });
        }
      }
    }

    // --- GAME LOOPS & DRAWING ---

    function update() {
      // 1. MARROW LOGIC
      if (currentGame === 'marrow') {
        if (keys.left) marrowPlayer.vx = -3.5;
        else if (keys.right) marrowPlayer.vx = 3.5;
        else marrowPlayer.vx *= 0.7;

        if (keys.jump && marrowPlayer.grounded) {
          marrowPlayer.vy = -8.5;
          marrowPlayer.grounded = false;
        }

        marrowPlayer.vy += 0.45; // Gravity
        marrowPlayer.x += marrowPlayer.vx;
        marrowPlayer.y += marrowPlayer.vy;

        // Platform collision
        marrowPlayer.grounded = false;
        marrowPlatforms.forEach(p => {
          if (marrowPlayer.x + marrowPlayer.w > p.x && marrowPlayer.x < p.x + p.w &&
              marrowPlayer.y + marrowPlayer.h >= p.y && marrowPlayer.y + marrowPlayer.h <= p.y + 12 && marrowPlayer.vy >= 0) {
            marrowPlayer.y = p.y - marrowPlayer.h;
            marrowPlayer.vy = 0;
            marrowPlayer.grounded = true;
          }
        });

        // Bounds
        if (marrowPlayer.x < 0) marrowPlayer.x = 0;
        if (marrowPlayer.x > 378) marrowPlayer.x = 378;

        // Attacks update
        attacks.forEach((a, i) => {
          a.x += a.vx;
          if (a.x > 400 || a.x < 0) attacks.splice(i, 1);
        });
      }

      // 2. FROGGER LOGIC
      else if (currentGame === 'frogger') {
        frogLogs.forEach(log => {
          log.x += log.speed;
          if (log.speed > 0 && log.x > 400) log.x = -log.w;
          if (log.speed < 0 && log.x < -log.w) log.x = 400;
        });

        frogCars.forEach(car => {
          car.x += car.speed;
          if (car.speed > 0 && car.x > 400) car.x = -car.w;
          if (car.speed < 0 && car.x < -car.w) car.x = 400;

          // Car collision
          if (frog.y >= 180 && frog.y <= 290) {
            if (frog.x + frog.size > car.x && frog.x < car.x + car.w &&
                frog.y + frog.size > car.y && frog.y < car.y + car.h) {
              frog.x = 190; frog.y = 330; frog.lives--;
            }
          }
        });

        // Water collision
        if (frog.y >= 40 && frog.y <= 145) {
          let onLog = false;
          frogLogs.forEach(log => {
            if (frog.x + frog.size > log.x && frog.x < log.x + log.w &&
                frog.y >= log.y - 6 && frog.y <= log.y + log.h) {
              onLog = true;
              frog.x += log.speed;
            }
          });
          if (!onLog) { frog.x = 190; frog.y = 330; frog.lives--; }
        }

        // Fly caught
        if (frogFly.active && Math.hypot(frog.x - frogFly.x, frog.y - frogFly.y) < 20) {
          frog.score += 200;
          frogFly.active = false;
        }

        // Goal reached
        if (frog.y < 35) {
          let bay = Math.floor(frog.x / 80);
          if (bay >= 0 && bay < 5 && !savedFrogs[bay]) {
            savedFrogs[bay] = true;
            frog.score += 500;
          }
          frog.x = 190; frog.y = 330;
        }
      }

      // 3. DONKEY KONG LOGIC
      else if (currentGame === 'donkey') {
        let nearLadder = dkLadders.find(l => Math.abs(dkPlayer.x + 7 - l.x) < 14 && dkPlayer.y + dkPlayer.h >= l.y && dkPlayer.y <= l.y + l.h);

        if (nearLadder && (keys.up || keys.down)) {
          dkPlayer.climbing = true;
          dkPlayer.vy = keys.up ? -2 : 2;
        } else if (dkPlayer.climbing && !nearLadder) {
          dkPlayer.climbing = false;
        }

        if (!dkPlayer.climbing) {
          if (keys.left) dkPlayer.vx = -2.5;
          else if (keys.right) dkPlayer.vx = 2.5;
          else dkPlayer.vx = 0;

          if (keys.jump && dkPlayer.grounded) {
            dkPlayer.vy = -6;
            dkPlayer.grounded = false;
          }
          dkPlayer.vy += 0.35; // Gravity
        }

        dkPlayer.x += dkPlayer.vx;
        dkPlayer.y += dkPlayer.vy;

        // Platform collision
        dkPlayer.grounded = false;
        dkGirders.forEach(g => {
          if (dkPlayer.x + dkPlayer.w > g.x && dkPlayer.x < g.x + g.w &&
              dkPlayer.y + dkPlayer.h >= g.y && dkPlayer.y + dkPlayer.h <= g.y + 10 && dkPlayer.vy >= 0) {
            dkPlayer.y = g.y - dkPlayer.h;
            dkPlayer.vy = 0;
            dkPlayer.grounded = true;
            dkPlayer.climbing = false;
          }
        });

        // Barrels update
        dkBarrels.forEach(b => {
          b.x += b.vx;
          if (b.x > 360 || b.x < 30) {
            b.vx *= -1;
            b.y += 65; // fall down to next girder
          }
          // Hit player
          if (Math.hypot((dkPlayer.x + 7) - b.x, (dkPlayer.y + 9) - b.y) < 16) {
            dkPlayer.x = 40; dkPlayer.y = 320;
          }
        });

        // Spawn barrels
        if (Math.random() < 0.008 && dkBarrels.length < 4) {
          dkBarrels.push({ x: 150, y: 80, vx: 2 });
        }
      }

      // 4. SPACE RAIDERS LOGIC
      else if (currentGame === 'space') {
        if (keys.left && ship.x > 10) ship.x -= 4;
        if (keys.right && ship.x < 370) ship.x += 4;

        shipLasers.forEach((l, li) => {
          l.y -= 6;
          spaceRaiders.forEach((r, ri) => {
            if (l.x > r.x && l.x < r.x + 24 && l.y > r.y && l.y < r.y + 24) {
              spaceRaiders.splice(ri, 1);
              shipLasers.splice(li, 1);
              ship.score += 100;
            }
          });
          if (l.y < 0) shipLasers.splice(li, 1);
        });

        spaceRaiders.forEach(r => {
          r.x += r.vx;
          if (r.x > 370 || r.x < 10) r.vx *= -1;
        });
      }

      // 5. CENTIPEDE LOGIC
      else if (currentGame === 'centipede') {
        if (keys.left && centiPlayer.x > 10) centiPlayer.x -= 3.5;
        if (keys.right && centiPlayer.x < 375) centiPlayer.x += 3.5;

        centiShots.forEach((s, si) => {
          s.y -= 6;
          centiMushrooms.forEach((m, mi) => {
            if (Math.hypot(s.x - m.x, s.y - m.y) < 12) {
              m.hp--;
              centiShots.splice(si, 1);
              if (m.hp <= 0) centiMushrooms.splice(mi, 1);
            }
          });
          centipedeSegments.forEach((seg, segi) => {
            if (Math.hypot(s.x - seg.x, s.y - seg.y) < 14) {
              centipedeSegments.splice(segi, 1);
              centiShots.splice(si, 1);
            }
          });
        });

        centipedeSegments.forEach(seg => {
          seg.x += seg.vx;
          if (seg.x > 380 || seg.x < 10) {
            seg.vx *= -1;
            seg.y += 15;
          }
        });
      }
    }

    // --- RENDER FUNCTION ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. MARROW VANGUARD DRAW
      if (currentGame === 'marrow') {
        // Synthwave Sun Background
        let grad = ctx.createLinearGradient(0, 0, 0, 360);
        grad.addColorStop(0, '#12072b');
        grad.addColorStop(1, '#05030a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 400, 360);

        // Sun
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.arc(200, 210, 60, 0, Math.PI * 2);
        ctx.fill();

        // City skyline
        ctx.fillStyle = '#0a0d1a';
        ctx.fillRect(60, 160, 40, 160);
        ctx.fillRect(110, 130, 50, 190);
        ctx.fillRect(230, 140, 60, 180);
        ctx.fillRect(300, 170, 45, 150);

        // Platforms
        marrowPlatforms.forEach(p => {
          ctx.fillStyle = '#1c2c4c';
          ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.fillStyle = '#00e5ff';
          ctx.fillRect(p.x, p.y, p.w, 3);
        });

        // Player (Vanguard)
        const hero = heroes[selectedHero];
        ctx.fillStyle = hero.color;
        ctx.fillRect(marrowPlayer.x, marrowPlayer.y, marrowPlayer.w, marrowPlayer.h);
        ctx.fillStyle = '#fce4ec'; // Face
        ctx.fillRect(marrowPlayer.x + 4, marrowPlayer.y + 4, 14, 10);
        ctx.fillStyle = '#000';
        ctx.fillRect(marrowPlayer.x + 12, marrowPlayer.y + 7, 3, 3); // Eye

        // Weapon/Aura
        ctx.fillStyle = hero.weapon;
        ctx.fillRect(marrowPlayer.x + marrowPlayer.w, marrowPlayer.y + 10, 6, 14);

        // HUD
        ctx.fillStyle = 'rgba(10, 15, 28, 0.85)';
        ctx.fillRect(10, 10, 200, 45);
        ctx.strokeStyle = '#00e5ff';
        ctx.strokeRect(10, 10, 200, 45);

        ctx.fillStyle = '#00e5ff';
        ctx.font = '10px Segoe UI';
        ctx.fillText(`${hero.name} — ${hero.role}`, 16, 26);
        ctx.fillStyle = '#f5b041';
        ctx.fillText(`Relics: ${marrowPlayer.relics}  |  Score: ${marrowPlayer.score}`, 16, 42);

        // Attacks
        attacks.forEach(a => {
          ctx.fillStyle = hero.weapon;
          ctx.beginPath();
          ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 2. FROGGER DRAW
      else if (currentGame === 'frogger') {
        // Water
        ctx.fillStyle = '#0b1d52';
        ctx.fillRect(0, 30, 400, 130);
        // Road
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 180, 400, 120);
        // Grass / Goal
        ctx.fillStyle = '#1e7b34';
        ctx.fillRect(0, 0, 400, 35);
        ctx.fillRect(0, 155, 400, 25);
        ctx.fillRect(0, 300, 400, 60);

        // Bays
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = savedFrogs[i] ? '#00e676' : '#053412';
          ctx.beginPath();
          ctx.arc(40 + i * 80, 18, 14, 0, Math.PI * 2);
          ctx.fill();
        }

        // Fly
        if (frogFly.active) {
          ctx.fillStyle = '#ffeb3b';
          ctx.beginPath();
          ctx.arc(frogFly.x, frogFly.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        // Logs
        frogLogs.forEach(l => {
          ctx.fillStyle = '#8d5b32';
          ctx.fillRect(l.x, l.y, l.w, l.h);
          ctx.fillStyle = '#6d401f';
          ctx.fillRect(l.x + 4, l.y + 4, l.w - 8, l.h - 8);
        });

        // Cars
        frogCars.forEach(c => {
          ctx.fillStyle = c.speed > 0 ? '#e53935' : '#fb8c00';
          ctx.fillRect(c.x, c.y, c.w, c.h);
          ctx.fillStyle = '#fff';
          ctx.fillRect(c.x + 4, c.y + 3, 6, 4);
        });

        // Frog
        ctx.fillStyle = '#76ff03';
        ctx.fillRect(frog.x, frog.y, frog.size, frog.size);

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier';
        ctx.fillText(`SCORE: ${frog.score}   LIVES: ${frog.lives}`, 15, 20);
      }

      // 3. DONKEY KONG DRAW
      else if (currentGame === 'donkey') {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 400, 360);

        // Girders
        ctx.fillStyle = '#d32f2f';
        dkGirders.forEach(g => {
          ctx.fillRect(g.x, g.y, g.w, g.h);
        });

        // Ladders
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        dkLadders.forEach(l => {
          ctx.strokeRect(l.x, l.y, 14, l.h);
          for (let r = l.y + 8; r < l.y + l.h; r += 10) {
            ctx.beginPath();
            ctx.moveTo(l.x, r);
            ctx.lineTo(l.x + 14, r);
            ctx.stroke();
          }
        });

        // Donkey Kong (Top Left)
        ctx.fillStyle = '#795548';
        ctx.fillRect(50, 45, 45, 35);
        ctx.fillStyle = '#ffccbc';
        ctx.fillRect(60, 52, 25, 18);
        ctx.fillStyle = '#000';
        ctx.fillText('🦍 DK', 54, 40);

        // Pauline / Lady (Top Center)
        ctx.fillStyle = '#ff4081';
        ctx.fillRect(190, 56, 14, 24);
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(190, 50, 14, 8);
        ctx.fillStyle = '#fff';
        ctx.fillText('👸 LADY', 178, 42);

        // Barrels
        dkBarrels.forEach(b => {
          ctx.fillStyle = '#ff9800';
          ctx.beginPath();
          ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
          ctx.fill();
        });

        // Jumpman / Mario
        ctx.fillStyle = '#2979ff';
        ctx.fillRect(dkPlayer.x, dkPlayer.y, dkPlayer.w, dkPlayer.h);
        ctx.fillStyle = '#d32f2f';
        ctx.fillRect(dkPlayer.x, dkPlayer.y, dkPlayer.w, 8);

        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier';
        ctx.fillText(`SCORE: ${dkPlayer.score}`, 15, 20);
      }

      // 4. SPACE RAIDERS DRAW
      else if (currentGame === 'space') {
        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, 400, 360);

        // Stars
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 30; i++) {
          ctx.fillRect((i * 47) % 400, (i * 83) % 360, 2, 2);
        }

        // Raiders
        spaceRaiders.forEach(r => {
          ctx.fillStyle = '#e91e63';
          ctx.fillRect(r.x, r.y, 24, 18);
          ctx.fillStyle = '#00e5ff';
          ctx.fillRect(r.x + 6, r.y + 4, 12, 6);
        });

        // Ship
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.moveTo(ship.x + 12, ship.y);
        ctx.lineTo(ship.x + 24, ship.y + 24);
        ctx.lineTo(ship.x, ship.y + 24);
        ctx.fill();

        // Lasers
        ctx.fillStyle = '#ffeb3b';
        shipLasers.forEach(l => ctx.fillRect(l.x, l.y, 3, 10));

        ctx.fillStyle = '#00e5ff';
        ctx.font = '12px Courier';
        ctx.fillText(`SHIELDS: ${ship.shields}%   RAIDERS: ${spaceRaiders.length}`, 15, 20);
      }

      // 5. CENTIPEDE DRAW
      else if (currentGame === 'centipede') {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 400, 360);

        // Mushrooms
        centiMushrooms.forEach(m => {
          ctx.fillStyle = m.hp === 3 ? '#ab47bc' : m.hp === 2 ? '#7e57c2' : '#5c6bc0';
          ctx.beginPath();
          ctx.arc(m.x, m.y, 8, 0, Math.PI * 2);
          ctx.fill();
        });

        // Centipede
        centipedeSegments.forEach((seg, i) => {
          ctx.fillStyle = i === 0 ? '#ff1744' : '#00e676';
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, 7, 0, Math.PI * 2);
          ctx.fill();
        });

        // Player Cannon
        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(centiPlayer.x, centiPlayer.y, centiPlayer.w, centiPlayer.h);

        // Shots
        ctx.fillStyle = '#ffea00';
        centiShots.forEach(s => ctx.fillRect(s.x, s.y, 3, 8));
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // --- CONTROLLER BINDINGS (TOUCH & KEYBOARD) ---

    function setupTouch(id, key) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const start = (e) => {
        e.preventDefault();
        keys[key] = true;
        handleAction(key);
      };
      const end = (e) => {
        e.preventDefault();
        keys[key] = false;
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    }

    function handleAction(key) {
      if (key === 'attack') {
        if (currentGame === 'marrow') {
          attacks.push({ x: marrowPlayer.x + 20, y: marrowPlayer.y + 16, vx: 6 });
        } else if (currentGame === 'space') {
          shipLasers.push({ x: ship.x + 11, y: ship.y });
        } else if (currentGame === 'centipede') {
          centiShots.push({ x: centiPlayer.x + 7, y: centiPlayer.y });
        }
      }
      if (currentGame === 'frogger') {
        if (key === 'up') frog.y -= 25;
        if (key === 'down' && frog.y < 330) frog.y += 25;
        if (key === 'left' && frog.x > 15) frog.x -= 20;
        if (key === 'right' && frog.x < 365) frog.x += 20;
      }
    }

    setupTouch('btn-left', 'left');
    setupTouch('btn-right', 'right');
    setupTouch('btn-up', 'up');
    setupTouch('btn-down', 'down');
    setupTouch('btn-jump', 'jump');
    setupTouch('btn-atk', 'attack');

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.code === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.code === 'ArrowUp' || e.key === 'w') { keys.up = true; handleAction('up'); }
      if (e.code === 'ArrowDown' || e.key === 's') { keys.down = true; handleAction('down'); }
      if (e.code === 'Space') { keys.jump = true; handleAction('jump'); }
      if (e.key === 'j' || e.key === 'k' || e.key === 'f') { keys.attack = true; handleAction('attack'); }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.code === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.code === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.code === 'ArrowDown' || e.key === 's') keys.down = false;
      if (e.code === 'Space') keys.jump = false;
      if (e.key === 'j' || e.key === 'k' || e.key === 'f') keys.attack = false;
    });
  </script>
</body>
</html>
