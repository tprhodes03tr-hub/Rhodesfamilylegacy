<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rhodes Family Legacy Arcade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0b0f19; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; }
  
  /* Menu Selector Tabs */
  .game-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 480px; margin-bottom: 10px; }
  .game-nav button { background: #1a233a; border: 1px solid #334e68; color: #9fb3c8; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .game-nav button.active { background: #e03131; color: white; border-color: #ff8787; }
  
  /* Canvas Screen */
  #viewport { position: relative; width: 360px; height: 380px; background: #000; border: 2px solid #f08c00; border-radius: 8px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  
  /* Status Text */
  #status-bar { width: 360px; background: #101626; color: #62b0e8; font-size: 11px; padding: 6px 10px; text-align: center; border-radius: 4px; margin-top: 6px; border: 1px solid #1a233a; }

  /* Touch Controls */
  .touch-grid { display: flex; justify-content: space-between; width: 360px; margin-top: 10px; align-items: center; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 4px; }
  .btn-action-group { display: flex; gap: 10px; }
  .t-btn { background: #243b53; border: 1px solid #486581; color: #fff; border-radius: 50%; width: 46px; height: 46px; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .t-btn:active { background: #486581; }
  .btn-fire { width: 60px; height: 46px; border-radius: 8px; background: #0088cc; border: 1px solid #33b5e5; }
  .btn-burst { width: 60px; height: 46px; border-radius: 8px; background: #e03131; border: 1px solid #ff6b6b; }
</style>
</head>
<body>

<div class="game-nav" id="nav-bar">
  <button onclick="switchGame('VANGUARD')" id="btn-VANGUARD" class="active">VANGUARD HERO</button>
  <button onclick="switchGame('DONKEY_KONG')" id="btn-DONKEY_KONG">DONKEY KONG</button>
  <button onclick="switchGame('FROGGER')" id="btn-FROGGER">FROGGER</button>
  <button onclick="switchGame('DEFENDER')" id="btn-DEFENDER">DEFENDER</button>
  <button onclick="switchGame('GALAXY')" id="btn-GALAXY">GALAXY SWARM</button>
  <button onclick="switchGame('CENTIPEDE')" id="btn-CENTIPEDE">CENTIPEDE</button>
</div>

<div id="viewport">
  <canvas id="screen" width="360" height="380"></canvas>
</div>
<div id="status-bar">Select your vanguard hero to begin!</div>

<div class="touch-grid">
  <div class="d-pad">
    <div></div><button class="t-btn" id="ctrl-up">▲</button><div></div>
    <button class="t-btn" id="ctrl-left">◀</button><button class="t-btn" id="ctrl-down">▼</button><button class="t-btn" id="ctrl-right">▶</button>
  </div>
  <div class="btn-action-group">
    <button class="t-btn btn-burst" id="ctrl-burst">BURST</button>
    <button class="t-btn btn-fire" id="ctrl-fire">ACTION</button>
  </div>
</div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusBar = document.getElementById('status-bar');

let currentGame = 'VANGUARD';
const keys = { left: false, right: false, up: false, down: false, fire: false, burst: false };

// Bind virtual and physical keys
const bindKey = (id, k) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
  el.addEventListener('mousedown', () => keys[k] = true);
  el.addEventListener('mouseup', () => keys[k] = false);
};
bindKey('ctrl-left', 'left'); bindKey('ctrl-right', 'right');
bindKey('ctrl-up', 'up'); bindKey('ctrl-down', 'down');
bindKey('ctrl-fire', 'fire'); bindKey('ctrl-burst', 'burst');

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
  if (e.code === 'Space') keys.fire = true;
  if (e.code === 'ShiftLeft') keys.burst = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
  if (e.code === 'Space') keys.fire = false;
  if (e.code === 'ShiftLeft') keys.burst = false;
});

function switchGame(gameKey) {
  currentGame = gameKey;
  document.querySelectorAll('.game-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + gameKey).classList.add('active');
  initEngine();
}

/* ==========================================================
   GAME ENGINES ISOLATION
   ========================================================== */
let vg, dk, fr, df, gx, cp;

function initEngine() {
  if (currentGame === 'VANGUARD') {
    vg = {
      chapter: 1,
      player: { x: 30, y: 310, hp: 100, swordOut: false },
      portalUnlocked: false,
      enemies: [{ x: 230, y: 310, hp: 40, dir: -1 }, { x: 280, y: 310, hp: 40, dir: 1 }],
      score: 0
    };
    statusBar.innerText = "Chapter 1: The Illyrian Frontier. Defeat guards to ignite the portal!";
  } 
  else if (currentGame === 'DONKEY_KONG') {
    dk = {
      p: { x: 40, y: 340, vx: 0, vy: 0, climbing: false, onGround: true },
      barrels: [],
      timer: 0,
      platforms: [
        { y: 360, x1: 0, x2: 360 },
        { y: 280, x1: 40, x2: 360 },
        { y: 200, x1: 0, x2: 320 },
        { y: 120, x1: 40, x2: 360 },
        { y: 60, x1: 120, x2: 240 }
      ],
      ladders: [
        { x: 300, y: 280, h: 80 },
        { x: 60, y: 200, h: 80 },
        { x: 270, y: 120, h: 80 },
        { x: 170, y: 60, h: 60 }
      ]
    };
    statusBar.innerText = "Donkey Kong: Jump rolling barrels and climb ladders to the top!";
  }
  else if (currentGame === 'FROGGER') {
    fr = {
      frog: { x: 170, y: 350 },
      fly: { padIndex: 2, active: true },
      lanes: [
        { y: 310, speed: -1.5, w: 26, isLog: false, items: [{x: 50}, {x: 180}, {x: 300}] },
        { y: 270, speed: 2.0, w: 26, isLog: false, items: [{x: 20}, {x: 150}, {x: 260}] },
        { y: 190, speed: 1.2, w: 60, isLog: true, items: [{x: 10}, {x: 140}, {x: 270}] },
        { y: 150, speed: -1.8, w: 80, isLog: true, items: [{x: 40}, {x: 200}] },
        { y: 110, speed: 1.5, w: 50, isLog: true, items: [{x: 20}, {x: 120}, {x: 220}] }
      ],
      pads: [30, 100, 170, 240, 310],
      padFilled: [false, false, false, false, false]
    };
    statusBar.innerText = "Frogger: Hop across traffic & logs. Reach the lily pads and grab the fly!";
  }
  else if (currentGame === 'DEFENDER') {
    df = {
      ship: { x: 80, y: 180, vy: 0 },
      bullets: [],
      landers: [
        { x: 200, y: 50, vy: 0.5, targetHuman: null, state: 'hunting' },
        { x: 310, y: 80, vy: 0.5, targetHuman: null, state: 'hunting' }
      ],
      humans: [
        { x: 100, y: 340, picked: false, falling: false },
        { x: 250, y: 340, picked: false, falling: false }
      ],
      camX: 0
    };
    statusBar.innerText = "Defender: Shoot down alien landers and rescue falling humans safely!";
  }
  else if (currentGame === 'GALAXY') {
    gx = {
      p: { x: 165, doubleShip: false },
      bullets: [],
      boss: { x: 150, y: 40, hp: 5, state: 'idle', beam: false },
      capturedShip: null,
      cooldown: 0
    };
    statusBar.innerText = "Galaxy: Defeat the boss. Survive tractor beams or rescue ships for double fire!";
  }
  else if (currentGame === 'CENTIPEDE') {
    cp = {
      p: { x: 170, y: 340 },
      bullets: [],
      mushrooms: [],
      centipede: []
    };
    for (let i = 0; i < 20; i++) {
      cp.mushrooms.push({ x: Math.floor(Math.random() * 16) * 20 + 20, y: Math.floor(Math.random() * 10) * 20 + 60, hp: 3 });
    }
    for (let i = 0; i < 8; i++) {
      cp.centipede.push({ x: 180 - i * 14, y: 40, dir: 1 });
    }
    statusBar.innerText = "Centipede: Blast mushrooms and stop the descending centipede segments!";
  }
}

/* ==========================================================
   TICK & RENDER LOOPS
   ========================================================== */
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentGame === 'VANGUARD') {
    // Backdrop
    ctx.fillStyle = "#16203b"; ctx.fillRect(0, 0, 360, 380);
    ctx.fillStyle = "#273b66";
    ctx.beginPath(); ctx.moveTo(20, 330); ctx.lineTo(110, 190); ctx.lineTo(200, 330); ctx.fill();
    ctx.beginPath(); ctx.moveTo(170, 330); ctx.lineTo(270, 160); ctx.lineTo(360, 330); ctx.fill();
    ctx.fillStyle = "#f8f9fa"; ctx.fillRect(0, 330, 360, 50);

    // Player
    if (keys.left) vg.player.x -= 2;
    if (keys.right) vg.player.x += 2;
    vg.player.swordOut = keys.fire;

    ctx.fillStyle = "#ffd43b"; ctx.fillRect(vg.player.x, vg.player.y, 14, 20); // body
    if (vg.player.swordOut) {
      ctx.fillStyle = "#4dabf7"; ctx.fillRect(vg.player.x + 14, vg.player.y + 4, 18, 4); // energy blade
    }

    // Enemies
    vg.enemies.forEach(en => {
      en.x += en.dir * 0.8;
      if (en.x < 140 || en.x > 320) en.dir *= -1;
      // Hit detection
      if (vg.player.swordOut && Math.abs(vg.player.x + 14 - en.x) < 18) {
        en.hp -= 2;
      }
      if (en.hp > 0) {
        ctx.fillStyle = "#fa5252"; ctx.fillRect(en.x, en.y, 14, 20);
      }
    });
    vg.enemies = vg.enemies.filter(e => e.hp > 0);

    if (vg.enemies.length === 0) vg.portalUnlocked = true;

    // Portal
    ctx.fillStyle = vg.portalUnlocked ? "#40c057" : "#495057";
    ctx.fillRect(320, 270, 26, 60);
    ctx.fillStyle = "#fff"; ctx.font = "8px sans-serif";
    ctx.fillText(vg.portalUnlocked ? "OPEN" : "LOCKED", 320, 264);

    // Enter Portal
    if (vg.portalUnlocked && vg.player.x >= 315) {
      vg.chapter = 2;
      vg.player.x = 20;
      vg.portalUnlocked = false;
      vg.enemies = [{ x: 180, y: 310, hp: 60, dir: -1 }, { x: 260, y: 310, hp: 60, dir: 1 }];
      statusBar.innerText = "Chapter 2: The Roman Conflict: Roman legions deployed! Destroy them!";
    }
  }

  else if (currentGame === 'DONKEY_KONG') {
    ctx.fillStyle = "#05070a"; ctx.fillRect(0, 0, 360, 380);

    // Draw Ladders
    ctx.strokeStyle = "#4dabf7"; ctx.lineWidth = 2;
    dk.ladders.forEach(l => {
      ctx.strokeRect(l.x, l.y, 14, l.h);
      for (let r = l.y + 6; r < l.y + l.h; r += 8) {
        ctx.beginPath(); ctx.moveTo(l.x, r); ctx.lineTo(l.x + 14, r); ctx.stroke();
      }
    });

    // Draw Platforms
    ctx.fillStyle = "#e03131";
    dk.platforms.forEach(p => ctx.fillRect(p.x1, p.y, p.x2 - p.x1, 8));

    // Spawn Barrels
    dk.timer++;
    if (dk.timer % 120 === 0) {
      dk.barrels.push({ x: 130, y: 50, dir: 1, plat: 4 });
    }

    // Barrels physics
    ctx.fillStyle = "#f59f00";
    dk.barrels.forEach(b => {
      b.x += b.dir * 1.6;
      if (b.x > 330 && b.plat > 0) { b.plat--; b.dir = -1; b.y += 70; }
      if (b.x < 30 && b.plat > 0) { b.plat--; b.dir = 1; b.y += 70; }
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();
    });

    // Player move
    if (keys.left) dk.p.x -= 2;
    if (keys.right) dk.p.x += 2;
    if (keys.up) dk.p.y -= 2;
    if (keys.down) dk.p.y += 2;

    ctx.fillStyle = "#339af0"; ctx.fillRect(dk.p.x, dk.p.y - 14, 12, 14);
  }

  else if (currentGame === 'FROGGER') {
    // Water and Road zones
    ctx.fillStyle = "#0c2461"; ctx.fillRect(0, 60, 360, 160);
    ctx.fillStyle = "#1e272e"; ctx.fillRect(0, 240, 360, 100);
    ctx.fillStyle = "#2e7d32"; ctx.fillRect(0, 220, 360, 20); ctx.fillRect(0, 340, 360, 40);

    // Lily Pads
    fr.pads.forEach((px, i) => {
      ctx.fillStyle = fr.padFilled[i] ? "#51cf66" : "#2f9e44";
      ctx.beginPath(); ctx.arc(px, 40, 14, 0, Math.PI * 2); ctx.fill();
    });

    // Target Fly
    if (fr.fly.active) {
      let flyX = fr.pads[fr.fly.padIndex];
      ctx.fillStyle = "#ffd43b"; ctx.fillRect(flyX - 3, 37, 6, 6);
    }

    // Lanes (Logs & Vehicles)
    fr.lanes.forEach(lane => {
      lane.items.forEach(it => {
        it.x += lane.speed;
        if (lane.speed > 0 && it.x > 380) it.x = -lane.w;
        if (lane.speed < 0 && it.x < -lane.w) it.x = 380;
        ctx.fillStyle = lane.isLog ? "#a66324" : "#e67e22";
        ctx.fillRect(it.x, lane.y, lane.w, 18);
      });
    });

    // Frog Hop Inputs
    if (keys.up && fr.frog.y > 30) { fr.frog.y -= 20; keys.up = false; }
    if (keys.down && fr.frog.y < 350) { fr.frog.y += 20; keys.down = false; }
    if (keys.left && fr.frog.x > 10) { fr.frog.x -= 15; keys.left = false; }
    if (keys.right && fr.frog.x < 330) { fr.frog.x += 15; keys.right = false; }

    // Pad reached
    if (fr.frog.y <= 40) {
      fr.pads.forEach((px, idx) => {
        if (Math.abs(fr.frog.x - px) < 18) {
          fr.padFilled[idx] = true;
          if (fr.fly.active && fr.fly.padIndex === idx) fr.fly.active = false;
        }
      });
      fr.frog = { x: 170, y: 350 };
    }

    ctx.fillStyle = "#51cf66"; ctx.fillRect(fr.frog.x, fr.frog.y, 14, 14);
  }

  else if (currentGame === 'DEFENDER') {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 360, 380);

    // Scanner
    ctx.strokeStyle = "#339af0"; ctx.strokeRect(30, 10, 300, 25);

    // Mountain Terrain
    ctx.strokeStyle = "#e8590c"; ctx.beginPath();
    ctx.moveTo(0, 340); ctx.lineTo(80, 300); ctx.lineTo(160, 340); ctx.lineTo(260, 290); ctx.lineTo(360, 340);
    ctx.stroke();

    // Player Ship
    if (keys.up && df.ship.y > 40) df.ship.y -= 2.5;
    if (keys.down && df.ship.y < 320) df.ship.y += 2.5;
    ctx.fillStyle = "#f8f9fa"; ctx.fillRect(df.ship.x, df.ship.y, 16, 6);

    // Fire
    if (keys.fire) {
      df.bullets.push({ x: df.ship.x + 16, y: df.ship.y + 2 });
      keys.fire = false;
    }
    ctx.fillStyle = "#ffec99";
    df.bullets.forEach(b => { b.x += 6; ctx.fillRect(b.x, b.y, 10, 2); });

    // Humans
    ctx.fillStyle = "#74c0fc";
    df.humans.forEach(h => {
      if (h.falling && !h.picked) {
        h.y += 1.2;
        if (h.y >= 340) { h.y = 340; h.falling = false; }
        // Rescue catch
        if (Math.abs(df.ship.x - h.x) < 16 && Math.abs(df.ship.y - h.y) < 16) {
          h.picked = true; h.falling = false;
        }
      }
      if (h.picked) { h.x = df.ship.x; h.y = df.ship.y + 8; }
      ctx.fillRect(h.x, h.y, 6, 10);
    });

    // Landers
    df.landers.forEach(l => {
      ctx.fillStyle = "#cc5de8"; ctx.fillRect(l.x, l.y, 12, 12);
      if (l.state === 'hunting') {
        let hum = df.humans.find(h => !h.picked && !h.falling);
        if (hum) {
          if (l.x < hum.x) l.x += 0.5; else l.x -= 0.5;
          l.y += 0.4;
          if (Math.abs(l.x - hum.x) < 6 && Math.abs(l.y - hum.y) < 6) {
            l.state = 'abducting'; l.targetHuman = hum;
          }
        }
      } else if (l.state === 'abducting') {
        l.y -= 0.8;
        if (l.targetHuman) { l.targetHuman.y = l.y + 8; l.targetHuman.x = l.x; }
      }

      // Check Bullet Collisions
      df.bullets.forEach(b => {
        if (Math.abs(b.x - l.x) < 12 && Math.abs(b.y - l.y) < 12) {
          if (l.targetHuman) { l.targetHuman.falling = true; }
          l.y = -50; // Destroyed
        }
      });
    });
  }

  else if (currentGame === 'GALAXY') {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 360, 380);

    if (keys.left && gx.p.x > 20) gx.p.x -= 3;
    if (keys.right && gx.p.x < 320) gx.p.x += 3;

    // Bullets
    if (keys.fire && gx.cooldown <= 0) {
      gx.bullets.push({ x: gx.p.x + 6, y: 340 });
      if (gx.p.doubleShip) gx.bullets.push({ x: gx.p.x + 22, y: 340 });
      gx.cooldown = 15;
    }
    if (gx.cooldown > 0) gx.cooldown--;

    ctx.fillStyle = "#ff6b6b";
    gx.bullets.forEach(b => { b.y -= 5; ctx.fillRect(b.x, b.y, 2, 6); });

    // Boss & Tractor Beam
    ctx.fillStyle = "#ffd43b"; ctx.fillRect(gx.boss.x, gx.boss.y, 24, 16);
    if (Math.random() < 0.01 && !gx.boss.beam) gx.boss.beam = true;

    if (gx.boss.beam) {
      ctx.fillStyle = "rgba(116, 192, 252, 0.3)";
      ctx.beginPath();
      ctx.moveTo(gx.boss.x + 12, gx.boss.y + 16);
      ctx.lineTo(gx.boss.x - 30, 380); ctx.lineTo(gx.boss.x + 54, 380);
      ctx.fill();
      if (Math.abs((gx.p.x + 6) - (gx.boss.x + 12)) < 30) {
        gx.p.doubleShip = false; // captured single
      }
    }

    // Boss hit
    gx.bullets.forEach(b => {
      if (Math.abs(b.x - (gx.boss.x + 12)) < 16 && Math.abs(b.y - gx.boss.y) < 12) {
        gx.boss.hp--;
        if (gx.boss.hp <= 0) {
          gx.boss.y = -80;
          gx.p.doubleShip = true; // rescue ship triggers dual cannons
        }
      }
    });

    // Draw Ship(s)
    ctx.fillStyle = "#fff";
    ctx.fillRect(gx.p.x, 350, 14, 10);
    if (gx.p.doubleShip) ctx.fillRect(gx.p.x + 16, 350, 14, 10);
  }

  else if (currentGame === 'CENTIPEDE') {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 360, 380);

    // Mushrooms
    cp.mushrooms.forEach(m => {
      ctx.fillStyle = m.hp === 3 ? "#be4bdb" : "#862e9c";
      ctx.fillRect(m.x, m.y, 12, 10);
    });

    // Centipede Segments
    ctx.fillStyle = "#51cf66";
    cp.centipede.forEach(seg => {
      seg.x += seg.dir * 1.5;
      // Bounce off boundaries or mushrooms
      let hitMush = cp.mushrooms.some(m => Math.abs(m.x - seg.x) < 10 && Math.abs(m.y - seg.y) < 10);
      if (seg.x > 340 || seg.x < 10 || hitMush) {
        seg.dir *= -1;
        seg.y += 12;
      }
      ctx.beginPath(); ctx.arc(seg.x, seg.y, 6, 0, Math.PI * 2); ctx.fill();
    });

    // Player
    if (keys.left && cp.p.x > 10) cp.p.x -= 3;
    if (keys.right && cp.p.x < 340) cp.p.x += 3;
    if (keys.up && cp.p.y > 280) cp.p.y -= 3;
    if (keys.down && cp.p.y < 360) cp.p.y += 3;

    if (keys.fire) {
      cp.bullets.push({ x: cp.p.x + 6, y: cp.p.y });
      keys.fire = false;
    }

    ctx.fillStyle = "#fff";
    cp.bullets.forEach((b, bi) => {
      b.y -= 6; ctx.fillRect(b.x, b.y, 2, 6);
      cp.centipede.forEach((seg, ci) => {
        if (Math.abs(b.x - seg.x) < 8 && Math.abs(b.y - seg.y) < 8) {
          cp.mushrooms.push({ x: seg.x, y: seg.y, hp: 3 });
          cp.centipede.splice(ci, 1);
        }
      });
    });

    ctx.fillStyle = "#fab005"; ctx.fillRect(cp.p.x, cp.p.y, 14, 12);
  }

  requestAnimationFrame(loop);
}

initEngine();
requestAnimationFrame(loop);
</script>
</body>
</html>
