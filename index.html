<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ancestral Legacy Game & Media Hub</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #131b2e;
      --card-border: #1e2c4a;
      --accent-orange: #d97736;
      --accent-red: #d9534f;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Book Cards */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 125px;
    }

    .book-card.vol-1 { border-top: 3px solid #b91c1c; }
    .book-card.vol-2 { border-top: 3px solid #2563eb; }
    .book-card.vol-3 { border-top: 3px solid #15803d; }

    .book-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 2px;
    }

    .vol-1 .book-title { color: #f87171; }
    .vol-2 .book-title { color: #60a5fa; }
    .vol-3 .book-title { color: #4ade80; }

    .book-sub {
      font-size: 0.58rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .book-label {
      font-size: 0.62rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .btn-buy {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 2px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    /* HUD */
    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0 4px;
    }

    .hud-stat {
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
    }

    .bars-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 44%;
    }

    .bar-row {
      display: flex;
      align-items: center;
      font-size: 0.62rem;
      gap: 5px;
    }

    .bar-label {
      width: 30px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .bar-track {
      flex: 1;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hero {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 0.1s linear;
    }

    .bar-fill-boss {
      height: 100%;
      width: 100%;
      background: #64748b;
      transition: width 0.1s linear;
    }

    /* Canvas Frame */
    .canvas-wrap {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #020617;
      aspect-ratio: 400 / 220;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Controls Section */
    .controls-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chapter-heading {
      text-align: center;
      color: var(--accent-gold);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .sub-heading {
      text-align: center;
      color: var(--accent-cyan);
      font-size: 0.64rem;
      font-weight: 700;
      margin-top: -6px;
    }

    /* Champions */
    .champ-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .champ-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 2px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .champ-btn.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
      background: #172554;
    }

    .champ-name {
      font-size: 0.65rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .champ-skill {
      font-size: 0.55rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Action Buttons */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr 1.2fr;
      gap: 5px;
    }

    .ctrl-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 0.70rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .ctrl-btn:active {
      background: #334155;
    }

    .btn-burst {
      background: var(--accent-red);
      border-color: #ef4444;
    }

    /* Video Hub */
    .video-hub {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hub-title {
      text-align: center;
      color: var(--accent-gold);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .upload-btn-label {
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed var(--accent-cyan);
      color: var(--accent-cyan);
      text-align: center;
      padding: 9px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: block;
    }

    #ancestralVideo {
      width: 100%;
      border-radius: 6px;
      background: #000;
      max-height: 220px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="books-grid">
      <div class="book-card vol-1">
        <div>
          <div class="book-title">Packed In The Marrow</div>
          <div class="book-sub">From Father to Son</div>
        </div>
        <div>
          <div class="book-label">Vol. 1 - Father to Son</div>
          <button class="btn-buy" onclick="alert('Vol. 1 Selected')">BUY VOL. 1</button>
        </div>
      </div>
      <div class="book-card vol-2">
        <div>
          <div class="book-title">Cousins Of Courage</div>
          <div class="book-sub">Two Lives, One Blood</div>
        </div>
        <div>
          <div class="book-label">Vol. 2 - Cousins</div>
          <button class="btn-buy" onclick="alert('Vol. 2 Selected')">BUY VOL. 2</button>
        </div>
      </div>
      <div class="book-card vol-3">
        <div>
          <div class="book-title">The Colbert Legacy</div>
          <div class="book-sub">Volume Three</div>
        </div>
        <div>
          <div class="book-label">Vol. 3 - Colbert</div>
          <button class="btn-buy" onclick="alert('Vol. 3 Selected')">BUY VOL. 3</button>
        </div>
      </div>
    </div>

    <div class="game-hud">
      <div class="hud-stat" id="scoreDisplay">SCORE: 26800</div>
      <div class="bars-container">
        <div class="bar-row">
          <span class="bar-label">HERO</span>
          <div class="bar-track"><div class="bar-fill-hero" id="heroHp"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">BOSS</span>
          <div class="bar-track"><div class="bar-fill-boss" id="bossHp"></div></div>
        </div>
      </div>
      <div class="hud-stat" id="waveDisplay">WAVE: [7/8]</div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="400" height="220"></canvas>
    </div>

    <div class="controls-wrapper">
      <div class="chapter-heading" id="chapterTitle">Chapter 7: Midnight Crossing</div>
      <div class="sub-heading">&#10022; SELECT ANCESTRAL CHAMPION &amp; SUPERPOWER &#10022;</div>

      <div class="champ-grid">
        <button class="champ-btn" onclick="selectChamp('inez', this)">
          <span class="champ-name">Inez &amp; Tweet</span>
          <span class="champ-skill">Twin Sister Tag</span>
        </button>
        <button class="champ-btn active" onclick="selectChamp('elroy', this)">
          <span class="champ-name">Elroy Rhodes</span>
          <span class="champ-skill">Delta Heavy</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('bear', this)">
          <span class="champ-name">Uncle Bear</span>
          <span class="champ-skill">Maroon Shock</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('aaron', this)">
          <span class="champ-name">Uncle Aaron</span>
          <span class="champ-skill">Pioneer Volley</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('fanny', this)">
          <span class="champ-name">Fanny May</span>
          <span class="champ-skill">Coincoin Barrier</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('tp', this)">
          <span class="champ-name">TP Mitchell</span>
          <span class="champ-skill">Lineage Beam</span>
        </button>
      </div>

      <div class="action-row">
        <button class="ctrl-btn" id="btnLeft">&#9664; LEFT</button>
        <button class="ctrl-btn" id="btnRight">RIGHT &#9654;</button>
        <button class="ctrl-btn" id="btnJump">&#9650; JUMP</button>
        <button class="ctrl-btn" id="btnAttack">ATK / BOW</button>
        <button class="ctrl-btn btn-burst" id="btnBurst">BURST</button>
      </div>
    </div>

    <div class="video-hub">
      <div class="hub-title">&#10022; ANCESTRAL VIDEO HUB &#10022;</div>
      <label class="upload-btn-label">
        + UPLOAD &amp; PLAY ANCESTRAL FOOTAGE
        <input type="file" id="videoUpload" accept="video/*" style="display:none;" />
      </label>
      <video id="ancestralVideo" controls playsinline>
        Your browser does not support HTML5 video.
      </video>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const chapters = [
        { id: 1, name: "Chapter 1: The Cane River Shoals", theme: 'shoals' },
        { id: 2, name: "Chapter 2: Deep Pines Sanctum", theme: 'forest' },
        { id: 3, name: "Chapter 3: Red Clay Ridge", theme: 'clay' },
        { id: 4, name: "Chapter 4: The Ancestral Forge", theme: 'forge' },
        { id: 5, name: "Chapter 5: Golden Harvest", theme: 'harvest' },
        { id: 6, name: "Chapter 6: Bayou Whispers", theme: 'bayou' },
        { id: 7, name: "Chapter 7: Midnight Crossing", theme: 'midnight' },
        { id: 8, name: "Chapter 8: The Vanguard Dawn", theme: 'dawn' }
      ];

      let currentChapterIdx = 6; // Chapter 7 start
      let score = 26800;

      // Entities
      const hero = {
        x: 60,
        y: 154,
        vx: 0,
        vy: 0,
        width: 14,
        height: 28,
        isGrounded: true,
        facing: 1
      };

      const ghostInez = { x: 38, y: 44, color: '#38bdf8', glow: 'rgba(56, 189, 248, 0.5)', name: 'Inez' };
      const ghostTweet = { x: 74, y: 48, color: '#f43f5e', glow: 'rgba(244, 63, 94, 0.5)', name: 'Tweet' };

      const spiritOwl = { x: 55, y: 24, attacking: false, attackTimer: 0 };
      const spiritLeopard = { x: 25, y: 168, attacking: false, attackTimer: 0 };

      let projectiles = [];
      let slashEffects = [];
      let enemies = [];

      const keys = { left: false, right: false, up: false };

      function spawnEnemies() {
        enemies = [];
        for (let i = 0; i < 4; i++) {
          enemies.push({
            x: 220 + i * 42,
            y: 154,
            width: 14,
            height: 28,
            hp: 40,
            maxHp: 40,
            facing: -1
          });
        }
      }
      spawnEnemies();

      function drawHumanoid(x, y, w, h, facing, headColor, bodyColor, limbColor) {
        ctx.save();
        const cx = x + w / 2;

        // Head
        ctx.fillStyle = headColor;
        ctx.beginPath();
        ctx.arc(cx, y + 4, 4, 0, Math.PI * 2);
        ctx.fill();

        // Neck
        ctx.fillStyle = limbColor;
        ctx.fillRect(cx - 1, y + 7, 2, 2);

        // Body / Torso
        ctx.fillStyle = bodyColor;
        ctx.fillRect(cx - 4, y + 9, 8, 10);

        // Arms
        ctx.fillStyle = limbColor;
        ctx.fillRect(cx + (facing === 1 ? 4 : -6), y + 10, 2, 8);
        ctx.fillRect(cx + (facing === 1 ? -6 : 4), y + 10, 2, 7);

        // Legs
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(cx - 3.5, y + 19, 3, 9);
        ctx.fillRect(cx + 0.5, y + 19, 3, 9);

        // Boots
        ctx.fillStyle = '#475569';
        ctx.fillRect(cx - 4 + (facing === 1 ? 0 : -1), y + 26, 4, 2);
        ctx.fillRect(cx + 0.5 + (facing === 1 ? 1 : 0), y + 26, 4, 2);

        ctx.restore();
      }

      function drawDynamicBackground(theme) {
        const w = canvas.width;
        const h = canvas.height;

        if (theme === 'shoals') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#022c43');
          g.addColorStop(1, '#055052');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#53b8bb';
          ctx.fillRect(0, 135, w, 47);
        } else if (theme === 'forest') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#062817');
          g.addColorStop(1, '#02120a');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#0f3a22';
          for (let i = 0; i < w; i += 28) {
            ctx.beginPath();
            ctx.moveTo(i, 182);
            ctx.lineTo(i + 14, 50);
            ctx.lineTo(i + 28, 182);
            ctx.fill();
          }
        } else if (theme === 'clay') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#4a1508');
          g.addColorStop(1, '#1f0904');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#782813';
          ctx.beginPath();
          ctx.moveTo(0, 130);
          ctx.lineTo(120, 100);
          ctx.lineTo(260, 140);
          ctx.lineTo(400, 110);
          ctx.lineTo(400, 182);
          ctx.lineTo(0, 182);
          ctx.fill();
        } else if (theme === 'forge') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#1c1917');
          g.addColorStop(1, '#431407');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = 'rgba(234, 88, 12, 0.25)';
          ctx.fillRect(140, 50, 120, 132);
        } else if (theme === 'harvest') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#451a03');
          g.addColorStop(1, '#78350f');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#b45309';
          for (let x = 0; x < w; x += 10) {
            ctx.fillRect(x, 125 + Math.sin(x) * 10, 3, 57);
          }
        } else if (theme === 'bayou') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#091d1e');
          g.addColorStop(1, '#042f2e');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#115e59';
          ctx.fillRect(40, 30, 16, 152);
          ctx.fillRect(180, 20, 22, 162);
          ctx.fillRect(320, 40, 18, 142);
        } else if (theme === 'midnight') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#070b14');
          g.addColorStop(1, '#0f172a');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#1e293b';
          for (let x = 18; x < w; x += 44) {
            ctx.fillRect(x, 16, 18, 166);
          }
        } else if (theme === 'dawn') {
          let g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#7c2d12');
          g.addColorStop(0.5, '#c2410c');
          g.addColorStop(1, '#ea580c');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(200, 120, 40, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ground platform
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 182, w, 38);
        ctx.fillStyle = '#374151';
        ctx.fillRect(0, 182, w, 3);
      }

      function executeSimultaneousAttack() {
        // Hero arrow
        projectiles.push({
          x: hero.x + (hero.facing === 1 ? hero.width : 0),
          y: hero.y + 11,
          vx: hero.facing * 7,
          w: 8,
          h: 3,
          damage: 18,
          life: 55
        });

        slashEffects.push({
          x: hero.x + (hero.facing === 1 ? 18 : -8),
          y: hero.y + 12,
          radius: 11,
          timer: 8
        });

        // Ghost Inez Bolt
        projectiles.push({
          x: ghostInez.x + 6,
          y: ghostInez.y + 6,
          vx: 6,
          w: 6,
          h: 4,
          damage: 10,
          life: 45
        });

        // Ghost Tweet Bolt
        projectiles.push({
          x: ghostTweet.x + 6,
          y: ghostTweet.y + 6,
          vx: 6.5,
          w: 6,
          h: 4,
          damage: 12,
          life: 45
        });

        // Owl dive attack
        spiritOwl.attacking = true;
        spiritOwl.attackTimer = 35;

        // Leopard pounce attack
        spiritLeopard.attacking = true;
        spiritLeopard.attackTimer = 30;
      }

      function triggerBurst() {
        executeSimultaneousAttack();
        score += 500;
        for (let enemy of enemies) {
          enemy.hp -= 20;
        }
        slashEffects.push({ x: hero.x + 35, y: hero.y + 10, radius: 26, timer: 14 });
      }

      function update() {
        if (keys.left) {
          hero.vx = -2.2;
          hero.facing = -1;
        } else if (keys.right) {
          hero.vx = 2.2;
          hero.facing = 1;
        } else {
          hero.vx = 0;
        }

        hero.x += hero.vx;

        if (keys.up && hero.isGrounded) {
          hero.vy = -6.5;
          hero.isGrounded = false;
        }

        hero.vy += 0.35;
        hero.y += hero.vy;

        if (hero.y >= 154) {
          hero.y = 154;
          hero.vy = 0;
          hero.isGrounded = true;
        }

        if (hero.x < 10) hero.x = 10;
        if (hero.x > 380) hero.x = 380;

        const time = Date.now() * 0.003;

        // Ghost floats
        ghostInez.x += (hero.x - 22 - ghostInez.x) * 0.05;
