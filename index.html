<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Packed in the Marrow - Vanguard Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060814;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 20px;
    }
    header {
      text-align: center;
      padding: 12px 10px 6px;
    }
    h1 {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #f6d365;
      text-shadow: 0 0 12px rgba(246, 211, 101, 0.45);
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 480px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
    .char-select {
      display: flex;
      gap: 8px;
      width: 95vw;
      max-width: 480px;
      margin: 10px 0;
    }
    .char-card {
      flex: 1;
      padding: 8px 6px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .char-card.active {
      border-color: #f59e0b;
      background: #1e293b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    .char-card .name {
      font-weight: bold;
      font-size: 0.85rem;
      color: #fff;
    }
    .char-card .role {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 95vw;
      max-width: 480px;
      margin-bottom: 8px;
    }
    .btn-ctrl {
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 2px solid #f59e0b;
      border-radius: 50%;
      aspect-ratio: 1;
      color: #f8fafc;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      touch-action: manipulation;
      cursor: pointer;
    }
    .btn-ctrl:active {
      transform: scale(0.92);
      border-color: #38bdf8;
      background: #334155;
    }
    .banner {
      width: 95vw;
      max-width: 480px;
      padding: 6px 10px;
      text-align: center;
      font-size: 0.75rem;
      color: #facc15;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Packed in the Marrow</h1>
    <div class="subtitle">The Legacy Chronicles • Tactical Vanguard Action</div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
  </div>

  <div class="char-select">
    <div class="char-card active" onclick="selectHero('tommy')">
      <div class="name">Tommy Philip</div>
      <div class="role">Tactical Commander</div>
    </div>
    <div class="char-card" onclick="selectHero('elroy')">
      <div class="name">Elroy Rhodes</div>
      <div class="role">The Heavyweight</div>
    </div>
  </div>

  <div class="controls-grid">
    <button class="btn-ctrl" id="btn-left">◀</button>
    <button class="btn-ctrl" id="btn-right">▶</button>
    <button class="btn-ctrl" id="btn-jump">▲</button>
    <button class="btn-ctrl" id="btn-attack">⚔</button>
    <button class="btn-ctrl" id="btn-super">⚡</button>
  </div>

  <div class="banner">
    ⚡ <strong>Vanguard Mode:</strong> Double-tap jump to air leap, slash enemies to unleash Energy Waves!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WORLD_WIDTH = 1600;
    const WORLD_HEIGHT = 270;
    const GROUND_Y = 230;

    let cameraX = 0;
    let screenShake = 0;
    let score = 0;
    let relics = 0;

    const input = { left: false, right: false, up: false, attack: false, super: false };

    // Character Profiles
    const characters = {
      tommy: {
        name: "Tommy Philip",
        title: "Tactical Commander",
        color: "#38bdf8",
        glow: "#f59e0b",
        speed: 3.2,
        jumpForce: 7.5,
        scale: 1.4,
        type: "slash"
      },
      elroy: {
        name: "Elroy Rhodes",
        title: "The Heavyweight",
        color: "#fbbf24",
        glow: "#ef4444",
        speed: 2.6,
        jumpForce: 8.0,
        scale: 1.65,
        type: "fist"
      }
    };

    let activeHero = characters.tommy;

    function selectHero(key) {
      activeHero = characters[key];
      player.scale = activeHero.scale;
      document.querySelectorAll('.char-card').forEach((el, idx) => {
        el.classList.toggle('active', (key === 'tommy' && idx === 0) || (key === 'elroy' && idx === 1));
      });
    }

    // Player State
    const player = {
      x: 100,
      y: GROUND_Y - 50,
      w: 22,
      h: 44,
      vx: 0,
      vy: 0,
      scale: 1.4,
      facing: 1,
      isGrounded: false,
      jumpsLeft: 2,
      attackCooldown: 0,
      superCooldown: 0,
      animTime: 0,
      state: 'idle',
      hp: 100,
      maxHp: 100
    };

    // Platforms
    const platforms = [
      { x: 0, y: GROUND_Y, w: WORLD_WIDTH, h: 40 },
      { x: 180, y: 170, w: 110, h: 10 },
      { x: 360, y: 130, w: 120, h: 10 },
      { x: 550, y: 165, w: 100, h: 10 },
      { x: 720, y: 120, w: 140, h: 10 },
      { x: 930, y: 160, w: 110, h: 10 },
      { x: 1120, y: 130, w: 130, h: 10 },
      { x: 1330, y: 165, w: 120, h: 10 }
    ];

    // Collectible Relics
    const collectibles = [
      { x: 230, y: 140, taken: false },
      { x: 420, y: 100, taken: false },
      { x: 790, y: 90, taken: false },
      { x: 1180, y: 100, taken: false },
      { x: 1390, y: 135, taken: false }
    ];

    // Robotic Legion Enemies
    let enemies = [
      { x: 300, y: GROUND_Y - 42, w: 20, h: 42, vx: -0.8, hp: 40, maxHp: 40, minX: 200, maxX: 450, facing: -1 },
      { x: 650, y: GROUND_Y - 42, w: 20, h: 42, vx: 0.9, hp: 40, maxHp: 40, minX: 550, maxX: 800, facing: 1 },
      { x: 800, y: 120 - 42, w: 20, h: 42, vx: 0.7, hp: 30, maxHp: 30, minX: 730, maxX: 850, facing: 1 },
      { x: 1050, y: GROUND_Y - 42, w: 20, h: 42, vx: -1.1, hp: 50, maxHp: 50, minX: 950, maxX: 1250, facing: -1 },
      { x: 1400, y: GROUND_Y - 42, w: 20, h: 42, vx: -0.8, hp: 40, maxHp: 40, minX: 1300, maxX: 1550, facing: -1 }
    ];

    let projectiles = [];
    let particles = [];
    let combatTexts = [];

    // Controller Bindings
    function bindTouch(id, key) {
      const el = document.getElementById(id);
      const setTrue = (e) => { e.preventDefault(); input[key] = true; };
      const setFalse = (e) => { e.preventDefault(); input[key] = false; };
      el.addEventListener('touchstart', setTrue);
      el.addEventListener('touchend', setFalse);
      el.addEventListener('mousedown', setTrue);
      el.addEventListener('mouseup', setFalse);
      el.addEventListener('mouseleave', setFalse);
    }
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'up');
    bindTouch('btn-attack', 'attack');
    bindTouch('btn-super', 'super');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') input.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') input.right = true;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key.toLowerCase() === 'w') input.up = true;
      if (e.key.toLowerCase() === 'j' || e.key === 'f') input.attack = true;
      if (e.key.toLowerCase() === 'k' || e.key.toLowerCase() === 'e') input.super = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') input.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') input.right = false;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key.toLowerCase() === 'w') input.up = false;
      if (e.key.toLowerCase() === 'j' || e.key === 'f') input.attack = false;
      if (e.key.toLowerCase() === 'k' || e.key.toLowerCase() === 'e') input.super = false;
    });

    // Particle & Text FX
    function spawnCombatText(x, y, text, color = '#fef08a') {
      combatTexts.push({ x, y, text, color, life: 35, vy: -1.2 });
    }

    function spawnHitFX(x, y, color = '#f59e0b', count = 7) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 18 + Math.random() * 10,
          color,
          size: 2 + Math.random() * 2
        });
      }
    }

    // Game Update Loop
    let upPressedPrev = false;
    let attackPressedPrev = false;
    let superPressedPrev = false;

    function update() {
      // Horizontal Movement
      if (input.left) {
        player.vx = -activeHero.speed;
        player.facing = -1;
        player.state = 'run';
      } else if (input.right) {
        player.vx = activeHero.speed;
        player.facing = 1;
        player.state = 'run';
      } else {
        player.vx *= 0.7;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
        player.state = 'idle';
      }

      // Jump Execution
      if (input.up && !upPressedPrev && player.jumpsLeft > 0) {
        player.vy = -activeHero.jumpForce;
        player.jumpsLeft--;
        spawnHitFX(player.x + (player.w * player.scale) / 2, player.y + player.h * player.scale, '#38bdf8', 5);
      }
      upPressedPrev = input.up;

      // Gravity & Physics
      player.vy += 0.38;
      player.x += player.vx;
      player.y += player.vy;

      // Boundary limits
      if (player.x < 0) player.x = 0;
      if (player.x > WORLD_WIDTH - player.w * player.scale) player.x = WORLD_WIDTH - player.w * player.scale;

      // Platform Collisions
      player.isGrounded = false;
      const pw = player.w * player.scale;
      const ph = player.h * player.scale;

      platforms.forEach(plat => {
        if (
          player.x + pw > plat.x &&
          player.x < plat.x + plat.w &&
          player.y + ph >= plat.y &&
          player.y + ph - player.vy <= plat.y + 12 &&
          player.vy >= 0
        ) {
          player.y = plat.y - ph;
          player.vy = 0;
          player.isGrounded = true;
          player.jumpsLeft = 2;
        }
      });

      // Attacks
      if (player.attackCooldown > 0) player.attackCooldown--;
      if (player.superCooldown > 0) player.superCooldown--;

      if (input.attack && !attackPressedPrev && player.attackCooldown === 0) {
        player.attackCooldown = 18;
        screenShake = 4;
        const slashX = player.x + (player.facing === 1 ? pw : -20);
        const slashY = player.y + ph * 0.4;

        projectiles.push({
          x: slashX,
          y: slashY,
          vx: player.facing * 5.5,
          w: 24,
          h: 18,
          life: 25,
          damage: 20,
          color: activeHero.glow
        });
        spawnHitFX(slashX, slashY, activeHero.glow, 4);
      }
      attackPressedPrev = input.attack;

      if (input.super && !superPressedPrev && player.superCooldown === 0) {
        player.superCooldown = 90;
        screenShake = 10;
        for (let angle = -0.3; angle <= 0.3; angle += 0.3) {
          projectiles.push({
            x: player.x + pw / 2,
            y: player.y + ph * 0.3,
            vx: Math.cos(angle) * player.facing * 7,
            vy: Math.sin(angle) * 3,
            w: 30,
            h: 24,
            life: 35,
            damage: 45,
            isSuper: true,
            color: '#facc15'
          });
        }
      }
      superPressedPrev = input.super;

      // Update Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        if (p.vy) p.y += p.vy;
        p.life--;

        // Check enemy collision
        enemies.forEach(e => {
          if (
            p.x < e.x + e.w &&
            p.x + p.w > e.x &&
            p.y < e.y + e.h &&
            p.y + p.h > e.y
          ) {
            e.hp -= p.damage;
            p.life = 0;
            screenShake = p.isSuper ? 8 : 4;
            spawnHitFX(e.x + e.w / 2, e.y + e.h / 2, p.color, 10);
            spawnCombatText(e.x, e.y - 10, `+${p.damage}`, p.isSuper ? '#facc15' : '#fff');
          }
        });

        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        if (e.x < e.minX || e.x + e.w > e.maxX) {
          e.vx *= -1;
          e.facing = e.vx > 0 ? 1 : -1;
        }

        if (e.hp <= 0) {
          spawnCombatText(e.x, e.y, "DEFEATED", "#f87171");
          spawnHitFX(e.x, e.y, "#94a3b8", 16);
          score += 150;
          enemies.splice(i, 1);
        }
      }

      // Relics Pickups
      collectibles.forEach(c => {
        if (!c.taken && Math.hypot((player.x + pw / 2) - c.x, (player.y + ph / 2) - c.y) < 28) {
          c.taken = true;
          relics++;
          score += 500;
          spawnCombatText(c.x, c.y - 12, "+500 RELIC", "#facc15");
          spawnHitFX(c.x, c.y, "#facc15", 14);
        }
      });

      // Camera Follow Centered on Player
      const targetCamX = player.x + pw / 2 - canvas.width / 2;
      cameraX += (targetCamX - cameraX) * 0.1;
      cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));

      if (screenShake > 0) screenShake *= 0.85;

      player.animTime += 0.15;
    }

    // Rendering Engine
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      if (screenShake > 0.2) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // 1. Synthwave Backdrop
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#090a1a');
      grad.addColorStop(0.65, '#2b103c');
      grad.addColorStop(1, '#05050f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Sun
      const sunX = canvas.width * 0.5 - cameraX * 0.05;
      const sunY = 90;
      const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 55);
      sunGrad.addColorStop(0, '#fde047');
      sunGrad.addColorStop(0.6, '#db2777');
      sunGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 55, 0, Math.PI * 2);
      ctx.fill();

      // Sun scanlines
      ctx.fillStyle = 'rgba(9, 10, 26, 0.7)';
      for (let y = sunY - 10; y < sunY + 55; y += 7) {
        ctx.fillRect(sunX - 60, y, 120, 2.5);
      }

      // Parallax City Skyline
      ctx.fillStyle = '#14142b';
      for (let i = 0; i < 20; i++) {
        const bx = i * 90 - (cameraX * 0.2 % 90);
        const bh = 50 + (i % 4) * 25;
        ctx.fillRect(bx, GROUND_Y - bh, 65, bh);
      }

      // Midground Tech Ruins
      ctx.fillStyle = '#1e1b4b';
      for (let i = 0; i < 15; i++) {
        const mx = i * 140 - (cameraX * 0.5 % 140);
        const mh = 30 + (i % 3) * 35;
        ctx.fillRect(mx, GROUND_Y - mh, 45, mh);
      }

      // 2. World Space Rendering
      ctx.save();
      ctx.translate(-cameraX, 0);

      // Platforms
      platforms.forEach(plat => {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);

        // Tech neon top edge
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(plat.x, plat.y, plat.w, 2);
      });

      // Relics
      collectibles.forEach(c => {
        if (!c.taken) {
          ctx.save();
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(c.x, c.y + Math.sin(player.animTime * 2) * 3, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });

      // Enemies (Robotic Legion)
      enemies.forEach(e => {
        // Body
        ctx.fillStyle = '#64748b';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        // Armor Plate
        ctx.fillStyle = '#334155';
        ctx.fillRect(e.x + 2, e.y + 10, e.w - 4, 18);
        // Visor glow
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(e.facing === 1 ? e.x + e.w - 5 : e.x + 1, e.y + 4, 4, 3);

        // HP bar
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(e.x, e.y - 8, e.w, 3);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(e.x, e.y - 8, (e.hp / e.maxHp) * e.w, 3);
      });

      // Player Render (Scaled & Styled Warrior)
      drawVanguardPlayer();

      // Projectiles / Slash FX
      projectiles.forEach(p => {
        ctx.save();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = p.color;

        ctx.beginPath();
        if (p.vx > 0) {
          ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.h / 2, -Math.PI / 2, Math.PI / 2);
        } else {
          ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.h / 2, Math.PI / 2, (Math.PI * 3) / 2);
        }
        ctx.fill();
        ctx.restore();
      });

      // Particles
      particles.forEach((pt, idx) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        if (pt.life <= 0) particles.splice(idx, 1);
      });

      // Floating Damage Numbers
      combatTexts.forEach((ct, idx) => {
        ct.y += ct.vy;
        ct.life--;
        ctx.font = "bold 10px sans-serif";
        ctx.fillStyle = ct.color;
        ctx.fillText(ct.text, ct.x, ct.y);
        if (ct.life <= 0) combatTexts.splice(idx, 1);
      });

      ctx.restore(); // End World Space
      ctx.restore(); // End Screen Shake

      // 3. UI / HUD Header Overlay
      drawHUD();
    }

    function drawVanguardPlayer() {
      const pw = player.w * player.scale;
      const ph = player.h * player.scale;
      const x = player.x;
      const y = player.y;
      const bob = Math.sin(player.animTime * 3) * 2;

      ctx.save();
      // Armor Glow Aura
      ctx.shadowColor = activeHero.glow;
      ctx.shadowBlur = 10;

      // Armor Body
      ctx.fillStyle = '#b45309'; // Bronze Vanguard Armor Base
      ctx.fillRect(x + 4, y + 14 + bob, pw - 8, ph - 24);

      // Chestplate & Spaulders
      ctx.fillStyle = activeHero.color;
      ctx.fillRect(x + 2, y + 14 + bob, pw - 4, 12);

      // Head
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x + pw / 2 - 6, y + 2 + bob, 12, 12);

      // Glowing Gauntlets / Weapon
      ctx.fillStyle = activeHero.glow;
      const handX = player.facing === 1 ? x + pw - 4 : x - 4;
      ctx.fillRect(handX, y + ph * 0.45 + bob, 8, 8);

      // Legs / Stride animation
      ctx.fillStyle = '#1e293b';
      if (player.state === 'run') {
        const stride = Math.sin(player.animTime * 6) * 6;
        ctx.fillRect(x + 4, y + ph - 12, 6, 12 + stride);
        ctx.fillRect(x + pw - 10, y + ph - 12, 6, 12 - stride);
      } else {
        ctx.fillRect(x + 4, y + ph - 12, 6, 12);
        ctx.fillRect(x + pw - 10, y + ph - 12, 6, 12);
      }

      ctx.restore();
    }

    function drawHUD() {
      // HUD Card
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1;
      ctx.fillRect(8, 8, 220, 36);
      ctx.strokeRect(8, 8, 220, 36);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText(`${activeHero.name} — ${activeHero.title}`, 14, 20);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '8px sans-serif';
      ctx.fillText(`Relics: ${relics}  |  Score: ${score}  |  Chapter: 1`, 14, 34);

      // Timer Badge
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 65, 8, 57, 20);
      ctx.strokeRect(canvas.width - 65, 8, 57, 20);
      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('⚡ READY', canvas.width - 57, 22);
    }

    // Engine Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
