<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy - Arcade & Books</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b1120;
      color: #00e5ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 15px 10px 40px;
    }

    /* Section Headings */
    .section-title {
      color: #ffeb3b;
      font-size: 1.3rem;
      margin: 25px 0 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    /* Game Selector Tabs */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 380px;
    }
    .tab-btn {
      background: transparent;
      border: 2px solid #00e5ff;
      color: #00e5ff;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #00e5ff;
      color: #000;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    }

    /* Game HUD */
    .hud {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    /* Arcade Screen */
    .screen-wrapper {
      border: 3px solid #1e3a8a;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #000;
    }

    /* Arcade Controls */
    .controller {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding: 0 10px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
    }
    .d-btn {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      color: #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .d-btn:active { background: #38bdf8; color: #000; }
    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }

    .jump-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid #fca5a5;
      color: #fff;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    .jump-btn:active { transform: scale(0.94); background: #dc2626; }

    /* Divider */
    hr {
      width: 100%;
      max-width: 420px;
      border: 0;
      height: 1px;
      background: #1e3a8a;
      margin: 30px 0 10px;
    }

    /* Book Cards Showcase */
    .book-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 360px;
    }
    .book-card {
      background: #111827;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .book-card img {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
      margin-bottom: 14px;
      object-fit: cover;
    }
    .book-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }
    .book-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .buy-btn {
      background: #f59e0b;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .buy-btn:hover { background: #d97706; }
  </style>
</head>
<body>

  <!-- ARCADE HUB SECTION -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchGame('PACMAN')">Ms. Pac-Man</button>
    <button class="tab-btn" onclick="switchGame('CUBIC')">Cubic</button>
    <button class="tab-btn" onclick="switchGame('FROGGER')">Frogger</button>
    <button class="tab-btn" onclick="switchGame('DK')">Donkey Kong</button>
  </div>

  <div class="hud">
    <span id="titleDisplay">MS. PAC-MAN</span>
    <span id="scoreDisplay">SCORE: 0</span>
    <span id="livesDisplay">LIVES: 3</span>
  </div>

  <div class="screen-wrapper">
    <canvas id="gameCanvas" width="360" height="380"></canvas>
  </div>

  <div class="controller">
    <div class="dpad">
      <button class="d-btn d-up" onpointerdown="handleInput('UP')">▲</button>
      <button class="d-btn d-left" onpointerdown="handleInput('LEFT')">◀</button>
      <button class="d-btn d-right" onpointerdown="handleInput('RIGHT')">▶</button>
      <button class="d-btn d-down" onpointerdown="handleInput('DOWN')">▼</button>
    </div>
    <button class="jump-btn" onpointerdown="handleInput('JUMP')">JUMP</button>
  </div>

  <hr />

  <!-- BOOK SHOWCASE SECTION -->
  <h2 class="section-title">Published Works</h2>

  <div class="book-container">
    <!-- Master Bundle -->
    <div class="book-card">
      <img src="1787664315213~2.jpg" alt="Packed in the Marrow: Master Bundle" onerror="this.src='1787665479171.png'" />
      <div class="book-title">Master Bundle</div>
      <div class="book-sub">Volumes 1, 2 & 3 Collection</div>
      <a href="https://payhip.com" class="buy-btn" target="_blank">Get Complete Bundle</a>
    </div>

    <!-- Volume Two -->
    <div class="book-card">
      <img src="178777635429.png" alt="Cousins of Courage: Volume Two" onerror="this.src='1787834404860.png'" />
      <div class="book-title">Cousins of Courage</div>
      <div class="book-sub">Volume Two • Sacred Legacy of Civil Rights and Hollywood</div>
      <a href="https://payhip.com" class="buy-btn" target="_blank">Get Volume Two</a>
    </div>
  </div>

  <!-- GAME LOGIC ENGINE -->
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentGame = 'PACMAN';
    let score = 0;
    let lives = 3;

    // Ms. Pac-Man State
    let pac = { x: 180, y: 220, r: 10, dx: 0, dy: 0, mouth: 0.2, mouthSpeed: 0.02 };
    let pacDots = [];
    function initPacman() {
      pac = { x: 180, y: 220, r: 10, dx: 0, dy: 0, mouth: 0.2, mouthSpeed: 0.02 };
      pacDots = [];
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 6; c++) {
          pacDots.push({ x: 45 + c * 54, y: 45 + r * 68, active: true });
        }
      }
    }

    // Cubic State
    let cubicPyramid = [];
    let cubicPlayer = { row: 0, col: 0 };
    function initCubic() {
      cubicPyramid = [];
      cubicPlayer = { row: 0, col: 0 };
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c <= r; c++) {
          cubicPyramid.push({ row: r, col: c, x: 180 + (c - r / 2) * 44, y: 60 + r * 44, stepped: false });
        }
      }
    }

    // Frogger State
    let frog = { x: 165, y: 340, w: 25, h: 25 };
    let obstacles = [
      { x: 0, y: 220, w: 45, h: 20, speed: 2, color: '#f59e0b' },
      { x: 180, y: 250, w: 40, h: 20, speed: -2.5, color: '#ef4444' },
      { x: 50, y: 130, w: 65, h: 22, speed: 1.8, color: '#92400e' },
      { x: 200, y: 90, w: 75, h: 22, speed: -2.2, color: '#92400e' }
    ];
    function initFrogger() { frog = { x: 165, y: 340, w: 25, h: 25 }; }

    // Donkey Kong State
    let dkPlayer = { x: 30, y: 310, w: 20, h: 30, dy: 0, isGrounded: true };
    let barrels = [
      { x: 180, y: 165, r: 8, dx: 2 },
      { x: 220, y: 245, r: 8, dx: -2.5 }
    ];
    function initDK() {
      dkPlayer = { x: 30, y: 310, w: 20, h: 30, dy: 0, isGrounded: true };
      barrels = [
        { x: 180, y: 165, r: 8, dx: 2 },
        { x: 220, y: 245, r: 8, dx: -2.5 }
      ];
    }

    // Tab Switcher
    function switchGame(gameKey) {
      currentGame = gameKey;
      score = 0;
      lives = 3;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeIdx = ['PACMAN', 'CUBIC', 'FROGGER', 'DK'].indexOf(gameKey);
      if (activeIdx >= 0) document.querySelectorAll('.tab-btn')[activeIdx].classList.add('active');

      const names = { PACMAN: 'MS. PAC-MAN', CUBIC: 'CUBIC', FROGGER: 'FROGGER', DK: 'DONKEY KONG' };
      document.getElementById('titleDisplay').innerText = names[gameKey];

      if (gameKey === 'PACMAN') initPacman();
      if (gameKey === 'CUBIC') initCubic();
      if (gameKey === 'FROGGER') initFrogger();
      if (gameKey === 'DK') initDK();
    }

    // Input Controller
    function handleInput(dir) {
      if (currentGame === 'PACMAN') {
        const s = 3;
        if (dir === 'UP') { pac.dx = 0; pac.dy = -s; }
        if (dir === 'DOWN') { pac.dx = 0; pac.dy = s; }
        if (dir === 'LEFT') { pac.dx = -s; pac.dy = 0; }
        if (dir === 'RIGHT') { pac.dx = s; pac.dy = 0; }
      } else if (currentGame === 'CUBIC') {
        if (dir === 'DOWN' || dir === 'RIGHT') {
          if (cubicPlayer.row < 6) {
            cubicPlayer.row++;
            if (dir === 'RIGHT') cubicPlayer.col++;
          }
        } else if (dir === 'UP' || dir === 'LEFT') {
          if (cubicPlayer.row > 0) {
            cubicPlayer.row--;
            if (dir === 'LEFT' && cubicPlayer.col > 0) cubicPlayer.col--;
            if (cubicPlayer.col > cubicPlayer.row) cubicPlayer.col = cubicPlayer.row;
          }
        }
        const target = cubicPyramid.find(p => p.row === cubicPlayer.row && p.col === cubicPlayer.col);
        if (target && !target.stepped) {
          target.stepped = true;
          score += 25;
        }
      } else if (currentGame === 'FROGGER') {
        if (dir === 'UP') frog.y -= 35;
        if (dir === 'DOWN') frog.y += 35;
        if (dir === 'LEFT') frog.x -= 30;
        if (dir === 'RIGHT') frog.x += 30;
        if (frog.y < 40) { score += 100; initFrogger(); }
      } else if (currentGame === 'DK') {
        if (dir === 'LEFT') dkPlayer.x -= 8;
        if (dir === 'RIGHT') dkPlayer.x += 8;
        if ((dir === 'JUMP' || dir === 'UP') && dkPlayer.isGrounded) {
          dkPlayer.dy = -7;
          dkPlayer.isGrounded = false;
        }
      }
    }

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') handleInput('UP');
      if (e.key === 'ArrowDown' || e.key === 's') handleInput('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a') handleInput('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd') handleInput('RIGHT');
      if (e.key === ' ' || e.key === 'Enter') handleInput('JUMP');
    });

    // Render Engine
    function update() {
      document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
      document.getElementById('livesDisplay').innerText = `LIVES: ${lives}`;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentGame === 'PACMAN') {
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, 320, 340);
        ctx.strokeRect(60, 60, 80, 50);
        ctx.strokeRect(220, 60, 80, 50);
        ctx.strokeRect(140, 160, 80, 50);

        pacDots.forEach(dot => {
          if (dot.active) {
            ctx.fillStyle = '#fce7f3';
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, 3, 0, Math.PI * 2);
            ctx.fill();
            if (Math.hypot(pac.x - dot.x, pac.y - dot.y) < pac.r + 3) {
              dot.active = false;
              score += 10;
            }
          }
        });

        pac.x = Math.max(25, Math.min(335, pac.x + pac.dx));
        pac.y = Math.max(25, Math.min(355, pac.y + pac.dy));
        pac.mouth += pac.mouthSpeed;
        if (pac.mouth > 0.35 || pac.mouth < 0.05) pac.mouthSpeed = -pac.mouthSpeed;

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(pac.x, pac.y, pac.r, pac.mouth * Math.PI, (2 - pac.mouth) * Math.PI);
        ctx.lineTo(pac.x, pac.y);
        ctx.fill();

        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.arc(pac.x - 4, pac.y - 10, 3, 0, Math.PI * 2);
        ctx.fill();

      } else if (currentGame === 'CUBIC') {
        cubicPyramid.forEach(p => {
          ctx.fillStyle = p.stepped ? '#f59e0b' : '#3b82f6';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y - 12);
          ctx.lineTo(p.x + 20, p.y);
          ctx.lineTo(p.x, p.y + 12);
          ctx.lineTo(p.x - 20, p.y);
          ctx.closePath();
          ctx.fill();
        });

        const cur = cubicPyramid.find(p => p.row === cubicPlayer.row && p.col === cubicPlayer.col);
        if (cur) {
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(cur.x, cur.y - 6, 9, 0, Math.PI * 2);
          ctx.fill();
        }

      } else if (currentGame === 'FROGGER') {
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(0, 60, canvas.width, 140);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 200, canvas.width, 140);

        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = '#059669';
          ctx.beginPath();
          ctx.arc(40 + i * 70, 40, 16, 0, Math.PI * 2);
          ctx.fill();
        }

        obstacles.forEach(obs => {
          obs.x += obs.speed;
          if (obs.speed > 0 && obs.x > canvas.width) obs.x = -obs.w;
          if (obs.speed < 0 && obs.x < -obs.w) obs.x = canvas.width;
          ctx.fillStyle = obs.color;
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

          if (
            frog.x < obs.x + obs.w &&
            frog.x + frog.w > obs.x &&
            frog.y < obs.y + obs.h &&
            frog.y + frog.h > obs.y &&
            obs.y > 180
          ) {
            initFrogger();
          }
        });

        ctx.fillStyle = '#4ade80';
        ctx.fillRect(frog.x, frog.y, frog.w, frog.h);

      } else if (currentGame === 'DK') {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(20, 120); ctx.lineTo(340, 120);
        ctx.moveTo(20, 200); ctx.lineTo(340, 200);
        ctx.moveTo(20, 280); ctx.lineTo(340, 280);
        ctx.moveTo(20, 350); ctx.lineTo(340, 350);
        ctx.stroke();

        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(60, 120); ctx.lineTo(60, 200);
        ctx.moveTo(300, 200); ctx.lineTo(300, 280);
        ctx.moveTo(300, 280); ctx.lineTo(300, 350);
        ctx.stroke();

        ctx.fillStyle = '#78350f';
        ctx.fillRect(35, 70, 40, 45);
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(240, 80, 18, 35);

        barrels.forEach(b => {
          b.x += b.dx;
          if (b.x > 330 || b.x < 30) b.dx = -b.dx;
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();

          if (Math.hypot(dkPlayer.x + 10 - b.x, dkPlayer.y + 15 - b.y) < b.r + 10) {
            initDK();
          }
        });

        dkPlayer.y += dkPlayer.dy;
        if (dkPlayer.y < 320) {
          dkPlayer.dy += 0.4;
        } else {
          dkPlayer.y = 320;
          dkPlayer.dy = 0;
          dkPlayer.isGrounded = true;
        }

        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(dkPlayer.x, dkPlayer.y, dkPlayer.w, dkPlayer.h);
      }

      requestAnimationFrame(update);
    }

    switchGame('PACMAN');
    requestAnimationFrame(update);
  </script>
</body>
</html>
