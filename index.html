<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Packed in the Marrow: The Legacy Chronicles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0d070b;
      color: #f7eed8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 12px 10px 6px;
    }
    h1 {
      font-size: 1.5rem;
      color: #dfb15b;
      text-shadow: 0 0 10px rgba(223, 177, 91, 0.4);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #d1b89d;
      margin-top: 2px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 880px;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.85), 0 0 0 2px #4a2818;
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    /* Touch UI Controls */
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 880px;
      justify-content: space-between;
      padding: 8px 16px 14px;
      touch-action: none;
    }
    .dpad, .action-pad {
      display: flex;
      gap: 10px;
    }
    .touch-btn {
      background: rgba(223, 177, 91, 0.2);
      border: 2px solid #dfb15b;
      color: #dfb15b;
      border-radius: 50%;
      width: 58px;
      height: 58px;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      active:scale(0.95);
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(223, 177, 91, 0.6);
      color: #2b120a;
    }
    .char-tray {
      width: 100%;
      max-width: 880px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .char-card {
      background: #1f1118;
      border: 1px solid #4a2818;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: #c9b39a;
      cursor: pointer;
      transition: all 0.2s;
    }
    .char-card.selected {
      border-color: #dfb15b;
      background: #3b1d1e;
      color: #ffdf85;
      box-shadow: 0 0 8px rgba(223, 177, 91, 0.35);
    }
    .instructions {
      max-width: 880px;
      font-size: 0.8rem;
      color: #9d8778;
      text-align: center;
      line-height: 1.4;
      padding: 0 12px 20px;
    }
    @media (hover: none) and (pointer: coarse) {
      #touch-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Packed in the Marrow</h1>
    <div class="subtitle">From Father to Son • Ancestral Vanguard</div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
  </div>

  <div class="char-tray" id="rosterTray"></div>

  <div id="touch-controls">
    <div class="dpad">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="action-pad">
      <button class="touch-btn" id="btn-swap" title="Switch Character">🔄</button>
      <button class="touch-btn" id="btn-atk" title="Ancestral Strike">⚔️</button>
      <button class="touch-btn" id="btn-jump" title="Jump">▲</button>
    </div>
  </div>

  <div class="instructions">
    <strong>Keyboard Controls:</strong> [A/D] or [◀/▶] Move | [W/Space/▲] Jump | [J/Z] Ancestral Strike | [U/C] Switch Hero | [K/X] Legacy Surge<br>
    Progress through <strong>The Sovereign Groves</strong> and defend <strong>Aunt Zelma's Grand Hotel</strong>!
  </div>

  <script>
    // --- Audio Synthesis (No external files required) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }
    function playSfx(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(380, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'strike') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'special') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    // --- Lineage Roster Definition ---
    const HEROES = [
      { id: 'tommy', name: 'Tommy Philip', title: 'The Bearer', color: '#dfb15b', suit: '#262d3a', ability: 'Marrow Pulse', speed: 4.8, jump: 12.5, attackPower: 26 },
      { id: 'tp', name: 'T.P. Mitchell', title: 'The Harmonizer', color: '#4da6ff', suit: '#1c1c24', ability: 'Resonant Brass Note', speed: 4.5, jump: 12, attackPower: 30 },
      { id: 'fanny', name: 'Fanny May', title: 'Matriarch Grace', color: '#ff77aa', suit: '#472230', ability: 'Shield of Kinship', speed: 5.2, jump: 13.2, attackPower: 22 },
      { id: 'bear', name: 'Uncle Bear', title: 'The Pillar', color: '#c76b32', suit: '#2a1a14', ability: 'Heavy Earth Crush', speed: 3.8, jump: 11.5, attackPower: 45 },
      { id: 'aaron', name: 'Uncle Aaron', title: 'The Swift Vanguard', color: '#5cd68a', suit: '#1b2e22', ability: 'Gale Wind Strike', speed: 6.0, jump: 13.5, attackPower: 24 },
      { id: 'james', name: 'Uncle James', title: 'The Sentinel', color: '#e0c355', suit: '#292518', ability: 'Precision Wisdom Bolt', speed: 4.6, jump: 12, attackPower: 32 }
    ];

    let currentHeroIndex = 0;

    // --- Canvas & Core Loop Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const V_WIDTH = 960;
    const V_HEIGHT = 540;

    const keys = { left: false, right: false, up: false, attack: false, special: false };

    // --- Stage Configuration ---
    let currentStage = 1; // 1: Sovereign Groves, 2: Aunt Zelma's Grand Hotel
    let cameraX = 0;
    let score = 0;
    let marrowEssence = 0;

    // --- Entities & Physics ---
    const player = {
      x: 100,
      y: 380,
      w: 36,
      h: 64,
      vx: 0,
      vy: 0,
      isGrounded: false,
      facing: 1,
      attackCooldown: 0,
      specialMeter: 100,
      health: 100,
      invulnerable: 0
    };

    let projectiles = [];
    let particles = [];
    let enemies = [];
    let relics = [];

    function initStage(stageNum) {
      currentStage = stageNum;
      player.x = 100;
      player.y = 380;
      player.vx = 0;
      player.vy = 0;
      cameraX = 0;
      projectiles = [];
      particles = [];
      enemies = [];
      relics = [];

      // Populate stage-specific enemies & relics
      for (let i = 0; i < 14; i++) {
        enemies.push({
          x: 500 + i * 280 + Math.random() * 80,
          y: 400,
          w: 38,
          h: 56,
          vx: (Math.random() > 0.5 ? 1 : -1) * 1.5,
          hp: stageNum === 1 ? 40 : 65,
          maxHp: stageNum === 1 ? 40 : 65,
          color: stageNum === 1 ? '#632b30' : '#452b4f'
        });
      }

      for (let i = 0; i < 16; i++) {
        relics.push({
          x: 350 + i * 240,
          y: 300 - (i % 3) * 45,
          w: 18,
          h: 18,
          collected: false
        });
      }
    }

    // --- Roster UI Render ---
    const rosterTray = document.getElementById('rosterTray');
    HEROES.forEach((h, idx) => {
      const card = document.createElement('div');
      card.className = `char-card ${idx === 0 ? 'selected' : ''}`;
      card.id = `char-btn-${idx}`;
      card.innerHTML = `<strong>${h.name}</strong><br><span style="color:#dfb15b">${h.title}</span>`;
      card.onclick = () => selectHero(idx);
      rosterTray.appendChild(card);
    });

    function selectHero(index) {
      currentHeroIndex = index;
      document.querySelectorAll('.char-card').forEach((c, i) => {
        c.classList.toggle('selected', i === index);
      });
      playSfx('special');
      spawnSparks(player.x + 18, player.y + 32, HEROES[currentHeroIndex].color, 15);
    }

    function swapHeroNext() {
      selectHero((currentHeroIndex + 1) % HEROES.length);
    }

    // --- Particle FX ---
    function spawnSparks(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 25,
          color: color
        });
      }
    }

    // --- Actions & Attacks ---
    function performAttack() {
      if (player.attackCooldown > 0) return;
      initAudio();
      const hero = HEROES[currentHeroIndex];
      player.attackCooldown = 18;
      playSfx('strike');

      // Projectile attack (Musical wave, Wisdom bolt, or Marrow Beam)
      projectiles.push({
        x: player.facing === 1 ? player.x + player.w + 4 : player.x - 16,
        y: player.y + 24,
        vx: player.facing * (hero.id === 'tp' || hero.id === 'james' ? 9 : 7),
        vy: 0,
        radius: hero.id === 'bear' ? 14 : 9,
        damage: hero.attackPower,
        heroId: hero.id,
        color: hero.color,
        life: 55
      });
    }

    // --- Environmental Backdrops ---
    function drawBackground() {
      if (currentStage === 1) {
        // Stage 1: The Sovereign Groves / Mississippi Roots
        const grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
        grad.addColorStop(0, '#1c0c16');
        grad.addColorStop(0.6, '#3a1b24');
        grad.addColorStop(1, '#1a0e10');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Golden Tree Silhouettes / DNA motif
        ctx.save();
        ctx.fillStyle = 'rgba(223, 177, 91, 0.12)';
        for (let i = 0; i < 6; i++) {
          const treeX = i * 400 - (cameraX * 0.3) % 400;
          ctx.beginPath();
          ctx.arc(treeX + 100, 260, 90, 0, Math.PI * 2);
          ctx.rect(treeX + 90, 260, 20, 180);
          ctx.fill();
        }
        ctx.restore();
      } else {
        // Stage 2: Aunt Zelma's Grand Hotel
        const grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
        grad.addColorStop(0, '#18121f');
        grad.addColorStop(0.6, '#2a1a2b');
        grad.addColorStop(1, '#120b17');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Hotel Architecture Facade (Brickwork, Arched windows, Neon/Gold Signage)
        ctx.save();
        const bldgOffset = -(cameraX * 0.35) % 480;
        for (let i = -1; i < 4; i++) {
          const bx = i * 480 + bldgOffset;
          ctx.fillStyle = '#201524';
          ctx.fillRect(bx, 100, 440, 340);

          // Arched windows
          ctx.fillStyle = 'rgba(255, 223, 133, 0.25)';
          for (let row = 0; row < 2; row++) {
            for (let col = 0; col < 4; col++) {
              ctx.fillRect(bx + 40 + col * 100, 160 + row * 80, 50, 60);
            }
          }
        }

        // Grand Hotel Sign
        const signX = 500 - (cameraX * 0.4);
        ctx.fillStyle = 'rgba(223, 177, 91, 0.85)';
        ctx.font = 'bold 22px Georgia, serif';
        ctx.fillText("AUNT ZELMA'S HOTEL", signX, 90);
        ctx.restore();
      }

      // Ground Floor
      ctx.fillStyle = currentStage === 1 ? '#2b1419' : '#1d141e';
      ctx.fillRect(0, 440, V_WIDTH, 100);
      ctx.fillStyle = '#dfb15b';
      ctx.fillRect(0, 440, V_WIDTH, 4);
    }

    // --- Main Game Loop ---
    function update() {
      const hero = HEROES[currentHeroIndex];

      // Horizontal Movement
      if (keys.left) {
        player.vx = -hero.speed;
        player.facing = -1;
      } else if (keys.right) {
        player.vx = hero.speed;
        player.facing = 1;
      } else {
        player.vx *= 0.8;
      }

      // Jump
      if (keys.up && player.isGrounded) {
        player.vy = -hero.jump;
        player.isGrounded = false;
        initAudio();
        playSfx('jump');
      }

      // Attack
      if (keys.attack) {
        performAttack();
      }

      // Apply Gravity
      player.vy += 0.58;
      player.x += player.vx;
      player.y += player.vy;

      // Ground Collision
      if (player.y + player.h >= 440) {
        player.y = 440 - player.h;
        player.vy = 0;
        player.isGrounded = true;
      }

      if (player.attackCooldown > 0) player.attackCooldown--;
      if (player.invulnerable > 0) player.invulnerable--;

      // Camera Follow
      cameraX = player.x - 240;
      if (cameraX < 0) cameraX = 0;

      // Stage Progression Check
      if (player.x > 4200 && currentStage === 1) {
        initStage(2);
      }

      // Update Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.life--;

        // Check collision with enemies
        for (let e of enemies) {
          if (e.hp > 0 && Math.hypot(p.x - (e.x + e.w / 2), p.y - (e.y + e.h / 2)) < p.radius + 24) {
            e.hp -= p.damage;
            p.life = 0;
            spawnSparks(p.x, p.y, p.color, 6);
            if (e.hp <= 0) {
              score += 150;
              spawnSparks(e.x + e.w / 2, e.y + e.h / 2, '#dfb15b', 18);
            }
            break;
          }
        }
        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // Update Enemies
      for (let e of enemies) {
        if (e.hp <= 0) continue;
        e.x += e.vx;
        if (Math.abs(e.x - player.x) < 480) {
          e.vx = e.x > player.x ? -1.2 : 1.2;
        }

        // Touch damage
        if (player.invulnerable <= 0 &&
            Math.abs((player.x + player.w / 2) - (e.x + e.w / 2)) < 30 &&
            Math.abs((player.y + player.h / 2) - (e.y + e.h / 2)) < 40) {
          player.health = Math.max(0, player.health - 12);
          player.invulnerable = 40;
          player.vy = -5;
          spawnSparks(player.x + 18, player.y + 32, '#ff3344', 10);
        }
      }

      // Collect Relics (Marrow Essence)
      for (let r of relics) {
        if (!r.collected &&
            Math.hypot((player.x + player.w / 2) - r.x, (player.y + player.h / 2) - r.y) < 32) {
          r.collected = true;
          marrowEssence++;
          score += 100;
          playSfx('coin');
          spawnSparks(r.x, r.y, '#dfb15b', 8);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      drawBackground();

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Draw Relics (Golden DNA / Tree Emblems)
      for (let r of relics) {
        if (r.collected) continue;
        ctx.fillStyle = '#dfb15b';
        ctx.shadowColor = '#dfb15b';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(r.x, r.y + Math.sin(Date.now() * 0.005 + r.x) * 4, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Draw Enemies
      for (let e of enemies) {
        if (e.hp <= 0) continue;
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.w, e.h);

        // HP bar
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x, e.y - 12, e.w, 5);
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(e.x, e.y - 12, (e.hp / e.maxHp) * e.w, 5);
      }

      // Draw Projectiles
      for (let p of projectiles) {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Draw Player Character
      const hero = HEROES[currentHeroIndex];
      if (player.invulnerable % 4 < 2) {
        // Suit body
        ctx.fillStyle = hero.suit;
        ctx.fillRect(player.x, player.y + 16, player.w, player.h - 16);

        // Head / Tone
        ctx.fillStyle = '#6e472a';
        ctx.fillRect(player.x + 8, player.y, 20, 20);

        // Tie / Accent
        ctx.fillStyle = hero.color;
        ctx.fillRect(player.x + 16, player.y + 20, 5, 22);

        // Aura
        ctx.strokeStyle = hero.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(player.x - 2, player.y - 2, player.w + 4, player.h + 4);
      }

      // Draw Particles
      for (let pt of particles) {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      }

      ctx.restore();

      // --- Heads Up Display (HUD) ---
      // Top Bar / Status
      ctx.fillStyle = 'rgba(20, 10, 15, 0.85)';
      ctx.fillRect(16, 14, 380, 68);
      ctx.strokeStyle = '#dfb15b';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(16, 14, 380, 68);

      // Hero Name & Ability
      ctx.fillStyle = hero.color;
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`${hero.name} (${hero.title})`, 28, 36);

      // Health Bar
      ctx.fillStyle = '#3a1e22';
      ctx.fillRect(28, 46, 160, 10);
      ctx.fillStyle = '#4cd964';
      ctx.fillRect(28, 46, (player.health / 100) * 160, 10);

      // Stage & Score Tracker
      ctx.fillStyle = '#f7eed8';
      ctx.font = '13px sans-serif';
      ctx.fillText(`Marrow Relics: ${marrowEssence}`, 210, 55);
      ctx.fillText(`Score: ${score}`, 210, 70);

      ctx.fillStyle = '#dfb15b';
      ctx.font = 'bold 13px sans-serif';
      const stageName = currentStage === 1 ? 'Stage 1: Sovereign Groves' : "Stage 2: Aunt Zelma's Grand Hotel";
      ctx.fillText(stageName, V_WIDTH - 260, 36);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // --- Inputs & Event Listeners ---
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
      if (e.code === 'KeyJ' || e.code === 'KeyZ') keys.attack = true;
      if (e.code === 'KeyU' || e.code === 'KeyC') swapHeroNext();
      if (['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)) {
        selectHero(parseInt(e.key) - 1);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
      if (e.code === 'KeyJ' || e.code === 'KeyZ') keys.attack = false;
    });

    // Mobile / Touch Bindings
    function bindTouch(id, onDown, onUp) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); onDown(); el.classList.add('active'); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); el.classList.remove('active'); });
    }

    bindTouch('btn-left', () => keys.left = true, () => keys.left = false);
    bindTouch('btn-right', () => keys.right = true, () => keys.right = false);
    bindTouch('btn-jump', () => keys.up = true, () => keys.up = false);
    bindTouch('btn-atk', () => { keys.attack = true; setTimeout(() => keys.attack = false, 120); }, () => keys.attack = false);
    bindTouch('btn-swap', () => swapHeroNext(), () => {});

    // Start Stage
    initStage(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
