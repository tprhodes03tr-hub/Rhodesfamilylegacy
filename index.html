<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rhodes Family Legacy - Arcade & Media Hub</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    background-color: #060b13;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 50px;
    overflow-x: hidden;
  }
  .wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 10px 8px;
  }

  /* --- BOOK ROW --- */
  .books-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .book-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .cover-box {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 4px;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .cover-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .book-card h4 {
    font-size: 10px;
    margin: 6px 0 4px;
    color: #cbd5e1;
    line-height: 1.1;
    min-height: 22px;
  }
  .btn-buy {
    width: 100%;
    background: #ea580c;
    color: #fff;
    border: none;
    padding: 6px 0;
    font-size: 10px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* --- GAME SELECTOR TAB --- */
  .hub-tab-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: #0b1329;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }
  .tab-btn {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 8px 2px;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background: #0284c7;
    color: #fff;
    border-color: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
  }

  /* --- SCREEN & HUD --- */
  .screen-card {
    background: #0b1329;
    border: 2px solid #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }
  .hud-header {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: bold;
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
  }
  .hud-header span { color: #38bdf8; }
  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .section-label {
    text-align: center;
    font-size: 12px;
    color: #f59e0b;
    font-weight: bold;
    padding: 8px 4px 4px;
    letter-spacing: 0.5px;
  }

  /* --- VANGUARD CONTROLS --- */
  .champions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .champ-btn {
    background: #111e38;
    border: 1px solid #1e293b;
    color: #cbd5e1;
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .champ-btn.active {
    border-color: #38bdf8;
    background: #0369a1;
    color: #fff;
  }
  .champ-btn small { font-size: 9px; color: #94a3b8; margin-top: 2px; }
  .champ-btn.active small { color: #e0f2fe; }

  .action-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #1e293b;
  }
  .act-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 12px 0;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .act-btn:active { background: #38bdf8; color: #000; }
  .act-btn.burst { background: #dc2626; border-color: #ef4444; color: #fff; }

  /* --- NAVAL CONTROLS --- */
  .naval-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #1e293b;
  }
  .naval-btn {
    background: #1e293b;
    border: 1px solid #38bdf8;
    color: #38bdf8;
    padding: 10px 2px;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .naval-btn small { font-size: 8px; color: #94a3b8; }
  .naval-btn.warning { border-color: #f59e0b; color: #fbbf24; }
  .naval-btn.danger { border-color: #ef4444; color: #f87171; }

    background: #0b1329;

    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;

  video {

    border-radius: 6px;
    background: #000;

  .btn-download {
    background: #10b981;
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;

  .playlist-btn {

    border: 1px solid #1e293b;
    color: #93c5fd;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
  }
  .playlist-btn.active { border-color: #38bdf8; background: #1e293b; color: #fff; }
</style>

<script>
// --- AUDIO ENGINE ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
  },
  playTone(freq, type='sine', decay=0.15) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + decay);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + decay);
    } catch(e) {}
  }
};

// --- GAME ROUTER ---
let currentGame = 'VANGUARD';
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let score = 0;

function switchGame(gameKey) {
  AudioEngine.init();
  currentGame = gameKey;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('vanguard-controls').style.display = 'none';
  document.getElementById('battleship-controls').style.display = 'none';
  document.getElementById('isaac-controls').style.display = 'none';

  if (gameKey === 'VANGUARD') {
    document.getElementById('tab-vanguard').classList.add('active');
    document.getElementById('vanguard-controls').style.display = 'block';
  } else if (gameKey === 'BATTLESHIP') {
    document.getElementById('tab-battleship').classList.add('active');
    document.getElementById('battleship-controls').style.display = 'block';
  } else if (gameKey === 'ISAAC') {
    document.getElementById('tab-isaac').classList.add('active');
    document.getElementById('isaac-controls').style.display = 'block';
  }
  updateStats();
}

function updateStats() {
  document.getElementById('stat-score').innerText = score;
  if (currentGame === 'VANGUARD') {
    document.getElementById('stat-life').innerText = Math.max(0, boss.hp) + '% (BOSS)';
    document.getElementById('stat-wave').innerText = '8/8';
  } else if (currentGame === 'BATTLESHIP') {
    document.getElementById('stat-life').innerText = Math.max(0, bShip.hp) + '%';
    document.getElementById('stat-wave').innerText = bWave;
  } else if (currentGame === 'ISAAC') {
    document.getElementById('stat-life').innerText = `${Math.floor(isaacSpeed * 10)} MPH`;
    document.getElementById('stat-wave').innerText = 'SONIC ZONE';
  }
}

// =======================================================
// 1. ANCESTRAL VANGUARD (HUMANOID SPRITES & TWIN SPIRITS)
// =======================================================
let vHero = { x: 70, y: 215, vx: 0, vy: 0, animTick: 0, facing: 1, onGround: true };
let boss = { x: 370, y: 180, hp: 100, maxHp: 100, attackTick: 0 };
let vProjectiles = [];

function selectChamp(c) {
  AudioEngine.init();
  AudioEngine.playTone(520, 'triangle', 0.2);
  document.querySelectorAll('.champ-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function updateVanguard() {
  vHero.x += vHero.vx;
  vHero.y += vHero.vy;
  if (vHero.vx !== 0) vHero.animTick += 0.2;

  if (vHero.y < 215) vHero.vy += 0.45;
  else { vHero.y = 215; vHero.vy = 0; vHero.onGround = true; }

  vHero.x = Math.max(25, Math.min(430, vHero.x));

  // Boss movement & attacks
  boss.attackTick++;
  if (boss.attackTick % 120 === 0) {
    vProjectiles.push({ x: boss.x - 10, y: boss.y + 15, vx: -4, vy: 0, isEnemy: true });
  }

  // Projectile handling
  vProjectiles.forEach((p, i) => {
    p.x += p.vx;
    if (!p.isEnemy && p.x > boss.x && p.x < boss.x + 35 && p.y > boss.y && p.y < boss.y + 60) {
      boss.hp -= 4;
      score += 100;
      vProjectiles.splice(i, 1);
      AudioEngine.playTone(180, 'square', 0.15);
      if (boss.hp <= 0) boss.hp = 100;
    } else if (p.isEnemy && p.x > vHero.x - 10 && p.x < vHero.x + 15 && p.y > vHero.y - 30 && p.y < vHero.y + 10) {
      vProjectiles.splice(i, 1);
      AudioEngine.playTone(100, 'sawtooth', 0.2);
    }
  });

  updateStats();
}

function drawVanguard() {
  // Ancient Levant Hall Background
  ctx.fillStyle = '#060a17';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 25; i < canvas.width; i += 60) {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(i, 20, 30, 230);
    ctx.strokeStyle = '#1e293b';
    ctx.strokeRect(i, 20, 30, 230);
  }
  ctx.fillStyle = '#78350f';
  ctx.fillRect(0, 248, canvas.width, 52);

  // --- DRAW HUMANOID HERO (Authentic Segmented Silhouette) ---
  const legOffset = Math.sin(vHero.animTick) * 4;
  ctx.save();
  ctx.translate(vHero.x, vHero.y);

  // Twin Inez & Tweet Floating Wisps
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(-8, -42 + Math.sin(Date.now() * 0.005) * 4, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f472b6';
  ctx.beginPath();
  ctx.arc(12, -44 + Math.cos(Date.now() * 0.005) * 4, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // Head & Hair
  ctx.fillStyle = '#8d5b4c'; // Skin tone
  ctx.beginPath();
  ctx.arc(0, -28, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1e1b4b'; // Hair
  ctx.beginPath();
  ctx.arc(0, -31, 6.5, Math.PI, Math.PI * 2);
  ctx.fill();

  // Tunic / Armor Body
  ctx.fillStyle = '#e11d48';
  ctx.fillRect(-5, -22, 10, 14);
  // Gold Belt
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(-6, -9, 12, 3);

  // Legs & Boots
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-5, -6, 4, 10 + legOffset);
  ctx.fillRect(1, -6, 4, 10 - legOffset);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-6, 2 + legOffset, 5, 4);
  ctx.fillRect(0, 2 - legOffset, 5, 4);

  // Bow & Arrow Arms
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(7, -16, 10, -Math.PI / 2, Math.PI / 2);
  ctx.stroke();

  ctx.restore();

  // --- DRAW HUMANOID WARLORD BOSS ---
  ctx.save();
  ctx.translate(boss.x, boss.y);
  // Cape
  ctx.fillStyle = '#991b1b';
  ctx.beginPath();
  ctx.moveTo(10, 10);
  ctx.lineTo(28, 45);
  ctx.lineTo(-4, 45);
  ctx.fill();
  // Armor Body
  ctx.fillStyle = '#334155';
  ctx.fillRect(4, 10, 16, 24);
  // Head & Bronze Helmet
  ctx.fillStyle = '#b45309';
  ctx.fillRect(6, -2, 12, 12);
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(10, -8, 4, 6); // Helmet Crest
  // Broadsword
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-2, 0);
  ctx.lineTo(-2, 38);
  ctx.stroke();
  ctx.restore();

  // Projectiles
  vProjectiles.forEach(p => {
    ctx.fillStyle = p.isEnemy ? '#ef4444' : '#38bdf8';
    ctx.fillRect(p.x, p.y, 8, 3);
  });
}

// =======================================================
// 2. BATTLESHIP: AUTHENTIC WARSHIPS, JET BOMBER & INTENSE ATTACKS
// =======================================================
const WATER_LINE = 190;
let bWave = 1;
let bShip = { x: 30, y: WATER_LINE - 24, w: 96, h: 26, hp: 100 };
let bShells = [];
let bTorpedoes = [];
let bCIWS = [];
let bEnemies = [];
let bMissiles = [];
let bJetBomber = null;
let bBombs = [];
let bFlakSparks = [];
let airCooldown = 0;
let lastSpawn = 0;

function fireNavalCannon(targetX = 360, targetY = WATER_LINE) {
  AudioEngine.playTone(100, 'square', 0.25);
  const mx = bShip.x + bShip.w - 10;
  const my = bShip.y + 6;
  const dx = targetX - mx;
  const dy = targetY - my;
  const dist = Math.hypot(dx, dy);
  bShells.push({ x: mx, y: my, vx: (dx/dist)*11, vy: (dy/dist)*11 - 2, grav: 0.14 });
}

function fireNavalTorpedo() {
  AudioEngine.playTone(240, 'sine', 0.2);
  bTorpedoes.push({ x: bShip.x + bShip.w, y: WATER_LINE + 14, vx: 4, w: 18, h: 5 });
}

function fireNavalCIWS() {
  AudioEngine.playTone(750, 'sawtooth', 0.05);
  const gx = bShip.x + 35;
  const gy = bShip.y - 2;
  let target = bMissiles[0];
  let angle = target ? Math.atan2(target.y - gy, target.x - gx) : -Math.PI / 4;
  for (let i = -1; i <= 1; i++) {
    bCIWS.push({ x: gx, y: gy, vx: Math.cos(angle + i*0.12)*15, vy: Math.sin(angle + i*0.12)*15, life: 25 });
  }
}

function callNavalAirStrike() {
  if (airCooldown > 0) return;
  airCooldown = 380;
  AudioEngine.playTone(150, 'sawtooth', 0.6);
  // Full visible supersonic fighter jet sweeping low
  bJetBomber = { x: -80, y: 45, vx: 9, bombsRemaining: 6 };
}

function updateBattleship() {
  const now = Date.now();

  // INTENSE ENEMY SPAWNS: Ships, subs, and torpedo boats attack continuously
  if (now - lastSpawn > 1800 && bEnemies.length < 6) {
    lastSpawn = now;
    const isSub = Math.random() > 0.6;
    bEnemies.push({
      type: isSub ? 'sub' : 'cruiser',
      x: canvas.width + 30,
      y: isSub ? WATER_LINE + 18 + Math.random() * 25 : WATER_LINE - 22,
      w: isSub ? 46 : 60,
      h: isSub ? 16 : 22,
      hp: isSub ? 4 : 6,
      speed: 0.9 + Math.random()*0.4,
      lastShot: now
    });
  }

  if (airCooldown > 0) {
    airCooldown--;
    document.getElementById('air-status').innerText = airCooldown > 0 ? `${Math.ceil(airCooldown/60)}s` : 'READY';
  }

  // Shells
  bShells.forEach((s, idx) => {
    s.x += s.vx; s.y += s.vy; s.vy += s.grav;
    bEnemies.forEach((e, eIdx) => {
      if (s.x >= e.x && s.x <= e.x + e.w && s.y >= e.y && s.y <= e.y + e.h + 10) {
        e.hp -= 3;
        bShells.splice(idx, 1);
        if (e.hp <= 0) { bEnemies.splice(eIdx, 1); score += 150; }
      }
    });
    if (s.y > WATER_LINE + 10) bShells.splice(idx, 1);
  });

  // Torpedoes: Striking enemy ship hulls & submerged subs directly
  bTorpedoes.forEach((t, idx) => {
    t.x += t.vx;
    bEnemies.forEach((e, eIdx) => {
      const hitX = (t.x + t.w >= e.x && t.x <= e.x + e.w);
      const hitY = (e.type === 'sub') ? (t.y >= e.y - 8 && t.y <= e.y + e.h + 8) : (t.y >= WATER_LINE - 5 && t.y <= WATER_LINE + 30);
      if (hitX && hitY) {
        e.hp -= 6;
        bTorpedoes.splice(idx, 1);
        AudioEngine.playTone(80, 'square', 0.2);
        if (e.hp <= 0) { bEnemies.splice(eIdx, 1); score += 200; }
      }
    });
    if (t.x > canvas.width + 40) bTorpedoes.splice(idx, 1);
  });

  // CIWS Gatling Anti-Missile Fire
  bCIWS.forEach((c, idx) => {
    c.x += c.vx; c.y += c.vy; c.life--;
    bMissiles.forEach((m, mIdx) => {
      if (Math.hypot(c.x - m.x, c.y - m.y) < 18) {
        bMissiles.splice(mIdx, 1);
        bCIWS.splice(idx, 1);
        score += 50;
      }
    });
    if (c.life <= 0) bCIWS.splice(idx, 1);
  });

  // Visible Fighter Jet Bomber Loop
  if (bJetBomber) {
    bJetBomber.x += bJetBomber.vx;
    if (bJetBomber.x > 140 && bJetBomber.bombsRemaining > 0 && Math.random() > 0.45) {
      bJetBomber.bombsRemaining--;
      bBombs.push({ x: bJetBomber.x, y: bJetBomber.y + 12, vx: 3, vy: 2 });
    }
    if (bJetBomber.x > canvas.width + 100) bJetBomber = null;
  }

  // Jet Bombs
  bBombs.forEach((b, idx) => {
    b.x += b.vx; b.y += b.vy; b.vy += 0.22;
    bEnemies.forEach((e, eIdx) => {
      if (b.x >= e.x && b.x <= e.x + e.w && b.y >= e.y && b.y <= e.y + e.h + 15) {
        e.hp -= 5; bBombs.splice(idx, 1);
        if (e.hp <= 0) { bEnemies.splice(eIdx, 1); score += 180; }
      }
    });
    if (b.y >= WATER_LINE) bBombs.splice(idx, 1);
  });

  // Enemy movement & continuous cruise missile barrages
  bEnemies.forEach(e => {
    e.x -= e.speed;
    if (e.type === 'cruiser' && now - e.lastShot > 2800) {
      e.lastShot = now;
      bMissiles.push({ x: e.x, y: e.y, vx: -3.4, vy: -2.2, grav: 0.05 });
    }
  });

  bMissiles.forEach((m, idx) => {
    m.x += m.vx; m.y += m.vy; m.vy += m.grav;
    if (m.x >= bShip.x && m.x <= bShip.x + bShip.w && m.y >= bShip.y) {
      bShip.hp -= 12;
      bMissiles.splice(idx, 1);
      if (bShip.hp <= 0) bShip.hp = 100;
    }
    if (m.y > WATER_LINE + 10 || m.x < 0) bMissiles.splice(idx, 1);
  });

  updateStats();
}

function drawBattleship() {
  // Deep Sea & Sunset Horizon
  const sky = ctx.createLinearGradient(0, 0, 0, WATER_LINE);
  sky.addColorStop(0, '#020617');
  sky.addColorStop(1, '#1e293b');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, WATER_LINE);

  const sea = ctx.createLinearGradient(0, WATER_LINE, 0, canvas.height);
  sea.addColorStop(0, '#0284c7');
  sea.addColorStop(1, '#082f49');
  ctx.fillStyle = sea;
  ctx.fillRect(0, WATER_LINE, canvas.width, canvas.height - WATER_LINE);

  // --- DRAW DETAILED PLAYER BATTLESHIP ---
  ctx.save();
  ctx.translate(bShip.x, bShip.y);
  // Raked Bow & Gray Camouflage Hull
  ctx.fillStyle = '#475569';
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.lineTo(12, bShip.h);
  ctx.lineTo(bShip.w - 14, bShip.h);
  ctx.lineTo(bShip.w, 4);
  ctx.lineTo(bShip.w - 8, 4);
  ctx.closePath();
  ctx.fill();
  // Armor Belt Line
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.stroke();

  // Superstructure Bridge & Mast
  ctx.fillStyle = '#64748b';
  ctx.fillRect(24, -14, 34, 16);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(32, -24, 16, 10);
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(40, -24); ctx.lineTo(40, -34); ctx.stroke(); // Radar Mast

  // Dual Main Artillery Guns (Fore and Aft)
  ctx.fillStyle = '#334155';
  ctx.fillRect(bShip.w - 24, 0, 14, 8);
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bShip.w - 12, 3); ctx.lineTo(bShip.w + 14, -2); ctx.stroke();

  // CIWS Phalanx Dome
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(18, 2, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Waterline Wake
  ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bShip.x - 10, WATER_LINE + 2); ctx.lineTo(bShip.x + bShip.w + 15, WATER_LINE + 2); ctx.stroke();

  // --- DRAW VISIBLE SUPERSONIC JET BOMBER ---
  if (bJetBomber) {
    ctx.save();
    ctx.translate(bJetBomber.x, bJetBomber.y);
    // Delta Wing Jet Silhouette
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.moveTo(35, 0);      // Needle nose
    ctx.lineTo(0, -14);     // Wingtip left
    ctx.lineTo(8, 0);       // Fuselage
    ctx.lineTo(0, 14);      // Wingtip right
    ctx.closePath();
    ctx.fill();
    // Jet Afterburner Glow
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(-6, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.arc(-10, 0, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // --- DRAW ENEMY WARSHIPS & SUBS ---
  bEnemies.forEach(e => {
    if (e.type === 'sub') {
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      // Conning tower & Periscope
      ctx.fillRect(e.x + e.w/2 - 4, e.y - 6, 8, 8);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x + e.w/2, e.y - 6); ctx.lineTo(e.x + e.w/2, e.y - 12); ctx.stroke();
    } else {
      // Enemy Cruiser
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.moveTo(e.x + e.w, e.y + 4);
      ctx.lineTo(e.x + e.w - 10, e.y + e.h);
      ctx.lineTo(e.x + 8, e.y + e.h);
      ctx.lineTo(e.x, e.y + 4);
      ctx.closePath();
      ctx.fill();
      // Enemy Turret
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(e.x + 10, e.y - 6, 16, 8);
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(e.x + 10, e.y - 2); ctx.lineTo(e.x - 8, e.y - 6); ctx.stroke();
    }
  });

  // Cruise Missiles with smoke
  bMissiles.forEach(m => {
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(m.x, m.y, 10, 3);
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(m.x + 10, m.y, 4, 3);
  });

  // Torpedoes + Visible Bubbles
  bTorpedoes.forEach(t => {
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.fillStyle = '#e0f2fe';
    ctx.fillRect(t.x - 6, t.y + 1, 3, 3);
    ctx.fillRect(t.x - 12, t.y + 2, 2, 2);
  });

  // CIWS Tracers
  ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2;
  bCIWS.forEach(c => {
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - c.vx*0.6, c.y - c.vy*0.6); ctx.stroke();
  });

  // Bombs & Cannon Shells
  ctx.fillStyle = '#f97316';
  bBombs.forEach(b => ctx.fillRect(b.x, b.y, 5, 5));
  ctx.fillStyle = '#fbbf24';
  bShells.forEach(s => ctx.fillRect(s.x, s.y, 4, 4));
}

// =======================================================
// 3. ISAAC RHODES: SONIC-STYLE SUPERSONIC LOOP-DE-LOOP
// =======================================================
let isaacPos = { x: 50, y: 220 };
let isaacSpeed = 0;
let loopAngle = 0;
let inLoop = false;
let isaacTrail = [];
let sonicRings = [
  { x: 120, y: 215, collected: false },
  { x: 160, y: 215, collected: false },
  { x: 340, y: 215, collected: false }
];

const LOOP_CENTER_X = 250;
const LOOP_CENTER_Y = 175;
const LOOP_RADIUS = 48;

function updateIsaacSonic() {
  // Supersonic momentum physics
  isaacPos.x += isaacSpeed;

  // Track motion trail
  if (Math.abs(isaacSpeed) > 1) {
    isaacTrail.push({ x: isaacPos.x, y: isaacPos.y, alpha: 0.8 });
  }
  isaacTrail.forEach(t => t.alpha -= 0.05);
  isaacTrail = isaacTrail.filter(t => t.alpha > 0);

  // Trigger Sonic Loop-de-Loop when entering center coordinates
  if (!inLoop && isaacPos.x >= LOOP_CENTER_X - 10 && isaacPos.x <= LOOP_CENTER_X + 10 && isaacSpeed > 2) {
    inLoop = true;
    loopAngle = Math.PI / 2; // Start from bottom of hoop
  }

  if (inLoop) {
    loopAngle += 0.14;
    isaacPos.x = LOOP_CENTER_X + Math.cos(loopAngle) * LOOP_RADIUS;
    isaacPos.y = LOOP_CENTER_Y + Math.sin(loopAngle) * LOOP_RADIUS;

    if (loopAngle >= (Math.PI / 2) + (Math.PI * 2)) {
      inLoop = false;
      isaacPos.y = 220;
      isaacPos.x = LOOP_CENTER_X + LOOP_RADIUS + 5;
      score += 250;
      AudioEngine.playTone(880, 'sine', 0.2);
    }
  } else {
    // Normal ground friction
    isaacSpeed *= 0.94;
    if (Math.abs(isaacSpeed) < 0.1) isaacSpeed = 0;
  }

  // Ring collection
  sonicRings.forEach(r => {
    if (!r.collected && Math.hypot(isaacPos.x - r.x, isaacPos.y - r.y) < 22) {
      r.collected = true;
      score += 100;
      AudioEngine.playTone(987, 'sine', 0.12);
    }
  });

  // Loop screen
  if (isaacPos.x > canvas.width + 20) {
    isaacPos.x = -20;
    sonicRings.forEach(r => r.collected = false);
  }
  if (isaacPos.x < -30) isaacPos.x = canvas.width;

  updateStats();
}

function drawIsaacSonic() {
  // Sonic Green Hill Emerald Sky
  ctx.fillStyle = '#0f766e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Checkerboard Track Floor
  ctx.fillStyle = '#047857';
  ctx.fillRect(0, 235, canvas.width, 65);
  ctx.fillStyle = '#065f46';
  for (let x = 0; x < canvas.width; x += 30) {
    ctx.fillRect(x, 235, 15, 65);
  }

  // --- DRAW SONIC-STYLE 360-DEGREE LOOP-DE-LOOP ---
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(LOOP_CENTER_X, LOOP_CENTER_Y, LOOP_RADIUS, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#34d399';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(LOOP_CENTER_X, LOOP_CENTER_Y, LOOP_RADIUS + 7, 0, Math.PI * 2);
  ctx.stroke();

  // Golden Rings
  sonicRings.forEach(r => {
    if (!r.collected) {
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  // Supersonic Blue Blur Speed Trail
  isaacTrail.forEach(t => {
    ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 10, 0, Math.PI * 2);
    ctx.fill();
  });

  // Isaac Supersonic Sprite (Ball when looping, runner when fast)
  ctx.save();
  ctx.translate(isaacPos.x, isaacPos.y);

  if (inLoop || Math.abs(isaacSpeed) > 4) {
    // Sonic Spin Dash Ball
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Upright Runner
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(-6, -14, 12, 16);
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(0, -18, 6, 0, Math.PI * 2); ctx.fill();
    // Red Power Sneakers
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-7, 2, 6, 4);
    ctx.fillRect(1, 2, 6, 4);
  }
  ctx.restore();
}

// --- MASTER ANIMATION LOOP ---
function masterLoop() {
  if (currentGame === 'VANGUARD') {
    updateVanguard();
    drawVanguard();
  } else if (currentGame === 'BATTLESHIP') {
    updateBattleship();
    drawBattleship();
  } else if (currentGame === 'ISAAC') {
    updateIsaacSonic();
    drawIsaacSonic();
  }
  requestAnimationFrame(masterLoop);
}

  }

// Isaac Sonic Controls

document.getElementById('btn-isaac-right').onpointerdown = () => isaacSpeed = 5.5;
document.getElementById('btn-isaac-jump').onclick = () => {
  AudioEngine.playTone(650, 'square', 0.15);

};

};

  AudioEngine.playTone(1020, 'triangle', 0.3);
};

// Canvas touch fire for Battleship
canvas.addEventListener('pointerdown', (e) => {
  AudioEngine.init();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const tapX = (e.clientX - rect.left) * scaleX;
  const tapY = (e.clientY - rect.top) * scaleY;
  if (currentGame === 'BATTLESHIP') fireNavalCannon(tapX, tapY);
});
