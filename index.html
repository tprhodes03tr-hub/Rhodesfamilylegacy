<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy - Ancestral Battle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0c1022;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    .wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* Book Row */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .book-card {
      background: #141b36;
      border: 1px solid #2a3560;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .book-cover {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4px;
      font-size: 0.65rem;
      font-weight: bold;
      margin-bottom: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    .cover-vol1 {
      background: linear-gradient(135deg, #422006, #1c0a00);
      border: 1px solid #ca8a04;
      color: #fef08a;
    }
    .cover-vol2 {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border: 1px solid #c084fc;
      color: #fae8ff;
    }
    .cover-vol3 {
      background: linear-gradient(135deg, #064e3b, #022c22);
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
    .book-title {
      font-size: 0.65rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.1;
      min-height: 24px;
    }
    .buy-btn {
      width: 100%;
      padding: 5px 0;
      background: #f97316;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }
    .buy-btn:hover { background: #ea580c; }

    /* Game HUD & Container */
    .game-box {
      background: #10162f;
      border: 1px solid #1e2952;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .bars {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 40%;
    }
    .bar-wrap {
      background: #1e293b;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .bar-hero { background: #22c55e; height: 100%; width: 100%; transition: width 0.1s; }
    .bar-boss { background: #ef4444; height: 100%; width: 100%; transition: width 0.1s; }

    canvas {
      width: 100%;
      height: 190px;
      background: #111827;
      border-radius: 6px;
      border: 1px solid #374151;
      display: block;
    }

    .chapter-banner {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #facc15;
    }
    .subhead {
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      color: #f59e0b;
      font-weight: 700;
    }

    /* Hero Selection Grid */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .hero-btn {
      background: #162044;
      border: 1px solid #2b396b;
      border-radius: 6px;
      padding: 6px 4px;
      color: #e2e8f0;
      cursor: pointer;
      text-align: center;
    }
    .hero-btn.selected {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.5);
    }
    .hero-name { font-size: 0.7rem; font-weight: 700; }
    .hero-power { font-size: 0.58rem; color: #94a3b8; }

    /* Touch Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr 1.2fr;
      gap: 5px;
      margin-top: 4px;
    }
    .ctrl-btn {
      background: #1e2954;
      color: #f8fafc;
      border: 1px solid #33417a;
      border-radius: 6px;
      padding: 10px 0;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .ctrl-btn:active { background: #2f3e82; }
    .btn-burst {
      background: #dc2626;
      border-color: #b91c1c;
    }
    .btn-burst:active { background: #991b1b; }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Book Covers Retained Intact -->
  <div class="book-grid">
    <div class="book-card">
      <div class="book-cover cover-vol1">Packed in the Marrow<br><span style="font-size:0.5rem">Father to Son</span></div>
      <div class="book-title">Vol. 1 - From Father to Son</div>
      <button class="buy-btn">BUY VOL. 1</button>
    </div>
    <div class="book-card">
      <div class="book-cover cover-vol2">Cousins of Courage<br><span style="font-size:0.5rem">Legacy</span></div>
      <div class="book-title">Vol. 2 - Cousins of Courage</div>
      <button class="buy-btn">BUY VOL. 2</button>
    </div>
    <div class="book-card">
      <div class="book-cover cover-vol3">The Colbert Legacy<br><span style="font-size:0.5rem">History</span></div>
      <div class="book-title">Vol. 3 - The Colbert Legacy</div>
      <button class="buy-btn">BUY VOL. 3</button>
    </div>
  </div>

  <!-- Battle Container -->
  <div class="game-box">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div class="bars">
        <div class="bar-wrap"><div class="bar-hero" id="heroHp"></div></div>
        <div class="bar-wrap"><div class="bar-boss" id="bossHp"></div></div>
      </div>
      <div>WAVE: [<span id="waveDisplay">1/8</span>]</div>
    </div>

    <canvas id="gameCanvas" width="400" height="200"></canvas>

    <div class="chapter-banner" id="chapterTitle">Chapter 1: The Rising Vanguard</div>
    <div class="subhead">✦ SELECT ANCESTRAL CHAMPION &amp; SUPERPOWER ✦</div>

    <div class="hero-grid">
      <button class="hero-btn selected" onclick="setHero(0)">
        <div class="hero-name">Inez &amp; Tweet</div>
        <div class="hero-power">Twin Sister Tag</div>
      </button>
      <button class="hero-btn" onclick="setHero(1)">
        <div class="hero-name">Elroy Rhodes</div>
        <div class="hero-power">Delta Heavy</div>
      </button>
      <button class="hero-btn" onclick="setHero(2)">
        <div class="hero-name">Uncle Bear</div>
        <div class="hero-power">Maroon Shock</div>
      </button>
      <button class="hero-btn" onclick="setHero(3)">
        <div class="hero-name">Uncle Aaron</div>
        <div class="hero-power">Pioneer Volley</div>
      </button>
      <button class="hero-btn" onclick="setHero(4)">
        <div class="hero-name">Fanny May</div>
        <div class="hero-power">Coincoin Barrier</div>
      </button>
      <button class="hero-btn" onclick="setHero(5)">
        <div class="hero-name">TP Mitchell</div>
        <div class="hero-power">Lineage Beam</div>
      </button>
    </div>

    <!-- On-Screen Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="btnLeft">◀ LEFT</button>
      <button class="ctrl-btn" id="btnRight">RIGHT ▶</button>
      <button class="ctrl-btn" id="btnJump">▲ JUMP</button>
      <button class="ctrl-btn" id="btnAtk">ATK / BOW</button>
      <button class="ctrl-btn btn-burst" id="btnBurst">BURST</button>
    </div>
  </div>

</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // 10 Full Chapters
  const chapters = [
    { title: "Chapter 1: The Rising Vanguard", maxWaves: 6, bg: "#0f172a" },
    { title: "Chapter 2: Delta Woodlands Crossing", maxWaves: 6, bg: "#064e3b" },
    { title: "Chapter 3: Fortified Marrow Bastion", maxWaves: 7, bg: "#1e1b4b" },
    { title: "Chapter 4: River of Iron Will", maxWaves: 7, bg: "#172554" },
    { title: "Chapter 5: Ancestral Mountain Paths", maxWaves: 7, bg: "#262626" },
    { title: "Chapter 6: The Colbert Citadel Gates", maxWaves: 8, bg: "#312e81" },
    { title: "Chapter 7: Maroon Sentinel Keep", maxWaves: 8, bg: "#1f2937" },
    { title: "Chapter 8: The Great Dismal Swamp & Levant Portals", maxWaves: 8, bg: "#0d1b2a" },
    { title: "Chapter 9: Pillars of the Vanguard", maxWaves: 9, bg: "#1a102f" },
    { title: "Chapter 10: Golden Sanctuary of the Marrow", maxWaves: 10, bg: "#2a1b04" }
  ];

  let currentChapterIdx = 7; // Starts on Chapter 8 as in preview
  let currentWave = 1;
  let score = 0;

  const player = {
    x: 40,
    y: 140,
    w: 16,
    h: 30,
    vx: 0,
    vy: 0,
    grounded: true,
    hp: 100,
    maxHp: 100,
    burstReady: true,
    color: "#f43f5e"
  };

  let projectiles = [];
  let enemies = [];
  let boss = null;

  // New Enemy Archetypes added: prowler, brute, stalker, guard
  const enemyTypes = {
    guard: { w: 18, h: 32, hp: 30, speed: 1.0, color: "#a8a29e" },
    prowler: { w: 16, h: 24, hp: 20, speed: 2.3, color: "#f97316" }, // Fast rusher
    brute: { w: 26, h: 36, hp: 80, speed: 0.6, color: "#475569" },   // Heavy tank
    stalker: { w: 14, h: 28, hp: 35, speed: 1.4, color: "#9333ea" }  // Flanker
  };

  function spawnWave() {
    enemies = [];
    boss = null;
    const isBossWave = (currentWave === chapters[currentChapterIdx].maxWaves);

    if (isBossWave) {
      // Golden Leopard Boss with Loop-Prevention Safeguards
      boss = {
        name: "Golden Leopard",
        x: 330,
        y: 135,
        w: 36,
        h: 35,
        hp: 220,
        maxHp: 220,
        color: "#eab308",
        state: "patrol",      // "patrol", "prepare_charge", "charge", "recover"
        timer: 0,            // Dedicated state timer preventing infinite loop
        patrolLimitLeft: 230,
        patrolLimitRight: 360,
        speed: 1.5,
        dir: -1
      };
    } else {
      const count = 1 + Math.floor(currentWave / 2);
      const keys = Object.keys(enemyTypes);
      for (let i = 0; i < count; i++) {
        const typeKey = keys[Math.floor(Math.random() * keys.length)];
        const spec = enemyTypes[typeKey];
        enemies.push({
          x: 280 + (i * 35),
          y: 170 - spec.h,
          w: spec.w,
          h: spec.h,
          hp: spec.hp,
          maxHp: spec.hp,
          speed: spec.speed,
          color: spec.color
        });
      }
    }
  }

  // Golden Leopard Finite State Machine (Guaranteed loop break)
  function updateBoss() {
    if (!boss) return;

    boss.timer++;

    if (boss.state === "patrol") {
      boss.x += boss.speed * boss.dir;
      if (boss.x <= boss.patrolLimitLeft) {
        boss.x = boss.patrolLimitLeft;
        boss.dir = 1;
      } else if (boss.x >= boss.patrolLimitRight) {
        boss.x = boss.patrolLimitRight;
        boss.dir = -1;
      }
      // Guaranteed Breakout: After 90 frames (~1.5s), prepare a charge towards player
      if (boss.timer > 90) {
        boss.state = "prepare_charge";
        boss.timer = 0;
      }
    } else if (boss.state === "prepare_charge") {
      // Pause, crouch, flash before leaping
      if (boss.timer > 30) {
        boss.state = "charge";
        boss.timer = 0;
        boss.dir = boss.x > player.x ? -1 : 1;
      }
    } else if (boss.state === "charge") {
      boss.x += boss.dir * 4.5;
      // Check hit with player
      if (Math.abs(boss.x - player.x) < 20 && Math.abs(boss.y - player.y) < 20) {
        player.hp = Math.max(0, player.hp - 0.4);
      }
      // Complete charge dash
      if (boss.timer > 40 || boss.x < 20 || boss.x > 360) {
        boss.state = "recover";
        boss.timer = 0;
      }
    } else if (boss.state === "recover") {
      // Cooldown breath period, then resume patrol
      if (boss.timer > 40) {
        boss.state = "patrol";
        boss.timer = 0;
      }
    }

    // Boss Defeat Resolution
    if (boss.hp <= 0) {
      score += 1500;
      boss = null;
      advanceWave();
    }
  }

  function advanceWave() {
    if (currentWave < chapters[currentChapterIdx].maxWaves) {
      currentWave++;
    } else {
      // Advance to next chapter
      if (currentChapterIdx < chapters.length - 1) {
        currentChapterIdx++;
        currentWave = 1;
      } else {
        alert("Victory! You have unified the Ancestral Marrow through all 10 chapters!");
        currentChapterIdx = 0;
        currentWave = 1;
      }
    }
    spawnWave();
    updateUI();
  }

  function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("waveDisplay").innerText = `${currentWave}/${chapters[currentChapterIdx].maxWaves}`;
    document.getElementById("chapterTitle").innerText = chapters[currentChapterIdx].title;
    document.getElementById("heroHp").style.width = `${(player.hp / player.maxHp) * 100}%`;
    const bHp = boss ? (boss.hp / boss.maxHp) * 100 : 0;
    document.getElementById("bossHp").style.width = `${bHp}%`;
  }

  // Inputs
  const keys = {};
  window.addEventListener("keydown", e => keys[e.code] = true);
  window.addEventListener("keyup", e => keys[e.code] = false);

  function attachTouch(id, code) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[code] = true; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
    el.addEventListener("mousedown", () => keys[code] = true);
    el.addEventListener("mouseup", () => keys[code] = false);
  }
  attachTouch("btnLeft", "ArrowLeft");
  attachTouch("btnRight", "ArrowRight");
  attachTouch("btnJump", "ArrowUp");

  document.getElementById("btnAtk").addEventListener("click", () => {
    projectiles.push({ x: player.x + 16, y: player.y + 12, vx: 5, r: 4, type: "arrow" });
  });

  document.getElementById("btnBurst").addEventListener("click", () => {
    for (let i = -1; i <= 1; i += 0.5) {
      projectiles.push({ x: player.x + 16, y: player.y + 12, vx: 6, vy: i, r: 6, type: "burst" });
    }
  });

  window.setHero = function(idx) {
    document.querySelectorAll(".hero-btn").forEach((btn, i) => {
      btn.classList.toggle("selected", i === idx);
    });
  };

  // Main Loop
  function gameLoop() {
    // Player horizontal motion
    if (keys["ArrowLeft"]) player.vx = -2.5;
    else if (keys["ArrowRight"]) player.vx = 2.5;
    else player.vx = 0;

    // Player Jump
    if (keys["ArrowUp"] && player.grounded) {
      player.vy = -7.5;
      player.grounded = false;
    }

    // Physics
    player.vy += 0.35;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 10) player.x = 10;
    if (player.x > 370) player.x = 370;

    if (player.y >= 140) {
      player.y = 140;
      player.vy = 0;
      player.grounded = true;
    }

    // Update Regular Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.x -= e.speed;
      if (Math.abs(e.x - player.x) < 14 && Math.abs(e.y - player.y) < 20) {
        player.hp = Math.max(0, player.hp - 0.2);
      }
      if (e.hp <= 0) {
        score += 100;
        enemies.splice(i, 1);
      }
    }

    // Advance if normal wave cleared
    if (!boss && enemies.length === 0) {
      advanceWave();
    }

    // Update Boss Loop
    updateBoss();

    // Update Projectiles & Collisions
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx;
      if (p.vy) p.y += p.vy;

      // Boss Hit
      if (boss && p.x > boss.x && p.x < boss.x + boss.w && p.y > boss.y && p.y < boss.y + boss.h) {
        boss.hp -= (p.type === "burst" ? 18 : 8);
        projectiles.splice(i, 1);
        continue;
      }

      // Enemy Hit
      let hit = false;
      for (let e of enemies) {
        if (p.x > e.x && p.x < e.x + e.w && p.y > e.y && p.y < e.y + e.h) {
          e.hp -= (p.type === "burst" ? 25 : 12);
          hit = true;
          break;
        }
      }
      if (hit || p.x > 410 || p.x < 0) {
        projectiles.splice(i, 1);
      }
    }

    // Rendering
    render();
    updateUI();
    requestAnimationFrame(gameLoop);
  }

  function render() {
    // Stage Background
    ctx.fillStyle = chapters[currentChapterIdx].bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Architectural Pillars
    ctx.fillStyle = "#1e294b";
    for (let i = 25; i < 400; i += 60) {
      ctx.fillRect(i, 30, 18, 140);
    }

    // Ground
    ctx.fillStyle = "#5c3d2e";
    ctx.fillRect(0, 170, canvas.width, 30);
    ctx.fillStyle = "#82553e";
    ctx.fillRect(0, 170, canvas.width, 3);

    // Player Hero
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    // Ancestral tag orbs
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(player.x - 4, player.y - 10, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ec4899";
    ctx.beginPath();
    ctx.arc(player.x + 8, player.y - 12, 4, 0, Math.PI * 2);
    ctx.fill();

    // Standard Enemies
    enemies.forEach(e => {
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x, e.y, e.w, e.h);
    });

    // Golden Leopard Boss
    if (boss) {
      ctx.fillStyle = boss.state === "prepare_charge" ? "#ffffff" : boss.color;
      ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
      // Boss Crest
      ctx.fillStyle = "#b45309";
      ctx.fillRect(boss.x + (boss.dir === 1 ? 24 : 4), boss.y + 4, 8, 8);
    }

    // Projectiles
    projectiles.forEach(p => {
      ctx.fillStyle = p.type === "burst" ? "#38bdf8" : "#facc15";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  spawnWave();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
