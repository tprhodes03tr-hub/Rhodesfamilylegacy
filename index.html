<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancestral Legacy Game & Media Hub</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #131b2e;
      --card-border: #1e2c4a;
      --accent-orange: #d97736;
      --accent-red: #d9534f;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Book Cards */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
    }

    .book-card.vol-1 { border-top: 3px solid #b91c1c; }
    .book-card.vol-2 { border-top: 3px solid #2563eb; }
    .book-card.vol-3 { border-top: 3px solid #15803d; }

    .book-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .vol-1 .book-title { color: #f87171; }
    .vol-2 .book-title { color: #60a5fa; }
    .vol-3 .book-title { color: #4ade80; }

    .book-sub {
      font-size: 0.62rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .book-label {
      font-size: 0.68rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .btn-buy {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 2px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    /* Game HUD */
    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0 4px;
    }

    .hud-stat {
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
    }

    .bars-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 45%;
    }

    .bar-row {
      display: flex;
      align-items: center;
      font-size: 0.65rem;
      gap: 6px;
    }

    .bar-label {
      width: 32px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .bar-track {
      flex: 1;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hero {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 0.1s ease;
    }

    .bar-fill-boss {
      height: 100%;
      width: 100%;
      background: #64748b;
      transition: width 0.1s ease;
    }

    /* Canvas Frame */
    .canvas-wrap {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* Controls & Champions Section */
    .controls-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chapter-heading {
      text-align: center;
      color: var(--accent-gold);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sub-heading {
      text-align: center;
      color: var(--accent-cyan);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: -6px;
    }

    /* Champion Grid */
    .champ-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .champ-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 4px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s;
    }

    .champ-btn.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
      background: #172554;
    }

    .champ-name {
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .champ-skill {
      font-size: 0.58rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Game Buttons */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr 1.2fr;
      gap: 6px;
    }

    .ctrl-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 2px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    .ctrl-btn:active {
      background: #334155;
      transform: translateY(1px);
    }

    .btn-burst {
      background: var(--accent-red);
      border-color: #ef4444;
    }

    .btn-burst:active {
      background: #b91c1c;
    }

    /* Video Hub */
    .video-hub {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hub-title {
      text-align: center;
      color: var(--accent-gold);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .upload-btn-label {
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed var(--accent-cyan);
      color: var(--accent-cyan);
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn-label:hover {
      background: rgba(56, 189, 248, 0.16);
    }

    #ancestralVideo {
      width: 100%;
      border-radius: 6px;
      background: #000;
      max-height: 240px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="books-grid">
      <div class="book-card vol-1">
        <div>
          <div class="book-title">Packed In The Marrow</div>
          <div class="book-sub">From Father to Son</div>
        </div>
        <div>
          <div class="book-label">Vol. 1 - Father to Son</div>
          <button class="btn-buy" onclick="alert('Redirecting to Payhip Vol. 1')">BUY VOL. 1</button>
        </div>
      </div>
      <div class="book-card vol-2">
        <div>
          <div class="book-title">Cousins Of Courage</div>
          <div class="book-sub">Two Lives, One Blood</div>
        </div>
        <div>
          <div class="book-label">Vol. 2 - Cousins</div>
          <button class="btn-buy" onclick="alert('Redirecting to Payhip Vol. 2')">BUY VOL. 2</button>
        </div>
      </div>
      <div class="book-card vol-3">
        <div>
          <div class="book-title">The Colbert Legacy</div>
          <div class="book-sub">Volume Three</div>
        </div>
        <div>
          <div class="book-label">Vol. 3 - Colbert</div>
          <button class="btn-buy" onclick="alert('Redirecting to Payhip Vol. 3')">BUY VOL. 3</button>
        </div>
      </div>
    </div>

    <div class="game-hud">
      <div class="hud-stat" id="scoreDisplay">SCORE: 26800</div>
      <div class="bars-container">
        <div class="bar-row">
          <span class="bar-label">HERO</span>
          <div class="bar-track"><div class="bar-fill-hero" id="heroHp"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">BOSS</span>
          <div class="bar-track"><div class="bar-fill-boss" id="bossHp"></div></div>
        </div>
      </div>
      <div class="hud-stat" id="waveDisplay">WAVE: [7/8]</div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="400" height="230"></canvas>
    </div>

    <div class="controls-wrapper">
      <div class="chapter-heading" id="chapterTitle">Chapter 7: Midnight Crossing</div>
      <div class="sub-heading">&#10022; SELECT ANCESTRAL CHAMPION & SUPERPOWER &#10022;</div>

      <div class="champ-grid">
        <button class="champ-btn" onclick="selectChamp('inez', this)">
          <span class="champ-name">Inez &amp; Tweet</span>
          <span class="champ-skill">Twin Sister Tag</span>
        </button>
        <button class="champ-btn active" onclick="selectChamp('elroy', this)">
          <span class="champ-name">Elroy Rhodes</span>
          <span class="champ-skill">Delta Heavy</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('bear', this)">
          <span class="champ-name">Uncle Bear</span>
          <span class="champ-skill">Maroon Shock</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('aaron', this)">
          <span class="champ-name">Uncle Aaron</span>
          <span class="champ-skill">Pioneer Volley</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('fanny', this)">
          <span class="champ-name">Fanny May</span>
          <span class="champ-skill">Coincoin Barrier</span>
        </button>
        <button class="champ-btn" onclick="selectChamp('tp', this)">
          <span class="champ-name">TP Mitchell</span>
          <span class="champ-skill">Lineage Beam</span>
        </button>
      </div>

      <div class="action-row">
        <button class="ctrl-btn" id="btnLeft">&#9664; LEFT</button>
        <button class="ctrl-btn" id="btnRight">RIGHT &#9654;</button>
        <button class="ctrl-btn" id="btnJump">&#9650; JUMP</button>
        <button class="ctrl-btn" id="btnAttack">ATK / BOW</button>
        <button class="ctrl-btn btn-burst" id="btnBurst">BURST</button>
      </div>
    </div>

    <div class="video-hub">
      <div class="hub-title">&#10022; ANCESTRAL VIDEO HUB &#10022;</div>
      <label class="upload-btn-label">
        + UPLOAD &amp; PLAY ANCESTRAL FOOTAGE
        <input type="file" id="videoUpload" accept="video/*" style="display:none;" />
      </label>
      <video id="ancestralVideo" controls playsinline>
        Your browser does not support HTML video.
      </video>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Chapter Definitions & Background Themes
    const chapters = [
      { id: 1, name: "Chapter 1: The Cane River Shoals", theme: 'shoals' },
      { id: 2, name: "Chapter 2: Deep Pines Sanctum", theme: 'forest' },
      { id: 3, name: "Chapter 3: Red Clay Ridge", theme: 'clay' },
      { id: 4, name: "Chapter 4: The Ancestral Forge", theme: 'forge' },
      { id: 5, name: "Chapter 5: Golden Harvest", theme: 'harvest' },
      { id: 6, name: "Chapter 6: Bayou Whispers", theme: 'bayou' },
      { id: 7, name: "Chapter 7: Midnight Crossing", theme: 'midnight' },
      { id: 8, name: "Chapter 8: The Vanguard Dawn", theme: 'dawn' }
    ];

    let currentChapterIdx = 6; // Defaults to Chapter 7
    let score = 26800;
    let selectedChamp = 'elroy';

    // Game Entities
    const hero = {
      x: 60,
      y: 158,
      vx: 0,
      vy: 0,
      width: 14,
      height: 28,
      isGrounded: true,
      facing: 1,
      color: '#fbbf24',
      hp: 100
    };

    // Spirits (Ghosts)
    const ghostInez = { x: 38, y: 44, baseOffsetY: 44, color: '#38bdf8', glow: 'rgba(56, 189, 248, 0.45)', name: 'Inez' };
    const ghostTweet = { x: 74, y: 48, baseOffsetY: 48, color: '#f43f5e', glow: 'rgba(244, 63, 94, 0.45)', name: 'Tweet' };

    // Companions (Spirit Owl & Spirit Leopard)
    const spiritOwl = { x: 55, y: 24, baseOffsetY: 24, targetX: 55, targetY: 24, attacking: false, attackTimer: 0 };
    const spiritLeopard = { x: 25, y: 172, targetX: 25, targetY: 172, attacking: false, attackTimer: 0 };

    let projectiles = [];
    let slashEffects = [];
    let enemies = [];

    // Keys
    const keys = { left: false, right: false, up: false };

    // Initialize Chapter Enemies
    function spawnEnemies() {
      enemies = [];
      const enemyCount = 4;
      for (let i = 0; i < enemyCount; i++) {
        enemies.push({
          x: 230 + i * 40,
          y: 158,
          width: 13,
          height: 28,
          hp: 40,
          maxHp: 40,
          shieldActive: true,
          facing: -1
        });
      }
    }
    spawnEnemies();

    // Humanoid Sprite Rendering
    function drawHumanoid(x, y, w, h, facing, headColor, bodyColor, limbColor) {
      ctx.save();
      const centerX = x + w / 2;
      
      // Head
      ctx.fillStyle = headColor;
      ctx.beginPath();
      ctx.arc(centerX, y + 4, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Neck
      ctx.fillStyle = limbColor;
      ctx.fillRect(centerX - 1, y + 7, 2, 2);

      // Torso
      ctx.fillStyle = bodyColor;
      ctx.fillRect(centerX - 4, y + 9, 8, 10);

      // Arms
      ctx.fillStyle = limbColor;
      ctx.fillRect(centerX + (facing === 1 ? 4 : -6), y + 10, 2, 8); // Front arm
      ctx.fillRect(centerX + (facing === 1 ? -6 : 4), y + 10, 2, 7); // Back arm

      // Legs
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(centerX - 3.5, y + 19, 3, 9);
      ctx.fillRect(centerX + 0.5, y + 19, 3, 9);

      // Feet / Boots
      ctx.fillStyle = '#475569';
      ctx.fillRect(centerX - 4 + (facing === 1 ? 0 : -1), y + 26, 4, 2);
      ctx.fillRect(centerX + 0.5 + (facing === 1 ? 1 : 0), y + 26, 4, 2);

      ctx.restore();
    }

    // Dynamic Background Renderer per Chapter
    function drawDynamicBackground(theme) {
      const w = canvas.width;
      const h = canvas.height;

      if (theme === 'shoals') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#022c43');
        grad.addColorStop(1, '#055052');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#53b8bb';
        ctx.fillRect(0, 140, w, 50);
      } else if (theme === 'forest') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#062817');
        grad.addColorStop(1, '#02120a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Pine trees silhouette
        ctx.fillStyle = '#0f3a22';
        for (let i = 0; i < w; i += 30) {
          ctx.beginPath();
          ctx.moveTo(i, 186);
          ctx.lineTo(i + 15, 60);
          ctx.lineTo(i + 30, 186);
          ctx.fill();
        }
      } else if (theme === 'clay') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#4a1508');
        grad.addColorStop(1, '#1f0904');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Ridges
        ctx.fillStyle = '#782813';
        ctx.beginPath();
        ctx.moveTo(0, 140);
        ctx.lineTo(120, 110);
        ctx.lineTo(260, 150);
        ctx.lineTo(400, 120);
        ctx.lineTo(400, 186);
        ctx.lineTo(0, 186);
        ctx.fill();
      } else if (theme === 'forge') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1c1917');
        grad.addColorStop(1, '#431407');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Forge glow
        ctx.fillStyle = 'rgba(234, 88, 12, 0.2)';
        ctx.fillRect(150, 60, 100, 126);
      } else if (theme === 'harvest') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#451a03');
        grad.addColorStop(1, '#78350f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Harvest stalks
        ctx.fillStyle = '#b45309';
        for (let x = 0; x < w; x += 12) {
          ctx.fillRect(x, 130 + Math.sin(x) * 10, 3, 56);
        }
      } else if (theme === 'bayou') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#091d1e');
        grad.addColorStop(1, '#042f2e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Mossy trunks
        ctx.fillStyle = '#115e59';
        ctx.fillRect(50, 40, 18, 146);
        ctx.fillRect(190, 20, 24, 166);
        ctx.fillRect(320, 50, 20, 136);
      } else if (theme === 'midnight') {
        // Night sky with vertical architectural pillars
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#070b14');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        ctx.fillStyle = '#1e293b';
        const pillarSpacing = 42;
        for (let x = 18; x < w; x += pillarSpacing) {
          ctx.fillRect(x, 20, 16, 166);
        }
      } else if (theme === 'dawn') {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#7c2d12');
        grad.addColorStop(0.5, '#c2410c');
        grad.addColorStop(1, '#ea580c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Rising sun disc
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(200, 130, 42, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ground platform across all scenes
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 186, w, 44);
      ctx.fillStyle = '#374151';
      ctx.fillRect(0, 186, w, 3);
    }

    // Main Game Loop Update
    function update() {
      // Movement
      if (keys.left) {
        hero.vx = -2.2;
        hero.facing = -1;
      } else if (keys.right) {
        hero.vx = 2.2;
        hero.facing = 1;
      } else {
        hero.vx = 0;
      }

      hero.x += hero.vx;

      // Jump & Gravity
      if (keys.up && hero.isGrounded) {
        hero.vy = -6.5;
        hero.isGrounded = false;
      }

      hero.vy += 0.35; // Gravity
      hero.y += hero.vy;

      // Floor collision
      if (hero.y >= 158) {
        hero.y = 158;
        hero.vy = 0;
        hero.isGrounded = true;
      }

      // Screen clamp
      if (hero.x < 10) hero.x = 10;
      if (hero.x > 380) hero.x = 380;

      const time = Date.now() * 0.003;

      // Spirits Float smoothly
      ghostInez.x += (hero.x - 24 - ghostInez.x) * 0.05;
      ghostInez.y = ghostInez.baseOffsetY + Math.sin(time) * 4;

      ghostTweet.x += (hero.x + 14 - ghostTweet.x) * 0.05;
      ghostTweet.y = ghostTweet.baseOffsetY + Math.cos(time) * 4;

      // Spirit Owl update
      if (spiritOwl.attacking) {
        spiritOwl.attackTimer--;
        spiritOwl.x += 6;
        spiritOwl.y = 120 + Math.sin(Date.now() * 0.02) * 20;
        if (spiritOwl.attackTimer <= 0 || spiritOwl.x > canvas.width) {
          spiritOwl.attacking = false;
          spiritOwl.x = hero.x - 10;
          spiritOwl.y = 24;
        }
      } else {
        spiritOwl.x += (hero.x - 5 - spiritOwl.x) * 0.04;
        spiritOwl.y = spiritOwl.baseOffsetY + Math.sin(time * 1.5) * 6;
      }

      // Spirit Leopard update
      if (spiritLeopard.attacking) {
        spiritLeopard.attackTimer--;
        spiritLeopard.x += 7;
        spiritLeopard.y = 168;
        if (spiritLeopard.attackTimer <= 0 || spiritLeopard.x > canvas.width) {
          spiritLeopard.attacking = false;
          spiritLeopard.x = hero.x - 35;
        }
      } else {
        spiritLeopard.x += (hero.x - 30 - spiritLeopard.x) * 0.08;
        spiritLeopard.y = 170;
      }

      // Projectiles (Lineage Arrows / Beams)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.life--;

        // Collision with enemies
        for (let enemy of enemies) {
          if (p.x > enemy.x && p.x < enemy.x + enemy.width &&
              p.y > enemy.y && p.y < enemy.y + enemy.height) {
            enemy.hp -= p.damage;
            p.life = 0;
            score += 120;
          }
        }

        if (p.life <= 0 || p.x > canvas.width || p.x < 0) {
          projectiles.splice(i, 1);
        }
      }

      // Slashes & Spirit Hits
      for (let i = slashEffects.length - 1; i >= 0; i--) {
        const s = slashEffects[i];
        s.timer--;
        if (s.timer <= 0) slashEffects.splice(i, 1);
      }

      // Check Leopard Collision
      if (spiritLeopard.attacking) {
        for (let enemy of enemies) {
          if (Math.abs(spiritLeopard.x - enemy.x) < 18) {
            enemy.hp -= 2;
            score += 40;
          }
        }
      }

      // Check Owl Collision
      if (spiritOwl.attacking) {
        for (let enemy of enemies) {
          if (Math.abs(spiritOwl.x - enemy.x) < 22 && Math.abs(spiritOwl.y - enemy.y) < 30) {
            enemy.hp -= 3;
            score += 50;
          }
        }
      }
