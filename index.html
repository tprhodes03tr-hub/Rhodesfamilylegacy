<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rhodes Family Legacy - Arcade & Media Hub</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    background-color: #060b13;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 40px;
    overflow-x: hidden;
  }
  .wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 10px 8px;
  }

  /* --- BOOK ROW --- */
  .books-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .book-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .book-card img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 4px;
    background: #1e293b;
  }
  .book-card h4 {
    font-size: 10px;
    margin: 6px 0 4px;
    color: #cbd5e1;
    line-height: 1.1;
    min-height: 22px;
  }
  .btn-buy {
    width: 100%;
    background: #ea580c;
    color: #fff;
    border: none;
    padding: 5px 0;
    font-size: 10px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* --- GAME SELECTOR TAB --- */
  .hub-tab-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: #0b1329;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }
  .tab-btn {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 8px 2px;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: #0284c7;
    color: #fff;
    border-color: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
  }

  /* --- CABINET SCREEN --- */
  .screen-card {
    background: #0b1329;
    border: 2px solid #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }
  .hud-header {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: bold;
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
  }
  .hud-header span { color: #38bdf8; }
  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Sub-titles */
  .section-label {
    text-align: center;
    font-size: 12px;
    color: #f59e0b;
    font-weight: bold;
    padding: 8px 4px 4px;
    letter-spacing: 0.5px;
  }

  /* --- VANGUARD CHAMPION GRID --- */
  .champions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .champ-btn {
    background: #111e38;
    border: 1px solid #1e293b;
    color: #cbd5e1;
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
  }
  .champ-btn.active {
    border-color: #38bdf8;
    background: #0369a1;
    color: #fff;
  }
  .champ-btn small {
    font-size: 9px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .champ-btn.active small { color: #e0f2fe; }

  /* --- CONTROL DOCKS --- */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #1e293b;
  }
  .act-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 12px 0;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .act-btn:active {
    background: #38bdf8;
    color: #000;
  }
  .act-btn.burst {
    background: #dc2626;
    border-color: #ef4444;
    color: #fff;
  }
  .act-btn.burst:active {
    background: #b91c1c;
  }

  /* Battleship controls dock */
  .naval-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #1e293b;
  }
  .naval-btn {
    background: #1e293b;
    border: 1px solid #38bdf8;
    color: #38bdf8;
    padding: 10px 2px;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .naval-btn small { font-size: 8px; color: #94a3b8; }
  .naval-btn.warning { border-color: #f59e0b; color: #fbbf24; }
  .naval-btn.danger { border-color: #ef4444; color: #f87171; }

  /* --- VIDEO HUB --- */
  .video-card {
    background: #0b1329;
    border: 2px solid #1e293b;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  video {
    width: 100%;
    border-radius: 6px;
    background: #000;
  }
  .btn-download {
    background: #10b981;
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .playlist {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .playlist-btn {
    background: #111e38;
    border: 1px solid #1e293b;
    color: #93c5fd;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
  }
  .playlist-btn.active {
    border-color: #38bdf8;
    background: #1e293b;
    color: #fff;
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- ROW 1: BOOK SALES -->
  <div class="books-grid">
    <div class="book-card">
      <img src="https://via.placeholder.com/120x160/7f1d1d/ffffff?text=Vol+1" alt="Vol 1" />
      <h4>Vol. 1 - Father to Son</h4>
      <button class="btn-buy" onclick="window.open('https://payhip.com', '_blank')">BUY VOL. 1</button>
    </div>
    <div class="book-card">
      <img src="https://via.placeholder.com/120x160/1e3a8a/ffffff?text=Vol+2" alt="Vol 2" />
      <h4>Vol. 2 - Cousins of Courage</h4>
      <button class="btn-buy" onclick="window.open('https://payhip.com', '_blank')">BUY VOL. 2</button>
    </div>
    <div class="book-card">
      <img src="https://via.placeholder.com/120x160/064e3b/ffffff?text=Vol+3" alt="Vol 3" />
      <h4>Vol. 3 - The Colbert Legacy</h4>
      <button class="btn-buy" onclick="window.open('https://payhip.com', '_blank')">BUY VOL. 3</button>

  <div class="screen-card">

    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="480" height="300"></canvas>
    </div>

    <!-- DYNAMIC CONTROLS PER GAME -->
    
    <!-- 1. VANGUARD CONTROLS -->
    <div id="vanguard-controls">

      <div class="champions-grid">
        <button class="champ-btn active" onclick="selectChamp('inez')">Inez & Tweet<small>Twin Sister Tag</small></button>
        <button class="champ-btn" onclick="selectChamp('elroy')">Elroy Rhodes<small>Delta Heavy</small></button>
        <button class="champ-btn" onclick="selectChamp('bear')">Uncle Bear<small>Maroon Shock</small></button>
        <button class="champ-btn" onclick="selectChamp('aaron')">Uncle Aaron<small>Pioneer Volley</small></button>
        <button class="champ-btn" onclick="selectChamp('fanny')">Fanny May<small>Coincoin Barrier</small></button>
        <button class="champ-btn" onclick="selectChamp('tp')">TP Mitchell<small>Lineage Beam</small></button>
      </div>
      <div class="action-grid">
        <button class="act-btn" id="btn-left">◀ LEFT</button>

    <!-- 2. BATTLESHIP CONTROLS -->
    <div id="battleship-controls" style="display: none;">

      <div class="naval-grid">
        <button class="naval-btn" id="btn-nav-cannon">CANNON<small>HEAVY SHELL</small></button>
        <button class="naval-btn" id="btn-nav-torp">TORPEDO<small>SURFACE/SUB</small></button>
        <button class="naval-btn warning" id="btn-nav-ciws">CIWS<small>FLAK DEFENSE</small></button>

  </div>

  <!-- ROW 4: ANCESTRAL VIDEO HUB -->
  <div class="video-card">

      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support video streaming.
    </video>
    <a href="#" id="downloadBtn" class="btn-download" download>📥 DOWNLOAD VIDEO</a>
    
    <div class="playlist">
      <button class="playlist-btn active" onclick="loadVideo(0, this)">1. Origins & The Tree of Lineage</button>
      <button class="playlist-btn" onclick="loadVideo(1, this)">2. Cousins of Courage Documentary</button>
      <button class="playlist-btn" onclick="loadVideo(2, this)">3. The Colbert Legacy Historical Feature</button>
    </div>
  </div>

</div>

<script>
// --- AUDIO ENGINE ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
  },
  tone(freq, type='sine', decay=0.15) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + decay);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + decay);
    } catch(e) {}
  }
};

// --- GAME HUB ROUTER ---
let currentGame = 'VANGUARD';
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function switchGame(gameKey) {
  AudioEngine.init();
  currentGame = gameKey;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('vanguard-controls').style.display = 'none';
  document.getElementById('battleship-controls').style.display = 'none';
  document.getElementById('isaac-controls').style.display = 'none';

  if (gameKey === 'VANGUARD') {
    document.getElementById('tab-vanguard').classList.add('active');
    document.getElementById('vanguard-controls').style.display = 'block';
  } else if (gameKey === 'BATTLESHIP') {
    document.getElementById('tab-battleship').classList.add('active');
    document.getElementById('battleship-controls').style.display = 'block';
  } else if (gameKey === 'ISAAC') {
    document.getElementById('tab-isaac').classList.add('active');
    document.getElementById('isaac-controls').style.display = 'block';
  }
  resetGameStats();
}

function resetGameStats() {
  score = 0;
  hull = 100;
  document.getElementById('stat-score').innerText = score;
  document.getElementById('stat-life').innerText = hull + '%';
  document.getElementById('stat-wave').innerText = currentGame === 'VANGUARD' ? '8/8' : '1';
}

// --- SHARED STATS ---
let score = 0;
let hull = 100;

// --- VANGUARD ENGINE ---
let hero = { x: 80, y: 220, vx: 0, vy: 0, w: 16, h: 28, onGround: true };
let boss = { x: 380, y: 200, w: 26, h: 48, hp: 100, maxHp: 100 };
let vanguardProjectiles = [];

function selectChamp(champ) {
  AudioEngine.init();
  AudioEngine.tone(440, 'triangle');
  document.querySelectorAll('.champ-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function updateVanguard() {
  hero.x += hero.vx;
  hero.y += hero.vy;
  if (hero.y < 220) hero.vy += 0.4;
  else { hero.y = 220; hero.vy = 0; hero.onGround = true; }

  hero.x = Math.max(20, Math.min(440, hero.x));

  vanguardProjectiles.forEach((p, i) => {
    p.x += p.vx;
    if (p.x > boss.x && p.x < boss.x + boss.w && p.y > boss.y && p.y < boss.y + boss.h) {
      boss.hp -= 4;
      score += 100;
      vanguardProjectiles.splice(i, 1);
      AudioEngine.tone(200, 'square', 0.1);
    }
  });

  document.getElementById('stat-score').innerText = score;
  document.getElementById('stat-life').innerText = Math.max(0, boss.hp) + '% (BOSS)';
}

function drawVanguard() {
  // Pillars & Levant theme
  ctx.fillStyle = '#0a0d24';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 40; i < canvas.width; i += 70) {
    ctx.fillStyle = '#141c3d';
    ctx.fillRect(i, 40, 30, 210);
  }
  // Floor
  ctx.fillStyle = '#78350f';
  ctx.fillRect(0, 248, canvas.width, 52);

  // Hero
  ctx.fillStyle = '#ec4899';
  ctx.fillRect(hero.x, hero.y - 10, hero.w, hero.h);
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(hero.x + 8, hero.y - 16, 5, 0, Math.PI * 2);
  ctx.fill();

  // Boss
  ctx.fillStyle = '#b91c1c';
  ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(boss.x + 6, boss.y - 12, 14, 12);

  // Projectiles
  ctx.fillStyle = '#38bdf8';
  vanguardProjectiles.forEach(p => ctx.fillRect(p.x, p.y, 8, 4));
}

// --- BATTLESHIP ENGINE (WITH FIXED TORPEDO HITBOXES) ---
const WATER_LINE = 190;
let bShip = { x: 40, y: WATER_LINE - 22, w: 90, h: 22 };
let bShells = [];
let bTorpedoes = [];
let bCIWS = [];
let bJets = [];
let bBombs = [];
let bEnemies = [];
let bMissiles = [];
let airCooldown = 0;

function fireNavalCannon(targetX = 350, targetY = WATER_LINE) {
  AudioEngine.tone(120, 'square', 0.3);
  const mx = bShip.x + bShip.w;
  const my = bShip.y + 6;
  const dx = targetX - mx;
  const dy = targetY - my;
  const dist = Math.hypot(dx, dy);
  bShells.push({ x: mx, y: my, vx: (dx/dist)*10, vy: (dy/dist)*10 - 2, grav: 0.12 });
}

function fireNavalTorpedo() {
  AudioEngine.tone(280, 'sine', 0.2);
  bTorpedoes.push({
    x: bShip.x + bShip.w - 10,
    y: WATER_LINE + 12,
    vx: 3.2,
    w: 16,
    h: 5
  });
}

function fireNavalCIWS() {
  AudioEngine.tone(700, 'sawtooth', 0.05);
  const gx = bShip.x + 30;
  const gy = bShip.y;
  let target = bMissiles[0];
  let angle = target ? Math.atan2(target.y - gy, target.x - gx) : -Math.PI / 4;
  bCIWS.push({ x: gx, y: gy, vx: Math.cos(angle)*14, vy: Math.sin(angle)*14, life: 25 });
}

function callNavalAirStrike() {
  if (airCooldown > 0) return;
  airCooldown = 500;
  AudioEngine.tone(160, 'sawtooth', 0.6);
  for (let i = 0; i < 2; i++) {
    bJets.push({ x: -60 - (i * 60), y: 30 + (i * 20), vx: 8, dropped: 0 });
  }
}

function updateBattleship() {
  if (airCooldown > 0) {
    airCooldown--;
    document.getElementById('air-status').innerText = airCooldown > 0 ? `${Math.ceil(airCooldown/60)}s` : 'READY';
  }

  // Shells
  bShells.forEach((s, idx) => {
    s.x += s.vx; s.y += s.vy; s.vy += s.grav;
    bEnemies.forEach((e, eIdx) => {
      if (s.x >= e.x && s.x <= e.x + e.w && s.y >= e.y && s.y <= e.y + e.h) {
        e.hp -= 2; bShells.splice(idx, 1);
        if (e.hp <= 0) { bEnemies.splice(eIdx, 1); score += 150; }
      }
    });
    if (s.y > WATER_LINE + 10) bShells.splice(idx, 1);
  });

  // Torpedoes: NOW COLLIDES WITH BOTH SURFACE SHIPS AND SUBS
  bTorpedoes.forEach((t, idx) => {
    t.x += t.vx;
    bEnemies.forEach((e, eIdx) => {
      // Extended water depth check to ensure torpedo wakes strike enemy ship hulls
      const strikesSub = (e.type === 'sub' && t.x >= e.x && t.x <= e.x + e.w && t.y >= e.y - 10 && t.y <= e.y + e.h + 10);
      const strikesShipHull = (e.type !== 'sub' && t.x >= e.x && t.x <= e.x + e.w && t.y >= WATER_LINE);

      if (strikesSub || strikesShipHull) {
        e.hp -= 5;
        bTorpedoes.splice(idx, 1);
        AudioEngine.tone(100, 'square', 0.2);
        if (e.hp <= 0) { bEnemies.splice(eIdx, 1); score += 200; }
      }
    });
    if (t.x > canvas.width) bTorpedoes.splice(idx, 1);
  });

  // CIWS
  bCIWS.forEach((c, idx) => {
    c.x += c.vx; c.y += c.vy; c.life--;
    bMissiles.forEach((m, mIdx) => {
      if (Math.hypot(c.x - m.x, c.y - m.y) < 14) {
        bMissiles.splice(mIdx, 1);
        bCIWS.splice(idx, 1);
        score += 50;
      }
    });
    if (c.life <= 0) bCIWS.splice(idx, 1);
  });

  // Jets & Bombs
  bJets.forEach((j, idx) => {
    j.x += j.vx;
    if (j.x > 180 && j.dropped < 2 && Math.random() > 0.5) {
      j.dropped++;
      bBombs.push({ x: j.x, y: j.y + 10, vx: 3, vy: 2 });
    }
    if (j.x > canvas.width + 80) bJets.splice(idx, 1);
  });

  bBombs.forEach((b, idx) => {
    b.x += b.vx; b.y += b.vy; b.vy += 0.2;
    bEnemies.forEach((e, eIdx) => {
      if (b.x >= e.x && b.x <= e.x + e.w && b.y >= e.y && b.y <= e.y + e.h + 10) {
        e.hp -= 4; bBombs.splice(idx, 1);
        if (e.hp <= 0) { bEnemies.splice(eIdx, 1); score += 180; }
      }
    });
    if (b.y >= WATER_LINE) bBombs.splice(idx, 1);
  });

  // Enemy spawning
  if (Math.random() < 0.015 && bEnemies.length < 4) {
    const isSub = Math.random() > 0.5;
    bEnemies.push({
      type: isSub ? 'sub' : 'ship',
      x: canvas.width + 20,
      y: isSub ? WATER_LINE + 15 + Math.random() * 30 : WATER_LINE - 18,
      w: isSub ? 40 : 55,
      h: 16,
      hp: 3,
      speed: 0.8,
      lastShot: Date.now()
    });
  }

  bEnemies.forEach(e => {
    e.x -= e.speed;
    if (e.type === 'ship' && Date.now() - e.lastShot > 3500) {
      e.lastShot = Date.now();
      bMissiles.push({ x: e.x, y: e.y, vx: -3, vy: -1.8, grav: 0.04 });
    }
  });

  bMissiles.forEach((m, idx) => {
    m.x += m.vx; m.y += m.vy; m.vy += m.grav;
    if (m.x >= bShip.x && m.x <= bShip.x + bShip.w && m.y >= bShip.y) {
      hull -= 10;
      bMissiles.splice(idx, 1);
    }
    if (m.y > WATER_LINE + 10 || m.x < 0) bMissiles.splice(idx, 1);
  });

  document.getElementById('stat-score').innerText = score;
  document.getElementById('stat-life').innerText = Math.max(0, hull) + '%';
  document.getElementById('stat-wave').innerText = 'NAVAL';
}

function drawBattleship() {
  // Sea & Sky
  ctx.fillStyle = '#091322';
  ctx.fillRect(0, 0, canvas.width, WATER_LINE);
  ctx.fillStyle = '#0369a1';
  ctx.fillRect(0, WATER_LINE, canvas.width, canvas.height - WATER_LINE);

  // Battleship Hull
  ctx.fillStyle = '#475569';
  ctx.beginPath();
  ctx.moveTo(bShip.x, bShip.y + 4);
  ctx.lineTo(bShip.x + 10, bShip.y + bShip.h);
  ctx.lineTo(bShip.x + bShip.w - 10, bShip.y + bShip.h);
  ctx.lineTo(bShip.x + bShip.w, bShip.y + 4);
  ctx.fill();

  // Deck Superstructure & Guns
  ctx.fillStyle = '#64748b';
  ctx.fillRect(bShip.x + 25, bShip.y - 12, 30, 12);
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bShip.x + bShip.w - 15, bShip.y + 4); ctx.lineTo(bShip.x + bShip.w + 8, bShip.y); ctx.stroke();

  // Enemies
  bEnemies.forEach(e => {
    ctx.fillStyle = e.type === 'sub' ? '#1e293b' : '#991b1b';
    ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  // Missiles
  ctx.fillStyle = '#ef4444';
  bMissiles.forEach(m => ctx.fillRect(m.x, m.y, 7, 3));

  // Torpedoes
  ctx.fillStyle = '#38bdf8';
  bTorpedoes.forEach(t => {
    ctx.fillRect(t.x, t.y, t.w, t.h);
    // Bubble trail
    ctx.fillStyle = '#e0f2fe';
    ctx.fillRect(t.x - 4, t.y + 1, 2, 2);
  });

  // CIWS
  ctx.fillStyle = '#fde047';
  bCIWS.forEach(c => ctx.fillRect(c.x, c.y, 4, 4));

  // Jets & Bombs
  ctx.fillStyle = '#cbd5e1';
  bJets.forEach(j => ctx.fillRect(j.x, j.y, 22, 6));
  ctx.fillStyle = '#f97316';
  bBombs.forEach(b => ctx.fillRect(b.x, b.y, 4, 4));

  // Shells
  ctx.fillStyle = '#fbbf24';
  bShells.forEach(s => ctx.fillRect(s.x, s.y, 4, 4));
}

// --- ISAAC QUEST ENGINE ---
let isaac = { x: 50, y: 220, vx: 0, vy: 0 };
function updateIsaac() {
  isaac.x = (isaac.x + 1) % canvas.width;
}
function drawIsaac() {
  ctx.fillStyle = '#064e3b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#10b981';
  ctx.fillRect(0, 240, canvas.width, 60);
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(isaac.x, 215, 20, 25);
  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.fillText('ISAAC RHODES EXPEDITION', 20, 30);
}

// --- MASTER LOOP ---
function mainLoop() {
  if (currentGame === 'VANGUARD') {
    updateVanguard();
    drawVanguard();
  } else if (currentGame === 'BATTLESHIP') {
    updateBattleship();
    drawBattleship();
  } else if (currentGame === 'ISAAC') {
    updateIsaac();
    drawIsaac();
  }
  requestAnimationFrame(mainLoop);
}

// --- BUTTON BINDS ---
// Vanguard
document.getElementById('btn-left').onpointerdown = () => hero.vx = -3;
document.getElementById('btn-left').onpointerup = () => hero.vx = 0;
document.getElementById('btn-right').onpointerdown = () => hero.vx = 3;
document.getElementById('btn-right').onpointerup = () => hero.vx = 0;
document.getElementById('btn-jump').onclick = () => { if(hero.onGround) { hero.vy = -8; hero.onGround = false; } };
document.getElementById('btn-atk').onclick = () => {
  AudioEngine.init();
  vanguardProjectiles.push({ x: hero.x + 16, y: hero.y, vx: 7 });
};
document.getElementById('btn-burst').onclick = () => {
  AudioEngine.init();
  for(let i = -1; i <= 1; i++) {
    vanguardProjectiles.push({ x: hero.x + 16, y: hero.y + (i*8), vx: 9 });
  }
};

// Battleship
document.getElementById('btn-nav-cannon').onclick = () => fireNavalCannon();
document.getElementById('btn-nav-torp').onclick = () => fireNavalTorpedo();
document.getElementById('btn-nav-ciws').onclick = () => fireNavalCIWS();
document.getElementById('btn-nav-air').onclick = () => callNavalAirStrike();

];
function loadVideo(idx, btn) {
  document.querySelectorAll('.playlist-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const player = document.getElementById('videoPlayer');
  const src = document.getElementById('videoSource');
  const dload = document.getElementById('downloadBtn');
  src.src = videos[idx];
  dload.href = videos[idx];
  player.load();
}
