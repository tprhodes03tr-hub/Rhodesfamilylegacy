<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rhodes Family Legacy - Arcade & Publications</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #151d30;
      --card-bg: #1c2640;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff0055;
      --neon-yellow: #ffe600;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    .hub-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Game Selector Menu */
    .game-nav {
      display: flex;
      gap: 8px;
      background: var(--panel-bg);
      padding: 6px;
      border-radius: 12px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    .nav-btn {
      flex: 1;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: linear-gradient(180deg, #2b395e 0%, #1a233a 100%);
      color: var(--neon-cyan);
      box-shadow: 0 2px 8px rgba(0, 240, 255, 0.25), inset 0 1px 1px rgba(255,255,255,0.2);
    }

    /* Arcade Screen Frame */
    .arcade-cabinet {
      background: linear-gradient(145deg, #1e2842, #111726);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.15);
      border: 1px solid #2d3b5e;
    }

    .arcade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.9), 0 0 10px rgba(0, 240, 255, 0.15);
      border: 2px solid #222d47;
    }

    canvas {
      display: block;
      width: 100%;
      height: 320px;
      touch-action: none;
    }

    /* 3D Controller Panel */
    .controller-panel {
      background: linear-gradient(180deg, #171f33 0%, #0e1320 100%);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #253352;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      touch-action: none;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 42px);
      gap: 4px;
    }

    .ctrl-btn {
      background: linear-gradient(145deg, #2a3759, #1a2238);
      border: 1px solid #3c4f7c;
      border-radius: 10px;
      color: var(--neon-cyan);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #0f1422, 0 5px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      touch-action: none;
    }

    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f1422, 0 2px 4px rgba(0,0,0,0.5);
      background: #1a2238;
    }

    .action-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff527b, #c40037 70%);
      border: 2px solid #ff7597;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 0 #6e001c, 0 10px 18px rgba(255, 0, 85, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #6e001c, 0 4px 8px rgba(255, 0, 85, 0.4);
    }

    /* Book Section */
    .publications-section {
      margin-top: 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .book-card {
      background: linear-gradient(145deg, #192238, #121827);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      border: 1px solid #2b395d;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .book-card:active {
      transform: scale(0.98);
    }

    .book-thumbnail {
      width: 64px;
      height: 90px;
      border-radius: 6px;
      background: linear-gradient(135deg, #1b355a, #0b1728);
      border: 1px solid #3c5485;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-align: center;
      padding: 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      object-fit: cover;
    }

    .book-info h3 {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
    }

    .book-info h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--neon-yellow);
      margin-bottom: 6px;
    }

    .book-info p {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="hub-container">
    <!-- Game Switcher Tabs -->
    <div class="game-nav">
      <button class="nav-btn active" onclick="switchGame('pacman')">Ms. Pac-Man</button>
      <button class="nav-btn" onclick="switchGame('frogger')">Frogger</button>
      <button class="nav-btn" onclick="switchGame('jumper')">Jumper</button>
    </div>

    <!-- Arcade Cabinet Screen -->
    <div class="arcade-cabinet">
      <div class="arcade-header">
        <span id="scoreDisplay">SCORE: 0</span>
        <span id="statusDisplay">LEVEL 1</span>
      </div>
      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="360" height="320"></canvas>
      </div>
    </div>

    <!-- Touch Controller -->
    <div class="controller-panel">
      <div class="dpad">
        <div></div>
        <button class="ctrl-btn" id="btnUp">▲</button>
        <div></div>
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn" id="btnDown">▼</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
      </div>
      <div class="action-container">
        <button class="action-btn" id="btnAction">ACTION</button>
      </div>
    </div>

    <!-- Book Publication Link -->
    <div class="publications-section">
      <div class="section-label">Published Volumes</div>
      <a href="https://payhip.com/Rhodesfamilylegacy" target="_blank" class="book-card">
        <div class="book-thumbnail">PACKED IN THE MARROW</div>
        <div class="book-info">
          <h3>Packed in the Marrow</h3>
          <h4>A Saga of Exile and Endurance</h4>
          <p>The documented lineage and endurance from ancient origins through historical diaspora. Tap to view on store.</p>
        </div>
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const statusDisplay = document.getElementById('statusDisplay');

    let currentGame = 'pacman';
    let score = 0;
    let animId = null;

    // --- GAME SWITCHER ---
    function switchGame(gameType) {
      currentGame = gameType;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      score = 0;
      initCurrentGame();
    }

    // ==========================================
    // 1. MS. PAC-MAN ARCADE ENGINE (Tile/Grid Based)
    // ==========================================
    const GRID_SIZE = 16;
    const PAC_MAP = [
      "######################",
      "#..........##........#",
      "#.####.###.##.###.##.#",
      "#o####.###.##.###.##o#",
      "#.####.###.##.###.##.#",
      "#....................#",
      "#.####.##.######.###.#",
      "#......##...##...###.#",
      "######.#### ## ######",
      "     #.##   G  ##     ",
      "######.## #### ## ####",
      "#..........##........#",
      "#.####.###.##.###.####",
      "#o..##............##o#",
      "###.##.##.######.###.#",
      "#......##...##.......#",
      "######################"
    ];

    let pacman = { x: 1, y: 1, dirX: 0, dirY: 0, nextDirX: 0, nextDirY: 0, mouth: 0.2, mouthSpeed: 0.03 };
    let ghost = { x: 10, y: 9, dirX: 1, dirY: 0 };
    let dots = [];

    function initPacman() {
      dots = [];
      for (let r = 0; r < PAC_MAP.length; r++) {
        for (let c = 0; c < PAC_MAP[r].length; c++) {
          if (PAC_MAP[r][c] === '.') dots.push({ x: c, y: r, big: false });
          if (PAC_MAP[r][c] === 'o') dots.push({ x: c, y: r, big: true });
        }
      }
      pacman.x = 1; pacman.y = 1; pacman.dirX = 1; pacman.dirY = 0;
      pacman.nextDirX = 1; pacman.nextDirY = 0;
      ghost.x = 10; ghost.y = 9;
    }

    function isWall(gx, gy) {
      if (gy < 0 || gy >= PAC_MAP.length || gx < 0 || gx >= PAC_MAP[0].length) return true;
      return PAC_MAP[gy][gx] === '#';
    }

    function updatePacman() {
      // Direction change at cell boundary
      if (Number.isInteger(pacman.x) && Number.isInteger(pacman.y)) {
        if (!isWall(pacman.x + pacman.nextDirX, pacman.y + pacman.nextDirY)) {
          pacman.dirX = pacman.nextDirX;
          pacman.dirY = pacman.nextDirY;
        }
        if (isWall(pacman.x + pacman.dirX, pacman.y + pacman.dirY)) {
          pacman.dirX = 0;
          pacman.dirY = 0;
        }
      }

      pacman.x += pacman.dirX * 0.125;
      pacman.y += pacman.dirY * 0.125;
      pacman.x = Math.round(pacman.x * 1000) / 1000;
      pacman.y = Math.round(pacman.y * 1000) / 1000;

      // Eat dots
      const px = Math.round(pacman.x);
      const py = Math.round(pacman.y);
      const dotIdx = dots.findIndex(d => d.x === px && d.y === py);
      if (dotIdx !== -1) {
        score += dots[dotIdx].big ? 50 : 10;
        dots.splice(dotIdx, 1);
        scoreDisplay.innerText = `SCORE: ${score}`;
        if (dots.length === 0) initPacman();
      }

      // Simple Ghost AI
      if (Math.random() < 0.05) {
        const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
        const valid = dirs.filter(d => !isWall(Math.round(ghost.x + d.x), Math.round(ghost.y + d.y)));
        if (valid.length > 0) {
          const chosen = valid[Math.floor(Math.random() * valid.length)];
          ghost.dirX = chosen.x; ghost.dirY = chosen.y;
        }
      }
      ghost.x += ghost.dirX * 0.06;
      ghost.y += ghost.dirY * 0.06;

      // Ghost collision
      if (Math.hypot(pacman.x - ghost.x, pacman.y - ghost.y) < 0.6) {
        initPacman();
      }
    }

    function renderPacman() {
      ctx.fillStyle = "#000814";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const offsetX = 5;
      const offsetY = 15;

      // Draw Walls with 3D Neon Bevel
      for (let r = 0; r < PAC_MAP.length; r++) {
        for (let c = 0; c < PAC_MAP[r].length; c++) {
          if (PAC_MAP[r][c] === '#') {
            ctx.fillStyle = "#16284f";
            ctx.fillRect(offsetX + c * GRID_SIZE, offsetY + r * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 1;
            ctx.strokeRect(offsetX + c * GRID_SIZE + 1, offsetY + r * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
          }
        }
      }

      // Draw Dots
      dots.forEach(d => {
        ctx.fillStyle = d.big ? "#ffe600" : "#ffb8de";
        ctx.beginPath();
        ctx.arc(offsetX + d.x * GRID_SIZE + GRID_SIZE/2, offsetY + d.y * GRID_SIZE + GRID_SIZE/2, d.big ? 4 : 2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Ms. Pac-Man (Yellow body + Pink bow)
      const pmX = offsetX + pacman.x * GRID_SIZE + GRID_SIZE/2;
      const pmY = offsetY + pacman.y * GRID_SIZE + GRID_SIZE/2;
      ctx.fillStyle = "#ffe600";
      ctx.beginPath();
      let angle = 0;
      if (pacman.dirX === -1) angle = Math.PI;
      if (pacman.dirY === 1) angle = Math.PI / 2;
      if (pacman.dirY === -1) angle = -Math.PI / 2;

      pacman.mouth += pacman.mouthSpeed;
      if (pacman.mouth > 0.4 || pacman.mouth < 0.05) pacman.mouthSpeed = -pacman.mouthSpeed;

      ctx.arc(pmX, pmY, GRID_SIZE/2 - 1, angle + pacman.mouth, angle + Math.PI * 2 - pacman.mouth);
      ctx.lineTo(pmX, pmY);
      ctx.fill();

      // Pink Bow
      ctx.fillStyle = "#ff0077";
      ctx.beginPath();
      ctx.arc(pmX - 2, pmY - 6, 2.5, 0, Math.PI * 2);
      ctx.arc(pmX + 2, pmY - 6, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Draw Ghost
      const gx = offsetX + ghost.x * GRID_SIZE + GRID_SIZE/2;
      const gy = offsetY + ghost.y * GRID_SIZE + GRID_SIZE/2;
      ctx.fillStyle = "#ff0055";
      ctx.beginPath();
      ctx.arc(gx, gy - 2, GRID_SIZE/2 - 1, Math.PI, 0, false);
      ctx.lineTo(gx + GRID_SIZE/2 - 1, gy + 6);
      ctx.lineTo(gx - GRID_SIZE/2 + 1, gy + 6);
      ctx.fill();
    }

    // ==========================================
    // 2. FROGGER / LEAP FROG ENGINE
    // ==========================================
    let frog = { x: 160, y: 280, size: 20 };
    let obstacles = [];

    function initFrogger() {
      frog = { x: 160, y: 280, size: 20 };
      obstacles = [
        // Logs (Water)
        { x: 0, y: 60, w: 70, h: 22, speed: 1.5, type: 'log' },
        { x: 140, y: 60, w: 70, h: 22, speed: 1.5, type: 'log' },
        { x: 280, y: 100, w: 80, h: 22, speed: -1.8, type: 'log' },
        { x: 80, y: 100, w: 80, h: 22, speed: -1.8, type: 'log' },
        // Cars (Road)
        { x: 0, y: 180, w: 32, h: 20, speed: 2.2, type: 'car', color: '#ff3366' },
        { x: 160, y: 180, w: 32, h: 20, speed: 2.2, type: 'car', color: '#ff3366' },
        { x: 240, y: 220, w: 40, h: 20, speed: -1.4, type: 'car', color: '#00f0ff' }
      ];
    }

    function updateFrogger() {
      obstacles.forEach(o => {
        o.x += o.speed;
        if (o.speed > 0 && o.x > canvas.width) o.x = -o.w;
        if (o.speed < 0 && o.x < -o.w) o.x = canvas.width;
      });

      // Check Road Collision
      obstacles.filter(o => o.type === 'car').forEach(car => {
        if (frog.x < car.x + car.w && frog.x + frog.size > car.x &&
            frog.y < car.y + car.h && frog.y + frog.size > car.y) {
          initFrogger();
        }
      });

      // Check Water / Log Riding
      if (frog.y >= 50 && frog.y <= 130) {
        let onLog = false;
        obstacles.filter(o => o.type === 'log').forEach(log => {
          if (frog.x + frog.size/2 > log.x && frog.x + frog.size/2 < log.x + log.w &&
              frog.y + frog.size/2 > log.y && frog.y + frog.size/2 < log.y + log.h) {
            onLog = true;
            frog.x += log.speed;
          }
        });
        if (!onLog) initFrogger(); // Fell in river
      }

      // Reached Goal
      if (frog.y < 40) {
        score += 100;
        scoreDisplay.innerText = `SCORE: ${score}`;
        frog.y = 280;
      }
    }

    function renderFrogger() {
      ctx.fillStyle = "#0a0e17";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // River Zone
      ctx.fillStyle = "#0c2847";
      ctx.fillRect(0, 50, canvas.width, 90);

      // Road Zone
      ctx.fillStyle = "#181e2b";
      ctx.fillRect(0, 160, canvas.width, 100);

      // Goal Zone
      ctx.fillStyle = "#1e3a29";
      ctx.fillRect(0, 0, canvas.width, 50);

      // Draw Obstacles with 3D gradient
      obstacles.forEach(o => {
        if (o.type === 'log') {
          ctx.fillStyle = "#6d4327";
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillStyle = "#8a5732";
          ctx.fillRect(o.x + 2, o.y + 2, o.w - 4, 4);
        } else {
          ctx.fillStyle = o.color;
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillStyle = "#fff";
          ctx.fillRect(o.x + 4, o.y + 3, 6, 4);
        }
      });

      // Draw Frog
      ctx.fillStyle = "#00ff88";
      ctx.fillRect(frog.x, frog.y, frog.size, frog.size);
      ctx.fillStyle = "#fff";
      ctx.fillRect(frog.x + 3, frog.y + 3, 4, 4);
      ctx.fillRect(frog.x + 13, frog.y + 3, 4, 4);
    }

    // ==========================================
    // 3. PLATFORM JUMPER ENGINE
    // ==========================================
    let jumper = { x: 50, y: 200, vx: 0, vy: 0, size: 18, grounded: false };
    let platforms = [
      { x: 30, y: 260, w: 80, h: 10 },
      { x: 140, y: 210, w: 90, h: 10 },
      { x: 60, y: 150, w: 80, h: 10 },
      { x: 210, y: 120, w: 90, h: 10 },
      { x: 110, y: 60, w: 80, h: 10 }
    ];
    let orbs = [
      { x: 70, y: 230, collected: false },
      { x: 180, y: 180, collected: false },
      { x: 100, y: 120, collected: false },
      { x: 250, y: 90, collected: false },
      { x: 150, y: 30, collected: false }
    ];

    function initJumper() {
      jumper.x = 50; jumper.y = 220; jumper.vx = 0; jumper.vy = 0;
      orbs.forEach(o => o.collected = false);
    }

    function updateJumper() {
      jumper.vy += 0.45; // Gravity
      jumper.x += jumper.vx;
      jumper.y += jumper.vy;
      jumper.grounded = false;

      // Platform collision
      platforms.forEach(p => {
        if (jumper.x + jumper.size > p.x && jumper.x < p.x + p.w &&
            jumper.y + jumper.size >= p.y && jumper.y + jumper.size <= p.y + p.h + 8 &&
            jumper.vy >= 0) {
          jumper.y = p.y - jumper.size;
          jumper.vy = 0;
          jumper.grounded = true;
        }
      });

      // Bottom screen reset
      if (jumper.y > canvas.height) initJumper();

      // Collect Orbs
      orbs.forEach(o => {
        if (!o.collected && Math.hypot((jumper.x + 9) - o.x, (jumper.y + 9) - o.y) < 16) {
          o.collected = true;
          score += 25;
          scoreDisplay.innerText = `SCORE: ${score}`;
        }
      });
    }

    function renderJumper() {
      ctx.fillStyle = "#0c101c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Platforms with 3D edge glow
      platforms.forEach(p => {
        ctx.fillStyle = "#202d4a";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(p.x, p.y, p.w, 2);
      });

      // Glowing Orbs
      orbs.forEach(o => {
        if (!o.collected) {
          ctx.fillStyle = "#00f0ff";
          ctx.beginPath();
          ctx.arc(o.x, o.y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 10;
          ctx.shadowColor = "#00f0ff";
        }
      });
      ctx.shadowBlur = 0;

      // Player Box (Glowing Amber)
      ctx.fillStyle = "#ffb703";
      ctx.fillRect(jumper.x, jumper.y, jumper.size, jumper.size);
      ctx.fillStyle = "#fff";
      ctx.fillRect(jumper.x + 3, jumper.y + 3, 5, 5);
    }

    // ==========================================
    // UNIFIED CONTROLLER & GAME LOOP
    // ==========================================
    function handleInput(action) {
      if (currentGame === 'pacman') {
        if (action === 'up') { pacman.nextDirX = 0; pacman.nextDirY = -1; }
        if (action === 'down') { pacman.nextDirX = 0; pacman.nextDirY = 1; }
        if (action === 'left') { pacman.nextDirX = -1; pacman.nextDirY = 0; }
        if (action === 'right') { pacman.nextDirX = 1; pacman.nextDirY = 0; }
      } else if (currentGame === 'frogger') {
        if (action === 'up') frog.y -= 25;
        if (action === 'down') frog.y += 25;
        if (action === 'left') frog.x -= 20;
        if (action === 'right') frog.x += 20;
      } else if (currentGame === 'jumper') {
        if (action === 'left') jumper.vx = -3;
        if (action === 'right') jumper.vx = 3;
        if (action === 'action' || action === 'up') {
          if (jumper.grounded) jumper.vy = -9;
        }
      }
    }

    function stopInput() {
      if (currentGame === 'jumper') jumper.vx = 0;
    }

    // Touch Event Binding
    function bindBtn(id, action) {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleInput(action); });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); stopInput(); });
    }

    bindBtn('btnUp', 'up');
    bindBtn('btnDown', 'down');
    bindBtn('btnLeft', 'left');
    bindBtn('btnRight', 'right');
    bindBtn('btnAction', 'action');

    function initCurrentGame() {
      if (currentGame === 'pacman') initPacman();
      if (currentGame === 'frogger') initFrogger();
      if (currentGame === 'jumper') initJumper();
    }

    function gameLoop() {
      if (currentGame === 'pacman') { updatePacman(); renderPacman(); }
      if (currentGame === 'frogger') { updateFrogger(); renderFrogger(); }
      if (currentGame === 'jumper') { updateJumper(); renderJumper(); }
      animId = requestAnimationFrame(gameLoop);
    }

    // Start App
    initPacman();
    gameLoop();
  </script>
</body>
</html>
