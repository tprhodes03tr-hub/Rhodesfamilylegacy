<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy - Ancestral Vanguard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #05050b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 1. Book Showcase Bar */
    .book-showcase {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: #0f1020;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #232542;
    }

    .book-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      text-decoration: none;
    }

    .book-cover-img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #d4af37;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      background: #1a1a2e;
    }

    .buy-btn {
      margin-top: 6px;
      width: 100%;
      text-align: center;
      background: #e67e22;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 6px 0;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    /* 2. Game HUD & Stage */
    .game-wrapper {
      background: #0a0b16;
      border: 2px solid #e67e22;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #080913;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 1px solid #232542;
    }

    .hud-stat {
      color: #00f0ff;
    }

    .hud-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }

    .meter-box {
      width: 65px;
      height: 10px;
      background: #252849;
      border-radius: 5px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      background: #00f0ff;
      width: 100%;
      transition: width 0.15s ease;
    }

    #gameCanvas {
      width: 100%;
      height: 280px;
      display: block;
      background: #000;
    }

    .chapter-banner {
      background: #121429;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #f39c12;
      padding: 6px 8px;
      letter-spacing: 0.5px;
      border-top: 1px solid #232542;
      border-bottom: 1px solid #232542;
    }

    /* 3. Champion Superpower Select */
    .section-label {
      text-align: center;
      color: #f1c40f;
      font-size: 11px;
      letter-spacing: 1px;
      margin: 8px 0 4px;
      font-weight: 700;
    }

    .champions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 0 8px 6px;
    }

    .champ-btn {
      background: #171932;
      border: 1px solid #2b2e59;
      color: #fff;
      padding: 6px 4px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .champ-btn.active {
      background: #0084ff;
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .champ-name {
      font-size: 11px;
      font-weight: bold;
    }

    .champ-power {
      font-size: 9px;
      color: #bdc3c7;
      margin-top: 2px;
    }

    /* 4. Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.1fr 1.2fr 1.3fr;
      gap: 5px;
      padding: 8px;
      background: #080914;
    }

    .ctrl-btn {
      background: #1f2347;
      color: #fff;
      border: 1px solid #373d78;
      border-radius: 6px;
      padding: 10px 0;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      background: #373d78;
    }

    .burst-btn {
      background: #c0392b;
      border-color: #e74c3c;
    }

    .burst-btn:active {
      background: #e74c3c;
    }

    /* 5. Video Hub */
    .video-hub-section {
      background: #0f1020;
      border-radius: 8px;
      border: 1px solid #232542;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-hub-title {
      text-align: center;
      color: #f1c40f;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .video-player {
      width: 100%;
      border-radius: 6px;
      background: #000;
      max-height: 230px;
    }

    .video-meta-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      background: #171932;
      padding: 8px 10px;
      border-radius: 6px;
    }

    #currentVideoTitle {
      font-size: 12px;
      font-weight: bold;
      color: #ecf0f1;
    }

    .dl-btn {
      background: #27ae60;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 11px;
      padding: 7px 14px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .video-playlist {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .playlist-btn {
      background: #171932;
      color: #bdc3c7;
      border: 1px solid #282c59;
      padding: 8px;
      font-size: 11px;
      border-radius: 4px;
      text-align: left;
      cursor: pointer;
    }

    .playlist-btn.active {
      border-color: #00f0ff;
      color: #fff;
      background: #202449;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. Books Bar (Volumes 1, 2, 3) -->
  <div class="book-showcase">
    <div class="book-card">
      <img src="8774.jpg" alt="Vol. 1 - From Father to Son" class="book-cover-img" />
      <a href="#" class="buy-btn">BUY VOL. 1</a>
    </div>
    <div class="book-card">
      <img src="8766.jpg" alt="Vol. 2 - Cousins of Courage" class="book-cover-img" />
      <a href="#" class="buy-btn">BUY VOL. 2</a>
    </div>
    <div class="book-card">
      <img src="8764.jpg" alt="Vol. 3 - The Colbert Legacy" class="book-cover-img" />
      <a href="#" class="buy-btn">BUY VOL. 3</a>
    </div>
  </div>

  <!-- 2. Game Canvas HUD & Area -->
  <div class="game-wrapper">
    <div class="hud-bar">
      <div class="hud-stat">SCORE: <span id="scoreVal">0</span></div>
      <div class="hud-meter">
        <span>HERO:</span>
        <div class="meter-box"><div id="hpFill" class="meter-fill"></div></div>
      </div>
      <div class="hud-stat" style="color:#f39c12">WAVE: [<span id="killsVal">0</span>/8]</div>
    </div>

    <canvas id="gameCanvas" width="480" height="280"></canvas>
    
    <div id="chapterBanner" class="chapter-banner">
      Chapter 8: The Levant • Ancient Stone Portals
    </div>

    <!-- 3. Champion Selector -->
    <div class="section-label">✦ SELECT ANCESTRAL CHAMPION & SUPERPOWER ✦</div>
    <div class="champions-grid">
      <button class="champ-btn active" onclick="setChampion(0)">
        <span class="champ-name">Inez & Tweet</span>
        <span class="champ-power">Twin Sister Tag</span>
      </button>
      <button class="champ-btn" onclick="setChampion(1)">
        <span class="champ-name">Elroy Rhodes</span>
        <span class="champ-power">Delta Heavy</span>
      </button>
      <button class="champ-btn" onclick="setChampion(2)">
        <span class="champ-name">Uncle Bear</span>
        <span class="champ-power">Maroon Shock</span>
      </button>
      <button class="champ-btn" onclick="setChampion(3)">
        <span class="champ-name">Uncle Aaron</span>
        <span class="champ-power">Pioneer Volley</span>
      </button>
      <button class="champ-btn" onclick="setChampion(4)">
        <span class="champ-name">Fanny May</span>
        <span class="champ-power">Coincoin Barrier</span>
      </button>
      <button class="champ-btn" onclick="setChampion(5)">
        <span class="champ-name">TP Mitchell</span>
        <span class="champ-power">Lineage Beam</span>
      </button>
    </div>

    <!-- 4. Onscreen Controller -->
    <div class="controls-grid">
      <button class="ctrl-btn" id="btnLeft">◄ LEFT</button>
      <button class="ctrl-btn" id="btnRight">RIGHT ►</button>
      <button class="ctrl-btn" id="btnJump">▲ JUMP</button>
      <button class="ctrl-btn" id="btnAttack">ATK/BOW</button>
      <button class="ctrl-btn burst-btn" id="btnBurst">BURST</button>
    </div>
  </div>

  <!-- 5. Ancestral Video Hub with Direct Video Downloads -->
  <section class="video-hub-section">
    <div class="video-hub-title">✦ ANCESTRAL VIDEO HUB ✦</div>
    <video id="ancestralVideoPlayer" class="video-player" controls playsinline>
      <source id="videoSource" src="video1.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    
    <div class="video-meta-bar">
      <span id="currentVideoTitle">1. Origins & The Tree of Lineage</span>
      <a id="downloadVideoBtn" href="video1.mp4" download="Origins_and_The_Tree.mp4" class="dl-btn">
        📥 DOWNLOAD VIDEO
      </a>
    </div>

    <div class="video-playlist">
      <button class="playlist-btn active" onclick="loadVideo('video1.mp4', '1. Origins & The Tree of Lineage', this)">
        1. Origins & The Tree of Lineage
      </button>
      <button class="playlist-btn" onclick="loadVideo('video2.mp4', '2. Cousins of Courage Documentary', this)">
        2. Cousins of Courage Documentary
      </button>
      <button class="playlist-btn" onclick="loadVideo('video3.mp4', '3. The Colbert Legacy Historical Feature', this)">
        3. The Colbert Legacy Historical Feature
      </button>
    </div>
  </section>

</div>

<script>
  /* --- Chapters Data --- */
  const CHAPTERS = [
    { title: "Chapter 8: The Levant • Ancient Stone Portals", bg: "#1f0036", pillar: "#380b5c", ground: "#5e1a99", moon: "#ffeaa7" },
    { title: "Chapter 9: The Mobile River Forge", bg: "#1a0f07", pillar: "#3d1f0f", ground: "#7a3e1d", moon: "#e67e22" },
    { title: "Chapter 10: The Heritage Citadel", bg: "#081b26", pillar: "#13334c", ground: "#1e5f74", moon: "#00f0ff" },
    { title: "Chapter 11: The Root & The Marrow", bg: "#001a14", pillar: "#003b2c", ground: "#00624a", moon: "#2ecc71" }
  ];

  let currentChapterIdx = 0;
  let score = 0;
  let waveKills = 0;
  const KILLS_PER_WAVE = 8;

  /* --- Game Setup --- */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const GROUND_Y = 230;

  const player = {
    x: 50,
    y: GROUND_Y - 32,
    w: 16,
    h: 32,
    vx: 0,
    vy: 0,
    isGrounded: true,
    hp: 100,
    maxHp: 100,
    championIdx: 0
  };

  const keys = { left: false, right: false, jump: false };
  let projectiles = [];
  let enemies = [];
  let enemyProjectiles = [];
  let spawnTimer = 0;

  /* --- Video Switcher Logic --- */
  function loadVideo(url, title, btn) {
    const video = document.getElementById('ancestralVideoPlayer');
    const source = document.getElementById('videoSource');
    const dlBtn = document.getElementById('downloadVideoBtn');
    const titleLabel = document.getElementById('currentVideoTitle');

    source.src = url;
    video.load();
    dlBtn.href = url;
    dlBtn.download = title.replace(/[^a-zA-Z0-9]/g, '_') + '.mp4';
    titleLabel.textContent = title;

    document.querySelectorAll('.playlist-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  /* --- Champion Selection --- */
  function setChampion(index) {
    player.championIdx = index;
    document.querySelectorAll('.champ-btn').forEach((b, i) => {
      b.classList.toggle('active', i === index);
    });
  }

  /* --- Enemy Classes --- */
  class ArmoredVanguard {
    constructor() {
      this.x = canvas.width + 20;
      this.w = 26;
      this.h = 38;
      this.y = GROUND_Y - this.h;
      this.hp = 6;
      this.maxHp = 6;
      this.speed = 1.0;
      this.type = 'armored';
      this.shootCooldown = 90;
    }
    update() {
      this.x -= this.speed;
      this.shootCooldown--;
      if (this.shootCooldown <= 0) {
        enemyProjectiles.push({ x: this.x, y: this.y + 14, vx: -2.8, vy: 0, rad: 4 });
        this.shootCooldown = 110 + Math.random() * 40;
      }
    }
    takeHit(dmg, isBurst) {
      // Basic frontal damage takes reduced damage; bursts crush shields
      const effectiveDmg = isBurst || player.championIdx === 1 ? dmg : 1;
      this.hp -= effectiveDmg;
    }
    draw() {
      ctx.fillStyle = "#8e44ad";
      ctx.fillRect(this.x, this.y, this.w, this.h);
      // Front Shield
      ctx.fillStyle = "#00f0ff";
      ctx.fillRect(this.x, this.y, 6, this.h);
      // Health meter
      ctx.fillStyle = "#333";
      ctx.fillRect(this.x, this.y - 7, this.w, 4);
      ctx.fillStyle = "#2ecc71";
      ctx.fillRect(this.x, this.y - 7, (this.hp / this.maxHp) * this.w, 4);
    }
  }

  class DiveBomber {
    constructor() {
      this.x = canvas.width + 20;
      this.baseY = 50 + Math.random() * 60;
      this.y = this.baseY;
      this.w = 22;
      this.h = 22;
      this.hp = 2;
      this.angle = 0;
      this.state = 'cruise'; // cruise | dive | recover
      this.type = 'bomber';
    }
    update() {
      if (this.state === 'cruise') {
        this.x -= 2.2;
        this.angle += 0.06;
        this.y = this.baseY + Math.sin(this.angle) * 16;
        if (Math.abs(this.x - player.x) < 170) {
          this.state = 'dive';
        }
      } else if (this.state === 'dive') {
        this.x -= 3.5;
        this.y += 3.2;
        if (this.y >= GROUND_Y - 24) {
          this.state = 'recover';
        }
      } else if (this.state === 'recover') {
        this.x -= 2.2;
        this.y -= 2.2;
      }
    }
    takeHit(dmg) {
      this.hp -= dmg;
    }
    draw() {
      ctx.save();
      ctx.fillStyle = this.state === 'dive' ? "#ff0055" : "#e056fd";
      ctx.shadowBlur = 6;
      ctx.shadowColor = "#ff0055";
      ctx.beginPath();
      ctx.moveTo(this.x + this.w / 2, this.y);
      ctx.lineTo(this.x + this.w, this.y + this.h / 2);
      ctx.lineTo(this.x + this.w / 2, this.y + this.h);
      ctx.lineTo(this.x, this.y + this.h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  /* --- Action Commands --- */
  function attack() {
    projectiles.push({
      x: player.x + player.w,
      y: player.y + 12,
      vx: 6.5,
      dmg: 2,
      isBurst: false,
      color: "#00f0ff"
    });
  }

  function activateBurst() {
    // Ancestral Superpower screen beam
    projectiles.push({
      x: player.x + player.w,
      y: player.y + 6,
      vx: 9.5,
      dmg: 8,
      isBurst: true,
      color: "#ff3838"
    });
  }

  function advanceChapter() {
    currentChapterIdx = (currentChapterIdx + 1) % CHAPTERS.length;
    document.getElementById('chapterBanner').textContent = CHAPTERS[currentChapterIdx].title;
    waveKills = 0;
  }

  /* --- Touch Controls Listeners --- */
  const bindTouch = (id, onDown, onUp) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
  };

  bindTouch('btnLeft', () => keys.left = true, () => keys.left = false);
  bindTouch('btnRight', () => keys.right = true, () => keys.right = false);
  bindTouch('btnJump', () => {
    if (player.isGrounded) {
      player.vy = -10.5;
      player.isGrounded = false;
    }
  }, () => {});
  bindTouch('btnAttack', () => attack(), () => {});
  bindTouch('btnBurst', () => activateBurst(), () => {});

  /* --- Game Loop --- */
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function update() {
    // Player Horizontal Movement
    if (keys.left) player.vx = -3.2;
    else if (keys.right) player.vx = 3.2;
    else player.vx = 0;

    player.x += player.vx;
    if (player.x < 10) player.x = 10;
    if (player.x > canvas.width - player.w - 10) player.x = canvas.width - player.w - 10;

    // Player Gravity
    player.vy += 0.55;
    player.y += player.vy;
    if (player.y >= GROUND_Y - player.h) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.isGrounded = true;
    }

    // Spawn Enemies
    spawnTimer++;
    if (spawnTimer > 110) {
      spawnTimer = 0;
      if (Math.random() > 0.5) {
        enemies.push(new ArmoredVanguard());
      } else {
        enemies.push(new DiveBomber());
      }
    }

    // Update Player Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx;

      // Hit Detection
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (p.x > e.x && p.x < e.x + e.w && p.y > e.y && p.y < e.y + e.h) {
          e.takeHit(p.dmg, p.isBurst);
          if (!p.isBurst) projectiles.splice(i, 1);

          if (e.hp <= 0) {
            enemies.splice(j, 1);
            score += 300;
            waveKills++;
            if (waveKills >= KILLS_PER_WAVE) advanceChapter();
          }
          break;
        }
      }
      if (p && p.x > canvas.width + 50) projectiles.splice(i, 1);
    }

    // Update Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.update();

      // Enemy Player Collision
      if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
        player.hp -= 0.5;
      }
      if (e.x < -40) enemies.splice(i, 1);
    }

    // Update Enemy Projectiles
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      const ep = enemyProjectiles[i];
      ep.x += ep.vx;
      if (ep.x < player.x + player.w && ep.x > player.x && ep.y > player.y && ep.y < player.y + player.h) {
        player.hp -= 8;
        enemyProjectiles.splice(i, 1);
      } else if (ep.x < -20) {
        enemyProjectiles.splice(i, 1);
      }
    }

    // Bounds & Health Clamp
    if (player.hp <= 0) {
      player.hp = 100;
      score = Math.max(0, score - 500);
    }

    // Update HUD
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('killsVal').textContent = waveKills;
    document.getElementById('hpFill').style.width = player.hp + "%";
  }

  function draw() {
    const scene = CHAPTERS[currentChapterIdx];

    // Background Sky
    ctx.fillStyle = scene.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Glowing Moon / Orb
    ctx.fillStyle = scene.moon;
    ctx.beginPath();
    ctx.arc(260, 80, 16, 0, Math.PI * 2);
    ctx.fill();

    // Ancient Columns
    ctx.fillStyle = scene.pillar;
    for (let i = 20; i < canvas.width; i += 50) {
      ctx.fillRect(i, 60, 16, GROUND_Y - 60);
      ctx.beginPath();
      ctx.arc(i + 8, 60, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ground Platform
    ctx.fillStyle = scene.ground;
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = "#d4af37";
    ctx.fillRect(0, GROUND_Y, canvas.width, 3);

    // Draw Player
    ctx.fillStyle = "#8a2be2";
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = "#ffeaa7"; // Head
    ctx.fillRect(player.x + 3, player.y - 8, 10, 8);

    // Draw Player Projectiles
    projectiles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.isBurst ? 22 : 8, p.isBurst ? 8 : 4);
    });

    // Draw Enemies
    enemies.forEach(e => e.draw());

    // Draw Enemy Bullets
    ctx.fillStyle = "#ff7675";
    enemyProjectiles.forEach(ep => {
      ctx.beginPath();
      ctx.arc(ep.x, ep.y, ep.rad, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  requestAnimationFrame(loop);
</script>

</body>
</html>
