<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhodes Family Legacy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #060914;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px 40px;
    }
    .wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Book Showcase */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .book-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .book-cover-img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .book-title {
      font-size: 0.65rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 6px;
      line-height: 1.15;
      min-height: 26px;
    }
    .buy-btn {
      width: 100%;
      padding: 6px 0;
      background: #ea580c;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .buy-btn:active { background: #c2410c; }

    /* Main Game Module */
    .game-card {
      background: #0b1120;
      border: 1px solid #1d283f;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .bars-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 42%;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.55rem;
      color: #94a3b8;
    }
    .bar-track {
      flex: 1;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill-hero { background: #10b981; height: 100%; width: 100%; transition: width 0.1s; }
    .bar-fill-boss { background: #ef4444; height: 100%; width: 100%; transition: width 0.1s; }

    canvas {
      width: 100%;
      height: 200px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #1e293b;
      display: block;
    }

    .chapter-heading {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fbbf24;
    }
    .subhead {
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.5px;
      color: #f59e0b;
      font-weight: 700;
    }

    /* Hero Selector Grid */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .hero-btn {
      background: #111a33;
      border: 1px solid #23315a;
      border-radius: 6px;
      padding: 6px 3px;
      color: #e2e8f0;
      cursor: pointer;
      text-align: center;
    }
    .hero-btn.selected {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
      background: #172554;
    }
    .hero-name { font-size: 0.68rem; font-weight: 800; }
    .hero-power { font-size: 0.55rem; color: #94a3b8; }

    /* Touch Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr 1.2fr;
      gap: 5px;
    }
    .ctrl-btn {
      background: #1e2952;
      color: #f8fafc;
      border: 1px solid #33437a;
      border-radius: 6px;
      padding: 10px 0;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .ctrl-btn:active { background: #2f3e82; }
    .btn-burst {
      background: #dc2626;
      border-color: #ef4444;
    }
    .btn-burst:active { background: #991b1b; }

    /* Ancestral Video Hub */
    .video-card {
      background: #0b1120;
      border: 1px solid #1d283f;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .video-title {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: 0.5px;
    }
    .video-player-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .v-action-btn {
      padding: 8px 0;
      border-radius: 6px;
      border: none;
      font-size: 0.7rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-upload { background: #2563eb; }
    .btn-upload:hover { background: #1d4ed8; }
    .btn-download { background: #16a34a; }
    .btn-download:hover { background: #15803d; }

    .video-playlist {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .playlist-item {
      background: #111a33;
      border: 1px solid #1f2d57;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
      text-align: left;
    }
    .playlist-item.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background: #172554;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Retained Book Covers Row -->
  <div class="book-grid">
    <div class="book-card">
      <img src="volume1.jpg" alt="Vol. 1 - From Father to Son" class="book-cover-img" />
      <div class="book-title">Vol. 1 - From Father to Son</div>
      <button class="buy-btn">BUY VOL. 1</button>
    </div>
    <div class="book-card">
      <img src="volume2.jpg" alt="Vol. 2 - Cousins of Courage" class="book-cover-img" />
      <div class="book-title">Vol. 2 - Cousins of Courage</div>
      <button class="buy-btn">BUY VOL. 2</button>
    </div>
    <div class="book-card">
      <img src="volume3.jpg" alt="Vol. 3 - The Colbert Legacy" class="book-cover-img" />
      <div class="book-title">Vol. 3 - The Colbert Legacy</div>
      <button class="buy-btn">BUY VOL. 3</button>
    </div>
  </div>

  <!-- Battle Container -->
  <div class="game-card">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div class="bars-wrap">
        <div class="bar-row">HERO <div class="bar-track"><div class="bar-fill-hero" id="heroHp"></div></div></div>
        <div class="bar-row">BOSS <div class="bar-track"><div class="bar-fill-boss" id="bossHp"></div></div></div>
      </div>
      <div>WAVE: [<span id="waveDisplay">1/8</span>]</div>
    </div>

    <canvas id="gameCanvas" width="400" height="200"></canvas>

    <div class="chapter-heading" id="chapterTitle">Chapter 8: The Great Dismal Swamp &amp; Levant Portals</div>
    <div class="subhead">✦ SELECT ANCESTRAL CHAMPION &amp; SUPERPOWER ✦</div>

    <div class="hero-grid">
      <button class="hero-btn selected" onclick="setHero(0)">
        <div class="hero-name">Inez &amp; Tweet</div>
        <div class="hero-power">Twin Sister Tag</div>
      </button>
      <button class="hero-btn" onclick="setHero(1)">
        <div class="hero-name">Elroy Rhodes</div>
        <div class="hero-power">Delta Heavy</div>
      </button>
      <button class="hero-btn" onclick="setHero(2)">
        <div class="hero-name">Uncle Bear</div>
        <div class="hero-power">Maroon Shock</div>
      </button>
      <button class="hero-btn" onclick="setHero(3)">
        <div class="hero-name">Uncle Aaron</div>
        <div class="hero-power">Pioneer Volley</div>
      </button>
      <button class="hero-btn" onclick="setHero(4)">
        <div class="hero-name">Fanny May</div>
        <div class="hero-power">Coincoin Barrier</div>
      </button>
      <button class="hero-btn" onclick="setHero(5)">
        <div class="hero-name">TP Mitchell</div>
        <div class="hero-power">Lineage Beam</div>
      </button>
    </div>

    <!-- On-Screen Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="btnLeft">◀ LEFT</button>
      <button class="ctrl-btn" id="btnRight">RIGHT ▶</button>
      <button class="ctrl-btn" id="btnJump">▲ JUMP</button>
      <button class="ctrl-btn" id="btnAtk">ATK / BOW</button>
      <button class="ctrl-btn btn-burst" id="btnBurst">BURST</button>
    </div>
  </div>

  <!-- Ancestral Video Hub -->
  <div class="video-card">
    <div class="video-title">✦ ANCESTRAL VIDEO HUB ✦</div>
    <div class="video-player-box">
      <video id="legacyVideoPlayer" controls poster="volume1.jpg">
        <source src="vanguard/ancestral_origins.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="video-btn-row">
      <button class="v-action-btn btn-upload" onclick="document.getElementById('videoUploadInput').click()">📥 Upload My Video</button>
      <a href="vanguard/ancestral_origins.mp4" download class="v-action-btn btn-download" id="downloadVideoBtn">💾 Download Video</a>
      <input type="file" id="videoUploadInput" accept="video/*" style="display:none" />
    </div>
    <div class="video-playlist">
      <button class="playlist-item active" onclick="loadVideo(0, this)">1. Origins &amp; The Tree of Lineage</button>
      <button class="playlist-item" onclick="loadVideo(1, this)">2. Cousins of Courage Documentary</button>
      <button class="playlist-item" onclick="loadVideo(2, this)">3. The Colbert Legacy Historical Feature</button>
    </div>
  </div>

</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // 10 Full Chapters
  const chapters = [
    { title: "Chapter 1: The Rising Vanguard", maxWaves: 6, bg: "#0d1b2a", pillar: "#1e293b" },
    { title: "Chapter 2: Delta Woodlands Crossing", maxWaves: 6, bg: "#064e3b", pillar: "#065f46" },
    { title: "Chapter 3: Fortified Marrow Bastion", maxWaves: 7, bg: "#1e1b4b", pillar: "#312e81" },
    { title: "Chapter 4: River of Iron Will", maxWaves: 7, bg: "#172554", pillar: "#1e3a8a" },
    { title: "Chapter 5: Ancestral Mountain Paths", maxWaves: 7, bg: "#18181b", pillar: "#27272a" },
    { title: "Chapter 6: The Colbert Citadel Gates", maxWaves: 8, bg: "#2e1065", pillar: "#3b0764" },
    { title: "Chapter 7: Maroon Sentinel Keep", maxWaves: 8, bg: "#1c1917", pillar: "#292524" },
    { title: "Chapter 8: The Great Dismal Swamp & Levant Portals", maxWaves: 8, bg: "#081b26", pillar: "#133146" },
    { title: "Chapter 9: Pillars of the Vanguard", maxWaves: 9, bg: "#1a102f", pillar: "#2e1065" },
    { title: "Chapter 10: Golden Sanctuary of the Marrow", maxWaves: 10, bg: "#2b1c03", pillar: "#451a03" }
  ];

  let currentChapterIdx = 7; // Starts on Chapter 8 as per original setup
  let currentWave = 1;
  let score = 0;
  let selectedHeroIdx = 0;

  const player = {
    x: 60,
    y: 130,
    w: 16,
    h: 38,
    vx: 0,
    vy: 0,
    grounded: true,
    hp: 100,
    maxHp: 100,
    shirtColor: "#e11d48",
    pantsColor: "#1e3a8a",
    skinColor: "#8d5b4c"
  };

  let projectiles = [];
  let enemies = [];
  let boss = null;

  // Multiple Enemy Archetypes
  const enemyArchetypes = {
    swordsman: { w: 18, h: 38, hp: 35, speed: 1.1, tunic: "#854d0e", helm: "#ca8a04", type: "melee" },
    prowler:   { w: 16, h: 32, hp: 25, speed: 2.1, tunic: "#ea580c", helm: "#f97316", type: "rusher" },
    colossus:  { w: 24, h: 44, hp: 90, speed: 0.6, tunic: "#334155", helm: "#64748b", type: "tank" },
    spearman:  { w: 18, h: 38, hp: 45, speed: 1.4, tunic: "#7e22ce", helm: "#a855f7", type: "pierce" }
  };

  function spawnWave() {
    enemies = [];
    boss = null;
    const isBossWave = (currentWave === chapters[currentChapterIdx].maxWaves);

    if (isBossWave) {
      // Golden Leopard Boss with unbreakable state-machine
      boss = {
        name: "Golden Leopard",
        x: 320,
        y: 132,
        w: 36,
        h: 36,
        hp: 260,
        maxHp: 260,
        state: "patrol",      // "patrol", "charge_anticipation", "charge_leap", "recover"
        timer: 0,
        patrolMin: 220,
        patrolMax: 360,
        speed: 1.4,
        dir: -1
      };
    } else {
      const count = 1 + Math.floor(currentWave / 2);
      const keys = Object.keys(enemyArchetypes);
      for (let i = 0; i < count; i++) {
        const typeKey = keys[Math.floor(Math.random() * keys.length)];
        const spec = enemyArchetypes[typeKey];
        enemies.push({
          x: 290 + (i * 35),
          y: 170 - spec.h,
          w: spec.w,
          h: spec.h,
          hp: spec.hp,
          maxHp: spec.hp,
          speed: spec.speed,
          tunic: spec.tunic,
          helm: spec.helm,
          type: spec.type
        });
      }
    }
  }

  // Boss Loop Fix
  function updateBoss() {
    if (!boss) return;
    boss.timer++;

    if (boss.state === "patrol") {
      boss.x += boss.speed * boss.dir;
      if (boss.x <= boss.patrolMin) {
        boss.x = boss.patrolMin;
        boss.dir = 1;
      } else if (boss.x >= boss.patrolMax) {
        boss.x = boss.patrolMax;
        boss.dir = -1;
      }

      // Hard loop breaker: after 75 frames (~1.2s), lock in a charge leap
      if (boss.timer > 75) {
        boss.state = "charge_anticipation";
        boss.timer = 0;
      }
    } else if (boss.state === "charge_anticipation") {
      // Crouch and flash before leaping
      if (boss.timer > 25) {
        boss.state = "charge_leap";
        boss.timer = 0;
        boss.dir = boss.x > player.x ? -1 : 1;
      }
    } else if (boss.state === "charge_leap") {
      boss.x += boss.dir * 4.8;
      // Hit check against player
      if (Math.abs(boss.x - player.x) < 22 && Math.abs(boss.y - player.y) < 26) {
        player.hp = Math.max(0, player.hp - 0.4);
      }
      if (boss.timer > 35 || boss.x < 15 || boss.x > 365) {
        boss.state = "recover";
        boss.timer = 0;
      }
    } else if (boss.state === "recover") {
      // 30 frame cooldown before resuming combat
      if (boss.timer > 30) {
        boss.state = "patrol";
        boss.timer = 0;
      }
    }

    if (boss.hp <= 0) {
      score += 2000;
      boss = null;
      advanceWave();
    }
  }

  function advanceWave() {
    if (currentWave < chapters[currentChapterIdx].maxWaves) {
      currentWave++;
    } else {
      if (currentChapterIdx < chapters.length - 1) {
        currentChapterIdx++;
        currentWave = 1;
      } else {
        alert("Victory! The Ancestral Vanguard has conquered all 10 Chapters!");
        currentChapterIdx = 0;
        currentWave = 1;
      }
    }
    spawnWave();
    updateUI();
  }

  function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("waveDisplay").innerText = `${currentWave}/${chapters[currentChapterIdx].maxWaves}`;
    document.getElementById("chapterTitle").innerText = chapters[currentChapterIdx].title;
    document.getElementById("heroHp").style.width = `${(player.hp / player.maxHp) * 100}%`;
    const bHp = boss ? (boss.hp / boss.maxHp) * 100 : 0;
    document.getElementById("bossHp").style.width = `${bHp}%`;
  }

  // Draw Humanoid Characters
  function drawHumanoid(x, y, w, h, skin, shirt, pants, hair, helm = null, isWeapon = true) {
    const headSize = 8;
    // Legs / Pants
    ctx.fillStyle = pants;
    ctx.fillRect(x + 2, y + 22, 5, h - 22);
    ctx.fillRect(x + w - 7, y + 22, 5, h - 22);

    // Torso / Tunic
    ctx.fillStyle = shirt;
    ctx.fillRect(x + 1, y + headSize + 2, w - 2, 14);

    // Head / Face
    ctx.fillStyle = skin;
    ctx.fillRect(x + (w / 2) - 4, y, headSize, headSize);

    // Hair or Helmet
    if (helm) {
      ctx.fillStyle = helm;
      ctx.fillRect(x + (w / 2) - 5, y - 2, headSize + 2, 4);
    } else {
      ctx.fillStyle = hair;
      ctx.fillRect(x + (w / 2) - 4, y - 2, headSize, 3);
    }

    // Weapon / Sword
    if (isWeapon) {
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(x + w + 1, y + 10, 3, 16);
      ctx.fillStyle = "#ca8a04";
      ctx.fillRect(x + w, y + 18, 5, 2);
    }
  }

  // Draw Golden Leopard Boss
  function drawLeopard(x, y, w, h, state) {
    ctx.fillStyle = state === "charge_anticipation" ? "#fef08a" : "#eab308";
    // Body
    ctx.fillRect(x, y + 10, w, 18);
    // Legs
    ctx.fillRect(x + 2, y + 28, 6, 8);
    ctx.fillRect(x + w - 8, y + 28, 6, 8);
    // Head & Ears
    ctx.fillRect(x + (boss.dir === -1 ? 0 : w - 12), y + 2, 12, 12);
    ctx.fillRect(x + (boss.dir === -1 ? 2 : w - 6), y - 2, 3, 4);
    // Leopard Spots
    ctx.fillStyle = "#854d0e";
    ctx.fillRect(x + 8, y + 14, 4, 4);
    ctx.fillRect(x + 18, y + 16, 4, 4);
    ctx.fillRect(x + 24, y + 12, 4, 4);
  }

  // Controls & Inputs
  const keys = {};
  window.addEventListener("keydown", e => keys[e.code] = true);
  window.addEventListener("keyup", e => keys[e.code] = false);

  function attachTouch(id, code) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[code] = true; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
    el.addEventListener("mousedown", () => keys[code] = true);
    el.addEventListener("mouseup", () => keys[code] = false);
  }
  attachTouch("btnLeft", "ArrowLeft");
  attachTouch("btnRight", "ArrowRight");
  attachTouch("btnJump", "ArrowUp");

  document.getElementById("btnAtk").addEventListener("click", () => {
    projectiles.push({ x: player.x + 18, y: player.y + 14, vx: 5, vy: 0, r: 4, type: "arrow" });
  });

  document.getElementById("btnBurst").addEventListener("click", () => {
    for (let i = -1; i <= 1; i += 0.5) {
      projectiles.push({ x: player.x + 18, y: player.y + 14, vx: 6, vy: i, r: 6, type: "burst" });
    }
  });

  window.setHero = function(idx) {
    selectedHeroIdx = idx;
    document.querySelectorAll(".hero-btn").forEach((btn, i) => {
      btn.classList.toggle("selected", i === idx);
    });
    // Visual variant tweaks per champion
    if (idx === 1) { player.shirtColor = "#0284c7"; }
    else if (idx === 2) { player.shirtColor = "#7c3aed"; }
    else { player.shirtColor = "#e11d48"; }
  };

  // Video Playlist Switcher
  const videoUrls = [
    "vanguard/ancestral_origins.mp4",
    "vanguard/cousins_of_courage.mp4",
    "vanguard/colbert_legacy.mp4"
  ];
  window.loadVideo = function(idx, el) {
    const player = document.getElementById("legacyVideoPlayer");
    const downloadBtn = document.getElementById("downloadVideoBtn");
    player.src = videoUrls[idx];
    player.play();
    downloadBtn.href = videoUrls[idx];
    document.querySelectorAll(".playlist-item").forEach(item => item.classList.remove("active"));
    el.classList.add("active");
  };

  // Upload Local Video Support
  document.getElementById("videoUploadInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      const vPlayer = document.getElementById("legacyVideoPlayer");
      vPlayer.src = url;
      vPlayer.play();
      document.getElementById("downloadVideoBtn").href = url;
    }
  });

  // Game Loop
  function gameLoop() {
    // Movement
    if (keys["ArrowLeft"]) player.vx = -2.5;
    else if (keys["ArrowRight"]) player.vx = 2.5;
    else player.vx = 0;

    if (keys["ArrowUp"] && player.grounded) {
      player.vy = -7.5;
      player.grounded = false;
    }

    player.vy += 0.35;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 10) player.x = 10;
    if (player.x > 370) player.x = 370;

    if (player.y >= 132) {
      player.y = 132;
      player.vy = 0;
      player.grounded = true;
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.x -= e.speed;
      if (Math.abs(e.x - player.x) < 16 && Math.abs(e.y - player.y) < 24) {
        player.hp = Math.max(0, player.hp - 0.2);
      }
      if (e.hp <= 0) {
        score += 120;
        enemies.splice(i, 1);
      }
    }

    if (!boss && enemies.length === 0) {
      advanceWave();
    }

    updateBoss();

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx;
      if (p.vy) p.y += p.vy;

      if (boss && p.x > boss.x && p.x < boss.x + boss.w && p.y > boss.y && p.y < boss.y + boss.h) {
        boss.hp -= (p.type === "burst" ? 22 : 10);
        projectiles.splice(i, 1);
        continue;
      }

      let hit = false;
      for (let e of enemies) {
        if (p.x > e.x && p.x < e.x + e.w && p.y > e.y && p.y < e.y + e.h) {
          e.hp -= (p.type === "burst" ? 30 : 15);
          hit = true;
          break;
        }
      }
      if (hit || p.x > 410 || p.x < 0) {
        projectiles.splice(i, 1);
      }
    }

    // Render Scene
    render();
    updateUI();
    requestAnimationFrame(gameLoop);
  }

  function render() {
    const ch = chapters[currentChapterIdx];
    ctx.fillStyle = ch.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Architectural Pillars
    ctx.fillStyle = ch.pillar;
    for (let i = 25; i < 400; i += 60) {
      ctx.fillRect(i, 20, 20, 150);
    }

    // Floor
    ctx.fillStyle = "#5c3d2e";
    ctx.fillRect(0, 170, canvas.width, 30);
    ctx.fillStyle = "#8a5840";
    ctx.fillRect(0, 170, canvas.width, 3);

    // Humanoid Player Character
    drawHumanoid(player.x, player.y, player.w, player.h, player.skinColor, player.shirtColor, player.pantsColor, "#0f172a", null, false);

    // Twin Ancestral Spirits floating above hero (Inez & Tweet)
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(player.x - 3, player.y - 12, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f472b6";
    ctx.beginPath();
    ctx.arc(player.x + 8, player.y - 14, 4, 0, Math.PI * 2);
    ctx.fill();

    // Humanoid Enemies
    enemies.forEach(e => {
      drawHumanoid(e.x, e.y, e.w, e.h, "#a16207", e.tunic, "#1e293b", "#000000", e.helm, true);
    });

    // Boss Leopard
    if (boss) {
      drawLeopard(boss.x, boss.y, boss.w, boss.h, boss.state);
    }

    // Projectiles
    projectiles.forEach(p => {
      ctx.fillStyle = p.type === "burst" ? "#38bdf8" : "#facc15";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  spawnWave();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
