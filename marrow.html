<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packed in the Marrow: The Multi-Era Epic Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #0d0b09;
    color: #e6dfd5;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    border: 3px solid #8b2500;
    box-shadow: 0 0 30px rgba(139, 37, 0, 0.5);
    background: #000;
    width: 800px;
    height: 450px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .ui-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(13, 11, 9, 0.92);
    padding: 30px;
    text-align: center;
  }
  h1 { font-size: 26px; color: #d4af37; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
  h2 { font-size: 19px; color: #ff6b4a; margin-bottom: 12px; }
  p { max-width: 620px; margin-bottom: 22px; line-height: 1.5; font-size: 14.5px; color: #cfc5b6; }
  .btn-group { display: flex; gap: 15px; }
  button {
    background: #8b2500;
    color: #fff;
    border: 2px solid #d4af37;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    transition: 0.2s;
  }
  button:hover {
    background: #b53200;
    transform: scale(1.05);
  }
  #hud {
    position: absolute;
    top: 10px; left: 15px; right: 15px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 13.5px;
    color: #d4af37;
    pointer-events: none;
    text-shadow: 1px 1px 2px #000;
  }
  .health-bar-container {
    width: 120px; height: 12px; background: #333; border: 1px solid #d4af37; border-radius: 2px; display: inline-block; vertical-align: middle; margin-left: 6px;
  }
  #health-bar-fill {
    height: 100%; width: 100%; background: #27ae60; transition: width 0.1s;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="800" height="450"></canvas>
  <div id="hud" style="display:none;">
    <div id="hud-phase">Phase: 1</div>
    <div id="hud-faction">Faction: Lineage</div>
    <div id="hud-hp">HP: <div class="health-bar-container"><div id="health-bar-fill"></div></div></div>
    <div id="hud-obj">Defeated: 0/5</div>
  </div>
  
  <div id="ui-menu" class="ui-overlay">
    <h1 id="menu-title">Packed in the Marrow</h1>
    <h2 id="menu-phase">Phase 1: The Illyrian Highland Forges</h2>
    <p id="menu-desc">Choose your side in the ancient clash along the Adriatic mountain redoubts.</p>
    <div class="btn-group">
      <button id="btn-lineage" onclick="startPhase('LINEAGE')">Play Lineage</button>
      <button id="btn-oppose" onclick="startPhase('OPPOSITION')">Play Opposition</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let currentPhase = 1;
const totalPhases = 7;
let selectedFaction = 'LINEAGE';
let kills = 0;
let targetKills = 5;

const phases = {
  1: {
    title: "Phase 1: Illyrian Highland Forges",
    desc: "Balkan shield-warriors defend mountain forge passes against Roman expansion.",
    lineageName: "Illyrian Shield-Master",
    lineageColor: "#2b5c8f",
    opposeName: "Roman Centurion",
    opposeColor: "#a32626",
    bg: "#1c2321",
    ground: "#111413"
  },
  2: {
    title: "Phase 2: Siege of Jerusalem & Desert Exodus",
    desc: "Levites evacuate sacred scrolls, finding safe harbor with the Banu Hashim.",
    lineageName: "Levite Scroll Guardian",
    lineageColor: "#d4af37",
    opposeName: "Roman Siege Cohort",
    opposeColor: "#8f1d1d",
    bg: "#3b2816",
    ground: "#21160c"
  },
  3: {
    title: "Phase 3: The Golden Age of Al-Andalus",
    desc: "Moorish scholars, engineers, and allies build civil infrastructure across Iberia.",
    lineageName: "Moorish Architect / Scholar",
    lineageColor: "#1e7e34",
    opposeName: "Visigothic Inquisitor",
    opposeColor: "#6c2c84",
    bg: "#192a38",
    ground: "#0d161d"
  },
  4: {
    title: "Phase 4: Sovereign Trade of the Mali Empire",
    desc: "Master merchants protect gold and salt barges along the Niger River.",
    lineageName: "Mali Ironmaster / Merchant",
    lineageColor: "#e67e22",
    opposeName: "Saharan Marauder",
    opposeColor: "#7f8c8d",
    bg: "#3d2b1f",
    ground: "#1c140e"
  },
  5: {
    title: "Phase 5: Dismal Swamp Maroon Sanctuary",
    desc: "Maroon warriors hold hidden canal networks against slave patrol posses.",
    lineageName: "Maroon Swamp Defender",
    lineageColor: "#27ae60",
    opposeName: "Colonial Militia Patrol",
    opposeColor: "#95a5a6",
    bg: "#15261d",
    ground: "#09120e"
  },
  6: {
    title: "Phase 6: Southern Forges & Reconstruction",
    desc: "Fred and Lucius Hatten defend the family anvil and homestead from raiders.",
    lineageName: "Southern Anvil Blacksmith",
    lineageColor: "#c0392b",
    opposeName: "Depredator / Raider",
    opposeColor: "#34495e",
    bg: "#2c2c2c",
    ground: "#181818"
  },
  7: {
    title: "Phase 7: Modern Legacy & Urban Frontier",
    desc: "Honor the multi-millennial journey from ancient coasts to modern victory.",
    lineageName: "Rhodes Modern Vanguard",
    lineageColor: "#8e44ad",
    opposeName: "Historical Adversity",
    opposeColor: "#d35400",
    bg: "#1a1c23",
    ground: "#0c0d10"
  }
};

const player = {
  x: 100, y: 320, w: 30, h: 54,
  vx: 0, vy: 0, speed: 4.8,
  hp: 100, maxHp: 100,
  isAttacking: false, attackTimer: 0,
  facingRight: true,
  color: "#2b5c8f"
};

let enemies = [];
const keys = {};

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key.toLowerCase() === 'f') && !player.isAttacking && gameState === 'PLAYING') {
    player.isAttacking = true;
    player.attackTimer = 14;
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function startPhase(faction) {
  selectedFaction = faction;
  gameState = 'PLAYING';
  kills = 0;
  player.hp = 100;
  player.x = 80;
  
  const pData = phases[currentPhase];
  player.color = faction === 'LINEAGE' ? pData.lineageColor : pData.opposeColor;
  
  document.getElementById('ui-menu').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  
  document.getElementById('hud-phase').innerText = `Phase ${currentPhase}: ${pData.title}`;
  document.getElementById('hud-faction').innerText = faction === 'LINEAGE' ? pData.lineageName : pData.opposeName;
  updateHealthBar();
  
  enemies = [];
  spawnEnemy();
}

function updateHealthBar() {
  const fill = document.getElementById('health-bar-fill');
  const pct = Math.max(0, (player.hp / player.maxHp) * 100);
  fill.style.width = pct + "%";
  fill.style.background = pct > 50 ? '#27ae60' : pct > 25 ? '#e67e22' : '#c0392b';
}

function spawnEnemy() {
  const pData = phases[currentPhase];
  const eColor = selectedFaction === 'LINEAGE' ? pData.opposeColor : pData.lineageColor;
  enemies.push({
    x: 830, y: 320, w: 28, h: 54,
    hp: 45 + (currentPhase * 5),
    speed: 1.8 + Math.random() * 1.6,
    color: eColor
  });
}

function update() {
  if (gameState !== 'PLAYING') return;

  // Horizontal Movement
  player.vx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
    player.vx = -player.speed;
    player.facingRight = false;
  }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) {
    player.vx = player.speed;
    player.facingRight = true;
  }
  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

  // Attack timer
  if (player.isAttacking) {
    player.attackTimer--;
    if (player.attackTimer <= 0) player.isAttacking = false;
  }

  // Update Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    if (e.x > player.x + 35) {
      e.x -= e.speed;
    } else if (e.x < player.x - 35) {
      e.x += e.speed;
    } else {
      // Enemy melee hit
      if (Math.random() < 0.035) {
        player.hp -= (6 + currentPhase);
        updateHealthBar();
        if (player.hp <= 0) {
          player.hp = 0;
          showGameOver();
        }
      }
    }

    // Player strikes enemy
    if (player.isAttacking && player.attackTimer === 9) {
      let hitBoxX = player.facingRight ? player.x + player.w : player.x - 35;
      if (Math.abs(hitBoxX - e.x) < 55) {
        e.hp -= 32;
        if (e.hp <= 0) {
          enemies.splice(i, 1);
          kills++;
          if (kills < targetKills) {
            spawnEnemy();
          } else {
            showPhaseVictory();
          }
        }
      }
    }
  }

  document.getElementById('hud-obj').innerText = `Defeated: ${kills}/${targetKills}`;
}

function showPhaseVictory() {
  gameState = 'VICTORY';
  const menu = document.getElementById('ui-menu');
  menu.style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  
  if (currentPhase < totalPhases) {
    document.getElementById('menu-title').innerText = `Phase ${currentPhase} Complete!`;
    document.getElementById('menu-phase').innerText = `${phases[currentPhase].title} Secured`;
    document.getElementById('menu-desc').innerText = `The bloodline advances to the next epoch: ${phases[currentPhase + 1].title}.`;
    
    document.getElementById('btn-lineage').style.display = 'inline-block';
    document.getElementById('btn-oppose').style.display = 'inline-block';
    document.getElementById('btn-lineage').innerText = `Advance as Lineage`;
    document.getElementById('btn-oppose').innerText = `Advance as Opposition`;
    
    document.getElementById('btn-lineage').onclick = () => { currentPhase++; startPhase('LINEAGE'); };
    document.getElementById('btn-oppose').onclick = () => { currentPhase++; startPhase('OPPOSITION'); };
  } else {
    document.getElementById('menu-title').innerText = "Epic Journey Completed!";
    document.getElementById('menu-phase').innerText = "The Unbroken Living Cord";
    document.getElementById('menu-desc').innerText = "From ancient Illyria to modern Michigan, you have guided the lineage through all seven historical epochs. The legacy is victorious.";
    document.getElementById('btn-lineage').style.display = 'none';
    document.getElementById('btn-oppose').innerText = "Play Again from Phase 1";
    document.getElementById('btn-oppose').onclick = () => { currentPhase = 1; location.reload(); };
  }
}

function showGameOver() {
  gameState = 'MENU';
  const menu = document.getElementById('ui-menu');
  menu.style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('menu-title').innerText = "Fallen in Battle";
  document.getElementById('menu-phase').innerText = `Phase ${currentPhase} Interrupted`;
  document.getElementById('menu-desc').innerText = "Regroup your forces, summon your ancestral fortitude, and retake the field.";
  document.getElementById('btn-lineage').style.display = 'inline-block';
  document.getElementById('btn-oppose').style.display = 'inline-block';
  document.getElementById('btn-lineage').innerText = "Retry as Lineage";
  document.getElementById('btn-oppose').innerText = "Retry as Opposition";
  document.getElementById('btn-lineage').onclick = () => startPhase('LINEAGE');
  document.getElementById('btn-oppose').onclick = () => startPhase('OPPOSITION');
}

function render() {
  const pData = phases[currentPhase];
  ctx.fillStyle = pData.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Ground platform
  ctx.fillStyle = pData.ground;
  ctx.fillRect(0, 374, canvas.width, 76);
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(0, 374, canvas.width, 3);

  // Draw Player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Weapon swing visual
  if (player.isAttacking) {
    ctx.fillStyle = "#d4af37";
    if (player.facingRight) {
      ctx.fillRect(player.x + player.w, player.y + 18, 30, 8);
    } else {
      ctx.fillRect(player.x - 30, player.y + 18, 30, 8);
    }
  }

  // Draw Enemies
  for (let e of enemies) {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x, e.y, e.w, e.h);
  }

  requestAnimationFrame(loop);
}

function loop() {
  update();
  render();
}

loop();
</script>
</body>
</html>
