<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Legacy • Interactive Town Walking Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .gold-border { border-color: rgba(245, 158, 11, 0.5); }
        .glow-text { text-shadow: 0 0 15px rgba(245, 158, 11, 0.7); }
        canvas { background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); border: 3px solid #f59e0b; border-radius: 16px; box-shadow: 0 0 30px rgba(245, 158, 11, 0.3); display: block; margin: 0 auto; touch-action: none; max-width: 100%; height: auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6">

    <!-- Top Navigation Header -->
    <header class="max-w-4xl mx-auto w-full bg-slate-900/95 border gold-border rounded-2xl p-2.5 mb-2 shadow-2xl flex flex-wrap justify-between items-center gap-2">
        <div>
            <h1 class="text-base md:text-2xl font-bold text-amber-400 glow-text flex items-center gap-2">
                🏡 Rhodes Family Walking Sandbox
            </h1>
            <p class="text-[10px] text-slate-400">Use D-pad to walk up to stations!</p>
        </div>
        
        <!-- Player Resource HUD -->
        <div class="flex items-center gap-2.5 bg-slate-950 px-3 py-1 rounded-xl border border-amber-500/30 text-xs shadow-inner">
            <div>🪙 <span id="hud-coins" class="font-bold text-amber-400">250</span></div>
            <div>🪵 <span id="hud-timber" class="font-bold text-emerald-400">55</span></div>
            <div>⚒️ <span id="hud-iron" class="font-bold text-orange-400">40</span></div>
        </div>

        <a href="index.html" class="text-xs border border-amber-500/40 text-amber-400 px-2.5 py-1 rounded-xl hover:bg-amber-500/10 transition-colors">
            ← Hub
        </a>
    </header>

    <!-- Main Game Canvas Container -->
    <main class="max-w-4xl mx-auto w-full flex flex-col items-center gap-2 mb-2">
        
        <div class="relative w-full flex justify-center px-1">
            <!-- Compact 560x320 canvas so everything fits on mobile screens -->
            <canvas id="gameCanvas" width="560" height="320"></canvas>
        </div>

        <!-- Mobile & Tablet On-Screen D-Pad Controls -->
        <div class="flex flex-col items-center gap-1 w-full my-1">
            <!-- Up Button -->
            <button ontouchstart="keys.up=true; event.preventDefault();" ontouchend="keys.up=false; event.preventDefault();" onmousedown="keys.up=true;" onmouseup="keys.up=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">⬆️</button>
            
            <!-- Left / Action / Right Row -->
            <div class="flex justify-center gap-3 w-full max-w-xs">
                <button ontouchstart="keys.left=true; event.preventDefault();" ontouchend="keys.left=false; event.preventDefault();" onmousedown="keys.left=true;" onmouseup="keys.left=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">⬅️</button>
                <button onclick="triggerAction()" class="bg-emerald-600 border border-emerald-400 text-white px-4 h-11 rounded-xl font-bold text-xs shadow-lg active:bg-emerald-500">🪓 Action</button>
                <button ontouchstart="keys.right=true; event.preventDefault();" ontouchend="keys.right=false; event.preventDefault();" onmousedown="keys.right=true;" onmouseup="keys.right=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">➡️</button>
            </div>

            <!-- Down Button -->
            <button ontouchstart="keys.down=true; event.preventDefault();" ontouchend="keys.down=false; event.preventDefault();" onmousedown="keys.down=true;" onmouseup="keys.down=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">⬇️</button>
        </div>

        <!-- Instructions & Status Bar -->
        <div class="w-full bg-slate-900/90 border gold-border rounded-xl p-2.5 flex flex-col md:flex-row justify-between items-center gap-2 text-xs">
            <div id="game-prompt" class="text-amber-300 font-bold text-center md:text-left">
                💡 Walk up to any station and tap <span class="text-emerald-400">Action</span>!
            </div>
            <button onclick="upgradeTown()" class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold px-3 py-2 rounded-xl shadow-lg transition-transform text-[11px]">
                🏗️ Expand Homestead (50 Wood, 20 Iron, 100 Coins)
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-[10px] text-slate-500 border-t border-slate-800 pt-1">
        © 2026 Tommy Philip Rhodes • Rhodes Family Legacy. All Rights Reserved.
    </footer>

    <!-- Walking & Interaction Engine Script -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let game = {
            coins: parseInt(localStorage.getItem('rhodes_coins') || '250'),
            timber: parseInt(localStorage.getItem('rhodes_timber') || '55'),
            iron: parseInt(localStorage.getItem('rhodes_iron') || '40'),
            townLevel: 1,
            x: 280,
            y: 160,
            speed: 4.0,
            actionCooldown: 0
        };

        let keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        // Stations positioned well within the 560x320 canvas so they are fully visible on mobile
        const stations = [
            { id: "timber", name: "Lucius Hatton's Timberland", x: 100, y: 70, radius: 38, color: "#059669", icon: "🌲", role: "Chop Timber", actionText: "🪓 Chop Tree (+5 Timber)", link: "lucius-timber.html" },
            { id: "forge", name: "Fred Hatton's Blacksmith Forge", x: 460, y: 70, radius: 38, color: "#ea580c", icon: "🔥", role: "Iron & Anvil", actionText: "⚒️ Strike Anvil (+3 Iron)", link: "fred-forge.html" },
            { id: "farm", name: "Tom Mitchell's Farmland", x: 100, y: 250, radius: 38, color: "#d97706", icon: "🌾", role: "Crops & Harvest", actionText: "🌾 Harvest Crops (+20 Coins)", link: "tom-farm.html" },
            { id: "hotel", name: "Zelma Mitchell's Yazoo Hotel", x: 460, y: 250, radius: 38, color: "#0284c7", icon: "🏨", role: "Hospitality Hub", actionText: "🛎️ Welcome Guest (+25 Coins)", link: "zelma-hotel.html" },
            { id: "home", name: "Central Homestead", x: 280, y: 160, radius: 48, color: "#f59e0b", icon: "🏡", role: "Town Upgrade Hub", actionText: "🏡 Open Homestead Hub", link: "#" }
        ];

        let activeStation = null;
        let particles = [];

        function updateHUD() {
            document.getElementById('hud-coins').innerText = game.coins;
            document.getElementById('hud-timber').innerText = game.timber;
            document.getElementById('hud-iron').innerText = game.iron;
            localStorage.setItem('rhodes_coins', game.coins);
            localStorage.setItem('rhodes_timber', game.timber);
            localStorage.setItem('rhodes_iron', game.iron);
        }

        function triggerAction() {
            if (!activeStation) return;
            if (game.actionCooldown > 0) return;

            game.actionCooldown = 25;

            if (activeStation.id === 'timber') {
                game.timber += 5;
                spawnParticles(activeStation.x, activeStation.y, '#10b981', '🪵');
                showFloatingPopup("🪓 Chopped 5 Timber logs!");
            } else if (activeStation.id === 'forge') {
                game.iron += 3;
                spawnParticles(activeStation.x, activeStation.y, '#f97316', '✨');
                showFloatingPopup("⚒️ Forged 3 Iron ingots!");
            } else if (activeStation.id === 'farm') {
                game.coins += 20;
                spawnParticles(activeStation.x, activeStation.y, '#f59e0b', '🪙');
                showFloatingPopup("🌾 Harvested crops for 20 Coins!");
            } else if (activeStation.id === 'hotel') {
                game.coins += 25;
                spawnParticles(activeStation.x, activeStation.y, '#38bdf8', '🪙');
                showFloatingPopup("🛎️ Hosted traveler for 25 Coins!");
            } else if (activeStation.link !== "#") {
                window.location.href = activeStation.link;
                return;
            }
            updateHUD();
        }

        function showFloatingPopup(msg) {
            let promptBox = document.getElementById('game-prompt');
            promptBox.innerHTML = `<span class="text-emerald-400 font-bold">✨ ${msg}</span>`;
            setTimeout(() => checkProximity(), 1500);
        }

        function spawnParticles(x, y, color, symbol) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4 - 2,
                    life: 25, symbol: symbol, color: color
                });
            }
        }

        function checkProximity() {
            activeStation = null;
            for (let st of stations) {
                let dist = Math.hypot(game.x - st.x, game.y - st.y);
                if (dist < st.radius + 20) {
                    activeStation = st;
                    break;
                }
            }

            let promptBox = document.getElementById('game-prompt');
            if (activeStation) {
                promptBox.innerHTML = `⚡ Tap <span class="text-emerald-400 font-bold">Action</span> to <span class="text-amber-400 font-bold">${activeStation.actionText}</span>!`;
            } else {
                promptBox.innerHTML = `💡 Use D-pad to walk avatar to Timber, Forge, Farm, or Hotel!`;
            }
        }

        function upgradeTown() {
            if (game.timber >= 50 && game.iron >= 20 && game.coins >= 100) {
                game.timber -= 50;
                game.iron -= 20;
                game.coins -= 100;
                game.townLevel++;
                updateHUD();
                alert(`🎉 Congratulations! Homestead expanded to Stage ${game.townLevel}! New story chapters unlocked.`);
            } else {
                alert("❌ Not enough resources! Required: 50 Wood, 20 Iron, 100 Marrow Coins.");
            }
        }

        // Main Game Loop
        function gameLoop() {
            let dx = 0, dy = 0;
            if (keys.up) dy -= game.speed;
            if (keys.down) dy += game.speed;
            if (keys.left) dx -= game.speed;
            if (keys.right) dx += game.speed;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            game.x = Math.max(25, Math.min(canvas.width - 25, game.x + dx));
            game.y = Math.max(25, Math.min(canvas.height - 25, game.y + dy));

            if (dx !== 0 || dy !== 0) {
                checkProximity();
            }

            if (game.actionCooldown > 0) game.actionCooldown--;

            // Render Graphics
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid lines
            ctx.strokeStyle = "rgba(56, 189, 248, 0.04)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 35) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 35) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Connection paths
            ctx.strokeStyle = "rgba(245, 158, 11, 0.25)";
            ctx.lineWidth = 4;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(100, 70); ctx.lineTo(280, 160); ctx.lineTo(460, 70);
            ctx.moveTo(100, 250); ctx.lineTo(280, 160); ctx.lineTo(460, 250);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Stations
            for (let st of stations) {
                let isNearby = activeStation === st;
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.radius + (isNearby ? 5 : 0), 0, Math.PI * 2);
                ctx.fillStyle = st.color + (isNearby ? "88" : "33");
                ctx.fill();
                ctx.strokeStyle = isNearby ? "#fef08a" : st.color;
                ctx.lineWidth = isNearby ? 3 : 2;
                ctx.stroke();

                ctx.font = "20px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(st.icon, st.x, st.y - 7);

                ctx.font = "bold 9px sans-serif";
                ctx.fillStyle = "#f8fafc";
                ctx.fillText(st.name.split(" ")[0], st.x, st.y + 13);
            }

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.font = "12px sans-serif";
                ctx.fillText(p.symbol, p.x, p.y);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Draw Player Avatar
            ctx.beginPath();
            ctx.arc(game.x, game.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = "#0284c7";
            ctx.fill();
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = "14px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🧑‍🌾", game.x, game.y);

            requestAnimationFrame(gameLoop);
        }

        updateHUD();
        gameLoop();
    </script>
</body>
</html>
