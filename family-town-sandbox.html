<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Homestead • Yazoo City 1940s (AAA Immersive Edition)</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131c31;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(245, 158, 11, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Watermark Crest Emblem */
        .header-card::after {
            content: "🧬🌳";
            position: absolute;
            right: 12px;
            top: 12px;
            font-size: 1.5rem;
            opacity: 0.25;
            pointer-events: none;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .title-row h1 {
            font-size: 0.95rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .counters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.78rem;
            background: rgba(0,0,0,0.25);
            padding: 6px;
            border-radius: 8px;
        }

        .counter-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .notice-banner {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.78rem;
            text-align: center;
            color: var(--accent-gold);
        }

        .viewport-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .viewport-header {
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 240px;
            display: block;
            background: #0f172a;
        }

        .controls-area {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 200px;
            margin: 0 auto;
        }

        .btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 9px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:active { transform: scale(0.96); }

        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-action { 
            grid-column: 2; 
            grid-row: 2; 
            background: var(--accent-green);
            border-color: #059669;
            color: #fff;
        }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .station-grid-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .station-chip {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .station-chip:hover { border-color: var(--accent-gold); }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .btn-primary-action {
            flex: 1;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-secondary-action {
            flex: 1;
            background: #334155;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Family Crest Watermark -->
        <div class="header-card">
            <div class="title-row">
                <span>🧬🌳</span>
                <h1>Rhodes Family Homestead • Yazoo City 1940s</h1>
            </div>
            <div class="subtitle">Packed in the Marrow Lineage • Rhodes Family Legacy Suite</div>
            <div class="counters-grid">
                <div class="counter-item">🟡 <span id="stat-gold">12330</span></div>
                <div class="counter-item">🌾 <span id="stat-crops">6830</span></div>
                <div class="counter-item">🪵 <span id="stat-wood">1510</span></div>
                <div class="counter-item">🔥 <span id="stat-heat">2385</span></div>
                <div class="counter-item">❤️ <span id="stat-heart">6949</span></div>
                <div class="counter-item">📚 <span id="stat-knowledge">345</span></div>
            </div>
        </div>

        <!-- Banner -->
        <div class="notice-banner" id="banner-text">
            🔔 Explore Yazoo City: Select portals or drive tractor & chop timber!
        </div>

        <!-- Canvas Viewport -->
        <div class="viewport-card">
            <div class="viewport-header">
                <span id="location-title">🏰 Yazoo City 1940s Town Map & Homestead Nexus</span>
                <span id="stage-indicator">Stage 20</span>
            </div>
            <canvas id="gameCanvas" width="460" height="240"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <div class="d-pad">
                <button class="btn btn-up" onclick="movePlayer('up')">⬆️</button>
                <button class="btn btn-left" onclick="movePlayer('left')">⬅️</button>
                <button class="btn btn-action" onclick="triggerAction()">🌳 Action</button>
                <button class="btn btn-right" onclick="movePlayer('right')">➡️</button>
                <button class="btn btn-down" onclick="movePlayer('down')">⬇️</button>
            </div>

            <div class="station-grid-selector">
                <button class="station-chip" onclick="setStation('town')">🏰 Town Map</button>
                <button class="station-chip" onclick="setStation('farm')">🚜 Farmland</button>
                <button class="station-chip" onclick="setStation('timber')">🪵 Timber</button>
                <button class="station-chip" onclick="setStation('forge')">🔥 Forge</button>
                <button class="station-chip" onclick="setStation('hotel')">🏨 Hotel</button>
                <button class="station-chip" onclick="setStation('school')">📚 School</button>
            </div>

            <div class="action-row">
                <button class="btn-primary-action" id="btn-main-action" onclick="triggerAction()">Enter Selected Station</button>
                <button class="btn-secondary-action" onclick="setStation('town')">Return to Town Map</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            station: 'town',
            playerX: 230,
            playerY: 150,
            isWalking: false,
            frameAnim: 0,
            gold: 12330,
            crops: 6830,
            wood: 1510,
            heat: 2385,
            hearts: 6949,
            knowledge: 345,
            stage: 20,
            shakeTimer: 0,
            treeFallAngle: 0,
            isChopping: false,
            particles: []
        };

        for(let i=0; i<20; i++) {
            state.particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                speedY: (Math.random() * 0.3 + 0.1) * -1,
                alpha: Math.random() * 0.4 + 0.1
            });
        }

        function setStation(stationId) {
            state.station = stationId;
            state.treeFallAngle = 0;
            state.isChopping = false;
            let title = "", banner = "", btnText = "";
            switch(stationId) {
                case 'town':
                    title = "🏰 Yazoo City 1940s Town Map & Homestead Nexus";
                    banner = "🔔 Explore Yazoo City: Select portals or visit stations!";
                    btnText = "Enter Selected Station";
                    break;
                case 'farm':
                    title = "🚜 Tom Mitchell Farmland: Drive Tractor & Harvest";
                    banner = "🔔 Tom Mitchell Farmland: Use D-pad to drive tractor & collect crops!";
                    btnText = "Harvest & Plow Crops";
                    break;
                case 'timber':
                    title = "🪵 Lucius Hatton Timberland: Giant Timber Chopping";
                    banner = "🔔 Lucius Timberland: Tap Action to chop tree, trigger screen-shake & collect logs!";
                    btnText = "Chop Down Giant Tree";
                    break;
                case 'forge':
                    title = "🔥 Fred Hatton Blacksmith Forge: Iron & Tool Upgrades";
                    banner = "🔔 Fred's Forge: Tap Action to pump bellows & stoke flames!";
                    btnText = "Stoke Forge & Upgrade";
                    break;
                case 'hotel':
                    title = "🏨 Aunt Zelma's Hotel & Family Guest House";
                    banner = "🔔 Zelma's Hotel: Welcome family visitors from Packed in the Marrow!";
                    btnText = "Manage Guest House";
                    break;
                case 'school':
                    title = "📚 Zelma's Schoolhouse: Marrow Science & History Curriculum";
                    banner = "🔔 Zelma's Schoolhouse: Study curriculum to teach children & gain knowledge!";
                    btnText = "Advance School Curriculum";
                    break;
            }
            document.getElementById('location-title').innerText = title;
            document.getElementById('banner-text').innerText = banner;
            document.getElementById('btn-main-action').innerText = btnText;
        }

        function movePlayer(dir) {
            state.isWalking = true;
            if(dir === 'up') {
                state.playerY = Math.max(90, state.playerY - 15);
                if(state.station === 'farm') state.playerX = Math.min(380, state.playerX + 15); // Drive tractor right/forward
            }
            if(dir === 'down') {
                state.playerY = Math.min(200, state.playerY + 15);
                if(state.station === 'farm') state.playerX = Math.max(60, state.playerX - 15); // Drive tractor back
            }
            if(dir === 'left') state.playerX = Math.max(40, state.playerX - 15);
            if(dir === 'right') state.playerX = Math.min(420, state.playerX + 15);
            setTimeout(() => { state.isWalking = false; }, 200);
        }

        function triggerAction() {
            if(state.station === 'farm') {
                state.crops += 75;
                document.getElementById('stat-crops').innerText = state.crops;
            } else if(state.station === 'timber') {
                // Trigger Screen Shake and Tree Fall Animation
                state.isChopping = true;
                state.shakeTimer = 15; // 15 frames of screen shake
                let fallInterval = setInterval(() => {
                    state.treeFallAngle += 0.2;
                    if(state.treeFallAngle >= Math.PI / 2) {
                        clearInterval(fallInterval);
                        state.wood += 50;
                        document.getElementById('stat-wood').innerText = state.wood;
                        setTimeout(() => { state.treeFallAngle = 0; state.isChopping = false; }, 800);
                    }
                }, 50);
            } else if(state.station === 'forge') {
                state.heat += 40;
                document.getElementById('stat-heat').innerText = state.heat;
            } else if(state.station === 'hotel') {
                state.hearts += 30;
                document.getElementById('stat-heart').innerText = state.hearts;
            } else if(state.station === 'school') {
                state.knowledge += 15;
                document.getElementById('stat-knowledge').innerText = state.knowledge;
            } else {
                state.gold += 100;
                document.getElementById('stat-gold').innerText = state.gold;
            }
        }

        function render() {
            ctx.save();
            // Apply Screen Shake Offset if active
            if(state.shakeTimer > 0) {
                let shakeX = (Math.random() - 0.5) * 8;
                let shakeY = (Math.random() - 0.5) * 8;
                ctx.translate(shakeX, shakeY);
                state.shakeTimer--;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sky Background
            let sky = ctx.createLinearGradient(0, 0, 0, 130);
            sky.addColorStop(0, '#090d16');
            sky.addColorStop(1, '#1b2a4a');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, 130);

            // Moon / Sun
            ctx.beginPath();
            ctx.arc(415, 30, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#fde68a';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ground
            let ground = ctx.createLinearGradient(0, 130, 0, canvas.height);
            ground.addColorStop(0, '#047857');
            ground.addColorStop(1, '#022c22');
            ctx.fillStyle = ground;
            ctx.fillRect(0, 130, canvas.width, canvas.height - 130);

            let spriteName = "Tommy Rhodes";

            if(state.station === 'town') {
                spriteName = "Homestead Nexus";
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(230, 95); ctx.lineTo(70, 65);
                ctx.moveTo(230, 95); ctx.lineTo(390, 65);
                ctx.stroke();

                // Town Hall / Church / School Portals
                ctx.fillStyle = '#92400e';
                ctx.fillRect(190, 60, 80, 55);
                ctx.fillStyle = '#b45309';
                ctx.beginPath(); ctx.moveTo(180, 60); ctx.lineTo(230, 30); ctx.lineTo(280, 60); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText('STAGE 20 HOMESTEAD', 178, 90);

            } else if(state.station === 'farm') {
                spriteName = "Tom Mitchell";
                // Farmhouse Backdrop
                ctx.fillStyle = '#7c2d12';
                ctx.fillRect(30, 55, 80, 65);
                ctx.fillStyle = '#991b1b';
                ctx.beginPath(); ctx.moveTo(20, 55); ctx.lineTo(70, 25); ctx.lineTo(120, 55); ctx.fill();

                // Growing Corn & Wheat Stalks across Farmland
                for(let i=0; i<5; i++) {
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(140 + (i * 35), 140, 8, 22);
                    ctx.fillStyle = '#ca8a04';
                    ctx.beginPath(); ctx.arc(144 + (i * 35), 140, 7, 0, Math.PI*2); ctx.fill();
                }

                // Interactive Driving Tractor Sprite
                let tx = state.playerX;
                let ty = state.playerY - 20;
                ctx.fillStyle = '#15803d'; // Tractor body
                ctx.fillRect(tx - 25, ty, 50, 24);
                ctx.fillStyle = '#1e293b'; // Wheels
                ctx.beginPath(); ctx.arc(tx - 15, ty + 24, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(tx + 15, ty + 24, 12, 0, Math.PI*2); ctx.fill();

            } else if(state.station === 'timber') {
                spriteName = "Lucius Hatton";
                // Lucius Timberland Cabin
                ctx.fillStyle = '#581c87';
                ctx.fillRect(30, 60, 80, 60);

                // Giant Tree with Physics Fall Animation
                ctx.save();
                ctx.translate(320, 120);
                ctx.rotate(state.treeFallAngle);
                ctx.fillStyle = '#451a03'; // Trunk
                ctx.fillRect(-10, -60, 20, 60);
                ctx.fillStyle = '#064e3b'; // Leaves crown
                ctx.beginPath(); ctx.arc(0, -70, 28, 0, Math.PI*2); ctx.fill();
                ctx.restore();

                // Log Stacked Pile
                ctx.fillStyle = '#78350f';
                ctx.fillRect(160, 105, 70, 25);

            } else if(state.station === 'forge') {
                spriteName = "Fred Hatton";
                ctx.fillStyle = '#334155';
                ctx.fillRect(40, 60, 80, 60);
                ctx.fillStyle = '#ef4444'; // Forge fire
                ctx.beginPath(); ctx.arc(310, 85, 12, 0, Math.PI*2); ctx.fill();

            } else if(state.station === 'hotel') {
                spriteName = "Aunt Zelma";
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(80, 45, 300, 75);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(110, 60, 25, 35);
                ctx.fillRect(325, 60, 25, 35);

            } else if(state.station === 'school') {
                spriteName = "Zelma Schoolhouse";
                ctx.fillStyle = '#065f46';
                ctx.fillRect(80, 45, 300, 75);
                ctx.fillStyle = '#f59e0b'; // Bell tower
                ctx.fillRect(220, 15, 20, 30);
                ctx.beginPath(); ctx.arc(230, 25, 6, 0, Math.PI*2); ctx.fill();
            }

            // Render Family Sprite Character with Name Badge (except when driving tractor on farm)
            if(state.station !== 'farm') {
                state.frameAnim += 0.1;
                let bounce = state.isWalking ? Math.sin(state.frameAnim * 4) * 3 : 0;
                let px = state.playerX;
                let py = state.playerY + bounce;

                ctx.beginPath();
                ctx.ellipse(px, py + 16, 10, 3, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fill();

                // Overalls & Shirt
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(px - 6, py - 2, 12, 16);
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(px - 5, py - 12, 10, 12);

                // Head & Straw Hat
                ctx.fillStyle = '#b45309';
                ctx.beginPath(); ctx.arc(px, py - 16, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(px - 10, py - 22, 20, 3);

                // Name Tag Badge
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1;
                ctx.fillRect(px - 38, py - 42, 76, 14);
                ctx.strokeRect(px - 38, py - 42, 76, 14);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText(spriteName, px - 32, py - 32);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
