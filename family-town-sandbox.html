<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Homestead • Yazoo City 1940s (AAA Immersive Suite)</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131c31;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(245, 158, 11, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .title-row h1 {
            font-size: 1rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .counters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.78rem;
            background: rgba(0,0,0,0.25);
            padding: 6px;
            border-radius: 8px;
        }

        .counter-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .notice-banner {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.78rem;
            text-align: center;
            color: var(--accent-gold);
        }

        .viewport-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .viewport-header {
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 240px;
            display: block;
            background: #0f172a;
        }

        .controls-area {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 200px;
            margin: 0 auto;
        }

        .btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 9px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:active { transform: scale(0.96); }

        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-action { 
            grid-column: 2; 
            grid-row: 2; 
            background: var(--accent-green);
            border-color: #059669;
            color: #fff;
        }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .station-grid-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .station-chip {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .station-chip:hover { border-color: var(--accent-gold); }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .btn-primary-action {
            flex: 1;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-secondary-action {
            flex: 1;
            background: #334155;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-card">
            <div class="title-row">
                <span>🧬</span>
                <h1>Rhodes Family Homestead • Yazoo City 1940s</h1>
            </div>
            <div class="subtitle">Packed in the Marrow Lineage • AAA Immersive Town & Land Economy</div>
            <div class="counters-grid">
                <div class="counter-item">🟡 <span id="stat-gold">12330</span></div>
                <div class="counter-item">🌾 <span id="stat-crops">6830</span></div>
                <div class="counter-item">🪵 <span id="stat-wood">1510</span></div>
                <div class="counter-item">🔥 <span id="stat-heat">2385</span></div>
                <div class="counter-item">❤️ <span id="stat-heart">6949</span></div>
                <div class="counter-item">📚 <span id="stat-knowledge">330</span></div>
            </div>
        </div>

        <!-- Banner -->
        <div class="notice-banner" id="banner-text">
            🔔 Explore Yazoo City: Select portals or walk up to stations!
        </div>

        <!-- Canvas Viewport -->
        <div class="viewport-card">
            <div class="viewport-header">
                <span id="location-title">🏰 Yazoo City 1940s Town Map & Homestead Nexus</span>
                <span id="stage-indicator">Stage 20</span>
            </div>
            <canvas id="gameCanvas" width="460" height="240"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <div class="d-pad">
                <button class="btn btn-up" onclick="movePlayer('up')">⬆️</button>
                <button class="btn btn-left" onclick="movePlayer('left')">⬅️</button>
                <button class="btn btn-action" onclick="triggerAction()">🌳 Action</button>
                <button class="btn btn-right" onclick="movePlayer('right')">➡️</button>
                <button class="btn btn-down" onclick="movePlayer('down')">⬇️</button>
            </div>

            <div class="station-grid-selector">
                <button class="station-chip" onclick="setStation('town')">🏰 Town Map</button>
                <button class="station-chip" onclick="setStation('farm')">🚜 Farmland</button>
                <button class="station-chip" onclick="setStation('timber')">🪵 Timber</button>
                <button class="station-chip" onclick="setStation('forge')">🔥 Forge</button>
                <button class="station-chip" onclick="setStation('hotel')">🏨 Hotel</button>
                <button class="station-chip" onclick="setStation('school')">📚 School</button>
            </div>

            <div class="action-row">
                <button class="btn-primary-action" id="btn-main-action" onclick="triggerAction()">Enter Selected Station</button>
                <button class="btn-secondary-action" onclick="setStation('town')">Return to Town Map</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            station: 'town', // 'town', 'farm', 'timber', 'forge', 'hotel', 'school'
            playerX: 230,
            playerY: 130,
            isWalking: false,
            frameAnim: 0,
            gold: 12330,
            crops: 6830,
            wood: 1510,
            heat: 2385,
            hearts: 6949,
            knowledge: 330,
            stage: 20,
            particles: []
        };

        // Initialize atmospheric particles
        for(let i=0; i<25; i++) {
            state.particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                speedY: (Math.random() * 0.4 + 0.2) * -1,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function setStation(stationId) {
            state.station = stationId;
            let title = "";
            let banner = "";
            let btnText = "";

            switch(stationId) {
                case 'town':
                    title = "🏰 Yazoo City 1940s Town Map & Homestead Nexus";
                    banner = "🔔 Explore Yazoo City: Select portals or walk up to stations!";
                    btnText = "Enter Selected Station";
                    break;
                case 'farm':
                    title = "🚜 Tom Mitchell Farmland: Tractor Tier 3 Active";
                    banner = "🔔 Tom Mitchell Farmland: Tap Action to harvest crops and plow fields!";
                    btnText = "Harvest & Plow Crops";
                    break;
                case 'timber':
                    title = "🪵 Lucius Hatton Timberland: Giant Timber Chopping";
                    banner = "🔔 Lucius Timberland: Tap Action to chop timber logs for firewood!";
                    btnText = "Chop Timber Logs";
                    break;
                case 'forge':
                    title = "🔥 Fred Hatton Blacksmith Forge: Iron & Tool Upgrades";
                    banner = "🔔 Fred's Forge: Tap Action to stoke the flames and forge tools!";
                    btnText = "Stoke Forge & Upgrade";
                    break;
                case 'hotel':
                    title = "🏨 Aunt Zelma's Hotel & Family Guest House";
                    banner = "🔔 Zelma's Hotel: Tap Action to welcome family visitors & earn hearts!";
                    btnText = "Manage Guest House";
                    break;
                case 'school':
                    title = "📚 Zelma's Schoolhouse: Marrow Science & History Curriculum";
                    banner = "🔔 Zelma's Schoolhouse: Tap Action to study curriculum & gain knowledge!";
                    btnText = "Advance School Curriculum";
                    break;
            }

            document.getElementById('location-title').innerText = title;
            document.getElementById('banner-text').innerText = banner;
            document.getElementById('btn-main-action').innerText = btnText;
        }

        function movePlayer(dir) {
            state.isWalking = true;
            if(dir === 'up') state.playerY = Math.max(70, state.playerY - 15);
            if(dir === 'down') state.playerY = Math.min(190, state.playerY + 15);
            if(dir === 'left') state.playerX = Math.max(40, state.playerX - 15);
            if(dir === 'right') state.playerX = Math.min(420, state.playerX + 15);
            setTimeout(() => { state.isWalking = false; }, 200);
        }

        function triggerAction() {
            if(state.station === 'farm') {
                state.crops += 50;
                document.getElementById('stat-crops').innerText = state.crops;
            } else if(state.station === 'timber') {
                state.wood += 25;
                document.getElementById('stat-wood').innerText = state.wood;
            } else if(state.station === 'forge') {
                state.heat += 40;
                document.getElementById('stat-heat').innerText = state.heat;
            } else if(state.station === 'hotel') {
                state.hearts += 30;
                document.getElementById('stat-heart').innerText = state.hearts;
            } else if(state.station === 'school') {
                state.knowledge += 15;
                document.getElementById('stat-knowledge').innerText = state.knowledge;
            } else {
                state.gold += 100;
                document.getElementById('stat-gold').innerText = state.gold;
            }

            // Particle explosion burst
            for(let i=0; i<10; i++) {
                state.particles.push({
                    x: state.playerX,
                    y: state.playerY,
                    radius: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 4,
                    speedY: (Math.random() - 0.5) * 4 - 1,
                    alpha: 1,
                    color: '#f59e0b'
                });
            }
        }

        // Draw Custom Detailed Family Sprite (Farmer / Character Avatar)
        function drawFamilySprite(ctx, x, y, isWalking, frameAnim, label) {
            state.frameAnim += 0.1;
            let bounce = isWalking ? Math.sin(frameAnim * 4) * 3 : 0;
            let py = y + bounce;

            // Soft Shadow
            ctx.beginPath();
            ctx.ellipse(x, py + 16, 9, 3, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();

            // Overalls & Plaid Shirt (Family Signature Sprite)
            ctx.fillStyle = '#1e3a8a'; // Blue overalls
            ctx.fillRect(x - 5, py - 2, 10, 14);
            ctx.fillStyle = '#dc2626'; // Red plaid shirt
            ctx.fillRect(x - 4, py - 10, 8, 10);

            // Head & Straw Hat
            ctx.fillStyle = '#b45309';
            ctx.beginPath(); 
            ctx.arc(x, py - 14, 5, 0, Math.PI * 2); 
            ctx.fill();

            ctx.fillStyle = '#f59e0b'; // Golden straw hat brim
            ctx.fillRect(x - 8, py - 18, 16, 2);
            ctx.fillRect(x - 4, py - 21, 8, 3);

            // Optional Character Label Tag above head
            if(label) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(x - 30, py - 35, 60, 12);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 8px sans-serif';
                ctx.fillText(label, x - 26, py - 27);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Sky Gradient & Sun
            let skyGrad = ctx.createLinearGradient(0, 0, 0, 140);
            skyGrad.addColorStop(0, '#0f172a');
            skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, 140);

            // Sun with Glow
            ctx.beginPath();
            ctx.arc(410, 35, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 2. Ground & Horizon Line
            let groundGrad = ctx.createLinearGradient(0, 140, 0, canvas.height);
            groundGrad.addColorStop(0, '#065f46');
            groundGrad.addColorStop(1, '#022c22');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, 140, canvas.width, canvas.height - 140);

            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 140);
            ctx.lineTo(canvas.width, 140);
            ctx.stroke();

            // 3. Station Environments & Specialized Background Elements
            let spriteName = "Tommy Rhodes";
            if(state.station === 'town') {
                spriteName = "Homestead Nexus";
                // Star Network Map Nodes connecting stations
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(230, 100); ctx.lineTo(90, 70);
                ctx.moveTo(230, 100); ctx.lineTo(370, 70);
                ctx.moveTo(230, 100); ctx.lineTo(90, 170);
                ctx.moveTo(230, 100); ctx.lineTo(370, 170);
                ctx.moveTo(230, 100); ctx.lineTo(230, 40);
                ctx.stroke();

                // Center Castle Hub Node
                ctx.beginPath();
                ctx.arc(230, 100, 22, 0, Math.PI*2);
                ctx.fillStyle = '#b45309';
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText('STAGE 20', 207, 103);
            } else if(state.station === 'farm') {
                spriteName = "Tom Mitchell";
                // Tractor & Plowing Rows
                ctx.fillStyle = '#166534';
                ctx.fillRect(80, 145, 45, 22); // Tractor body
                ctx.fillStyle = '#334155';
                ctx.beginPath(); ctx.arc(90, 167, 7, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(115, 167, 9, 0, Math.PI*2); ctx.fill(); // Wheels
                // Crops
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(170, 155, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(200, 155, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(230, 155, 6, 0, Math.PI*2); ctx.fill();
            } else if(state.station === 'timber') {
                spriteName = "Lucius Hatton";
                // Giant Timber Logs
                ctx.fillStyle = '#78350f';
                ctx.fillRect(90, 145, 70, 25);
                ctx.fillStyle = '#d97706';
                ctx.beginPath(); ctx.arc(160, 157, 12, 0, Math.PI*2); ctx.fill();
                // Axe icon indicator
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(200, 140, 4, 20);
            } else if(state.station === 'forge') {
                spriteName = "Fred Hatton";
                // Blacksmith Forge & Anvil
                ctx.fillStyle = '#334155';
                ctx.fillRect(180, 145, 70, 28);
                ctx.fillStyle = '#ef4444'; // Glowing fire
                ctx.beginPath(); ctx.arc(215, 135, 10, 0, Math.PI*2); ctx.fill();
            } else if(state.station === 'hotel') {
                spriteName = "Aunt Zelma";
                // Hotel Building Façade
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(140, 75, 180, 75);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('AUNT ZELMA GUEST HOUSE', 160, 105);
            } else if(state.station === 'school') {
                spriteName = "Zelma Schoolhouse";
                // Schoolhouse Building
                ctx.fillStyle = '#065f46';
                ctx.fillRect(140, 75, 180, 75);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('MARROW CURRICULUM LEVEL 2', 152, 105);
            }

            // 4. Render Ambient Particles
            state.particles.forEach((p) => {
                p.y += p.speedY || -0.3;
                if(p.speedX) p.x += p.speedX;
                p.alpha -= 0.005;
                if(p.alpha <= 0 || p.y < 0) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                    p.alpha = Math.random() * 0.5 + 0.2;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color || `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });

            // 5. Render Family Sprite Character with Name Tag
            drawFamilySprite(ctx, state.playerX, state.playerY, state.isWalking, state.frameAnim, spriteName);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
