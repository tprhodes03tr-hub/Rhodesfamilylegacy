<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Homestead • Yazoo City 1940s (Immersive Edition)</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131c31;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(245, 158, 11, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .title-row h1 {
            font-size: 1rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .counters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.78rem;
            background: rgba(0,0,0,0.25);
            padding: 6px;
            border-radius: 8px;
        }

        .counter-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .notice-banner {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.78rem;
            text-align: center;
            color: var(--accent-gold);
        }

        .viewport-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .viewport-header {
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 240px;
            display: block;
            background: #0f172a;
        }

        .controls-area {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 200px;
            margin: 0 auto;
        }

        .btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 9px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:active { transform: scale(0.96); }

        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-action { 
            grid-column: 2; 
            grid-row: 2; 
            background: var(--accent-green);
            border-color: #059669;
            color: #fff;
        }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .station-grid-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .station-chip {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .station-chip:hover { border-color: var(--accent-gold); }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .btn-primary-action {
            flex: 1;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-secondary-action {
            flex: 1;
            background: #334155;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <div class="title-row">
                <span>🧬</span>
                <h1>Rhodes Family Homestead • Yazoo City 1940s</h1>
            </div>
            <div class="subtitle">Packed in the Marrow Lineage • Immersive Town & Land Economy</div>
            <div class="counters-grid">
                <div class="counter-item">🟡 <span id="stat-gold">12330</span></div>
                <div class="counter-item">🌾 <span id="stat-crops">6830</span></div>
                <div class="counter-item">🪵 <span id="stat-wood">1510</span></div>
                <div class="counter-item">🔥 <span id="stat-heat">2385</span></div>
                <div class="counter-item">❤️ <span id="stat-heart">6949</span></div>
                <div class="counter-item">📚 <span id="stat-knowledge">330</span></div>
            </div>
        </div>

        <div class="notice-banner" id="banner-text">
            🔔 Explore Yazoo City: Select portals or walk up to stations!
        </div>

        <div class="viewport-card">
            <div class="viewport-header">
                <span id="location-title">🏰 Yazoo City 1940s Town Map & Homestead Nexus</span>
                <span id="stage-indicator">Stage 20</span>
            </div>
            <canvas id="gameCanvas" width="460" height="240"></canvas>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <button class="btn btn-up" onclick="movePlayer('up')">⬆️</button>
                <button class="btn btn-left" onclick="movePlayer('left')">⬅️</button>
                <button class="btn btn-action" onclick="triggerAction()">🌳 Action</button>
                <button class="btn btn-right" onclick="movePlayer('right')">➡️</button>
                <button class="btn btn-down" onclick="movePlayer('down')">⬇️</button>
            </div>

            <div class="station-grid-selector">
                <button class="station-chip" onclick="setStation('town')">🏰 Town Map</button>
                <button class="station-chip" onclick="setStation('farm')">🚜 Farmland</button>
                <button class="station-chip" onclick="setStation('timber')">🪵 Timber</button>
                <button class="station-chip" onclick="setStation('forge')">🔥 Forge</button>
                <button class="station-chip" onclick="setStation('hotel')">🏨 Hotel</button>
                <button class="station-chip" onclick="setStation('school')">📚 School</button>
            </div>

            <div class="action-row">
                <button class="btn-primary-action" id="btn-main-action" onclick="triggerAction()">Enter Selected Station</button>
                <button class="btn-secondary-action" onclick="setStation('town')">Return to Town Map</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            station: 'town',
            playerX: 230,
            playerY: 150,
            isWalking: false,
            frameAnim: 0,
            gold: 12330,
            crops: 6830,
            wood: 1510,
            heat: 2385,
            hearts: 6949,
            knowledge: 330,
            stage: 20,
            particles: []
        };

        for(let i=0; i<20; i++) {
            state.particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                speedY: (Math.random() * 0.3 + 0.1) * -1,
                alpha: Math.random() * 0.4 + 0.1
            });
        }

        function setStation(stationId) {
            state.station = stationId;
            let title = "", banner = "", btnText = "";
            switch(stationId) {
                case 'town':
                    title = "🏰 Yazoo City 1940s Town Map & Homestead Nexus";
                    banner = "🔔 Explore Yazoo City: Select portals or walk up to stations!";
                    btnText = "Enter Selected Station";
                    break;
                case 'farm':
                    title = "🚜 Tom Mitchell Farmland: Tractor Tier 3 Active";
                    banner = "🔔 Tom Mitchell Farmland: Tap Action to harvest crops and plow fields!";
                    btnText = "Harvest & Plow Crops";
                    break;
                case 'timber':
                    title = "🪵 Lucius Hatton Timberland: Giant Timber Chopping";
                    banner = "🔔 Lucius Timberland: Tap Action to chop timber logs for firewood!";
                    btnText = "Chop Timber Logs";
                    break;
                case 'forge':
                    title = "🔥 Fred Hatton Blacksmith Forge: Iron & Tool Upgrades";
                    banner = "🔔 Fred's Forge: Tap Action to stoke the flames and forge tools!";
                    btnText = "Stoke Forge & Upgrade";
                    break;
                case 'hotel':
                    title = "🏨 Aunt Zelma's Hotel & Family Guest House";
                    banner = "🔔 Zelma's Hotel: Tap Action to welcome family visitors & earn hearts!";
                    btnText = "Manage Guest House";
                    break;
                case 'school':
                    title = "📚 Zelma's Schoolhouse: Marrow Science & History Curriculum";
                    banner = "🔔 Zelma's Schoolhouse: Tap Action to study curriculum & gain knowledge!";
                    btnText = "Advance School Curriculum";
                    break;
            }
            document.getElementById('location-title').innerText = title;
            document.getElementById('banner-text').innerText = banner;
            document.getElementById('btn-main-action').innerText = btnText;
        }

        function movePlayer(dir) {
            state.isWalking = true;
            if(dir === 'up') state.playerY = Math.max(90, state.playerY - 15);
            if(dir === 'down') state.playerY = Math.min(200, state.playerY + 15);
            if(dir === 'left') state.playerX = Math.max(40, state.playerX - 15);
            if(dir === 'right') state.playerX = Math.min(420, state.playerX + 15);
            setTimeout(() => { state.isWalking = false; }, 200);
        }

        function triggerAction() {
            if(state.station === 'farm') state.crops += 50;
            else if(state.station === 'timber') state.wood += 25;
            else if(state.station === 'forge') state.heat += 40;
            else if(state.station === 'hotel') state.hearts += 30;
            else if(state.station === 'school') state.knowledge += 15;
            else state.gold += 100;

            document.getElementById('stat-crops').innerText = state.crops;
            document.getElementById('stat-wood').innerText = state.wood;
            document.getElementById('stat-heat').innerText = state.heat;
            document.getElementById('stat-heart').innerText = state.hearts;
            document.getElementById('stat-knowledge').innerText = state.knowledge;
            document.getElementById('stat-gold').innerText = state.gold;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sky
            let sky = ctx.createLinearGradient(0, 0, 0, 130);
            sky.addColorStop(0, '#090d16');
            sky.addColorStop(1, '#1b2a4a');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, 130);

            // Sun / Moon Glow
            ctx.beginPath();
            ctx.arc(415, 30, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Rolling Hills / Horizon Background
            ctx.fillStyle = '#064e3b';
            ctx.beginPath();
            ctx.moveTo(0, 130);
            ctx.lineTo(0, 100);
            ctx.quadraticCurveTo(120, 80, 240, 100);
            ctx.quadraticCurveTo(360, 120, 460, 95);
            ctx.lineTo(460, 130);
            ctx.fill();

            // Ground / Farmland
            let ground = ctx.createLinearGradient(0, 130, 0, canvas.height);
            ground.addColorStop(0, '#047857');
            ground.addColorStop(1, '#064e3b');
            ctx.fillStyle = ground;
            ctx.fillRect(0, 130, canvas.width, canvas.height - 130);

            // Dirt road / pathway
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.moveTo(180, canvas.height);
            ctx.lineTo(230, 130);
            ctx.lineTo(280, canvas.height);
            ctx.fill();

            // Detailed Station Architecture & Environment
            let spriteName = "Tommy Rhodes";
            if(state.station === 'town') {
                spriteName = "Homestead Nexus";
                // Star Network Hub Lines
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(230, 95); ctx.lineTo(80, 70);
                ctx.moveTo(230, 95); ctx.lineTo(380, 70);
                ctx.moveTo(230, 95); ctx.lineTo(80, 170);
                ctx.moveTo(230, 95); ctx.lineTo(380, 170);
                ctx.moveTo(230, 95); ctx.lineTo(230, 35);
                ctx.stroke();

                // Town Hall / Castle Center
                ctx.fillStyle = '#92400e';
                ctx.fillRect(205, 70, 50, 45);
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                ctx.moveTo(200, 70); ctx.lineTo(230, 45); ctx.lineTo(260, 70);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 8px sans-serif';
                ctx.fillText('STAGE 20', 213, 95);
            } else if(state.station === 'farm') {
                spriteName = "Tom Mitchell";
                // Farmhouse & Tractor
                ctx.fillStyle = '#7c2d12';
                ctx.fillRect(50, 65, 80, 65);
                ctx.fillStyle = '#dc2626';
                ctx.beginPath(); ctx.moveTo(40, 65); ctx.lineTo(90, 35); ctx.lineTo(140, 65); ctx.fill();
                // Tractor
                ctx.fillStyle = '#15803d';
                ctx.fillRect(290, 95, 55, 30);
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.arc(305, 125, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(330, 125, 12, 0, Math.PI*2); ctx.fill();
            } else if(state.station === 'timber') {
                spriteName = "Lucius Hatton";
                // Timber Cabin & Log Stacks
                ctx.fillStyle = '#581c87';
                ctx.fillRect(60, 70, 75, 60);
                ctx.fillStyle = '#78350f';
                ctx.fillRect(280, 100, 100, 25);
                ctx.fillStyle = '#d97706';
                ctx.beginPath(); ctx.arc(380, 112, 12, 0, Math.PI*2); ctx.fill();
            } else if(state.station === 'forge') {
                spriteName = "Fred Hatton";
                // Blacksmith Stone Forge
                ctx.fillStyle = '#334155';
                ctx.fillRect(60, 75, 80, 55);
                ctx.fillStyle = '#475569';
                ctx.fillRect(270, 85, 90, 40);
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(315, 80, 12, 0, Math.PI*2); ctx.fill();
            } else if(state.station === 'hotel') {
                spriteName = "Aunt Zelma";
                // Grand Hotel Building
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(100, 55, 260, 75);
                ctx.fillStyle = '#1d4ed8';
                ctx.fillRect(120, 75, 45, 55);
                ctx.fillRect(295, 75, 45, 55);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText('AUNT ZELMA HOTEL', 170, 72);
            } else if(state.station === 'school') {
                spriteName = "Zelma Schoolhouse";
                // Schoolhouse Building with Bell Tower
                ctx.fillStyle = '#065f46';
                ctx.fillRect(100, 55, 260, 75);
                ctx.fillStyle = '#047857';
                ctx.fillRect(210, 30, 40, 30); // Bell tower
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText('ZELMA SCHOOLHOUSE', 165, 72);
            }

            // Particles
            state.particles.forEach((p) => {
                p.y += p.speedY;
                p.alpha -= 0.003;
                if(p.alpha <= 0 || p.y < 0) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                    p.alpha = Math.random() * 0.4 + 0.1;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });

            // Detailed Character Sprite with Name Banner
            state.frameAnim += 0.1;
            let bounce = state.isWalking ? Math.sin(state.frameAnim * 4) * 3 : 0;
            let px = state.playerX;
            let py = state.playerY + bounce;

            // Shadow
            ctx.beginPath();
            ctx.ellipse(px, py + 16, 10, 3, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();

            // Overalls & Shirt
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(px - 6, py - 2, 12, 16);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(px - 5, py - 12, 10, 12);

            // Head & Hat
            ctx.fillStyle = '#b45309';
            ctx.beginPath(); ctx.arc(px, py - 16, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(px - 10, py - 22, 20, 3);
            ctx.fillRect(px - 5, py - 26, 10, 4);

            // Name Tag Badge
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1;
            ctx.fillRect(px - 38, py - 42, 76, 14);
            ctx.strokeRect(px - 38, py - 42, 76, 14);
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(spriteName, px - 32, py - 32);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
