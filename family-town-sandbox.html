<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhodes Family Legacy • Immersive Animated Workstations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .gold-border { border-color: rgba(245, 158, 11, 0.5); }
        .glow-text { text-shadow: 0 0 15px rgba(245, 158, 11, 0.7); }
        canvas { background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); border: 3px solid #f59e0b; border-radius: 16px; box-shadow: 0 0 30px rgba(245, 158, 11, 0.3); display: block; margin: 0 auto; touch-action: none; max-width: 100%; height: auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6">

    <!-- Top Navigation Header -->
    <header class="max-w-4xl mx-auto w-full bg-slate-900/95 border gold-border rounded-2xl p-2.5 mb-2 shadow-2xl flex flex-wrap justify-between items-center gap-2">
        <div>
            <h1 class="text-base md:text-2xl font-bold text-amber-400 glow-text flex items-center gap-2">
                🏡 Rhodes Family Homestead Suite
            </h1>
            <p id="header-subtitle" class="text-[10px] text-slate-400">Walk to stations for animated interactive workshops!</p>
        </div>
        
        <!-- Player Resource HUD -->
        <div class="flex items-center gap-2.5 bg-slate-950 px-3 py-1 rounded-xl border border-amber-500/30 text-xs shadow-inner">
            <div>🪙 <span id="hud-coins" class="font-bold text-amber-400">585</span></div>
            <div>🪵 <span id="hud-timber" class="font-bold text-emerald-400">35</span></div>
            <div>⚒️ <span id="hud-iron" class="font-bold text-orange-400">60</span></div>
        </div>

        <button onclick="exitToOverworld()" id="back-btn" class="hidden text-xs border border-amber-500/40 text-amber-400 px-2.5 py-1 rounded-xl hover:bg-amber-500/10 transition-colors">
            ← Return to Map
        </button>
    </header>

    <!-- Main Game Canvas Container -->
    <main class="max-w-4xl mx-auto w-full flex flex-col items-center gap-2 mb-2">
        
        <div class="relative w-full flex justify-center px-1">
            <canvas id="gameCanvas" width="400" height="300"></canvas>
        </div>

        <!-- Mobile & Tablet On-Screen Controls (Overworld) -->
        <div id="dpad-controls" class="flex flex-col items-center gap-1 w-full my-1">
            <button ontouchstart="keys.up=true; event.preventDefault();" ontouchend="keys.up=false; event.preventDefault();" onmousedown="keys.up=true;" onmouseup="keys.up=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">⬆️</button>
            <div class="flex justify-center gap-3 w-full max-w-xs">
                <button ontouchstart="keys.left=true; event.preventDefault();" ontouchend="keys.left=false; event.preventDefault();" onmousedown="keys.left=true;" onmouseup="keys.left=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">⬅️</button>
                <button onclick="triggerAction()" class="bg-emerald-600 border border-emerald-400 text-white px-4 h-11 rounded-xl font-bold text-xs shadow-lg active:bg-emerald-500">🪓 Enter Station</button>
                <button ontouchstart="keys.right=true; event.preventDefault();" ontouchend="keys.right=false; event.preventDefault();" onmousedown="keys.right=true;" onmouseup="keys.right=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">➡️</button>
            </div>
            <button ontouchstart="keys.down=true; event.preventDefault();" ontouchend="keys.down=false; event.preventDefault();" onmousedown="keys.down=true;" onmouseup="keys.down=false;" class="bg-slate-800 border border-amber-500/50 text-amber-400 w-16 h-11 rounded-xl font-bold text-lg active:bg-amber-600 active:text-slate-950 shadow-lg">⬇️</button>
        </div>

        <!-- Animated Workshop Action Controls (Inside Station) -->
        <div id="minigame-controls" class="hidden flex justify-center gap-3 w-full my-2">
            <button onclick="performWorkshopAction()" id="workshop-action-btn" class="bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold px-6 py-3 rounded-2xl shadow-xl text-sm border border-amber-400 active:scale-95 transition-all">
                🔨 Pump & Work
            </button>
            <button onclick="exitToOverworld()" class="bg-slate-800 border border-slate-600 text-slate-300 px-4 py-3 rounded-2xl font-bold text-sm hover:bg-slate-700">
                🚪 Return to Map
            </button>
        </div>

        <!-- Instructions & Status Bar -->
        <div class="w-full bg-slate-900/90 border gold-border rounded-xl p-2.5 flex flex-col md:flex-row justify-between items-center gap-2 text-xs">
            <div id="game-prompt" class="text-amber-300 font-bold text-center md:text-left">
                💡 Walk avatar to Lucius, Fred, Tom, or Zelma and tap Enter!
            </div>
            <button onclick="upgradeTown()" class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold px-3 py-2 rounded-xl shadow-lg transition-transform text-[11px]">
                🏗️ Expand Homestead (50 Wood, 20 Iron, 100 Coins)
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-[10px] text-slate-500 border-t border-slate-800 pt-1">
        © 2026 Tommy Philip Rhodes • Rhodes Family Legacy. All Rights Reserved.
    </footer>

    <!-- Animated Canvas Workshop Engine -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let game = {
            coins: parseInt(localStorage.getItem('rhodes_coins') || '585'),
            timber: parseInt(localStorage.getItem('rhodes_timber') || '35'),
            iron: parseInt(localStorage.getItem('rhodes_iron') || '60'),
            townLevel: parseInt(localStorage.getItem('rhodes_town_level') || '1'),
            x: 200,
            y: 150,
            speed: 3.5,
            state: 'OVERWORLD', // OVERWORLD, TIMBER, FORGE, FARM, HOTEL
            animationPhase: 0
        };

        let keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                if (game.state === 'OVERWORLD') triggerAction();
                else performWorkshopAction();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        const stations = [
            { id: "timber", name: "Lucius Timberland", x: 80, y: 60, radius: 30, color: "#059669", icon: "🌲", actionText: "Enter Lucius's Timber Yard" },
            { id: "forge", name: "Fred Forge", x: 320, y: 60, radius: 30, color: "#ea580c", icon: "🔥", actionText: "Enter Fred's Forge Workshop" },
            { id: "farm", name: "Tom Farmland", x: 80, y: 240, radius: 30, color: "#d97706", icon: "🌾", actionText: "Enter Tom's Farm Fields" },
            { id: "hotel", name: "Zelma Hotel", x: 320, y: 240, radius: 30, color: "#0284c7", icon: "🏨", actionText: "Enter Zelma's Hotel Lobby" },
            { id: "home", name: "Homestead", x: 200, y: 150, radius: 38, color: "#f59e0b", actionText: "Central Homestead Hub" }
        ];

        let activeStation = null;
        let particles = [];

        function updateHUD() {
            document.getElementById('hud-coins').innerText = game.coins;
            document.getElementById('hud-timber').innerText = game.timber;
            document.getElementById('hud-iron').innerText = game.iron;
            localStorage.setItem('rhodes_coins', game.coins);
            localStorage.setItem('rhodes_timber', game.timber);
            localStorage.setItem('rhodes_iron', game.iron);
            localStorage.setItem('rhodes_town_level', game.townLevel);
        }

        function triggerAction() {
            if (!activeStation) return;
            if (activeStation.id === 'home') {
                alert("🏡 Central Homestead Hub! Collect resources from family stations to upgrade your town stage.");
                return;
            }

            game.state = activeStation.id.toUpperCase();
            document.getElementById('dpad-controls').classList.add('hidden');
            document.getElementById('minigame-controls').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            
            let btn = document.getElementById('workshop-action-btn');
            if (game.state === 'TIMBER') btn.innerText = "🪓 Chop & Stack Log (+5 Timber)";
            if (game.state === 'FORGE') btn.innerText = "🔥 Pump Bellows & Strike Anvil (+3 Iron)";
            if (game.state === 'FARM') btn.innerText = "🌾 Harvest Crops & Seeds (+20 Coins)";
            if (game.state === 'HOTEL') btn.innerText = "🛎️ Welcome Guest & Manage Desk (+25 Coins)";

            document.getElementById('game-prompt').innerHTML = `⚡ Inside <span class="text-amber-400 font-bold">${activeStation.name}</span>! Watch the canvas animation as you work.`;
        }

        function exitToOverworld() {
            game.state = 'OVERWORLD';
            document.getElementById('dpad-controls').classList.remove('hidden');
            document.getElementById('minigame-controls').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('game-prompt').innerHTML = `💡 Use D-pad to walk avatar to stations!`;
        }

        function performWorkshopAction() {
            game.animationPayoff = 15; // Trigger visual bounce/spark surge
            if (game.state === 'TIMBER') {
                game.timber += 5;
                spawnParticles(200, 140, '#10b981', '🪵');
                showPopup(`🪓 Lucius chopped logs! +5 Timber (Total: ${game.timber})`);
            } else if (game.state === 'FORGE') {
                game.iron += 3;
                spawnParticles(200, 140, '#f97316', '✨');
                showPopup(`⚒️ Fred pumped bellows & struck anvil! +3 Iron (Total: ${game.iron})`);
            } else if (game.state === 'FARM') {
                game.coins += 20;
                spawnParticles(200, 140, '#f59e0b', '🪙');
                showPopup(`🌾 Tom harvested crops! +20 Coins (Total: ${game.coins})`);
            } else if (game.state === 'HOTEL') {
                game.coins += 25;
                spawnParticles(200, 140, '#38bdf8', '🪙');
                showPopup(`🛎️ Zelma welcomed guest! +25 Coins (Total: ${game.coins})`);
            }
            updateHUD();
        }

        function showPopup(msg) {
            document.getElementById('game-prompt').innerHTML = `<span class="text-emerald-400 font-bold">${msg}</span>`;
        }

        function spawnParticles(x, y, color, symbol) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 80, y: y + (Math.random() - 0.5) * 40,
                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5 - 2,
                    life: 35, symbol: symbol, color: color
                });
            }
        }

        function checkProximity() {
            activeStation = null;
            for (let st of stations) {
                let dist = Math.hypot(game.x - st.x, game.y - st.y);
                if (dist < st.radius + 15) {
                    activeStation = st;
                    break;
                }
            }

            let promptBox = document.getElementById('game-prompt');
            if (activeStation) {
                promptBox.innerHTML = `⚡ Press <span class="text-emerald-400 font-bold">Enter / Action</span> to <span class="text-amber-400 font-bold">${activeStation.actionText}</span>!`;
            } else {
                promptBox.innerHTML = `💡 Use D-pad to walk avatar to Timber, Forge, Farm, or Hotel!`;
            }
        }

        function upgradeTown() {
            if (game.timber >= 50 && game.iron >= 20 && game.coins >= 100) {
                game.timber -= 50;
                game.iron -= 20;
                game.coins -= 100;
                game.townLevel++;
                updateHUD();
                alert(`🎉 Congratulations! Homestead expanded to Stage ${game.townLevel}! New family story chapters unlocked.`);
            } else {
                alert(`❌ Not enough resources! You have ${game.timber}/50 Wood, ${game.iron}/20 Iron, ${game.coins}/100 Coins.`);
            }
        }

        // Main Render Loop with Animated Workshop Scenes
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = "rgba(56, 189, 248, 0.04)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if (game.state === 'OVERWORLD') {
                let dx = 0, dy = 0;
                if (keys.up) dy -= game.speed;
                if (keys.down) dy += game.speed;
                if (keys.left) dx -= game.speed;
                if (keys.right) dx += game.speed;

                if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

                game.x = Math.max(20, Math.min(canvas.width - 20, game.x + dx));
                game.y = Math.max(20, Math.min(canvas.height - 20, game.y + dy));

                if (dx !== 0 || dy !== 0) checkProximity();

                // Draw paths
                ctx.strokeStyle = "rgba(245, 158, 11, 0.25)";
                ctx.lineWidth = 3;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(80, 60); ctx.lineTo(200, 150); ctx.lineTo(320, 60);
                ctx.moveTo(80, 240); ctx.lineTo(200, 150); ctx.lineTo(320, 240);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw Stations
                for (let st of stations) {
                    let isNearby = activeStation === st;
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.radius + (isNearby ? 4 : 0), 0, Math.PI * 2);
                    ctx.fillStyle = st.color + (isNearby ? "88" : "33");
                    ctx.fill();
                    ctx.strokeStyle = isNearby ? "#fef08a" : st.color;
                    ctx.lineWidth = isNearby ? 3 : 2;
                    ctx.stroke();

                    if (st.id === 'home') {
                        let homeIcon = game.townLevel === 1 ? "🏡" : game.townLevel === 2 ? "🏘️" : "🏰";
                        ctx.font = "20px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(homeIcon, st.x, st.y - 7);

                        ctx.font = "bold 8px sans-serif";
                        ctx.fillStyle = "#fef08a";
                        ctx.fillText("Stage " + game.townLevel, st.x, st.y + 12);
                    } else {
                        ctx.font = "18px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(st.icon, st.x, st.y - 6);

                        ctx.font = "bold 8px sans-serif";
                        ctx.fillStyle = "#f8fafc";
                        ctx.fillText(st.name.split(" ")[0], st.x, st.y + 11);
                    }
                }

                // Draw Player Avatar
                ctx.beginPath();
                ctx.arc(game.x, game.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = "#0284c7";
                ctx.fill();
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.font = "12px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🧑‍🌾", game.x, game.y);

            } else {
                // RENDER LIVE ANIMATED WORKSHOP CANVAS SCENE
                game.animationPhase += 0.08;
                let bounce = Math.sin(game.animationPhase) * 6;

                // Workshop background frame
                ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
                ctx.fillRect(20, 20, canvas.width - 40, canvas.height - 40);
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 2;
                ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                ctx.font = "bold 15px sans-serif";
                ctx.fillStyle = "#fef08a";
                ctx.textAlign = "center";

                if (game.state === 'TIMBER') {
                    ctx.fillText("🌲 Lucius Timberland - Woodyard Workshop", canvas.width / 2, 50);
                    ctx.font = "45px sans-serif";
                    ctx.fillText("🪵", canvas.width / 2, 110 + (bounce * 0.5));
                    ctx.font = "30px sans-serif";
                    ctx.fillText("🪓", canvas.width / 2 - 35, 115 - bounce);
                } else if (game.state === 'FORGE') {
                    ctx.fillText("🔥 Fred's Forge - Anvil & Bellows", canvas.width / 2, 50);
                    ctx.font = "45px sans-serif";
                    ctx.fillText("🔥", canvas.width / 2, 110 + bounce);
                    ctx.font = "30px sans-serif";
                    ctx.fillText("🔨", canvas.width / 2 + 35, 105 - (bounce * 1.5));
                } else if (game.state === 'FARM') {
                    ctx.fillText("🌾 Tom's Farmland - Harvest & Crops", canvas.width / 2, 50);
                    ctx.font = "45px sans-serif";
                    ctx.fillText("🌾", canvas.width / 2, 110 + bounce);
                    ctx.font = "30px sans-serif";
                    ctx.fillText("🚜", canvas.width / 2 - 40, 115);
                } else if (game.state === 'HOTEL') {
                    ctx.fillText("🏨 Aunt Zelma's Hotel - Guest Lobby", canvas.width / 2, 50);
                    ctx.font = "45px sans-serif";
                    ctx.fillText("🏨", canvas.width / 2, 110 + bounce);
                    ctx.font = "30px sans-serif";
                    ctx.fillText("🔑", canvas.width / 2 + 35, 115);
                }

                ctx.font = "bold 11px sans-serif";
                ctx.fillStyle = "#38bdf8";
                ctx.fillText("Tap button below to actively animate work & gather resources!", canvas.width / 2, 185);
            }

            // Draw Particles across all states
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.font = "14px sans-serif";
                ctx.fillText(p.symbol, p.x, p.y);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        updateHUD();
        gameLoop();
    </script>
</body>
</html>
