<!-- ============================================================== -->
<!-- FORCE UPGRADE BATTLEFIELD CARDS TO CINEMATIC HYPER ART         -->
<!-- ============================================================== -->
<style>
/* 1. Make the card art container fit the tall cinematic aspect */
.card, .character-card, [data-card-name] {
  transition: transform 0.2s ease, box-shadow 0.2s ease !important;
}
.card:hover, .character-card:hover {
  transform: translateY(-4px) !important;
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.4) !important;
}

/* 2. Upgrade the card image boxes with glow and contrast */
.card-img, .card-image, .character-art, .card img {
  border-radius: 6px !important;
  filter: contrast(1.08) brightness(1.03) !important;
}
</style>

<script>
// Direct image replacement for the cards live on your screen
document.addEventListener("DOMContentLoaded", function() {
  replaceOldCardArt();
});

// Run also after a short delay in case your engine renders cards via JS
setTimeout(replaceOldCardArt, 500);
setTimeout(replaceOldCardArt, 1500);

function replaceOldCardArt() {
  // Mapping each card on your screen to your upgraded cinematic files
  const cinematicMap = {
    // Iron Syndicate (Top Row)
    "chrono-lock": "Screenshot_20260918_175152_Photos.jpg",
    "null-byte": "Screenshot_20260918_112817_Photos.jpg",
    "apex volt": "syndicate.png",

    // Ancestral Vanguard (Bottom Row)
    "sundiata": "sundiata.jpg",
    "marcus": "marcus.jpg",
    "mother luta": "mother-luta.jpg",

    // Reserve Operatives
    "xochitl": "Screenshot_20260918_112806_Photos.jpg",
    "mateo": "Screenshot_20260918_130602_Photos.jpg",
    "elena": "Screenshot_20260918_130641_Photos.jpg",
    "kenjiro": "Screenshot_20260918_131036_Photos.jpg",
    "canopy": "Screenshot_20260918_131053_Photos.jpg"
  };

  // Find all cards on screen
  const cards = document.querySelectorAll('.card, .character-card, .reserve-card, [class*="card"]');
  
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    const img = card.querySelector('img');
    
    if (img) {
      for (const [name, newSrc] of Object.entries(cinematicMap)) {
        if (text.includes(name) || (img.src && img.src.toLowerCase().includes(name))) {
          // Replace with the cinematic image file
          if (!img.src.includes(newSrc)) {
            img.src = newSrc;
          }
        }
      }
    }
  });
}
</script>
