<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanguard - Detroit High Rooftops</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 10px;
    background: #090d16;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #game-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #0c1220;
    border: 2px solid #1f293d;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    display: block;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 6px 4px;
    color: #00e5ff;
  }
  .hud span { color: #fff; }
  .grid-chars, .grid-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    margin-top: 8px;
  }
  .btn {
    background: #151d30;
    border: 1px solid #283754;
    border-radius: 6px;
    color: #cbd5e1;
    padding: 8px 4px;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
  }
  .btn:active {
    background: #00e5ff;
    color: #000;
    transform: scale(0.97);
  }
  .btn.active {
    border-color: #00e5ff;
    background: #0a2540;
    color: #00e5ff;
  }
  .btn-gold {
    border-color: #f59e0b;
    color: #fbbf24;
  }
  .btn-gold:active {
    background: #fbbf24;
    color: #000;
  }
  .btn-aqua {
    border-color: #06b6d4;
    color: #22d3ee;
  }
  .btn-aqua:active {
    background: #22d3ee;
    color: #000;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div>SCORE: <span id="hud-score">0</span></div>
    <div>HP: <span id="hud-hp">100/100</span></div>
    <div>BURST: <span id="hud-burst">100%</span></div>
  </div>

  <canvas id="stage" width="460" height="280"></canvas>

  <div class="grid-chars">
    <div class="btn active" id="btn-kensai">Shadow Kensai<br><small style="font-weight:400; font-size:9px;">Katana Combo</small></div>
    <div class="btn btn-aqua" id="btn-water">Aura Weaver<br><small style="font-weight:400; font-size:9px;">Tsunami Rain</small></div>
    <div class="btn btn-gold" id="btn-luetta">Luetta Aid<br><small style="font-weight:400; font-size:9px;">Dual Summon</small></div>
  </div>

  <div class="grid-controls">
    <button class="btn" id="btn-left">◀ LEFT</button>
    <button class="btn" id="btn-slash">KATANA SLASH</button>
    <button class="btn" id="btn-right">RIGHT ▶</button>
  </div>
  <div class="grid-controls" style="margin-top:6px;">
    <button class="btn" id="btn-jump">NINJA JUMP</button>
    <button class="btn" id="btn-dash">ARC DASH</button>
    <button class="btn" id="btn-evade">EVADE</button>
  </div>
</div>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const FLOOR_Y = 240;

// Player Core
const player = {
  x: 100,
  y: FLOOR_Y,
  yOffset: 0,
  facing: 1,
  vy: 0,
  grounded: true,
  jumpState: 'ground', // 'ground', 'spinning', 'heroLanding'
  spinAngle: 0,
  landingTimer: 0,
  isDashing: false,
  dashTimer: 0,
  dashDuration: 18,
  dashSpeed: 8,
  isAttacking: false,
  attackTimer: 0,
  attackDuration: 14,
  comboStep: 0,
  runCycle: 0,
  hp: 100,
  score: 0
};

// Humanoid Enemies
let enemies = [
  { x: 280, y: FLOOR_Y, vx: 0, hp: 60, maxHp: 60, dir: -1, animTick: 0 },
  { x: 390, y: FLOOR_Y, vx: 0, hp: 80, maxHp: 80, dir: -1, animTick: 20 }
];

// Summon State
let luettaCallCount = 0;
const luetta = { active: false, mode: 'none', x: 0, y: 0, timer: 0, speed: 0 };

// Aura Weaver Water FX
const waterState = {
  rainActive: false,
  rainTimer: 0,
  raindrops: [],
  waveActive: false,
  waveX: 0
};

for (let i = 0; i < 45; i++) {
  waterState.raindrops.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: 7 + Math.random() * 5,
    len: 12 + Math.random() * 8
  });
}

// Controls
document.getElementById("btn-left").addEventListener("click", () => {
  player.facing = -1;
  player.x = Math.max(30, player.x - 24);
  player.runCycle += 0.4;
});
document.getElementById("btn-right").addEventListener("click", () => {
  player.facing = 1;
  player.x = Math.min(canvas.width - 30, player.x + 24);
  player.runCycle += 0.4;
});

document.getElementById("btn-slash").addEventListener("click", () => {
  if (player.isAttacking) return;
  player.isAttacking = true;
  player.attackTimer = 0;
  player.comboStep = (player.comboStep + 1) % 2;

  enemies.forEach(e => {
    if (Math.abs(e.x - (player.x + player.facing * 28)) < 44) {
      e.hp -= 30;
      e.vx = player.facing * 6;
    }
  });
});

document.getElementById("btn-dash").addEventListener("click", () => {
  if (player.isDashing) return;
  player.isDashing = true;
  player.dashTimer = 0;
});

document.getElementById("btn-jump").addEventListener("click", () => {
  if (!player.grounded) return;
  player.grounded = false;
  player.vy = -12.5;
  player.jumpState = 'spinning';
  player.spinAngle = 0;

  enemies.forEach(e => {
    let dx = e.x - player.x;
    if (Math.abs(dx) < 80) {
      e.vx = (dx >= 0 ? 1 : -1) * 9;
      e.hp -= 15;
    }
  });
});

document.getElementById("btn-luetta").addEventListener("click", () => {
  if (luetta.active) return;
  luetta.active = true;
  if (luettaCallCount === 0) {
    luetta.mode = 'sky';
    luetta.x = canvas.width / 2;
    luetta.y = -40;
    luetta.timer = 100;
    luettaCallCount = 1;
  } else {
    luetta.mode = 'ground';
    luetta.x = player.facing > 0 ? -30 : canvas.width + 30;
    luetta.y = FLOOR_Y;
    luetta.speed = 18 * player.facing;
    luettaCallCount = 0;
  }
});

document.getElementById("btn-water").addEventListener("click", () => {
  waterState.rainActive = true;
  waterState.rainTimer = 130;
  waterState.waveActive = true;
  waterState.waveX = player.facing > 0 ? 0 : canvas.width;
});

// Update
function update() {
  if (player.isAttacking) {
    player.attackTimer++;
    if (player.attackTimer >= player.attackDuration) player.isAttacking = false;
  }

  if (player.isDashing) {
    player.dashTimer++;
    player.x += player.facing * player.dashSpeed;
    let progress = player.dashTimer / player.dashDuration;
    player.yOffset = Math.sin(progress * Math.PI) * -14;
    if (player.dashTimer >= player.dashDuration) {
      player.isDashing = false;
      player.yOffset = 0;
    }
  }

  if (!player.grounded) {
    player.y += player.vy;
    player.vy += 0.7;
    if (player.jumpState === 'spinning') {
      player.spinAngle += player.facing * 0.38;
    }
    if (player.y >= FLOOR_Y) {
      player.y = FLOOR_Y;
      player.vy = 0;
      player.grounded = true;
      player.jumpState = 'heroLanding';
      player.landingTimer = 12;
    }
  } else if (player.jumpState === 'heroLanding') {
    player.landingTimer--;
    if (player.landingTimer <= 0) player.jumpState = 'ground';
  }

  player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

  enemies.forEach(e => {
    e.x += e.vx;
    e.vx *= 0.85;
    e.animTick += 0.05;

    if (e.hp <= 0) {
      player.score += 100;
      e.hp = e.maxHp;
      e.x = canvas.width + 40;
    }
    if (Math.abs(e.vx) < 0.2) {
      e.x += (player.x > e.x ? 0.6 : -0.6);
      e.dir = (player.x > e.x ? 1 : -1);
    }
  });

  if (luetta.active) {
    if (luetta.mode === 'sky') {
      if (luetta.y < 85) luetta.y += 3.5;
      luetta.timer--;
      enemies.forEach(e => { e.hp -= 0.7; e.x += (Math.random() - 0.5) * 4; });
      if (luetta.timer <= 0) luetta.active = false;
    } else if (luetta.mode === 'ground') {
      luetta.x += luetta.speed;
      enemies.forEach(e => {
        if (Math.abs(e.x - luetta.x) < 35) {
          e.hp -= 40;
          e.vx = (luetta.speed > 0 ? 1 : -1) * 14;
        }
      });
      if (luetta.x > canvas.width + 80 || luetta.x < -80) luetta.active = false;
    }
  }

  if (waterState.rainActive) {
    waterState.raindrops.forEach(r => {
      r.y += r.speed;
      r.x -= 1.5;
      if (r.y > canvas.height) { r.y = -10; r.x = Math.random() * canvas.width; }
    });
    waterState.rainTimer--;
    if (waterState.rainTimer <= 0) waterState.rainActive = false;
  }

  if (waterState.waveActive) {
    waterState.waveX += (player.facing > 0 ? 9 : -9);
    enemies.forEach(e => {
      if (Math.abs(e.x - waterState.waveX) < 40) {
        e.hp -= 2.5;
        e.vx = (player.facing > 0 ? 1 : -1) * 7;
      }
    });
    if (waterState.waveX > canvas.width + 100 || waterState.waveX < -100) waterState.waveActive = false;
  }

  document.getElementById("hud-score").innerText = player.score;
}

// -------------------------------------------------------------
// Humanoid Renderer Helpers
// -------------------------------------------------------------
function drawHumanoidHero(ctx, p) {
  ctx.save();
  ctx.translate(p.x, p.y + p.yOffset);
  ctx.scale(p.facing, 1);

  if (p.jumpState === 'spinning') {
    ctx.rotate(p.spinAngle);
    // Tucked spinning ninja body
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();

    // Cyan visor glow
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(2, -3, 8, 4);

    // Radial Slash Ring
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(56, 189, 248, 0.8)";
    ctx.lineWidth = 3;
    ctx.stroke();

  } else if (p.jumpState === 'heroLanding') {
    // 3-Point Heroic Crouch
    ctx.strokeStyle = "#0284c7";
    ctx.fillStyle = "#0369a1";
    ctx.lineWidth = 3;

    // Crouched Torso
    ctx.beginPath();
    ctx.ellipse(0, -12, 7, 10, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Head tilted low
    ctx.beginPath();
    ctx.arc(6, -20, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#38bdf8";
    ctx.fill();

    // Bent legs on ground
    ctx.beginPath();
    ctx.moveTo(-6, -8);
    ctx.lineTo(-14, 0);
    ctx.moveTo(4, -8);
    ctx.lineTo(8, -4);
    ctx.lineTo(12, 0);
    ctx.stroke();

    // Blade rested backwards on rooftop
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-4, -10);
    ctx.lineTo(-26, 0);
    ctx.stroke();

    // Ground impact dust shockwave
    ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 4, 0, 0, Math.PI * 2);
    ctx.stroke();

  } else {
    // Upright Humanoid Hero (Standing/Running/Slashing)
    ctx.strokeStyle = "#0284c7";
    ctx.fillStyle = "#0369a1";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";

    // Legs
    let legOffset = Math.sin(p.runCycle) * 6;
    ctx.beginPath();
    ctx.moveTo(-3, -16);
    ctx.lineTo(-6 - legOffset, 0);
    ctx.moveTo(3, -16);
    ctx.lineTo(6 + legOffset, 0);
    ctx.stroke();

    // Torso & Trenchcoat
    ctx.beginPath();
    ctx.moveTo(0, -32);
    ctx.lineTo(0, -16);
    ctx.stroke();

    // Scarf / Cape flutter behind
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -30);
    ctx.quadraticCurveTo(-14, -28 + Math.sin(Date.now() * 0.01) * 3, -22, -32);
    ctx.stroke();

    // Head & Cyan Visor
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(2, -36, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(4, -38, 5, 3); // visor

    // Katana & Arms
    if (p.isAttacking) {
      let prog = p.attackTimer / p.attackDuration;
      let startAngle = p.comboStep === 0 ? -Math.PI * 0.45 : Math.PI * 0.35;
      let endAngle   = p.comboStep === 0 ?  Math.PI * 0.35 : -Math.PI * 0.50;
      let curAngle = startAngle + (endAngle - startAngle) * prog;

      // Arm thrust
      ctx.strokeStyle = "#0284c7";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(10, -26);
      ctx.stroke();

      // Blade Trail
      ctx.beginPath();
      ctx.arc(8, -22, 34, startAngle, curAngle, p.comboStep === 1);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // Energy Glow Trail
      ctx.beginPath();
      ctx.arc(8, -22, 36, startAngle, curAngle, p.comboStep === 1);
      ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
      ctx.lineWidth = 6;
      ctx.stroke();
    } else {
      // Sheathed / Ready Arm
      ctx.strokeStyle = "#0284c7";
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(8, -20);
      ctx.stroke();

      // Sword on hip
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-10, -18);
      ctx.lineTo(6, -24);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawHumanoidEnemy(ctx, e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.dir, 1);

  ctx.strokeStyle = "#dc2626";
  ctx.fillStyle = "#991b1b";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";

  // Legs with subtle patrol stride
  let stride = Math.sin(e.animTick * 3) * 4;
  ctx.beginPath();
  ctx.moveTo(-2, -15);
  ctx.lineTo(-5 - stride, 0);
  ctx.moveTo(2, -15);
  ctx.lineTo(5 + stride, 0);
  ctx.stroke();

  // Torso
  ctx.beginPath();
  ctx.moveTo(0, -28);
  ctx.lineTo(0, -15);
  ctx.stroke();

  // Head & Red Visor
  ctx.fillStyle = "#18181b";
  ctx.beginPath();
  ctx.arc(0, -32, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(1, -34, 4, 2);

  // Weapon Arm
  ctx.beginPath();
  ctx.moveTo(0, -25);
  ctx.lineTo(7, -18);
  ctx.stroke();

  // Health Bar above head
  ctx.restore();
  ctx.fillStyle = "#27272a";
  ctx.fillRect(e.x - 12, e.y - 44, 24, 4);
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(e.x - 12, e.y - 44, (e.hp / e.maxHp) * 24, 4);
}

function drawLuettaHumanoid(ctx, l) {
  ctx.save();
  ctx.translate(l.x, l.y);

  if (l.mode === 'sky') {
    // Holy Pillar
    let beam = ctx.createLinearGradient(0, -80, 0, FLOOR_Y);
    beam.addColorStop(0, "rgba(251, 191, 36, 0.7)");
    beam.addColorStop(1, "rgba(251, 191, 36, 0.05)");
    ctx.fillStyle = beam;
    ctx.fillRect(-35, -l.y, 70, canvas.height);

    // Floating Halo
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, -28, 14, 5, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Floating Gown & Figure
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-12, 14);
    ctx.lineTo(12, 14);
    ctx.closePath();
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(0, -18, 6, 0, Math.PI * 2);
    ctx.fill();

    // Outstretched Arms
    ctx.strokeStyle = "#fef08a";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-16, -12);
    ctx.lineTo(16, -12);
    ctx.stroke();

  } else if (l.mode === 'ground') {
    ctx.scale(l.speed > 0 ? 1 : -1, 1);

    // Golden trail line
    ctx.strokeStyle = "rgba(251, 191, 36, 0.8)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-45, -16);
    ctx.lineTo(0, -16);
    ctx.stroke();

    // Humanoid Dash Silhouette
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.arc(0, -24, 6, 0, Math.PI * 2);
    ctx.fill();

    // Forward Leaning Robe
    ctx.beginPath();
    ctx.moveTo(2, -22);
    ctx.lineTo(-16, 0);
    ctx.lineTo(10, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// -------------------------------------------------------------
// Main Render Loop
// -------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Detroit Rooftops Skyline
  ctx.fillStyle = "#070b14";
  ctx.fillRect(40, 110, 45, 130);
  ctx.fillRect(120, 80, 60, 160);
  ctx.fillRect(220, 130, 50, 110);
  ctx.fillRect(320, 95, 70, 145);

  // Platform
  ctx.fillStyle = "#162032";
  ctx.fillRect(0, FLOOR_Y, canvas.width, 40);
  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(0, FLOOR_Y, canvas.width, 2);

  // Rain
  if (waterState.rainActive) {
    ctx.strokeStyle = "rgba(125, 211, 252, 0.55)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    waterState.raindrops.forEach(r => {
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - 3, r.y + r.len);
    });
    ctx.stroke();
  }

  // Draw Enemies (Humanoid)
  enemies.forEach(e => drawHumanoidEnemy(ctx, e));

  // Draw Player (Humanoid)
  drawHumanoidHero(ctx, player);

  // Aura Weaver Tsunami Surge
  if (waterState.waveActive) {
    let wx = waterState.waveX;
    ctx.save();
    let grad = ctx.createLinearGradient(wx - 40, FLOOR_Y - 80, wx + 40, FLOOR_Y);
    grad.addColorStop(0, "rgba(56, 189, 248, 0.85)");
    grad.addColorStop(0.5, "rgba(14, 165, 233, 0.65)");
    grad.addColorStop(1, "rgba(2, 132, 199, 0.2)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(wx - 50, FLOOR_Y);
    ctx.quadraticCurveTo(wx - 25, FLOOR_Y - 90, wx, FLOOR_Y - 70);
    ctx.quadraticCurveTo(wx + 25, FLOOR_Y - 95, wx + 50, FLOOR_Y);
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }

  // Draw Luetta
  if (luetta.active) drawLuettaHumanoid(ctx, luetta);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
