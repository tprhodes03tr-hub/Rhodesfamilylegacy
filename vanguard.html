<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard Universe: Unified Combat Portal</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --plat-border: #e5e4e2;
      --plat-glow: rgba(229, 228, 226, 0.5);
      --cosmic-border: #8b5cf6;
      --cosmic-glow: rgba(139, 92, 246, 0.5);
      --syndicate-border: #ef4444;
      --syndicate-glow: rgba(239, 68, 68, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: #0f172a;
      border-bottom: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .portal-title {
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f59e0b;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      max-width: 600px;
    }

    .tab-btn {
      flex: 1;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    .portal-section {
      display: none;
      width: 96%;
      max-width: 1100px;
      margin: 16px auto;
    }

    .portal-section.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-flipper-container {
      perspective: 1000px;
      width: 100%;
      min-height: 330px;
    }

    .card-flipper-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card-flipper-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px;
    }

    .card-face-front {
      position: relative;
      z-index: 2;
      transform: rotateY(0deg);
    }

    .card-face-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: radial-gradient(circle at center, #1b1335 0%, #060810 100%);
      border: 2px solid var(--gold-border);
      box-shadow: 0 0 18px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px;
      overflow: hidden;
    }

    .card-emblem-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
    }

    .card-tree-emblem {
      max-width: 82%;
      max-height: 145px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.75));
    }

    .back-brand-title {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #facc15;
      text-transform: uppercase;
      text-align: center;
    }

    .back-motto {
      font-size: 0.64rem;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }

    .back-footer-marrow {
      font-family: monospace;
      font-size: 0.62rem;
      color: #38bdf8;
      letter-spacing: 1.2px;
      text-align: center;
    }

    .card-foil {
      position: relative;
      background: #111827;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .foil-gold { border: 2px solid var(--gold-border); box-shadow: 0 0 14px var(--gold-glow); }
    .foil-platinum { border: 2px solid var(--plat-border); box-shadow: 0 0 14px var(--plat-glow); }
    .foil-cosmic { border: 2px solid var(--cosmic-border); box-shadow: 0 0 14px var(--cosmic-glow); }

    .card-img {
      width: 100%;
      max-width: 120px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .card-name { font-weight: 800; font-size: 0.88rem; text-align: center; }
    .card-title { font-size: 0.7rem; color: #94a3b8; text-align: center; margin-bottom: 4px; }
    
    .stat-row {
      display: flex;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-badge {
      background: #0b0f19;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .worth-badge {
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 8px;
      margin-top: 4px;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
    }

    .worth-gold { background: #b45309; color: #fef3c7; }
    .worth-cosmic { background: #581c87; color: #f3e8ff; }

    .card-button-row {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-top: 6px;
      z-index: 5;
      position: relative;
    }

    .btn-ar {
      flex: 1;
      background: #7c3aed;
      color: #fff;
      border: 1px solid #a78bfa;
      padding: 5px 4px;
      font-size: 0.65rem;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
    }

    /* BRAWLER SECTION */
    .brawler-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .hud-top-row { display: flex; justify-content: space-between; align-items: center; }
    .hero-title { font-size: 13px; font-weight: 800; color: #38bdf8; }
    .wave-badge { font-size: 11px; color: #f59e0b; font-weight: 800; background: rgba(245, 158, 11, 0.15); padding: 3px 8px; border-radius: 4px; }

    .bars-container { display: flex; gap: 10px; }
    .bar-group { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .bar-label { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }
    .bar-track { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .bar-fill-hero { width: 100%; height: 100%; background: #10b981; }
    .bar-fill-enemy { width: 100%; height: 100%; background: #ef4444; }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 290px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    #gameCanvas { display: block; width: 100%; height: 100%; }

    /* START / PAUSE OVERLAY */
    .brawler-overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 14, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
      text-align: center;
      padding: 20px;
    }

    .brawler-overlay h2 {
      color: #facc15;
      font-size: 1.2rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brawler-overlay p {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }

    .brawler-start-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      text-transform: uppercase;
    }

    .combat-log {
      font-family: monospace;
      font-size: 11px;
      background: #090e18;
      border: 1px solid #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      color: #38bdf8;
      min-height: 28px;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 6px; width: 100%; }
    .dpad-cluster, .action-cluster { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-action { border-color: #38bdf8; color: #38bdf8; }
    .btn-orb { border-color: #38bdf8; color: #bae6fd; }
    .btn-tag { background: #7c3aed; color: #fff; }
    .btn-ultimate { grid-column: span 3; background: #f59e0b; color: #000; }

    /* AR MODAL */
    #ar-hologram-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.96);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Vanguard Universe: Unified Combat Portal</div>
    <div class="tab-bar">
      <button class="tab-btn" onclick="openTab('codex', this)">🎴 Card Codex</button>
      <button class="tab-btn active" onclick="openTab('brawler', this)">🕹 Side Brawler</button>
    </div>
  </header>

  <!-- TAB 1: CARD CODEX -->
  <section id="tab-codex" class="portal-section">
    <div class="codex-grid" id="codexGrid"></div>
  </section>

  <!-- TAB 3: SIDE BRAWLER -->
  <section id="tab-brawler" class="portal-section active">
    <div class="brawler-wrapper">
      <div class="hud-header">
        <div class="hud-top-row">
          <span id="heroNameLabel" class="hero-title">Marcus Prime (Lead) & Xochitl (Tactical AI)</span>
          <span id="waveDisplay" class="wave-badge">Wave 1: Scout Vanguard</span>
        </div>
        <div class="bars-container">
          <div class="bar-group">
            <div class="bar-label"><span>Team Health</span><span id="heroHpText">100/100</span></div>
            <div class="bar-track"><div id="heroHpBar" class="bar-fill-hero"></div></div>
          </div>
          <div class="bar-group">
            <div class="bar-label"><span id="enemyTypeLabel">Syndicate Swarm</span><span id="enemyHpText">14 Units</span></div>
            <div class="bar-track"><div id="enemyHpBar" class="bar-fill-enemy"></div></div>
          </div>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="540" height="290"></canvas>
        <!-- START / PAUSE OVERLAY SCREEN -->
        <div class="brawler-overlay" id="brawlerOverlay">
          <h2>Vanguard Combat Portal</h2>
          <p>Press Start when ready to engage the Syndicate grid!</p>
          <button class="brawler-start-btn" onclick="startBrawlerGame()">▶ START BRAWL</button>
        </div>
      </div>

      <div class="combat-log" id="combatLog">Game Paused. Press Start Brawl to begin!</div>

      <div class="controls-grid">
        <div class="dpad-cluster">
          <button class="btn" onclick="playerMove(-25)">◄ LEFT</button>
          <button class="btn" onclick="playerJump()">▲ JUMP</button>
          <button class="btn" onclick="playerMove(25)">RIGHT ►</button>
        </div>
        <div class="action-cluster">
          <button id="btnStrike" class="btn btn-action" onclick="executeStrike()">⚡ Volt Beam</button>
          <button id="btnOrb" class="btn btn-orb" onclick="executePlasmaOrb()">🔵 Plasma Orb</button>
          <button id="btnBurst" class="btn btn-action" onclick="executeBurst()">🛡️ Deflect</button>
          <button id="btnTag" class="btn btn-tag" onclick="executeTagSwap()">TAG</button>
          <button id="btnLuetta" class="btn btn-ultimate" onclick="executeLuettaAid()">★ SUMMON MOTHER LUETTA ★</button>
        </div>
      </div>
    </div>
  </section>

  <!-- AR & BILINGUAL INTRODUCTION MODAL -->
  <div id="ar-hologram-modal">
    <div style="background: #111827; border: 2px solid #d4af37; border-radius: 12px; padding: 20px; max-width: 450px; width: 100%; text-align: center;">
      <h3 id="arModalTitle" style="color: #facc15; font-size: 1.2rem; margin-bottom: 8px;">Vanguard AR Dossier</h3>
      <p id="arCharacterQuote" style="color: #38bdf8; font-size: 0.85rem; font-style: italic; margin-bottom: 12px; min-height: 40px;"></p>
      <div style="width: 100%; height: 180px; background: #000; border: 1px solid #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
        <video id="arCameraFeed" autoplay playsinline style="width:100%; height:100%; object-fit:cover; position:absolute; inset:0;"></video>
        <span id="arFallbackIcon" style="font-size: 42px; z-index:2;">🌐</span>
      </div>
      <button onclick="closeARHologram()" style="margin-top: 16px; background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 800; cursor: pointer;">CLOSE AR VIEWER</button>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. EXACT GITHUB REPOSITORY FILENAMES & BILINGUAL INTRODUCTIONS
       ========================================================================= */
    const codexCards = [
      {
        name: "Mother Luetta",
        title: "Root Ancestor • Living Codex",
        intro: "\"Welcome to our family legacy. The tree runs deep through every generation.\"",
        foil: "foil-cosmic",
        worth: "Cosmic Singularity • 1/100 Prismatic",
        pwr: 99, def: 99, will: 100,
        img: "mother-luta.png"
      },
      {
        name: "Marcus Prime",
        title: "Detroit Diaspora • Urban Dynamo",
        intro: "\"Detroit 313 online! Powering our ancestral grid through kinetic energy.\"",
        foil: "foil-gold",
        worth: "Gold Relic Foil • 1st Edition",
        pwr: 91, def: 88, will: 90,
        img: "marcus_prime_spritesheet.png"
      },
      {
        name: "Elena",
        title: "Vanguard Sentinel • Heritage Guard",
        intro: "¡Hola! \"Saludos desde la República Dominicana. Protegiendo los archivos sagrados de nuestra herencia.\"",
        foil: "foil-gold",
        worth: "Gold Relic Foil • Vanguard Sentinel",
        pwr: 88, def: 76, will: 85,
        img: "elena.png"
      },
      {
        name: "Guacan",
        title: "Caribe Vanguard • Taino Anchor",
        intro: "¡Saludos! \"Desde las hermosas tierras del Caribe y la República Dominicana, ¡bienvenidos a nuestra gran aventura!\"",
        foil: "foil-gold",
        worth: "Gold Relic Foil • Caribe Anchor",
        pwr: 92, def: 90, will: 94,
        img: "guacan-sheet.png"
      },
      {
        name: "Xochitl (Zokita)",
        title: "Obsidian Sun • Mexico Flight",
        intro: "¡Hola a todos! \"Desde México para el mundo, cruzando fronteras con el poder del sol de obsidiana.\"",
        foil: "foil-gold",
        worth: "Gold Relic Foil • Obsidian Sun",
        pwr: 89, def: 78, will: 86,
        img: "xochitl.png"
      },
      {
        name: "Sundiata Prime",
        title: "Lion Bastion • Dundun Resonance",
        intro: "\"The solar lion roar shatters all syndicate barriers across the Sahel.\"",
        foil: "foil-gold",
        worth: "Gold Relic Foil • Sahel Anchor",
        pwr: 94, def: 96, will: 92,
        img: "kofi.png"
      }
    ];

    function renderCodex() {
      const grid = document.getElementById("codexGrid");
      grid.innerHTML = "";
      codexCards.forEach(card => {
        grid.innerHTML += `
          <div class="card-flipper-container">
            <div class="card-flipper-inner">
              <div class="card-face card-face-front card-foil ${card.foil}" onclick="toggleCardFlip(this)">
                <img src="${card.img}" class="card-img" alt="${card.name}">
                <div class="card-name">${card.name}</div>
                <div class="card-title">${card.title}</div>
                <div class="stat-row">
                  <span class="stat-badge">PWR: ${card.pwr}</span>
                  <span class="stat-badge">DEF: ${card.def}</span>
                  <span class="stat-badge">WILL: ${card.will}</span>
                </div>
                <span class="worth-badge ${card.foil.includes('cosmic') ? 'worth-cosmic' : 'worth-gold'}">${card.worth}</span>
                <div class="card-button-row">
                  <button class="btn-ar" onclick="event.stopPropagation(); launchARHologram('${card.name}', '${card.intro.replace(/"/g, '&quot;')}')">🌐 3D AR Dossier</button>
                </div>
              </div>
              <div class="card-face card-face-back" onclick="toggleCardFlip(this)">
                <div class="back-brand-title">RHODES FAMILY LEGACY</div>
                <div class="back-motto">The Living Codex</div>
                <div class="card-emblem-wrap">
                  <img src="packed-marrow-tree.png" alt="Tree" class="card-tree-emblem">
                </div>
                <div class="back-footer-marrow">• PACKED IN THE MARROW •</div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function toggleCardFlip(container) {
      container.querySelector('.card-flipper-inner').classList.toggle('is-flipped');
    }

    async function launchARHologram(name, intro) {
      document.getElementById("arModalTitle").innerText = `AR Dossier: ${name}`;
      document.getElementById("arCharacterQuote").innerText = intro;
      document.getElementById("ar-hologram-modal").style.display = "flex";
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = document.getElementById("arCameraFeed");
        video.srcObject = stream;
        document.getElementById("arFallbackIcon").style.display = "none";
      } catch (err) {
        document.getElementById("arFallbackIcon").style.display = "block";
      }
    }

    function closeARHologram() {
      const video = document.getElementById("arCameraFeed");
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      document.getElementById("ar-hologram-modal").style.display = "none";
    }

    /* =========================================================================
       2. BRAWLER ASSETS & PAUSE/START CONTROLLER
       ========================================================================= */
    let canvas, ctx, leadX = 90, leadY = 0, leadVy = 0, isGrounded = true;
    let brawlerRunning = false;

    function initBrawler() {
      canvas = document.getElementById("gameCanvas");
      ctx = canvas.getContext("2d");
      drawBrawlerFrame(); // Initial static frame before start
    }

    function startBrawlerGame() {
      document.getElementById("brawlerOverlay").style.display = "none";
      document.getElementById("combatLog").innerText = "Wave 1 Active: Defend the grid!";
      brawlerRunning = true;
      requestAnimationFrame(renderBrawlerLoop);
    }

    function playerMove(dx) { if(brawlerRunning) leadX = Math.max(50, Math.min(350, leadX + dx)); }
    function playerJump() { if(brawlerRunning && isGrounded) { leadVy = -12; isGrounded = false; } }

    function drawBrawlerFrame() {
      ctx.fillStyle = "#07090e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!isGrounded) {
        leadY -= leadVy;
        leadVy += 0.8;
        if (leadY <= 0) { leadY = 0; leadVy = 0; isGrounded = true; }
      }

      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(leadX, 200 - leadY, 32, 50);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(leadX - 50, 200, 32, 50);
    }

    function renderBrawlerLoop() {
      if (!brawlerRunning) return;
      drawBrawlerFrame();
      requestAnimationFrame(renderBrawlerLoop);
    }

    function openTab(tabName, btn) {
      document.querySelectorAll('.portal-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderCodex();
      initBrawler();
    });
  </script>
</body>
</html>
