<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 700px;
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      background: rgba(217, 119, 6, 0.2);
      border: 1px solid #d97706;
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
    }
    .cinema-frame {
      width: 100%;
      max-width: 800px;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      margin-bottom: 24px;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      max-width: 500px;
    }
    .btn {
      flex: 1;
      min-width: 200px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.9; }
    .btn-gold {
      background: #d97706;
      color: #fff;
    }
    .btn-dark {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="tag">Official Cinematic Trailer</span>

  <div class="cinema-frame">
    <video controls autoplay muted loop playsinline poster="11511.png">
      <source src="origins-trailer.mp4" type="video/mp4">

  <div class="actions">
