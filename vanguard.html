<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard Universe: Unified Combat Portal</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --plat-border: #e5e4e2;
      --plat-glow: rgba(229, 228, 226, 0.5);
      --cosmic-border: #8b5cf6;
      --cosmic-glow: rgba(139, 92, 246, 0.5);
      --syndicate-border: #ef4444;
      --syndicate-glow: rgba(239, 68, 68, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: #0f172a;
      border-bottom: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .portal-title {
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f59e0b;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      max-width: 600px;
    }

    .tab-btn {
      flex: 1;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    .portal-section {
      display: none;
      width: 96%;
      max-width: 1100px;
      margin: 16px auto;
    }

    .portal-section.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3D CARD FLIPPER FOR CODEX */
    .card-flipper-container {
      perspective: 1000px;
      width: 100%;
      min-height: 285px;
    }

    .card-flipper-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card-flipper-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px;
    }

    .card-face-front {
      position: relative;
      z-index: 2;
      transform: rotateY(0deg);
    }

    .card-face-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: radial-gradient(circle at center, #1b1335 0%, #060810 100%);
      border: 2px solid var(--gold-border);
      box-shadow: 0 0 18px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px;
      overflow: hidden;
    }

    /* AUTHENTIC 'PACKED IN THE MARROW' TREE DISPLAY */
    .card-emblem-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
    }

    .card-tree-emblem {
      max-width: 82%;
      max-height: 145px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.75));
    }

    .back-brand-title {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #facc15;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
      text-align: center;
    }

    .back-motto {
      font-size: 0.64rem;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }

    .back-footer-marrow {
      font-family: monospace;
      font-size: 0.62rem;
      color: #38bdf8;
      letter-spacing: 1.2px;
      text-align: center;
    }

    /* CARD FOIL DESIGN */
    .card-foil {
      position: relative;
      background: #111827;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      cursor: pointer;
      overflow: hidden;
    }

      position: absolute;
