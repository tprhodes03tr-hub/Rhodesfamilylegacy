<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard</title>
  <style>
    body {
      margin: 0;
      background: #090e17;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    #hud {
      width: 100%;
      max-width: 480px;
      padding: 10px 0;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      color: #7ce8ff;
      background: #040810;
      border-bottom: 1px solid #1a2a40;
    }
    #game-canvas {
      width: 100%;
      max-width: 480px;
      background: #0b121e;
      border-bottom: 2px solid #1a2a40;
      display: block;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 480px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background: #121d2d;
      border: 1px solid #28446b;
      color: #7ce8ff;
      padding: 12px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      user-select: none;
    }
    button:active {
      background: #28446b;
      border-color: #f39c12;
      color: #f39c12;
    }
  </style>
</head>
<body>

  <div id="hud">Zone 1: RenCen Rooftop | HP: 76/120 | Score: 6000</div>
  <canvas id="game-canvas" width="480" height="300"></canvas>

  <div class="controls-grid">
    <button id="btn-left">◀ LEFT</button>
    <button id="btn-strike">STRIKE 1</button>
    <button id="btn-right">RIGHT ▶</button>
    <button id="btn-jump">NINJA JUMP</button>
    <button id="btn-sig">SIGNATURE</button>
    <button id="btn-overdrive">OVERDRIVE</button>
    <button id="btn-tag">TAG / SWAP DUO</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const hero = {
      x: 100,
      y: 190,
      width: 40,
      height: 80,
      facing: 1,
      speed: 6,
      action: 'idle'
    };

    // Controls
    document.getElementById('btn-left').addEventListener('pointerdown', () => {
      hero.facing = -1;
      hero.x = Math.max(20, hero.x - hero.speed * 3);
    });

    document.getElementById('btn-right').addEventListener('pointerdown', () => {
      hero.facing = 1;
      hero.x = Math.min(canvas.width - hero.width - 20, hero.x + hero.speed * 3);
    });

    document.getElementById('btn-strike').addEventListener('pointerdown', () => {
      hero.action = 'strike';
      setTimeout(() => hero.action = 'idle', 300);
    });

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Stage Background - Detroit Rooftop Skyline
      ctx.fillStyle = '#060a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Skyline Silhouette (RenCen Towers)
      ctx.fillStyle = '#111d2e';
      ctx.fillRect(180, 60, 60, 210);
      ctx.fillRect(250, 40, 70, 230); // Central tower
      ctx.fillRect(330, 80, 50, 190);
      ctx.fillRect(80, 110, 60, 160);

      // Ground / Rooftop deck
      ctx.fillStyle = '#162234';
      ctx.fillRect(0, 270, canvas.width, 30);
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 270);
      ctx.lineTo(canvas.width, 270);
      ctx.stroke();

      // 2. Render Marcus (Armored Silhouette + Lightning Drum Aura)
      ctx.save();
      ctx.translate(hero.x + hero.width / 2, hero.y);
      if (hero.facing === -1) ctx.scale(-1, 1);

      // Hero Body (Blue Cybernetic Armor)
      ctx.fillStyle = '#2b7fff';
      ctx.fillRect(-15, 10, 30, 45); // Torso

      // Head
      ctx.fillStyle = '#8d5524';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      // Djembe Drums (Mounted at hips)
      ctx.fillStyle = '#8b4513';
      ctx.beginPath();
      ctx.moveTo(-22, 35);
      ctx.lineTo(-32, 55);
      ctx.lineTo(-18, 55);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(12, 35);
      ctx.lineTo(2, 55);
      ctx.lineTo(16, 55);
      ctx.fill();

      // Legs
      ctx.fillStyle = '#1e3a6a';
      ctx.fillRect(-12, 55, 10, 25);
      ctx.fillRect(2, 55, 10, 25);

      // Attack FX (Strike / Beats)
      if (hero.action === 'strike') {
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(30, 40, 18, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
      }

      ctx.restore();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
