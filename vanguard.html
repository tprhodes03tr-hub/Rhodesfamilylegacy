<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Ancestral Vanguard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .hud-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
    }
    .hud-score { color: #38bdf8; }
    .hud-hp { color: #4ade80; }
    .hud-wave { color: #f59e0b; }
    canvas {
      width: 100%;
      max-width: 440px;
      height: 260px;
      background: #020617;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
      display: block;
    }
    .stage-banner {
      width: 100%;
      max-width: 440px;
      background: #0f172a;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .roster-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
      background: #090e1a;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
    }
    .hero-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 6px 2px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .hero-btn span {
      font-size: 9px;
      font-weight: 400;
      color: #64748b;
    }
    .hero-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    .hero-btn.active span { color: #e0f2fe; }
    .control-pad {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr 1.2fr;
      gap: 6px;
      padding: 10px;
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 0 0 8px 8px;
    }
    .btn-ctrl {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 0;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-attack {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-burst {
      background: #dc2626;
      border-color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="hud-bar">
    <span class="hud-score" id="scoreDisp">SCORE: 0</span>
    <span class="hud-hp" id="hpDisp">HP: 100%</span>
    <span class="hud-wave" id="waveDisp">STAGE 1 [1/3]</span>
  </div>

  <canvas id="gameCanvas" width="440" height="260"></canvas>

  <div class="stage-banner" id="stageBanner">✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦</div>

  <div class="roster-grid">
    <button class="hero-btn active" onclick="selectHero(0)">Sundiata Prime<span>Sonic Strike</span></button>
    <button class="hero-btn" onclick="selectHero(1)">Delta Vanguard<span>Shield Cleave</span></button>
    <button class="hero-btn" onclick="selectHero(2)">Aura Weaver<span>Azure Lightning</span></button>
    <button class="hero-btn" onclick="selectHero(3)">Pioneer Volley<span>Solar Arrow</span></button>
    <button class="hero-btn" onclick="selectHero(4)">Shadow Kensei<span>Katana Slash</span></button>
    <button class="hero-btn" onclick="selectHero(5)">Prism Void<span>Void Shift</span></button>
  </div>

  <div class="control-pad">
    <button class="btn-ctrl" onpointerdown="keys.left=true" onpointerup="keys.left=false">◀</button>
    <button class="btn-ctrl" onpointerdown="keys.right=true" onpointerup="keys.right=false">▶</button>
    <button class="btn-ctrl" onpointerdown="jump()">▲</button>
    <button class="btn-ctrl btn-attack" onpointerdown="triggerAttack()">ATTACK</button>
    <button class="btn-ctrl btn-burst" onpointerdown="triggerBurst()">BURST</button>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const heroes = [
  { name: "Sundiata Prime", armor: "#15803d", cape: "#22c55e", skin: "#5c3d2e", type: "sonic" },
  { name: "Delta Vanguard", armor: "#d97706", cape: "#fbbf24", skin: "#6b4423", type: "shield" },
  { name: "Aura Weaver",    armor: "#0284c7", cape: "#38bdf8", skin: "#4a301e", type: "lightning" },
  { name: "Pioneer Volley", armor: "#b45309", cape: "#f59e0b", skin: "#5c3d2e", type: "solar" },
  { name: "Shadow Kensei",  armor: "#334155", cape: "#64748b", skin: "#6b4423", type: "blade" },
  { name: "Prism Void",     armor: "#7c3aed", cape: "#c084fc", skin: "#4a301e", type: "void" }
];

const stages = [
  { name: "STAGE 1: DETROIT HIGH ROOFTOPS", skyTop: "#080c1b", skyBottom: "#1e1b4b", floor: "#0f172a", neon: "#38bdf8", win: "#fbbf24" },
  { name: "STAGE 2: WOODWARD CYBER BOULEVARD", skyTop: "#020617", skyBottom: "#311042", floor: "#180e29", neon: "#ec4899", win: "#38bdf8" },
  { name: "STAGE 3: CELESTIAL ANCESTRAL GATES", skyTop: "#1c1917", skyBottom: "#451a03", floor: "#292524", neon: "#f59e0b", win: "#f97316" }
];

let curHero = 0;
let curStage = 0;
let wave = 1;
let score = 0;

const keys = { left: false, right: false };

const player = {
  x: 70, y: 210,
  vx: 0, vy: 0,
  grounded: true,
  facing: 1,
  walkFrame: 0,
  hp: 100,
  attacking: false,
  attackTimer: 0
};

let enemies = [];
let attacks = [];

function selectHero(idx) {
  curHero = idx;
  document.querySelectorAll(".hero-btn").forEach((btn, i) => {
    btn.classList.toggle("active", i === idx);
  });
}

function jump() {
  if (player.grounded) {
    player.vy = -9.5;
    player.grounded = false;
  }
}

function spawnWave() {
  enemies = [];
  const count = curStage + wave;
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 320 + i * 50,
      y: 210,
      hp: 30 + curStage * 15,
      maxHp: 30 + curStage * 15,
      shootTimer: Math.random() * 80 + 40,
      walkFrame: 0
    });
  }
}
spawnWave();

function triggerAttack() {
  player.attacking = true;
  player.attackTimer = 10;
  const h = heroes[curHero];

  if (h.type === "lightning") {
    let target = enemies[0] || { x: player.x + 200, y: player.y - 25 };
    attacks.push({
      type: "lightning",
      x1: player.x + (15 * player.facing),
      y1: player.y - 25,
      x2: target.x,
      y2: target.y - 20,
      life: 7,
      color: "#00f0ff"
    });
    if (enemies[0]) hitEnemy(enemies[0], 25);
  } else {
    // Front wave attack
    attacks.push({
      type: "projectile",
      x: player.x + (18 * player.facing),
      y: player.y - 25,
      vx: 7 * player.facing,
      radius: 8,
      color: h.cape,
      life: 50
    });
  }
}

function triggerBurst() {
  player.attacking = true;
  player.attackTimer = 18;
  for (let i = 0; i < 4; i++) {
    attacks.push({
      type: "lightning",
      x1: player.x,
      y1: player.y - 30,
      x2: player.x + (Math.random() - 0.5) * 360,
      y2: 210,
      life: 10,
      color: "#f59e0b"
    });
  }
  enemies.forEach(e => hitEnemy(e, 40));
}

function hitEnemy(enemy, dmg) {
  enemy.hp -= dmg;
  score += 150;
  if (enemy.hp <= 0) {
    enemies = enemies.filter(e => e !== enemy);
    score += 400;
    if (enemies.length === 0) {
      wave++;
      if (wave > 3) {
        wave = 1;
        curStage = (curStage + 1) % stages.length;
        document.getElementById("stageBanner").innerText = `✦ ${stages[curStage].name} ✦`;
      }
      spawnWave();
    }
  }
  updateHUD();
}

function updateHUD() {
  document.getElementById("scoreDisp").innerText = `SCORE: ${score}`;
  document.getElementById("hpDisp").innerText = `HP: ${player.hp}%`;
  document.getElementById("waveDisp").innerText = `STAGE ${curStage + 1} [${wave}/3]`;
}

// Visual Rendering
function drawBackground() {
  const theme = stages[curStage];

  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 210);
  grad.addColorStop(0, theme.skyTop);
  grad.addColorStop(1, theme.skyBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, 210);

  // Distant Buildings
  ctx.fillStyle = "#0c1024";
  for (let i = 0; i < 8; i++) {
    let bx = (i * 65);
    ctx.fillRect(bx, 80, 50, 130);
  }

  // Midground Buildings with Illuminated Windows
  ctx.fillStyle = "#161b33";
  for (let i = 0; i < 6; i++) {
    let bx = (i * 85);
    ctx.fillRect(bx, 110, 65, 100);

    ctx.fillStyle = theme.win;
    for (let wy = 125; wy < 200; wy += 20) {
      for (let wx = bx + 10; wx < bx + 55; wx += 14) {
        if ((i + wy + wx) % 2 === 0) ctx.fillRect(wx, wy, 5, 8);
      }
    }
    ctx.fillStyle = "#161b33";
  }

  // Deck floor
  ctx.fillStyle = theme.floor;
  ctx.fillRect(0, 210, canvas.width, 50);

  // Glowing neon dividing line
  ctx.save();
  ctx.strokeStyle = theme.neon;
  ctx.shadowColor = theme.neon;
  ctx.shadowBlur = 10;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 210);
  ctx.lineTo(canvas.width, 210);
  ctx.stroke();
  ctx.restore();
}

function drawHumanoid(x, y, config) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(config.facing, 1);

  // Cape
  if (config.cape) {
    let wave = Math.sin(Date.now() * 0.008) * 6;
    ctx.fillStyle = config.cape;
    ctx.beginPath();
    ctx.moveTo(-4, -28);
    ctx.quadraticCurveTo(-14 + wave, -15, -16 + wave * 1.5, 0);
    ctx.lineTo(-2, -22);
    ctx.fill();
  }

  // Back Leg
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-2, -12);
  ctx.lineTo(-3 + Math.sin(config.walkFrame) * 5, 0);
  ctx.stroke();

  // Torso / Athletic Taper
  ctx.fillStyle = config.armor;
  ctx.beginPath();
  ctx.moveTo(-6, -30);
  ctx.lineTo(6, -30);
  ctx.lineTo(3.5, -12);
  ctx.lineTo(-3.5, -12);
  ctx.closePath();
  ctx.fill();

  // Front Leg
  ctx.strokeStyle = "#1e293b";
  ctx.beginPath();
  ctx.moveTo(2, -12);
  ctx.lineTo(3 - Math.sin(config.walkFrame) * 5, 0);
  ctx.stroke();

  // Head
  ctx.fillStyle = config.skin;
  ctx.beginPath();
  ctx.arc(0, -36, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // Visor / Glow
  ctx.fillStyle = config.cape || "#ef4444";
  ctx.fillRect(1, -38, 4, 2);

  // Weapon / Arm
  ctx.strokeStyle = config.armor;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(0, -25);
  if (config.attacking) {
    ctx.lineTo(16, -24);
  } else {
    ctx.lineTo(5, -18);
  }
  ctx.stroke();

  ctx.restore();
}

function drawLightning(x1, y1, x2, y2, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.5;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  const segments = 5;
  const dx = (x2 - x1) / segments;
  const dy = (y2 - y1) / segments;

  for (let i = 1; i < segments; i++) {
    let nx = x1 + dx * i;
    let ny = y1 + dy * i + (Math.random() - 0.5) * 14;
    ctx.lineTo(nx, ny);
  }
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // Center white line
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

function update() {
  // Movement
  if (keys.left) {
    player.vx = -2.8;
    player.facing = -1;
    player.walkFrame += 0.2;
  } else if (keys.right) {
    player.vx = 2.8;
    player.facing = 1;
    player.walkFrame += 0.2;
  } else {
    player.vx = 0;
  }

  player.x += player.vx;
  player.y += player.vy;

  if (!player.grounded) {
    player.vy += 0.45; // Gravity
    if (player.y >= 210) {
      player.y = 210;
      player.vy = 0;
      player.grounded = true;
    }
  }

  player.x = Math.max(15, Math.min(canvas.width - 20, player.x));

  if (player.attackTimer > 0) {
    player.attackTimer--;
    if (player.attackTimer === 0) player.attacking = false;
  }

  // Enemy movement & shots
  enemies.forEach(enemy => {
    if (enemy.x > player.x + 80) enemy.x -= 0.6;
    enemy.walkFrame += 0.1;

    enemy.shootTimer--;
    if (enemy.shootTimer <= 0) {
      enemy.shootTimer = 110;
      attacks.push({
        type: "enemyBlast",
        x: enemy.x - 10,
        y: enemy.y - 25,
        vx: -3.5,
        radius: 5,
        color: "#ef4444",
        life: 100
      });
    }
  });

  // Update Attacks
  for (let i = attacks.length - 1; i >= 0; i--) {
    let a = attacks[i];
    if (a.type === "lightning") {
      a.life--;
      if (a.life <= 0) attacks.splice(i, 1);
    } else {
      a.x += a.vx;
      a.life--;

      // Hero bullet collision
      if (a.type === "projectile") {
        enemies.forEach(e => {
          if (Math.abs(a.x - e.x) < 14 && Math.abs(a.y - (e.y - 20)) < 20) {
            hitEnemy(e, 20);
            a.life = 0;
          }
        });
      }

      // Enemy blast collision
      if (a.type === "enemyBlast") {
        if (Math.abs(a.x - player.x) < 12 && Math.abs(a.y - (player.y - 20)) < 20) {
          player.hp = Math.max(0, player.hp - 10);
          updateHUD();
          a.life = 0;
        }
      }

      if (a.life <= 0 || a.x < 0 || a.x > canvas.width) attacks.splice(i, 1);
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();

  // Draw Player
  const heroCfg = heroes[curHero];
  drawHumanoid(player.x, player.y, {
    facing: player.facing,
    armor: heroCfg.armor,
    cape: heroCfg.cape,
    skin: heroCfg.skin,
    attacking: player.attacking,
    walkFrame: player.walkFrame
  });

  // Draw Enemies
  enemies.forEach(e => {
    // Health bar
    ctx.fillStyle = "#334155";
    ctx.fillRect(e.x - 12, e.y - 48, 24, 3);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(e.x - 12, e.y - 48, (e.hp / e.maxHp) * 24, 3);

    drawHumanoid(e.x, e.y, {
      facing: -1,
      armor: "#475569",
      skin: "#1e293b",
      attacking: false,
      walkFrame: e.walkFrame
    });
  });

  // Draw FX
  attacks.forEach(a => {
    if (a.type === "lightning") {
      drawLightning(a.x1, a.y1, a.x2, a.y2, a.color);
    } else {
      ctx.save();
      ctx.fillStyle = a.color;
      ctx.shadowColor = a.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
