<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vanguard: The Siege of Detroit</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 8px;
    background: #040711;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #game-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #070b16;
    border: 2px solid #1e293b;
    border-radius: 8px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.85);
    display: block;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 4px;
    color: #00e5ff;
  }
  .hud span { color: #fff; }
  .grid-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    width: 100%;
    margin-top: 5px;
  }
  .btn {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 5px;
    color: #94a3b8;
    padding: 7px 2px;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    line-height: 1.2;
  }
  .btn small { font-size: 8px; font-weight: 400; opacity: 0.8; display: block; }
  .btn:active { transform: scale(0.96); }
  .btn-atk {
    background: #1e293b;
    color: #f8fafc;
    border-color: #334155;
    padding: 9px 4px;
  }
  .btn-gold {
    border-color: #d97706;
    color: #fbbf24;
    background: #1c1917;
  }
  .btn-burst {
    border-color: #ec4899;
    color: #f472b6;
    background: #200d1a;
  }
  .btn-swap {
    border-color: #06b6d4;
    color: #22d3ee;
    background: #082f49;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div>LEAD: <span id="hud-lead" style="color:#fbbf24;">Marcus</span></div>
    <div>ZONE: <span id="hud-stage" style="color:#38bdf8;">1. RenCen Rooftop Helipad</span></div>
    <div>HP: <span id="hud-hp">120/120</span> | SCORE: <span id="hud-score">0</span></div>
  </div>

  <canvas id="stage" width="460" height="260"></canvas>

  <div class="grid-actions">
    <button class="btn btn-swap" id="btn-swap" style="grid-column: span 2; padding: 8px;">
      🔄 TAG / SWAP LEAD HERO<small id="lbl-partner">Partner: Mayleen (Active AI Flank)</small>
    </button>
    <button class="btn btn-gold" id="btn-luetta" style="padding: 8px;">
      MOTHER LUETTA<small>Sky / Ground Aid</small>
    </button>
  </div>

  <div class="grid-actions">
    <button class="btn btn-atk" id="btn-left">◀ LEFT</button>
    <button class="btn btn-atk" id="btn-skill1" style="border-color:#fbbf24; color:#fbbf24;">
      STRIKE 1<small id="lbl-skill1">Seismic Punch</small>
    </button>
    <button class="btn btn-atk" id="btn-right">RIGHT ▶</button>
  </div>
  <div class="grid-actions">
    <button class="btn btn-atk" id="btn-jump">NINJA JUMP<small>Spin & Knockback</small></button>
    <button class="btn btn-atk" id="btn-skill2" style="border-color:#38bdf8; color:#38bdf8;">
      SIGNATURE SKILL<small id="lbl-skill2">Golden Roots</small>
    </button>
    <button class="btn btn-burst" id="btn-skill3">OVERDRIVE<small id="lbl-skill3">Rumble Shatter Duo</small></button>
  </div>
</div>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const FLOOR_Y = 215;

let currentSector = 1;
let screenShake = 0;
let hitstopTimer = 0;

let activeHero = 'marcus';

const marcus = {
  x: 110, y: FLOOR_Y, yOffset: 0, facing: 1, vy: 0,
  grounded: true, jumpState: 'ground', spinAngle: 0, landingTimer: 0,
  isAttacking: false, attackTimer: 0, attackDuration: 14,
  runCycle: 0, hp: 120, maxHp: 120
};

const mayleen = {
  x: 70, y: FLOOR_Y, yOffset: 0, facing: 1, vy: 0,
  grounded: true, jumpState: 'ground', spinAngle: 0, landingTimer: 0,
  isAttacking: false, attackTimer: 0, attackDuration: 14,
  runCycle: 0, hp: 95, maxHp: 95, bellAngle: 0, aiTimer: 0
};

let burst = 100;
let score = 0;
let androidsDefeated = 0;

// Continuous Waves: Array of 3 active androids always on field
let enemies = [
  { x: 280, y: FLOOR_Y, vx: 0, hp: 50, maxHp: 50, dir: -1, tick: 0, isTrapped: false, trapTimer: 0, flash: 0, speed: 0.7 },
  { x: 380, y: FLOOR_Y, vx: 0, hp: 60, maxHp: 60, dir: -1, tick: 15, isTrapped: false, trapTimer: 0, flash: 0, speed: 0.9 },
  { x: 460, y: FLOOR_Y, vx: 0, hp: 70, maxHp: 70, dir: -1, tick: 30, isTrapped: false, trapTimer: 0, flash: 0, speed: 0.6 }
];

let boss = {
  active: false, name: "Cyber Apex", x: 440, y: FLOOR_Y, vx: 0,
  hp: 450, maxHp: 450, dir: -1, tick: 0, attackTimer: 0, flash: 0
};

let projectiles = [];
let glassShards = [];

let luettaCounter = 0;
const luetta = { active: false, mode: 'none', x: 0, y: 0, timer: 0, speed: 0 };

function getLead() { return activeHero === 'marcus' ? marcus : mayleen; }
function getPartner() { return activeHero === 'marcus' ? mayleen : marcus; }

// Tag Swap Lead
document.getElementById("btn-swap").addEventListener("click", () => {
  activeHero = activeHero === 'marcus' ? 'mayleen' : 'marcus';

  if (activeHero === 'marcus') {
    document.getElementById("hud-lead").innerText = "Marcus";
    document.getElementById("hud-lead").style.color = "#fbbf24";
    document.getElementById("lbl-partner").innerText = "Partner: Mayleen (Active AI Flank)";
    document.getElementById("lbl-skill1").innerText = "Seismic Punch";
    document.getElementById("lbl-skill2").innerText = "Golden Roots";
    document.getElementById("lbl-skill3").innerText = "Rumble Shatter Duo";
  } else {
    document.getElementById("hud-lead").innerText = "Mayleen";
    document.getElementById("hud-lead").style.color = "#f472b6";
    document.getElementById("lbl-partner").innerText = "Partner: Marcus (Guardian AI Flank)";
    document.getElementById("lbl-skill1").innerText = "Acoustic Strike";
    document.getElementById("lbl-skill2").innerText = "Resonant Trap Net";
    document.getElementById("lbl-skill3").innerText = "Harmonic Implosion";
  }
});

// Movement Controls
document.getElementById("btn-left").addEventListener("click", () => {
  let lead = getLead();
  lead.facing = -1;
  lead.x = Math.max(30, lead.x - 24);
  lead.runCycle += 0.5;
});
document.getElementById("btn-right").addEventListener("click", () => {
  let lead = getLead();
  lead.facing = 1;
  lead.x = Math.min(canvas.width - 25, lead.x + 24);
  lead.runCycle += 0.5;
});

// Jump with Somersault Spin & Aerial Knockback
document.getElementById("btn-jump").addEventListener("click", () => {
  let lead = getLead();
  if (!lead.grounded) return;
  lead.grounded = false;
  lead.vy = -13;
  lead.jumpState = 'spinning';
  lead.spinAngle = 0;

  // Knockback shockwave in midair
  let targets = boss.active ? [boss, ...enemies] : enemies;
  targets.forEach(e => {
    let dx = e.x - lead.x;
    if (Math.abs(dx) < 75) {
      e.vx = (dx >= 0 ? 1 : -1) * 9;
      e.hp -= 15;
      e.flash = 3;
    }
  });
});

// Strike 1
document.getElementById("btn-skill1").addEventListener("click", () => {
  let lead = getLead();
  if (lead.isAttacking) return;
  lead.isAttacking = true;
  lead.attackTimer = 0;

  let targets = boss.active ? [boss, ...enemies] : enemies;
  targets.forEach(e => {
    if (Math.abs(e.x - (lead.x + lead.facing * 30)) < 48) {
      e.hp -= 25;
      e.vx = lead.facing * 6;
      e.flash = 4;
      hitstopTimer = 3;
      screenShake = 3;
    }
  });
});

// Signature Skill
document.getElementById("btn-skill2").addEventListener("click", () => {
  let lead = getLead();
  if (activeHero === 'marcus') {
    projectiles.push({ type: 'roots', x: lead.x + lead.facing * 20, vx: lead.facing * 7.5, timer: 50 });
  } else {
    projectiles.push({ type: 'bellnet', x: lead.x + lead.facing * 20, y: lead.y - 20, vx: lead.facing * 6.5, radius: 14, maxRadius: 38 });
  }
});

// Overdrive
document.getElementById("btn-skill3").addEventListener("click", () => {
  if (burst < 100) return;
  burst = 0;
  screenShake = 14;
  let lead = getLead();
  projectiles.push({ type: 'shockblast', x: lead.x, radius: 20, maxRadius: 280 });

  let targets = boss.active ? [boss, ...enemies] : enemies;
  targets.forEach(e => {
    e.hp -= 80;
    e.vx = (e.x > lead.x ? 1 : -1) * 14;
    e.flash = 6;
  });
});

// Mother Luetta Summon
document.getElementById("btn-luetta").addEventListener("click", () => {
  if (luetta.active) return;
  luetta.active = true;
  let lead = getLead();
  if (luettaCounter === 0) {
    luetta.mode = 'sky';
    luetta.x = canvas.width / 2;
    luetta.y = -40;
    luetta.timer = 100;
    luettaCounter = 1;
  } else {
    luetta.mode = 'ground';
    luetta.x = lead.facing > 0 ? -30 : canvas.width + 30;
    luetta.y = FLOOR_Y;
    luetta.speed = 17 * lead.facing;
    luettaCounter = 0;
  }
});

// -------------------------------------------------------------
// Engine Loop
// -------------------------------------------------------------
function update() {
  if (hitstopTimer > 0) { hitstopTimer--; return; }
  if (screenShake > 0) screenShake *= 0.85;

  burst = Math.min(100, burst + 0.15);

  let lead = getLead();
  let partner = getPartner();

  if (lead.isAttacking) {
    lead.attackTimer++;
    if (lead.attackTimer >= lead.attackDuration) lead.isAttacking = false;
  }

  // Jump physics with somersault & 3-point landing recovery
  if (!lead.grounded) {
    lead.y += lead.vy;
    lead.vy += 0.72; // Gravity
    if (lead.jumpState === 'spinning') {
      lead.spinAngle += lead.facing * 0.38; // Somersault rotation
    }
    if (lead.y >= FLOOR_Y) {
      lead.y = FLOOR_Y;
      lead.vy = 0;
      lead.grounded = true;
      lead.jumpState = 'heroLanding';
      lead.landingTimer = 12; // 3-point crouch pause
    }
  } else if (lead.jumpState === 'heroLanding') {
    lead.landingTimer--;
    if (lead.landingTimer <= 0) lead.jumpState = 'ground';
  }

  // Partner AI Tracking
  let targetX = lead.x - (lead.facing * 38);
  partner.x += (targetX - partner.x) * 0.12;
  partner.facing = lead.facing;
  partner.y = FLOOR_Y;
  mayleen.bellAngle += 0.04;
  partner.aiTimer = (partner.aiTimer || 0) + 1;

  if (partner.aiTimer > 90) {
    partner.aiTimer = 0;
    if (activeHero === 'marcus') {
      projectiles.push({ type: 'bellpulse', x: mayleen.x + mayleen.facing * 18, y: mayleen.y - 24, vx: mayleen.facing * 5.5, radius: 12 });
    } else {
      projectiles.push({ type: 'roots', x: marcus.x + marcus.facing * 16, vx: marcus.facing * 6.5, timer: 35 });
    }
  }

  // Projectile Physics
  projectiles.forEach((p, idx) => {
    let targets = boss.active ? [boss, ...enemies] : enemies;
    if (p.type === 'roots') {
      p.x += p.vx;
      p.timer--;
      targets.forEach(e => {
        if (Math.abs(e.x - p.x) < 28) { e.hp -= 2.2; e.isTrapped = true; e.trapTimer = 50; }
      });
      if (p.timer <= 0) projectiles.splice(idx, 1);
    } else if (p.type === 'bellnet') {
      p.x += p.vx;
      p.radius = Math.min(p.maxRadius, p.radius + 0.8);
      targets.forEach(e => {
        if (Math.abs(e.x - p.x) < p.radius) { e.isTrapped = true; e.trapTimer = 150; e.hp -= 0.4; }
      });
      if (p.x > canvas.width + 50 || p.x < -50) projectiles.splice(idx, 1);
    } else if (p.type === 'bellpulse') {
      p.x += p.vx;
      targets.forEach(e => {
        if (Math.abs(e.x - p.x) < 24) { e.hp -= 18; e.vx = (p.vx > 0 ? 1 : -1) * 5; e.flash = 2; }
      });
      if (p.x > canvas.width + 40 || p.x < -40) projectiles.splice(idx, 1);
    } else if (p.type === 'shockblast') {
      p.radius += 9;
      if (p.radius >= p.maxRadius) projectiles.splice(idx, 1);
    }
  });

  // Endless Grunt Waves
  enemies.forEach(e => {
    e.x += e.vx;
    e.vx *= 0.86;
    e.tick += 0.05;
    if (e.flash > 0) e.flash--;

    if (e.isTrapped) {
      e.trapTimer--;
      e.vx = 0;
      if (e.trapTimer <= 0) e.isTrapped = false;
    } else if (Math.abs(e.vx) < 0.2) {
      e.x += (lead.x > e.x ? e.speed : -e.speed);
      e.dir = lead.x > e.x ? 1 : -1;
    }

    // When an android dies, immediately respawn a fresh unit offscreen
    if (e.hp <= 0) {
      score += 100;
      androidsDefeated++;
      e.hp = e.maxHp;
      // Respawn randomly from left or right edge
      e.x = Math.random() > 0.5 ? canvas.width + 30 : -30;
      e.speed = 0.5 + Math.random() * 0.7; // Variable robotic speed

      // Trigger Sector Boss after 6 kills
      if (androidsDefeated >= 6 && !boss.active) {
        boss.active = true;
        boss.x = canvas.width + 45;
        boss.hp = boss.maxHp;
      }
    }
  });

  // Sector Boss
  if (boss.active) {
    boss.x += boss.vx;
    boss.vx *= 0.88;
    boss.tick += 0.04;
    boss.attackTimer++;
    if (boss.flash > 0) boss.flash--;

    let dist = lead.x - boss.x;
    boss.dir = dist > 0 ? 1 : -1;

    if (Math.abs(dist) > 50) {
      boss.x += boss.dir * 1.3;
    } else if (boss.attackTimer % 85 === 0) {
      lead.hp = Math.max(0, lead.hp - 16);
      lead.x += boss.dir * 25;
      screenShake = 6;
    }

    if (boss.hp <= 0) {
      advanceStage();
    }
  }

  // Luetta Updates
  if (luetta.active) {
    let targets = boss.active ? [boss, ...enemies] : enemies;
    if (luetta.mode === 'sky') {
      if (luetta.y < 82) luetta.y += 3.2;
      luetta.timer--;
      targets.forEach(e => { e.hp -= 0.7; e.flash = 2; });
      if (luetta.timer <= 0) luetta.active = false;
    } else if (luetta.mode === 'ground') {
      luetta.x += luetta.speed;
      targets.forEach(e => {
        if (Math.abs(e.x - luetta.x) < 32) { e.hp -= 40; e.vx = (luetta.speed > 0 ? 1 : -1) * 12; e.flash = 3; }
      });
      if (luetta.x > canvas.width + 80 || luetta.x < -80) luetta.active = false;
    }
  }

  document.getElementById("hud-score").innerText = score;
  document.getElementById("hud-hp").innerText = lead.hp + "/" + lead.maxHp;
}

function advanceStage() {
  boss.active = false;
  androidsDefeated = 0;
  score += 1000;
  screenShake = 16;

  currentSector++;
  if (currentSector === 2) {
    document.getElementById("hud-stage").innerText = "2. RenCen Staircase Descent";
    document.getElementById("hud-stage").style.color = "#f59e0b";
  } else if (currentSector === 3) {
    document.getElementById("hud-stage").innerText = "3. Woodward Ave Street Siege";
    document.getElementById("hud-stage").style.color = "#ef4444";
  } else {
    currentSector = 1;
    document.getElementById("hud-stage").innerText = "1. RenCen Rooftop Helipad";
    document.getElementById("hud-stage").style.color = "#38bdf8";
  }
}

// -------------------------------------------------------------
// Authentic Detroit Rooftop & Zone Renderer
// -------------------------------------------------------------
function drawEnvironment(ctx) {
  let cx = canvas.width / 2;

  if (currentSector === 1) {
    // STAGE 1: REAL DETROIT ROOFTOP
    // Night sky over Detroit River
    let sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
    sky.addColorStop(0, "#030712");
    sky.addColorStop(1, "#172554");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, FLOOR_Y);

    // Distant Detroit Horizon & Flanking Towers
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(cx - 130, 70, 45, 145);
    ctx.fillRect(cx + 85,  70, 45, 145);

    // Renaissance Center Center Tower
    let renGrad = ctx.createLinearGradient(cx - 36, 0, cx + 36, 0);
    renGrad.addColorStop(0.0, "#0b1329");
    renGrad.addColorStop(0.35, "#38bdf8");
    renGrad.addColorStop(0.7, "#1e293b");
    renGrad.addColorStop(1.0, "#070c18");
    ctx.fillStyle = renGrad;
    ctx.fillRect(cx - 34, 25, 68, 190);

    // Crown Spire & Antenna Beacon
    ctx.fillStyle = "#334155";
    ctx.fillRect(cx - 38, 18, 76, 10);
    ctx.strokeStyle = "#38bdf8"; ctx.strokeRect(cx - 38, 18, 76, 10);
    ctx.strokeStyle = "#ef4444"; // Flashing red aircraft warning light
    ctx.fillStyle = Math.sin(Date.now() * 0.006) > 0 ? "#ef4444" : "#450a0a";
    ctx.beginPath(); ctx.arc(cx, 10, 3, 0, Math.PI * 2); ctx.fill();

    // --- DISTINCT ROOFTOP ELEMENTS ---
    // 1. Metal Perimeter Safety Railing
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    for (let rx = 0; rx < canvas.width; rx += 25) {
      ctx.beginPath(); ctx.moveTo(rx, FLOOR_Y - 14); ctx.lineTo(rx, FLOOR_Y); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, FLOOR_Y - 14); ctx.lineTo(canvas.width, FLOOR_Y - 14); ctx.stroke();

    // 2. Rooftop HVAC Industrial Ventilation Box
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(35, FLOOR_Y - 26, 45, 26);
    ctx.strokeStyle = "#64748b"; ctx.strokeRect(35, FLOOR_Y - 26, 45, 26);
    // Exhaust fan grill
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(57, FLOOR_Y - 13, 8, 0, Math.PI * 2); ctx.fill();

    // 3. Communications Satellite Dish
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx + 120, FLOOR_Y); ctx.lineTo(cx + 130, FLOOR_Y - 24); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 130, FLOOR_Y - 24, 12, -Math.PI * 0.7, Math.PI * 0.3); ctx.stroke();

    // 4. Rooftop Gravel Deck & Helipad Target Circle
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, FLOOR_Y, canvas.width, 45);

    // Yellow Helipad Paint
    ctx.strokeStyle = "rgba(251, 191, 36, 0.4)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cx, FLOOR_Y + 18, 65, 12, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(251, 191, 36, 0.45)";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("H", cx - 6, FLOOR_Y + 23);

    // Glowing Neon Edge Ledge
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(0, FLOOR_Y, canvas.width, 2.5);

  } else if (currentSector === 2) {
    // STAGE 2: Staircase & Corporate Interior
    ctx.fillStyle = "#070b14";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 2.5;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(0, 35 + i * 45); ctx.lineTo(canvas.width, 85 + i * 45); ctx.stroke();
    }
    ctx.fillStyle = Math.sin(Date.now() * 0.008) > 0 ? "#ef4444" : "#1e1b4b";
    ctx.fillRect(cx - 25, 20, 50, 14);
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, FLOOR_Y, canvas.width, 45);
    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(0, FLOOR_Y, canvas.width, 2);

  } else {
    // STAGE 3: Street-Level Detroit Siege
    let fireSky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
    fireSky.addColorStop(0, "#1c0d06");
    fireSky.addColorStop(1, "#7c2d12");
    ctx.fillStyle = fireSky;
    ctx.fillRect(0, 0, canvas.width, FLOOR_Y);

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(cx + 40, 45, 120, 45);
    ctx.strokeStyle = "#38bdf8"; ctx.strokeRect(cx + 40, 45, 120, 45);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 9px sans-serif";
    ctx.fillText("THORNE LOGISTICS", cx + 46, 70);

    ctx.fillStyle = "#18181b";
    ctx.fillRect(0, FLOOR_Y, canvas.width, 45);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(0, FLOOR_Y, canvas.width, 2.5);
  }
}

// -------------------------------------------------------------
// Character Rendering with Jump Spin & Heroic Landing
// -------------------------------------------------------------
function drawMarcus(ctx, p) {
  ctx.save();
  ctx.translate(p.x, p.y + p.yOffset);
  ctx.scale(p.facing, 1);

  if (p.jumpState === 'spinning') {
    // Aerial Somersault Ninja Spin
    ctx.rotate(p.spinAngle);
    ctx.fillStyle = "#92400e";
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fbbf24";
    ctx.fillRect(2, -4, 8, 8); // Golden gauntlet spinning

    // Kinetic Jump Ring
    ctx.strokeStyle = "rgba(245, 158, 11, 0.8)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.stroke();

  } else if (p.jumpState === 'heroLanding') {
    // 3-Point Heroic Landing Pose
    ctx.fillStyle = "#78350f";
    ctx.strokeStyle = "#d97706";
    ctx.lineWidth = 3.5;

    // Crouched Torso
    ctx.beginPath(); ctx.ellipse(0, -10, 8, 10, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, -6); ctx.lineTo(-14, 0); // Back bent leg
    ctx.moveTo(4, -6);  ctx.lineTo(10, 0);  // Forward bent leg
    ctx.stroke();

    // Golden Fist Slammed Flat on Roof
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.arc(12, -2, 5.5, 0, Math.PI * 2); ctx.fill();

    // Shockwave dust ring on impact
    ctx.strokeStyle = "rgba(251, 191, 36, 0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 5, 0, 0, Math.PI * 2); ctx.stroke();

  } else {
    // Upright Stance
    ctx.strokeStyle = "#d97706";
    ctx.fillStyle = "#78350f";
    ctx.lineWidth = 3.2;

    let stride = Math.sin(p.runCycle) * 5;
    ctx.beginPath();
    ctx.moveTo(-4, -15); ctx.lineTo(-6 - stride, 0);
    ctx.moveTo(4, -15);  ctx.lineTo(6 + stride, 0);
    ctx.stroke();

    ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, -15); ctx.stroke();
    ctx.fillStyle = "#92400e";
    ctx.fillRect(-6, -30, 12, 14);

    ctx.fillStyle = "#451a03";
    ctx.beginPath(); ctx.arc(1, -36, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1c1917";
    ctx.fillRect(-4, -42, 10, 4);

    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.arc(10, -20, 6, 0, Math.PI * 2); ctx.fill();

    if (p.isAttacking) {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(22, -14); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMayleen(ctx, m) {
  ctx.save();
  ctx.translate(m.x, m.y + m.yOffset);
  ctx.scale(m.facing, 1);

  if (m.jumpState === 'spinning') {
    // Mayleen Somersault
    ctx.rotate(m.spinAngle);
    ctx.fillStyle = "#ec4899";
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(244, 114, 182, 0.8)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();

  } else if (m.jumpState === 'heroLanding') {
    // Low agile landing
    ctx.fillStyle = "#831843";
    ctx.strokeStyle = "#ec4899";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -10, 6, 8, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, -5); ctx.lineTo(-12, 0);
    ctx.moveTo(4, -5);  ctx.lineTo(8, 0);
    ctx.stroke();

  } else {
    ctx.strokeStyle = "#ec4899";
    ctx.fillStyle = "#831843";
    ctx.lineWidth = 2.4;

    let stride = Math.sin(m.runCycle) * 4.5;
    ctx.beginPath();
    ctx.moveTo(-3, -14); ctx.lineTo(-5 - stride, 0);
    ctx.moveTo(3, -14);  ctx.lineTo(5 + stride, 0);
    ctx.stroke();

    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, -14); ctx.stroke();

    ctx.fillStyle = "#18181b";
    ctx.beginPath(); ctx.arc(1, -32, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#18181b";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-2, -34);
    ctx.quadraticCurveTo(-12, -38, -14, -26);
    ctx.stroke();

    ctx.strokeStyle = "#f472b6";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(12, -28); ctx.stroke();

    // Orbiting Chime Bells
    ctx.save();
    ctx.translate(6, -28);
    ctx.rotate(m.bellAngle);
    for (let i = 0; i < 4; i++) {
      let angle = (i * Math.PI) / 2;
      let bx = Math.cos(angle) * 16;
      let by = Math.sin(angle) * 16;
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(bx - 3, by - 3, 6, 6);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawEnemy(ctx, e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.dir, 1);

  ctx.strokeStyle = e.flash > 0 ? "#fff" : "#dc2626";
  ctx.fillStyle = e.flash > 0 ? "#fff" : "#991b1b";
  ctx.lineWidth = 2.4;

  let stride = Math.sin(e.tick * 3) * 3.5;
  ctx.beginPath();
  ctx.moveTo(-2, -15); ctx.lineTo(-4 - stride, 0);
  ctx.moveTo(2, -15);  ctx.lineTo(4 + stride, 0);
  ctx.moveTo(0, -28);  ctx.lineTo(0, -15);
  ctx.stroke();

  ctx.beginPath(); ctx.arc(0, -32, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ef4444"; ctx.fillRect(1, -33, 3, 2);

  if (e.isTrapped) {
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(8, -15);
    ctx.moveTo(8, 0);  ctx.lineTo(-8, -15);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = "#1e293b"; ctx.fillRect(e.x - 12, e.y - 42, 24, 3.5);
  ctx.fillStyle = "#ef4444"; ctx.fillRect(e.x - 12, e.y - 42, (e.hp / e.maxHp) * 24, 3.5);
}

function drawBoss(ctx, b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(b.dir * 1.3, 1.3);

  ctx.strokeStyle = b.flash > 0 ? "#fff" : "#7c3aed";
  ctx.fillStyle = b.flash > 0 ? "#fff" : "#5b21b6";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(-3, -16); ctx.lineTo(-6, 0);
  ctx.moveTo(3, -16);  ctx.lineTo(6, 0);
  ctx.moveTo(0, -32);  ctx.lineTo(0, -16);
  ctx.stroke();

  ctx.fillStyle = "#1e1b4b";
  ctx.beginPath(); ctx.arc(0, -36, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#c084fc"; ctx.fillRect(1, -38, 4, 3);

  ctx.strokeStyle = "#f43f5e";
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-6, -26); ctx.lineTo(14, -18); ctx.stroke();

  ctx.restore();

  ctx.fillStyle = "#1e1b4b"; ctx.fillRect(b.x - 25, b.y - 58, 50, 6);
  ctx.fillStyle = "#a855f7"; ctx.fillRect(b.x - 25, b.y - 58, (b.hp / b.maxHp) * 50, 6);
  ctx.fillStyle = "#f472b6"; ctx.font = "bold 9px sans-serif";
  ctx.fillText("CYBER APEX (SECTOR BOSS)", b.x - 45, b.y - 64);
}

function drawLuetta(ctx, l) {
  ctx.save();
  ctx.translate(l.x, l.y);

  if (l.mode === 'sky') {
    let beam = ctx.createLinearGradient(0, -80, 0, FLOOR_Y);
    beam.addColorStop(0, "rgba(251, 191, 36, 0.75)");
    beam.addColorStop(1, "rgba(251, 191, 36, 0.0)");
    ctx.fillStyle = beam;
    ctx.fillRect(-35, -l.y, 70, canvas.height);

    ctx.strokeStyle = "rgba(254, 240, 138, 0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -15); ctx.quadraticCurveTo(-26, -30, -32, -10);
    ctx.moveTo(0, -15); ctx.quadraticCurveTo(26, -30, 32, -10);
    ctx.stroke();

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(-14, 18);
    ctx.quadraticCurveTo(0, 22, 14, 18);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.arc(0, -22, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.ellipse(0, -30, 11, 3.5, 0, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.scale(l.speed > 0 ? 1 : -1, 1);
    ctx.strokeStyle = "rgba(251, 191, 36, 0.85)";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-45, -14); ctx.lineTo(0, -14); ctx.stroke();

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.arc(0, -24, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2, -22); ctx.lineTo(-18, 0); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawEnvironment(ctx);

  enemies.forEach(e => drawEnemy(ctx, e));
  if (boss.active) drawBoss(ctx, boss);

  drawMarcus(ctx, marcus);
  drawMayleen(ctx, mayleen);

  projectiles.forEach(p => {
    if (p.type === 'roots') {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p.x - 25, FLOOR_Y);
      ctx.quadraticCurveTo(p.x, FLOOR_Y - 22, p.x + 25, FLOOR_Y);
      ctx.stroke();
    } else if (p.type === 'bellnet') {
      ctx.strokeStyle = "#f472b6";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'bellpulse') {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'shockblast') {
      ctx.strokeStyle = "rgba(251, 191, 36, 0.65)";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, FLOOR_Y - 20, p.radius, 0, Math.PI * 2); ctx.stroke();
    }
  });

  if (luetta.active) drawLuetta(ctx, luetta);

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
