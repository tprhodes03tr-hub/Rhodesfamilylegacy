  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    // Characters definition
    const chars = {
      marcus: { name: 'Marcus', color: '#2b7fff', maxHp: 120, ability: 'Seismic Beat' },
      mayleen: { name: 'Mayleen', color: '#2ecc71', maxHp: 100, ability: 'Verdant Root' }
    };
    let activeChar = 'marcus';

    const hero = {
      x: 80,
      y: 190,
      width: 40,
      height: 80,
      vx: 0,
      vy: 0,
      facing: 1,
      speed: 5,
      isGrounded: true,
      action: 'idle',
      actionTimer: 0,
      hp: 120,
      score: 6000
    };

    const GROUND_Y = 190;
    const GRAVITY = 0.8;

    function updateHUD() {
      hud.textContent = `Zone 1: RenCen Rooftop | Hero: ${chars[activeChar].name} | HP: ${hero.hp}/${chars[activeChar].maxHp} | Score: ${hero.score}`;
    }

    // Button controls
    document.getElementById('btn-left').addEventListener('pointerdown', () => {
      hero.facing = -1;
      hero.x = Math.max(20, hero.x - 20);
    });

    document.getElementById('btn-right').addEventListener('pointerdown', () => {
      hero.facing = 1;
      hero.x = Math.min(canvas.width - hero.width - 20, hero.x + 20);
    });

    document.getElementById('btn-jump').addEventListener('pointerdown', () => {
      if (hero.isGrounded) {
        hero.vy = -14;
        hero.isGrounded = false;
      }
    });

    document.getElementById('btn-strike').addEventListener('pointerdown', () => {
      hero.action = 'strike';
      hero.actionTimer = 15;
    });

    document.getElementById('btn-sig').addEventListener('pointerdown', () => {
      hero.action = 'signature';
      hero.actionTimer = 25;
    });

    document.getElementById('btn-overdrive').addEventListener('pointerdown', () => {
      hero.action = 'overdrive';
      hero.actionTimer = 35;
    });

    document.getElementById('btn-tag').addEventListener('pointerdown', () => {
      activeChar = (activeChar === 'marcus') ? 'mayleen' : 'marcus';
      hero.hp = chars[activeChar].maxHp;
      hero.action = 'tag';
      hero.actionTimer = 20;
      updateHUD();
    });

    // Main Game Loop
    function loop() {
      // 1. Gravity & Jump Physics
      hero.y += hero.vy;
      if (!hero.isGrounded) {
        hero.vy += GRAVITY;
        if (hero.y >= GROUND_Y) {
          hero.y = GROUND_Y;
          hero.vy = 0;
          hero.isGrounded = true;
        }
      }

      // Action timer
      if (hero.actionTimer > 0) {
        hero.actionTimer--;
        if (hero.actionTimer <= 0) hero.action = 'idle';
      }

      // 2. Render Stage
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Detroit Skyline (RenCen Silhouette)
      ctx.fillStyle = '#060a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111d2e';
      ctx.fillRect(60, 110, 60, 160);
      ctx.fillRect(160, 70, 50, 200);
      ctx.fillRect(230, 40, 70, 230); // Central tower
      ctx.fillRect(320, 80, 50, 190);
      ctx.fillRect(390, 120, 60, 150);

      // Ground Line
      ctx.fillStyle = '#162234';
      ctx.fillRect(0, 270, canvas.width, 30);
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 270);
      ctx.lineTo(canvas.width, 270);
      ctx.stroke();

      // 3. Render Hero
      ctx.save();
      ctx.translate(hero.x + hero.width / 2, hero.y);
      if (hero.facing === -1) ctx.scale(-1, 1);

      // Torso / Armor
      ctx.fillStyle = chars[activeChar].color;
      ctx.fillRect(-15, 10, 30, 45);

      // Head
      ctx.fillStyle = '#8d5524';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      // Djembe / Side Gear
      ctx.fillStyle = (activeChar === 'marcus') ? '#8b4513' : '#1b5e20';
      ctx.beginPath();
      ctx.moveTo(-20, 32);
      ctx.lineTo(-28, 52);
      ctx.lineTo(-15, 52);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(10, 32);
      ctx.lineTo(2, 52);
      ctx.lineTo(15, 52);
      ctx.fill();

      // Legs
      ctx.fillStyle = '#0f1f38';
      ctx.fillRect(-12, 55, 10, 25);
      ctx.fillRect(2, 55, 10, 25);

      // 4. Combat Visual FX
      if (hero.action === 'strike') {
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(28, 30, 22, -0.6, 0.6);
        ctx.stroke();
      } else if (hero.action === 'signature') {
        // Seismic beat ring
        ctx.strokeStyle = '#00f7ff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(35, 40, 35 - hero.actionTimer, 0, Math.PI * 2);
        ctx.stroke();
      } else if (hero.action === 'overdrive') {
        // Full screen bass burst
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 35, 70 - hero.actionTimer * 1.5, 0, Math.PI * 2);
        ctx.stroke();
      } else if (hero.action === 'tag') {
        // Green/Gold Swap flash
        ctx.fillStyle = 'rgba(46, 204, 113, 0.35)';
        ctx.fillRect(-30, -20, 60, 110);
      }

      ctx.restore();

      requestAnimationFrame(loop);
    }

    updateHUD();
    requestAnimationFrame(loop);
  </script>
