<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancestral Vanguard - Detroit High Rooftops</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 8px;
    background: #070a12;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #game-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #090e1a;
    border: 2px solid #1e293b;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    display: block;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 4px;
    color: #00e5ff;
  }
  .hud span { color: #fff; }
  .grid-roster {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    width: 100%;
    margin-top: 6px;
  }
  .grid-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    width: 100%;
    margin-top: 6px;
  }
  .btn {
    background: #111827;
    border: 1px solid #1f293d;
    border-radius: 5px;
    color: #94a3b8;
    padding: 6px 2px;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    line-height: 1.2;
  }
  .btn small { font-size: 8px; font-weight: 400; opacity: 0.8; display: block; }
  .btn:active { transform: scale(0.96); }
  .btn.active {
    border-color: #00e5ff;
    background: #082f49;
    color: #38bdf8;
  }
  .btn-atk {
    background: #1e293b;
    color: #f8fafc;
    border-color: #334155;
    padding: 9px 4px;
  }
  .btn-gold {
    border-color: #d97706;
    color: #fbbf24;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div>HERO: <span id="hud-name">Shadow Kensai</span></div>
    <div>PWR: <span id="hud-pwr">LV.88</span> | HP: <span id="hud-hp">100/100</span></div>
    <div>SCORE: <span id="hud-score">0</span></div>
  </div>

  <canvas id="stage" width="460" height="260"></canvas>

  <!-- Comic Roster Grid -->
  <div class="grid-roster">
    <div class="btn active" onclick="selectHero('kensai')">Shadow Kensai<small>Balanced • Dual Blade</small></div>
    <div class="btn" onclick="selectHero('aura')">Aura Weaver<small>Hydro Mist • Tsunami</small></div>
    <div class="btn" onclick="selectHero('sundiata')">Sundiata Prime<small>Cosmic Force • Tank</small></div>
    <div class="btn" onclick="selectHero('delta')">Delta Vanguard<small>Stealth • Twin Dagger</small></div>
    <div class="btn" onclick="selectHero('pioneer')">Pioneer Volley<small>Solar Core • Blaster</small></div>
    <div class="btn" onclick="selectHero('prism')">Prism Void<small>Graviton • Void Shift</small></div>
  </div>

  <!-- Combat Controls -->
  <div class="grid-actions">
    <button class="btn btn-atk" id="btn-left">◀ LEFT</button>
    <button class="btn btn-atk" id="btn-strike" style="border-color:#38bdf8; color:#38bdf8;">COMBO STRIKE<small>Punch • Kick • Slash</small></button>
    <button class="btn btn-atk" id="btn-right">RIGHT ▶</button>
  </div>
  <div class="grid-actions">
    <button class="btn btn-atk" id="btn-jump">NINJA JUMP<small>Aerial Knockback</small></button>
    <button class="btn btn-atk" id="btn-skill">DISTINCT SKILL<small id="skill-label">Horizontal Cleave</small></button>
    <button class="btn btn-gold" id="btn-luetta">LUETTA AID<small>Dual Descent/Rush</small></button>
  </div>
</div>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const FLOOR_Y = 220;

// Character Profiles with unique power levels & attributes
const HERO_PROFILES = {
  kensai:   { name: "Shadow Kensai",   pwr: 88, maxHp: 100, speed: 4.8, color: "#00e5ff", skillName: "Horizontal Cleave" },
  aura:     { name: "Aura Weaver",     pwr: 92, maxHp: 80,  speed: 4.2, color: "#38bdf8", skillName: "Tsunami Rain" },
  sundiata: { name: "Sundiata Prime", pwr: 96, maxHp: 150, speed: 3.5, color: "#fbbf24", skillName: "Cosmic Quake" },
  delta:    { name: "Delta Vanguard",  pwr: 85, maxHp: 90,  speed: 5.5, color: "#a855f7", skillName: "Ghost Dash" },
  pioneer:  { name: "Pioneer Volley",  pwr: 87, maxHp: 95,  speed: 4.5, color: "#f97316", skillName: "Solar Ray" },
  prism:    { name: "Prism Void",      pwr: 94, maxHp: 85,  speed: 4.6, color: "#ec4899", skillName: "Singularity" }
};

let currentKey = 'kensai';

const player = {
  x: 90, y: FLOOR_Y, yOffset: 0, facing: 1, vy: 0,
  grounded: true, jumpState: 'ground', spinAngle: 0, landingTimer: 0,
  comboStage: 0, // 0: Punch, 1: Roundhouse Kick, 2: Katana Horizontal Across
  isStriking: false, strikeTimer: 0, strikeDuration: 12,
  isDashing: false, dashTimer: 0,
  score: 0
};

// Distinct Projectiles / Skill entities
let projectiles = [];

// Enemies
let enemies = [
  { x: 260, y: FLOOR_Y, vx: 0, hp: 60, maxHp: 60, dir: -1, tick: 0 },
  { x: 380, y: FLOOR_Y, vx: 0, hp: 80, maxHp: 80, dir: -1, tick: 20 }
];

// Luetta Summon State
let luettaCounter = 0;
const luetta = { active: false, mode: 'none', x: 0, y: 0, timer: 0, speed: 0 };

// Rain fx
let rainActive = false;
let rainTimer = 0;
let raindrops = [];
for (let i = 0; i < 40; i++) {
  raindrops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 8 + Math.random() * 4 });
}

function selectHero(key) {
  currentKey = key;
  const p = HERO_PROFILES[key];
  document.getElementById("hud-name").innerText = p.name;
  document.getElementById("hud-pwr").innerText = "LV." + p.pwr;
  document.getElementById("hud-hp").innerText = p.maxHp + "/" + p.maxHp;
  document.getElementById("skill-label").innerText = p.skillName;

  document.querySelectorAll(".grid-roster .btn").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");

  if (key === 'aura') { rainActive = true; rainTimer = 180; }
}

// Controls
document.getElementById("btn-left").addEventListener("click", () => {
  player.facing = -1;
  player.x = Math.max(25, player.x - HERO_PROFILES[currentKey].speed * 4);
});
document.getElementById("btn-right").addEventListener("click", () => {
  player.facing = 1;
  player.x = Math.min(canvas.width - 25, player.x + HERO_PROFILES[currentKey].speed * 4);
});

// Martial Arts Combo: Punch -> Kick -> Horizontal Sword Sweep
document.getElementById("btn-strike").addEventListener("click", () => {
  if (player.isStriking) return;
  player.isStriking = true;
  player.strikeTimer = 0;

  let reach = player.comboStage === 2 ? 55 : 35;
  let dmg = player.comboStage === 0 ? 15 : (player.comboStage === 1 ? 25 : 45);

  enemies.forEach(e => {
    if (Math.abs(e.x - (player.x + player.facing * (reach * 0.6))) < reach) {
      e.hp -= dmg;
      e.vx = player.facing * (player.comboStage === 2 ? 8 : 4);
    }
  });

  player.comboStage = (player.comboStage + 1) % 3; // cycles punch -> kick -> sweep
});

document.getElementById("btn-jump").addEventListener("click", () => {
  if (!player.grounded) return;
  player.grounded = false;
  player.vy = -12;
  player.jumpState = 'spinning';
  player.spinAngle = 0;

  // Crowd control shockwave push
  enemies.forEach(e => {
    let dx = e.x - player.x;
    if (Math.abs(dx) < 70) {
      e.vx = (dx >= 0 ? 1 : -1) * 8;
      e.hp -= 12;
    }
  });
});

// Distinct Skill Execution based on active hero
document.getElementById("btn-skill").addEventListener("click", () => {
  const hero = HERO_PROFILES[currentKey];

  if (currentKey === 'kensai') {
    // Katana Dash: Arcs across whole line
    player.isDashing = true;
    player.dashTimer = 0;
  } else if (currentKey === 'aura') {
    // Tsunami Wave + Rain
    rainActive = true;
    rainTimer = 160;
    projectiles.push({ type: 'tsunami', x: player.facing > 0 ? 0 : canvas.width, vx: player.facing * 8, dmg: 40 });
  } else if (currentKey === 'sundiata') {
    // Cosmic Ground Quake: Stuns and pushes all enemies
    enemies.forEach(e => { e.hp -= 35; e.vx = (e.x > player.x ? 1 : -1) * 11; });
    projectiles.push({ type: 'quake', x: player.x, radius: 10, maxRadius: 100 });
  } else if (currentKey === 'delta') {
    // Teleport Slash behind nearest foe
    if (enemies[0]) {
      player.x = enemies[0].x + (player.facing * -30);
      enemies[0].hp -= 50;
    }
  } else {
    // Solar Ray / Prism Singularity projectile
    projectiles.push({ type: 'beam', x: player.x, y: player.y - 18, vx: player.facing * 12, color: hero.color });
  }
});

// Mother Luetta Dual Summon
document.getElementById("btn-luetta").addEventListener("click", () => {
  if (luetta.active) return;
  luetta.active = true;
  if (luettaCounter === 0) {
    luetta.mode = 'sky';
    luetta.x = canvas.width / 2;
    luetta.y = -30;
    luetta.timer = 90;
    luettaCounter = 1;
  } else {
    luetta.mode = 'ground';
    luetta.x = player.facing > 0 ? -30 : canvas.width + 30;
    luetta.y = FLOOR_Y;
    luetta.speed = 16 * player.facing;
    luettaCounter = 0;
  }
});

function update() {
  // Attack animation timer
  if (player.isStriking) {
    player.strikeTimer++;
    if (player.strikeTimer >= player.strikeDuration) player.isStriking = false;
  }

  // Horizontal Dash
  if (player.isDashing) {
    player.dashTimer++;
    player.x += player.facing * 10;
    enemies.forEach(e => {
      if (Math.abs(e.x - player.x) < 25) { e.hp -= 3; e.vx = player.facing * 5; }
    });
    if (player.dashTimer >= 14) player.isDashing = false;
  }

  // Jump physics & landing
  if (!player.grounded) {
    player.y += player.vy;
    player.vy += 0.7;
    if (player.jumpState === 'spinning') player.spinAngle += player.facing * 0.35;
    if (player.y >= FLOOR_Y) {
      player.y = FLOOR_Y;
      player.vy = 0;
      player.grounded = true;
      player.jumpState = 'heroLanding';
      player.landingTimer = 10;
    }
  } else if (player.jumpState === 'heroLanding') {
    player.landingTimer--;
    if (player.landingTimer <= 0) player.jumpState = 'ground';
  }

  player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

  // Projectiles
  projectiles.forEach((p, idx) => {
    if (p.type === 'tsunami') {
      p.x += p.vx;
      enemies.forEach(e => {
        if (Math.abs(e.x - p.x) < 35) { e.hp -= 1.5; e.vx = (p.vx > 0 ? 1 : -1) * 6; }
      });
      if (p.x > canvas.width + 100 || p.x < -100) projectiles.splice(idx, 1);
    } else if (p.type === 'quake') {
      p.radius += 4;
      if (p.radius >= p.maxRadius) projectiles.splice(idx, 1);
    } else if (p.type === 'beam') {
      p.x += p.vx;
      enemies.forEach(e => {
        if (Math.abs(e.x - p.x) < 20) { e.hp -= 20; }
      });
      if (p.x > canvas.width + 40 || p.x < -40) projectiles.splice(idx, 1);
    }
  });

  // Rain
  if (rainActive) {
    raindrops.forEach(r => {
      r.y += r.speed;
      if (r.y > canvas.height) { r.y = -10; r.x = Math.random() * canvas.width; }
    });
    rainTimer--;
    if (rainTimer <= 0) rainActive = false;
  }

  // Enemies
  enemies.forEach(e => {
    e.x += e.vx;
    e.vx *= 0.86;
    e.tick += 0.05;
    if (e.hp <= 0) {
      player.score += 100;
      e.hp = e.maxHp;
      e.x = canvas.width + 30;
    }
    if (Math.abs(e.vx) < 0.2) {
      e.x += (player.x > e.x ? 0.5 : -0.5);
      e.dir = player.x > e.x ? 1 : -1;
    }
  });

  // Luetta
  if (luetta.active) {
    if (luetta.mode === 'sky') {
      if (luetta.y < 80) luetta.y += 3.5;
      luetta.timer--;
      enemies.forEach(e => { e.hp -= 0.6; e.x += (Math.random() - 0.5) * 3; });
      if (luetta.timer <= 0) luetta.active = false;
    } else if (luetta.mode === 'ground') {
      luetta.x += luetta.speed;
      enemies.forEach(e => {
        if (Math.abs(e.x - luetta.x) < 30) { e.hp -= 35; e.vx = (luetta.speed > 0 ? 1 : -1) * 12; }
      });
      if (luetta.x > canvas.width + 80 || luetta.x < -80) luetta.active = false;
    }
  }

  document.getElementById("hud-score").innerText = player.score;
}

function drawHero(ctx, p) {
  const profile = HERO_PROFILES[currentKey];
  ctx.save();
  ctx.translate(p.x, p.y + p.yOffset);
  ctx.scale(p.facing, 1);

  if (p.jumpState === 'spinning') {
    ctx.rotate(p.spinAngle);
    ctx.fillStyle = profile.color;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  } else if (p.jumpState === 'heroLanding') {
    // 3-point landing pose
    ctx.strokeStyle = profile.color;
    ctx.fillStyle = profile.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, -10, 7, 8, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, -6); ctx.lineTo(-12, 0);
    ctx.moveTo(4, -6);  ctx.lineTo(10, 0);
    ctx.stroke();
    // trailing blade
    ctx.strokeStyle = "#fff";
    ctx.beginPath(); ctx.moveTo(-2, -8); ctx.lineTo(-24, 0); ctx.stroke();
  } else {
    // Humanoid Body
    ctx.strokeStyle = profile.color;
    ctx.fillStyle = profile.color;
    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";

    // Legs
    ctx.beginPath();
    ctx.moveTo(-3, -15); ctx.lineTo(-5, 0);
    ctx.moveTo(3, -15);  ctx.lineTo(5, 0);
    ctx.stroke();

    // Torso & Head
    ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, -15); ctx.stroke();
    ctx.beginPath(); ctx.arc(1, -34, 5, 0, Math.PI * 2); ctx.fill();

    // Combat combos
    if (p.isStriking) {
      if (p.comboStage === 1) {
        // Punch Pose
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(16, -26); ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(16, -26, 3.5, 0, Math.PI * 2); ctx.fill();
      } else if (p.comboStage === 2) {
        // Roundhouse Kick Pose
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(20, -20); ctx.stroke();
      } else {
        // Horizontal Katana Sweep across
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-10, -22); ctx.lineTo(34, -22); ctx.stroke();
        // Glow streak
        ctx.strokeStyle = profile.color;
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(-15, -22); ctx.lineTo(38, -22); ctx.stroke();
      }
    } else {
      // Idle arms
      ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(6, -18); ctx.stroke();
      // Hip sword/accessory
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-6, -18); ctx.lineTo(6, -22); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEnemy(ctx, e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.dir, 1);
  ctx.strokeStyle = "#dc2626";
  ctx.fillStyle = "#991b1b";
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";

  let stride = Math.sin(e.tick * 3) * 3.5;
  ctx.beginPath();
  ctx.moveTo(-2, -15); ctx.lineTo(-4 - stride, 0);
  ctx.moveTo(2, -15);  ctx.lineTo(4 + stride, 0);
  ctx.moveTo(0, -28);  ctx.lineTo(0, -15);
  ctx.stroke();

  ctx.beginPath(); ctx.arc(0, -32, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ef4444"; ctx.fillRect(1, -33, 3, 2); // visor
  ctx.restore();

  // Health bar
  ctx.fillStyle = "#1e293b"; ctx.fillRect(e.x - 12, e.y - 42, 24, 3.5);
  ctx.fillStyle = "#ef4444"; ctx.fillRect(e.x - 12, e.y - 42, (e.hp / e.maxHp) * 24, 3.5);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Skyline
  ctx.fillStyle = "#060911";
  ctx.fillRect(40, 90, 45, 130);
  ctx.fillRect(120, 70, 60, 150);
  ctx.fillRect(230, 110, 50, 110);
  ctx.fillRect(330, 85, 65, 135);

  // Platform
  ctx.fillStyle = "#111827";
  ctx.fillRect(0, FLOOR_Y, canvas.width, 40);
  ctx.fillStyle = HERO_PROFILES[currentKey].color;
  ctx.fillRect(0, FLOOR_Y, canvas.width, 2);

  // Rain
  if (rainActive) {
    ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    raindrops.forEach(r => { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 2, r.y + 10); });
    ctx.stroke();
  }

  // Draw Enemies & Hero
  enemies.forEach(e => drawEnemy(ctx, e));
  drawHero(ctx, player);

  // Projectiles
  projectiles.forEach(p => {
    if (p.type === 'tsunami') {
      ctx.fillStyle = "rgba(14, 165, 233, 0.6)";
      ctx.beginPath();
      ctx.moveTo(p.x - 40, FLOOR_Y);
      ctx.quadraticCurveTo(p.x, FLOOR_Y - 70, p.x + 40, FLOOR_Y);
      ctx.fill();
    } else if (p.type === 'quake') {
      ctx.strokeStyle = "rgba(251, 191, 36, 0.7)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, FLOOR_Y, p.radius, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.type === 'beam') {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 15, p.y - 3, 30, 6);
    }
  });

  // Luetta
  if (luetta.active) {
    ctx.save();
    ctx.translate(luetta.x, luetta.y);
    if (luetta.mode === 'sky') {
      let grad = ctx.createLinearGradient(0, -60, 0, FLOOR_Y);
      grad.addColorStop(0, "rgba(251, 191, 36, 0.6)");
      grad.addColorStop(1, "rgba(251, 191, 36, 0.0)");
      ctx.fillStyle = grad;
      ctx.fillRect(-30, -luetta.y, 60, canvas.height);
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath(); ctx.arc(0, -16, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(0, -24, 10, 3, 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(-12, -18, 24, 18);
    }
    ctx.restore();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
