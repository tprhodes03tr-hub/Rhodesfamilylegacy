<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard: The Siege of Detroit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050811;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      max-width: 520px;
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    canvas {
      width: 100%;
      height: 270px;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #334155;
      display: block;
    }
    .title-tag {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      color: #f59e0b;
      margin: 10px 0;
      letter-spacing: 0.05em;
    }
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .hero-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.2;
    }
    .hero-btn.active {
      border-color: #38bdf8;
      color: #fff;
      background: #0369a1;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .ctrl-btn {
      background: #334155;
      border: none;
      color: #fff;
      padding: 14px 2px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.atk { background: #0284c7; }
    .ctrl-btn.burst { background: #ef4444; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <span id="score">SCORE: 771000</span>
      <span id="hero-hp" style="color: #4ade80;">HERO HP: 100%</span>
      <span id="wave">WAVE [1/8]</span>
    </div>

    <canvas id="gameCanvas" width="500" height="270"></canvas>

    <div class="title-tag">✦ CHAPTER 8: THE SIEGE OF DETROIT ✦</div>

    <!-- CANONICAL VANGUARD HERO ROSTER -->
    <div class="roster-grid">
      <button class="hero-btn active" onclick="selectHero('Sundiata Prime', 'Solar Resonator', '#f59e0b', 'solar')">
        Sundiata Prime<br><small>Solar Resonator</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Delta Heavy', 'Kinetic Cleave', '#ea580c', 'strike')">
        Delta Heavy<br><small>Kinetic Cleave</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Twin Resonance', 'Sonic Bell Wave', '#ec4899', 'sonic')">
        Twin Resonance<br><small>Sonic Tag</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Pioneer Volley', 'Arc Ley-Arrow', '#10b981', 'arrow')">
        Pioneer Volley<br><small>Arc Arrow</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Living Codex', 'Marrow Shock', '#38bdf8', 'marrow')">
        Living Codex<br><small>Marrow Shock</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Void Aegis', 'Null Barrier', '#a855f7', 'barrier')">
        Void Aegis<br><small>Null Shield</small>
      </button>
    </div>

    <div class="controls-grid">
      <button class="ctrl-btn" id="btn-left">&#9664; LEFT</button>
      <button class="ctrl-btn" id="btn-right">RIGHT &#9654;</button>
      <button class="ctrl-btn" id="btn-jump">&#9650; JUMP</button>
      <button class="ctrl-btn atk" id="btn-atk">ATK / POW</button>
      <button class="ctrl-btn burst" id="btn-burst">BURST</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentHero = { name: 'Sundiata Prime', move: 'Solar Resonator', color: '#f59e0b', type: 'solar' };
    let score = 771000;

    let player = {
      x: 60, y: 170, w: 32, h: 54,
      vx: 0, vy: 0, speed: 5.5,
      grounded: true
    };

    let projectiles = [];
    let enemies = [
      { x: 300, y: 172, w: 30, h: 52, hp: 70, maxHp: 70, dir: -1 },
      { x: 430, y: 172, w: 30, h: 52, hp: 70, maxHp: 70, dir: -1 }
    ];

    let particles = [];
    let comicFX = [];
    let shake = 0;
    let cutIn = { active: false, timer: 0, text: '' };

    function selectHero(name, move, color, type) {
      currentHero = { name, move, color, type };
      document.querySelectorAll('.hero-btn').forEach(b => {
        b.classList.toggle('active', b.innerText.includes(name));
      });
      comicFX.push({ text: name.toUpperCase() + ' SUMMONED!', x: canvas.width / 2, y: 80, life: 25, col: color });
    }

    // Touch & Key listeners
    const keys = { left: false, right: false };
    const leftBtn = document.getElementById('btn-left');
    const rightBtn = document.getElementById('btn-right');

    const setLeft = (v) => keys.left = v;
    const setRight = (v) => keys.right = v;

    leftBtn.addEventListener('mousedown', () => setLeft(true));
    leftBtn.addEventListener('mouseup', () => setLeft(false));
    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setLeft(true); });
    leftBtn.addEventListener('touchend', () => setLeft(false));

    rightBtn.addEventListener('mousedown', () => setRight(true));
    rightBtn.addEventListener('mouseup', () => setRight(false));
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setRight(true); });
    rightBtn.addEventListener('touchend', () => setRight(false));

    document.getElementById('btn-jump').addEventListener('click', () => {
      if (player.grounded) {
        player.vy = -12;
        player.grounded = false;
        // Ground dust kick
        for (let i = 0; i < 6; i++) {
          particles.push({ x: player.x + 16, y: player.y + player.h, vx: (Math.random() - 0.5) * 4, vy: -1.5, life: 16, color: '#94a3b8' });
        }
      }
    });

    document.getElementById('btn-atk').addEventListener('click', () => {
      // Launch Signature Power
      projectiles.push({
        x: player.x + player.w,
        y: player.y + 22,
        vx: currentHero.type === 'arrow' ? 12 : 8.5,
        type: currentHero.type,
        color: currentHero.color
      });

      shake = 5;
      const soundTexts = ['CHOONK!', 'THWACK!', 'KRAK!'];
      const txt = soundTexts[Math.floor(Math.random() * soundTexts.length)];
      comicFX.push({ text: txt, x: player.x + 40, y: player.y - 12, life: 20, col: currentHero.color });
    });

    document.getElementById('btn-burst').addEventListener('click', () => {
      shake = 26;
      cutIn = { active: true, timer: 32, text: currentHero.move.toUpperCase() + '!' };
      comicFX.push({ text: 'RUMBLE! SHATTER!', x: canvas.width / 2, y: 130, life: 40, col: '#EF4444' });

      // Ground shockwaves across all enemies
      enemies.forEach(e => {
        e.hp -= 50;
        for (let i = 0; i < 15; i++) {
          particles.push({
            x: e.x + 15, y: e.y + 25,
            vx: (Math.random() - 0.5) * 9,
            vy: (Math.random() - 0.5) * 9,
            life: 28, color: currentHero.color
          });
        }
      });
    });

    function update() {
      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx *= 0.7;

      player.x += player.vx;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      player.y += player.vy;
      if (player.y < 170) {
        player.vy += 0.85;
      } else {
        player.y = 170;
        player.vy = 0;
        player.grounded = true;
      }

      // Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;

        // Enemy collision
        for (let j = 0; j < enemies.length; j++) {
          let e = enemies[j];
          if (p.x > e.x && p.x < e.x + e.w && p.y > e.y && p.y < e.y + e.h) {
            e.hp -= 25;
            score += 1800;
            document.getElementById('score').innerText = 'SCORE: ' + score;
            shake = 8;
            comicFX.push({ text: 'BAM!', x: e.x, y: e.y - 15, life: 20, col: '#f59e0b' });

            for (let k = 0; k < 8; k++) {
              particles.push({
                x: p.x, y: p.y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                life: 18, color: p.color
              });
            }

            projectiles.splice(i, 1);
            break;
          }
        }

        if (p && p.x > canvas.width) projectiles.splice(i, 1);
      }

      // Enemies AI
      enemies.forEach(e => {
        if (e.hp <= 0) {
          e.x = canvas.width + 50;
          e.hp = e.maxHp;
          score += 6000;
          document.getElementById('score').innerText = 'SCORE: ' + score;
        }

        e.x += e.dir * 1.5;
        if (e.x < 150 || e.x > canvas.width - 45) e.dir *= -1;
      });

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let pr = particles[i];
        pr.x += pr.vx;
        pr.y += pr.vy;
        if (--pr.life <= 0) particles.splice(i, 1);
      }
    }

    // DRAW CITY SKYLINE & SMOKE (Detroit / Comic Backdrop)
    function drawEnvironment() {
      // Dusk Atmospheric Sky
      let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#0c1626');
      skyGrad.addColorStop(0.5, '#221528');
      skyGrad.addColorStop(0.85, '#4a2028');
      skyGrad.addColorStop(1, '#1e111d');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Smoldering Cloud Masses
      ctx.fillStyle = 'rgba(25, 20, 32, 0.6)';
      ctx.beginPath();
      ctx.arc(80, 50, 45, 0, Math.PI * 2);
      ctx.arc(140, 40, 60, 0, Math.PI * 2);
      ctx.arc(380, 55, 55, 0, Math.PI * 2);
      ctx.fill();

      // Silhouetted Skyscraper Skyline with Window Lights
      const buildings = [
        { x: 20, w: 45, h: 140 }, { x: 70, w: 55, h: 170 },
        { x: 135, w: 40, h: 120 }, { x: 185, w: 60, h: 190 },
        { x: 255, w: 50, h: 150 }, { x: 315, w: 65, h: 180 },
        { x: 390, w: 45, h: 130 }, { x: 445, w: 50, h: 160 }
      ];

      buildings.forEach(b => {
        // Building body
        ctx.fillStyle = '#111827';
        ctx.fillRect(b.x, canvas.height - 45 - b.h, b.w, b.h);

        // Tower spire
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(b.x + b.w / 2 - 2, canvas.height - 55 - b.h, 4, 12);

        // Flashing / Glowing windows
        ctx.fillStyle = 'rgba(245, 158, 11, 0.4)';
        for (let wy = canvas.height - 40 - b.h + 10; wy < canvas.height - 50; wy += 16) {
          for (let wx = b.x + 6; wx < b.x + b.w - 8; wx += 10) {
            if ((wx + wy) % 5 === 0) ctx.fillRect(wx, wy, 4, 6);
          }
        }
      });

      // Rooftop Pavement Ground
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 224, canvas.width, 46);

      // Cracked Stone Parapet Edge & Lineage Accents
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 224, canvas.width, 4);

      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 226);
      ctx.lineTo(canvas.width, 226);
      ctx.stroke();

      // Rooftop Cracks
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(80, 226); ctx.lineTo(110, 245); ctx.lineTo(130, 240);
      ctx.moveTo(320, 226); ctx.lineTo(340, 250);
      ctx.stroke();
    }

    // DRAW COMIC HERO CHARACTER
    function drawVanguardHero(x, y, hero) {
      ctx.save();
      // Kinetic Ley-Line Aura
      ctx.shadowColor = hero.color;
      ctx.shadowBlur = 14;

      // Cape / Aura Backing
      if (hero.type === 'solar' || hero.type === 'marrow') {
        ctx.fillStyle = hero.color;
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 16);
        ctx.lineTo(x - 12, y + 46);
        ctx.lineTo(x + 10, y + 42);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // Torso Armor
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x + 6, y + 14, 20, 22);

      // Glowing Ley-Line Marrow Resonator Core
      ctx.fillStyle = hero.color;
      ctx.fillRect(x + 11, y + 18, 10, 12);

      // Shoulders & Chest Gauntlets
      ctx.fillStyle = '#334155';
      ctx.fillRect(x + 2, y + 14, 6, 12);
      ctx.fillRect(x + 24, y + 14, 6, 12);

      // Head / Mask
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(x + 8, y, 16, 14);

      // Glowing Visor / Eyes
      ctx.fillStyle = hero.color;
      ctx.fillRect(x + 15, y + 4, 8, 3);

      // Combat Legs
      ctx.fillStyle = '#090d16';
      ctx.fillRect(x + 7, y + 36, 7, 18);
      ctx.fillRect(x + 18, y + 36, 7, 18);

      // Armored Boots
      ctx.fillStyle = '#475569';
      ctx.fillRect(x + 5, y + 48, 9, 6);
      ctx.fillRect(x + 18, y + 48, 9, 6);

      ctx.restore();
    }

    // DRAW DETROIT SYNDICATE FOE
    function drawSyndicateFoe(x, y, hp, maxHp) {
      ctx.save();
      // HP Bar
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 2, y - 14, 34, 5);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - 2, y - 14, (hp / maxHp) * 34, 5);

      // Dark Enforcer Armor
      ctx.fillStyle = '#18181b';
      ctx.fillRect(x + 5, y + 14, 20, 22);

      // Syndicate Void Core
      ctx.fillStyle = '#a855f7';
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 8;
      ctx.fillRect(x + 10, y + 18, 10, 10);

      // Helmet
      ctx.fillStyle = '#27272a';
      ctx.fillRect(x + 8, y, 14, 14);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(x + 8, y + 4, 12, 3);

      // Legs
      ctx.fillStyle = '#09090b';
      ctx.fillRect(x + 6, y + 36, 7, 16);
      ctx.fillRect(x + 17, y + 36, 7, 16);
      ctx.restore();
    }

    // DRAW SIGNATURE SUPERPOWER PROJECTILES
    function drawProjectile(p) {
      ctx.save();
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = p.color;

      if (p.type === 'arrow') {
        // Glowing Piercing Ley-Arrow
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x - 14, p.y);
        ctx.lineTo(p.x + 8, p.y);
        ctx.stroke();
        // Arrow head
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y - 4);
        ctx.lineTo(p.x + 14, p.y);
        ctx.lineTo(p.x + 8, p.y + 4);
        ctx.closePath();
        ctx.fill();
      } else if (p.type === 'sonic') {
        // Sonic Expanding Arc Rings
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
      } else {
        // Kinetic / Solar Energy Blast
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function render() {
      ctx.save();

      // Screen Shake
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.84;
        if (shake < 0.5) shake = 0;
      }

      drawEnvironment();
      drawVanguardHero(player.x, player.y, currentHero);
      enemies.forEach(e => drawSyndicateFoe(e.x, e.y, e.hp, e.maxHp));
      projectiles.forEach(drawProjectile);

      // Particles
      particles.forEach(pr => {
        ctx.fillStyle = pr.color;
        ctx.fillRect(pr.x, pr.y, 3, 3);
      });

      // Comic Onomatopoeia
      for (let i = comicFX.length - 1; i >= 0; i--) {
        let fx = comicFX[i];
        ctx.save();
        ctx.font = '900 24px "Impact", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#000';
        ctx.fillStyle = fx.col;
        ctx.strokeText(fx.text, fx.x, fx.y);
        ctx.fillText(fx.text, fx.x, fx.y);
        ctx.restore();
        fx.y -= 0.8;
        if (--fx.life <= 0) comicFX.splice(i, 1);
      }

      ctx.restore();

      // Fullscreen Comic Slash Super Cut-In
      if (cutIn.active) {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 23, 0.78)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Angled Comic Splash Banner
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = currentHero.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 50); ctx.lineTo(canvas.width, 20);
        ctx.lineTo(canvas.width, 210); ctx.lineTo(0, 240);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 28px "Impact", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f59e0b';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 6;
        ctx.strokeText(cutIn.text, canvas.width / 2, 140);
        ctx.fillText(cutIn.text, canvas.width / 2, 140);
        ctx.restore();

        if (--cutIn.timer <= 0) cutIn.active = false;
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
