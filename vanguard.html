<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanguard - Detroit High Rooftops</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 10px;
    background: #090d16;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #game-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #0c1220;
    border: 2px solid #1f293d;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    display: block;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 6px 4px;
    color: #00e5ff;
  }
  .hud span { color: #fff; }
  .grid-chars, .grid-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    margin-top: 8px;
  }
  .btn {
    background: #151d30;
    border: 1px solid #283754;
    border-radius: 6px;
    color: #cbd5e1;
    padding: 8px 4px;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
  }
  .btn:active {
    background: #00e5ff;
    color: #000;
    transform: scale(0.97);
  }
  .btn.active {
    border-color: #00e5ff;
    background: #0a2540;
    color: #00e5ff;
  }
  .btn-gold {
    border-color: #f59e0b;
    color: #fbbf24;
  }
  .btn-gold:active {
    background: #fbbf24;
    color: #000;
  }
  .btn-aqua {
    border-color: #06b6d4;
    color: #22d3ee;
  }
  .btn-aqua:active {
    background: #22d3ee;
    color: #000;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div>SCORE: <span id="hud-score">0</span></div>
    <div>HP: <span id="hud-hp">100/100</span></div>
    <div>BURST: <span id="hud-burst">100%</span></div>
  </div>

  <canvas id="stage" width="460" height="280"></canvas>

  <div class="grid-chars">
    <div class="btn active" id="btn-kensai">Shadow Kensai<br><small style="font-weight:400; font-size:9px;">Katana Combo</small></div>
    <div class="btn btn-aqua" id="btn-water">Aura Weaver<br><small style="font-weight:400; font-size:9px;">Tsunami Rain</small></div>
    <div class="btn btn-gold" id="btn-luetta">Luetta Aid<br><small style="font-weight:400; font-size:9px;">Dual Summon</small></div>
  </div>

  <div class="grid-controls">
    <button class="btn" id="btn-left">◀ LEFT</button>
    <button class="btn" id="btn-slash">KATANA SLASH</button>
    <button class="btn" id="btn-right">RIGHT ▶</button>
  </div>
  <div class="grid-controls" style="margin-top:6px;">
    <button class="btn" id="btn-jump">NINJA JUMP</button>
    <button class="btn" id="btn-dash">ARC DASH</button>
    <button class="btn" id="btn-evade">EVADE</button>
  </div>
</div>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const FLOOR_Y = 240;

// Player Core
const player = {
  x: 100,
  y: FLOOR_Y,
  yOffset: 0,
  vx: 0,
  vy: 0,
  facing: 1,
  grounded: true,
  jumpState: 'ground', // 'ground', 'spinning', 'heroLanding'
  spinAngle: 0,
  landingTimer: 0,
  isDashing: false,
  dashTimer: 0,
  dashDuration: 18,
  dashSpeed: 9,
  isAttacking: false,
  attackTimer: 0,
  attackDuration: 14,
  comboStep: 0, // 0 = Downward Cleave, 1 = Rising Uppercut
  hp: 100,
  burst: 100,
  score: 0
};

// Enemies
let enemies = [
  { x: 260, y: FLOOR_Y, vx: 0, hp: 60, maxHp: 60, dir: -1 },
  { x: 380, y: FLOOR_Y, vx: 0, hp: 80, maxHp: 80, dir: -1 }
];

// Summon State
let luettaCallCount = 0; // 0 = Sky, 1 = Ground
const luetta = { active: false, mode: 'none', x: 0, y: 0, timer: 0, speed: 0 };

// Aura Weaver Water FX State
const waterState = {
  rainActive: false,
  rainTimer: 0,
  raindrops: [],
  waveActive: false,
  waveX: 0,
  waveAlpha: 1
};

// Spawn background raindrops
for (let i = 0; i < 40; i++) {
  waterState.raindrops.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: 7 + Math.random() * 5,
    len: 12 + Math.random() * 8
  });
}

// -------------------------------------------------------------
// Input Handlers
// -------------------------------------------------------------
document.getElementById("btn-left").addEventListener("click", () => {
  player.facing = -1;
  player.x = Math.max(30, player.x - 25);
});
document.getElementById("btn-right").addEventListener("click", () => {
  player.facing = 1;
  player.x = Math.min(canvas.width - 30, player.x + 25);
});

document.getElementById("btn-slash").addEventListener("click", triggerKatanaSlash);
document.getElementById("btn-dash").addEventListener("click", triggerArcDash);
document.getElementById("btn-jump").addEventListener("click", triggerNinjaJump);
document.getElementById("btn-luetta").addEventListener("click", triggerLuettaAid);
document.getElementById("btn-water").addEventListener("click", triggerAuraTsunami);

function triggerKatanaSlash() {
  if (player.isAttacking) return;
  player.isAttacking = true;
  player.attackTimer = 0;
  player.comboStep = (player.comboStep + 1) % 2;

  // Hit check
  enemies.forEach(e => {
    if (Math.abs(e.x - (player.x + player.facing * 30)) < 40) {
      e.hp -= 25;
      e.vx = player.facing * 5;
    }
  });
}

function triggerArcDash() {
  if (player.isDashing) return;
  player.isDashing = true;
  player.dashTimer = 0;
}

function triggerNinjaJump() {
  if (!player.grounded) return;
  player.grounded = false;
  player.vy = -12.5;
  player.jumpState = 'spinning';
  player.spinAngle = 0;

  // Crowd control: push away rooftop grunts at takeoff
  enemies.forEach(e => {
    let dx = e.x - player.x;
    if (Math.abs(dx) < 80) {
      e.vx = (dx >= 0 ? 1 : -1) * 9;
      e.hp -= 10;
    }
  });
}

function triggerLuettaAid() {
  if (luetta.active) return;
  luetta.active = true;

  if (luettaCallCount === 0) {
    // Mode 1: Sky Descent Wipe
    luetta.mode = 'sky';
    luetta.x = canvas.width / 2;
    luetta.y = -40;
    luetta.timer = 90;
    luettaCallCount = 1;
  } else {
    // Mode 2: Blazing Ground Charge
    luetta.mode = 'ground';
    luetta.x = player.facing > 0 ? -30 : canvas.width + 30;
    luetta.y = FLOOR_Y - 20;
    luetta.speed = 18 * player.facing;
    luettaCallCount = 0;
  }
}

function triggerAuraTsunami() {
  waterState.rainActive = true;
  waterState.rainTimer = 120;
  waterState.waveActive = true;
  waterState.waveX = player.facing > 0 ? 0 : canvas.width;
  waterState.waveAlpha = 1;
}

// -------------------------------------------------------------
// Engine Update Loop
// -------------------------------------------------------------
function update() {
  // Katana Attack progress
  if (player.isAttacking) {
    player.attackTimer++;
    if (player.attackTimer >= player.attackDuration) {
      player.isAttacking = false;
    }
  }

  // Dash with dynamic sine arc
  if (player.isDashing) {
    player.dashTimer++;
    player.x += player.facing * player.dashSpeed;
    let progress = player.dashTimer / player.dashDuration;
    player.yOffset = Math.sin(progress * Math.PI) * -14;

    if (player.dashTimer >= player.dashDuration) {
      player.isDashing = false;
      player.yOffset = 0;
    }
  }

  // Ninja Jump physics & heroic recovery
  if (!player.grounded) {
    player.y += player.vy;
    player.vy += 0.7; // Gravity

    if (player.jumpState === 'spinning') {
      player.spinAngle += player.facing * 0.38;
    }

    if (player.y >= FLOOR_Y) {
      player.y = FLOOR_Y;
      player.vy = 0;
      player.grounded = true;
      player.jumpState = 'heroLanding';
      player.landingTimer = 12; // 12-frame low recovery stance
    }
  } else if (player.jumpState === 'heroLanding') {
    player.landingTimer--;
    if (player.landingTimer <= 0) {
      player.jumpState = 'ground';
    }
  }

  // Boundary clamp
  player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

  // Enemy physics & reset
  enemies.forEach(e => {
    e.x += e.vx;
    e.vx *= 0.85; // Drag

    if (e.hp <= 0) {
      player.score += 100;
      e.hp = e.maxHp;
      e.x = canvas.width + 40;
    }
    // Patrol slowly toward player
    if (Math.abs(e.vx) < 0.2) {
      e.x += (player.x > e.x ? 0.6 : -0.6);
    }
  });

  // Luetta Updates
  if (luetta.active) {
    if (luetta.mode === 'sky') {
      if (luetta.y < 80) luetta.y += 4;
      luetta.timer--;
      // Orbital shockwave wipes enemy health
      enemies.forEach(e => { e.hp -= 0.8; e.x += (Math.random() - 0.5) * 4; });
      if (luetta.timer <= 0) luetta.active = false;
    } else if (luetta.mode === 'ground') {
      luetta.x += luetta.speed;
      enemies.forEach(e => {
        if (Math.abs(e.x - luetta.x) < 35) {
          e.hp -= 40;
          e.vx = (luetta.speed > 0 ? 1 : -1) * 14;
        }
      });
      if (luetta.x > canvas.width + 80 || luetta.x < -80) {
        luetta.active = false;
      }
    }
  }

  // Aura Weaver Updates
  if (waterState.rainActive) {
    waterState.raindrops.forEach(r => {
      r.y += r.speed;
      r.x -= 1.5;
      if (r.y > canvas.height) { r.y = -10; r.x = Math.random() * canvas.width; }
    });
    waterState.rainTimer--;
    if (waterState.rainTimer <= 0) waterState.rainActive = false;
  }

  if (waterState.waveActive) {
    waterState.waveX += (player.facing > 0 ? 9 : -9);
    enemies.forEach(e => {
      if (Math.abs(e.x - waterState.waveX) < 40) {
        e.hp -= 3;
        e.vx = (player.facing > 0 ? 1 : -1) * 8;
        e.y = FLOOR_Y - Math.sin(Date.now() * 0.02) * 15;
      }
    });
    if (waterState.waveX > canvas.width + 120 || waterState.waveX < -120) {
      waterState.waveActive = false;
    }
  }

  document.getElementById("hud-score").innerText = player.score;
}

// -------------------------------------------------------------
// Render Loop
// -------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Distant Detroit Rooftops Skyline
  ctx.fillStyle = "#070b14";
  ctx.fillRect(40, 110, 45, 130);
  ctx.fillRect(120, 80, 60, 160);
  ctx.fillRect(220, 130, 50, 110);
  ctx.fillRect(320, 95, 70, 145);

  // Rooftop Platform
  ctx.fillStyle = "#162032";
  ctx.fillRect(0, FLOOR_Y, canvas.width, 40);
  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(0, FLOOR_Y, canvas.width, 2);

  // Rain Effect
  if (waterState.rainActive) {
    ctx.strokeStyle = "rgba(125, 211, 252, 0.55)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    waterState.raindrops.forEach(r => {
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - 3, r.y + r.len);
    });
    ctx.stroke();
  }

  // Draw Enemies
  enemies.forEach(e => {
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(e.x - 8, e.y - 28, 16, 28);
    // HP bar
    ctx.fillStyle = "#374151";
    ctx.fillRect(e.x - 12, e.y - 36, 24, 4);
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(e.x - 12, e.y - 36, (e.hp / e.maxHp) * 24, 4);
  });

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y + player.yOffset);
  ctx.scale(player.facing, 1);

  if (player.jumpState === 'spinning') {
    // Aerial Spin Pose
    ctx.rotate(player.spinAngle);
    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(-8, -8, 16, 16);
    // Radial Slash Ring
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0, 229, 255, 0.7)";
    ctx.lineWidth = 3;
    ctx.stroke();

  } else if (player.jumpState === 'heroLanding') {
    // Low Heroic 3-Point Recovery Stance
    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(-12, -14, 24, 14);
    // Grounded Blade
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.lineTo(-24, 0);
    ctx.stroke();

  } else {
    // Standard Combat Stance
    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(-8, -30, 16, 30);

    // Slash Rendering (Up vs Down alternation)
    if (player.isAttacking) {
      let progress = player.attackTimer / player.attackDuration;
      let startAngle = player.comboStep === 0 ? -Math.PI * 0.45 : Math.PI * 0.35;
      let endAngle   = player.comboStep === 0 ?  Math.PI * 0.35 : -Math.PI * 0.50;
      let currentAngle = startAngle + (endAngle - startAngle) * progress;

      ctx.beginPath();
      ctx.arc(6, -14, 32, startAngle, currentAngle, player.comboStep === 1);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.lineWidth = 3.5;
      ctx.stroke();
    }
  }
  ctx.restore();

  // Aura Weaver Tsunami Surge Rendering
  if (waterState.waveActive) {
    let wx = waterState.waveX;
    ctx.save();
    let grad = ctx.createLinearGradient(wx - 40, FLOOR_Y - 80, wx + 40, FLOOR_Y);
    grad.addColorStop(0, "rgba(56, 189, 248, 0.85)");
    grad.addColorStop(0.5, "rgba(14, 165, 233, 0.65)");
    grad.addColorStop(1, "rgba(2, 132, 199, 0.2)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(wx - 50, FLOOR_Y);
    // Multi-crest wave curve
    ctx.quadraticCurveTo(wx - 25, FLOOR_Y - 90, wx, FLOOR_Y - 70);
    ctx.quadraticCurveTo(wx + 25, FLOOR_Y - 95, wx + 50, FLOOR_Y);
    ctx.fill();

    // Crest Foam
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }

  // Mother Luetta Summon Rendering
  if (luetta.active) {
    if (luetta.mode === 'sky') {
      // Holy Light Beam from Heavens
      let grad = ctx.createLinearGradient(luetta.x, 0, luetta.x, FLOOR_Y);
      grad.addColorStop(0, "rgba(251, 191, 36, 0.65)");
      grad.addColorStop(1, "rgba(251, 191, 36, 0.05)");
      ctx.fillStyle = grad;
      ctx.fillRect(luetta.x - 30, 0, 60, FLOOR_Y);

      // Descending Silhouette & Halo
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(luetta.x, luetta.y, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(luetta.x, luetta.y - 18, 12, 4, 0, 0, Math.PI * 2);
      ctx.stroke();

    } else if (luetta.mode === 'ground') {
      // Golden Streak / Cleaving Rush
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(luetta.x - 12, luetta.y - 20, 24, 28);
      ctx.strokeStyle = "rgba(251, 191, 36, 0.75)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(luetta.x - (luetta.speed * 3), luetta.y);
      ctx.lineTo(luetta.x, luetta.y);
      ctx.stroke();
    }
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
