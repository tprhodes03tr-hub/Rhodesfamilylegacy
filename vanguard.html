<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050811;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    #hud {
      width: 100%;
      max-width: 480px;
      padding: 10px 8px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #7ce8ff;
      background: #03060c;
      border-bottom: 1px solid #1a2a40;
    }
    #game-canvas {
      width: 100%;
      max-width: 480px;
      height: auto;
      background: #020408;
      border-bottom: 2px solid #00e5ff;
      display: block;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 480px;
      padding: 10px;
    }
    button {
      background: #101a29;
      border: 1px solid #223a5e;
      color: #7ce8ff;
      padding: 14px 4px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
    }
    button:active {
      background: #223a5e;
      border-color: #f39c12;
      color: #f39c12;
    }
  </style>
</head>
<body>

  <div id="hud">
    <span id="hud-zone">Zone 1: RenCen Rooftop</span>
    <span id="hud-hero">Hero: Marcus (120/120)</span>
    <span id="hud-score">Score: 0</span>
  </div>

  <canvas id="game-canvas" width="480" height="300"></canvas>

  <div class="controls-grid">
    <button id="btn-left">◀ LEFT</button>
    <button id="btn-strike">STRIKE 1</button>
    <button id="btn-right">RIGHT ▶</button>
    <button id="btn-jump">NINJA JUMP</button>
    <button id="btn-sig">SIGNATURE</button>
    <button id="btn-overdrive">OVERDRIVE</button>
    <button id="btn-tag" style="grid-column: span 3;">TAG / SWAP DUO</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const heroes = {
      marcus: { name: 'Marcus', color: '#2b7fff', maxHp: 120, ability: 'Seismic Beat' },
      mayleen: { name: 'Mayleen', color: '#2ecc71', maxHp: 100, ability: 'Verdant Root' }
    };
    let activeKey = 'marcus';

    const player = {
      x: 60,
      y: 190,
      width: 36,
      height: 80,
      vy: 0,
      facing: 1,
      speed: 16,
      isGrounded: true,
      action: 'idle',
      actionTimer: 0,
      hp: 120,
      score: 0
    };

    // Enemy Horde State
    let enemies = [
      { x: 380, y: 210, width: 30, height: 60, hp: 40, speed: 1.2, color: '#e74c3c' },
      { x: 450, y: 210, width: 30, height: 60, hp: 40, speed: 1.0, color: '#e74c3c' }
    ];

    const GROUND_Y = 190;
    const GRAVITY = 0.85;

    function updateHUD() {
      document.getElementById('hud-hero').textContent = `${heroes[activeKey].name} (${player.hp}/${heroes[activeKey].maxHp})`;
      document.getElementById('hud-score').textContent = `Score: ${player.score}`;
    }

    // Controls
    document.getElementById('btn-left').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      player.facing = -1;
      player.x = Math.max(10, player.x - player.speed);
    });

    document.getElementById('btn-right').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      player.facing = 1;
      player.x = Math.min(canvas.width - player.width - 10, player.x + player.speed);
    });

    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (player.isGrounded) {
        player.vy = -14;
        player.isGrounded = false;
      }
    });

    document.getElementById('btn-strike').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      player.action = 'strike';
      player.actionTimer = 12;
      triggerAttack(40, 20);
    });

    document.getElementById('btn-sig').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      player.action = 'signature';
      player.actionTimer = 20;
      triggerAttack(80, 40);
    });

    document.getElementById('btn-overdrive').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      player.action = 'overdrive';
      player.actionTimer = 30;
      triggerAttack(160, 80);
    });

    document.getElementById('btn-tag').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activeKey = (activeKey === 'marcus') ? 'mayleen' : 'marcus';
      player.hp = heroes[activeKey].maxHp;
      player.action = 'tag';
      player.actionTimer = 15;
      updateHUD();
    });

    function triggerAttack(range, damage) {
      enemies.forEach(en => {
        const inFront = (player.facing === 1) ? (en.x >= player.x && en.x <= player.x + player.width + range)
                                              : (en.x <= player.x && en.x >= player.x - range);
        if (inFront) {
          en.hp -= damage;
          en.x += player.facing * 25; // Knockback
          player.score += damage * 10;
        }
      });
      enemies = enemies.filter(en => en.hp > 0);
      updateHUD();
    }

    function loop() {
      // Physics
      player.y += player.vy;
      if (!player.isGrounded) {
        player.vy += GRAVITY;
        if (player.y >= GROUND_Y) {
          player.y = GROUND_Y;
          player.vy = 0;
          player.isGrounded = true;
        }
      }

      if (player.actionTimer > 0) {
        player.actionTimer--;
        if (player.actionTimer <= 0) player.action = 'idle';
      }

      // Enemy AI & Respawn Loop
      if (enemies.length === 0) {
        enemies.push({ x: 480, y: 210, width: 30, height: 60, hp: 50, speed: 1.5, color: '#e74c3c' });
        enemies.push({ x: 540, y: 210, width: 30, height: 60, hp: 50, speed: 1.2, color: '#9b59b6' });
      }

      enemies.forEach(en => {
        if (en.x > player.x + 30) en.x -= en.speed;
        else if (en.x < player.x - 30) en.x += en.speed;

        // Player Contact Damage
        if (Math.abs(en.x - player.x) < 25 && Math.abs(player.y - en.y) < 30) {
          player.hp = Math.max(0, player.hp - 0.2);
          updateHUD();
        }
      });

      // Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- DETROIT REN-CEN SKYLINE BACKDROP ---
      // Midnight Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 270);
      skyGrad.addColorStop(0, '#030814');
      skyGrad.addColorStop(1, '#0c1b33');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, 270);

      // Distant Towers
      ctx.fillStyle = '#08111e';
      ctx.fillRect(30, 100, 45, 170);
      ctx.fillRect(110, 80, 50, 190);
      ctx.fillRect(360, 90, 55, 180);
      ctx.fillRect(430, 110, 45, 160);

      // RenCen Core Towers
      ctx.fillStyle = '#0f1d33';
      ctx.fillRect(175, 50, 40, 220); // West Tower
      ctx.fillRect(265, 50, 40, 220); // East Tower
      ctx.fillStyle = '#162947';
      ctx.fillRect(215, 20, 50, 250); // Tall Center Cylinder

      // City Window Lights
      ctx.fillStyle = 'rgba(255, 215, 0, 0.65)';
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(225, 40 + (i * 32), 12, 6);
        ctx.fillRect(243, 40 + (i * 32), 12, 6);
      }

      // Rooftop Platform & Neon Edge
      ctx.fillStyle = '#0b1420';
      ctx.fillRect(0, 270, canvas.width, 30);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 270);
      ctx.lineTo(canvas.width, 270);
      ctx.stroke();

      // --- RENDER ENEMIES ---
      enemies.forEach(en => {
        ctx.fillStyle = en.color;
        ctx.fillRect(en.x, en.y, en.width, en.height);

        // Enemy Health Bar
        ctx.fillStyle = '#222';
        ctx.fillRect(en.x, en.y - 10, en.width, 4);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(en.x, en.y - 10, (en.hp / 50) * en.width, 4);
      });

      // --- RENDER HERO ---
      ctx.save();
      ctx.translate(player.x + player.width / 2, player.y);
      if (player.facing === -1) ctx.scale(-1, 1);

      // Hero Body
      ctx.fillStyle = heroes[activeKey].color;
      ctx.fillRect(-15, 10, 30, 45);

      // Head
      ctx.fillStyle = '#8d5524';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      // Hip Gear / Djembe Drums
      ctx.fillStyle = (activeKey === 'marcus') ? '#b8621b' : '#1e824c';
      ctx.beginPath();
      ctx.moveTo(-18, 30);
      ctx.lineTo(-28, 50);
      ctx.lineTo(-15, 50);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(10, 30);
      ctx.lineTo(2, 50);
      ctx.lineTo(15, 50);
      ctx.fill();

      // Legs
      ctx.fillStyle = '#0a1526';
      ctx.fillRect(-12, 55, 10, 25);
      ctx.fillRect(2, 55, 10, 25);

      // Combat FX
      if (player.action === 'strike') {
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(28, 30, 26, -0.6, 0.6);
        ctx.stroke();
      } else if (player.action === 'signature') {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(35, 40, Math.max(5, 40 - player.actionTimer * 1.5), 0, Math.PI * 2);
        ctx.stroke();
      } else if (player.action === 'overdrive') {
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 35, Math.max(10, 80 - player.actionTimer * 2), 0, Math.PI * 2);
        ctx.stroke();
      } else if (player.action === 'tag') {
        ctx.fillStyle = 'rgba(46, 204, 113, 0.4)';
        ctx.fillRect(-35, -25, 70, 115);
      }

      ctx.restore();

      requestAnimationFrame(loop);
    }

    updateHUD();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
