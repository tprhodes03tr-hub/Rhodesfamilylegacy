<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #02050b;
      color: #e2f1ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #hud {
      width: 100%;
      max-width: 480px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      background: #030812;
      border-bottom: 1px solid #132742;
    }
    .hud-blue { color: #00d2ff; }
    .hud-gold { color: #f5b041; }
    .hud-hp { color: #5dade2; }

    #canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    .ui-panel {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      background: #050c18;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.8fr 1.2fr;
      gap: 4px;
    }

    button {
      background: #0d1e36;
      border: 1px solid #1a3c68;
      color: #b7d6f5;
      padding: 7px 3px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.15;
    }
    button span {
      font-size: 8px;
      font-weight: 400;
      color: #799fc4;
      margin-top: 2px;
    }
    button.active-hero {
      background: #3a2205;
      border-color: #d35400;
      color: #f39c12;
    }
    button.active-hero span { color: #e67e22; }

    #btn-luetta {
      background: #2a1b02;
      border: 1px solid #d4ac0d;
      color: #f1c40f;
    }
    #btn-strike {
      background: #1f2712;
      border: 1px solid #7d8c19;
      color: #d4e157;
    }
    #btn-overdrive {
      background: #2b0b18;
      border: 1px solid #922b21;
      color: #ec7063;
    }
    button:active {
      filter: brightness(1.4);
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div id="hud-hero" class="hud-blue">HERO: Marcus & Mayleen</div>
    <div id="hud-zone" class="hud-gold">ZONE: 1. RenCen Rooftop</div>
    <div id="hud-stats" class="hud-hp">HP: 120/120 | SCORE: 6000</div>
  </div>

  <div id="canvas-wrap">
    <canvas id="stage" width="480" height="240"></canvas>
  </div>

  <div class="ui-panel">
    <!-- Hero Selection Matrix -->
    <div class="grid-3">
      <button id="hero-marcus" class="active-hero">Marcus & Mayleen<span>Duo • Earth & Bell</span></button>
      <button id="hero-kensai">Shadow Kensai<span>Dual Katana Master</span></button>
      <button id="hero-aura">Aura Weaver<span>Hydro Net & Tsunami</span></button>
    </div>
    <div class="grid-3">
      <button id="hero-sundiata">Sundiata Prime<span>Cosmic Heavy Bruiser</span></button>
      <button id="hero-delta">Delta Vanguard<span>Twin Dagger Assassin</span></button>
      <button id="hero-prism">Prism Void<span>Graviton Void Shift</span></button>
    </div>

    <!-- Tag & Mother Luetta Row -->
    <div class="grid-2">
      <button id="btn-tag">TAG / SWAP DUO LEAD<span>Partner: Mayleen (Active AI Flank)</span></button>
      <button id="btn-luetta">MOTHER LUETTA<span>Sky / Ground Aid</span></button>
    </div>

    <!-- Core Controls -->
    <div class="grid-3">
      <button id="btn-left">◀ LEFT</button>
      <button id="btn-strike">STRIKE 1<span id="sub-strike">Seismic Punch</span></button>
      <button id="btn-right">RIGHT ▶</button>
    </div>
    <div class="grid-3">
      <button id="btn-jump">NINJA JUMP<span>Aerial Flying Kick</span></button>
      <button id="btn-sig">SIGNATURE SKILL<span id="sub-sig">Golden Roots</span></button>
      <button id="btn-overdrive">OVERDRIVE<span id="sub-od">Rumble Shatter Duo</span></button>
    </div>
  </div>

  <script>
    const cvs = document.getElementById('stage');
    const ctx = cvs.getContext('2d');

    // Roster configuration
    const ROSTER = {
      marcus: { name: 'Marcus & Mayleen', hp: 120, strike: 'Seismic Punch', sig: 'Golden Roots', od: 'Rumble Shatter Duo', color: '#00d2ff' },
      kensai: { name: 'Shadow Kensai', hp: 110, strike: 'Dual Katana Slash', sig: 'Blade Flurry', od: 'Shadow Vortex', color: '#a569bd' },
      aura: { name: 'Aura Weaver', hp: 85, strike: 'Hydro Needle', sig: 'Tidal Weave Net', od: 'Tsunami Surge', color: '#3498db' },
      sundiata: { name: 'Sundiata Prime', hp: 140, strike: 'Solar Hammer', sig: 'Cosmic Slam', od: 'Supernova Burst', color: '#f39c12' },
      delta: { name: 'Delta Vanguard', hp: 95, strike: 'Twin Dagger Stabs', sig: 'Shadow Dash', od: 'Assassination Dance', color: '#1abc9c' },
      prism: { name: 'Prism Void', hp: 100, strike: 'Void Pulse', sig: 'Graviton Shift', od: 'Singularity Collapse', color: '#e74c3c' }
    };

    let activeHeroKey = 'marcus';
    let zone = 1;
    let score = 6000;
    let hp = 120;

    // Player state
    const p = {
      x: 60,
      y: 155,
      w: 24,
      h: 55,
      vx: 0,
      vy: 0,
      dir: 1,
      speed: 15,
      grounded: true,
      action: 'idle',
      timer: 0
    };

    // Enemies (Stick bots & Boss drone)
    let enemies = [
      { x: 320, y: 165, w: 18, h: 45, color: '#e74c3c', hp: 40, maxHp: 40, speed: 1.2 },
      { x: 380, y: 165, w: 18, h: 45, color: '#e67e22', hp: 35, maxHp: 35, speed: 1.5 },
      { x: 430, y: 165, w: 18, h: 45, color: '#e74c3c', hp: 40, maxHp: 40, speed: 1.0 }
    ];

    // Mother Luetta state
    const luetta = {
      active: false,
      x: -60,
      y: -50,
      targetY: 155,
      phase: 'none', // 'descend', 'sweep'
      timer: 0
    };

    // D-Pad Touch Listeners
    document.getElementById('btn-left').onpointerdown = (e) => { e.preventDefault(); p.dir = -1; p.x = Math.max(10, p.x - p.speed); };
    document.getElementById('btn-right').onpointerdown = (e) => { e.preventDefault(); p.dir = 1; p.x = Math.min(cvs.width - p.w - 10, p.x + p.speed); };
    document.getElementById('btn-jump').onpointerdown = (e) => {
      e.preventDefault();
      if (p.grounded) { p.vy = -12; p.grounded = false; p.action = 'jump'; }
    };
    document.getElementById('btn-strike').onpointerdown = (e) => { e.preventDefault(); triggerCombat('strike', 15, 30, 45); };
    document.getElementById('btn-sig').onpointerdown = (e) => { e.preventDefault(); triggerCombat('sig', 25, 60, 90); };
    document.getElementById('btn-overdrive').onpointerdown = (e) => { e.preventDefault(); triggerCombat('overdrive', 40, 120, 200); };

    // Mother Luetta Sky/Ground Aid
    document.getElementById('btn-luetta').onpointerdown = (e) => {
      e.preventDefault();
      if (!luetta.active) {
        luetta.active = true;
        luetta.phase = 'descend';
        luetta.x = p.x + 30;
        luetta.y = -40;
        luetta.timer = 60;
        hp = Math.min(ROSTER[activeHeroKey].hp, hp + 35); // Mother Luetta healing
        updateUI();
      }
    };

    // Swap / Tag
    document.getElementById('btn-tag').onpointerdown = (e) => {
      e.preventDefault();
      p.action = 'tag';
      p.timer = 15;
    };

    // Hero Selection setup
    ['marcus', 'kensai', 'aura', 'sundiata', 'delta', 'prism'].forEach(key => {
      document.getElementById('hero-' + key).onclick = () => {
        document.querySelectorAll('.grid-3 button').forEach(b => b.classList.remove('active-hero'));
        document.getElementById('hero-' + key).classList.add('active-hero');
        activeHeroKey = key;
        hp = ROSTER[key].hp;
        document.getElementById('sub-strike').textContent = ROSTER[key].strike;
        document.getElementById('sub-sig').textContent = ROSTER[key].sig;
        document.getElementById('sub-od').textContent = ROSTER[key].od;
        updateUI();
      };
    });

    function triggerCombat(type, duration, dmg, range) {
      p.action = type;
      p.timer = duration;
      enemies.forEach(en => {
        const inReach = (p.dir === 1) ? (en.x >= p.x && en.x <= p.x + p.w + range)
                                      : (en.x <= p.x && en.x >= p.x - range);
        if (inReach) {
          en.hp -= dmg;
          en.x += p.dir * 20;
          score += dmg * 10;
        }
      });
      enemies = enemies.filter(en => en.hp > 0);
      updateUI();
    }

    function updateUI() {
      document.getElementById('hud-hero').textContent = `HERO: ${ROSTER[activeHeroKey].name}`;
      document.getElementById('hud-stats').textContent = `HP: ${Math.round(hp)}/${ROSTER[activeHeroKey].hp} | SCORE: ${score}`;
    }

    // Engine loop
    function update() {
      // Jump physics
      p.y += p.vy;
      if (!p.grounded) {
        p.vy += 0.8;
        if (p.y >= 155) { p.y = 155; p.vy = 0; p.grounded = true; if (p.action === 'jump') p.action = 'idle'; }
      }

      if (p.timer > 0) {
        p.timer--;
        if (p.timer <= 0) p.action = 'idle';
      }

      // Enemy wave management
      if (enemies.length === 0) {
        score += 500;
        enemies.push({ x: 440, y: 165, w: 18, h: 45, color: '#e74c3c', hp: 45, maxHp: 45, speed: 1.3 });
        enemies.push({ x: 490, y: 165, w: 18, h: 45, color: '#f39c12', hp: 35, maxHp: 35, speed: 1.8 });
        updateUI();
      }

      enemies.forEach(en => {
        if (en.x > p.x + 25) en.x -= en.speed;
        else if (en.x < p.x - 25) en.x += en.speed;
        if (Math.abs(en.x - p.x) < 20 && p.grounded) {
          hp = Math.max(0, hp - 0.15);
          updateUI();
        }
      });

      // Mother Luetta Logic (Descent from sky -> runs across stage)
      if (luetta.active) {
        if (luetta.phase === 'descend') {
          luetta.y += 4;
          if (luetta.y >= luetta.targetY) {
            luetta.y = luetta.targetY;
            luetta.phase = 'sweep';
          }
        } else if (luetta.phase === 'sweep') {
          luetta.x += 8;
          // Cleanse enemies on touch
          enemies.forEach(en => {
            if (Math.abs(en.x - luetta.x) < 30) {
              en.hp -= 2;
              score += 20;
            }
          });
          enemies = enemies.filter(en => en.hp > 0);
          if (luetta.x > cvs.width + 50) {
            luetta.active = false;
            luetta.phase = 'none';
          }
        }
      }

      render();
      requestAnimationFrame(update);
    }

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // --- DETROIT RENCEN BACKDROP ---
      // Sky & Explosion Haze
      const sky = ctx.createLinearGradient(0, 0, 0, 210);
      sky.addColorStop(0, '#040b17');
      sky.addColorStop(0.6, '#132c4d');
      sky.addColorStop(1, '#ff6a00');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, cvs.width, 210);

      // RenCen Glass Towers
      ctx.fillStyle = '#1c3452';
      ctx.fillRect(170, 30, 42, 180);
      ctx.fillRect(268, 30, 42, 180);
      ctx.fillStyle = '#274b75';
      ctx.fillRect(212, 10, 56, 200); // Center tower

      // Glass Highlights & Antenna
      ctx.fillStyle = '#4da1ff';
      ctx.fillRect(238, 0, 4, 15);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fillRect(216, 15, 8, 195);
      ctx.fillRect(174, 35, 6, 175);

      // Flanking Detroit High-rises
      ctx.fillStyle = '#0f1f33';
      ctx.fillRect(10, 60, 65, 150);
      ctx.fillRect(85, 45, 60, 165);
      ctx.fillRect(320, 45, 60, 165);
      ctx.fillRect(390, 70, 80, 140);

      // Rooftop Blast VFX
      ctx.fillStyle = 'rgba(255, 140, 0, 0.4)';
      ctx.beginPath();
      ctx.arc(60, 180, 45, 0, Math.PI * 2);
      ctx.fill();

      // Drone Gunships hovering in sky
      drawDrone(110, 50);
      drawDrone(370, 40);

      // Platform Railing & Neon Deck
      ctx.fillStyle = '#0b1624';
      ctx.fillRect(0, 210, cvs.width, 30);
      ctx.strokeStyle = '#00f7ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 210);
      ctx.lineTo(cvs.width, 210);
      ctx.stroke();

      // Top Combat Health Bar HUD inside Canvas
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(10, 8, 150, 10);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(10, 8, (hp / ROSTER[activeHeroKey].hp) * 150, 10);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(10, 8, 150, 10);

      // --- RENDER ENEMIES ---
      enemies.forEach(en => {
        ctx.fillStyle = en.color;
        // Head
        ctx.beginPath();
        ctx.arc(en.x + en.w / 2, en.y + 6, 6, 0, Math.PI * 2);
        ctx.fill();
        // Body stick
        ctx.fillRect(en.x + en.w / 2 - 1.5, en.y + 12, 3, 20);
        // Arms & Legs
        ctx.fillRect(en.x, en.y + 16, en.w, 2);
        ctx.fillRect(en.x + 2, en.y + 32, 3, 13);
        ctx.fillRect(en.x + en.w - 5, en.y + 32, 3, 13);

        // HP bar above
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(en.x - 2, en.y - 6, (en.hp / en.maxHp) * (en.w + 4), 3);
      });

      // --- RENDER MOTHER LUETTA ---
      if (luetta.active) {
        ctx.save();
        ctx.translate(luetta.x, luetta.y);
        // Golden celestial aura
        ctx.fillStyle = 'rgba(241, 196, 15, 0.35)';
        ctx.beginPath();
        ctx.arc(12, 25, 28, 0, Math.PI * 2);
        ctx.fill();
        // Robe & Figure
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(12, 10);
        ctx.lineTo(0, 50);
        ctx.lineTo(24, 50);
        ctx.fill();
        // Head / Halo
        ctx.fillStyle = '#8d5524';
        ctx.beginPath();
        ctx.arc(12, 8, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(12, 8, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // --- RENDER ACTIVE HERO (Marcus / Mayleen / Roster) ---
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y);
      if (p.dir === -1) ctx.scale(-1, 1);

      // Armor Suit
      ctx.fillStyle = ROSTER[activeHeroKey].color;
      ctx.fillRect(-10, 10, 20, 30);

      // Head
      ctx.fillStyle = '#8d5524';
      ctx.beginPath();
      ctx.arc(0, 3, 8, 0, Math.PI * 2);
      ctx.fill();

      // Marcus Djembe Drums (Mounts on hips)
      if (activeHeroKey === 'marcus') {
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.moveTo(-12, 22);
        ctx.lineTo(-20, 38);
        ctx.lineTo(-10, 38);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(10, 22);
        ctx.lineTo(2, 38);
        ctx.lineTo(12, 38);
        ctx.fill();
      }

      // Limbs
      ctx.fillStyle = '#0a1626';
      ctx.fillRect(-8, 40, 6, 15);
      ctx.fillRect(2, 40, 6, 15);

      // Combat FX
      if (p.action === 'strike') {
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(20, 20, 18, -0.6, 0.6);
        ctx.stroke();
      } else if (p.action === 'sig') {
        ctx.strokeStyle = '#00f7ff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(25, 25, 25, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.action === 'overdrive') {
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 20, 55, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawDrone(x, y) {
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(x - 12, y - 4, 24, 8);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(x - 3, y - 1, 6, 3);
      ctx.strokeStyle = '#7f8c8d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 8); ctx.lineTo(x + 16, y - 8);
      ctx.stroke();
    }

    updateUI();
    requestAnimationFrame(update);
  </script>
</body>
</html>
