<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard Universe: Unified Combat Portal</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --plat-border: #e5e4e2;
      --plat-glow: rgba(229, 228, 226, 0.5);
      --cosmic-border: #8b5cf6;
      --cosmic-glow: rgba(139, 92, 246, 0.5);
      --syndicate-border: #ef4444;
      --syndicate-glow: rgba(239, 68, 68, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: #0f172a;
      border-bottom: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .portal-title {
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f59e0b;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      max-width: 600px;
    }

    .tab-btn {
      flex: 1;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    .portal-section {
      display: none;
      width: 96%;
      max-width: 1100px;
      margin: 16px auto;
    }

    .portal-section.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3D CARD FLIPPER FOR CODEX */
    .card-flipper-container {
      perspective: 1000px;
      width: 100%;
      min-height: 285px;
    }

    .card-flipper-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card-flipper-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px;
    }

    .card-face-front {
      position: relative;
      z-index: 2;
      transform: rotateY(0deg);
    }

    .card-face-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: radial-gradient(circle at center, #1b1335 0%, #060810 100%);
      border: 2px solid var(--gold-border);
      box-shadow: 0 0 18px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px;
      overflow: hidden;
    }

    .card-emblem-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
    }

    .card-tree-emblem {
      max-width: 82%;
      max-height: 145px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.75));
    }

    .back-brand-title {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #facc15;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
      text-align: center;
    }

    .back-motto {
      font-size: 0.64rem;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }

    .back-footer-marrow {
      font-family: monospace;
      font-size: 0.62rem;
      color: #38bdf8;
      letter-spacing: 1.2px;
      text-align: center;
    }

    .card-foil {
      position: relative;
      background: #111827;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .card-foil::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.18) 50%, transparent 65%);
      pointer-events: none;
    }

    .foil-gold { border: 2px solid var(--gold-border); box-shadow: 0 0 14px var(--gold-glow); }
    .foil-platinum { border: 2px solid var(--plat-border); box-shadow: 0 0 14px var(--plat-glow); }
    .foil-cosmic { border: 2px solid var(--cosmic-border); box-shadow: 0 0 14px var(--cosmic-glow); }
    .foil-syndicate { border: 2px solid var(--syndicate-border); box-shadow: 0 0 12px var(--syndicate-glow); }

    .card-img {
      width: 100%;
      max-width: 130px;
      height: 125px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .card-name { font-weight: 800; font-size: 0.9rem; text-align: center; }
    .card-title { font-size: 0.72rem; color: #94a3b8; text-align: center; margin-bottom: 6px; }

    .stat-row {
      display: flex;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-badge { background: #0b0f19; padding: 2px 5px; border-radius: 4px; border: 1px solid #334155; }

    .hp-bar-container {
      width: 100%;
      background: #334155;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .hp-bar { height: 100%; background: #22c55e; width: 100%; transition: width 0.3s ease; }

    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      width: 100%;
      perspective: 1000px;
    }

    .worth-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 10px;
      margin-top: 6px;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
    }
    .worth-gold { background: #b45309; color: #fef3c7; }
    .worth-plat { background: #475569; color: #f8fafc; }
    .worth-cosmic { background: #581c87; color: #f3e8ff; }

    /* CARD CLASH */
    .clash-board {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .clash-status-box {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      font-size: 0.88rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .round-indicator { color: #f59e0b; margin-left: 8px; font-weight: 800; }

    .battle-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .battle-card.targeted {
      outline: 3px solid #facc15;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.8) !important;
      transform: scale(1.02);
    }

    .card-actions { display: flex; flex-direction: column; gap: 5px; width: 100%; margin-top: 4px; }
    .action-btn { padding: 6px 4px; font-size: 0.70rem; font-weight: 800; border-radius: 4px; cursor: pointer; border: 1px solid #475569; background: #1e293b; color: #f8fafc; text-align: center; }
    .action-btn.primary-atk { background: #15803d; border-color: #22c55e; }
    .action-btn.special-atk { background: #7e22ce; border-color: #a855f7; }

    /* SIDE BRAWLER */
    .brawler-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .hud-top-row { display: flex; justify-content: space-between; align-items: center; }
    .hero-title { font-size: 13px; font-weight: 800; color: #38bdf8; }
    .wave-badge { font-size: 11px; color: #f59e0b; font-weight: 800; background: rgba(245, 158, 11, 0.15); padding: 3px 8px; border-radius: 4px; }

    .bars-container { display: flex; gap: 10px; }
    .bar-group { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .bar-label { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }
    .bar-track { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .bar-fill-hero { height: 100%; background: #10b981; width: 100%; transition: width 0.1s ease; }
    .bar-fill-enemy { height: 100%; background: #ef4444; width: 100%; transition: width 0.1s ease; }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 290px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #gameCanvas { display: block; width: 100%; height: 100%; }

    .combat-log {
      font-family: monospace;
      font-size: 11px;
      background: #090e18;
      border: 1px solid #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      color: #38bdf8;
      min-height: 28px;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 6px; width: 100%; }
    .dpad-cluster, .action-cluster { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px 3px;
    }
    .btn:active { transform: scale(0.96); background: #334155; }
    .btn-action { background: linear-gradient(180deg, #1e293b, #0f172a); border-color: #38bdf8; color: #38bdf8; }
    .btn-orb { background: linear-gradient(180deg, #0369a1, #0c4a6e); border-color: #38bdf8; color: #bae6fd; }
    .btn-tag { background: linear-gradient(180deg, #7c3aed, #5b21b6); border-color: #a78bfa; color: #fff; }
    .btn-ultimate { grid-column: span 3; background: linear-gradient(180deg, #f59e0b, #b45309); border-color: #fbbf24; color: #fff; font-size: 11px; min-height: 38px; }

    .chapter-banner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid var(--gold-border);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      display: none;
      z-index: 50;
    }
    .chapter-banner h3 { color: #facc15; font-size: 1.1rem; margin-bottom: 6px; text-transform: uppercase; }
    .chapter-banner button { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; font-weight: 800; padding: 10px 20px; border-radius: 6px; cursor: pointer; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: #111827;
      border: 2px solid var(--gold-border);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }
    .replay-btn { background: #2563eb; color: #ffffff; padding: 11px; border-radius: 6px; font-weight: 800; cursor: pointer; border: none; }
    .defeat-btn { background: #dc2626; color: #ffffff; padding: 11px; border-radius: 6px; font-weight: 800; cursor: pointer; border: none; }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Vanguard Universe: Unified Combat Portal</div>
    <div class="tab-bar">
      <button class="tab-btn" onclick="window.openTab('codex', this)">🎴 Card Codex</button>
      <button class="tab-btn" onclick="window.openTab('clash', this)">⚔️ Card Clash</button>
      <button class="tab-btn active" onclick="window.openTab('brawler', this)">🕹 Side Brawler</button>
    </div>
  </header>

  <!-- TAB 1: CARD CODEX (3D AR FLIPPER CARDS & DOUBLE HELIX) -->
  <section id="tab-codex" class="portal-section">
    <div class="codex-grid">

      <!-- Mother Luetta -->
      <div class="card-flipper-container" onclick="window.toggleCardFlip(this)">
        <div class="card-flipper-inner">
