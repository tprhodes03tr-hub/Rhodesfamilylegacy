<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard</title>
  <style>
    body {
      margin: 0;
      background: #090e17;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    #hud {
      width: 100%;
      max-width: 480px;
      padding: 10px 0;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      color: #7ce8ff;
      background: #040810;
      border-bottom: 1px solid #1a2a40;
    }
    #game-canvas {
      width: 100%;
      max-width: 480px;
      background: #0d1522;
      border-bottom: 2px solid #1a2a40;
      display: block;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 480px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background: #121d2d;
      border: 1px solid #28446b;
      color: #7ce8ff;
      padding: 12px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      user-select: none;
    }
    button:active {
      background: #28446b;
      border-color: #f39c12;
      color: #f39c12;
    }
  </style>
</head>
<body>

  <div id="hud">Zone 1: RenCen Rooftop | HP: 76/120</div>
  <canvas id="game-canvas" width="480" height="300"></canvas>

  <div class="controls-grid">
    <button id="btn-left">◀ LEFT</button>
    <button id="btn-strike">STRIKE 1</button>
    <button id="btn-right">RIGHT ▶</button>
    <button id="btn-jump">NINJA JUMP</button>
    <button id="btn-sig">SIGNATURE</button>
    <button id="btn-overdrive">OVERDRIVE</button>
    <button id="btn-tag">TAG / SWAP DUO</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // Load Marcus sprite from repository root
    const marcusImg = new Image();
    marcusImg.src = 'marcus.png';

    // Game state
    const hero = {
      x: 100,
      y: 160,
      width: 60,
      height: 110,
      facing: 1, // 1 for right, -1 for left
      speed: 6
    };

    // Touch controls
    document.getElementById('btn-left').addEventListener('pointerdown', () => {
      hero.facing = -1;
      hero.x = Math.max(10, hero.x - hero.speed * 3);
    });

    document.getElementById('btn-right').addEventListener('pointerdown', () => {
      hero.facing = 1;
      hero.x = Math.min(canvas.width - hero.width - 10, hero.x + hero.speed * 3);
    });

    // Keyboard support (Arrow keys)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        hero.facing = -1;
        hero.x = Math.max(10, hero.x - hero.speed * 2);
      } else if (e.key === 'ArrowRight') {
        hero.facing = 1;
        hero.x = Math.min(canvas.width - hero.width - 10, hero.x + hero.speed * 2);
      }
    });

    // Main render loop
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Simple ground line
      ctx.strokeStyle = '#28446b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 270);
      ctx.lineTo(canvas.width, 270);
      ctx.stroke();

      // Render Marcus sprite or fallback box
      if (marcusImg.complete && marcusImg.naturalWidth > 0) {
        ctx.save();
        if (hero.facing === -1) {
          ctx.scale(-1, 1);
          ctx.drawImage(marcusImg, -(hero.x + hero.width), hero.y, hero.width, hero.height);
        } else {
          ctx.drawImage(marcusImg, hero.x, hero.y, hero.width, hero.height);
        }
        ctx.restore();
      } else {
        ctx.fillStyle = '#3498db';
        ctx.fillRect(hero.x, hero.y, hero.width, hero.height);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
