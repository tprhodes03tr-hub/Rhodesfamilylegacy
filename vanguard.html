<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard</title>
  <style>
    /* 1. ALL CSS GOES HERE */
    body {
      margin: 0;
      background: #090e17;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game-canvas {
      width: 100%;
      max-width: 480px;
      border-bottom: 2px solid #1a2a40;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 480px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background: #121d2d;
      border: 1px solid #28446b;
      color: #7ce8ff;
      padding: 12px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    button.active { border-color: #f39c12; color: #f39c12; }
  </style>
</head>
<body>

  <!-- 2. GAME HUD & CANVAS -->
  <div id="hud">Zone 1: RenCen Rooftop | HP: 76/120</div>
  <canvas id="game-canvas" width="480" height="300"></canvas>

  <!-- 3. TOUCH BUTTON INTERFACE -->
  <div class="controls-grid">
    <button id="btn-left">◀ LEFT</button>
    <button id="btn-strike">STRIKE 1</button>
    <button id="btn-right">RIGHT ▶</button>
    <button id="btn-jump">NINJA JUMP</button>
    <button id="btn-sig">SIGNATURE</button>
    <button id="btn-overdrive">OVERDRIVE</button>
    <button id="btn-tag">TAG / SWAP DUO</button>
  </div>

  <!-- 4. ALL GAME LOGIC & SPRITE SYSTEM -->
  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // ASSET DEFINITIONS
    const assets = {
      bg: new Image(),
      marcus: new Image(),
      mayleen: new Image()
    };
    assets.bg.src = 'assets/ren_cen_bg.png';
    assets.marcus.src = 'assets/marcus_sheet.png';

    // HERO & GAME STATE
    const gameState = {
      leadHero: 'marcus',
      heroes: {
        marcus: { x: 80, y: 180, hp: 120, maxHp: 120, facing: 1, action: 'idle' },
        mayleen: { x: 40, y: 180, hp: 95, maxHp: 95, facing: 1, action: 'idle' }
      },
      enemies: []
    };

    // INPUT LISTENERS (TOUCH + KEYS)
    document.getElementById('btn-left').ontouchstart = () => { gameState.heroes.marcus.facing = -1; gameState.heroes.marcus.x -= 10; };
    document.getElementById('btn-right').ontouchstart = () => { gameState.heroes.marcus.facing = 1; gameState.heroes.marcus.x += 10; };

    // CORE GAME LOOP
    function update() {
      // Update enemy positions, hitboxes, and partner AI here
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Background
      if (assets.bg.complete && assets.bg.naturalHeight > 0) {
        ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Draw Hero (Upgraded Sprite or Stickman Fallback)
      const current = gameState.heroes[gameState.leadHero];
      if (assets.marcus.complete && assets.marcus.naturalHeight > 0) {
        // Render upgraded sprite
        ctx.drawImage(assets.marcus, 0, 0, 128, 128, current.x, current.y, 64, 80);
      } else {
        // Fallback: retains working game state if image isn't loaded yet
        ctx.fillStyle = '#3498db';
        ctx.fillRect(current.x, current.y, 20, 50);
      }

      requestAnimationFrame(render);
    }

    // START ENGINE
    requestAnimationFrame(render);
  </script>
</body>
</html>
