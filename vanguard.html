<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard: The Siege of Detroit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      max-width: 520px;
      background: #0b1329;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.82rem;
      margin-bottom: 8px;
    }
    canvas {
      width: 100%;
      height: 280px;
      background: #020617;
      border-radius: 10px;
      border: 1px solid #334155;
      display: block;
    }
    .stage-title {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      color: #f59e0b;
      margin: 10px 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .hero-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.2;
    }
    .hero-btn.active {
      border-color: #38bdf8;
      color: #fff;
      background: #0284c7;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }
    .ctrl-btn {
      background: #334155;
      border: none;
      color: #fff;
      padding: 13px 2px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.74rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.atk { background: #0284c7; }
    .ctrl-btn.burst { background: #dc2626; }
    .ctrl-btn.aid { 
      background: linear-gradient(135deg, #ca8a04, #eab308); 
      color: #0f172a; 
      font-weight: 900;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 771000</span>
      <span id="hero-hp-display" style="color: #4ade80;">HP: 100%</span>
      <span id="aid-cd" style="color: #facc15;">LUETTA: READY</span>
      <span id="wave-display">WAVE [1/4]</span>
    </div>

    <canvas id="gameCanvas" width="500" height="280"></canvas>

    <div class="stage-title" id="stage-name">✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦</div>

    <!-- ROSTER SELECTION -->
    <div class="roster-grid">
      <button class="hero-btn active" onclick="selectHero('Sundiata Prime', 'Solar Resonator', '#f59e0b', 'solar')">
        Sundiata Prime<br><small>Solar Resonator</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Delta Heavy', 'Kinetic Cleave', '#ea580c', 'heavy')">
        Delta Heavy<br><small>Kinetic Cleave</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Twin Resonance', 'Sonic Tag', '#ec4899', 'sonic')">
        Twin Resonance<br><small>Sonic Tag</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Pioneer Volley', 'Arc Ley-Shot', '#10b981', 'arrow')">
        Pioneer Volley<br><small>Arc Ley-Shot</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Living Codex', 'Marrow Shockwave', '#38bdf8', 'lightning')">
        Living Codex<br><small>Marrow Shock</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Void Aegis', 'Null Barrier', '#a855f7', 'shield')">
        Void Aegis<br><small>Null Shield</small>
      </button>
    </div>

    <!-- CONTROLS WITH LUETTA ASSIST -->
    <div class="controls-grid">
      <button class="ctrl-btn" id="btn-left">&#9664; LEFT</button>
      <button class="ctrl-btn" id="btn-right">RIGHT &#9654;</button>
      <button class="ctrl-btn" id="btn-jump">&#9650; JUMP</button>
      <button class="ctrl-btn atk" id="btn-atk">SHOCK</button>
      <button class="ctrl-btn burst" id="btn-burst">BURST</button>
      <button class="ctrl-btn aid" id="btn-aid">LUETTA AID</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // NATIVE SYNTHESIZED AUDIO (NO EXTERNAL FILES REQUIRED)
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'laser') {
        // High-energy electric beam zap
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.16);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === 'hit') {
        // Punch impact thud
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'burst') {
        // Heavy bass explosion
        osc.type = 'square';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.35);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'bell') {
        // Ancestral bell chime for Mother Luetta
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.start(now);
        osc.stop(now + 1.2);
      }
    }

    let currentHero = { name: 'Sundiata Prime', move: 'Solar Resonator', color: '#f59e0b', type: 'solar' };
    let score = 771000;
    let heroHp = 100;
    let invulnerableTimer = 0;
    let currentWave = 1;
    let luettaCooldown = 0;

    let allyAssist = { active: false, x: -60, y: 175, color: '#38bdf8', timer: 0 };

    const stages = [
      { name: "✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦", sky1: "#0f172a", sky2: "#3b0764", ground: "#1e293b", type: "city" },
      { name: "✦ STAGE 2: WOODWARD CYBER BOULEVARD ✦", sky1: "#020617", sky2: "#0369a1", ground: "#0f172a", type: "street" },
      { name: "✦ STAGE 3: THE GREAT RIFT DESERT ✦", sky1: "#451a03", sky2: "#9a3412", ground: "#78350f", type: "rift" },
      { name: "✦ STAGE 4: CELESTIAL ANCESTRAL GATES ✦", sky1: "#020617", sky2: "#581c87", ground: "#312e81", type: "cosmos" }
    ];

    let player = {
      x: 60, y: 175, w: 32, h: 58,
      vx: 0, vy: 0, speed: 5.5,
      grounded: true, facing: 1
    };

    let enemies = [
      { x: 340, y: 175, w: 32, h: 58, hp: 80, maxHp: 80, speed: 1.6, dir: -1 },
      { x: 440, y: 175, w: 32, h: 58, hp: 80, maxHp: 80, speed: 1.2, dir: -1 }
    ];

    let lightningBeams = [];
    let particles = [];
    let shockwaves = [];
    let shake = 0;

    function selectHero(name, move, color, type) {
      currentHero = { name, move, color, type };
      document.querySelectorAll('.hero-btn').forEach(b => {
        b.classList.toggle('active', b.innerText.includes(name));
      });
      triggerLightning(player.x + 16, player.y - 40, player.x + 16, player.y + 50, color, 4);
      playSound('laser');
    }

    // Input handlers
    const keys = { left: false, right: false };
    const leftBtn = document.getElementById('btn-left');
    const rightBtn = document.getElementById('btn-right');

    const setL = (v) => { keys.left = v; if(v) initAudio(); };
    const setR = (v) => { keys.right = v; if(v) initAudio(); };

    leftBtn.addEventListener('mousedown', () => setL(true));
    leftBtn.addEventListener('mouseup', () => setL(false));
    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setL(true); });
    leftBtn.addEventListener('touchend', () => setL(false));

    rightBtn.addEventListener('mousedown', () => setR(true));
    rightBtn.addEventListener('mouseup', () => setR(false));
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setR(true); });
    rightBtn.addEventListener('touchend', () => setR(false));

    document.getElementById('btn-jump').addEventListener('click', () => {
      initAudio();
      if (player.grounded) {
        player.vy = -12.5;
        player.grounded = false;
        createGroundSparks(player.x + 16, player.y + player.h, '#94a3b8', 6);
      }
    });

    // SHOCK ATTACK
    document.getElementById('btn-atk').addEventListener('click', () => {
      initAudio();
      playSound('laser');
      let targetX = player.x + (player.facing * 190);
      let targetY = player.y + 20;

      enemies.forEach(e => {
        if ((player.facing === 1 && e.x > player.x && e.x < player.x + 200) ||
            (player.facing === -1 && e.x < player.x && e.x > player.x - 200)) {
          targetX = e.x + 16;
          targetY = e.y + 24;
          e.hp -= 35;
          score += 2400;
          shake = 6;
          playSound('hit');
          createGroundSparks(targetX, targetY, currentHero.color, 12);
        }
      });

      triggerLightning(player.x + 16, player.y + 24, targetX, targetY, currentHero.color, 5);
      document.getElementById('score-display').innerText = 'SCORE: ' + score;
    });

    // BURST NOVA
    document.getElementById('btn-burst').addEventListener('click', () => {
      initAudio();
      playSound('burst');
      shake = 22;
      shockwaves.push({ x: player.x + 16, y: player.y + 28, r: 10, maxR: 260, color: currentHero.color });

      enemies.forEach(e => {
        e.hp -= 65;
        triggerLightning(player.x + 16, player.y + 10, e.x + 16, e.y + 20, currentHero.color, 6);
        createGroundSparks(e.x + 16, e.y + 20, currentHero.color, 15);
      });
    });

    // MOTHER LUETTA ANCESTRAL AID CALL
    document.getElementById('btn-aid').addEventListener('click', () => {
      initAudio();
      if (luettaCooldown > 0) return;

      playSound('bell');
      luettaCooldown = 320; // Cooldown duration
      heroHp = Math.min(100, heroHp + 45); // Ancestral healing
      let hpElem = document.getElementById('hero-hp-display');
      hpElem.innerText = `HP: ${heroHp}%`;
      hpElem.style.color = '#4ade80';

      // Summon Allied Hero across screen
      allyAssist.active = true;
      allyAssist.x = -40;
      allyAssist.timer = 60;
      allyAssist.color = '#38bdf8'; // Living Codex Cyan
      shake = 16;
    });

    function triggerLightning(x1, y1, x2, y2, color, segments) {
      let points = [{ x: x1, y: y1 }];
      let dx = (x2 - x1) / segments;
      let dy = (y2 - y1) / segments;
      for (let i = 1; i < segments; i++) {
        points.push({
          x: x1 + dx * i + (Math.random() - 0.5) * 26,
          y: y1 + dy * i + (Math.random() - 0.5) * 26
        });
      }
      points.push({ x: x2, y: y2 });
      lightningBeams.push({ points, color, life: 7 });
    }

    function createGroundSparks(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 18, color
        });
      }
    }

    function advanceWave() {
      currentWave = (currentWave % 4) + 1;
      document.getElementById('wave-display').innerText = `WAVE [${currentWave}/4]`;
      document.getElementById('stage-name').innerText = stages[currentWave - 1].name;
      heroHp = Math.min(100, heroHp + 30);
      document.getElementById('hero-hp-display').innerText = `HP: ${heroHp}%`;
      shake = 10;
    }

    function update() {
      if (invulnerableTimer > 0) invulnerableTimer--;

      if (luettaCooldown > 0) {
        luettaCooldown--;
        document.getElementById('aid-cd').innerText = `LUETTA: ${Math.ceil(luettaCooldown / 30)}s`;
        document.getElementById('aid-cd').style.color = '#94a3b8';
      } else {
        document.getElementById('aid-cd').innerText = `LUETTA: READY ✨`;
        document.getElementById('aid-cd').style.color = '#facc15';
      }

      if (keys.left) { player.vx = -player.speed; player.facing = -1; }
      else if (keys.right) { player.vx = player.speed; player.facing = 1; }
      else player.vx *= 0.65;

      player.x += player.vx;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      player.y += player.vy;
      if (player.y < 175) {
        player.vy += 0.85;
      } else {
        player.y = 175;
        player.vy = 0;
        player.grounded = true;
      }

      // Ally Assist Logic (Mother Luetta's Champion)
      if (allyAssist.active) {
        allyAssist.x += 8.5;
        if (allyAssist.x > canvas.width + 50) allyAssist.active = false;

        // Ally shoots lightning across foes
        if (Math.random() < 0.3) {
          playSound('laser');
          enemies.forEach(e => {
            e.hp -= 8;
            triggerLightning(allyAssist.x + 16, 190, e.x + 16, e.y + 20, allyAssist.color, 4);
          });
        }
      }

      // Enemy AI & Direct Melee Damage
      enemies.forEach(e => {
        if (e.hp > 0) {
          e.x += (player.x > e.x ? 1 : -1) * e.speed;

          let dist = Math.hypot((player.x + 16) - (e.x + 16), (player.y + 20) - (e.y + 20));
          if (dist < 32 && invulnerableTimer === 0) {
            heroHp -= 12;
            invulnerableTimer = 35;
            shake = 12;
            playSound('hit');
            player.vx = (player.x > e.x ? 6 : -6);
            createGroundSparks(player.x + 16, player.y + 25, '#ef4444', 10);
            
            let hpElem = document.getElementById('hero-hp-display');
            hpElem.innerText = `HP: ${Math.max(0, heroHp)}%`;
            hpElem.style.color = heroHp > 40 ? '#4ade80' : '#ef4444';

            if (heroHp <= 0) {
              heroHp = 100;
              player.x = 40;
              hpElem.innerText = `HP: 100%`;
              hpElem.style.color = '#4ade80';
            }
          }
        } else {
          e.x = canvas.width + 60;
          e.hp = e.maxHp;
          score += 5000;
          document.getElementById('score-display').innerText = 'SCORE: ' + score;
          advanceWave();
        }
      });

      // Clear completed FX
      for (let i = lightningBeams.length - 1; i >= 0; i--) {
        if (--lightningBeams[i].life <= 0) lightningBeams.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.r += 14;
        if (sw.r >= sw.maxR) shockwaves.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (--p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawDynamicStage() {
      let stg = stages[currentWave - 1];
      let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, stg.sky1);
      sky.addColorStop(0.8, stg.sky2);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (stg.type === "city" || stg.type === "street") {
        const towers = [
          { x: 15, w: 48, h: 140 }, { x: 70, w: 60, h: 190 },
          { x: 145, w: 50, h: 130 }, { x: 210, w: 75, h: 180 },
          { x: 300, w: 55, h: 150 }, { x: 375, w: 60, h: 200 }, { x: 450, w: 45, h: 120 }
        ];
        towers.forEach(t => {
          ctx.fillStyle = '#090d16';
          ctx.fillRect(t.x, canvas.height - 45 - t.h, t.w, t.h);
          ctx.fillStyle = 'rgba(245, 158, 11, 0.45)';
          for (let wy = canvas.height - 40 - t.h + 10; wy < canvas.height - 50; wy += 14) {
            for (let wx = t.x + 8; wx < t.x + t.w - 8; wx += 10) {
              if ((wx + wy) % 4 === 0) ctx.fillRect(wx, wy, 3, 5);
            }
          }
        });
      } else if (stg.type === "rift") {
        ctx.fillStyle = '#271005';
        ctx.beginPath();
        ctx.moveTo(30, 235); ctx.lineTo(70, 70); ctx.lineTo(120, 235);
        ctx.moveTo(340, 235); ctx.lineTo(390, 85); ctx.lineTo(460, 235);
        ctx.fill();
      } else if (stg.type === "cosmos") {
        ctx.fillStyle = '#fff';
        for (let s = 0; s < 30; s++) {
          ctx.fillRect((s * 41) % canvas.width, (s * 29) % 180, 2, 2);
        }
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(250, 90, 65, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = stg.ground;
      ctx.fillRect(0, 233, canvas.width, 47);
      ctx.fillStyle = currentHero.color;
      ctx.fillRect(0, 233, canvas.width, 2.5);
    }

    function drawHumanoidHero(x, y, hero) {
      ctx.save();
      if (invulnerableTimer > 0 && Math.floor(invulnerableTimer / 4) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }

      ctx.shadowColor = hero.color;
      ctx.shadowBlur = 12;

      // Cape / Mantle
      ctx.fillStyle = hero.color;
      ctx.beginPath();
      ctx.moveTo(x + 14, y + 16);
      ctx.lineTo(x + (player.facing === 1 ? -12 : 28), y + 48);
      ctx.lineTo(x + 14, y + 42);
      ctx.closePath();
      ctx.fill();

      // Head
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(x + 14, y + 10, 8, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = hero.color;
      ctx.fillRect(x + (player.facing === 1 ? 16 : 8), y + 7, 5, 3);

      // Torso
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x + 8, y + 18, 14, 18);

      // Resonator Core
      ctx.fillStyle = hero.color;
      ctx.fillRect(x + 12, y + 22, 6, 8);

      // Arms & Gauntlets
      ctx.fillStyle = '#334155';
      ctx.fillRect(x + (player.facing === 1 ? 18 : 4), y + 20, 6, 12);
      ctx.fillStyle = hero.color;
      ctx.fillRect(x + (player.facing === 1 ? 20 : 2), y + 26, 4, 6);

      // Legs
      ctx.fillStyle = '#020617';
      ctx.fillRect(x + 8, y + 36, 5, 20);
      ctx.fillRect(x + 16, y + 36, 5, 20);

      // Boots
      ctx.fillStyle = '#475569';
      ctx.fillRect(x + (player.facing === 1 ? 8 : 6), y + 52, 7, 6);
      ctx.fillRect(x + (player.facing === 1 ? 16 : 14), y + 52, 7, 6);
      ctx.restore();
    }

    function drawHumanoidEnemy(x, y, hp, maxHp) {
      ctx.save();
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 2, y - 12, 34, 4);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - 2, y - 12, (hp / maxHp) * 34, 4);

      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.arc(x + 14, y + 10, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(x + 7, y + 8, 12, 2.5);

      ctx.fillStyle = '#27272a';
      ctx.fillRect(x + 7, y + 18, 16, 18);

      ctx.fillStyle = '#a855f7';
      ctx.fillRect(x + 12, y + 23, 6, 6);

      ctx.fillStyle = '#09090b';
      ctx.fillRect(x + 8, y + 36, 5, 20);
      ctx.fillRect(x + 16, y + 36, 5, 20);
      ctx.restore();
    }

    function render() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85;
        if (shake < 0.5) shake = 0;
      }

      drawDynamicStage();

      enemies.forEach(e => {
        if (e.hp > 0) drawHumanoidEnemy(e.x, e.y, e.hp, e.maxHp);
      });

      drawHumanoidHero(player.x, player.y, currentHero);

      // Draw Summoned Ally Assist
      if (allyAssist.active) {
        drawHumanoidHero(allyAssist.x, allyAssist.y, { color: allyAssist.color });
        ctx.save();
        ctx.fillStyle = '#fde047';
        ctx.font = '800 12px sans-serif';
        ctx.fillText('LUETTA SUMMON!', allyAssist.x - 10, allyAssist.y - 10);
        ctx.restore();
      }

      // Draw Shock Beams
      lightningBeams.forEach(b => {
        ctx.save();
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        b.points.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
        ctx.restore();
      });

      // Draw Bursts
      shockwaves.forEach(sw => {
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = sw.color;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      // Sparks
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
