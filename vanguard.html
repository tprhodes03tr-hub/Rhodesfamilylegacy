<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RenCen Rooftop: Guardian Powers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #040914;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 960px;
      display: flex;
      flex-direction: column;
      background: #060d1d;
      border: 1px solid #1e293b;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      position: relative;
    }
    #hud-top {
      background: #020617;
      border-bottom: 2px solid #0ea5e9;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .hud-hero { color: #38bdf8; text-transform: uppercase; }
    .hud-zone { color: #f59e0b; text-align: center; }
    .hud-stats { color: #e2e8f0; font-family: monospace; font-size: 12px; }
    .bar-container {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    #hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.15s ease;
    }
    #od-bar-wrap {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      font-family: monospace;
      margin-top: 2px;
    }
    #canvas-wrap {
      width: 100%;
      height: 40vh;
      min-height: 260px;
      position: relative;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #controls-console {
      flex: 1;
      background: #070e1e;
      border-top: 2px solid #1e3a8a;
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 5px;
      overflow-y: auto;
    }
    .btn-grid {
      display: grid;
      gap: 5px;
    }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .btn-action {
      background: #0f1e36;
      border: 1px solid #1e3a8a;
      border-radius: 5px;
      color: #cbd5e1;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      transition: all 0.08s ease;
    }
    .btn-action:active, .btn-action.active-press {
      transform: scale(0.96);
      background: #1e3a8a;
      border-color: #38bdf8;
    }
    .btn-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .btn-sub {
      font-size: 8.5px;
      color: #94a3b8;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .btn-hero.selected {
      border-color: #f59e0b !important;
      background: #3b2204 !important;
      color: #fbbf24 !important;
    }
    .btn-strike1 { border-color: #854d0e; background: #261e09; color: #fde047; }
    .btn-strike2 { border-color: #0369a1; background: #082f49; color: #38bdf8; }
    .btn-skill { border-color: #4f46e5; background: #1e1b4b; color: #a5b4fc; }
    .btn-overdrive { border-color: #991b1b; background: #450a0a; color: #fca5a5; }
    .btn-mother { border-color: #d97706; background: #451a03; color: #fef08a; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud-top">
    <div class="hud-row">
      <span class="hud-hero" id="hud-hero-name">HERO: Marcus</span>
      <span class="hud-zone">ZONE: RenCen Rooftop</span>
      <span class="hud-stats">HP: <span id="val-hp">120</span>/120</span>
    </div>
    <div class="bar-container">
      <div id="hp-bar"></div>
    </div>
    <div id="od-bar-wrap">
      <span>SCORE: <span id="val-score">0</span></span>
      <span style="color:#38bdf8;">OVERDRIVE: <span id="val-od">0</span>%</span>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="480" height="260"></canvas>
  </div>

  <div id="controls-console">
    <!-- Hero Selection Grid -->
    <div class="btn-grid grid-3">
      <button class="btn-action btn-hero selected" data-hero="0">
        <span class="btn-title">Marcus</span>
        <span class="btn-sub">Earth & Drums</span>
      </button>
      <button class="btn-action btn-hero" data-hero="1">
        <span class="btn-title">Aura Weaver</span>
        <span class="btn-sub">Hydro Net & Tsunami</span>
      </button>
      <button class="btn-action btn-hero" data-hero="2">
        <span class="btn-title">Shard Weaver</span>
        <span class="btn-sub">Crystal Aegis</span>
      </button>
    </div>

    <div class="btn-grid grid-3">
      <button class="btn-action btn-hero" data-hero="3">
        <span class="btn-title">Sky Ranger</span>
        <span class="btn-sub">Purple Arrow Scatter</span>
      </button>
      <button class="btn-action btn-hero" data-hero="4">
        <span class="btn-title">Sundiata</span>
        <span class="btn-sub">Cosmic Sun Aegis</span>
      </button>
      <button class="btn-action btn-hero" data-hero="5">
        <span class="btn-title">Shadow Kensai</span>
        <span class="btn-sub">Dual Katana Slash</span>
      </button>
    </div>

    <!-- Partner and Mother Luetta Aid -->
    <div class="btn-grid grid-2">
      <button class="btn-action" id="btn-tag">
        <span class="btn-title" style="color:#38bdf8;">🔄 TAG / SWAP DUO</span>
        <span class="btn-sub" id="lbl-partner">Partner: Mayleen (Active AI)</span>
      </button>
      <button class="btn-action btn-mother" id="btn-luetta">
        <span class="btn-title">MOTHER LUETTA</span>
        <span class="btn-sub">Divine Sky Aid</span>
      </button>
    </div>

    <!-- Movement & Attacks -->
    <div class="btn-grid grid-3">
      <button class="btn-action" id="btn-left">
        <span class="btn-title">◀ LEFT</span>
      </button>
      <button class="btn-action btn-strike1" id="btn-strike1">
        <span class="btn-title">STRIKE 1</span>
        <span class="btn-sub" id="lbl-strike1">Golden Power Fist</span>
      </button>
      <button class="btn-action" id="btn-right">
        <span class="btn-title">RIGHT ▶</span>
      </button>
    </div>

    <div class="btn-grid grid-3">
      <button class="btn-action" id="btn-jump">
        <span class="btn-title" style="color:#38bdf8;">NINJA JUMP</span>
        <span class="btn-sub">Aerial Vault</span>
      </button>
      <button class="btn-action btn-strike2" id="btn-strike2">
        <span class="btn-title">STRIKE 2</span>
        <span class="btn-sub" id="lbl-strike2">Floor Lightning</span>
      </button>
      <button class="btn-action btn-skill" id="btn-skill">
        <span class="btn-title">SPECIAL POWER</span>
        <span class="btn-sub" id="lbl-skill">Seismic Drumwave</span>
      </button>
    </div>

    <button class="btn-action btn-overdrive" id="btn-overdrive" style="padding: 7px 0;">
      <span class="btn-title">★ OVERDRIVE BATTLE CLASH ★</span>
      <span class="btn-sub" id="lbl-overdrive">Twin Djembe Seismic Earthquake</span>
    </button>
  </div>
</div>

<script>
// --- AUDIO SYNTHESIZER ---
class SFXSystem {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(type) {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);

    if (type === 'hit') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'drum') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(100, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.28);
      gain.gain.setValueAtTime(0.6, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
      osc.start(t); osc.stop(t + 0.28);
    } else if (type === 'lightning') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.linearRampToValueAtTime(120, t + 0.2);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.start(t); osc.stop(t + 0.2);
    } else if (type === 'wave') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.linearRampToValueAtTime(540, t + 0.25);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);
    } else if (type === 'heal') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(880, t + 0.35);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    }
  }
}
const sfx = new SFXSystem();

// --- GAME DEFINITIONS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const FLOOR_Y = canvas.height - 45; // Exact ground contact

const HEROES = [
  {
    name: "Marcus",
    type: "marcus",
    s1: "Golden Power Fist",
    s2: "Floor Lightning",
    skill: "Seismic Drumwave",
    od: "Twin Djembe Earthquake"
  },
  {
    name: "Aura Weaver",
    type: "water",
    s1: "Hydro Dagger Strike",
    s2: "Tidal Wave Surge",
    skill: "Hydro Net Trap",
    od: "Oceanic Maelstrom"
  },
  {
    name: "Shard Weaver",
    type: "crystal",
    s1: "Shard Punch",
    s2: "Crystal Spike Eruption",
    skill: "Obsidian Barrier",
    od: "Prismatic Nova"
  },
  {
    name: "Sky Ranger",
    type: "archer",
    s1: "Quick Shot",
    s2: "Piercing Arrow",
    skill: "Purple Arrow Scatter",
    od: "Cosmic Sky Rain"
  },
  {
    name: "Sundiata Prime",
    type: "sundiata",
    s1: "Sun Shield Bash",
    s2: "Solar Spear Thrust",
    skill: "Golden Aegis Shield",
    od: "Supernova Smite"
  },
  {
    name: "Shadow Kensai",
    type: "samurai",
    s1: "Katana Slash",
    s2: "Crescent Wave",
    skill: "Shadow Cross-Dash",
    od: "1000 Petal Katana Storm"
  }
];

let heroIdx = 0;
let score = 0;
let odEnergy = 0;
let shake = 0;
let skyAidTimer = 0;

const player = {
  x: 90,
  y: FLOOR_Y,
  vx: 0,
  vy: 0,
  hp: 120,
  maxHp: 120,
  isGrounded: true,
  facing: 1,
  attackTimer: 0,
  activeAttack: null
};

const partner = {
  x: 45,
  y: FLOOR_Y,
  vx: 0,
  facing: 1
};

let enemies = [];
let projectiles = [];
let particles = [];
let crystalShields = [];
let lightningBolts = [];
let hydroNets = [];

// Spawn Enemy
function spawnEnemy() {
  if (enemies.length >= 5) return;
  const isDrone = Math.random() > 0.65;
  enemies.push({
    x: canvas.width + 25,
    y: isDrone ? FLOOR_Y - 70 - Math.random() * 40 : FLOOR_Y,
    vx: -(isDrone ? 1.6 : 1.1),
    width: isDrone ? 32 : 24,
    height: isDrone ? 20 : 80,
    hp: isDrone ? 30 : 65,
    maxHp: isDrone ? 30 : 65,
    type: isDrone ? 'drone' : 'mech',
    trapped: 0
  });
}
setInterval(spawnEnemy, 2300);

// --- HERO SELECTION & UI UPDATE ---
function setHero(index) {
  heroIdx = index;
  const h = HEROES[heroIdx];
  document.getElementById('hud-hero-name').innerText = `HERO: ${h.name}`;
  document.getElementById('lbl-strike1').innerText = h.s1;
  document.getElementById('lbl-strike2').innerText = h.s2;
  document.getElementById('lbl-skill').innerText = h.skill;
  document.getElementById('lbl-overdrive').innerText = h.od;
  sfx.play('lightning');
}

document.querySelectorAll('.btn-hero').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-hero').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    setHero(parseInt(btn.dataset.hero, 10));
  });
});

// --- COMBAT ACTIONS ---
function doStrike1() {
  const h = HEROES[heroIdx];
  player.attackTimer = 16;
  player.activeAttack = 'strike1';
  shake = 5;
  sfx.play('hit');

  const reach = 85;
  enemies.forEach(en => {
    if (Math.abs(en.x - (player.x + player.facing * 35)) < reach && Math.abs(en.y - player.y) < 60) {
      en.hp -= 38;
      en.vx = player.facing * 7;
      createSparks(en.x, en.y - 30, '#fbbf24');
      addScore(120);
    }
  });
}

function doStrike2() {
  const h = HEROES[heroIdx];
  player.attackTimer = 16;
  player.activeAttack = 'strike2';

  if (h.type === 'marcus') {
    // Floor Lightning Bolt
    sfx.play('lightning');
    shake = 7;
    lightningBolts.push({
      startX: player.x,
      targetX: player.x + player.facing * 260,
      y: FLOOR_Y,
      life: 14
    });
    enemies.forEach(en => {
      if ((player.facing === 1 && en.x > player.x && en.x < player.x + 260) ||
          (player.facing === -1 && en.x < player.x && en.x > player.x - 260)) {
        en.hp -= 42;
        en.vx = player.facing * 6;
        createSparks(en.x, en.y - 30, '#38bdf8');
        addScore(150);
      }
    });
  } else if (h.type === 'water') {
    // Giant Tidal Wave
    sfx.play('wave');
    projectiles.push({
      x: player.x + player.facing * 30,
      y: FLOOR_Y - 25,
      vx: player.facing * 6.5,
      vy: 0,
      radius: 28,
      type: 'tidal_wave',
      life: 60,
      damage: 40
    });
  } else {
    // Generic strike projectile/pierce
    sfx.play('hit');
    projectiles.push({
      x: player.x + player.facing * 30,
      y: player.y - 45,
      vx: player.facing * 8,
      vy: 0,
      radius: 8,
      type: 'energy_blade',
      life: 45,
      damage: 35
    });
  }
}

function doSpecial() {
  const h = HEROES[heroIdx];
  player.attackTimer = 22;
  player.activeAttack = 'special';

  if (h.type === 'water') {
    // Hydro Net Trap (Binds and halts enemies)
    sfx.play('wave');
    hydroNets.push({
      x: player.x + player.facing * 120,
      y: FLOOR_Y - 40,
      life: 160
    });
    enemies.forEach(en => {
      if (Math.abs(en.x - (player.x + player.facing * 120)) < 70) {
        en.trapped = 150; // immobilized
        createSparks(en.x, en.y - 30, '#06b6d4');
      }
    });
  } else if (h.type === 'crystal') {
    // Obsidian Crystal Barrier
    sfx.play('hit');
    crystalShields.push({
      x: player.x + player.facing * 60,
      y: FLOOR_Y,
      width: 28,
      height: 95,
      life: 260
    });
    shake = 6;
  } else if (h.type === 'archer') {
    // Purple Arrow Scatter (Aerial multi-shot)
    sfx.play('lightning');
    player.vy = -7;
    player.isGrounded = false;
    for (let a = -0.42; a <= 0.42; a += 0.14) {
      projectiles.push({
        x: player.x + player.facing * 12,
        y: player.y - 50,
        vx: Math.cos(a) * (player.facing * 9),
        vy: Math.sin(a) * 9,
        radius: 4,
        type: 'purple_arrow',
        life: 50,
        damage: 28
      });
    }
  } else {
    // Seismic Drum Quake
    sfx.play('drum');
    shake = 12;
    createShockwave(player.x, FLOOR_Y, '#f59e0b', 180);
    enemies.forEach(en => {
      en.hp -= 40;
      en.vx = (en.x > player.x ? 1 : -1) * 8;
      createSparks(en.x, en.y - 30, '#fef08a');
    });
  }
}

function doOverdrive() {
  if (odEnergy < 100) return;
  odEnergy = 0;
  updateHUD();
  shake = 20;
  sfx.play('drum');
  createShockwave(canvas.width / 2, FLOOR_Y - 40, '#38bdf8', 280);

  enemies.forEach(en => {
    en.hp -= 90;
    en.vx = (en.x > canvas.width / 2 ? 1 : -1) * 12;
    createSparks(en.x, en.y - 30, '#38bdf8');
  });
  addScore(1000);
}

function doMotherLuetta() {
  skyAidTimer = 75;
  player.hp = Math.min(player.maxHp, player.hp + 50);
  updateHUD();
  sfx.play('heal');
  shake = 9;
  enemies.forEach(en => {
    en.hp -= 45;
    createSparks(en.x, en.y - 30, '#fef08a');
  });
}

function tagPartner() {
  const tempX = player.x;
  player.x = partner.x;
  partner.x = tempX;
  createShockwave(player.x, FLOOR_Y - 40, '#38bdf8', 60);
  createShockwave(partner.x, FLOOR_Y - 40, '#22c55e', 60);
  sfx.play('lightning');
}

function addScore(pts) {
  score += pts;
  odEnergy = Math.min(100, odEnergy + Math.floor(pts / 12));
  updateHUD();
}

function updateHUD() {
  document.getElementById('val-hp').innerText = Math.max(0, Math.floor(player.hp));
  document.getElementById('hp-bar').style.width = `${(Math.max(0, player.hp) / player.maxHp) * 100}%`;
  document.getElementById('val-score').innerText = score;
  document.getElementById('val-od').innerText = odEnergy;
}

// Touch/Key Handlers
let moveLeft = false;
let moveRight = false;
function bindTouch(id, onStart, onEnd) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => { e.preventDefault(); el.classList.add('active-press'); if (onStart) onStart(); };
  const release = (e) => { e.preventDefault(); el.classList.remove('active-press'); if (onEnd) onEnd(); };
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
}

bindTouch('btn-left', () => { moveLeft = true; }, () => { moveLeft = false; });
bindTouch('btn-right', () => { moveRight = true; }, () => { moveRight = false; });
bindTouch('btn-jump', () => {
  if (player.isGrounded) { player.vy = -12; player.isGrounded = false; }
});
bindTouch('btn-strike1', doStrike1);
bindTouch('btn-strike2', doStrike2);
bindTouch('btn-skill', doSpecial);
bindTouch('btn-overdrive', doOverdrive);
bindTouch('btn-luetta', doMotherLuetta);
bindTouch('btn-tag', tagPartner);

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyJ') doStrike1();
  if (e.code === 'KeyK') doStrike2();
  if (e.code === 'KeyL') doSpecial();
  if (e.code === 'KeyU') doOverdrive();
  if (e.code === 'KeyI') doMotherLuetta();
  if (e.code === 'Space' && player.isGrounded) { player.vy = -12; player.isGrounded = false; }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Particles & Shockwaves
function createSparks(x, y, color) {
  for (let i = 0; i < 9; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 20,
      color,
      size: 3
    });
  }
}

function createShockwave(x, y, color, maxRadius) {
  particles.push({ x, y, radius: 5, maxRadius, color, type: 'wave', life: 25 });
}

// --- CHARACTER SILHOUETTE RENDERING ---
function drawCharacter(x, y, facing, heroType, attackTimer, activeAttack) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  if (heroType === 'marcus') {
    // Cyan armored cyber suit + djembe drums
    ctx.fillStyle = '#1e293b'; // legs
    ctx.fillRect(-10, -32, 8, 32); ctx.fillRect(2, -32, 8, 32);
    ctx.fillStyle = '#0ea5e9'; // armor greaves
    ctx.fillRect(-11, -28, 9, 18); ctx.fillRect(1, -28, 9, 18);

    ctx.fillStyle = '#0f172a'; // torso
    ctx.fillRect(-12, -72, 24, 40);
    ctx.fillStyle = '#0ea5e9'; // chestplate
    ctx.fillRect(-10, -68, 20, 20);

    // Head + Beard fade
    ctx.fillStyle = '#7c2d12';
    ctx.beginPath(); ctx.arc(0, -82, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#09090b';
    ctx.beginPath(); ctx.arc(0, -86, 10, Math.PI, 0); ctx.fill();
    ctx.fillRect(-3, -80, 5, 4);

    // Dual Djembe Drums
    ctx.fillStyle = '#78350f'; ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1.5;
    [-18, 10].forEach(ox => {
      ctx.beginPath();
      ctx.moveTo(ox, -64); ctx.lineTo(ox + 12, -64);
      ctx.lineTo(ox + 9, -42); ctx.lineTo(ox + 3, -42);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });

  } else if (heroType === 'water') {
    // Aura Weaver: Long flowing dark hair, blue tunic, swirling water cloak
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(-8, -32, 7, 32); ctx.fillRect(2, -32, 7, 32);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(-10, -68, 20, 36);

    // Head & flowing hair
    ctx.fillStyle = '#9a3412';
    ctx.beginPath(); ctx.arc(0, -78, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-4, -80, 12, 0, Math.PI * 2); ctx.fill();

    // Swirling water aura rings
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -45, 24, 0, Math.PI * 2);
    ctx.stroke();

  } else if (heroType === 'crystal') {
    // Shard Weaver: Crimson & gold vestments + floating obsidian crystals
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(-8, -32, 7, 32); ctx.fillRect(2, -32, 7, 32);
    ctx.fillStyle = '#b91c1c';
    ctx.fillRect(-10, -68, 20, 36);
    ctx.fillStyle = '#fbbf24'; // gold trim
    ctx.fillRect(-10, -50, 20, 5);

    // Head
    ctx.fillStyle = '#9a3412';
    ctx.beginPath(); ctx.arc(0, -78, 9, 0, Math.PI * 2); ctx.fill();

    // Floating obsidian shards orbiting
    ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 1;
    [[-20, -50], [18, -60], [-16, -20]].forEach(([ox, oy]) => {
      ctx.beginPath();
      ctx.moveTo(ox, oy - 8); ctx.lineTo(ox + 5, oy);
      ctx.lineTo(ox, oy + 8); ctx.lineTo(ox - 5, oy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });

  } else if (heroType === 'archer') {
    // Sky Ranger: Purple speedsuit + bow
    ctx.fillStyle = '#4c1d95';
    ctx.fillRect(-8, -32, 7, 32); ctx.fillRect(2, -32, 7, 32);
    ctx.fillStyle = '#7c3aed';
    ctx.fillRect(-9, -68, 18, 36);

    ctx.fillStyle = '#7c2d12';
    ctx.beginPath(); ctx.arc(0, -78, 9, 0, Math.PI * 2); ctx.fill();

    // Longbow held in hand
    ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(14, -50, 22, -Math.PI / 2.5, Math.PI / 2.5);
    ctx.stroke();

  } else if (heroType === 'sundiata') {
    // Sundiata: Golden sun armor + Sun Aegis Shield
    ctx.fillStyle = '#78350f';
    ctx.fillRect(-10, -32, 9, 32); ctx.fillRect(3, -32, 9, 32);
    ctx.fillStyle = '#d97706';
    ctx.fillRect(-12, -72, 24, 40);

    ctx.fillStyle = '#451a03';
    ctx.beginPath(); ctx.arc(0, -82, 10, 0, Math.PI * 2); ctx.fill();

    // Massive Golden Shield
    ctx.fillStyle = '#f59e0b'; ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(14, -50, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  } else if (heroType === 'samurai') {
    // Shadow Kensai: Kabuto helmet + Katana
    ctx.fillStyle = '#334155';
    ctx.fillRect(-9, -32, 8, 32); ctx.fillRect(2, -32, 8, 32);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-12, -70, 24, 38);
    ctx.fillStyle = '#dc2626'; // red sash
    ctx.fillRect(-12, -50, 24, 5);

    // Kabuto helmet
    ctx.fillStyle = '#64748b';
    ctx.beginPath(); ctx.arc(0, -80, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, -92); ctx.lineTo(0, -84); ctx.lineTo(6, -92); ctx.stroke();

    // Katana
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, -45); ctx.lineTo(28, -65); ctx.stroke();
  }

  // Golden Fist Visual overlay on Strike 1
  if (attackTimer > 0 && activeAttack === 'strike1') {
    ctx.save();
    ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(28, -50, 20, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

// Draw Mayleen (Duo Partner)
function drawPartner(x, y, facing) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  ctx.fillStyle = '#15803d';
  ctx.fillRect(-8, -30, 6, 30); ctx.fillRect(2, -30, 6, 30);
  ctx.fillStyle = '#166534';
  ctx.fillRect(-10, -68, 20, 38);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(-8, -64, 16, 18);

  // Head + Afro Puff
  ctx.fillStyle = '#7c2d12';
  ctx.beginPath(); ctx.arc(0, -78, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#09090b';
  ctx.beginPath(); ctx.arc(0, -86, 12, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// --- UPDATE LOOP ---
function update() {
  if (keys['ArrowLeft'] || keys['KeyA'] || moveLeft) {
    player.vx = -3.8; player.facing = -1;
  } else if (keys['ArrowRight'] || keys['KeyD'] || moveRight) {
    player.vx = 3.8; player.facing = 1;
  } else {
    player.vx *= 0.7;
  }

  player.x += player.vx;
  player.y += player.vy;

  if (!player.isGrounded) {
    player.vy += 0.65;
    if (player.y >= FLOOR_Y) {
      player.y = FLOOR_Y; player.vy = 0; player.isGrounded = true;
    }
  }
  player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
  if (player.attackTimer > 0) player.attackTimer--;

  // AI Partner Follow
  partner.vx = (player.x - player.facing * 45 - partner.x) * 0.08;
  partner.x += partner.vx;
  partner.facing = player.facing;
  partner.y = FLOOR_Y;

  // Update Lightning Bolts
  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    lightningBolts[i].life--;
    if (lightningBolts[i].life <= 0) lightningBolts.splice(i, 1);
  }

  // Update Hydro Nets
  for (let i = hydroNets.length - 1; i >= 0; i--) {
    hydroNets[i].life--;
    if (hydroNets[i].life <= 0) hydroNets.splice(i, 1);
  }

  // Update Crystal Shields
  for (let i = crystalShields.length - 1; i >= 0; i--) {
    crystalShields[i].life--;
    if (crystalShields[i].life <= 0) crystalShields.splice(i, 1);
  }

  // Update Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx; p.y += p.vy; p.life--;

    enemies.forEach(en => {
      if (Math.abs(en.x - p.x) < p.radius + 15 && Math.abs((en.y - en.height / 2) - p.y) < 30) {
        en.hp -= p.damage;
        p.life = 0;
        createSparks(p.x, p.y, p.type === 'purple_arrow' ? '#c084fc' : '#38bdf8');
        addScore(70);
      }
    });

    if (p.life <= 0 || p.x < -40 || p.x > canvas.width + 40) {
      projectiles.splice(i, 1);
    }
  }

  // Enemies Update
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    if (en.trapped > 0) {
      en.trapped--;
    } else {
      en.x += en.vx;
    }

    // Barrier Bounce
    crystalShields.forEach(cs => {
      if (Math.abs(en.x - cs.x) < 25) en.vx = Math.abs(en.vx) * 1.5;
    });

    // Damage player
    if (Math.abs(en.x - player.x) < 35 && Math.abs(en.y - player.y) < 40) {
      player.hp -= 0.25;
      shake = 3;
      updateHUD();
    }

    if (en.hp <= 0) {
      createShockwave(en.x, en.y - en.height / 2, '#f43f5e', 40);
      addScore(en.maxHp * 5);
      enemies.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    if (pt.type === 'wave') {
      pt.radius += (pt.maxRadius - pt.radius) * 0.15;
      pt.life--;
    } else {
      pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    }
    if (pt.life <= 0) particles.splice(i, 1);
  }

  if (shake > 0) shake *= 0.85;
}

// --- RENDER LOOP ---
function render() {
  ctx.save();
  if (shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // RenCen Skyline Background
  const grad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  grad.addColorStop(0, '#030712');
  grad.addColorStop(0.65, '#0b1b36');
  grad.addColorStop(1, '#b45309');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Detroit RenCen Towers
  const towers = [
    { x: 50, w: 40, h: 140 }, { x: 105, w: 48, h: 175 },
    { x: 170, w: 60, h: 215, c: true },
    { x: 250, w: 48, h: 175 }, { x: 315, w: 40, h: 140 }, { x: 375, w: 35, h: 120 }
  ];
  towers.forEach(t => {
    ctx.fillStyle = t.c ? '#0f294a' : '#0a1d36';
    ctx.fillRect(t.x, FLOOR_Y - t.h, t.w, t.h);
    ctx.strokeStyle = '#1e4976'; ctx.lineWidth = 1;
    ctx.strokeRect(t.x, FLOOR_Y - t.h, t.w, t.h);
  });

  // Glowing Neon Cyan Floor Line
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
  ctx.shadowColor = '#0284c7'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(canvas.width, FLOOR_Y); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#050b17';
  ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);

  // Mother Luetta Divine Sky Beam
  if (skyAidTimer > 0) {
    skyAidTimer--;
    const beamGrad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
    beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.85)');
    beamGrad.addColorStop(1, 'rgba(234, 179, 8, 0.1)');
    ctx.fillStyle = beamGrad;
    ctx.fillRect(player.x - 40, 0, 80, FLOOR_Y);
  }

  // Floor Lightning Bolt
  lightningBolts.forEach(bolt => {
    ctx.save();
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
    ctx.shadowColor = '#0ea5e9'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(bolt.startX, bolt.y - 2);
    let curX = bolt.startX;
    const step = (bolt.targetX - bolt.startX) / 8;
    for (let i = 1; i <= 8; i++) {
      curX += step;
      ctx.lineTo(curX, bolt.y - 2 + ((i % 2 === 0) ? -10 : 8));
    }
    ctx.stroke();
    ctx.restore();
  });

  // Hydro Net Traps
  hydroNets.forEach(net => {
    ctx.save();
    ctx.strokeStyle = 'rgba(6, 182, 212, 0.85)';
    ctx.lineWidth = 2.5; ctx.shadowColor = '#06b6d4'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(net.x, net.y, 35, 0, Math.PI * 2); ctx.stroke();
    // Swirl lines
    ctx.beginPath(); ctx.arc(net.x, net.y, 20, 0, Math.PI * 1.5); ctx.stroke();
    ctx.restore();
  });

  // Crystal Barrier
  crystalShields.forEach(cs => {
    ctx.save();
    ctx.fillStyle = 'rgba(96, 165, 250, 0.75)';
    ctx.strokeStyle = '#bfdbfe'; ctx.lineWidth = 2;
    ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(cs.x, cs.y - cs.height);
    ctx.lineTo(cs.x + 14, cs.y - cs.height / 2);
    ctx.lineTo(cs.x, cs.y);
    ctx.lineTo(cs.x - 14, cs.y - cs.height / 2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  });

  // Heroes
  drawPartner(partner.x, partner.y, partner.facing);
  drawCharacter(player.x, player.y, player.facing, HEROES[heroIdx].type, player.attackTimer, player.activeAttack);

  // Enemies
  enemies.forEach(en => {
    ctx.save();
    ctx.translate(en.x, en.y);
    if (en.type === 'drone') {
      ctx.fillStyle = '#475569'; ctx.fillRect(-16, -12, 32, 12);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(0, -6, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#334155'; ctx.fillRect(-10, -en.height, 20, en.height);
      ctx.fillStyle = '#0284c7'; ctx.fillRect(-6, -en.height + 6, 12, 12);
    }
    // Trapped water bubble
    if (en.trapped > 0) {
      ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -en.height / 2, en.height / 1.7, 0, Math.PI * 2); ctx.stroke();
    }
    // HP bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-15, -en.height - 10, 30, 4);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-15, -en.height - 10, (en.hp / en.maxHp) * 30, 4);
    ctx.restore();
  });

  // Projectiles
  projectiles.forEach(p => {
    ctx.save();
    if (p.type === 'purple_arrow') {
      ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
      ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(p.x - p.vx * 2, p.y - p.vy * 2); ctx.lineTo(p.x, p.y); ctx.stroke();
    } else if (p.type === 'tidal_wave') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.7)';
      ctx.shadowColor = '#0284c7'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
    }
    ctx.restore();
  });

  // Particles
  particles.forEach(pt => {
    ctx.save();
    if (pt.type === 'wave') {
      ctx.strokeStyle = pt.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, pt.size || 3, pt.size || 3);
    }
    ctx.restore();
  });

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
