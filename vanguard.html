<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RenCen Rooftop: Guardian Powers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #040914;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 960px;
      display: flex;
      flex-direction: column;
      background: #060d1d;
      border: 1px solid #1e293b;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      position: relative;
    }
    /* HUD Header */
    #hud-top {
      background: #020617;
      border-bottom: 2px solid #0ea5e9;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .hud-hero { color: #38bdf8; text-transform: uppercase; }
    .hud-zone { color: #f59e0b; text-align: center; }
    .hud-stats { color: #e2e8f0; font-family: monospace; font-size: 12px; }
    .bar-container {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    #hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.15s ease;
    }
    #od-bar-wrap {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      font-family: monospace;
      margin-top: 2px;
    }
    /* Canvas Area */
    #canvas-wrap {
      width: 100%;
      height: 38vh;
      min-height: 250px;
      position: relative;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Controls Console */
    #controls-console {
      flex: 1;
      background: #070e1e;
      border-top: 2px solid #1e3a8a;
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 5px;
      overflow-y: auto;
    }
    .btn-grid {
      display: grid;
      gap: 5px;
    }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .btn-action {
      background: #0f1e36;
      border: 1px solid #1e3a8a;
      border-radius: 5px;
      color: #cbd5e1;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      transition: all 0.08s ease;
    }
    .btn-action:active, .btn-action.active-press {
      transform: scale(0.96);
      background: #1e3a8a;
      border-color: #38bdf8;
    }
    .btn-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .btn-sub {
      font-size: 8.5px;
      color: #94a3b8;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    /* Custom button accents matching the UI */
    .btn-hero.selected {
      border-color: #f59e0b !important;
      background: #3b2204 !important;
      color: #fbbf24 !important;
    }
    .btn-strike1 { border-color: #854d0e; background: #261e09; color: #fde047; }
    .btn-strike2 { border-color: #0369a1; background: #082f49; color: #38bdf8; }
    .btn-skill { border-color: #4f46e5; background: #1e1b4b; color: #a5b4fc; }
    .btn-overdrive { border-color: #991b1b; background: #450a0a; color: #fca5a5; }
    .btn-mother { border-color: #d97706; background: #451a03; color: #fef08a; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- HUD -->
  <div id="hud-top">
    <div class="hud-row">
      <span class="hud-hero" id="hud-hero-name">HERO: Marcus & Mayleen</span>
      <span class="hud-zone">ZONE: RenCen Rooftop</span>
      <span class="hud-stats">HP: <span id="val-hp">120</span>/120</span>
    </div>
    <div class="bar-container">
      <div id="hp-bar"></div>
    </div>
    <div id="od-bar-wrap">
      <span>SCORE: <span id="val-score">0</span></span>
      <span style="color:#38bdf8;">OVERDRIVE: <span id="val-od">0</span>%</span>
    </div>
  </div>

  <!-- BATTLE CANVAS -->
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="480" height="260"></canvas>
  </div>

  <!-- TOUCH CONSOLE CONTROLS -->
  <div id="controls-console">
    <!-- Character Selectors -->
    <div class="btn-grid grid-3">
      <button class="btn-action btn-hero selected" data-hero="0">
        <span class="btn-title">Marcus</span>
        <span class="btn-sub">Earth & Rhythm</span>
      </button>
      <button class="btn-action btn-hero" data-hero="1">
        <span class="btn-title">Shard Weaver</span>
        <span class="btn-sub">Crystal Aegis</span>
      </button>
      <button class="btn-action btn-hero" data-hero="2">
        <span class="btn-title">Sky Ranger</span>
        <span class="btn-sub">Arrow Barrage</span>
      </button>
    </div>

    <div class="btn-grid grid-3">
      <button class="btn-action btn-hero" data-hero="3">
        <span class="btn-title">Sundiata</span>
        <span class="btn-sub">Cosmic Bruiser</span>
      </button>
      <button class="btn-action btn-hero" data-hero="4">
        <span class="btn-title">Aura Blade</span>
        <span class="btn-sub">Hydro Katana</span>
      </button>
      <button class="btn-action btn-hero" data-hero="5">
        <span class="btn-title">Prism Void</span>
        <span class="btn-sub">Graviton Shift</span>
      </button>
    </div>

    <!-- Partner & Mother Luetta Aid -->
    <div class="btn-grid grid-2">
      <button class="btn-action" id="btn-tag">
        <span class="btn-title" style="color:#38bdf8;">🔄 TAG / SWAP DUO</span>
        <span class="btn-sub" id="lbl-partner">Partner: Mayleen (Active AI)</span>
      </button>
      <button class="btn-action btn-mother" id="btn-luetta">
        <span class="btn-title">MOTHER LUETTA</span>
        <span class="btn-sub">Divine Sky & Ground Aid</span>
      </button>
    </div>

    <!-- Movement & Primary Attacks -->
    <div class="btn-grid grid-3">
      <button class="btn-action" id="btn-left">
        <span class="btn-title">◀ LEFT</span>
      </button>
      <button class="btn-action btn-strike1" id="btn-strike1">
        <span class="btn-title">STRIKE 1</span>
        <span class="btn-sub">Golden Power Fist</span>
      </button>
      <button class="btn-action" id="btn-right">
        <span class="btn-title">RIGHT ▶</span>
      </button>
    </div>

    <!-- Secondary & Specials -->
    <div class="btn-grid grid-3">
      <button class="btn-action" id="btn-jump">
        <span class="btn-title" style="color:#38bdf8;">NINJA JUMP</span>
        <span class="btn-sub">Aerial Acrobatics</span>
      </button>
      <button class="btn-action btn-strike2" id="btn-strike2">
        <span class="btn-title">STRIKE 2</span>
        <span class="btn-sub">Hydro Crest Wave</span>
      </button>
      <button class="btn-action btn-skill" id="btn-skill">
        <span class="btn-title">SPECIAL POWER</span>
        <span class="btn-sub" id="lbl-skill-name">Crystal / Arrows</span>
      </button>
    </div>

    <!-- Full Screen Overdrive -->
    <button class="btn-action btn-overdrive" id="btn-overdrive" style="padding: 7px 0;">
      <span class="btn-title">★ OVERDRIVE BATTLE CLASH ★</span>
      <span class="btn-sub">Twin Djembe Seismic Earthquake</span>
    </button>
  </div>
</div>

<script>
// --- AUDIO SYNTHESIZER ---
class SFXSystem {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  play(type) {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);

    if (type === 'hit') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.start(t);
      osc.stop(t + 0.12);
    } else if (type === 'drum') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(110, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
      gain.gain.setValueAtTime(0.6, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.start(t);
      osc.stop(t + 0.25);
    } else if (type === 'energy') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(480, t);
      osc.frequency.linearRampToValueAtTime(880, t + 0.2);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.start(t);
      osc.stop(t + 0.2);
    } else if (type === 'heal') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(880, t + 0.4);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
      osc.start(t);
      osc.stop(t + 0.4);
    }
  }
}
const sfx = new SFXSystem();

// --- GAME SETUP & ROSTER ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const HERO_ROSTER = [
  { id: 0, name: "Marcus", role: "Earth & Rhythm", color: "#38bdf8", powerName: "Seismic Quake", skin: "marcus" },
  { id: 1, name: "Shard Weaver", role: "Crystal Barrier", color: "#60a5fa", powerName: "Obsidian Aegis", skin: "crystal" },
  { id: 2, name: "Sky Ranger", role: "Purple Arrow Spread", color: "#c084fc", powerName: "Volley of Light", skin: "archer" },
  { id: 3, name: "Sundiata Prime", role: "Cosmic Sun Aegis", color: "#f59e0b", powerName: "Solar Stomp", skin: "sundiata" },
  { id: 4, name: "Aura Blade", role: "Hydro Wave Master", color: "#06b6d4", powerName: "Tsunami Arc", skin: "katana" },
  { id: 5, name: "Prism Void", role: "Graviton Void", color: "#a855f7", powerName: "Graviton Burst", skin: "void" }
];

let currentHeroIdx = 0;
let score = 0;
let overdriveEnergy = 0;
let screenShake = 0;

// GROUND ALIGNMENT: 45px above canvas bottom ensures characters stand squarely on neon floor line
const FLOOR_Y = canvas.height - 45;

const player = {
  x: 80,
  y: FLOOR_Y,
  vx: 0,
  vy: 0,
  width: 38,
  height: 98,
  hp: 120,
  maxHp: 120,
  isGrounded: true,
  facing: 1,
  attackTimer: 0,
  activeAttack: null
};

const partner = {
  x: 40,
  y: FLOOR_Y,
  vx: 0,
  vy: 0,
  width: 34,
  height: 94,
  facing: 1,
  attackTimer: 0
};

// Dynamic entities
let enemies = [];
let projectiles = [];
let particles = [];
let crystalShields = [];
let skyAidTimer = 0;

// --- SPAWN ENEMY MECHANICS ---
function spawnEnemy() {
  if (enemies.length >= 5) return;
  const isDrone = Math.random() > 0.6;
  enemies.push({
    x: canvas.width + 20,
    y: isDrone ? FLOOR_Y - 70 - Math.random() * 40 : FLOOR_Y,
    vx: -(isDrone ? 1.8 : 1.2),
    vy: 0,
    width: isDrone ? 36 : 30,
    height: isDrone ? 24 : 85,
    hp: isDrone ? 30 : 60,
    maxHp: isDrone ? 30 : 60,
    type: isDrone ? 'drone' : 'mech',
    shootCooldown: Math.floor(Math.random() * 80) + 40
  });
}
setInterval(spawnEnemy, 2400);

// --- INPUT HANDLERS ---
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyJ') triggerStrike1();
  if (e.code === 'KeyK') triggerStrike2();
  if (e.code === 'KeyL') triggerSkill();
  if (e.code === 'KeyU') triggerOverdrive();
  if (e.code === 'KeyI') triggerMotherLuetta();
  if (e.code === 'Space') triggerJump();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Bind Touch/Click Controls
function bindTouch(id, onStart, onEnd) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => { e.preventDefault(); el.classList.add('active-press'); if (onStart) onStart(); };
  const release = (e) => { e.preventDefault(); el.classList.remove('active-press'); if (onEnd) onEnd(); };
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
}

let moveLeft = false;
let moveRight = false;

bindTouch('btn-left', () => { moveLeft = true; }, () => { moveLeft = false; });
bindTouch('btn-right', () => { moveRight = true; }, () => { moveRight = false; });
bindTouch('btn-jump', () => triggerJump());
bindTouch('btn-strike1', () => triggerStrike1());
bindTouch('btn-strike2', () => triggerStrike2());
bindTouch('btn-skill', () => triggerSkill());
bindTouch('btn-overdrive', () => triggerOverdrive());
bindTouch('btn-luetta', () => triggerMotherLuetta());
bindTouch('btn-tag', () => tagPartner());

// Hero selection buttons
document.querySelectorAll('.btn-hero').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-hero').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentHeroIdx = parseInt(btn.dataset.hero, 10);
    const hero = HERO_ROSTER[currentHeroIdx];
    document.getElementById('hud-hero-name').innerText = `HERO: ${hero.name}`;
    document.getElementById('lbl-skill-name').innerText = hero.powerName;
    createShockwave(player.x, player.y - 40, hero.color, 40);
    sfx.play('energy');
  });
});

// --- COMBAT ABILITIES ---
function triggerJump() {
  if (player.isGrounded) {
    player.vy = -12;
    player.isGrounded = false;
    createDust(player.x, player.y);
  }
}

function triggerStrike1() {
  // POWER 1: Golden Fist Impact Slam
  player.attackTimer = 16;
  player.activeAttack = 'golden_fist';
  screenShake = 6;
  sfx.play('hit');

  // Check hit
  const reach = 85;
  enemies.forEach(en => {
    if (Math.abs(en.x - (player.x + (player.facing * 35))) < reach && Math.abs(en.y - player.y) < 60) {
      en.hp -= 40;
      en.vx = player.facing * 6;
      createHitSparks(en.x, en.y - en.height / 2, '#fbbf24');
      addScore(150);
    }
  });
}

function triggerStrike2() {
  // POWER 2: Elemental Water Crest Wave
  player.attackTimer = 14;
  player.activeAttack = 'water_wave';
  sfx.play('energy');

  projectiles.push({
    x: player.x + player.facing * 30,
    y: player.y - 30,
    vx: player.facing * 7,
    vy: 0,
    radius: 22,
    type: 'water_wave',
    life: 55,
    damage: 35
  });
}

function triggerSkill() {
  const hero = HERO_ROSTER[currentHeroIdx];
  player.attackTimer = 20;
  player.activeAttack = 'special';
  sfx.play('energy');

  if (hero.skin === 'crystal') {
    // POWER 3: Obsidian Crystal Shield
    crystalShields.push({
      x: player.x + player.facing * 50,
      y: player.y,
      life: 240,
      width: 22,
      height: 90
    });
    screenShake = 4;
  } else if (hero.skin === 'archer') {
    // POWER 4: Multi-Arrow Aerial Scatter (Purple Energy Barrage)
    player.vy = -7;
    player.isGrounded = false;
    for (let a = -0.4; a <= 0.4; a += 0.13) {
      projectiles.push({
        x: player.x + player.facing * 10,
        y: player.y - 45,
        vx: Math.cos(a) * (player.facing * 9),
        vy: Math.sin(a) * 9,
        radius: 4,
        type: 'purple_arrow',
        life: 50,
        damage: 25
      });
    }
  } else {
    // POWER 5: Seismic Drum Tremor
    screenShake = 10;
    sfx.play('drum');
    createShockwave(player.x, player.y, '#f59e0b', 140);
    enemies.forEach(en => {
      en.hp -= 35;
      en.vx = (en.x > player.x ? 1 : -1) * 8;
      createHitSparks(en.x, en.y - 30, '#fde047');
    });
  }
}

function triggerOverdrive() {
  if (overdriveEnergy < 100) return;
  overdriveEnergy = 0;
  updateHUD();
  screenShake = 18;
  sfx.play('drum');
  createShockwave(canvas.width / 2, FLOOR_Y - 40, '#38bdf8', 260);

  enemies.forEach(en => {
    en.hp -= 90;
    en.vx = (en.x > canvas.width / 2 ? 1 : -1) * 12;
    createHitSparks(en.x, en.y - 30, '#38bdf8');
  });
  addScore(1000);
}

function triggerMotherLuetta() {
  skyAidTimer = 70;
  player.hp = Math.min(player.maxHp, player.hp + 45);
  updateHUD();
  sfx.play('heal');
  screenShake = 8;
  // Smite all hostiles on screen with descending golden column
  enemies.forEach(en => {
    en.hp -= 50;
    createHitSparks(en.x, en.y - 30, '#fef08a');
  });
}

function tagPartner() {
  const tempX = player.x;
  player.x = partner.x;
  partner.x = tempX;
  createShockwave(player.x, player.y - 40, '#38bdf8', 50);
  createShockwave(partner.x, partner.y - 40, '#22c55e', 50);
  sfx.play('energy');
}

function addScore(pts) {
  score += pts;
  overdriveEnergy = Math.min(100, overdriveEnergy + Math.floor(pts / 15));
  updateHUD();
}

function updateHUD() {
  document.getElementById('val-hp').innerText = Math.max(0, Math.floor(player.hp));
  document.getElementById('hp-bar').style.width = `${(Math.max(0, player.hp) / player.maxHp) * 100}%`;
  document.getElementById('val-score').innerText = score;
  document.getElementById('val-od').innerText = overdriveEnergy;
}

// --- PARTICLE / FX SYSTEMS ---
function createDust(x, y) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x + (Math.random() * 20 - 10),
      y: y - 2,
      vx: (Math.random() - 0.5) * 2,
      vy: -Math.random() * 1.5,
      life: 20,
      color: 'rgba(148, 163, 184, 0.6)',
      size: 3
    });
  }
}

function createHitSparks(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 22,
      color: color,
      size: 3
    });
  }
}

function createShockwave(x, y, color, maxRadius) {
  particles.push({
    x: x,
    y: y,
    radius: 5,
    maxRadius: maxRadius,
    color: color,
    type: 'wave',
    life: 25
  });
}

// --- RENDERING ROUTINES ---
function drawSkyline() {
  // Sunset Twilight RenCen Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  grad.addColorStop(0, '#030712');
  grad.addColorStop(0.65, '#0b1b36');
  grad.addColorStop(1, '#b45309');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Distant RenCen Cylindrical Tower Columns
  const towers = [
    { x: 50, w: 40, h: 140 },
    { x: 105, w: 48, h: 175 },
    { x: 170, w: 60, h: 215, isCenter: true },
    { x: 250, w: 48, h: 175 },
    { x: 315, w: 40, h: 140 },
    { x: 375, w: 35, h: 120 }
  ];

  towers.forEach(t => {
    ctx.fillStyle = t.isCenter ? '#0f294a' : '#0a1d36';
    ctx.fillRect(t.x, FLOOR_Y - t.h, t.w, t.h);
    ctx.strokeStyle = '#1e4976';
    ctx.lineWidth = 1;
    ctx.strokeRect(t.x, FLOOR_Y - t.h, t.w, t.h);

    // Glowing window slits
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
    for (let wy = FLOOR_Y - t.h + 12; wy < FLOOR_Y - 10; wy += 14) {
      ctx.beginPath();
      ctx.moveTo(t.x + 6, wy);
      ctx.lineTo(t.x + t.w - 6, wy);
      ctx.stroke();
    }
  });

  // Glowing Neon Cyan Rooftop Floor Rail
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#0284c7';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y);
  ctx.lineTo(canvas.width, FLOOR_Y);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Floor foundation block
  ctx.fillStyle = '#050b17';
  ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
}

function drawHero(x, y, facing, hero, attackTimer, activeAttack) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  // Character boots anchor directly at y=0
  // Body silhouette
  ctx.fillStyle = hero.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;

  // Legs & Boots
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-10, -32, 8, 32);
  ctx.fillRect(2, -32, 8, 32);
  // Armor greaves
  ctx.fillStyle = hero.color;
  ctx.fillRect(-11, -26, 9, 18);
  ctx.fillRect(1, -26, 9, 18);

  // Torso / Power Suit
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-12, -72, 24, 40);
  ctx.fillStyle = hero.color;
  ctx.fillRect(-10, -68, 20, 20); // Chest Plate

  // Head & Fade Haircut
  ctx.fillStyle = '#7c2d12'; // skin
  ctx.beginPath();
  ctx.arc(0, -82, 10, 0, Math.PI * 2);
  ctx.fill();
  // Hair & Fade
  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.arc(0, -86, 10, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-3, -80, 5, 4); // Beard silhouette

  // Twin Djembe Drums strapped if Marcus
  if (hero.skin === 'marcus') {
    ctx.fillStyle = '#78350f';
    // Back drum
    ctx.beginPath();
    ctx.moveTo(-22, -65);
    ctx.lineTo(-6, -65);
    ctx.lineTo(-10, -42);
    ctx.lineTo(-18, -42);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Front drum
    ctx.beginPath();
    ctx.moveTo(4, -65);
    ctx.lineTo(20, -65);
    ctx.lineTo(16, -42);
    ctx.lineTo(8, -42);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // Active Power Visuals Overlay
  if (attackTimer > 0 && activeAttack === 'golden_fist') {
    // Giant Golden Power Gauntlet
    ctx.save();
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(28, -50, 19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(20, -56, 16, 12);
    ctx.restore();
  }

  ctx.restore();
}

function drawPartner(x, y, facing) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  // Mayleen - Botanical Vine Armor
  ctx.fillStyle = '#15803d';
  ctx.fillRect(-8, -30, 6, 30);
  ctx.fillRect(2, -30, 6, 30);

  // Vine cuirass
  ctx.fillStyle = '#166534';
  ctx.fillRect(-10, -68, 20, 38);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(-8, -64, 16, 18);

  // Head & Afro Puff
  ctx.fillStyle = '#7c2d12';
  ctx.beginPath();
  ctx.arc(0, -78, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.arc(0, -86, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// --- MAIN LOOP ---
function update() {
  // Input Handling
  if (keys['ArrowLeft'] || keys['KeyA'] || moveLeft) {
    player.vx = -3.8;
    player.facing = -1;
  } else if (keys['ArrowRight'] || keys['KeyD'] || moveRight) {
    player.vx = 3.8;
    player.facing = 1;
  } else {
    player.vx *= 0.7;
  }

  // Player Physics
  player.x += player.vx;
  player.y += player.vy;

  if (!player.isGrounded) {
    player.vy += 0.65; // gravity
    if (player.y >= FLOOR_Y) {
      player.y = FLOOR_Y;
      player.vy = 0;
      player.isGrounded = true;
      createDust(player.x, player.y);
    }
  }

  // Bounds
  player.x = Math.max(25, Math.min(canvas.width - 25, player.x));

  if (player.attackTimer > 0) player.attackTimer--;

  // AI Partner Follow Behavior
  const targetX = player.x - player.facing * 45;
  partner.vx = (targetX - partner.x) * 0.08;
  partner.x += partner.vx;
  partner.facing = player.facing;
  partner.y = FLOOR_Y;

  // Crystal Shields
  for (let i = crystalShields.length - 1; i >= 0; i--) {
    const cs = crystalShields[i];
    cs.life--;
    if (cs.life <= 0) crystalShields.splice(i, 1);
  }

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    // Collision with enemies
    enemies.forEach(en => {
      if (Math.abs(en.x - p.x) < p.radius + 15 && Math.abs((en.y - en.height / 2) - p.y) < 30) {
        en.hp -= p.damage;
        p.life = 0;
        createHitSparks(p.x, p.y, p.type === 'purple_arrow' ? '#c084fc' : '#38bdf8');
        addScore(75);
      }
    });

    if (p.life <= 0 || p.x < -40 || p.x > canvas.width + 40) {
      projectiles.splice(i, 1);
    }
  }

  // Enemies update
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    en.x += en.vx;

    // Check collision with crystal barrier
    crystalShields.forEach(cs => {
      if (Math.abs(en.x - cs.x) < 25) {
        en.vx = Math.abs(en.vx) * 1.5; // bounce back
      }
    });

    // Enemy attacks player
    if (Math.abs(en.x - player.x) < 35 && Math.abs(en.y - player.y) < 40) {
      player.hp -= 0.25;
      screenShake = 3;
      updateHUD();
    }

    if (en.hp <= 0) {
      createShockwave(en.x, en.y - en.height / 2, '#f43f5e', 40);
      addScore(en.maxHp * 5);
      enemies.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    if (pt.type === 'wave') {
      pt.radius += (pt.maxRadius - pt.radius) * 0.15;
      pt.life--;
    } else {
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life--;
    }
    if (pt.life <= 0) particles.splice(i, 1);
  }

  if (screenShake > 0) screenShake *= 0.85;
}

function render() {
  ctx.save();
  if (screenShake > 0.5) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  // 1. Detroit Skyline & Neon Rooftop
  drawSkyline();

  // 2. Mother Luetta Divine Sky Beam
  if (skyAidTimer > 0) {
    skyAidTimer--;
    ctx.save();
    const beamGrad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
    beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.85)');
    beamGrad.addColorStop(1, 'rgba(234, 179, 8, 0.1)');
    ctx.fillStyle = beamGrad;
    ctx.fillRect(player.x - 40, 0, 80, FLOOR_Y);
    ctx.restore();
  }

  // 3. Crystal Shields
  crystalShields.forEach(cs => {
    ctx.save();
    ctx.fillStyle = 'rgba(96, 165, 250, 0.7)';
    ctx.strokeStyle = '#bfdbfe';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#60a5fa';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(cs.x, cs.y - cs.height);
    ctx.lineTo(cs.x + 12, cs.y - cs.height / 2);
    ctx.lineTo(cs.x, cs.y);
    ctx.lineTo(cs.x - 12, cs.y - cs.height / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });

  // 4. Partner & Hero
  drawPartner(partner.x, partner.y, partner.facing);
  drawHero(player.x, player.y, player.facing, HERO_ROSTER[currentHeroIdx], player.attackTimer, player.activeAttack);

  // 5. Hostile Mechs and Aerial Drones
  enemies.forEach(en => {
    ctx.save();
    ctx.translate(en.x, en.y);
    if (en.type === 'drone') {
      // Quad-rotor drone
      ctx.fillStyle = '#475569';
      ctx.fillRect(-18, -12, 36, 12);
      ctx.fillStyle = '#ef4444'; // glowing red eye
      ctx.beginPath();
      ctx.arc(0, -6, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Ground Combat Android
      ctx.fillStyle = '#334155';
      ctx.fillRect(-10, -en.height, 20, en.height);
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(-6, -en.height + 6, 12, 12);
    }
    // Health bar above enemy
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-15, -en.height - 12, 30, 4);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-15, -en.height - 12, (en.hp / en.maxHp) * 30, 4);
    ctx.restore();
  });

  // 6. Projectiles
  projectiles.forEach(p => {
    ctx.save();
    if (p.type === 'purple_arrow') {
      ctx.strokeStyle = '#c084fc';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#a855f7';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 2, p.y - p.vy * 2);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (p.type === 'water_wave') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.65)';
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });

  // 7. Particles & Shockwaves
  particles.forEach(pt => {
    ctx.save();
    if (pt.type === 'wave') {
      ctx.strokeStyle = pt.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, pt.size || 3, pt.size || 3);
    }
    ctx.restore();
  });

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
