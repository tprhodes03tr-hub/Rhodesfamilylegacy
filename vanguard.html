<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanguard Universe: Unified Combat Portal</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold-border: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --plat-border: #e5e4e2;
      --plat-glow: rgba(229, 228, 226, 0.5);
      --cosmic-border: #8b5cf6;
      --cosmic-glow: rgba(139, 92, 246, 0.5);
      --syndicate-border: #ef4444;
      --syndicate-glow: rgba(239, 68, 68, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: #0f172a;
      border-bottom: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .portal-title {
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f59e0b;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      max-width: 600px;
    }

    .tab-btn {
      flex: 1;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    .portal-section {
      display: none;
      width: 96%;
      max-width: 1100px;
      margin: 16px auto;
    }

    .portal-section.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-flipper-container {
      perspective: 1000px;
      width: 100%;
      min-height: 285px;
    }

    .card-flipper-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card-flipper-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px;
    }

    .card-face-front {
      position: relative;
      z-index: 2;
      transform: rotateY(0deg);
    }

    .card-face-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: radial-gradient(circle at center, #1b1335 0%, #060810 100%);
      border: 2px solid var(--gold-border);
      box-shadow: 0 0 18px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px;
      overflow: hidden;
    }

    .card-foil {
      position: relative;
      background: #111827;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
    }

    .foil-gold { border: 2px solid var(--gold-border); box-shadow: 0 0 14px var(--gold-glow); }
    .foil-platinum { border: 2px solid var(--plat-border); box-shadow: 0 0 14px var(--plat-glow); }
    .foil-cosmic { border: 2px solid var(--cosmic-border); box-shadow: 0 0 14px var(--cosmic-glow); }
    .foil-syndicate { border: 2px solid var(--syndicate-border); box-shadow: 0 0 12px var(--syndicate-glow); }

    .card-img {
      width: 100%;
      max-width: 130px;
      height: 125px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .card-name { font-weight: 800; font-size: 0.9rem; text-align: center; }
    .card-title { font-size: 0.72rem; color: #94a3b8; text-align: center; margin-bottom: 6px; }

    .stat-row {
      display: flex;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-badge { background: #0b0f19; padding: 2px 5px; border-radius: 4px; border: 1px solid #334155; }

    .hp-bar-container {
      width: 100%;
      background: #334155;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .hp-bar { height: 100%; background: #22c55e; width: 100%; }

    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .clash-board {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .clash-status-box {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      font-size: 0.88rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .battle-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .battle-card.targeted {
      outline: 3px solid #facc15;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.8) !important;
      transform: scale(1.02);
    }

    .action-btn { padding: 6px 4px; font-size: 0.70rem; font-weight: 800; border-radius: 4px; cursor: pointer; border: 1px solid #475569; background: #1e293b; color: #f8fafc; text-align: center; }
    .action-btn.primary-atk { background: #15803d; border-color: #22c55e; }

    .brawler-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .hud-header {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .hud-top-row { display: flex; justify-content: space-between; align-items: center; }
    .hero-title { font-size: 13px; font-weight: 800; color: #38bdf8; }
    .wave-badge { font-size: 11px; color: #f59e0b; font-weight: 800; background: rgba(245, 158, 11, 0.15); padding: 3px 8px; border-radius: 4px; }

    .bars-container { display: flex; gap: 10px; }
    .bar-group { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .bar-label { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }
    .bar-track { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .bar-fill-hero { height: 100%; background: #10b981; width: 100%; }
    .bar-fill-enemy { height: 100%; background: #ef4444; width: 100%; }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 290px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    #gameCanvas { display: block; width: 100%; height: 100%; }

    .combat-log {
      font-family: monospace;
      font-size: 11px;
      background: #090e18;
      border: 1px solid #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      color: #38bdf8;
      min-height: 28px;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 6px; width: 100%; }
    .dpad-cluster, .action-cluster { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px 3px;
    }
    .btn:active { transform: scale(0.96); background: #334155; }
    .btn-action { background: linear-gradient(180deg, #1e293b, #0f172a); border-color: #38bdf8; color: #38bdf8; }
    .btn-orb { background: linear-gradient(180deg, #0369a1, #0c4a6e); border-color: #38bdf8; color: #bae6fd; }
    .btn-tag { background: linear-gradient(180deg, #7c3aed, #5b21b6); border-color: #a78bfa; color: #fff; }
    .btn-ultimate { grid-column: span 3; background: linear-gradient(180deg, #f59e0b, #b45309); border-color: #fbbf24; color: #fff; font-size: 11px; min-height: 38px; }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">Vanguard Universe: Unified Combat Portal</div>
    <div class="tab-bar">
      <button class="tab-btn" onclick="window.openTab('codex', this)">🎴 Card Codex</button>
      <button class="tab-btn" onclick="window.openTab('clash', this)">⚔️ Card Clash</button>
      <button class="tab-btn active" onclick="window.openTab('brawler', this)">🕹 Side Brawler</button>
    </div>
  </header>

  <!-- TAB 1: CARD CODEX -->
  <section id="tab-codex" class="portal-section">
    <div class="codex-grid">
      <div class="card-flipper-container" onclick="window.toggleCardFlip(this)">
        <div class="card-flipper-inner">
          <div class="card-face card-face-front card-foil foil-cosmic">
            <div class="card-name">Mother Luetta</div>
            <div class="card-title">Root Ancestor • Living Codex</div>
            <div class="stat-row"><span class="stat-badge">PWR: 99</span><span class="stat-badge">DEF: 99</span></div>
            <span class="worth-badge worth-cosmic">Cosmic Singularity</span>
          </div>
          <div class="card-face card-face-back">
            <div class="back-brand-title">RHODES FAMILY LEGACY</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- TAB 2: CARD CLASH -->
  <section id="tab-clash" class="portal-section">
    <div class="clash-board">
      <div class="clash-status-box" id="clash-status">Select an enemy target card.</div>
      <div class="battle-row">
        <div class="card-foil foil-syndicate battle-card" id="enemy-0" onclick="window.selectTarget(0)">
          <div class="card-name">Chrono-Lock</div>
        </div>
      </div>
    </div>
  </section>

  <!-- TAB 3: SIDE BRAWLER -->
  <section id="tab-brawler" class="portal-section active">
    <div class="brawler-wrapper">
      <div class="hud-header">
        <div class="hud-top-row">
          <span id="heroNameLabel" class="hero-title">Marcus Prime (Lead) & Xochitl (AI)</span>
          <span id="waveDisplay" class="wave-badge">Wave 1: Scout Vanguard</span>
        </div>
        <div class="bars-container">
          <div class="bar-group">
            <div class="bar-label"><span>Health</span><span id="heroHpText">100/100</span></div>
            <div class="bar-track"><div id="heroHpBar" class="bar-fill-hero"></div></div>
          </div>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="540" height="290"></canvas>
      </div>

      <div class="combat-log" id="combatLog">Tactical Co-Op active!</div>

      <div class="controls-grid">
        <div class="dpad-cluster">
          <button class="btn" onclick="window.playerMove(-25)">◄ LEFT</button>
          <button class="btn" onclick="window.playerJump()">▲ JUMP</button>
          <button class="btn" onclick="window.playerMove(25)">RIGHT ►</button>
        </div>
        <div class="action-cluster">
          <button class="btn btn-action" onclick="window.executeStrike()">⚡ Volt Beam</button>
          <button class="btn btn-orb" onclick="window.executePlasmaOrb()">🔵 Plasma Orb</button>
          <button class="btn btn-action" onclick="window.executeBurst()">🛡️ Deflect</button>
          <button class="btn btn-tag" onclick="window.executeTagSwap()">TAG</button>
          <button class="btn btn-ultimate" onclick="window.executeLuettaAid()">★ SUMMON MOTHER LUETTA ★</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    let canvas, ctx;
    let animationFrameId = null;
    let leadX = 90, leadY = 0, leadVy = 0, isGrounded = true;
    let playerHp = 100;
    let enemies = [{ x: 420, y: 205, hp: 2, active: true, speed: 1.15 }];
    let plasmaOrbs = [];
    let unlockedRoster = ["marcus", "xochitl", "sundiata"];
    let rosterIdx = 0;
    let activeLead = "marcus";
    let luettaState = { active: false, timer: 0 };

    window.openTab = function(tabName, btn) {
      document.querySelectorAll('.portal-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const targetSec = document.getElementById('tab-' + tabName);
      if (targetSec) targetSec.classList.add('active');
      if (btn) btn.classList.add('active');

      if (tabName === 'brawler') {
        setTimeout(() => {
          resizeBrawlerCanvas();
          if (!animationFrameId) animationFrameId = requestAnimationFrame(renderLoop);
        }, 50);
      }
    };

    window.toggleCardFlip = function(container) {
      container.querySelector('.card-flipper-inner').classList.toggle('is-flipped');
    };

    window.selectTarget = function(index) {
      document.querySelectorAll('.battle-card').forEach(c => c.classList.remove('targeted'));
      document.getElementById('enemy-' + index).classList.add('targeted');
      document.getElementById('clash-status').innerText = "Target locked!";
    };

    function resizeBrawlerCanvas() {
      if (!canvas) return;
      canvas.width = 540;
      canvas.height = 290;
    }

    window.playerMove = function(dx) {
      leadX = Math.max(30, Math.min(460, leadX + dx));
    };

    window.playerJump = function() {
      if (!isGrounded) return;
      leadVy = -13;
      isGrounded = false;
    };

    window.executeTagSwap = function() {
      rosterIdx = (rosterIdx + 1) % unlockedRoster.length;
      activeLead = unlockedRoster[rosterIdx];
      document.getElementById("heroNameLabel").innerText = `${activeLead.toUpperCase()} (Lead)`;
    };

    window.executeStrike = function() {
      enemies.forEach(e => {
        if (e.active && Math.abs(e.x - leadX) < 70) {
          e.hp--;
          if (e.hp <= 0) e.active = false;
        }
      });
    };

    window.executePlasmaOrb = function() {
      plasmaOrbs.push({ x: leadX + 35, y: 200, vx: 7, radius: 10, life: 80 });
    };

    window.executeBurst = function() {
      playerHp = Math.min(100, playerHp + 15);
      updateHUD();
    };

    window.executeLuettaAid = function() {
      if (luettaState.active) return;
      luettaState.active = true;
      luettaState.timer = 100;
      playerHp = 100;
      updateHUD();
    };

    function initBrawler() {
      canvas = document.getElementById("gameCanvas");
      if (!canvas) return;
      ctx = canvas.getContext("2d");
      resizeBrawlerCanvas();

      if (!animationFrameId) {
        animationFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function renderLoop() {
      if (!canvas || !ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky
      ctx.fillStyle = "#07090e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 245, canvas.width, 45);
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 245);
      ctx.lineTo(canvas.width, 245);
      ctx.stroke();

      // Physics
      if (!isGrounded) {
        leadY -= leadVy;
        leadVy += 0.8;
        if (leadY <= 0) { leadY = 0; leadVy = 0; isGrounded = true; }
      }

      // Mother Luetta Beam Effect
      if (luettaState.active) {
        luettaState.timer--;
        ctx.fillStyle = "rgba(245, 158, 11, 0.3)";
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2 - 30, 0);
        ctx.lineTo(canvas.width / 2 + 30, 0);
        ctx.lineTo(leadX + 60, 245);
        ctx.lineTo(leadX - 10, 245);
        ctx.closePath();
        ctx.fill();
        if (luettaState.timer <= 0) luettaState.active = false;
      }

      // Hero
      ctx.fillStyle = activeLead === "marcus" ? "#38bdf8" : (activeLead === "xochitl" ? "#f97316" : "#f59e0b");
      ctx.fillRect(leadX, 245 - 55 - leadY, 35, 55);

      // Enemies
      enemies.forEach(e => {
        if (!e.active) return;
        e.x -= e.speed;
        if (e.x < -30) e.x = 560;
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(e.x, 245 - 40, 30, 40);
      });

      // Orbs
      for (let i = plasmaOrbs.length - 1; i >= 0; i--) {
        let po = plasmaOrbs[i];
        po.x += po.vx;
        po.life--;
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(po.x, po.y, 7, 0, Math.PI * 2);
        ctx.fill();

        enemies.forEach(e => {
          if (e.active && Math.abs(e.x - po.x) < 20) {
            e.active = false;
            plasmaOrbs.splice(i, 1);
          }
        });

        if (po.x > canvas.width || po.life <= 0) plasmaOrbs.splice(i, 1);
      }

      animationFrameId = requestAnimationFrame(renderLoop);
    }

    function updateHUD() {
      document.getElementById("heroHpText").innerText = `${playerHp}/100`;
      document.getElementById("heroHpBar").style.width = `${playerHp}%`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      initBrawler();
    });
  </script>
</body>
</html>
