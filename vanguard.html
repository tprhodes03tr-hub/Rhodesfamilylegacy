<!-- ======================================================= -->
<!-- THE ANCESTRAL VANGUARD: ALL-IN-ONE COMIC FX & SPRITE CARD -->
<!-- ======================================================= -->
<script>
(() => {
  // 1. ASSET PRELOADER (Hero Sprite & Cinematic Portrait)
  const vAssets = {
    hero: new Image(),
    portrait: new Image(),
    loaded: false
  };
  vAssets.hero.src = '11513.png';      // Sundiata Prime Sprite
  vAssets.portrait.src = '11512.png';  // Mother Luta / Living Codex Cut-In

  let loadedCount = 0;
  const onAssetLoad = () => { if (++loadedCount >= 2) vAssets.loaded = true; };
  vAssets.hero.onload = onAssetLoad;
  vAssets.portrait.onload = onAssetLoad;

  // 2. COMIC FX STATE ENGINE
  window.vfx = {
    shake: 0,
    texts: [],
    cutIn: { active: false, timer: 0, text: '' },

    // Trigger hit impacts or full bursts
    trigger(type, x, y) {
      if (type === 'hit') {
        this.shake = 12;
        this.texts.push({ text: 'CHOONK!', x: x || 200, y: (y || 200) - 20, life: 25, color: '#FFD700' });
      } else if (type === 'burst') {
        this.shake = 26;
        this.cutIn = { active: true, timer: 30, text: 'ANCESTRAL RESONANCE!' };
        this.texts.push({ text: 'RUMBLE! SHATTER!', x: 250, y: 180, life: 40, color: '#FF3B30' });
      }
    },

    // Render screen shake before drawing world elements
    applyShake(ctx) {
      if (this.shake > 0) {
        ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
        this.shake *= 0.88;
        if (this.shake < 0.5) this.shake = 0;
      }
    },

    // Draw comic onomatopoeia and full-screen super cut-ins
    render(ctx, canvas, player) {
      // Draw Hero Sprite
      if (player && vAssets.loaded) {
        ctx.drawImage(vAssets.hero, player.x, player.y, player.width || 64, player.height || 64);
      }

      // Draw Action Onomatopoeia
      for (let i = this.texts.length - 1; i >= 0; i--) {
        let t = this.texts[i];
        ctx.save();
        ctx.font = '900 26px "Impact", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#000000';
        ctx.fillStyle = t.color;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
        t.y -= 1;
        if (--t.life <= 0) this.texts.splice(i, 1);
      }

      // Draw Cinematic Super Cut-In
      if (this.cutIn.active) {
        ctx.save();
        ctx.fillStyle = 'rgba(10, 15, 30, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Angled Comic Splash Bar
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 0.22);
        ctx.lineTo(canvas.width, canvas.height * 0.12);
        ctx.lineTo(canvas.width, canvas.height * 0.78);
        ctx.lineTo(0, canvas.height * 0.88);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Codex Portrait
        if (vAssets.loaded) {
          ctx.drawImage(vAssets.portrait, 24, canvas.height * 0.22, 130, 130);
        }

        // Action Text
        ctx.font = '900 30px "Impact", sans-serif';
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 6;
        ctx.strokeText(this.cutIn.text, 175, canvas.height * 0.52);
        ctx.fillText(this.cutIn.text, 175, canvas.height * 0.52);
        ctx.restore();

        if (--this.cutIn.timer <= 0) this.cutIn.active = false;
      }
    }
  };

  // 3. AUTO-ATTACH TO TOUCH BUTTONS
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('button').forEach(btn => {
      const label = btn.innerText.trim().toUpperCase();
      if (label.includes('BURST')) {
        btn.addEventListener('click', () => window.vfx.trigger('burst'));
      } else if (label.includes('ATK') || label.includes('BOW')) {
        btn.addEventListener('click', () => window.vfx.trigger('hit'));
      }
    });
  });
})();
</script>
