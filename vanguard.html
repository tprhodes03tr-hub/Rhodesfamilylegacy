<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ancestral Vanguard: The Siege of Detroit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      max-width: 520px;
      background: #0b1329;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.82rem;
      margin-bottom: 8px;
    }
    canvas {
      width: 100%;
      height: 280px;
      background: #020617;
      border-radius: 10px;
      border: 1px solid #334155;
      display: block;
    }
    .stage-title {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      color: #f59e0b;
      margin: 10px 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .hero-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.25;
    }
    .hero-btn.active {
      border-color: #38bdf8;
      color: #fff;
      background: #0284c7;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }
    .ctrl-btn {
      background: #334155;
      border: none;
      color: #fff;
      padding: 13px 2px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.74rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.atk { background: #0284c7; }
    .ctrl-btn.burst { background: #dc2626; }
    .ctrl-btn.aid { 
      background: linear-gradient(135deg, #ca8a04, #eab308); 
      color: #0f172a; 
      font-weight: 900;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <span id="score-display">SCORE: 771000</span>
      <span id="hero-hp-display" style="color: #4ade80;">HP: 100%</span>
      <span id="aid-cd" style="color: #facc15;">LUETTA: READY ✨</span>
      <span id="wave-display">WAVE [1/4]</span>
    </div>

    <canvas id="gameCanvas" width="500" height="280"></canvas>

    <div class="stage-title" id="stage-name">✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦</div>

    <!-- EXPANDED VANGUARD ROSTER -->
    <div class="roster-grid">
      <button class="hero-btn active" onclick="selectHero('Sundiata Prime', 'Sonic Djembe Boom', '#38bdf8', 'djembe')">
        Sundiata Prime<br><small>Sonic Djembe</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Delta Vanguard', 'Solar Shield Cleave', '#f59e0b', 'shield')">
        Delta Vanguard<br><small>Shield Cleave</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Aura Weaver', 'Azure Ley-Stream', '#06b6d4', 'weaver')">
        Aura Weaver<br><small>Azure Stream</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Pioneer Volley', 'Pierce Solar-Shot', '#10b981', 'arrow')">
        Pioneer Volley<br><small>Solar Arrow</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Shadow Kensei', 'Flash-Step Katana', '#e11d48', 'katana')">
        Shadow Kensei<br><small>Katana Slash</small>
      </button>
      <button class="hero-btn" onclick="selectHero('Prism Void', 'Dark Matter Prisms', '#a855f7', 'prism')">
        Prism Void<br><small>Void Prisms</small>
      </button>
    </div>

    <div class="controls-grid">
      <button class="ctrl-btn" id="btn-left">&#9664; LEFT</button>
      <button class="ctrl-btn" id="btn-right">RIGHT &#9654;</button>
      <button class="ctrl-btn" id="btn-jump">&#9650; JUMP</button>
      <button class="ctrl-btn atk" id="btn-atk">ATTACK</button>
      <button class="ctrl-btn burst" id="btn-burst">BURST</button>
      <button class="ctrl-btn aid" id="btn-aid">LUETTA AID</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      if (!audioCtx) initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'drum') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'slash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'burst') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'bell') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.start(now);
        osc.stop(now + 1.2);
      } else if (type === 'enemyZap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    let currentHero = { name: 'Sundiata Prime', move: 'Sonic Djembe Boom', color: '#38bdf8', type: 'djembe' };
    let score = 771000;
    let heroHp = 100;
    let invulnerableTimer = 0;
    let currentWave = 1;
    let luettaCooldown = 0;
    let walkAnim = 0;

    let allyAssist = { active: false, x: -60, y: 175, color: '#f59e0b' };

    const stages = [
      { name: "✦ STAGE 1: DETROIT HIGH ROOFTOPS ✦", sky1: "#0f172a", sky2: "#3b0764", ground: "#1e293b", type: "city" },
      { name: "✦ STAGE 2: WOODWARD CYBER BOULEVARD ✦", sky1: "#020617", sky2: "#0369a1", ground: "#0f172a", type: "street" },
      { name: "✦ STAGE 3: THE GREAT RIFT DESERT ✦", sky1: "#451a03", sky2: "#9a3412", ground: "#78350f", type: "rift" },
      { name: "✦ STAGE 4: CELESTIAL ANCESTRAL GATES ✦", sky1: "#020617", sky2: "#581c87", ground: "#312e81", type: "cosmos" }
    ];

    let player = {
      x: 60, y: 175, w: 34, h: 58,
      vx: 0, vy: 0, speed: 5.5,
      grounded: true, facing: 1
    };

    // THREE DIVERSE ENEMY ARCHETYPES: BRUTE, SKIMMER, NULLIFIER
    let enemies = [
      { type: 'skimmer', x: 320, y: 175, w: 28, h: 56, hp: 60, maxHp: 60, speed: 2.3, color: '#ef4444', atkCd: 0 },
      { type: 'brute', x: 420, y: 165, w: 42, h: 68, hp: 130, maxHp: 130, speed: 0.9, color: '#b91c1c', atkCd: 0 },
      { type: 'nullifier', x: 470, y: 155, w: 26, h: 54, hp: 50, maxHp: 50, speed: 0.6, color: '#a855f7', shootCd: 120 }
    ];

    let projectiles = [];
    let enemyProjectiles = [];
    let shockwaves = [];
    let particles = [];
    let shake = 0;

    function selectHero(name, move, color, type) {
      currentHero = { name, move, color, type };
      document.querySelectorAll('.hero-btn').forEach(b => {
        b.classList.toggle('active', b.innerText.includes(name));
      });
      playSound('laser');
      createGroundSparks(player.x + 16, player.y + 20, color, 14);
    }

    const keys = { left: false, right: false };
    const leftBtn = document.getElementById('btn-left');
    const rightBtn = document.getElementById('btn-right');

    const setL = (v) => { keys.left = v; if(v) initAudio(); };
    const setR = (v) => { keys.right = v; if(v) initAudio(); };

    leftBtn.addEventListener('mousedown', () => setL(true));
    leftBtn.addEventListener('mouseup', () => setL(false));
    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setL(true); });
    leftBtn.addEventListener('touchend', () => setL(false));

    rightBtn.addEventListener('mousedown', () => setR(true));
    rightBtn.addEventListener('mouseup', () => setR(false));
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setR(true); });
    rightBtn.addEventListener('touchend', () => setR(false));

    document.getElementById('btn-jump').addEventListener('click', () => {
      initAudio();
      if (player.grounded) {
        player.vy = -12.5;
        player.grounded = false;
        createGroundSparks(player.x + 16, player.y + player.h, '#94a3b8', 6);
      }
    });

    // HERO ATTACKS
    document.getElementById('btn-atk').addEventListener('click', () => {
      initAudio();

      if (currentHero.type === 'djembe') {
        playSound('drum');
        shake = 10;
        shockwaves.push({ x: player.x + 16, y: player.y + 28, r: 8, maxR: 160, color: currentHero.color });
        enemies.forEach(e => {
          if (Math.abs(e.x - player.x) < 160) {
            e.hp -= 35;
            e.x += (e.x > player.x ? 32 : -32);
            score += 2400;
          }
        });
      } else if (currentHero.type === 'arrow') {
        playSound('laser');
        projectiles.push({
          x: player.x + (player.facing === 1 ? 30 : -10),
          y: player.y + 24,
          vx: player.facing * 14,
          color: currentHero.color,
          type: 'arrow',
          pierce: true
        });
      } else if (currentHero.type === 'weaver') {
        playSound('laser');
        projectiles.push({
          x: player.x + 16,
          y: player.y + 15,
          vx: player.facing * 8,
          color: currentHero.color,
          type: 'weaver',
          life: 45
        });
      } else if (currentHero.type === 'katana') {
        playSound('slash');
        player.x += player.facing * 85;
        player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));
        shake = 8;
        enemies.forEach(e => {
          if (Math.abs(e.x - player.x) < 65) {
            e.hp -= 42;
            createGroundSparks(e.x + 16, e.y + 20, currentHero.color, 12);
            score += 2800;
          }
        });
      } else if (currentHero.type === 'shield') {
        playSound('hit');
        shake = 12;
        enemies.forEach(e => {
          if (Math.abs(e.x - player.x) < 70) {
            e.hp -= 45;
            e.x += player.facing * 50;
            createGroundSparks(e.x + 16, e.y + 20, currentHero.color, 14);
            score += 3000;
          }
        });
      } else if (currentHero.type === 'prism') {
        playSound('laser');
        for (let a = -0.3; a <= 0.3; a += 0.3) {
          projectiles.push({
            x: player.x + 16,
            y: player.y + 22,
            vx: player.facing * 10,
            vy: a * 4,
            color: currentHero.color,
            type: 'prism'
          });
        }
      }

      document.getElementById('score-display').innerText = 'SCORE: ' + score;
    });

    // BURST
    document.getElementById('btn-burst').addEventListener('click', () => {
      initAudio();
      playSound('burst');
      shake = 22;
      shockwaves.push({ x: player.x + 16, y: player.y + 28, r: 10, maxR: 260, color: currentHero.color });
      enemies.forEach(e => {
        e.hp -= 65;
        createGroundSparks(e.x + 16, e.y + 20, currentHero.color, 16);
      });
    });

    // LUETTA AID
    document.getElementById('btn-aid').addEventListener('click', () => {
      initAudio();
      if (luettaCooldown > 0) return;
      playSound('bell');
      luettaCooldown = 320;
      heroHp = Math.min(100, heroHp + 45);
      let hpElem = document.getElementById('hero-hp-display');
      hpElem.innerText = `HP: ${heroHp}%`;
      hpElem.style.color = '#4ade80';

      allyAssist.active = true;
      allyAssist.x = -40;
      shake = 14;
    });

    function createGroundSparks(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 16, color
        });
      }
    }

    function advanceWave() {
      currentWave = (currentWave % 4) + 1;
      document.getElementById('wave-display').innerText = `WAVE [${currentWave}/4]`;
      document.getElementById('stage-name').innerText = stages[currentWave - 1].name;
      heroHp = Math.min(100, heroHp + 30);
      document.getElementById('hero-hp-display').innerText = `HP: ${heroHp}%`;
      shake = 10;
    }

    function update() {
      if (invulnerableTimer > 0) invulnerableTimer--;

      if (luettaCooldown > 0) {
        luettaCooldown--;
        document.getElementById('aid-cd').innerText = `LUETTA: ${Math.ceil(luettaCooldown / 30)}s`;
        document.getElementById('aid-cd').style.color = '#94a3b8';
      } else {
        document.getElementById('aid-cd').innerText = `LUETTA: READY ✨`;
        document.getElementById('aid-cd').style.color = '#facc15';
      }

      if (keys.left) { player.vx = -player.speed; player.facing = -1; walkAnim += 0.3; }
      else if (keys.right) { player.vx = player.speed; player.facing = 1; walkAnim += 0.3; }
      else { player.vx *= 0.65; walkAnim = 0; }

      player.x += player.vx;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      player.y += player.vy;
      if (player.y < 175) {
        player.vy += 0.85;
      } else {
        player.y = 175;
        player.vy = 0;
        player.grounded = true;
      }

      // Player Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        if (p.vy) p.y += p.vy;

        enemies.forEach(e => {
          if (Math.hypot(p.x - (e.x + (e.w / 2)), p.y - (e.y + (e.h / 2))) < 28) {
            e.hp -= 28;
            playSound('hit');
            createGroundSparks(e.x + (e.w / 2), e.y + (e.h / 2), p.color, 8);
            if (!p.pierce) projectiles.splice(i, 1);
          }
        });

        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
      }

      // Enemy Projectiles (Ley-Nullifier Void Orbs)
      for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let ep = enemyProjectiles[i];
        ep.x += ep.vx;

        // Player collision
        if (Math.hypot(ep.x - (player.x + 16), ep.y - (player.y + 28)) < 24) {
          if (currentHero.type === 'shield') {
            // Delta Vanguard Shield deflects void orbs
            playSound('hit');
            ep.vx = -ep.vx * 1.5;
            ep.deflected = true;
          } else if (invulnerableTimer === 0) {
            heroHp -= 14;
            invulnerableTimer = 35;
            shake = 10;
            playSound('hit');
            enemyProjectiles.splice(i, 1);
            let hpElem = document.getElementById('hero-hp-display');
            hpElem.innerText = `HP: ${Math.max(0, heroHp)}%`;
            hpElem.style.color = heroHp > 40 ? '#4ade80' : '#ef4444';
          }
        }

        if (ep.x < 0 || ep.x > canvas.width) enemyProjectiles.splice(i, 1);
      }

      // Ally Assist
      if (allyAssist.active) {
        allyAssist.x += 8.5;
        if (allyAssist.x > canvas.width + 50) allyAssist.active = false;
        if (Math.random() < 0.28) {
          enemies.forEach(e => {
            e.hp -= 8;
            createGroundSparks(e.x + 16, e.y + 20, '#facc15', 6);
          });
        }
      }

      // ASYMMETRIC ENEMY AI & ABILITIES
      enemies.forEach(e => {
        if (e.hp > 0) {
          if (e.type === 'skimmer') {
            // Agile Dasher: rushes toward hero
            e.x += (player.x > e.x ? 1 : -1) * e.speed;
          } else if (e.type === 'brute') {
            // Heavy Tank: marches slowly forward
            e.x += (player.x > e.x ? 1 : -1) * e.speed;
          } else if (e.type === 'nullifier') {
            // Ranged Caster: keeps distance and fires void orbs
            if (Math.abs(e.x - player.x) < 180) {
              e.x += (e.x > player.x ? 1 : -1) * 1.2;
            }
            e.shootCd--;
            if (e.shootCd <= 0) {
              e.shootCd = 130;
              playSound('enemyZap');
              enemyProjectiles.push({
                x: e.x,
                y: e.y + 20,
                vx: (player.x < e.x ? -4.5 : 4.5),
                color: '#f43f5e'
              });
            }
          }

          // Melee collision
          let dist = Math.hypot((player.x + 16) - (e.x + (e.w / 2)), (player.y + 20) - (e.y + 20));
          if (dist < 34 && invulnerableTimer === 0) {
            let dmg = e.type === 'brute' ? 18 : 10;
            heroHp -= dmg;
            invulnerableTimer = 35;
            shake = 12;
            playSound('hit');
            player.vx = (player.x > e.x ? 6 : -6);
            createGroundSparks(player.x + 16, player.y + 25, '#ef4444', 10);
            
            let hpElem = document.getElementById('hero-hp-display');
            hpElem.innerText = `HP: ${Math.max(0, heroHp)}%`;
            hpElem.style.color = heroHp > 40 ? '#4ade80' : '#ef4444';

            if (heroHp <= 0) {
              heroHp = 100;
              player.x = 40;
              hpElem.innerText = `HP: 100%`;
              hpElem.style.color = '#4ade80';
            }
          }
        } else {
          e.x = canvas.width + 60;
          e.hp = e.maxHp;
          score += (e.type === 'brute' ? 6000 : 3500);
          document.getElementById('score-display').innerText = 'SCORE: ' + score;
          advanceWave();
        }
      });

      // Clear shockwaves & particles
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.r += 14;
        if (sw.r >= sw.maxR) shockwaves.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (--p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawDynamicStage() {
      let stg = stages[currentWave - 1];
      let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, stg.sky1);
      sky.addColorStop(0.8, stg.sky2);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (stg.type === "city" || stg.type === "street") {
        const towers = [
          { x: 15, w: 48, h: 140 }, { x: 70, w: 60, h: 190 },
          { x: 145, w: 50, h: 130 }, { x: 210, w: 75, h: 180 },
          { x: 300, w: 55, h: 150 }, { x: 375, w: 60, h: 200 }, { x: 450, w: 45, h: 120 }
        ];
        towers.forEach(t => {
          ctx.fillStyle = '#090d16';
          ctx.fillRect(t.x, canvas.height - 45 - t.h, t.w, t.h);
          ctx.fillStyle = 'rgba(245, 158, 11, 0.45)';
          for (let wy = canvas.height - 40 - t.h + 10; wy < canvas.height - 50; wy += 14) {
            for (let wx = t.x + 8; wx < t.x + t.w - 8; wx += 10) {
              if ((wx + wy) % 4 === 0) ctx.fillRect(wx, wy, 3, 5);
            }
          }
        });
      } else if (stg.type === "rift") {
        ctx.fillStyle = '#271005';
        ctx.beginPath();
        ctx.moveTo(30, 235); ctx.lineTo(70, 70); ctx.lineTo(120, 235);
        ctx.moveTo(340, 235); ctx.lineTo(390, 85); ctx.lineTo(460, 235);
        ctx.fill();
      } else if (stg.type === "cosmos") {
        ctx.fillStyle = '#fff';
        for (let s = 0; s < 30; s++) {
          ctx.fillRect((s * 41) % canvas.width, (s * 29) % 180, 2, 2);
        }
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(250, 90, 65, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = stg.ground;
      ctx.fillRect(0, 233, canvas.width, 47);
      ctx.fillStyle = currentHero.color;
      ctx.fillRect(0, 233, canvas.width, 2.5);
    }

    function drawHumanoidHero(x, y, hero) {
      ctx.save();
      if (invulnerableTimer > 0 && Math.floor(invulnerableTimer / 4) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }

      let legSwing = Math.sin(walkAnim) * 5;

      // Aura / Cape
      ctx.shadowColor = hero.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = hero.color;
      ctx.beginPath();
      ctx.moveTo(x + 16, y + 16);
      ctx.lineTo(x + (player.facing === 1 ? -12 : 32), y + 46);
      ctx.lineTo(x + 16, y + 40);
      ctx.closePath();
      ctx.fill();

      // Head
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(x + 16, y + 10, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hero.color;
      ctx.fillRect(x + (player.facing === 1 ? 18 : 8), y + 7, 6, 3);

      // Torso
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x + 9, y + 18, 14, 18);

      // Hero Gear
      if (hero.type === 'djembe') {
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.moveTo(x + (player.facing === 1 ? 20 : 4), y + 20);
        ctx.lineTo(x + (player.facing === 1 ? 28 : -4), y + 20);
        ctx.lineTo(x + (player.facing === 1 ? 24 : 0), y + 36);
        ctx.closePath();
        ctx.fill();
      } else if (hero.type === 'shield') {
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(x + (player.facing === 1 ? 24 : 4), y + 26, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (hero.type === 'arrow') {
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(x + (player.facing === 1 ? 24 : 4), y + 26, 10, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.stroke();
      } else {
        ctx.fillStyle = hero.color;
        ctx.fillRect(x + 13, y + 22, 6, 8);
      }

      // Legs
      ctx.fillStyle = '#020617';
      ctx.fillRect(x + 9, y + 36 + legSwing, 5, 20);
      ctx.fillRect(x + 18, y + 36 - legSwing, 5, 20);

      // Boots
      ctx.fillStyle = '#475569';
      ctx.fillRect(x + (player.facing === 1 ? 9 : 7), y + 52 + legSwing, 7, 6);
      ctx.fillRect(x + (player.facing === 1 ? 18 : 16), y + 52 - legSwing, 7, 6);
      ctx.restore();
    }

    // DISTINCT VISUAL SILHOUETTES FOR ENEMY ARCHETYPES
    function drawEnemy(e) {
      ctx.save();
      // HP Bar
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x, e.y - 12, e.w, 4);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(e.x, e.y - 12, (e.hp / e.maxHp) * e.w, 4);

      if (e.type === 'brute') {
        // Heavy Armored Brute: broad shoulders and dark steel plates
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(e.x, e.y + 14, e.w, 32);
        ctx.fillStyle = '#4338ca';
        ctx.fillRect(e.x + 4, e.y + 18, e.w - 8, 12);
        // Head / Horned Helmet
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(e.x + (e.w / 2), e.y + 8, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(e.x + 8, e.y + 6, e.w - 16, 3);
        // Heavy Stompers
        ctx.fillStyle = '#09090b';
        ctx.fillRect(e.x + 4, e.y + 46, 12, 22);
        ctx.fillRect(e.x + e.w - 16, e.y + 46, 12, 22);
      } else if (e.type === 'nullifier') {
        // Floating Ley-Nullifier Sorcerer: Purple Robes & Glowing Hands
        let floatBob = Math.sin(Date.now() * 0.006) * 4;
        ctx.fillStyle = '#581c87';
        ctx.beginPath();
        ctx.moveTo(e.x + 13, e.y + floatBob);
        ctx.lineTo(e.x, e.y + 48 + floatBob);
        ctx.lineTo(e.x + 26, e.y + 48 + floatBob);
        ctx.closePath();
        ctx.fill();
        // Cowl
        ctx.fillStyle = '#2e1065';
        ctx.beginPath();
        ctx.arc(e.x + 13, e.y + 6 + floatBob, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c084fc';
        ctx.fillRect(e.x + 8, e.y + 5 + floatBob, 10, 2.5);
      } else {
        // Void Skimmer: Sleek, red-eyed runner
        ctx.fillStyle = '#18181b';
        ctx.beginPath();
        ctx.arc(e.x + 14, e.y + 10, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(e.x + 7, e.y + 8, 12, 2.5);
        ctx.fillStyle = '#27272a';
        ctx.fillRect(e.x + 7, e.y + 18, 16, 18);
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(e.x + 12, e.y + 23, 6, 6);
        ctx.fillStyle = '#09090b';
        ctx.fillRect(e.x + 8, e.y + 36, 5, 20);
        ctx.fillRect(e.x + 16, e.y + 36, 5, 20);
      }
      ctx.restore();
    }

    function render() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85;
        if (shake < 0.5) shake = 0;
      }

      drawDynamicStage();

      enemies.forEach(e => {
        if (e.hp > 0) drawEnemy(e);
      });

      drawHumanoidHero(player.x, player.y, currentHero);

      // Draw Void Orbs from Enemies
      enemyProjectiles.forEach(ep => {
        ctx.save();
        ctx.fillStyle = ep.color;
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(ep.x, ep.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Player Projectiles
      projectiles.forEach(p => {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        if (p.type === 'arrow') {
          ctx.fillRect(p.x, p.y, 22, 3);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // Ally Assist
      if (allyAssist.active) {
        drawHumanoidHero(allyAssist.x, allyAssist.y, { color: allyAssist.color });
        ctx.save();
        ctx.fillStyle = '#fde047';
        ctx.font = '800 12px sans-serif';
        ctx.fillText('LUETTA SUMMON!', allyAssist.x - 10, allyAssist.y - 10);
        ctx.restore();
      }

      // Shockwaves
      shockwaves.forEach(sw => {
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = sw.color;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      // Sparks
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
