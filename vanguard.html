<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guardians of RenCen</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030814;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }
    #hud {
      width: 100%;
      max-width: 480px;
      padding: 10px 14px;
      background: #091322;
      border-bottom: 2px solid #142847;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .hud-title { color: #38bdf8; }
    .hud-zone { color: #f59e0b; }
    .hud-stats { color: #e2e8f0; }
    .bar-container {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 80%;
      background: linear-gradient(90deg, #10b981, #34d399);
    }
    #game-canvas {
      width: 100%;
      max-width: 480px;
      height: 38vh;
      background: #000;
      display: block;
    }
    #controls-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      background: #060d1a;
      border-top: 1px solid #1e293b;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    button {
      background: #0f1f38;
      border: 1px solid #234273;
      border-radius: 6px;
      color: #cbd5e1;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
    }
    button:active {
      filter: brightness(1.3);
      transform: scale(0.98);
    }
    button span {
      font-size: 8.5px;
      font-weight: 400;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn-active {
      border-color: #f59e0b;
      background: #241a05;
      color: #fbbf24;
    }
    .btn-active span { color: #fcd34d; }
    .btn-action {
      background: #1e293b;
      border-color: #334155;
    }
    .btn-special {
      border-color: #7c3aed;
      color: #c084fc;
    }
    .btn-full {
      grid-column: span 3;
      background: #450a0a;
      border-color: #dc2626;
      color: #fca5a5;
      padding: 8px;
    }
    .btn-double {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-row">
      <span class="hud-title" id="hud-hero">HERO: MARCUS</span>
      <span class="hud-zone">ZONE: RenCen Rooftop</span>
      <span class="hud-stats" id="hud-hp">HP: 120/120</span>
    </div>
    <div class="bar-container">
      <div class="bar-fill" id="hp-bar"></div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="controls-container">
    <button class="btn-active" id="btn-marcus" onclick="selectHero('MARCUS')">
      MARCUS<span>Earth & Rhythm</span>
    </button>
    <button id="btn-sky" onclick="selectHero('SKY_RANGER')">
      SKY RANGER<span>Arrow Barrage</span>
    </button>
    <button id="btn-aura" onclick="selectHero('AURA_WEAVER')">
      AURA WEAVER<span>Hydro Katana</span>
    </button>

    <button onclick="movePlayer(-1)">◀ LEFT</button>
    <button class="btn-action" onclick="castStrike1()">
      <strong id="label-str1">STRIKE 1</strong><span id="sub-str1">Seismic Punch</span>
    </button>
    <button onclick="movePlayer(1)">RIGHT ▶</button>

    <button class="btn-action" onclick="jumpPlayer()">NINJA JUMP<span>Evasive Hop</span></button>
    <button class="btn-action" onclick="castStrike2()">
      <strong id="label-str2">STRIKE 2</strong><span id="sub-str2">Ground Lightning</span>
    </button>
    <button class="btn-special" onclick="castSpecialPower()">
      SPECIAL POWER<span>Tsunami Surge</span>
    </button>

    <button class="btn-full" onclick="castOverdrive()">
      ★ OVERDRIVE BATTLE CLASH ★<span>Full Elemental Shockwave</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // GAME STATE & HERO PROFILES
    let activeHero = 'MARCUS';
    const SPRITE_SCALE = 0.72; // Scaled down ~28%
    const groundOffset = 28;

    const player = {
      x: 120,
      y: 0,
      baseY: 0,
      vy: 0,
      facing: 1,
      isJumping: false,
      hp: 120,
      maxHp: 120
    };

    const partner = {
      x: 80,
      y: 0,
      type: 'SKY_RANGER'
    };

    // Responsive Enemies
    const enemies = [
      { x: 300, y: 0, hp: 60, maxHp: 60, isStunned: false, stunTimer: 0 },
      { x: 380, y: 0, hp: 80, maxHp: 80, isStunned: false, stunTimer: 0 }
    ];

    // VFX ENGINE (Lightning, Tsunami, Storm Rain, Screen Shake)
    const VFX = {
      shake: 0,
      rainDrops: [],
      lightnings: [],
      tsunamis: [],

      initRain(count = 50) {
        this.rainDrops = [];
        for (let i = 0; i < count; i++) {
          this.rainDrops.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: 12 + Math.random() * 8,
            len: 12 + Math.random() * 10
          });
        }
      },

      castGroundLightning(originX, groundY, direction = 1) {
        this.shake = 7;
        this.lightnings.push({
          x: originX,
          groundY: groundY,
          dir: direction,
          reach: 0,
          maxReach: 280,
          life: 20
        });
      },

      castTsunami(originX, groundY, direction = 1) {
        this.shake = 12;
        if (this.rainDrops.length === 0) this.initRain(55);
        this.tsunamis.push({
          x: originX,
          groundY: groundY,
          dir: direction,
          width: 44,
          height: 65,
          speed: 8,
          life: 42
        });
      },

      updateAndDraw(ctx, w, h) {
        // Screen Shake
        if (this.shake > 0) {
          const offsetX = (Math.random() - 0.5) * this.shake;
          const offsetY = (Math.random() - 0.5) * this.shake;
          ctx.translate(offsetX, offsetY);
          this.shake *= 0.88;
          if (this.shake < 0.5) this.shake = 0;
        }

        // Tsunami Weather / Rain
        if (this.rainDrops.length > 0) {
          ctx.save();
          ctx.strokeStyle = 'rgba(160, 225, 255, 0.4)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          for (let r of this.rainDrops) {
            ctx.moveTo(r.x, r.y);
            ctx.lineTo(r.x - 2, r.y + r.len);
            r.y += r.speed;
            r.x -= 1;
            if (r.y > h) {
              r.y = -10;
              r.x = Math.random() * w;
            }
          }
          ctx.stroke();
          ctx.restore();
        }

        // Floor-Crawling Lightning Surge
        for (let i = this.lightnings.length - 1; i >= 0; i--) {
          const bolt = this.lightnings[i];
          bolt.reach = Math.min(bolt.maxReach, bolt.reach + 24);
          bolt.life--;

          ctx.save();
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
          ctx.strokeStyle = '#e0f2fe';
          ctx.lineWidth = 2.5;

          let currX = bolt.x;
          let currY = bolt.groundY;
          ctx.beginPath();
          ctx.moveTo(currX, currY);

          const segments = 12;
          const step = (bolt.reach * bolt.dir) / segments;
          for (let s = 0; s < segments; s++) {
            currX += step;
            currY = bolt.groundY + (Math.random() * 10 - 5);
            ctx.lineTo(currX, currY);
          }
          ctx.stroke();

          // Electrocution & Spark Stun
          enemies.forEach(e => {
            const inPath = bolt.dir > 0 
              ? (e.x >= bolt.x && e.x <= bolt.x + bolt.reach)
              : (e.x <= bolt.x && e.x >= bolt.x - bolt.reach);
            if (inPath && Math.abs(e.y - bolt.groundY) < 30) {
              e.isStunned = true;
              e.stunTimer = 25;
              e.hp -= 0.6;
              ctx.fillStyle = '#fef08a';
              ctx.fillRect(e.x + (Math.random() * 14 - 7), e.y - 30 + (Math.random() * 25), 3, 3);
            }
          });
          ctx.restore();

          if (bolt.life <= 0) this.lightnings.splice(i, 1);
        }

        // Tsunami Wave Surge
        for (let i = this.tsunamis.length - 1; i >= 0; i--) {
          const wave = this.tsunamis[i];
          wave.x += wave.speed * wave.dir;
          wave.life--;

          ctx.save();
          ctx.shadowColor = '#00e5ff';
          ctx.shadowBlur = 16;

          const grad = ctx.createLinearGradient(wave.x, wave.groundY - wave.height, wave.x, wave.groundY);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          grad.addColorStop(0.3, 'rgba(0, 229, 255, 0.7)');
          grad.addColorStop(1, 'rgba(3, 105, 161, 0.2)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(wave.x - 20 * wave.dir, wave.groundY);
          ctx.quadraticCurveTo(
            wave.x, wave.groundY - wave.height * 1.25, 
            wave.x + (wave.width * wave.dir), wave.groundY
          );
          ctx.fill();

          // Crest Foam
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(wave.x + (wave.width * 0.5 * wave.dir), wave.groundY - wave.height * 0.7, 12, Math.PI, 0, wave.dir < 0);
          ctx.stroke();

          // Wave Push & Knockback
          enemies.forEach(e => {
            if (Math.abs(e.x - wave.x) < 40) {
              e.x += 5.5 * wave.dir;
              e.hp -= 0.8;
            }
          });
          ctx.restore();

          if (wave.life <= 0) this.tsunamis.splice(i, 1);
        }
      }
    };

    // SPRITE RENDERING
    function drawDetailedHero(ctx, x, y, type, scale, facing = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale * facing, scale);

      const skin = '#5c3826';
      const gold = '#eab308';

      if (type === 'MARCUS') {
        // Djembe Drum slung on back
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.moveTo(-16, -34);
        ctx.lineTo(-6, -34);
        ctx.lineTo(-9, -16);
        ctx.lineTo(-13, -16);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(-16, -36, 10, 3); // Drum head

        // Torso / Cuirass
        ctx.fillStyle = skin;
        ctx.fillRect(-8, -44, 16, 20);
        ctx.fillStyle = gold;
        ctx.fillRect(-9, -46, 18, 4); // Collar

        // Crimson Warrior Kilt
        ctx.fillStyle = '#831843';
        ctx.fillRect(-8, -24, 16, 10);
        ctx.fillStyle = gold;
        ctx.fillRect(-4, -24, 8, 4); // Buckle

        // Greaves
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-7, -14, 5, 14);
        ctx.fillRect(2, -14, 5, 14);

        // Head & Beard
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(0, -52, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-7, -59, 14, 6); // Short crop
        ctx.fillRect(-4, -48, 8, 3);  // Trimmed beard

        // Glowing Golden Power Fist
        ctx.save();
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(7, -36, 8, 10);
        ctx.restore();

      } else if (type === 'SKY_RANGER') {
        // Blue Infiltrator Suit
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(-7, -44, 14, 22);
        ctx.fillStyle = gold;
        ctx.fillRect(-7, -34, 14, 3); // Belt

        // Greaves
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-6, -22, 5, 22);
        ctx.fillRect(1, -22, 5, 22);

        // Head
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(0, -51, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#020617';
        ctx.fillRect(-6, -58, 12, 6);

        // Arc Recurve Bow on Back
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(-8, -32, 14, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();

      } else if (type === 'AURA_WEAVER') {
        // Hydro Robe & Katana Armor
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-7, -42, 14, 20);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-8, -30, 16, 4);

        // Legs
        ctx.fillStyle = '#0c4a6e';
        ctx.fillRect(-6, -22, 5, 22);
        ctx.fillRect(1, -22, 5, 22);

        // Long Hair & Head
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(0, -50, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#020617';
        ctx.fillRect(-8, -57, 16, 7);
        ctx.fillRect(-9, -52, 4, 14); // Flowing lock

        // Hydro Katana Blade
        ctx.save();
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(8, -25);
        ctx.lineTo(24, -40);
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    // ENEMY DRAWING
    function drawEnemies(groundY) {
      enemies.forEach(e => {
        e.y = groundY;
        ctx.save();
        ctx.translate(e.x, e.y);

        // Electric Stun Effect
        if (e.isStunned) {
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-10, -50, 20, 50);
          e.stunTimer--;
          if (e.stunTimer <= 0) e.isStunned = false;
        }

        // Stick/Cyber Silhouette
        ctx.strokeStyle = e.isStunned ? '#fef08a' : '#ef4444';
        ctx.lineWidth = 3;
        // Head
        ctx.beginPath();
        ctx.arc(0, -42, 6, 0, Math.PI * 2);
        ctx.stroke();
        // Body
        ctx.beginPath();
        ctx.moveTo(0, -36);
        ctx.lineTo(0, -18);
        // Legs
        ctx.lineTo(-7, 0);
        ctx.moveTo(0, -18);
        ctx.lineTo(7, 0);
        // Arms
        ctx.moveTo(-10, -28);
        ctx.lineTo(10, -28);
        ctx.stroke();

        // Mini HP Bar
        ctx.fillStyle = '#334155';
        ctx.fillRect(-12, -54, 24, 4);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-12, -54, (Math.max(0, e.hp) / e.maxHp) * 24, 4);

        ctx.restore();
      });
    }

    // BACKGROUND SKYLINE & ROOFTOP
    function drawBackground(w, h, groundY) {
      // RenCen Skyline Columns
      const buildings = [
        { x: w * 0.05, w: 42, h: h * 0.58 },
        { x: w * 0.20, w: 46, h: h * 0.72 },
        { x: w * 0.40, w: 60, h: h * 0.88 }, // Center tower
        { x: w * 0.62, w: 48, h: h * 0.74 },
        { x: w * 0.82, w: 40, h: h * 0.52 }
      ];

      buildings.forEach(b => {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
        ctx.strokeStyle = '#1e293b';
        ctx.strokeRect(b.x, groundY - b.h, b.w, b.h);

        // Windows
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        for (let wy = groundY - b.h + 8; wy < groundY - 10; wy += 14) {
          ctx.fillRect(b.x + 8, wy, b.w - 16, 2);
        }
      });

      // Helipad Ground Line
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(w, groundY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Yellow Helipad Target
      ctx.strokeStyle = 'rgba(234, 179, 8, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(w * 0.5, groundY + 12, 50, 8, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // MAIN GAME LOOP
    function loop() {
      const w = canvas.width;
      const h = canvas.height;
      const groundY = h - groundOffset;
      player.baseY = groundY;

      // Handle Jump Arc
      if (player.isJumping) {
        player.y += player.vy;
        player.vy += 0.98; // Gravity
        if (player.y >= groundY) {
          player.y = groundY;
          player.vy = 0;
          player.isJumping = false;
        }
      } else {
        player.y = groundY;
      }
      partner.y = groundY;

      ctx.save();
      ctx.clearRect(0, 0, w, h);

      // 1. Draw World
      drawBackground(w, h, groundY);

      // 2. VFX (Lightning, Wave, Rain, Shake)
      VFX.updateAndDraw(ctx, w, h);

      // 3. Draw Active Duo & Enemies
      drawDetailedHero(ctx, partner.x, partner.y, partner.type, SPRITE_SCALE, 1);
      drawDetailedHero(ctx, player.x, player.y, activeHero, SPRITE_SCALE, player.facing);
      drawEnemies(groundY);

      ctx.restore();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // CONTROLS & POWER TRIGGERS
    function selectHero(hero) {
      activeHero = hero;
      partner.type = (hero === 'MARCUS') ? 'SKY_RANGER' : 'MARCUS';
      
      document.querySelectorAll('#controls-container button').forEach(b => b.classList.remove('btn-active'));
      if (hero === 'MARCUS') document.getElementById('btn-marcus').classList.add('btn-active');
      if (hero === 'SKY_RANGER') document.getElementById('btn-sky').classList.add('btn-active');
      if (hero === 'AURA_WEAVER') document.getElementById('btn-aura').classList.add('btn-active');

      document.getElementById('hud-hero').innerText = `HERO: ${hero}`;
    }

    function movePlayer(dir) {
      player.facing = dir;
      player.x = Math.max(40, Math.min(canvas.width - 40, player.x + dir * 16));
      partner.x = player.x - (dir * 36);
    }

    function jumpPlayer() {
      if (!player.isJumping) {
        player.vy = -12;
        player.isJumping = true;
      }
    }

    function castStrike1() {
      // Golden Seismic Pulse
      VFX.shake = 4;
      enemies.forEach(e => {
        if (Math.abs(e.x - player.x) < 70) {
          e.hp -= 15;
          e.x += player.facing * 18;
        }
      });
    }

    function castStrike2() {
      // Floor-Crawling Lightning Surge
      VFX.castGroundLightning(player.x, player.baseY, player.facing);
    }

    function castSpecialPower() {
      // Aura Weaver Tsunami & Rain
      VFX.castTsunami(player.x, player.baseY, player.facing);
    }

    function castOverdrive() {
      // Full Clash: Wave + Dual Lightning + Heavy Shake
      VFX.castTsunami(player.x, player.baseY, player.facing);
      VFX.castGroundLightning(player.x, player.baseY, 1);
      VFX.castGroundLightning(player.x, player.baseY, -1);
      VFX.shake = 18;
    }
  </script>
</body>
</html>
